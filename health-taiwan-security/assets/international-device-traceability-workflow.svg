<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備可追溯性事件流程</title><desc id="desc">設備從到貨建檔、元件關聯、部署核對、變更留證到事件查詢及退役關閉的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#172143"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="38" font-weight="800">以事件驅動維持追溯資料</text><text x="70" y="116" fill="#9fb3d9" font-size="20">資料建立後仍需隨部署、更新、維修與退役持續改變</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><path d="M185 300H1015" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)" opacity=".7"/><g transform="translate(55 205)"><rect width="170" height="190" rx="24" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="85" y="48" fill="#63e6ff" font-size="20" text-anchor="middle" font-weight="800">01</text><text x="85" y="86" fill="#fff" font-size="24" text-anchor="middle" font-weight="800">到貨建檔</text><text x="85" y="126" fill="#c6d4eb" font-size="18" text-anchor="middle">識別與採購</text><text x="85" y="156" fill="#c6d4eb" font-size="18" text-anchor="middle">驗收關聯</text></g><g transform="translate(240 205)"><rect width="170" height="190" rx="24" fill="#13284a" stroke="#8fa8ff" stroke-width="2"/><text x="85" y="48" fill="#b6c4ff" font-size="20" text-anchor="middle" font-weight="800">02</text><text x="85" y="86" fill="#fff" font-size="24" text-anchor="middle" font-weight="800">元件關聯</text><text x="85" y="126" fill="#c6d4eb" font-size="18" text-anchor="middle">SBOM 來源</text><text x="85" y="156" fill="#c6d4eb" font-size="18" text-anchor="middle">版本與聲明</text></g><g transform="translate(425 205)"><rect width="170" height="190" rx="24" fill="#172849" stroke="#a997ff" stroke-width="2"/><text x="85" y="48" fill="#c7baff" font-size="20" text-anchor="middle" font-weight="800">03</text><text x="85" y="86" fill="#fff" font-size="24" text-anchor="middle" font-weight="800">部署核對</text><text x="85" y="126" fill="#c6d4eb" font-size="18" text-anchor="middle">位置與介接</text><text x="85" y="156" fill="#c6d4eb" font-size="18" text-anchor="middle">臨床用途</text></g><g transform="translate(610 205)"><rect width="170" height="190" rx="24" fill="#102d3b" stroke="#57f0c1" stroke-width="2"/><text x="85" y="48" fill="#76f6d0" font-size="20" text-anchor="middle" font-weight="800">04</text><text x="85" y="86" fill="#fff" font-size="24" text-anchor="middle" font-weight="800">變更留證</text><text x="85" y="126" fill="#c6d4eb" font-size="18" text-anchor="middle">更新與維修</text><text x="85" y="156" fill="#c6d4eb" font-size="18" text-anchor="middle">核准與結果</text></g><g transform="translate(795 205)"><rect width="170" height="190" rx="24" fill="#3a2e42" stroke="#ffb37a" stroke-width="2"/><text x="85" y="48" fill="#ffc99e" font-size="20" text-anchor="middle" font-weight="800">05</text><text x="85" y="86" fill="#fff" font-size="24" text-anchor="middle" font-weight="800">事件查詢</text><text x="85" y="126" fill="#c6d4eb" font-size="18" text-anchor="middle">漏洞／批次</text><text x="85" y="156" fill="#c6d4eb" font-size="18" text-anchor="middle">反查與分流</text></g><g transform="translate(980 205)"><rect width="170" height="190" rx="24" fill="#3d2934" stroke="#ff829e" stroke-width="2"/><text x="85" y="48" fill="#ff9fb2" font-size="20" text-anchor="middle" font-weight="800">06</text><text x="85" y="86" fill="#fff" font-size="24" text-anchor="middle" font-weight="800">退役關閉</text><text x="85" y="126" fill="#c6d4eb" font-size="18" text-anchor="middle">撤權與清除</text><text x="85" y="156" fill="#c6d4eb" font-size="18" text-anchor="middle">證據封存</text></g></g><g><rect x="70" y="465" width="330" height="120" rx="22" fill="#0c1d34" stroke="#63e6ff" stroke-width="2"/><text x="235" y="507" fill="#63e6ff" font-size="22" font-weight="800" text-anchor="middle">觸發條件</text><text x="235" y="545" fill="#e6eefc" font-size="20" text-anchor="middle">到貨、部署、更新、維修</text><text x="235" y="574" fill="#e6eefc" font-size="20" text-anchor="middle">漏洞、召回、移轉、退役</text><rect x="435" y="465" width="330" height="120" rx="22" fill="#0c1d34" stroke="#a997ff" stroke-width="2"/><text x="600" y="507" fill="#c7baff" font-size="22" font-weight="800" text-anchor="middle">驗收證據</text><text x="600" y="545" fill="#e6eefc" font-size="20" text-anchor="middle">來源、時間、核准、結果</text><text x="600" y="574" fill="#e6eefc" font-size="20" text-anchor="middle">實際版本與例外期限</text><rect x="800" y="465" width="330" height="120" rx="22" fill="#0c1d34" stroke="#57f0c1" stroke-width="2"/><text x="965" y="507" fill="#76f6d0" font-size="22" font-weight="800" text-anchor="middle">成效指標</text><text x="965" y="545" fill="#e6eefc" font-size="20" text-anchor="middle">限定時間內反查完整率</text><text x="965" y="574" fill="#e6eefc" font-size="20" text-anchor="middle">變更後基線重驗率</text></g><text x="600" y="656" fill="#9fb3d9" font-size="19" text-anchor="middle">年度盤點只能校正；事件觸發才是維持資料可信的主流程</text></svg>