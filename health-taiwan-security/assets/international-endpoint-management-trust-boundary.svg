<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療端點管理平面的信任邊界</title><desc id="desc">管理者透過隔離管理工作站與強驗證進入端點管理平台，平台再對臨床、行政及行動設備下達高影響指令，所有動作另送不可變更稽核紀錄。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17234b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="64" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">端點管理平台是高衝擊管理平面</text><text x="600" y="103" text-anchor="middle" fill="#9fb3d9" font-size="20">能同時推送組態、應用程式、憑證、鎖定與清除指令，防護強度應高於一般使用者系統</text>
<rect x="60" y="184" width="265" height="190" rx="28" fill="#102c4b" stroke="#4f7fab" stroke-width="3"/><text x="193" y="229" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">管理者入口</text><g fill="#c6d4eb" font-size="20"><text x="92" y="274">隔離管理工作站</text><text x="92" y="312">抗釣魚 MFA</text><text x="92" y="350">JIT／雙人覆核</text></g>
<path d="M325 279H438" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="455" y="151" width="300" height="300" rx="32" fill="#123b60" stroke="#63e6ff" stroke-width="4"/><text x="605" y="205" text-anchor="middle" fill="#8fe8ff" font-size="28" font-weight="700">端點管理平台</text><g fill="#e8f5ff" font-size="21" text-anchor="middle"><text x="605" y="258">裝置註冊與合規</text><text x="605" y="305">組態／應用程式推送</text><text x="605" y="352">憑證／密鑰管理</text><text x="605" y="399">鎖定／清除／退場</text></g>
<g stroke="#a997ff" stroke-width="4" marker-end="url(#a)"><path d="M755 218H862"/><path d="M755 301H862"/><path d="M755 384H862"/></g><g fill="#292852" stroke="#a997ff" stroke-width="2"><rect x="880" y="171" width="260" height="94" rx="20"/><rect x="880" y="279" width="260" height="94" rx="20"/><rect x="880" y="387" width="260" height="94" rx="20"/></g><g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="1010" y="228">臨床工作站</text><text x="1010" y="336">行政與遠距端點</text><text x="1010" y="444">平板／行動裝置</text></g>
<path d="M605 451V525" stroke="#57f0c1" stroke-width="5" marker-end="url(#a)"/><rect x="338" y="548" width="534" height="104" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="3"/><text x="605" y="590" text-anchor="middle" fill="#9ff9df" font-size="25" font-weight="700">獨立稽核與復原證據</text><text x="605" y="626" text-anchor="middle" fill="#d7f5ea" font-size="19">管理員事件、批次範圍、核准、指令結果、失敗裝置與回退紀錄</text></g></svg>
