<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 980" role="img" aria-labelledby="title desc">
  <title id="title">醫療系統硬化與設定漂移流程手機版</title><desc id="desc">服務盤點、基線設計、隔離測試、核准部署、漂移偵測與驗證關閉六階段流程。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102343"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#69defd"/></marker></defs><rect width="390" height="980" rx="24" fill="url(#bg)"/>
  <text x="24" y="44" fill="#f5f8ff" font-size="22" font-weight="700">六階段硬化生命週期</text><text x="24" y="72" fill="#9eb7d8" font-size="15">設定符合後仍要完成臨床驗收。</text>
  <g font-family="sans-serif">
    <g transform="translate(24 100)"><rect width="342" height="115" rx="20" fill="#11314c" stroke="#63e6ff" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#63e6ff"/><text x="34" y="41" text-anchor="middle" fill="#071426" font-size="18" font-weight="700">1</text><text x="66" y="39" fill="#fff" font-size="18" font-weight="700">服務與資產盤點</text><text x="20" y="82" fill="#b8cbe5" font-size="16">用途、版本、依賴、責任人</text></g><path d="M195 218V243" stroke="#69defd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 253)"><rect width="342" height="115" rx="20" fill="#1a2952" stroke="#aa98ff" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#aa98ff"/><text x="34" y="41" text-anchor="middle" fill="#071426" font-size="18" font-weight="700">2</text><text x="66" y="39" fill="#fff" font-size="18" font-weight="700">基線與例外設計</text><text x="20" y="82" fill="#c7c1e8" font-size="16">控制值、補償措施、到期日</text></g><path d="M195 371V396" stroke="#69defd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 406)"><rect width="342" height="115" rx="20" fill="#123b3d" stroke="#57f0c1" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#57f0c1"/><text x="34" y="41" text-anchor="middle" fill="#071426" font-size="18" font-weight="700">3</text><text x="66" y="39" fill="#fff" font-size="18" font-weight="700">隔離測試</text><text x="20" y="82" fill="#bae5db" font-size="16">安全、效能、介接、臨床回歸</text></g><path d="M195 524V549" stroke="#69defd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 559)"><rect width="342" height="115" rx="20" fill="#432b43" stroke="#ff9bc2" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#ff9bc2"/><text x="34" y="41" text-anchor="middle" fill="#071426" font-size="18" font-weight="700">4</text><text x="66" y="39" fill="#fff" font-size="18" font-weight="700">核准與分批部署</text><text x="20" y="82" fill="#e9c2d3" font-size="16">窗口、監測、停止與回退條件</text></g><path d="M195 677V702" stroke="#69defd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 712)"><rect width="342" height="115" rx="20" fill="#3b3420" stroke="#ffd166" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#ffd166"/><text x="34" y="41" text-anchor="middle" fill="#071426" font-size="18" font-weight="700">5</text><text x="66" y="39" fill="#fff" font-size="18" font-weight="700">漂移偵測與分流</text><text x="20" y="82" fill="#e8ddb4" font-size="16">差異、來源、風險、修正期限</text></g><path d="M195 830V855" stroke="#69defd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 865)"><rect width="342" height="90" rx="20" fill="#17394c" stroke="#72ddff" stroke-width="2"/><circle cx="34" cy="34" r="20" fill="#72ddff"/><text x="34" y="41" text-anchor="middle" fill="#071426" font-size="18" font-weight="700">6</text><text x="66" y="39" fill="#fff" font-size="18" font-weight="700">修正與驗證關閉</text><text x="20" y="72" fill="#bdd9e6" font-size="15">復原、複測、臨床簽核與證據</text></g>
  </g>
</svg>
