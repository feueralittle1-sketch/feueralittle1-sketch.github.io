<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧事件風險控制手機圖</title><desc id="desc">五種失敗模式分別對應事件分類、人工智慧遙測、分級控制、證據保護及供應商契約接口。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient></defs><rect width="800" height="1180" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="400" y="60" fill="#fff" text-anchor="middle" font-size="30" font-weight="700">醫療 AI 事件的五個治理閘門</text><g font-size="19"><g><rect x="60" y="105" width="680" height="180" rx="24" fill="#18283f" stroke="#63e6ff"/><text x="100" y="150" fill="#ffb1b1" font-weight="700">風險｜只查入侵，漏掉臨床傷害</text><text x="100" y="195" fill="#dcecff">控制｜攻擊、失效、誤用與混合事件分類</text><text x="100" y="240" fill="#57f0c1">證據｜事件分級、權責與處置紀錄</text></g><g><rect x="60" y="305" width="680" height="180" rx="24" fill="#18283f" stroke="#63e6ff"/><text x="100" y="350" fill="#ffb1b1" font-weight="700">風險｜只有網路日誌，沒有模型軌跡</text><text x="100" y="395" fill="#dcecff">控制｜最小必要 AI 遙測與版本清冊</text><text x="100" y="440" fill="#57f0c1">證據｜可查詢、可關聯的事件時間線</text></g><g><rect x="60" y="505" width="680" height="180" rx="24" fill="#18283f" stroke="#63e6ff"/><text x="100" y="550" fill="#ffb1b1" font-weight="700">風險｜全面停機造成臨床中斷</text><text x="100" y="595" fill="#dcecff">控制｜依權限、工具與用途分級隔離</text><text x="100" y="640" fill="#57f0c1">證據｜撤權、降級與回退演練</text></g><g><rect x="60" y="705" width="680" height="180" rx="24" fill="#18283f" stroke="#63e6ff"/><text x="100" y="750" fill="#ffb1b1" font-weight="700">風險｜證據保存擴大個資暴露</text><text x="100" y="795" fill="#dcecff">控制｜最小化、遮罩、分權與保存期限</text><text x="100" y="840" fill="#57f0c1">證據｜存取、匯出與銷毀紀錄</text></g><g><rect x="60" y="905" width="680" height="180" rx="24" fill="#18283f" stroke="#63e6ff"/><text x="100" y="950" fill="#ffb1b1" font-weight="700">風險｜供應商握有證據卻無回應義務</text><text x="100" y="995" fill="#dcecff">控制｜通知、證據、撤權與回退條款</text><text x="100" y="1040" fill="#57f0c1">證據｜聯合演練與交付測試</text></g></g><text x="400" y="1135" fill="#9fb3d9" text-anchor="middle" font-size="18">同時維持病人安全、事件可見性與臨床持續運作。</text></g></svg>