<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療影子 AI 的風險、控制與驗收證據矩陣</title>
<desc id="desc">矩陣將敏感資料外流、個人帳號失控、外掛擴權、內容誤用與工具快速變更五類風險，分別對應資料阻擋、企業身分、連接器白名單、人工覆核、變更複核及可驗證證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/>
<g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">風險不靠政策口號關閉：每項控制都要留下證據</text><text x="60" y="108" fill="#a8bad8" font-size="20">同時檢查資料、身分、連接器、輸出使用與服務變更</text>
<rect x="55" y="150" width="1090" height="470" rx="24" fill="#101f35" stroke="#526985"/><path d="M330 150V620M740 150V620" stroke="#526985" stroke-width="2"/><g font-size="19" font-weight="700"><text x="85" y="195" fill="#ffb5cc">風險</text><text x="365" y="195" fill="#8fe8ff">控制</text><text x="775" y="195" fill="#8bf7d8">驗收證據</text></g>
<g font-size="18"><text x="85" y="255" fill="#fff">敏感資料外流</text><text x="365" y="255" fill="#d6e3f5">資料分級＋輸入阻擋＋去識別</text><text x="775" y="255" fill="#d6e3f5">測試樣本遭阻擋；例外具名核准</text><text x="85" y="335" fill="#fff">個人帳號失控</text><text x="365" y="335" fill="#d6e3f5">企業 SSO＋生命週期＋禁止分享</text><text x="775" y="335" fill="#d6e3f5">離職撤權完成；共享連結失效</text><text x="85" y="415" fill="#fff">外掛與連接器擴權</text><text x="365" y="415" fill="#d6e3f5">白名單＋最小範圍＋短效權杖</text><text x="775" y="415" fill="#d6e3f5">未核准連接器拒絕；呼叫可追溯</text><text x="85" y="495" fill="#fff">錯誤內容進入照護</text><text x="365" y="495" fill="#d6e3f5">用途限制＋來源標示＋人工覆核</text><text x="775" y="495" fill="#d6e3f5">高影響輸出不得自動寫回</text><text x="85" y="575" fill="#fff">服務條款快速改變</text><text x="365" y="575" fill="#d6e3f5">版本監測＋定期重評＋退出方案</text><text x="775" y="575" fill="#d6e3f5">變更紀錄、資料匯出與刪除測試</text></g>
<path d="M55 215H1145M55 295H1145M55 375H1145M55 455H1145M55 535H1145" stroke="#334861" stroke-width="2"/><text x="600" y="675" text-anchor="middle" fill="#b9c9e3" font-size="18">控制通過後仍需持續監測；新模型、新外掛或新資料類型都會改變風險</text></g></svg>
