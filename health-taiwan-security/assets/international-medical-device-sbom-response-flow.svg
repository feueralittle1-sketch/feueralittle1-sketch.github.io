<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療設備 SBOM 弱點處置流程</title>
  <desc id="desc">由設備與 SBOM 正規化開始，關聯弱點後經 VEX、暴露面和臨床影響判定，再選擇更新、補償控制、監測或退場並複驗。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08172d"/><stop offset="1" stop-color="#111d3c"/></linearGradient><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="70" y="72" fill="#f4f8ff" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="700">一筆 CVE 不等於一台設備必須立即停用</text><text x="70" y="110" fill="#9fb3d9" font-family="Noto Sans TC, sans-serif" font-size="20">處置順序同時考慮可利用性、暴露面、臨床後果與替代方案</text>
  <g font-family="Noto Sans TC, sans-serif" text-anchor="middle"><g transform="translate(70 165)"><rect width="250" height="105" rx="22" fill="#133052" stroke="#63e6ff" stroke-width="3"/><text x="125" y="45" fill="#63e6ff" font-size="24" font-weight="700">1 清冊正規化</text><text x="125" y="77" fill="#d8e7fb" font-size="18">設備、版本、SBOM 對齊</text></g><path d="M335 218h92" stroke="#63e6ff" stroke-width="5" marker-end="url(#arr)"/><g transform="translate(440 165)"><rect width="250" height="105" rx="22" fill="#133052" stroke="#71a7ff" stroke-width="3"/><text x="125" y="45" fill="#8fc0ff" font-size="24" font-weight="700">2 關聯弱點</text><text x="125" y="77" fill="#d8e7fb" font-size="18">CVE、公告、供應商通知</text></g><path d="M705 218h92" stroke="#63e6ff" stroke-width="5" marker-end="url(#arr)"/><g transform="translate(810 165)"><rect width="320" height="105" rx="22" fill="#133052" stroke="#9c8cff" stroke-width="3"/><text x="160" y="45" fill="#b7aaff" font-size="24" font-weight="700">3 情境判定</text><text x="160" y="77" fill="#d8e7fb" font-size="18">VEX＋暴露面＋臨床影響</text></g>
  <path d="M970 285v55" stroke="#63e6ff" stroke-width="5" marker-end="url(#arr)"/><g transform="translate(355 355)"><rect width="690" height="115" rx="25" fill="#102842" stroke="#57f0c1" stroke-width="3"/><text x="345" y="43" fill="#72f2cb" font-size="25" font-weight="700">4 核准處置</text><text x="345" y="80" fill="#d8e7fb" font-size="20">更新／隔離／網路限制／加強監測／接受風險／退場</text></g><path d="M700 485v55" stroke="#63e6ff" stroke-width="5" marker-end="url(#arr)"/><g transform="translate(355 555)"><rect width="690" height="105" rx="25" fill="#102842" stroke="#f6c75d" stroke-width="3"/><text x="345" y="43" fill="#ffd978" font-size="25" font-weight="700">5 複驗與留證</text><text x="345" y="78" fill="#d8e7fb" font-size="19">功能安全、弱點狀態、網路控制、責任人、期限與回復方案</text></g>
  <path d="M340 608H205V412h130" fill="none" stroke="#7185a8" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arr)"/><text x="145" y="505" fill="#9fb3d9" font-size="18" transform="rotate(-90 145 505)">持續更新設備與元件狀態</text></g>
</svg>
