<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 940" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資料加密與等效控制邊界</title><desc id="desc">醫療資料與舊系統經治理判定後，優先採加密；暫時無法加密時，使用有期限、可驗收的等效替代控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#122750"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3z" fill="#63e6ff"/></marker></defs><rect width="390" height="940" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="22" y="43" fill="#fff" font-size="22" font-weight="800">醫療加密控制鏈</text><text x="22" y="72" fill="#abc0df" font-size="15">加密優先，例外必須有期限與證據</text><text x="22" y="110" fill="#63e6ff" font-size="15" font-weight="700">資料與服務</text><g fill="#122d47" stroke-width="1.3"><rect x="22" y="126" width="165" height="58" rx="14" stroke="#63e6ff"/><rect x="203" y="126" width="165" height="58" rx="14" stroke="#82a9ff"/><rect x="22" y="199" width="165" height="58" rx="14" stroke="#c99cff"/><rect x="203" y="199" width="165" height="58" rx="14" stroke="#5ce1b9"/></g><g fill="#fff" font-size="15" font-weight="700"><text x="41" y="160">病歷與資料庫</text><text x="222" y="160">介接與連線</text><text x="41" y="233">備份與媒體</text><text x="222" y="233">設備與舊系統</text></g><path d="M195 270V310" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="320" width="346" height="276" rx="22" fill="#0d2038" stroke="#55779d"/><text x="45" y="359" fill="#fff" font-size="20" font-weight="800">治理判定閘門</text><g fill="#c8d8eb" font-size="16"><text x="45" y="400">01　敏感度與保存期間</text><text x="45" y="440">02　外部曝險與可攜性</text><text x="45" y="480">03　臨床中斷與效能限制</text><text x="45" y="520">04　金鑰、復原與權限分離</text><text x="45" y="560">05　例外期限與驗收證據</text></g><path d="M195 608V648" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="658" width="346" height="100" rx="20" fill="#113d49" stroke="#57f0c1"/><text x="45" y="697" fill="#fff" font-size="19" font-weight="800">優先路徑：加密</text><text x="45" y="729" fill="#c9f5e7" font-size="15">金鑰分離、復原測試、覆蓋證據</text><rect x="22" y="776" width="346" height="122" rx="20" fill="#3d2944" stroke="#ffb86b"/><text x="45" y="815" fill="#fff" font-size="19" font-weight="800">受控例外：等效措施</text><text x="45" y="847" fill="#f7d7bf" font-size="15">限制存取、隔離、監測、實體保護</text><text x="45" y="874" fill="#f7d7bf" font-size="15">指定責任人、期限與重驗</text><text x="22" y="925" fill="#bdefff" font-size="14">輸出：覆蓋率｜例外登錄｜復原與重驗證據</text></g></svg>