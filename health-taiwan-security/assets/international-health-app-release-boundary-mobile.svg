<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">個人健康 App 病歷交付信任邊界手機版</title><desc id="desc">病人請求經醫院治理閘門後交付外部應用程式，交付證據另行保存。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17264a"/></linearGradient></defs><rect width="720" height="1200" fill="url(#bg)"/><text x="50" y="65" fill="#f8fbff" font-size="30" font-weight="800">病歷交付外部 App 的信任邊界</text><text x="50" y="105" fill="#9fb3d9" font-size="18">控制交付，不把外部 App 視為院內系統</text><rect x="50" y="155" width="620" height="190" rx="28" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="360" y="210" text-anchor="middle" fill="#63e6ff" font-size="27" font-weight="800">病人請求</text><text x="90" y="265" fill="#e6eefc" font-size="22">確認本人／代理關係與選定接收 App</text><text x="90" y="305" fill="#9fb3d9" font-size="19">請求不是空白授權，仍需確認範圍</text><path d="M360 345V405" stroke="#63e6ff" stroke-width="5"/><rect x="50" y="405" width="620" height="330" rx="28" fill="#172b48" stroke="#a997ff" stroke-width="3"/><text x="360" y="460" text-anchor="middle" fill="#d8d1ff" font-size="27" font-weight="800">醫院交付治理閘門</text><text x="90" y="520" fill="#e6eefc" font-size="22">① 身分與代理關係</text><text x="90" y="570" fill="#e6eefc" font-size="22">② 資料範圍與格式</text><text x="90" y="620" fill="#e6eefc" font-size="22">③ App／端點目的地</text><text x="90" y="670" fill="#e6eefc" font-size="22">④ 告知、傳輸與稽核</text><path d="M360 735V795" stroke="#63e6ff" stroke-width="5"/><rect x="50" y="795" width="620" height="170" rx="28" fill="#26304c" stroke="#f2c94c" stroke-width="3"/><text x="360" y="850" text-anchor="middle" fill="#ffe58a" font-size="27" font-weight="800">病人選定的外部 App</text><text x="90" y="905" fill="#e6eefc" font-size="21">後續資料使用、分享與事件義務另依角色判定</text><rect x="50" y="1015" width="620" height="125" rx="24" fill="#10363a" stroke="#57f0c1" stroke-width="3"/><text x="360" y="1062" text-anchor="middle" fill="#7ff5d2" font-size="24" font-weight="800">獨立證據面</text><text x="360" y="1104" text-anchor="middle" fill="#d7fdf1" font-size="19">請求人、範圍、目的地、結果與例外</text></svg>