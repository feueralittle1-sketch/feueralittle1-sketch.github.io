<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">病人數位身分錢包風險與控制對照</title><desc id="desc">偽造憑證、過度揭露、錯誤病人配對、裝置遺失與帳號復原攻擊對應的醫院控制及驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#19264b"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="58" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">風險、控制與證據必須同時存在</text><text x="600" y="94" text-anchor="middle" fill="#9fb3d9" font-size="19">通過格式驗證，不代表已完成病人安全與帳號治理</text><g font-size="18"><rect x="45" y="130" width="1110" height="70" rx="18" fill="#132843" stroke="#63e6ff" stroke-width="2"/><text x="75" y="173" fill="#8fe8ff" font-size="21" font-weight="800">風險情境</text><text x="350" y="173" fill="#8fe8ff" font-size="21" font-weight="800">必要控制</text><text x="820" y="173" fill="#8fe8ff" font-size="21" font-weight="800">可驗收證據</text>
<g><rect x="45" y="215" width="1110" height="72" rx="16" fill="#10213d"/><text x="75" y="258" fill="#ff9db7" font-weight="700">偽造或失效憑證</text><text x="350" y="258" fill="#e6eefc">信任清冊、簽章與狀態檢查、防重播</text><text x="820" y="258" fill="#d8f7ff">測試向量、拒絕紀錄、狀態查詢時間</text></g><g><rect x="45" y="300" width="1110" height="72" rx="16" fill="#172b4d"/><text x="75" y="343" fill="#ffcf99" font-weight="700">過度揭露身分資料</text><text x="350" y="343" fill="#e6eefc">目的綁定、最小欄位、使用者同意</text><text x="820" y="343" fill="#d8f7ff">欄位對照表、同意紀錄、資料留存期限</text></g><g><rect x="45" y="385" width="1110" height="72" rx="16" fill="#10213d"/><text x="75" y="428" fill="#c5baff" font-weight="700">錯誤病人配對</text><text x="350" y="428" fill="#e6eefc">多欄位比對、衝突暫停、人工覆核</text><text x="820" y="428" fill="#d8f7ff">錯配率、重複病歷率、覆核軌跡</text></g><g><rect x="45" y="470" width="1110" height="72" rx="16" fill="#172b4d"/><text x="75" y="513" fill="#57f0c1" font-weight="700">裝置遺失或轉手</text><text x="350" y="513" fill="#e6eefc">裝置解鎖、短效會話、遠端撤銷與再綁定</text><text x="820" y="513" fill="#d8f7ff">撤銷時效、舊裝置阻擋、換機測試</text></g><g><rect x="45" y="555" width="1110" height="72" rx="16" fill="#10213d"/><text x="75" y="598" fill="#63e6ff" font-weight="700">復原流程遭社交工程</text><text x="350" y="598" fill="#e6eefc">獨立驗證、冷卻期、通知與高風險再確認</text><text x="820" y="598" fill="#d8f7ff">復原工單、原帳號通知、敏感操作攔截</text></g></g></g></svg>
