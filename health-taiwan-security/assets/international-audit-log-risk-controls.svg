<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">醫療稽核紀錄風險與控制</title><desc id="desc">時間漂移、紀錄缺口、過度蒐集與管理者竄改四項風險，分別對應時間監測、緩衝告警、資料最小化及權限分離。</desc><rect width="1200" height="620" fill="#08172c"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">四種失真風險，四組可驗收控制</text><g font-family="sans-serif"><g><rect x="55" y="130" width="510" height="92" rx="18" fill="#421f38" stroke="#ff7bd5" stroke-width="3"/><rect x="635" y="130" width="510" height="92" rx="18" fill="#123449" stroke="#5ef2b0" stroke-width="3"/><rect x="55" y="250" width="510" height="92" rx="18" fill="#421f38" stroke="#ff7bd5" stroke-width="3"/><rect x="635" y="250" width="510" height="92" rx="18" fill="#123449" stroke="#5ef2b0" stroke-width="3"/><rect x="55" y="370" width="510" height="92" rx="18" fill="#421f38" stroke="#ff7bd5" stroke-width="3"/><rect x="635" y="370" width="510" height="92" rx="18" fill="#123449" stroke="#5ef2b0" stroke-width="3"/><rect x="55" y="490" width="510" height="92" rx="18" fill="#421f38" stroke="#ff7bd5" stroke-width="3"/><rect x="635" y="490" width="510" height="92" rx="18" fill="#123449" stroke="#5ef2b0" stroke-width="3"/></g><g fill="#fff" font-size="24" font-weight="700"><text x="90" y="185">時間漂移：事件順序錯置</text><text x="670" y="185">共同時源＋偏差監測＋時區欄位</text><text x="90" y="305">紀錄缺口：平台中斷即失明</text><text x="670" y="305">來源緩衝＋遺失告警＋覆蓋率測試</text><text x="90" y="425">過度蒐集：敏感資料擴散</text><text x="670" y="425">目的限制＋欄位最小化＋遮罩</text><text x="90" y="545">管理者竄改：證據不可信</text><text x="670" y="545">權限分離＋不可變保存＋完整性驗證</text></g></g></svg>