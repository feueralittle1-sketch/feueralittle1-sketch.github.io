<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備風險登錄證據鏈</title><desc id="desc">設備情境、威脅可利用性、臨床傷害與治理輸出形成可追溯風險登錄。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="980" rx="28" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">醫療設備風險登錄證據鏈</text><text x="38" y="96" fill="#9fb7d5" font-size="18">不能只留下單一分數</text><rect x="45" y="135" width="630" height="145" rx="22" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="72" y="182" fill="#ffffff" font-size="22" font-weight="800">1　設備與用途</text><text x="72" y="220" fill="#d8e5f7" font-size="18">版本、連線、臨床工作流與暴露範圍</text><text x="72" y="252" fill="#9fc4e8" font-size="16">先確認實際情境，避免套用錯誤分數</text><rect x="45" y="305" width="630" height="145" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="72" y="352" fill="#ffffff" font-size="22" font-weight="800">2　威脅與可利用性</text><text x="72" y="390" fill="#d8e5f7" font-size="18">攻擊路徑、前置條件、已知利用與重現</text><text x="72" y="422" fill="#9fc4e8" font-size="16">保留證據來源與不確定性</text><rect x="45" y="475" width="630" height="145" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="72" y="522" fill="#ffffff" font-size="22" font-weight="800">3　臨床傷害</text><text x="72" y="560" fill="#d8e5f7" font-size="18">安全性、有效性、病人範圍與替代能力</text><text x="72" y="592" fill="#ffd08a" font-size="16">納入最壞合理情境與降級限制</text><rect x="45" y="645" width="630" height="145" rx="22" fill="#342657" stroke="#b6a6ff" stroke-width="2"/><text x="72" y="692" fill="#ffffff" font-size="22" font-weight="800">4　治理輸出</text><text x="72" y="730" fill="#d8e5f7" font-size="18">控制、處置期限、權責人與重驗觸發</text><text x="72" y="762" fill="#c9bdff" font-size="16">剩餘風險必須可到期、可追溯</text><rect x="45" y="825" width="630" height="100" rx="22" fill="#102f48" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="868" fill="#ffffff" font-size="20" font-weight="800">接受風險 ≠ 關閉問題</text><text x="72" y="901" fill="#d8e5f7" font-size="17">變更、已知利用或臨床事件都要重新評估</text></g></svg>