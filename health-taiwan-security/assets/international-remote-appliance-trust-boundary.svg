<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">遠端支援設備遭入侵後的信任邊界</title><desc id="desc">網際網路連到遠端支援設備，再經受控會話進入臨床與管理區；設備日誌、會話事件與身分紀錄同步送往獨立證據面。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="36" font-weight="800">遠端支援設備不是一般入口，而是高權限信任樞紐</text><text x="60" y="112" fill="#9fb7db" font-size="22">設備若遭完全控制，風險會沿既有維護關係進入身分、端點與臨床服務。</text>
<rect x="60" y="180" width="220" height="150" rx="26" fill="#132b50" stroke="#63e6ff" stroke-width="3"/><text x="170" y="235" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="700">外部網路</text><text x="170" y="276" text-anchor="middle" fill="#d9e8ff" font-size="21">供應商／攻擊者</text><text x="170" y="306" text-anchor="middle" fill="#d9e8ff" font-size="21">公開服務面</text>
<path d="M280 255 H410" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs>
<rect x="410" y="155" width="310" height="200" rx="28" fill="#2b2459" stroke="#b69cff" stroke-width="4" filter="url(#glow)"/><text x="565" y="213" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">遠端支援設備</text><text x="565" y="254" text-anchor="middle" fill="#e7ddff" font-size="21">會話代理・檔案交換</text><text x="565" y="287" text-anchor="middle" fill="#e7ddff" font-size="21">特權憑證・路由與組態</text><rect x="468" y="309" width="194" height="30" rx="15" fill="#ff6b8a"/><text x="565" y="331" text-anchor="middle" fill="#190714" font-size="17" font-weight="800">遭入侵時視為不可信</text>
<path d="M720 215 H850" stroke="#b69cff" stroke-width="6" marker-end="url(#b)"/><path d="M720 300 H850" stroke="#b69cff" stroke-width="6" marker-end="url(#b)"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b69cff"/></marker></defs>
<rect x="850" y="150" width="290" height="120" rx="24" fill="#123c45" stroke="#57f0c1" stroke-width="3"/><text x="995" y="203" text-anchor="middle" fill="#57f0c1" font-size="25" font-weight="700">臨床服務區</text><text x="995" y="239" text-anchor="middle" fill="#dcfff5" font-size="20">設備・工作站・應用系統</text>
<rect x="850" y="292" width="290" height="120" rx="24" fill="#40263b" stroke="#ff8fb3" stroke-width="3"/><text x="995" y="345" text-anchor="middle" fill="#ffb5cc" font-size="25" font-weight="700">管理與身分區</text><text x="995" y="381" text-anchor="middle" fill="#ffe3ed" font-size="20">目錄・特權帳號・金鑰</text>
<rect x="130" y="500" width="940" height="140" rx="28" fill="#0d203a" stroke="#7ba7ff" stroke-width="3"/><text x="180" y="548" fill="#8fb7ff" font-size="25" font-weight="800">獨立證據面</text><text x="180" y="590" fill="#d7e5ff" font-size="21">近即時送出：設備系統日誌、會話事件、身分驗證、網路流量、管理變更與端點告警</text><text x="180" y="620" fill="#9fb7db" font-size="19">目的：即使設備內部日誌遭刪除，仍能重建時間線、判定橫向移動並支持可信重建。</text><path d="M565 355 V500" stroke="#7ba7ff" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#c)"/><defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7ba7ff"/></marker></defs>
</svg>