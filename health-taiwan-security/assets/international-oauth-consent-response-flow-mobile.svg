<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc"><title id="title">手機版 OAuth 同意釣魚防護與事件處置流程</title><desc id="desc">垂直呈現授權申請、政策判定、核准放行、持續監測與撤權復原五個階段。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0 0L10 0L5 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1420" rx="28" fill="url(#bg)"/><text x="44" y="68" fill="#fff" font-size="34" font-weight="800">OAuth 同意釣魚</text><text x="44" y="110" fill="#63e6ff" font-size="34" font-weight="800">防護與撤權復原</text><text x="44" y="150" fill="#9fb3d9" font-size="20">同意前管入口，同意後持續看行為</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><path d="M93 235V1045" stroke="#63e6ff" stroke-width="5"/><g><circle cx="93" cy="260" r="31" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="93" y="269" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">1</text><rect x="150" y="205" width="518" height="135" rx="22" fill="#112a47" stroke="#63e6ff" stroke-width="2"/><text x="184" y="253" fill="#fff" font-size="25" font-weight="800">提出授權</text><text x="184" y="294" fill="#c6d4eb" font-size="20">應用、發行者、用途與要求權限</text></g><g><circle cx="93" cy="445" r="31" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="93" y="454" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">2</text><rect x="150" y="390" width="518" height="135" rx="22" fill="#112a47" stroke="#63e6ff" stroke-width="2"/><text x="184" y="438" fill="#fff" font-size="25" font-weight="800">政策判定</text><text x="184" y="479" fill="#c6d4eb" font-size="20">低風險可否同意，高風險轉送審</text></g><g><circle cx="93" cy="630" r="31" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="93" y="639" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">3</text><rect x="150" y="575" width="518" height="135" rx="22" fill="#112a47" stroke="#63e6ff" stroke-width="2"/><text x="184" y="623" fill="#fff" font-size="25" font-weight="800">核准放行</text><text x="184" y="664" fill="#c6d4eb" font-size="20">最小權限、擁有者、期限與證據</text></g><g><circle cx="93" cy="815" r="31" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="93" y="824" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">4</text><rect x="150" y="760" width="518" height="135" rx="22" fill="#112a47" stroke="#63e6ff" stroke-width="2"/><text x="184" y="808" fill="#fff" font-size="25" font-weight="800">持續監測</text><text x="184" y="849" fill="#c6d4eb" font-size="20">新權限、異常 API、大量下載與寄信</text></g><g><circle cx="93" cy="1000" r="31" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="93" y="1009" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">5</text><rect x="150" y="945" width="518" height="135" rx="22" fill="#112a47" stroke="#63e6ff" stroke-width="2"/><text x="184" y="993" fill="#fff" font-size="25" font-weight="800">撤權復原</text><text x="184" y="1034" fill="#c6d4eb" font-size="20">停用應用、撤銷權杖、通知與回查</text></g><rect x="52" y="1140" width="616" height="205" rx="24" fill="#172340" stroke="#a997ff" stroke-width="2"/><text x="360" y="1190" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">三條事件證據</text><text x="86" y="1235" fill="#c6d4eb" font-size="20">• 同意與核准紀錄</text><text x="86" y="1275" fill="#c6d4eb" font-size="20">• 應用實際讀寫行為</text><text x="86" y="1315" fill="#c6d4eb" font-size="20">• 撤權、通知與復原結果</text><text x="360" y="1380" text-anchor="middle" fill="#57f0c1" font-size="19" font-weight="700">演練須確認沒有殘留權杖</text></g></svg>