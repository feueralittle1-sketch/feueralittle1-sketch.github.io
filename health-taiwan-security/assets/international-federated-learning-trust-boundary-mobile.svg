<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版跨院聯邦學習信任邊界</title><desc id="desc">醫院本地訓練、聯邦協調平台、全域模型與獨立證據面形成四層治理邊界。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="57" fill="#f7fbff" font-size="28" font-weight="800">聯邦學習仍有四層信任邊界</text><text x="38" y="96" fill="#9fb7d5" font-size="18">資料留在院內，只解決部分風險</text><rect x="50" y="135" width="620" height="205" rx="24" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="82" y="181" fill="#63e6ff" font-size="24" font-weight="800">醫院本地訓練</text><text x="82" y="224" fill="#e6eefc" font-size="19">資料用途核准 · 最小化 · 存取隔離</text><text x="82" y="266" fill="#e6eefc" font-size="19">更新剪裁 · 差分隱私 · 本地日誌</text><text x="82" y="307" fill="#9fb7d5" font-size="17">只輸出受控模型更新，不輸出原始資料</text><path d="M360 340v42" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="50" y="395" width="620" height="235" rx="24" fill="#19443e" stroke="#57f0c1" stroke-width="3"/><text x="82" y="442" fill="#72f5cd" font-size="24" font-weight="800">聯邦協調平台</text><text x="82" y="485" fill="#e6eefc" font-size="19">參與者身分與限時授權</text><text x="82" y="526" fill="#e6eefc" font-size="19">更新簽章、加密、異常與投毒檢查</text><text x="82" y="567" fill="#e6eefc" font-size="19">安全聚合、版本鎖定與管理面隔離</text><text x="82" y="606" fill="#baf7e4" font-size="17">高價值控制面不可與訓練節點共用權限</text><path d="M360 630v42" stroke="#72f5cd" stroke-width="5" marker-end="url(#arrow)"/><rect x="50" y="686" width="620" height="165" rx="24" fill="#4a3420" stroke="#ffbf69" stroke-width="3"/><text x="82" y="733" fill="#ffd08a" font-size="24" font-weight="800">全域模型</text><text x="82" y="776" fill="#fff1dc" font-size="19">效能、公平性、臨床用途與版本重驗</text><text x="82" y="817" fill="#fff1dc" font-size="19">異常時停止聚合、撤回與回退</text><rect x="50" y="884" width="620" height="145" rx="24" fill="#112e4d" stroke="#8fe8ff" stroke-width="2"/><text x="82" y="929" fill="#8fe8ff" font-size="23" font-weight="800">獨立證據面</text><text x="82" y="971" fill="#e6eefc" font-size="18">身分 · 隱私參數 · 更新雜湊 · 聚合版本</text><text x="82" y="1009" fill="#e6eefc" font-size="18">異常事件 · 撤權 · 回退與臨床放行</text></g></svg>
