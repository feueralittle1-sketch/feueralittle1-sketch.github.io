<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">網路存取控制平台風險、控制與證據對照</title><desc id="desc">將管理介面曝險、根權限失陷、政策錯誤與修補中斷，對應隔離、可信重建、政策差異檢查及臨床連線測試。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">關閉風險要同時留下技術與臨床證據</text><text x="58" y="108" fill="#a9bfdf" font-size="20">「更新成功」只代表軟體狀態，不能取代入侵分流、政策驗證與連線驗收</text>
<text x="180" y="165" text-anchor="middle" fill="#ff9fc1" font-size="24" font-weight="700">失敗模式</text><text x="600" y="165" text-anchor="middle" fill="#69e7ff" font-size="24" font-weight="700">必要控制</text><text x="1010" y="165" text-anchor="middle" fill="#7ff3cf" font-size="24" font-weight="700">驗收證據</text>
<g font-size="19"><rect x="55" y="195" width="300" height="100" rx="20" fill="#301d35" stroke="#ff7da9"/><text x="80" y="237" fill="#fff" font-weight="700">管理 API 對外可達</text><text x="80" y="270" fill="#d7c3d0">未授權請求進入控制面</text><rect x="450" y="195" width="300" height="100" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="475" y="237" fill="#fff" font-weight="700">iACL 與隔離跳板</text><text x="475" y="270" fill="#c3d9e7">只允許必要管理與控制流量</text><rect x="845" y="195" width="300" height="100" rx="20" fill="#133328" stroke="#5aefbe"/><text x="870" y="237" fill="#fff" font-weight="700">曝險與規則快照</text><text x="870" y="270" fill="#c6eadc">外部掃描、ACL 與來源紀錄</text>
<rect x="55" y="320" width="300" height="100" rx="20" fill="#301d35" stroke="#ff7da9"/><text x="80" y="362" fill="#fff" font-weight="700">根權限掩蓋本機足跡</text><text x="80" y="395" fill="#d7c3d0">本機日誌不足以證明乾淨</text><rect x="450" y="320" width="300" height="100" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="475" y="362" fill="#fff" font-weight="700">主機外遙測與可信重建</text><text x="475" y="395" fill="#c3d9e7">跨防火牆、認證與流量核對</text><rect x="845" y="320" width="300" height="100" rx="20" fill="#133328" stroke="#5aefbe"/><text x="870" y="362" fill="#fff" font-weight="700">映像來源與雜湊紀錄</text><text x="870" y="395" fill="#c6eadc">重建、輪替與節點比對結果</text>
<rect x="55" y="445" width="300" height="100" rx="20" fill="#301d35" stroke="#ff7da9"/><text x="80" y="487" fill="#fff" font-weight="700">政策遭竄改或複寫不一致</text><text x="80" y="520" fill="#d7c3d0">錯放或錯擋臨床連線</text><rect x="450" y="445" width="300" height="100" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="475" y="487" fill="#fff" font-weight="700">核准基線與規則差異</text><text x="475" y="520" fill="#c3d9e7">逐節點檢查高影響政策</text><rect x="845" y="445" width="300" height="100" rx="20" fill="#133328" stroke="#5aefbe"/><text x="870" y="487" fill="#fff" font-weight="700">政策版本與四類測試</text><text x="870" y="520" fill="#c6eadc">人員、設備、訪客、廠商</text>
<rect x="55" y="570" width="300" height="100" rx="20" fill="#301d35" stroke="#ff7da9"/><text x="80" y="612" fill="#fff" font-weight="700">全面更新造成認證中斷</text><text x="80" y="645" fill="#d7c3d0">合法人員或設備無法連線</text><rect x="450" y="570" width="300" height="100" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="475" y="612" fill="#fff" font-weight="700">備援節點與分批恢復</text><text x="475" y="645" fill="#c3d9e7">每批皆有停止及回復條件</text><rect x="845" y="570" width="300" height="100" rx="20" fill="#133328" stroke="#5aefbe"/><text x="870" y="612" fill="#fff" font-weight="700">認證成功率與臨床簽核</text><text x="870" y="645" fill="#c6eadc">服務窗口、告警與回復結果</text></g></g></svg>
