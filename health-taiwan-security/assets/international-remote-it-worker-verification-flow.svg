<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療遠端技術人員身分與存取驗證流程</title><desc id="desc">流程由職務分級、獨立身分核驗、隔離技術測試、受管裝置交付與最小權限開始，並持續監測異常，最後完成權限與設備回收。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11274a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">遠端人員驗證不是報到一次，而是權限全生命週期</text><text x="58" y="108" fill="#a9bfdf" font-size="20">高風險職務要讓身分、裝置、工作內容與存取紀錄可以互相驗證</text>
<g text-anchor="middle"><rect x="45" y="175" width="165" height="130" rx="21" fill="#132b50" stroke="#8fa8ff" stroke-width="3"/><text x="128" y="223" fill="#c6d1ff" font-size="20" font-weight="700">1 職務分級</text><text x="128" y="262" fill="#dce8f8" font-size="16">資料與權限上限</text>
<rect x="235" y="175" width="165" height="130" rx="21" fill="#132b50" stroke="#ff7da9" stroke-width="3"/><text x="318" y="223" fill="#ff9fc1" font-size="20" font-weight="700">2 身分複核</text><text x="318" y="262" fill="#dce8f8" font-size="16">獨立管道交叉確認</text>
<rect x="425" y="175" width="165" height="130" rx="21" fill="#132b50" stroke="#ffbd69" stroke-width="3"/><text x="508" y="223" fill="#ffcf8c" font-size="20" font-weight="700">3 沙箱測試</text><text x="508" y="262" fill="#dce8f8" font-size="16">合成資料與短效憑證</text>
<rect x="615" y="175" width="165" height="130" rx="21" fill="#132b50" stroke="#69e7ff" stroke-width="3"/><text x="698" y="223" fill="#69e7ff" font-size="20" font-weight="700">4 受管裝置</text><text x="698" y="262" fill="#dce8f8" font-size="16">加密、EDR、裝置綁定</text>
<rect x="805" y="175" width="165" height="130" rx="21" fill="#132b50" stroke="#5aefbe" stroke-width="3"/><text x="888" y="223" fill="#7ff3cf" font-size="20" font-weight="700">5 最小權限</text><text x="888" y="262" fill="#dce8f8" font-size="16">時限、專案、環境隔離</text>
<rect x="995" y="175" width="160" height="130" rx="21" fill="#132b50" stroke="#69e7ff" stroke-width="3"/><text x="1075" y="223" fill="#69e7ff" font-size="20" font-weight="700">6 持續監測</text><text x="1075" y="262" fill="#dce8f8" font-size="16">地點、會話、程式碼</text></g>
<g stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"><path d="M210 240H225"/><path d="M400 240H415"/><path d="M590 240H605"/><path d="M780 240H795"/><path d="M970 240H985"/></g>
<rect x="85" y="425" width="300" height="160" rx="24" fill="#0c203b" stroke="#ff7da9" stroke-width="3"/><text x="235" y="475" text-anchor="middle" fill="#ff9fc1" font-size="23" font-weight="700">異常分流</text><text x="235" y="518" text-anchor="middle" fill="#dce8f8" font-size="18">凍結會話與高風險權限</text><text x="235" y="554" text-anchor="middle" fill="#a9bfdf" font-size="17">保全端點、身分與程式碼證據</text>
<rect x="450" y="425" width="300" height="160" rx="24" fill="#0c203b" stroke="#ffbd69" stroke-width="3"/><text x="600" y="475" text-anchor="middle" fill="#ffcf8c" font-size="23" font-weight="700">定期再驗證</text><text x="600" y="518" text-anchor="middle" fill="#dce8f8" font-size="18">職務、地點、設備與必要權限</text><text x="600" y="554" text-anchor="middle" fill="#a9bfdf" font-size="17">例外必須有期限與核准人</text>
<rect x="815" y="425" width="300" height="160" rx="24" fill="#0c203b" stroke="#5aefbe" stroke-width="3"/><text x="965" y="475" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">離職與契約終止</text><text x="965" y="518" text-anchor="middle" fill="#dce8f8" font-size="18">撤銷帳號、憑證、權杖</text><text x="965" y="554" text-anchor="middle" fill="#a9bfdf" font-size="17">回收裝置並驗證資料歸還</text>
<path d="M1075 315V365H235V415" fill="none" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M385 505H440" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M750 505H805" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/>
<rect x="200" y="625" width="800" height="50" rx="18" fill="#331e35" stroke="#ff7da9"/><text x="600" y="658" text-anchor="middle" fill="#ffd5e3" font-size="19">停止條件：身分不一致、代理操作、惡意測試檔或異常外傳未釐清，不得擴大存取</text></g></svg>