<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">生成式人工智慧醫療器材的責任與證據邊界</title><desc id="desc">第三方基礎模型經醫療器材包裝層限制輸入、輸出與預定用途，再進入臨床工作流程；版本、測試、事件與人工覆核證據由獨立治理面保存。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">模型能力不等於醫療器材的核准用途</text><text x="58" y="108" fill="#a9bfdf" font-size="20">責任邊界要能固定版本、限制情境、攔截不確定輸出並保存臨床證據</text>
<rect x="55" y="170" width="235" height="190" rx="24" fill="#122b50" stroke="#8fa8ff" stroke-width="3"/><text x="172" y="220" text-anchor="middle" fill="#c6d1ff" font-size="24" font-weight="700">外部模型供應</text><text x="172" y="264" text-anchor="middle" fill="#e5eefb" font-size="18">基礎模型／API／更新</text><text x="172" y="303" text-anchor="middle" fill="#ffcf8c" font-size="17">能力與限制可能變動</text><text x="172" y="334" text-anchor="middle" fill="#a9bfdf" font-size="16">不得直接等同醫療效能</text>
<rect x="350" y="140" width="300" height="250" rx="28" fill="#18395b" stroke="#69e7ff" stroke-width="4"/><text x="500" y="195" text-anchor="middle" fill="#69e7ff" font-size="25" font-weight="700">醫療器材包裝層</text><text x="500" y="239" text-anchor="middle" fill="#fff" font-size="19">預定用途／族群／輸入邊界</text><text x="500" y="276" text-anchor="middle" fill="#e5eefb" font-size="18">輸出格式／信心門檻／拒答</text><text x="500" y="313" text-anchor="middle" fill="#e5eefb" font-size="18">版本鎖定／變更閘門／回退</text><text x="500" y="352" text-anchor="middle" fill="#7ff3cf" font-size="17">可驗證的醫療功能</text>
<rect x="710" y="170" width="235" height="190" rx="24" fill="#122b50" stroke="#5aefbe" stroke-width="3"/><text x="827" y="220" text-anchor="middle" fill="#7ff3cf" font-size="24" font-weight="700">臨床工作流程</text><text x="827" y="264" text-anchor="middle" fill="#e5eefb" font-size="18">醫事人員覆核</text><text x="827" y="303" text-anchor="middle" fill="#e5eefb" font-size="18">替代流程與人工接管</text><text x="827" y="334" text-anchor="middle" fill="#a9bfdf" font-size="16">高影響輸出不得靜默通過</text>
<rect x="1005" y="170" width="140" height="190" rx="24" fill="#122b50" stroke="#ffbd69" stroke-width="3"/><text x="1075" y="220" text-anchor="middle" fill="#ffcf8c" font-size="22" font-weight="700">病人結果</text><text x="1075" y="264" text-anchor="middle" fill="#e5eefb" font-size="17">安全</text><text x="1075" y="297" text-anchor="middle" fill="#e5eefb" font-size="17">效能</text><text x="1075" y="330" text-anchor="middle" fill="#e5eefb" font-size="17">公平性</text>
<path d="M290 265H340" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M650 265H700" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M945 265H995" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="100" y="480" width="1000" height="150" rx="26" fill="#0c203b" stroke="#9c8cff" stroke-width="3"/><text x="600" y="525" text-anchor="middle" fill="#c6d1ff" font-size="24" font-weight="700">獨立治理與證據面</text><text x="220" y="575" text-anchor="middle" fill="#dce8f8" font-size="18">模型與元件清冊</text><text x="460" y="575" text-anchor="middle" fill="#dce8f8" font-size="18">基線與族群測試</text><text x="700" y="575" text-anchor="middle" fill="#dce8f8" font-size="18">版本與變更紀錄</text><text x="940" y="575" text-anchor="middle" fill="#dce8f8" font-size="18">事件、漂移與回退證據</text><path d="M500 390V468" stroke="#9c8cff" stroke-width="4" marker-end="url(#a)"/></g></svg>