<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療權杖生命週期驗收流程</title><desc id="desc">由用途盤點、信任設定、簽發驗證、受控上線、持續監測到撤銷復原的六階段流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#18244a"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="80" fill="#f4f8ff" font-size="38" font-weight="800">六階段建立可撤銷、可調查的權杖生命週期</text><text x="70" y="122" fill="#9fb3d9" font-size="24">驗收重點不是「能登入」，而是偽造、竊取或誤用時能快速限制影響。</text>
<g font-family="Noto Sans TC, sans-serif" text-anchor="middle"><g fill="#10283d" stroke="#63e6ff" stroke-width="3"><rect x="70" y="200" width="290" height="150" rx="24"/><rect x="455" y="200" width="290" height="150" rx="24"/><rect x="840" y="200" width="290" height="150" rx="24"/></g><text x="215" y="250" fill="#63e6ff" font-size="26" font-weight="700">1 用途與依賴盤點</text><text x="215" y="292" fill="#d7e5f6" font-size="21">SSO、API、服務身分</text><text x="215" y="324" fill="#9fb3d9" font-size="19">臨床後果與離線方案</text><text x="600" y="250" fill="#63e6ff" font-size="26" font-weight="700">2 信任與金鑰設定</text><text x="600" y="292" fill="#d7e5f6" font-size="21">簽發者、受眾、演算法</text><text x="600" y="324" fill="#9fb3d9" font-size="19">隔離、輪替與責任分離</text><text x="985" y="250" fill="#63e6ff" font-size="26" font-weight="700">3 驗證與攻擊測試</text><text x="985" y="292" fill="#d7e5f6" font-size="21">過期、重播、錯誤受眾</text><text x="985" y="324" fill="#9fb3d9" font-size="19">舊金鑰與跨租戶誤用</text>
<g fill="#162449" stroke="#a997ff" stroke-width="3"><rect x="70" y="460" width="290" height="150" rx="24"/><rect x="455" y="460" width="290" height="150" rx="24"/><rect x="840" y="460" width="290" height="150" rx="24"/></g><text x="215" y="510" fill="#c4b5fd" font-size="26" font-weight="700">4 受控上線</text><text x="215" y="552" fill="#e2dcff" font-size="21">短效期限與最小權限</text><text x="215" y="584" fill="#aaa7c9" font-size="19">敏感操作重新驗證</text><text x="600" y="510" fill="#c4b5fd" font-size="26" font-weight="700">5 持續監測</text><text x="600" y="552" fill="#e2dcff" font-size="21">簽發、驗證、拒絕事件</text><text x="600" y="584" fill="#aaa7c9" font-size="19">異常來源與權限跳升</text><text x="985" y="510" fill="#c4b5fd" font-size="26" font-weight="700">6 撤銷與復原</text><text x="985" y="552" fill="#e2dcff" font-size="21">停用金鑰、撤銷工作階段</text><text x="985" y="584" fill="#aaa7c9" font-size="19">重建信任並完成臨床驗收</text></g>
<path d="M360 275H455M745 275H840M985 350V420H215V460M360 535H455M745 535H840" fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M985 610V670H215V610" fill="none" stroke="#57f0c1" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/><text x="585" y="688" fill="#78f5ce" font-size="21" text-anchor="middle">復原結果回饋到用途、信任與測試基線</text></svg>