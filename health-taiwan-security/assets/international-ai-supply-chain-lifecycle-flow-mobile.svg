<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">第三方 AI 生命週期治理流程手機版</title><desc id="desc">用途、供應商、契約、驗證、監測、事件與退場七階段垂直流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#15234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="720" height="1180" rx="30" fill="url(#bg)"/><text x="48" y="70" fill="#fff" font-size="30" font-weight="800">第三方 AI 七階段治理</text><text x="48" y="108" fill="#9fb3d9" font-size="18">重大變更必須回到分級與再驗證</text><path d="M110 180V970" stroke="#315a80" stroke-width="8"/><g font-size="20"><g><circle cx="110" cy="200" r="38" fill="#12344a" stroke="#63e6ff" stroke-width="4"/><text x="110" y="207" fill="#fff" text-anchor="middle" font-weight="800">0</text><text x="175" y="194" fill="#63e6ff" font-size="23" font-weight="700">用途正當性</text><text x="175" y="226" fill="#c6d4eb">目標、替代方案、風險層級</text></g><g><circle cx="110" cy="325" r="38" fill="#172c50" stroke="#8fa7ff" stroke-width="4"/><text x="110" y="332" fill="#fff" text-anchor="middle" font-weight="800">1</text><text x="175" y="319" fill="#b8c5ff" font-size="23" font-weight="700">供應商評估</text><text x="175" y="351" fill="#c6d4eb">模型、資料、外掛與次處理者</text></g><g><circle cx="110" cy="450" r="38" fill="#261e43" stroke="#a997ff" stroke-width="4"/><text x="110" y="457" fill="#fff" text-anchor="middle" font-weight="800">2</text><text x="175" y="444" fill="#c7bcff" font-size="23" font-weight="700">契約與責任</text><text x="175" y="476" fill="#c6d4eb">變更、事件、稽核與退場</text></g><g><circle cx="110" cy="575" r="38" fill="#123c3b" stroke="#57f0c1" stroke-width="4"/><text x="110" y="582" fill="#fff" text-anchor="middle" font-weight="800">3</text><text x="175" y="569" fill="#78f4d0" font-size="23" font-weight="700">隔離驗證</text><text x="175" y="601" fill="#c6d4eb">安全、臨床與回退測試</text></g><g><circle cx="110" cy="700" r="38" fill="#233849" stroke="#63e6ff" stroke-width="4"/><text x="110" y="707" fill="#fff" text-anchor="middle" font-weight="800">4</text><text x="175" y="694" fill="#63e6ff" font-size="23" font-weight="700">持續監測</text><text x="175" y="726" fill="#c6d4eb">版本、漂移、效能與事件</text></g><g><circle cx="110" cy="825" r="38" fill="#4a2b2f" stroke="#ff9f9f" stroke-width="4"/><text x="110" y="832" fill="#fff" text-anchor="middle" font-weight="800">5</text><text x="175" y="819" fill="#ffb3b3" font-size="23" font-weight="700">事件與回復</text><text x="175" y="851" fill="#c6d4eb">隔離、回退、通知與證據</text></g><g><circle cx="110" cy="950" r="38" fill="#3b3240" stroke="#f2c879" stroke-width="4"/><text x="110" y="957" fill="#fff" text-anchor="middle" font-weight="800">6</text><text x="175" y="944" fill="#f2d293" font-size="23" font-weight="700">安全退場</text><text x="175" y="976" fill="#c6d4eb">遷移、刪除、撤權與接續</text></g></g><rect x="48" y="1030" width="624" height="105" rx="22" fill="#0d203a" stroke="#536d95"/><text x="360" y="1070" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">最低放行證據</text><text x="360" y="1104" fill="#c6d4eb" font-size="17" text-anchor="middle">責任、依賴、測試、回退、聯絡與刪除證明</text></svg>