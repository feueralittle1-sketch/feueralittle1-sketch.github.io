<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc"><title id="title">手機版聯邦學習風險與控制對照</title><desc id="desc">五種聯邦學習失敗模式，分別對應隱私、投毒防護、管理面、參與者生命週期與臨床效用控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1240" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="57" fill="#f7fbff" font-size="28" font-weight="800">五種失敗模式與驗收控制</text><text x="38" y="96" fill="#9fb7d5" font-size="18">資料不出院，只是風險治理的起點</text>
<g><rect x="50" y="132" width="620" height="190" rx="22" fill="#142b47" stroke="#ff9f9f"/><text x="80" y="176" fill="#ffb4b4" font-size="22" font-weight="800">更新可反推出個資</text><text x="80" y="218" fill="#e6eefc" font-size="18">剪裁 · 差分隱私 · 安全聚合</text><text x="80" y="258" fill="#c7f9e8" font-size="18">證據：隱私參數、攻擊測試、效用門檻</text><text x="80" y="294" fill="#9fb7d5" font-size="16">限制最小群組與查詢頻率</text><rect x="50" y="342" width="620" height="190" rx="22" fill="#1b3048" stroke="#ffbf69"/><text x="80" y="386" fill="#ffd08a" font-size="22" font-weight="800">惡意節點污染模型</text><text x="80" y="428" fill="#e6eefc" font-size="18">更新簽章 · 異常檢測 · 穩健聚合</text><text x="80" y="468" fill="#c7f9e8" font-size="18">證據：投毒演練、隔離、停止與回退</text><text x="80" y="504" fill="#9fb7d5" font-size="16">限制單一院所對全域模型的影響</text><rect x="50" y="552" width="620" height="190" rx="22" fill="#142b47" stroke="#ff9f9f"/><text x="80" y="596" fill="#ffb4b4" font-size="22" font-weight="800">協調平台遭接管</text><text x="80" y="638" fill="#e6eefc" font-size="18">PAM · 網段隔離 · 金鑰分離 · 外送日誌</text><text x="80" y="678" fill="#c7f9e8" font-size="18">證據：特權稽核、乾淨重建與復原演練</text><text x="80" y="714" fill="#9fb7d5" font-size="16">管理面不可與訓練節點共用高權限</text><rect x="50" y="762" width="620" height="190" rx="22" fill="#1b3048" stroke="#ffbf69"/><text x="80" y="806" fill="#ffd08a" font-size="22" font-weight="800">參與者與資料漂移</text><text x="80" y="848" fill="#e6eefc" font-size="18">加入核准 · 定期重驗 · 即時撤權</text><text x="80" y="888" fill="#c7f9e8" font-size="18">證據：名冊、版本、條件差異與退出紀錄</text><text x="80" y="924" fill="#9fb7d5" font-size="16">院所、用途或資料條件改變即觸發重驗</text><rect x="50" y="972" width="620" height="210" rx="22" fill="#142b47" stroke="#57f0c1"/><text x="80" y="1016" fill="#72f5cd" font-size="22" font-weight="800">模型效用或公平性下降</text><text x="80" y="1058" fill="#e6eefc" font-size="18">分群測試 · 臨床覆核 · 降級與回退</text><text x="80" y="1098" fill="#c7f9e8" font-size="18">證據：用途內效能、漂移與停用門檻</text><text x="80" y="1134" fill="#9fb7d5" font-size="16">限制自動化影響與部署範圍</text></g></g></svg>
