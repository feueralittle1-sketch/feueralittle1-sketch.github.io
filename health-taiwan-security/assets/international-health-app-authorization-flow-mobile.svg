<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">個人健康 App 病歷交付七步流程手機版</title><desc id="desc">病歷交付由請求、驗證、範圍、目的地、告知、傳輸到結案依序執行。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12264a"/></linearGradient></defs><rect width="720" height="1200" fill="url(#bg)"/><text x="50" y="65" fill="#f8fbff" font-size="30" font-weight="800">病歷交付七步流程</text><text x="50" y="105" fill="#9fb3d9" font-size="18">不一致就停在交付前，轉人工例外處理</text><g font-size="22"><rect x="60" y="150" width="600" height="100" rx="24" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="95" y="212" fill="#63e6ff" font-weight="800">01</text><text x="170" y="212" fill="#fff">受理請求：記錄請求人與管道</text><rect x="60" y="270" width="600" height="100" rx="24" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="95" y="332" fill="#63e6ff" font-weight="800">02</text><text x="170" y="332" fill="#fff">驗證身分：本人或代理關係</text><rect x="60" y="390" width="600" height="100" rx="24" fill="#172b48" stroke="#a997ff" stroke-width="3"/><text x="95" y="452" fill="#c9c0ff" font-weight="800">03</text><text x="170" y="452" fill="#fff">限定範圍：資料集與日期區間</text><rect x="60" y="510" width="600" height="100" rx="24" fill="#172b48" stroke="#a997ff" stroke-width="3"/><text x="95" y="572" fill="#c9c0ff" font-weight="800">04</text><text x="170" y="572" fill="#fff">確認目的地：App、URI 與端點</text><rect x="60" y="630" width="600" height="100" rx="24" fill="#26304c" stroke="#f2c94c" stroke-width="3"/><text x="95" y="692" fill="#ffe58a" font-weight="800">05</text><text x="170" y="692" fill="#fff">顯示告知：角色、風險與聯絡點</text><rect x="60" y="750" width="600" height="100" rx="24" fill="#14343a" stroke="#57f0c1" stroke-width="3"/><text x="95" y="812" fill="#7ff5d2" font-weight="800">06</text><text x="170" y="812" fill="#fff">受控傳輸：加密、最小範圍與逾時</text><rect x="60" y="870" width="600" height="100" rx="24" fill="#14343a" stroke="#57f0c1" stroke-width="3"/><text x="95" y="932" fill="#7ff5d2" font-weight="800">07</text><text x="170" y="932" fill="#fff">證據結案：結果、撤權、重試與例外</text></g><rect x="60" y="1020" width="600" height="120" rx="24" fill="#0c1b31" stroke="#385d86" stroke-width="2"/><text x="360" y="1067" text-anchor="middle" fill="#f8fbff" font-size="23" font-weight="800">驗收重點</text><text x="360" y="1108" text-anchor="middle" fill="#c9d8ee" font-size="19">人、資料、目的地、傳輸結果四類證據完整</text></svg>