<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">醫療資安成熟度的證據架構</title>
  <desc id="desc">將自評回答連結到治理範圍、客觀證據、臨床情境驗證與改善責任，避免只有問卷分數。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162a"/><stop offset="1" stop-color="#10244a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#63e6ff"/></marker>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f5f8ff" font-size="36" font-weight="800">成熟度不是分數，而是可驗證的改善能力</text>
  <text x="60" y="108" fill="#a9bbd8" font-size="22">每個回答都要能追溯到範圍、證據、臨床結果與責任人</text>
  <g filter="url(#shadow)">
    <rect x="60" y="165" width="245" height="180" rx="24" fill="#122e50" stroke="#63e6ff" stroke-width="3"/>
    <text x="88" y="210" fill="#63e6ff" font-size="25" font-weight="700">01 治理範圍</text>
    <text x="88" y="255" fill="#fff" font-size="22">院區、系統、流程</text><text x="88" y="292" fill="#c6d4eb" font-size="20">臨床關鍵性與依賴</text><text x="88" y="329" fill="#c6d4eb" font-size="20">適用與不適用理由</text>
    <rect x="335" y="165" width="245" height="180" rx="24" fill="#192c55" stroke="#9c8cff" stroke-width="3"/>
    <text x="363" y="210" fill="#b8aaff" font-size="25" font-weight="700">02 客觀證據</text>
    <text x="363" y="255" fill="#fff" font-size="22">組態、日誌、工單</text><text x="363" y="292" fill="#c6d4eb" font-size="20">演練紀錄與修補複測</text><text x="363" y="329" fill="#c6d4eb" font-size="20">證據日期與保管者</text>
    <rect x="610" y="165" width="245" height="180" rx="24" fill="#12394a" stroke="#57f0c1" stroke-width="3"/>
    <text x="638" y="210" fill="#57f0c1" font-size="25" font-weight="700">03 臨床驗證</text>
    <text x="638" y="255" fill="#fff" font-size="22">停機與替代流程</text><text x="638" y="292" fill="#c6d4eb" font-size="20">病人安全與服務影響</text><text x="638" y="329" fill="#c6d4eb" font-size="20">恢復順序與驗收</text>
    <rect x="885" y="165" width="255" height="180" rx="24" fill="#473024" stroke="#ffbd70" stroke-width="3"/>
    <text x="913" y="210" fill="#ffbd70" font-size="25" font-weight="700">04 改善閉環</text>
    <text x="913" y="255" fill="#fff" font-size="22">差距、責任、期限</text><text x="913" y="292" fill="#c6d4eb" font-size="20">風險接受與資源決策</text><text x="913" y="329" fill="#c6d4eb" font-size="20">複測與關閉條件</text>
  </g>
  <g stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"><path d="M305 255H328"/><path d="M580 255H603"/><path d="M855 255H878"/></g>
  <rect x="155" y="425" width="890" height="155" rx="30" fill="#0b1930" stroke="#425c80" stroke-width="2"/>
  <text x="600" y="472" text-anchor="middle" fill="#f5f8ff" font-size="28" font-weight="800">可稽核輸出</text>
  <g font-size="21" fill="#cfe0f6"><text x="210" y="525">• 現況基線</text><text x="420" y="525">• 優先改善清單</text><text x="675" y="525">• 臨床驗收結果</text><text x="885" y="525">• 董事會決策證據</text></g>
  <text x="600" y="630" text-anchor="middle" fill="#8fa6c8" font-size="20">回答「有／無／部分」只是入口；沒有範圍與證據，就不能代表控制有效。</text>
</svg>