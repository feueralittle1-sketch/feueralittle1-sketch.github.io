<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫院設施 OT 與臨床服務依賴圖</title><desc id="desc">電力、空調、醫療氣體、門禁與冷鏈等設施操作科技，經控制與監測區支撐手術、急診、檢驗、藥品及病房服務。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#13264b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" rx="40" fill="url(#bg)"/><text x="70" y="72" fill="#fff" font-size="34" font-weight="700">設施 OT 是臨床服務的隱形依賴層</text><text x="70" y="108" fill="#9fb3d9" font-size="19">先把實體流程、控制網路與病人照護連成同一張依賴圖</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="70" y="155" width="300" height="430" rx="28" fill="#0d2039" stroke="#63e6ff" stroke-width="2"/><text x="220" y="198" fill="#63e6ff" font-size="24" font-weight="700">設施與設備層</text>
<g fill="#142e4d" stroke="#466887"><rect x="105" y="230" width="230" height="58" rx="16"/><rect x="105" y="305" width="230" height="58" rx="16"/><rect x="105" y="380" width="230" height="58" rx="16"/><rect x="105" y="455" width="230" height="58" rx="16"/></g><g fill="#fff" font-size="20"><text x="220" y="266">電力／UPS／發電機</text><text x="220" y="341">空調／壓差／溫濕度</text><text x="220" y="416">醫療氣體／冷鏈</text><text x="220" y="491">門禁／電梯／消防</text></g><text x="220" y="550" fill="#9fb3d9" font-size="17">PLC · BMS · 感測器 · 控制器</text>
<rect x="450" y="210" width="300" height="330" rx="28" fill="#102844" stroke="#9c8cff" stroke-width="2"/><text x="600" y="252" fill="#c6baff" font-size="24" font-weight="700">受控 OT 區</text><g fill="#182f52" stroke="#6f67a5"><rect x="490" y="285" width="220" height="55" rx="15"/><rect x="490" y="360" width="220" height="55" rx="15"/><rect x="490" y="435" width="220" height="55" rx="15"/></g><g fill="#fff" font-size="19"><text x="600" y="320">資產與連線清冊</text><text x="600" y="395">分區、跳板與最小權限</text><text x="600" y="470">監測、告警與事件證據</text></g>
<rect x="830" y="155" width="300" height="430" rx="28" fill="#0d2039" stroke="#57f0c1" stroke-width="2"/><text x="980" y="198" fill="#57f0c1" font-size="24" font-weight="700">臨床服務層</text><g fill="#143248" stroke="#477c72"><rect x="865" y="230" width="230" height="58" rx="16"/><rect x="865" y="305" width="230" height="58" rx="16"/><rect x="865" y="380" width="230" height="58" rx="16"/><rect x="865" y="455" width="230" height="58" rx="16"/></g><g fill="#fff" font-size="20"><text x="980" y="266">手術／加護／急診</text><text x="980" y="341">檢驗／影像／藥品</text><text x="980" y="416">病房／隔離空間</text><text x="980" y="491">病人與人員動線</text></g><text x="980" y="550" fill="#9fb3d9" font-size="17">以照護後果決定優先序</text>
<g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M370 370H435"/><path d="M750 370H815"/></g></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><text x="600" y="645" text-anchor="middle" fill="#d9e7ff" font-size="20">治理重點：臨床衝擊、現場安全與可恢復性，同時高於單一設備可用率</text></svg>