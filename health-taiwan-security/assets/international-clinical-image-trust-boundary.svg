<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">臨床影像受控採集信任邊界</title><desc id="desc">拍攝需求先經用途、同意與最小必要判定，再由受管裝置上傳正式病歷或核准影像庫，禁止留在個人裝置與非核准通訊服務。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="64" y="76" fill="#fff" font-size="38" font-weight="800">臨床影像受控採集信任邊界</text><text x="64" y="116" fill="#9fb3d9" font-size="20">影像從拍攝當下就要進入可追溯、可刪除、可限制的正式流程</text><rect x="64" y="185" width="260" height="255" rx="24" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="194" y="240" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">臨床需求</text><text x="194" y="291" text-anchor="middle" fill="#c6d4eb" font-size="20">診療／會診／追蹤</text><text x="194" y="329" text-anchor="middle" fill="#c6d4eb" font-size="20">教學與研究另行分流</text><text x="194" y="376" text-anchor="middle" fill="#57f0c1" font-size="20">先定義用途與必要範圍</text><rect x="388" y="165" width="360" height="295" rx="24" fill="#15294c" stroke="#a997ff" stroke-width="3"/><text x="568" y="220" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">採集治理閘門</text><text x="430" y="272" fill="#c6d4eb" font-size="20">① 身分與同意／法定依據</text><text x="430" y="314" fill="#c6d4eb" font-size="20">② 只拍必要部位與必要畫面</text><text x="430" y="356" fill="#c6d4eb" font-size="20">③ 受管裝置、加密與自動上傳</text><text x="430" y="398" fill="#c6d4eb" font-size="20">④ 擁有者、保存期與刪除責任</text><rect x="812" y="185" width="324" height="255" rx="24" fill="#102f3d" stroke="#57f0c1" stroke-width="2"/><text x="974" y="240" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">正式紀錄區</text><text x="974" y="291" text-anchor="middle" fill="#c6d4eb" font-size="20">電子病歷／影像庫</text><text x="974" y="329" text-anchor="middle" fill="#c6d4eb" font-size="20">權限、稽核、保存與刪除</text><text x="974" y="376" text-anchor="middle" fill="#57f0c1" font-size="20">可回查來源與每次存取</text><path d="M324 315H378" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><path d="M748 315H802" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="64" y="520" width="1072" height="120" rx="22" fill="#351b37" stroke="#ff7fa3" stroke-width="2"/><text x="95" y="568" fill="#ffb4c6" font-size="24" font-weight="800">禁止旁路</text><text x="95" y="608" fill="#f3d7e1" font-size="21">個人手機相簿、私人雲端、一般聊天軟體、未核准 USB、以截圖取代正式匯出；例外必須限時、留痕並完成移除驗證。</text></g></svg>