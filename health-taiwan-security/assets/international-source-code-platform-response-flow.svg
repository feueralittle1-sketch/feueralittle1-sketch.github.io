<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">原始碼平台漏洞事件的分流與可信恢復流程</title>
<desc id="desc">流程從盤點與曝險判定開始，並行進行證據保全、服務限制與開發替代作業，再完成更新重建、秘密輪替、程式碼與成品驗證，最後分批恢復。</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0c1832"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#65e6ff"/></marker></defs><rect width="1200" height="760" fill="url(#bg2)"/>
<text x="60" y="74" fill="#f6faff" font-size="38" font-weight="800">可信恢復要同時回答三件事</text><text x="60" y="110" fill="#a9bddc" font-size="22">主機是否乾淨、程式碼是否可信、交付憑證是否仍安全</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><rect x="60" y="160" width="250" height="115" rx="22" fill="#142746" stroke="#65e6ff" stroke-width="3"/><text x="185" y="205" text-anchor="middle" fill="#79ecff" font-size="25" font-weight="700">1 盤點與判定</text><text x="185" y="240" text-anchor="middle" fill="#d4e3f6" font-size="20">版本、節點、曝險、擁有人</text>
<path d="M310 217H365" stroke="#65e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="375" y="160" width="250" height="115" rx="22" fill="#2c213e" stroke="#c6a8ff" stroke-width="3"/><text x="500" y="205" text-anchor="middle" fill="#d6c4ff" font-size="25" font-weight="700">2 事件分級</text><text x="500" y="240" text-anchor="middle" fill="#d4e3f6" font-size="20">未曝險／疑似／已確認</text>
<path d="M625 217H680" stroke="#65e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="690" y="160" width="450" height="115" rx="22" fill="#3b2620" stroke="#ffab76" stroke-width="3"/><text x="915" y="205" text-anchor="middle" fill="#ffc19a" font-size="25" font-weight="700">3 立即限制高影響能力</text><text x="915" y="240" text-anchor="middle" fill="#d4e3f6" font-size="20">封鎖外部入口、暫停部署、凍結權限變更</text>
<text x="60" y="340" fill="#8fe8ff" font-size="23" font-weight="700">並行工作流</text>
<rect x="60" y="370" width="330" height="130" rx="22" fill="#122c3d" stroke="#78c7ff" stroke-width="3"/><text x="225" y="415" text-anchor="middle" fill="#9cddff" font-size="24" font-weight="700">A 證據保全</text><text x="225" y="451" text-anchor="middle" fill="#d4e3f6" font-size="20">外送稽核、API、系統與網路紀錄</text><text x="225" y="481" text-anchor="middle" fill="#d4e3f6" font-size="20">建立事件時間線</text>
<rect x="435" y="370" width="330" height="130" rx="22" fill="#18352f" stroke="#57f0c1" stroke-width="3"/><text x="600" y="415" text-anchor="middle" fill="#82f6d4" font-size="24" font-weight="700">B 開發持續性</text><text x="600" y="451" text-anchor="middle" fill="#d4e3f6" font-size="20">唯讀鏡像、離線變更紀錄</text><text x="600" y="481" text-anchor="middle" fill="#d4e3f6" font-size="20">緊急修復走核准替代路徑</text>
<rect x="810" y="370" width="330" height="130" rx="22" fill="#36283a" stroke="#ff9ed0" stroke-width="3"/><text x="975" y="415" text-anchor="middle" fill="#ffb8dc" font-size="24" font-weight="700">C 秘密止血</text><text x="975" y="451" text-anchor="middle" fill="#d4e3f6" font-size="20">撤銷權杖、限制 Runner</text><text x="975" y="481" text-anchor="middle" fill="#d4e3f6" font-size="20">隔離部署與簽章金鑰</text>
<g stroke="#65e6ff" stroke-width="4"><path d="M915 275V320H225V360"/><path d="M915 320H600V360"/><path d="M915 320H975V360"/></g>
<rect x="175" y="585" width="850" height="105" rx="24" fill="#17264a" stroke="#9c8cff" stroke-width="3"/><text x="600" y="625" text-anchor="middle" fill="#d3caff" font-size="26" font-weight="700">4 更新或乾淨重建 → 5 秘密輪替 → 6 程式碼、成品與部署驗證</text><text x="600" y="661" text-anchor="middle" fill="#d4e3f6" font-size="21">由獨立人員核對基準、差異、簽章、Runner 與臨床測試後，再分批恢復</text>
<path d="M225 500V545H600V575" stroke="#65e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M600 500V575" stroke="#65e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M975 500V545H600" stroke="#65e6ff" stroke-width="4"/>
<text x="600" y="730" text-anchor="middle" fill="#9fb3d9" font-size="20">版本更新能關閉漏洞；可信恢復還需排除已遭讀取的秘密與遭竄改的交付物。</text></g></svg>
