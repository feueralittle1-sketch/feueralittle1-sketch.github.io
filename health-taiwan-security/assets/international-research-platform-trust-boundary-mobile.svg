<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1240" role="img" aria-labelledby="title desc"><title id="title">手機版臨床研究平台信任邊界</title><desc id="desc">公開問卷、應用服務、研究資料及獨立控制面由上而下分層。</desc><rect width="760" height="1240" rx="28" fill="#08182b"/><text x="380" y="58" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="30" font-weight="800" fill="#fff">研究平台四層信任邊界</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="65" y="105" width="630" height="220" rx="24" fill="#102742" stroke="#fb7185" stroke-width="3"/><text x="105" y="160" font-size="27" font-weight="800" fill="#fff">01 公開問卷</text><text x="105" y="210" font-size="21" fill="#c6d4eb">外部填答｜問卷雜湊｜檔案與匯入</text><text x="105" y="255" font-size="21" fill="#c6d4eb">限制來源、速率與功能</text><rect x="65" y="365" width="630" height="220" rx="24" fill="#102742" stroke="#67e8f9" stroke-width="3"/><text x="105" y="420" font-size="27" font-weight="800" fill="#fff">02 應用服務</text><text x="105" y="470" font-size="21" fill="#c6d4eb">路由｜版本｜外掛｜輸入驗證</text><text x="105" y="515" font-size="21" fill="#c6d4eb">服務帳號與應用日誌</text><rect x="65" y="625" width="630" height="220" rx="24" fill="#102742" stroke="#5eead4" stroke-width="3"/><text x="105" y="680" font-size="27" font-weight="800" fill="#fff">03 研究資料</text><text x="105" y="730" font-size="21" fill="#c6d4eb">資料庫｜檔案｜稽核軌跡｜備份</text><text x="105" y="775" font-size="21" fill="#c6d4eb">逐案確認完整性與版本</text><rect x="65" y="885" width="630" height="245" rx="24" fill="#102742" stroke="#b8a7ff" stroke-width="3"/><text x="105" y="940" font-size="27" font-weight="800" fill="#fff">04 獨立控制面</text><text x="105" y="990" font-size="21" fill="#c6d4eb">SSO｜秘密｜集中日誌｜隔離備份</text><text x="105" y="1035" font-size="21" fill="#c6d4eb">事件時間線與可信復原</text><text x="380" y="1190" text-anchor="middle" font-size="21" fill="#fde68a">平台可用，不等於研究資料可信</text></g></svg>