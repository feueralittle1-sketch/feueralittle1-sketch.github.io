<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">醫療系統安全預設值驗收流程</title>
  <desc id="desc">從臨床用途與風險定義、供應商證據、隔離建置、負向測試、臨床回歸到放行或退回的六步流程。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061321"/><stop offset="1" stop-color="#101c3b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="60" y="70" fill="#fff" font-size="32" font-weight="800">從需求到放行：六步建立可重複的安全基線</text>
  <text x="60" y="108" fill="#a8bad8" font-size="19">任何偏離都必須有風險、補償控制、期限與重新驗證條件</text>
  <g font-family="Inter,Noto Sans TC,sans-serif">
    <g transform="translate(70 160)"><rect width="300" height="150" rx="24" fill="#102b45" stroke="#48d9f5" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#46dff8"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#071421">1</text><text x="75" y="45" fill="#fff" font-size="23" font-weight="800">定義用途與風險</text><text x="28" y="88" fill="#c7d5ec" font-size="18">資料、操作者、外部連線</text><text x="28" y="119" fill="#c7d5ec" font-size="18">臨床影響、停機與復原條件</text></g>
    <g transform="translate(450 160)"><rect width="300" height="150" rx="24" fill="#172a4b" stroke="#789dff" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#789dff"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#071421">2</text><text x="75" y="45" fill="#fff" font-size="23" font-weight="800">索取交付證據</text><text x="28" y="88" fill="#c7d5ec" font-size="18">預設值、版本、介面、日誌</text><text x="28" y="119" fill="#c7d5ec" font-size="18">更新責任與支援期限</text></g>
    <g transform="translate(830 160)"><rect width="300" height="150" rx="24" fill="#202849" stroke="#a88cff" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#a88cff"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#071421">3</text><text x="75" y="45" fill="#fff" font-size="23" font-weight="800">隔離建置基線</text><text x="28" y="88" fill="#c7d5ec" font-size="18">不接臨床網路先完成設定</text><text x="28" y="119" fill="#c7d5ec" font-size="18">匯出並封存可比較基線</text></g>
    <g transform="translate(830 420)"><rect width="300" height="150" rx="24" fill="#163743" stroke="#55e6c1" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#55e6c1"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#071421">4</text><text x="75" y="45" fill="#fff" font-size="23" font-weight="800">執行負向測試</text><text x="28" y="88" fill="#d2e8e5" font-size="18">預設憑證、未授權介面</text><text x="28" y="119" fill="#d2e8e5" font-size="18">弱通訊、關閉日誌、回退</text></g>
    <g transform="translate(450 420)"><rect width="300" height="150" rx="24" fill="#19313e" stroke="#62dbb9" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#62dbb9"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#071421">5</text><text x="75" y="45" fill="#fff" font-size="23" font-weight="800">臨床與安全回歸</text><text x="28" y="88" fill="#d2e8e5" font-size="18">告警、資料完整、正常流程</text><text x="28" y="119" fill="#d2e8e5" font-size="18">隔離、降級與復原演練</text></g>
    <g transform="translate(70 420)"><rect width="300" height="150" rx="24" fill="#233044" stroke="#f2c86c" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#f2c86c"/><text x="38" y="46" text-anchor="middle" font-size="22" font-weight="800" fill="#071421">6</text><text x="75" y="45" fill="#fff" font-size="23" font-weight="800">放行或退回</text><text x="28" y="88" fill="#e8dfc7" font-size="18">通過才進入指定信任區</text><text x="28" y="119" fill="#e8dfc7" font-size="18">例外必須限期並可撤回</text></g>
  </g>
  <g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M370 235H440"/><path d="M750 235H820"/><path d="M980 310V408"/><path d="M830 495H760"/><path d="M450 495H380"/></g>
  <rect x="150" y="636" width="900" height="72" rx="18" fill="#101c34" stroke="#526887"/><text x="600" y="681" text-anchor="middle" fill="#e8f0ff" font-size="20" font-weight="700">版本、用途、網路、身分、供應商或威脅改變 → 重新執行第 1～6 步</text>
</svg>
