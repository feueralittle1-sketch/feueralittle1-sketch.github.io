<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">醫院設施 OT 與臨床服務依賴圖手機版</title><desc id="desc">設施與設備、受控 OT 區、臨床服務由上而下連結。</desc><rect width="600" height="1000" rx="32" fill="#09172b"/><text x="40" y="62" fill="#fff" font-size="28" font-weight="700">設施 OT 支撐臨床服務</text><text x="40" y="98" fill="#9fb3d9" font-size="17">把實體流程、控制網路與照護連成依賴圖</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="140" width="510" height="225" rx="26" fill="#0d2039" stroke="#63e6ff" stroke-width="2"/><text x="300" y="182" fill="#63e6ff" font-size="23" font-weight="700">設施與設備層</text><text x="300" y="230" fill="#fff" font-size="20">電力／UPS　空調／壓差</text><text x="300" y="272" fill="#fff" font-size="20">醫療氣體／冷鏈　門禁／電梯</text><text x="300" y="322" fill="#9fb3d9" font-size="17">PLC · BMS · 感測器 · 控制器</text><path d="M300 365V415" stroke="#63e6ff" stroke-width="4"/><path d="M290 405L300 420L310 405" fill="none" stroke="#63e6ff" stroke-width="4"/><rect x="45" y="420" width="510" height="225" rx="26" fill="#102844" stroke="#9c8cff" stroke-width="2"/><text x="300" y="462" fill="#c6baff" font-size="23" font-weight="700">受控 OT 區</text><text x="300" y="510" fill="#fff" font-size="20">資產與連線清冊</text><text x="300" y="550" fill="#fff" font-size="20">分區、跳板與最小權限</text><text x="300" y="590" fill="#fff" font-size="20">監測、告警與事件證據</text><path d="M300 645V695" stroke="#63e6ff" stroke-width="4"/><path d="M290 685L300 700L310 685" fill="none" stroke="#63e6ff" stroke-width="4"/><rect x="45" y="700" width="510" height="225" rx="26" fill="#0d2039" stroke="#57f0c1" stroke-width="2"/><text x="300" y="742" fill="#57f0c1" font-size="23" font-weight="700">臨床服務層</text><text x="300" y="790" fill="#fff" font-size="20">手術／加護／急診</text><text x="300" y="830" fill="#fff" font-size="20">檢驗／影像／藥品</text><text x="300" y="870" fill="#fff" font-size="20">病房／隔離／人員動線</text></g><text x="300" y="970" text-anchor="middle" fill="#d9e7ff" font-size="17">依照護後果決定保護與復原優先序</text></svg>