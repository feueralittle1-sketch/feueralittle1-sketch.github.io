<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療邊界設備曝險與信任路徑圖</title><desc id="desc">外部網路先經受控存取與受支援的防火牆、VPN及閘道，再進入管理區、臨床服務區與醫療設備區；掃描、組態及日誌證據送往獨立驗證。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17234b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">邊界設備不是黑盒子：曝險、路徑與證據都要看得見</text><text x="600" y="102" text-anchor="middle" fill="#9fb3d9" font-size="20">公開介面只保留必要服務，管理路徑與臨床資料路徑分離</text>
<rect x="50" y="190" width="210" height="155" rx="26" fill="#362651" stroke="#a997ff" stroke-width="3"/><text x="155" y="239" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">外部網路</text><text x="155" y="282" text-anchor="middle" fill="#ddd6fe" font-size="20">病人入口／供應商</text><text x="155" y="316" text-anchor="middle" fill="#ddd6fe" font-size="20">網際網路掃描面</text>
<path d="M260 268H355" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="375" y="147" width="300" height="245" rx="30" fill="#123b60" stroke="#63e6ff" stroke-width="4"/><text x="525" y="198" text-anchor="middle" fill="#8fe8ff" font-size="28" font-weight="700">受控邊界</text><g fill="#e8f5ff" font-size="21" text-anchor="middle"><text x="525" y="246">防火牆／VPN／閘道</text><text x="525" y="286">支援版本與最小服務</text><text x="525" y="326">強驗證與管理網段</text><text x="525" y="366">組態、事件與流量日誌</text></g>
<g stroke="#57f0c1" stroke-width="4" marker-end="url(#a)"><path d="M675 202H790"/><path d="M675 270H790"/><path d="M675 338H790"/></g><g fill="#16463f" stroke="#57f0c1" stroke-width="2"><rect x="810" y="157" width="330" height="82" rx="20"/><rect x="810" y="251" width="330" height="82" rx="20"/><rect x="810" y="345" width="330" height="82" rx="20"/></g><g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="975" y="208">隔離管理區</text><text x="975" y="302">臨床應用服務區</text><text x="975" y="396">醫療設備與設施區</text></g>
<path d="M525 392V492" stroke="#fbbf24" stroke-width="5" marker-end="url(#a)"/><rect x="235" y="515" width="730" height="126" rx="28" fill="#493817" stroke="#fbbf24" stroke-width="3"/><text x="600" y="559" text-anchor="middle" fill="#fde68a" font-size="26" font-weight="700">獨立驗證面</text><text x="600" y="599" text-anchor="middle" fill="#fef3c7" font-size="20">外部曝險掃描｜組態版本｜遠端存放日誌｜韌體與支援狀態｜可信重建資料</text></g></svg>
