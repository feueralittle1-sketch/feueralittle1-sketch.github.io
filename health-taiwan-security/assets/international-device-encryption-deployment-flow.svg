<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療端點加密與開機前驗證部署流程</title>
<desc id="desc">從資料與裝置分級、選擇保護設定、建立復原金鑰程序、小批試點、分批部署到遺失與復原演練的六階段流程，每階段都有驗收證據與回退條件。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#15143b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="76" fill="#fff" font-size="34" font-weight="700">部署閉環：先分級，再試點，最後演練失竊與復原</text><text x="70" y="113" fill="#a8bad8" font-size="20">每個階段都要保留設定、測試、例外與復原證據</text>
<g text-anchor="middle"><rect x="60" y="180" width="300" height="140" rx="25" fill="#112d44" stroke="#63e6ff" stroke-width="3"/><text x="210" y="225" fill="#63e6ff" font-size="19" font-weight="700">01　分級</text><text x="210" y="263" fill="#fff" font-size="24" font-weight="700">裝置與資料清冊</text><text x="210" y="296" fill="#b9c9e3" font-size="18">外勤・共享・固定端點</text>
<rect x="450" y="180" width="300" height="140" rx="25" fill="#24234f" stroke="#a997ff" stroke-width="3"/><text x="600" y="225" fill="#c9beff" font-size="19" font-weight="700">02　設計</text><text x="600" y="263" fill="#fff" font-size="24" font-weight="700">TPM、PIN 與電源狀態</text><text x="600" y="296" fill="#d7ceff" font-size="18">定義例外與替代控制</text>
<rect x="840" y="180" width="300" height="140" rx="25" fill="#30283f" stroke="#ffd37a" stroke-width="3"/><text x="990" y="225" fill="#ffe4a8" font-size="19" font-weight="700">03　復原</text><text x="990" y="263" fill="#fff" font-size="24" font-weight="700">金鑰保管與取用</text><text x="990" y="296" fill="#ffe4a8" font-size="18">核身・授權・留痕</text>
<path d="M360 250H440" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M750 250H830" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="840" y="430" width="300" height="140" rx="25" fill="#143743" stroke="#57f0c1" stroke-width="3"/><text x="990" y="475" fill="#8bf7d8" font-size="19" font-weight="700">04　試點</text><text x="990" y="513" fill="#fff" font-size="24" font-weight="700">代表性裝置小批測試</text><text x="990" y="546" fill="#bafbe7" font-size="18">啟動・更新・休眠・復原</text>
<rect x="450" y="430" width="300" height="140" rx="25" fill="#153047" stroke="#71a7ff" stroke-width="3"/><text x="600" y="475" fill="#9cc3ff" font-size="19" font-weight="700">05　部署</text><text x="600" y="513" fill="#fff" font-size="24" font-weight="700">分批套用與監測</text><text x="600" y="546" fill="#c7dcff" font-size="18">涵蓋率・失敗率・例外期限</text>
<rect x="60" y="430" width="300" height="140" rx="25" fill="#34203d" stroke="#ff7ab8" stroke-width="3"/><text x="210" y="475" fill="#ffc2df" font-size="19" font-weight="700">06　演練</text><text x="210" y="513" fill="#fff" font-size="24" font-weight="700">遺失、鎖定與復原</text><text x="210" y="546" fill="#ffc2df" font-size="18">通報・撤銷・取證・復盤</text>
<path d="M990 320V420" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M840 500H760" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M450 500H370" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M210 430V380H210V335" fill="none" stroke="#ff7ab8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="600" y="650" fill="#94a3b8" font-size="18">回饋條件：硬體變更、更新失敗、PIN 不可行、復原金鑰異常或失竊事件，均觸發重新分級</text></g></g></svg>