<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療主權雲從需求到持續驗證的治理流程</title>
  <desc id="desc">流程依序為資料分類、責任設計、契約驗收、上線驗證與持續演練，每階段均有可查證的輸出。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071424"/><stop offset="1" stop-color="#161737"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="65" y="72" fill="#f5fbff" font-size="36" font-weight="800">先定義可驗收結果，再簽雲端契約</text><text x="65" y="112" fill="#9fb7d9" font-size="23">五個閘門把抽象的「主權」轉成資料、權限、證據與退出測試</text>
  <g stroke="#63e6ff" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M250 315H300"/><path d="M470 315H520"/><path d="M690 315H740"/><path d="M910 315H960"/></g>
  <g text-anchor="middle">
    <rect x="60" y="205" width="190" height="220" rx="28" fill="#143544" stroke="#57f0c1" stroke-width="3"/><circle cx="155" cy="250" r="28" fill="#57f0c1"/><text x="155" y="258" fill="#08231c" font-size="24" font-weight="900">1</text><text x="155" y="305" fill="#9ff8dc" font-size="25" font-weight="800">資料分類</text><text x="155" y="347" fill="#d7efe9" font-size="20">用途・敏感度</text><text x="155" y="380" fill="#d7efe9" font-size="20">位置・流向・保留</text>
    <rect x="280" y="205" width="190" height="220" rx="28" fill="#102d45" stroke="#63e6ff" stroke-width="3"/><circle cx="375" cy="250" r="28" fill="#63e6ff"/><text x="375" y="258" fill="#082431" font-size="24" font-weight="900">2</text><text x="375" y="305" fill="#8fe8ff" font-size="25" font-weight="800">責任設計</text><text x="375" y="347" fill="#d9f4ff" font-size="20">醫院／供應商</text><text x="375" y="380" fill="#d9f4ff" font-size="20">次處理者／金鑰</text>
    <rect x="500" y="205" width="190" height="220" rx="28" fill="#252649" stroke="#9c8cff" stroke-width="3"/><circle cx="595" cy="250" r="28" fill="#9c8cff"/><text x="595" y="258" fill="#19142e" font-size="24" font-weight="900">3</text><text x="595" y="305" fill="#dcd5ff" font-size="25" font-weight="800">契約驗收</text><text x="595" y="347" fill="#e4e0f7" font-size="20">SLA・稽核權</text><text x="595" y="380" fill="#e4e0f7" font-size="20">事件・退出條款</text>
    <rect x="720" y="205" width="190" height="220" rx="28" fill="#3b263e" stroke="#ff9bc8" stroke-width="3"/><circle cx="815" cy="250" r="28" fill="#ff9bc8"/><text x="815" y="258" fill="#311529" font-size="24" font-weight="900">4</text><text x="815" y="305" fill="#ffc7e1" font-size="25" font-weight="800">上線驗證</text><text x="815" y="347" fill="#f0d8e5" font-size="20">權限・日誌・加密</text><text x="815" y="380" fill="#f0d8e5" font-size="20">備份・介接・告警</text>
    <rect x="940" y="205" width="200" height="220" rx="28" fill="#44322b" stroke="#ffbf69" stroke-width="3"/><circle cx="1040" cy="250" r="28" fill="#ffbf69"/><text x="1040" y="258" fill="#322010" font-size="24" font-weight="900">5</text><text x="1040" y="305" fill="#ffd59d" font-size="25" font-weight="800">持續演練</text><text x="1040" y="347" fill="#f1ddc5" font-size="20">切換・匯出・刪除</text><text x="1040" y="380" fill="#f1ddc5" font-size="20">復原・退出・改善</text>
  </g>
  <g text-anchor="middle"><text x="155" y="470" fill="#8bbda9" font-size="19">輸出：資料處理清冊</text><text x="375" y="470" fill="#8fcce3" font-size="19">輸出：RACI 與控制矩陣</text><text x="595" y="470" fill="#aaa0d6" font-size="19">輸出：驗收與違約條件</text><text x="815" y="470" fill="#d4a3bc" font-size="19">輸出：技術測試證據</text><text x="1040" y="470" fill="#d2b18a" font-size="19">輸出：演練與改善紀錄</text></g>
  <path d="M1040 510C1040 625 155 625 155 510" fill="none" stroke="#9c8cff" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/><text x="600" y="594" text-anchor="middle" fill="#c8c0e8" font-size="22">架構、供應商或法規條件改變時，回到資料分類重新評估</text>
  <rect x="190" y="645" width="820" height="45" rx="18" fill="#0d263b"/><text x="600" y="675" text-anchor="middle" fill="#dcecff" font-size="21">驗收不能只看文件：至少要實際測一次權限撤回、資料匯出與復原</text>
</svg>
