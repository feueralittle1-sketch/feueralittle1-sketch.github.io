<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1030" role="img" aria-labelledby="title desc"><title id="title">手機版醫療 TLS 遷移風險與控制</title><desc id="desc">五種醫療 TLS 遷移失敗模式及其控制與驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#172345"/></linearGradient></defs><rect width="390" height="1030" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="22" y="42" fill="#fff" font-size="20" font-weight="800">TLS 遷移風險與控制</text><text x="22" y="69" fill="#afc3e2" font-size="14">每個控制都要有可驗收證據</text><g fill="#0d2038" stroke="#294a6f" stroke-width="1.3"><rect x="22" y="100" width="346" height="164" rx="18"/><rect x="22" y="282" width="346" height="164" rx="18"/><rect x="22" y="464" width="346" height="164" rx="18"/><rect x="22" y="646" width="346" height="164" rx="18"/><rect x="22" y="828" width="346" height="164" rx="18"/></g><g font-size="17" font-weight="800" fill="#fff"><text x="44" y="134">一次停用舊協定</text><text x="44" y="316">永久相容例外</text><text x="44" y="498">相容代理成為單點</text><text x="44" y="680">只驗成功連線</text><text x="44" y="862">沒有持續握手遙測</text></g><g font-size="14"><text x="44" y="165" fill="#ffb4c8">風險｜設備與介接突然斷線</text><text x="44" y="195" fill="#bdefff">控制｜分波切換與停止條件</text><text x="44" y="225" fill="#c9f8e9">證據｜成功率、事件、回退紀錄</text><text x="44" y="347" fill="#ffb4c8">風險｜舊版本成為固定入口</text><text x="44" y="377" fill="#bdefff">控制｜隔離、最小路徑、到期重驗</text><text x="44" y="407" fill="#c9f8e9">證據｜責任人、期限、退場里程碑</text><text x="44" y="529" fill="#ffb4c8">風險｜故障或入侵擴大中斷</text><text x="44" y="559" fill="#bdefff">控制｜高可用、管理面隔離</text><text x="44" y="589" fill="#c9f8e9">證據｜切換演練、基線、獨立日誌</text><text x="44" y="711" fill="#ffb4c8">風險｜漏掉憑證錯誤與降級攻擊</text><text x="44" y="741" fill="#bdefff">控制｜負向測試、撤銷、降級阻擋</text><text x="44" y="771" fill="#c9f8e9">證據｜失敗樣本、告警、復原紀錄</text><text x="44" y="893" fill="#ffb4c8">風險｜舊版本悄悄回流</text><text x="44" y="923" fill="#bdefff">控制｜版本基線、漂移偵測</text><text x="44" y="953" fill="#c9f8e9">證據｜舊協定流量趨勢與追蹤</text></g></g></svg>