<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc"><title id="title">手機版遠端操控風險控制</title><desc id="desc">五種遠端操控失敗模式與控制證據對照。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="900" rx="28" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">遠端操控風險控制</text><text x="38" y="98" fill="#9fb7d5" font-size="18">每一層都需要可量測的放行條件</text><rect x="45" y="140" width="630" height="118" rx="22" fill="#173b5d" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="190" fill="#ffffff" font-size="22" font-weight="800">冒名操作者</text><text x="72" y="226" fill="#d8e5f7" font-size="18" font-weight="400">強驗證、限時授權</text><text x="72" y="262" fill="#d8e5f7" font-size="18" font-weight="400">拒絕測試</text><rect x="45" y="285" width="630" height="118" rx="22" fill="#19443e" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="335" fill="#ffffff" font-size="22" font-weight="800">網路品質惡化</text><text x="72" y="371" fill="#d8e5f7" font-size="18" font-weight="400">門檻、雙路徑</text><text x="72" y="407" fill="#d8e5f7" font-size="18" font-weight="400">壓力測試</text><rect x="45" y="430" width="630" height="118" rx="22" fill="#4a3420" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="480" fill="#ffffff" font-size="22" font-weight="800">指令遭竄改</text><text x="72" y="516" fill="#d8e5f7" font-size="18" font-weight="400">簽章、序號</text><text x="72" y="552" fill="#d8e5f7" font-size="18" font-weight="400">負向測試</text><rect x="45" y="575" width="630" height="118" rx="22" fill="#332657" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="625" fill="#ffffff" font-size="22" font-weight="800">設備狀態異常</text><text x="72" y="661" fill="#d8e5f7" font-size="18" font-weight="400">限制、告警</text><text x="72" y="697" fill="#d8e5f7" font-size="18" font-weight="400">故障注入</text><rect x="45" y="720" width="630" height="118" rx="22" fill="#123c55" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="770" fill="#ffffff" font-size="22" font-weight="800">現場無法接管</text><text x="72" y="806" fill="#d8e5f7" font-size="18" font-weight="400">床邊人員、急停</text><text x="72" y="842" fill="#d8e5f7" font-size="18" font-weight="400">情境演練</text></g></svg>