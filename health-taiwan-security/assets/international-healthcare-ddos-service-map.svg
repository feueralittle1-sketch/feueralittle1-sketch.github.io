<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療數位服務的 DDoS 分層防護與替代路徑</title>
<desc id="desc">網際網路流量經上游清洗、邊緣防護與應用層限制後進入病人入口；核心臨床系統與對外入口分離，並保留電話與現場替代路徑。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#15143b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="70" y="75" fill="#fff" font-size="34" font-weight="700">DDoS 韌性：入口可受壓，臨床核心不被拖垮</text><text x="70" y="112" fill="#a8bad8" font-size="20">分層吸收流量、限制昂貴請求，並保留替代服務路徑</text>
<g font-family="Noto Sans TC, sans-serif" text-anchor="middle"><rect x="60" y="205" width="190" height="120" rx="24" fill="#132b46" stroke="#ff7ab8" stroke-width="3"/><text x="155" y="255" fill="#fff" font-size="25" font-weight="700">大量／惡意流量</text><text x="155" y="292" fill="#ffc2df" font-size="19">容量・協定・應用層</text>
<rect x="320" y="175" width="200" height="180" rx="24" fill="#0f3046" stroke="#63e6ff" stroke-width="3"/><text x="420" y="225" fill="#fff" font-size="25" font-weight="700">上游與邊緣</text><text x="420" y="264" fill="#a9f2ff" font-size="19">清洗・CDN・WAF</text><text x="420" y="300" fill="#a9f2ff" font-size="19">速率限制・快取</text>
<rect x="590" y="175" width="230" height="180" rx="24" fill="#202452" stroke="#a997ff" stroke-width="3"/><text x="705" y="225" fill="#fff" font-size="25" font-weight="700">病人數位入口</text><text x="705" y="264" fill="#d7ceff" font-size="19">掛號・查詢・遠距</text><text x="705" y="300" fill="#d7ceff" font-size="19">分級服務與排隊</text>
<rect x="890" y="175" width="240" height="180" rx="24" fill="#113b39" stroke="#57f0c1" stroke-width="3"/><text x="1010" y="225" fill="#fff" font-size="25" font-weight="700">臨床核心區</text><text x="1010" y="264" fill="#bafbe7" font-size="19">病歷・藥事・檢驗</text><text x="1010" y="300" fill="#bafbe7" font-size="19">最小必要連線</text>
<path d="M250 265H310" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M520 265H580" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M820 265H880" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="150" y="455" width="900" height="145" rx="28" fill="#0b2236" stroke="#607899" stroke-width="2"/><text x="600" y="500" fill="#fff" font-size="25" font-weight="700">對外入口降級時的替代服務面</text><text x="330" y="555" fill="#ffd37a" font-size="21">電話／簡訊通知</text><text x="600" y="555" fill="#ffd37a" font-size="21">現場與人工掛號</text><text x="870" y="555" fill="#ffd37a" font-size="21">只讀狀態頁</text><path d="M705 355V435" stroke="#ffd37a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/></g>
<text x="600" y="650" fill="#94a3b8" font-size="18" text-anchor="middle">關鍵原則：對外可用性與內部臨床完整性分開設計、分開驗收</text></svg>