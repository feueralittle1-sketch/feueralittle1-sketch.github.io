<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安風險登錄證據鏈</title><desc id="desc">設備與臨床情境依序連結威脅證據、可利用性、病人傷害、既有控制、剩餘風險與權責接受。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="55" y="68" fill="#f7fbff" font-size="34" font-weight="800">醫療設備風險不能只留一個分數</text><text x="55" y="108" fill="#a8bddb" font-size="19">風險登錄必須保留情境、證據、控制、剩餘風險與接受責任</text><rect x="55" y="160" width="215" height="190" rx="24" fill="#173b5d" stroke="#63e6ff" stroke-width="3"/><text x="82" y="205" fill="#63e6ff" font-size="23" font-weight="800">設備與用途</text><text x="82" y="248" fill="#e6eefc" font-size="18">版本與連線</text><text x="82" y="282" fill="#e6eefc" font-size="18">臨床工作流</text><text x="82" y="316" fill="#e6eefc" font-size="18">暴露範圍</text><path d="M270 255H330" stroke="#8fe8ff" stroke-width="5" marker-end="url(#a)"/><rect x="340" y="145" width="250" height="220" rx="24" fill="#19443e" stroke="#57f0c1" stroke-width="3"/><text x="370" y="192" fill="#72f5cd" font-size="23" font-weight="800">威脅與可利用性</text><text x="370" y="235" fill="#e6eefc" font-size="18">攻擊路徑與前置條件</text><text x="370" y="269" fill="#e6eefc" font-size="18">已知利用與曝險證據</text><text x="370" y="303" fill="#e6eefc" font-size="18">偵測與重現結果</text><text x="370" y="337" fill="#e6eefc" font-size="18">不確定性註記</text><path d="M590 255H650" stroke="#72f5cd" stroke-width="5" marker-end="url(#a)"/><rect x="660" y="145" width="230" height="220" rx="24" fill="#4a3420" stroke="#ffbf69" stroke-width="3"/><text x="690" y="192" fill="#ffd08a" font-size="23" font-weight="800">臨床傷害</text><text x="690" y="235" fill="#e6eefc" font-size="18">安全性與有效性</text><text x="690" y="269" fill="#e6eefc" font-size="18">病人與服務範圍</text><text x="690" y="303" fill="#e6eefc" font-size="18">降級與替代能力</text><text x="690" y="337" fill="#e6eefc" font-size="18">最壞合理情境</text><path d="M890 255H950" stroke="#ffd08a" stroke-width="5" marker-end="url(#a)"/><rect x="960" y="160" width="185" height="190" rx="24" fill="#342657" stroke="#b6a6ff" stroke-width="3"/><text x="985" y="205" fill="#c9bdff" font-size="23" font-weight="800">治理輸出</text><text x="985" y="248" fill="#e6eefc" font-size="18">處置期限</text><text x="985" y="282" fill="#e6eefc" font-size="18">權責人</text><text x="985" y="316" fill="#e6eefc" font-size="18">重驗觸發</text><rect x="155" y="430" width="890" height="150" rx="28" fill="#102f48" stroke="#8fe8ff" stroke-width="2"/><text x="190" y="476" fill="#ffffff" font-size="24" font-weight="800">剩餘風險接受前的必要證據</text><text x="190" y="521" fill="#dce9f8" font-size="19">既有控制有效性　·　補償控制與臨床限制　·　負向測試結果　·　到期日與退出條件</text><text x="190" y="558" fill="#9fc4e8" font-size="17">接受風險不是關閉問題，而是留下可追溯、可到期、可重新評估的決策。</text></g></svg>