<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc"><title id="title">手機版遠端醫療機器人信任邊界</title><desc id="desc">遠端操作者、通訊閘門、院內機器人、在地臨床安全層與證據面形成控制鏈。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="900" rx="28" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">遠端醫療機器人信任邊界</text><text x="38" y="98" fill="#9fb7d5" font-size="18">每一層都需要可量測的放行條件</text><rect x="45" y="140" width="630" height="118" rx="22" fill="#173b5d" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="190" fill="#ffffff" font-size="22" font-weight="800">遠端操作者</text><text x="72" y="226" fill="#d8e5f7" font-size="18" font-weight="400">核准人員、受管工作站、抗釣魚驗證</text><rect x="45" y="285" width="630" height="118" rx="22" fill="#19443e" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="335" fill="#ffffff" font-size="22" font-weight="800">會話與通訊閘門</text><text x="72" y="371" fill="#d8e5f7" font-size="18" font-weight="400">限時授權、延遲監測、指令簽章</text><rect x="45" y="430" width="630" height="118" rx="22" fill="#4a3420" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="480" fill="#ffffff" font-size="22" font-weight="800">院內機器人</text><text x="72" y="516" fill="#d8e5f7" font-size="18" font-weight="400">命令驗證、狀態回傳、安全停止</text><rect x="45" y="575" width="630" height="118" rx="22" fill="#332657" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="625" fill="#ffffff" font-size="22" font-weight="800">在地臨床安全層</text><text x="72" y="661" fill="#d8e5f7" font-size="18" font-weight="400">床邊確認、人工接管、替代處置</text><rect x="45" y="720" width="630" height="118" rx="22" fill="#123c55" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="770" fill="#ffffff" font-size="22" font-weight="800">獨立證據面</text><text x="72" y="806" fill="#d8e5f7" font-size="18" font-weight="400">操作者、指令、網路、設備與接管紀錄</text></g></svg>