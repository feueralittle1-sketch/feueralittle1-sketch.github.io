<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療 DNS 失敗模式與控制證據</title><desc id="desc">對照解析旁路、誤擋臨床服務、單點失效、日誌隱私與網域劫持五種風險的控制及驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182c"/><stop offset="1" stop-color="#171938"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="55" y="70" fill="#fff" font-size="34" font-weight="700">DNS 安全不能用封鎖率單一評分</text><text x="55" y="107" fill="#9fb3d9" font-size="19">每項控制同時檢查臨床可用性、安全效果與可追溯證據</text>
  <g font-size="19"><rect x="55" y="145" width="1090" height="62" rx="16" fill="#173654"/><text x="85" y="184" fill="#8fe8ff" font-weight="700">失敗模式</text><text x="405" y="184" fill="#8fe8ff" font-weight="700">控制方法</text><text x="820" y="184" fill="#8fe8ff" font-weight="700">通過證據</text>
  <g><rect x="55" y="220" width="1090" height="78" rx="15" fill="#102944"/><text x="85" y="254" fill="#ffb3cc" font-weight="700">端點繞過解析器</text><text x="85" y="280" fill="#b9c9df" font-size="16">自訂 DNS／未受控 DoH</text><text x="405" y="266" fill="#dce9fa">端點政策、網路出口限制、核准例外</text><text x="820" y="266" fill="#dce9fa">旁路測試失敗且例外有期限</text></g>
  <g><rect x="55" y="310" width="1090" height="78" rx="15" fill="#132d49"/><text x="85" y="344" fill="#ffcf8f" font-weight="700">誤擋臨床依賴</text><text x="85" y="370" fill="#b9c9df" font-size="16">藥事、檢驗或設備雲端中斷</text><text x="405" y="356" fill="#dce9fa">觀察模式、白名單審查、快速回退</text><text x="820" y="356" fill="#dce9fa">端到端成功率與解除時間達標</text></g>
  <g><rect x="55" y="400" width="1090" height="78" rx="15" fill="#102944"/><text x="85" y="434" fill="#ffb3cc" font-weight="700">解析服務單點失效</text><text x="85" y="460" fill="#b9c9df" font-size="16">設備看似在線但服務不可達</text><text x="405" y="446" fill="#dce9fa">分網段／異地解析器、健康檢查</text><text x="820" y="446" fill="#dce9fa">故障注入後於目標時間切換</text></g>
  <g><rect x="55" y="490" width="1090" height="78" rx="15" fill="#132d49"/><text x="85" y="524" fill="#d7cfff" font-weight="700">查詢日誌過度蒐集</text><text x="85" y="550" fill="#b9c9df" font-size="16">個人與照護情境可被推測</text><text x="405" y="536" fill="#dce9fa">最小化、分權、遮罩、保存期限</text><text x="820" y="536" fill="#dce9fa">欄位與存取抽查符合核准目的</text></g>
  <g><rect x="55" y="580" width="1090" height="78" rx="15" fill="#102944"/><text x="85" y="614" fill="#ffcf8f" font-weight="700">網域／權威資料遭竄改</text><text x="85" y="640" fill="#b9c9df" font-size="16">入口被導向錯誤或惡意服務</text><text x="405" y="626" fill="#dce9fa">註冊商強驗證、變更核准、DNSSEC</text><text x="820" y="626" fill="#dce9fa">未授權變更告警與復原演練</text></g></g><text x="55" y="690" fill="#8ba4c7" font-size="17">殘餘風險須標示影響服務、補償控制、責任人、期限與重新驗證條件。</text></g></svg>
