<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資安事件多軌通報架構</title><desc id="desc">同一醫療資安事件依技術應變、個資法律與臨床安全三條軌道分流，並由共同事件事實庫維持一致。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="60" y="72" fill="#f7fbff" font-size="34" font-weight="800">一個事件，不等於只有一張通報單</text><text x="60" y="108" fill="#9fb7d5" font-size="19">技術支援、個資義務與臨床安全各有不同目的、受理者與證據</text><g font-family="Arial, Noto Sans TC, sans-serif"><rect x="60" y="168" width="270" height="176" rx="25" fill="#112e4d" stroke="#63e6ff" stroke-width="2"/><text x="195" y="215" text-anchor="middle" fill="#63e6ff" font-size="24" font-weight="800">共同事件事實庫</text><text x="195" y="258" text-anchor="middle" fill="#e6eefc" font-size="18">時間線 · 受影響系統</text><text x="195" y="290" text-anchor="middle" fill="#e6eefc" font-size="18">資料與病人影響 · 措施</text><text x="195" y="322" text-anchor="middle" fill="#a9bdd9" font-size="16">版本與核准者可追溯</text><g stroke="#7adfff" stroke-width="5" fill="none"><path d="M330 256h94"/><path d="M424 256v-112h80"/><path d="M424 256h80"/><path d="M424 256v112h80"/></g><g><rect x="504" y="116" width="292" height="112" rx="22" fill="#12334f" stroke="#63e6ff" stroke-width="2"/><text x="536" y="158" fill="#63e6ff" font-size="23" font-weight="800">技術應變／支援</text><text x="536" y="195" fill="#dce9f8" font-size="18">IOC、攻擊路徑、協助需求</text><rect x="504" y="256" width="292" height="112" rx="22" fill="#2b2f58" stroke="#a997ff" stroke-width="2"/><text x="536" y="298" fill="#c3b8ff" font-size="23" font-weight="800">個資／法律評估</text><text x="536" y="335" fill="#eeeaff" font-size="18">資料類型、範圍、通知判定</text><rect x="504" y="396" width="292" height="112" rx="22" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="536" y="438" fill="#72f5cd" font-size="23" font-weight="800">臨床安全／營運</text><text x="536" y="475" fill="#ddfff4" font-size="18">停機、替代照護、病安追蹤</text></g><rect x="856" y="168" width="284" height="340" rx="26" fill="#0a1c32" stroke="#ffbe6b" stroke-width="2"/><text x="998" y="214" text-anchor="middle" fill="#ffd08a" font-size="24" font-weight="800">一致但不混用</text><g fill="#e6eefc" font-size="18"><text x="894" y="266">• 各軌分別判斷門檻</text><text x="894" y="310">• 分別記錄送件時間</text><text x="894" y="354">• 分別保存回覆與補件</text><text x="894" y="398">• 對外內容來自同一事實</text><text x="894" y="442">• 法域要求不得直接套用</text></g><g stroke="#ffbe6b" stroke-width="4"><path d="M796 172h44M796 312h44M796 452h44"/></g><rect x="148" y="566" width="904" height="70" rx="20" fill="#13253d"/><text x="600" y="608" text-anchor="middle" fill="#f7fbff" font-size="20" font-weight="700">治理重點：共用事實、分流判定、各自送件、持續更新、證據結案</text></g></svg>