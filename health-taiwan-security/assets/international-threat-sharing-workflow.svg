<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">醫療威脅情資七階段處置流程</title><desc id="desc">情資從接收、清理、驗證、關聯、分級、執行到回饋形成閉環。</desc><rect width="1200" height="675" rx="32" fill="#07111f"/><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">七階段把情資變成可驗收處置</text><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><g font-size="20" font-weight="700"><rect x="45" y="145" width="145" height="140" rx="24" fill="#123150" stroke="#63e6ff" stroke-width="3"/><text x="117" y="192" fill="#63e6ff">1 接收</text><text x="117" y="232" fill="#e6eefc">來源與標記</text><rect x="205" y="145" width="145" height="140" rx="24" fill="#18304d" stroke="#72c6ff" stroke-width="3"/><text x="277" y="192" fill="#72c6ff">2 清理</text><text x="277" y="232" fill="#e6eefc">去識別與去重</text><rect x="365" y="145" width="145" height="140" rx="24" fill="#222e50" stroke="#a997ff" stroke-width="3"/><text x="437" y="192" fill="#bdb2ff">3 驗證</text><text x="437" y="232" fill="#e6eefc">時效與信心</text><rect x="525" y="145" width="145" height="140" rx="24" fill="#272d4b" stroke="#d39cff" stroke-width="3"/><text x="597" y="192" fill="#e2b8ff">4 關聯</text><text x="597" y="232" fill="#e6eefc">資產與身分</text><rect x="685" y="145" width="145" height="140" rx="24" fill="#203640" stroke="#ffb86b" stroke-width="3"/><text x="757" y="192" fill="#ffcf99">5 分級</text><text x="757" y="232" fill="#e6eefc">臨床衝擊</text><rect x="845" y="145" width="145" height="140" rx="24" fill="#163b3b" stroke="#57f0c1" stroke-width="3"/><text x="917" y="192" fill="#79f4d0">6 執行</text><text x="917" y="232" fill="#e6eefc">偵測與控制</text><rect x="1005" y="145" width="145" height="140" rx="24" fill="#173444" stroke="#5de2ea" stroke-width="3"/><text x="1077" y="192" fill="#72edf3">7 回饋</text><text x="1077" y="232" fill="#e6eefc">結果與新證據</text></g><g stroke="#8fa8c9" stroke-width="5"><path d="M190 215H202"/><path d="M350 215H362"/><path d="M510 215H522"/><path d="M670 215H682"/><path d="M830 215H842"/><path d="M990 215H1002"/></g><rect x="80" y="355" width="1040" height="205" rx="30" fill="#0e2038" stroke="#314f75" stroke-width="2"/><text x="600" y="400" fill="#f4f8ff" font-size="25" font-weight="800">每階段的最低證據</text><g fill="#cbd9ed" font-size="20"><text x="245" y="450">來源、時間、標記</text><text x="600" y="450">資產命中與臨床情境</text><text x="945" y="450">動作、責任、期限</text><text x="245" y="505">刪除與遮罩紀錄</text><text x="600" y="505">優先序與核准理由</text><text x="945" y="505">結果、誤報、回退</text></g><text x="600" y="625" fill="#ffcf99" font-size="22">自動化可加速傳遞；阻擋高影響臨床流量前仍需風險門檻與人工確認</text></g></svg>