<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療影像完整性治理邊界</title><desc id="desc">影像設備、PACS、企業影像庫與臨床閱片經病人身分、刪除控制與獨立證據面連結。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#0e2442"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="64" y="76" fill="#f7fbff" font-size="34" font-weight="800">醫療影像不是單一檔案，而是一條可驗證的臨床證據鏈</text><text x="64" y="112" fill="#9fb7d5" font-size="19">身分、影像、報告、刪除指令與備份必須能互相對應</text>
<g font-family="Arial, Noto Sans TC, sans-serif"><rect x="58" y="176" width="210" height="170" rx="24" fill="#102d4b" stroke="#63e6ff" stroke-width="2"/><text x="163" y="222" text-anchor="middle" fill="#63e6ff" font-size="22" font-weight="700">影像來源</text><text x="163" y="266" text-anchor="middle" fill="#e6eefc" font-size="19">CT／MRI／X 光</text><text x="163" y="301" text-anchor="middle" fill="#a9bdd9" font-size="17">檢查號 · 病人身分</text>
<rect x="354" y="176" width="210" height="170" rx="24" fill="#102d4b" stroke="#9c8cff" stroke-width="2"/><text x="459" y="222" text-anchor="middle" fill="#b8aaff" font-size="22" font-weight="700">PACS 工作流</text><text x="459" y="266" text-anchor="middle" fill="#e6eefc" font-size="19">接收 · 路由 · 閱片</text><text x="459" y="301" text-anchor="middle" fill="#a9bdd9" font-size="17">狀態與操作紀錄</text>
<rect x="650" y="176" width="210" height="170" rx="24" fill="#102d4b" stroke="#57f0c1" stroke-width="2"/><text x="755" y="222" text-anchor="middle" fill="#72f5cd" font-size="22" font-weight="700">企業影像庫</text><text x="755" y="266" text-anchor="middle" fill="#e6eefc" font-size="19">主副本 · 版本 · 保留</text><text x="755" y="301" text-anchor="middle" fill="#a9bdd9" font-size="17">刪除與保留政策</text>
<rect x="946" y="176" width="196" height="170" rx="24" fill="#102d4b" stroke="#ffbe6b" stroke-width="2"/><text x="1044" y="222" text-anchor="middle" fill="#ffd08a" font-size="22" font-weight="700">臨床使用</text><text x="1044" y="266" text-anchor="middle" fill="#e6eefc" font-size="19">閱片 · 報告 · 治療</text><text x="1044" y="301" text-anchor="middle" fill="#a9bdd9" font-size="17">可用性與正確性</text>
<g stroke="#7adfff" stroke-width="5" fill="none"><path d="M268 261h72"/><path d="M564 261h72"/><path d="M860 261h72"/></g><g fill="#7adfff"><path d="M340 261l-16-10v20z"/><path d="M636 261l-16-10v20z"/><path d="M932 261l-16-10v20z"/></g>
<rect x="150" y="430" width="900" height="160" rx="28" fill="#0a1c32" stroke="#32577d" stroke-width="2"/><text x="600" y="472" text-anchor="middle" fill="#f7fbff" font-size="25" font-weight="800">獨立證據面</text><g font-size="18" text-anchor="middle"><rect x="190" y="500" width="185" height="58" rx="16" fill="#153b5c"/><text x="282" y="536" fill="#dff8ff">DICOM 稽核紀錄</text><rect x="404" y="500" width="185" height="58" rx="16" fill="#28345e"/><text x="496" y="536" fill="#eeeaff">雜湊與數量比對</text><rect x="618" y="500" width="185" height="58" rx="16" fill="#164b45"/><text x="710" y="536" fill="#ddfff4">不可變備份</text><rect x="832" y="500" width="178" height="58" rx="16" fill="#5a3a1a"/><text x="921" y="536" fill="#fff0d8">刪除雙重核准</text></g><path d="M600 346v72" stroke="#ff6f91" stroke-width="5" stroke-dasharray="10 9"/><circle cx="600" cy="394" r="9" fill="#ff6f91" filter="url(#glow)"/><text x="620" y="390" fill="#ff9ab0" font-size="18" font-weight="700">異常刪除或資料缺口</text></g></svg>