<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">醫療資安風險升級與重驗流程</title><desc id="desc">醫療機構由建立情境、對齊尺度、聚合依賴、決定回應、配置資源到持續重驗，形成六階段治理流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#16264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="60" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">六階段風險升級與重驗流程</text><text x="600" y="98" text-anchor="middle" fill="#9fb3d9" font-size="19">從單一技術缺口走到院級資源決策</text><path d="M190 240H260M430 240H500M670 240H740M910 240H980" stroke="#63e6ff" stroke-width="7" marker-end="url(#a)"/><path d="M1070 320C1070 500 915 520 840 520H325C220 520 145 470 145 390" fill="none" stroke="#57f0c1" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#a)"/>
<g text-anchor="middle"><rect x="35" y="150" width="160" height="180" rx="24" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="115" y="198" fill="#63e6ff" font-size="24" font-weight="800">01 情境</text><text x="115" y="242" fill="#d8e6fb" font-size="17">威脅、資產</text><text x="115" y="275" fill="#d8e6fb" font-size="17">臨床結果</text><rect x="275" y="150" width="160" height="180" rx="24" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="355" y="198" fill="#c5baff" font-size="24" font-weight="800">02 對齊</text><text x="355" y="242" fill="#e8e3ff" font-size="17">共同尺度</text><text x="355" y="275" fill="#e8e3ff" font-size="17">容忍門檻</text><rect x="515" y="150" width="160" height="180" rx="24" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="595" y="198" fill="#57f0c1" font-size="24" font-weight="800">03 聚合</text><text x="595" y="242" fill="#d9fff3" font-size="17">共同依賴</text><text x="595" y="275" fill="#d9fff3" font-size="17">連鎖風險</text><rect x="755" y="150" width="160" height="180" rx="24" fill="#31263d" stroke="#ffb86b" stroke-width="3"/><text x="835" y="198" fill="#ffcf99" font-size="24" font-weight="800">04 回應</text><text x="835" y="242" fill="#fff0dd" font-size="17">降低、移轉</text><text x="835" y="275" fill="#fff0dd" font-size="17">接受、避免</text><rect x="995" y="150" width="170" height="180" rx="24" fill="#2d2134" stroke="#ff7aa8" stroke-width="3"/><text x="1080" y="198" fill="#ff9fbe" font-size="24" font-weight="800">05 配置</text><text x="1080" y="242" fill="#ffe1eb" font-size="17">預算、人力</text><text x="1080" y="275" fill="#ffe1eb" font-size="17">時程、責任</text></g><rect x="330" y="430" width="540" height="145" rx="30" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="600" y="480" text-anchor="middle" fill="#a8c8ff" font-size="27" font-weight="800">06 監測與重驗</text><text x="600" y="522" text-anchor="middle" fill="#e6eefc" font-size="19">指標、事件、變更、期限與風險接受到期</text><text x="600" y="625" text-anchor="middle" fill="#ffcf99" font-size="20">每次升級都要保留來源、假設、決策人與下一次檢視日期</text></g></svg>