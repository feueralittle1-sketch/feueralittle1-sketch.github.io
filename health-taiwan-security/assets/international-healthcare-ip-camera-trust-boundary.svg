<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">院內 IP 攝影機信任邊界</title><desc id="desc">攝影機位於獨立設備區，影像只流向錄影服務；維運人員須經身分閘道與限時跳板，日誌另送監控區。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#112750"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">院內 IP 攝影機：影像流與管理流分開</text><text x="60" y="108" fill="#9fb3d9" font-size="20">不讓鏡頭直接連網，也不讓一般辦公端點直接管理設備</text>
<rect x="50" y="155" width="280" height="420" rx="28" fill="#0c1e38" stroke="#4b6a94" stroke-width="2"/><text x="82" y="200" fill="#8fe8ff" font-size="24" font-weight="700">設備區</text>
<g fill="#132d50" stroke="#63e6ff" stroke-width="2"><rect x="82" y="235" width="216" height="76" rx="16"/><rect x="82" y="335" width="216" height="76" rx="16"/><rect x="82" y="435" width="216" height="76" rx="16"/></g><g fill="#fff" font-size="22" font-weight="700"><text x="118" y="280">門診／走道鏡頭</text><text x="118" y="380">機房／出入口鏡頭</text><text x="118" y="480">資產、韌體、位置</text></g>
<rect x="425" y="155" width="330" height="420" rx="28" fill="#0c1e38" stroke="#7165b5" stroke-width="2"/><text x="458" y="200" fill="#b9adff" font-size="24" font-weight="700">受控服務區</text><rect x="458" y="236" width="264" height="92" rx="18" fill="#22234b" stroke="#9c8cff" stroke-width="2"/><text x="520" y="275" fill="#fff" font-size="23" font-weight="700">錄影／影像服務</text><text x="503" y="306" fill="#c9c4ff" font-size="18">只收允許來源的影像流</text><rect x="458" y="365" width="264" height="92" rx="18" fill="#16364b" stroke="#57f0c1" stroke-width="2"/><text x="510" y="404" fill="#fff" font-size="23" font-weight="700">身分閘道＋跳板</text><text x="493" y="435" fill="#b8ffe7" font-size="18">強驗證・限時・可錄製</text>
<rect x="850" y="155" width="300" height="420" rx="28" fill="#0c1e38" stroke="#4b6a94" stroke-width="2"/><text x="882" y="200" fill="#8fe8ff" font-size="24" font-weight="700">使用與證據區</text><rect x="882" y="236" width="236" height="84" rx="16" fill="#132d50"/><text x="932" y="286" fill="#fff" font-size="22" font-weight="700">授權影像席位</text><rect x="882" y="355" width="236" height="84" rx="16" fill="#132d50"/><text x="935" y="405" fill="#fff" font-size="22" font-weight="700">集中日誌／告警</text><rect x="882" y="474" width="236" height="58" rx="16" fill="#38213d" stroke="#ff7aa8"/><text x="936" y="511" fill="#ffd2e2" font-size="20" font-weight="700">網際網路：預設拒絕</text>
<g fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"><path d="M330 280H458"/><path d="M722 282H882"/><path d="M850 397H722"/><path d="M590 457V620H1000V439"/></g><g fill="#9fb3d9" font-size="18"><text x="350" y="266">影像流</text><text x="770" y="268">授權觀看</text><text x="744" y="383">管理入口</text><text x="625" y="647">組態、登入、韌體與異常行為證據</text></g>
<rect x="50" y="618" width="490" height="55" rx="16" fill="#152944" stroke="#57f0c1"/><text x="78" y="653" fill="#c9ffef" font-size="20" font-weight="700">核心原則：影像可用、管理可控、變更可追查</text>
</svg>