<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療 IoT 控制分配架構</title>
  <desc id="desc">醫療 IoT 裝置、整合閘道、臨床服務、管理監測與供應商支援之間的控制責任與證據流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#13254a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a52"/><stop offset="1" stop-color="#0f6170"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29234f"/><stop offset="1" stop-color="#4d3e89"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7de9ff"/></marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f3f8ff" font-size="34" font-weight="800">醫療 IoT 控制不是只放在裝置裡</text>
  <text x="60" y="103" fill="#a9bddc" font-size="20">原生能力不足時，由周邊架構補足控制成果，並保留可驗收證據</text>

  <g filter="url(#shadow)">
    <rect x="58" y="172" width="225" height="260" rx="24" fill="url(#violet)" stroke="#ad9cff" stroke-width="2"/>
    <text x="86" y="216" fill="#dcd5ff" font-size="23" font-weight="800">醫療 IoT 裝置</text>
    <text x="86" y="258" fill="#fff" font-size="19">• 裝置身分</text><text x="86" y="294" fill="#fff" font-size="19">• 組態保護</text><text x="86" y="330" fill="#fff" font-size="19">• 更新能力</text><text x="86" y="366" fill="#fff" font-size="19">• 狀態回報</text><text x="86" y="402" fill="#bfccec" font-size="17">受限：算力、壽命、認證</text>

    <rect x="350" y="172" width="250" height="260" rx="24" fill="url(#cyan)" stroke="#63e6ff" stroke-width="2"/>
    <text x="381" y="216" fill="#baf4ff" font-size="23" font-weight="800">整合與補償控制</text>
    <text x="381" y="258" fill="#fff" font-size="19">• 網路分段</text><text x="381" y="294" fill="#fff" font-size="19">• 通訊代理／白名單</text><text x="381" y="330" fill="#fff" font-size="19">• 身分與存取閘道</text><text x="381" y="366" fill="#fff" font-size="19">• 異常監測與隔離</text><text x="381" y="402" fill="#bfccec" font-size="17">目標：達成等效控制成果</text>

    <rect x="668" y="172" width="225" height="260" rx="24" fill="url(#violet)" stroke="#ad9cff" stroke-width="2"/>
    <text x="700" y="216" fill="#dcd5ff" font-size="23" font-weight="800">臨床服務</text>
    <text x="700" y="258" fill="#fff" font-size="19">• 電子病歷</text><text x="700" y="294" fill="#fff" font-size="19">• 影像／檢驗</text><text x="700" y="330" fill="#fff" font-size="19">• 中央監護</text><text x="700" y="366" fill="#fff" font-size="19">• 臨床告警</text><text x="700" y="402" fill="#bfccec" font-size="17">需驗證安全與可用性</text>

    <rect x="960" y="172" width="182" height="260" rx="24" fill="#142a3c" stroke="#57f0c1" stroke-width="2"/>
    <text x="987" y="216" fill="#a9ffe3" font-size="23" font-weight="800">供應商</text>
    <text x="987" y="258" fill="#fff" font-size="18">• 修補承諾</text><text x="987" y="294" fill="#fff" font-size="18">• 弱點通知</text><text x="987" y="330" fill="#fff" font-size="18">• 遠端支援</text><text x="987" y="366" fill="#fff" font-size="18">• EOL／EOS</text><text x="987" y="402" fill="#bfccec" font-size="17">契約與交付證據</text>
  </g>

  <path d="M283 300H344" stroke="#7de9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M600 300H662" stroke="#7de9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M960 350H905" stroke="#7de9ff" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="168" y="514" width="864" height="130" rx="28" fill="#0b1f35" stroke="#6e96c9" stroke-width="2"/>
  <text x="205" y="556" fill="#bfe8ff" font-size="23" font-weight="800">獨立治理與證據面</text>
  <text x="205" y="596" fill="#fff" font-size="19">資產與版本清冊　｜　控制責任人　｜　負向測試　｜　臨床回歸　｜　例外到期日　｜　事件與修補紀錄</text>
  <text x="205" y="625" fill="#a9bddc" font-size="17">任何一層變更，都要回到安全、臨床與復原三種驗收結果。</text>
  <path d="M475 432V504" stroke="#7de9ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M780 432V504" stroke="#7de9ff" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
