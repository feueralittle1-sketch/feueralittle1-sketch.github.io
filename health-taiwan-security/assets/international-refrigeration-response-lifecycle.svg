<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院冷鏈網路事件六階段處置流程</title><desc id="desc">從異常偵測、獨立確認、隔離降級、庫存判定、可信重建到回歸驗收，並以事件證據貫穿全程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">冷鏈事件要同時處理設備、溫度與庫存</text><text x="60" y="108" fill="#a8bddc" font-size="20">每一階段都留下時間、決策、責任與驗收證據</text><g font-family="Arial,Noto Sans TC,sans-serif"><g stroke-width="3"><rect x="55" y="190" width="165" height="220" rx="24" fill="#142f52" stroke="#63e6ff"/><rect x="240" y="190" width="165" height="220" rx="24" fill="#1c3151" stroke="#71a7ff"/><rect x="425" y="190" width="165" height="220" rx="24" fill="#2d2850" stroke="#a997ff"/><rect x="610" y="190" width="165" height="220" rx="24" fill="#3b2b43" stroke="#ffb86b"/><rect x="795" y="190" width="165" height="220" rx="24" fill="#193b44" stroke="#57f0c1"/><rect x="980" y="190" width="165" height="220" rx="24" fill="#38233d" stroke="#ff7aa8"/></g><g fill="#fff" font-size="23" font-weight="800" text-anchor="middle"><text x="137" y="240">1 異常偵測</text><text x="322" y="240">2 獨立確認</text><text x="507" y="240">3 隔離降級</text><text x="692" y="240">4 庫存判定</text><text x="877" y="240">5 可信重建</text><text x="1062" y="240">6 回歸驗收</text></g><g fill="#d2dfef" font-size="18" text-anchor="middle"><text x="137" y="290">告警、連線、組態</text><text x="137" y="325">電力、門磁、現場</text><text x="322" y="290">獨立溫度紀錄</text><text x="322" y="325">時間與資料缺口</text><text x="507" y="290">切斷受影響路徑</text><text x="507" y="325">本地／人工運作</text><text x="692" y="290">轉移與待判定標記</text><text x="692" y="325">放行／隔離／報廢</text><text x="877" y="290">憑證、韌體、組態</text><text x="877" y="325">日誌與信任重建</text><text x="1062" y="290">溫度、告警、會話</text><text x="1062" y="325">臨床流程與復盤</text></g><g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M220 300H232"/><path d="M405 300H417"/><path d="M590 300H602"/><path d="M775 300H787"/><path d="M960 300H972"/></g><rect x="120" y="500" width="960" height="125" rx="26" fill="#102b45" stroke="#4edff5" stroke-width="3"/><text x="160" y="550" fill="#fff" font-size="26" font-weight="800">貫穿證據鏈</text><text x="160" y="592" fill="#cce8f3" font-size="20">事件時間線　｜　設備與庫存清冊　｜　溫度原始資料　｜　操作與核准紀錄　｜　例外與驗收結果</text><path d="M600 410V490" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/></g></svg>