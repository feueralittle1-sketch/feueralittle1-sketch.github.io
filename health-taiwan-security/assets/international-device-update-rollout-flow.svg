<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備更新分批放行流程</title><desc id="desc">更新需求依序通過範圍確認、套件驗證、測試、試點、臨床放行、分批部署及結案，任何停止條件成立即暫停或回退。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102447"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Inter,Noto Sans TC,sans-serif"><text x="55" y="70" fill="#f4f8ff" font-size="34" font-weight="800">七道放行閘門限制更新爆炸半徑</text><text x="55" y="108" fill="#9fb3d9" font-size="20">技術成功不等於臨床可用；每一批都要能停止、回退與追查</text><g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#ar)"><path d="M175 235H235"/><path d="M375 235H435"/><path d="M575 235H635"/><path d="M775 235H835"/><path d="M975 235H1035"/></g><g fill="#102c4b" stroke="#71a7ff" stroke-width="2"><rect x="35" y="165" width="140" height="140" rx="22"/><rect x="235" y="165" width="140" height="140" rx="22"/><rect x="435" y="165" width="140" height="140" rx="22"/><rect x="635" y="165" width="140" height="140" rx="22"/><rect x="835" y="165" width="140" height="140" rx="22"/><rect x="1035" y="165" width="130" height="140" rx="22"/></g><g fill="#e6eefc" text-anchor="middle" font-size="19" font-weight="700"><text x="105" y="215">範圍確認</text><text x="105" y="250">型號／版本</text><text x="305" y="215">套件驗證</text><text x="305" y="250">來源／簽章</text><text x="505" y="215">隔離測試</text><text x="505" y="250">功能／介接</text><text x="705" y="215">代表性試點</text><text x="705" y="250">少量設備</text><text x="905" y="215">臨床放行</text><text x="905" y="250">安全／有效</text><text x="1100" y="215">分批擴大</text><text x="1100" y="250">監測／結案</text></g><rect x="110" y="390" width="980" height="210" rx="28" fill="#151f3d" stroke="#ff8fa3" stroke-width="2"/><text x="150" y="435" fill="#ffb3c1" font-size="21" font-weight="800">停止或回退條件</text><g fill="#e6eefc" font-size="20"><text x="150" y="480">• 簽章或套件指紋不符　• 型號、版本或相依條件不符　• 更新後無法安全開機</text><text x="150" y="520">• 病人資料、時間、警報或介接異常　• 臨床核心功能超出允許失敗門檻</text><text x="150" y="560">• 回退映像不可用、回退失敗或版本降級造成已知風險　• 監測證據不足</text></g><text x="600" y="660" text-anchor="middle" fill="#9fb3d9" font-size="19">更新成功率、回退時間與臨床驗收通過率應以實際設備批次計算。</text></g></svg>