<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療影像資料缺口處置流程</title><desc id="desc">從停止刪除、界定範圍、保全證據、恢復副本、病人配對到臨床放行的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#13284a"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="62" y="75" fill="#f7fbff" font-size="34" font-weight="800">影像資料缺口必須經過六道閘門，不能直接回灌上線</text><text x="62" y="112" fill="#9fb7d5" font-size="19">技術還原完成後，仍須確認病人配對、檢查完整與臨床可用</text><g font-family="Arial, Noto Sans TC, sans-serif"><g font-size="19" text-anchor="middle"><rect x="55" y="190" width="165" height="190" rx="24" fill="#17334f" stroke="#63e6ff" stroke-width="2"/><text x="137" y="235" fill="#63e6ff" font-size="24" font-weight="800">01</text><text x="137" y="278" fill="#fff" font-weight="700">停止刪除</text><text x="137" y="318" fill="#b7c9e2">隔離功能</text><text x="137" y="350" fill="#b7c9e2">凍結變更</text><rect x="240" y="190" width="165" height="190" rx="24" fill="#203151" stroke="#8caeff" stroke-width="2"/><text x="322" y="235" fill="#a9c4ff" font-size="24" font-weight="800">02</text><text x="322" y="278" fill="#fff" font-weight="700">界定範圍</text><text x="322" y="318" fill="#b7c9e2">病人／檢查</text><text x="322" y="350" fill="#b7c9e2">節點／時段</text><rect x="425" y="190" width="165" height="190" rx="24" fill="#29305a" stroke="#b59cff" stroke-width="2"/><text x="507" y="235" fill="#c5b3ff" font-size="24" font-weight="800">03</text><text x="507" y="278" fill="#fff" font-weight="700">保全證據</text><text x="507" y="318" fill="#b7c9e2">日誌／雜湊</text><text x="507" y="350" fill="#b7c9e2">操作時間線</text><rect x="610" y="190" width="165" height="190" rx="24" fill="#174943" stroke="#57f0c1" stroke-width="2"/><text x="692" y="235" fill="#72f5cd" font-size="24" font-weight="800">04</text><text x="692" y="278" fill="#fff" font-weight="700">隔離還原</text><text x="692" y="318" fill="#b7c9e2">可信副本</text><text x="692" y="350" fill="#b7c9e2">禁止覆寫</text><rect x="795" y="190" width="165" height="190" rx="24" fill="#4b3b1e" stroke="#ffc56e" stroke-width="2"/><text x="877" y="235" fill="#ffd18a" font-size="24" font-weight="800">05</text><text x="877" y="278" fill="#fff" font-weight="700">臨床對帳</text><text x="877" y="318" fill="#b7c9e2">病人配對</text><text x="877" y="350" fill="#b7c9e2">序列完整</text><rect x="980" y="190" width="165" height="190" rx="24" fill="#4b2438" stroke="#ff7fa6" stroke-width="2"/><text x="1062" y="235" fill="#ff9ab7" font-size="24" font-weight="800">06</text><text x="1062" y="278" fill="#fff" font-weight="700">受控放行</text><text x="1062" y="318" fill="#b7c9e2">分批回寫</text><text x="1062" y="350" fill="#b7c9e2">例外追蹤</text></g><g stroke="#8ceaff" stroke-width="4"><path d="M220 285h20M405 285h20M590 285h20M775 285h20M960 285h20"/></g><rect x="108" y="470" width="984" height="120" rx="24" fill="#091b31" stroke="#345b80"/><text x="600" y="512" text-anchor="middle" fill="#f7fbff" font-size="23" font-weight="800">三個放行條件</text><text x="265" y="558" text-anchor="middle" fill="#dff8ff" font-size="19">① 數量與雜湊一致</text><text x="600" y="558" text-anchor="middle" fill="#ddfff4" font-size="19">② 病人／檢查／報告正確連結</text><text x="935" y="558" text-anchor="middle" fill="#fff0d8" font-size="19">③ 代表性閱片流程通過</text></g></svg>