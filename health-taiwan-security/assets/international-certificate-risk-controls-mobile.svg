<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc"><title id="title">手機版醫療憑證風險與控制</title><desc id="desc">憑證到期、信任鏈錯誤、私鑰外洩與更換失敗對應控制與驗證證據。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172b58"/></linearGradient></defs><rect width="720" height="1240" rx="32" fill="url(#g)"/><text x="42" y="68" fill="#fff" font-size="34" font-weight="800">憑證風險與控制證據</text><text x="42" y="110" fill="#a9bddb" font-size="23">告警、驗證與回退缺一不可</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="65" y="155" width="590" height="225" rx="26" fill="#341d35" stroke="#ff86bd" stroke-width="3"/><text x="105" y="207" fill="#ff9ac8" font-size="28" font-weight="700">到期或漏管</text><text x="105" y="250" fill="#fff" font-size="23">風險：服務拒絕連線、未知憑證無人續期</text><text x="105" y="295" fill="#82f7cc" font-size="22" font-weight="700">控制：自動發現、多級告警、主責與替補</text><text x="105" y="338" fill="#a9bddb" font-size="21">證據：清冊覆蓋率、告警確認與續期時效</text><rect x="65" y="405" width="590" height="225" rx="26" fill="#2d294d" stroke="#a491ff" stroke-width="3"/><text x="105" y="457" fill="#c3b8ff" font-size="28" font-weight="700">信任鏈錯誤</text><text x="105" y="500" fill="#fff" font-size="23">風險：中繼缺漏、主機名稱或相容性不符</text><text x="105" y="545" fill="#82f7cc" font-size="22" font-weight="700">控制：預演、外部探測、端到端交易測試</text><text x="105" y="588" fill="#a9bddb" font-size="21">證據：握手紀錄、相容矩陣、臨床回歸結果</text><rect x="65" y="655" width="590" height="225" rx="26" fill="#3b252a" stroke="#ff9d73" stroke-width="3"/><text x="105" y="707" fill="#ffb18f" font-size="28" font-weight="700">私鑰外洩</text><text x="105" y="750" fill="#fff" font-size="23">風險：服務身分遭冒用、加密信任遭破壞</text><text x="105" y="795" fill="#82f7cc" font-size="22" font-weight="700">控制：金鑰隔離、最小權限、撤銷重發</text><text x="105" y="838" fill="#a9bddb" font-size="21">證據：撤銷時間、新舊金鑰切換紀錄</text><rect x="65" y="905" width="590" height="225" rx="26" fill="#173b3b" stroke="#72f0c1" stroke-width="3"/><text x="105" y="957" fill="#82f7cc" font-size="28" font-weight="700">更換失敗</text><text x="105" y="1000" fill="#fff" font-size="23">風險：批次中斷、舊設備不支援新信任鏈</text><text x="105" y="1045" fill="#82f7cc" font-size="22" font-weight="700">控制：分批部署、停止門檻、保留回退</text><text x="105" y="1088" fill="#a9bddb" font-size="21">證據：批次成功率、回退演練與復原時間</text></g><text x="360" y="1185" text-anchor="middle" fill="#d9e8fb" font-size="21">每項風險都要具備預防、偵測、復原與可追溯紀錄</text></svg>
