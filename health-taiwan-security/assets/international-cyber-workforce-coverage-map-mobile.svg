<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">醫院資安工作角色與臨床服務覆蓋圖手機版</title><desc id="desc">臨床核心服務由監控、事件指揮、身分權限及備份復原工作角色支援，每項任務配置主責與備援。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#11163a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="720" height="1120" rx="30" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><text x="360" y="68" fill="#fff" font-size="31" font-weight="800">工作角色覆蓋圖</text><text x="360" y="106" fill="#9fb3d9" font-size="18">從臨床服務反推主責、備援與交接</text><rect x="80" y="150" width="560" height="150" rx="28" fill="#16344a" stroke="#63e6ff" stroke-width="3"/><text x="360" y="207" fill="#fff" font-size="28" font-weight="800">臨床核心服務</text><text x="360" y="250" fill="#b9c9e5" font-size="18">急診｜病歷｜影像｜檢驗｜藥事</text><g fill="#102b42" stroke="#8fe8ff" stroke-width="2"><rect x="100" y="370" width="520" height="120" rx="22"/><rect x="100" y="545" width="520" height="120" rx="22"/><rect x="100" y="720" width="520" height="120" rx="22"/><rect x="100" y="895" width="520" height="120" rx="22"/></g><g fill="#fff" font-size="24" font-weight="700"><text x="360" y="416">監控與研判</text><text x="360" y="591">事件指揮</text><text x="360" y="766">身分與權限</text><text x="360" y="941">備份與復原</text></g><g fill="#b9c9e5" font-size="17"><text x="360" y="454">告警分流｜主責＋備援</text><text x="360" y="629">臨床協調｜值班＋升級</text><text x="360" y="804">停權作業｜雙人覆核</text><text x="360" y="979">乾淨還原｜交接驗收</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M360 300V355"/><path d="M360 490V530"/><path d="M360 665V705"/><path d="M360 840V880"/></g><text x="360" y="1070" fill="#c9c2ff" font-size="18" font-weight="700">外包角色同樣納入權限、能力與演練證據</text></g></svg>