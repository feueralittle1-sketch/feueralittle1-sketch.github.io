<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FHIR 批次匯出控制流程</title>
  <desc id="desc">從用途核准、能力確認、授權與最小範圍、非同步匯出、受控下載、到期撤銷到證據複核的七階段流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10254a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="60" y="70" fill="#fff" font-size="32" font-weight="800">FHIR 批次匯出：把大量交付做成可終止流程</text>
  <text x="60" y="108" fill="#a8bad8" font-size="20">每一階段都要有輸入、責任人、驗收證據與停止條件。</text>

  <g font-family="Inter, Noto Sans TC, sans-serif">
    <rect x="55" y="165" width="135" height="125" rx="22" fill="#10243e" stroke="#57f0c1" stroke-width="2"/><text x="122" y="204" fill="#8ff7df" font-size="20" font-weight="700" text-anchor="middle">1 用途核准</text><text x="122" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">法源／契約</text><text x="122" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">最小必要</text>
    <rect x="215" y="165" width="135" height="125" rx="22" fill="#102748" stroke="#71a7ff" stroke-width="2"/><text x="282" y="204" fill="#9fc3ff" font-size="20" font-weight="700" text-anchor="middle">2 能力確認</text><text x="282" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">端點／版本</text><text x="282" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">支援範圍</text>
    <rect x="375" y="165" width="135" height="125" rx="22" fill="#172647" stroke="#a997ff" stroke-width="2"/><text x="442" y="204" fill="#c4b7ff" font-size="20" font-weight="700" text-anchor="middle">3 授權限制</text><text x="442" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">主體／scope</text><text x="442" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">短效憑證</text>
    <rect x="535" y="165" width="135" height="125" rx="22" fill="#10243e" stroke="#63e6ff" stroke-width="2"/><text x="602" y="204" fill="#8fe8ff" font-size="20" font-weight="700" text-anchor="middle">4 非同步匯出</text><text x="602" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">工作識別</text><text x="602" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">容量限制</text>
    <rect x="695" y="165" width="135" height="125" rx="22" fill="#102748" stroke="#71a7ff" stroke-width="2"/><text x="762" y="204" fill="#9fc3ff" font-size="20" font-weight="700" text-anchor="middle">5 受控下載</text><text x="762" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">短效連結</text><text x="762" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">完整性驗證</text>
    <rect x="855" y="165" width="135" height="125" rx="22" fill="#172647" stroke="#a997ff" stroke-width="2"/><text x="922" y="204" fill="#c4b7ff" font-size="20" font-weight="700" text-anchor="middle">6 到期撤銷</text><text x="922" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">刪除輸出</text><text x="922" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">終止存取</text>
    <rect x="1015" y="165" width="135" height="125" rx="22" fill="#10243e" stroke="#57f0c1" stroke-width="2"/><text x="1082" y="204" fill="#8ff7df" font-size="20" font-weight="700" text-anchor="middle">7 證據複核</text><text x="1082" y="240" fill="#e6eefc" font-size="17" text-anchor="middle">差異／異常</text><text x="1082" y="266" fill="#e6eefc" font-size="17" text-anchor="middle">改進控制</text>
  </g>
  <g stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"><path d="M190 227H205"/><path d="M350 227H365"/><path d="M510 227H525"/><path d="M670 227H685"/><path d="M830 227H845"/><path d="M990 227H1005"/></g>

  <rect x="75" y="365" width="1050" height="190" rx="28" fill="#0b1930" stroke="#334b74"/>
  <text x="110" y="410" fill="#fff" font-size="25" font-weight="700">三道強制閘門</text>
  <rect x="110" y="440" width="290" height="75" rx="18" fill="#123047"/><text x="255" y="470" fill="#8ff7df" font-size="20" font-weight="700" text-anchor="middle">開始前</text><text x="255" y="497" fill="#d6e2f5" font-size="17" text-anchor="middle">目的、群組、資源型別與期限核准</text>
  <rect x="455" y="440" width="290" height="75" rx="18" fill="#172647"/><text x="600" y="470" fill="#c4b7ff" font-size="20" font-weight="700" text-anchor="middle">交付前</text><text x="600" y="497" fill="#d6e2f5" font-size="17" text-anchor="middle">數量、完整性、接收端與加密驗證</text>
  <rect x="800" y="440" width="290" height="75" rx="18" fill="#123047"/><text x="945" y="470" fill="#8ff7df" font-size="20" font-weight="700" text-anchor="middle">結束後</text><text x="945" y="497" fill="#d6e2f5" font-size="17" text-anchor="middle">連結失效、輸出清除與證據封存</text>
  <path d="M1082 290V335H122V300" fill="none" stroke="#a997ff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="600" y="615" fill="#9fb3d9" font-size="19" text-anchor="middle">複核結果回饋到下一次用途與能力審查，避免永久授權與無限期輸出。</text>
</svg>
