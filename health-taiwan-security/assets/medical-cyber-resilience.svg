<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">醫療資安韌性六大治理能力</title><desc id="desc">以臨床服務不中斷為中心，連結備援復原、核心檢測、權限治理、勒索演練、主權雲及持續監控六項能力。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1730"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/><g stroke="#1e293b" stroke-width="1" opacity=".65"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200"/><path d="M80 0V680M160 0V680M240 0V680M320 0V680M400 0V680M480 0V680M560 0V680M640 0V680M720 0V680M800 0V680M880 0V680M960 0V680M1040 0V680M1120 0V680"/></g>
  <text x="60" y="66" fill="#f8fafc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="30" font-weight="700">醫療資安韌性：六項能力要一起運作</text><text x="60" y="101" fill="#9fb3d9" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">設備只是工具，最終目標是事件發生時仍能維持安全的臨床服務</text>
  <g fill="none" stroke="#63e6ff" stroke-width="3" opacity=".72" marker-end="url(#arrow)"><path d="M355 232 C455 245 470 290 510 310"/><path d="M355 445 C455 435 470 390 510 370"/><path d="M845 232 C745 245 730 290 690 310"/><path d="M845 445 C745 435 730 390 690 370"/><path d="M600 215V280"/><path d="M600 465V405"/></g>
  <g font-family="Arial,'Noto Sans TC',sans-serif"><g><rect x="470" y="280" width="260" height="130" rx="24" fill="#0f2433" stroke="#63e6ff" stroke-width="3" filter="url(#glow)"/><text x="600" y="330" text-anchor="middle" fill="#63e6ff" font-size="18" font-weight="700">核心目標</text><text x="600" y="370" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">臨床服務不中斷</text></g>
  <g><rect x="70" y="155" width="285" height="120" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="96" y="195" fill="#34d399" font-size="19" font-weight="700">01 備援與復原</text><text x="96" y="229" fill="#cbd5e1" font-size="16">異地、雙活、還原與切換演練</text></g>
  <g><rect x="70" y="385" width="285" height="120" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="2"/><text x="96" y="425" fill="#fb7185" font-size="19" font-weight="700">02 核心安全檢測</text><text x="96" y="459" fill="#cbd5e1" font-size="16">範圍、修補、複測、例外接受</text></g>
  <g><rect x="458" y="125" width="284" height="95" rx="18" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="484" y="164" fill="#a78bfa" font-size="19" font-weight="700">03 權限治理</text><text x="484" y="194" fill="#cbd5e1" font-size="16">最小權限、破窗、行為偵測</text></g>
  <g><rect x="458" y="465" width="284" height="95" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="484" y="504" fill="#fbbf24" font-size="19" font-weight="700">04 勒索演練</text><text x="484" y="534" fill="#cbd5e1" font-size="16">隔離、降級、通報、復原</text></g>
  <g><rect x="845" y="155" width="285" height="120" rx="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="871" y="195" fill="#22d3ee" font-size="19" font-weight="700">05 主權雲治理</text><text x="871" y="229" fill="#cbd5e1" font-size="16">資料邊界、合約、退出機制</text></g>
  <g><rect x="845" y="385" width="285" height="120" rx="18" fill="#0f172a" stroke="#fb923c" stroke-width="2"/><text x="871" y="425" fill="#fb923c" font-size="19" font-weight="700">06 持續監控</text><text x="871" y="459" fill="#cbd5e1" font-size="16">MDR、XDR、零信任、不可抹除</text></g></g>
  <text x="60" y="635" fill="#64748b" font-family="Arial,'Noto Sans TC',sans-serif" font-size="15">Dr. William｜健康台灣深耕計畫－資安治理專欄</text>
</svg>