<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療最低可行運作的臨床優先架構</title>
<desc id="desc">急重症、用藥、檢驗與影像等臨床服務，依賴身分、網路、資料、設備及人力，經事件指揮設定最低安全容量與替代流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="58" y="65" fill="#fff" font-size="34" font-weight="700">最低可行運作：先保住安全照護，再恢復完整服務</text><text x="58" y="103" fill="#9fb3d9" font-size="20">Minimum Viable Operations 不是縮小版正常營運，而是事件期間可被驗證的最低安全能力</text>
<rect x="415" y="206" width="370" height="250" rx="30" fill="#132d52" stroke="#63e6ff" stroke-width="3" filter="url(#g)"/><text x="600" y="258" text-anchor="middle" fill="#63e6ff" font-size="22" font-weight="700">事件指揮與臨床決策</text><text x="600" y="310" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">最低安全容量</text><text x="600" y="353" text-anchor="middle" fill="#c6d4eb" font-size="20">服務範圍・病人流量・替代流程</text><text x="600" y="390" text-anchor="middle" fill="#c6d4eb" font-size="20">啟動門檻・風險接受・退出條件</text><text x="600" y="426" text-anchor="middle" fill="#57f0c1" font-size="18" font-weight="700">每次狀態變更都需臨床與技術共同放行</text>
<g font-family="sans-serif"><rect x="65" y="160" width="270" height="145" rx="24" fill="#12213d" stroke="#71a7ff" stroke-width="2"/><text x="200" y="205" text-anchor="middle" fill="#71a7ff" font-size="22" font-weight="700">必要臨床結果</text><text x="200" y="247" text-anchor="middle" fill="#fff" font-size="20">急重症・用藥・檢驗</text><text x="200" y="278" text-anchor="middle" fill="#9fb3d9" font-size="18">影像・病人辨識</text><path d="M335 232H403" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/>
<rect x="65" y="385" width="270" height="145" rx="24" fill="#12213d" stroke="#9c8cff" stroke-width="2"/><text x="200" y="430" text-anchor="middle" fill="#b9aaff" font-size="22" font-weight="700">替代照護方式</text><text x="200" y="472" text-anchor="middle" fill="#fff" font-size="20">紙本・人工核對・轉診</text><text x="200" y="503" text-anchor="middle" fill="#9fb3d9" font-size="18">限量服務與優先分流</text><path d="M335 457H403" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/>
<rect x="865" y="160" width="270" height="145" rx="24" fill="#12213d" stroke="#57f0c1" stroke-width="2"/><text x="1000" y="205" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="700">共同依賴</text><text x="1000" y="247" text-anchor="middle" fill="#fff" font-size="20">身分・網路・資料・設備</text><text x="1000" y="278" text-anchor="middle" fill="#9fb3d9" font-size="18">人力・供應商・設施</text><path d="M797 232H855" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/>
<rect x="865" y="385" width="270" height="145" rx="24" fill="#12213d" stroke="#ffb86b" stroke-width="2"/><text x="1000" y="430" text-anchor="middle" fill="#ffbf7a" font-size="22" font-weight="700">驗證證據</text><text x="1000" y="472" text-anchor="middle" fill="#fff" font-size="20">功能測試・資料完整性</text><text x="1000" y="503" text-anchor="middle" fill="#9fb3d9" font-size="18">權限、監控與回退結果</text><path d="M797 457H855" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/></g>
<rect x="235" y="574" width="730" height="66" rx="22" fill="#0d3540" stroke="#57f0c1"/><text x="600" y="615" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">最低可行運作以病人安全與服務結果定義，不以伺服器開機數量定義</text>
</svg>