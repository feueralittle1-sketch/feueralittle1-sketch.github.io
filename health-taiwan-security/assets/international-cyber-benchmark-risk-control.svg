<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">跨院資安評估的風險與控制對照</title><desc id="desc">將範圍不一致、敏感資料外洩、分數被操弄、資料過期及只做排名五種風險，對應到分層、最小化、證據抽查、有效期及改善責任控制。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#241a3d"/></linearGradient></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><text x="58" y="70" fill="#fff" font-size="34" font-weight="800">跨院評估的五個失真點</text><text x="58" y="108" fill="#aabbd6" font-size="20">比較結果必須帶著範圍、證據與不確定性一起閱讀</text><g font-family="Arial, Noto Sans TC, sans-serif"><g fill="#3a2132" stroke="#ff7f9e" stroke-width="2"><rect x="58" y="155" width="400" height="86" rx="18"/><rect x="58" y="260" width="400" height="86" rx="18"/><rect x="58" y="365" width="400" height="86" rx="18"/><rect x="58" y="470" width="400" height="86" rx="18"/><rect x="58" y="575" width="400" height="86" rx="18"/></g><g fill="#15394a" stroke="#57f0c1" stroke-width="2"><rect x="742" y="155" width="400" height="86" rx="18"/><rect x="742" y="260" width="400" height="86" rx="18"/><rect x="742" y="365" width="400" height="86" rx="18"/><rect x="742" y="470" width="400" height="86" rx="18"/><rect x="742" y="575" width="400" height="86" rx="18"/></g><g fill="#fff" font-size="22" font-weight="700"><text x="90" y="207">不同服務被硬放在同一排名</text><text x="90" y="312">原始弱點或資產明細外洩</text><text x="90" y="417">為了高分而選擇性填答</text><text x="90" y="522">舊資料被當成目前狀態</text><text x="90" y="627">報表完成後沒有改善行動</text></g><g fill="#d8fff2" font-size="22" font-weight="700"><text x="775" y="207">依規模、服務與範圍分層</text><text x="775" y="312">最小化、去識別與權限分離</text><text x="775" y="417">證據抽查、核准與異常偵測</text><text x="775" y="522">版本、有效期與變更觸發重測</text><text x="775" y="627">責任人、期限、資源與驗收證據</text></g><g stroke="#63e6ff" stroke-width="4" fill="none"><path d="M458 198H735"/><path d="M458 303H735"/><path d="M458 408H735"/><path d="M458 513H735"/><path d="M458 618H735"/></g><circle cx="600" cy="198" r="22" fill="#102846" stroke="#63e6ff" stroke-width="3"/><circle cx="600" cy="303" r="22" fill="#102846" stroke="#63e6ff" stroke-width="3"/><circle cx="600" cy="408" r="22" fill="#102846" stroke="#63e6ff" stroke-width="3"/><circle cx="600" cy="513" r="22" fill="#102846" stroke="#63e6ff" stroke-width="3"/><circle cx="600" cy="618" r="22" fill="#102846" stroke="#63e6ff" stroke-width="3"/><g fill="#fff" font-size="20" font-weight="800" text-anchor="middle"><text x="600" y="205">→</text><text x="600" y="310">→</text><text x="600" y="415">→</text><text x="600" y="520">→</text><text x="600" y="625">→</text></g></g></svg>
