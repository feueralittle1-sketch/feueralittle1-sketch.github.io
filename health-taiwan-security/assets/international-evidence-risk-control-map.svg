<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">機器可讀資安證據的風險與控制</title><desc id="desc">資料過期、範圍錯配、自動化誤判、敏感資訊暴露及格式鎖定等風險，分別對應新鮮度、人工覆核、最小揭露與可攜性控制。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f4f8ff" font-size="34" font-weight="800">證據自動化的五項失敗模式</text><g font-size="18"><text x="90" y="122" fill="#ff9fbe" font-size="23" font-weight="800">風險</text><text x="510" y="122" fill="#63e6ff" font-size="23" font-weight="800">必要控制</text><text x="920" y="122" fill="#57f0c1" font-size="23" font-weight="800">驗收證據</text>
<g><rect x="55" y="145" width="1090" height="82" rx="20" fill="#10213d" stroke="#ffffff" stroke-opacity=".1"/><text x="90" y="183" fill="#ffb4ca" font-weight="700">資料已過期</text><text x="510" y="183" fill="#d8e6fb">設定有效期、來源時間與自動失效</text><text x="920" y="183" fill="#d9fff3">過期率、刷新時間、失效紀錄</text>
<rect x="55" y="237" width="1090" height="82" rx="20" fill="#132541" stroke="#ffffff" stroke-opacity=".1"/><text x="90" y="275" fill="#ffb4ca" font-weight="700">範圍錯配</text><text x="510" y="275" fill="#d8e6fb">綁定資產、版本、環境與臨床服務</text><text x="920" y="275" fill="#d9fff3">抽樣核對、未配對清單</text>
<rect x="55" y="329" width="1090" height="82" rx="20" fill="#10213d" stroke="#ffffff" stroke-opacity=".1"/><text x="90" y="367" fill="#ffb4ca" font-weight="700">自動判定失真</text><text x="510" y="367" fill="#d8e6fb">保留人工覆核、信心與反證欄位</text><text x="920" y="367" fill="#d9fff3">覆核差異、誤判率、核准者</text>
<rect x="55" y="421" width="1090" height="82" rx="20" fill="#132541" stroke="#ffffff" stroke-opacity=".1"/><text x="90" y="459" fill="#ffb4ca" font-weight="700">敏感資訊外洩</text><text x="510" y="459" fill="#d8e6fb">最小揭露、分級、加密與權限分離</text><text x="920" y="459" fill="#d9fff3">欄位白名單、存取與匯出紀錄</text>
<rect x="55" y="513" width="1090" height="82" rx="20" fill="#10213d" stroke="#ffffff" stroke-opacity=".1"/><text x="90" y="551" fill="#ffb4ca" font-weight="700">工具與格式鎖定</text><text x="510" y="551" fill="#d8e6fb">開放格式、版本控管與匯出測試</text><text x="920" y="551" fill="#d9fff3">跨工具驗證、還原與退出演練</text></g></g><text x="600" y="640" text-anchor="middle" fill="#9fb3d9" font-size="19">機器可讀不等於機器可決策；證據品質與臨床語境必須同時驗收</text></g></svg>
