<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1250" role="img" aria-labelledby="title desc"><title id="title">手機版醫療系統安全計畫生命週期</title><desc id="desc">六階段流程由臨床定界依序到變更重驗，並循環回到新的定界。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c2540"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1250" rx="32" fill="url(#bg)"/><text x="42" y="62" fill="#fff" font-size="29" font-weight="700">安全計畫六階段生命週期</text><text x="42" y="100" fill="#9fb3d9" font-size="18">版本、責任、差異與驗證證據持續更新</text><g font-family="sans-serif" text-anchor="middle"><g fill="#12213d" stroke-width="2"><rect x="90" y="145" width="540" height="130" rx="24" stroke="#63e6ff"/><rect x="90" y="325" width="540" height="130" rx="24" stroke="#71a7ff"/><rect x="90" y="505" width="540" height="130" rx="24" stroke="#9c8cff"/><rect x="90" y="685" width="540" height="130" rx="24" stroke="#57f0c1"/><rect x="90" y="865" width="540" height="130" rx="24" stroke="#ffb86b"/><rect x="90" y="1045" width="540" height="130" rx="24" stroke="#ff7aa8"/></g><text x="360" y="195" fill="#63e6ff" font-size="23" font-weight="700">01 臨床定界</text><text x="360" y="235" fill="#fff" font-size="19">服務、資料流、關鍵性與依賴</text><text x="360" y="375" fill="#71a7ff" font-size="23" font-weight="700">02 指派責任</text><text x="360" y="415" fill="#fff" font-size="19">主責、核准者與供應商邊界</text><text x="360" y="555" fill="#b9aaff" font-size="23" font-weight="700">03 映射控制</text><text x="360" y="595" fill="#fff" font-size="19">目標、實作、繼承與補償控制</text><text x="360" y="735" fill="#57f0c1" font-size="23" font-weight="700">04 連結證據</text><text x="360" y="775" fill="#fff" font-size="19">組態、測試、事件與演練</text><text x="360" y="915" fill="#ffbf7a" font-size="23" font-weight="700">05 核准差異</text><text x="360" y="955" fill="#fff" font-size="19">例外期限、殘餘風險與改善責任</text><text x="360" y="1095" fill="#ff9abd" font-size="23" font-weight="700">06 變更重驗</text><text x="360" y="1135" fill="#fff" font-size="19">影響分析、更新與臨床回歸</text></g><g stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M360 275V315"/><path d="M360 455V495"/><path d="M360 635V675"/><path d="M360 815V855"/><path d="M360 995V1035"/></g><text x="360" y="1215" text-anchor="middle" fill="#57f0c1" font-size="19" font-weight="700">重大變更、事件或例外到期 → 回到定界</text></svg>