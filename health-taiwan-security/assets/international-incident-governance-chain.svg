<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療資安事件治理鏈</title><desc id="desc">呈現臨床現場、事件指揮、外部協調、法定通報與董事會監督之間的資訊與責任鏈。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#152552"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#70e7ff"/></marker></defs>
<rect width="1200" height="760" rx="32" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="66" y="72" fill="#fff" font-size="34" font-weight="800">事件通報不是單一路徑，而是一條治理鏈</text><text x="66" y="110" fill="#a8bad8" font-size="20">技術事實、臨床衝擊、法域判定與決策責任必須同步但分工</text>
<rect x="55" y="185" width="230" height="180" rx="26" fill="#102b48" stroke="#63e6ff" stroke-width="2"/><text x="170" y="230" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">偵測與臨床現場</text><text x="170" y="274" text-anchor="middle" fill="#c8d8ed" font-size="19">系統、設備、服務衝擊</text><text x="170" y="310" text-anchor="middle" fill="#72f0c5" font-size="18">證據：時間、範圍、症狀</text><text x="170" y="338" text-anchor="middle" fill="#72f0c5" font-size="18">患者安全與停機狀態</text>
<rect x="350" y="165" width="250" height="220" rx="28" fill="#17365e" stroke="#9c8cff" stroke-width="3"/><text x="475" y="214" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">事件指揮</text><text x="475" y="258" text-anchor="middle" fill="#d7dcff" font-size="19">分級・決策・任務追蹤</text><text x="475" y="301" text-anchor="middle" fill="#ffd277" font-size="18">技術負責人＋臨床負責人</text><text x="475" y="334" text-anchor="middle" fill="#ffd277" font-size="18">法務／隱私＋公共溝通</text><text x="475" y="362" text-anchor="middle" fill="#ffd277" font-size="18">具名事件主管</text>
<rect x="670" y="185" width="220" height="180" rx="26" fill="#102b48" stroke="#63e6ff" stroke-width="2"/><text x="780" y="230" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">外部協調</text><text x="780" y="274" text-anchor="middle" fill="#c8d8ed" font-size="19">供應商、同業、應變組織</text><text x="780" y="310" text-anchor="middle" fill="#72f0c5" font-size="18">分享：指標、緩解與依賴</text><text x="780" y="338" text-anchor="middle" fill="#72f0c5" font-size="18">依協議控管敏感資訊</text>
<rect x="955" y="185" width="190" height="180" rx="26" fill="#102b48" stroke="#63e6ff" stroke-width="2"/><text x="1050" y="230" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">主管機關</text><text x="1050" y="274" text-anchor="middle" fill="#c8d8ed" font-size="19">依適用法域與門檻</text><text x="1050" y="310" text-anchor="middle" fill="#ff9cab" font-size="18">期限不可跨法域套用</text><text x="1050" y="338" text-anchor="middle" fill="#ff9cab" font-size="18">內容須可持續更新</text>
<path d="M285 275H340" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M600 275H660" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M890 275H945" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="245" y="485" width="710" height="150" rx="28" fill="#111f3d" stroke="#8f9fff" stroke-width="2"/><text x="600" y="532" text-anchor="middle" fill="#fff" font-size="27" font-weight="750">董事會／高階治理：監督風險與決策品質，不介入技術指揮</text><text x="600" y="576" text-anchor="middle" fill="#c8d8ed" font-size="19">重大服務衝擊・風險接受・資源缺口・對外義務・復原信心</text><text x="600" y="610" text-anchor="middle" fill="#72f0c5" font-size="18">輸出：具名決策、資源承諾、風險期限與復盤追蹤</text><path d="M475 385V472" stroke="#9c8cff" stroke-width="5" marker-end="url(#arrow)"/>
<text x="66" y="700" fill="#9fb3d9" font-size="18">共同事件紀錄：版本化事實、假設、決策人、通報時間、接收確認、後續修正與證據保存位置</text></g></svg>