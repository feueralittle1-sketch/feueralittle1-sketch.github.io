<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc"><title id="title">手機版臨床研究平台六步處置流程</title><desc id="desc">六步流程由上至下呈現研究平台的可信復原。</desc><rect width="760" height="1280" rx="28" fill="#08182b"/><text x="380" y="58" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="30" font-weight="800" fill="#fff">研究平台六步可信復原</text><g font-family="Inter,Noto Sans TC,sans-serif"><path d="M125 130V1135" stroke="#42617f" stroke-width="8"/><g fill="#102742" stroke-width="3"><circle cx="125" cy="180" r="54" stroke="#7aa7ff"/><circle cx="125" cy="370" r="54" stroke="#67e8f9"/><circle cx="125" cy="560" r="54" stroke="#fbbf24"/><circle cx="125" cy="750" r="54" stroke="#b8a7ff"/><circle cx="125" cy="940" r="54" stroke="#5eead4"/><circle cx="125" cy="1130" r="54" stroke="#fb7185"/></g><g fill="#fff"><text x="220" y="170" font-size="27" font-weight="800">01 曝險確認</text><text x="220" y="208" font-size="20" fill="#c6d4eb">版本、外網、問卷與相依服務</text><text x="220" y="360" font-size="27" font-weight="800">02 證據保全</text><text x="220" y="398" font-size="20" fill="#c6d4eb">日誌、映像與事件時間線</text><text x="220" y="550" font-size="27" font-weight="800">03 限制攻擊面</text><text x="220" y="588" font-size="20" fill="#c6d4eb">停用非必要功能並隔離</text><text x="220" y="740" font-size="27" font-weight="800">04 修補重建</text><text x="220" y="778" font-size="20" fill="#c6d4eb">更新、可信映像與秘密輪替</text><text x="220" y="930" font-size="27" font-weight="800">05 資料核對</text><text x="220" y="968" font-size="20" fill="#c6d4eb">逐案確認完整性與可疑匯出</text><text x="220" y="1120" font-size="27" font-weight="800">06 受控恢復</text><text x="220" y="1158" font-size="20" fill="#c6d4eb">逐步開放、監測與治理結案</text></g><text x="380" y="1240" text-anchor="middle" font-size="20" fill="#9fb3d9">先保全證據，再修補；先核對資料，再恢復</text></g></svg>