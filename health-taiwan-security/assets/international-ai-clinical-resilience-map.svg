<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療人工智慧臨床韌性責任與降級架構</title>
  <desc id="desc">人工智慧服務位於資料、模型、介接與臨床決策之間，醫院以清冊、監測、人工覆核、降級流程與復原證據維持安全服務。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10244a"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36d7ff"/><stop offset="1" stop-color="#8c7cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7ddfff"/></marker>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f6fbff" font-size="34" font-weight="800">AI 進入臨床流程後，韌性不只靠模型正確率</text>
  <text x="64" y="108" fill="#a9bddc" font-size="20">四層依賴必須同時可監測、可降級、可回退、可追查</text>
  <g font-family="Noto Sans TC, sans-serif">
    <rect x="70" y="176" width="220" height="150" rx="24" fill="#122d4d" stroke="#48d7ff" stroke-width="3"/>
    <text x="180" y="220" text-anchor="middle" fill="#7fe7ff" font-size="24" font-weight="700">資料與介接</text>
    <text x="180" y="260" text-anchor="middle" fill="#d7e6f7" font-size="18">來源、完整性、時效</text><text x="180" y="292" text-anchor="middle" fill="#d7e6f7" font-size="18">FHIR／影像／設備訊號</text>
    <rect x="360" y="160" width="300" height="182" rx="30" fill="url(#ai)" opacity=".95" filter="url(#glow)"/>
    <text x="510" y="214" text-anchor="middle" fill="#061221" font-size="28" font-weight="900">AI 服務觸點</text>
    <text x="510" y="256" text-anchor="middle" fill="#071528" font-size="19" font-weight="700">模型・雲端 API・代理工具</text>
    <text x="510" y="294" text-anchor="middle" fill="#071528" font-size="18">版本、權限、供應商、輸出</text>
    <rect x="730" y="176" width="220" height="150" rx="24" fill="#122d4d" stroke="#9d8cff" stroke-width="3"/>
    <text x="840" y="220" text-anchor="middle" fill="#c3b8ff" font-size="24" font-weight="700">臨床決策</text>
    <text x="840" y="260" text-anchor="middle" fill="#d7e6f7" font-size="18">醫事人員覆核</text><text x="840" y="292" text-anchor="middle" fill="#d7e6f7" font-size="18">病人安全與責任</text>
    <rect x="1000" y="176" width="130" height="150" rx="24" fill="#122d4d" stroke="#58e6bd" stroke-width="3"/>
    <text x="1065" y="224" text-anchor="middle" fill="#76f0c9" font-size="22" font-weight="700">服務</text><text x="1065" y="260" text-anchor="middle" fill="#d7e6f7" font-size="17">診療</text><text x="1065" y="288" text-anchor="middle" fill="#d7e6f7" font-size="17">持續運作</text>
    <path d="M290 251H348" stroke="#7ddfff" stroke-width="5" marker-end="url(#arrow)"/><path d="M660 251H718" stroke="#7ddfff" stroke-width="5" marker-end="url(#arrow)"/><path d="M950 251H988" stroke="#7ddfff" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="70" y="420" width="1060" height="220" rx="30" fill="#0b1b32" stroke="#34577e" stroke-width="2"/>
    <text x="104" y="466" fill="#f6fbff" font-size="25" font-weight="800">醫院韌性控制面</text>
    <g font-size="19">
      <rect x="104" y="500" width="220" height="92" rx="18" fill="#14385a"/><text x="214" y="536" text-anchor="middle" fill="#7fe7ff" font-weight="700">觸點清冊</text><text x="214" y="570" text-anchor="middle" fill="#d5e3f5">用途、責任、依賴</text>
      <rect x="354" y="500" width="220" height="92" rx="18" fill="#14385a"/><text x="464" y="536" text-anchor="middle" fill="#7fe7ff" font-weight="700">連續監測</text><text x="464" y="570" text-anchor="middle" fill="#d5e3f5">漂移、異常、事件</text>
      <rect x="604" y="500" width="220" height="92" rx="18" fill="#14385a"/><text x="714" y="536" text-anchor="middle" fill="#7fe7ff" font-weight="700">降級劇本</text><text x="714" y="570" text-anchor="middle" fill="#d5e3f5">人工流程、停用、替代</text>
      <rect x="854" y="500" width="242" height="92" rx="18" fill="#14385a"/><text x="975" y="536" text-anchor="middle" fill="#7fe7ff" font-weight="700">復原與證據</text><text x="975" y="570" text-anchor="middle" fill="#d5e3f5">回退、重驗、風險接受</text>
    </g>
  </g>
</svg>
