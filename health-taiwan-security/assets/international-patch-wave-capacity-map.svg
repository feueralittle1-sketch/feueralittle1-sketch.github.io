<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">醫療修補波容量地圖</title><desc id="desc">大量漏洞與更新經外部曝險、主動利用、技術影響及臨床關鍵性分流，進入立即處置、排程修補或汰換隔離三條路徑。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14234a"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="65" y="70" fill="#f4f8ff" font-size="34" font-weight="700">修補波不是工單洪水：先用風險訊號分流容量</text><text x="65" y="110" fill="#9fb3d9" font-size="21">更新數量上升時，維護窗口、測試環境與臨床協調能力才是稀缺資源</text>
<g font-family="sans-serif"><rect x="55" y="170" width="255" height="330" rx="24" fill="#14283d" stroke="#63e6ff" stroke-width="2"/><text x="85" y="215" fill="#63e6ff" font-size="26" font-weight="700">更新輸入</text><text x="85" y="265" fill="#e6eefc" font-size="21">• 供應商公告</text><text x="85" y="305" fill="#e6eefc" font-size="21">• KEV／利用證據</text><text x="85" y="345" fill="#e6eefc" font-size="21">• 弱點掃描</text><text x="85" y="385" fill="#e6eefc" font-size="21">• 雲端與設備更新</text><rect x="83" y="425" width="198" height="45" rx="20" fill="#0a1a2e"/><text x="182" y="455" text-anchor="middle" fill="#b9edff" font-size="19">持續流入，不等批次</text>
<rect x="385" y="150" width="330" height="370" rx="24" fill="#242744" stroke="#a997ff" stroke-width="2"/><text x="420" y="200" fill="#c5b9ff" font-size="26" font-weight="700">四項決策訊號</text><text x="420" y="252" fill="#e6eefc" font-size="22">01　是否對外暴露</text><text x="420" y="302" fill="#e6eefc" font-size="22">02　是否正在遭利用</text><text x="420" y="352" fill="#e6eefc" font-size="22">03　可取得的技術控制</text><text x="420" y="402" fill="#e6eefc" font-size="22">04　臨床中斷與回復條件</text><path d="M420 438h255" stroke="#596686"/><text x="420" y="478" fill="#b9c7df" font-size="19">輸出：處置順序＋證據需求</text>
<rect x="795" y="135" width="340" height="120" rx="22" fill="#35233b" stroke="#ff6b91" stroke-width="2"/><text x="825" y="180" fill="#ff9ab2" font-size="24" font-weight="700">快速通道</text><text x="825" y="220" fill="#f4d7df" font-size="20">保全證據後修補／隔離</text><rect x="795" y="285" width="340" height="120" rx="22" fill="#2d2c3c" stroke="#ffd166" stroke-width="2"/><text x="825" y="330" fill="#ffd166" font-size="24" font-weight="700">排程通道</text><text x="825" y="370" fill="#fff0ba" font-size="20">代表性測試＋分批部署</text><rect x="795" y="435" width="340" height="120" rx="22" fill="#12343a" stroke="#57f0c1" stroke-width="2"/><text x="825" y="480" fill="#57f0c1" font-size="24" font-weight="700">生命週期通道</text><text x="825" y="520" fill="#c7f7e9" font-size="20">無補丁：補償控制／汰換</text></g>
<path d="M310 335H378" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M715 240L787 195M715 335H787M715 430L787 495" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="145" y="585" width="910" height="50" rx="25" fill="#0b1d34" stroke="#36547c"/><text x="600" y="617" text-anchor="middle" fill="#d8e6fa" font-size="21">驗收重點：不是清空工單，而是高風險項目有可追溯決策且不破壞臨床服務</text></svg>