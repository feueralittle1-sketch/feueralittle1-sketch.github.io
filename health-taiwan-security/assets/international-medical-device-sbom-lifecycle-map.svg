<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療設備軟體透明度與生命週期治理架構</title>
  <desc id="desc">從設備識別、SBOM 元件清冊、弱點與 VEX 判定，到補償控制、更新和退場的治理關係。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162b"/><stop offset="1" stop-color="#10264c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="70" y="72" fill="#f4f8ff" font-size="34" font-weight="700">從「知道有設備」到「知道能否安全使用」</text><text x="70" y="110" fill="#9fb3d9" font-size="20">SBOM 是軟體元件清冊，不等於弱點結論，也不取代臨床風險判斷</text>
  <g font-family="Noto Sans TC, sans-serif" text-anchor="middle"><g transform="translate(55 180)"><rect width="200" height="170" rx="24" fill="#132c50" stroke="#63e6ff" stroke-width="3"/><text x="100" y="54" fill="#63e6ff" font-size="25" font-weight="700">設備識別</text><text x="100" y="94" fill="#d8e7fb" font-size="19">型號・版本・位置</text><text x="100" y="126" fill="#d8e7fb" font-size="19">用途・責任人</text></g><path d="M270 265h62" stroke="#71a7ff" stroke-width="6" marker-end="url(#a)"/>
  <g transform="translate(345 180)"><rect width="220" height="170" rx="24" fill="#132c50" stroke="#71a7ff" stroke-width="3"/><text x="110" y="54" fill="#8fc0ff" font-size="25" font-weight="700">SBOM</text><text x="110" y="94" fill="#d8e7fb" font-size="19">元件・版本・供應者</text><text x="110" y="126" fill="#d8e7fb" font-size="19">相依關係・格式</text></g><path d="M580 265h62" stroke="#9c8cff" stroke-width="6" marker-end="url(#a)"/>
  <g transform="translate(655 180)"><rect width="220" height="170" rx="24" fill="#132c50" stroke="#9c8cff" stroke-width="3"/><text x="110" y="54" fill="#b7aaff" font-size="25" font-weight="700">CVE＋VEX</text><text x="110" y="94" fill="#d8e7fb" font-size="19">弱點是否命中</text><text x="110" y="126" fill="#d8e7fb" font-size="19">可利用性與依據</text></g><path d="M890 265h62" stroke="#57f0c1" stroke-width="6" marker-end="url(#a)"/>
  <g transform="translate(965 180)"><rect width="180" height="170" rx="24" fill="#132c50" stroke="#57f0c1" stroke-width="3"/><text x="90" y="54" fill="#72f2cb" font-size="25" font-weight="700">處置</text><text x="90" y="94" fill="#d8e7fb" font-size="19">更新・隔離</text><text x="90" y="126" fill="#d8e7fb" font-size="19">監測・退場</text></g>
  <g transform="translate(130 430)"><rect width="940" height="175" rx="28" fill="#0b1d38" stroke="#365a86" stroke-width="2"/><text x="470" y="48" fill="#f4f8ff" font-size="26" font-weight="700">每一筆判定都要連回臨床脈絡</text><text x="150" y="99" fill="#63e6ff" font-size="21">病人安全影響</text><text x="365" y="99" fill="#71a7ff" font-size="21">暴露與可利用性</text><text x="590" y="99" fill="#b7aaff" font-size="21">更新可行性</text><text x="790" y="99" fill="#72f2cb" font-size="21">證據與期限</text><text x="470" y="142" fill="#aebfda" font-size="19">輸出：風險順位、暫時控制、驗證結果、EOL／EOS 退場決策</text></g></g>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fc0ff"/></marker></defs>
</svg>
