<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">醫療資安評估資料的分層彙總邊界手機版</title><desc id="desc">院內原始證據經範圍對齊、去識別與品質檢查後，只輸出共同指標，形成區域改善優先序。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient></defs><rect width="720" height="1180" rx="28" fill="url(#bg)"/><text x="42" y="68" fill="#fff" font-size="32" font-weight="800">跨院比較的資料邊界</text><text x="42" y="108" fill="#a9bedc" font-size="19">原始證據留院內，只交換共同欄位</text><g font-family="Arial, Noto Sans TC, sans-serif"><rect x="42" y="155" width="636" height="220" rx="24" fill="#132d51" stroke="#4edff5" stroke-width="3"/><text x="78" y="210" fill="#fff" font-size="27" font-weight="800">各院原始評估</text><text x="78" y="260" fill="#c6d8ef" font-size="21">證據、資產明細、例外、改善計畫</text><text x="78" y="305" fill="#c6d8ef" font-size="21">病人與設備敏感資料不得直接外送</text><rect x="42" y="435" width="636" height="315" rx="24" fill="#102b45" stroke="#9c8cff" stroke-width="3"/><text x="78" y="490" fill="#fff" font-size="27" font-weight="800">院內評估閘門</text><g fill="#dbe5f5" font-size="21"><text x="78" y="545">1. 對齊服務範圍與評估期間</text><text x="78" y="590">2. 驗證證據、版本與計分依據</text><text x="78" y="635">3. 去識別並標記缺漏</text><text x="78" y="680">4. 核准最小必要輸出</text></g><rect x="42" y="810" width="636" height="300" rx="24" fill="#12374a" stroke="#57f0c1" stroke-width="3"/><text x="78" y="865" fill="#fff" font-size="27" font-weight="800">區域彙總與行動</text><g fill="#cef8e9" font-size="21"><text x="78" y="920">• 依規模與服務類型分層</text><text x="78" y="965">• 呈現分布與趨勢，不公開單院弱點</text><text x="78" y="1010">• 排定教育、演練與投資優先序</text><text x="78" y="1055">• 設定改善責任與下期重測</text></g><path d="M360 375V425M360 750V800" stroke="#63e6ff" stroke-width="5"/></g></svg>
