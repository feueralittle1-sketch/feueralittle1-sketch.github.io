<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療重大網攻後的受控復原流程</title><desc id="desc">從穩定局勢、定義最低可行運作、重建可信基礎、分段重連、臨床驗證到長期修復的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="58" y="66" fill="#fff" font-size="34" font-weight="700">受控復原不是一次開機：六個可回退的放行閘門</text><text x="58" y="104" fill="#9fb3d9" font-size="20">技術重建、臨床驗證與事件指揮必須同步；任一閘門失敗即停止擴大連線</text><path d="M145 330H1055" stroke="#274f75" stroke-width="12" stroke-linecap="round"/><g font-family="sans-serif"><g><circle cx="145" cy="330" r="56" fill="#132d52" stroke="#71a7ff" stroke-width="3"/><text x="145" y="321" text-anchor="middle" fill="#71a7ff" font-size="20" font-weight="700">01</text><text x="145" y="350" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">穩定局勢</text><text x="145" y="435" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">隔離與指揮</text><text x="145" y="469" text-anchor="middle" fill="#9fb3d9" font-size="17">保全證據</text></g><path d="M203 330H267" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><g><circle cx="320" cy="330" r="56" fill="#132d52" stroke="#9c8cff" stroke-width="3"/><text x="320" y="321" text-anchor="middle" fill="#b9aaff" font-size="20" font-weight="700">02</text><text x="320" y="350" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">定義 MVO</text><text x="320" y="435" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">臨床優先序</text><text x="320" y="469" text-anchor="middle" fill="#9fb3d9" font-size="17">最低安全容量</text></g><path d="M378 330H442" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><g><circle cx="495" cy="330" r="56" fill="#132d52" stroke="#57f0c1" stroke-width="3"/><text x="495" y="321" text-anchor="middle" fill="#57f0c1" font-size="20" font-weight="700">03</text><text x="495" y="350" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">可信重建</text><text x="495" y="435" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">身分與基礎</text><text x="495" y="469" text-anchor="middle" fill="#9fb3d9" font-size="17">金鑰、端點、備份</text></g><path d="M553 330H617" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><g><circle cx="670" cy="330" r="56" fill="#132d52" stroke="#63e6ff" stroke-width="3"/><text x="670" y="321" text-anchor="middle" fill="#63e6ff" font-size="20" font-weight="700">04</text><text x="670" y="350" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">分段重連</text><text x="670" y="435" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">最小連線</text><text x="670" y="469" text-anchor="middle" fill="#9fb3d9" font-size="17">監控與回退</text></g><path d="M728 330H792" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><g><circle cx="845" cy="330" r="56" fill="#132d52" stroke="#ffb86b" stroke-width="3"/><text x="845" y="321" text-anchor="middle" fill="#ffbf7a" font-size="20" font-weight="700">05</text><text x="845" y="350" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">臨床驗證</text><text x="845" y="435" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">功能與資料</text><text x="845" y="469" text-anchor="middle" fill="#9fb3d9" font-size="17">工作流程回歸</text></g><path d="M903 330H967" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><g><circle cx="1020" cy="330" r="56" fill="#132d52" stroke="#f78fb3" stroke-width="3"/><text x="1020" y="321" text-anchor="middle" fill="#f7a7c2" font-size="20" font-weight="700">06</text><text x="1020" y="350" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">長期修復</text><text x="1020" y="435" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">消除根因</text><text x="1020" y="469" text-anchor="middle" fill="#9fb3d9" font-size="17">復盤與重驗</text></g></g><rect x="185" y="548" width="830" height="68" rx="22" fill="#0d3540" stroke="#57f0c1"/><text x="600" y="590" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">每階段均記錄主責、輸入證據、放行條件、失敗門檻與回退路徑</text></svg>