<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">醫療事件時間線建構流程</title><desc id="desc">從事件範圍、時間偏差校正、資料凍結、關聯分析、臨床驗證到結案保存的六階段流程。</desc><rect width="1200" height="560" fill="#08172c"/><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">六階段把分散紀錄變成可驗證事件時間線</text><g font-family="sans-serif" text-anchor="middle"><g fill="#11294a" stroke="#63e6ff" stroke-width="3"><rect x="45" y="170" width="165" height="180" rx="22"/><rect x="235" y="170" width="165" height="180" rx="22"/><rect x="425" y="170" width="165" height="180" rx="22"/><rect x="615" y="170" width="165" height="180" rx="22"/><rect x="805" y="170" width="165" height="180" rx="22"/><rect x="995" y="170" width="165" height="180" rx="22"/></g><g fill="#fff" font-size="24" font-weight="700"><text x="127" y="220">1 定界</text><text x="317" y="220">2 校時</text><text x="507" y="220">3 凍結</text><text x="697" y="220">4 關聯</text><text x="887" y="220">5 驗證</text><text x="1077" y="220">6 結案</text></g><g fill="#cbd8f3" font-size="19"><text x="127" y="270">系統、人員</text><text x="127" y="302">時段與問題</text><text x="317" y="270">記錄偏差</text><text x="317" y="302">時區與來源</text><text x="507" y="270">保存原始檔</text><text x="507" y="302">計算雜湊</text><text x="697" y="270">身分、網路</text><text x="697" y="302">應用與設備</text><text x="887" y="270">臨床流程</text><text x="887" y="302">交叉確認</text><text x="1077" y="270">權限回收</text><text x="1077" y="302">期限與刪除</text></g></g><path d="M210 260H230M400 260H420M590 260H610M780 260H800M970 260H990" stroke="#a997ff" stroke-width="8"/><rect x="160" y="415" width="880" height="78" rx="20" fill="#122d3c" stroke="#5ef2b0" stroke-width="3"/><text x="600" y="462" fill="#d7f7e8" font-size="23" font-weight="700" text-anchor="middle">每一步都記錄處理人、輸入證據、時間、決策理由與交付對象</text></svg>