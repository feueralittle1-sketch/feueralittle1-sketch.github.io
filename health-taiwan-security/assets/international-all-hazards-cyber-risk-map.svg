<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療全災害與資安風險關係圖</title>
  <desc id="desc">將外部災害、資安事件與供應鏈中斷映射到臨床服務及共同技術依賴，再由治理層決定優先控制與資源配置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#111b3b"/></linearGradient>
    <linearGradient id="a" x1="0" x2="1"><stop stop-color="#36d9ff"/><stop offset="1" stop-color="#7d8cff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78dfff"/></marker>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" fill="#fff" font-size="34" font-weight="700">全災害風險必須落到同一組臨床依賴</text>
  <text x="70" y="112" fill="#a9bad8" font-size="21">不是把資安另列一張表，而是比較相同服務在不同事件下的中斷後果與復原能力</text>
  <g filter="url(#shadow)" font-family="Noto Sans TC, sans-serif">
    <rect x="70" y="170" width="250" height="330" rx="24" fill="#102942" stroke="#36d9ff" stroke-width="2"/>
    <text x="105" y="215" fill="#7fe8ff" font-size="26" font-weight="700">事件來源</text>
    <rect x="100" y="250" width="190" height="58" rx="14" fill="#173854"/><text x="195" y="286" text-anchor="middle" fill="#fff" font-size="22">勒索與身分攻擊</text>
    <rect x="100" y="328" width="190" height="58" rx="14" fill="#173854"/><text x="195" y="364" text-anchor="middle" fill="#fff" font-size="22">電力與通訊中斷</text>
    <rect x="100" y="406" width="190" height="58" rx="14" fill="#173854"/><text x="195" y="442" text-anchor="middle" fill="#fff" font-size="22">供應鏈與設備故障</text>

    <rect x="475" y="170" width="250" height="330" rx="24" fill="#20264c" stroke="#8d91ff" stroke-width="2"/>
    <text x="510" y="215" fill="#b8b8ff" font-size="26" font-weight="700">臨床與技術依賴</text>
    <rect x="505" y="250" width="190" height="58" rx="14" fill="#303463"/><text x="600" y="286" text-anchor="middle" fill="#fff" font-size="22">急診與住院照護</text>
    <rect x="505" y="328" width="190" height="58" rx="14" fill="#303463"/><text x="600" y="364" text-anchor="middle" fill="#fff" font-size="22">病歷、影像與身分</text>
    <rect x="505" y="406" width="190" height="58" rx="14" fill="#303463"/><text x="600" y="442" text-anchor="middle" fill="#fff" font-size="22">人力、場所與供應商</text>

    <rect x="880" y="170" width="250" height="330" rx="24" fill="#123c3b" stroke="#57f0c1" stroke-width="2"/>
    <text x="915" y="215" fill="#78f6cf" font-size="26" font-weight="700">治理決策</text>
    <rect x="910" y="250" width="190" height="58" rx="14" fill="#19514e"/><text x="1005" y="286" text-anchor="middle" fill="#fff" font-size="22">共同控制優先序</text>
    <rect x="910" y="328" width="190" height="58" rx="14" fill="#19514e"/><text x="1005" y="364" text-anchor="middle" fill="#fff" font-size="22">區域資源配置</text>
    <rect x="910" y="406" width="190" height="58" rx="14" fill="#19514e"/><text x="1005" y="442" text-anchor="middle" fill="#fff" font-size="22">演練與改善證據</text>
  </g>
  <path d="M325 335 H460" stroke="#78dfff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M730 335 H865" stroke="#78dfff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="185" y="555" width="830" height="82" rx="20" fill="#0d2238" stroke="url(#a)" stroke-width="2"/>
  <text x="600" y="590" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">排序單位：可中斷多久 × 影響多少人 × 是否有替代流程 × 恢復證據是否可信</text>
  <text x="600" y="620" text-anchor="middle" fill="#a9bad8" font-size="19">相同依賴被多種事件擊中時，應優先投資可同時降低多項風險的控制</text>
</svg>