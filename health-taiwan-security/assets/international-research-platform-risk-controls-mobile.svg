<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc"><title id="title">手機版臨床研究平台事件風險與控制</title><desc id="desc">五項研究平台事件失敗模式及其控制以卡片呈現。</desc><rect width="760" height="1320" rx="28" fill="#08182b"/><text x="380" y="58" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="30" font-weight="800" fill="#fff">事件風險與控制對照</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="60" y="105" width="640" height="205" rx="24" fill="#102742" stroke="#fb7185" stroke-width="3"/><text x="95" y="155" font-size="25" font-weight="800" fill="#fb7185">公開入口遺漏</text><text x="95" y="198" font-size="20" fill="#c6d4eb">只看主機版本</text><text x="95" y="252" font-size="21" fill="#5eead4">控制：問卷／外網／路由完整盤點</text><rect x="60" y="345" width="640" height="205" rx="24" fill="#102742" stroke="#fbbf24" stroke-width="3"/><text x="95" y="395" font-size="25" font-weight="800" fill="#fbbf24">證據遺失</text><text x="95" y="438" font-size="20" fill="#c6d4eb">先重開機或覆寫</text><text x="95" y="492" font-size="21" fill="#5eead4">控制：各層日誌與映像先保全</text><rect x="60" y="585" width="640" height="205" rx="24" fill="#102742" stroke="#fb7185" stroke-width="3"/><text x="95" y="635" font-size="25" font-weight="800" fill="#fb7185">憑證殘留</text><text x="95" y="678" font-size="20" fill="#c6d4eb">只修補原主機</text><text x="95" y="732" font-size="21" fill="#5eead4">控制：可信重建＋帳號秘密輪替</text><rect x="60" y="825" width="640" height="205" rx="24" fill="#102742" stroke="#fb7185" stroke-width="3"/><text x="95" y="875" font-size="25" font-weight="800" fill="#fb7185">資料污染</text><text x="95" y="918" font-size="20" fill="#c6d4eb">用備份覆蓋取代核對</text><text x="95" y="972" font-size="21" fill="#5eead4">控制：稽核、備份與研究端交叉驗證</text><rect x="60" y="1065" width="640" height="205" rx="24" fill="#102742" stroke="#b8a7ff" stroke-width="3"/><text x="95" y="1115" font-size="25" font-weight="800" fill="#b8a7ff">過早恢復</text><text x="95" y="1158" font-size="20" fill="#c6d4eb">入口先開、風險未關</text><text x="95" y="1212" font-size="21" fill="#5eead4">控制：分階段放行＋監測＋核准</text></g></svg>