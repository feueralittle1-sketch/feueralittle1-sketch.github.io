<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療設備安全架構交付與驗收流程</title><desc id="desc">從界定版本、接收架構視圖、逐條追蹤通訊、測試安全假設、處理缺口到變更重驗的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="55" y="70" fill="#f7fbff" font-size="34" font-weight="800">六階段把供應商文件轉成可執行的院端驗收</text><text x="55" y="108" fill="#9fb7d5" font-size="19">每一階段都要留下輸入、責任人、測試結果與未結缺口</text><g font-size="19"><rect x="55" y="165" width="325" height="125" rx="24" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="85" y="207" fill="#63e6ff" font-size="23" font-weight="800">1　界定交付版本</text><text x="85" y="248" fill="#e6eefc">型號 · 軟體 · 組態 · 介面</text><rect x="438" y="165" width="325" height="125" rx="24" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="468" y="207" fill="#b9adff" font-size="23" font-weight="800">2　接收四種視圖</text><text x="468" y="248" fill="#e6eefc">全球 · 分區 · 序列 · 狀態</text><rect x="820" y="165" width="325" height="125" rx="24" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="850" y="207" fill="#72f5cd" font-size="23" font-weight="800">3　建立追蹤矩陣</text><text x="850" y="248" fill="#e6eefc">資料流 → 控制 → 日誌 → 責任</text><path d="M218 290v52h383v-52" fill="none" stroke="#8fe8ff" stroke-width="4"/><path d="M982 290v52H601" fill="none" stroke="#8fe8ff" stroke-width="4"/><rect x="55" y="380" width="325" height="125" rx="24" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="85" y="422" fill="#ffd08a" font-size="23" font-weight="800">4　測試安全假設</text><text x="85" y="463" fill="#fff1dc">斷線 · 偽造 · 逾時 · 降級 · 回退</text><rect x="438" y="380" width="325" height="125" rx="24" fill="#3d2949" stroke="#ff8fc8" stroke-width="2"/><text x="468" y="422" fill="#ff9fd0" font-size="23" font-weight="800">5　處理差距與例外</text><text x="468" y="463" fill="#f7d9e9">補償控制 · 責任人 · 期限</text><rect x="820" y="380" width="325" height="125" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="850" y="422" fill="#72f5cd" font-size="23" font-weight="800">6　放行與變更重驗</text><text x="850" y="463" fill="#ddfff4">版本基線 · 觸發條件 · 證據保存</text></g><path d="M218 505v50h764v-50" fill="none" stroke="#72f5cd" stroke-width="5"/><rect x="160" y="555" width="880" height="76" rx="22" fill="#112e4d" stroke="#8fe8ff" stroke-width="2"/><text x="600" y="587" text-anchor="middle" fill="#8fe8ff" font-size="22" font-weight="800">驗收完成條件</text><text x="600" y="615" text-anchor="middle" fill="#e6eefc" font-size="17">圖、版本、測試、缺口、放行與後續變更能以同一證據鏈相互查證</text></g></svg>