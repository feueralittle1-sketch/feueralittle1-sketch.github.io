<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療 TLS 遷移與驗收流程</title><desc id="desc">從被動握手觀測、相依盤點、風險分級、隔離測試、分波部署到持續監測與到期重驗的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#13284d"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0V6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="55" y="68" fill="#fff" font-size="34" font-weight="800">六階段遷移：每一波都能停止、回退與重驗</text><text x="55" y="105" fill="#afc3e2" font-size="20">不要一次關閉舊協定；先以實際流量與臨床情境建立證據</text><g><rect x="55" y="158" width="315" height="140" rx="24" fill="#102b47" stroke="#63e6ff"/><text x="82" y="197" fill="#63e6ff" font-size="18" font-weight="700">01　觀測</text><text x="82" y="231" fill="#fff" font-size="24" font-weight="800">建立實際握手清冊</text><text x="82" y="263" fill="#c2d3e8" font-size="17">端點、版本、密碼套件、憑證</text><rect x="442" y="158" width="315" height="140" rx="24" fill="#102b47" stroke="#82a9ff"/><text x="469" y="197" fill="#82a9ff" font-size="18" font-weight="700">02　分級</text><text x="469" y="231" fill="#fff" font-size="24" font-weight="800">連回臨床與設備責任</text><text x="469" y="263" fill="#c2d3e8" font-size="17">服務影響、供應商、支援期限</text><rect x="829" y="158" width="315" height="140" rx="24" fill="#102b47" stroke="#c99cff"/><text x="856" y="197" fill="#c99cff" font-size="18" font-weight="700">03　設計</text><text x="856" y="231" fill="#fff" font-size="24" font-weight="800">選擇目標與過渡路徑</text><text x="856" y="263" fill="#c2d3e8" font-size="17">升級、代理隔離、替換或退場</text><path d="M375 228H430" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M762 228H817" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M986 312V348H215V382" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="55" y="393" width="315" height="140" rx="24" fill="#102b47" stroke="#57f0c1"/><text x="82" y="432" fill="#57f0c1" font-size="18" font-weight="700">04　測試</text><text x="82" y="466" fill="#fff" font-size="24" font-weight="800">隔離驗證與臨床回歸</text><text x="82" y="498" fill="#c2d3e8" font-size="17">成功、失敗、回退、效能與告警</text><rect x="442" y="393" width="315" height="140" rx="24" fill="#102b47" stroke="#ffc857"/><text x="469" y="432" fill="#ffc857" font-size="18" font-weight="700">05　部署</text><text x="469" y="466" fill="#fff" font-size="24" font-weight="800">小批次放行與停止條件</text><text x="469" y="498" fill="#c2d3e8" font-size="17">依服務波次切換並保留回退窗</text><rect x="829" y="393" width="315" height="140" rx="24" fill="#102b47" stroke="#ff8fab"/><text x="856" y="432" fill="#ff8fab" font-size="18" font-weight="700">06　重驗</text><text x="856" y="466" fill="#fff" font-size="24" font-weight="800">監測降級與例外到期</text><text x="856" y="498" fill="#c2d3e8" font-size="17">舊握手歸零、異常告警、退場結案</text><path d="M375 463H430" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M762 463H817" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/></g><rect x="55" y="584" width="1089" height="52" rx="20" fill="#0a1b30" stroke="#294a6f"/><text x="600" y="617" text-anchor="middle" fill="#b8cce6" font-size="18">驗收輸出：成功率｜握手失敗率｜舊版本流量｜臨床事件｜例外逾期｜退場完成率</text></g></svg>