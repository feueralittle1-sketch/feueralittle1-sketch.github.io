<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療勒索停機事件指揮流程</title>
  <desc id="desc">從異常確認、事件指揮啟動、臨床降級、遏止保全、乾淨復原到回切復盤的六階段流程，並標示病人安全閘門。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061526"/><stop offset="1" stop-color="#171536"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f5fbff" font-size="36" font-weight="800">六階段指揮流程：先保病人，再保證據，最後安全回切</text>
  <text x="60" y="112" fill="#9fb7d9" font-size="23">資安處置與臨床決策須在同一指揮節奏內運作</text>
  <g stroke="#8fe8ff" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M235 300H260"/><path d="M420 300H445"/><path d="M605 300H630"/><path d="M790 300H815"/><path d="M975 300H1000"/></g>
  <g text-anchor="middle">
    <rect x="55" y="190" width="180" height="225" rx="25" fill="#2d2945" stroke="#9c8cff" stroke-width="3"/><text x="145" y="235" fill="#d4caff" font-size="24" font-weight="800">1 異常確認</text><text x="145" y="285" fill="#e4ddff" font-size="19">影響系統</text><text x="145" y="320" fill="#e4ddff" font-size="19">攻擊範圍</text><text x="145" y="365" fill="#b8ade8" font-size="18">輸出：事件級別</text>
    <rect x="260" y="190" width="160" height="225" rx="25" fill="#3b263e" stroke="#ff9bc8" stroke-width="3"/><text x="340" y="235" fill="#ffc7e1" font-size="24" font-weight="800">2 啟動指揮</text><text x="340" y="285" fill="#f0d8e5" font-size="19">臨床／資訊</text><text x="340" y="320" fill="#f0d8e5" font-size="19">資安／公關</text><text x="340" y="365" fill="#d8a6bf" font-size="18">輸出：共同態勢</text>
    <rect x="445" y="190" width="160" height="225" rx="25" fill="#44322b" stroke="#ffbf69" stroke-width="3"/><text x="525" y="235" fill="#ffd59d" font-size="24" font-weight="800">3 臨床降級</text><text x="525" y="285" fill="#f1ddc5" font-size="19">最低服務</text><text x="525" y="320" fill="#f1ddc5" font-size="19">轉送條件</text><text x="525" y="365" fill="#d9b78f" font-size="18">閘門：病人安全</text>
    <rect x="630" y="190" width="160" height="225" rx="25" fill="#102d45" stroke="#63e6ff" stroke-width="3"/><text x="710" y="235" fill="#8fe8ff" font-size="24" font-weight="800">4 遏止保全</text><text x="710" y="285" fill="#d9f4ff" font-size="19">分段與撤權</text><text x="710" y="320" fill="#d9f4ff" font-size="19">映像與日誌</text><text x="710" y="365" fill="#8fcce3" font-size="18">閘門：授權處置</text>
    <rect x="815" y="190" width="160" height="225" rx="25" fill="#10352f" stroke="#57f0c1" stroke-width="3"/><text x="895" y="235" fill="#9ff8dc" font-size="24" font-weight="800">5 乾淨復原</text><text x="895" y="285" fill="#d7efe9" font-size="19">重建信任</text><text x="895" y="320" fill="#d7efe9" font-size="19">資料驗證</text><text x="895" y="365" fill="#83d9be" font-size="18">閘門：無殘留</text>
    <rect x="1000" y="190" width="145" height="225" rx="25" fill="#153544" stroke="#57f0c1" stroke-width="3"/><text x="1072" y="235" fill="#9ff8dc" font-size="24" font-weight="800">6 回切復盤</text><text x="1072" y="285" fill="#d7efe9" font-size="19">分批回切</text><text x="1072" y="320" fill="#d7efe9" font-size="19">追蹤改善</text><text x="1072" y="365" fill="#83d9be" font-size="18">輸出：證據包</text>
  </g>
  <rect x="110" y="510" width="980" height="120" rx="28" fill="#0c2940" stroke="#416989" stroke-width="2"/><text x="600" y="550" text-anchor="middle" fill="#e7f4ff" font-size="24" font-weight="700">每 30–60 分鐘更新：服務狀態｜病人風險｜遏止範圍｜復原可信度｜對外訊息</text><text x="600" y="590" text-anchor="middle" fill="#9fb7d9" font-size="20">回切條件必須事先定義；系統能開機不代表資料、身分與介接已可信</text>
</svg>
