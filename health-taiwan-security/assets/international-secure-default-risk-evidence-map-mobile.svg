<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1120" role="img" aria-labelledby="title desc"><title id="title">醫療系統不安全預設值風險控制手機版</title><desc id="desc">五張卡片分別列出共用預設憑證、管理介面暴露、非必要服務、弱通訊與日誌關閉的控制及證據。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071422"/><stop offset="1" stop-color="#111d3a"/></linearGradient></defs><rect width="600" height="1120" rx="28" fill="url(#b)"/><text x="34" y="52" fill="#fff" font-size="25" font-weight="800">風險、控制與證據要成套</text><text x="34" y="82" fill="#a8bad8" font-size="17">設定畫面不能取代負向測試</text><g font-family="Inter,Noto Sans TC,sans-serif"><g id="c"><rect x="40" width="520" height="184" rx="22" fill="#101f36" stroke="#354c6c" stroke-width="2"/></g><use href="#c" y="118"/><text x="70" y="158" fill="#ffb9c5" font-size="21" font-weight="800">共用預設憑證</text><text x="70" y="194" fill="#e8f0ff" font-size="17">控制：唯一秘密、首次重設、MFA／SSO</text><text x="70" y="228" fill="#d1dff1" font-size="17">證據：重複密碼測試、帳號啟用紀錄</text><use href="#c" y="322"/><text x="70" y="362" fill="#ffcf93" font-size="21" font-weight="800">管理介面預設暴露</text><text x="70" y="398" fill="#e8f0ff" font-size="17">控制：管理面隔離、來源限制、帶外存取</text><text x="70" y="432" fill="#d1dff1" font-size="17">證據：外部掃描、禁止路徑測試</text><use href="#c" y="526"/><text x="70" y="566" fill="#f6e68c" font-size="21" font-weight="800">非必要服務自動開啟</text><text x="70" y="602" fill="#e8f0ff" font-size="17">控制：最小服務集、白名單、變更監測</text><text x="70" y="636" fill="#d1dff1" font-size="17">證據：連接埠差異、核准服務清冊</text><use href="#c" y="730"/><text x="70" y="770" fill="#aee8ff" font-size="21" font-weight="800">弱通訊或驗證降級</text><text x="70" y="806" fill="#e8f0ff" font-size="17">控制：安全協定、憑證驗證、禁止降級</text><text x="70" y="840" fill="#d1dff1" font-size="17">證據：握手、憑證與錯誤事件測試</text><use href="#c" y="934"/><text x="70" y="974" fill="#c7b8ff" font-size="21" font-weight="800">日誌關閉或留在本機</text><text x="70" y="1010" fill="#e8f0ff" font-size="17">控制：關鍵事件開啟、集中匯出、校時</text><text x="70" y="1044" fill="#d1dff1" font-size="17">證據：SIEM 收件、完整性與保留測試</text></g></svg>