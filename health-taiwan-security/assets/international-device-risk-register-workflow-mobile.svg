<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備風險登錄閉環</title><desc id="desc">設備盤點、情境建模、風險分析、控制驗證、權責決策與持續監測的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1050" rx="28" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">風險登錄六階段閉環</text><text x="38" y="96" fill="#9fb7d5" font-size="18">每一步都留下可稽核證據</text><g font-size="20" font-weight="800" fill="#ffffff"><rect x="55" y="135" width="610" height="105" rx="22" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="82" y="180">01　盤點設備與臨床用途</text><text x="82" y="214" fill="#d8e5f7" font-size="17" font-weight="400">版本、連線、責任與工作流</text><rect x="55" y="265" width="610" height="105" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="82" y="310">02　建立威脅與傷害情境</text><text x="82" y="344" fill="#d8e5f7" font-size="17" font-weight="400">攻擊路徑、前置條件與病人範圍</text><rect x="55" y="395" width="610" height="105" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="82" y="440">03　分析可利用性與衝擊</text><text x="82" y="474" fill="#d8e5f7" font-size="17" font-weight="400">保留來源、假設與不確定性</text><rect x="55" y="525" width="610" height="105" rx="22" fill="#123c55" stroke="#8fe8ff" stroke-width="2"/><text x="82" y="570">04　配置控制並完成驗證</text><text x="82" y="604" fill="#d8e5f7" font-size="17" font-weight="400">修補、隔離、限制與負向測試</text><rect x="55" y="655" width="610" height="105" rx="22" fill="#342657" stroke="#b6a6ff" stroke-width="2"/><text x="82" y="700">05　處置、升級或接受風險</text><text x="82" y="734" fill="#d8e5f7" font-size="17" font-weight="400">明定權責、期限與退出條件</text><rect x="55" y="785" width="610" height="105" rx="22" fill="#3f2638" stroke="#ff8fc7" stroke-width="2"/><text x="82" y="830">06　監測變更並觸發重評</text><text x="82" y="864" fill="#d8e5f7" font-size="17" font-weight="400">事件、版本、曝險與供應商公告</text></g><rect x="55" y="925" width="610" height="80" rx="22" fill="#102f48" stroke="#8fe8ff" stroke-width="2"/><text x="360" y="958" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">驗收：情境可重現、控制有效</text><text x="360" y="986" text-anchor="middle" fill="#d8e5f7" font-size="16">責任清楚、剩餘風險可追蹤</text></g></svg>