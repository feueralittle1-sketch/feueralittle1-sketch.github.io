<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc"><title id="title">手機版醫療加密例外風險與控制對照</title><desc id="desc">五項加密治理失敗模式，分別對應例外期限、金鑰權限分離、逐資料流驗證、復原演練與舊系統隔離監測。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#122750"/></linearGradient></defs><rect width="390" height="1120" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="22" y="42" fill="#fff" font-size="21" font-weight="800">加密治理風險對照</text><text x="22" y="70" fill="#abc0df" font-size="14">每項控制都要留下可重驗證據</text><g><rect x="22" y="100" width="346" height="178" rx="20" fill="#12253d" stroke="#ffb86b"/><text x="45" y="137" fill="#fff" font-size="18" font-weight="800">例外無到期日</text><text x="45" y="167" fill="#f1cbb4" font-size="15">暫時限制變成永久缺口</text><text x="45" y="207" fill="#bdefff" font-size="15">控制：責任人、到期日、退出條件</text><text x="45" y="242" fill="#c8f3e3" font-size="15">證據：例外登錄與逾期清單</text><rect x="22" y="296" width="346" height="178" rx="20" fill="#0e2a3c" stroke="#63e6ff"/><text x="45" y="333" fill="#fff" font-size="18" font-weight="800">資料與金鑰同權</text><text x="45" y="363" fill="#f1cbb4" font-size="15">單一帳號同時讀取與解密</text><text x="45" y="403" fill="#bdefff" font-size="15">控制：金鑰分離、雙人核准</text><text x="45" y="438" fill="#c8f3e3" font-size="15">證據：權限矩陣與解密稽核</text><rect x="22" y="492" width="346" height="178" rx="20" fill="#12253d" stroke="#ffb86b"/><text x="45" y="529" fill="#fff" font-size="18" font-weight="800">覆蓋率只看設定</text><text x="45" y="559" fill="#f1cbb4" font-size="15">備份、匯出或舊介面仍明文</text><text x="45" y="599" fill="#bdefff" font-size="15">控制：逐資料流驗證與負向測試</text><text x="45" y="634" fill="#c8f3e3" font-size="15">證據：資產對照與差異報告</text><rect x="22" y="688" width="346" height="178" rx="20" fill="#0e2a3c" stroke="#63e6ff"/><text x="45" y="725" fill="#fff" font-size="18" font-weight="800">金鑰失效無法復原</text><text x="45" y="755" fill="#f1cbb4" font-size="15">事件期間加密資料不可用</text><text x="45" y="795" fill="#bdefff" font-size="15">控制：輪替與隔離復原演練</text><text x="45" y="830" fill="#c8f3e3" font-size="15">證據：還原時間與完整性紀錄</text><rect x="22" y="884" width="346" height="190" rx="20" fill="#12253d" stroke="#ffb86b"/><text x="45" y="921" fill="#fff" font-size="18" font-weight="800">舊系統只有網路隔離</text><text x="45" y="951" fill="#f1cbb4" font-size="15">異常匯出與本機複製無人發現</text><text x="45" y="991" fill="#bdefff" font-size="15">控制：限制、監測、實體保護</text><text x="45" y="1026" fill="#c8f3e3" font-size="15">證據：告警測試與退場里程碑</text></g><text x="22" y="1103" fill="#abc0df" font-size="13">驗收需同時覆蓋機密性、可用性與可追溯性</text></g></svg>