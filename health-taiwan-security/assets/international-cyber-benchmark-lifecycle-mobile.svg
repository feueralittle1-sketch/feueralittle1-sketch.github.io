<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">醫療資安評估到改善重測流程手機版</title><desc id="desc">七階段流程依序為定義範圍、蒐集證據、院內評分、品質檢查、分層彙總、改善決策與重測驗收。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#17264b"/></linearGradient></defs><rect width="720" height="1280" rx="28" fill="url(#bg)"/><text x="42" y="68" fill="#fff" font-size="32" font-weight="800">從評估走到改善重測</text><text x="42" y="108" fill="#a9bedc" font-size="19">版本、責任與證據必須全程可追溯</text><g font-family="Arial, Noto Sans TC, sans-serif" font-size="22"><path d="M110 190V1160" stroke="#36577f" stroke-width="10"/><g><circle cx="110" cy="210" r="42" fill="#163852" stroke="#63e6ff" stroke-width="4"/><text x="185" y="202" fill="#fff" font-weight="800">1 定義範圍</text><text x="185" y="235" fill="#bdd0e8">服務、系統、期間與版本</text></g><g><circle cx="110" cy="365" r="42" fill="#24325b" stroke="#9c8cff" stroke-width="4"/><text x="185" y="357" fill="#fff" font-weight="800">2 蒐集證據</text><text x="185" y="390" fill="#bdd0e8">文件、設定、測試與紀錄</text></g><g><circle cx="110" cy="520" r="42" fill="#143b45" stroke="#57f0c1" stroke-width="4"/><text x="185" y="512" fill="#fff" font-weight="800">3 院內評分</text><text x="185" y="545" fill="#bdd0e8">理由、例外與共同核准</text></g><g><circle cx="110" cy="675" r="42" fill="#49311f" stroke="#ffb86b" stroke-width="4"/><text x="185" y="667" fill="#fff" font-weight="800">4 品質檢查</text><text x="185" y="700" fill="#bdd0e8">缺漏、偏差、去識別</text></g><g><circle cx="110" cy="830" r="42" fill="#163852" stroke="#63e6ff" stroke-width="4"/><text x="185" y="822" fill="#fff" font-weight="800">5 分層彙總</text><text x="185" y="855" fill="#bdd0e8">規模、服務類型與同群比較</text></g><g><circle cx="110" cy="985" r="42" fill="#24325b" stroke="#9c8cff" stroke-width="4"/><text x="185" y="977" fill="#fff" font-weight="800">6 改善決策</text><text x="185" y="1010" fill="#bdd0e8">責任、資源、期限與驗收</text></g><g><circle cx="110" cy="1140" r="42" fill="#143b45" stroke="#57f0c1" stroke-width="4"/><text x="185" y="1132" fill="#fff" font-weight="800">7 重測驗收</text><text x="185" y="1165" fill="#bdd0e8">追蹤趨勢並關閉缺口</text></g></g></svg>
