<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Linux 核心修補的風險、控制與驗收證據</title><desc id="desc">將漏盤、只安裝未重啟、全面同時重啟及忽略入侵跡象等風險，對應控制與可查驗證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">風險、控制與證據必須成對</text><text x="58" y="108" fill="#a9bfdf" font-size="20">結案條件不是「已派送更新」，而是執行核心與臨床功能都有證據</text>
<text x="80" y="170" fill="#ff9fc1" font-size="23" font-weight="700">失敗模式</text><text x="455" y="170" fill="#69e7ff" font-size="23" font-weight="700">控制</text><text x="845" y="170" fill="#7ff3cf" font-size="23" font-weight="700">驗收證據</text>
<g font-size="19"><rect x="55" y="195" width="330" height="105" rx="20" fill="#301d34" stroke="#ff7da9"/><text x="80" y="237" fill="#fff" font-weight="700">設備／虛擬機漏盤</text><text x="80" y="272" fill="#d8c8d2">清冊只看應用，未連結核心</text><rect x="425" y="195" width="330" height="105" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="450" y="237" fill="#fff" font-weight="700">服務—主機—核心關聯</text><text x="450" y="272" fill="#c8dced">納入設備商與託管資產</text><rect x="795" y="195" width="350" height="105" rx="20" fill="#123429" stroke="#5aefbe"/><text x="820" y="237" fill="#fff" font-weight="700">盤點覆蓋率與例外擁有人</text><text x="820" y="272" fill="#cae6dc">版本、啟動時間、依賴服務</text>
<rect x="55" y="325" width="330" height="105" rx="20" fill="#301d34" stroke="#ff7da9"/><text x="80" y="367" fill="#fff" font-weight="700">更新已裝但仍跑舊核心</text><text x="80" y="402" fill="#d8c8d2">掃描只讀套件狀態</text><rect x="425" y="325" width="330" height="105" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="450" y="367" fill="#fff" font-weight="700">維護窗內重啟與回查</text><text x="450" y="402" fill="#c8dced">確認實際執行版本</text><rect x="795" y="325" width="350" height="105" rx="20" fill="#123429" stroke="#5aefbe"/><text x="820" y="367" fill="#fff" font-weight="700">uname／啟動紀錄／掃描</text><text x="820" y="402" fill="#cae6dc">三者時間與版本一致</text>
<rect x="55" y="455" width="330" height="105" rx="20" fill="#301d34" stroke="#ff7da9"/><text x="80" y="497" fill="#fff" font-weight="700">所有節點同時重啟</text><text x="80" y="532" fill="#d8c8d2">備援與臨床服務一併中斷</text><rect x="425" y="455" width="330" height="105" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="450" y="497" fill="#fff" font-weight="700">先切換、金絲雀、分批</text><text x="450" y="532" fill="#c8dced">每批設停止與回復條件</text><rect x="795" y="455" width="350" height="105" rx="20" fill="#123429" stroke="#5aefbe"/><text x="820" y="497" fill="#fff" font-weight="700">切換、交易與回復測試</text><text x="820" y="532" fill="#cae6dc">RTO、錯誤率、臨床簽核</text>
<rect x="55" y="585" width="330" height="105" rx="20" fill="#301d34" stroke="#ff7da9"/><text x="80" y="627" fill="#fff" font-weight="700">修補覆蓋入侵跡象</text><text x="80" y="662" fill="#d8c8d2">重啟後直接宣告安全</text><rect x="425" y="585" width="330" height="105" rx="20" fill="#102b43" stroke="#69e7ff"/><text x="450" y="627" fill="#fff" font-weight="700">先分流、保全、再處置</text><text x="450" y="662" fill="#c8dced">必要時從可信來源重建</text><rect x="795" y="585" width="350" height="105" rx="20" fill="#123429" stroke="#5aefbe"/><text x="820" y="627" fill="#fff" font-weight="700">主機外日誌與調查結論</text><text x="820" y="662" fill="#cae6dc">憑證輪替與完整性證據</text></g></g></svg>
