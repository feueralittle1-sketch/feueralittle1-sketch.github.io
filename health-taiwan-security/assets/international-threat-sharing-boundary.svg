<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">醫療威脅情資分享與院內處置邊界</title><desc id="desc">外部官方與合作社群情資經資料治理閘門，對照院內資產與臨床服務後，形成偵測、阻擋、修補及回饋。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" fill="#f4f8ff" font-size="34" font-weight="800">從外部情資到臨床風險閉環</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><rect x="55" y="120" width="270" height="410" rx="28" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="190" y="165" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="700">外部情資來源</text><g fill="#d8e6fb" font-size="21"><text x="88" y="225">官方通報與漏洞資訊</text><text x="88" y="285">醫療社群與合作夥伴</text><text x="88" y="345">事件指標、TTP、建議措施</text><text x="88" y="405">信心、時效與分享標記</text></g>
<path d="M330 325H425" stroke="#63e6ff" stroke-width="8" marker-end="url(#a)"/>
<rect x="430" y="105" width="340" height="445" rx="30" fill="#172b4d" stroke="#a997ff" stroke-width="4" filter="url(#glow)"/><text x="600" y="155" text-anchor="middle" fill="#c5baff" font-size="26" font-weight="800">醫院情資治理閘門</text><g fill="#fff" font-size="22" text-anchor="middle"><text x="600" y="220">去除病人與非必要識別資料</text><text x="600" y="280">驗證來源、時間、信心與適用範圍</text><text x="600" y="340">對照資產、版本、身分與外部曝險</text><text x="600" y="400">映射臨床服務與處置優先序</text><text x="600" y="460">核准分享標記、接收者與保存期限</text></g>
<path d="M775 325H870" stroke="#57f0c1" stroke-width="8" marker-end="url(#b)"/>
<rect x="875" y="120" width="270" height="410" rx="28" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="1010" y="165" text-anchor="middle" fill="#57f0c1" font-size="25" font-weight="700">院內行動與回饋</text><g fill="#d9fff3" font-size="21"><text x="912" y="225">偵測與獵捕</text><text x="912" y="285">阻擋、隔離與修補</text><text x="912" y="345">臨床影響與降級判定</text><text x="912" y="405">結果、誤報與新證據回饋</text></g>
<path d="M1010 535C1010 610 190 610 190 535" fill="none" stroke="#ffb86b" stroke-width="5" stroke-dasharray="12 10"/><text x="600" y="632" text-anchor="middle" fill="#ffcf99" font-size="22">只分享最小必要資料；每一筆情資都要留下決策、動作與結果</text></g>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#57f0c1"/></marker></defs></svg>