<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全文件失效風險與控制</title><desc id="desc">四類文件失效風險分別對應版本、場域、責任與變更控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="820" rx="28" fill="url(#bg)"/>
<text x="600" y="58" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="700" fill="#f4f8ff">文件失效風險與可驗收控制</text><text x="230" y="125" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#fb7185">風險</text><text x="615" y="125" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#5eead4">控制</text><text x="1025" y="125" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#67e8f9">驗收證據</text><rect x="45" y="155" width="1110" height="118" rx="20" fill="#102742" stroke="#35516f"/><text x="165" y="205" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#f4f8ff">版本失配</text><text x="165" y="237" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">文件對不到實際韌體或雲端</text><text x="615" y="203" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="21" font-weight="700" fill="#5eead4">資產指紋＋版本基線</text><text x="615" y="233" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="500" fill="#b8c8df">差異清單</text><text x="1025" y="218" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="700" fill="#67e8f9">版本一致率／差異關閉</text><rect x="45" y="300" width="1110" height="118" rx="20" fill="#102742" stroke="#35516f"/><text x="165" y="350" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#f4f8ff">場域落差</text><text x="165" y="382" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">預設網路與院內部署不同</text><text x="615" y="348" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="21" font-weight="700" fill="#5eead4">隔離測試＋連線白名單</text><text x="615" y="378" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="500" fill="#b8c8df">臨床回歸</text><text x="1025" y="363" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="700" fill="#67e8f9">負向測試／放行紀錄</text><rect x="45" y="445" width="1110" height="118" rx="20" fill="#102742" stroke="#35516f"/><text x="165" y="495" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#f4f8ff">責任空白</text><text x="165" y="527" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">更新、事件與遠端維護無主責</text><text x="615" y="493" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="21" font-weight="700" fill="#5eead4">RACI＋時限</text><text x="615" y="523" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="500" fill="#b8c8df">供應商會話證據</text><text x="1025" y="508" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="700" fill="#67e8f9">聯絡演練／會話日誌</text><rect x="45" y="590" width="1110" height="118" rx="20" fill="#102742" stroke="#35516f"/><text x="165" y="640" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="800" fill="#f4f8ff">變更失聯</text><text x="165" y="672" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">更新後文件、組態與監測未同步</text><text x="615" y="638" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="21" font-weight="700" fill="#5eead4">變更觸發器＋重驗</text><text x="615" y="668" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="500" fill="#b8c8df">例外到期</text><text x="1025" y="653" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="700" fill="#67e8f9">重驗完成率／例外清單</text><text x="600" y="760" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="700" fill="#fbbf24">文件完整度不等於控制有效度；有效度必須由場域測試與持續證據確認</text></svg>