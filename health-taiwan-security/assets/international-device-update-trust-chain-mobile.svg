<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc"><title id="title">醫療設備安全更新信任鏈手機版</title><desc id="desc">製造商發布、院方驗證、隔離測試、受控部署與獨立證據保存的垂直流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13264a"/></linearGradient></defs><rect width="760" height="1120" rx="30" fill="url(#bg)"/><g font-family="Inter,Noto Sans TC,sans-serif"><text x="42" y="64" fill="#f4f8ff" font-size="31" font-weight="800">醫療設備安全更新信任鏈</text><text x="42" y="101" fill="#9fb3d9" font-size="18">每一關都要有可驗證證據與停止條件</text><g fill="#102744" stroke="#63e6ff" stroke-width="2"><rect x="55" y="145" width="650" height="155" rx="24"/><rect x="55" y="330" width="650" height="155" rx="24"/><rect x="55" y="515" width="650" height="155" rx="24"/><rect x="55" y="700" width="650" height="155" rx="24"/></g><g fill="#63e6ff" font-size="20" font-weight="700"><text x="85" y="185">01 製造商發布</text><text x="85" y="370">02 院方驗證</text><text x="85" y="555">03 隔離測試</text><text x="85" y="740">04 受控部署</text></g><g fill="#e6eefc" font-size="21"><text x="85" y="230">簽章、雜湊、適用型號、版本、回退條件</text><text x="85" y="415">可信來源、簽章鏈、完整性與弱點對應</text><text x="85" y="600">設備功能、資料介接、失敗與斷電情境</text><text x="85" y="785">小批次、停止條件、臨床驗收與監測</text></g><g fill="#71a7ff" font-size="34"><text x="362" y="323">↓</text><text x="362" y="508">↓</text><text x="362" y="693">↓</text></g><rect x="55" y="900" width="650" height="150" rx="24" fill="#0d213c" stroke="#9c8cff" stroke-width="2"/><text x="85" y="942" fill="#c8bbff" font-size="20" font-weight="700">獨立證據面</text><text x="85" y="985" fill="#e6eefc" font-size="20">保存套件指紋、測試、批次、異常、回退</text><text x="85" y="1020" fill="#9fb3d9" font-size="18">以及每台設備的版本與臨床簽核。</text></g></svg>