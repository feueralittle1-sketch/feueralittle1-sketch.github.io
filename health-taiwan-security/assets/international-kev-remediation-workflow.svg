<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療已知遭利用漏洞處置流程</title><desc id="desc">從接收 KEV 與供應商訊號、比對資產、判斷臨床風險，到測試、部署、驗證及例外追蹤的七步流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#18244c"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#72f0c5"/></marker></defs>
<rect width="1200" height="760" rx="32" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="800">從威脅情報到驗證關閉：七步修補工作流</text><text x="60" y="112" fill="#a8bad8" font-size="20">每一步都有責任人、時限與證據，避免把「已派工」誤當「已降低風險」</text>
<g font-size="20" text-anchor="middle"><rect x="45" y="190" width="145" height="130" rx="22" fill="#10324b" stroke="#63e6ff" stroke-width="2"/><text x="117" y="235" fill="#63e6ff" font-weight="800">01</text><text x="117" y="275" fill="#fff" font-weight="700">接收訊號</text><text x="117" y="305" fill="#c8d8ed" font-size="16">KEV／公告</text>
<rect x="205" y="190" width="145" height="130" rx="22" fill="#10324b" stroke="#63e6ff" stroke-width="2"/><text x="277" y="235" fill="#63e6ff" font-weight="800">02</text><text x="277" y="275" fill="#fff" font-weight="700">比對資產</text><text x="277" y="305" fill="#c8d8ed" font-size="16">版本／位置</text>
<rect x="365" y="190" width="145" height="130" rx="22" fill="#17365e" stroke="#9c8cff" stroke-width="2"/><text x="437" y="235" fill="#b8aaff" font-weight="800">03</text><text x="437" y="275" fill="#fff" font-weight="700">確認可達</text><text x="437" y="305" fill="#c8d8ed" font-size="16">路徑／權限</text>
<rect x="525" y="190" width="145" height="130" rx="22" fill="#17365e" stroke="#ff9cab" stroke-width="2"/><text x="597" y="235" fill="#ffb2bd" font-weight="800">04</text><text x="597" y="275" fill="#fff" font-weight="700">臨床分級</text><text x="597" y="305" fill="#c8d8ed" font-size="16">服務／替代</text>
<rect x="685" y="190" width="145" height="130" rx="22" fill="#10324b" stroke="#ffd277" stroke-width="2"/><text x="757" y="235" fill="#ffd277" font-weight="800">05</text><text x="757" y="275" fill="#fff" font-weight="700">測試處置</text><text x="757" y="305" fill="#c8d8ed" font-size="16">補丁／隔離</text>
<rect x="845" y="190" width="145" height="130" rx="22" fill="#10324b" stroke="#72f0c5" stroke-width="2"/><text x="917" y="235" fill="#72f0c5" font-weight="800">06</text><text x="917" y="275" fill="#fff" font-weight="700">分批部署</text><text x="917" y="305" fill="#c8d8ed" font-size="16">監測／回復</text>
<rect x="1005" y="190" width="150" height="130" rx="22" fill="#10324b" stroke="#72f0c5" stroke-width="2"/><text x="1080" y="235" fill="#72f0c5" font-weight="800">07</text><text x="1080" y="275" fill="#fff" font-weight="700">驗證關閉</text><text x="1080" y="305" fill="#c8d8ed" font-size="16">覆蓋／例外</text></g>
<g stroke="#72f0c5" stroke-width="4" marker-end="url(#a)"><path d="M190 255h10"/><path d="M350 255h10"/><path d="M510 255h10"/><path d="M670 255h10"/><path d="M830 255h10"/><path d="M990 255h10"/></g>
<rect x="90" y="440" width="460" height="155" rx="26" fill="#111f3d" stroke="#ff9cab" stroke-width="2"/><text x="320" y="486" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">無法立即修補</text><text x="320" y="528" text-anchor="middle" fill="#c8d8ed" font-size="19">先隔離、關閉入口、限制帳號、提高偵測</text><text x="320" y="563" text-anchor="middle" fill="#ffb2bd" font-size="18">例外必須具名、限期並設定重新評估事件</text>
<rect x="650" y="440" width="460" height="155" rx="26" fill="#111f3d" stroke="#72f0c5" stroke-width="2"/><text x="880" y="486" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">完成不等於安裝成功</text><text x="880" y="528" text-anchor="middle" fill="#c8d8ed" font-size="19">重新掃描、確認版本、檢查臨床功能與告警</text><text x="880" y="563" text-anchor="middle" fill="#72f0c5" font-size="18">以覆蓋率、失敗清單與殘餘風險證明關閉</text>
<text x="60" y="690" fill="#9fb3d9" font-size="18">節奏設計：高可信威脅訊號先進快速通道；所有變更仍保留病人安全檢核與失敗回復</text></g></svg>