<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">備份管理風險、控制與驗收證據</title><desc id="desc">五種備份管理失敗情境分別對應權限分離、不可變副本、外部日誌、可信重建與隔離還原，並列出驗收證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/>
<g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">從失敗情境反推控制與證據</text><text x="60" y="108" fill="#a9bfdf" font-size="20">驗收重點不是「工作成功」，而是可信還原能力可被重現</text>
<text x="175" y="165" text-anchor="middle" fill="#ff9fc0" font-size="23" font-weight="700">風險</text><text x="585" y="165" text-anchor="middle" fill="#68e8ff" font-size="23" font-weight="700">控制</text><text x="1000" y="165" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">驗收證據</text>
<g font-size="19"><rect x="50" y="190" width="290" height="88" rx="18" fill="#27172d" stroke="#ff7aa8"/><text x="195" y="226" text-anchor="middle" fill="#fff" font-weight="700">管理主機失陷</text><text x="195" y="255" text-anchor="middle" fill="#dce8f8">可改排程與還原設定</text><rect x="385" y="190" width="400" height="88" rx="18" fill="#0c203b" stroke="#68e8ff"/><text x="585" y="226" text-anchor="middle" fill="#fff" font-weight="700">可信映像重建＋組態白名單</text><text x="585" y="255" text-anchor="middle" fill="#dce8f8">不沿用可疑外掛與快取</text><rect x="830" y="190" width="320" height="88" rx="18" fill="#102c32" stroke="#59efbe"/><text x="990" y="226" text-anchor="middle" fill="#fff" font-weight="700">映像雜湊與基線差異</text><text x="990" y="255" text-anchor="middle" fill="#dce8f8">重建工單與掃描結果</text>
<rect x="50" y="298" width="290" height="88" rx="18" fill="#27172d" stroke="#ff7aa8"/><text x="195" y="334" text-anchor="middle" fill="#fff" font-weight="700">高權限憑證外洩</text><text x="195" y="363" text-anchor="middle" fill="#dce8f8">修補後仍可持續存取</text><rect x="385" y="298" width="400" height="88" rx="18" fill="#0c203b" stroke="#68e8ff"/><text x="585" y="334" text-anchor="middle" fill="#fff" font-weight="700">短效憑證＋權限拆分＋輪替</text><text x="585" y="363" text-anchor="middle" fill="#dce8f8">撤銷既有工作階段</text><rect x="830" y="298" width="320" height="88" rx="18" fill="#102c32" stroke="#59efbe"/><text x="990" y="334" text-anchor="middle" fill="#fff" font-weight="700">舊憑證拒絕測試</text><text x="990" y="363" text-anchor="middle" fill="#dce8f8">具名角色核准紀錄</text>
<rect x="50" y="406" width="290" height="88" rx="18" fill="#27172d" stroke="#ff7aa8"/><text x="195" y="442" text-anchor="middle" fill="#fff" font-weight="700">備份遭刪除或改寫</text><text x="195" y="471" text-anchor="middle" fill="#dce8f8">良好副本被同步覆蓋</text><rect x="385" y="406" width="400" height="88" rx="18" fill="#0c203b" stroke="#68e8ff"/><text x="585" y="442" text-anchor="middle" fill="#fff" font-weight="700">不可變／離線副本＋保留鎖定</text><text x="585" y="471" text-anchor="middle" fill="#dce8f8">刪除與政策變更雙人控制</text><rect x="830" y="406" width="320" height="88" rx="18" fill="#102c32" stroke="#59efbe"/><text x="990" y="442" text-anchor="middle" fill="#fff" font-weight="700">保留狀態與刪除測試</text><text x="990" y="471" text-anchor="middle" fill="#dce8f8">跨權限域副本清冊</text>
<rect x="50" y="514" width="290" height="88" rx="18" fill="#27172d" stroke="#ff7aa8"/><text x="195" y="550" text-anchor="middle" fill="#fff" font-weight="700">日誌與主機同域</text><text x="195" y="579" text-anchor="middle" fill="#dce8f8">事件時間線可被抹除</text><rect x="385" y="514" width="400" height="88" rx="18" fill="#0c203b" stroke="#68e8ff"/><text x="585" y="550" text-anchor="middle" fill="#fff" font-weight="700">即時外送＋唯讀證據庫</text><text x="585" y="579" text-anchor="middle" fill="#dce8f8">獨立身分與時間同步</text><rect x="830" y="514" width="320" height="88" rx="18" fill="#102c32" stroke="#59efbe"/><text x="990" y="550" text-anchor="middle" fill="#fff" font-weight="700">缺口監測與事件時間線</text><text x="990" y="579" text-anchor="middle" fill="#dce8f8">外送延遲紀錄</text>
<rect x="50" y="622" width="290" height="88" rx="18" fill="#27172d" stroke="#ff7aa8"/><text x="195" y="658" text-anchor="middle" fill="#fff" font-weight="700">盲目還原受污染內容</text><text x="195" y="687" text-anchor="middle" fill="#dce8f8">再次導入惡意內容</text><rect x="385" y="622" width="400" height="88" rx="18" fill="#0c203b" stroke="#68e8ff"/><text x="585" y="658" text-anchor="middle" fill="#fff" font-weight="700">隔離掃描＋相依與臨床測試</text><text x="585" y="687" text-anchor="middle" fill="#dce8f8">分批回切並保留停止條件</text><rect x="830" y="622" width="320" height="88" rx="18" fill="#102c32" stroke="#59efbe"/><text x="990" y="658" text-anchor="middle" fill="#fff" font-weight="700">還原紀錄與 RTO／RPO</text><text x="990" y="687" text-anchor="middle" fill="#dce8f8">臨床擁有人簽核</text></g></g></svg>
