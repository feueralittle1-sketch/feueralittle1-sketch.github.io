<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療數位憑證信任鏈與服務邊界</title><desc id="desc">根憑證、簽發服務、醫院憑證清冊與臨床服務形成信任鏈，監測與備援控制位於獨立治理層。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#162957"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#65e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="62" y="72" fill="#f8fbff" font-size="36" font-weight="800">醫療憑證信任鏈：到期不是小故障，而是服務邊界失效</text><text x="62" y="112" fill="#a8bddc" font-size="22">把公開入口、內部 API、設備與管理介面的憑證納入同一份可追溯清冊</text>
<rect x="60" y="190" width="230" height="300" rx="28" fill="#102746" stroke="#58d8ff" stroke-width="3"/><text x="175" y="242" text-anchor="middle" fill="#77e5ff" font-size="27" font-weight="700">信任來源</text><text x="175" y="310" text-anchor="middle" fill="#fff" font-size="24">根與中繼憑證</text><text x="175" y="360" text-anchor="middle" fill="#fff" font-size="24">簽發與撤銷</text><text x="175" y="410" text-anchor="middle" fill="#a9bddb" font-size="21">責任與政策</text>
<path d="M300 340H405" stroke="#65e6ff" stroke-width="8" marker-end="url(#a)"/>
<rect x="420" y="150" width="360" height="390" rx="34" fill="#17294d" stroke="#a491ff" stroke-width="4"/><text x="600" y="207" text-anchor="middle" fill="#c3b8ff" font-size="30" font-weight="800">院級憑證治理</text><rect x="470" y="245" width="260" height="62" rx="17" fill="#253965"/><text x="600" y="286" text-anchor="middle" fill="#fff" font-size="24">清冊與服務擁有者</text><rect x="470" y="330" width="260" height="62" rx="17" fill="#253965"/><text x="600" y="371" text-anchor="middle" fill="#fff" font-size="24">到期與撤銷監測</text><rect x="470" y="415" width="260" height="62" rx="17" fill="#253965"/><text x="600" y="456" text-anchor="middle" fill="#fff" font-size="24">續期、部署與回退</text>
<path d="M790 340H895" stroke="#72f0c1" stroke-width="8" marker-end="url(#a)"/>
<rect x="910" y="160" width="230" height="370" rx="28" fill="#123a3c" stroke="#72f0c1" stroke-width="3"/><text x="1025" y="214" text-anchor="middle" fill="#82f7cc" font-size="27" font-weight="700">臨床服務</text><text x="1025" y="285" text-anchor="middle" fill="#fff" font-size="23">病人入口</text><text x="1025" y="330" text-anchor="middle" fill="#fff" font-size="23">API／介接</text><text x="1025" y="375" text-anchor="middle" fill="#fff" font-size="23">醫療設備</text><text x="1025" y="420" text-anchor="middle" fill="#fff" font-size="23">管理介面</text><text x="1025" y="475" text-anchor="middle" fill="#a9bddb" font-size="20">身分與加密通道</text>
<rect x="60" y="595" width="1080" height="72" rx="20" fill="#0b1d36" stroke="#294467"/><text x="600" y="638" text-anchor="middle" fill="#d9e8fb" font-size="23">治理重點：知道每張憑證保護哪項服務、何時到期、誰能更換，以及失敗時如何回退</text></svg>
