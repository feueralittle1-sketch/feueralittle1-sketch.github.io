<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">手機版基因資料受控分析信任邊界</title><desc id="desc">基因資料由資料來源進入受控分析環境，再經輸出審查產生最小必要結果。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172b58"/></linearGradient><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e5ff"/></marker></defs><rect width="720" height="1100" rx="32" fill="url(#g)"/><text x="42" y="70" fill="#fff" font-size="34" font-weight="800">基因資料受控分析</text><text x="42" y="112" fill="#a9bddb" font-size="23">資料不直接交付，結果才可離開</text><rect x="70" y="165" width="580" height="190" rx="28" fill="#102746" stroke="#58d8ff" stroke-width="3"/><text x="360" y="215" text-anchor="middle" fill="#77e5ff" font-size="30" font-weight="700">資料來源</text><text x="360" y="268" text-anchor="middle" fill="#fff" font-size="25">定序資料＋臨床表型＋研究同意</text><text x="360" y="315" text-anchor="middle" fill="#a9bddb" font-size="22">分類、標記、加密</text><path d="M360 365v70" stroke="#67e5ff" stroke-width="8" marker-end="url(#m)"/><rect x="70" y="450" width="580" height="350" rx="30" fill="#17294d" stroke="#a491ff" stroke-width="4"/><text x="360" y="505" text-anchor="middle" fill="#c3b8ff" font-size="30" font-weight="800">受控分析環境</text><rect x="120" y="545" width="480" height="62" rx="16" fill="#253965"/><text x="360" y="586" text-anchor="middle" fill="#fff" font-size="24">身分與機構驗證</text><rect x="120" y="625" width="480" height="62" rx="16" fill="#253965"/><text x="360" y="666" text-anchor="middle" fill="#fff" font-size="24">用途與資料使用限制</text><rect x="120" y="705" width="480" height="62" rx="16" fill="#253965"/><text x="360" y="746" text-anchor="middle" fill="#fff" font-size="24">隔離運算與完整稽核</text><path d="M360 810v60" stroke="#72f0c1" stroke-width="8" marker-end="url(#m)"/><rect x="70" y="885" width="580" height="145" rx="28" fill="#123a3c" stroke="#72f0c1" stroke-width="3"/><text x="360" y="935" text-anchor="middle" fill="#82f7cc" font-size="29" font-weight="700">輸出閘門</text><text x="360" y="982" text-anchor="middle" fill="#fff" font-size="24">揭露審查＋最小結果＋核准紀錄</text><text x="360" y="1065" text-anchor="middle" fill="#d8e6fa" font-size="21">撤權、輸出控制、異常處置持續有效</text></svg>