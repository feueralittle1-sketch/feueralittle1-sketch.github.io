<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc"><title id="title">區域醫療資安協作風險控制手機版</title><desc id="desc">五項協作失敗模式及其控制與驗收證據。</desc><rect width="390" height="760" rx="24" fill="#071421"/><text x="195" y="38" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">區域協作風險與關閉證據</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="25" y="70" width="340" height="118" rx="18" fill="#14273c"/><text x="45" y="100" fill="#ff9ccf" font-size="16" font-weight="800">容量資訊過期</text><text x="45" y="127" fill="#e6eefc" font-size="15">控制：時間戳、有效期、固定更新節奏</text><text x="45" y="153" fill="#57f0c1" font-size="15">證據：責任人、接收結果與逾時標記</text><rect x="25" y="202" width="340" height="118" rx="18" fill="#101f32"/><text x="45" y="232" fill="#ff9ccf" font-size="16" font-weight="800">敏感資料共享過度</text><text x="45" y="259" fill="#e6eefc" font-size="15">控制：最小欄位，識別資訊走受控通道</text><text x="45" y="285" fill="#57f0c1" font-size="15">證據：欄位清單、存取與刪除紀錄</text><rect x="25" y="334" width="340" height="118" rx="18" fill="#14273c"/><text x="45" y="364" fill="#ff9ccf" font-size="16" font-weight="800">未確認接收即啟運</text><text x="45" y="391" fill="#e6eefc" font-size="15">控制：雙向確認、拒收與替代路徑</text><text x="45" y="417" fill="#57f0c1" font-size="15">證據：接收碼、交接紀錄、到院閉環率</text><rect x="25" y="466" width="340" height="118" rx="18" fill="#101f32"/><text x="45" y="496" fill="#ff9ccf" font-size="16" font-weight="800">主要通訊失效</text><text x="45" y="523" fill="#e6eefc" font-size="15">控制：帶外聯絡簿、替代頻道、紙本包</text><text x="45" y="549" fill="#57f0c1" font-size="15">證據：通聯演練與改善追蹤</text><rect x="25" y="598" width="340" height="118" rx="18" fill="#14273c"/><text x="45" y="628" fill="#ff9ccf" font-size="16" font-weight="800">系統過早恢復</text><text x="45" y="655" fill="#e6eefc" font-size="15">控制：技術、資料、臨床三方放行</text><text x="45" y="681" fill="#57f0c1" font-size="15">證據：回復核准、回歸測試與監測</text><text x="195" y="742" fill="#ffd166" font-size="15" font-weight="700" text-anchor="middle">沒有確認碼與複核紀錄，就不是可驗收能力</text></g></svg>