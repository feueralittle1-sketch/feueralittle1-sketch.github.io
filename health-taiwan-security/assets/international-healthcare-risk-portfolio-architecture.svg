<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">醫療資安風險進入院級風險組合的架構</title><desc id="desc">臨床服務、資訊系統、醫療設備、第三方與設施風險經共同尺度與治理閘門，進入院級風險組合及資源決策。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="58" text-anchor="middle" fill="#f4f8ff" font-size="34" font-weight="800">把技術缺口轉成院級風險組合</text><text x="600" y="94" text-anchor="middle" fill="#9fb3d9" font-size="19">以臨床結果、共同依賴與責任邊界統一表達</text>
<g text-anchor="middle"><rect x="45" y="150" width="190" height="105" rx="22" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="140" y="194" fill="#63e6ff" font-size="21" font-weight="800">臨床服務</text><text x="140" y="226" fill="#d8e6fb" font-size="16">停診、延誤、病安</text><rect x="45" y="285" width="190" height="105" rx="22" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="140" y="329" fill="#c5baff" font-size="21" font-weight="800">資訊與設備</text><text x="140" y="361" fill="#e8e3ff" font-size="16">系統、裝置、身分</text><rect x="45" y="420" width="190" height="105" rx="22" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="140" y="464" fill="#57f0c1" font-size="21" font-weight="800">外部依賴</text><text x="140" y="496" fill="#d9fff3" font-size="16">雲端、供應商、設施</text></g>
<path d="M245 202H365M245 337H365M245 472H365" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/>
<rect x="375" y="145" width="355" height="385" rx="30" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="552" y="192" text-anchor="middle" fill="#a8c8ff" font-size="25" font-weight="800">共同風險治理閘門</text><g fill="#e6eefc" font-size="20"><text x="425" y="246">01　事件情境與影響結果</text><text x="425" y="299">02　可能性、衝擊與時間尺度</text><text x="425" y="352">03　共同依賴與連鎖風險</text><text x="425" y="405">04　控制、證據與剩餘風險</text><text x="425" y="458">05　主責、期限與升級門檻</text></g>
<path d="M740 337H825" stroke="#63e6ff" stroke-width="7" marker-end="url(#a)"/>
<rect x="840" y="145" width="315" height="385" rx="30" fill="#2b2340" stroke="#ffb86b" stroke-width="3"/><text x="997" y="192" text-anchor="middle" fill="#ffcf99" font-size="25" font-weight="800">院級風險組合</text><g text-anchor="middle"><text x="997" y="252" fill="#fff0dd" font-size="20">風險容量與容忍度</text><text x="997" y="307" fill="#fff0dd" font-size="20">資源與人力配置</text><text x="997" y="362" fill="#fff0dd" font-size="20">接受、降低、移轉、避免</text><text x="997" y="417" fill="#fff0dd" font-size="20">董事會／高階監督</text><text x="997" y="472" fill="#fff0dd" font-size="20">指標與重驗節奏</text></g><text x="600" y="615" text-anchor="middle" fill="#57f0c1" font-size="21">目的不是把分數相加，而是讓技術風險能與臨床、財務、營運風險共同決策</text></g></svg>