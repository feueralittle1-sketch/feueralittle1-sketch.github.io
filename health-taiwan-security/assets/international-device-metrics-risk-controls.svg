<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安指標風險與控制</title><desc id="desc">分母漂移、平均值掩蓋、資料盲區與錯誤激勵對應固定口徑、分層分布、未知揭露與臨床驗證。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="800" fill="#f4f8ff">四種漂亮數字陷阱，以及對應控制</text><g font-family="Inter,Noto Sans TC,sans-serif"><g fill="#3a1722" stroke="#fb7185" stroke-width="2"><rect x="60" y="115" width="480" height="115" rx="20"/><rect x="60" y="260" width="480" height="115" rx="20"/><rect x="60" y="405" width="480" height="115" rx="20"/><rect x="60" y="550" width="480" height="115" rx="20"/></g><g fill="#102742" stroke="#5eead4" stroke-width="2"><rect x="660" y="115" width="480" height="115" rx="20"/><rect x="660" y="260" width="480" height="115" rx="20"/><rect x="660" y="405" width="480" height="115" rx="20"/><rect x="660" y="550" width="480" height="115" rx="20"/></g><g fill="#f4f8ff" font-size="24" font-weight="800"><text x="90" y="158">分母漂移</text><text x="90" y="303">平均值掩蓋長尾</text><text x="90" y="448">沒有遙測＝沒有事件</text><text x="90" y="593">為達標跳過臨床驗證</text><text x="690" y="158">固定口徑與時間快照</text><text x="690" y="303">呈現分布、百分位與逾期件</text><text x="690" y="448">揭露未知比例與觀測缺口</text><text x="690" y="593">實機、負向與臨床回歸</text></g><g fill="#c6d4eb" font-size="19"><text x="90" y="194">資產增減讓覆蓋率失真</text><text x="90" y="339">少數高風險設備被平均</text><text x="90" y="484">盲區被誤寫成安全</text><text x="90" y="629">工單關閉但控制未證實</text><text x="690" y="194">保留版本、院區與排除清單</text><text x="690" y="339">高關鍵設備獨立分層</text><text x="690" y="484">缺資料本身列為治理風險</text><text x="690" y="629">以效果證據取代流程證據</text></g></g><g stroke="#67e8f9" stroke-width="4"><path d="M560 172H640"/><path d="M560 317H640"/><path d="M560 462H640"/><path d="M560 607H640"/></g></svg>