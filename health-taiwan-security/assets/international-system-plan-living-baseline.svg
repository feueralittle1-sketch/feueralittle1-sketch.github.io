<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療系統安全計畫的責任與證據架構</title>
<desc id="desc">臨床服務位於中央，系統邊界、責任分工、控制實作與客觀證據環繞，並由變更治理持續更新。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="60" y="68" fill="#ffffff" font-size="34" font-weight="700">醫療系統安全計畫：把文件連到服務、責任與證據</text><text x="60" y="105" fill="#9fb3d9" font-size="20">計畫的價值不在篇幅，而在每項控制都能找到邊界、主責、狀態與驗證結果</text>
<rect x="430" y="238" width="340" height="210" rx="28" fill="#132d52" stroke="#63e6ff" stroke-width="3" filter="url(#glow)"/><text x="600" y="294" text-anchor="middle" fill="#63e6ff" font-size="22" font-weight="700">臨床核心服務</text><text x="600" y="337" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">病歷・醫囑・影像・檢驗</text><text x="600" y="380" text-anchor="middle" fill="#c6d4eb" font-size="19">服務擁有者定義可接受風險</text><text x="600" y="413" text-anchor="middle" fill="#c6d4eb" font-size="19">技術團隊提供控制與證據</text>
<g font-family="sans-serif"><rect x="70" y="180" width="270" height="150" rx="24" fill="#12213d" stroke="#71a7ff" stroke-width="2"/><text x="205" y="225" text-anchor="middle" fill="#71a7ff" font-size="22" font-weight="700">系統邊界</text><text x="205" y="267" text-anchor="middle" fill="#ffffff" font-size="20">資產、介接、資料流</text><text x="205" y="299" text-anchor="middle" fill="#9fb3d9" font-size="18">雲端與供應商依賴</text><path d="M340 255 H418" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="390" width="270" height="150" rx="24" fill="#12213d" stroke="#9c8cff" stroke-width="2"/><text x="205" y="435" text-anchor="middle" fill="#b9aaff" font-size="22" font-weight="700">責任分工</text><text x="205" y="477" text-anchor="middle" fill="#ffffff" font-size="20">服務、系統、控制主責</text><text x="205" y="509" text-anchor="middle" fill="#9fb3d9" font-size="18">核准與風險接受者</text><path d="M340 465 H418" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="860" y="180" width="270" height="150" rx="24" fill="#12213d" stroke="#57f0c1" stroke-width="2"/><text x="995" y="225" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="700">控制實作</text><text x="995" y="267" text-anchor="middle" fill="#ffffff" font-size="20">身分、保護、偵測</text><text x="995" y="299" text-anchor="middle" fill="#9fb3d9" font-size="18">應變與復原配置</text><path d="M782 255 H850" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="860" y="390" width="270" height="150" rx="24" fill="#12213d" stroke="#ffb86b" stroke-width="2"/><text x="995" y="435" text-anchor="middle" fill="#ffbf7a" font-size="22" font-weight="700">客觀證據</text><text x="995" y="477" text-anchor="middle" fill="#ffffff" font-size="20">組態、測試、事件紀錄</text><text x="995" y="509" text-anchor="middle" fill="#9fb3d9" font-size="18">例外期限與改善狀態</text><path d="M782 465 H850" stroke="#63e6ff" stroke-width="3" marker-end="url(#arrow)"/></g>
<rect x="350" y="565" width="500" height="70" rx="22" fill="#0d3540" stroke="#57f0c1"/><text x="600" y="608" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">變更、事件、演練與供應商調整 → 觸發計畫更新</text>
</svg>