<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">手機版 PACS 資料完整性風險與控制對照</title><desc id="desc">失敗模式與預防、偵測、復原控制垂直排列。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071424"/><stop offset="1" stop-color="#112b48"/></linearGradient></defs><rect width="720" height="1180" rx="28" fill="url(#bg)"/><text x="42" y="64" fill="#f7fbff" font-size="29" font-weight="800">PACS 風險與控制對照</text><text x="42" y="102" fill="#9fb7d5" font-size="18">控制須同時覆蓋預防、偵測與復原</text><g font-family="Arial, Noto Sans TC, sans-serif"><rect x="64" y="145" width="592" height="210" rx="22" fill="#341f34" stroke="#ff7fa6"/><text x="100" y="193" fill="#ff9ab7" font-size="24" font-weight="800">失敗模式</text><text x="100" y="235" fill="#fff" font-size="19">誤刪 · 錯配 · 靜默損壞</text><text x="100" y="275" fill="#fff" font-size="19">備份污染 · 未驗證即放行</text><text x="100" y="315" fill="#cdb7c5" font-size="18">結果：重拍、延遲或錯誤臨床判斷</text><rect x="64" y="395" width="592" height="205" rx="22" fill="#17364e" stroke="#63e6ff"/><text x="100" y="443" fill="#63e6ff" font-size="24" font-weight="800">預防</text><text x="100" y="485" fill="#e8f8ff" font-size="19">刪除雙重核准 · 職務分離</text><text x="100" y="525" fill="#e8f8ff" font-size="19">版本保留 · 備份管理面分離</text><text x="100" y="565" fill="#e8f8ff" font-size="19">變更與回退閘門</text><rect x="64" y="640" width="592" height="205" rx="22" fill="#2a3157" stroke="#aa9cff"/><text x="100" y="688" fill="#c5b3ff" font-size="24" font-weight="800">偵測</text><text x="100" y="730" fill="#f0edff" font-size="19">刪除量告警 · 身分配對</text><text x="100" y="770" fill="#f0edff" font-size="19">雜湊與物件數校驗</text><text x="100" y="810" fill="#f0edff" font-size="19">主副本差異 · 獨立稽核</text><rect x="64" y="885" width="592" height="230" rx="22" fill="#17473f" stroke="#57f0c1"/><text x="100" y="933" fill="#72f5cd" font-size="24" font-weight="800">復原</text><text x="100" y="975" fill="#e5fff7" font-size="19">不可變副本 · 隔離還原</text><text x="100" y="1015" fill="#e5fff7" font-size="19">病人／序列對帳 · 臨床閱片</text><text x="100" y="1055" fill="#e5fff7" font-size="19">分批回寫 · 例外清冊</text><text x="100" y="1093" fill="#b3d9ce" font-size="18">任一驗證不足，不得直接回到正式環境</text></g></svg>