<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">手機版臨床影像受控採集信任邊界</title><desc id="desc">臨床需求依序通過採集治理閘門並進入正式紀錄區，個人裝置與未核准通訊服務列為禁止旁路。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0 0L10 0L5 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1280" rx="28" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="44" y="68" fill="#fff" font-size="34" font-weight="800">臨床影像受控採集</text><text x="44" y="110" fill="#63e6ff" font-size="34" font-weight="800">信任邊界</text><text x="44" y="150" fill="#9fb3d9" font-size="20">拍攝當下就進入正式、可追溯流程</text><rect x="52" y="205" width="616" height="190" rx="24" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="360" y="257" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">臨床需求</text><text x="360" y="305" text-anchor="middle" fill="#c6d4eb" font-size="21">診療、會診、追蹤；教學研究另行分流</text><text x="360" y="347" text-anchor="middle" fill="#57f0c1" font-size="21">先定義用途與必要範圍</text><path d="M360 395V450" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="52" y="470" width="616" height="305" rx="24" fill="#15294c" stroke="#a997ff" stroke-width="3"/><text x="360" y="525" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">採集治理閘門</text><text x="92" y="580" fill="#c6d4eb" font-size="21">① 身分與同意／法定依據</text><text x="92" y="626" fill="#c6d4eb" font-size="21">② 只拍必要部位與畫面</text><text x="92" y="672" fill="#c6d4eb" font-size="21">③ 受管裝置、加密、自動上傳</text><text x="92" y="718" fill="#c6d4eb" font-size="21">④ 擁有者、保存期、刪除責任</text><path d="M360 775V830" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="52" y="850" width="616" height="190" rx="24" fill="#102f3d" stroke="#57f0c1" stroke-width="2"/><text x="360" y="902" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">正式紀錄區</text><text x="360" y="950" text-anchor="middle" fill="#c6d4eb" font-size="21">電子病歷／核准影像庫</text><text x="360" y="992" text-anchor="middle" fill="#57f0c1" font-size="21">權限、稽核、保存與刪除可回查</text><rect x="52" y="1090" width="616" height="135" rx="22" fill="#351b37" stroke="#ff7fa3" stroke-width="2"/><text x="82" y="1138" fill="#ffb4c6" font-size="24" font-weight="800">禁止旁路</text><text x="82" y="1178" fill="#f3d7e1" font-size="20">個人相簿、私人雲端、一般聊天軟體、</text><text x="82" y="1208" fill="#f3d7e1" font-size="20">未核准 USB 與無留痕截圖。</text></g></svg>