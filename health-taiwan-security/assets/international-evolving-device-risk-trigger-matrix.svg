<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">雲端人工智慧與後量子密碼風險觸發矩陣</title>
<desc id="desc">比較雲端依賴、人工智慧功能與後量子密碼遷移的主要變更觸發、必要證據、常見失敗及醫院驗收問題。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071623"/><stop offset="1" stop-color="#111936"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="32" font-weight="700">三類技術的重驗觸發與證據</text><text x="60" y="108" fill="#9db7d7" font-size="20">同一套問卷無法覆蓋不同失效模式，驗收問題必須跟著技術依賴調整。</text>
<g font-family="sans-serif"><rect x="50" y="150" width="1100" height="470" rx="26" fill="#0d2136" stroke="#304967"/><g fill="#173552"><rect x="50" y="150" width="1100" height="80" rx="26"/><rect x="50" y="205" width="1100" height="25"/></g><g fill="#9beeff" font-size="20" font-weight="700" text-anchor="middle"><text x="155" y="198">技術</text><text x="395" y="198">重驗觸發</text><text x="665" y="198">必要證據</text><text x="955" y="198">驗收問題</text></g><g stroke="#304967" stroke-width="2"><path d="M260 150 V620"/><path d="M530 150 V620"/><path d="M800 150 V620"/><path d="M50 360 H1150"/><path d="M50 490 H1150"/></g>
<g font-size="22" font-weight="700" text-anchor="middle"><text x="155" y="295" fill="#65e7ff">雲端依賴</text><text x="155" y="425" fill="#c4b4ff">AI 功能</text><text x="155" y="555" fill="#70efc4">PQC 遷移</text></g><g fill="#d7e2ef" font-size="17"><text x="290" y="275">供應商、區域、介面或</text><text x="290" y="302">資料流向改變</text><text x="560" y="270">架構圖、責任矩陣、</text><text x="560" y="297">中斷與退出測試</text><text x="830" y="270">斷線時設備是否安全？</text><text x="830" y="297">資料與管理權如何收回？</text><text x="290" y="405">模型、資料、閾值、用途</text><text x="290" y="432">或第三方元件改變</text><text x="560" y="400">能力基線、負向測試、</text><text x="560" y="427">人工覆核與回退紀錄</text><text x="830" y="400">錯誤輸出能否被發現？</text><text x="830" y="427">誰能停止或降級功能？</text><text x="290" y="535">演算法、憑證、金鑰、</text><text x="290" y="562">函式庫或互通需求改變</text><text x="560" y="530">密碼清冊、效能與相容測試、</text><text x="560" y="557">雙軌切換及回復證據</text><text x="830" y="530">舊設備是否仍可互通？</text><text x="830" y="557">更新失敗能否安全回復？</text></g></g><text x="600" y="660" text-anchor="middle" fill="#a9bdd7" font-size="19">共同原則：記錄版本、責任、測試環境、失敗條件與下一次重驗日期。</text></svg>