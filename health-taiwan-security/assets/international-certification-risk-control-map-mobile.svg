<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">健康資訊系統認證誤用風險與控制手機版</title><desc id="desc">三種常見認證誤用分別對應邊界表、組態基線與端到端負向測試，更新後再持續重驗。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient></defs><rect width="720" height="1180" fill="url(#bg)"/><text x="40" y="66" fill="#fff" font-size="32" font-weight="800">認證誤用與控制</text><text x="40" y="105" fill="#9fb7db" font-size="20">有限證據不能擴張成整體安全結論。</text><g font-family="sans-serif"><rect x="60" y="150" width="600" height="270" rx="28" fill="#32243b" stroke="#ff91b8" stroke-width="3"/><text x="95" y="205" fill="#ffb6d0" font-size="25" font-weight="800">風險一｜範圍錯置</text><text x="95" y="250" fill="#ffe0ea" font-size="21">單一模組或版本被推論為整體部署安全</text><rect x="90" y="292" width="540" height="92" rx="22" fill="#123d45"/><text x="115" y="330" fill="#8ff5d7" font-size="21" font-weight="700">控制：版本、模組、介接與例外邊界表</text><text x="115" y="362" fill="#d9fff3" font-size="18">證據：逐項對應矩陣與缺口責任人</text><rect x="60" y="455" width="600" height="270" rx="28" fill="#32243b" stroke="#ff91b8" stroke-width="3"/><text x="95" y="510" fill="#ffb6d0" font-size="25" font-weight="800">風險二｜預設組態上線</text><text x="95" y="555" fill="#ffe0ea" font-size="21">角色過寬、共用帳號、稽核未外送</text><rect x="90" y="597" width="540" height="92" rx="22" fill="#123d45"/><text x="115" y="635" fill="#8ff5d7" font-size="21" font-weight="700">控制：核准基線與最小權限測試</text><text x="115" y="667" fill="#d9fff3" font-size="18">證據：組態快照、拒絕案例、日誌紀錄</text><rect x="60" y="760" width="600" height="270" rx="28" fill="#32243b" stroke="#ff91b8" stroke-width="3"/><text x="95" y="815" fill="#ffb6d0" font-size="25" font-weight="800">風險三｜介接繞過控制</text><text x="95" y="860" fill="#ffe0ea" font-size="21">API、設備或第三方路徑未套用相同政策</text><rect x="90" y="902" width="540" height="92" rx="22" fill="#123d45"/><text x="115" y="940" fill="#8ff5d7" font-size="21" font-weight="700">控制：負向測試與端到端事件追蹤</text><text x="115" y="972" fill="#d9fff3" font-size="18">證據：拒絕、撤權與完整時間線</text></g><rect x="55" y="1070" width="610" height="80" rx="26" fill="#2c294f" stroke="#b69cff" stroke-width="2"/><text x="360" y="1102" text-anchor="middle" fill="#e5ddff" font-size="19" font-weight="700">更新或重大變更後重新執行高風險情境</text><text x="360" y="1133" text-anchor="middle" fill="#cfc4ff" font-size="18">舊證據不能永久沿用</text></svg>
