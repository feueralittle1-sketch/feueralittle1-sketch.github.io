<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc"><title id="title">手機版醫療 TLS 遷移流程</title><desc id="desc">醫療 TLS 依序完成觀測、分級、設計、測試、部署與重驗。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#13284d"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3z" fill="#63e6ff"/></marker></defs><rect width="390" height="1040" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="22" y="42" fill="#fff" font-size="20" font-weight="800">六階段 TLS 遷移</text><text x="22" y="69" fill="#afc3e2" font-size="14">每一波都能停止、回退與重驗</text><g fill="#102b47" stroke-width="1.4"><rect x="22" y="100" width="346" height="120" rx="20" stroke="#63e6ff"/><rect x="22" y="248" width="346" height="120" rx="20" stroke="#82a9ff"/><rect x="22" y="396" width="346" height="120" rx="20" stroke="#c99cff"/><rect x="22" y="544" width="346" height="120" rx="20" stroke="#57f0c1"/><rect x="22" y="692" width="346" height="120" rx="20" stroke="#ffc857"/><rect x="22" y="840" width="346" height="120" rx="20" stroke="#ff8fab"/></g><g font-size="15" font-weight="700"><text x="45" y="132" fill="#63e6ff">01　觀測</text><text x="45" y="280" fill="#82a9ff">02　分級</text><text x="45" y="428" fill="#c99cff">03　設計</text><text x="45" y="576" fill="#57f0c1">04　測試</text><text x="45" y="724" fill="#ffc857">05　部署</text><text x="45" y="872" fill="#ff8fab">06　重驗</text></g><g fill="#fff" font-size="19" font-weight="800"><text x="45" y="168">建立實際握手清冊</text><text x="45" y="316">連回臨床與設備責任</text><text x="45" y="464">選擇目標與過渡路徑</text><text x="45" y="612">隔離驗證與臨床回歸</text><text x="45" y="760">小批次放行與停止條件</text><text x="45" y="908">監測降級與例外到期</text></g><g fill="#c2d3e8" font-size="14"><text x="45" y="197">端點、版本、套件、憑證</text><text x="45" y="345">服務影響、供應商、期限</text><text x="45" y="493">升級、隔離、替換或退場</text><text x="45" y="641">失敗、回退、效能與告警</text><text x="45" y="789">依服務波次保留回退窗</text><text x="45" y="937">舊握手歸零、退場結案</text></g><g stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M195 223V240"/><path d="M195 371V388"/><path d="M195 519V536"/><path d="M195 667V684"/><path d="M195 815V832"/></g><text x="195" y="1002" text-anchor="middle" fill="#b8cce6" font-size="14">驗收：成功率｜失敗率｜舊版本流量｜例外逾期</text></g></svg>