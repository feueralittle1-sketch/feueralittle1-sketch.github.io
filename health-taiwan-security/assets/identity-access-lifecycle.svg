<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療權限生命週期與緊急存取流程</title>
  <desc id="desc">一般權限依到職、異動、定期複核與離職撤權管理；緊急 break-glass 存取則經情境確認、短時授權、完整留痕及事後複核。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#111d3b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f5fbff" font-size="36" font-weight="800">兩條路徑：日常權限生命週期與緊急存取</text>
  <text x="70" y="112" fill="#9fb7d9" font-size="23">緊急不是免控管，而是把核准、時限與追查移到更快、更嚴謹的流程</text>
  <text x="70" y="175" fill="#63e6ff" font-size="27" font-weight="800">日常路徑</text>
  <g text-anchor="middle" font-size="21">
    <rect x="70" y="205" width="190" height="110" rx="22" fill="#12324d" stroke="#63e6ff" stroke-width="2"/><text x="165" y="250" fill="#e7f7ff" font-weight="700">到職</text><text x="165" y="283" fill="#a9c7df">依職務給基線</text>
    <path d="M260 260H310" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="320" y="205" width="190" height="110" rx="22" fill="#192c51" stroke="#9c8cff" stroke-width="2"/><text x="415" y="250" fill="#f0eaff" font-weight="700">異動</text><text x="415" y="283" fill="#c5bbe8">先撤舊、再給新</text>
    <path d="M510 260H560" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="570" y="205" width="190" height="110" rx="22" fill="#16394a" stroke="#57f0c1" stroke-width="2"/><text x="665" y="250" fill="#baffea" font-weight="700">定期複核</text><text x="665" y="283" fill="#acd7ca">主管＋系統擁有人</text>
    <path d="M760 260H810" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="820" y="205" width="190" height="110" rx="22" fill="#3b263e" stroke="#ff9bc8" stroke-width="2"/><text x="915" y="250" fill="#ffc7e1" font-weight="700">離職／到期</text><text x="915" y="283" fill="#e3bfd2">自動撤權與回收</text>
    <rect x="1030" y="205" width="105" height="110" rx="22" fill="#17324d" stroke="#71a7ff" stroke-width="2"/><text x="1082" y="248" fill="#c8dcff" font-weight="700">證據</text><text x="1082" y="280" fill="#a9bddc" font-size="18">工單</text><text x="1082" y="303" fill="#a9bddc" font-size="18">紀錄</text>
  </g>
  <text x="70" y="390" fill="#ff9bc8" font-size="27" font-weight="800">break-glass 緊急路徑</text>
  <g text-anchor="middle" font-size="20">
    <rect x="70" y="420" width="180" height="112" rx="22" fill="#3b263e" stroke="#ff9bc8" stroke-width="2"/><text x="160" y="464" fill="#ffd0e6" font-weight="700">臨床緊急情境</text><text x="160" y="498" fill="#dfb9cc">無替代路徑</text>
    <path d="M250 476H295" stroke="#ff9bc8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="305" y="420" width="180" height="112" rx="22" fill="#372e52" stroke="#c29cff" stroke-width="2"/><text x="395" y="464" fill="#eee3ff" font-weight="700">強化驗證</text><text x="395" y="498" fill="#cabee1">理由＋身分確認</text>
    <path d="M485 476H530" stroke="#ff9bc8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="540" y="420" width="180" height="112" rx="22" fill="#173b49" stroke="#57f0c1" stroke-width="2"/><text x="630" y="464" fill="#baffea" font-weight="700">短時授權</text><text x="630" y="498" fill="#b3dacf">限範圍、自動失效</text>
    <path d="M720 476H765" stroke="#ff9bc8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="775" y="420" width="180" height="112" rx="22" fill="#17334d" stroke="#71a7ff" stroke-width="2"/><text x="865" y="464" fill="#c8dcff" font-weight="700">完整留痕</text><text x="865" y="498" fill="#b7cae5">時間、查詢、異動</text>
    <path d="M955 476H1000" stroke="#ff9bc8" stroke-width="4" marker-end="url(#a)"/>
    <rect x="1010" y="420" width="125" height="112" rx="22" fill="#44322b" stroke="#ffbf69" stroke-width="2"/><text x="1072" y="464" fill="#ffd59d" font-weight="700">事後複核</text><text x="1072" y="498" fill="#e5cbb0">異常追查</text>
  </g>
  <rect x="70" y="585" width="1065" height="73" rx="22" fill="#0e263c" stroke="#355a7d" stroke-width="2"/>
  <text x="602" y="630" text-anchor="middle" fill="#dcecff" font-size="23">驗收重點：撤權延遲、孤兒帳號、複核完成率、緊急帳號使用後檢查率</text>
  <text x="600" y="693" text-anchor="middle" fill="#8ca7c8" font-size="20">每一個權限都要有來源、期限、擁有人與結束條件。</text>
</svg>
