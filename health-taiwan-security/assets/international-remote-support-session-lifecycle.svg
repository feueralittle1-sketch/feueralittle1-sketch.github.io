<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療遠端會話六階段生命週期</title><desc id="desc">遠端維護從盤點、分級、核准、開啟、監看到關閉複核，每階段都產生可驗收證據。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#112750"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">遠端會話的六階段控制</text><text x="60" y="108" fill="#9fb3d9" font-size="20">每次維護都是有開始、有範圍、有證據、可結束的任務</text>
<path d="M170 290H1030" stroke="#345b79" stroke-width="8"/><g fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M260 290H330"/><path d="M440 290H510"/><path d="M620 290H690"/><path d="M800 290H870"/></g>
<g font-family="sans-serif" text-anchor="middle"><g><circle cx="150" cy="290" r="72" fill="#123252" stroke="#63e6ff" stroke-width="3"/><text x="150" y="282" fill="#fff" font-size="23" font-weight="700">1 盤點</text><text x="150" y="313" fill="#bcefff" font-size="17">人、工具、代理</text><text x="150" y="430" fill="#9fb3d9" font-size="18">資產與擁有人</text></g><g><circle cx="330" cy="290" r="72" fill="#22234b" stroke="#9c8cff" stroke-width="3"/><text x="330" y="282" fill="#fff" font-size="23" font-weight="700">2 分級</text><text x="330" y="313" fill="#d5ceff" font-size="17">臨床與資料影響</text><text x="330" y="430" fill="#9fb3d9" font-size="18">允許能力基線</text></g><g><circle cx="510" cy="290" r="72" fill="#16364b" stroke="#57f0c1" stroke-width="3"/><text x="510" y="282" fill="#fff" font-size="23" font-weight="700">3 核准</text><text x="510" y="313" fill="#c9ffef" font-size="17">工單與時窗</text><text x="510" y="430" fill="#9fb3d9" font-size="18">責任與到期</text></g><g><circle cx="690" cy="290" r="72" fill="#123252" stroke="#63e6ff" stroke-width="3"/><text x="690" y="282" fill="#fff" font-size="23" font-weight="700">4 開啟</text><text x="690" y="313" fill="#bcefff" font-size="17">JIT 最小權限</text><text x="690" y="430" fill="#9fb3d9" font-size="18">目標與能力綁定</text></g><g><circle cx="870" cy="290" r="72" fill="#38213d" stroke="#ff7aa8" stroke-width="3"/><text x="870" y="282" fill="#fff" font-size="23" font-weight="700">5 監看</text><text x="870" y="313" fill="#ffd2e2" font-size="17">異常即中止</text><text x="870" y="430" fill="#9fb3d9" font-size="18">畫面與操作證據</text></g><g><circle cx="1050" cy="290" r="72" fill="#16364b" stroke="#57f0c1" stroke-width="3"/><text x="1050" y="282" fill="#fff" font-size="23" font-weight="700">6 關閉</text><text x="1050" y="313" fill="#c9ffef" font-size="17">撤權與複核</text><text x="1050" y="430" fill="#9fb3d9" font-size="18">結果與例外關閉</text></g></g>
<rect x="90" y="535" width="1020" height="100" rx="22" fill="#0d233d" stroke="#4b6a94"/><text x="130" y="575" fill="#8fe8ff" font-size="21" font-weight="700">驗收閉環</text><text x="130" y="609" fill="#d9e7fb" font-size="20">清冊完整率 → 逾時會話數 → 未核准檔案／命令數 → 錄影覆蓋率 → 關閉複核時效</text>
</svg>
