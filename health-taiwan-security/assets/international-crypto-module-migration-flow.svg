<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療加密模組遷移流程</title>
<desc id="desc">由資產盤點、證書核對、臨床分級、供應商計畫、隔離驗證到分批上線與退場的流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061321"/><stop offset="1" stop-color="#15183c"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/>
<text x="70" y="75" fill="#f4f9ff" font-size="36" font-weight="700">從「有加密」走到「可證明、可更新、可退場」</text><text x="70" y="116" fill="#9fb6d7" font-size="20">遷移先處理證據與依賴，再安排技術替換，避免把臨床系統推入未測試狀態。</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><g fill="#122a48" stroke="#4a6b91" stroke-width="2"><rect x="55" y="190" width="190" height="135" rx="24"/><rect x="280" y="190" width="190" height="135" rx="24"/><rect x="505" y="190" width="190" height="135" rx="24"/><rect x="730" y="190" width="190" height="135" rx="24"/><rect x="955" y="190" width="190" height="135" rx="24"/></g>
<g fill="#63e6ff" font-size="20" font-weight="700" text-anchor="middle"><text x="150" y="230">1 資產盤點</text><text x="375" y="230">2 證據核對</text><text x="600" y="230">3 臨床分級</text><text x="825" y="230">4 遷移設計</text><text x="1050" y="230">5 分批驗收</text></g>
<g fill="#dce9fb" font-size="17" text-anchor="middle"><text x="150" y="270">產品、模組、版本</text><text x="150" y="296">資料流與金鑰用途</text><text x="375" y="270">證書、政策文件</text><text x="375" y="296">驗證狀態與邊界</text><text x="600" y="270">病人安全、停機容忍</text><text x="600" y="296">暴露面與可替代性</text><text x="825" y="270">供應商更新、補償控制</text><text x="825" y="296">回退與退場路線</text><text x="1050" y="270">互通、效能、復原</text><text x="1050" y="296">證據封存與監測</text></g>
<g stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"><path d="M245 258H275"/><path d="M470 258H500"/><path d="M695 258H725"/><path d="M920 258H950"/></g>
<rect x="85" y="410" width="1030" height="205" rx="30" fill="#0d223c" stroke="#a997ff" stroke-width="3"/><text x="120" y="458" fill="#cbbfff" font-size="24" font-weight="700">三條處置通道</text><rect x="120" y="490" width="290" height="82" rx="18" fill="#16374a"/><text x="265" y="522" text-anchor="middle" fill="#78f5cf" font-size="20" font-weight="700">可直接更新</text><text x="265" y="550" text-anchor="middle" fill="#dffcf4" font-size="17">隔離驗證後分批部署</text><rect x="455" y="490" width="290" height="82" rx="18" fill="#3b3420"/><text x="600" y="522" text-anchor="middle" fill="#ffd166" font-size="20" font-weight="700">暫時不能更新</text><text x="600" y="550" text-anchor="middle" fill="#fff0c2" font-size="17">隔離、監控、限縮用途並定期限</text><rect x="790" y="490" width="290" height="82" rx="18" fill="#42243a"/><text x="935" y="522" text-anchor="middle" fill="#ff9ecf" font-size="20" font-weight="700">缺乏可接受路線</text><text x="935" y="550" text-anchor="middle" fill="#ffe0ef" font-size="17">替代產品、退出計畫與風險接受</text><text x="600" y="665" text-anchor="middle" fill="#9fb6d7" font-size="18">驗證狀態改變不等於立即停機；處置速度應由法域、契約、威脅與臨床風險共同決定。</text></g></svg>