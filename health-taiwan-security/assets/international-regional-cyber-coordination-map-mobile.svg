<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700" role="img" aria-labelledby="title desc"><title id="title">醫療資安事件的區域協調架構手機版</title><desc id="desc">受影響醫院將服務狀態送入區域協調節點，再配對接收醫院、急救轉運與公共溝通。</desc><rect width="390" height="700" rx="24" fill="#081726"/><text x="195" y="38" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">區域醫療資安事件協調</text><text x="195" y="64" fill="#a9bdd8" font-size="15" text-anchor="middle">技術狀態轉成臨床與運量決策</text><rect x="35" y="92" width="320" height="120" rx="20" fill="#102b3d" stroke="#63e6ff" stroke-width="2"/><text x="195" y="122" fill="#63e6ff" font-size="18" font-weight="800" text-anchor="middle">受影響醫院</text><text x="55" y="151" fill="#e6eefc" font-size="16">服務狀態｜床位與專科容量</text><text x="55" y="177" fill="#e6eefc" font-size="16">降級範圍｜轉診門檻｜更新時點</text><path d="M195 212V250" stroke="#8fe8ff" stroke-width="4"/><rect x="35" y="250" width="320" height="160" rx="22" fill="#172655" stroke="#b29cff" stroke-width="3"/><text x="195" y="282" fill="#d8ceff" font-size="18" font-weight="800" text-anchor="middle">區域協調節點</text><rect x="65" y="302" width="260" height="30" rx="10" fill="#23366f"/><text x="195" y="322" fill="#fff" font-size="16" text-anchor="middle">共同情勢圖</text><rect x="65" y="342" width="260" height="30" rx="10" fill="#23366f"/><text x="195" y="362" fill="#fff" font-size="16" text-anchor="middle">容量與資源配對</text><rect x="65" y="382" width="260" height="30" rx="10" fill="#23366f"/><text x="195" y="402" fill="#fff" font-size="16" text-anchor="middle">決策與更新紀錄</text><path d="M195 412V450" stroke="#8fe8ff" stroke-width="4"/><rect x="35" y="450" width="320" height="62" rx="18" fill="#123143" stroke="#57f0c1" stroke-width="2"/><text x="195" y="477" fill="#57f0c1" font-size="17" font-weight="800" text-anchor="middle">接收醫院</text><text x="195" y="500" fill="#e6eefc" font-size="15" text-anchor="middle">床位、專科、隔離條件</text><rect x="35" y="526" width="320" height="62" rx="18" fill="#302442" stroke="#ff9ccf" stroke-width="2"/><text x="195" y="553" fill="#ffb5db" font-size="17" font-weight="800" text-anchor="middle">EMS／轉運</text><text x="195" y="576" fill="#e6eefc" font-size="15" text-anchor="middle">路線、優先序、交接確認</text><rect x="35" y="602" width="320" height="62" rx="18" fill="#332b18" stroke="#ffd166" stroke-width="2"/><text x="195" y="629" fill="#ffd166" font-size="17" font-weight="800" text-anchor="middle">公共溝通</text><text x="195" y="652" fill="#e6eefc" font-size="15" text-anchor="middle">替代入口與就醫指引</text><text x="195" y="687" fill="#8fe8ff" font-size="15" font-weight="700" text-anchor="middle">每次更新都留下決策依據與複核時間</text></svg>