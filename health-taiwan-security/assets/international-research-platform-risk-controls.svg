<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">臨床研究平台事件風險與控制</title><desc id="desc">公開入口遺漏、證據遺失、憑證殘留、資料污染與過早恢復分別對應控制。</desc><rect width="1200" height="760" rx="28" fill="#08182b"/><text x="600" y="62" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="800" fill="#fff">更新完成不代表平台與資料已恢復可信</text><g font-family="Inter,Noto Sans TC,sans-serif"><text x="275" y="125" text-anchor="middle" font-size="25" font-weight="800" fill="#fb7185">失敗模式</text><text x="890" y="125" text-anchor="middle" font-size="25" font-weight="800" fill="#5eead4">對應控制</text><g font-size="22"><rect x="65" y="155" width="470" height="90" rx="20" fill="#2a1d2b" stroke="#fb7185"/><text x="100" y="210" fill="#fff">公開入口遺漏：只看主機版本</text><rect x="665" y="155" width="470" height="90" rx="20" fill="#12313a" stroke="#5eead4"/><text x="700" y="210" fill="#fff">問卷／外網／路由完整盤點</text><rect x="65" y="265" width="470" height="90" rx="20" fill="#2a1d2b" stroke="#fb7185"/><text x="100" y="320" fill="#fff">證據遺失：先重開機或覆寫</text><rect x="665" y="265" width="470" height="90" rx="20" fill="#12313a" stroke="#5eead4"/><text x="700" y="320" fill="#fff">主機、應用、資料庫日誌先保全</text><rect x="65" y="375" width="470" height="90" rx="20" fill="#2a1d2b" stroke="#fb7185"/><text x="100" y="430" fill="#fff">憑證殘留：只修補原主機</text><rect x="665" y="375" width="470" height="90" rx="20" fill="#12313a" stroke="#5eead4"/><text x="700" y="430" fill="#fff">可信重建＋帳號與秘密輪替</text><rect x="65" y="485" width="470" height="90" rx="20" fill="#2a1d2b" stroke="#fb7185"/><text x="100" y="540" fill="#fff">資料污染：備份覆蓋取代核對</text><rect x="665" y="485" width="470" height="90" rx="20" fill="#12313a" stroke="#5eead4"/><text x="700" y="540" fill="#fff">稽核軌跡、備份與研究端交叉驗證</text><rect x="65" y="595" width="470" height="90" rx="20" fill="#2a1d2b" stroke="#fb7185"/><text x="100" y="650" fill="#fff">過早恢復：入口先開、風險未關</text><rect x="665" y="595" width="470" height="90" rx="20" fill="#12313a" stroke="#5eead4"/><text x="700" y="650" fill="#fff">分階段放行＋持續監測＋治理核准</text></g><g stroke="#67e8f9" stroke-width="4"><path d="M545 200H655"/><path d="M545 310H655"/><path d="M545 420H655"/><path d="M545 530H655"/><path d="M545 640H655"/></g></g></svg>