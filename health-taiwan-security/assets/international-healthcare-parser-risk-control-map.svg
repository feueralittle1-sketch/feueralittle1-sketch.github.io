<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療解析器風險與控制證據圖</title>
  <desc id="desc">將 XML 外部實體、SQL 注入與影像解碼溢位三類輸入風險，對應資料外洩、任意操作與服務中斷，並列出預防控制及驗收證據。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#151c3b"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#f8fbff" font-size="34" font-weight="800">輸入風險 × 臨床衝擊 × 驗收證據</text><text x="60" y="108" fill="#9fb7d8" font-size="20">不同弱點需要不同控制，但都不能跳過臨床結果驗證</text>
  <g font-family="Inter, Noto Sans TC, sans-serif"><rect x="55" y="155" width="1090" height="70" rx="18" fill="#18314e"/><text x="185" y="198" text-anchor="middle" fill="#7eeaff" font-size="22" font-weight="800">輸入風險</text><text x="455" y="198" text-anchor="middle" fill="#ffb7c5" font-size="22" font-weight="800">可能衝擊</text><text x="760" y="198" text-anchor="middle" fill="#a4f7d4" font-size="22" font-weight="800">核心控制</text><text x="1020" y="198" text-anchor="middle" fill="#d5c9ff" font-size="22" font-weight="800">可驗收證據</text>
  <g font-size="19"><rect x="55" y="245" width="1090" height="115" rx="18" fill="#101f36" stroke="#385571"/><text x="185" y="285" text-anchor="middle" fill="#fff" font-weight="700">XML 外部實體</text><text x="185" y="317" text-anchor="middle" fill="#aec0d8">XXE</text><text x="455" y="286" text-anchor="middle" fill="#ffd6de">讀取內部資源</text><text x="455" y="318" text-anchor="middle" fill="#ffd6de">資料外送／阻斷</text><text x="760" y="286" text-anchor="middle" fill="#dffff1">停用外部實體</text><text x="760" y="318" text-anchor="middle" fill="#dffff1">限制出口與資源</text><text x="1020" y="286" text-anchor="middle" fill="#eeeaff">惡意樣本被拒</text><text x="1020" y="318" text-anchor="middle" fill="#eeeaff">無非預期 DNS／HTTP</text>
  <rect x="55" y="380" width="1090" height="115" rx="18" fill="#101f36" stroke="#385571"/><text x="185" y="420" text-anchor="middle" fill="#fff" font-weight="700">SQL 注入</text><text x="185" y="452" text-anchor="middle" fill="#aec0d8">結構訊息變指令</text><text x="455" y="421" text-anchor="middle" fill="#ffd6de">憑證揭露</text><text x="455" y="453" text-anchor="middle" fill="#ffd6de">檔案寫入／阻斷</text><text x="760" y="421" text-anchor="middle" fill="#dffff1">參數化查詢</text><text x="760" y="453" text-anchor="middle" fill="#dffff1">最小資料庫權限</text><text x="1020" y="421" text-anchor="middle" fill="#eeeaff">注入測試失敗關閉</text><text x="1020" y="453" text-anchor="middle" fill="#eeeaff">帳號權限差異</text>
  <rect x="55" y="515" width="1090" height="115" rx="18" fill="#101f36" stroke="#385571"/><text x="185" y="555" text-anchor="middle" fill="#fff" font-weight="700">影像解碼溢位</text><text x="185" y="587" text-anchor="middle" fill="#aec0d8">PNG／JPEG</text><text x="455" y="556" text-anchor="middle" fill="#ffd6de">程序崩潰</text><text x="455" y="588" text-anchor="middle" fill="#ffd6de">影像服務中斷</text><text x="760" y="556" text-anchor="middle" fill="#dffff1">版本更新與隔離</text><text x="760" y="588" text-anchor="middle" fill="#dffff1">檔案大小／逾時限制</text><text x="1020" y="556" text-anchor="middle" fill="#eeeaff">畸形影像測試</text><text x="1020" y="588" text-anchor="middle" fill="#eeeaff">PACS 工作流成功</text></g></g>
  <rect x="235" y="657" width="730" height="42" rx="16" fill="#372f22" stroke="#f1bc66"/><text x="600" y="685" text-anchor="middle" fill="#ffe0a9" font-size="18" font-weight="700">共同底線：可信來源、受控解析、最小權限、可觀測性、可回復部署</text>
</svg>
