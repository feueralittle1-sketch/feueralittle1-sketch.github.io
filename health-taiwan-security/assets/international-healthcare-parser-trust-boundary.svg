<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療資料解析器信任邊界</title>
  <desc id="desc">外部 HL7、XML 與 DICOM 內容先經來源驗證、格式限制與隔離檢查，再進入介接引擎與影像伺服器，最後送往臨床系統；管理與對外連線另行限制。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#10244a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#f8fbff" font-size="34" font-weight="800">醫療資料解析器信任邊界</text><text x="60" y="108" fill="#9fb7d8" font-size="20">資料格式正確，不等於內容可信；先驗證，再解析，再限制去向</text>
  <rect x="52" y="150" width="250" height="420" rx="26" fill="#10243b" stroke="#4e7498" stroke-width="2"/><text x="177" y="194" text-anchor="middle" fill="#cfe6ff" font-size="24" font-weight="700">輸入來源</text>
  <rect x="82" y="230" width="190" height="70" rx="16" fill="#183654"/><text x="177" y="273" text-anchor="middle" fill="#fff" font-size="22">HL7／XML 訊息</text><rect x="82" y="330" width="190" height="70" rx="16" fill="#183654"/><text x="177" y="373" text-anchor="middle" fill="#fff" font-size="22">DICOM 影像</text><rect x="82" y="430" width="190" height="70" rx="16" fill="#183654"/><text x="177" y="473" text-anchor="middle" fill="#fff" font-size="22">第三方與設備</text>
  <path d="M302 360H386" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#68e8ff"/></marker></defs>
  <rect x="390" y="150" width="300" height="420" rx="26" fill="#0d3042" stroke="#68e8ff" stroke-width="3" filter="url(#glow)"/><text x="540" y="194" text-anchor="middle" fill="#72efff" font-size="24" font-weight="800">受控解析區</text>
  <g font-size="21" fill="#f6fbff"><rect x="430" y="228" width="220" height="58" rx="15" fill="#15506a"/><text x="540" y="265" text-anchor="middle">① 來源與身分</text><rect x="430" y="312" width="220" height="58" rx="15" fill="#15506a"/><text x="540" y="349" text-anchor="middle">② 大小與格式限制</text><rect x="430" y="396" width="220" height="58" rx="15" fill="#15506a"/><text x="540" y="433" text-anchor="middle">③ 隔離解析與逾時</text><rect x="430" y="480" width="220" height="58" rx="15" fill="#15506a"/><text x="540" y="517" text-anchor="middle">④ 日誌與異常分流</text></g>
  <path d="M690 360H774" stroke="#72efc1" stroke-width="5" marker-end="url(#b)"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#72efc1"/></marker></defs>
  <rect x="778" y="150" width="370" height="420" rx="26" fill="#172846" stroke="#758bd8" stroke-width="2"/><text x="963" y="194" text-anchor="middle" fill="#d8e2ff" font-size="24" font-weight="700">臨床服務區</text><rect x="818" y="230" width="290" height="70" rx="16" fill="#263963"/><text x="963" y="273" text-anchor="middle" fill="#fff" font-size="22">介接引擎／影像伺服器</text><rect x="818" y="330" width="290" height="70" rx="16" fill="#263963"/><text x="963" y="373" text-anchor="middle" fill="#fff" font-size="22">HIS／PACS／報告系統</text><rect x="818" y="430" width="290" height="70" rx="16" fill="#263963"/><text x="963" y="462" text-anchor="middle" fill="#fff" font-size="19">限制對外連線與管理入口</text><text x="963" y="487" text-anchor="middle" fill="#a9bddb" font-size="16">避免解析器成為資料外送跳板</text>
  <rect x="185" y="610" width="830" height="66" rx="20" fill="#18263b" stroke="#efb65f" stroke-width="2"/><text x="600" y="651" text-anchor="middle" fill="#ffd89b" font-size="21" font-weight="700">驗收證據：允許來源清單｜拒絕紀錄｜資源上限｜對外連線政策｜臨床傳輸成功率</text>
</svg>
