<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">醫院通訊韌性三層架構手機版</title><desc id="desc">主要通訊、替代電信與離線程序依序支援事件指揮和臨床協調。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12264a"/></linearGradient></defs><rect width="720" height="1200" fill="url(#bg)"/><text x="50" y="66" fill="#f8fbff" font-size="30" font-weight="800">醫院通訊韌性三層架構</text><text x="50" y="104" fill="#9fb3d9" font-size="18">避免主要管道與備援共享同一失效點</text><g font-family="sans-serif"><rect x="50" y="145" width="620" height="270" rx="28" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="360" y="195" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="800">主要通訊</text><text x="90" y="245" fill="#e6eefc" font-size="21">院內網路／網路電話</text><text x="90" y="285" fill="#e6eefc" font-size="21">行動電話／簡訊</text><text x="90" y="325" fill="#e6eefc" font-size="21">雲端協作／電子郵件</text><text x="90" y="375" fill="#9fb3d9" font-size="18">高效率，但常共享網路與身分依賴</text><path d="M360 415V455" stroke="#f2c94c" stroke-width="5" stroke-dasharray="9 9"/><rect x="50" y="455" width="620" height="270" rx="28" fill="#1b2547" stroke="#a997ff" stroke-width="3"/><text x="360" y="505" text-anchor="middle" fill="#c2b8ff" font-size="25" font-weight="800">替代電信</text><text x="90" y="555" fill="#e6eefc" font-size="21">第二電信商／獨立門號</text><text x="90" y="595" fill="#e6eefc" font-size="21">無線電／衛星通訊</text><text x="90" y="635" fill="#e6eefc" font-size="21">優先撥接／優先復原安排</text><text x="90" y="685" fill="#9fb3d9" font-size="18">有限容量，依臨床與指揮角色配發</text><path d="M360 725V765" stroke="#f2c94c" stroke-width="5" stroke-dasharray="9 9"/><rect x="50" y="765" width="620" height="270" rx="28" fill="#14343a" stroke="#57f0c1" stroke-width="3"/><text x="360" y="815" text-anchor="middle" fill="#7ff5d2" font-size="25" font-weight="800">離線程序</text><text x="90" y="865" fill="#e6eefc" font-size="21">紙本聯絡樹／角色卡</text><text x="90" y="905" fill="#e6eefc" font-size="21">實體集合點／跑單</text><text x="90" y="945" fill="#e6eefc" font-size="21">訊息回讀／事件紀錄</text><text x="90" y="995" fill="#9fb3d9" font-size="18">最低技術依賴，但需要持續演練</text><rect x="50" y="1080" width="620" height="76" rx="22" fill="#0b1b32" stroke="#ffffff" stroke-opacity=".2"/><text x="360" y="1114" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">驗收：雙向送達・電力續航</text><text x="360" y="1142" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">角色清楚・紀錄可追溯</text></g></svg>