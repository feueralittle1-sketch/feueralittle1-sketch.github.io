<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療郵件閘道信任邊界</title><desc id="desc">外部郵件先進入隔離的安全郵件閘道，再傳送院內郵件服務；管理介面、外部日誌與備援收信路徑分離。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#14234a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">郵件內容與管理權限必須分流</text><text x="60" y="110" fill="#9fb3d9" font-size="20">未知郵件可到閘道，但不能因此抵達管理面或證據庫</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><rect x="55" y="205" width="210" height="160" rx="24" fill="#132c45" stroke="#63e6ff" stroke-width="3"/><text x="160" y="270" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">外部郵件</text><text x="160" y="310" text-anchor="middle" fill="#b8c8e5" font-size="19">不可信內容</text><text x="160" y="340" text-anchor="middle" fill="#b8c8e5" font-size="19">附件與連結</text>
<path d="M265 285H365" stroke="#63e6ff" stroke-width="7"/><path d="M350 271l18 14-18 14" fill="none" stroke="#63e6ff" stroke-width="7"/>
<rect x="370" y="165" width="310" height="240" rx="28" fill="#1a3254" stroke="#a997ff" stroke-width="4" filter="url(#glow)"/><text x="525" y="225" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">安全郵件閘道</text><text x="525" y="270" text-anchor="middle" fill="#d6cdfd" font-size="20">解析 · 過濾 · 隔離</text><rect x="415" y="304" width="220" height="54" rx="15" fill="#0b1730" stroke="#57f0c1"/><text x="525" y="339" text-anchor="middle" fill="#caffef" font-size="19">獨立 DMZ／最小連線</text>
<path d="M680 285H785" stroke="#57f0c1" stroke-width="7"/><path d="M770 271l18 14-18 14" fill="none" stroke="#57f0c1" stroke-width="7"/>
<rect x="790" y="205" width="350" height="160" rx="24" fill="#143b42" stroke="#57f0c1" stroke-width="3"/><text x="965" y="270" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">院內郵件服務</text><text x="965" y="310" text-anchor="middle" fill="#bdeadd" font-size="19">核准郵件 · 使用者信箱</text><text x="965" y="340" text-anchor="middle" fill="#bdeadd" font-size="19">臨床與行政溝通</text>
<rect x="370" y="480" width="230" height="125" rx="22" fill="#342853" stroke="#d6a8ff" stroke-width="3"/><text x="485" y="530" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">隔離管理面</text><text x="485" y="566" text-anchor="middle" fill="#e3cbff" font-size="18">具名帳號 · 強驗證</text>
<rect x="650" y="480" width="230" height="125" rx="22" fill="#173644" stroke="#63e6ff" stroke-width="3"/><text x="765" y="530" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">外部證據庫</text><text x="765" y="566" text-anchor="middle" fill="#b9edf8" font-size="18">郵件／系統／網路日誌</text>
<rect x="930" y="480" width="210" height="125" rx="22" fill="#49331d" stroke="#ffbd66" stroke-width="3"/><text x="1035" y="530" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">備援收信</text><text x="1035" y="566" text-anchor="middle" fill="#ffe0ad" font-size="18">排隊 · 降級 · 回送</text>
<path d="M525 405V480M600 405l145 75M680 365l330 115" fill="none" stroke="#91a6c9" stroke-width="4" stroke-dasharray="10 10"/></g></svg>
