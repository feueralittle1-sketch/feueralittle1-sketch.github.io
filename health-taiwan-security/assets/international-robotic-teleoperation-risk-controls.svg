<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">遠端操控風險與控制對照</title><desc id="desc">將冒名操作者、延遲抖動、指令竄改、設備異常與現場無法接管五種風險，對應可量測控制與放行證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="55" y="66" fill="#f7fbff" font-size="34" font-weight="800">風險、控制與證據必須一一對應</text><text x="55" y="103" fill="#9fb7d5" font-size="19">不能只確認「連得上」，還要證明異常時不會失去控制</text><text x="70" y="157" fill="#63e6ff" font-size="20" font-weight="800">失敗模式</text><text x="405" y="157" fill="#72f5cd" font-size="20" font-weight="800">控制</text><text x="835" y="157" fill="#ffd08a" font-size="20" font-weight="800">驗收證據</text><rect x="55" y="180" width="300" height="64" rx="16" fill="#173b5d"/><text x="82" y="220" fill="#e6eefc" font-size="18">冒名或未授權操作者</text><rect x="385" y="180" width="400" height="64" rx="16" fill="#19443e"/><text x="412" y="220" fill="#e6eefc" font-size="18">抗釣魚驗證＋限時授權</text><rect x="815" y="180" width="330" height="64" rx="16" fill="#4a3420"/><text x="842" y="220" fill="#fff1dc" font-size="18">拒絕測試與撤權時間</text><rect x="55" y="268" width="300" height="64" rx="16" fill="#173b5d"/><text x="82" y="308" fill="#e6eefc" font-size="18">延遲、抖動或封包遺失</text><rect x="385" y="268" width="400" height="64" rx="16" fill="#19443e"/><text x="412" y="308" fill="#e6eefc" font-size="18">品質門檻＋雙路徑＋安全停止</text><rect x="815" y="268" width="330" height="64" rx="16" fill="#4a3420"/><text x="842" y="308" fill="#fff1dc" font-size="18">最差條件測試紀錄</text><rect x="55" y="356" width="300" height="64" rx="16" fill="#173b5d"/><text x="82" y="396" fill="#e6eefc" font-size="18">指令遭竄改或重放</text><rect x="385" y="356" width="400" height="64" rx="16" fill="#19443e"/><text x="412" y="396" fill="#e6eefc" font-size="18">簽章＋序號＋版本鎖定</text><rect x="815" y="356" width="330" height="64" rx="16" fill="#4a3420"/><text x="842" y="396" fill="#fff1dc" font-size="18">負向測試與日誌</text><rect x="55" y="444" width="300" height="64" rx="16" fill="#173b5d"/><text x="82" y="484" fill="#e6eefc" font-size="18">設備狀態異常</text><rect x="385" y="444" width="400" height="64" rx="16" fill="#19443e"/><text x="412" y="484" fill="#e6eefc" font-size="18">自我檢查＋運動限制＋告警</text><rect x="815" y="444" width="330" height="64" rx="16" fill="#4a3420"/><text x="842" y="484" fill="#fff1dc" font-size="18">故障注入與回復紀錄</text><rect x="55" y="532" width="300" height="64" rx="16" fill="#173b5d"/><text x="82" y="572" fill="#e6eefc" font-size="18">現場無法即時接管</text><rect x="385" y="532" width="400" height="64" rx="16" fill="#19443e"/><text x="412" y="572" fill="#e6eefc" font-size="18">床邊人員＋急停＋替代程序</text><rect x="815" y="532" width="330" height="64" rx="16" fill="#4a3420"/><text x="842" y="572" fill="#fff1dc" font-size="18">情境演練與接管時間</text></g></svg>