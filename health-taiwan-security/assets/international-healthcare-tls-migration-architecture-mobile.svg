<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 980" role="img" aria-labelledby="title desc"><title id="title">手機版醫療 TLS 遷移架構</title><desc id="desc">醫療連線經協定治理閘門後，分流到現代 TLS、受控相容區或替換退場。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#172657"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3z" fill="#63e6ff"/></marker></defs><rect width="390" height="980" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="22" y="42" fill="#fff" font-size="21" font-weight="800">醫療 TLS 遷移架構</text><text x="22" y="70" fill="#afc3e2" font-size="14">先盤點依賴，再安全分流</text><text x="22" y="108" fill="#63e6ff" font-size="15" font-weight="700">醫療連線來源</text><g fill="#102b47" stroke-width="1.3"><rect x="22" y="124" width="165" height="62" rx="14" stroke="#63e6ff"/><rect x="203" y="124" width="165" height="62" rx="14" stroke="#82a9ff"/><rect x="22" y="202" width="165" height="62" rx="14" stroke="#c99cff"/><rect x="203" y="202" width="165" height="62" rx="14" stroke="#57f0c1"/></g><g fill="#fff" font-size="15" font-weight="700"><text x="40" y="160">病人入口與 App</text><text x="222" y="160">臨床介接影像</text><text x="40" y="238">設備與舊系統</text><text x="222" y="238">供應商維運</text></g><path d="M195 278V315" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="326" width="346" height="310" rx="22" fill="#0d2038" stroke="#55779d"/><text x="44" y="365" fill="#fff" font-size="20" font-weight="800">協定治理閘門</text><g fill="#c8d8eb" font-size="15"><text x="44" y="408">01　實際握手版本與密碼套件</text><text x="44" y="451">02　憑證、金鑰與端點清冊</text><text x="44" y="494">03　臨床用途與中斷容忍度</text><text x="44" y="537">04　設備支援與供應商期限</text><text x="44" y="580">05　回退、監測與例外到期</text><text x="44" y="613">06　臨床回歸與退場證據</text></g><path d="M195 650V686" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="698" width="346" height="76" rx="18" fill="#113d49" stroke="#57f0c1"/><text x="44" y="728" fill="#fff" font-size="18" font-weight="800">現代 TLS 區</text><text x="44" y="754" fill="#c7f9ea" font-size="14">優先 TLS 1.3；受控支援 TLS 1.2</text><rect x="22" y="790" width="346" height="76" rx="18" fill="#3a284c" stroke="#c99cff"/><text x="44" y="820" fill="#fff" font-size="18" font-weight="800">受控相容區</text><text x="44" y="846" fill="#ead8f7" font-size="14">隔離代理、最小路徑、期限與告警</text><rect x="22" y="882" width="346" height="76" rx="18" fill="#442938" stroke="#ff8fab"/><text x="44" y="912" fill="#fff" font-size="18" font-weight="800">替換或退場</text><text x="44" y="938" fill="#ffd6e2" font-size="14">無法安全升級且風險不可接受</text></g></svg>