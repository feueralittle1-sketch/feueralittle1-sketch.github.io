<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療後量子密碼遷移的六階段路線圖</title>
  <desc id="desc">從治理啟動、密碼探索、風險排序、供應商驗證、隔離環境試點到分批上線與持續監測的醫療後量子遷移流程。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#15254c"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#63e6ff"/></marker></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="70" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">後量子遷移要走完整閉環，不是直接替換演算法</text><text x="600" y="108" text-anchor="middle" fill="#9fb3d9" font-size="20">每階段都保留回退條件、互通性結果與臨床服務證據</text>
  <g fill="#112f51" stroke="#63e6ff" stroke-width="3"><rect x="55" y="170" width="300" height="125" rx="24"/><rect x="450" y="170" width="300" height="125" rx="24"/><rect x="845" y="170" width="300" height="125" rx="24"/><rect x="845" y="410" width="300" height="125" rx="24"/><rect x="450" y="410" width="300" height="125" rx="24"/><rect x="55" y="410" width="300" height="125" rx="24"/></g><g fill="#fff" font-size="24" font-weight="700" text-anchor="middle"><text x="205" y="215">1 治理與範圍</text><text x="600" y="215">2 密碼探索</text><text x="995" y="215">3 風險排序</text><text x="995" y="455">4 供應商驗證</text><text x="600" y="455">5 隔離環境試點</text><text x="205" y="455">6 分批上線監測</text></g><g fill="#b8c8e5" font-size="18" text-anchor="middle"><text x="205" y="251">責任人・預算・驗收門檻</text><text x="600" y="251">協定・憑證・模組・資料流</text><text x="995" y="251">資料壽命 × 衝擊 × 工期</text><text x="995" y="491">版本・標準・支援與回退</text><text x="600" y="491">效能・互通・故障與降級</text><text x="205" y="491">小批次・可觀測・可復原</text></g><g fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"><path d="M355 232H425"/><path d="M750 232H820"/><path d="M995 295V385"/><path d="M845 472H775"/><path d="M450 472H380"/></g><path d="M205 535V600H995V560" fill="none" stroke="#a997ff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="600" y="630" text-anchor="middle" fill="#d5ccff" font-size="20" font-weight="700">監測異常、更新清冊、調整批次，再進入下一輪</text><g><rect x="84" y="325" width="1032" height="54" rx="18" fill="#172c49" stroke="#35577c"/><text x="600" y="359" text-anchor="middle" fill="#9ff9df" font-size="20">共同驗收：臨床流程不中斷｜舊新協定可控共存｜金鑰與憑證可追溯｜失敗時可回退</text></g></g>
</svg>
