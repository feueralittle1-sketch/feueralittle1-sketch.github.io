<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc"><title id="title">手機版醫療服務台高風險帳號重設流程</title><desc id="desc">帳號重設由請求分級到證據結案的六階段流程。</desc><rect width="720" height="1220" rx="28" fill="#08182d"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">高風險帳號重設六階段</text><text x="38" y="96" fill="#9fb7d5" font-size="18">急迫不降標，所有動作留下驗收證據</text><g><rect x="54" y="140" width="612" height="126" rx="22" fill="#183752" stroke="#63e6ff" stroke-width="2"/><text x="88" y="188" fill="#63e6ff" font-size="23" font-weight="800">1 請求分級</text><text x="88" y="228" fill="#e6eefc" font-size="18">依帳號類型、臨床影響與可替代流程決定強度</text><path d="M360 266v30" stroke="#4d789f" stroke-width="5"/><rect x="54" y="296" width="612" height="126" rx="22" fill="#243451" stroke="#a997ff" stroke-width="2"/><text x="88" y="344" fill="#c3b8ff" font-size="23" font-weight="800">2 獨立驗證</text><text x="88" y="384" fill="#eeeaff" font-size="18">回撥、既有受管裝置與院方既有資料交叉確認</text><path d="M360 422v30" stroke="#4d789f" stroke-width="5"/><rect x="54" y="452" width="612" height="126" rx="22" fill="#3d303f" stroke="#ff9fd0" stroke-width="2"/><text x="88" y="500" fill="#ffadd5" font-size="23" font-weight="800">3 雙人核准</text><text x="88" y="540" fill="#fae4ef" font-size="18">服務台、主管與必要的系統主責綁定同一工單</text><path d="M360 578v30" stroke="#4d789f" stroke-width="5"/><rect x="54" y="608" width="612" height="126" rx="22" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="88" y="656" fill="#72f5cd" font-size="23" font-weight="800">4 限時復原</text><text x="88" y="696" fill="#ddfff4" font-size="18">短效憑證、最小權限；高風險動作延遲生效</text><path d="M360 734v30" stroke="#4d789f" stroke-width="5"/><rect x="54" y="764" width="612" height="126" rx="22" fill="#253b54" stroke="#71a7ff" stroke-width="2"/><text x="88" y="812" fill="#9ec2ff" font-size="23" font-weight="800">5 通知監測</text><text x="88" y="852" fill="#e4edff" font-size="18">通知原使用者並監測登入、裝置、位置與權限變化</text><path d="M360 890v30" stroke="#4d789f" stroke-width="5"/><rect x="54" y="920" width="612" height="126" rx="22" fill="#4b331d" stroke="#ffbd66" stroke-width="2"/><text x="88" y="968" fill="#ffd08a" font-size="23" font-weight="800">6 證據結案</text><text x="88" y="1008" fill="#fff1d7" font-size="18">確認通知、到期、監測、撤銷與抽查結果</text></g><rect x="54" y="1090" width="612" height="86" rx="20" fill="#112942" stroke="#315b7d" stroke-width="2"/><text x="360" y="1125" text-anchor="middle" fill="#63e6ff" font-size="19" font-weight="800">完成條件</text><text x="360" y="1158" text-anchor="middle" fill="#e6eefc" font-size="17">每項驗證、核准、變更與通知都可回溯</text></g></svg>