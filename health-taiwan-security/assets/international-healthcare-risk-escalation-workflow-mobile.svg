<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安風險升級流程</title><desc id="desc">由風險情境到監測重驗的六階段垂直流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#16264b"/></linearGradient></defs><rect width="390" height="1040" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><text x="195" y="42" fill="#fff" font-size="21" font-weight="800">風險升級與重驗流程</text><text x="195" y="70" fill="#9fb3d9" font-size="14">技術缺口走到院級決策</text><g font-size="18" font-weight="800"><rect x="45" y="100" width="300" height="110" rx="20" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="195" y="140" fill="#63e6ff">01 建立風險情境</text><text x="195" y="176" fill="#d8e6fb" font-size="15" font-weight="400">威脅、資產、臨床結果</text><path d="M195 215V245" stroke="#63e6ff" stroke-width="6"/><path d="M184 235L195 250L206 235" fill="#63e6ff"/><rect x="45" y="255" width="300" height="110" rx="20" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="195" y="295" fill="#c5baff">02 對齊共同尺度</text><text x="195" y="331" fill="#e8e3ff" font-size="15" font-weight="400">可能性、衝擊、容忍門檻</text><path d="M195 370V400" stroke="#63e6ff" stroke-width="6"/><path d="M184 390L195 405L206 390" fill="#63e6ff"/><rect x="45" y="410" width="300" height="110" rx="20" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="195" y="450" fill="#57f0c1">03 聚合共同依賴</text><text x="195" y="486" fill="#d9fff3" font-size="15" font-weight="400">共享服務、供應商、連鎖風險</text><path d="M195 525V555" stroke="#63e6ff" stroke-width="6"/><path d="M184 545L195 560L206 545" fill="#63e6ff"/><rect x="45" y="565" width="300" height="110" rx="20" fill="#31263d" stroke="#ffb86b" stroke-width="3"/><text x="195" y="605" fill="#ffcf99">04 決定風險回應</text><text x="195" y="641" fill="#fff0dd" font-size="15" font-weight="400">降低、移轉、接受、避免</text><path d="M195 680V710" stroke="#63e6ff" stroke-width="6"/><path d="M184 700L195 715L206 700" fill="#63e6ff"/><rect x="45" y="720" width="300" height="110" rx="20" fill="#2d2134" stroke="#ff7aa8" stroke-width="3"/><text x="195" y="760" fill="#ff9fbe">05 配置資源責任</text><text x="195" y="796" fill="#ffe1eb" font-size="15" font-weight="400">預算、人力、時程、主責</text><path d="M195 835V865" stroke="#63e6ff" stroke-width="6"/><path d="M184 855L195 870L206 855" fill="#63e6ff"/><rect x="45" y="875" width="300" height="110" rx="20" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="195" y="915" fill="#a8c8ff">06 監測與重驗</text><text x="195" y="951" fill="#e6eefc" font-size="15" font-weight="400">指標、事件、變更、到期</text></g><text x="195" y="1020" fill="#ffcf99" font-size="13">保留假設、決策人與下次檢視日</text></g></svg>