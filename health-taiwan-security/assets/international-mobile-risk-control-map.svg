<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療行動裝置風險控制與驗收證據對照</title><desc id="desc">對照未納管裝置、延遲更新、只看作業系統版本、全面封鎖與疑似入侵五種風險，以及相應控制和驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14254c"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="66" fill="#fff" font-size="34" font-weight="700">風險、控制與證據：三欄要能閉環</text><text x="60" y="104" fill="#a9bfdf" font-size="20">「已發布修補」不等於「院內裝置已完成並可安全恢復」</text><rect x="55" y="145" width="310" height="64" rx="18" fill="#39283a" stroke="#ff7aa8"/><rect x="385" y="145" width="380" height="64" rx="18" fill="#183450" stroke="#70e8ff"/><rect x="785" y="145" width="360" height="64" rx="18" fill="#173c3b" stroke="#59efbe"/><text x="210" y="186" text-anchor="middle" fill="#ff9fc0" font-size="23" font-weight="700">失敗情境</text><text x="575" y="186" text-anchor="middle" fill="#70e8ff" font-size="23" font-weight="700">控制</text><text x="965" y="186" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">驗收證據</text>
<g font-size="19"><rect x="55" y="225" width="1090" height="76" rx="16" fill="#0d1f39"/><text x="80" y="257" fill="#fff" font-weight="700">未納管／私人裝置</text><text x="410" y="257" fill="#dce8f8">用途與資料分級；納管或隔離入口</text><text x="810" y="257" fill="#dce8f8">設備擁有人與允許服務清冊</text><text x="80" y="283" fill="#9fb3d9">看不見修補狀態</text><text x="410" y="283" fill="#9fb3d9">高敏感服務要求受管狀態</text><text x="810" y="283" fill="#9fb3d9">未登錄裝置拒絕測試</text>
<rect x="55" y="313" width="1090" height="76" rx="16" fill="#10243f"/><text x="80" y="345" fill="#fff" font-weight="700">更新延遲</text><text x="410" y="345" fill="#dce8f8">分批推送、充電／網路窗口、追蹤</text><text x="810" y="345" fill="#dce8f8">補丁覆蓋率與逾期名單</text><text x="80" y="371" fill="#9fb3d9">輪班裝置長期離線</text><text x="410" y="371" fill="#9fb3d9">逾期自動降權，不靠人工催辦</text><text x="810" y="371" fill="#9fb3d9">限制規則實測</text>
<rect x="55" y="401" width="1090" height="76" rx="16" fill="#0d1f39"/><text x="80" y="433" fill="#fff" font-weight="700">版本判定錯誤</text><text x="410" y="433" fill="#dce8f8">核對型號與安全補丁層級</text><text x="810" y="433" fill="#dce8f8">逐台庫存與廠商公告對照</text><text x="80" y="459" fill="#9fb3d9">只看 App 或 OS 大版本</text><text x="410" y="459" fill="#9fb3d9">區分基頻韌體與一般 App 更新</text><text x="810" y="459" fill="#9fb3d9">更新後狀態回報</text>
<rect x="55" y="489" width="1090" height="76" rx="16" fill="#10243f"/><text x="80" y="521" fill="#fff" font-weight="700">全面封鎖</text><text x="410" y="521" fill="#dce8f8">依服務風險分層；保留降級路徑</text><text x="810" y="521" fill="#dce8f8">臨床替代流程演練紀錄</text><text x="80" y="547" fill="#9fb3d9">影響照護與聯繫</text><text x="410" y="547" fill="#9fb3d9">優先限制高敏感操作</text><text x="810" y="547" fill="#9fb3d9">例外核准與到期日</text>
<rect x="55" y="577" width="1090" height="76" rx="16" fill="#0d1f39"/><text x="80" y="609" fill="#fff" font-weight="700">疑似遭利用</text><text x="410" y="609" fill="#dce8f8">隔離、證據保全、權杖撤銷</text><text x="810" y="609" fill="#dce8f8">事件時間線與重置結果</text><text x="80" y="635" fill="#9fb3d9">更新後仍保留舊會話</text><text x="410" y="635" fill="#9fb3d9">必要時重建並重新註冊</text><text x="810" y="635" fill="#9fb3d9">舊憑證／會話拒絕測試</text></g></g></svg>