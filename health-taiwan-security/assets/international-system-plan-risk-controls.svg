<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">醫療系統安全計畫的風險與控制對照</title><desc id="desc">四種常見失敗模式分別對應邊界同步、責任矩陣、證據連結與期限治理。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#171b3f"/></linearGradient></defs><rect width="1200" height="650" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">靜態計畫的四種失敗模式與控制</text><text x="60" y="108" fill="#9fb3d9" font-size="20">風險不是「文件不完整」，而是文件與真實環境、責任及證據脫節</text><g font-family="sans-serif"><text x="250" y="158" text-anchor="middle" fill="#ff9abd" font-size="22" font-weight="700">失敗模式</text><text x="600" y="158" text-anchor="middle" fill="#ffbf7a" font-size="22" font-weight="700">可能後果</text><text x="955" y="158" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="700">治理控制</text><g fill="#12213d" stroke="rgba(255,255,255,.15)"><rect x="55" y="185" width="1090" height="90" rx="22"/><rect x="55" y="290" width="1090" height="90" rx="22"/><rect x="55" y="395" width="1090" height="90" rx="22"/><rect x="55" y="500" width="1090" height="90" rx="22"/></g><g font-size="19"><text x="250" y="240" text-anchor="middle" fill="#fff">邊界未隨雲端與介接變更</text><text x="600" y="240" text-anchor="middle" fill="#c6d4eb">資產、資料流與依賴漏列</text><text x="955" y="240" text-anchor="middle" fill="#57f0c1">變更單觸發邊界與資料流更新</text><text x="250" y="345" text-anchor="middle" fill="#fff">控制只有名稱、沒有主責</text><text x="600" y="345" text-anchor="middle" fill="#c6d4eb">事件時無人決策或維護</text><text x="955" y="345" text-anchor="middle" fill="#57f0c1">責任矩陣與核准權明確化</text><text x="250" y="450" text-anchor="middle" fill="#fff">聲稱已完成、沒有證據連結</text><text x="600" y="450" text-anchor="middle" fill="#c6d4eb">稽核與事件無法驗證有效性</text><text x="955" y="450" text-anchor="middle" fill="#57f0c1">連結組態、測試、演練與紀錄</text><text x="250" y="555" text-anchor="middle" fill="#fff">例外無期限、改善不回寫</text><text x="600" y="555" text-anchor="middle" fill="#c6d4eb">殘餘風險長期擴大</text><text x="955" y="555" text-anchor="middle" fill="#57f0c1">例外到期、重審與關閉證據</text></g></g><rect x="285" y="606" width="630" height="30" rx="15" fill="#173e45"/><text x="600" y="628" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">最低驗收：抽樣一項高影響服務，可在目標時間內找到完整責任與證據鏈</text></svg>