<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">CRA 單一通報平台的分階段時鐘</title><desc id="desc">從製造商知悉事件開始，依序進行二十四小時早期警示、七十二小時完整通知、後續更新與最終報告，並同步通知受影響醫院。</desc>
<rect width="1200" height="700" rx="36" fill="#071426"/><text x="64" y="76" fill="#f4f8ff" font-size="36" font-weight="700">通報不是一封信，而是分階段證據鏈</text><text x="64" y="116" fill="#9fb3d9" font-size="20">圖示為 CRA 國際流程摘要；台灣醫院可借鏡時鐘治理，不等同法定期限</text>
<line x1="120" y1="350" x2="1080" y2="350" stroke="#31516f" stroke-width="12" stroke-linecap="round"/>
<g><circle cx="150" cy="350" r="55" fill="#15355a" stroke="#63e6ff" stroke-width="5"/><text x="150" y="343" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">T0</text><text x="150" y="372" text-anchor="middle" fill="#9fefff" font-size="16">知悉</text><text x="150" y="450" text-anchor="middle" fill="#e6eefc" font-size="21" font-weight="700">確認事件門檻</text><text x="150" y="480" text-anchor="middle" fill="#9fb3d9" font-size="17">產品、版本、影響</text></g>
<g><circle cx="440" cy="350" r="68" fill="#33244f" stroke="#c9bfff" stroke-width="5"/><text x="440" y="343" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">24h</text><text x="440" y="375" text-anchor="middle" fill="#e1d9ff" font-size="16">早期警示</text><text x="440" y="450" text-anchor="middle" fill="#e6eefc" font-size="21" font-weight="700">先提供可用事實</text><text x="440" y="480" text-anchor="middle" fill="#9fb3d9" font-size="17">不等待所有細節完成</text></g>
<g><circle cx="750" cy="350" r="76" fill="#123c38" stroke="#57f0c1" stroke-width="5"/><text x="750" y="343" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">72h</text><text x="750" y="375" text-anchor="middle" fill="#9dffe0" font-size="16">完整通知</text><text x="750" y="450" text-anchor="middle" fill="#e6eefc" font-size="21" font-weight="700">補充技術與影響</text><text x="750" y="480" text-anchor="middle" fill="#9fb3d9" font-size="17">原因、緩解與狀態</text></g>
<g><circle cx="1050" cy="350" r="64" fill="#3d2c22" stroke="#ffbd7a" stroke-width="5"/><text x="1050" y="343" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">後續</text><text x="1050" y="375" text-anchor="middle" fill="#ffd4a6" font-size="16">更新／結案</text><text x="1050" y="450" text-anchor="middle" fill="#e6eefc" font-size="21" font-weight="700">形成最終證據</text><text x="1050" y="480" text-anchor="middle" fill="#9fb3d9" font-size="17">修補、通知、關閉</text></g>
<path d="M205 350H372M508 350H674M826 350H986" stroke="#8fe8ff" stroke-width="5" stroke-dasharray="10 10"/>
<rect x="110" y="550" width="980" height="88" rx="22" fill="#0d2138" stroke="#274867"/><text x="600" y="586" text-anchor="middle" fill="#63e6ff" font-size="20" font-weight="700">院內同步軌</text><text x="600" y="616" text-anchor="middle" fill="#e6eefc" font-size="20">供應商通知 → 資產比對 → 臨床衝擊 → 暫行控制 → 修補驗證 → 關閉</text></svg>