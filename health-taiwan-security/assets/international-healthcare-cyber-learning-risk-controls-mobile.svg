<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1010" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安訓練風險與控制對照</title><desc id="desc">五種常見訓練失敗模式，對應角色分流、無責改善、多維量測、臨床停止條件與流程技術修正。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102244"/></linearGradient></defs><rect width="390" height="1010" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="24" y="45" fill="#fff" font-size="23" font-weight="800">訓練失敗模式與控制</text><text x="24" y="74" fill="#a9bddf" font-size="15">改善人員、流程與技術，而非轉嫁責任</text><g><rect x="22" y="105" width="346" height="150" rx="20" fill="#17263d" stroke="#405d7e"/><text x="43" y="140" fill="#ff9aa2" font-size="16" font-weight="800">風險｜一體適用</text><text x="43" y="177" fill="#fff" font-size="18" font-weight="700">控制｜角色分流與任務情境</text><text x="43" y="215" fill="#63e6ff" font-size="15">證據｜角色清冊、情境覆蓋率</text><rect x="22" y="270" width="346" height="150" rx="20" fill="#17263d" stroke="#405d7e"/><text x="43" y="305" fill="#ff9aa2" font-size="16" font-weight="800">風險｜懲罰式模擬</text><text x="43" y="342" fill="#fff" font-size="18" font-weight="700">控制｜無責改善與個別補強</text><text x="43" y="380" fill="#63e6ff" font-size="15">證據｜通報意願、重複失敗率</text><rect x="22" y="435" width="346" height="150" rx="20" fill="#17263d" stroke="#405d7e"/><text x="43" y="470" fill="#ff9aa2" font-size="16" font-weight="800">風險｜只看點擊率</text><text x="43" y="507" fill="#fff" font-size="18" font-weight="700">控制｜多維行為量測</text><text x="43" y="545" fill="#63e6ff" font-size="15">證據｜回報、升級、處置時間</text><rect x="22" y="600" width="346" height="150" rx="20" fill="#17263d" stroke="#405d7e"/><text x="43" y="635" fill="#ff9aa2" font-size="16" font-weight="800">風險｜干擾臨床</text><text x="43" y="672" fill="#fff" font-size="18" font-weight="700">控制｜停止條件與安全窗口</text><text x="43" y="710" fill="#63e6ff" font-size="15">證據｜中止紀錄、零病安事件</text><rect x="22" y="765" width="346" height="150" rx="20" fill="#17263d" stroke="#405d7e"/><text x="43" y="800" fill="#ff9aa2" font-size="16" font-weight="800">風險｜流程未改善</text><text x="43" y="837" fill="#fff" font-size="18" font-weight="700">控制｜修正工具、介面與技術</text><text x="43" y="875" fill="#63e6ff" font-size="15">證據｜改善單、重驗與關閉</text></g><rect x="22" y="944" width="346" height="42" rx="12" fill="#123047"/><text x="39" y="970" fill="#8ff2d0" font-size="13" font-weight="700">保護臨床・鼓勵早報・修正系統缺口</text></g></svg>