<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療勒索威脅與臨床持續運作架構</title>
  <desc id="desc">勒索攻擊由初始入侵進入身分、系統與備份控制面，醫院以分段、事件指揮、停機流程與乾淨復原維持病人照護。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#181536"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff9bc8"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f5fbff" font-size="36" font-weight="800">勒索事件的核心風險：資訊受損與臨床中斷同時發生</text>
  <text x="60" y="112" fill="#a8bad8" font-size="23">防禦目標不是只保住檔案，而是維持安全照護並留下可信復原路徑</text>
  <g text-anchor="middle">
    <rect x="55" y="170" width="230" height="350" rx="28" fill="#3b263e" stroke="#ff9bc8" stroke-width="3"/>
    <text x="170" y="218" fill="#ffc7e1" font-size="27" font-weight="800">攻擊鏈</text><text x="170" y="275" fill="#f0d8e5" font-size="21">外部服務弱點</text><text x="170" y="315" fill="#f0d8e5" font-size="21">憑證與遠端工具</text><text x="170" y="355" fill="#f0d8e5" font-size="21">橫向移動</text><text x="170" y="395" fill="#f0d8e5" font-size="21">資料外洩＋加密</text><text x="170" y="455" fill="#d8a6bf" font-size="19">double extortion</text>
    <rect x="355" y="170" width="230" height="350" rx="28" fill="#3f3228" stroke="#ffbf69" stroke-width="3"/>
    <text x="470" y="218" fill="#ffd59d" font-size="27" font-weight="800">臨床衝擊</text><text x="470" y="275" fill="#f1ddc5" font-size="21">病歷與排程不可用</text><text x="470" y="315" fill="#f1ddc5" font-size="21">檢驗影像介接中斷</text><text x="470" y="355" fill="#f1ddc5" font-size="21">藥事流程降級</text><text x="470" y="395" fill="#f1ddc5" font-size="21">轉診與通訊受阻</text><text x="470" y="455" fill="#d9b78f" font-size="19">downtime</text>
    <rect x="655" y="170" width="230" height="350" rx="28" fill="#102d45" stroke="#63e6ff" stroke-width="3"/>
    <text x="770" y="218" fill="#8fe8ff" font-size="27" font-weight="800">持續運作</text><text x="770" y="275" fill="#d9f4ff" font-size="21">事件指揮與分級</text><text x="770" y="315" fill="#d9f4ff" font-size="21">紙本／離線停機流程</text><text x="770" y="355" fill="#d9f4ff" font-size="21">最低安全服務</text><text x="770" y="395" fill="#d9f4ff" font-size="21">跨院轉送條件</text><text x="770" y="455" fill="#8fcce3" font-size="19">incident command</text>
    <rect x="955" y="170" width="190" height="350" rx="28" fill="#10352f" stroke="#57f0c1" stroke-width="3"/>
    <text x="1050" y="218" fill="#9ff8dc" font-size="27" font-weight="800">可信復原</text><text x="1050" y="275" fill="#d7efe9" font-size="21">身分重建</text><text x="1050" y="315" fill="#d7efe9" font-size="21">不可抹除副本</text><text x="1050" y="355" fill="#d7efe9" font-size="21">惡意程式清除</text><text x="1050" y="395" fill="#d7efe9" font-size="21">資料一致性驗證</text><text x="1050" y="455" fill="#83d9be" font-size="19">clean recovery</text>
  </g>
  <g stroke="#ff9bc8" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M285 345H345"/><path d="M585 345H645"/></g><path d="M885 345H945" stroke="#57f0c1" stroke-width="5" marker-end="url(#a)"/>
  <rect x="150" y="575" width="900" height="85" rx="24" fill="#0d2940" stroke="#416989" stroke-width="2"/><text x="600" y="610" text-anchor="middle" fill="#f0f7ff" font-size="23" font-weight="700">控制軸：修補與分段｜抗釣魚身分｜獨立備份權限｜停機演練｜證據保全</text><text x="600" y="642" text-anchor="middle" fill="#9fb7d9" font-size="19">每一軸都要能以演練、紀錄或還原結果驗收</text>
</svg>
