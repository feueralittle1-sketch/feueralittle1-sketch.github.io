<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療身分與權限治理架構圖</title>
  <desc id="desc">從人員、設備與供應商身分，經 IAM、RBAC、ABAC 與 PAM 控制後，進入醫療系統並由 UEBA 與稽核紀錄持續監測。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061526"/><stop offset="1" stop-color="#171536"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker>
  </defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="70" y="75" fill="#f5fbff" font-size="36" font-weight="800">權限治理：身分、決策、特權與監測要串成一條線</text>
  <text x="70" y="116" fill="#9fb7d9" font-size="23">不是只有登入成功；每次存取都要回答「誰、為何、何時、能做什麼」</text>
  <g font-size="22" text-anchor="middle">
    <rect x="65" y="175" width="220" height="325" rx="28" fill="#102d45" stroke="#63e6ff" stroke-width="3"/>
    <text x="175" y="220" fill="#63e6ff" font-size="27" font-weight="800">身分來源</text>
    <rect x="95" y="255" width="160" height="58" rx="16" fill="#173d58"/><text x="175" y="292" fill="#e5f6ff">員工／醫師</text>
    <rect x="95" y="335" width="160" height="58" rx="16" fill="#173d58"/><text x="175" y="372" fill="#e5f6ff">設備／服務</text>
    <rect x="95" y="415" width="160" height="58" rx="16" fill="#173d58"/><text x="175" y="452" fill="#e5f6ff">供應商</text>
    <path d="M285 338H345" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="355" y="175" width="280" height="325" rx="28" fill="#192747" stroke="#9c8cff" stroke-width="3"/>
    <text x="495" y="220" fill="#d7ceff" font-size="27" font-weight="800">IAM 存取決策</text>
    <rect x="390" y="255" width="210" height="58" rx="16" fill="#2a3560"/><text x="495" y="292" fill="#f0ecff">RBAC：依職務</text>
    <rect x="390" y="335" width="210" height="58" rx="16" fill="#2a3560"/><text x="495" y="372" fill="#f0ecff">ABAC：看情境</text>
    <rect x="390" y="415" width="210" height="58" rx="16" fill="#2a3560"/><text x="495" y="452" fill="#f0ecff">JIT：限時開通</text>
    <path d="M635 338H695" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="705" y="175" width="220" height="325" rx="28" fill="#143544" stroke="#57f0c1" stroke-width="3"/>
    <text x="815" y="220" fill="#8ff6d7" font-size="27" font-weight="800">PAM 特權護欄</text>
    <text x="815" y="275" fill="#d7efe9">憑證保管</text><text x="815" y="320" fill="#d7efe9">核准與錄影</text><text x="815" y="365" fill="#d7efe9">操作指令留痕</text><text x="815" y="410" fill="#d7efe9">使用後撤權</text>
    <rect x="750" y="440" width="130" height="38" rx="14" fill="#22584f"/><text x="815" y="466" fill="#baffea" font-size="18">最小權限</text>
    <path d="M925 338H975" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="985" y="175" width="150" height="325" rx="28" fill="#3b243e" stroke="#ff9bc8" stroke-width="3"/>
    <text x="1060" y="220" fill="#ffc1de" font-size="25" font-weight="800">醫療系統</text>
    <text x="1060" y="280" fill="#f4e1ec">HIS／EMR</text><text x="1060" y="325" fill="#f4e1ec">LIS／PACS</text><text x="1060" y="370" fill="#f4e1ec">雲端／設備</text><text x="1060" y="415" fill="#f4e1ec">管理介面</text>
  </g>
  <rect x="65" y="550" width="1070" height="105" rx="25" fill="#0c2639" stroke="#4a7196" stroke-width="2"/>
  <text x="105" y="598" fill="#f5fbff" font-size="25" font-weight="800">UEBA ＋ 稽核紀錄</text><text x="105" y="632" fill="#a9c6df" font-size="21">持續比對異常時間、位置、資料量與操作行為；告警要能追到身分、核准與完整工作階段。</text>
  <path d="M1060 500V550" stroke="#ff9bc8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="600" y="692" text-anchor="middle" fill="#8ca7c8" font-size="20">IAM 管一般存取，PAM 管高風險特權；兩者都必須留下可稽核證據。</text>
</svg>
