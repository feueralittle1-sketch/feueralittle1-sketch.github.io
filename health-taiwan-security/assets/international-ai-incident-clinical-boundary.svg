<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療人工智慧事件的雙軌分類與臨床治理邊界</title>
<desc id="desc">人工智慧系統可能遭受網路攻擊，也可能因誤用、失效或異常行為造成傷害；兩類訊號經共同事件指揮轉成臨床降級、技術處置與證據保存。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="700" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">醫療 AI 事件先分型，再決定誰處置、如何降級</text>
<rect x="55" y="125" width="300" height="410" rx="28" fill="#10243e" stroke="#63e6ff" stroke-width="2"/><text x="205" y="170" fill="#63e6ff" text-anchor="middle" font-size="25" font-weight="700">AI 系統遭受攻擊</text><g fill="#dcecff" font-size="21"><text x="92" y="230">• 提示注入與資料外洩</text><text x="92" y="280">• 模型／資料遭竄改</text><text x="92" y="330">• 工具憑證遭濫用</text><text x="92" y="380">• 供應鏈與代理劫持</text></g><rect x="88" y="430" width="234" height="64" rx="16" fill="#173b5d"/><text x="205" y="457" fill="#fff" text-anchor="middle" font-size="19">核心問題</text><text x="205" y="482" fill="#b9d9ff" text-anchor="middle" font-size="18">機密性、完整性、可用性</text>
<rect x="845" y="125" width="300" height="410" rx="28" fill="#2b1f46" stroke="#a997ff" stroke-width="2"/><text x="995" y="170" fill="#c7baff" text-anchor="middle" font-size="25" font-weight="700">AI 系統造成傷害</text><g fill="#f1ebff" font-size="21"><text x="880" y="230">• 臨床錯誤與幻覺</text><text x="880" y="280">• 過度依賴或誤用</text><text x="880" y="330">• 自主工具執行錯誤</text><text x="880" y="380">• 模型漂移與異常輸出</text></g><rect x="878" y="430" width="234" height="64" rx="16" fill="#46306b"/><text x="995" y="457" fill="#fff" text-anchor="middle" font-size="19">核心問題</text><text x="995" y="482" fill="#ddd0ff" text-anchor="middle" font-size="18">病人安全、品質、信任</text>
<path d="M365 330H445" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><path d="M835 330H755" stroke="#a997ff" stroke-width="5" marker-end="url(#b)"/><defs><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M12 0L0 6L12 12Z" fill="#a997ff"/></marker></defs>
<rect x="445" y="155" width="310" height="350" rx="30" fill="#12343b" stroke="#57f0c1" stroke-width="3"/><text x="600" y="205" fill="#57f0c1" text-anchor="middle" font-size="27" font-weight="700">共同事件指揮</text><g fill="#eafff8" font-size="20"><text x="490" y="265">1. 臨床影響分級</text><text x="490" y="310">2. 安全與資安聯合定界</text><text x="490" y="355">3. 權限範圍式隔離</text><text x="490" y="400">4. 降級、停用或回退</text><text x="490" y="445">5. 證據保存與受控恢復</text></g>
<text x="600" y="590" fill="#fff" text-anchor="middle" font-size="23" font-weight="700">輸出：單一事件紀錄、單一決策權責、兩條調查軌跡</text><text x="600" y="632" fill="#9fb3d9" text-anchor="middle" font-size="19">技術上沒有入侵，也可能是需要臨床處置的 AI 事件。</text></g></svg>