<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">AI Agent 委派授權生命週期手機版</title><desc id="desc">登錄、建身分、核准、執行、監測及撤銷的垂直流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#15143b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57f0c1"/></marker></defs><rect width="720" height="1180" rx="30" fill="url(#bg)"/><text x="46" y="66" fill="#fff" font-size="31" font-weight="800">委派授權六階段</text><text x="46" y="104" fill="#9fb3d9" font-size="18">建立、縮限、監測、撤銷</text><g font-family="Arial,'Noto Sans TC',sans-serif"><path d="M130 190V920" stroke="#57f0c1" stroke-width="5" marker-end="url(#a)"/><g fill="#102f38" stroke="#57f0c1" stroke-width="2"><circle cx="130" cy="190" r="55"/><circle cx="130" cy="335" r="55"/><circle cx="130" cy="480" r="55"/><circle cx="130" cy="625" r="55"/><circle cx="130" cy="770" r="55"/><circle cx="130" cy="915" r="55"/></g><g fill="#fff" font-size="23" font-weight="800"><text x="220" y="184">01 登錄用途與責任人</text><text x="220" y="329">02 建立唯一代理身分</text><text x="220" y="474">03 核准最小權限</text><text x="220" y="619">04 執行前情境檢查</text><text x="220" y="764">05 監測行動與異常</text><text x="220" y="909">06 撤銷憑證與連線</text></g><g fill="#bce8dd" font-size="17"><text x="220" y="214">目的、資料、工具、負責單位</text><text x="220" y="359">版本、環境、工作負載憑證</text><text x="220" y="504">範圍、時效、高風險覆核</text><text x="220" y="649">確認使用者、目的與臨床狀態</text><text x="220" y="794">保存意圖、輸入、動作與結果</text><text x="220" y="939">關閉權限並保留結案證據</text></g><rect x="70" y="1010" width="580" height="110" rx="22" fill="#172447" stroke="#7ea8ff" stroke-width="2"/><text x="360" y="1054" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">驗收：過期授權無法重播</text><text x="360" y="1090" fill="#c6d7ff" font-size="17" text-anchor="middle">停用代理後，工具與資料存取同步失效</text></g></svg>