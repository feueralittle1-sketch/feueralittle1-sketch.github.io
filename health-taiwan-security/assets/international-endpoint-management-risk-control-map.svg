<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">端點管理平台風險與控制證據對照</title><desc id="desc">將管理帳號接管、錯誤批次指令、稽核失效及平台不可用四類風險，對照身分隔離、分批部署、外送日誌及離線復原等控制證據。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17234b"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="66" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">風險、控制與驗收證據必須一一對應</text><text x="600" y="105" text-anchor="middle" fill="#9fb3d9" font-size="20">只開啟 MFA 或保留備份，仍不足以控制高權限平台的系統性衝擊</text>
<g font-size="22" font-weight="700" text-anchor="middle"><rect x="55" y="155" width="270" height="58" rx="18" fill="#4b2b3c"/><text x="190" y="192" fill="#ffd0dc">主要風險</text><rect x="350" y="155" width="350" height="58" rx="18" fill="#123b60"/><text x="525" y="192" fill="#8fe8ff">控制設計</text><rect x="725" y="155" width="420" height="58" rx="18" fill="#16463f"/><text x="935" y="192" fill="#9ff9df">驗收證據</text></g>
<g font-size="20"><g fill="#2d2535"><rect x="55" y="238" width="270" height="84" rx="18"/><rect x="55" y="341" width="270" height="84" rx="18"/><rect x="55" y="444" width="270" height="84" rx="18"/><rect x="55" y="547" width="270" height="84" rx="18"/></g><g fill="#fff" text-anchor="middle"><text x="190" y="288">管理帳號遭接管</text><text x="190" y="391">錯誤／過大批次指令</text><text x="190" y="494">平台內稽核遭竄改</text><text x="190" y="597">平台或身分服務不可用</text></g>
<g fill="#102f54"><rect x="350" y="238" width="350" height="84" rx="18"/><rect x="350" y="341" width="350" height="84" rx="18"/><rect x="350" y="444" width="350" height="84" rx="18"/><rect x="350" y="547" width="350" height="84" rx="18"/></g><g fill="#e8f5ff" text-anchor="middle"><text x="525" y="274">專用管理身分、FIDO2、JIT</text><text x="525" y="301">管理工作站與條件式存取</text><text x="525" y="377">群組上限、雙人覆核、試點</text><text x="525" y="404">停止條件與緊急凍結</text><text x="525" y="480">日誌即時外送、權限分離</text><text x="525" y="507">獨立時間源與保留政策</text><text x="525" y="583">離線帳冊、替代管理路徑</text><text x="525" y="610">乾淨重建與憑證輪替</text></g>
<g fill="#123d3a"><rect x="725" y="238" width="420" height="84" rx="18"/><rect x="725" y="341" width="420" height="84" rx="18"/><rect x="725" y="444" width="420" height="84" rx="18"/><rect x="725" y="547" width="420" height="84" rx="18"/></g><g fill="#dcfff3" text-anchor="middle"><text x="935" y="274">管理員清冊、驗證紀錄、逾期權限數</text><text x="935" y="301">非管理端點拒絕登入測試</text><text x="935" y="377">批次大小、失敗率、核准與回退紀錄</text><text x="935" y="404">臨床代表確認與停止演練</text><text x="935" y="480">外部 SIEM 收件率與完整性告警</text><text x="935" y="507">管理平台無法刪除的查詢結果</text><text x="935" y="583">帳號封鎖、重建時間與端點重納管率</text><text x="935" y="610">訂單／臨床替代流程演練結果</text></g></g></g></svg>
