<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">個人健康 App 病歷交付風險控制圖手機版</title><desc id="desc">五種病歷交付失敗模式分別對應可執行控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17264a"/></linearGradient></defs><rect width="720" height="1200" fill="url(#bg)"/><text x="50" y="65" fill="#f8fbff" font-size="30" font-weight="800">病歷交付風險與控制</text><text x="50" y="105" fill="#9fb3d9" font-size="18">同意畫面不能取代完整治理</text><g><rect x="50" y="150" width="620" height="165" rx="25" fill="#241d36" stroke="#ff7f96" stroke-width="3"/><text x="85" y="202" fill="#ffabb8" font-size="23" font-weight="800">冒名或代理權過期</text><text x="85" y="250" fill="#e6eefc" font-size="20">風險式驗證／代理時效／人工例外</text><rect x="50" y="335" width="620" height="165" rx="25" fill="#21233c" stroke="#f2c94c" stroke-width="3"/><text x="85" y="387" fill="#ffe58a" font-size="23" font-weight="800">一次交付過量資料</text><text x="85" y="435" fill="#e6eefc" font-size="20">最小資料／日期區間／敏感欄位確認</text><rect x="50" y="520" width="620" height="165" rx="25" fill="#1b2841" stroke="#63e6ff" stroke-width="3"/><text x="85" y="572" fill="#8fe8ff" font-size="23" font-weight="800">App 或重新導向錯置</text><text x="85" y="620" fill="#e6eefc" font-size="20">端點核對／顯示接收者／禁止靜默改址</text><rect x="50" y="705" width="620" height="165" rx="25" fill="#19323a" stroke="#57f0c1" stroke-width="3"/><text x="85" y="757" fill="#7ff5d2" font-size="23" font-weight="800">長效權杖持續取用</text><text x="85" y="805" fill="#e6eefc" font-size="20">短效授權／最小 scope／撤權與重驗</text><rect x="50" y="890" width="620" height="190" rx="25" fill="#30283d" stroke="#a997ff" stroke-width="3"/><text x="85" y="942" fill="#d8d1ff" font-size="23" font-weight="800">法域與責任誤判</text><text x="85" y="990" fill="#e6eefc" font-size="20">分列外國規則、台灣建議、角色與契約</text><text x="85" y="1032" fill="#9fb3d9" font-size="18">API 不能單獨決定法律與風險接受</text></g><text x="360" y="1145" text-anchor="middle" fill="#9fb3d9" font-size="18">資料、法務、醫療資訊與資安共同驗收</text></svg>