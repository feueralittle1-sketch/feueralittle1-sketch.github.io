<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">院內 IP 攝影機六階段治理流程</title><desc id="desc">從盤點、分級、隔離、強化、驗證到退場，為每個階段列出可交付證據。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#12254a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">從裝上鏡頭到安全退場：六階段閉環</text><text x="60" y="108" fill="#9fb3d9" font-size="20">每一步都要留下資產、組態、測試或核准證據</text>
<g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M350 245H435"/><path d="M765 245H850"/><path d="M1015 330V390"/><path d="M850 495H765"/><path d="M435 495H350"/></g>
<g><rect x="50" y="165" width="300" height="160" rx="24" fill="#12314b" stroke="#63e6ff" stroke-width="2"/><text x="80" y="210" fill="#8fe8ff" font-size="23" font-weight="700">01 盤點</text><text x="80" y="250" fill="#fff" font-size="21">型號・韌體・位置・擁有人</text><text x="80" y="285" fill="#a8bad8" font-size="18">證據：完整率與未知設備清單</text>
<rect x="435" y="165" width="330" height="160" rx="24" fill="#20264e" stroke="#9c8cff" stroke-width="2"/><text x="465" y="210" fill="#c4bbff" font-size="23" font-weight="700">02 分級</text><text x="465" y="250" fill="#fff" font-size="21">隱私範圍・實體接觸・服務影響</text><text x="465" y="285" fill="#a8bad8" font-size="18">證據：風險等級與處置時限</text>
<rect x="850" y="165" width="300" height="160" rx="24" fill="#12314b" stroke="#63e6ff" stroke-width="2"/><text x="880" y="210" fill="#8fe8ff" font-size="23" font-weight="700">03 隔離</text><text x="880" y="250" fill="#fff" font-size="21">設備區・允許清單・無直連</text><text x="880" y="285" fill="#a8bad8" font-size="18">證據：實測流向與拒絕紀錄</text>
<rect x="850" y="390" width="300" height="160" rx="24" fill="#173b45" stroke="#57f0c1" stroke-width="2"/><text x="880" y="435" fill="#8affd6" font-size="23" font-weight="700">04 強化</text><text x="880" y="475" fill="#fff" font-size="21">密碼・管理面・時間同步・日誌</text><text x="880" y="510" fill="#b8ffe7" font-size="18">證據：安全基線與例外到期日</text>
<rect x="435" y="390" width="330" height="160" rx="24" fill="#20264e" stroke="#9c8cff" stroke-width="2"/><text x="465" y="435" fill="#c4bbff" font-size="23" font-weight="700">05 驗證</text><text x="465" y="475" fill="#fff" font-size="21">更新・重啟・錄影・告警・回滾</text><text x="465" y="510" fill="#a8bad8" font-size="18">證據：代表情境測試結果</text>
<rect x="50" y="390" width="300" height="160" rx="24" fill="#38213d" stroke="#ff7aa8" stroke-width="2"/><text x="80" y="435" fill="#ffb1cc" font-size="23" font-weight="700">06 退場</text><text x="80" y="475" fill="#fff" font-size="21">替換・抹除・撤權・庫存更新</text><text x="80" y="510" fill="#ffd2e2" font-size="18">證據：資料處置與停用確認</text></g>
<rect x="180" y="620" width="840" height="58" rx="18" fill="#10233d" stroke="#4c6f9f"/><text x="232" y="656" fill="#eaf2ff" font-size="21" font-weight="700">驗收不是「畫面看得到」：還要證明管理路徑、更新能力與退場責任</text>
</svg>