<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">第三方 AI 風險與控制對照圖</title><desc id="desc">將隱藏依賴、未通知變更、資料外流、模型失效與供應商退場風險，對應清冊、契約、最小資料、監測回退及可攜退出控制。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17213e"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="75" fill="#fff" font-size="34" font-weight="800">風險必須對應可查證控制</text><text x="70" y="113" fill="#9fb3d9" font-size="20">供應商聲明只能作為輸入，驗收仍要有院內證據</text><g font-size="19"><rect x="70" y="155" width="1060" height="82" rx="18" fill="#182943" stroke="#536d95"/><text x="100" y="188" fill="#ffb3b3" font-size="22" font-weight="700">隱藏依賴</text><text x="300" y="188" fill="#c6d4eb">看不見底層模型、外掛、次處理者與資料位置</text><text x="780" y="188" fill="#63e6ff" font-weight="700">控制：主動清冊＋資料流＋依賴關係圖</text><text x="780" y="218" fill="#e6eefc">證據：版本、擁有人、位置與服務接續</text><rect x="70" y="251" width="1060" height="82" rx="18" fill="#182943" stroke="#536d95"/><text x="100" y="284" fill="#ffb3b3" font-size="22" font-weight="700">未通知變更</text><text x="300" y="284" fill="#c6d4eb">模型、資料來源或安全機制改變後直接上線</text><text x="780" y="284" fill="#63e6ff" font-weight="700">控制：預告期限＋重大變更閘門</text><text x="780" y="314" fill="#e6eefc">證據：差異紀錄、再驗證與核准人</text><rect x="70" y="347" width="1060" height="82" rx="18" fill="#182943" stroke="#536d95"/><text x="100" y="380" fill="#ffb3b3" font-size="22" font-weight="700">資料外流</text><text x="300" y="380" fill="#c6d4eb">提示、病歷或輸出被留存、訓練或轉交</text><text x="780" y="380" fill="#63e6ff" font-weight="700">控制：最小資料＋用途限制＋刪除驗證</text><text x="780" y="410" fill="#e6eefc">證據：欄位清單、留存期與刪除證明</text><rect x="70" y="443" width="1060" height="82" rx="18" fill="#182943" stroke="#536d95"/><text x="100" y="476" fill="#ffb3b3" font-size="22" font-weight="700">模型失效</text><text x="300" y="476" fill="#c6d4eb">漂移、提示注入、錯誤輸出或服務中斷</text><text x="780" y="476" fill="#63e6ff" font-weight="700">控制：監測＋人工覆核＋安全回退</text><text x="780" y="506" fill="#e6eefc">證據：門檻、停用時間與替代流程演練</text><rect x="70" y="539" width="1060" height="82" rx="18" fill="#182943" stroke="#536d95"/><text x="100" y="572" fill="#ffb3b3" font-size="22" font-weight="700">供應商退場</text><text x="300" y="572" fill="#c6d4eb">服務終止後資料、模型與流程無法接續</text><text x="780" y="572" fill="#63e6ff" font-weight="700">控制：可攜格式＋撤權＋退出演練</text><text x="780" y="602" fill="#e6eefc">證據：遷移結果、金鑰撤銷與殘留檢查</text></g><text x="600" y="675" fill="#9fb3d9" font-size="18" text-anchor="middle">驗收條件同時涵蓋安全、隱私、臨床品質、營運持續與契約責任</text></svg>