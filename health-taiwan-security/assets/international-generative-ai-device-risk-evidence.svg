<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">生成式人工智慧醫療器材的風險、控制與驗收證據</title><desc id="desc">將開放式錯誤、第三方模型漂移、自動化偏誤與敏感資料外洩，分別對應邊界控制、版本管理、人工覆核及資料最小化，並列出驗收證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient></defs>
<rect width="1200" height="760" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="66" fill="#fff" font-size="34" font-weight="700">風險控制要能留下「可重做、可比較、可回退」的證據</text><text x="58" y="106" fill="#a9bfdf" font-size="20">只宣稱模型準確或已由人工覆核，無法證明變更後仍適合原定醫療用途</text>
<text x="80" y="165" fill="#ff9fc1" font-size="22" font-weight="700">風險</text><text x="410" y="165" fill="#69e7ff" font-size="22" font-weight="700">控制</text><text x="800" y="165" fill="#7ff3cf" font-size="22" font-weight="700">驗收證據</text>
<g><rect x="55" y="190" width="300" height="110" rx="20" fill="#2b1730" stroke="#ff7da9" stroke-width="3"/><text x="80" y="230" fill="#ff9fc1" font-size="21" font-weight="700">開放式錯誤與虛構內容</text><text x="80" y="266" fill="#e5eefb" font-size="17">輸出流暢但超出預定用途</text><rect x="385" y="190" width="365" height="110" rx="20" fill="#102c43" stroke="#69e7ff" stroke-width="3"/><text x="410" y="230" fill="#69e7ff" font-size="20" font-weight="700">封閉輸出、拒答、信心與引用檢核</text><text x="410" y="266" fill="#e5eefb" font-size="17">高影響結論強制人工確認</text><rect x="780" y="190" width="365" height="110" rx="20" fill="#102f2f" stroke="#5aefbe" stroke-width="3"/><text x="805" y="230" fill="#7ff3cf" font-size="20" font-weight="700">固定測試集與失敗案例重播</text><text x="805" y="266" fill="#e5eefb" font-size="17">錯誤率、拒答率、覆核一致性</text>
<rect x="55" y="325" width="300" height="110" rx="20" fill="#2b1730" stroke="#ff7da9" stroke-width="3"/><text x="80" y="365" fill="#ff9fc1" font-size="21" font-weight="700">第三方模型靜默更新</text><text x="80" y="401" fill="#e5eefb" font-size="17">行為改變卻沒有院內變更單</text><rect x="385" y="325" width="365" height="110" rx="20" fill="#102c43" stroke="#69e7ff" stroke-width="3"/><text x="410" y="365" fill="#69e7ff" font-size="20" font-weight="700">版本釘選、供應商通知與替代模型</text><text x="410" y="401" fill="#e5eefb" font-size="17">更新先進隔離環境再驗證</text><rect x="780" y="325" width="365" height="110" rx="20" fill="#102f2f" stroke="#5aefbe" stroke-width="3"/><text x="805" y="365" fill="#7ff3cf" font-size="20" font-weight="700">模型清冊、雜湊與變更差異報告</text><text x="805" y="401" fill="#e5eefb" font-size="17">新舊版同批資料比較與回退演練</text>
<rect x="55" y="460" width="300" height="110" rx="20" fill="#2b1730" stroke="#ff7da9" stroke-width="3"/><text x="80" y="500" fill="#ff9fc1" font-size="21" font-weight="700">自動化偏誤與過度依賴</text><text x="80" y="536" fill="#e5eefb" font-size="17">人員只簽核，不真正評估</text><rect x="385" y="460" width="365" height="110" rx="20" fill="#102c43" stroke="#69e7ff" stroke-width="3"/><text x="410" y="500" fill="#69e7ff" font-size="20" font-weight="700">顯示限制、替代答案與接管條件</text><text x="410" y="536" fill="#e5eefb" font-size="17">以情境演練驗證人機分工</text><rect x="780" y="460" width="365" height="110" rx="20" fill="#102f2f" stroke="#5aefbe" stroke-width="3"/><text x="805" y="500" fill="#7ff3cf" font-size="20" font-weight="700">覆核時間、推翻率與接管紀錄</text><text x="805" y="536" fill="#e5eefb" font-size="17">高風險情境的人因測試結果</text>
<rect x="55" y="595" width="300" height="110" rx="20" fill="#2b1730" stroke="#ff7da9" stroke-width="3"/><text x="80" y="635" fill="#ff9fc1" font-size="21" font-weight="700">敏感資料與提示外洩</text><text x="80" y="671" fill="#e5eefb" font-size="17">輸入、日誌或供應商保留資料</text><rect x="385" y="595" width="365" height="110" rx="20" fill="#102c43" stroke="#69e7ff" stroke-width="3"/><text x="410" y="635" fill="#69e7ff" font-size="20" font-weight="700">資料最小化、去識別與契約限制</text><text x="410" y="671" fill="#e5eefb" font-size="17">隔離病歷識別與模型遙測</text><rect x="780" y="595" width="365" height="110" rx="20" fill="#102f2f" stroke="#5aefbe" stroke-width="3"/><text x="805" y="635" fill="#7ff3cf" font-size="20" font-weight="700">資料流圖、留存證據與刪除測試</text><text x="805" y="671" fill="#e5eefb" font-size="17">次處理者與跨境路徑可追溯</text></g></g></svg>