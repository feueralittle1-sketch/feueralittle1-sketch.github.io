<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備安全架構交付流程</title><desc id="desc">六階段將供應商安全架構文件轉成院端可測試、可放行與可重驗的證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">六階段安全架構驗收</text><text x="38" y="96" fill="#9fb7d5" font-size="18">文件必須能連到測試、缺口與放行</text><g font-size="18"><rect x="48" y="132" width="624" height="126" rx="22" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="78" y="174" fill="#63e6ff" font-size="23" font-weight="800">1　界定交付版本</text><text x="78" y="217" fill="#e6eefc">型號 · 軟體 · 組態 · 介面</text><rect x="48" y="278" width="624" height="126" rx="22" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="78" y="320" fill="#b9adff" font-size="23" font-weight="800">2　接收四種視圖</text><text x="78" y="363" fill="#e6eefc">全球 · 分區 · 序列 · 狀態</text><rect x="48" y="424" width="624" height="126" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="78" y="466" fill="#72f5cd" font-size="23" font-weight="800">3　建立追蹤矩陣</text><text x="78" y="509" fill="#e6eefc">資料流 → 控制 → 日誌 → 責任</text><rect x="48" y="570" width="624" height="126" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="78" y="612" fill="#ffd08a" font-size="23" font-weight="800">4　測試安全假設</text><text x="78" y="655" fill="#fff1dc">斷線 · 偽造 · 逾時 · 降級 · 回退</text><rect x="48" y="716" width="624" height="126" rx="22" fill="#3d2949" stroke="#ff8fc8" stroke-width="2"/><text x="78" y="758" fill="#ff9fd0" font-size="23" font-weight="800">5　處理差距與例外</text><text x="78" y="801" fill="#f7d9e9">補償控制 · 責任人 · 期限</text><rect x="48" y="862" width="624" height="126" rx="22" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="78" y="904" fill="#72f5cd" font-size="23" font-weight="800">6　放行與變更重驗</text><text x="78" y="947" fill="#ddfff4">版本基線 · 觸發條件 · 證據保存</text></g><text x="360" y="1035" text-anchor="middle" fill="#8fe8ff" font-size="18">圖、測試與放行必須相互查證</text></g></svg>