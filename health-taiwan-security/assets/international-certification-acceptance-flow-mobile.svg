<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">健康資訊系統在地安全驗收流程手機版</title><desc id="desc">從認證範圍核對到組態、情境測試、證據放行與持續重驗的五階段流程。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="720" height="1180" fill="url(#bg)"/><text x="40" y="66" fill="#fff" font-size="32" font-weight="800">在地安全驗收五階段</text><text x="40" y="105" fill="#9fb7db" font-size="20">把產品能力轉成可重複的醫院證據。</text><g font-family="sans-serif"><rect x="75" y="150" width="570" height="155" rx="26" fill="#173153" stroke="#63e6ff" stroke-width="3"/><text x="110" y="205" fill="#63e6ff" font-size="25" font-weight="800">1 範圍核對</text><text x="110" y="249" fill="#e4efff" font-size="21">版本、模組、例外、外部依賴 → 邊界表</text><path d="M360 305 V350" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><rect x="75" y="350" width="570" height="155" rx="26" fill="#2b275b" stroke="#b69cff" stroke-width="3"/><text x="110" y="405" fill="#d6c9ff" font-size="25" font-weight="800">2 組態驗證</text><text x="110" y="449" fill="#eee8ff" font-size="21">SSO、MFA、角色、稽核、介接 → 組態證據</text><path d="M360 505 V550" stroke="#b69cff" stroke-width="6" marker-end="url(#a)"/><rect x="75" y="550" width="570" height="155" rx="26" fill="#123d45" stroke="#57f0c1" stroke-width="3"/><text x="110" y="605" fill="#57f0c1" font-size="25" font-weight="800">3 情境測試</text><text x="110" y="649" fill="#e2fff7" font-size="21">越權、失敗、日誌、停機、回復 → 測試紀錄</text><path d="M360 705 V750" stroke="#57f0c1" stroke-width="6" marker-end="url(#a)"/><rect x="75" y="750" width="570" height="155" rx="26" fill="#3d2a43" stroke="#ff91b8" stroke-width="3"/><text x="110" y="805" fill="#ffb6d0" font-size="25" font-weight="800">4 證據放行</text><text x="110" y="849" fill="#ffe6ef" font-size="21">缺口分級、期限、核准、回退 → 放行決議</text><path d="M360 905 V950" stroke="#ff91b8" stroke-width="6" marker-end="url(#a)"/><rect x="75" y="950" width="570" height="120" rx="26" fill="#1b3550" stroke="#7ba7ff" stroke-width="3"/><text x="110" y="1003" fill="#a9c6ff" font-size="25" font-weight="800">5 持續重驗</text><text x="110" y="1043" fill="#e1ebff" font-size="21">更新、介接、事件與重大組態變更觸發</text></g><rect x="55" y="1110" width="610" height="50" rx="25" fill="#0d203a" stroke="#7ba7ff" stroke-width="2"/><text x="360" y="1142" text-anchor="middle" fill="#dbe7ff" font-size="18" font-weight="700">放行依據是可重現證據，不是單一證書</text></svg>
