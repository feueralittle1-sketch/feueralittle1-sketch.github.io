<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院通訊風險與控制對照</title><desc id="desc">共同路徑、電力耗盡、名冊過期、容量壅塞與紀錄遺失對應治理控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13233d"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="70" fill="#fff" font-size="34" font-weight="800">通訊備援的五個常見失敗點</text><text x="70" y="108" fill="#9fb3d9" font-size="19">設備存在不代表服務可持續，需以控制證據驗收</text><g font-family="sans-serif"><text x="255" y="155" text-anchor="middle" fill="#ff9b9b" font-size="22" font-weight="800">風險</text><text x="850" y="155" text-anchor="middle" fill="#7ff5d2" font-size="22" font-weight="800">控制與證據</text><g font-size="19"><rect x="70" y="180" width="370" height="78" rx="20" fill="#351d2b" stroke="#ff7b9c"/><text x="100" y="215" fill="#fff" font-weight="700">兩條線路共享最後一哩</text><text x="100" y="240" fill="#d7b8c4" font-size="16">單點故障仍會同時中斷</text><path d="M440 219H540" stroke="#f2c94c" stroke-width="4"/><rect x="540" y="180" width="590" height="78" rx="20" fill="#123638" stroke="#57f0c1"/><text x="570" y="215" fill="#fff" font-weight="700">核對電信商、路由、機房與電力依賴</text><text x="570" y="240" fill="#b9ddd7" font-size="16">證據：路徑圖、供應商聲明、實際斷線測試</text><rect x="70" y="275" width="370" height="78" rx="20" fill="#351d2b" stroke="#ff7b9c"/><text x="100" y="310" fill="#fff" font-weight="700">手機與無線電同時沒電</text><text x="100" y="335" fill="#d7b8c4" font-size="16">備援設備無法持續運作</text><path d="M440 314H540" stroke="#f2c94c" stroke-width="4"/><rect x="540" y="275" width="590" height="78" rx="20" fill="#123638" stroke="#57f0c1"/><text x="570" y="310" fill="#fff" font-weight="700">獨立充電、備用電池與續航輪替</text><text x="570" y="335" fill="#b9ddd7" font-size="16">證據：續航測試、設備簽領、電池更換紀錄</text><rect x="70" y="370" width="370" height="78" rx="20" fill="#351d2b" stroke="#ff7b9c"/><text x="100" y="405" fill="#fff" font-weight="700">聯絡名冊與角色已過期</text><text x="100" y="430" fill="#d7b8c4" font-size="16">訊息送不到真正負責人</text><path d="M440 409H540" stroke="#f2c94c" stroke-width="4"/><rect x="540" y="370" width="590" height="78" rx="20" fill="#123638" stroke="#57f0c1"/><text x="570" y="405" fill="#fff" font-weight="700">季度核對、代理人與雙向通聯演練</text><text x="570" y="430" fill="#b9ddd7" font-size="16">證據：送達率、未接通清單、改善期限</text><rect x="70" y="465" width="370" height="78" rx="20" fill="#351d2b" stroke="#ff7b9c"/><text x="100" y="500" fill="#fff" font-weight="700">所有人同時搶用有限容量</text><text x="100" y="525" fill="#d7b8c4" font-size="16">關鍵臨床通訊反而失敗</text><path d="M440 504H540" stroke="#f2c94c" stroke-width="4"/><rect x="540" y="465" width="590" height="78" rx="20" fill="#123638" stroke="#57f0c1"/><text x="570" y="500" fill="#fff" font-weight="700">角色化配發、優先序與標準訊息格式</text><text x="570" y="525" fill="#b9ddd7" font-size="16">證據：容量演練、等待時間、關鍵任務完成率</text><rect x="70" y="560" width="370" height="78" rx="20" fill="#351d2b" stroke="#ff7b9c"/><text x="100" y="595" fill="#fff" font-weight="700">恢復後未補登決策與醫囑</text><text x="100" y="620" fill="#d7b8c4" font-size="16">臨床與事件時間線出現缺口</text><path d="M440 599H540" stroke="#f2c94c" stroke-width="4"/><rect x="540" y="560" width="590" height="78" rx="20" fill="#123638" stroke="#57f0c1"/><text x="570" y="595" fill="#fff" font-weight="700">紙本流水號、回讀確認與恢復後對帳</text><text x="570" y="620" fill="#b9ddd7" font-size="16">證據：補登清單、差異處置、結案核准</text></g></g></svg>