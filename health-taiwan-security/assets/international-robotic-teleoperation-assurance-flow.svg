<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">遠端醫療機器人六階段驗收流程</title><desc id="desc">由臨床用途界定、危害分析、控制鏈測試、網路壓力測試、接管演練到持續監測的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="55" y="66" fill="#f7fbff" font-size="34" font-weight="800">六階段把遠端操控轉成可驗收證據</text><text x="55" y="103" fill="#9fb7d5" font-size="19">安全門檻必須同時涵蓋臨床、網路、軟體、設備與人員</text><rect x="55" y="160" width="330" height="170" rx="25" fill="#173b5d" stroke="#63e6ff" stroke-width="3"/><text x="85" y="205" fill="#ffffff" font-size="21" font-weight="800">1. 界定臨床用途</text><text x="85" y="250" fill="#e6eefc" font-size="17">程序、病人、地點與責任</text><text x="85" y="288" fill="#9fb7d5" font-size="16">先定義不得失敗的結果</text><rect x="435" y="160" width="330" height="170" rx="25" fill="#19443e" stroke="#57f0c1" stroke-width="3"/><text x="465" y="205" fill="#ffffff" font-size="21" font-weight="800">2. 建立危害模型</text><text x="465" y="250" fill="#e6eefc" font-size="17">誤指令、延遲、斷線、冒名</text><text x="465" y="288" fill="#9fb7d5" font-size="16">把資安故障連到臨床危害</text><rect x="815" y="160" width="330" height="170" rx="25" fill="#4a3420" stroke="#ffbf69" stroke-width="3"/><text x="845" y="205" fill="#ffffff" font-size="21" font-weight="800">3. 驗證控制鏈</text><text x="845" y="250" fill="#e6eefc" font-size="17">身分、授權、簽章、版本</text><text x="845" y="288" fill="#9fb7d5" font-size="16">以負向測試證明拒絕錯誤</text><rect x="55" y="385" width="330" height="170" rx="25" fill="#332657" stroke="#b9adff" stroke-width="3"/><text x="85" y="430" fill="#ffffff" font-size="21" font-weight="800">4. 測試網路壓力</text><text x="85" y="475" fill="#e6eefc" font-size="17">延遲、抖動、遺失、切換</text><text x="85" y="513" fill="#9fb7d5" font-size="16">在最差條件下仍可控</text><rect x="435" y="385" width="330" height="170" rx="25" fill="#123c55" stroke="#8fe8ff" stroke-width="3"/><text x="465" y="430" fill="#ffffff" font-size="21" font-weight="800">5. 演練接管降級</text><text x="465" y="475" fill="#e6eefc" font-size="17">安全停止、在地接管、替代處置</text><text x="465" y="513" fill="#9fb7d5" font-size="16">讓床邊團隊真的做得到</text><rect x="815" y="385" width="330" height="170" rx="25" fill="#263952" stroke="#7dd3fc" stroke-width="3"/><text x="845" y="430" fill="#ffffff" font-size="21" font-weight="800">6. 持續監測重驗</text><text x="845" y="475" fill="#e6eefc" font-size="17">異常、更新、供應商與事件</text><text x="845" y="513" fill="#9fb7d5" font-size="16">變更後重新確認放行</text><path d="M385 245H420M765 245H800M1025 330V385M800 470H765M420 470H385" stroke="#8fe8ff" stroke-width="4" marker-end="url(#a)" fill="none"/></g></svg>