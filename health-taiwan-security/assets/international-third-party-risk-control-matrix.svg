<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">醫療第三方風險與控制證據矩陣</title>
  <desc id="desc">對照次處理者不可見、遠端帳號濫用、事件延遲、集中故障與供應商鎖定五類風險，以及相應控制和驗收證據。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#121a35"/></linearGradient></defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="60" y="64" fill="#f8fbff" font-size="32" font-weight="700">風險要能對到控制，也要能拿出證據</text>
  <text x="60" y="100" fill="#a8bad8" font-size="19">只有問卷或合規聲明，不足以證明臨床依賴已被控制</text>
  <g font-family="Inter,Noto Sans TC,sans-serif">
    <rect x="55" y="140" width="1090" height="550" rx="24" fill="#0f2038" stroke="#334d70" stroke-width="2"/>
    <rect x="55" y="140" width="1090" height="66" rx="24" fill="#183653"/>
    <text x="95" y="182" fill="#63e6ff" font-size="20" font-weight="700">風險情境</text><text x="410" y="182" fill="#63e6ff" font-size="20" font-weight="700">最低控制</text><text x="800" y="182" fill="#63e6ff" font-size="20" font-weight="700">驗收證據</text>
    <g stroke="#334d70" stroke-width="2"><path d="M55 302H1145M55 398H1145M55 494H1145M55 590H1145"/><path d="M360 140V690M750 140V690"/></g>
    <g fill="#f3f7ff" font-size="19" font-weight="700"><text x="90" y="252">次處理者不可見</text><text x="90" y="348">遠端帳號遭濫用</text><text x="90" y="444">事件通知延遲</text><text x="90" y="540">集中故障</text><text x="90" y="636">供應商鎖定</text></g>
    <g fill="#c6d4eb" font-size="17"><text x="395" y="244">揭露、變更通知、要求下游控制</text><text x="395" y="271">與稽核權</text><text x="395" y="340">MFA、JIT、最小權限、隔離通道</text><text x="395" y="367">與工作階段監測</text><text x="395" y="436">契約時限、分級、指定聯絡窗口</text><text x="395" y="463">與聯合演練</text><text x="395" y="532">替代流程、多區域／替代供應</text><text x="395" y="559">與依賴上限</text><text x="395" y="628">可攜格式、移轉支援、終止條款</text><text x="395" y="655">與刪除驗證</text></g>
    <g fill="#bdeee9" font-size="17"><text x="785" y="244">最新次處理者清單</text><text x="785" y="271">變更紀錄與抽查報告</text><text x="785" y="340">帳號清冊、核准單、連線日誌</text><text x="785" y="367">與定期撤權結果</text><text x="785" y="436">演練時間線、通知樣本</text><text x="785" y="463">與改善追蹤</text><text x="785" y="532">故障演練、RTO 結果</text><text x="785" y="559">與臨床降級紀錄</text><text x="785" y="628">匯出測試、完整性驗證</text><text x="785" y="655">與刪除證明</text></g>
    <rect x="370" y="708" width="460" height="34" rx="17" fill="#312b5b"/><text x="600" y="732" fill="#d9d2ff" font-size="17" text-anchor="middle">驗收原則：可重現、可追溯、有期限、有責任人</text>
  </g>
</svg>
