<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">基因資料風險與控制對照</title><desc id="desc">將再識別、帳號共用、未核准下載、推論輸出與研究結束後殘留等風險對應治理控制及驗證證據。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182449"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#g)"/><text x="58" y="68" fill="#fff" font-size="36" font-weight="800">基因資料風險不能只靠去識別：控制與證據要成對</text><text x="58" y="108" fill="#9fb8dc" font-size="22">高敏感、長效識別資料需要預防、偵測與關閉證據</text><g font-family="sans-serif"><text x="165" y="175" text-anchor="middle" fill="#ff9fba" font-size="25" font-weight="700">風險</text><text x="600" y="175" text-anchor="middle" fill="#75e6ff" font-size="25" font-weight="700">控制</text><text x="1030" y="175" text-anchor="middle" fill="#7cf1c7" font-size="25" font-weight="700">驗證證據</text>
<g transform="translate(0 200)"><rect x="55" width="280" height="82" rx="18" fill="#442339" stroke="#ff7fa9"/><text x="195" y="50" text-anchor="middle" fill="#fff" font-size="23">資料再識別</text><rect x="380" width="440" height="82" rx="18" fill="#15304d" stroke="#66dfff"/><text x="600" y="34" text-anchor="middle" fill="#fff" font-size="22">欄位最小化、受控環境</text><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="22">輸出揭露審查</text><rect x="865" width="280" height="82" rx="18" fill="#153a39" stroke="#72f0c1"/><text x="1005" y="50" text-anchor="middle" fill="#fff" font-size="22">輸出核准紀錄</text></g>
<g transform="translate(0 300)"><rect x="55" width="280" height="82" rx="18" fill="#442339" stroke="#ff7fa9"/><text x="195" y="50" text-anchor="middle" fill="#fff" font-size="23">帳號共用與冒用</text><rect x="380" width="440" height="82" rx="18" fill="#15304d" stroke="#66dfff"/><text x="600" y="34" text-anchor="middle" fill="#fff" font-size="22">唯一身分、MFA</text><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="22">機構責任與定期再驗證</text><rect x="865" width="280" height="82" rx="18" fill="#153a39" stroke="#72f0c1"/><text x="1005" y="50" text-anchor="middle" fill="#fff" font-size="22">登入與核驗日誌</text></g>
<g transform="translate(0 400)"><rect x="55" width="280" height="82" rx="18" fill="#442339" stroke="#ff7fa9"/><text x="195" y="50" text-anchor="middle" fill="#fff" font-size="23">未核准下載</text><rect x="380" width="440" height="82" rx="18" fill="#15304d" stroke="#66dfff"/><text x="600" y="34" text-anchor="middle" fill="#fff" font-size="22">出口封鎖、工作區隔離</text><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="22">大流量與異常查詢偵測</text><rect x="865" width="280" height="82" rx="18" fill="#153a39" stroke="#72f0c1"/><text x="1005" y="50" text-anchor="middle" fill="#fff" font-size="22">告警與調查單</text></g>
<g transform="translate(0 500)"><rect x="55" width="280" height="82" rx="18" fill="#442339" stroke="#ff7fa9"/><text x="195" y="50" text-anchor="middle" fill="#fff" font-size="23">研究結束後殘留</text><rect x="380" width="440" height="82" rx="18" fill="#15304d" stroke="#66dfff"/><text x="600" y="34" text-anchor="middle" fill="#fff" font-size="22">自動到期、憑證撤銷</text><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="22">工作區與衍生資料結案</text><rect x="865" width="280" height="82" rx="18" fill="#153a39" stroke="#72f0c1"/><text x="1005" y="50" text-anchor="middle" fill="#fff" font-size="22">撤權與清除證明</text></g></g><rect x="55" y="630" width="1090" height="76" rx="20" fill="#0c1c34" stroke="#2a4264"/><text x="600" y="678" text-anchor="middle" fill="#e7f0ff" font-size="23">驗收重點：能否重現誰在何時、以何目的、查詢哪些資料、輸出什麼結果，以及何時撤權</text></svg>