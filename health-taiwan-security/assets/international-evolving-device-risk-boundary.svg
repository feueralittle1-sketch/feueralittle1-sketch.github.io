<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療設備新興技術風險邊界圖</title>
<desc id="desc">雲端服務、人工智慧與後量子密碼變更經製造商產品邊界、醫院整合邊界與臨床使用邊界，形成需要共同管理的資安與病人安全風險。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#101a3a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70e7ff"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="32" font-weight="700">新興技術不是外掛：風險會穿越三層邊界</text><text x="60" y="108" fill="#9db7d7" font-size="20">先辨識責任、資料流、失效後果與可驗證控制，再決定能否進入臨床。</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="55" y="155" width="270" height="440" rx="28" fill="#0d2940" stroke="#35d5f5" stroke-width="2"/><text x="190" y="205" fill="#74eaff" font-size="24" font-weight="700">技術變更來源</text><rect x="90" y="245" width="200" height="80" rx="18" fill="#133c55"/><text x="190" y="278" fill="#fff" font-size="21">雲端／遠端服務</text><text x="190" y="305" fill="#b9d7e8" font-size="16">連線、資料、供應商依賴</text><rect x="90" y="350" width="200" height="80" rx="18" fill="#34295c"/><text x="190" y="383" fill="#fff" font-size="21">AI／機器學習</text><text x="190" y="410" fill="#d9ccff" font-size="16">模型、資料、輸出漂移</text><rect x="90" y="455" width="200" height="80" rx="18" fill="#21443d"/><text x="190" y="488" fill="#fff" font-size="21">PQC／密碼遷移</text><text x="190" y="515" fill="#bcebdc" font-size="16">演算法、金鑰、相容性</text>
<rect x="405" y="155" width="335" height="440" rx="28" fill="#121f3b" stroke="#a894ff" stroke-width="2"/><text x="572" y="205" fill="#c7baff" font-size="24" font-weight="700">三層責任邊界</text><rect x="445" y="245" width="255" height="76" rx="18" fill="#26345a"/><text x="572" y="278" fill="#fff" font-size="21">製造商產品邊界</text><text x="572" y="304" fill="#cbd5ee" font-size="16">設計、威脅模型、更新證據</text><rect x="445" y="350" width="255" height="76" rx="18" fill="#26345a"/><text x="572" y="383" fill="#fff" font-size="21">醫院整合邊界</text><text x="572" y="409" fill="#cbd5ee" font-size="16">網路、身分、介接、監測</text><rect x="445" y="455" width="255" height="76" rx="18" fill="#26345a"/><text x="572" y="488" fill="#fff" font-size="21">臨床使用邊界</text><text x="572" y="514" fill="#cbd5ee" font-size="16">預定用途、人工覆核、降級</text>
<rect x="820" y="155" width="325" height="440" rx="28" fill="#102c33" stroke="#63f0c2" stroke-width="2"/><text x="982" y="205" fill="#7af3cc" font-size="24" font-weight="700">共同驗收輸出</text><rect x="860" y="245" width="245" height="76" rx="18" fill="#17454a"/><text x="982" y="278" fill="#fff" font-size="21">病人安全後果</text><text x="982" y="304" fill="#c5e9e3" font-size="16">錯誤、延遲、不可用</text><rect x="860" y="350" width="245" height="76" rx="18" fill="#17454a"/><text x="982" y="383" fill="#fff" font-size="21">資安控制證據</text><text x="982" y="409" fill="#c5e9e3" font-size="16">測試、日誌、回退、責任</text><rect x="860" y="455" width="245" height="76" rx="18" fill="#17454a"/><text x="982" y="488" fill="#fff" font-size="21">持續監測觸發</text><text x="982" y="514" fill="#c5e9e3" font-size="16">事件、漂移、依賴或標準變更</text></g>
<path d="M325 375 H395" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"/><path d="M740 375 H810" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)" filter="url(#glow)"/><text x="600" y="650" text-anchor="middle" fill="#a9bdd7" font-size="19">任何一層責任不清，都可能讓技術風險在臨床上變成無人負責的失效。</text></svg>