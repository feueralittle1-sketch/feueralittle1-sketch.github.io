<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1170" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全文件六階段驗收流程</title><desc id="desc">六個垂直階段形成持續重驗閉環。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<rect width="390" height="1170" rx="28" fill="url(#bg)"/>
<text x="195" y="48" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="26" font-weight="700" fill="#f4f8ff">六階段驗收閉環</text><g filter="url(#shadow)"><rect x="38" y="80" width="314" height="125" rx="22" fill="#102742" stroke="#7aa7ff" stroke-width="2"/><text x="195.0" y="128" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="800" fill="#f4f8ff">1 接收</text><text x="195.0" y="168" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">文件包與聯絡窗口</text></g><path d="M195 205 L195 235" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="38" y="245" width="314" height="125" rx="22" fill="#102742" stroke="#5eead4" stroke-width="2"/><text x="195.0" y="293" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="800" fill="#f4f8ff">2 對齊</text><text x="195.0" y="333" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">型號／版本／部署</text></g><path d="M195 370 L195 400" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="38" y="410" width="314" height="125" rx="22" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="195.0" y="458" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="800" fill="#f4f8ff">3 驗證</text><text x="195.0" y="498" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">組態／連線／日誌</text></g><path d="M195 535 L195 565" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="38" y="575" width="314" height="125" rx="22" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="195.0" y="623" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="800" fill="#f4f8ff">4 補缺</text><text x="195.0" y="663" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">修正或補償控制</text></g><path d="M195 700 L195 730" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="38" y="740" width="314" height="125" rx="22" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="195.0" y="788" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="800" fill="#f4f8ff">5 放行</text><text x="195.0" y="828" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">責任與例外核准</text></g><path d="M195 865 L195 895" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="38" y="905" width="314" height="125" rx="22" fill="#102742" stroke="#fb7185" stroke-width="2"/><text x="195.0" y="953" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="800" fill="#f4f8ff">6 重驗</text><text x="195.0" y="993" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">更新／事件／續約</text></g><text x="195" y="1090" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="19" font-weight="700" fill="#5eead4">變更或事件發生 → 回到版本對齊</text></svg>