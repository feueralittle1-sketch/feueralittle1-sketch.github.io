<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療漏洞處置風險與控制矩陣</title><desc id="desc">對照資產漏比對、緊急修補造成臨床中斷、無限期例外與僅以 CVSS 排序等失敗模式及治理控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172653"/></linearGradient></defs><rect width="1200" height="760" rx="32" fill="url(#bg)"/>
<g font-family="Noto Sans TC, sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="800">常見失敗模式：快修、慢修都可能傷害臨床服務</text><text x="60" y="112" fill="#a8bad8" font-size="20">治理控制要同時降低遭利用風險與不當變更風險</text>
<rect x="55" y="165" width="1090" height="76" rx="18" fill="#17365e"/><text x="95" y="213" fill="#fff" font-size="23" font-weight="750">失敗模式</text><text x="405" y="213" fill="#fff" font-size="23" font-weight="750">可能後果</text><text x="765" y="213" fill="#fff" font-size="23" font-weight="750">必要控制與證據</text>
<g font-size="19"><rect x="55" y="255" width="1090" height="95" rx="16" fill="#102b48"/><text x="95" y="292" fill="#ffb2bd" font-weight="700">資產清冊漏掉版本</text><text x="95" y="322" fill="#c8d8ed">公告已收，設備仍暴露</text><text x="405" y="306" fill="#c8d8ed">高風險系統沒有進入派工</text><text x="765" y="292" fill="#72f0c5">多來源探索＋版本可信度</text><text x="765" y="322" fill="#c8d8ed">未識別資產清單與責任人</text>
<rect x="55" y="365" width="1090" height="95" rx="16" fill="#102b48"/><text x="95" y="402" fill="#ffb2bd" font-weight="700">未測試就緊急安裝</text><text x="95" y="432" fill="#c8d8ed">介面、設備或診療流程異常</text><text x="405" y="416" fill="#c8d8ed">臨床服務中斷或回復失敗</text><text x="765" y="402" fill="#72f0c5">代表性測試＋變更窗口</text><text x="765" y="432" fill="#c8d8ed">功能檢核與可演練回復方案</text>
<rect x="55" y="475" width="1090" height="95" rx="16" fill="#102b48"/><text x="95" y="512" fill="#ffb2bd" font-weight="700">僅依 CVSS 排序</text><text x="95" y="542" fill="#c8d8ed">忽略已遭利用與可達路徑</text><text x="405" y="526" fill="#c8d8ed">資源先處理較低現實威脅</text><text x="765" y="512" fill="#72f0c5">KEV＋暴露＋臨床影響</text><text x="765" y="542" fill="#c8d8ed">可追溯的優先序決策單</text>
<rect x="55" y="585" width="1090" height="95" rx="16" fill="#102b48"/><text x="95" y="622" fill="#ffb2bd" font-weight="700">補償控制無期限</text><text x="95" y="652" fill="#c8d8ed">隔離鬆動、監測失效</text><text x="405" y="636" fill="#c8d8ed">殘餘風險長期不可見</text><text x="765" y="622" fill="#72f0c5">具名接受＋到期日＋觸發條件</text><text x="765" y="652" fill="#c8d8ed">定期驗證隔離與偵測有效性</text></g>
<text x="60" y="720" fill="#9fb3d9" font-size="18">驗收原則：每項風險都能連到資產、決策、控制、期限與驗證結果</text></g></svg>