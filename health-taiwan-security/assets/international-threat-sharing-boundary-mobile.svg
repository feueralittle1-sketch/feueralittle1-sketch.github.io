<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc"><title id="title">手機版醫療威脅情資分享邊界</title><desc id="desc">外部情資先通過醫院治理閘門，再轉成院內行動與回饋。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="390" height="760" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="45" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">外部情資到臨床行動</text><rect x="30" y="75" width="330" height="150" rx="22" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="195" y="112" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="700">外部情資</text><g fill="#d8e6fb" font-size="17" text-anchor="middle"><text x="195" y="148">官方通報／醫療社群／合作夥伴</text><text x="195" y="180">IOC、TTP、建議措施、分享標記</text></g><path d="M195 230V275" stroke="#63e6ff" stroke-width="7"/><path d="M183 263L195 280L207 263" fill="#63e6ff"/><rect x="20" y="285" width="350" height="245" rx="24" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="195" y="325" text-anchor="middle" fill="#c5baff" font-size="21" font-weight="800">醫院治理閘門</text><g fill="#fff" font-size="17" text-anchor="middle"><text x="195" y="365">去識別與最小必要</text><text x="195" y="402">驗證來源、時效、信心與範圍</text><text x="195" y="439">對照資產、版本與臨床服務</text><text x="195" y="476">核准行動、接收者與保存期限</text></g><path d="M195 535V580" stroke="#57f0c1" stroke-width="7"/><path d="M183 568L195 585L207 568" fill="#57f0c1"/><rect x="30" y="590" width="330" height="130" rx="22" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="195" y="628" text-anchor="middle" fill="#57f0c1" font-size="21" font-weight="700">院內行動與回饋</text><g fill="#d9fff3" font-size="17" text-anchor="middle"><text x="195" y="665">偵測、阻擋、修補、臨床分級</text><text x="195" y="695">回報結果、誤報與新證據</text></g><text x="195" y="746" text-anchor="middle" fill="#ffcf99" font-size="15">每筆情資都要能追溯決策與結果</text></g></svg>