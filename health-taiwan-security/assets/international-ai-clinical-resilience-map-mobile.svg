<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧臨床韌性架構手機版</title><desc id="desc">由資料與介接、人工智慧觸點、臨床決策到服務持續運作的垂直架構，底部列出清冊、監測、降級和復原控制。</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10244a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72ddff"/></marker></defs><rect width="390" height="760" rx="24" fill="url(#b)"/><g font-family="Noto Sans TC, sans-serif"><text x="24" y="42" fill="#fff" font-size="22" font-weight="800">AI 臨床韌性責任鏈</text><text x="24" y="70" fill="#abc0df" font-size="15">依賴可監測、可降級、可回退</text><g text-anchor="middle"><rect x="45" y="100" width="300" height="82" rx="18" fill="#123352" stroke="#49d9ff" stroke-width="2"/><text x="195" y="132" fill="#7eeaff" font-size="19" font-weight="800">資料與介接</text><text x="195" y="159" fill="#dbe8f7" font-size="15">來源完整性・FHIR・影像・設備訊號</text><path d="M195 184V213" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="45" y="220" width="300" height="92" rx="18" fill="#315ca0" stroke="#9b8cff" stroke-width="2"/><text x="195" y="255" fill="#fff" font-size="20" font-weight="900">AI 服務觸點</text><text x="195" y="283" fill="#eef4ff" font-size="15">模型・雲端 API・代理工具・版本</text><path d="M195 314V343" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="45" y="350" width="300" height="82" rx="18" fill="#1b3155" stroke="#a493ff" stroke-width="2"/><text x="195" y="382" fill="#c9bfff" font-size="19" font-weight="800">臨床決策與服務</text><text x="195" y="409" fill="#dbe8f7" font-size="15">人工覆核・病人安全・持續運作</text></g><text x="24" y="478" fill="#fff" font-size="20" font-weight="800">醫院韌性控制面</text><g><rect x="24" y="500" width="164" height="88" rx="16" fill="#14385a"/><text x="106" y="532" text-anchor="middle" fill="#7fe7ff" font-size="17" font-weight="800">觸點清冊</text><text x="106" y="558" text-anchor="middle" fill="#d5e3f5" font-size="14">用途・責任・依賴</text><rect x="202" y="500" width="164" height="88" rx="16" fill="#14385a"/><text x="284" y="532" text-anchor="middle" fill="#7fe7ff" font-size="17" font-weight="800">連續監測</text><text x="284" y="558" text-anchor="middle" fill="#d5e3f5" font-size="14">漂移・異常・事件</text><rect x="24" y="602" width="164" height="88" rx="16" fill="#14385a"/><text x="106" y="634" text-anchor="middle" fill="#7fe7ff" font-size="17" font-weight="800">降級劇本</text><text x="106" y="660" text-anchor="middle" fill="#d5e3f5" font-size="14">人工・停用・替代</text><rect x="202" y="602" width="164" height="88" rx="16" fill="#14385a"/><text x="284" y="634" text-anchor="middle" fill="#7fe7ff" font-size="17" font-weight="800">復原證據</text><text x="284" y="660" text-anchor="middle" fill="#d5e3f5" font-size="14">回退・重驗・接受</text></g><text x="195" y="726" text-anchor="middle" fill="#9eb5d5" font-size="14">任一層失效，都要保留安全替代路徑</text></g></svg>