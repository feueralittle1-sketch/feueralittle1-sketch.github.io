<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">遠端技術人員風險、控制與證據對照</title><desc id="desc">代理面談、惡意技術測試、未受管裝置及離職殘留權限等風險，分別對應交叉核驗、隔離沙箱、裝置綁定與自動撤權證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">控制要能留下「此人、此裝置、此工作」一致的證據</text><text x="58" y="108" fill="#a9bfdf" font-size="20">單點驗證容易被代理、遠端桌面或共用帳號繞過，應以多層訊號交叉確認</text>
<text x="125" y="166" fill="#ff9fc1" font-size="22" font-weight="700">失敗模式</text><text x="510" y="166" fill="#69e7ff" font-size="22" font-weight="700">控制</text><text x="910" y="166" fill="#7ff3cf" font-size="22" font-weight="700">驗收證據</text>
<g><rect x="55" y="190" width="300" height="105" rx="20" fill="#2b1933" stroke="#ff7da9"/><text x="80" y="230" fill="#ffd5e3" font-size="20" font-weight="700">代理面談或身分借用</text><text x="80" y="266" fill="#e5eefb" font-size="17">面試者、受雇者與操作者不同</text><rect x="425" y="190" width="330" height="105" rx="20" fill="#0d2942" stroke="#69e7ff"/><text x="450" y="230" fill="#bfefff" font-size="20" font-weight="700">獨立聯絡與週期性再驗證</text><text x="450" y="266" fill="#e5eefb" font-size="17">職務、地點、付款與裝置交叉核對</text><rect x="825" y="190" width="320" height="105" rx="20" fill="#103228" stroke="#5aefbe"/><text x="850" y="230" fill="#b8ffe8" font-size="20" font-weight="700">核驗紀錄與異常處置單</text><text x="850" y="266" fill="#e5eefb" font-size="17">不一致項目、複核人與結論</text></g>
<g><rect x="55" y="320" width="300" height="105" rx="20" fill="#2b1933" stroke="#ff7da9"/><text x="80" y="360" fill="#ffd5e3" font-size="20" font-weight="700">技術測試夾帶惡意程式</text><text x="80" y="396" fill="#e5eefb" font-size="17">竊取秘密或建立持久存取</text><rect x="425" y="320" width="330" height="105" rx="20" fill="#0d2942" stroke="#69e7ff"/><text x="450" y="360" fill="#bfefff" font-size="20" font-weight="700">可重建沙箱與出站限制</text><text x="450" y="396" fill="#e5eefb" font-size="17">合成資料、短效憑證、禁止正式連線</text><rect x="825" y="320" width="320" height="105" rx="20" fill="#103228" stroke="#5aefbe"/><text x="850" y="360" fill="#b8ffe8" font-size="20" font-weight="700">映像雜湊與網路事件</text><text x="850" y="396" fill="#e5eefb" font-size="17">檔案、程序、DNS 與外連紀錄</text></g>
<g><rect x="55" y="450" width="300" height="105" rx="20" fill="#2b1933" stroke="#ff7da9"/><text x="80" y="490" fill="#ffd5e3" font-size="20" font-weight="700">個人裝置或未核准遠端桌面</text><text x="80" y="526" fill="#e5eefb" font-size="17">裝置實際操作者與地點不明</text><rect x="425" y="450" width="330" height="105" rx="20" fill="#0d2942" stroke="#69e7ff"/><text x="450" y="490" fill="#bfefff" font-size="20" font-weight="700">受管裝置、裝置綁定與強驗證</text><text x="450" y="526" fill="#e5eefb" font-size="17">禁止未核准代理與共享會話</text><rect x="825" y="450" width="320" height="105" rx="20" fill="#103228" stroke="#5aefbe"/><text x="850" y="490" fill="#b8ffe8" font-size="20" font-weight="700">裝置姿態與會話軌跡</text><text x="850" y="526" fill="#e5eefb" font-size="17">裝置 ID、來源、MFA 與工作紀錄</text></g>
<g><rect x="55" y="580" width="300" height="85" rx="20" fill="#2b1933" stroke="#ff7da9"/><text x="80" y="632" fill="#ffd5e3" font-size="20" font-weight="700">契約終止後權限仍存</text><rect x="425" y="580" width="330" height="85" rx="20" fill="#0d2942" stroke="#69e7ff"/><text x="450" y="632" fill="#bfefff" font-size="20" font-weight="700">人資事件驅動自動撤權</text><rect x="825" y="580" width="320" height="85" rx="20" fill="#103228" stroke="#5aefbe"/><text x="850" y="632" fill="#b8ffe8" font-size="20" font-weight="700">撤權時間與設備回收證明</text></g></g></svg>