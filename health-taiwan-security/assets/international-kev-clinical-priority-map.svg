<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">已知遭利用漏洞的醫療修補優先序</title><desc id="desc">將 CISA 已知遭利用漏洞訊號、設備暴露、臨床影響與可用替代措施合併，形成醫療機構的修補優先序。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172653"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#70e7ff"/></marker></defs>
<rect width="1200" height="760" rx="32" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="800">修補優先序不是只看 CVSS：加入已遭利用與臨床情境</text><text x="60" y="112" fill="#a8bad8" font-size="20">同一 CVE 在不同醫院、設備用途與網路位置，處置順序可能不同</text>
<rect x="55" y="180" width="245" height="180" rx="26" fill="#102b48" stroke="#63e6ff" stroke-width="2"/><text x="177" y="228" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">威脅訊號</text><text x="177" y="272" text-anchor="middle" fill="#c8d8ed" font-size="19">KEV・勒索活動</text><text x="177" y="307" text-anchor="middle" fill="#72f0c5" font-size="18">已知遭利用</text><text x="177" y="337" text-anchor="middle" fill="#72f0c5" font-size="18">供應商安全通知</text>
<rect x="345" y="180" width="245" height="180" rx="26" fill="#102b48" stroke="#9c8cff" stroke-width="2"/><text x="467" y="228" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">暴露情境</text><text x="467" y="272" text-anchor="middle" fill="#c8d8ed" font-size="19">對外服務・遠端維運</text><text x="467" y="307" text-anchor="middle" fill="#d7cfff" font-size="18">資產版本可確認</text><text x="467" y="337" text-anchor="middle" fill="#d7cfff" font-size="18">攻擊路徑可達</text>
<rect x="635" y="180" width="245" height="180" rx="26" fill="#102b48" stroke="#ff9cab" stroke-width="2"/><text x="757" y="228" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">臨床影響</text><text x="757" y="272" text-anchor="middle" fill="#c8d8ed" font-size="19">診療延誤・資料完整性</text><text x="757" y="307" text-anchor="middle" fill="#ffb2bd" font-size="18">替代流程成熟度</text><text x="757" y="337" text-anchor="middle" fill="#ffb2bd" font-size="18">停機可承受時間</text>
<rect x="925" y="180" width="220" height="180" rx="26" fill="#102b48" stroke="#ffd277" stroke-width="2"/><text x="1035" y="228" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">處置可行性</text><text x="1035" y="272" text-anchor="middle" fill="#c8d8ed" font-size="19">補丁・隔離・監測</text><text x="1035" y="307" text-anchor="middle" fill="#ffe2a3" font-size="18">回復方案</text><text x="1035" y="337" text-anchor="middle" fill="#ffe2a3" font-size="18">供應商支援</text>
<path d="M300 270h35" stroke="#70e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M590 270h35" stroke="#70e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M880 270h35" stroke="#70e7ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="155" y="475" width="890" height="150" rx="30" fill="#142846" stroke="#63e6ff" stroke-width="3"/><text x="600" y="525" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">風險決策單：立即修補／先隔離／加強監測／限期例外</text><text x="600" y="570" text-anchor="middle" fill="#c8d8ed" font-size="20">記錄責任人、完成期限、臨床窗口、回復條件與驗證證據</text><text x="600" y="605" text-anchor="middle" fill="#72f0c5" font-size="18">KEV 提高威脅可信度，但不取代資產、臨床與變更風險判定</text>
<text x="60" y="700" fill="#9fb3d9" font-size="18">輸出證據：受影響資產清單、版本判定、風險分級、核准紀錄、部署結果、例外到期日</text></g></svg>