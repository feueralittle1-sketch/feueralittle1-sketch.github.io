<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧事件雙軌分類手機圖</title><desc id="desc">人工智慧遭攻擊與人工智慧造成傷害兩類訊號，進入共同事件指揮並形成臨床與技術處置。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient></defs><rect width="800" height="1080" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="400" y="65" fill="#fff" text-anchor="middle" font-size="31" font-weight="700">醫療 AI 事件先分型，再聯合處置</text><rect x="60" y="110" width="680" height="250" rx="28" fill="#10243e" stroke="#63e6ff" stroke-width="2"/><text x="400" y="158" fill="#63e6ff" text-anchor="middle" font-size="25" font-weight="700">AI 系統遭受攻擊</text><g fill="#dcecff" font-size="21"><text x="110" y="213">提示注入／資料外洩</text><text x="430" y="213">模型或資料竄改</text><text x="110" y="263">工具憑證濫用</text><text x="430" y="263">代理與供應鏈劫持</text></g><text x="400" y="318" fill="#b9d9ff" text-anchor="middle" font-size="19">機密性、完整性、可用性</text><path d="M400 370V420" stroke="#63e6ff" stroke-width="5"/>
<rect x="60" y="425" width="680" height="330" rx="30" fill="#12343b" stroke="#57f0c1" stroke-width="3"/><text x="400" y="477" fill="#57f0c1" text-anchor="middle" font-size="27" font-weight="700">共同事件指揮</text><g fill="#eafff8" font-size="21"><text x="140" y="535">1. 臨床影響分級</text><text x="140" y="580">2. 安全與資安聯合定界</text><text x="140" y="625">3. 權限範圍式隔離</text><text x="140" y="670">4. 降級、停用或回退</text><text x="140" y="715">5. 證據保存與受控恢復</text></g><path d="M400 765V815" stroke="#a997ff" stroke-width="5"/>
<rect x="60" y="820" width="680" height="200" rx="28" fill="#2b1f46" stroke="#a997ff" stroke-width="2"/><text x="400" y="868" fill="#c7baff" text-anchor="middle" font-size="25" font-weight="700">AI 系統造成傷害</text><g fill="#f1ebff" font-size="20"><text x="105" y="925">臨床錯誤／幻覺</text><text x="410" y="925">自主工具執行錯誤</text><text x="105" y="970">過度依賴／誤用</text><text x="410" y="970">漂移與異常輸出</text></g><text x="400" y="1050" fill="#9fb3d9" text-anchor="middle" font-size="18">無入侵跡象，也可能需要停用與臨床處置。</text></g></svg>