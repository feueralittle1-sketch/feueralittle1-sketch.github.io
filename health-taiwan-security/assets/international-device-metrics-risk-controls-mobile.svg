<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1180" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安指標風險與控制</title><desc id="desc">四種指標陷阱與對應控制的手機版圖解。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient></defs><rect width="390" height="1180" rx="28" fill="url(#bg)"/><text x="195" y="46" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">指標陷阱 → 對應控制</text><g font-family="Inter,Noto Sans TC,sans-serif"><g fill="#3a1722" stroke="#fb7185" stroke-width="2"><rect x="25" y="82" width="340" height="110" rx="20"/><rect x="25" y="358" width="340" height="110" rx="20"/><rect x="25" y="634" width="340" height="110" rx="20"/><rect x="25" y="910" width="340" height="110" rx="20"/></g><g fill="#102742" stroke="#5eead4" stroke-width="2"><rect x="25" y="218" width="340" height="110" rx="20"/><rect x="25" y="494" width="340" height="110" rx="20"/><rect x="25" y="770" width="340" height="110" rx="20"/><rect x="25" y="1046" width="340" height="110" rx="20"/></g><g fill="#f4f8ff" font-size="22" font-weight="800"><text x="48" y="128">陷阱：分母漂移</text><text x="48" y="264">控制：固定口徑與快照</text><text x="48" y="404">陷阱：平均值掩蓋長尾</text><text x="48" y="540">控制：分布與逾期件</text><text x="48" y="680">陷阱：無遙測＝無事件</text><text x="48" y="816">控制：揭露未知與盲區</text><text x="48" y="956">陷阱：為達標跳過驗證</text><text x="48" y="1092">控制：實機與臨床回歸</text></g><g fill="#c6d4eb" font-size="18"><text x="48" y="163">覆蓋率因資產增減失真</text><text x="48" y="299">保留版本、院區、排除清單</text><text x="48" y="439">高風險尾端被平均</text><text x="48" y="575">獨立呈現高關鍵設備</text><text x="48" y="715">觀測缺口被誤寫成安全</text><text x="48" y="851">缺資料列入治理風險</text><text x="48" y="991">工單關閉但控制未證實</text><text x="48" y="1127">以效果證據完成結案</text></g></g></svg>