<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備安全架構追蹤與控制圖</title><desc id="desc">四種架構文件失真風險與相對應的證據控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">架構文件失真與關閉證據</text><text x="38" y="96" fill="#9fb7d5" font-size="18">重點是圖面是否仍代表實際設備</text><rect x="48" y="135" width="624" height="372" rx="24" fill="#3d2438" stroke="#ff8fc8" stroke-width="2"/><text x="80" y="181" fill="#ff9fd0" font-size="24" font-weight="800">失真風險</text><g fill="#f7d9e9" font-size="18"><text x="80" y="237">① 圖面落後韌體或雲端版本</text><text x="80" y="303">② 維護、遙測、更新介面漏列</text><text x="80" y="369">③ 驗證與降級假設未經測試</text><text x="80" y="435">④ 缺口沒有責任人與期限</text></g><path d="M360 507v52" stroke="#8fe8ff" stroke-width="5"/><rect x="48" y="559" width="624" height="372" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="80" y="605" fill="#72f5cd" font-size="24" font-weight="800">關閉證據</text><g fill="#ddfff4" font-size="18"><text x="80" y="661">① 型號、版本、雜湊與觸發基線</text><text x="80" y="727">② 通訊矩陣、方向、資料與日誌</text><text x="80" y="793">③ 負向測試、斷線、逾時與回退</text><text x="80" y="859">④ 補償控制、核准者與重驗日</text></g><rect x="48" y="971" width="624" height="70" rx="20" fill="#112e4d"/><text x="360" y="1000" text-anchor="middle" fill="#8fe8ff" font-size="17" font-weight="800">更新、介面或部署邊界變更</text><text x="360" y="1026" text-anchor="middle" fill="#e6eefc" font-size="16">應觸發圖面與測試同步重驗</text></g></svg>