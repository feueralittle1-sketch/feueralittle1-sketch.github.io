<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">網路存取控制平台隔離與可信重建流程</title><desc id="desc">從範圍確認、管理面隔離與主機外證據保全，經臨床連線保護、修補或重建、憑證輪替到分批驗收。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11274a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">先保住連線與證據，再恢復政策決策的可信度</text><text x="58" y="108" fill="#a9bfdf" font-size="20">高權限平台出現利用跡象時，單純套用更新不足以證明節點仍可信</text>
<g text-anchor="middle"><rect x="55" y="175" width="190" height="135" rx="22" fill="#132b50" stroke="#8fa8ff" stroke-width="3"/><text x="150" y="226" fill="#c6d1ff" font-size="21" font-weight="700">1 確認範圍</text><text x="150" y="265" fill="#dce8f8" font-size="17">版本、節點、曝險入口</text>
<rect x="285" y="175" width="190" height="135" rx="22" fill="#132b50" stroke="#ff7da9" stroke-width="3"/><text x="380" y="226" fill="#ff9fc1" font-size="21" font-weight="700">2 隔離管理面</text><text x="380" y="265" fill="#dce8f8" font-size="17">限制 API 與管理來源</text>
<rect x="515" y="175" width="190" height="135" rx="22" fill="#132b50" stroke="#ffbd69" stroke-width="3"/><text x="610" y="226" fill="#ffcf8c" font-size="21" font-weight="700">3 保全證據</text><text x="610" y="265" fill="#dce8f8" font-size="17">逐節點與主機外日誌</text>
<rect x="745" y="175" width="190" height="135" rx="22" fill="#132b50" stroke="#5aefbe" stroke-width="3"/><text x="840" y="226" fill="#7ff3cf" font-size="21" font-weight="700">4 保護臨床</text><text x="840" y="265" fill="#dce8f8" font-size="17">凍結高風險政策變更</text>
<rect x="975" y="175" width="170" height="135" rx="22" fill="#132b50" stroke="#69e7ff" stroke-width="3"/><text x="1060" y="226" fill="#69e7ff" font-size="21" font-weight="700">5 修補分流</text><text x="1060" y="265" fill="#dce8f8" font-size="17">乾淨更新或重建</text></g>
<g stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"><path d="M245 242H275"/><path d="M475 242H505"/><path d="M705 242H735"/><path d="M935 242H965"/></g>
<rect x="95" y="425" width="300" height="155" rx="24" fill="#0c203b" stroke="#69e7ff" stroke-width="3"/><text x="245" y="475" text-anchor="middle" fill="#69e7ff" font-size="23" font-weight="700">秘密與信任輪替</text><text x="245" y="517" text-anchor="middle" fill="#dce8f8" font-size="19">管理帳號、API 金鑰、憑證</text><text x="245" y="551" text-anchor="middle" fill="#a9bfdf" font-size="17">撤銷未知或舊有存取</text>
<rect x="450" y="425" width="300" height="155" rx="24" fill="#0c203b" stroke="#5aefbe" stroke-width="3"/><text x="600" y="475" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">政策與節點驗證</text><text x="600" y="517" text-anchor="middle" fill="#dce8f8" font-size="19">規則差異、複寫、日誌完整</text><text x="600" y="551" text-anchor="middle" fill="#a9bfdf" font-size="17">禁止把備份直接視為可信</text>
<rect x="805" y="425" width="300" height="155" rx="24" fill="#0c203b" stroke="#ffbd69" stroke-width="3"/><text x="955" y="475" text-anchor="middle" fill="#ffcf8c" font-size="23" font-weight="700">分批恢復與臨床驗收</text><text x="955" y="517" text-anchor="middle" fill="#dce8f8" font-size="19">人員、設備、訪客、廠商</text><text x="955" y="551" text-anchor="middle" fill="#a9bfdf" font-size="17">允許、拒絕、隔離皆須測試</text>
<path d="M1060 320V370H245V415" fill="none" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M395 502H440" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M750 502H795" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/>
<rect x="240" y="625" width="720" height="50" rx="18" fill="#331e35" stroke="#ff7da9"/><text x="600" y="658" text-anchor="middle" fill="#ffd5e3" font-size="19">停止條件：異常政策、未知帳號、外連或節點差異未釐清，不得擴大恢復</text></g></svg>
