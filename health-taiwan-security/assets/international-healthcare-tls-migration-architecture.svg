<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療 TLS 遷移架構</title><desc id="desc">病人入口、臨床介接、醫療設備與供應商通道經協定盤點、分流閘門與受控相容區，逐步遷移到現代 TLS 基線。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#172657"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0V6L9 3z" fill="#63e6ff"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".24"/></filter></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="55" y="68" fill="#fff" font-size="34" font-weight="800">TLS 遷移要保護傳輸，也要保住臨床連線</text><text x="55" y="105" fill="#afc3e2" font-size="20">先看見每一條協定依賴，再分流升級、隔離與退場</text><text x="55" y="158" fill="#63e6ff" font-size="18" font-weight="700">醫療連線來源</text><g filter="url(#s)"><rect x="45" y="180" width="245" height="78" rx="18" fill="#102b47" stroke="#63e6ff"/><text x="70" y="213" fill="#fff" font-size="22" font-weight="700">病人入口與 App</text><text x="70" y="240" fill="#bed0e9" font-size="16">瀏覽器、API、身分服務</text><rect x="45" y="278" width="245" height="78" rx="18" fill="#102b47" stroke="#82a9ff"/><text x="70" y="311" fill="#fff" font-size="22" font-weight="700">臨床介接與影像</text><text x="70" y="338" fill="#bed0e9" font-size="16">HL7、FHIR、DICOM 閘道</text><rect x="45" y="376" width="245" height="78" rx="18" fill="#102b47" stroke="#c99cff"/><text x="70" y="409" fill="#fff" font-size="22" font-weight="700">醫療設備與舊系統</text><text x="70" y="436" fill="#bed0e9" font-size="16">固定韌體、舊加密套件</text><rect x="45" y="474" width="245" height="78" rx="18" fill="#102b47" stroke="#57f0c1"/><text x="70" y="507" fill="#fff" font-size="22" font-weight="700">供應商維運通道</text><text x="70" y="534" fill="#bed0e9" font-size="16">遠端支援、雲端相依</text></g><path d="M305 365H370" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="390" y="175" width="330" height="382" rx="28" fill="#0d2038" stroke="#55779d"/><text x="425" y="221" fill="#fff" font-size="27" font-weight="800">協定治理閘門</text><g fill="#c8d8eb" font-size="19"><text x="425" y="270">01　端點、埠與實際握手版本</text><text x="425" y="318">02　憑證、金鑰與密碼套件</text><text x="425" y="366">03　臨床用途與中斷容忍度</text><text x="425" y="414">04　設備支援與供應商期限</text><text x="425" y="462">05　失敗時回退與監測證據</text><text x="425" y="510">06　例外到期與退場責任</text></g><path d="M735 365H800" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="820" y="180" width="335" height="115" rx="22" fill="#113d49" stroke="#57f0c1"/><text x="850" y="222" fill="#fff" font-size="24" font-weight="800">現代 TLS 區</text><text x="850" y="255" fill="#c7f9ea" font-size="18">優先 TLS 1.3；受控支援 TLS 1.2</text><rect x="820" y="320" width="335" height="115" rx="22" fill="#3a284c" stroke="#c99cff"/><text x="850" y="362" fill="#fff" font-size="24" font-weight="800">受控相容區</text><text x="850" y="395" fill="#ead8f7" font-size="18">隔離代理、最小路徑、期限與告警</text><rect x="820" y="460" width="335" height="115" rx="22" fill="#442938" stroke="#ff8fab"/><text x="850" y="502" fill="#fff" font-size="24" font-weight="800">替換或退場</text><text x="850" y="535" fill="#ffd6e2" font-size="18">無法安全升級且風險不可接受</text></g><rect x="45" y="608" width="1110" height="38" rx="19" fill="#0a1b30" stroke="#294a6f"/><text x="600" y="634" text-anchor="middle" fill="#a8c5e8" font-size="17">獨立證據面：握手遙測｜相容測試｜臨床回歸｜例外清冊｜退場里程碑</text></g></svg>