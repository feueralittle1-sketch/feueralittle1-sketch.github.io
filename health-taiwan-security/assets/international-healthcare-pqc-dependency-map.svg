<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療服務的後量子密碼依賴地圖</title>
  <desc id="desc">電子病歷、影像封存、醫療設備與第三方服務透過憑證、金鑰交換、數位簽章及身分信任連結，形成後量子遷移需要盤點的依賴。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17234b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="68" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">先找出密碼依賴，再決定遷移順序</text><text x="600" y="106" text-anchor="middle" fill="#9fb3d9" font-size="20">系統清冊不等於密碼清冊；還要追蹤協定、憑證、金鑰、模組與供應商</text>
  <g fill="#102c4b" stroke="#4f7fab" stroke-width="2"><rect x="55" y="165" width="250" height="96" rx="20"/><rect x="55" y="286" width="250" height="96" rx="20"/><rect x="55" y="407" width="250" height="96" rx="20"/><rect x="55" y="528" width="250" height="96" rx="20"/></g><g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="180" y="207">電子病歷／檢驗</text><text x="180" y="328">影像封存／交換</text><text x="180" y="449">醫療設備／IoMT</text><text x="180" y="570">雲端／第三方服務</text></g><g fill="#a9bad4" font-size="17" text-anchor="middle"><text x="180" y="235">TLS・身分聯邦・簽章</text><text x="180" y="356">傳輸加密・長期保存</text><text x="180" y="477">韌體簽章・設備憑證</text><text x="180" y="598">API・VPN・遠端維運</text></g>
  <g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M305 213H430"/><path d="M305 334H430"/><path d="M305 455H430"/><path d="M305 576H430"/></g><rect x="445" y="176" width="310" height="430" rx="30" fill="#102f54" stroke="#63e6ff" stroke-width="3"/><text x="600" y="222" text-anchor="middle" fill="#8fe8ff" font-size="27" font-weight="700">密碼依賴清冊</text><g fill="#163d67"><rect x="485" y="254" width="230" height="62" rx="15"/><rect x="485" y="337" width="230" height="62" rx="15"/><rect x="485" y="420" width="230" height="62" rx="15"/><rect x="485" y="503" width="230" height="62" rx="15"/></g><g fill="#e8f5ff" font-size="21" text-anchor="middle"><text x="600" y="292">演算法與協定版本</text><text x="600" y="375">憑證／金鑰／HSM</text><text x="600" y="458">資料保密與簽章壽命</text><text x="600" y="541">產品責任人與供應商</text></g>
  <path d="M755 390H855" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="870" y="218" width="275" height="345" rx="28" fill="#2a2852" stroke="#a997ff" stroke-width="3"/><text x="1008" y="265" text-anchor="middle" fill="#d8d0ff" font-size="27" font-weight="700">遷移優先序</text><g fill="#fff" font-size="21" text-anchor="middle"><text x="1008" y="320">① 資料價值與保存期</text><text x="1008" y="371">② 臨床中斷影響</text><text x="1008" y="422">③ 設備／協定可替換性</text><text x="1008" y="473">④ 供應商版本與時程</text></g><rect x="915" y="505" width="185" height="40" rx="20" fill="#185f61"/><text x="1008" y="531" text-anchor="middle" fill="#9ff9df" font-size="18" font-weight="700">風險與工期共同排序</text><text x="58" y="675" fill="#8ba4c7" font-size="18">輸出證據：資產、資料流、密碼用途、演算法、責任人、供應商依賴、可替代方案與目標批次</text></g>
</svg>
