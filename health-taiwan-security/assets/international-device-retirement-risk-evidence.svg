<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療設備退役風險與驗收證據</title>
<desc id="desc">將資料殘留、雲端連線、錯誤清除、外包失控與臨床中斷，對應到控制與驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#151d3f"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/>
<text x="65" y="78" fill="#fff" font-size="38" font-weight="800">退役驗收看三件事：風險被控制、結果可驗證、責任可追溯</text><text x="65" y="116" fill="#9fb3d9" font-size="20">僅有「已格式化」或回收商收據，無法證明醫療資料與信任關係已被移除</text>
<g font-family="Noto Sans TC, sans-serif"><text x="80" y="180" fill="#ff9fcf" font-size="22" font-weight="800">失敗模式</text><text x="455" y="180" fill="#8fe8ff" font-size="22" font-weight="800">必要控制</text><text x="840" y="180" fill="#7ff1c5" font-size="22" font-weight="800">驗收證據</text>
<g font-size="18"><rect x="65" y="205" width="1070" height="90" rx="20" fill="#151f37" stroke="#344861"/><text x="85" y="242" fill="#fff" font-weight="700">本機或可移除媒體仍有病人資料</text><text x="455" y="242" fill="#c6d4eb">逐媒體選擇 Clear／Purge／Destroy</text><text x="840" y="242" fill="#c6d4eb">序號、方法、工具結果、抽驗紀錄</text><text x="85" y="272" fill="#ffb9da">外流與隱私事件</text><text x="455" y="272" fill="#8fe8ff">不可只靠刪檔或快速格式化</text><text x="840" y="272" fill="#7ff1c5">驗證人與放行簽核</text>
<rect x="65" y="310" width="1070" height="90" rx="20" fill="#151f37" stroke="#344861"/><text x="85" y="347" fill="#fff" font-weight="700">設備已搬走，雲端與遠端帳號仍有效</text><text x="455" y="347" fill="#c6d4eb">撤銷帳號、憑證、API 與遠端維護</text><text x="840" y="347" fill="#c6d4eb">撤銷日誌、CMDB 狀態、連線測試</text><text x="85" y="377" fill="#ffb9da">未授權回連院內系統</text><text x="455" y="377" fill="#8fe8ff">從網路與監控清冊同步除役</text><text x="840" y="377" fill="#7ff1c5">無法重新登入或建立通道</text>
<rect x="65" y="415" width="1070" height="90" rx="20" fill="#151f37" stroke="#344861"/><text x="85" y="452" fill="#fff" font-weight="700">清除方法不適合快閃記憶體或封裝媒體</text><text x="455" y="452" fill="#c6d4eb">依媒體技術與後續用途調整方法</text><text x="840" y="452" fill="#c6d4eb">設備型號、媒體類型、方法依據</text><text x="85" y="482" fill="#ffb9da">表面成功但資料仍可復原</text><text x="455" y="482" fill="#8fe8ff">不確定時升級為更強處置</text><text x="840" y="482" fill="#7ff1c5">錯誤處理與再執行紀錄</text>
<rect x="65" y="520" width="1070" height="90" rx="20" fill="#151f37" stroke="#344861"/><text x="85" y="557" fill="#fff" font-weight="700">外包回收或維修過程失去保管鏈</text><text x="455" y="557" fill="#c6d4eb">先清除再外移；例外採封條與交接</text><text x="840" y="557" fill="#c6d4eb">交接人、時間、數量、去向與證明</text><text x="85" y="587" fill="#ffb9da">資產或資料去向不可追溯</text><text x="455" y="587" fill="#8fe8ff">契約明定次承攬與事件通知</text><text x="840" y="587" fill="#7ff1c5">抽查與供應商稽核結果</text>
<rect x="65" y="625" width="1070" height="80" rx="20" fill="#151f37" stroke="#344861"/><text x="85" y="662" fill="#fff" font-weight="700">先拆除設備才發現臨床依賴</text><text x="455" y="662" fill="#c6d4eb">先驗收替代流程與回退方案</text><text x="840" y="662" fill="#c6d4eb">停用窗口、使用單位簽核、回退演練</text><text x="85" y="690" fill="#ffb9da">服務中斷或病人安全風險</text><text x="455" y="690" fill="#8fe8ff">臨床、資訊與設備工程共同決策</text></g></g></svg>