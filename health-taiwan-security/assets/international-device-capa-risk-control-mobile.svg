<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1650" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安 CAPA 風險與控制對照手機版</title><desc id="desc">四張卡片說明定界遺漏、缺少臨床回歸、過早結案與院端未落地的風險及控制。</desc><rect width="1200" height="1650" fill="#07111f"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="600" y="88" text-anchor="middle" fill="#fff" font-size="42" font-weight="700">CAPA 四種常見失敗</text><g font-size="28"><g transform="translate(100 150)"><rect width="1000" height="310" rx="32" fill="#10223b" stroke="#ff8f8f" stroke-width="3"/><text x="55" y="70" fill="#ffaaaa" font-weight="700">01 未定界全部場域</text><text x="55" y="125" fill="#fff">只修單一版本，同型設備仍暴露</text><text x="55" y="205" fill="#57f0c1">控制：資產與版本交叉核對</text><text x="55" y="260" fill="#dffff4">證據：受影響清單與零遺漏簽核</text></g><g transform="translate(100 500)"><rect width="1000" height="310" rx="32" fill="#10223b" stroke="#ff8f8f" stroke-width="3"/><text x="55" y="70" fill="#ffaaaa" font-weight="700">02 缺少臨床回歸</text><text x="55" y="125" fill="#fff">安全更新可能造成服務中斷</text><text x="55" y="205" fill="#57f0c1">控制：資安與醫療品質共同放行</text><text x="55" y="260" fill="#dffff4">證據：測試結果與回退演練</text></g><g transform="translate(100 850)"><rect width="1000" height="310" rx="32" fill="#10223b" stroke="#ff8f8f" stroke-width="3"/><text x="55" y="70" fill="#ffaaaa" font-weight="700">03 以發布修補直接結案</text><text x="55" y="125" fill="#fff">根因未消除，事件可能再次發生</text><text x="55" y="205" fill="#57f0c1">控制：獨立有效性驗證與觀察期</text><text x="55" y="260" fill="#dffff4">證據：複測、門檻與重開條件</text></g><g transform="translate(100 1200)"><rect width="1000" height="310" rx="32" fill="#10223b" stroke="#ff8f8f" stroke-width="3"/><text x="55" y="70" fill="#ffaaaa" font-weight="700">04 製造商結案、院端未落地</text><text x="55" y="125" fill="#fff">紙上關閉，現場風險仍未受控</text><text x="55" y="205" fill="#57f0c1">控制：雙向狀態與責任追蹤</text><text x="55" y="260" fill="#dffff4">證據：院端完成證明與例外期限</text></g></g><text x="600" y="1585" text-anchor="middle" fill="#9fb3d9" font-size="25">責任、期限、測試、臨床驗收與重開條件缺一不可。</text></g></svg>