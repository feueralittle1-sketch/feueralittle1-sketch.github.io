<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療網路分段與零信任導入流程</title><desc id="desc">由服務與流量盤點、風險分區、觀察模式、逐步強制到停機演練及持續調整的六階段流程。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#10234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#a997ff"/></marker></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/>
<g font-family="system-ui,Noto Sans TC"><text x="60" y="76" fill="#f8fafc" font-size="34" font-weight="700">先看得見臨床相依，再逐段強制</text><text x="60" y="115" fill="#9fb3d9" font-size="19">避免一次封鎖造成醫囑、影像、檢驗或設備維護中斷</text>
<g text-anchor="middle"><rect x="55" y="205" width="170" height="145" rx="22" fill="#0d3340" stroke="#63e6ff"/><text x="140" y="248" fill="#a5f3fc" font-size="21" font-weight="700">01 盤點</text><text x="140" y="285" fill="#e0f2fe" font-size="17">資產、服務</text><text x="140" y="315" fill="#9fb3d9" font-size="16">實際流量基線</text><rect x="240" y="205" width="170" height="145" rx="22" fill="#102f38" stroke="#57f0c1"/><text x="325" y="248" fill="#a7f3d0" font-size="21" font-weight="700">02 分區</text><text x="325" y="285" fill="#d1fae5" font-size="17">臨床重要性</text><text x="325" y="315" fill="#9fb3d9" font-size="16">資料與威脅面</text><rect x="425" y="205" width="170" height="145" rx="22" fill="#20254b" stroke="#a997ff"/><text x="510" y="248" fill="#ddd6fe" font-size="21" font-weight="700">03 觀察</text><text x="510" y="285" fill="#ede9fe" font-size="17">NAC／流量紀錄</text><text x="510" y="315" fill="#9fb3d9" font-size="16">先告警不阻斷</text><rect x="610" y="205" width="170" height="145" rx="22" fill="#26331c" stroke="#facc15"/><text x="695" y="248" fill="#fef08a" font-size="21" font-weight="700">04 強制</text><text x="695" y="285" fill="#fef9c3" font-size="17">一項服務一組</text><text x="695" y="315" fill="#9fb3d9" font-size="16">白名單與回復</text><rect x="795" y="205" width="170" height="145" rx="22" fill="#3b1625" stroke="#fb7185"/><text x="880" y="248" fill="#fecdd3" font-size="21" font-weight="700">05 演練</text><text x="880" y="285" fill="#ffe4e6" font-size="17">故障與停機</text><text x="880" y="315" fill="#9fb3d9" font-size="16">確認臨床降級</text><rect x="980" y="205" width="170" height="145" rx="22" fill="#12304d" stroke="#60a5fa"/><text x="1065" y="248" fill="#bfdbfe" font-size="21" font-weight="700">06 調整</text><text x="1065" y="285" fill="#dbeafe" font-size="17">例外到期</text><text x="1065" y="315" fill="#9fb3d9" font-size="16">指標與復盤</text></g>
<g stroke="#a997ff" stroke-width="4" marker-end="url(#a)"><path d="M225 278H232"/><path d="M410 278H417"/><path d="M595 278H602"/><path d="M780 278H787"/><path d="M965 278H972"/></g>
<rect x="120" y="445" width="960" height="115" rx="24" fill="#0b2238" stroke="#334e70"/><text x="160" y="490" fill="#f8fafc" font-size="22" font-weight="700">每階段共同驗收</text><text x="160" y="530" fill="#b8c8e6" font-size="18">已知服務成功率　｜　非必要東西向流量下降　｜　未識別設備數　｜　例外期限　｜　回復時間</text><text x="600" y="625" text-anchor="middle" fill="#9fb3d9" font-size="18">臨床服務擁有者、網路、資安、生醫與供應商共同簽核，不能只由防火牆規則數量結案</text></g></svg>
