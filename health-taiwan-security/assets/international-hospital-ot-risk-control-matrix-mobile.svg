<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1180" role="img" aria-labelledby="title desc"><title id="title">醫院設施 OT 風險與控制矩陣手機版</title><desc id="desc">五種失效模式及其控制與證據。</desc><rect width="600" height="1180" rx="32" fill="#09172b"/><text x="36" y="58" fill="#fff" font-size="27" font-weight="700">風險、控制、證據成套</text><text x="36" y="94" fill="#9fb3d9" font-size="17">設備在線不等於臨床服務安全</text><g font-family="sans-serif"><g transform="translate(35 135)"><rect width="530" height="180" rx="22" fill="#10223b" stroke="#63e6ff"/><text x="24" y="38" fill="#63e6ff" font-size="21" font-weight="700">未知資產或影子連線</text><text x="24" y="78" fill="#fff" font-size="18">控制｜被動發現、擁有者、位置比對</text><text x="24" y="118" fill="#9fdacb" font-size="18">證據｜清冊覆蓋率、孤兒資產關閉</text></g><g transform="translate(35 335)"><rect width="530" height="180" rx="22" fill="#132942" stroke="#9c8cff"/><text x="24" y="38" fill="#c6baff" font-size="21" font-weight="700">遠端維護遭濫用</text><text x="24" y="78" fill="#fff" font-size="18">控制｜限時授權、跳板、會話記錄</text><text x="24" y="118" fill="#9fdacb" font-size="18">證據｜工單、錄影、撤權與告警測試</text></g><g transform="translate(35 535)"><rect width="530" height="180" rx="22" fill="#10223b" stroke="#57f0c1"/><text x="24" y="38" fill="#57f0c1" font-size="21" font-weight="700">惡意或錯誤組態變更</text><text x="24" y="78" fill="#fff" font-size="18">控制｜雙人核准、基線備份、回退</text><text x="24" y="118" fill="#9fdacb" font-size="18">證據｜差異報告、回退時間、現場確認</text></g><g transform="translate(35 735)"><rect width="530" height="180" rx="22" fill="#132942" stroke="#ffb86b"/><text x="24" y="38" fill="#ffca8a" font-size="21" font-weight="700">控制器或管理站失效</text><text x="24" y="78" fill="#fff" font-size="18">控制｜安全狀態、手動操作、備援路徑</text><text x="24" y="118" fill="#9fdacb" font-size="18">證據｜切換演練、環境讀值、服務完成率</text></g><g transform="translate(35 935)"><rect width="530" height="180" rx="22" fill="#10223b" stroke="#ff7ad9"/><text x="24" y="38" fill="#ff9ee4" font-size="21" font-weight="700">不可信恢復或舊弱點回灌</text><text x="24" y="78" fill="#fff" font-size="18">控制｜乾淨映像、離線驗證、分區復原</text><text x="24" y="118" fill="#9fdacb" font-size="18">證據｜版本、雜湊、負向測試、臨床簽認</text></g></g></svg>