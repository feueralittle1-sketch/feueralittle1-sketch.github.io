<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療威脅情報常見失敗模式、控制與驗收證據對照圖</title>
  <desc id="desc">對照直接匯入指標、只看漏洞分數、缺少臨床驗證及規則老化四類風險，列出控制與驗收證據。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#172143"/></linearGradient></defs><rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">風險、控制與證據必須成對</text><text x="60" y="108" fill="#9fb3d9" font-size="19">沒有可重現測試與臨床情境，情報數量不等於防禦效果</text>
  <g font-family="sans-serif"><rect x="55" y="150" width="1090" height="70" rx="18" fill="#12233b"/><text x="95" y="194" fill="#ffb4c1" font-size="22" font-weight="700">失敗模式</text><text x="440" y="194" fill="#8ff5ff" font-size="22" font-weight="700">必要控制</text><text x="820" y="194" fill="#c7bfff" font-size="22" font-weight="700">驗收證據</text>
  <g font-size="18"><g><rect x="55" y="235" width="1090" height="90" rx="16" fill="#0e1d32"/><text x="95" y="275" fill="#ffd5dc">直接匯入大量 IOC</text><text x="95" y="302" fill="#9fb3d9">誤報淹沒值班人員</text><text x="440" y="285" fill="#d9fbff">來源、時效、資產情境與抑制條件</text><text x="820" y="285" fill="#eeeaff">命中率、誤報率、處置時間</text></g><g><rect x="55" y="340" width="1090" height="90" rx="16" fill="#0e1d32"/><text x="95" y="380" fill="#ffd5dc">只依 CVSS 排序</text><text x="95" y="407" fill="#9fb3d9">忽略實際暴露與病安影響</text><text x="440" y="390" fill="#d9fbff">主動利用、可達性、臨床關鍵性合併</text><text x="820" y="390" fill="#eeeaff">逐台資產決策與例外期限</text></g><g><rect x="55" y="445" width="1090" height="90" rx="16" fill="#0e1d32"/><text x="95" y="485" fill="#ffd5dc">規則未經臨床驗證</text><text x="95" y="512" fill="#9fb3d9">阻斷正常照護或造成盲點</text><text x="440" y="495" fill="#d9fbff">隔離測試、分批部署、回退條件</text><text x="820" y="495" fill="#eeeaff">測試紀錄、臨床簽核、回退演練</text></g><g><rect x="55" y="550" width="1090" height="90" rx="16" fill="#0e1d32"/><text x="95" y="590" fill="#ffd5dc">規則與情報長期不退場</text><text x="95" y="617" fill="#9fb3d9">查詢成本上升、效果失真</text><text x="440" y="600" fill="#d9fbff">版本、擁有者、失效日期與複測週期</text><text x="820" y="600" fill="#eeeaff">最後命中、覆蓋缺口、停用決策</text></g></g></g>
</svg>