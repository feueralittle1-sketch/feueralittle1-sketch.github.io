<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療釣魚事件的整改證據架構</title>
<desc id="desc">從釣魚郵件、帳號接管與資料存取事件，連結到風險分析、身分控制、郵件防護、監測與獨立驗證證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071626"/><stop offset="1" stop-color="#122047"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="78" fill="#fff" font-size="38" font-weight="800">整改不是列出措施，而是證明風險已被控制</text><text x="70" y="116" fill="#9fb3d9" font-size="20">事件事實、控制變更與驗證結果必須形成可追溯鏈</text>
<rect x="70" y="175" width="260" height="190" rx="26" fill="#3a1730" stroke="#ff8fb8" stroke-width="2"/><text x="100" y="222" fill="#ffb1cc" font-size="22" font-weight="700">事件入口</text><text x="100" y="270" fill="#fff" font-size="25" font-weight="800">釣魚郵件</text><text x="100" y="310" fill="#fff" font-size="20">帳號接管・工作階段濫用</text><text x="100" y="342" fill="#c6d4eb" font-size="18">未授權資料存取與外傳</text>
<rect x="470" y="155" width="260" height="230" rx="30" fill="#182c55" stroke="#a997ff" stroke-width="3"/><text x="505" y="205" fill="#d9d1ff" font-size="22" font-weight="700">整改治理閘門</text><text x="505" y="255" fill="#fff" font-size="23" font-weight="800">界定事實與範圍</text><text x="505" y="296" fill="#fff" font-size="23" font-weight="800">更新風險分析</text><text x="505" y="337" fill="#fff" font-size="23" font-weight="800">設計控制與驗收</text><text x="505" y="370" fill="#b9c8e5" font-size="17">臨床、隱私、法務、資安共同決策</text>
<rect x="870" y="175" width="260" height="190" rx="26" fill="#123b43" stroke="#57f0c1" stroke-width="2"/><text x="900" y="222" fill="#57f0c1" font-size="22" font-weight="700">可驗證狀態</text><text x="900" y="270" fill="#fff" font-size="23" font-weight="800">攻擊路徑受阻</text><text x="900" y="310" fill="#fff" font-size="20">異常可偵測・權限可撤回</text><text x="900" y="342" fill="#c6d4eb" font-size="18">證據可重現並持續複測</text>
<path d="M330 270H455" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M730 270H855" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
<rect x="70" y="465" width="320" height="170" rx="24" fill="#0e223a" stroke="#39597d"/><text x="100" y="510" fill="#8fe8ff" font-size="21" font-weight="700">事件證據</text><text x="100" y="550" fill="#fff" font-size="19">郵件樣本・登入與權杖日誌</text><text x="100" y="585" fill="#fff" font-size="19">存取範圍・資料流向・時間線</text><text x="100" y="620" fill="#fff" font-size="19">受影響帳號、系統與病人資料</text>
<rect x="440" y="465" width="320" height="170" rx="24" fill="#0e223a" stroke="#39597d"/><text x="470" y="510" fill="#d9d1ff" font-size="21" font-weight="700">控制證據</text><text x="470" y="550" fill="#fff" font-size="19">抗釣魚驗證・條件式存取</text><text x="470" y="585" fill="#fff" font-size="19">郵件驗證・權限與工作階段限制</text><text x="470" y="620" fill="#fff" font-size="19">教育、演練與例外處理紀錄</text>
<rect x="810" y="465" width="320" height="170" rx="24" fill="#0e223a" stroke="#39597d"/><text x="840" y="510" fill="#57f0c1" font-size="21" font-weight="700">驗收證據</text><text x="840" y="550" fill="#fff" font-size="19">負向測試・模擬釣魚結果</text><text x="840" y="585" fill="#fff" font-size="19">偵測時間・撤銷時間・覆蓋率</text><text x="840" y="620" fill="#fff" font-size="19">獨立抽驗與管理階層追蹤</text></g></svg>
