<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療資安成熟度評估的風險與控制對照</title>
  <desc id="desc">對照自評過度樂觀、敏感資料外流、跨院排名誤用、證據過期與忽略臨床影響等風險及緩解控制。</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#18254a"/></linearGradient></defs>
  <rect width="1200" height="720" rx="34" fill="url(#b)"/>
  <text x="60" y="70" fill="#fff" font-size="36" font-weight="800">評估風險與控制：避免把問卷當成認證</text>
  <text x="60" y="108" fill="#a8bad8" font-size="22">結果用途、資料敏感度與證據新鮮度，必須在評估前先定義</text>
  <g font-family="Inter,Noto Sans TC,sans-serif">
    <rect x="60" y="155" width="1080" height="88" rx="20" fill="#2e1e2a" stroke="#ff7aa8" stroke-width="2"/><text x="90" y="190" fill="#ff91b8" font-size="24" font-weight="800">自評過度樂觀</text><text x="360" y="190" fill="#fff" font-size="21">只有「是／否／部分」</text><text x="690" y="190" fill="#57f0c1" font-size="21">→ 抽樣組態、日誌、演練與工單證據</text><text x="360" y="220" fill="#b9c8de" font-size="18">回答者可能把政策存在視為控制有效</text>
    <rect x="60" y="263" width="1080" height="88" rx="20" fill="#35252a" stroke="#ffbd70" stroke-width="2"/><text x="90" y="298" fill="#ffbd70" font-size="24" font-weight="800">敏感資料外流</text><text x="360" y="298" fill="#fff" font-size="21">弱點與備援細節被擴散</text><text x="690" y="298" fill="#57f0c1" font-size="21">→ 去識別、最小分享、限制接收者</text><text x="360" y="328" fill="#b9c8de" font-size="18">評估內容本身可能成為攻擊情報</text>
    <rect x="60" y="371" width="1080" height="88" rx="20" fill="#242949" stroke="#a997ff" stroke-width="2"/><text x="90" y="406" fill="#c0b6ff" font-size="24" font-weight="800">跨院排名誤用</text><text x="360" y="406" fill="#fff" font-size="21">不同規模與範圍直接比總分</text><text x="690" y="406" fill="#57f0c1" font-size="21">→ 限定內部改善，不作監理或競賽分數</text><text x="360" y="436" fill="#b9c8de" font-size="18">比較壓力會降低誠實揭露意願</text>
    <rect x="60" y="479" width="1080" height="88" rx="20" fill="#183044" stroke="#63e6ff" stroke-width="2"/><text x="90" y="514" fill="#63e6ff" font-size="24" font-weight="800">證據快速過期</text><text x="360" y="514" fill="#fff" font-size="21">人員、系統與供應商已變更</text><text x="690" y="514" fill="#57f0c1" font-size="21">→ 設有效期，重大變更後重新抽驗</text><text x="360" y="544" fill="#b9c8de" font-size="18">去年通過不代表目前仍有效</text>
    <rect x="60" y="587" width="1080" height="88" rx="20" fill="#193631" stroke="#57f0c1" stroke-width="2"/><text x="90" y="622" fill="#57f0c1" font-size="24" font-weight="800">忽略臨床影響</text><text x="360" y="622" fill="#fff" font-size="21">技術控制完整但停機流程失效</text><text x="690" y="622" fill="#57f0c1" font-size="21">→ 以照護情境、降級與恢復順序複測</text><text x="360" y="652" fill="#b9c8de" font-size="18">成熟度最終要回到安全持續照護</text>
  </g>
</svg>