<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">AI Agent 委派授權生命週期</title><desc id="desc">從登錄用途、建立代理身分、核准最小權限、執行前檢查、持續監測到撤銷結案的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071725"/><stop offset="1" stop-color="#15143b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57f0c1"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="64" y="72" fill="#fff" font-size="34" font-weight="800">委派授權六階段閉環</text><text x="64" y="110" fill="#9fb3d9" font-size="20">權限不隨模型存在而永久有效，必須隨任務建立、縮限與撤銷</text><g font-family="Arial,'Noto Sans TC',sans-serif"><path d="M170 350H1030" stroke="#57f0c1" stroke-width="5" marker-end="url(#a)"/><g fill="#102f38" stroke="#57f0c1" stroke-width="2"><circle cx="170" cy="350" r="78"/><circle cx="342" cy="350" r="78"/><circle cx="514" cy="350" r="78"/><circle cx="686" cy="350" r="78"/><circle cx="858" cy="350" r="78"/><circle cx="1030" cy="350" r="78"/></g><g fill="#fff" font-size="22" font-weight="800" text-anchor="middle"><text x="170" y="340">01 登錄</text><text x="342" y="340">02 建身分</text><text x="514" y="340">03 核准</text><text x="686" y="340">04 執行</text><text x="858" y="340">05 監測</text><text x="1030" y="340">06 撤銷</text></g><g fill="#bce8dd" font-size="16" text-anchor="middle"><text x="170" y="375">用途與責任人</text><text x="342" y="375">唯一代理 ID</text><text x="514" y="375">最小權限</text><text x="686" y="375">情境再檢查</text><text x="858" y="375">行動與異常</text><text x="1030" y="375">憑證與連線</text></g><g fill="#172447" stroke="#7ea8ff"><rect x="105" y="520" width="300" height="105" rx="20"/><rect x="450" y="520" width="300" height="105" rx="20"/><rect x="795" y="520" width="300" height="105" rx="20"/></g><g fill="#dce8ff" font-size="19" text-anchor="middle"><text x="255" y="563">放行前證據</text><text x="255" y="595">資料範圍、工具、時效</text><text x="600" y="563">執行中證據</text><text x="600" y="595">意圖、輸入、動作、結果</text><text x="945" y="563">結案證據</text><text x="945" y="595">撤權、金鑰失效、日誌保存</text></g><path d="M1030 430Q1030 480 945 510M686 430V510M342 430Q342 480 255 510" fill="none" stroke="#7ea8ff" stroke-width="3" stroke-dasharray="8 8"/></g></svg>