<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療資安控制驗收的四層證據架構</title><desc id="desc">由治理目標、控制設計、技術測試與臨床情境演練逐層建立可追溯的控制有效性證據。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102550"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="600" y="72" text-anchor="middle" fill="#f4f8ff" font-size="36" font-weight="700">從「已部署」走到「能證明有效」</text><text x="600" y="112" text-anchor="middle" fill="#9fb3d9" font-size="20">四層證據必須連回同一項臨床風險與責任人</text>
<g font-family="Arial,'Noto Sans TC',sans-serif">
<rect x="100" y="160" width="1000" height="96" rx="22" fill="#172d52" stroke="#63e6ff" stroke-width="3"/><circle cx="165" cy="208" r="28" fill="#63e6ff"/><text x="165" y="216" text-anchor="middle" fill="#071526" font-size="23" font-weight="700">1</text><text x="220" y="199" fill="#fff" font-size="27" font-weight="700">治理目標</text><text x="220" y="232" fill="#b8c8e5" font-size="19">保護哪項服務、容忍什麼衝擊、誰接受殘餘風險</text><text x="970" y="216" text-anchor="end" fill="#63e6ff" font-size="18">政策／範圍／權責</text>
<rect x="145" y="278" width="910" height="96" rx="22" fill="#1b3158" stroke="#71a7ff" stroke-width="3"/><circle cx="210" cy="326" r="28" fill="#71a7ff"/><text x="210" y="334" text-anchor="middle" fill="#071526" font-size="23" font-weight="700">2</text><text x="265" y="317" fill="#fff" font-size="27" font-weight="700">控制設計</text><text x="265" y="350" fill="#b8c8e5" font-size="19">觸發條件、例外、依賴、失敗模式與回復方式</text><text x="925" y="334" text-anchor="end" fill="#9fc2ff" font-size="18">架構／組態／流程</text>
<rect x="190" y="396" width="820" height="96" rx="22" fill="#21345d" stroke="#9c8cff" stroke-width="3"/><circle cx="255" cy="444" r="28" fill="#9c8cff"/><text x="255" y="452" text-anchor="middle" fill="#071526" font-size="23" font-weight="700">3</text><text x="310" y="435" fill="#fff" font-size="27" font-weight="700">技術測試</text><text x="310" y="468" fill="#b8c8e5" font-size="19">掃描、滲透、偵測、阻擋、復原與重測結果</text><text x="880" y="452" text-anchor="end" fill="#c4b8ff" font-size="18">日誌／報告／工單</text>
<rect x="235" y="514" width="730" height="106" rx="22" fill="#213b56" stroke="#57f0c1" stroke-width="3" filter="url(#glow)"/><circle cx="300" cy="567" r="28" fill="#57f0c1"/><text x="300" y="575" text-anchor="middle" fill="#071526" font-size="23" font-weight="700">4</text><text x="355" y="556" fill="#fff" font-size="27" font-weight="700">臨床情境驗證</text><text x="355" y="590" fill="#ccebdd" font-size="19">真實工作流、停機替代、病人安全與決策時鐘</text><text x="835" y="575" text-anchor="end" fill="#57f0c1" font-size="18">演練／觀察／改善</text>
</g></svg>