<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">醫院通訊風險與控制手機版</title><desc id="desc">五項通訊備援風險及其控制證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13233d"/></linearGradient></defs><rect width="720" height="1200" fill="url(#bg)"/><text x="50" y="62" fill="#fff" font-size="28" font-weight="800">通訊備援五個失敗點</text><text x="50" y="98" fill="#9fb3d9" font-size="18">以控制證據驗收，不只確認設備存在</text><g font-family="sans-serif"><g><rect x="45" y="140" width="630" height="185" rx="24" fill="#172937" stroke="#57f0c1"/><text x="75" y="185" fill="#ff9b9b" font-size="21" font-weight="800">共同路徑</text><text x="75" y="220" fill="#e6eefc" font-size="18">風險：兩條線路共享最後一哩</text><text x="75" y="260" fill="#7ff5d2" font-size="18">控制：核對電信商、路由、機房與電力</text><text x="75" y="295" fill="#9fb3d9" font-size="16">證據：路徑圖與實際斷線測試</text><rect x="45" y="345" width="630" height="185" rx="24" fill="#172937" stroke="#57f0c1"/><text x="75" y="390" fill="#ff9b9b" font-size="21" font-weight="800">電力耗盡</text><text x="75" y="425" fill="#e6eefc" font-size="18">風險：手機與無線電同時沒電</text><text x="75" y="465" fill="#7ff5d2" font-size="18">控制：獨立充電、備用電池與輪替</text><text x="75" y="500" fill="#9fb3d9" font-size="16">證據：續航測試與更換紀錄</text><rect x="45" y="550" width="630" height="185" rx="24" fill="#172937" stroke="#57f0c1"/><text x="75" y="595" fill="#ff9b9b" font-size="21" font-weight="800">名冊過期</text><text x="75" y="630" fill="#e6eefc" font-size="18">風險：訊息送不到真正負責人</text><text x="75" y="670" fill="#7ff5d2" font-size="18">控制：季度核對、代理人與通聯演練</text><text x="75" y="705" fill="#9fb3d9" font-size="16">證據：送達率與未接通清單</text><rect x="45" y="755" width="630" height="185" rx="24" fill="#172937" stroke="#57f0c1"/><text x="75" y="800" fill="#ff9b9b" font-size="21" font-weight="800">容量壅塞</text><text x="75" y="835" fill="#e6eefc" font-size="18">風險：所有人同時搶用有限通訊</text><text x="75" y="875" fill="#7ff5d2" font-size="18">控制：角色配發、優先序與標準訊息</text><text x="75" y="910" fill="#9fb3d9" font-size="16">證據：等待時間與任務完成率</text><rect x="45" y="960" width="630" height="185" rx="24" fill="#172937" stroke="#57f0c1"/><text x="75" y="1005" fill="#ff9b9b" font-size="21" font-weight="800">紀錄缺口</text><text x="75" y="1040" fill="#e6eefc" font-size="18">風險：恢復後未補登決策與醫囑</text><text x="75" y="1080" fill="#7ff5d2" font-size="18">控制：流水號、回讀與恢復後對帳</text><text x="75" y="1115" fill="#9fb3d9" font-size="16">證據：補登清單與差異結案</text></g></g></svg>