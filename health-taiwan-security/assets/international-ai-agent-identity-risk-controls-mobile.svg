<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">AI Agent 身分風險與控制矩陣手機版</title><desc id="desc">五項代理身分風險、控制與驗收證據的卡片式圖解。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081724"/><stop offset="1" stop-color="#171438"/></linearGradient></defs><rect width="720" height="1260" rx="30" fill="url(#bg)"/><text x="44" y="64" fill="#fff" font-size="31" font-weight="800">風險與驗收證據</text><text x="44" y="102" fill="#9fb3d9" font-size="18">確認授權失效條件真的生效</text><g font-family="Arial,'Noto Sans TC',sans-serif"><g fill="#111f35" stroke="#fff" stroke-opacity=".12"><rect x="44" y="145" width="632" height="190" rx="22"/><rect x="44" y="360" width="632" height="190" rx="22"/><rect x="44" y="575" width="632" height="190" rx="22"/><rect x="44" y="790" width="632" height="190" rx="22"/><rect x="44" y="1005" width="632" height="190" rx="22"/></g><g font-size="22" font-weight="800" fill="#ffb4d1"><text x="70" y="190">01 共用人類帳號</text><text x="70" y="405">02 長效秘密寫入程式</text><text x="70" y="620">03 一次授權涵蓋所有工具</text><text x="70" y="835">04 只留模型輸出</text><text x="70" y="1050">05 停用代理但權限仍在</text></g><g font-size="18"><g fill="#82edff"><text x="70" y="233">控制：代理與環境各自獨立身分</text><text x="70" y="448">控制：受管短效憑證與自動輪替</text><text x="70" y="663">控制：依任務、資料、動作縮限</text><text x="70" y="878">控制：記錄意圖、授權、工具、結果</text><text x="70" y="1093">控制：集中撤銷與依賴清冊</text></g><g fill="#c9c2ff"><text x="70" y="280">驗收：人員與代理操作可區分</text><text x="70" y="495">驗收：逾期憑證不可重播</text><text x="70" y="710">驗收：未核准動作遭政策拒絕</text><text x="70" y="925">驗收：可還原誰在何時授權何事</text><text x="70" y="1140">驗收：所有工具同步拒絕存取</text></g></g></g></svg>