<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">醫療系統安全計畫六階段生命週期</title><desc id="desc">從臨床定界、責任指派、控制映射、證據連結、差異核准到變更重驗的循環流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0c2540"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="620" rx="36" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-size="34" font-weight="700">從一次性文件到持續更新的六階段流程</text><text x="60" y="105" fill="#9fb3d9" font-size="20">每一輪更新都應留下版本、核准、差異與驗證證據</text><g font-family="sans-serif"><g fill="#12213d" stroke-width="2"><rect x="55" y="180" width="160" height="160" rx="28" stroke="#63e6ff"/><rect x="240" y="180" width="160" height="160" rx="28" stroke="#71a7ff"/><rect x="425" y="180" width="160" height="160" rx="28" stroke="#9c8cff"/><rect x="610" y="180" width="160" height="160" rx="28" stroke="#57f0c1"/><rect x="795" y="180" width="160" height="160" rx="28" stroke="#ffb86b"/><rect x="980" y="180" width="160" height="160" rx="28" stroke="#ff7aa8"/></g><g text-anchor="middle"><text x="135" y="222" fill="#63e6ff" font-size="19" font-weight="700">01 臨床定界</text><text x="135" y="263" fill="#fff" font-size="19">服務與資料流</text><text x="135" y="296" fill="#9fb3d9" font-size="17">關鍵性與依賴</text><text x="320" y="222" fill="#71a7ff" font-size="19" font-weight="700">02 指派責任</text><text x="320" y="263" fill="#fff" font-size="19">主責與核准者</text><text x="320" y="296" fill="#9fb3d9" font-size="17">供應商邊界</text><text x="505" y="222" fill="#b9aaff" font-size="19" font-weight="700">03 映射控制</text><text x="505" y="263" fill="#fff" font-size="19">目標與實作</text><text x="505" y="296" fill="#9fb3d9" font-size="17">繼承與補償</text><text x="690" y="222" fill="#57f0c1" font-size="19" font-weight="700">04 連結證據</text><text x="690" y="263" fill="#fff" font-size="19">組態與測試</text><text x="690" y="296" fill="#9fb3d9" font-size="17">事件與演練</text><text x="875" y="222" fill="#ffbf7a" font-size="19" font-weight="700">05 核准差異</text><text x="875" y="263" fill="#fff" font-size="19">例外與期限</text><text x="875" y="296" fill="#9fb3d9" font-size="17">殘餘風險</text><text x="1060" y="222" fill="#ff9abd" font-size="19" font-weight="700">06 變更重驗</text><text x="1060" y="263" fill="#fff" font-size="19">影響分析</text><text x="1060" y="296" fill="#9fb3d9" font-size="17">更新與回歸</text></g><g stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M215 260H232"/><path d="M400 260H417"/><path d="M585 260H602"/><path d="M770 260H787"/><path d="M955 260H972"/></g></g><path d="M1060 350 C1060 505 135 505 135 350" fill="none" stroke="#57f0c1" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="600" y="480" text-anchor="middle" fill="#57f0c1" font-size="23" font-weight="700">重大變更、事件、演練結果或例外到期，重新進入定界與驗證</text><rect x="240" y="520" width="720" height="58" rx="20" fill="#102f44" stroke="#63e6ff"/><text x="600" y="557" text-anchor="middle" fill="#fff" font-size="20">驗收：版本可追溯・責任無空白・證據可取得・差異有期限</text></svg>