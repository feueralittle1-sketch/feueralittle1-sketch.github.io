<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療保護性 DNS 分階段導入流程</title><desc id="desc">從依賴盤點、雙路徑設計、觀察模式、分批封鎖、故障演練到持續調校的六階段流程，每階段都有驗收證據。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182c"/><stop offset="1" stop-color="#15173a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">先觀察、再阻擋，最後演練失效</text><text x="60" y="108" fill="#9fb3d9" font-size="19">保護性 DNS 上線不能以「查得到網頁」作為唯一驗收</text>
  <path d="M135 305 H1065" stroke="#345f83" stroke-width="8"/><g fill="#63e6ff"><circle cx="135" cy="305" r="16"/><circle cx="321" cy="305" r="16"/><circle cx="507" cy="305" r="16"/><circle cx="693" cy="305" r="16"/><circle cx="879" cy="305" r="16"/><circle cx="1065" cy="305" r="16"/></g>
  <g font-size="20" text-anchor="middle"><g><rect x="55" y="150" width="160" height="120" rx="18" fill="#113653" stroke="#4c87ad"/><text x="135" y="190" fill="#8fe8ff" font-weight="700">01 盤點</text><text x="135" y="224" fill="#dce9fa">服務與端點</text><text x="135" y="251" fill="#a8bad8" font-size="16">含停機依賴</text></g><g><rect x="241" y="340" width="160" height="120" rx="18" fill="#1b315d" stroke="#738cff"/><text x="321" y="380" fill="#b8c3ff" font-weight="700">02 設計</text><text x="321" y="414" fill="#dce9fa">雙路徑與政策</text><text x="321" y="441" fill="#a8bad8" font-size="16">含回退條件</text></g><g><rect x="427" y="150" width="160" height="120" rx="18" fill="#123d55" stroke="#57f0c1"/><text x="507" y="190" fill="#7ff5d0" font-weight="700">03 觀察</text><text x="507" y="224" fill="#dce9fa">只記錄不封鎖</text><text x="507" y="251" fill="#a8bad8" font-size="16">建立正常基線</text></g><g><rect x="613" y="340" width="160" height="120" rx="18" fill="#38275a" stroke="#a997ff"/><text x="693" y="380" fill="#d7cfff" font-weight="700">04 試點</text><text x="693" y="414" fill="#dce9fa">分批套用封鎖</text><text x="693" y="441" fill="#a8bad8" font-size="16">快速解除誤擋</text></g><g><rect x="799" y="150" width="160" height="120" rx="18" fill="#533044" stroke="#ff8fb3"/><text x="879" y="190" fill="#ffb3cc" font-weight="700">05 演練</text><text x="879" y="224" fill="#dce9fa">失效與切換</text><text x="879" y="251" fill="#a8bad8" font-size="16">臨床端到端</text></g><g><rect x="985" y="340" width="160" height="120" rx="18" fill="#183d50" stroke="#63e6ff"/><text x="1065" y="380" fill="#8fe8ff" font-weight="700">06 營運</text><text x="1065" y="414" fill="#dce9fa">調校與追查</text><text x="1065" y="441" fill="#a8bad8" font-size="16">變更觸發重測</text></g></g>
  <rect x="80" y="530" width="1040" height="115" rx="22" fill="#0e2744" stroke="#315577"/><text x="110" y="570" fill="#8fe8ff" font-size="20" font-weight="700">每一階段都留下證據</text><text x="110" y="608" fill="#d4e1f4" font-size="18">資產覆蓋率　｜　正常解析成功率　｜　惡意查詢阻擋率　｜　誤擋解除時間　｜　切換時間　｜　日誌可追溯率</text><path d="M1000 575h72" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><text x="60" y="685" fill="#8ba4c7" font-size="17">控制變更、供應商切換、重大事件或臨床服務改版後，回到盤點與觀察階段重新驗證。</text></g></svg>
