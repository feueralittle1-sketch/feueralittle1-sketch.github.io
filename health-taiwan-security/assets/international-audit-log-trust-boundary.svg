<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">醫療稽核紀錄可信邊界</title><desc id="desc">臨床系統、身分平台、醫療設備與雲端服務的紀錄，經時間同步與安全傳輸進入獨立證據庫及分析平台。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#102851"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="620" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">可信事件時間線：來源、時間、傳輸、保存四層分離</text><g font-family="sans-serif" text-anchor="middle"><g fill="#102a46" stroke="#63e6ff" stroke-width="3"><rect x="55" y="150" width="220" height="90" rx="18"/><rect x="55" y="275" width="220" height="90" rx="18"/><rect x="55" y="400" width="220" height="90" rx="18"/></g><g fill="#fff" font-size="24" font-weight="700"><text x="165" y="190">電子病歷／身分</text><text x="165" y="220">誰做了什麼</text><text x="165" y="315">醫療設備／介接</text><text x="165" y="345">資料如何流動</text><text x="165" y="440">雲端／網路控制</text><text x="165" y="470">存取與變更</text></g><rect x="370" y="205" width="250" height="230" rx="24" fill="#172a55" stroke="#a997ff" stroke-width="3"/><text x="495" y="258" fill="#fff" font-size="26" font-weight="700">院級紀錄閘門</text><text x="495" y="310" fill="#cbd8f3" font-size="22">共同時間來源</text><text x="495" y="350" fill="#cbd8f3" font-size="22">加密傳輸與緩衝</text><text x="495" y="390" fill="#cbd8f3" font-size="22">欄位標準與最小化</text><rect x="730" y="150" width="410" height="140" rx="24" fill="#123449" stroke="#5ef2b0" stroke-width="3"/><text x="935" y="202" fill="#fff" font-size="26" font-weight="700">獨立證據庫</text><text x="935" y="244" fill="#cceee0" font-size="21">限制刪除・完整性驗證・保存期限</text><rect x="730" y="350" width="410" height="140" rx="24" fill="#3b214f" stroke="#ff7bd5" stroke-width="3"/><text x="935" y="402" fill="#fff" font-size="26" font-weight="700">偵測與事件分析</text><text x="935" y="444" fill="#f2d3ea" font-size="21">關聯規則・臨床情境・調查工作區</text></g><g stroke="#63e6ff" stroke-width="5" fill="none" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><path d="M275 195 L365 270"/><path d="M275 320 L365 320"/><path d="M275 445 L365 370"/><path d="M620 270 L720 220"/><path d="M620 370 L720 420"/></g><text x="600" y="570" fill="#9fb3d9" font-size="20" text-anchor="middle">分析平台可查詢證據，但不應具備任意改寫或刪除來源紀錄的權限</text></svg>