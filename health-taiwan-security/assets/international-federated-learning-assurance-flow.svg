<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">跨院聯邦學習六階段驗收流程</title><desc id="desc">從用途與參與者界定、威脅模型、隱私效用基準、平台安全測試、臨床重驗到持續監測的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="55" y="66" fill="#f7fbff" font-size="34" font-weight="800">跨院聯邦學習要先驗證，再讓模型參與臨床流程</text><text x="55" y="103" fill="#9fb7d5" font-size="19">每一階段都要有負責角色、輸入證據、通過條件與失敗回退</text>
<g font-size="18"><rect x="55" y="155" width="325" height="145" rx="24" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="82" y="197" fill="#63e6ff" font-size="22" font-weight="800">01 界定用途與參與者</text><text x="82" y="236" fill="#e6eefc">臨床目的、資料類型、院所角色</text><text x="82" y="270" fill="#9fb7d5">退出條件與責任邊界</text><rect x="438" y="155" width="325" height="145" rx="24" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="465" y="197" fill="#b9adff" font-size="22" font-weight="800">02 建立威脅模型</text><text x="465" y="236" fill="#e6eefc">梯度外洩、投毒、冒名節點</text><text x="465" y="270" fill="#b8b0d8">協調平台與供應鏈失陷</text><rect x="820" y="155" width="325" height="145" rx="24" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="847" y="197" fill="#72f5cd" font-size="22" font-weight="800">03 隱私與效用基準</text><text x="847" y="236" fill="#e6eefc">隱私參數、攻擊測試、準確度</text><text x="847" y="270" fill="#a5dbc9">分群表現與可接受門檻</text></g>
<path d="M380 228h48" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M763 228h47" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M982 300v55" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/>
<g font-size="18"><rect x="820" y="370" width="325" height="145" rx="24" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="847" y="412" fill="#ffd08a" font-size="22" font-weight="800">04 平台安全測試</text><text x="847" y="451" fill="#fff1dc">身分、簽章、傳輸、權限與日誌</text><text x="847" y="485" fill="#e6cba8">惡意更新與節點撤權演練</text><rect x="438" y="370" width="325" height="145" rx="24" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="465" y="412" fill="#63e6ff" font-size="22" font-weight="800">05 臨床與公平性重驗</text><text x="465" y="451" fill="#e6eefc">用途內效能、次族群差異</text><text x="465" y="485" fill="#9fb7d5">人工覆核、降級與回退</text><rect x="55" y="370" width="325" height="145" rx="24" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="82" y="412" fill="#72f5cd" font-size="22" font-weight="800">06 持續監測與重驗</text><text x="82" y="451" fill="#e6eefc">參與者、資料與模型漂移</text><text x="82" y="485" fill="#a5dbc9">事件停用、撤回與證據結案</text></g><path d="M820 443h-47" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M438 443h-48" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="190" y="560" width="820" height="70" rx="22" fill="#112e4d" stroke="#8fe8ff" stroke-width="2"/><text x="225" y="603" fill="#e6eefc" font-size="19">放行證據：版本一致、隱私攻擊受測、惡意更新可阻擋、臨床門檻通過、停止與回退可演練</text></g></svg>
