<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">醫院勒索軟體事件應變流程</title><desc id="desc">事件由發現到判斷、隔離、臨床降級、復原驗證及改善的流程圖。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1730"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#f8fafc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="30" font-weight="700">勒索軟體事件：不是資訊室單打獨鬥</text><text x="60" y="101" fill="#9fb3d9" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">資訊、臨床、管理與溝通要在同一條應變鏈上</text>
<g fill="none" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M225 245H285"/><path d="M445 245H505"/><path d="M665 245H725"/><path d="M885 245H945"/></g>
<g font-family="Arial,'Noto Sans TC',sans-serif"><g><rect x="55" y="175" width="170" height="140" rx="20" fill="#0f172a" stroke="#fb7185" stroke-width="2"/><text x="140" y="215" text-anchor="middle" fill="#fb7185" font-size="18" font-weight="700">1. 發現與判斷</text><text x="140" y="253" text-anchor="middle" fill="#cbd5e1" font-size="15">確認影響範圍</text><text x="140" y="279" text-anchor="middle" fill="#cbd5e1" font-size="15">啟動指揮機制</text></g><g><rect x="285" y="175" width="160" height="140" rx="20" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="365" y="215" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">2. 隔離控制</text><text x="365" y="253" text-anchor="middle" fill="#cbd5e1" font-size="15">阻斷擴散</text><text x="365" y="279" text-anchor="middle" fill="#cbd5e1" font-size="15">保全證據</text></g><g><rect x="505" y="175" width="160" height="140" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="585" y="215" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="700">3. 臨床降級</text><text x="585" y="253" text-anchor="middle" fill="#cbd5e1" font-size="15">啟動紙本流程</text><text x="585" y="279" text-anchor="middle" fill="#cbd5e1" font-size="15">維持最低服務</text></g><g><rect x="725" y="175" width="160" height="140" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="805" y="215" text-anchor="middle" fill="#34d399" font-size="18" font-weight="700">4. 復原驗證</text><text x="805" y="253" text-anchor="middle" fill="#cbd5e1" font-size="15">乾淨環境還原</text><text x="805" y="279" text-anchor="middle" fill="#cbd5e1" font-size="15">資料交叉確認</text></g><g><rect x="945" y="175" width="200" height="140" rx="20" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/><text x="1045" y="215" text-anchor="middle" fill="#22d3ee" font-size="18" font-weight="700">5. 檢討與改善</text><text x="1045" y="253" text-anchor="middle" fill="#cbd5e1" font-size="15">根因、責任、時效</text><text x="1045" y="279" text-anchor="middle" fill="#cbd5e1" font-size="15">控制與劇本更新</text></g>
<rect x="115" y="374" width="970" height="82" rx="18" fill="#0f2433" stroke="#63e6ff" stroke-width="2"/><text x="600" y="408" text-anchor="middle" fill="#63e6ff" font-size="17" font-weight="700">全程共同要求</text><text x="600" y="438" text-anchor="middle" fill="#e2e8f0" font-size="16">事件紀錄　｜　決策授權　｜　跨部門通報　｜　病人安全優先　｜　可驗證時間指標</text></g><text x="60" y="515" fill="#64748b" font-family="Arial,'Noto Sans TC',sans-serif" font-size="15">Dr. William｜健康台灣深耕計畫－資安治理專欄</text></svg>