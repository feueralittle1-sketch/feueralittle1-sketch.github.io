<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療原始碼平台風險與控制證據對照圖</title>
<desc id="desc">圖表將任意檔案讀取、長效秘密外洩、程式碼竄改、惡意建置及證據被刪除等風險，對應至網路限制、秘密分離、保護分支、短效建置器、簽章驗證與外部日誌證據。</desc>
<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071221"/><stop offset="1" stop-color="#121a39"/></linearGradient></defs><rect width="1200" height="760" fill="url(#bg3)"/>
<text x="60" y="70" fill="#f6faff" font-size="38" font-weight="800">風險、控制與驗收證據必須成對</text><text x="60" y="106" fill="#a9bddc" font-size="22">沒有可觀察證據的控制，無法證明交付鏈已恢復可信</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><text x="85" y="165" fill="#ffb59c" font-size="25" font-weight="700">失敗情境</text><text x="475" y="165" fill="#8fe8ff" font-size="25" font-weight="700">關鍵控制</text><text x="875" y="165" fill="#8cf0ce" font-size="25" font-weight="700">驗收證據</text>
<g><rect x="55" y="190" width="1090" height="88" rx="18" fill="#101f38" stroke="#2d4568"/><text x="85" y="226" fill="#ffd0c0" font-size="21" font-weight="700">未驗證者讀取伺服器檔案</text><text x="85" y="256" fill="#aebed8" font-size="19">組態、權杖或連線資料暴露</text><text x="475" y="243" fill="#dce9f8" font-size="21">縮小外部曝險、更新、秘密不落地</text><text x="875" y="243" fill="#c9f8ea" font-size="21">版本清冊＋掃描結果＋撤銷紀錄</text></g>
<g><rect x="55" y="294" width="1090" height="88" rx="18" fill="#101f38" stroke="#2d4568"/><text x="85" y="330" fill="#ffd0c0" font-size="21" font-weight="700">長效部署秘密遭複製</text><text x="85" y="360" fill="#aebed8" font-size="19">修補後仍可存取下游環境</text><text x="475" y="347" fill="#dce9f8" font-size="21">獨立秘密庫、短效權杖、範圍限制</text><text x="875" y="347" fill="#c9f8ea" font-size="21">輪替完成率＋舊權杖拒絕測試</text></g>
<g><rect x="55" y="398" width="1090" height="88" rx="18" fill="#101f38" stroke="#2d4568"/><text x="85" y="434" fill="#ffd0c0" font-size="21" font-weight="700">程式碼或保護分支遭竄改</text><text x="85" y="464" fill="#aebed8" font-size="19">惡意變更進入醫療軟體</text><text x="475" y="451" fill="#dce9f8" font-size="21">雙人審查、簽署提交、基準差異比對</text><text x="875" y="451" fill="#c9f8ea" font-size="21">合併紀錄＋獨立重掃＋差異清單</text></g>
<g><rect x="55" y="502" width="1090" height="88" rx="18" fill="#101f38" stroke="#2d4568"/><text x="85" y="538" fill="#ffd0c0" font-size="21" font-weight="700">受污染 Runner 產生惡意成品</text><text x="85" y="568" fill="#aebed8" font-size="19">原始碼正常，部署物仍不可信</text><text x="475" y="555" fill="#dce9f8" font-size="21">短效建置器、固定依賴、成品簽章</text><text x="875" y="555" fill="#c9f8ea" font-size="21">可重現建置＋簽章驗證＋雜湊</text></g>
<g><rect x="55" y="606" width="1090" height="88" rx="18" fill="#101f38" stroke="#2d4568"/><text x="85" y="642" fill="#ffd0c0" font-size="21" font-weight="700">平台內日誌遭刪除或改寫</text><text x="85" y="672" fill="#aebed8" font-size="19">無法判斷影響時間與範圍</text><text x="475" y="659" fill="#dce9f8" font-size="21">即時外送、分離權限、留存鎖定</text><text x="875" y="659" fill="#c9f8ea" font-size="21">完整性檢查＋時間線＋查詢演練</text></g>
<path d="M435 185V700M835 185V700" stroke="#28405f" stroke-width="2"/></g></svg>
