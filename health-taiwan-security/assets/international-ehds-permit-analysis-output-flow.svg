<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療資料再利用從申請到結案的七步流程</title>
  <desc id="desc">流程依序為目的申請、資料許可、資料準備、受控分析、輸出檢查、結果交付與撤權結案，各階段都有責任與證據。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061421"/><stop offset="1" stop-color="#111936"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f4f8ff" font-size="34" font-weight="800">七步把研究需求轉成可稽核交付</text><text x="70" y="110" fill="#9fb3d9" font-size="20">每一步都有進入條件、責任人、證據與退回機制</text>
  <g font-family="Inter,Noto Sans TC,sans-serif">
    <g transform="translate(65 175)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#63e6ff"/><circle cx="34" cy="34" r="20" fill="#63e6ff"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">1</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">目的申請</text><text x="28" y="82" fill="#c6d4eb" font-size="17">用途、方法、期間</text><text x="28" y="108" fill="#c6d4eb" font-size="17">人員與預期輸出</text></g>
    <g transform="translate(345 175)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#a997ff"/><circle cx="34" cy="34" r="20" fill="#a997ff"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">2</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">資料許可</text><text x="28" y="82" fill="#c6d4eb" font-size="17">合法性與必要性</text><text x="28" y="108" fill="#c6d4eb" font-size="17">資料集與限制</text></g>
    <g transform="translate(625 175)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#57f0c1"/><circle cx="34" cy="34" r="20" fill="#57f0c1"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">3</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">資料準備</text><text x="28" y="82" fill="#c6d4eb" font-size="17">最小化與假名化</text><text x="28" y="108" fill="#c6d4eb" font-size="17">品質與完整性檢查</text></g>
    <g transform="translate(905 175)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#ffbf69"/><circle cx="34" cy="34" r="20" fill="#ffbf69"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">4</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">受控分析</text><text x="28" y="82" fill="#c6d4eb" font-size="17">唯一帳號與工具白名單</text><text x="28" y="108" fill="#c6d4eb" font-size="17">全程活動紀錄</text></g>
    <path d="M300 237H340M580 237H620M860 237H900" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <path d="M1022 300V372H900" stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <g transform="translate(665 380)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#ff7d9c"/><circle cx="34" cy="34" r="20" fill="#ff7d9c"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">5</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">輸出檢查</text><text x="28" y="82" fill="#c6d4eb" font-size="17">重識別與洩漏測試</text><text x="28" y="108" fill="#c6d4eb" font-size="17">不合格即退回</text></g>
    <g transform="translate(385 380)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#63e6ff"/><circle cx="34" cy="34" r="20" fill="#63e6ff"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">6</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">結果交付</text><text x="28" y="82" fill="#c6d4eb" font-size="17">核准檔案與雜湊</text><text x="28" y="108" fill="#c6d4eb" font-size="17">接收者與期限</text></g>
    <g transform="translate(105 380)"><rect width="235" height="125" rx="24" fill="#142d4a" stroke="#57f0c1"/><circle cx="34" cy="34" r="20" fill="#57f0c1"/><text x="34" y="41" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">7</text><text x="70" y="43" fill="#fff" font-size="22" font-weight="700">撤權結案</text><text x="28" y="82" fill="#c6d4eb" font-size="17">停用環境與權限</text><text x="28" y="108" fill="#c6d4eb" font-size="17">留存稽核與改善</text></g>
    <path d="M665 442H625M385 442H345" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="180" y="590" width="840" height="66" rx="20" fill="#0d2945" stroke="#31587f"/><text x="600" y="618" text-anchor="middle" fill="#8fe8ff" font-size="18" font-weight="700">共同驗收證據</text><text x="600" y="645" text-anchor="middle" fill="#d8e5f7" font-size="17">許可版本｜資料清單｜操作日誌｜輸出審查紀錄｜交付雜湊｜撤權時間</text>
  </g>
</svg>
