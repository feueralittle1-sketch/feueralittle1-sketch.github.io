<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療勒索演練五階段生命週期</title>
  <desc id="desc">從目標與邊界、桌上推演、技術驗證、乾淨還原到復盤改善的五階段流程，每階段皆有明確輸入、決策與驗收證據。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#111d3b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f5fbff" font-size="36" font-weight="800">一場可驗收的勒索演練：五階段、三個決策閘門</text>
  <text x="70" y="112" fill="#9fb7d9" font-size="23">先在安全邊界內推演，再逐步驗證隔離、降級與復原；不在正式環境製造破壞</text>
  <g text-anchor="middle">
    <rect x="60" y="185" width="190" height="170" rx="25" fill="#192c51" stroke="#9c8cff" stroke-width="3"/>
    <text x="155" y="230" fill="#eee7ff" font-size="25" font-weight="800">1 定義目標</text><text x="155" y="270" fill="#c8bee8" font-size="20">系統與臨床範圍</text><text x="155" y="304" fill="#c8bee8" font-size="20">安全停止條件</text><text x="155" y="338" fill="#c8bee8" font-size="20">觀察員與證據</text>
    <path d="M250 270H285" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="295" y="185" width="190" height="170" rx="25" fill="#102d45" stroke="#63e6ff" stroke-width="3"/>
    <text x="390" y="230" fill="#9fefff" font-size="25" font-weight="800">2 桌上推演</text><text x="390" y="270" fill="#d9f4ff" font-size="20">告警與情境注入</text><text x="390" y="304" fill="#d9f4ff" font-size="20">指揮與通報決策</text><text x="390" y="338" fill="#d9f4ff" font-size="20">臨床降級選擇</text>
    <path d="M485 270H520" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="530" y="185" width="190" height="170" rx="25" fill="#143544" stroke="#57f0c1" stroke-width="3"/>
    <text x="625" y="230" fill="#a8f8df" font-size="25" font-weight="800">3 技術驗證</text><text x="625" y="270" fill="#d7efe9" font-size="20">隔離與帳號停用</text><text x="625" y="304" fill="#d7efe9" font-size="20">日誌與證據保全</text><text x="625" y="338" fill="#d7efe9" font-size="20">在測試區執行</text>
    <path d="M720 270H755" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="765" y="185" width="190" height="170" rx="25" fill="#44322b" stroke="#ffbf69" stroke-width="3"/>
    <text x="860" y="230" fill="#ffd59d" font-size="25" font-weight="800">4 乾淨還原</text><text x="860" y="270" fill="#f1ddc5" font-size="20">可信映像與備份</text><text x="860" y="304" fill="#f1ddc5" font-size="20">依賴順序與驗證</text><text x="860" y="338" fill="#f1ddc5" font-size="20">臨床確認可用</text>
    <path d="M955 270H990" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="1000" y="185" width="140" height="170" rx="25" fill="#3b263e" stroke="#ff9bc8" stroke-width="3"/>
    <text x="1070" y="230" fill="#ffc7e1" font-size="25" font-weight="800">5 復盤</text><text x="1070" y="275" fill="#f0d8e5" font-size="20">缺口</text><text x="1070" y="309" fill="#f0d8e5" font-size="20">責任人</text><text x="1070" y="343" fill="#f0d8e5" font-size="20">期限</text>
  </g>
  <g text-anchor="middle">
    <rect x="180" y="420" width="250" height="90" rx="22" fill="#0e263c" stroke="#71a7ff" stroke-width="2"/><text x="305" y="456" fill="#c8dcff" font-size="22" font-weight="800">閘門 A：能否安全演？</text><text x="305" y="488" fill="#aebfda" font-size="19">邊界、授權、停止條件完整</text>
    <rect x="475" y="420" width="250" height="90" rx="22" fill="#0e263c" stroke="#71a7ff" stroke-width="2"/><text x="600" y="456" fill="#c8dcff" font-size="22" font-weight="800">閘門 B：能否隔離？</text><text x="600" y="488" fill="#aebfda" font-size="19">臨床必要服務仍可運作</text>
    <rect x="770" y="420" width="250" height="90" rx="22" fill="#0e263c" stroke="#71a7ff" stroke-width="2"/><text x="895" y="456" fill="#c8dcff" font-size="22" font-weight="800">閘門 C：能否上線？</text><text x="895" y="488" fill="#aebfda" font-size="19">安全、資料、介接、臨床皆確認</text>
  </g>
  <rect x="70" y="565" width="1060" height="80" rx="24" fill="#122b40" stroke="#426a8c" stroke-width="2"/>
  <text x="600" y="600" text-anchor="middle" fill="#f5fbff" font-size="23" font-weight="800">驗收證據</text>
  <text x="600" y="631" text-anchor="middle" fill="#b8cbe2" font-size="20">偵測至指揮時間・隔離決策時間・降級啟動時間・還原驗證時間・改善項目關閉率</text>
  <text x="600" y="690" text-anchor="middle" fill="#8ca7c8" font-size="19">演練成熟度來自重複驗證與缺口關閉，不是情境寫得多戲劇化。</text>
</svg>
