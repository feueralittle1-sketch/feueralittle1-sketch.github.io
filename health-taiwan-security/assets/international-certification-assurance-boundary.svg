<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">健康資訊認證與醫院在地安全驗證的責任邊界</title><desc id="desc">美國 ONC 認證確認產品具備特定安全能力，醫院仍須驗證部署組態、介接、身分權限、日誌與臨床持續運作。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="36" font-weight="800">認證證明產品能力，不等於醫院部署已安全</text><text x="60" y="110" fill="#9fb7db" font-size="22">安全結果同時取決於認證範圍、院內組態、介接關係、操作流程與持續監測。</text>
<rect x="60" y="175" width="310" height="360" rx="30" fill="#173153" stroke="#63e6ff" stroke-width="3"/><text x="215" y="228" text-anchor="middle" fill="#63e6ff" font-size="27" font-weight="800">產品認證範圍</text><text x="95" y="282" fill="#e4efff" font-size="21">• 身分驗證能力</text><text x="95" y="326" fill="#e4efff" font-size="21">• 存取控制與授權</text><text x="95" y="370" fill="#e4efff" font-size="21">• 稽核紀錄能力</text><text x="95" y="414" fill="#e4efff" font-size="21">• 安全風險分析文件</text><rect x="95" y="462" width="240" height="44" rx="22" fill="#0a2239"/><text x="215" y="491" text-anchor="middle" fill="#9edfff" font-size="18" font-weight="700">回答：產品能不能做到</text>
<path d="M370 355 H495" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><rect x="495" y="245" width="210" height="220" rx="30" fill="#30275f" stroke="#b69cff" stroke-width="4"/><text x="600" y="306" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">部署閘門</text><text x="600" y="353" text-anchor="middle" fill="#e8e0ff" font-size="21">範圍核對</text><text x="600" y="390" text-anchor="middle" fill="#e8e0ff" font-size="21">在地測試</text><text x="600" y="427" text-anchor="middle" fill="#e8e0ff" font-size="21">證據放行</text><path d="M705 355 H830" stroke="#b69cff" stroke-width="6" marker-end="url(#a)"/>
<rect x="830" y="150" width="310" height="410" rx="30" fill="#123d45" stroke="#57f0c1" stroke-width="3"/><text x="985" y="205" text-anchor="middle" fill="#57f0c1" font-size="27" font-weight="800">醫院運行環境</text><text x="865" y="260" fill="#e2fff7" font-size="21">• SSO、MFA 與角色映射</text><text x="865" y="304" fill="#e2fff7" font-size="21">• API、設備與第三方介接</text><text x="865" y="348" fill="#e2fff7" font-size="21">• 日誌外送與告警處置</text><text x="865" y="392" fill="#e2fff7" font-size="21">• 備援、停機與復原流程</text><text x="865" y="436" fill="#e2fff7" font-size="21">• 更新後持續重驗</text><rect x="865" y="480" width="240" height="44" rx="22" fill="#0b2c30"/><text x="985" y="509" text-anchor="middle" fill="#8ff5d7" font-size="18" font-weight="700">回答：現場是否安全有效</text>
<rect x="190" y="610" width="820" height="58" rx="29" fill="#3e293e" stroke="#ff91b8" stroke-width="2"/><text x="600" y="647" text-anchor="middle" fill="#ffd8e6" font-size="22" font-weight="700">法域邊界：美國認證規則不是台灣醫院的法定驗收清單，應轉成契約與院內風險證據。</text>
</svg>
