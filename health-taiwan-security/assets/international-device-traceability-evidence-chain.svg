<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備供應鏈可追溯證據鏈</title><desc id="desc">設備唯一識別、軟體元件、供應商關係、院內部署及生命週期事件五層證據互相連結。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#13244a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="70" y="78" fill="#f8fbff" font-size="38" font-weight="800">醫療設備供應鏈可追溯證據鏈</text><text x="70" y="116" fill="#9fb3d9" font-size="20">任何一層斷線，都可能讓漏洞、召回或更新查詢失真</text><path d="M175 360H1025" stroke="#63e6ff" stroke-width="5" opacity=".55"/><g font-family="Arial, 'Noto Sans TC', sans-serif"><g transform="translate(70 205)"><rect width="190" height="300" rx="24" fill="#102743" stroke="#63e6ff" stroke-width="2"/><circle cx="95" cy="64" r="32" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="95" y="72" fill="#63e6ff" text-anchor="middle" font-size="22" font-weight="800">01</text><text x="95" y="130" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">唯一識別</text><text x="95" y="174" fill="#c6d4eb" text-anchor="middle" font-size="19">院內資產編號</text><text x="95" y="207" fill="#c6d4eb" text-anchor="middle" font-size="19">UDI／型號／序號</text><text x="95" y="240" fill="#c6d4eb" text-anchor="middle" font-size="19">批次與版本</text></g><g transform="translate(287 205)"><rect width="190" height="300" rx="24" fill="#122749" stroke="#8fa8ff" stroke-width="2"/><circle cx="95" cy="64" r="32" fill="#24345d" stroke="#8fa8ff" stroke-width="3"/><text x="95" y="72" fill="#b6c4ff" text-anchor="middle" font-size="22" font-weight="800">02</text><text x="95" y="130" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">元件來源</text><text x="95" y="174" fill="#c6d4eb" text-anchor="middle" font-size="19">SBOM 與韌體</text><text x="95" y="207" fill="#c6d4eb" text-anchor="middle" font-size="19">套件與版本</text><text x="95" y="240" fill="#c6d4eb" text-anchor="middle" font-size="19">來源與產生時間</text></g><g transform="translate(504 205)"><rect width="190" height="300" rx="24" fill="#162749" stroke="#a997ff" stroke-width="2"/><circle cx="95" cy="64" r="32" fill="#342d5d" stroke="#a997ff" stroke-width="3"/><text x="95" y="72" fill="#c7baff" text-anchor="middle" font-size="22" font-weight="800">03</text><text x="95" y="130" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">供應關係</text><text x="95" y="174" fill="#c6d4eb" text-anchor="middle" font-size="19">製造商／維護商</text><text x="95" y="207" fill="#c6d4eb" text-anchor="middle" font-size="19">次承包商</text><text x="95" y="240" fill="#c6d4eb" text-anchor="middle" font-size="19">責任與聯絡窗口</text></g><g transform="translate(721 205)"><rect width="190" height="300" rx="24" fill="#102d3b" stroke="#57f0c1" stroke-width="2"/><circle cx="95" cy="64" r="32" fill="#174c45" stroke="#57f0c1" stroke-width="3"/><text x="95" y="72" fill="#76f6d0" text-anchor="middle" font-size="22" font-weight="800">04</text><text x="95" y="130" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">院內部署</text><text x="95" y="174" fill="#c6d4eb" text-anchor="middle" font-size="19">位置／網段</text><text x="95" y="207" fill="#c6d4eb" text-anchor="middle" font-size="19">臨床用途與介接</text><text x="95" y="240" fill="#c6d4eb" text-anchor="middle" font-size="19">責任單位</text></g><g transform="translate(938 205)"><rect width="190" height="300" rx="24" fill="#2b253d" stroke="#ffb37a" stroke-width="2"/><circle cx="95" cy="64" r="32" fill="#563a37" stroke="#ffb37a" stroke-width="3"/><text x="95" y="72" fill="#ffc99e" text-anchor="middle" font-size="22" font-weight="800">05</text><text x="95" y="130" fill="#fff" text-anchor="middle" font-size="25" font-weight="800">生命週期</text><text x="95" y="174" fill="#c6d4eb" text-anchor="middle" font-size="19">驗收／更新／維修</text><text x="95" y="207" fill="#c6d4eb" text-anchor="middle" font-size="19">事件與召回</text><text x="95" y="240" fill="#c6d4eb" text-anchor="middle" font-size="19">退役與證據封存</text></g></g><g fill="#63e6ff" filter="url(#glow)"><circle cx="274" cy="360" r="8"/><circle cx="491" cy="360" r="8"/><circle cx="708" cy="360" r="8"/><circle cx="925" cy="360" r="8"/></g><rect x="220" y="570" width="760" height="82" rx="24" fill="#0c1d34" stroke="#63e6ff" stroke-width="2"/><text x="600" y="604" fill="#63e6ff" font-size="21" font-weight="800" text-anchor="middle">治理驗收問題</text><text x="600" y="635" fill="#e6eefc" font-size="21" text-anchor="middle">能否由漏洞、批次或供應商，在限定時間內反查全部受影響設備？</text></svg>