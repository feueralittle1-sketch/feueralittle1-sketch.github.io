<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">醫院冷鏈設備可信邊界手機版</title><desc id="desc">遠端維護通過受控閘門進入隔離冷鏈區，設備狀態與獨立溫度紀錄共同支援事件指揮及庫存處置。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient></defs><rect width="720" height="1180" rx="28" fill="url(#bg)"/><text x="40" y="62" fill="#fff" font-size="31" font-weight="800">冷鏈控制與證據分離</text><text x="40" y="102" fill="#a8bddc" font-size="19">控制器恢復，不代表庫存直接放行</text><g font-family="Arial,Noto Sans TC,sans-serif"><rect x="42" y="145" width="636" height="175" rx="24" fill="#172d50" stroke="#63e6ff" stroke-width="3"/><text x="78" y="198" fill="#fff" font-size="26" font-weight="800">外部維護來源</text><text x="78" y="247" fill="#cbd9ef" font-size="21">供應商工程師、維護平台、跳板</text><text x="78" y="283" fill="#cbd9ef" font-size="21">不得直接連入控制器</text><rect x="42" y="365" width="636" height="220" rx="24" fill="#28234d" stroke="#a997ff" stroke-width="3"/><text x="78" y="418" fill="#fff" font-size="26" font-weight="800">身分與會話閘門</text><text x="78" y="466" fill="#ded7ff" font-size="21">強驗證、工單、限時授權、會話紀錄</text><text x="78" y="507" fill="#ded7ff" font-size="21">清除預設帳密與長期遠端通道</text><text x="78" y="548" fill="#ded7ff" font-size="21">只允許必要設備與必要操作</text><rect x="42" y="630" width="636" height="230" rx="24" fill="#12384a" stroke="#57f0c1" stroke-width="3"/><text x="78" y="683" fill="#fff" font-size="26" font-weight="800">隔離冷鏈控制區</text><text x="78" y="731" fill="#cff8e9" font-size="21">控制器、本地顯示、告警、門磁、電力</text><text x="78" y="772" fill="#cff8e9" font-size="21">保留安全本地與人工降級模式</text><text x="78" y="813" fill="#cff8e9" font-size="21">限制建築管理及辦公網路介接</text><rect x="42" y="905" width="300" height="220" rx="24" fill="#11334c" stroke="#4edff5" stroke-width="3"/><text x="72" y="958" fill="#fff" font-size="24" font-weight="800">獨立溫度證據</text><text x="72" y="1004" fill="#cce9f2" font-size="19">校正、時間、缺口</text><text x="72" y="1042" fill="#cce9f2" font-size="19">與控制器分離保存</text><text x="72" y="1080" fill="#cce9f2" font-size="19">支援事後判定</text><rect x="378" y="905" width="300" height="220" rx="24" fill="#39233f" stroke="#ff7aa8" stroke-width="3"/><text x="408" y="958" fill="#fff" font-size="24" font-weight="800">事件與庫存處置</text><text x="408" y="1004" fill="#ffd0df" font-size="19">隔離、轉移、恢復</text><text x="408" y="1042" fill="#ffd0df" font-size="19">放行／隔離／報廢</text><text x="408" y="1080" fill="#ffd0df" font-size="19">由權責單位判定</text><path d="M360 320V355M360 585V620M360 860V895" stroke="#63e6ff" stroke-width="5"/></g></svg>