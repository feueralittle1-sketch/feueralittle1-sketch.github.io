<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安機器可讀證據鏈</title><desc id="desc">控制要求、實作、證據、評估與改善依共同識別碼形成可追溯治理閉環。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="390" height="900" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><text x="195" y="42" fill="#fff" font-size="22" font-weight="800">機器可讀資安證據鏈</text><text x="195" y="70" fill="#9fb3d9" font-size="14">共同控制識別碼貫穿全流程</text><g font-size="19" font-weight="700"><rect x="45" y="100" width="300" height="105" rx="20" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="195" y="140" fill="#63e6ff">控制要求</text><text x="195" y="174" fill="#d8e6fb" font-size="16" font-weight="400">目標、範圍、責任與參數</text><path d="M195 210V245" stroke="#63e6ff" stroke-width="6"/><path d="M184 235L195 250L206 235" fill="#63e6ff"/>
<rect x="45" y="255" width="300" height="105" rx="20" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="195" y="295" fill="#c5baff">實作陳述</text><text x="195" y="329" fill="#e8e3ff" font-size="16" font-weight="400">系統、流程、角色與例外</text><path d="M195 365V400" stroke="#63e6ff" stroke-width="6"/><path d="M184 390L195 405L206 390" fill="#63e6ff"/>
<rect x="45" y="410" width="300" height="105" rx="20" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="195" y="450" fill="#57f0c1">技術證據</text><text x="195" y="484" fill="#d9fff3" font-size="16" font-weight="400">組態、日誌、測試與工單</text><path d="M195 520V555" stroke="#63e6ff" stroke-width="6"/><path d="M184 545L195 560L206 545" fill="#63e6ff"/>
<rect x="45" y="565" width="300" height="105" rx="20" fill="#31263d" stroke="#ffb86b" stroke-width="3"/><text x="195" y="605" fill="#ffcf99">評估結果</text><text x="195" y="639" fill="#fff0dd" font-size="16" font-weight="400">通過、缺口、影響與信心</text><path d="M195 675V710" stroke="#63e6ff" stroke-width="6"/><path d="M184 700L195 715L206 700" fill="#63e6ff"/>
<rect x="45" y="720" width="300" height="105" rx="20" fill="#2d2134" stroke="#ff7aa8" stroke-width="3"/><text x="195" y="760" fill="#ff9fbe">改善與治理決策</text><text x="195" y="794" fill="#ffe1eb" font-size="16" font-weight="400">主責、期限、驗證、風險接受</text></g><text x="195" y="865" fill="#ffcf99" font-size="14">自動收集不取代臨床與權責判定</text></g></svg>
