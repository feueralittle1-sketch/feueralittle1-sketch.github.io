<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">停機資料對帳風險與控制</title><desc id="desc">將錯誤病人、漏單、重複醫囑、時間衝突與批次回寫錯誤，對應到病人識別、序號管理、狀態比對、人工覆核及回退控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#142a4b"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/><text x="60" y="78" fill="#fff" font-size="38" font-weight="800">停機資料回寫的五類高風險錯誤</text><text x="60" y="118" fill="#9fb3d9" font-size="21">每一筆資料都要保留來源與處置狀態；不確定項目不得用「先輸入再說」處理</text><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="90" y="180" fill="#ffb69b" font-size="25" font-weight="700">風險</text><text x="520" y="180" fill="#57f0c1" font-size="25" font-weight="700">控制</text><text x="1020" y="180" fill="#9cc4ff" font-size="25" font-weight="700">證據</text><g><rect x="60" y="205" width="1080" height="82" rx="18" fill="#13243d"/><text x="90" y="255" fill="#fff" font-size="21">病人或就醫事件錯配</text><text x="520" y="244" fill="#d7e5f7" font-size="19">雙因子識別＋就醫序號／地點／時間交叉核對</text><text x="1020" y="244" text-anchor="middle" fill="#d7e5f7" font-size="18">覆核簽章</text><text x="1020" y="270" text-anchor="middle" fill="#9fb3d9" font-size="15">例外紀錄</text></g><g><rect x="60" y="302" width="1080" height="82" rx="18" fill="#102b40"/><text x="90" y="352" fill="#fff" font-size="21">紙本醫囑漏輸或遺失</text><text x="520" y="341" fill="#d7e5f7" font-size="19">連續編號、收件清冊、缺號追查與單位結案</text><text x="1020" y="341" text-anchor="middle" fill="#d7e5f7" font-size="18">缺號報表</text><text x="1020" y="367" text-anchor="middle" fill="#9fb3d9" font-size="15">收件對帳</text></g><g><rect x="60" y="399" width="1080" height="82" rx="18" fill="#13243d"/><text x="90" y="449" fill="#fff" font-size="21">已執行項目被重複下單</text><text x="520" y="438" fill="#d7e5f7" font-size="19">比對執行狀態、結果與設備暫存，重複項目隔離</text><text x="1020" y="438" text-anchor="middle" fill="#d7e5f7" font-size="18">重複清單</text><text x="1020" y="464" text-anchor="middle" fill="#9fb3d9" font-size="15">取消理由</text></g><g><rect x="60" y="496" width="1080" height="82" rx="18" fill="#102b40"/><text x="90" y="546" fill="#fff" font-size="21">時間戳或版本衝突</text><text x="520" y="535" fill="#d7e5f7" font-size="19">區分發生、記錄、輸入時間；由臨床人員裁決真實順序</text><text x="1020" y="535" text-anchor="middle" fill="#d7e5f7" font-size="18">時間軸</text><text x="1020" y="561" text-anchor="middle" fill="#9fb3d9" font-size="15">裁決紀錄</text></g><g><rect x="60" y="593" width="1080" height="82" rx="18" fill="#13243d"/><text x="90" y="643" fill="#fff" font-size="21">批次回寫擴大錯誤</text><text x="520" y="632" fill="#d7e5f7" font-size="19">小批次、錯誤率門檻、停止條件、回退與抽樣臨床驗證</text><text x="1020" y="632" text-anchor="middle" fill="#d7e5f7" font-size="18">批次日誌</text><text x="1020" y="658" text-anchor="middle" fill="#9fb3d9" font-size="15">回退測試</text></g><rect x="60" y="700" width="1080" height="36" rx="14" fill="#0b1c32"/><text x="600" y="725" text-anchor="middle" fill="#cfe5ff" font-size="18">未解例外應保持可見、可追蹤、不可靜默消失，並由指定角色承擔關閉責任</text></g></svg>