<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">健康資訊系統在地安全驗收流程</title><desc id="desc">醫院依序完成認證範圍核對、部署組態驗證、負向與臨床情境測試、證據放行及持續重驗。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="36" font-weight="800">把證書轉成可重複驗證的部署證據</text><text x="60" y="112" fill="#9fb7db" font-size="22">每個階段都要有輸入、責任人、驗收結果與不通過時的處置。</text><g font-family="sans-serif"><rect x="55" y="185" width="205" height="300" rx="28" fill="#173153" stroke="#63e6ff" stroke-width="3"/><text x="158" y="236" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="800">1 範圍核對</text><text x="84" y="290" fill="#e4efff" font-size="19">認證版本</text><text x="84" y="329" fill="#e4efff" font-size="19">適用模組</text><text x="84" y="368" fill="#e4efff" font-size="19">例外與依賴</text><rect x="82" y="412" width="151" height="42" rx="21" fill="#0a2239"/><text x="158" y="440" text-anchor="middle" fill="#a9e8ff" font-size="17">輸出：邊界表</text><path d="M260 335 H305" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><rect x="305" y="185" width="205" height="300" rx="28" fill="#2b275b" stroke="#b69cff" stroke-width="3"/><text x="408" y="236" text-anchor="middle" fill="#d6c9ff" font-size="25" font-weight="800">2 組態驗證</text><text x="334" y="290" fill="#eee8ff" font-size="19">SSO／MFA</text><text x="334" y="329" fill="#eee8ff" font-size="19">角色與權限</text><text x="334" y="368" fill="#eee8ff" font-size="19">稽核與介接</text><rect x="332" y="412" width="151" height="42" rx="21" fill="#17133a"/><text x="408" y="440" text-anchor="middle" fill="#d6c9ff" font-size="17">輸出：組態證據</text><path d="M510 335 H555" stroke="#b69cff" stroke-width="6" marker-end="url(#a)"/><rect x="555" y="185" width="205" height="300" rx="28" fill="#123d45" stroke="#57f0c1" stroke-width="3"/><text x="658" y="236" text-anchor="middle" fill="#57f0c1" font-size="25" font-weight="800">3 情境測試</text><text x="584" y="290" fill="#e2fff7" font-size="19">越權與失敗</text><text x="584" y="329" fill="#e2fff7" font-size="19">日誌完整性</text><text x="584" y="368" fill="#e2fff7" font-size="19">停機與回復</text><rect x="582" y="412" width="151" height="42" rx="21" fill="#0b2c30"/><text x="658" y="440" text-anchor="middle" fill="#8ff5d7" font-size="17">輸出：測試紀錄</text><path d="M760 335 H805" stroke="#57f0c1" stroke-width="6" marker-end="url(#a)"/><rect x="805" y="185" width="205" height="300" rx="28" fill="#3d2a43" stroke="#ff91b8" stroke-width="3"/><text x="908" y="236" text-anchor="middle" fill="#ffb6d0" font-size="25" font-weight="800">4 證據放行</text><text x="834" y="290" fill="#ffe6ef" font-size="19">缺口分級</text><text x="834" y="329" fill="#ffe6ef" font-size="19">責任與期限</text><text x="834" y="368" fill="#ffe6ef" font-size="19">核准與回退</text><rect x="832" y="412" width="151" height="42" rx="21" fill="#271327"/><text x="908" y="440" text-anchor="middle" fill="#ffc8dc" font-size="17">輸出：放行決議</text><path d="M1010 335 H1055" stroke="#ff91b8" stroke-width="6" marker-end="url(#a)"/><rect x="1055" y="185" width="110" height="300" rx="28" fill="#1b3550" stroke="#7ba7ff" stroke-width="3"/><text x="1110" y="242" text-anchor="middle" fill="#a9c6ff" font-size="22" font-weight="800">5</text><text x="1110" y="278" text-anchor="middle" fill="#a9c6ff" font-size="20" font-weight="800">持續</text><text x="1110" y="312" text-anchor="middle" fill="#a9c6ff" font-size="20" font-weight="800">重驗</text><text x="1110" y="370" text-anchor="middle" fill="#e1ebff" font-size="17">更新</text><text x="1110" y="402" text-anchor="middle" fill="#e1ebff" font-size="17">介接</text><text x="1110" y="434" text-anchor="middle" fill="#e1ebff" font-size="17">事件</text></g><rect x="160" y="555" width="880" height="92" rx="28" fill="#0d203a" stroke="#7ba7ff" stroke-width="2"/><text x="600" y="592" text-anchor="middle" fill="#b7ccff" font-size="22" font-weight="700">最低放行條件</text><text x="600" y="626" text-anchor="middle" fill="#dbe7ff" font-size="20">關鍵身分、越權阻擋、稽核外送、停機替代與回退路徑均有可重現證據</text></svg>
