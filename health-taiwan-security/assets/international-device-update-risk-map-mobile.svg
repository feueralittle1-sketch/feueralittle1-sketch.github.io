<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1250" role="img" aria-labelledby="title desc"><title id="title">醫療設備更新失敗模式與控制證據手機版</title><desc id="desc">五種更新失敗模式、主要控制與驗收證據的垂直對照。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#122445"/></linearGradient></defs><rect width="760" height="1250" rx="30" fill="url(#bg)"/><g font-family="Inter,Noto Sans TC,sans-serif"><text x="40" y="62" fill="#f4f8ff" font-size="30" font-weight="800">更新失敗模式 × 控制 × 證據</text><text x="40" y="98" fill="#9fb3d9" font-size="18">安裝完成不等於臨床可安全放行</text><g fill="#102744" stroke="#334e70" stroke-width="2"><rect x="50" y="140" width="660" height="185" rx="22"/><rect x="50" y="350" width="660" height="185" rx="22"/><rect x="50" y="560" width="660" height="185" rx="22"/><rect x="50" y="770" width="660" height="185" rx="22"/><rect x="50" y="980" width="660" height="185" rx="22"/></g><g font-size="19"><text x="80" y="180" fill="#ffb3c1" font-weight="800">偽造或遭竄改套件</text><text x="80" y="220" fill="#8fe8ff">控制：可信來源、簽章鏈、雜湊比對</text><text x="80" y="260" fill="#c8bbff">證據：套件指紋與驗證紀錄</text><text x="80" y="390" fill="#ffb3c1" font-weight="800">錯誤型號或相依版本</text><text x="80" y="430" fill="#8fe8ff">控制：設備清冊、適用矩陣、前置檢查</text><text x="80" y="470" fill="#c8bbff">證據：逐台適用性結果</text><text x="80" y="600" fill="#ffb3c1" font-weight="800">斷電或更新中斷</text><text x="80" y="640" fill="#8fe8ff">控制：原子更新、雙映像、安全開機</text><text x="80" y="680" fill="#c8bbff">證據：故障注入與復原測試</text><text x="80" y="810" fill="#ffb3c1" font-weight="800">警報、資料或介接退化</text><text x="80" y="850" fill="#8fe8ff">控制：代表性測試、臨床回歸、監測</text><text x="80" y="890" fill="#c8bbff">證據：功能與病人流程簽核</text><text x="80" y="1020" fill="#ffb3c1" font-weight="800">回退失敗或降級不安全</text><text x="80" y="1060" fill="#8fe8ff">控制：可信復原、版本政策、離線替代</text><text x="80" y="1100" fill="#c8bbff">證據：回退時間與替代流程演練</text></g></g></svg>