<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療 AI Agent 分階段導入與核准流程</title><desc id="desc">從用途分級、沙箱測試、人工確認、有限上線到持續監測與停用的六階段流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172047"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#66e4ff"/></marker></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/>
<text x="64" y="70" fill="#fff" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="800">從低風險用途建立 AI Agent 控制閉環</text><text x="64" y="108" fill="#a8bad8" font-family="Noto Sans TC, sans-serif" font-size="20">通過證據門檻才進入下一階段；高風險動作保留人工決定權</text>
<g font-family="Noto Sans TC, sans-serif"><g fill="#142b49" stroke="#64e4ff" stroke-width="2"><rect x="55" y="180" width="170" height="170" rx="24"/><rect x="240" y="180" width="170" height="170" rx="24"/><rect x="425" y="180" width="170" height="170" rx="24"/><rect x="610" y="180" width="170" height="170" rx="24"/><rect x="795" y="180" width="170" height="170" rx="24"/><rect x="980" y="180" width="170" height="170" rx="24"/></g>
<g fill="#72e9ff" font-size="18" font-weight="700"><text x="78" y="215">01</text><text x="263" y="215">02</text><text x="448" y="215">03</text><text x="633" y="215">04</text><text x="818" y="215">05</text><text x="1003" y="215">06</text></g>
<g fill="#fff" font-size="23" font-weight="750" text-anchor="middle"><text x="140" y="255">用途分級</text><text x="325" y="255">權限設計</text><text x="510" y="255">沙箱攻防</text><text x="695" y="255">確認閘門</text><text x="880" y="255">有限上線</text><text x="1065" y="255">監測停用</text></g>
<g fill="#c5d7ec" font-size="17" text-anchor="middle"><text x="140" y="292">資料／臨床影響</text><text x="140" y="319">可逆性與責任人</text><text x="325" y="292">工具白名單</text><text x="325" y="319">最小權限與上限</text><text x="510" y="292">注入與越權測試</text><text x="510" y="319">失敗與回復演練</text><text x="695" y="292">預覽差異</text><text x="695" y="319">具名人員核准</text><text x="880" y="292">小範圍／可回滾</text><text x="880" y="319">量測錯誤與拒絕</text><text x="1065" y="292">異常、漂移、成本</text><text x="1065" y="319">一鍵撤權與停用</text></g>
<g stroke="#66e4ff" stroke-width="4" marker-end="url(#a)"><path d="M225 265h7"/><path d="M410 265h7"/><path d="M595 265h7"/><path d="M780 265h7"/><path d="M965 265h7"/></g>
<rect x="70" y="440" width="1060" height="190" rx="26" fill="#101f3b" stroke="#8f87ff" stroke-width="2"/><text x="105" y="485" fill="#fff" font-size="24" font-weight="750">每階段的最低驗收證據</text>
<g fill="#d5def0" font-size="18"><text x="105" y="530">• 清冊：模型、提示、記憶、工具、資料、版本與責任人可追溯</text><text x="105" y="568">• 權限：每個工具有允許動作、參數限制、有效時間與撤銷路徑</text><text x="105" y="606">• 稽核：可重建誰提出、Agent 如何規劃、誰核准、系統執行了什麼</text><text x="650" y="530">• 安全：提示注入、資料外洩、記憶污染與供應鏈測試</text><text x="650" y="568">• 臨床：人工接管、降級流程、錯誤通知與回復時間</text><text x="650" y="606">• 停用：撤權、停止排程、封存證據且不影響必要服務</text></g></g></svg>