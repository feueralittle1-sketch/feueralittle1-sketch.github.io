<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">醫療緊急修補風險控制矩陣</title><desc id="desc">將立即修補可能破壞證據或臨床服務、延後修補可能遭持續利用，以及無法修補的生命週期風險，對應具體控制與驗收證據。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#142044"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="65" y="70" fill="#f4f8ff" font-size="34" font-weight="700">快修、延後與無法修：三種風險要分別驗收</text><text x="65" y="110" fill="#9fb3d9" font-size="21">風險接受不能只寫「臨床系統不便更新」，必須附替代控制、期限與退出條件</text>
<g font-family="sans-serif"><rect x="55" y="160" width="1090" height="78" rx="20" fill="#122a3e" stroke="#36547c"/><text x="85" y="208" fill="#63e6ff" font-size="23" font-weight="700">決策情境</text><text x="360" y="208" fill="#63e6ff" font-size="23" font-weight="700">主要失敗模式</text><text x="720" y="208" fill="#63e6ff" font-size="23" font-weight="700">控制與驗收證據</text>
<rect x="55" y="252" width="1090" height="108" rx="18" fill="#31243a" stroke="#ff6b91"/><text x="85" y="300" fill="#ff9ab2" font-size="23" font-weight="700">立即修補</text><text x="360" y="292" fill="#e6eefc" font-size="19">覆蓋記憶體與日誌；</text><text x="360" y="324" fill="#e6eefc" font-size="19">更新失敗造成服務中斷</text><text x="720" y="292" fill="#e6eefc" font-size="19">最低證據包、回滾點、臨床檢核</text><text x="720" y="324" fill="#b9c7df" font-size="18">證據：採集清單＋版本與功能結果</text>
<rect x="55" y="375" width="1090" height="108" rx="18" fill="#2d2c3c" stroke="#ffd166"/><text x="85" y="423" fill="#ffd166" font-size="23" font-weight="700">限期延後</text><text x="360" y="415" fill="#e6eefc" font-size="19">攻擊持續、橫向移動；</text><text x="360" y="447" fill="#e6eefc" font-size="19">暫時控制永久化</text><text x="720" y="415" fill="#e6eefc" font-size="19">隔離、入口限制、加強偵測、到期日</text><text x="720" y="447" fill="#b9c7df" font-size="18">證據：阻擋測試＋例外重評紀錄</text>
<rect x="55" y="498" width="1090" height="108" rx="18" fill="#12343a" stroke="#57f0c1"/><text x="85" y="546" fill="#57f0c1" font-size="23" font-weight="700">無法修補</text><text x="360" y="538" fill="#e6eefc" font-size="19">EOL／EOS、設備綁定；</text><text x="360" y="570" fill="#e6eefc" font-size="19">未知風險長期累積</text><text x="720" y="538" fill="#e6eefc" font-size="19">退場路線、替代流程、供應商里程碑</text><text x="720" y="570" fill="#b9c7df" font-size="18">證據：核准預算＋汰換完成條件</text></g>
<text x="600" y="646" text-anchor="middle" fill="#d8e6fa" font-size="20">每一列都要同時回答：誰負責、何時重評、如何證明控制仍有效</text></svg>