<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">醫療威脅情資分享風險與控制</title><desc id="desc">過期、誤判、敏感資訊外洩、自動阻擋及無回饋等風險，對應可驗收控制。</desc><rect width="1200" height="675" rx="32" fill="#07111f"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="62" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">情資不是黑名單：五種失敗與控制</text><g font-size="20"><text x="90" y="125" fill="#ff9fa8" font-weight="800">失敗模式</text><text x="565" y="125" fill="#63e6ff" font-weight="800">控制</text><text x="930" y="125" fill="#57f0c1" font-weight="800">驗收證據</text><g fill="#111f35" stroke="#38506e" stroke-width="2"><rect x="55" y="145" width="1090" height="82" rx="18"/><rect x="55" y="237" width="1090" height="82" rx="18"/><rect x="55" y="329" width="1090" height="82" rx="18"/><rect x="55" y="421" width="1090" height="82" rx="18"/><rect x="55" y="513" width="1090" height="82" rx="18"/></g><g fill="#ffd3d7"><text x="90" y="194">過期 IOC 長期阻擋</text><text x="90" y="286">指標正確但場域不適用</text><text x="90" y="378">分享含病人或內部識別資料</text><text x="90" y="470">自動封鎖中斷臨床服務</text><text x="90" y="562">接收很多，沒有回饋</text></g><g fill="#c9f7ff"><text x="485" y="194">有效期、last-seen、撤銷與重驗</text><text x="485" y="286">資產、版本、曝險與臨床關聯</text><text x="485" y="378">欄位白名單、去識別、人工複核</text><text x="485" y="470">分級門檻、例外清單、回退設計</text><text x="485" y="562">處置責任、結果回傳、品質評分</text></g><g fill="#caffeb"><text x="885" y="194">過期自動停用率</text><text x="885" y="286">命中與誤報理由</text><text x="885" y="378">遮罩與分享紀錄</text><text x="885" y="470">臨床影響與回退時間</text><text x="885" y="562">關閉率與回饋時效</text></g></g><text x="600" y="640" text-anchor="middle" fill="#ffcf99" font-size="21">先驗證「是否與本院有關」，再決定「要不要做」與「能否自動做」</text></g></svg>