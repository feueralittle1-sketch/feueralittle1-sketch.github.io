<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療資安能力覆蓋建立流程</title><desc id="desc">醫院依序盤點關鍵任務、映射工作角色、配置主備人員、補足能力、執行輪值演練，再以證據更新覆蓋狀態。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#101537"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="68" y="74" fill="#fff" font-size="34" font-weight="800">九十日建立可驗證的能力覆蓋</text><text x="68" y="113" fill="#9fb3d9" font-size="20">不是先補職缺，而是先確認哪些臨床關鍵任務不能中斷</text><g fill="#102b42" stroke="#63e6ff" stroke-width="2"><rect x="70" y="210" width="160" height="165" rx="24"/><rect x="255" y="210" width="160" height="165" rx="24"/><rect x="440" y="210" width="160" height="165" rx="24"/><rect x="625" y="210" width="160" height="165" rx="24"/><rect x="810" y="210" width="160" height="165" rx="24"/><rect x="995" y="210" width="140" height="165" rx="24"/></g><g fill="#fff" font-size="21" font-weight="800" text-anchor="middle"><text x="150" y="257">1 任務盤點</text><text x="335" y="257">2 角色映射</text><text x="520" y="257">3 主備配置</text><text x="705" y="257">4 能力補強</text><text x="890" y="257">5 輪值演練</text><text x="1065" y="257">6 證據更新</text></g><g fill="#b9c9e5" font-size="16" text-anchor="middle"><text x="150" y="302">服務、時效</text><text x="150" y="329">權限、依賴</text><text x="335" y="302">任務、知識</text><text x="335" y="329">技能、責任</text><text x="520" y="302">主責、備援</text><text x="520" y="329">外包、升級</text><text x="705" y="302">訓練、跟班</text><text x="705" y="329">程序、工具</text><text x="890" y="302">夜班、休假</text><text x="890" y="329">跨組交接</text><text x="1065" y="302">時間、品質</text><text x="1065" y="329">缺口、改善</text></g><g stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M230 292H245"/><path d="M415 292H430"/><path d="M600 292H615"/><path d="M785 292H800"/><path d="M970 292H985"/></g><rect x="115" y="485" width="970" height="135" rx="28" fill="#191f4b" stroke="#a997ff" stroke-width="2"/><text x="600" y="530" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">最低驗收：指定情境可由備援人員在目標時間內完成</text><text x="600" y="569" text-anchor="middle" fill="#c9c2ff" font-size="18">包含告警研判、升級、停權、證據保全、降級協調與復原驗收</text><text x="600" y="599" text-anchor="middle" fill="#9fb3d9" font-size="16">失敗結果轉成訓練、程序、權限或供應商契約的改善項目</text></g></svg>