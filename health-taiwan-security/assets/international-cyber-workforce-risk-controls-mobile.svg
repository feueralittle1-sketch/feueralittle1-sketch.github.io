<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1250" role="img" aria-labelledby="title desc"><title id="title">醫療資安人力單點風險與控制矩陣手機版</title><desc id="desc">四種人力單點風險及其控制與驗收證據的手機版矩陣。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#11163a"/></linearGradient></defs><rect width="720" height="1250" rx="30" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="48" y="65" fill="#fff" font-size="31" font-weight="800">人力單點風險</text><text x="48" y="103" fill="#9fb3d9" font-size="18">用情境測試控制是否真的有效</text><g><rect x="55" y="145" width="610" height="235" rx="24" fill="#102033" stroke="#ff7eb6"/><text x="85" y="190" fill="#ffd2e5" font-size="22" font-weight="800">只有一人懂關鍵平台</text><text x="85" y="234" fill="#d8f8ff" font-size="18">控制：主備雙人、跟班、程序化</text><text x="85" y="275" fill="#e4dfff" font-size="18">驗收：備援者完成停權或復原</text><text x="85" y="330" fill="#9fb3d9" font-size="16">主責休假時仍可在目標時間內處置</text></g><g><rect x="55" y="410" width="610" height="235" rx="24" fill="#102033" stroke="#63e6ff"/><text x="85" y="455" fill="#ffd2e5" font-size="22" font-weight="800">外包服務內容不透明</text><text x="85" y="499" fill="#d8f8ff" font-size="18">控制：角色、日誌、升級寫入契約</text><text x="85" y="540" fill="#e4dfff" font-size="18">驗收：告警可追到處置與回報</text><text x="85" y="595" fill="#9fb3d9" font-size="16">院內仍掌握優先序與風險接受</text></g><g><rect x="55" y="675" width="610" height="235" rx="24" fill="#102033" stroke="#a997ff"/><text x="85" y="720" fill="#ffd2e5" font-size="22" font-weight="800">分析員不懂臨床優先序</text><text x="85" y="764" fill="#d8f8ff" font-size="18">控制：臨床情境訓練與服務地圖</text><text x="85" y="805" fill="#e4dfff" font-size="18">驗收：高影響告警正確升級</text><text x="85" y="860" fill="#9fb3d9" font-size="16">技術嚴重度與病人安全後果一起判斷</text></g><g><rect x="55" y="940" width="610" height="235" rx="24" fill="#102033" stroke="#7cebd5"/><text x="85" y="985" fill="#ffd2e5" font-size="22" font-weight="800">交班與特權集中同一人</text><text x="85" y="1029" fill="#d8f8ff" font-size="18">控制：職務分離、限時權限、清單</text><text x="85" y="1070" fill="#e4dfff" font-size="18">驗收：夜班交接完整且操作可歸責</text><text x="85" y="1125" fill="#9fb3d9" font-size="16">每季抽測一次主責缺席情境</text></g></g></svg>