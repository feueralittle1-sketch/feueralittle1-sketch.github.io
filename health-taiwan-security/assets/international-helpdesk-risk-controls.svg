<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療服務台冒名風險與控制對照</title><desc id="desc">來電顯示偽造、深偽聲像、疲勞轟炸、內部資料冒用與緊急壓力，分別對應回撥、持有證明、冷卻、資料最小化及雙人核准控制。</desc><rect width="1200" height="680" rx="34" fill="#08182d"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="72" fill="#f7fbff" font-size="34" font-weight="800">五種冒名手法，不能只靠「多問幾題」</text><text x="60" y="108" fill="#9fb7d5" font-size="19">控制焦點從辨認聲音，移到攻擊者難以同時取得的院方證據</text><text x="90" y="164" fill="#ff9fd0" font-size="22" font-weight="800">攻擊手法</text><text x="472" y="164" fill="#63e6ff" font-size="22" font-weight="800">主要控制</text><text x="870" y="164" fill="#72f5cd" font-size="22" font-weight="800">驗收訊號</text><g font-size="18"><rect x="60" y="188" width="1080" height="76" rx="18" fill="#142942"/><text x="90" y="235" fill="#f4d4e5">偽造來電顯示／轉接</text><text x="472" y="235" fill="#dcecff">回撥已登錄院內號碼</text><text x="870" y="235" fill="#dffff5">回撥來源與接聽人可追溯</text><rect x="60" y="276" width="1080" height="76" rx="18" fill="#183149"/><text x="90" y="323" fill="#f4d4e5">深偽聲音／視訊</text><text x="472" y="323" fill="#dcecff">既有受管裝置持有證明</text><text x="870" y="323" fill="#dffff5">原裝置完成加密確認</text><rect x="60" y="364" width="1080" height="76" rx="18" fill="#142942"/><text x="90" y="411" fill="#f4d4e5">MFA 疲勞與急迫催促</text><text x="472" y="411" fill="#dcecff">拒絕推播轟炸＋冷卻時間</text><text x="870" y="411" fill="#dffff5">期間無例外繞過與重複核發</text><rect x="60" y="452" width="1080" height="76" rx="18" fill="#183149"/><text x="90" y="499" fill="#f4d4e5">利用外洩人資／病歷資訊</text><text x="472" y="499" fill="#dcecff">不以靜態個資作唯一驗證</text><text x="870" y="499" fill="#dffff5">驗證題不含可公開或遭竊資料</text><rect x="60" y="540" width="1080" height="76" rx="18" fill="#142942"/><text x="90" y="587" fill="#f4d4e5">假冒主管／醫師施壓</text><text x="472" y="587" fill="#dcecff">雙人核准＋原使用者通知</text><text x="870" y="587" fill="#dffff5">核准、通知與撤銷均有紀錄</text></g></g></svg>