<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫院私有 5G 的身分、網路平面與臨床服務架構</title>
<desc id="desc">醫療設備與行動工作站經受控 SIM 或 eSIM 連入基地台，5G 核心將資料平面、控制平面及維運平面隔離，再以政策閘道連接臨床服務；身分、監控與備援回傳路徑位於獨立控制區。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="64" y="72" fill="#fff" font-size="34" font-weight="700">私有 5G 不是獨立安全島：四個邊界要一起驗收</text><text x="64" y="109" fill="#a8bad8" font-size="20">裝置身分、5G 核心、臨床區域與外部依賴必須可隔離、可觀測、可切換</text>
<rect x="55" y="175" width="235" height="245" rx="26" fill="#112d44" stroke="#63e6ff" stroke-width="3"/><text x="172" y="220" text-anchor="middle" fill="#63e6ff" font-size="19" font-weight="700">裝置與無線接取</text><text x="172" y="265" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">醫療設備</text><text x="172" y="303" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">行動工作站</text><text x="172" y="348" text-anchor="middle" fill="#b9c9e3" font-size="18">SIM／eSIM・憑證</text><text x="172" y="380" text-anchor="middle" fill="#b9c9e3" font-size="18">基地台・射頻涵蓋</text>
<rect x="355" y="155" width="340" height="285" rx="26" fill="#24234f" stroke="#a997ff" stroke-width="3"/><text x="525" y="202" text-anchor="middle" fill="#c9beff" font-size="19" font-weight="700">私有 5G 核心</text><rect x="390" y="230" width="270" height="50" rx="14" fill="#142f4a"/><text x="525" y="263" text-anchor="middle" fill="#fff" font-size="20">資料平面｜臨床流量</text><rect x="390" y="297" width="270" height="50" rx="14" fill="#30283f"/><text x="525" y="330" text-anchor="middle" fill="#fff" font-size="20">控制平面｜連線狀態</text><rect x="390" y="364" width="270" height="50" rx="14" fill="#34203d"/><text x="525" y="397" text-anchor="middle" fill="#fff" font-size="20">維運平面｜管理指令</text>
<rect x="760" y="175" width="385" height="245" rx="26" fill="#113b39" stroke="#57f0c1" stroke-width="3"/><text x="952" y="220" text-anchor="middle" fill="#8bf7d8" font-size="19" font-weight="700">政策閘道與臨床區域</text><text x="952" y="269" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">設備服務區</text><text x="952" y="307" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">行動照護區</text><text x="952" y="352" text-anchor="middle" fill="#bafbe7" font-size="18">只允許必要目的地與協定</text><text x="952" y="384" text-anchor="middle" fill="#bafbe7" font-size="18">避免直接進入核心病歷區</text>
<path d="M290 297H345" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M695 297H750" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="105" y="520" width="990" height="125" rx="26" fill="#10263d" stroke="#ffd37a" stroke-width="3"/><text x="600" y="558" text-anchor="middle" fill="#ffe4a8" font-size="21" font-weight="700">獨立控制區</text><text x="600" y="597" text-anchor="middle" fill="#fff" font-size="22">企業身分與 PKI　｜　5G 遙測與 SOC　｜　設定備份　｜　第二回傳路徑</text><text x="600" y="626" text-anchor="middle" fill="#c9d5ea" font-size="17">回傳中斷時保留核定的本地最低服務；恢復後先驗證狀態，再重新接入臨床網路</text><path d="M525 440V510" stroke="#ffd37a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/></g></svg>