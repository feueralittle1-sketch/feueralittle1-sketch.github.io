<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1370" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備追溯風險與控制對照</title><desc id="desc">垂直列出五種追溯斷點、必要控制及驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#241a38"/></linearGradient></defs><rect width="720" height="1370" rx="28" fill="url(#bg)"/><text x="48" y="70" fill="#fff" font-size="34" font-weight="800">追溯斷點與控制</text><text x="48" y="110" fill="#9fb3d9" font-size="20">每一種斷點都要有可回查的結果</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><g transform="translate(48 150)"><rect width="624" height="205" rx="24" fill="#141d34" stroke="#ff829e" stroke-width="2"/><text x="28" y="43" fill="#ff9fb2" font-size="18" font-weight="800">失敗模式</text><text x="28" y="77" fill="#fff" font-size="25" font-weight="800">同型號多版本錯配</text><text x="28" y="119" fill="#63e6ff" font-size="18" font-weight="800">控制｜唯一鍵＋型號／序號／版本核對</text><text x="28" y="160" fill="#76f6d0" font-size="18" font-weight="800">證據｜抽樣設備可回查實際基線</text></g><g transform="translate(48 376)"><rect width="624" height="205" rx="24" fill="#141d34" stroke="#a997ff" stroke-width="2"/><text x="28" y="43" fill="#ff9fb2" font-size="18" font-weight="800">失敗模式</text><text x="28" y="77" fill="#fff" font-size="25" font-weight="800">SBOM 與部署脫節</text><text x="28" y="119" fill="#63e6ff" font-size="18" font-weight="800">控制｜SBOM 版本化＋設備版本關聯</text><text x="28" y="160" fill="#76f6d0" font-size="18" font-weight="800">證據｜元件查詢命中實際設備</text></g><g transform="translate(48 602)"><rect width="624" height="205" rx="24" fill="#141d34" stroke="#8fa8ff" stroke-width="2"/><text x="28" y="43" fill="#ff9fb2" font-size="18" font-weight="800">失敗模式</text><text x="28" y="77" fill="#fff" font-size="25" font-weight="800">供應商關係斷鏈</text><text x="28" y="119" fill="#63e6ff" font-size="18" font-weight="800">控制｜製造商／維護商／次承包商映射</text><text x="28" y="160" fill="#76f6d0" font-size="18" font-weight="800">證據｜責任與通知路徑可驗證</text></g><g transform="translate(48 828)"><rect width="624" height="205" rx="24" fill="#141d34" stroke="#57f0c1" stroke-width="2"/><text x="28" y="43" fill="#ff9fb2" font-size="18" font-weight="800">失敗模式</text><text x="28" y="77" fill="#fff" font-size="25" font-weight="800">更新或維修漏記</text><text x="28" y="119" fill="#63e6ff" font-size="18" font-weight="800">控制｜事件觸發＋核准、時間與結果留證</text><text x="28" y="160" fill="#76f6d0" font-size="18" font-weight="800">證據｜變更後基線重驗通過</text></g><g transform="translate(48 1054)"><rect width="624" height="245" rx="24" fill="#141d34" stroke="#ffb37a" stroke-width="2"/><text x="28" y="43" fill="#ff9fb2" font-size="18" font-weight="800">失敗模式</text><text x="28" y="77" fill="#fff" font-size="25" font-weight="800">退役後信任仍存續</text><text x="28" y="119" fill="#63e6ff" font-size="18" font-weight="800">控制｜撤銷帳號、憑證與遠端通道</text><text x="28" y="154" fill="#63e6ff" font-size="18" font-weight="800">　　　完成資料清除</text><text x="28" y="198" fill="#76f6d0" font-size="18" font-weight="800">證據｜退役清單與撤銷紀錄一致</text></g></g></svg>