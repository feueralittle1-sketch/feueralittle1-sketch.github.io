<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療邊界設備風險與驗收證據對照</title><desc id="desc">未知曝險、管理面接管、日誌不足與設備不可信四類風險，分別對應外部清冊、隔離管理、遠端證據與可信重建控制及驗收資料。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17234b"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="64" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">每項控制都要留下可查核的驗收證據</text><text x="600" y="104" text-anchor="middle" fill="#9fb3d9" font-size="20">只看到「設備已上線」不足以證明曝險受控、事件可查或系統可重建</text>
<g font-size="22" font-weight="700"><rect x="45" y="150" width="300" height="82" rx="20" fill="#4a2432" stroke="#fb7185" stroke-width="2"/><text x="195" y="199" text-anchor="middle" fill="#fecdd3">風險</text><rect x="385" y="150" width="350" height="82" rx="20" fill="#123b60" stroke="#63e6ff" stroke-width="2"/><text x="560" y="199" text-anchor="middle" fill="#cffafe">控制</text><rect x="775" y="150" width="380" height="82" rx="20" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="965" y="199" text-anchor="middle" fill="#d1fae5">驗收證據</text></g>
<g fill="#e6eefc" font-size="20"><g><rect x="45" y="250" width="300" height="88" rx="18" fill="#311c29"/><text x="75" y="286">未知網址或舊介面</text><text x="75" y="317" fill="#fda4af">未納管的公開入口</text><rect x="385" y="250" width="350" height="88" rx="18" fill="#102c4b"/><text x="415" y="286">內外部雙向發現</text><text x="415" y="317" fill="#bae6fd">資產責任與到期日</text><rect x="775" y="250" width="380" height="88" rx="18" fill="#123a35"/><text x="805" y="286">外部重掃結果</text><text x="805" y="317" fill="#a7f3d0">未知資產關閉時間</text></g>
<g><rect x="45" y="355" width="300" height="88" rx="18" fill="#311c29"/><text x="75" y="391">管理介面遭接管</text><text x="75" y="422" fill="#fda4af">共用帳號與公開管理</text><rect x="385" y="355" width="350" height="88" rx="18" fill="#102c4b"/><text x="415" y="391">隔離管理網段與強驗證</text><text x="415" y="422" fill="#bae6fd">即時權限及雙人覆核</text><rect x="775" y="355" width="380" height="88" rx="18" fill="#123a35"/><text x="805" y="391">登入路徑測試</text><text x="805" y="422" fill="#a7f3d0">過期與共用帳號為零</text></g>
<g><rect x="45" y="460" width="300" height="88" rx="18" fill="#311c29"/><text x="75" y="496">事件後無法定界</text><text x="75" y="527" fill="#fda4af">本機日誌遭刪或不足</text><rect x="385" y="460" width="350" height="88" rx="18" fill="#102c4b"/><text x="415" y="496">遠端日誌與狀態快照</text><text x="415" y="527" fill="#bae6fd">時間同步及保留政策</text><rect x="775" y="460" width="380" height="88" rx="18" fill="#123a35"/><text x="805" y="496">事件重演成功率</text><text x="805" y="527" fill="#a7f3d0">日誌缺口與取證時間</text></g>
<g><rect x="45" y="565" width="300" height="88" rx="18" fill="#311c29"/><text x="75" y="601">設備是否可信不明</text><text x="75" y="632" fill="#fda4af">只重開機未清除持久化</text><rect x="385" y="565" width="350" height="88" rx="18" fill="#102c4b"/><text x="415" y="601">原廠映像可信重建</text><text x="415" y="632" fill="#bae6fd">組態還原與金鑰輪替</text><rect x="775" y="565" width="380" height="88" rx="18" fill="#123a35"/><text x="805" y="601">重建時間與基線比對</text><text x="805" y="632" fill="#a7f3d0">服務及臨床路徑複驗</text></g></g></g></svg>
