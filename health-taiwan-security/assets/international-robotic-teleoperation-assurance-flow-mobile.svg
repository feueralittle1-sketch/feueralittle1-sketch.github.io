<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1045" role="img" aria-labelledby="title desc"><title id="title">手機版遠端醫療機器人六階段驗收</title><desc id="desc">從用途界定到持續監測的六階段驗收流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1045" rx="28" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">遠端醫療機器人六階段驗收</text><text x="38" y="98" fill="#9fb7d5" font-size="18">每一層都需要可量測的放行條件</text><rect x="45" y="140" width="630" height="118" rx="22" fill="#173b5d" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="190" fill="#ffffff" font-size="22" font-weight="800">1. 界定臨床用途</text><text x="72" y="226" fill="#d8e5f7" font-size="18" font-weight="400">程序、病人、地點與責任</text><rect x="45" y="285" width="630" height="118" rx="22" fill="#19443e" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="335" fill="#ffffff" font-size="22" font-weight="800">2. 建立危害模型</text><text x="72" y="371" fill="#d8e5f7" font-size="18" font-weight="400">誤指令、延遲、斷線、冒名</text><rect x="45" y="430" width="630" height="118" rx="22" fill="#4a3420" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="480" fill="#ffffff" font-size="22" font-weight="800">3. 驗證控制鏈</text><text x="72" y="516" fill="#d8e5f7" font-size="18" font-weight="400">身分、授權、簽章、版本</text><rect x="45" y="575" width="630" height="118" rx="22" fill="#332657" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="625" fill="#ffffff" font-size="22" font-weight="800">4. 測試網路壓力</text><text x="72" y="661" fill="#d8e5f7" font-size="18" font-weight="400">延遲、抖動、遺失、切換</text><rect x="45" y="720" width="630" height="118" rx="22" fill="#123c55" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="770" fill="#ffffff" font-size="22" font-weight="800">5. 演練接管降級</text><text x="72" y="806" fill="#d8e5f7" font-size="18" font-weight="400">安全停止、在地接管、替代處置</text><rect x="45" y="865" width="630" height="118" rx="22" fill="#263952" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="915" fill="#ffffff" font-size="22" font-weight="800">6. 持續監測重驗</text><text x="72" y="951" fill="#d8e5f7" font-size="18" font-weight="400">異常、更新、供應商與事件</text></g></svg>