<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備供應鏈可追溯證據鏈</title><desc id="desc">以垂直流程呈現唯一識別、元件來源、供應關係、院內部署與生命週期事件。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#13244a"/></linearGradient></defs><rect width="720" height="1320" rx="28" fill="url(#bg)"/><text x="48" y="72" fill="#fff" font-size="34" font-weight="800">醫療設備供應鏈</text><text x="48" y="112" fill="#63e6ff" font-size="34" font-weight="800">可追溯證據鏈</text><text x="48" y="153" fill="#9fb3d9" font-size="20">識別、元件、來源、部署、變更必須互相查回</text><path d="M92 230V1060" stroke="#63e6ff" stroke-width="5" opacity=".55"/><g font-family="Arial, 'Noto Sans TC', sans-serif"><g transform="translate(54 196)"><circle cx="38" cy="42" r="30" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="38" y="50" fill="#63e6ff" text-anchor="middle" font-size="20" font-weight="800">01</text><rect x="90" width="560" height="154" rx="22" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="122" y="48" fill="#fff" font-size="27" font-weight="800">唯一識別</text><text x="122" y="88" fill="#c6d4eb" font-size="20">院內資產編號、UDI、型號、序號</text><text x="122" y="120" fill="#c6d4eb" font-size="20">批次與實際版本</text></g><g transform="translate(54 380)"><circle cx="38" cy="42" r="30" fill="#24345d" stroke="#8fa8ff" stroke-width="3"/><text x="38" y="50" fill="#b6c4ff" text-anchor="middle" font-size="20" font-weight="800">02</text><rect x="90" width="560" height="154" rx="22" fill="#122749" stroke="#8fa8ff" stroke-width="2"/><text x="122" y="48" fill="#fff" font-size="27" font-weight="800">元件來源</text><text x="122" y="88" fill="#c6d4eb" font-size="20">SBOM、韌體、套件與版本</text><text x="122" y="120" fill="#c6d4eb" font-size="20">來源、格式與產生時間</text></g><g transform="translate(54 564)"><circle cx="38" cy="42" r="30" fill="#342d5d" stroke="#a997ff" stroke-width="3"/><text x="38" y="50" fill="#c7baff" text-anchor="middle" font-size="20" font-weight="800">03</text><rect x="90" width="560" height="154" rx="22" fill="#162749" stroke="#a997ff" stroke-width="2"/><text x="122" y="48" fill="#fff" font-size="27" font-weight="800">供應關係</text><text x="122" y="88" fill="#c6d4eb" font-size="20">製造商、維護商、次承包商</text><text x="122" y="120" fill="#c6d4eb" font-size="20">責任範圍與聯絡窗口</text></g><g transform="translate(54 748)"><circle cx="38" cy="42" r="30" fill="#174c45" stroke="#57f0c1" stroke-width="3"/><text x="38" y="50" fill="#76f6d0" text-anchor="middle" font-size="20" font-weight="800">04</text><rect x="90" width="560" height="154" rx="22" fill="#102d3b" stroke="#57f0c1" stroke-width="2"/><text x="122" y="48" fill="#fff" font-size="27" font-weight="800">院內部署</text><text x="122" y="88" fill="#c6d4eb" font-size="20">位置、網段、介接與臨床用途</text><text x="122" y="120" fill="#c6d4eb" font-size="20">責任單位與替代流程</text></g><g transform="translate(54 932)"><circle cx="38" cy="42" r="30" fill="#563a37" stroke="#ffb37a" stroke-width="3"/><text x="38" y="50" fill="#ffc99e" text-anchor="middle" font-size="20" font-weight="800">05</text><rect x="90" width="560" height="154" rx="22" fill="#2b253d" stroke="#ffb37a" stroke-width="2"/><text x="122" y="48" fill="#fff" font-size="27" font-weight="800">生命週期</text><text x="122" y="88" fill="#c6d4eb" font-size="20">驗收、更新、維修、事件與召回</text><text x="122" y="120" fill="#c6d4eb" font-size="20">退役與證據封存</text></g></g><rect x="48" y="1142" width="624" height="126" rx="24" fill="#0c1d34" stroke="#63e6ff" stroke-width="2"/><text x="360" y="1184" fill="#63e6ff" font-size="22" font-weight="800" text-anchor="middle">治理驗收</text><text x="360" y="1222" fill="#e6eefc" font-size="20" text-anchor="middle">由漏洞、批次或供應商</text><text x="360" y="1252" fill="#e6eefc" font-size="20" text-anchor="middle">反查全部受影響設備</text></svg>