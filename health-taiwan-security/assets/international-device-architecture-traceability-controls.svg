<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療設備安全架構追蹤與風險控制圖</title><desc id="desc">文件過時、介面漏列、安全假設未測與責任不清四種風險，分別對應版本基線、逐條通訊追蹤、負向測試與責任期限控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="55" y="70" fill="#f7fbff" font-size="34" font-weight="800">四種常見失真，必須以證據控制關閉</text><text x="55" y="108" fill="#9fb7d5" font-size="19">驗收焦點是「圖是否仍代表實際設備」，不是文件是否存在</text><rect x="55" y="155" width="470" height="430" rx="28" fill="#3d2438" stroke="#ff8fc8" stroke-width="2"/><text x="90" y="203" fill="#ff9fd0" font-size="25" font-weight="800">失真風險</text><g fill="#f7d9e9" font-size="20"><text x="90" y="265">① 圖面版本落後實際韌體或雲端服務</text><text x="90" y="335">② 未列出維護、遙測或更新介面</text><text x="90" y="405">③ 加密、驗證與降級假設未經測試</text><text x="90" y="475">④ 缺口只有備註，沒有責任人與期限</text></g><rect x="675" y="155" width="470" height="430" rx="28" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="710" y="203" fill="#72f5cd" font-size="25" font-weight="800">關閉證據</text><g fill="#ddfff4" font-size="20"><text x="710" y="265">① 型號、版本、雜湊與變更觸發基線</text><text x="710" y="335">② 通訊矩陣、埠、方向、資料與日誌</text><text x="710" y="405">③ 負向測試、斷線、逾時與回退結果</text><text x="710" y="475">④ 補償控制、核准者、期限與重驗日</text></g><g stroke="#8fe8ff" stroke-width="4"><path d="M525 260h150"/><path d="M525 330h150"/><path d="M525 400h150"/><path d="M525 470h150"/></g><g fill="#8fe8ff"><polygon points="675,260 657,250 657,270"/><polygon points="675,330 657,320 657,340"/><polygon points="675,400 657,390 657,410"/><polygon points="675,470 657,460 657,480"/></g><rect x="180" y="610" width="840" height="42" rx="20" fill="#112e4d"/><text x="600" y="638" text-anchor="middle" fill="#8fe8ff" font-size="18" font-weight="800">任何更新、介面、身分或部署邊界變更，都應觸發圖面與測試同步重驗</text></g></svg>