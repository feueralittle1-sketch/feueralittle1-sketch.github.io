<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療雲端資料主權控制邊界圖</title><desc id="desc">區分資料落地、資料主權、金鑰控制、次處理者與退出能力，說明資料位於特定地區不等於機構保有完整控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#102547"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#eaf6ff" font-size="34" font-weight="700">資料放在哪裡，只是主權治理的第一層</text><text x="60" y="108" fill="#9fb8d8" font-size="19">醫療機構需同時掌握法域、存取、供應鏈與可退出證據</text>
<g font-family="Arial, Noto Sans TC, sans-serif"><rect x="70" y="160" width="250" height="410" rx="26" fill="#102d48" stroke="#38d6ff" stroke-width="3"/><text x="195" y="208" fill="#72e7ff" text-anchor="middle" font-size="24" font-weight="700">醫療機構</text><text x="195" y="260" fill="#eef8ff" text-anchor="middle" font-size="20">資料分類與用途</text><text x="195" y="308" fill="#eef8ff" text-anchor="middle" font-size="20">身分與權限政策</text><text x="195" y="356" fill="#eef8ff" text-anchor="middle" font-size="20">風險接受與簽核</text><text x="195" y="404" fill="#eef8ff" text-anchor="middle" font-size="20">臨床持續運作</text><rect x="105" y="468" width="180" height="62" rx="18" fill="#0b2038" stroke="#67f0c2"/><text x="195" y="507" fill="#67f0c2" text-anchor="middle" font-size="20" font-weight="700">控制責任不外包</text>
<path d="M320 365H395" stroke="#72e7ff" stroke-width="5" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72e7ff"/></marker></defs>
<rect x="400" y="145" width="370" height="440" rx="30" fill="#17284d" stroke="#8d8cff" stroke-width="3"/><text x="585" y="195" fill="#c7c4ff" text-anchor="middle" font-size="25" font-weight="700">雲端服務控制面</text><g font-size="19"><rect x="445" y="230" width="280" height="58" rx="16" fill="#202f5a"/><text x="585" y="267" fill="#fff" text-anchor="middle">data residency｜儲存與處理位置</text><rect x="445" y="308" width="280" height="58" rx="16" fill="#202f5a"/><text x="585" y="345" fill="#fff" text-anchor="middle">data sovereignty｜適用法域與控制權</text><rect x="445" y="386" width="280" height="58" rx="16" fill="#202f5a"/><text x="585" y="423" fill="#fff" text-anchor="middle">BYOK／HYOK｜金鑰邊界</text><rect x="445" y="464" width="280" height="58" rx="16" fill="#202f5a"/><text x="585" y="501" fill="#fff" text-anchor="middle">稽核日誌｜證據可取得性</text></g>
<path d="M770 365H840" stroke="#ffbe68" stroke-width="5" marker-end="url(#arrow2)"/><defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffbe68"/></marker></defs>
<rect x="845" y="160" width="285" height="410" rx="26" fill="#302844" stroke="#ffbe68" stroke-width="3"/><text x="988" y="208" fill="#ffd08b" text-anchor="middle" font-size="24" font-weight="700">外部依賴</text><text x="988" y="262" fill="#fff" text-anchor="middle" font-size="20">次處理者與支援地點</text><text x="988" y="310" fill="#fff" text-anchor="middle" font-size="20">跨境備援與遙測</text><text x="988" y="358" fill="#fff" text-anchor="middle" font-size="20">外國政府調取風險</text><text x="988" y="406" fill="#fff" text-anchor="middle" font-size="20">供應商集中與鎖定</text><rect x="885" y="468" width="205" height="62" rx="18" fill="#2b2035" stroke="#ff8e9e"/><text x="988" y="507" fill="#ff9cab" text-anchor="middle" font-size="20" font-weight="700">契約＋技術共同約束</text></g>
<text x="600" y="650" fill="#a9bdd8" text-anchor="middle" font-size="19">驗收問題：誰能讀取？受哪個法域約束？金鑰由誰控制？資料與服務能否在期限內移轉？</text></svg>