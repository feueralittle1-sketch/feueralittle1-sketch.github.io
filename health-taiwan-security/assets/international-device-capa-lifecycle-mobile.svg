<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安 CAPA 七階段生命週期手機版</title><desc id="desc">七個直向階段展示資安異常如何從偵測走到有效性驗證與證據關閉。</desc><rect width="1200" height="1600" fill="#081426"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="600" y="88" text-anchor="middle" fill="#fff" font-size="42" font-weight="700">資安 CAPA 七階段閉環</text><g font-size="30"><g transform="translate(150 150)"><rect width="900" height="145" rx="28" fill="#153a55" stroke="#63e6ff" stroke-width="3"/><text x="55" y="62" fill="#63e6ff" font-weight="700">01 偵測與建檔</text><text x="55" y="108" fill="#e8f6ff">保留來源、時間、版本與初步影響</text></g><g transform="translate(150 335)"><rect width="900" height="145" rx="28" fill="#173553" stroke="#71a7ff" stroke-width="3"/><text x="55" y="62" fill="#9bc2ff" font-weight="700">02 定界</text><text x="55" y="108" fill="#e8f0ff">確認設備、軟體版本、場域與臨床流程</text></g><g transform="translate(150 520)"><rect width="900" height="145" rx="28" fill="#26375d" stroke="#a997ff" stroke-width="3"/><text x="55" y="62" fill="#c7baff" font-weight="700">03 風險分級</text><text x="55" y="108" fill="#eeeaff">同時評估病人安全、資料與營運衝擊</text></g><g transform="translate(150 705)"><rect width="900" height="145" rx="28" fill="#3b315e" stroke="#d99cff" stroke-width="3"/><text x="55" y="62" fill="#edc7ff" font-weight="700">04 根因分析</text><text x="55" y="108" fill="#faefff">區分產品缺陷、流程缺口與部署條件</text></g><g transform="translate(150 890)"><rect width="900" height="145" rx="28" fill="#164451" stroke="#57f0c1" stroke-width="3"/><text x="55" y="62" fill="#86f7d3" font-weight="700">05 矯正與預防</text><text x="55" y="108" fill="#e9fff8">修補、補償控制、通知與流程改善</text></g><g transform="translate(150 1075)"><rect width="900" height="145" rx="28" fill="#164451" stroke="#57f0c1" stroke-width="3"/><text x="55" y="62" fill="#86f7d3" font-weight="700">06 有效性驗證</text><text x="55" y="108" fill="#e9fff8">安全測試、臨床回歸、回退與監測</text></g><g transform="translate(150 1260)"><rect width="900" height="145" rx="28" fill="#24424a" stroke="#f6c85f" stroke-width="3"/><text x="55" y="62" fill="#ffe08c" font-weight="700">07 證據關閉與重評</text><text x="55" y="108" fill="#fff8df">確認責任、期限、證明與後續門檻</text></g></g><text x="600" y="1515" text-anchor="middle" fill="#f6c85f" font-size="27">有效性不足或再次發生時，重新定界，不得只補文件。</text></g></svg>