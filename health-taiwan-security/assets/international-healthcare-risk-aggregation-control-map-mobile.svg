<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安風險聚合控制圖</title><desc id="desc">五種風險聚合失真及其治理控制與驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="390" height="1120" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="40" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">風險聚合避免失真</text><text x="195" y="68" text-anchor="middle" fill="#9fb3d9" font-size="14">分數不能取代情境與證據</text><g><rect x="25" y="95" width="340" height="180" rx="20" fill="#101f38" stroke="#ff7aa8" stroke-width="2"/><text x="45" y="130" fill="#ff9fbe" font-size="17" font-weight="800">平均分數掩蓋病安風險</text><text x="45" y="170" fill="#b9edff" font-size="14">控制：重大情境獨立追蹤</text><text x="45" y="207" fill="#caffee" font-size="14">證據：停止條件與影響清單</text><rect x="25" y="292" width="340" height="180" rx="20" fill="#132541" stroke="#a997ff" stroke-width="2"/><text x="45" y="327" fill="#c5baff" font-size="17" font-weight="800">同一事件重複計算</text><text x="45" y="367" fill="#b9edff" font-size="14">控制：共同事件與依賴識別碼</text><text x="45" y="404" fill="#caffee" font-size="14">證據：聚合前後追溯表</text><rect x="25" y="489" width="340" height="180" rx="20" fill="#101f38" stroke="#57f0c1" stroke-width="2"/><text x="45" y="524" fill="#57f0c1" font-size="17" font-weight="800">共同依賴遭遺漏</text><text x="45" y="564" fill="#b9edff" font-size="14">控制：共享服務與集中風險圖</text><text x="45" y="601" fill="#caffee" font-size="14">證據：單點失效與替代測試</text><rect x="25" y="686" width="340" height="180" rx="20" fill="#132541" stroke="#ffb86b" stroke-width="2"/><text x="45" y="721" fill="#ffcf99" font-size="17" font-weight="800">不完整資料造成假精確</text><text x="45" y="761" fill="#b9edff" font-size="14">控制：揭露假設、區間與信心</text><text x="45" y="798" fill="#caffee" font-size="14">證據：來源、日期、不確定性</text><rect x="25" y="883" width="340" height="180" rx="20" fill="#101f38" stroke="#71a7ff" stroke-width="2"/><text x="45" y="918" fill="#a8c8ff" font-size="17" font-weight="800">風險接受逾期未重驗</text><text x="45" y="958" fill="#b9edff" font-size="14">控制：期限、觸發條件、升級人</text><text x="45" y="995" fill="#caffee" font-size="14">證據：重驗或重新核准紀錄</text></g><text x="195" y="1095" text-anchor="middle" fill="#ffcf99" font-size="13">量化結果必須能回到原始情境</text></g></svg>