<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc"><title id="title">醫療稽核紀錄風險控制手機版</title><desc id="desc">四項紀錄風險與其控制措施。</desc><rect width="720" height="1220" fill="#08172c"/><text x="360" y="65" fill="#fff" font-size="31" font-weight="700" text-anchor="middle">失真風險與控制</text><g font-family="sans-serif"><g fill="#421f38" stroke="#ff7bd5" stroke-width="4"><rect x="70" y="115" width="580" height="105" rx="20"/><rect x="70" y="390" width="580" height="105" rx="20"/><rect x="70" y="665" width="580" height="105" rx="20"/><rect x="70" y="940" width="580" height="105" rx="20"/></g><g fill="#123449" stroke="#5ef2b0" stroke-width="4"><rect x="70" y="235" width="580" height="105" rx="20"/><rect x="70" y="510" width="580" height="105" rx="20"/><rect x="70" y="785" width="580" height="105" rx="20"/><rect x="70" y="1060" width="580" height="105" rx="20"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="105" y="178">時間漂移：事件順序錯置</text><text x="105" y="298">共同時源＋偏差監測</text><text x="105" y="453">紀錄缺口：平台中斷即失明</text><text x="105" y="573">緩衝＋遺失告警＋覆蓋測試</text><text x="105" y="728">過度蒐集：敏感資料擴散</text><text x="105" y="848">目的限制＋最小化＋遮罩</text><text x="105" y="1003">管理者竄改：證據不可信</text><text x="105" y="1123">權限分離＋不可變保存</text></g></g></svg>