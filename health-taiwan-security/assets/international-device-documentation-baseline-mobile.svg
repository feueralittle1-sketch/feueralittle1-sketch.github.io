<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全文件轉成院內部署基線</title><desc id="desc">安全文件與院內場域事實經治理閘門形成部署基線與持續證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<rect width="390" height="1040" rx="28" fill="url(#bg)"/>
<text x="195" y="48" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="25" font-weight="700" fill="#f4f8ff">文件 → 基線 → 持續證據</text><g filter="url(#shadow)"><rect x="35" y="82" width="320" height="135" rx="22" fill="#102742" stroke="#7aa7ff" stroke-width="2"/><text x="195.0" y="130" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">製造商文件</text><text x="195.0" y="170" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">MDS2／標示／SBOM</text></g><path d="M195 217 L195 250" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="35" y="262" width="320" height="135" rx="22" fill="#102742" stroke="#5eead4" stroke-width="2"/><text x="195.0" y="310" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">院內場域</text><text x="195.0" y="350" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">版本／網路／用途</text></g><path d="M195 397 L195 430" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="35" y="442" width="320" height="135" rx="22" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="195.0" y="490" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">治理閘門</text><text x="195.0" y="530" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">對齊／驗證／核准</text></g><path d="M195 577 L195 610" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="35" y="622" width="320" height="135" rx="22" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="195.0" y="670" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">部署基線</text><text x="195.0" y="710" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">連線／權限／更新</text></g><path d="M195 757 L195 790" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="35" y="802" width="320" height="135" rx="22" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="195.0" y="850" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">持續證據</text><text x="195.0" y="890" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">監測／變更／退場</text></g></svg>