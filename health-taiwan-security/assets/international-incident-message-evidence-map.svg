<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療資安事件訊息的風險與證據對照</title>
<desc id="desc">過早保證、揭露敏感細節、忽略臨床影響、通訊管道失效及多頭發言五種風險，分別對應未知標示、最小揭露、病人行動資訊、帶外通訊及單一事實來源與留存證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">一句話說錯也會放大事件：風險、控制與證據</text><text x="60" y="108" fill="#a8bad8" font-size="20">訊息品質要能驗收，不只追求發布速度</text>
<text x="90" y="165" fill="#ffb4ca" font-size="21" font-weight="700">失敗模式</text><text x="470" y="165" fill="#8fe8ff" font-size="21" font-weight="700">控制方式</text><text x="900" y="165" fill="#8bf7d8" font-size="21" font-weight="700">可驗收證據</text>
<g font-size="19"><rect x="55" y="190" width="1090" height="82" rx="18" fill="#17283e"/><text x="90" y="240" fill="#fff">過早宣稱「沒有影響」</text><text x="470" y="240" fill="#d8e7f8">區分已確認、未確認與調查中</text><text x="900" y="240" fill="#c7fae9">版本與更正時間</text><rect x="55" y="286" width="1090" height="82" rx="18" fill="#1d2940"/><text x="90" y="336" fill="#fff">揭露攻擊路徑或個資</text><text x="470" y="336" fill="#d8e7f8">依受眾最小揭露，發布前審查</text><text x="900" y="336" fill="#c7fae9">核准者與揭露依據</text><rect x="55" y="382" width="1090" height="82" rx="18" fill="#17283e"/><text x="90" y="432" fill="#fff">只談系統，不談看診影響</text><text x="470" y="432" fill="#d8e7f8">列出取消、延遲、替代入口與行動</text><text x="900" y="432" fill="#c7fae9">臨床與客服簽核</text><rect x="55" y="478" width="1090" height="82" rx="18" fill="#1d2940"/><text x="90" y="528" fill="#fff">郵件或電話同時失效</text><text x="470" y="528" fill="#d8e7f8">預置帶外通訊與紙本聯絡樹</text><text x="900" y="528" fill="#c7fae9">斷網演練紀錄</text><rect x="55" y="574" width="1090" height="82" rx="18" fill="#17283e"/><text x="90" y="624" fill="#fff">不同部門各自發言</text><text x="470" y="624" fill="#d8e7f8">單一事實來源、固定節奏與交班</text><text x="900" y="624" fill="#c7fae9">發布日誌與受眾回饋</text></g></g></svg>
