<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">OAuth 同意釣魚防護與事件處置流程</title><desc id="desc">從應用提出授權、政策判定、管理員核准、持續監測到異常撤權與證據保存的完整流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="64" y="76" fill="#fff" font-size="38" font-weight="800">OAuth 同意釣魚：從申請到撤權復原</text><text x="64" y="116" fill="#9fb3d9" font-size="20">同意前管入口，同意後持續看行為，事件時一次撤除所有持續存取</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><g fill="#112a47" stroke="#63e6ff" stroke-width="2"><rect x="55" y="205" width="190" height="170" rx="22"/><rect x="285" y="205" width="190" height="170" rx="22"/><rect x="515" y="205" width="190" height="170" rx="22"/><rect x="745" y="205" width="190" height="170" rx="22"/><rect x="975" y="205" width="170" height="170" rx="22"/></g><g fill="#fff" text-anchor="middle" font-size="23" font-weight="800"><text x="150" y="255">1. 提出授權</text><text x="380" y="255">2. 政策判定</text><text x="610" y="255">3. 核准放行</text><text x="840" y="255">4. 持續監測</text><text x="1060" y="255">5. 撤權復原</text></g><g fill="#c6d4eb" text-anchor="middle" font-size="18"><text x="150" y="300">應用、發行者</text><text x="150" y="330">要求權限與用途</text><text x="380" y="300">低風險可否同意</text><text x="380" y="330">高風險送審</text><text x="610" y="300">最小權限</text><text x="610" y="330">擁有者與期限</text><text x="840" y="300">新權限、異常 API</text><text x="840" y="330">大量下載與寄信</text><text x="1060" y="300">停用應用</text><text x="1060" y="330">撤銷權杖</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M245 290H285"/><path d="M475 290H515"/><path d="M705 290H745"/><path d="M935 290H975"/></g><rect x="155" y="475" width="890" height="130" rx="24" fill="#172340" stroke="#a997ff" stroke-width="2"/><text x="600" y="520" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">事件證據必須同時保留三條線</text><text x="600" y="562" text-anchor="middle" fill="#c6d4eb" font-size="20">誰同意、何時同意、核准哪些權限　｜　應用實際讀寫哪些資料　｜　撤權、通知與復原是否完成</text><text x="600" y="655" text-anchor="middle" fill="#57f0c1" font-size="21" font-weight="700">驗收：演練可在限定時間內辨識受影響帳號、終止存取並確認沒有殘留權杖</text></g></svg>