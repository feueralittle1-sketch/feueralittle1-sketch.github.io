<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安 CAPA 風險與控制對照</title><desc id="desc">四種常見失敗模式分別對應定界、臨床協調、獨立驗證與持續監測控制。</desc><rect width="1200" height="700" fill="#07111f"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">CAPA 失敗不是少一份文件，而是風險仍留在臨床現場</text><g font-size="20"><text x="80" y="135" fill="#ff9b9b" font-size="24" font-weight="700">失敗模式</text><text x="490" y="135" fill="#9fb3d9" font-size="24" font-weight="700">治理閘門</text><text x="840" y="135" fill="#57f0c1" font-size="24" font-weight="700">可驗收證據</text><g><rect x="60" y="165" width="1080" height="105" rx="20" fill="#10223b"/><text x="90" y="210" fill="#fff">只修單一版本，未定界全部場域</text><text x="500" y="210" fill="#d6e1f5">資產與版本交叉核對</text><text x="850" y="210" fill="#dffff4">受影響清單＋零遺漏簽核</text><text x="90" y="242" fill="#ffaaaa">後果：同型設備持續暴露</text></g><g><rect x="60" y="285" width="1080" height="105" rx="20" fill="#10223b"/><text x="90" y="330" fill="#fff">安全更新未經臨床回歸與回退測試</text><text x="500" y="330" fill="#d6e1f5">資安與醫療品質共同放行</text><text x="850" y="330" fill="#dffff4">測試結果＋回退演練紀錄</text><text x="90" y="362" fill="#ffaaaa">後果：修補造成服務中斷</text></g><g><rect x="60" y="405" width="1080" height="105" rx="20" fill="#10223b"/><text x="90" y="450" fill="#fff">以「已發布修補」直接關閉 CAPA</text><text x="500" y="450" fill="#d6e1f5">獨立有效性驗證</text><text x="850" y="450" fill="#dffff4">複測＋異常門檻＋觀察期</text><text x="90" y="482" fill="#ffaaaa">後果：根因未消除或重複發生</text></g><g><rect x="60" y="525" width="1080" height="105" rx="20" fill="#10223b"/><text x="90" y="570" fill="#fff">製造商結案，但醫院未完成變更</text><text x="500" y="570" fill="#d6e1f5">雙向狀態與責任追蹤</text><text x="850" y="570" fill="#dffff4">院端完成證明＋未完成例外</text><text x="90" y="602" fill="#ffaaaa">後果：紙上關閉、現場未受控</text></g></g><text x="600" y="672" fill="#9fb3d9" text-anchor="middle" font-size="19">每個風險至少要有責任人、期限、測試、臨床驗收與重新開案條件。</text></g></svg>