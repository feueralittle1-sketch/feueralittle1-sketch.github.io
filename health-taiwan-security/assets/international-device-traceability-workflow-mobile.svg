<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1340" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備可追溯性事件流程</title><desc id="desc">垂直呈現到貨、元件、部署、變更、事件與退役六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#172143"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs><rect width="720" height="1340" rx="28" fill="url(#bg)"/><text x="48" y="70" fill="#fff" font-size="34" font-weight="800">事件驅動的追溯流程</text><text x="48" y="110" fill="#9fb3d9" font-size="20">每次部署、更新、維修與退役都更新證據</text><path d="M94 185V1055" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)" opacity=".65"/><g font-family="Arial, 'Noto Sans TC', sans-serif"><g transform="translate(50 150)"><circle cx="44" cy="55" r="31" fill="#183b5a" stroke="#63e6ff" stroke-width="3"/><text x="44" y="63" fill="#63e6ff" text-anchor="middle" font-size="20" font-weight="800">01</text><rect x="100" width="570" height="138" rx="22" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="132" y="48" fill="#fff" font-size="27" font-weight="800">到貨建檔</text><text x="132" y="88" fill="#c6d4eb" font-size="20">識別、採購與驗收關聯</text></g><g transform="translate(50 315)"><circle cx="44" cy="55" r="31" fill="#24345d" stroke="#8fa8ff" stroke-width="3"/><text x="44" y="63" fill="#b6c4ff" text-anchor="middle" font-size="20" font-weight="800">02</text><rect x="100" width="570" height="138" rx="22" fill="#13284a" stroke="#8fa8ff" stroke-width="2"/><text x="132" y="48" fill="#fff" font-size="27" font-weight="800">元件關聯</text><text x="132" y="88" fill="#c6d4eb" font-size="20">SBOM 來源、版本與聲明</text></g><g transform="translate(50 480)"><circle cx="44" cy="55" r="31" fill="#342d5d" stroke="#a997ff" stroke-width="3"/><text x="44" y="63" fill="#c7baff" text-anchor="middle" font-size="20" font-weight="800">03</text><rect x="100" width="570" height="138" rx="22" fill="#172849" stroke="#a997ff" stroke-width="2"/><text x="132" y="48" fill="#fff" font-size="27" font-weight="800">部署核對</text><text x="132" y="88" fill="#c6d4eb" font-size="20">位置、介接、用途與替代流程</text></g><g transform="translate(50 645)"><circle cx="44" cy="55" r="31" fill="#174c45" stroke="#57f0c1" stroke-width="3"/><text x="44" y="63" fill="#76f6d0" text-anchor="middle" font-size="20" font-weight="800">04</text><rect x="100" width="570" height="138" rx="22" fill="#102d3b" stroke="#57f0c1" stroke-width="2"/><text x="132" y="48" fill="#fff" font-size="27" font-weight="800">變更留證</text><text x="132" y="88" fill="#c6d4eb" font-size="20">更新、維修、核准與結果</text></g><g transform="translate(50 810)"><circle cx="44" cy="55" r="31" fill="#563a37" stroke="#ffb37a" stroke-width="3"/><text x="44" y="63" fill="#ffc99e" text-anchor="middle" font-size="20" font-weight="800">05</text><rect x="100" width="570" height="138" rx="22" fill="#3a2e42" stroke="#ffb37a" stroke-width="2"/><text x="132" y="48" fill="#fff" font-size="27" font-weight="800">事件查詢</text><text x="132" y="88" fill="#c6d4eb" font-size="20">漏洞、批次、供應商反查與分流</text></g><g transform="translate(50 975)"><circle cx="44" cy="55" r="31" fill="#5b2c3d" stroke="#ff829e" stroke-width="3"/><text x="44" y="63" fill="#ff9fb2" text-anchor="middle" font-size="20" font-weight="800">06</text><rect x="100" width="570" height="138" rx="22" fill="#3d2934" stroke="#ff829e" stroke-width="2"/><text x="132" y="48" fill="#fff" font-size="27" font-weight="800">退役關閉</text><text x="132" y="88" fill="#c6d4eb" font-size="20">撤權、清除與必要證據封存</text></g></g><rect x="48" y="1168" width="624" height="118" rx="24" fill="#0c1d34" stroke="#63e6ff" stroke-width="2"/><text x="360" y="1211" fill="#63e6ff" font-size="22" font-weight="800" text-anchor="middle">成效驗收</text><text x="360" y="1250" fill="#e6eefc" font-size="20" text-anchor="middle">限定時間內反查完整率＋變更後基線重驗率</text></svg>