<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全更新信任鏈</title><desc id="desc">更新套件由製造商簽署，經院方驗證、隔離測試與臨床放行後部署到設備，獨立證據面保存版本與結果。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13264a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="60" y="72" fill="#f4f8ff" font-size="34" font-weight="800">安全更新不是下載後直接安裝</text><text x="60" y="110" fill="#9fb3d9" font-size="20">來源、完整性、相容性、臨床安全與復原能力必須連成同一條證據鏈</text>
<g font-family="Inter,Noto Sans TC,sans-serif"><g fill="#102744" stroke="#63e6ff" stroke-width="2"><rect x="55" y="185" width="205" height="180" rx="24"/><rect x="305" y="185" width="205" height="180" rx="24"/><rect x="555" y="185" width="205" height="180" rx="24"/><rect x="805" y="185" width="205" height="180" rx="24"/></g>
<g fill="#63e6ff" font-size="18" font-weight="700"><text x="82" y="225">01 製造商發布</text><text x="332" y="225">02 院方驗證</text><text x="582" y="225">03 隔離測試</text><text x="832" y="225">04 受控部署</text></g>
<g fill="#e6eefc" font-size="20"><text x="82" y="270">簽章與雜湊</text><text x="82" y="303">版本與適用型號</text><text x="82" y="336">安全公告與回退條件</text><text x="332" y="270">可信下載來源</text><text x="332" y="303">簽章鏈與完整性</text><text x="332" y="336">SBOM／弱點對應</text><text x="582" y="270">設備功能回歸</text><text x="582" y="303">資料與介接驗證</text><text x="582" y="336">失敗與斷電情境</text><text x="832" y="270">小批次與停止條件</text><text x="832" y="303">臨床雙重驗收</text><text x="832" y="336">監測、回退、結案</text></g>
<g stroke="#71a7ff" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M260 275H295"/><path d="M510 275H545"/><path d="M760 275H795"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71a7ff"/></marker></defs>
<rect x="170" y="445" width="860" height="135" rx="28" fill="#0d213c" stroke="#9c8cff" stroke-width="2"/><text x="205" y="488" fill="#c8bbff" font-size="19" font-weight="700">獨立證據面</text><text x="205" y="528" fill="#e6eefc" font-size="22">保存套件指紋、驗證人、測試結果、部署批次、設備版本、異常、回退與臨床簽核</text><text x="205" y="558" fill="#9fb3d9" font-size="18">證據不應只留在更新平台內，避免平台失效時無法重建更新歷程。</text></g></svg>