<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">醫療資安風險聚合失真與控制對照</title><desc id="desc">分數平均、重複計算、共同依賴遺漏、假精確與風險接受逾期，分別對應治理控制及驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="60" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">風險聚合不等於把分數相加</text><text x="600" y="98" text-anchor="middle" fill="#9fb3d9" font-size="19">常見失真、必要控制與驗收證據</text><g font-size="18"><text x="95" y="145" fill="#ff9fbe" font-size="22" font-weight="800">失敗模式</text><text x="455" y="145" fill="#63e6ff" font-size="22" font-weight="800">治理控制</text><text x="875" y="145" fill="#57f0c1" font-size="22" font-weight="800">驗收證據</text>
<g><rect x="55" y="170" width="1090" height="76" rx="18" fill="#101f38" stroke="#ffffff" stroke-opacity=".12"/><text x="95" y="216" fill="#ffb1cb">高低分平均後掩蓋病安風險</text><text x="455" y="216" fill="#b9edff">保留重大情境與停止條件</text><text x="875" y="216" fill="#caffee">高影響情境獨立追蹤</text><rect x="55" y="262" width="1090" height="76" rx="18" fill="#132541" stroke="#ffffff" stroke-opacity=".12"/><text x="95" y="308" fill="#ffb1cb">同一事件在多系統重複計算</text><text x="455" y="308" fill="#b9edff">使用共同事件與依賴識別碼</text><text x="875" y="308" fill="#caffee">聚合前後可追溯對照</text><rect x="55" y="354" width="1090" height="76" rx="18" fill="#101f38" stroke="#ffffff" stroke-opacity=".12"/><text x="95" y="400" fill="#ffb1cb">忽略雲端、身分與網路共同依賴</text><text x="455" y="400" fill="#b9edff">建立共享服務與集中風險圖</text><text x="875" y="400" fill="#caffee">單點失效與替代路徑測試</text><rect x="55" y="446" width="1090" height="76" rx="18" fill="#132541" stroke="#ffffff" stroke-opacity=".12"/><text x="95" y="492" fill="#ffb1cb">不完整資料產生假精確數值</text><text x="455" y="492" fill="#b9edff">揭露假設、區間與信心程度</text><text x="875" y="492" fill="#caffee">來源、日期與不確定性紀錄</text><rect x="55" y="538" width="1090" height="76" rx="18" fill="#101f38" stroke="#ffffff" stroke-opacity=".12"/><text x="95" y="584" fill="#ffb1cb">風險接受到期但未重新檢視</text><text x="455" y="584" fill="#b9edff">設定期限、觸發條件與升級人</text><text x="875" y="584" fill="#caffee">到期重驗或重新核准紀錄</text></g></g><text x="600" y="650" text-anchor="middle" fill="#ffcf99" font-size="18">任何量化結果都應能回到原始情境、控制狀態與臨床影響</text></g></svg>