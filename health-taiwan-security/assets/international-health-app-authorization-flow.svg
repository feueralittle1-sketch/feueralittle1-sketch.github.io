<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">個人健康 App 病歷交付七步流程</title><desc id="desc">從受理請求、驗證身分、限定範圍、確認目的地、病人告知、受控傳輸到證據結案的流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12264a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="72" fill="#f8fbff" font-size="34" font-weight="800">病歷交付七步流程：每一步都要能驗收</text><text x="70" y="112" fill="#9fb3d9" font-size="19">把授權、API 與事件證據串成單一閉環</text><g font-size="20" text-anchor="middle"><rect x="55" y="190" width="140" height="145" rx="24" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="125" y="235" fill="#63e6ff" font-size="25" font-weight="800">01</text><text x="125" y="280" fill="#fff">受理請求</text><rect x="215" y="190" width="140" height="145" rx="24" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="285" y="235" fill="#63e6ff" font-size="25" font-weight="800">02</text><text x="285" y="280" fill="#fff">驗證身分</text><rect x="375" y="190" width="140" height="145" rx="24" fill="#172b48" stroke="#a997ff" stroke-width="3"/><text x="445" y="235" fill="#c9c0ff" font-size="25" font-weight="800">03</text><text x="445" y="280" fill="#fff">限定範圍</text><rect x="535" y="190" width="140" height="145" rx="24" fill="#172b48" stroke="#a997ff" stroke-width="3"/><text x="605" y="235" fill="#c9c0ff" font-size="25" font-weight="800">04</text><text x="605" y="280" fill="#fff">確認目的地</text><rect x="695" y="190" width="140" height="145" rx="24" fill="#26304c" stroke="#f2c94c" stroke-width="3"/><text x="765" y="235" fill="#ffe58a" font-size="25" font-weight="800">05</text><text x="765" y="280" fill="#fff">顯示告知</text><rect x="855" y="190" width="140" height="145" rx="24" fill="#14343a" stroke="#57f0c1" stroke-width="3"/><text x="925" y="235" fill="#7ff5d2" font-size="25" font-weight="800">06</text><text x="925" y="280" fill="#fff">受控傳輸</text><rect x="1015" y="190" width="140" height="145" rx="24" fill="#14343a" stroke="#57f0c1" stroke-width="3"/><text x="1085" y="235" fill="#7ff5d2" font-size="25" font-weight="800">07</text><text x="1085" y="280" fill="#fff">證據結案</text></g><path d="M195 263H215M355 263H375M515 263H535M675 263H695M835 263H855M995 263H1015" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="90" y="420" width="1020" height="190" rx="28" fill="#0c1b31" stroke="#385d86" stroke-width="2"/><text x="130" y="468" fill="#f8fbff" font-size="24" font-weight="800">驗收證據</text><g fill="#c9d8ee" font-size="20"><text x="130" y="515">• 身分：本人、代理與驗證強度符合風險</text><text x="130" y="560">• 資料：資料集、日期區間、敏感欄位與格式可追溯</text><text x="650" y="515">• 目的地：App、重新導向 URI、端點與憑證已核對</text><text x="650" y="560">• 結果：傳輸成功／失敗、撤權、重試與事件聯絡有紀錄</text></g><text x="600" y="675" text-anchor="middle" fill="#9fb3d9" font-size="18">若身分、範圍或目的地不一致，流程應停在交付前並進入人工例外處理</text></svg>