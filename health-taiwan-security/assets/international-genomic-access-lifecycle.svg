<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">基因資料存取生命週期</title><desc id="desc">從研究申請、雙層核准、隔離分析、輸出審查、持續監控到撤權結案的六階段流程。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102c4c"/></linearGradient><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#75e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#g)"/><text x="60" y="70" fill="#fff" font-size="36" font-weight="800">基因資料存取生命週期：每一步都有核准與關閉證據</text><text x="60" y="112" fill="#9fb8dc" font-size="22">以研究目的、機構責任、技術控制與結果輸出共同限制資料使用</text>
<path d="M120 360H1080" stroke="#29496f" stroke-width="12" stroke-linecap="round"/><g font-family="sans-serif"><g transform="translate(105 0)"><circle cx="0" cy="360" r="58" fill="#12344f" stroke="#66e3ff" stroke-width="4"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">1</text><text x="0" y="382" text-anchor="middle" fill="#fff" font-size="20">申請</text><text x="0" y="462" text-anchor="middle" fill="#d8e6fa" font-size="22">目的與範圍</text></g><g transform="translate(300 0)"><circle cx="0" cy="360" r="58" fill="#1d315d" stroke="#aa98ff" stroke-width="4"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">2</text><text x="0" y="382" text-anchor="middle" fill="#fff" font-size="20">核准</text><text x="0" y="462" text-anchor="middle" fill="#d8e6fa" font-size="22">機構＋資料方</text></g><g transform="translate(495 0)"><circle cx="0" cy="360" r="58" fill="#1d315d" stroke="#aa98ff" stroke-width="4"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">3</text><text x="0" y="382" text-anchor="middle" fill="#fff" font-size="20">分析</text><text x="0" y="462" text-anchor="middle" fill="#d8e6fa" font-size="22">隔離與最小權限</text></g><g transform="translate(690 0)"><circle cx="0" cy="360" r="58" fill="#153b3f" stroke="#72f0c1" stroke-width="4"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">4</text><text x="0" y="382" text-anchor="middle" fill="#fff" font-size="20">輸出</text><text x="0" y="462" text-anchor="middle" fill="#d8e6fa" font-size="22">揭露審查</text></g><g transform="translate(885 0)"><circle cx="0" cy="360" r="58" fill="#4a3520" stroke="#ffbc6b" stroke-width="4"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">5</text><text x="0" y="382" text-anchor="middle" fill="#fff" font-size="20">監控</text><text x="0" y="462" text-anchor="middle" fill="#d8e6fa" font-size="22">異常與再驗證</text></g><g transform="translate(1080 0)"><circle cx="0" cy="360" r="58" fill="#4a2536" stroke="#ff7fa9" stroke-width="4"/><text x="0" y="350" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">6</text><text x="0" y="382" text-anchor="middle" fill="#fff" font-size="20">撤權</text><text x="0" y="462" text-anchor="middle" fill="#d8e6fa" font-size="22">帳號與資料結案</text></g></g>
<rect x="80" y="550" width="1040" height="100" rx="24" fill="#0b1d36" stroke="#29496f"/><text x="600" y="592" text-anchor="middle" fill="#7ee7ff" font-size="24" font-weight="700">停止條件</text><text x="600" y="630" text-anchor="middle" fill="#e6eefc" font-size="22">用途變更、帳號異常、輸出違規、機構責任中斷或研究期限屆滿，立即暫停並調查</text></svg>