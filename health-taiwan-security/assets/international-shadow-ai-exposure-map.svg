<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療影子 AI 的資料與控制曝險地圖</title>
<desc id="desc">臨床與行政人員可能將病歷摘要、影像報告、會議內容或程式碼交給未核准 AI 服務，造成資料留存、模型使用、外掛分享與帳號權限等未知風險；核准閘道以用途、資料、身分及契約控制降低曝險。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/>
<g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">影子 AI 的核心問題：資料與權限離開既有控制面</text><text x="60" y="108" fill="#a8bad8" font-size="20">不是禁止所有 AI，而是讓用途、資料流與責任重新可見</text>
<rect x="55" y="170" width="270" height="330" rx="26" fill="#132d44" stroke="#63e6ff" stroke-width="3"/><text x="190" y="215" text-anchor="middle" fill="#8fe8ff" font-size="22" font-weight="700">院內工作需求</text><text x="85" y="270" fill="#fff" font-size="19">• 病歷摘要與文件整理</text><text x="85" y="318" fill="#fff" font-size="19">• 影像／檢驗報告草擬</text><text x="85" y="366" fill="#fff" font-size="19">• 會議逐字稿與翻譯</text><text x="85" y="414" fill="#fff" font-size="19">• 程式碼與資料分析</text><text x="190" y="470" text-anchor="middle" fill="#a8bad8" font-size="17">需求未被正式工具滿足</text>
<rect x="440" y="170" width="320" height="330" rx="26" fill="#3b2531" stroke="#ff9fbd" stroke-width="3"/><text x="600" y="215" text-anchor="middle" fill="#ffc0d4" font-size="22" font-weight="700">未核准 AI 服務</text><text x="480" y="270" fill="#fff" font-size="19">資料保存位置與期限未知</text><text x="480" y="318" fill="#fff" font-size="19">是否用於模型改善不明</text><text x="480" y="366" fill="#fff" font-size="19">外掛與次處理者未盤點</text><text x="480" y="414" fill="#fff" font-size="19">個人帳號、共享連結失控</text><rect x="500" y="448" width="200" height="34" rx="17" fill="#542a3b"/><text x="600" y="472" text-anchor="middle" fill="#ffd4e2" font-size="17">組織無法撤權與取證</text>
<rect x="875" y="170" width="270" height="330" rx="26" fill="#173a37" stroke="#57f0c1" stroke-width="3"/><text x="1010" y="215" text-anchor="middle" fill="#8bf7d8" font-size="22" font-weight="700">核准使用閘道</text><text x="910" y="270" fill="#fff" font-size="19">用途與資料分級</text><text x="910" y="318" fill="#fff" font-size="19">企業身分與最小權限</text><text x="910" y="366" fill="#fff" font-size="19">契約、留存與訓練設定</text><text x="910" y="414" fill="#fff" font-size="19">日誌、監測與撤銷</text><text x="1010" y="470" text-anchor="middle" fill="#bff8e8" font-size="17">提供可用且受控的替代方案</text>
<path d="M325 335H425" stroke="#ff9fbd" stroke-width="4" marker-end="url(#arrow)"/><path d="M760 335H860" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><text x="375" y="315" text-anchor="middle" fill="#ffc0d4" font-size="17">繞過流程</text><text x="810" y="315" text-anchor="middle" fill="#8fe8ff" font-size="17">納管</text>
<rect x="155" y="565" width="890" height="70" rx="22" fill="#17263d" stroke="#526985"/><text x="600" y="607" text-anchor="middle" fill="#d6e3f5" font-size="19">管理目標：知道誰用什麼工具、處理哪類資料、能否停止與重建紀錄</text></g></svg>
