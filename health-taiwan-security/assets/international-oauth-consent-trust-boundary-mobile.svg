<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">手機版醫療雲端應用授權信任邊界</title><desc id="desc">使用者、授權治理閘門與醫療雲端資源形成垂直信任鏈，並標示惡意應用的持續存取風險。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0 0L10 0L5 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1280" rx="28" fill="url(#bg)"/><text x="44" y="68" fill="#fff" font-size="34" font-weight="800">醫療雲端應用授權</text><text x="44" y="110" fill="#63e6ff" font-size="34" font-weight="800">信任邊界</text><text x="44" y="150" fill="#9fb3d9" font-size="20">登入成功，不等於應用可取得醫療資料</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><rect x="52" y="205" width="616" height="205" rx="24" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="360" y="255" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">使用者</text><text x="360" y="301" text-anchor="middle" fill="#c6d4eb" font-size="21">完成登入與 MFA，看見應用同意頁</text><text x="360" y="340" text-anchor="middle" fill="#ffb4c6" font-size="21">仍可能誤信品牌、網址與權限說明</text><path d="M360 410V465" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="52" y="485" width="616" height="300" rx="24" fill="#15294c" stroke="#a997ff" stroke-width="3"/><text x="360" y="540" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">授權治理閘門</text><text x="92" y="593" fill="#c6d4eb" font-size="21">① 限制使用者自行同意</text><text x="92" y="638" fill="#c6d4eb" font-size="21">② 核對權限與業務必要性</text><text x="92" y="683" fill="#c6d4eb" font-size="21">③ 驗證發行者、網域與擁有者</text><text x="92" y="728" fill="#c6d4eb" font-size="21">④ 高風險轉管理員核准</text><path d="M360 785V840" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="52" y="860" width="616" height="195" rx="24" fill="#102f3d" stroke="#57f0c1" stroke-width="2"/><text x="360" y="912" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">醫療雲端資源</text><text x="360" y="958" text-anchor="middle" fill="#c6d4eb" font-size="21">郵件、行事曆、檔案、協作平台</text><text x="360" y="999" text-anchor="middle" fill="#c6d4eb" font-size="21">病人入口、目錄資訊與工作流程</text><rect x="52" y="1100" width="616" height="125" rx="22" fill="#241d3d" stroke="#ff8dac" stroke-width="2"/><text x="360" y="1145" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">惡意應用可在密碼未外洩時持續讀取資料</text><text x="360" y="1184" text-anchor="middle" fill="#ffc1d1" font-size="19">必須能撤銷權杖、移除應用並回查存取</text></g></svg>