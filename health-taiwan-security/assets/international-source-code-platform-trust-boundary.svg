<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療軟體原始碼平台的信任邊界</title>
<desc id="desc">開發者經身分閘道進入原始碼平台，程式碼送往隔離建置區，再以簽章成品交付測試與醫療環境；秘密庫與外部證據庫分別隔離。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111c3d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#65e6ff"/></marker></defs>
<rect width="1200" height="720" fill="url(#bg)"/><g fill="none" stroke="#213455" stroke-width="2"><path d="M60 130H1140"/><path d="M60 610H1140"/></g>
<text x="60" y="78" fill="#f7fbff" font-size="38" font-weight="800">原始碼平台不是單一伺服器，而是交付信任鏈</text><text x="60" y="112" fill="#a9bddc" font-size="22">程式碼、秘密、建置權限與稽核證據必須分域</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><rect x="70" y="220" width="205" height="150" rx="24" fill="#102846" stroke="#65e6ff" stroke-width="3"/><text x="172" y="270" text-anchor="middle" fill="#65e6ff" font-size="25" font-weight="700">開發者</text><text x="172" y="312" text-anchor="middle" fill="#d8e6f8" font-size="21">抗釣魚驗證</text><text x="172" y="344" text-anchor="middle" fill="#d8e6f8" font-size="21">具名最小權限</text>
<rect x="345" y="195" width="230" height="200" rx="24" fill="#14264b" stroke="#9c8cff" stroke-width="3"/><text x="460" y="245" text-anchor="middle" fill="#c8bfff" font-size="25" font-weight="700">原始碼平台</text><text x="460" y="286" text-anchor="middle" fill="#d8e6f8" font-size="21">Repository／API</text><text x="460" y="321" text-anchor="middle" fill="#d8e6f8" font-size="21">合併審查</text><text x="460" y="356" text-anchor="middle" fill="#d8e6f8" font-size="21">保護分支</text>
<rect x="650" y="195" width="220" height="200" rx="24" fill="#0e3440" stroke="#57f0c1" stroke-width="3"/><text x="760" y="245" text-anchor="middle" fill="#76f4ce" font-size="25" font-weight="700">隔離建置區</text><text x="760" y="286" text-anchor="middle" fill="#d8e6f8" font-size="21">短效 Runner</text><text x="760" y="321" text-anchor="middle" fill="#d8e6f8" font-size="21">依賴驗證</text><text x="760" y="356" text-anchor="middle" fill="#d8e6f8" font-size="21">成品簽章</text>
<rect x="945" y="220" width="190" height="150" rx="24" fill="#2a203f" stroke="#ff9ed0" stroke-width="3"/><text x="1040" y="270" text-anchor="middle" fill="#ffb8dc" font-size="25" font-weight="700">交付區</text><text x="1040" y="312" text-anchor="middle" fill="#d8e6f8" font-size="21">測試與驗收</text><text x="1040" y="344" text-anchor="middle" fill="#d8e6f8" font-size="21">醫療環境</text>
<g stroke="#65e6ff" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"><path d="M275 295H335"/><path d="M575 295H640"/><path d="M870 295H935"/></g>
<rect x="330" y="475" width="245" height="110" rx="22" fill="#312818" stroke="#ffd166" stroke-width="3"/><text x="452" y="520" text-anchor="middle" fill="#ffe3a3" font-size="24" font-weight="700">獨立秘密庫</text><text x="452" y="554" text-anchor="middle" fill="#d8e6f8" font-size="20">部署金鑰不寫入儲存庫</text>
<rect x="650" y="475" width="245" height="110" rx="22" fill="#172d3b" stroke="#78c7ff" stroke-width="3"/><text x="772" y="520" text-anchor="middle" fill="#9cddff" font-size="24" font-weight="700">外部證據庫</text><text x="772" y="554" text-anchor="middle" fill="#d8e6f8" font-size="20">稽核、簽章與部署紀錄</text>
<path d="M460 405V465" stroke="#ffd166" stroke-width="4" marker-end="url(#arrow)"/><path d="M760 405V465" stroke="#78c7ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="60" y="668" fill="#9fb3d9" font-size="20">驗收重點：平台遭入侵時，攻擊者不能直接取得長效秘密、覆寫既有成品或刪除全部證據。</text></g></svg>
