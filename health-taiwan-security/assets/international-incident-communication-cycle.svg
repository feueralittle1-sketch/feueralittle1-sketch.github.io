<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫院事件溝通的規劃與執行循環</title>
<desc id="desc">醫院由服務與受眾盤點開始，建立角色、範本和備援管道，經演練後進入事件中的確認、核准、發布、監測與更新循環，最後復盤改善。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">從事前準備到長期復原：八步溝通閉環</text><text x="60" y="108" fill="#a8bad8" font-size="20">先決定誰需要什麼行動，再選管道與資訊細節</text>
<g font-size="19" text-anchor="middle"><rect x="55" y="175" width="240" height="110" rx="22" fill="#112f47" stroke="#63e6ff" stroke-width="3"/><text x="175" y="218" fill="#63e6ff" font-weight="700">01 盤點</text><text x="175" y="253" fill="#fff">關鍵服務・受眾・依賴</text><rect x="335" y="175" width="240" height="110" rx="22" fill="#26304f" stroke="#8eb9ff" stroke-width="3"/><text x="455" y="218" fill="#b8d2ff" font-weight="700">02 定責</text><text x="455" y="253" fill="#fff">資訊源・核准・發言人</text><rect x="615" y="175" width="240" height="110" rx="22" fill="#35284a" stroke="#c7a6ff" stroke-width="3"/><text x="735" y="218" fill="#decaff" font-weight="700">03 預備</text><text x="735" y="253" fill="#fff">範本・問答・備援管道</text><rect x="895" y="175" width="250" height="110" rx="22" fill="#193c39" stroke="#57f0c1" stroke-width="3"/><text x="1020" y="218" fill="#8bf7d8" font-weight="700">04 演練</text><text x="1020" y="253" fill="#fff">斷網・更正・交班</text>
<rect x="55" y="420" width="240" height="110" rx="22" fill="#3b2531" stroke="#ff9fbd" stroke-width="3"/><text x="175" y="463" fill="#ffc0d4" font-weight="700">08 復盤</text><text x="175" y="498" fill="#fff">回饋・缺口・版本更新</text><rect x="335" y="420" width="240" height="110" rx="22" fill="#3b321f" stroke="#ffd37a" stroke-width="3"/><text x="455" y="463" fill="#ffe4a8" font-weight="700">07 監測</text><text x="455" y="498" fill="#fff">誤訊・問題・服務變化</text><rect x="615" y="420" width="240" height="110" rx="22" fill="#26304f" stroke="#8eb9ff" stroke-width="3"/><text x="735" y="463" fill="#b8d2ff" font-weight="700">06 發布</text><text x="735" y="498" fill="#fff">時間戳・可行動・下次更新</text><rect x="895" y="420" width="250" height="110" rx="22" fill="#112f47" stroke="#63e6ff" stroke-width="3"/><text x="1020" y="463" fill="#63e6ff" font-weight="700">05 確認與核准</text><text x="1020" y="498" fill="#fff">事實・未知・敏感細節</text></g>
<path d="M295 230H325" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M575 230H605" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M855 230H885" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1020 285V410" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M895 475H865" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M615 475H585" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M335 475H305" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M175 420V305" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="175" y="595" width="850" height="65" rx="20" fill="#17263d" stroke="#526985"/><text x="600" y="636" text-anchor="middle" fill="#d6e3f5" font-size="19">驗收：主要管道失效時仍能聯繫關鍵角色，且每次更新可追溯、可更正、可交班</text></g></svg>
