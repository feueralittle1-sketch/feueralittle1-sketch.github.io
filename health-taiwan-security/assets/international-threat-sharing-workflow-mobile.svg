<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" role="img" aria-labelledby="title desc"><title id="title">手機版醫療威脅情資處置流程</title><desc id="desc">情資經七個階段轉成院內處置並回饋。</desc><rect width="390" height="800" rx="24" fill="#07111f"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">七階段情資處置閉環</text><g font-size="17" font-weight="700"><rect x="35" y="70" width="320" height="72" rx="18" fill="#123150" stroke="#63e6ff" stroke-width="2"/><text x="65" y="113" fill="#63e6ff">1</text><text x="195" y="113" text-anchor="middle" fill="#fff">接收：來源、時間、標記</text><rect x="35" y="152" width="320" height="72" rx="18" fill="#18304d" stroke="#72c6ff" stroke-width="2"/><text x="65" y="195" fill="#72c6ff">2</text><text x="195" y="195" text-anchor="middle" fill="#fff">清理：去識別、去重、正規化</text><rect x="35" y="234" width="320" height="72" rx="18" fill="#222e50" stroke="#a997ff" stroke-width="2"/><text x="65" y="277" fill="#bdb2ff">3</text><text x="195" y="277" text-anchor="middle" fill="#fff">驗證：時效、信心、適用範圍</text><rect x="35" y="316" width="320" height="72" rx="18" fill="#272d4b" stroke="#d39cff" stroke-width="2"/><text x="65" y="359" fill="#e2b8ff">4</text><text x="195" y="359" text-anchor="middle" fill="#fff">關聯：資產、版本、身分、曝險</text><rect x="35" y="398" width="320" height="72" rx="18" fill="#203640" stroke="#ffb86b" stroke-width="2"/><text x="65" y="441" fill="#ffcf99">5</text><text x="195" y="441" text-anchor="middle" fill="#fff">分級：臨床衝擊與處置優先序</text><rect x="35" y="480" width="320" height="72" rx="18" fill="#163b3b" stroke="#57f0c1" stroke-width="2"/><text x="65" y="523" fill="#79f4d0">6</text><text x="195" y="523" text-anchor="middle" fill="#fff">執行：偵測、阻擋、隔離、修補</text><rect x="35" y="562" width="320" height="72" rx="18" fill="#173444" stroke="#5de2ea" stroke-width="2"/><text x="65" y="605" fill="#72edf3">7</text><text x="195" y="605" text-anchor="middle" fill="#fff">回饋：結果、誤報、回退、新證據</text></g><rect x="25" y="665" width="340" height="95" rx="20" fill="#0e2038" stroke="#ffb86b" stroke-width="2"/><text x="195" y="702" text-anchor="middle" fill="#ffcf99" font-size="17" font-weight="700">最低驗收證據</text><text x="195" y="733" text-anchor="middle" fill="#e6eefc" font-size="15">命中對象、決策理由、責任期限、結果</text><text x="195" y="784" text-anchor="middle" fill="#a8bad8" font-size="14">高影響控制需保留人工確認與回退</text></g></svg>