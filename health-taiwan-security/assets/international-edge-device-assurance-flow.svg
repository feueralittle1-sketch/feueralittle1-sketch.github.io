<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療邊界設備持續驗證流程</title><desc id="desc">從外部發現、確認責任與用途、縮減曝險、修補及強化、驗證監測，到演練可信重建的循環流程，並在發現未知資產或異常變更時重新啟動。</desc>
<defs><linearGradient id="bg" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#13284a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/>
<g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="64" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">邊界設備的六步持續驗證</text><text x="600" y="104" text-anchor="middle" fill="#9fb3d9" font-size="20">清冊若只從內部匯出，容易漏掉舊網址、影子介面與臨時遠端連線</text>
<g fill="#123b60" stroke="#63e6ff" stroke-width="3"><rect x="55" y="175" width="300" height="125" rx="25"/><rect x="450" y="175" width="300" height="125" rx="25"/><rect x="845" y="175" width="300" height="125" rx="25"/><rect x="845" y="405" width="300" height="125" rx="25"/><rect x="450" y="405" width="300" height="125" rx="25"/><rect x="55" y="405" width="300" height="125" rx="25"/></g>
<g fill="#fff" text-anchor="middle"><text x="205" y="220" font-size="25" font-weight="700">1 外部發現</text><text x="205" y="259" font-size="19">DNS／IP／憑證／連接埠</text><text x="600" y="220" font-size="25" font-weight="700">2 確認責任</text><text x="600" y="259" font-size="19">用途、資料流、服務與供應商</text><text x="995" y="220" font-size="25" font-weight="700">3 縮減曝險</text><text x="995" y="259" font-size="19">關閉、限制、隔離或代理</text><text x="995" y="450" font-size="25" font-weight="700">4 修補強化</text><text x="995" y="489" font-size="19">版本、帳號、協定與組態</text><text x="600" y="450" font-size="25" font-weight="700">5 驗證監測</text><text x="600" y="489" font-size="19">外部重掃、變更與日誌完整性</text><text x="205" y="450" font-size="25" font-weight="700">6 可信重建</text><text x="205" y="489" font-size="19">備份、金鑰輪替、復原演練</text></g>
<g fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"><path d="M355 237H430"/><path d="M750 237H825"/><path d="M995 300V382"/><path d="M845 467H770"/><path d="M450 467H375"/><path d="M205 405V335Q205 330 210 330H600Q615 330 615 315V300"/></g>
<rect x="270" y="594" width="660" height="72" rx="22" fill="#35294f" stroke="#a997ff" stroke-width="2"/><text x="600" y="638" text-anchor="middle" fill="#ddd6fe" font-size="21">觸發重跑：新資產｜支援到期｜異常組態｜事件調查｜重大架構變更</text></g></svg>
