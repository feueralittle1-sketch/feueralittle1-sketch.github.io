<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全文件轉成院內部署基線</title><desc id="desc">製造商文件、院內場域事實與治理閘門共同形成可監測、可更新的部署基線。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="600" y="62" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="700" fill="#f4f8ff">安全文件不是終點：三類輸入要通過院端治理閘門</text><g filter="url(#shadow)"><rect x="55" y="125" width="300" height="170" rx="22" fill="#102742" stroke="#7aa7ff" stroke-width="2"/><text x="205.0" y="173" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="28" font-weight="800" fill="#f4f8ff">製造商安全文件</text><text x="205.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">MDS2／安全標示</text><text x="205.0" y="243" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">架構、SBOM、更新政策</text></g><g filter="url(#shadow)"><rect x="55" y="390" width="300" height="170" rx="22" fill="#102742" stroke="#5eead4" stroke-width="2"/><text x="205.0" y="438" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="28" font-weight="800" fill="#f4f8ff">院內場域事實</text><text x="205.0" y="478" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">型號與版本</text><text x="205.0" y="508" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">網段、資料流、臨床用途</text></g><g filter="url(#shadow)"><rect x="450" y="230" width="300" height="230" rx="22" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="600.0" y="278" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="28" font-weight="800" fill="#f4f8ff">院端治理閘門</text><text x="600.0" y="318" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">版本對齊</text><text x="600.0" y="348" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">缺口驗證</text><text x="600.0" y="378" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">責任核准</text><text x="600.0" y="408" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">臨床放行</text></g><g filter="url(#shadow)"><rect x="845" y="125" width="300" height="170" rx="22" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="995.0" y="173" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="28" font-weight="800" fill="#f4f8ff">可執行部署基線</text><text x="995.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">允許連線與組態</text><text x="995.0" y="243" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">權限、日誌、更新窗口</text></g><g filter="url(#shadow)"><rect x="845" y="390" width="300" height="170" rx="22" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="995.0" y="438" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="28" font-weight="800" fill="#f4f8ff">持續證據</text><text x="995.0" y="478" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">監測、事件、變更</text><text x="995.0" y="508" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">年度重驗與退場</text></g><path d="M355 210 L450 290" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M355 475 L450 400" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M750 300 L845 210" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M750 390 L845 475" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="600" y="665" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="700" fill="#67e8f9">驗收條件：每一項文件主張都能對應實際資產、控制責任與測試結果</text></svg>