<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">郵件閘道事件處置決策流程</title><desc id="desc">從盤點版本與曝險開始，先保全證據、隔離受影響閘道、切換備援收信，再更新或重建並完成臨床溝通驗證。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081726"/><stop offset="1" stop-color="#182144"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-size="34" font-weight="700">先保留調查能力，再恢復可信收信</text><text x="60" y="108" fill="#9fb3d9" font-size="20">修補、隔離、備援與臨床溝通必須並行協調</text><g font-family="Arial,'Noto Sans TC',sans-serif"><g fill="#142e4b" stroke="#63e6ff" stroke-width="3"><rect x="55" y="170" width="250" height="120" rx="22"/><rect x="355" y="170" width="250" height="120" rx="22"/><rect x="655" y="170" width="250" height="120" rx="22"/><rect x="955" y="170" width="190" height="120" rx="22"/></g><g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="180" y="220">1 盤點</text><text x="180" y="258">版本／實體／虛擬</text><text x="480" y="220">2 分流</text><text x="480" y="258">受影響且可達？</text><text x="780" y="220">3 保全</text><text x="780" y="258">日誌／流量／映像</text><text x="1050" y="220">4 隔離</text><text x="1050" y="258">停止不可信路徑</text></g><g stroke="#63e6ff" stroke-width="6"><path d="M305 230h50M605 230h50M905 230h50"/></g><g fill="none" stroke="#63e6ff" stroke-width="6"><path d="M340 218l15 12-15 12M640 218l15 12-15 12M940 218l15 12-15 12"/></g>
<rect x="340" y="365" width="520" height="105" rx="28" fill="#3d294e" stroke="#c899ff" stroke-width="4"/><text x="600" y="410" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">決策閘門：可信度足以原地更新？</text><text x="600" y="447" text-anchor="middle" fill="#e7d2ff" font-size="19">疑似 root 權限遭利用時，不應只把版本升級視為結案</text><path d="M1050 290v75H860" fill="none" stroke="#c899ff" stroke-width="5"/>
<rect x="65" y="545" width="300" height="135" rx="24" fill="#4a331a" stroke="#ffbd66" stroke-width="3"/><text x="215" y="592" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">備援收信與公告</text><text x="215" y="630" text-anchor="middle" fill="#ffe2b3" font-size="19">排隊、替代管道、優先訊息</text><text x="215" y="660" text-anchor="middle" fill="#ffe2b3" font-size="19">避免靜默遺失郵件</text>
<rect x="450" y="545" width="300" height="135" rx="24" fill="#173744" stroke="#63e6ff" stroke-width="3"/><text x="600" y="592" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">更新或乾淨重建</text><text x="600" y="630" text-anchor="middle" fill="#c4edf6" font-size="19">依供應商固定版本</text><text x="600" y="660" text-anchor="middle" fill="#c4edf6" font-size="19">重設憑證與管理密碼</text>
<rect x="835" y="545" width="300" height="135" rx="24" fill="#153b36" stroke="#57f0c1" stroke-width="3"/><text x="985" y="592" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">驗證後分批回送</text><text x="985" y="630" text-anchor="middle" fill="#c5f5e9" font-size="19">測試收送、隔離與告警</text><text x="985" y="660" text-anchor="middle" fill="#c5f5e9" font-size="19">核對積壓與臨床通知</text><path d="M465 470l-250 75M600 470v75M735 470l250 75" fill="none" stroke="#91a6c9" stroke-width="5"/></g></svg>
