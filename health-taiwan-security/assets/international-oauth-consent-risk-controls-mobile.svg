<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc"><title id="title">手機版 OAuth 同意釣魚風險與控制對照</title><desc id="desc">以五張卡片呈現偽冒應用、過度權限、長效權杖、異常存取與孤兒應用的控制方法。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171f42"/></linearGradient></defs><rect width="720" height="1500" rx="28" fill="url(#bg)"/><text x="44" y="68" fill="#fff" font-size="34" font-weight="800">OAuth 同意釣魚</text><text x="44" y="110" fill="#63e6ff" font-size="34" font-weight="800">風險與控制對照</text><text x="44" y="150" fill="#9fb3d9" font-size="20">降低授權機率、限制範圍、縮短停留時間</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><g transform="translate(52 205)"><rect width="616" height="210" rx="24" fill="#152d4a" stroke="#ff8dac" stroke-width="2"/><text x="30" y="52" fill="#ffb4c6" font-size="25" font-weight="800">偽冒應用與品牌</text><text x="30" y="102" fill="#c6d4eb" font-size="20">驗證發行者、網域與業務擁有者</text><text x="30" y="142" fill="#c6d4eb" font-size="20">高風險權限改由管理員核准</text><text x="30" y="182" fill="#57f0c1" font-size="19">證據：核准單、發行者資料、權限快照</text></g><g transform="translate(52 445)"><rect width="616" height="210" rx="24" fill="#152d4a" stroke="#ff8dac" stroke-width="2"/><text x="30" y="52" fill="#ffb4c6" font-size="25" font-weight="800">過度權限</text><text x="30" y="102" fill="#c6d4eb" font-size="20">依用途允許最小存取範圍</text><text x="30" y="142" fill="#c6d4eb" font-size="20">禁止不必要的離線與全域存取</text><text x="30" y="182" fill="#57f0c1" font-size="19">證據：權限基線、例外期限、定期複核</text></g><g transform="translate(52 685)"><rect width="616" height="210" rx="24" fill="#152d4a" stroke="#ff8dac" stroke-width="2"/><text x="30" y="52" fill="#ffb4c6" font-size="25" font-weight="800">長效權杖殘留</text><text x="30" y="102" fill="#c6d4eb" font-size="20">撤銷同意與重新整理權杖</text><text x="30" y="142" fill="#c6d4eb" font-size="20">回查服務主體、帳號與所有工作階段</text><text x="30" y="182" fill="#57f0c1" font-size="19">證據：撤權時間、回查結果、復原驗證</text></g><g transform="translate(52 925)"><rect width="616" height="210" rx="24" fill="#152d4a" stroke="#ff8dac" stroke-width="2"/><text x="30" y="52" fill="#ffb4c6" font-size="25" font-weight="800">異常讀取與寄信</text><text x="30" y="102" fill="#c6d4eb" font-size="20">監測 API、下載量與收件匣規則</text><text x="30" y="142" fill="#c6d4eb" font-size="20">比對來源位置、時間與既有行為</text><text x="30" y="182" fill="#57f0c1" font-size="19">證據：告警、調查時間線、受影響資料</text></g><g transform="translate(52 1165)"><rect width="616" height="210" rx="24" fill="#152d4a" stroke="#ff8dac" stroke-width="2"/><text x="30" y="52" fill="#ffb4c6" font-size="25" font-weight="800">無人負責的孤兒應用</text><text x="30" y="102" fill="#c6d4eb" font-size="20">設定擁有者、複核期限與停用條件</text><text x="30" y="142" fill="#c6d4eb" font-size="20">離職、專案結束或無使用時自動退場</text><text x="30" y="182" fill="#57f0c1" font-size="19">證據：清冊、最後使用時間、移除紀錄</text></g><text x="360" y="1440" text-anchor="middle" fill="#63e6ff" font-size="20" font-weight="800">控制必須能被演練、計時與回查</text></g></svg>