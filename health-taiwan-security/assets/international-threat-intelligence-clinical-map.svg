<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">國際威脅情報轉換為醫療臨床風險與偵測假設的關係圖</title>
  <desc id="desc">外部威脅報告與院內資產、身分及臨床服務資料交會，形成具優先序的偵測假設與處置條件。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#13244a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">威脅情報不是告警清單，而是臨床風險的轉譯流程</text><text x="60" y="108" fill="#9fb3d9" font-size="19">把 IOC、TTP 與趨勢放回院內資產、信任邊界和病人照護情境</text>
  <g font-family="sans-serif"><rect x="60" y="165" width="290" height="390" rx="26" fill="#10223d" stroke="#5f8cff" stroke-width="2"/><text x="90" y="215" fill="#a9c8ff" font-size="24" font-weight="700">外部訊號</text><g fill="#dbeafe" font-size="20"><text x="90" y="270">• 國際威脅年報</text><text x="90" y="320">• 漏洞與攻擊技術</text><text x="90" y="370">• 惡意基礎設施 IOC</text><text x="90" y="420">• 產業事件與手法</text><text x="90" y="470">• 來源日期與適用範圍</text></g>
  <rect x="455" y="145" width="290" height="430" rx="26" fill="#123044" stroke="#63e6ff" stroke-width="3" filter="url(#glow)"/><text x="495" y="200" fill="#8ff5ff" font-size="24" font-weight="700">院內情境轉譯</text><g fill="#e6fbff" font-size="20"><text x="495" y="260">資產：實際版本與暴露</text><text x="495" y="310">身分：特權與遠端路徑</text><text x="495" y="360">資料：敏感度與流向</text><text x="495" y="410">臨床：中斷與病安影響</text><text x="495" y="460">控制：現有偵測與缺口</text><text x="495" y="510">證據：可查詢的遙測</text></g>
  <rect x="850" y="165" width="290" height="390" rx="26" fill="#192342" stroke="#a997ff" stroke-width="2"/><text x="885" y="215" fill="#c7bfff" font-size="24" font-weight="700">治理輸出</text><g fill="#eeeaff" font-size="20"><text x="885" y="270">• 偵測假設與查詢</text><text x="885" y="320">• 臨床優先序</text><text x="885" y="370">• 阻斷與升級條件</text><text x="885" y="420">• 桌上／技術演練</text><text x="885" y="470">• 缺口與例外期限</text></g>
  <path d="M350 360H440" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M745 360H835" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="170" y="610" width="860" height="54" rx="27" fill="#0b1b32" stroke="#57f0c1"/><text x="600" y="645" fill="#b8ffe7" text-anchor="middle" font-size="20" font-weight="700">同一項國際訊號，只有在院內情境成立時才進入偵測與處置優先序</text></g>
</svg>