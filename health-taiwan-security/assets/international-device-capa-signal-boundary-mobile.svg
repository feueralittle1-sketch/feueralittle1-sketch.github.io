<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安上市後訊號與品質系統邊界手機版</title><desc id="desc">上市後訊號依序進入製造商品質系統，再轉成醫院端可驗收的執行證據。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient></defs><rect width="1200" height="1500" fill="url(#g)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="600" y="90" text-anchor="middle" fill="#fff" font-size="42" font-weight="700">上市後資安訊號進入品質閉環</text><rect x="100" y="150" width="1000" height="320" rx="34" fill="#10243e" stroke="#63e6ff" stroke-width="3"/><text x="600" y="205" text-anchor="middle" fill="#63e6ff" font-size="34" font-weight="700">一、訊號來源</text><g fill="#e8f5ff" font-size="29"><text x="180" y="280">漏洞與威脅情報</text><text x="650" y="280">客訴與安全事件</text><text x="180" y="365">設備遙測與異常</text><text x="650" y="365">場域與供應商回饋</text></g><path d="M600 470V545" stroke="#63e6ff" stroke-width="8"/><path d="M575 530L600 565L625 530" fill="#63e6ff"/><rect x="100" y="565" width="1000" height="420" rx="34" fill="#142744" stroke="#a997ff" stroke-width="3"/><text x="600" y="625" text-anchor="middle" fill="#c7baff" font-size="34" font-weight="700">二、製造商品質系統</text><g fill="#fff" font-size="29"><rect x="170" y="690" width="360" height="90" rx="22" fill="#253f68"/><text x="350" y="746" text-anchor="middle">風險分級</text><rect x="670" y="690" width="360" height="90" rx="22" fill="#253f68"/><text x="850" y="746" text-anchor="middle">根因分析</text><rect x="170" y="835" width="360" height="90" rx="22" fill="#253f68"/><text x="350" y="891" text-anchor="middle">CAPA 處置</text><rect x="670" y="835" width="360" height="90" rx="22" fill="#253f68"/><text x="850" y="891" text-anchor="middle">有效性驗證</text></g><path d="M600 985V1060" stroke="#57f0c1" stroke-width="8"/><path d="M575 1045L600 1080L625 1045" fill="#57f0c1"/><rect x="100" y="1080" width="1000" height="315" rx="34" fill="#0f2b35" stroke="#57f0c1" stroke-width="3"/><text x="600" y="1140" text-anchor="middle" fill="#57f0c1" font-size="34" font-weight="700">三、醫院端執行證據</text><g fill="#eafff8" font-size="28"><text x="170" y="1215">受影響版本與臨床風險</text><text x="650" y="1215">修補或補償控制</text><text x="170" y="1295">停機、回退與溝通</text><text x="650" y="1295">完成與複測證明</text></g><text x="600" y="1450" text-anchor="middle" fill="#9fb3d9" font-size="25">外部處置必須轉成院內變更、臨床驗收與可追溯紀錄。</text></g></svg>