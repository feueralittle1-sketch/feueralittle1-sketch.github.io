<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">臨床影像生命週期與驗收流程</title><desc id="desc">影像從需求核准、受控拍攝、正式上傳、用途分流、存取監測到到期刪除，每一階段都有責任與驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="64" y="76" fill="#fff" font-size="38" font-weight="800">臨床影像生命週期：六個可驗收節點</text><text x="64" y="116" fill="#9fb3d9" font-size="20">控制不能只停在「拍攝前取得同意」，還要管到匯出、留存與移除</text><g fill="#112945" stroke="#63e6ff" stroke-width="2"><rect x="54" y="205" width="160" height="205" rx="22"/><rect x="240" y="205" width="160" height="205" rx="22"/><rect x="426" y="205" width="160" height="205" rx="22"/><rect x="612" y="205" width="160" height="205" rx="22"/><rect x="798" y="205" width="160" height="205" rx="22"/><rect x="984" y="205" width="160" height="205" rx="22"/></g><g text-anchor="middle"><text x="134" y="253" fill="#fff" font-size="24" font-weight="800">1 核准</text><text x="134" y="302" fill="#c6d4eb" font-size="18">用途、對象</text><text x="134" y="334" fill="#c6d4eb" font-size="18">必要範圍</text><text x="320" y="253" fill="#fff" font-size="24" font-weight="800">2 拍攝</text><text x="320" y="302" fill="#c6d4eb" font-size="18">受管裝置</text><text x="320" y="334" fill="#c6d4eb" font-size="18">病人核對</text><text x="506" y="253" fill="#fff" font-size="24" font-weight="800">3 上傳</text><text x="506" y="302" fill="#c6d4eb" font-size="18">加密傳輸</text><text x="506" y="334" fill="#c6d4eb" font-size="18">完整性核對</text><text x="692" y="253" fill="#fff" font-size="24" font-weight="800">4 分流</text><text x="692" y="302" fill="#c6d4eb" font-size="18">診療／教學</text><text x="692" y="334" fill="#c6d4eb" font-size="18">研究／宣傳</text><text x="878" y="253" fill="#fff" font-size="24" font-weight="800">5 監測</text><text x="878" y="302" fill="#c6d4eb" font-size="18">查閱與匯出</text><text x="878" y="334" fill="#c6d4eb" font-size="18">異常告警</text><text x="1064" y="253" fill="#fff" font-size="24" font-weight="800">6 刪除</text><text x="1064" y="302" fill="#c6d4eb" font-size="18">到期處置</text><text x="1064" y="334" fill="#c6d4eb" font-size="18">副本驗證</text></g><path d="M214 308H230M400 308H416M586 308H602M772 308H788M958 308H974" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="64" y="492" width="1072" height="135" rx="24" fill="#102f3d" stroke="#57f0c1" stroke-width="2"/><text x="96" y="540" fill="#57f0c1" font-size="24" font-weight="800">最低驗收證據</text><text x="96" y="583" fill="#d5f7ec" font-size="21">核准紀錄｜裝置與操作者｜病人／案件對應｜上傳成功｜每次查閱與匯出｜例外期限｜到期刪除與殘留副本檢查</text></g></svg>