<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫院設施 OT 風險與控制矩陣</title><desc id="desc">將未知資產、遠端維護、惡意或錯誤變更、控制器失效和恢復污染，對應到控制與驗收證據。</desc><rect width="1200" height="700" rx="40" fill="#09172b"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">失效模式、控制與驗收證據必須成套</text><text x="60" y="108" fill="#9fb3d9" font-size="19">只有設備在線不代表臨床服務安全，需同時確認現場狀態與照護結果</text><g font-family="sans-serif"><rect x="55" y="150" width="1090" height="62" rx="16" fill="#17304e"/><g fill="#9feeff" font-size="21" font-weight="700"><text x="85" y="189">失效模式</text><text x="410" y="189">主要控制</text><text x="830" y="189">驗收證據</text></g><g font-size="18"><rect x="55" y="225" width="1090" height="80" rx="14" fill="#10223b"/><text x="85" y="262" fill="#fff">未知資產或影子連線</text><text x="410" y="252" fill="#dbe8ff">被動發現、資產擁有者、</text><text x="410" y="278" fill="#dbe8ff">網路與實體位置比對</text><text x="830" y="262" fill="#9fdacb">清冊覆蓋率與孤兒資產關閉紀錄</text><rect x="55" y="317" width="1090" height="80" rx="14" fill="#132942"/><text x="85" y="354" fill="#fff">遠端維護遭濫用</text><text x="410" y="344" fill="#dbe8ff">限時授權、受控跳板、</text><text x="410" y="370" fill="#dbe8ff">會話記錄與緊急停權</text><text x="830" y="354" fill="#9fdacb">工單、錄影、撤權與告警測試</text><rect x="55" y="409" width="1090" height="80" rx="14" fill="#10223b"/><text x="85" y="446" fill="#fff">惡意或錯誤組態變更</text><text x="410" y="436" fill="#dbe8ff">雙人核准、基線備份、</text><text x="410" y="462" fill="#dbe8ff">分批發布與回退</text><text x="830" y="446" fill="#9fdacb">差異報告、回退時間與現場確認</text><rect x="55" y="501" width="1090" height="80" rx="14" fill="#132942"/><text x="85" y="538" fill="#fff">控制器或管理站失效</text><text x="410" y="528" fill="#dbe8ff">安全狀態、手動操作、</text><text x="410" y="554" fill="#dbe8ff">備援路徑與臨床降級</text><text x="830" y="538" fill="#9fdacb">切換演練、環境讀值與服務完成率</text><rect x="55" y="593" width="1090" height="62" rx="14" fill="#10223b"/><text x="85" y="632" fill="#fff">不可信恢復或舊弱點回灌</text><text x="410" y="632" fill="#dbe8ff">乾淨映像、離線驗證、分區復原</text><text x="830" y="632" fill="#9fdacb">版本、雜湊、負向測試與臨床簽認</text></g></g></svg>