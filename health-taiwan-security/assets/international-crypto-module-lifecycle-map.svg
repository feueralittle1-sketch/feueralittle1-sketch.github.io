<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療系統加密模組生命週期地圖</title>
<desc id="desc">從醫療服務、產品內加密模組、驗證狀態、供應商支援到退場替換的治理關係。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111a3d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="72" fill="#f5fbff" font-size="36" font-weight="700">加密模組不是一次性證書，而是產品生命週期依賴</text><text x="70" y="112" fill="#9eb5d7" font-size="20">盤點實際模組、驗證版本、整合方式與支援狀態，才能判斷臨床風險。</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><rect x="70" y="180" width="240" height="190" rx="26" fill="#122b48" stroke="#63e6ff" stroke-width="3"/><text x="190" y="225" text-anchor="middle" fill="#63e6ff" font-size="23" font-weight="700">醫療服務</text><text x="95" y="270" fill="#e7f1ff" font-size="19">• 電子病歷與影像</text><text x="95" y="310" fill="#e7f1ff" font-size="19">• 遠端照護與 API</text><text x="95" y="350" fill="#e7f1ff" font-size="19">• 醫療設備與備份</text>
<path d="M310 275H405" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs>
<rect x="410" y="160" width="330" height="230" rx="28" fill="#182d57" stroke="#a997ff" stroke-width="3"/><text x="575" y="210" text-anchor="middle" fill="#c8bbff" font-size="24" font-weight="700">產品內的加密模組</text><text x="445" y="255" fill="#f5f1ff" font-size="19">演算法實作、金鑰管理、亂數來源</text><text x="445" y="295" fill="#f5f1ff" font-size="19">作業模式、韌體版本、操作環境</text><text x="445" y="335" fill="#f5f1ff" font-size="19">整合產品不等於模組本身已驗證</text><text x="445" y="370" fill="#9eb5d7" font-size="17">同名產品也可能因版本而有不同狀態</text>
<path d="M740 275H835" stroke="#a997ff" stroke-width="6" marker-end="url(#b)"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a997ff"/></marker></defs>
<rect x="840" y="180" width="290" height="190" rx="26" fill="#173348" stroke="#57f0c1" stroke-width="3"/><text x="985" y="225" text-anchor="middle" fill="#79f6cf" font-size="23" font-weight="700">驗證與支援證據</text><text x="875" y="270" fill="#e7fff8" font-size="19">• 證書與安全政策</text><text x="875" y="310" fill="#e7fff8" font-size="19">• Active／Historical 狀態</text><text x="875" y="350" fill="#e7fff8" font-size="19">• 供應商更新與退場路線</text>
<rect x="70" y="460" width="1060" height="170" rx="30" fill="#0d2038" stroke="#334b6e" stroke-width="2"/><text x="100" y="510" fill="#f5fbff" font-size="23" font-weight="700">醫院需要管理的不是標章，而是可持續交付的能力</text><g fill="#c7d6ec" font-size="19"><text x="100" y="555">清冊：哪個臨床服務依賴哪個模組與版本</text><text x="100" y="595">契約：狀態轉換、弱點、更新與替換時限如何通知</text><text x="635" y="555">驗收：更新後互通性、效能、金鑰與復原流程</text><text x="635" y="595">退場：不能更新時的隔離、替代路徑與風險接受</text></g></g></svg>