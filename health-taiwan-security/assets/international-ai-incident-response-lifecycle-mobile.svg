<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧事件回應流程手機圖</title><desc id="desc">事件依序完成偵測、分類、定界、控制、降級、證據保存與受控恢復。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient></defs><rect width="800" height="1200" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="400" y="60" fill="#fff" text-anchor="middle" font-size="30" font-weight="700">醫療 AI 事件七階段回應</text><g font-size="21"><rect x="75" y="100" width="650" height="92" rx="22" fill="#163552" stroke="#63e6ff"/><text x="115" y="142" fill="#63e6ff" font-weight="700">1 偵測</text><text x="300" y="142" fill="#dcecff">輸出、工具動作、漂移與異常</text><rect x="75" y="210" width="650" height="92" rx="22" fill="#163552" stroke="#63e6ff"/><text x="115" y="252" fill="#63e6ff" font-weight="700">2 分類</text><text x="300" y="252" fill="#dcecff">攻擊、傷害或混合事件</text><rect x="75" y="320" width="650" height="92" rx="22" fill="#24345b" stroke="#a997ff"/><text x="115" y="362" fill="#c7baff" font-weight="700">3 定界</text><text x="300" y="362" fill="#eee9ff">模型、資料、工具與下游流程</text><rect x="75" y="430" width="650" height="92" rx="22" fill="#24345b" stroke="#a997ff"/><text x="115" y="472" fill="#c7baff" font-weight="700">4 控制</text><text x="300" y="472" fill="#eee9ff">撤權、隔離、停用或回退</text><rect x="75" y="540" width="650" height="92" rx="22" fill="#17423f" stroke="#57f0c1"/><text x="115" y="582" fill="#57f0c1" font-weight="700">5 降級</text><text x="300" y="582" fill="#eafff8">人工覆核與替代臨床流程</text><rect x="75" y="650" width="650" height="92" rx="22" fill="#17423f" stroke="#57f0c1"/><text x="115" y="692" fill="#57f0c1" font-weight="700">6 保存</text><text x="300" y="692" fill="#eafff8">重現包、時間線與供應商證據</text><rect x="75" y="760" width="650" height="92" rx="22" fill="#3c2d3e" stroke="#ffb86b"/><text x="115" y="802" fill="#ffca8c" font-weight="700">7 恢復</text><text x="300" y="802" fill="#fff1df">安全修正、臨床回歸與觀察期</text></g><rect x="75" y="895" width="650" height="230" rx="28" fill="#10243e" stroke="#63e6ff"/><text x="400" y="940" fill="#63e6ff" text-anchor="middle" font-size="24" font-weight="700">重現包與放行證據</text><g fill="#dcecff" font-size="20"><text x="120" y="990">• 模型、提示、資料、檢索與工具版本</text><text x="120" y="1030">• 權限決策、人工核准、時間戳與下游動作</text><text x="120" y="1070">• 修正後的安全測試、臨床回歸與降級測試</text><text x="120" y="1110">• 觀察門檻、責任人與重新開案條件</text></g><text x="400" y="1170" fill="#9fb3d9" text-anchor="middle" font-size="18">無法重現不等於沒有事件，先保存可重現範圍。</text></g></svg>