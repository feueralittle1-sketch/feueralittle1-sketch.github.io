<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1030" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備風險決策地圖</title><desc id="desc">依可利用性與臨床傷害組合分流監測、限期改善、立即控制與高階接受。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1030" rx="28" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">醫療設備風險決策地圖</text><text x="38" y="96" fill="#9fb7d5" font-size="18">兩軸分流，不讓單一分數代替情境</text><rect x="45" y="135" width="630" height="190" rx="22" fill="#4a2230" stroke="#ff6b8b" stroke-width="2"/><text x="72" y="182" fill="#ff9fb4" font-size="22" font-weight="800">高利用 × 高傷害</text><text x="72" y="224" fill="#ffffff" font-size="18">立即降低暴露、限制使用或隔離</text><text x="72" y="260" fill="#d8e5f7" font-size="17">同步啟動臨床替代與事件指揮</text><text x="72" y="294" fill="#ffc3cf" font-size="16">剩餘風險仍高時升級權責決策</text><rect x="45" y="350" width="630" height="190" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="72" y="397" fill="#ffd08a" font-size="22" font-weight="800">低利用 × 高傷害</text><text x="72" y="439" fill="#ffffff" font-size="18">保留高嚴重度情境，不因低機率刪除</text><text x="72" y="475" fill="#d8e5f7" font-size="17">強化補償控制、降級程序與演練</text><text x="72" y="509" fill="#ffd08a" font-size="16">曝險或版本改變即重新評估</text><rect x="45" y="565" width="630" height="170" rx="22" fill="#123c55" stroke="#8fe8ff" stroke-width="2"/><text x="72" y="612" fill="#8fe8ff" font-size="22" font-weight="800">高利用 × 低傷害</text><text x="72" y="654" fill="#ffffff" font-size="18">限期修補、縮小曝險並驗證偵測</text><text x="72" y="690" fill="#d8e5f7" font-size="17">避免成為橫向移動或權限擴張入口</text><rect x="45" y="760" width="630" height="170" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="72" y="807" fill="#72f5cd" font-size="22" font-weight="800">低利用 × 低傷害</text><text x="72" y="849" fill="#ffffff" font-size="18">納入例行監測與版本追蹤</text><text x="72" y="885" fill="#d8e5f7" font-size="17">保留重評門檻，不等於永久關閉</text><text x="360" y="978" text-anchor="middle" fill="#dce9f8" font-size="17">四個區域都需記錄控制有效性與不確定性</text></g></svg>