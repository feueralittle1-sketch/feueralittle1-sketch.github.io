<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AI 輔助程式碼風險與驗收證據圖</title><desc id="desc">將虛構套件、弱點程式碼、過度授權、測試同源與不可維護等風險，對應到控制及可驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#121d3f"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="65" y="68" fill="#f4f8ff" font-size="34" font-weight="700">風險不靠口頭保證關閉：以證據驗收</text><text x="65" y="106" fill="#9fb3d9" font-size="21">生成來源只能是追溯線索；真正的完成條件是可重現的審查、測試與核准紀錄</text>
<g font-family="sans-serif"><rect x="65" y="150" width="1070" height="58" rx="14" fill="#18304a"/><text x="95" y="187" fill="#63e6ff" font-size="22" font-weight="700">風險</text><text x="380" y="187" fill="#63e6ff" font-size="22" font-weight="700">必要控制</text><text x="790" y="187" fill="#63e6ff" font-size="22" font-weight="700">驗收證據</text>
<g font-size="20"><rect x="65" y="222" width="1070" height="72" rx="12" fill="#10243b"/><text x="95" y="265" fill="#ff9cb3" font-weight="700">虛構或混淆套件</text><text x="380" y="265" fill="#d8e6fa">鎖定來源、版本與雜湊</text><text x="790" y="265" fill="#bfeadf">SBOM、鎖檔、來源驗證紀錄</text>
<rect x="65" y="306" width="1070" height="72" rx="12" fill="#132841"/><text x="95" y="349" fill="#ff9cb3" font-weight="700">不安全程式碼</text><text x="380" y="349" fill="#d8e6fa">人工差異審查＋多類測試</text><text x="790" y="349" fill="#bfeadf">審查簽核、掃描與負向測試</text>
<rect x="65" y="390" width="1070" height="72" rx="12" fill="#10243b"/><text x="95" y="433" fill="#ff9cb3" font-weight="700">工具過度授權</text><text x="380" y="433" fill="#d8e6fa">隔離沙箱、短效憑證、最小範圍</text><text x="790" y="433" fill="#bfeadf">權限清單、拒絕測試、存取日誌</text>
<rect x="65" y="474" width="1070" height="72" rx="12" fill="#132841"/><text x="95" y="517" fill="#ff9cb3" font-weight="700">產碼與測試同源</text><text x="380" y="517" fill="#d8e6fa">獨立測試案例與第二審查者</text><text x="790" y="517" fill="#bfeadf">需求追溯、覆蓋率、獨立核准</text>
<rect x="65" y="558" width="1070" height="72" rx="12" fill="#10243b"/><text x="95" y="601" fill="#ff9cb3" font-weight="700">無人理解與維護</text><text x="380" y="601" fill="#d8e6fa">責任人說明、架構與回滾文件</text><text x="790" y="601" fill="#bfeadf">演練紀錄、維護交接、回復時間</text></g></g></svg>