<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療影子 AI 從發現到核准的治理流程</title>
<desc id="desc">醫院透過需求訪談、網路與身分訊號發現 AI 使用，完成用途和資料分級後，決定禁止、限制、沙箱試辦或正式核准，再以企業身分、資料控制、日誌和定期複核形成閉環。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">把未知使用轉成可驗收服務：六步治理閉環</text><text x="60" y="108" fill="#a8bad8" font-size="20">先理解工作需求，再依資料與臨床影響決定處置</text>
<g text-anchor="middle"><rect x="55" y="175" width="250" height="125" rx="22" fill="#112f47" stroke="#63e6ff" stroke-width="3"/><text x="180" y="220" fill="#8fe8ff" font-size="20" font-weight="700">01 發現</text><text x="180" y="258" fill="#fff" font-size="18">訪談・SSO・網路・採購</text><rect x="345" y="175" width="250" height="125" rx="22" fill="#26304f" stroke="#8eb9ff" stroke-width="3"/><text x="470" y="220" fill="#b8d2ff" font-size="20" font-weight="700">02 分級</text><text x="470" y="258" fill="#fff" font-size="18">用途・資料・臨床影響</text><rect x="635" y="175" width="250" height="125" rx="22" fill="#35284a" stroke="#c7a6ff" stroke-width="3"/><text x="760" y="220" fill="#decaff" font-size="20" font-weight="700">03 決策</text><text x="760" y="258" fill="#fff" font-size="18">禁止・限制・試辦・核准</text><rect x="925" y="175" width="220" height="125" rx="22" fill="#193c39" stroke="#57f0c1" stroke-width="3"/><text x="1035" y="220" fill="#8bf7d8" font-size="20" font-weight="700">04 配置</text><text x="1035" y="258" fill="#fff" font-size="18">身分・DLP・留存・日誌</text>
<rect x="635" y="425" width="250" height="125" rx="22" fill="#3b321f" stroke="#ffd37a" stroke-width="3"/><text x="760" y="470" fill="#ffe4a8" font-size="20" font-weight="700">05 驗收</text><text x="760" y="508" fill="#fff" font-size="18">阻擋・刪除・撤權・匯出</text><rect x="345" y="425" width="250" height="125" rx="22" fill="#3b2531" stroke="#ff9fbd" stroke-width="3"/><text x="470" y="470" fill="#ffc0d4" font-size="20" font-weight="700">06 複核</text><text x="470" y="508" fill="#fff" font-size="18">新工具・新資料・新風險</text></g>
<path d="M305 238H335" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M595 238H625" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M885 238H915" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1035 300V365H760V415" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M635 488H605" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M470 425V360H180V310" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="165" y="605" width="870" height="62" rx="20" fill="#17263d" stroke="#526985"/><text x="600" y="644" text-anchor="middle" fill="#d6e3f5" font-size="19">驗收證據：清冊、核准紀錄、技術設定、刪除證明、事件日誌與定期複核</text></g></svg>
