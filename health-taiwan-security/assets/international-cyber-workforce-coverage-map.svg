<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院資安工作角色與臨床服務覆蓋圖</title><desc id="desc">臨床核心服務由監控研判、事件指揮、身分權限、備份復原與供應商協調等工作角色共同支援，每項關鍵任務配置主責、備援與交接證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#11163a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="68" y="72" fill="#fff" font-size="34" font-weight="800">關鍵任務不能只掛在一個名字上</text><text x="68" y="111" fill="#9fb3d9" font-size="20">以臨床服務反推工作角色、主備覆蓋與交接證據</text><rect x="430" y="260" width="340" height="170" rx="34" fill="#16344a" stroke="#63e6ff" stroke-width="3"/><text x="600" y="318" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">臨床核心服務</text><text x="600" y="360" text-anchor="middle" fill="#b9c9e5" font-size="19">急診｜病歷｜影像｜檢驗｜藥事</text><text x="600" y="397" text-anchor="middle" fill="#7cebd5" font-size="19" font-weight="700">依服務中斷後果設定覆蓋</text><g fill="#102b42" stroke="#8fe8ff" stroke-width="2"><rect x="65" y="180" width="260" height="128" rx="24"/><rect x="65" y="420" width="260" height="128" rx="24"/><rect x="875" y="180" width="260" height="128" rx="24"/><rect x="875" y="420" width="260" height="128" rx="24"/></g><g fill="#fff" font-size="23" font-weight="700" text-anchor="middle"><text x="195" y="226">監控與研判</text><text x="195" y="466">身分與權限</text><text x="1005" y="226">事件指揮</text><text x="1005" y="466">備份與復原</text></g><g fill="#b9c9e5" font-size="17" text-anchor="middle"><text x="195" y="263">告警、分流、升級</text><text x="195" y="503">停權、特權、緊急存取</text><text x="1005" y="263">臨床、法遵、溝通協調</text><text x="1005" y="503">乾淨還原、切換、驗收</text></g><g stroke="#63e6ff" stroke-width="3" marker-end="url(#a)" fill="none"><path d="M325 244C380 244 385 292 430 310"/><path d="M325 484C380 484 385 418 430 392"/><path d="M875 244C820 244 815 292 770 310"/><path d="M875 484C820 484 815 418 770 392"/></g><rect x="292" y="585" width="616" height="82" rx="22" fill="#191f4b" stroke="#a997ff" stroke-width="2"/><text x="600" y="621" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">每項關鍵任務：主責＋備援＋值班路徑＋可驗證交接</text><text x="600" y="650" text-anchor="middle" fill="#c9c2ff" font-size="17">外包角色也必須納入能力、權限、升級與臨床情境驗收</text></g></svg>