<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧事件回應七階段流程</title><desc id="desc">醫療人工智慧事件從偵測、分類、定界、權限撤銷、臨床降級、重現證據保存到受控恢復與復盤的流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="700" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">AI 事件回應不是只拔網路線：要控制權限、臨床與證據</text><g font-size="19" text-anchor="middle"><rect x="45" y="145" width="145" height="120" rx="22" fill="#163552" stroke="#63e6ff"/><text x="117" y="190" fill="#63e6ff" font-weight="700">1 偵測</text><text x="117" y="225" fill="#dcecff">輸出、工具、漂移</text><rect x="205" y="145" width="145" height="120" rx="22" fill="#163552" stroke="#63e6ff"/><text x="277" y="190" fill="#63e6ff" font-weight="700">2 分類</text><text x="277" y="225" fill="#dcecff">攻擊／傷害／混合</text><rect x="365" y="145" width="145" height="120" rx="22" fill="#24345b" stroke="#a997ff"/><text x="437" y="190" fill="#c7baff" font-weight="700">3 定界</text><text x="437" y="225" fill="#eee9ff">版本、資料、工具</text><rect x="525" y="145" width="145" height="120" rx="22" fill="#24345b" stroke="#a997ff"/><text x="597" y="190" fill="#c7baff" font-weight="700">4 控制</text><text x="597" y="225" fill="#eee9ff">撤權、隔離、停用</text><rect x="685" y="145" width="145" height="120" rx="22" fill="#17423f" stroke="#57f0c1"/><text x="757" y="190" fill="#57f0c1" font-weight="700">5 降級</text><text x="757" y="225" fill="#eafff8">人工覆核／替代流程</text><rect x="845" y="145" width="145" height="120" rx="22" fill="#17423f" stroke="#57f0c1"/><text x="917" y="190" fill="#57f0c1" font-weight="700">6 保存</text><text x="917" y="225" fill="#eafff8">重現包與時間線</text><rect x="1005" y="145" width="145" height="120" rx="22" fill="#3c2d3e" stroke="#ffb86b"/><text x="1077" y="190" fill="#ffca8c" font-weight="700">7 恢復</text><text x="1077" y="225" fill="#fff1df">驗證、放行、復盤</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M190 205H200"/><path d="M350 205H360"/><path d="M510 205H520"/><path d="M670 205H680"/><path d="M830 205H840"/><path d="M990 205H1000"/></g>
<rect x="70" y="350" width="510" height="235" rx="28" fill="#10243e" stroke="#63e6ff"/><text x="325" y="397" fill="#63e6ff" text-anchor="middle" font-size="25" font-weight="700">重現包最小欄位</text><g fill="#dcecff" font-size="20"><text x="115" y="445">• 模型、提示、資料與檢索版本</text><text x="115" y="485">• 工具狀態、權限決策與人工核准</text><text x="115" y="525">• 輸入輸出、時間戳與下游動作</text><text x="115" y="565">• 供應商服務版本與事件通知</text></g>
<rect x="620" y="350" width="510" height="235" rx="28" fill="#12343b" stroke="#57f0c1"/><text x="875" y="397" fill="#57f0c1" text-anchor="middle" font-size="25" font-weight="700">恢復放行四項證據</text><g fill="#eafff8" font-size="20"><text x="665" y="445">• 安全修正或版本回退完成</text><text x="665" y="485">• 臨床回歸與人工覆核可運作</text><text x="665" y="525">• 撤權、停用與降級仍可即時執行</text><text x="665" y="565">• 觀察期門檻與重新開案條件明確</text></g><text x="600" y="646" fill="#9fb3d9" text-anchor="middle" font-size="19">無法重現不代表事件不存在；必須先保存足以界定「可重現範圍」的狀態。</text></g></svg>