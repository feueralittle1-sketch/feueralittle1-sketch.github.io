<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療雲端採購與退出生命週期</title><desc id="desc">由資料分類、法域盤點、條款設計、技術驗收到退出演練的五階段流程，每階段都有臨床與資安證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#13254b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#62e5ff"/></marker></defs><rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#eef8ff" font-size="34" font-weight="700">雲端治理從採購前開始，以退出演練完成閉環</text><text x="60" y="108" fill="#9fb8d8" font-size="19">每一階段保留決策、組態、測試與臨床持續運作證據</text>
<g font-family="Arial, Noto Sans TC, sans-serif"><g stroke="#62e5ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M255 310H300"/><path d="M475 310H520"/><path d="M695 310H740"/><path d="M915 310H960"/></g>
<g><rect x="70" y="195" width="185" height="230" rx="24" fill="#11314a" stroke="#48dfff" stroke-width="3"/><circle cx="162" cy="240" r="25" fill="#48dfff"/><text x="162" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#071827">1</text><text x="162" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">資料分類</text><text x="162" y="334" text-anchor="middle" font-size="18" fill="#c9d9eb">用途・敏感度</text><text x="162" y="366" text-anchor="middle" font-size="18" fill="#c9d9eb">RTO／RPO</text><text x="162" y="398" text-anchor="middle" font-size="18" fill="#67f0c2">證據：資料流圖</text>
<rect x="290" y="195" width="185" height="230" rx="24" fill="#172f53" stroke="#7f9cff" stroke-width="3"/><circle cx="382" cy="240" r="25" fill="#7f9cff"/><text x="382" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#071827">2</text><text x="382" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">法域盤點</text><text x="382" y="334" text-anchor="middle" font-size="18" fill="#c9d9eb">處理與支援地點</text><text x="382" y="366" text-anchor="middle" font-size="18" fill="#c9d9eb">次處理者</text><text x="382" y="398" text-anchor="middle" font-size="18" fill="#67f0c2">證據：責任矩陣</text>
<rect x="510" y="195" width="185" height="230" rx="24" fill="#252b53" stroke="#aa91ff" stroke-width="3"/><circle cx="602" cy="240" r="25" fill="#aa91ff"/><text x="602" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#071827">3</text><text x="602" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">契約設計</text><text x="602" y="334" text-anchor="middle" font-size="18" fill="#c9d9eb">稽核・通報・金鑰</text><text x="602" y="366" text-anchor="middle" font-size="18" fill="#c9d9eb">移轉與刪除</text><text x="602" y="398" text-anchor="middle" font-size="18" fill="#67f0c2">證據：驗收條款</text>
<rect x="730" y="195" width="185" height="230" rx="24" fill="#193849" stroke="#67f0c2" stroke-width="3"/><circle cx="822" cy="240" r="25" fill="#67f0c2"/><text x="822" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#071827">4</text><text x="822" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">技術驗收</text><text x="822" y="334" text-anchor="middle" font-size="18" fill="#c9d9eb">存取・加密・日誌</text><text x="822" y="366" text-anchor="middle" font-size="18" fill="#c9d9eb">備援與事件通知</text><text x="822" y="398" text-anchor="middle" font-size="18" fill="#67f0c2">證據：測試紀錄</text>
<rect x="950" y="195" width="185" height="230" rx="24" fill="#3c2c3d" stroke="#ffb86b" stroke-width="3"/><circle cx="1042" cy="240" r="25" fill="#ffb86b"/><text x="1042" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#071827">5</text><text x="1042" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">退出演練</text><text x="1042" y="334" text-anchor="middle" font-size="18" fill="#c9d9eb">匯出・重建・切換</text><text x="1042" y="366" text-anchor="middle" font-size="18" fill="#c9d9eb">刪除證明</text><text x="1042" y="398" text-anchor="middle" font-size="18" fill="#67f0c2">證據：完成時間</text></g>
<path d="M1042 445C1042 575 170 575 170 450" fill="none" stroke="#ffb86b" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#a)"/><rect x="330" y="505" width="540" height="82" rx="20" fill="#0d2039" stroke="#ffb86b"/><text x="600" y="538" text-anchor="middle" fill="#ffd08b" font-size="21" font-weight="700">演練結果回饋下一輪採購與架構決策</text><text x="600" y="570" text-anchor="middle" fill="#c8d7e9" font-size="18">無法匯出、相依未列或切換超時，都必須形成改善項目</text></g></svg>