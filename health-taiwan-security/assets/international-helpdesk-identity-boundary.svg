<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療服務台身分重設信任邊界</title><desc id="desc">來電、視訊與訊息不得直接觸發帳號重設，必須經獨立回撥、既有裝置或主管核准等院方控制證據驗證。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="72" fill="#f7fbff" font-size="34" font-weight="800">聲音與影像只能提出請求，不能單獨證明身分</text><text x="60" y="108" fill="#9fb7d5" font-size="19">把可被仿冒的互動，轉成由院方掌握的多來源證據</text><rect x="60" y="174" width="250" height="260" rx="26" fill="#3d2438" stroke="#ff8fc8" stroke-width="2"/><text x="185" y="222" text-anchor="middle" fill="#ff9fd0" font-size="24" font-weight="800">不可信請求面</text><text x="185" y="270" text-anchor="middle" fill="#f7d9e9" font-size="19">來電顯示</text><text x="185" y="308" text-anchor="middle" fill="#f7d9e9" font-size="19">聲音／視訊外觀</text><text x="185" y="346" text-anchor="middle" fill="#f7d9e9" font-size="19">即時訊息與急迫說詞</text><text x="185" y="398" text-anchor="middle" fill="#f2a9cb" font-size="16">可被偽造、轉接或深偽生成</text><path d="M310 304h105" stroke="#ffb0d7" stroke-width="5"/><polygon points="415,304 397,294 397,314" fill="#ffb0d7"/><rect x="415" y="150" width="350" height="310" rx="28" fill="#112e4d" stroke="#63e6ff" stroke-width="3"/><text x="590" y="202" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="800">院方驗證閘門</text><text x="455" y="252" fill="#e6eefc" font-size="19">① 回撥已登錄院內號碼</text><text x="455" y="294" fill="#e6eefc" font-size="19">② 既有受管裝置確認</text><text x="455" y="336" fill="#e6eefc" font-size="19">③ 工單與主管雙人核准</text><text x="455" y="378" fill="#e6eefc" font-size="19">④ 高風險重設延遲生效</text><text x="455" y="420" fill="#a9bdd9" font-size="16">驗證來源須彼此獨立且可稽核</text><path d="M765 304h105" stroke="#72f5cd" stroke-width="5"/><polygon points="870,304 852,294 852,314" fill="#72f5cd"/><rect x="870" y="174" width="270" height="260" rx="26" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="1005" y="222" text-anchor="middle" fill="#72f5cd" font-size="24" font-weight="800">受控動作面</text><text x="1005" y="272" text-anchor="middle" fill="#ddfff4" font-size="19">重設密碼／MFA</text><text x="1005" y="310" text-anchor="middle" fill="#ddfff4" font-size="19">解鎖帳號</text><text x="1005" y="348" text-anchor="middle" fill="#ddfff4" font-size="19">核發臨時權杖</text><text x="1005" y="400" text-anchor="middle" fill="#9cebd2" font-size="16">通知、限時、最小權限</text><rect x="130" y="512" width="940" height="105" rx="24" fill="#4b331d" stroke="#ffbd66" stroke-width="2"/><text x="600" y="554" text-anchor="middle" fill="#ffd08a" font-size="22" font-weight="800">核心原則</text><text x="600" y="590" text-anchor="middle" fill="#fff1d7" font-size="19">高風險帳號復原必須跳出原通道，以院方既有資料與設備完成獨立驗證</text></g></svg>