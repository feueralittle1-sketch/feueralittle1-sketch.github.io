<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療身分風險、控制與驗收證據矩陣</title><desc id="desc">將釣魚代理、權杖竊取、管理權限、共用終端與帳號復原風險，對應控制及可驗收證據。</desc><rect width="1200" height="700" rx="36" fill="#081827"/><text x="60" y="70" fill="#f8fafc" font-family="system-ui,Noto Sans TC" font-size="34" font-weight="700">風險控制必須留下可重現的驗收證據</text><g font-family="system-ui,Noto Sans TC"><rect x="55" y="120" width="1090" height="66" rx="18" fill="#173251"/><g fill="#a5f3fc" font-size="21" font-weight="700"><text x="82" y="161">風險情境</text><text x="385" y="161">主要控制</text><text x="790" y="161">驗收證據</text></g><g font-size="18"><rect x="55" y="200" width="1090" height="82" rx="14" fill="#111f35"/><text x="82" y="234" fill="#fecdd3">代理釣魚攔截 OTP</text><text x="385" y="234" fill="#dbeafe">FIDO2／Passkey、網域綁定</text><text x="790" y="234" fill="#d1fae5">測試網域不符時登入失敗</text><text x="82" y="260" fill="#94a3b8">密碼與一次性碼仍可被轉送</text><text x="385" y="260" fill="#94a3b8">高風險入口禁止弱式後備</text><text x="790" y="260" fill="#94a3b8">高影響身分保護覆蓋率</text><rect x="55" y="294" width="1090" height="82" rx="14" fill="#0d2940"/><text x="82" y="328" fill="#fecdd3">工作階段權杖被竊</text><text x="385" y="328" fill="#dbeafe">裝置條件、短效權杖、撤銷</text><text x="790" y="328" fill="#d1fae5">撤銷後重放測試遭拒</text><text x="82" y="354" fill="#94a3b8">通過 MFA 後仍可能被冒用</text><text x="385" y="354" fill="#94a3b8">異常風險觸發重新驗證</text><text x="790" y="354" fill="#94a3b8">高風險工作階段處置時間</text><rect x="55" y="388" width="1090" height="82" rx="14" fill="#111f35"/><text x="82" y="422" fill="#fecdd3">管理權限被接管</text><text x="385" y="422" fill="#dbeafe">獨立管理帳號、PAM、JIT</text><text x="790" y="422" fill="#d1fae5">升權審批與工作階段紀錄</text><text x="82" y="448" fill="#94a3b8">單一帳號擴大影響範圍</text><text x="385" y="448" fill="#94a3b8">日常帳號不得直接管理</text><text x="790" y="448" fill="#94a3b8">永久特權帳號數與例外期限</text><rect x="55" y="482" width="1090" height="82" rx="14" fill="#0d2940"/><text x="82" y="516" fill="#fecdd3">共用終端與臨床急迫性</text><text x="385" y="516" fill="#dbeafe">快速切換、短逾時、區域政策</text><text x="790" y="516" fill="#d1fae5">交班、急診與停機情境測試</text><text x="82" y="542" fill="#94a3b8">過度摩擦引發共用帳號</text><text x="385" y="542" fill="#94a3b8">依場景設計而非全面放寬</text><text x="790" y="542" fill="#94a3b8">失敗登入與繞道事件趨勢</text><rect x="55" y="576" width="1090" height="82" rx="14" fill="#111f35"/><text x="82" y="610" fill="#fecdd3">復原流程成為繞道</text><text x="385" y="610" fill="#dbeafe">強身分核驗、雙人覆核、告警</text><text x="790" y="610" fill="#d1fae5">模擬遺失與 break-glass 演練</text><text x="82" y="636" fill="#94a3b8">服務台被社交工程利用</text><text x="385" y="636" fill="#94a3b8">緊急帳號隔離並用後複核</text><text x="790" y="636" fill="#94a3b8">復原與緊急存取完整稽核軌跡</text></g></g></svg>