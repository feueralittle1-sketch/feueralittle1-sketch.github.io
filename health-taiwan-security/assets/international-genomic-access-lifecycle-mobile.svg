<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">手機版基因資料存取生命週期</title><desc id="desc">研究申請經核准、隔離分析、輸出審查、監控後撤權結案。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102c4c"/></linearGradient></defs><rect width="720" height="1180" rx="32" fill="url(#g)"/><text x="42" y="66" fill="#fff" font-size="33" font-weight="800">基因資料存取生命週期</text><text x="42" y="106" fill="#9fb8dc" font-size="22">每一步都有核准、監控與關閉證據</text><g font-family="sans-serif"><path d="M110 190v790" stroke="#29496f" stroke-width="12" stroke-linecap="round"/><g><circle cx="110" cy="205" r="46" fill="#12344f" stroke="#66e3ff" stroke-width="4"/><text x="110" y="214" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">1</text><text x="185" y="198" fill="#fff" font-size="28" font-weight="700">申請</text><text x="185" y="232" fill="#b9cbe3" font-size="22">目的、範圍、期間</text></g><g><circle cx="110" cy="360" r="46" fill="#1d315d" stroke="#aa98ff" stroke-width="4"/><text x="110" y="369" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">2</text><text x="185" y="353" fill="#fff" font-size="28" font-weight="700">核准</text><text x="185" y="387" fill="#b9cbe3" font-size="22">機構責任＋資料方審查</text></g><g><circle cx="110" cy="515" r="46" fill="#1d315d" stroke="#aa98ff" stroke-width="4"/><text x="110" y="524" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">3</text><text x="185" y="508" fill="#fff" font-size="28" font-weight="700">分析</text><text x="185" y="542" fill="#b9cbe3" font-size="22">隔離運算＋最小權限</text></g><g><circle cx="110" cy="670" r="46" fill="#153b3f" stroke="#72f0c1" stroke-width="4"/><text x="110" y="679" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">4</text><text x="185" y="663" fill="#fff" font-size="28" font-weight="700">輸出</text><text x="185" y="697" fill="#b9cbe3" font-size="22">揭露風險與最小結果審查</text></g><g><circle cx="110" cy="825" r="46" fill="#4a3520" stroke="#ffbc6b" stroke-width="4"/><text x="110" y="834" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">5</text><text x="185" y="818" fill="#fff" font-size="28" font-weight="700">監控</text><text x="185" y="852" fill="#b9cbe3" font-size="22">異常、再驗證、事件處置</text></g><g><circle cx="110" cy="980" r="46" fill="#4a2536" stroke="#ff7fa9" stroke-width="4"/><text x="110" y="989" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">6</text><text x="185" y="973" fill="#fff" font-size="28" font-weight="700">撤權</text><text x="185" y="1007" fill="#b9cbe3" font-size="22">帳號、工作區與資料結案</text></g></g><rect x="45" y="1060" width="630" height="82" rx="20" fill="#0b1d36" stroke="#29496f"/><text x="360" y="1094" text-anchor="middle" fill="#7ee7ff" font-size="23" font-weight="700">停止條件</text><text x="360" y="1127" text-anchor="middle" fill="#e6eefc" font-size="20">用途變更、異常、違規、期限屆滿即暫停</text></svg>