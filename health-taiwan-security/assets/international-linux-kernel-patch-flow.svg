<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Linux 核心漏洞處置與重啟驗證流程</title><desc id="desc">從版本比對、曝險限制與證據保全，經備援切換、更新重啟、核心驗證及臨床驗收到分批恢復。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11274a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">安全修補是一條「保全—切換—重啟—驗收」鏈</text><text x="58" y="108" fill="#a9bfdf" font-size="20">安裝套件後仍須重啟到修正版核心，並驗證服務、監控與回復路徑</text>
<g font-size="21" font-weight="700" text-anchor="middle"><rect x="55" y="180" width="190" height="130" rx="22" fill="#132b50" stroke="#8fa8ff" stroke-width="3"/><text x="150" y="232" fill="#c6d1ff">1 版本比對</text><text x="150" y="270" fill="#dce8f8" font-size="17" font-weight="400">執行核心／供應商狀態</text>
<rect x="285" y="180" width="190" height="130" rx="22" fill="#132b50" stroke="#ffbd69" stroke-width="3"/><text x="380" y="232" fill="#ffcf8c">2 先降曝險</text><text x="380" y="270" fill="#dce8f8" font-size="17" font-weight="400">入口、帳號、功能限制</text>
<rect x="515" y="180" width="190" height="130" rx="22" fill="#132b50" stroke="#ff7da9" stroke-width="3"/><text x="610" y="232" fill="#ff9fc1">3 保全證據</text><text x="610" y="270" fill="#dce8f8" font-size="17" font-weight="400">主機外日誌／入侵分流</text>
<rect x="745" y="180" width="190" height="130" rx="22" fill="#132b50" stroke="#69e7ff" stroke-width="3"/><text x="840" y="232" fill="#69e7ff">4 備援切換</text><text x="840" y="270" fill="#dce8f8" font-size="17" font-weight="400">維持臨床與回復能力</text>
<rect x="975" y="180" width="170" height="130" rx="22" fill="#132b50" stroke="#5aefbe" stroke-width="3"/><text x="1060" y="232" fill="#7ff3cf">5 更新重啟</text><text x="1060" y="270" fill="#dce8f8" font-size="17" font-weight="400">可信套件／修正版核心</text></g>
<g stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"><path d="M245 245H275"/><path d="M475 245H505"/><path d="M705 245H735"/><path d="M935 245H965"/></g>
<rect x="120" y="425" width="280" height="150" rx="24" fill="#0c203b" stroke="#69e7ff" stroke-width="3"/><text x="260" y="476" text-anchor="middle" fill="#69e7ff" font-size="23" font-weight="700">核心層驗證</text><text x="260" y="518" text-anchor="middle" fill="#dce8f8" font-size="19">執行版本、模組、啟動錯誤</text><text x="260" y="553" text-anchor="middle" fill="#a9bfdf" font-size="17">弱點掃描須讀取現況</text>
<rect x="460" y="425" width="280" height="150" rx="24" fill="#0c203b" stroke="#5aefbe" stroke-width="3"/><text x="600" y="476" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">服務與臨床驗收</text><text x="600" y="518" text-anchor="middle" fill="#dce8f8" font-size="19">介接、資料庫、設備、登入</text><text x="600" y="553" text-anchor="middle" fill="#a9bfdf" font-size="17">由系統擁有人共同確認</text>
<rect x="800" y="425" width="280" height="150" rx="24" fill="#0c203b" stroke="#ffbd69" stroke-width="3"/><text x="940" y="476" text-anchor="middle" fill="#ffcf8c" font-size="23" font-weight="700">分批恢復與觀察</text><text x="940" y="518" text-anchor="middle" fill="#dce8f8" font-size="19">監控、回復點、下一批次</text><text x="940" y="553" text-anchor="middle" fill="#a9bfdf" font-size="17">異常立即停止擴散</text>
<path d="M1060 320V370H260V415" fill="none" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M400 500H450" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M740 500H790" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/>
<rect x="245" y="630" width="710" height="48" rx="18" fill="#331e35" stroke="#ff7da9"/><text x="600" y="662" text-anchor="middle" fill="#ffd5e3" font-size="19">出現入侵跡象時：停止一般修補路徑，改走隔離、鑑識與可信重建</text></g></svg>
