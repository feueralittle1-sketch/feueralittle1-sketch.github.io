<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1000" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安學習六階段生命週期</title><desc id="desc">威脅訊號依序進入角色映射、短課設計、安全演練、行為量測與改善重驗。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102244"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3z" fill="#65e6ff"/></marker></defs><rect width="390" height="1000" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="24" y="46" fill="#fff" font-size="23" font-weight="800">六階段持續學習閉環</text><text x="24" y="75" fill="#a9bddf" font-size="15">由真實訊號觸發，以改善重驗結案</text><g><rect x="22" y="105" width="346" height="112" rx="20" fill="#102b45" stroke="#63e6ff"/><text x="45" y="143" fill="#63e6ff" font-size="16" font-weight="800">01 蒐集訊號</text><text x="45" y="179" fill="#fff" font-size="19" font-weight="700">威脅、事件與稽核發現</text><rect x="22" y="245" width="346" height="112" rx="20" fill="#152a4c" stroke="#8fb1ff"/><text x="45" y="283" fill="#9dbbff" font-size="16" font-weight="800">02 映射角色</text><text x="45" y="319" fill="#fff" font-size="19" font-weight="700">任務、資料、權限與後果</text><rect x="22" y="385" width="346" height="112" rx="20" fill="#28254d" stroke="#c99cff"/><text x="45" y="423" fill="#d2aeff" font-size="16" font-weight="800">03 設計短課</text><text x="45" y="459" fill="#fff" font-size="19" font-weight="700">單一行為目標與回報入口</text><rect x="22" y="525" width="346" height="112" rx="20" fill="#163a43" stroke="#66efbf"/><text x="45" y="563" fill="#7af5c9" font-size="16" font-weight="800">04 安全演練</text><text x="45" y="599" fill="#fff" font-size="19" font-weight="700">停止條件與臨床保護</text><rect x="22" y="665" width="346" height="112" rx="20" fill="#173747" stroke="#5bd7e8"/><text x="45" y="703" fill="#80ecfa" font-size="16" font-weight="800">05 量測行為</text><text x="45" y="739" fill="#fff" font-size="19" font-weight="700">辨識、回報、升級與處置</text><rect x="22" y="805" width="346" height="112" rx="20" fill="#3b3020" stroke="#ffd166"/><text x="45" y="843" fill="#ffd978" font-size="16" font-weight="800">06 改善重驗</text><text x="45" y="879" fill="#fff" font-size="19" font-weight="700">修流程、工具並保存證據</text></g><g stroke="#65e6ff" stroke-width="3" marker-end="url(#a)"><path d="M195 220V238"/><path d="M195 360V378"/><path d="M195 500V518"/><path d="M195 640V658"/><path d="M195 780V798"/></g><rect x="22" y="945" width="346" height="36" rx="12" fill="#0c1d34"/><text x="41" y="969" fill="#9fe9ff" font-size="13" font-weight="700">角色基線・改善期限・重驗結果・風險接受</text></g></svg>