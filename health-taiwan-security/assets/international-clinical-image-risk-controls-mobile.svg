<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1480" role="img" aria-labelledby="title desc"><title id="title">手機版臨床影像風險與控制對照</title><desc id="desc">五項臨床影像風險分別對應主要控制與可查驗證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient></defs><rect width="720" height="1480" rx="28" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="44" y="68" fill="#fff" font-size="34" font-weight="800">臨床影像風險</text><text x="44" y="110" fill="#63e6ff" font-size="34" font-weight="800">與控制對照</text><text x="44" y="150" fill="#9fb3d9" font-size="20">預防、偵測、關閉證據缺一不可</text><g><rect x="52" y="205" width="616" height="210" rx="24" fill="#261b36" stroke="#ff7fa3"/><text x="82" y="253" fill="#ffb4c6" font-size="24" font-weight="800">個人裝置與雲端殘留</text><text x="82" y="301" fill="#c6d4eb" font-size="20">控制：受管裝置、自動上傳、禁止本機備份</text><text x="82" y="349" fill="#57f0c1" font-size="20">證據：抽查相簿與同步設定</text><rect x="52" y="445" width="616" height="210" rx="24" fill="#112945" stroke="#63e6ff"/><text x="82" y="493" fill="#fff" font-size="24" font-weight="800">病人或部位錯配</text><text x="82" y="541" fill="#c6d4eb" font-size="20">控制：床邊雙重核對、立即綁定案件</text><text x="82" y="589" fill="#57f0c1" font-size="20">證據：影像與病歷一致率</text><rect x="52" y="685" width="616" height="210" rx="24" fill="#112945" stroke="#a997ff"/><text x="82" y="733" fill="#fff" font-size="24" font-weight="800">教學、研究用途漂移</text><text x="82" y="781" fill="#c6d4eb" font-size="20">控制：用途分區、去識別、重新核准</text><text x="82" y="829" fill="#57f0c1" font-size="20">證據：跨用途存取紀錄</text><rect x="52" y="925" width="616" height="210" rx="24" fill="#112945" stroke="#63e6ff"/><text x="82" y="973" fill="#fff" font-size="24" font-weight="800">大量匯出與非核准分享</text><text x="82" y="1021" fill="#c6d4eb" font-size="20">控制：匯出閘門、浮水印、異常告警</text><text x="82" y="1069" fill="#57f0c1" font-size="20">證據：匯出人、對象與檔案數</text><rect x="52" y="1165" width="616" height="235" rx="24" fill="#102f3d" stroke="#57f0c1"/><text x="82" y="1213" fill="#fff" font-size="24" font-weight="800">到期刪除但副本仍存在</text><text x="82" y="1261" fill="#c6d4eb" font-size="20">控制：保存規則、例外到期、全路徑刪除</text><text x="82" y="1309" fill="#57f0c1" font-size="20">證據：刪除報告與殘留掃描</text></g></g></svg>