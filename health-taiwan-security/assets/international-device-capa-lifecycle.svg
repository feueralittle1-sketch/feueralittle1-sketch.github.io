<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安 CAPA 七階段生命週期</title><desc id="desc">從偵測、定界、風險分級、根因分析、矯正預防、臨床驗證到證據關閉的閉環流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111f3d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="700" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">資安 CAPA：不是修補完成，而是風險與臨床效能都被驗證</text><path d="M165 340H1030" stroke="#244c70" stroke-width="10"/><g font-size="19" text-anchor="middle"><g transform="translate(145 340)"><circle r="68" fill="#153a55" stroke="#63e6ff" stroke-width="3"/><text y="-8" fill="#fff">1 偵測</text><text y="22" fill="#bdefff">建立紀錄</text></g><g transform="translate(300 340)"><circle r="68" fill="#173553" stroke="#71a7ff" stroke-width="3"/><text y="-8" fill="#fff">2 定界</text><text y="22" fill="#cfe0ff">版本／場域</text></g><g transform="translate(455 340)"><circle r="68" fill="#26375d" stroke="#a997ff" stroke-width="3"/><text y="-8" fill="#fff">3 分級</text><text y="22" fill="#ddd6ff">病人與營運</text></g><g transform="translate(610 340)"><circle r="68" fill="#3b315e" stroke="#d99cff" stroke-width="3"/><text y="-8" fill="#fff">4 根因</text><text y="22" fill="#f2d4ff">產品與流程</text></g><g transform="translate(765 340)"><circle r="68" fill="#164451" stroke="#57f0c1" stroke-width="3"/><text y="-8" fill="#fff">5 行動</text><text y="22" fill="#cffff0">矯正／預防</text></g><g transform="translate(920 340)"><circle r="68" fill="#164451" stroke="#57f0c1" stroke-width="3"/><text y="-8" fill="#fff">6 驗證</text><text y="22" fill="#cffff0">安全與臨床</text></g><g transform="translate(1075 340)"><circle r="68" fill="#24424a" stroke="#f6c85f" stroke-width="3"/><text y="-8" fill="#fff">7 關閉</text><text y="22" fill="#fff0bd">證據與重評</text></g></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"><path d="M213 340H232"/><path d="M368 340H387"/><path d="M523 340H542"/><path d="M678 340H697"/><path d="M833 340H852"/><path d="M988 340H1007"/></g><path d="M1075 425C1075 555 610 585 300 505" fill="none" stroke="#f6c85f" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="720" y="590" fill="#f6c85f" font-size="21">有效性不足、風險改變或再次發生 → 回到定界與根因分析</text><g fill="#9fb3d9" font-size="19"><text x="100" y="160">輸入：漏洞、客訴、事故、遙測、供應商與法規訊號</text><text x="100" y="650">輸出：變更紀錄、風險評估、臨床回歸、通知、完成證明與持續監測門檻</text></g></g></svg>