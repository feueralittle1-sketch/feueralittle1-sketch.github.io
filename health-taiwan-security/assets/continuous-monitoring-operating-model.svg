<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療持續監控營運模型</title>
  <desc id="desc">從身分、端點、網路、雲端與醫療設備蒐集事件，經 SIEM、EDR、XDR 與 SOC 或 MDR 完成偵測、處置及證據保存。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061526"/><stop offset="1" stop-color="#171536"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f5fbff" font-size="36" font-weight="800">持續監控是一條可執行的偵測與回應鏈</text>
  <text x="60" y="110" fill="#a9bddb" font-size="22">事件來源、分析能力、責任角色與臨床處置必須連成閉環</text>
  <g text-anchor="middle"><rect x="55" y="165" width="260" height="430" rx="28" fill="#102d45" stroke="#63e6ff" stroke-width="3"/><text x="185" y="215" fill="#8fe8ff" font-size="28" font-weight="800">事件來源</text><text x="185" y="275" fill="#d9f4ff" font-size="22">身分與特權存取</text><text x="185" y="325" fill="#d9f4ff" font-size="22">伺服器與端點</text><text x="185" y="375" fill="#d9f4ff" font-size="22">網路與雲端控制面</text><text x="185" y="425" fill="#d9f4ff" font-size="22">醫療設備與介接</text><text x="185" y="475" fill="#d9f4ff" font-size="22">備份與還原平台</text><rect x="85" y="520" width="200" height="48" rx="15" fill="#123b4d"/><text x="185" y="552" fill="#9ff8dc" font-size="19">完整性・時間同步・留存</text>
  <rect x="400" y="165" width="350" height="430" rx="28" fill="#25234a" stroke="#9c8cff" stroke-width="3"/><text x="575" y="215" fill="#d8d0ff" font-size="28" font-weight="800">分析與關聯</text><text x="575" y="275" fill="#eeeaff" font-size="23" font-weight="700">SIEM</text><text x="575" y="310" fill="#c8c0e8" font-size="19">集中日誌、規則與證據查詢</text><text x="575" y="365" fill="#eeeaff" font-size="23" font-weight="700">EDR／XDR</text><text x="575" y="400" fill="#c8c0e8" font-size="19">端點遙測、跨域關聯與回應</text><text x="575" y="455" fill="#eeeaff" font-size="23" font-weight="700">情境與分級</text><text x="575" y="490" fill="#c8c0e8" font-size="19">資產重要度、威脅、臨床影響</text><rect x="450" y="525" width="250" height="48" rx="15" fill="#342e66"/><text x="575" y="557" fill="#e1dcff" font-size="19">輸出：可處置且可追溯的告警</text>
  <rect x="835" y="165" width="310" height="430" rx="28" fill="#143a35" stroke="#57f0c1" stroke-width="3"/><text x="990" y="215" fill="#9ff8dc" font-size="28" font-weight="800">SOC／MDR 執行</text><text x="990" y="275" fill="#d7efe9" font-size="22">確認與升級</text><text x="990" y="325" fill="#d7efe9" font-size="22">隔離與權限撤回</text><text x="990" y="375" fill="#d7efe9" font-size="22">臨床影響協調</text><text x="990" y="425" fill="#d7efe9" font-size="22">根因與證據保全</text><text x="990" y="475" fill="#d7efe9" font-size="22">規則調整與復盤</text><rect x="870" y="520" width="240" height="48" rx="15" fill="#195047"/><text x="990" y="552" fill="#bafbe7" font-size="19">驗收：MTTD／MTTR 與閉環率</text></g>
  <g stroke="#63e6ff" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M315 380H390"/><path d="M750 380H825"/></g>
  <rect x="170" y="630" width="860" height="52" rx="18" fill="#0d263b" stroke="#416989" stroke-width="2"/><text x="600" y="663" text-anchor="middle" fill="#dcecff" font-size="21">工具產生訊號；醫院仍須定義責任、臨床升級門檻與核准過的回應動作</text>
</svg>
