<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院電信中斷切換流程</title><desc id="desc">從確認範圍到啟動指揮、切換替代管道、保護容量、持續驗證與分段恢復。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151d42"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="70" fill="#fff" font-size="34" font-weight="800">通訊中斷：六步切換與恢復</text><text x="70" y="108" fill="#9fb3d9" font-size="19">技術修復與臨床通訊必須並行</text><g font-family="sans-serif"><g><rect x="70" y="180" width="160" height="160" rx="28" fill="#102844" stroke="#63e6ff" stroke-width="3"/><circle cx="110" cy="220" r="23" fill="#63e6ff"/><text x="110" y="228" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">1</text><text x="150" y="225" fill="#fff" font-size="22" font-weight="800">確認範圍</text><text x="95" y="275" fill="#c6d4eb" font-size="17">網路／電信</text><text x="95" y="303" fill="#c6d4eb" font-size="17">雲端／身分</text></g><path d="M230 260H265" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="275" y="180" width="160" height="160" rx="28" fill="#142a45" stroke="#71a7ff" stroke-width="3"/><circle cx="315" cy="220" r="23" fill="#71a7ff"/><text x="315" y="228" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">2</text><text x="355" y="225" fill="#fff" font-size="22" font-weight="800">啟動指揮</text><text x="300" y="275" fill="#c6d4eb" font-size="17">唯一頻道</text><text x="300" y="303" fill="#c6d4eb" font-size="17">紙本紀錄</text></g><path d="M435 260H470" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="480" y="180" width="160" height="160" rx="28" fill="#1b2547" stroke="#a997ff" stroke-width="3"/><circle cx="520" cy="220" r="23" fill="#a997ff"/><text x="520" y="228" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">3</text><text x="560" y="225" fill="#fff" font-size="22" font-weight="800">切換管道</text><text x="505" y="275" fill="#c6d4eb" font-size="17">第二電信商</text><text x="505" y="303" fill="#c6d4eb" font-size="17">無線電／衛星</text></g><path d="M640 260H675" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="685" y="180" width="160" height="160" rx="28" fill="#17333d" stroke="#57f0c1" stroke-width="3"/><circle cx="725" cy="220" r="23" fill="#57f0c1"/><text x="725" y="228" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">4</text><text x="765" y="225" fill="#fff" font-size="22" font-weight="800">保護容量</text><text x="710" y="275" fill="#c6d4eb" font-size="17">急診與轉送</text><text x="710" y="303" fill="#c6d4eb" font-size="17">指揮優先</text></g><path d="M845 260H880" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="890" y="180" width="160" height="160" rx="28" fill="#253044" stroke="#f2c94c" stroke-width="3"/><circle cx="930" cy="220" r="23" fill="#f2c94c"/><text x="930" y="228" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">5</text><text x="970" y="225" fill="#fff" font-size="22" font-weight="800">持續驗證</text><text x="915" y="275" fill="#c6d4eb" font-size="17">送達／電力</text><text x="915" y="303" fill="#c6d4eb" font-size="17">未聯絡單位</text></g><path d="M970 340V405" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="470" y="420" width="500" height="150" rx="28" fill="#122846" stroke="#63e6ff" stroke-width="3"/><circle cx="520" cy="465" r="23" fill="#63e6ff"/><text x="520" y="473" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">6</text><text x="565" y="472" fill="#fff" font-size="24" font-weight="800">分段恢復</text><text x="515" y="520" fill="#c6d4eb" font-size="19">先驗證語音、資料、身分與紀錄完整性，再退回日常流程</text></g><path d="M470 495H280V360" fill="none" stroke="#f2c94c" stroke-width="3" stroke-dasharray="10 9"/><rect x="70" y="620" width="1060" height="54" rx="20" fill="#0b1b32" stroke="#ffffff" stroke-opacity=".18"/><text x="600" y="654" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">每次演練都要記錄切換時間、雙向送達率、容量缺口與恢復後對帳結果</text></g></svg>