<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 960" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安院級風險組合架構</title><desc id="desc">各類醫療風險經共同治理閘門轉成院級風險組合與資源決策。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="390" height="960" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><text x="195" y="40" fill="#fff" font-size="21" font-weight="800">院級資安風險組合</text><text x="195" y="68" fill="#9fb3d9" font-size="14">技術缺口轉成可共同決策的風險</text><g font-size="18" font-weight="700"><rect x="45" y="95" width="300" height="82" rx="18" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="195" y="127" fill="#63e6ff">臨床服務</text><text x="195" y="154" fill="#d8e6fb" font-size="14" font-weight="400">停診、延誤、病安</text><rect x="45" y="195" width="300" height="82" rx="18" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="195" y="227" fill="#c5baff">資訊與設備</text><text x="195" y="254" fill="#e8e3ff" font-size="14" font-weight="400">系統、裝置、身分</text><rect x="45" y="295" width="300" height="82" rx="18" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="195" y="327" fill="#57f0c1">外部依賴</text><text x="195" y="354" fill="#d9fff3" font-size="14" font-weight="400">雲端、供應商、設施</text></g><path d="M195 385V420" stroke="#63e6ff" stroke-width="6"/><path d="M184 410L195 425L206 410" fill="#63e6ff"/><rect x="35" y="435" width="320" height="270" rx="24" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="195" y="475" fill="#a8c8ff" font-size="20" font-weight="800">共同風險治理閘門</text><g fill="#e6eefc" font-size="15" text-anchor="start"><text x="70" y="520">01　情境與臨床結果</text><text x="70" y="560">02　可能性、衝擊、時間</text><text x="70" y="600">03　共同依賴與連鎖風險</text><text x="70" y="640">04　控制證據與剩餘風險</text><text x="70" y="680">05　主責、期限、升級門檻</text></g><path d="M195 712V747" stroke="#63e6ff" stroke-width="6"/><path d="M184 737L195 752L206 737" fill="#63e6ff"/><rect x="35" y="762" width="320" height="145" rx="24" fill="#2b2340" stroke="#ffb86b" stroke-width="3"/><text x="195" y="800" fill="#ffcf99" font-size="20" font-weight="800">院級風險組合</text><text x="195" y="838" fill="#fff0dd" font-size="15">容忍度、資源、風險回應</text><text x="195" y="870" fill="#fff0dd" font-size="15">高階監督、指標、重驗</text><text x="195" y="940" fill="#57f0c1" font-size="13">不是分數相加，而是共同決策</text></g></svg>