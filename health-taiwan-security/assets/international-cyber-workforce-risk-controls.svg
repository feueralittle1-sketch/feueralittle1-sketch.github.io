<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療資安人力單點風險與控制矩陣</title><desc id="desc">將單一專家、外包黑箱、臨床脈絡不足、權限衝突與交班斷裂等風險，對應雙人覆蓋、契約驗收、臨床跟班、職務分離與交接演練。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#11163a"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="68" y="72" fill="#fff" font-size="34" font-weight="800">人力風險要用情境與證據關閉</text><text x="68" y="111" fill="#9fb3d9" font-size="20">職稱完整不等於能力覆蓋，外包也不等於責任移轉</text><g font-size="19" font-weight="800"><rect x="70" y="165" width="320" height="62" rx="18" fill="#3a1730" stroke="#ff7eb6"/><text x="230" y="204" text-anchor="middle" fill="#ffd2e5">失敗模式</text><rect x="440" y="165" width="300" height="62" rx="18" fill="#16344a" stroke="#63e6ff"/><text x="590" y="204" text-anchor="middle" fill="#d8f8ff">控制方法</text><rect x="790" y="165" width="340" height="62" rx="18" fill="#252051" stroke="#a997ff"/><text x="960" y="204" text-anchor="middle" fill="#e4dfff">驗收證據</text></g><g fill="#102033" stroke="#ffffff" stroke-opacity=".12"><rect x="70" y="250" width="1060" height="72" rx="16"/><rect x="70" y="335" width="1060" height="72" rx="16"/><rect x="70" y="420" width="1060" height="72" rx="16"/><rect x="70" y="505" width="1060" height="72" rx="16"/></g><g font-size="18"><g fill="#ffd2e5" font-weight="700"><text x="95" y="294">只有一人懂關鍵平台</text><text x="95" y="379">外包服務內容不透明</text><text x="95" y="464">分析員不懂臨床優先序</text><text x="95" y="549">交班與特權集中同一人</text></g><g fill="#d8f8ff"><text x="465" y="294">主備雙人、跟班與程序化</text><text x="465" y="379">角色、工具、日誌、升級寫入契約</text><text x="465" y="464">臨床情境訓練與服務地圖</text><text x="465" y="549">職務分離、限時權限、交班清單</text></g><g fill="#e4dfff"><text x="815" y="294">備援者完成停權或復原情境</text><text x="815" y="379">供應商告警可追到處置與回報</text><text x="815" y="464">高影響告警在時限內正確升級</text><text x="815" y="549">夜班交接無遺漏且操作可歸責</text></g></g><rect x="180" y="620" width="840" height="58" rx="20" fill="#172147" stroke="#7cebd5" stroke-width="2"/><text x="600" y="657" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">每季抽測至少一項「主責缺席」情境，才看得見真正的單點</text></g></svg>