<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc"><title id="title">手機版病人數位身分風險控制圖</title><desc id="desc">五項病人數位身分錢包風險及其控制與驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#19264b"/></linearGradient></defs><rect width="390" height="1120" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="40" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">身分錢包風險與控制</text><text x="195" y="68" text-anchor="middle" fill="#9fb3d9" font-size="13">格式通過不等於病人配對與帳號治理完成</text><g><rect x="25" y="95" width="340" height="180" rx="20" fill="#10213d" stroke="#ff7a9d" stroke-width="2"/><text x="50" y="130" fill="#ff9db7" font-size="18" font-weight="800">偽造或失效憑證</text><text x="50" y="165" fill="#e6eefc" font-size="14">控制：信任清冊、簽章、狀態、防重播</text><text x="50" y="202" fill="#d8f7ff" font-size="14">證據：測試向量、拒絕紀錄、查詢時間</text><rect x="25" y="290" width="340" height="180" rx="20" fill="#172b4d" stroke="#ffb86b" stroke-width="2"/><text x="50" y="325" fill="#ffcf99" font-size="18" font-weight="800">過度揭露身分資料</text><text x="50" y="360" fill="#e6eefc" font-size="14">控制：目的綁定、最小欄位、明確同意</text><text x="50" y="397" fill="#d8f7ff" font-size="14">證據：欄位對照、同意、留存期限</text><rect x="25" y="485" width="340" height="180" rx="20" fill="#10213d" stroke="#a997ff" stroke-width="2"/><text x="50" y="520" fill="#c5baff" font-size="18" font-weight="800">錯誤病人配對</text><text x="50" y="555" fill="#e6eefc" font-size="14">控制：多欄位比對、衝突暫停、人工覆核</text><text x="50" y="592" fill="#d8f7ff" font-size="14">證據：錯配率、重複率、覆核軌跡</text><rect x="25" y="680" width="340" height="180" rx="20" fill="#172b4d" stroke="#57f0c1" stroke-width="2"/><text x="50" y="715" fill="#57f0c1" font-size="18" font-weight="800">裝置遺失或轉手</text><text x="50" y="750" fill="#e6eefc" font-size="14">控制：裝置解鎖、短效會話、遠端撤銷</text><text x="50" y="787" fill="#d8f7ff" font-size="14">證據：撤銷時效、舊裝置阻擋、換機測試</text><rect x="25" y="875" width="340" height="180" rx="20" fill="#10213d" stroke="#63e6ff" stroke-width="2"/><text x="50" y="910" fill="#63e6ff" font-size="18" font-weight="800">復原流程遭社交工程</text><text x="50" y="945" fill="#e6eefc" font-size="14">控制：獨立驗證、冷卻期、通知、再確認</text><text x="50" y="982" fill="#d8f7ff" font-size="14">證據：復原工單、通知、敏感操作攔截</text></g><text x="195" y="1090" text-anchor="middle" fill="#57f0c1" font-size="13">每項控制都要能重演、撤回並留下證據</text></g></svg>
