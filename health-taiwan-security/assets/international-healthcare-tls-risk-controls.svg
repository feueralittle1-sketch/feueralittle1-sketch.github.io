<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療 TLS 遷移風險與控制</title><desc id="desc">一次停用舊協定、永久相容例外、代理成為單點、測試不足與缺少握手遙測等風險，對應分波切換、期限治理、高可用、負向測試及持續監測。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#172345"/></linearGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="55" y="66" fill="#fff" font-size="34" font-weight="800">遷移失敗通常不是演算法問題，而是依賴沒有被看見</text><text x="55" y="103" fill="#afc3e2" font-size="20">風險、控制與驗收證據必須同時存在</text><g font-size="18" font-weight="800"><text x="65" y="158" fill="#ff9bb7">失敗模式</text><text x="430" y="158" fill="#63e6ff">控制方法</text><text x="835" y="158" fill="#57f0c1">驗收證據</text></g><g><rect x="45" y="180" width="1110" height="80" rx="18" fill="#0d2038" stroke="#294a6f"/><text x="65" y="215" fill="#fff" font-size="20" font-weight="700">一次停用舊協定</text><text x="65" y="241" fill="#c3d3e8" font-size="16">設備與介接突然斷線</text><text x="430" y="228" fill="#d7e4f5" font-size="18">被動觀測、分波切換、停止條件</text><text x="835" y="228" fill="#c9f8e9" font-size="18">握手成功率、臨床事件、回退紀錄</text><rect x="45" y="275" width="1110" height="80" rx="18" fill="#0d2038" stroke="#294a6f"/><text x="65" y="310" fill="#fff" font-size="20" font-weight="700">永久相容例外</text><text x="65" y="336" fill="#c3d3e8" font-size="16">舊版本成為固定入口</text><text x="430" y="323" fill="#d7e4f5" font-size="18">隔離區、最小路徑、到期重驗</text><text x="835" y="323" fill="#c9f8e9" font-size="18">例外責任人、期限、退場里程碑</text><rect x="45" y="370" width="1110" height="80" rx="18" fill="#0d2038" stroke="#294a6f"/><text x="65" y="405" fill="#fff" font-size="20" font-weight="700">相容代理成為單點</text><text x="65" y="431" fill="#c3d3e8" font-size="16">故障或遭入侵擴大中斷</text><text x="430" y="418" fill="#d7e4f5" font-size="18">高可用、管理面隔離、最小權限</text><text x="835" y="418" fill="#c9f8e9" font-size="18">切換演練、組態基線、獨立日誌</text><rect x="45" y="465" width="1110" height="80" rx="18" fill="#0d2038" stroke="#294a6f"/><text x="65" y="500" fill="#fff" font-size="20" font-weight="700">只驗成功連線</text><text x="65" y="526" fill="#c3d3e8" font-size="16">忽略錯誤憑證與降級攻擊</text><text x="430" y="513" fill="#d7e4f5" font-size="18">負向測試、憑證撤銷、降級阻擋</text><text x="835" y="513" fill="#c9f8e9" font-size="18">失敗樣本、告警、阻擋與復原證據</text><rect x="45" y="560" width="1110" height="80" rx="18" fill="#0d2038" stroke="#294a6f"/><text x="65" y="595" fill="#fff" font-size="20" font-weight="700">沒有持續握手遙測</text><text x="65" y="621" fill="#c3d3e8" font-size="16">舊版本悄悄回流</text><text x="430" y="608" fill="#d7e4f5" font-size="18">版本基線、漂移偵測、定期掃描</text><text x="835" y="608" fill="#c9f8e9" font-size="18">舊協定流量趨勢與異常追蹤</text></g></g></svg>