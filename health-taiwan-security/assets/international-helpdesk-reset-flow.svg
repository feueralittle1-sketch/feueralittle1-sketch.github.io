<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療服務台高風險帳號重設流程</title><desc id="desc">帳號重設依請求分級、獨立驗證、雙人核准、限時復原、通知監測與證據結案六階段執行。</desc><rect width="1200" height="680" rx="34" fill="#08182d"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="72" fill="#f7fbff" font-size="34" font-weight="800">六階段把「急著重設」變成可驗收流程</text><text x="60" y="108" fill="#9fb7d5" font-size="19">特權、臨床核心與遠端帳號使用更嚴格的證據與冷卻條件</text><g stroke="#4d789f" stroke-width="5"><path d="M220 258h70"/><path d="M410 258h70"/><path d="M600 258h70"/><path d="M790 258h70"/><path d="M980 258h70"/></g><g><rect x="50" y="176" width="170" height="164" rx="22" fill="#183752" stroke="#63e6ff" stroke-width="2"/><text x="135" y="218" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">1 請求分級</text><text x="135" y="260" text-anchor="middle" fill="#e6eefc" font-size="17">帳號類型</text><text x="135" y="292" text-anchor="middle" fill="#e6eefc" font-size="17">臨床影響</text><text x="135" y="320" text-anchor="middle" fill="#a9bdd9" font-size="15">急迫不降標</text><rect x="240" y="176" width="170" height="164" rx="22" fill="#243451" stroke="#a997ff" stroke-width="2"/><text x="325" y="218" text-anchor="middle" fill="#c3b8ff" font-size="21" font-weight="800">2 獨立驗證</text><text x="325" y="260" text-anchor="middle" fill="#eeeaff" font-size="17">回撥／裝置</text><text x="325" y="292" text-anchor="middle" fill="#eeeaff" font-size="17">既有院方資料</text><text x="325" y="320" text-anchor="middle" fill="#bdb4e6" font-size="15">拒絕自帶證據</text><rect x="430" y="176" width="170" height="164" rx="22" fill="#3d303f" stroke="#ff9fd0" stroke-width="2"/><text x="515" y="218" text-anchor="middle" fill="#ffadd5" font-size="21" font-weight="800">3 雙人核准</text><text x="515" y="260" text-anchor="middle" fill="#fae4ef" font-size="17">服務台＋主管</text><text x="515" y="292" text-anchor="middle" fill="#fae4ef" font-size="17">工單綁定</text><text x="515" y="320" text-anchor="middle" fill="#d5a6bd" font-size="15">特權另加系統主責</text><rect x="620" y="176" width="170" height="164" rx="22" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="705" y="218" text-anchor="middle" fill="#72f5cd" font-size="21" font-weight="800">4 限時復原</text><text x="705" y="260" text-anchor="middle" fill="#ddfff4" font-size="17">短效憑證</text><text x="705" y="292" text-anchor="middle" fill="#ddfff4" font-size="17">最小權限</text><text x="705" y="320" text-anchor="middle" fill="#9cebd2" font-size="15">高風險延遲生效</text><rect x="810" y="176" width="170" height="164" rx="22" fill="#253b54" stroke="#71a7ff" stroke-width="2"/><text x="895" y="218" text-anchor="middle" fill="#9ec2ff" font-size="21" font-weight="800">5 通知監測</text><text x="895" y="260" text-anchor="middle" fill="#e4edff" font-size="17">原使用者通知</text><text x="895" y="292" text-anchor="middle" fill="#e4edff" font-size="17">異常登入監測</text><text x="895" y="320" text-anchor="middle" fill="#adc0df" font-size="15">可立即撤銷</text><rect x="1000" y="176" width="170" height="164" rx="22" fill="#4b331d" stroke="#ffbd66" stroke-width="2"/><text x="1085" y="218" text-anchor="middle" fill="#ffd08a" font-size="21" font-weight="800">6 證據結案</text><text x="1085" y="260" text-anchor="middle" fill="#fff1d7" font-size="17">驗證與核准</text><text x="1085" y="292" text-anchor="middle" fill="#fff1d7" font-size="17">通知與撤銷</text><text x="1085" y="320" text-anchor="middle" fill="#e1bd86" font-size="15">抽查與改善</text></g><rect x="105" y="416" width="990" height="166" rx="26" fill="#112942" stroke="#315b7d" stroke-width="2"/><text x="145" y="462" fill="#63e6ff" font-size="23" font-weight="800">驗收證據</text><text x="145" y="508" fill="#e6eefc" font-size="18">請求來源與時間 · 風險等級 · 獨立驗證方式 · 核准者 · 實際變更 · 通知結果</text><text x="145" y="548" fill="#e6eefc" font-size="18">臨時權限到期 · 異常監測結果 · 撤銷紀錄 · 例外理由與有效期限</text></g></svg>