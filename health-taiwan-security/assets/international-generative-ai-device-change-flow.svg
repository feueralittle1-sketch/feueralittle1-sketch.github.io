<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">生成式人工智慧醫療器材的變更控制流程</title><desc id="desc">從能力基線、持續監測、變更觸發、影響分級、再驗證到受控發布與回退，形成可重複的模型更新治理流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">每次模型或提示變更都要先回答：醫療功能是否仍然相同？</text><text x="58" y="108" fill="#a9bfdf" font-size="20">變更不只看程式碼，也要看資料、供應商模型、提示、閾值、輸出格式與工作流程</text>
<g><rect x="55" y="190" width="180" height="150" rx="23" fill="#122b50" stroke="#8fa8ff" stroke-width="3"/><text x="145" y="235" text-anchor="middle" fill="#c6d1ff" font-size="22" font-weight="700">1 能力基線</text><text x="145" y="278" text-anchor="middle" fill="#e5eefb" font-size="17">用途／族群／情境</text><text x="145" y="312" text-anchor="middle" fill="#a9bfdf" font-size="16">安全與效能門檻</text>
<rect x="275" y="190" width="180" height="150" rx="23" fill="#122b50" stroke="#69e7ff" stroke-width="3"/><text x="365" y="235" text-anchor="middle" fill="#69e7ff" font-size="22" font-weight="700">2 持續監測</text><text x="365" y="278" text-anchor="middle" fill="#e5eefb" font-size="17">錯誤／拒答／覆核</text><text x="365" y="312" text-anchor="middle" fill="#a9bfdf" font-size="16">族群與場域差異</text>
<rect x="495" y="190" width="180" height="150" rx="23" fill="#18395b" stroke="#ffbd69" stroke-width="4"/><text x="585" y="235" text-anchor="middle" fill="#ffcf8c" font-size="22" font-weight="700">3 變更觸發</text><text x="585" y="278" text-anchor="middle" fill="#fff" font-size="17">模型／提示／資料</text><text x="585" y="312" text-anchor="middle" fill="#ff9fc1" font-size="16">事件或漂移訊號</text>
<rect x="715" y="190" width="180" height="150" rx="23" fill="#122b50" stroke="#ff7da9" stroke-width="3"/><text x="805" y="235" text-anchor="middle" fill="#ff9fc1" font-size="22" font-weight="700">4 影響分級</text><text x="805" y="278" text-anchor="middle" fill="#e5eefb" font-size="17">用途是否改變？</text><text x="805" y="312" text-anchor="middle" fill="#a9bfdf" font-size="16">風險是否超出邊界？</text>
<rect x="935" y="190" width="210" height="150" rx="23" fill="#122b50" stroke="#5aefbe" stroke-width="3"/><text x="1040" y="235" text-anchor="middle" fill="#7ff3cf" font-size="22" font-weight="700">5 再驗證</text><text x="1040" y="278" text-anchor="middle" fill="#e5eefb" font-size="17">回歸／壓力／臨床</text><text x="1040" y="312" text-anchor="middle" fill="#a9bfdf" font-size="16">子族群與人因測試</text></g>
<path d="M235 265H265M455 265H485M675 265H705M895 265H925" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="230" y="455" width="300" height="150" rx="24" fill="#0c203b" stroke="#5aefbe" stroke-width="3"/><text x="380" y="500" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">受控發布</text><text x="380" y="542" text-anchor="middle" fill="#dce8f8" font-size="18">灰度導入／核准／監測加密</text><text x="380" y="578" text-anchor="middle" fill="#a9bfdf" font-size="17">保留舊版與回退路徑</text>
<rect x="670" y="455" width="300" height="150" rx="24" fill="#0c203b" stroke="#ff7da9" stroke-width="3"/><text x="820" y="500" text-anchor="middle" fill="#ff9fc1" font-size="23" font-weight="700">停止或回退</text><text x="820" y="542" text-anchor="middle" fill="#dce8f8" font-size="18">門檻未過／事件／用途偏移</text><text x="820" y="578" text-anchor="middle" fill="#a9bfdf" font-size="17">切換人工流程並保全證據</text>
<path d="M1040 340V400H380V443" fill="none" stroke="#5aefbe" stroke-width="5" marker-end="url(#a)"/><path d="M1040 340V420H820V443" fill="none" stroke="#ff7da9" stroke-width="4" marker-end="url(#a)"/><path d="M230 530H145V350" fill="none" stroke="#9c8cff" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#a)"/><text x="600" y="674" text-anchor="middle" fill="#a9bfdf" font-size="17">驗證通過才發布；證據不足、風險越界或無法回退時不得上線</text></g></svg>