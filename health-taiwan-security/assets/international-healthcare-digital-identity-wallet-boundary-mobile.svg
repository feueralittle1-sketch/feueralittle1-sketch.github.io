<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 980" role="img" aria-labelledby="title desc"><title id="title">手機版病人數位身分錢包信任邊界</title><desc id="desc">可信發行者與病人錢包經醫院驗證綁定後，才可連接病人入口並留下稽核證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172650"/></linearGradient></defs><rect width="390" height="980" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><text x="195" y="40" fill="#fff" font-size="21" font-weight="800">數位憑證不是醫療帳號</text><text x="195" y="67" fill="#9fb3d9" font-size="13">驗證後仍須完成院內病人配對與授權</text><rect x="35" y="95" width="320" height="90" rx="18" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="195" y="128" fill="#57f0c1" font-size="19" font-weight="800">可信發行者</text><text x="195" y="158" fill="#d9fff3" font-size="14">簽發憑證・維護狀態與撤銷</text><rect x="35" y="205" width="320" height="90" rx="18" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="195" y="238" fill="#c5baff" font-size="19" font-weight="800">病人錢包</text><text x="195" y="268" fill="#ece8ff" font-size="14">同意出示必要欄位・裝置解鎖</text><path d="M195 305V345" stroke="#63e6ff" stroke-width="6"/><path d="M184 334L195 350L206 334" fill="#63e6ff"/><rect x="25" y="360" width="340" height="305" rx="24" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="195" y="400" fill="#a8c8ff" font-size="20" font-weight="800">醫院驗證與綁定閘門</text><g fill="#e6eefc" font-size="15" text-anchor="start"><text x="55" y="445">01　簽章、發行者、有效期</text><text x="55" y="490">02　憑證狀態與防重播</text><text x="55" y="535">03　最小必要欄位</text><text x="55" y="580">04　病人主索引配對</text><text x="55" y="625">05　同意、綁定、例外留證</text></g><path d="M195 675V715" stroke="#63e6ff" stroke-width="6"/><path d="M184 704L195 720L206 704" fill="#63e6ff"/><rect x="35" y="730" width="320" height="90" rx="18" fill="#2b2340" stroke="#ffb86b" stroke-width="3"/><text x="195" y="764" fill="#ffcf99" font-size="19" font-weight="800">病人數位入口</text><text x="195" y="794" fill="#fff0dd" font-size="14">掛號、查詢、下載由院內授權決定</text><rect x="35" y="840" width="320" height="90" rx="18" fill="#153044" stroke="#63e6ff" stroke-width="3"/><text x="195" y="874" fill="#8fe8ff" font-size="19" font-weight="800">獨立證據面</text><text x="195" y="904" fill="#d8f7ff" font-size="14">驗證、綁定、撤銷、復原與異常</text><text x="195" y="956" fill="#57f0c1" font-size="14">出示身分 ≠ 自動取得醫療資料權限</text></g></svg>
