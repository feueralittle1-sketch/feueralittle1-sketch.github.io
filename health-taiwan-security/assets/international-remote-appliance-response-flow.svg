<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">遠端支援設備事件處置流程</title><desc id="desc">從範圍確認、隔離保全、修補與搜尋、憑證輪替、可信重建到受控恢復的六階段流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="36" font-weight="800">從緊急隔離到受控恢復：六個不可跳過的閘門</text><text x="60" y="112" fill="#9fb7db" font-size="22">修補處理漏洞；事件處置則要確認設備、憑證、連線與下游端點是否仍可信。</text>
<g font-family="Inter,Noto Sans TC,sans-serif"><rect x="55" y="180" width="170" height="220" rx="24" fill="#153052" stroke="#63e6ff" stroke-width="3"/><text x="140" y="225" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="800">01 範圍確認</text><text x="82" y="270" fill="#dceaff" font-size="18">部署型態</text><text x="82" y="305" fill="#dceaff" font-size="18">版本與曝險窗</text><text x="82" y="340" fill="#dceaff" font-size="18">維護目標清冊</text><text x="82" y="375" fill="#dceaff" font-size="18">高權限關聯</text>
<rect x="245" y="180" width="170" height="220" rx="24" fill="#263052" stroke="#8fb7ff" stroke-width="3"/><text x="330" y="225" text-anchor="middle" fill="#8fb7ff" font-size="21" font-weight="800">02 隔離保全</text><text x="272" y="270" fill="#dceaff" font-size="18">限制外部入口</text><text x="272" y="305" fill="#dceaff" font-size="18">匯出設備影像</text><text x="272" y="340" fill="#dceaff" font-size="18">保存外部日誌</text><text x="272" y="375" fill="#dceaff" font-size="18">維持替代維護</text>
<rect x="435" y="180" width="170" height="220" rx="24" fill="#302954" stroke="#b69cff" stroke-width="3"/><text x="520" y="225" text-anchor="middle" fill="#c8b7ff" font-size="21" font-weight="800">03 修補搜尋</text><text x="462" y="270" fill="#eee8ff" font-size="18">套用修補</text><text x="462" y="305" fill="#eee8ff" font-size="18">比對異常檔案</text><text x="462" y="340" fill="#eee8ff" font-size="18">檢查持久化</text><text x="462" y="375" fill="#eee8ff" font-size="18">擴大端點獵捕</text>
<rect x="625" y="180" width="170" height="220" rx="24" fill="#40263b" stroke="#ff8fb3" stroke-width="3"/><text x="710" y="225" text-anchor="middle" fill="#ffb5cc" font-size="21" font-weight="800">04 輪替撤權</text><text x="652" y="270" fill="#ffe7ef" font-size="18">設備儲存憑證</text><text x="652" y="305" fill="#ffe7ef" font-size="18">注入式特權帳號</text><text x="652" y="340" fill="#ffe7ef" font-size="18">工作階段與金鑰</text><text x="652" y="375" fill="#ffe7ef" font-size="18">新增 MFA 登錄</text>
<rect x="815" y="180" width="170" height="220" rx="24" fill="#133c43" stroke="#57f0c1" stroke-width="3"/><text x="900" y="225" text-anchor="middle" fill="#57f0c1" font-size="21" font-weight="800">05 可信重建</text><text x="842" y="270" fill="#ddfff6" font-size="18">乾淨映像</text><text x="842" y="305" fill="#ddfff6" font-size="18">最小路由</text><text x="842" y="340" fill="#ddfff6" font-size="18">安全組態基線</text><text x="842" y="375" fill="#ddfff6" font-size="18">外部日誌轉送</text>
<rect x="1005" y="180" width="140" height="220" rx="24" fill="#193642" stroke="#63e6ff" stroke-width="3"/><text x="1075" y="225" text-anchor="middle" fill="#63e6ff" font-size="20" font-weight="800">06 受控恢復</text><text x="1027" y="270" fill="#dceaff" font-size="17">逐批放行</text><text x="1027" y="305" fill="#dceaff" font-size="17">臨床驗證</text><text x="1027" y="340" fill="#dceaff" font-size="17">即時監看</text><text x="1027" y="375" fill="#dceaff" font-size="17">可回退</text></g>
<path d="M225 290 H245 M415 290 H435 M605 290 H625 M795 290 H815 M985 290 H1005" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="120" y="490" width="960" height="140" rx="28" fill="#0d203a" stroke="#7ba7ff" stroke-width="3"/><text x="165" y="535" fill="#8fb7ff" font-size="24" font-weight="800">共同放行條件</text><text x="165" y="578" fill="#d7e5ff" font-size="20">漏洞已處理　｜　持久化搜尋完成　｜　相關憑證已輪替　｜　日誌可離機保存</text><text x="165" y="610" fill="#d7e5ff" font-size="20">維護目標與臨床流程驗證通過　｜　異常時可立即中止並切回替代路徑</text></svg>