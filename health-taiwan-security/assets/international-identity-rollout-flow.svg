<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">醫療抗釣魚身分控制分階段導入流程</title><desc id="desc">由盤點身分與應用、風險分層、註冊 FIDO2、條件式存取、復原機制到演練與驗收的六階段流程。</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#132247"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="650" rx="36" fill="url(#b)"/><text x="64" y="72" fill="#f8fafc" font-family="system-ui,Noto Sans TC" font-size="34" font-weight="700">導入順序：先保護高影響身分，再擴大至臨床工作流程</text><text x="64" y="111" fill="#9fb3d9" font-family="system-ui,Noto Sans TC" font-size="19">每一道閘門都要有可核對證據，避免只有啟用率而沒有風險降低</text><g font-family="system-ui,Noto Sans TC"><g fill="#0d3042" stroke="#63e6ff" stroke-width="2"><rect x="60" y="180" width="310" height="125" rx="22"/><rect x="445" y="180" width="310" height="125" rx="22"/><rect x="830" y="180" width="310" height="125" rx="22"/><rect x="60" y="390" width="310" height="125" rx="22"/><rect x="445" y="390" width="310" height="125" rx="22"/><rect x="830" y="390" width="310" height="125" rx="22"/></g><g fill="#a5f3fc" font-size="23" font-weight="700"><text x="88" y="222">01 盤點</text><text x="473" y="222">02 分層</text><text x="858" y="222">03 註冊</text><text x="88" y="432">04 執行</text><text x="473" y="432">05 復原</text><text x="858" y="432">06 驗收</text></g><g fill="#dbeafe" font-size="18"><text x="88" y="258">身分、應用、共用終端</text><text x="88" y="284">舊式協定、供應商帳號</text><text x="473" y="258">管理者、遠端、雲端優先</text><text x="473" y="284">評估臨床中斷影響</text><text x="858" y="258">雙金鑰、身分核驗</text><text x="858" y="284">裝置綁定與備援方式</text><text x="88" y="468">封鎖舊式驗證</text><text x="88" y="494">條件式存取與 PAM</text><text x="473" y="468">遺失、停機、break-glass</text><text x="473" y="494">復原不得成為繞道路徑</text><text x="858" y="468">代理釣魚與權杖撤銷演練</text><text x="858" y="494">通過率、例外與處置時間</text></g></g><g fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#m)"><path d="M370 242H430"/><path d="M755 242H815"/><path d="M985 305V365"/><path d="M830 452H770"/><path d="M445 452H385"/></g><rect x="260" y="562" width="680" height="48" rx="24" fill="#172554" stroke="#a997ff"/><text x="600" y="593" text-anchor="middle" fill="#ddd6fe" font-family="system-ui,Noto Sans TC" font-size="19">驗收輸出：受保護身分清冊＋登入政策＋例外期限＋復原紀錄＋演練證據</text></svg>