<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療備份管理平面的信任邊界</title><desc id="desc">工作負載經受控備份管理元件寫入不可變備份庫；管理身分、外部證據庫與隔離驗證區分屬不同權限域。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#68e8ff"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">備份資料存在，不等於復原鏈可信</text><text x="60" y="108" fill="#a9bfdf" font-size="20">控制面、資料面與驗證面須使用不同身分與證據來源</text>
<rect x="55" y="180" width="245" height="170" rx="24" fill="#12294c" stroke="#8fa8ff" stroke-width="3"/><text x="178" y="230" text-anchor="middle" fill="#c5d1ff" font-size="25" font-weight="700">醫療工作負載</text><text x="178" y="273" text-anchor="middle" fill="#dce8f8" font-size="20">病歷／影像／介接</text><text x="178" y="310" text-anchor="middle" fill="#a9bfdf" font-size="18">RTO／RPO 與資料擁有人</text>
<rect x="385" y="155" width="300" height="220" rx="28" fill="#16375a" stroke="#ff7aa8" stroke-width="4"/><text x="535" y="212" text-anchor="middle" fill="#ff9fc0" font-size="27" font-weight="700">備份管理平面</text><text x="535" y="257" text-anchor="middle" fill="#fff" font-size="20">控制器／外掛／代理程式</text><text x="535" y="295" text-anchor="middle" fill="#dce8f8" font-size="19">排程、保留、複寫、還原</text><text x="535" y="333" text-anchor="middle" fill="#ffcf8b" font-size="18">高權限元件需獨立治理</text>
<rect x="770" y="180" width="370" height="170" rx="24" fill="#12294c" stroke="#59efbe" stroke-width="3"/><text x="955" y="230" text-anchor="middle" fill="#7ff3cf" font-size="25" font-weight="700">不可變／離線備份庫</text><text x="955" y="273" text-anchor="middle" fill="#dce8f8" font-size="20">限制刪除與保留政策變更</text><text x="955" y="310" text-anchor="middle" fill="#a9bfdf" font-size="18">原管理主機不能單獨清除</text>
<path d="M300 265H375" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/><path d="M685 265H760" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="65" y="460" width="310" height="145" rx="22" fill="#0c203b" stroke="#ffbd69" stroke-width="2"/><text x="220" y="505" text-anchor="middle" fill="#ffcf8b" font-size="23" font-weight="700">分離管理身分</text><text x="220" y="545" text-anchor="middle" fill="#dce8f8" font-size="19">寫入、刪除、還原核准</text><text x="220" y="578" text-anchor="middle" fill="#a9bfdf" font-size="18">短效憑證與雙人控制</text>
<rect x="445" y="460" width="310" height="145" rx="22" fill="#0c203b" stroke="#68e8ff" stroke-width="2"/><text x="600" y="505" text-anchor="middle" fill="#68e8ff" font-size="23" font-weight="700">外部證據庫</text><text x="600" y="545" text-anchor="middle" fill="#dce8f8" font-size="19">工作、認證、刪除與還原日誌</text><text x="600" y="578" text-anchor="middle" fill="#a9bfdf" font-size="18">可疑主機不能回寫</text>
<rect x="825" y="460" width="310" height="145" rx="22" fill="#0c203b" stroke="#59efbe" stroke-width="2"/><text x="980" y="505" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">隔離驗證區</text><text x="980" y="545" text-anchor="middle" fill="#dce8f8" font-size="19">掃描、還原、完整性與臨床測試</text><text x="980" y="578" text-anchor="middle" fill="#a9bfdf" font-size="18">無生產寫入權限</text></g></svg>
