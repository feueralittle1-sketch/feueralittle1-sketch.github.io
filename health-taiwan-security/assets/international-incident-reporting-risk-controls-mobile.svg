<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安事件通報風險與控制</title><desc id="desc">五項通報失敗模式及其治理控制以垂直卡片呈現。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#102743"/></linearGradient></defs><rect width="720" height="1160" rx="28" fill="url(#bg)"/><text x="38" y="62" fill="#f7fbff" font-size="29" font-weight="800">通報失敗模式與控制</text><text x="38" y="100" fill="#9fb7d5" font-size="18">送出不是終點，事實與證據必須持續閉環</text><g font-family="Arial, Noto Sans TC, sans-serif"><g><rect x="50" y="142" width="620" height="168" rx="22" fill="#3b2433"/><text x="80" y="184" fill="#ff9ab0" font-size="20" font-weight="800">風險 1｜只報一個窗口</text><text x="80" y="222" fill="#ffe2ed" font-size="17">其他義務可能仍未評估或完成</text><text x="80" y="270" fill="#72f5cd" font-size="18" font-weight="800">控制｜三軌判定矩陣</text><rect x="50" y="326" width="620" height="168" rx="22" fill="#3b2433"/><text x="80" y="368" fill="#ff9ab0" font-size="20" font-weight="800">風險 2｜過早定論</text><text x="80" y="406" fill="#ffe2ed" font-size="17">推測被寫成已確認事實</text><text x="80" y="454" fill="#72f5cd" font-size="18" font-weight="800">控制｜已知、未知、假設分開</text><rect x="50" y="510" width="620" height="168" rx="22" fill="#3b2433"/><text x="80" y="552" fill="#ff9ab0" font-size="20" font-weight="800">風險 3｜資訊過量</text><text x="80" y="590" fill="#ffe2ed" font-size="17">交付不必要的病人或敏感資料</text><text x="80" y="638" fill="#72f5cd" font-size="18" font-weight="800">控制｜最小揭露與安全傳輸</text><rect x="50" y="694" width="620" height="168" rx="22" fill="#3b2433"/><text x="80" y="736" fill="#ff9ab0" font-size="20" font-weight="800">風險 4｜版本衝突</text><text x="80" y="774" fill="#ffe2ed" font-size="17">技術、法務與臨床說法不一致</text><text x="80" y="822" fill="#72f5cd" font-size="18" font-weight="800">控制｜單一事實庫與版本核准</text><rect x="50" y="878" width="620" height="218" rx="22" fill="#3b2433"/><text x="80" y="920" fill="#ff9ab0" font-size="20" font-weight="800">風險 5｜送件後失聯</text><text x="80" y="958" fill="#ffe2ed" font-size="17">沒有補件、回覆、復原與關閉追蹤</text><text x="80" y="1006" fill="#72f5cd" font-size="18" font-weight="800">控制｜收件證明、未決事項、結案條件</text><text x="80" y="1050" fill="#c7d7eb" font-size="16">每一軌都要有責任人與完成狀態</text></g></g></svg>