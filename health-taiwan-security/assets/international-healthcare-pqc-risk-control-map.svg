<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療後量子遷移的風險與控制對照</title>
  <desc id="desc">將先蒐集後解密、隱藏密碼依賴、長壽命設備、供應商等待及過早自行導入等風險，對應資料分類、密碼探索、補償控制、契約證據與標準化試點。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#182346"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="68" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">五類遷移風險，需要五組可驗證控制</text><text x="600" y="106" text-anchor="middle" fill="#9fb3d9" font-size="20">避免把量子準備簡化成採購單一產品或一次性掃描</text><text x="245" y="158" text-anchor="middle" fill="#ffb4c0" font-size="24" font-weight="700">風險情境</text><text x="955" y="158" text-anchor="middle" fill="#9ff9df" font-size="24" font-weight="700">控制與驗收證據</text>
  <g><rect x="55" y="182" width="380" height="82" rx="19" fill="#4a2439" stroke="#ff7890"/><rect x="55" y="281" width="380" height="82" rx="19" fill="#4a2439" stroke="#ff7890"/><rect x="55" y="380" width="380" height="82" rx="19" fill="#4a2439" stroke="#ff7890"/><rect x="55" y="479" width="380" height="82" rx="19" fill="#4a2439" stroke="#ff7890"/><rect x="55" y="578" width="380" height="82" rx="19" fill="#4a2439" stroke="#ff7890"/><g fill="#fff" font-size="21" font-weight="700"><text x="85" y="216">長期敏感資料被先蒐集後解密</text><text x="85" y="315">程式庫、憑證與協定依賴未被看見</text><text x="85" y="414">長壽命設備無法直接升級</text><text x="85" y="513">供應商只有宣稱，沒有版本證據</text><text x="85" y="612">過早自製或全面切換造成中斷</text></g><g fill="#d9aeb9" font-size="16"><text x="85" y="243">風險發生可能早於量子電腦可用時間</text><text x="85" y="342">掃描範圍不足導致遷移缺口</text><text x="85" y="441">維護窗、認證與病人安全限制</text><text x="85" y="540">產品時程與互通性無法驗收</text><text x="85" y="639">非標準實作與效能退化</text></g></g>
  <g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M435 223H610"/><path d="M435 322H610"/><path d="M435 421H610"/><path d="M435 520H610"/><path d="M435 619H610"/></g><g><rect x="625" y="182" width="520" height="82" rx="19" fill="#164b4d" stroke="#57f0c1"/><rect x="625" y="281" width="520" height="82" rx="19" fill="#164b4d" stroke="#57f0c1"/><rect x="625" y="380" width="520" height="82" rx="19" fill="#164b4d" stroke="#57f0c1"/><rect x="625" y="479" width="520" height="82" rx="19" fill="#164b4d" stroke="#57f0c1"/><rect x="625" y="578" width="520" height="82" rx="19" fill="#164b4d" stroke="#57f0c1"/><g fill="#fff" font-size="21" font-weight="700"><text x="655" y="216">依保存期與揭露衝擊分類；優先保護長壽命資料</text><text x="655" y="315">自動探索＋架構訪談；記錄演算法、用途與責任人</text><text x="655" y="414">網段隔離、閘道轉換、汰換日期與風險核准</text><text x="655" y="513">要求支援矩陣、測試報告、回退條款與更新時程</text><text x="655" y="612">採公開標準，在隔離環境做效能與互通測試</text></g><g fill="#afe0d8" font-size="16"><text x="655" y="243">證據：資料類別、保存期限、加密路徑、優先批次</text><text x="655" y="342">證據：可重跑清冊、涵蓋率、未知項目與處置人</text><text x="655" y="441">證據：例外期限、監測結果、臨床降級與退場計畫</text><text x="655" y="540">證據：可重現版本、相容組合、責任界面與驗收結果</text><text x="655" y="639">證據：延遲、容量、失敗模式、回退與臨床觀察</text></g></g></g>
</svg>
