<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療端點加密風險、控制與驗收證據對照</title>
<desc id="desc">將無開機前驗證、臨床急用衝突、復原金鑰外洩、裝置已解鎖四類風險，對應 PIN 或網路解鎖、受控例外、金鑰權限分離、鎖定與遠端撤銷等控制及可查核證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient></defs><rect width="1200" height="760" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="74" fill="#fff" font-size="34" font-weight="700">風險不是「有沒有加密」，而是解鎖與復原是否受控</text><text x="70" y="112" fill="#a8bad8" font-size="20">控制必須同時照顧實體攻擊、臨床時效與金鑰濫用</text>
<text x="85" y="168" fill="#ff9fcb" font-size="20" font-weight="700">風險情境</text><text x="420" y="168" fill="#82edff" font-size="20" font-weight="700">主要控制</text><text x="825" y="168" fill="#8bf7d8" font-size="20" font-weight="700">驗收證據</text>
<g><rect x="60" y="190" width="1080" height="105" rx="20" fill="#10263c" stroke="#314c68"/><text x="85" y="230" fill="#fff" font-size="22" font-weight="700">無開機前驗證</text><text x="85" y="262" fill="#ffc2df" font-size="18">持有硬體即可嘗試離線攻擊</text><text x="420" y="230" fill="#fff" font-size="20">TPM＋PIN；固定端點評估網路解鎖</text><text x="420" y="262" fill="#a9f2ff" font-size="18">修補韌體、WinRE 與作業系統</text><text x="825" y="230" fill="#fff" font-size="20">關機後啟動測試</text><text x="825" y="262" fill="#bafbe7" font-size="18">設定報表與更新合規率</text></g>
<g><rect x="60" y="315" width="1080" height="105" rx="20" fill="#14263b" stroke="#314c68"/><text x="85" y="355" fill="#fff" font-size="22" font-weight="700">臨床急用衝突</text><text x="85" y="387" fill="#ffc2df" font-size="18">共享或緊急裝置無法及時解鎖</text><text x="420" y="355" fill="#fff" font-size="20">依情境分級；核定例外與替代控制</text><text x="420" y="387" fill="#a9f2ff" font-size="18">備援裝置、啟動時限與定期複核</text><text x="825" y="355" fill="#fff" font-size="20">急用流程計時</text><text x="825" y="387" fill="#bafbe7" font-size="18">例外責任人與到期日</text></g>
<g><rect x="60" y="440" width="1080" height="105" rx="20" fill="#18263a" stroke="#314c68"/><text x="85" y="480" fill="#fff" font-size="22" font-weight="700">復原金鑰外洩</text><text x="85" y="512" fill="#ffc2df" font-size="18">客服便利變成繞過驗證的捷徑</text><text x="420" y="480" fill="#fff" font-size="20">權限分離、強核身、最小權限</text><text x="420" y="512" fill="#a9f2ff" font-size="18">每次取用留痕並觸發後續處置</text><text x="825" y="480" fill="#fff" font-size="20">金鑰讀取稽核</text><text x="825" y="512" fill="#bafbe7" font-size="18">未授權存取告警測試</text></g>
<g><rect x="60" y="565" width="1080" height="105" rx="20" fill="#1c2639" stroke="#314c68"/><text x="85" y="605" fill="#fff" font-size="22" font-weight="700">裝置已解鎖</text><text x="85" y="637" fill="#ffc2df" font-size="18">磁碟加密不再阻擋目前工作階段</text><text x="420" y="605" fill="#fff" font-size="20">自動鎖定、休眠策略與遠端撤銷</text><text x="420" y="637" fill="#a9f2ff" font-size="18">限制本機資料並保護登入權杖</text><text x="825" y="605" fill="#fff" font-size="20">離席與失竊演練</text><text x="825" y="637" fill="#bafbe7" font-size="18">撤銷時間與資料清冊</text></g>
<text x="600" y="718" text-anchor="middle" fill="#94a3b8" font-size="18">驗收重點：從關機、啟動、登入、離席到復原，每一種狀態都要有可重現結果</text></g></svg>