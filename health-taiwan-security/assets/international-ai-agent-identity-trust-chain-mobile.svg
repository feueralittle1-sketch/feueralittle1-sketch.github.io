<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">醫療 AI Agent 身分與授權信任鏈手機版</title><desc id="desc">任務發起者、代理身分、授權閘門、臨床工具與稽核證據的垂直流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#101537"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="720" height="1100" rx="30" fill="url(#bg)"/><text x="48" y="70" fill="#fff" font-size="32" font-weight="800">可信操作鏈</text><text x="48" y="108" fill="#9fb3d9" font-size="19">人、代理、權限、工具、證據分開辨識</text><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><g fill="#102b42" stroke="#63e6ff" stroke-width="2"><rect x="90" y="160" width="540" height="135" rx="22"/><rect x="90" y="350" width="540" height="135" rx="22"/><rect x="90" y="540" width="540" height="135" rx="22"/><rect x="90" y="730" width="540" height="135" rx="22"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="360" y="210">任務發起者</text><text x="360" y="400">代理身分</text><text x="360" y="590">授權閘門</text><text x="360" y="780">臨床工具</text></g><g fill="#b9c9e5" font-size="18"><text x="360" y="250">具名人員／目的／責任</text><text x="360" y="440">唯一 ID／版本／短效憑證</text><text x="360" y="630">範圍／時效／情境／人工覆核</text><text x="360" y="820">只開必要資料與動作</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M360 295V340"/><path d="M360 485V530"/><path d="M360 675V720"/></g><rect x="70" y="925" width="580" height="120" rx="24" fill="#171d46" stroke="#a997ff" stroke-width="2"/><text x="360" y="973" fill="#fff" font-size="24" font-weight="800">獨立稽核與撤銷證據</text><text x="360" y="1010" fill="#c9c2ff" font-size="17">授權者｜代理行動｜資料｜結果｜撤權</text></g></svg>