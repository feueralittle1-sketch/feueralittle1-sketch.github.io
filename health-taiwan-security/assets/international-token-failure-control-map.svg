<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">權杖失敗模式與控制對照</title><desc id="desc">將簽章金鑰外洩、權杖重播、驗證錯誤與日誌不足，對應預防、偵測及復原控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#251b3d"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="78" fill="#f4f8ff" font-size="38" font-weight="800">失敗模式必須同時配置預防、偵測與復原</text><text x="70" y="120" fill="#9fb3d9" font-size="24">只強化登入仍可能留下已簽發權杖、簽章金鑰與驗證邏輯的缺口。</text>
<g font-family="Noto Sans TC, sans-serif"><text x="90" y="196" fill="#fda4af" font-size="25" font-weight="700">失敗模式</text><text x="390" y="196" fill="#63e6ff" font-size="25" font-weight="700">預防</text><text x="690" y="196" fill="#facc15" font-size="25" font-weight="700">偵測</text><text x="960" y="196" fill="#57f0c1" font-size="25" font-weight="700">復原</text>
<g font-size="21"><rect x="60" y="220" width="1080" height="100" rx="18" fill="#101d34"/><text x="90" y="262" fill="#ffe0e5" font-weight="700">簽章金鑰外洩</text><text x="90" y="292" fill="#9fb3d9">可偽造大量身分證據</text><text x="390" y="276" fill="#d5f7ff">隔離金鑰、短輪替週期</text><text x="690" y="276" fill="#fff2a8">異常簽發與驗證差異</text><text x="960" y="276" fill="#b9ffe9">停用金鑰、全面撤銷</text>
<rect x="60" y="340" width="1080" height="100" rx="18" fill="#151b39"/><text x="90" y="382" fill="#ffe0e5" font-weight="700">權杖竊取／重播</text><text x="90" y="412" fill="#9fb3d9">繞過再次輸入密碼</text><text x="390" y="396" fill="#d5f7ff">短效、綁定裝置或請求</text><text x="690" y="396" fill="#fff2a8">來源跳轉、重複使用</text><text x="960" y="396" fill="#b9ffe9">撤銷工作階段、降權</text>
<rect x="60" y="460" width="1080" height="100" rx="18" fill="#101d34"/><text x="90" y="502" fill="#ffe0e5" font-weight="700">驗證邏輯錯誤</text><text x="90" y="532" fill="#9fb3d9">接受錯誤受眾或簽發者</text><text x="390" y="516" fill="#d5f7ff">共用驗證元件與負向測試</text><text x="690" y="516" fill="#fff2a8">跨租戶／異常受眾事件</text><text x="960" y="516" fill="#b9ffe9">封鎖路徑、回退版本</text>
<rect x="60" y="580" width="1080" height="90" rx="18" fill="#151b39"/><text x="90" y="635" fill="#ffe0e5" font-weight="700">日誌不足</text><text x="390" y="635" fill="#d5f7ff">定義必要事件與保存期</text><text x="690" y="635" fill="#fff2a8">獨立關聯身分與 API 記錄</text><text x="960" y="635" fill="#b9ffe9">保全證據、重建事件時序</text></g></g></svg>