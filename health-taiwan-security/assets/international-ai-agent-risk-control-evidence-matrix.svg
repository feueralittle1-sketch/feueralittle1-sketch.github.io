<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">醫療 AI Agent 風險控制證據矩陣</title><desc id="desc">將目標劫持、工具濫用、權限濫用、記憶污染及人工過度信任對應控制與驗收證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#151f43"/></linearGradient></defs><rect width="1200" height="780" rx="32" fill="url(#bg)"/><text x="58" y="68" fill="#fff" font-family="Noto Sans TC, sans-serif" font-size="34" font-weight="800">風險、控制與證據必須一一對應</text><text x="58" y="106" fill="#a8bad8" font-family="Noto Sans TC, sans-serif" font-size="20">只寫「有人監督」不足以驗收；必須看得到控制何時觸發</text>
<g font-family="Noto Sans TC, sans-serif"><rect x="50" y="150" width="1100" height="66" rx="18" fill="#214268"/><text x="85" y="191" fill="#7cecff" font-size="21" font-weight="750">風險</text><text x="390" y="191" fill="#7cecff" font-size="21" font-weight="750">控制</text><text x="790" y="191" fill="#7cecff" font-size="21" font-weight="750">驗收證據</text>
<g fill="#10263f" stroke="#365375"><rect x="50" y="230" width="1100" height="92" rx="16"/><rect x="50" y="334" width="1100" height="92" rx="16"/><rect x="50" y="438" width="1100" height="92" rx="16"/><rect x="50" y="542" width="1100" height="92" rx="16"/><rect x="50" y="646" width="1100" height="92" rx="16"/></g>
<g fill="#ffb0bc" font-size="20" font-weight="700"><text x="85" y="270">目標劫持／提示注入</text><text x="85" y="374">工具與參數濫用</text><text x="85" y="478">身分與權限濫用</text><text x="85" y="582">記憶／情境污染</text><text x="85" y="686">人工過度信任</text></g>
<g fill="#d4deef" font-size="18"><text x="390" y="265">分離指令與不可信內容</text><text x="390" y="293">來源標記、策略檢查、拒絕規則</text><text x="390" y="369">工具白名單、型別與範圍驗證</text><text x="390" y="397">次數／金額／時間上限、回滾</text><text x="390" y="473">Agent 獨立身分、短效憑證</text><text x="390" y="501">最小權限、用途綁定、撤權</text><text x="390" y="577">寫入需驗證、區隔工作階段</text><text x="390" y="605">版本化、到期、清除與回復</text><text x="390" y="681">高風險動作顯示影響與差異</text><text x="390" y="709">具名核准、雙人覆核、接管</text></g>
<g fill="#8ff2d0" font-size="18"><text x="790" y="265">惡意病歷附件測試被阻擋</text><text x="790" y="293">日誌保留原始來源與拒絕理由</text><text x="790" y="369">越界參數測試未送達後端</text><text x="790" y="397">失敗交易可回復且有告警</text><text x="790" y="473">過期憑證與停用帳號均失效</text><text x="790" y="501">工具權限與用途清冊一致</text><text x="790" y="577">污染內容可定位、隔離、清除</text><text x="790" y="605">清除後行為回歸基準</text><text x="790" y="681">核准畫面能看懂患者與動作影響</text><text x="790" y="709">可重建核准者、時間與執行結果</text></g></g></svg>