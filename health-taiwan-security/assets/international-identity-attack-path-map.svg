<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療身分攻擊與抗釣魚控制路徑圖</title><desc id="desc">攻擊者由釣魚代理頁面取得密碼與工作階段，對照 FIDO2 抗釣魚驗證、條件式存取與特權隔離的阻斷位置。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#10234a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fb7185"/></marker></defs>
<rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="70" y="76" fill="#f8fafc" font-size="34" font-weight="700">身分攻擊不只偷密碼，也偷登入後的工作階段</text><text x="70" y="115" fill="#9fb3d9" font-size="19">控制要同時處理驗證來源、裝置情境、權限層級與工作階段</text>
<g font-family="system-ui,Noto Sans TC" font-size="22" text-anchor="middle" filter="url(#s)"><rect x="60" y="205" width="210" height="112" rx="22" fill="#3b1625" stroke="#fb7185"/><text x="165" y="250" fill="#fecdd3" font-weight="700">釣魚代理頁面</text><text x="165" y="283" fill="#fda4af" font-size="17">攔截密碼、OTP</text><rect x="350" y="205" width="210" height="112" rx="22" fill="#3b1625" stroke="#fb7185"/><text x="455" y="250" fill="#fecdd3" font-weight="700">權杖／Cookie</text><text x="455" y="283" fill="#fda4af" font-size="17">重放既有工作階段</text><rect x="640" y="205" width="210" height="112" rx="22" fill="#3b1625" stroke="#fb7185"/><text x="745" y="250" fill="#fecdd3" font-weight="700">橫向移動</text><text x="745" y="283" fill="#fda4af" font-size="17">郵件、VPN、雲端</text><rect x="930" y="205" width="210" height="112" rx="22" fill="#3b1625" stroke="#fb7185"/><text x="1035" y="250" fill="#fecdd3" font-weight="700">特權濫用</text><text x="1035" y="283" fill="#fda4af" font-size="17">管理介面與臨床系統</text></g>
<g stroke="#fb7185" stroke-width="5" marker-end="url(#a)"><path d="M270 261H338"/><path d="M560 261H628"/><path d="M850 261H918"/></g>
<g font-family="system-ui,Noto Sans TC" text-anchor="middle"><rect x="60" y="420" width="250" height="150" rx="24" fill="#0d3340" stroke="#63e6ff"/><text x="185" y="466" fill="#a5f3fc" font-size="23" font-weight="700">FIDO2／Passkey</text><text x="185" y="501" fill="#cffafe" font-size="18">驗證綁定正確網域</text><text x="185" y="531" fill="#9fb3d9" font-size="17">阻斷代理頁面重放</text><rect x="340" y="420" width="250" height="150" rx="24" fill="#102f38" stroke="#57f0c1"/><text x="465" y="466" fill="#a7f3d0" font-size="23" font-weight="700">條件式存取</text><text x="465" y="501" fill="#d1fae5" font-size="18">裝置、位置、風險訊號</text><text x="465" y="531" fill="#9fb3d9" font-size="17">高風險即重驗或封鎖</text><rect x="620" y="420" width="250" height="150" rx="24" fill="#20254b" stroke="#a997ff"/><text x="745" y="466" fill="#ddd6fe" font-size="23" font-weight="700">工作階段防護</text><text x="745" y="501" fill="#ede9fe" font-size="18">短效、撤銷、持續評估</text><text x="745" y="531" fill="#9fb3d9" font-size="17">縮短權杖可利用時間</text><rect x="900" y="420" width="250" height="150" rx="24" fill="#26331c" stroke="#facc15"/><text x="1025" y="466" fill="#fef08a" font-size="23" font-weight="700">PAM 與 JIT</text><text x="1025" y="501" fill="#fef9c3" font-size="18">管理權限另行升級</text><text x="1025" y="531" fill="#9fb3d9" font-size="17">限制特權爆炸半徑</text></g><g stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"><path d="M185 420V330"/><path d="M465 420V330"/><path d="M745 420V330"/><path d="M1025 420V330"/></g><text x="600" y="635" fill="#9fb3d9" font-family="system-ui,Noto Sans TC" font-size="18" text-anchor="middle">單一 MFA 不足以涵蓋完整攻擊鏈；驗證、工作階段與特權控制必須聯動</text></svg>