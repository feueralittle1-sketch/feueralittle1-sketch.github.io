<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 940" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安學習與行為證據架構</title><desc id="desc">四類醫療角色依不同情境接受安全學習與演練，再形成可追溯的回報、升級、資料保護與改善證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11234a"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3z" fill="#63e6ff"/></marker></defs><rect width="390" height="940" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="24" y="45" fill="#fff" font-size="23" font-weight="800">角色化資安學習</text><text x="24" y="75" fill="#a9bddf" font-size="15">從工作任務到可驗收行為證據</text><text x="24" y="115" fill="#63e6ff" font-size="15" font-weight="700">工作角色</text><g font-size="16" font-weight="700" fill="#fff"><rect x="22" y="132" width="165" height="58" rx="14" fill="#132b46" stroke="#63e6ff"/><text x="42" y="167">臨床照護</text><rect x="203" y="132" width="165" height="58" rx="14" fill="#132b46" stroke="#8fb1ff"/><text x="223" y="167">服務台</text><rect x="22" y="205" width="165" height="58" rx="14" fill="#132b46" stroke="#c99cff"/><text x="42" y="240">特權與供應商</text><rect x="203" y="205" width="165" height="58" rx="14" fill="#132b46" stroke="#66efbf"/><text x="223" y="240">事件指揮</text></g><path d="M195 275V315" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="325" width="346" height="240" rx="22" fill="#0e2039" stroke="#46698f"/><text x="45" y="363" fill="#fff" font-size="20" font-weight="800">角色情境與安全演練</text><g fill="#c8d8ed" font-size="16"><text x="45" y="406">01　冒名與社交工程</text><text x="45" y="443">02　異常登入與權限濫用</text><text x="45" y="480">03　敏感資料誤傳</text><text x="45" y="517">04　設備中斷與替代流程</text></g><path d="M195 575V615" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="625" width="346" height="230" rx="22" fill="#122b3f" stroke="#57f0c1"/><text x="45" y="663" fill="#fff" font-size="20" font-weight="800">可驗收行為證據</text><g fill="#dbe9fa" font-size="16"><text x="45" y="706">✓ 正確回報入口與時間</text><text x="45" y="743">✓ 正確升級與資料保護</text><text x="45" y="780">✓ 啟動臨床替代流程</text><text x="45" y="817">✓ 改善後完成重驗關閉</text></g><rect x="22" y="878" width="346" height="40" rx="12" fill="#10263e"/><text x="37" y="903" fill="#9fe9ff" font-size="13" font-weight="700">資料最小化・臨床停止條件・無責改善</text></g></svg>