<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療設備資安上市後訊號與品質系統邊界</title>
<desc id="desc">漏洞、事件、客訴與場域監測訊號進入製造商品質系統，經風險評估、CAPA與通報後，形成醫院端可執行的修補與補償控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">上市後資安訊號不能停在工單：必須進入品質閉環</text>
<g font-family="system-ui,'Noto Sans TC',sans-serif">
<rect x="55" y="125" width="270" height="440" rx="28" fill="#10243e" stroke="#63e6ff" stroke-width="2"/><text x="190" y="170" fill="#63e6ff" text-anchor="middle" font-size="25" font-weight="700">訊號來源</text>
<g fill="#dcecff" font-size="21"><rect x="85" y="205" width="210" height="58" rx="15" fill="#173353"/><text x="190" y="242" text-anchor="middle">漏洞與威脅情報</text><rect x="85" y="285" width="210" height="58" rx="15" fill="#173353"/><text x="190" y="322" text-anchor="middle">客訴與安全事件</text><rect x="85" y="365" width="210" height="58" rx="15" fill="#173353"/><text x="190" y="402" text-anchor="middle">設備遙測與異常</text><rect x="85" y="445" width="210" height="58" rx="15" fill="#173353"/><text x="190" y="482" text-anchor="middle">場域與供應商回饋</text></g>
<path d="M335 345H410" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs>
<rect x="420" y="125" width="350" height="440" rx="28" fill="#142744" stroke="#a997ff" stroke-width="2"/><text x="595" y="170" fill="#c7baff" text-anchor="middle" font-size="25" font-weight="700">製造商品質系統</text><g fill="#fff" font-size="20"><circle cx="500" cy="242" r="52" fill="#253f68"/><text x="500" y="236" text-anchor="middle">風險</text><text x="500" y="263" text-anchor="middle">分級</text><circle cx="680" cy="242" r="52" fill="#253f68"/><text x="680" y="236" text-anchor="middle">根因</text><text x="680" y="263" text-anchor="middle">分析</text><circle cx="500" cy="418" r="52" fill="#253f68"/><text x="500" y="412" text-anchor="middle">CAPA</text><text x="500" y="439" text-anchor="middle">處置</text><circle cx="680" cy="418" r="52" fill="#253f68"/><text x="680" y="412" text-anchor="middle">有效性</text><text x="680" y="439" text-anchor="middle">驗證</text></g><path d="M552 242H618M680 294V356M628 418H552M500 366V294" fill="none" stroke="#a997ff" stroke-width="4" marker-end="url(#b)"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a997ff"/></marker></defs><text x="595" y="525" fill="#9fb3d9" text-anchor="middle" font-size="18">文件、責任、期限、變更與證據同步更新</text>
<path d="M780 345H850" stroke="#57f0c1" stroke-width="5" marker-end="url(#c)"/><defs><marker id="c" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#57f0c1"/></marker></defs>
<rect x="860" y="125" width="285" height="440" rx="28" fill="#0f2b35" stroke="#57f0c1" stroke-width="2"/><text x="1002" y="170" fill="#57f0c1" text-anchor="middle" font-size="25" font-weight="700">醫院端執行證據</text><g fill="#eafff8" font-size="21"><text x="900" y="235">• 受影響版本清單</text><text x="900" y="290">• 臨床風險與時限</text><text x="900" y="345">• 修補／補償控制</text><text x="900" y="400">• 停機與回退方案</text><text x="900" y="455">• 完成與複測證明</text></g><rect x="900" y="490" width="205" height="44" rx="14" fill="#174b49"/><text x="1002" y="519" fill="#fff" text-anchor="middle" font-size="19">可追溯、可驗收</text>
<text x="600" y="640" fill="#9fb3d9" text-anchor="middle" font-size="20">重點：醫院不代替製造商履行法域義務，但必須把外部處置轉成院內臨床變更與驗收。</text></g></svg>