<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全文件六階段驗收流程</title><desc id="desc">文件接收、版本正規化、場域驗證、缺口處置、核准放行與變更重驗構成閉環。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<text x="600" y="58" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="700" fill="#f4f8ff">六階段把文件主張轉成可測試控制</text><g filter="url(#shadow)"><rect x="45" y="165" width="160" height="190" rx="22" fill="#102742" stroke="#7aa7ff" stroke-width="2"/><text x="125.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">1 接收</text><text x="125.0" y="253" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">文件包與聯絡窗口</text></g><path d="M205 260 L235 260" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="235" y="165" width="160" height="190" rx="22" fill="#102742" stroke="#5eead4" stroke-width="2"/><text x="315.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">2 對齊</text><text x="315.0" y="253" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">型號／</text><text x="315.0" y="283" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">版本／</text><text x="315.0" y="313" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">部署</text></g><path d="M395 260 L425 260" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="425" y="165" width="160" height="190" rx="22" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="505.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">3 驗證</text><text x="505.0" y="253" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">組態／</text><text x="505.0" y="283" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">連線／</text><text x="505.0" y="313" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">日誌</text></g><path d="M585 260 L615 260" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="615" y="165" width="160" height="190" rx="22" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="695.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">4 補缺</text><text x="695.0" y="253" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">修正或補償控制</text></g><path d="M775 260 L805 260" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="805" y="165" width="160" height="190" rx="22" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="885.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">5 放行</text><text x="885.0" y="253" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">責任與例外核准</text></g><path d="M965 260 L995 260" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="995" y="165" width="160" height="190" rx="22" fill="#102742" stroke="#fb7185" stroke-width="2"/><text x="1075.0" y="213" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">6 重驗</text><text x="1075.0" y="253" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">更新／</text><text x="1075.0" y="283" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">事件／</text><text x="1075.0" y="313" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="500" fill="#b8c8df">續約</text></g><path d="M1075 355 C1075 560 125 560 125 355" stroke="#5eead4" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="600" y="530" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="700" fill="#5eead4">觸發重驗：韌體、雲端、介面、憑證、網段、臨床用途或供應商責任改變</text><text x="600" y="620" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="23" font-weight="600" fill="#b8c8df">每階段都要留下版本、日期、責任人、測試結果與未結風險</text></svg>