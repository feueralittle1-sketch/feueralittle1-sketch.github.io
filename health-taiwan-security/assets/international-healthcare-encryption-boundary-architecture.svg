<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資料加密與等效控制邊界</title><desc id="desc">病歷資料、備份、介接流量與可攜設備先經資料狀態與風險判定，再採加密或有期限的等效替代控制，並保存金鑰、覆蓋率與例外證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#122750"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0V6L9 3z" fill="#63e6ff"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="56" y="66" fill="#fff" font-size="34" font-weight="800">加密不是單一開關，而是一條可驗收控制鏈</text><text x="56" y="104" fill="#abc0df" font-size="20">資料狀態、臨床用途、技術限制與金鑰治理共同決定保護方式</text><text x="58" y="158" fill="#63e6ff" font-size="18" font-weight="700">資料與服務</text><g filter="url(#s)"><rect x="45" y="180" width="238" height="76" rx="18" fill="#122d47" stroke="#63e6ff"/><text x="70" y="212" fill="#fff" font-size="22" font-weight="700">電子病歷與資料庫</text><text x="70" y="239" fill="#bed0e9" font-size="16">靜態資料、欄位與快照</text><rect x="45" y="275" width="238" height="76" rx="18" fill="#122d47" stroke="#82a9ff"/><text x="70" y="307" fill="#fff" font-size="22" font-weight="700">介接與遠端連線</text><text x="70" y="334" fill="#bed0e9" font-size="16">傳輸中資料與會話</text><rect x="45" y="370" width="238" height="76" rx="18" fill="#122d47" stroke="#c99cff"/><text x="70" y="402" fill="#fff" font-size="22" font-weight="700">備份與可攜媒體</text><text x="70" y="429" fill="#bed0e9" font-size="16">離線副本與外帶風險</text><rect x="45" y="465" width="238" height="76" rx="18" fill="#122d47" stroke="#5ce1b9"/><text x="70" y="497" fill="#fff" font-size="22" font-weight="700">醫療設備與舊系統</text><text x="70" y="524" fill="#bed0e9" font-size="16">能力限制與臨床相依</text></g><path d="M300 360H370" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="385" y="175" width="350" height="370" rx="28" fill="#0d2038" stroke="#55779d"/><text x="420" y="220" fill="#fff" font-size="27" font-weight="800">治理判定閘門</text><g fill="#c8d8eb" font-size="19"><text x="420" y="270">01　資料敏感度與保存期間</text><text x="420" y="316">02　外部曝險與可攜性</text><text x="420" y="362">03　臨床中斷與效能限制</text><text x="420" y="408">04　金鑰、復原與權限分離</text><text x="420" y="454">05　例外期限與風險接受人</text><text x="420" y="500">06　覆蓋率、測試與改善證據</text></g><path d="M752 360H820" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><g filter="url(#s)"><rect x="835" y="190" width="320" height="145" rx="22" fill="#113d49" stroke="#57f0c1"/><text x="870" y="233" fill="#fff" font-size="25" font-weight="800">優先路徑：加密</text><text x="870" y="272" fill="#c9f5e7" font-size="18">安全演算法、金鑰分離</text><text x="870" y="303" fill="#c9f5e7" font-size="18">復原測試、版本與覆蓋證據</text><rect x="835" y="370" width="320" height="175" rx="22" fill="#3d2944" stroke="#ffb86b"/><text x="870" y="413" fill="#fff" font-size="25" font-weight="800">受控例外：等效措施</text><text x="870" y="452" fill="#f7d7bf" font-size="18">限制網路、存取與匯出</text><text x="870" y="483" fill="#f7d7bf" font-size="18">監測、實體保護、替代流程</text><text x="870" y="514" fill="#f7d7bf" font-size="18">明確期限、責任人與重驗</text></g><rect x="58" y="592" width="1097" height="50" rx="16" fill="#0d263b" stroke="#63e6ff"/><text x="82" y="624" fill="#d9f8ff" font-size="18">驗收輸出：資料清冊｜加密覆蓋率｜金鑰復原測試｜例外登錄｜等效控制證據｜到期重驗結果</text></g></svg>