<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療行動裝置與基頻風險信任邊界</title>
<desc id="desc">行動裝置同時連接蜂巢網路、裝置作業系統、醫療應用與院內服務；裝置管理、條件式存取和獨立稽核構成三道控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#68e8ff"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">行動裝置不是單一 App：四層信任邊界</text><text x="60" y="108" fill="#a9bfdf" font-size="20">基頻處理蜂巢通訊，修補與存取決策須回到每一台實體裝置</text>
<g font-family="Arial, Noto Sans TC, sans-serif"><rect x="60" y="170" width="220" height="170" rx="24" fill="#12294c" stroke="#ff7aa8" stroke-width="3"/><text x="170" y="222" text-anchor="middle" fill="#ff9fc0" font-size="25" font-weight="700">外部蜂巢網路</text><text x="170" y="265" text-anchor="middle" fill="#dce8f8" font-size="20">基地台與電信訊號</text><text x="170" y="302" text-anchor="middle" fill="#dce8f8" font-size="20">不等同院內 Wi-Fi</text>
<rect x="360" y="145" width="250" height="220" rx="28" fill="#16375a" stroke="#68e8ff" stroke-width="4" filter="url(#glow)"/><text x="485" y="198" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">受管行動裝置</text><rect x="405" y="226" width="160" height="56" rx="14" fill="#0a1830" stroke="#ffbd69"/><text x="485" y="262" text-anchor="middle" fill="#ffcf8b" font-size="21">基頻／Modem</text><rect x="405" y="296" width="160" height="44" rx="12" fill="#0a1830" stroke="#8fa8ff"/><text x="485" y="325" text-anchor="middle" fill="#c5d1ff" font-size="19">作業系統與 App</text>
<rect x="700" y="170" width="220" height="170" rx="24" fill="#12294c" stroke="#8fa8ff" stroke-width="3"/><text x="810" y="222" text-anchor="middle" fill="#c5d1ff" font-size="25" font-weight="700">身分與存取</text><text x="810" y="265" text-anchor="middle" fill="#dce8f8" font-size="20">條件式存取</text><text x="810" y="302" text-anchor="middle" fill="#dce8f8" font-size="20">裝置合規狀態</text>
<rect x="980" y="170" width="170" height="170" rx="24" fill="#12294c" stroke="#59efbe" stroke-width="3"/><text x="1065" y="222" text-anchor="middle" fill="#7ff3cf" font-size="24" font-weight="700">醫療服務</text><text x="1065" y="265" text-anchor="middle" fill="#dce8f8" font-size="19">院內入口</text><text x="1065" y="302" text-anchor="middle" fill="#dce8f8" font-size="19">臨床應用</text>
<path d="M280 255H350" stroke="#68e8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M610 255H690" stroke="#68e8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M920 255H970" stroke="#68e8ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="90" y="455" width="310" height="150" rx="24" fill="#0c203b" stroke="#68e8ff" stroke-width="2"/><text x="245" y="500" text-anchor="middle" fill="#68e8ff" font-size="23" font-weight="700">裝置管理 MDM／UEM</text><text x="245" y="540" text-anchor="middle" fill="#dce8f8" font-size="19">型號、修補層級、加密、版本</text><text x="245" y="574" text-anchor="middle" fill="#a9bfdf" font-size="18">證明「哪一台已完成」</text>
<rect x="445" y="455" width="310" height="150" rx="24" fill="#0c203b" stroke="#8fa8ff" stroke-width="2"/><text x="600" y="500" text-anchor="middle" fill="#b9c4ff" font-size="23" font-weight="700">條件式存取閘道</text><text x="600" y="540" text-anchor="middle" fill="#dce8f8" font-size="19">未合規裝置限制高風險服務</text><text x="600" y="574" text-anchor="middle" fill="#a9bfdf" font-size="18">保留照護所需替代路徑</text>
<rect x="800" y="455" width="310" height="150" rx="24" fill="#0c203b" stroke="#59efbe" stroke-width="2"/><text x="955" y="500" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">獨立稽核與事件證據</text><text x="955" y="540" text-anchor="middle" fill="#dce8f8" font-size="19">登入、合規、更新與撤銷紀錄</text><text x="955" y="574" text-anchor="middle" fill="#a9bfdf" font-size="18">支援調查與驗收</text></g>
</svg>