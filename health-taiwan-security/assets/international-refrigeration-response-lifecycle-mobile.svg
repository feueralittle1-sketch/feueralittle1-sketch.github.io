<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">醫院冷鏈事件六階段流程手機版</title><desc id="desc">冷鏈網路事件依序完成異常偵測、獨立確認、隔離降級、庫存判定、可信重建與回歸驗收。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient></defs><rect width="720" height="1180" rx="28" fill="url(#bg)"/><text x="40" y="62" fill="#fff" font-size="31" font-weight="800">冷鏈事件六階段</text><text x="40" y="102" fill="#a8bddc" font-size="19">設備與庫存必須同步處置</text><g font-family="Arial,Noto Sans TC,sans-serif"><g stroke-width="3"><rect x="42" y="145" width="300" height="205" rx="24" fill="#142f52" stroke="#63e6ff"/><rect x="378" y="145" width="300" height="205" rx="24" fill="#1c3151" stroke="#71a7ff"/><rect x="42" y="390" width="300" height="205" rx="24" fill="#2d2850" stroke="#a997ff"/><rect x="378" y="390" width="300" height="205" rx="24" fill="#3b2b43" stroke="#ffb86b"/><rect x="42" y="635" width="300" height="205" rx="24" fill="#193b44" stroke="#57f0c1"/><rect x="378" y="635" width="300" height="205" rx="24" fill="#38233d" stroke="#ff7aa8"/></g><g fill="#fff" font-size="24" font-weight="800"><text x="72" y="198">1 異常偵測</text><text x="408" y="198">2 獨立確認</text><text x="72" y="443">3 隔離降級</text><text x="408" y="443">4 庫存判定</text><text x="72" y="688">5 可信重建</text><text x="408" y="688">6 回歸驗收</text></g><g fill="#d5e1f0" font-size="19"><text x="72" y="243">告警、連線、組態</text><text x="72" y="280">電力、門磁、現場</text><text x="408" y="243">獨立溫度紀錄</text><text x="408" y="280">時間與資料缺口</text><text x="72" y="488">切斷受影響路徑</text><text x="72" y="525">本地／人工運作</text><text x="408" y="488">轉移與待判定</text><text x="408" y="525">放行／隔離／報廢</text><text x="72" y="733">憑證、韌體、組態</text><text x="72" y="770">重建信任與日誌</text><text x="408" y="733">溫度、告警、會話</text><text x="408" y="770">臨床流程與復盤</text></g><rect x="42" y="895" width="636" height="220" rx="24" fill="#102b45" stroke="#4edff5" stroke-width="3"/><text x="78" y="948" fill="#fff" font-size="26" font-weight="800">貫穿證據鏈</text><text x="78" y="995" fill="#cce8f3" font-size="20">事件時間線、設備與庫存清冊</text><text x="78" y="1035" fill="#cce8f3" font-size="20">溫度原始資料、操作與核准紀錄</text><text x="78" y="1075" fill="#cce8f3" font-size="20">例外處置與回歸驗收結果</text></g></svg>