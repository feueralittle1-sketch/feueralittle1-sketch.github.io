<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院通訊韌性三層架構</title><desc id="desc">事件指揮與臨床單位透過主要通訊、替代電信與離線程序維持雙向聯絡。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12264a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="70" fill="#f8fbff" font-size="34" font-weight="800">醫院通訊韌性：三層能力、不同失效點</text><text x="70" y="108" fill="#9fb3d9" font-size="19">每層都要支援事件指揮、急診與必要臨床協調</text><rect x="70" y="150" width="300" height="420" rx="28" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="220" y="200" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="800">主要通訊</text><text x="110" y="260" fill="#e6eefc" font-size="21">• 院內網路與網路電話</text><text x="110" y="310" fill="#e6eefc" font-size="21">• 行動電話與簡訊</text><text x="110" y="360" fill="#e6eefc" font-size="21">• 雲端協作與電子郵件</text><rect x="110" y="425" width="220" height="90" rx="18" fill="#0b1b32" stroke="#3e83c8"/><text x="220" y="462" text-anchor="middle" fill="#bfefff" font-size="19">高效率</text><text x="220" y="492" text-anchor="middle" fill="#9fb3d9" font-size="17">但可能共享網路與身分依賴</text><rect x="450" y="150" width="300" height="420" rx="28" fill="#1b2547" stroke="#a997ff" stroke-width="3"/><text x="600" y="200" text-anchor="middle" fill="#c2b8ff" font-size="25" font-weight="800">替代電信</text><text x="490" y="260" fill="#e6eefc" font-size="21">• 第二電信商與獨立門號</text><text x="490" y="310" fill="#e6eefc" font-size="21">• 無線電與衛星通訊</text><text x="490" y="360" fill="#e6eefc" font-size="21">• 優先撥接與復原安排</text><rect x="490" y="425" width="220" height="90" rx="18" fill="#121a35" stroke="#766bd1"/><text x="600" y="462" text-anchor="middle" fill="#ddd7ff" font-size="19">有限容量</text><text x="600" y="492" text-anchor="middle" fill="#9fb3d9" font-size="17">依角色與臨床優先序配發</text><rect x="830" y="150" width="300" height="420" rx="28" fill="#14343a" stroke="#57f0c1" stroke-width="3"/><text x="980" y="200" text-anchor="middle" fill="#7ff5d2" font-size="25" font-weight="800">離線程序</text><text x="870" y="260" fill="#e6eefc" font-size="21">• 紙本聯絡樹與角色卡</text><text x="870" y="310" fill="#e6eefc" font-size="21">• 實體集合點與跑單</text><text x="870" y="360" fill="#e6eefc" font-size="21">• 訊息回讀與事件紀錄</text><rect x="870" y="425" width="220" height="90" rx="18" fill="#0f292d" stroke="#3bbf9b"/><text x="980" y="462" text-anchor="middle" fill="#b8ffe9" font-size="19">最低依賴</text><text x="980" y="492" text-anchor="middle" fill="#9fb3d9" font-size="17">需要訓練、名冊與人工紀律</text><path d="M370 360H445M750 360H825" stroke="#f2c94c" stroke-width="5" stroke-dasharray="10 10" filter="url(#glow)"/><rect x="250" y="610" width="700" height="66" rx="24" fill="#0b1b32" stroke="#ffffff" stroke-opacity=".18"/><text x="600" y="651" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">共同驗收：雙向送達、電力續航、角色清楚、紀錄可追溯</text></svg>