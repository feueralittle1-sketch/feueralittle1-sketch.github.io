<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療重大網攻復原的風險與控制對照</title><desc id="desc">過早重連、權責不清、備份不可信、臨床驗證不足與過早結案，分別對應分段放行、指揮矩陣、隔離還原、雙重驗收與長期修復控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="58" y="66" fill="#fff" font-size="34" font-weight="700">復原風險不是「慢」而已：錯誤放行可能再次中斷臨床</text><text x="58" y="104" fill="#9fb3d9" font-size="20">每個失敗模式都要有對應控制、可觀測訊號與明確停止條件</text><g font-family="sans-serif"><text x="255" y="158" text-anchor="middle" fill="#f7a7c2" font-size="23" font-weight="700">失敗模式</text><text x="600" y="158" text-anchor="middle" fill="#ffbf7a" font-size="23" font-weight="700">可能後果</text><text x="945" y="158" text-anchor="middle" fill="#57f0c1" font-size="23" font-weight="700">必要控制</text><g fill="#12213d" stroke="#2a4569"><rect x="65" y="185" width="1070" height="78" rx="20"/><rect x="65" y="278" width="1070" height="78" rx="20"/><rect x="65" y="371" width="1070" height="78" rx="20"/><rect x="65" y="464" width="1070" height="78" rx="20"/></g><g font-size="19"><text x="255" y="232" text-anchor="middle" fill="#fff" font-weight="700">清除未完成就全面重連</text><text x="600" y="232" text-anchor="middle" fill="#c6d4eb">攻擊者重返、橫向移動再發</text><text x="945" y="232" text-anchor="middle" fill="#57f0c1">小批放行＋即時監控＋回退</text><text x="255" y="325" text-anchor="middle" fill="#fff" font-weight="700">技術與臨床權責不清</text><text x="600" y="325" text-anchor="middle" fill="#c6d4eb">系統可用但照護流程不安全</text><text x="945" y="325" text-anchor="middle" fill="#57f0c1">事件指揮矩陣＋雙重核准</text><text x="255" y="418" text-anchor="middle" fill="#fff" font-weight="700">未驗證備份直接還原</text><text x="600" y="418" text-anchor="middle" fill="#c6d4eb">惡意程式、舊權限或錯誤資料復活</text><text x="945" y="418" text-anchor="middle" fill="#57f0c1">隔離還原＋完整性與惡意檢查</text><text x="255" y="511" text-anchor="middle" fill="#fff" font-weight="700">最低服務恢復就宣布結案</text><text x="600" y="511" text-anchor="middle" fill="#c6d4eb">根因、技術債與監控缺口留存</text><text x="945" y="511" text-anchor="middle" fill="#57f0c1">長期修復清單＋期限＋董事會追蹤</text></g></g><rect x="180" y="579" width="840" height="62" rx="22" fill="#0d3540" stroke="#57f0c1"/><text x="600" y="618" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">驗收同時檢查：病人安全、資料完整、存取正確、攻擊面縮小、可快速回退</text></svg>