<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備更新失敗模式與控制證據</title><desc id="desc">偽造套件、錯誤版本、更新中斷、功能退化與回退失敗分別對應驗證、相容性、韌性、臨床回歸及復原控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#122445"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Inter,Noto Sans TC,sans-serif"><text x="55" y="68" fill="#f4f8ff" font-size="34" font-weight="800">更新風險必須對應控制與驗收證據</text><text x="55" y="106" fill="#9fb3d9" font-size="20">「安裝完成」只是技術事件，不是安全與臨床放行結論</text><g fill="#ffb3c1" font-size="20" font-weight="800"><text x="70" y="175">失敗模式</text></g><g fill="#8fe8ff" font-size="20" font-weight="800"><text x="465" y="175">主要控制</text></g><g fill="#c8bbff" font-size="20" font-weight="800"><text x="855" y="175">驗收證據</text></g><g stroke="#314968" stroke-width="1"><path d="M50 195H1150"/><path d="M50 285H1150"/><path d="M50 375H1150"/><path d="M50 465H1150"/><path d="M50 555H1150"/><path d="M50 645H1150"/></g><g fill="#e6eefc" font-size="19"><text x="70" y="245">偽造或遭竄改套件</text><text x="465" y="245">可信來源、簽章鏈、雜湊比對</text><text x="855" y="245">套件指紋與驗證紀錄</text><text x="70" y="335">錯誤型號或相依版本</text><text x="465" y="335">設備清冊、適用矩陣、前置檢查</text><text x="855" y="335">逐台適用性結果</text><text x="70" y="425">斷電或更新中斷</text><text x="465" y="425">原子更新、雙映像、安全開機</text><text x="855" y="425">故障注入與復原測試</text><text x="70" y="515">警報、資料或介接退化</text><text x="465" y="515">代表性測試、臨床回歸、監測</text><text x="855" y="515">功能與病人流程簽核</text><text x="70" y="605">回退失敗或降級不安全</text><text x="465" y="605">可信復原、版本政策、離線替代</text><text x="855" y="605">回退時間與替代流程演練</text></g><rect x="55" y="665" width="1090" height="4" rx="2" fill="#63e6ff"/></g></svg>