<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療 Linux 核心曝險與服務關係圖</title><desc id="desc">將 Linux 核心版本、執行環境與臨床服務關聯，依外部曝險、可達路徑及臨床影響分流。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">核心弱點須回到「實際執行核心」與臨床服務</text><text x="58" y="108" fill="#a9bfdf" font-size="20">套件清冊、容器映像或設備型號都不能單獨代表主機是否已修補</text>
<rect x="55" y="165" width="260" height="180" rx="24" fill="#122b50" stroke="#8fa8ff" stroke-width="3"/><text x="185" y="215" text-anchor="middle" fill="#c6d1ff" font-size="25" font-weight="700">資產與執行核心</text><text x="185" y="258" text-anchor="middle" fill="#e5eefb" font-size="20">主機／虛擬機／設備</text><text x="185" y="296" text-anchor="middle" fill="#a9bfdf" font-size="18">版本、模組、啟動時間</text>
<rect x="375" y="145" width="330" height="220" rx="28" fill="#18395b" stroke="#ff7da9" stroke-width="4"/><text x="540" y="200" text-anchor="middle" fill="#ff9fc1" font-size="26" font-weight="700">核心曝險判定</text><text x="540" y="245" text-anchor="middle" fill="#fff" font-size="20">受影響版本與功能是否存在</text><text x="540" y="283" text-anchor="middle" fill="#e5eefb" font-size="19">攻擊者需要的存取條件</text><text x="540" y="321" text-anchor="middle" fill="#ffcf8c" font-size="18">外部可達 ≠ 所有主機同風險</text>
<rect x="765" y="165" width="380" height="180" rx="24" fill="#122b50" stroke="#5aefbe" stroke-width="3"/><text x="955" y="215" text-anchor="middle" fill="#7ff3cf" font-size="25" font-weight="700">臨床服務依賴</text><text x="955" y="258" text-anchor="middle" fill="#e5eefb" font-size="20">病歷／影像／介接／設備閘道</text><text x="955" y="296" text-anchor="middle" fill="#a9bfdf" font-size="18">可停機窗口與替代流程</text>
<path d="M315 255H365" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M705 255H755" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/>
<text x="58" y="430" fill="#fff" font-size="26" font-weight="700">四個分流訊號</text>
<rect x="55" y="470" width="255" height="150" rx="22" fill="#0c203b" stroke="#ffbd69" stroke-width="2"/><text x="183" y="516" text-anchor="middle" fill="#ffcf8c" font-size="22" font-weight="700">外部曝險</text><text x="183" y="555" text-anchor="middle" fill="#dce8f8" font-size="18">直接入口、VPN、代理</text><text x="183" y="588" text-anchor="middle" fill="#a9bfdf" font-size="17">先縮小攻擊面</text>
<rect x="330" y="470" width="255" height="150" rx="22" fill="#0c203b" stroke="#69e7ff" stroke-width="2"/><text x="458" y="516" text-anchor="middle" fill="#69e7ff" font-size="22" font-weight="700">權限與可達性</text><text x="458" y="555" text-anchor="middle" fill="#dce8f8" font-size="18">本機帳號、容器、功能</text><text x="458" y="588" text-anchor="middle" fill="#a9bfdf" font-size="17">確認利用前提</text>
<rect x="605" y="470" width="255" height="150" rx="22" fill="#0c203b" stroke="#ff7da9" stroke-width="2"/><text x="733" y="516" text-anchor="middle" fill="#ff9fc1" font-size="22" font-weight="700">利用跡象</text><text x="733" y="555" text-anchor="middle" fill="#dce8f8" font-size="18">異常程序、模組、連線</text><text x="733" y="588" text-anchor="middle" fill="#a9bfdf" font-size="17">保全主機外證據</text>
<rect x="880" y="470" width="265" height="150" rx="22" fill="#0c203b" stroke="#5aefbe" stroke-width="2"/><text x="1013" y="516" text-anchor="middle" fill="#7ff3cf" font-size="22" font-weight="700">臨床影響</text><text x="1013" y="555" text-anchor="middle" fill="#dce8f8" font-size="18">中斷後果與備援能力</text><text x="1013" y="588" text-anchor="middle" fill="#a9bfdf" font-size="17">決定切換與批次</text></g></svg>
