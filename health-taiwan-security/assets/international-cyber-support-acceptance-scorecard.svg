<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">外部資安支援服務的驗收計分卡</title><desc id="desc">以啟動、邊界、交接、處置、復原與證據六個面向驗收外部資安支援服務，避免只看聯絡是否成功。</desc>
<rect width="1200" height="760" rx="36" fill="#081426"/><text x="64" y="76" fill="#f4f8ff" font-size="36" font-weight="700">支援服務要驗收可用性，不只驗收聯絡人</text><text x="64" y="116" fill="#9fb3d9" font-size="20">用六個問題確認服務能在臨床事件中安全運作</text>
<g font-size="19"><rect x="64" y="170" width="1072" height="72" rx="18" fill="#112943"/><text x="94" y="214" fill="#63e6ff" font-weight="700">啟動</text><text x="220" y="214" fill="#e6eefc">何種門檻啟動？誰可提出？多久確認受理？</text><text x="1080" y="214" text-anchor="end" fill="#9fefff">量測：確認時間</text>
<rect x="64" y="258" width="1072" height="72" rx="18" fill="#152a44"/><text x="94" y="302" fill="#71a7ff" font-weight="700">邊界</text><text x="220" y="302" fill="#e6eefc">支援者可看、可做、不可做的範圍是否明確？</text><text x="1080" y="302" text-anchor="end" fill="#b9d3ff">量測：越權事件</text>
<rect x="64" y="346" width="1072" height="72" rx="18" fill="#292448"/><text x="94" y="390" fill="#a997ff" font-weight="700">交接</text><text x="220" y="390" fill="#e6eefc">敏感證據是否最小化、加密、留痕並可撤回？</text><text x="1080" y="390" text-anchor="end" fill="#ddd6ff">量測：完整交接率</text>
<rect x="64" y="434" width="1072" height="72" rx="18" fill="#15343f"/><text x="94" y="478" fill="#8fe8ff" font-weight="700">處置</text><text x="220" y="478" fill="#e6eefc">高影響變更是否經雙方核准並保留回退路徑？</text><text x="1080" y="478" text-anchor="end" fill="#c8efff">量測：受控變更率</text>
<rect x="64" y="522" width="1072" height="72" rx="18" fill="#123b37"/><text x="94" y="566" fill="#57f0c1" font-weight="700">復原</text><text x="220" y="566" fill="#e6eefc">技術恢復是否經臨床回歸、監測與放行確認？</text><text x="1080" y="566" text-anchor="end" fill="#a9ffe5">量測：復原驗收率</text>
<rect x="64" y="610" width="1072" height="72" rx="18" fill="#3b2d24"/><text x="94" y="654" fill="#ffbd7a" font-weight="700">證據</text><text x="220" y="654" fill="#e6eefc">決策、時間線、日誌、未結風險與改善是否可追溯？</text><text x="1080" y="654" text-anchor="end" fill="#ffd9b5">量測：證據完整率</text></g>
<rect x="64" y="704" width="1072" height="36" rx="14" fill="#0d2138"/><text x="600" y="729" text-anchor="middle" fill="#f4f8ff" font-size="17" font-weight="700">任何一項無法回答，都應在演練或契約階段先補齊，而不是等事件發生後臨時協商</text></svg>
