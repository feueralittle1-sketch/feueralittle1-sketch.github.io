<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療加密例外決策與重驗流程</title><desc id="desc">從資料清冊、風險判定、加密可行性測試開始；若暫時無法加密，必須定義等效控制、期限、責任人與退出條件，再以證據重驗。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102443"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0V6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="56" y="66" fill="#fff" font-size="34" font-weight="800">例外不是終點：必須回到加密或正式退場</text><text x="56" y="104" fill="#abc0df" font-size="20">每個決策都留下技術測試、臨床影響、核准與到期重驗證據</text><g text-anchor="middle"><rect x="55" y="195" width="170" height="120" rx="22" fill="#12324b" stroke="#63e6ff"/><text x="140" y="237" fill="#fff" font-size="22" font-weight="800">1 盤點</text><text x="140" y="271" fill="#c8d8eb" font-size="17">資料、系統、介面</text><text x="140" y="298" fill="#c8d8eb" font-size="17">用途與保存期</text><rect x="270" y="195" width="170" height="120" rx="22" fill="#19304d" stroke="#82a9ff"/><text x="355" y="237" fill="#fff" font-size="22" font-weight="800">2 測試</text><text x="355" y="271" fill="#c8d8eb" font-size="17">相容性、效能</text><text x="355" y="298" fill="#c8d8eb" font-size="17">復原與臨床回歸</text><polygon points="570,178 690,255 570,332 450,255" fill="#2b2750" stroke="#c99cff" stroke-width="2"/><text x="570" y="245" fill="#fff" font-size="21" font-weight="800">可安全</text><text x="570" y="274" fill="#fff" font-size="21" font-weight="800">啟用加密？</text><rect x="760" y="135" width="385" height="150" rx="24" fill="#113d49" stroke="#57f0c1"/><text x="952" y="180" fill="#fff" font-size="24" font-weight="800">是：受控部署與驗收</text><text x="790" y="220" fill="#c9f5e7" font-size="18">分批放行｜金鑰保護｜復原測試</text><text x="790" y="253" fill="#c9f5e7" font-size="18">覆蓋率｜負向測試｜持續監測</text><rect x="760" y="345" width="385" height="205" rx="24" fill="#3d2944" stroke="#ffb86b"/><text x="952" y="390" fill="#fff" font-size="24" font-weight="800">否：建立受控例外</text><text x="790" y="430" fill="#f7d7bf" font-size="18">記錄不可行原因與臨床影響</text><text x="790" y="463" fill="#f7d7bf" font-size="18">部署等效控制與監測門檻</text><text x="790" y="496" fill="#f7d7bf" font-size="18">指定風險接受人、期限、退出條件</text><text x="790" y="529" fill="#f7d7bf" font-size="18">到期重測，轉加密、替換或退場</text></g><g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M225 255H260"/><path d="M440 255H455"/><path d="M690 225H748"/><path d="M570 332V447H748"/></g><text x="709" y="207" fill="#72f0c6" font-size="18" font-weight="700">可行</text><text x="584" y="375" fill="#ffc685" font-size="18" font-weight="700">暫時不可行</text><path d="M955 550V610H355V330" stroke="#ffb86b" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="610" y="602" fill="#ffc685" font-size="18" font-weight="700">期限到期或環境變更後重新測試</text><rect x="55" y="402" width="600" height="132" rx="22" fill="#0d263b" stroke="#55779d"/><text x="85" y="443" fill="#fff" font-size="21" font-weight="800">每一輪最低證據</text><text x="85" y="480" fill="#c8d8eb" font-size="18">技術測試結果｜臨床簽核｜控制責任人｜事件門檻</text><text x="85" y="512" fill="#c8d8eb" font-size="18">例外到期日｜重驗結果｜剩餘風險接受或關閉紀錄</text></g></svg>