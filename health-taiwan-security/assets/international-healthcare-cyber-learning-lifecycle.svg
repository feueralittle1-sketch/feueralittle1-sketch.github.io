<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">醫療資安學習六階段生命週期</title><desc id="desc">從蒐集威脅與院內訊號開始，經角色映射、短課設計、安全演練、行為量測，最後改善流程並重驗。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102244"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0V6L9 3z" fill="#65e6ff"/></marker></defs><rect width="1200" height="650" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">六階段持續學習閉環</text><text x="60" y="108" fill="#a9bddf" font-size="20">訊號觸發、角色分流、演練量測、改善重驗</text><g><rect x="55" y="175" width="300" height="130" rx="24" fill="#102b45" stroke="#63e6ff"/><text x="85" y="216" fill="#63e6ff" font-size="18" font-weight="800">01 蒐集訊號</text><text x="85" y="254" fill="#fff" font-size="21" font-weight="700">威脅、事件、稽核發現</text><text x="85" y="282" fill="#b9cce4" font-size="16">找出真實暴露與重複錯誤</text><rect x="450" y="175" width="300" height="130" rx="24" fill="#152a4c" stroke="#8fb1ff"/><text x="480" y="216" fill="#9dbbff" font-size="18" font-weight="800">02 映射角色</text><text x="480" y="254" fill="#fff" font-size="21" font-weight="700">任務、資料、權限、後果</text><text x="480" y="282" fill="#b9cce4" font-size="16">確定誰需要做出哪個決策</text><rect x="845" y="175" width="300" height="130" rx="24" fill="#28254d" stroke="#c99cff"/><text x="875" y="216" fill="#d2aeff" font-size="18" font-weight="800">03 設計短課</text><text x="875" y="254" fill="#fff" font-size="21" font-weight="700">單一行為目標與回報入口</text><text x="875" y="282" fill="#b9cce4" font-size="16">能在工作當下快速查用</text><rect x="845" y="405" width="300" height="130" rx="24" fill="#163a43" stroke="#66efbf"/><text x="875" y="446" fill="#7af5c9" font-size="18" font-weight="800">04 安全演練</text><text x="875" y="484" fill="#fff" font-size="21" font-weight="700">停止條件與臨床保護</text><text x="875" y="512" fill="#b9cce4" font-size="16">模擬不得干擾病人照護</text><rect x="450" y="405" width="300" height="130" rx="24" fill="#173747" stroke="#5bd7e8"/><text x="480" y="446" fill="#80ecfa" font-size="18" font-weight="800">05 量測行為</text><text x="480" y="484" fill="#fff" font-size="21" font-weight="700">辨識、回報、升級、處置</text><text x="480" y="512" fill="#b9cce4" font-size="16">避免只看完成率與點擊率</text><rect x="55" y="405" width="300" height="130" rx="24" fill="#3b3020" stroke="#ffd166"/><text x="85" y="446" fill="#ffd978" font-size="18" font-weight="800">06 改善重驗</text><text x="85" y="484" fill="#fff" font-size="21" font-weight="700">修流程、工具與內容</text><text x="85" y="512" fill="#b9cce4" font-size="16">期限內重測並保存證據</text></g><g fill="none" stroke="#65e6ff" stroke-width="4" marker-end="url(#a)"><path d="M365 240H435"/><path d="M760 240H830"/><path d="M995 315V390"/><path d="M835 470H765"/><path d="M440 470H370"/><path d="M205 395V330Q205 325 210 325H205V320"/></g><rect x="365" y="565" width="470" height="46" rx="14" fill="#0c1d34" stroke="#31506f"/><text x="407" y="594" fill="#9fe9ff" font-size="18" font-weight="700">輸出：角色行為基線・改善期限・重驗結果・風險接受</text></g></svg>