<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療解析元件安全更新流程</title>
  <desc id="desc">從資產盤點、版本與路徑確認、補償控制、代表性訊息測試、小批部署到監測關閉的六階段流程，並在失敗時回復與保留臨床替代路徑。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#101c3a"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6de8ff"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="60" y="70" fill="#f8fbff" font-size="34" font-weight="800">從通報到復原：六階段安全更新</text><text x="60" y="108" fill="#9fb7d8" font-size="20">先縮小攻擊面，再以代表性資料驗證介接與影像工作流程</text>
  <g font-family="Inter, Noto Sans TC, sans-serif"><path d="M205 250H265M405 250H465M605 250H665M805 250H865M1005 250H1065" stroke="#6de8ff" stroke-width="5" marker-end="url(#arr)"/>
  <g><rect x="55" y="170" width="150" height="160" rx="22" fill="#143451" stroke="#5ccce8" stroke-width="2"/><text x="130" y="215" text-anchor="middle" fill="#71eaff" font-size="20" font-weight="800">01 盤點</text><text x="130" y="257" text-anchor="middle" fill="#fff" font-size="19">系統、版本</text><text x="130" y="287" text-anchor="middle" fill="#fff" font-size="19">擁有人、用途</text></g>
  <g><rect x="255" y="170" width="150" height="160" rx="22" fill="#143451" stroke="#5ccce8" stroke-width="2"/><text x="330" y="215" text-anchor="middle" fill="#71eaff" font-size="20" font-weight="800">02 確認</text><text x="330" y="257" text-anchor="middle" fill="#fff" font-size="19">輸入來源</text><text x="330" y="287" text-anchor="middle" fill="#fff" font-size="19">資料與出口</text></g>
  <g><rect x="455" y="170" width="150" height="160" rx="22" fill="#214257" stroke="#72efc1" stroke-width="2"/><text x="530" y="215" text-anchor="middle" fill="#8dffd5" font-size="20" font-weight="800">03 先控曝險</text><text x="530" y="257" text-anchor="middle" fill="#fff" font-size="19">限制入口</text><text x="530" y="287" text-anchor="middle" fill="#fff" font-size="19">身分與出口</text></g>
  <g><rect x="655" y="170" width="150" height="160" rx="22" fill="#263553" stroke="#9d9bff" stroke-width="2"/><text x="730" y="215" text-anchor="middle" fill="#c8c5ff" font-size="20" font-weight="800">04 驗證</text><text x="730" y="257" text-anchor="middle" fill="#fff" font-size="19">正常／惡意</text><text x="730" y="287" text-anchor="middle" fill="#fff" font-size="19">介接與回滾</text></g>
  <g><rect x="855" y="170" width="150" height="160" rx="22" fill="#263553" stroke="#9d9bff" stroke-width="2"/><text x="930" y="215" text-anchor="middle" fill="#c8c5ff" font-size="20" font-weight="800">05 小批部署</text><text x="930" y="257" text-anchor="middle" fill="#fff" font-size="19">單節點先行</text><text x="930" y="287" text-anchor="middle" fill="#fff" font-size="19">確認臨床結果</text></g>
  <g><rect x="1055" y="170" width="90" height="160" rx="22" fill="#3f3a27" stroke="#f1bc66" stroke-width="2"/><text x="1100" y="215" text-anchor="middle" fill="#ffd692" font-size="19" font-weight="800">06</text><text x="1100" y="248" text-anchor="middle" fill="#fff" font-size="18">監測</text><text x="1100" y="278" text-anchor="middle" fill="#fff" font-size="18">關閉</text></g></g>
  <rect x="90" y="400" width="1020" height="190" rx="28" fill="#111f36" stroke="#526b90" stroke-width="2"/><text x="130" y="447" fill="#f5f8ff" font-size="24" font-weight="800">三條並行保護線</text>
  <g font-size="20"><circle cx="150" cy="495" r="10" fill="#68e8ff"/><text x="180" y="502" fill="#dbeeff">臨床連續：保留待辦佇列、替代傳輸與人工確認</text><circle cx="150" cy="540" r="10" fill="#72efc1"/><text x="180" y="547" fill="#dfffee">安全證據：更新來源、組態差異、拒絕日誌與掃描結果</text><circle cx="690" cy="495" r="10" fill="#c1b5ff"/><text x="720" y="502" fill="#eeeaff">資料完整：筆數、順序、病人對應與影像可讀性</text><circle cx="690" cy="540" r="10" fill="#f1bc66"/><text x="720" y="547" fill="#fff0cf">失敗回復：停止擴散、回滾、隔離並升級事件</text></g>
  <text x="600" y="654" text-anchor="middle" fill="#9fb7d8" font-size="19">結案條件不是「服務啟動」，而是安全控制、資料完整與臨床流程同時通過</text>
</svg>
