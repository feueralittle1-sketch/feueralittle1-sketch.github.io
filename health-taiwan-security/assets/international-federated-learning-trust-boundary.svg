<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">跨院聯邦學習信任邊界</title><desc id="desc">三家醫院在院內訓練模型，只將受控更新送至協調平台，並由獨立證據面保存身分、隱私、完整性與版本紀錄。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs>
<rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="55" y="66" fill="#f7fbff" font-size="34" font-weight="800">資料不出院，不代表模型更新沒有外洩與竄改風險</text><text x="55" y="103" fill="#9fb7d5" font-size="19">聯邦學習必須同時治理本地資料、更新通道、協調平台與全域模型</text>
<g><rect x="55" y="160" width="265" height="250" rx="26" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="83" y="202" fill="#63e6ff" font-size="24" font-weight="800">醫院 A</text><text x="83" y="243" fill="#e6eefc" font-size="18">院內資料與本地訓練</text><text x="83" y="280" fill="#9fb7d5" font-size="16">資料最小化 · 用途核准</text><text x="83" y="315" fill="#9fb7d5" font-size="16">剪裁 · 差分隱私</text><rect x="80" y="340" width="215" height="44" rx="14" fill="#0b2440"/><text x="105" y="369" fill="#8fe8ff" font-size="16">只輸出受控模型更新</text>
<rect x="55" y="435" width="265" height="120" rx="24" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="83" y="477" fill="#b9adff" font-size="22" font-weight="800">醫院 B／C</text><text x="83" y="516" fill="#e6eefc" font-size="17">相同基線、獨立資料與責任</text></g>
<path d="M320 285H455" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M320 495C385 495 390 375 455 375" fill="none" stroke="#b9adff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="465" y="180" width="300" height="290" rx="28" fill="#19443e" stroke="#57f0c1" stroke-width="3"/><text x="500" y="226" fill="#72f5cd" font-size="25" font-weight="800">聯邦協調平台</text><text x="500" y="272" fill="#e6eefc" font-size="18">身分驗證與限時授權</text><text x="500" y="310" fill="#e6eefc" font-size="18">傳輸加密與更新簽章</text><text x="500" y="348" fill="#e6eefc" font-size="18">異常更新與投毒檢查</text><text x="500" y="386" fill="#e6eefc" font-size="18">安全聚合與版本鎖定</text><rect x="495" y="414" width="240" height="38" rx="12" fill="#0c302c"/><text x="522" y="440" fill="#baf7e4" font-size="16">協調平台是高價值管理面</text>
<path d="M765 325H875" stroke="#72f5cd" stroke-width="5" marker-end="url(#arrow)"/><rect x="885" y="205" width="260" height="210" rx="26" fill="#4a3420" stroke="#ffbf69" stroke-width="3"/><text x="915" y="250" fill="#ffd08a" font-size="24" font-weight="800">全域模型</text><text x="915" y="292" fill="#fff1dc" font-size="18">效能與公平性重驗</text><text x="915" y="329" fill="#fff1dc" font-size="18">臨床用途與版本限制</text><text x="915" y="366" fill="#fff1dc" font-size="18">異常時可停止與回退</text>
<rect x="455" y="520" width="690" height="100" rx="24" fill="#112e4d" stroke="#8fe8ff" stroke-width="2"/><text x="488" y="560" fill="#8fe8ff" font-size="22" font-weight="800">獨立證據面</text><text x="488" y="597" fill="#e6eefc" font-size="17">參與者身分 · 隱私參數 · 更新雜湊 · 聚合版本 · 異常事件 · 撤權與回退紀錄</text></g></svg>
