<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療雲端主權風險與退出證據矩陣</title><desc id="desc">將資料落地誤判、次處理者不透明、金鑰鎖定、無法移轉與刪除不完整，對應到控制和可驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#132344"/></linearGradient></defs><rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="68" fill="#eef8ff" font-size="34" font-weight="700">主權風險必須落到可取得、可重做的證據</text><text x="60" y="106" fill="#9fb8d8" font-size="19">契約承諾只有在技術測試與紀錄可驗證時，才形成控制</text>
<g font-family="Arial, Noto Sans TC, sans-serif"><rect x="55" y="145" width="1090" height="475" rx="24" fill="#0d2039" stroke="#315071"/><rect x="55" y="145" width="1090" height="72" rx="24" fill="#183652"/><text x="190" y="190" fill="#72e7ff" font-size="22" font-weight="700" text-anchor="middle">風險</text><text x="580" y="190" fill="#c7c4ff" font-size="22" font-weight="700" text-anchor="middle">控制</text><text x="960" y="190" fill="#67f0c2" font-size="22" font-weight="700" text-anchor="middle">驗收證據</text><path d="M350 145V620M790 145V620" stroke="#315071" stroke-width="2"/>
<g font-size="19"><g><text x="80" y="260" fill="#ff9eaa">資料位於國內即視為主權完成</text><text x="380" y="260" fill="#e7effa">逐項列出處理、備援、支援與法域</text><text x="820" y="260" fill="#d9fff2">資料流圖＋服務地點清單</text></g><path d="M55 295H1145" stroke="#29445f"/><g><text x="80" y="340" fill="#ff9eaa">次處理者變更不可見</text><text x="380" y="340" fill="#e7effa">通知、反對權與同等義務下傳</text><text x="820" y="340" fill="#d9fff2">最新版名冊＋變更通知紀錄</text></g><path d="M55 375H1145" stroke="#29445f"/><g><text x="80" y="420" fill="#ff9eaa">金鑰與管理權限被供應商鎖定</text><text x="380" y="420" fill="#e7effa">BYOK／HYOK、PAM、職務分離</text><text x="820" y="420" fill="#d9fff2">輪替測試＋管理活動日誌</text></g><path d="M55 455H1145" stroke="#29445f"/><g><text x="80" y="500" fill="#ff9eaa">只能匯出檔案，無法重建服務</text><text x="380" y="500" fill="#e7effa">格式、相依、頻寬與切換程序</text><text x="820" y="500" fill="#d9fff2">替代環境還原＋完成時間</text></g><path d="M55 535H1145" stroke="#29445f"/><g><text x="80" y="580" fill="#ff9eaa">退場後殘留副本與帳號</text><text x="380" y="580" fill="#e7effa">撤權、保留期限、可驗證刪除</text><text x="820" y="580" fill="#d9fff2">撤權清單＋刪除／保留證明</text></g></g></g><text x="600" y="663" fill="#a9bdd8" text-anchor="middle" font-size="19">驗收單位需包含臨床、資訊、資安、法務／採購與資料治理，不以供應商自評取代演練。</text></svg>