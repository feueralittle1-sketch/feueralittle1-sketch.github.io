<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療憑證生命週期與續期流程</title><desc id="desc">憑證從發現、歸屬、風險分級、預演、續期部署到驗證監測形成閉環。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#142854"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#69e5ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#b)"/><text x="62" y="72" fill="#fff" font-size="36" font-weight="800">六階段憑證生命週期：續期完成不等於服務可用</text><text x="62" y="112" fill="#a8bddc" font-size="22">部署後仍要驗證完整信任鏈、主機名稱、協定、相依服務與臨床交易</text>
<g font-family="Inter,Noto Sans TC,sans-serif"><rect x="55" y="190" width="160" height="250" rx="25" fill="#102746" stroke="#58d8ff" stroke-width="3"/><text x="135" y="245" text-anchor="middle" fill="#77e5ff" font-size="28" font-weight="700">1 發現</text><text x="135" y="310" text-anchor="middle" fill="#fff" font-size="22">掃描與匯入</text><text x="135" y="350" text-anchor="middle" fill="#fff" font-size="22">外部與內部</text><text x="135" y="397" text-anchor="middle" fill="#a9bddb" font-size="19">避免未知憑證</text><path d="M220 315h35" stroke="#69e5ff" stroke-width="7" marker-end="url(#a)"/><rect x="265" y="190" width="160" height="250" rx="25" fill="#142c4d" stroke="#69e5ff" stroke-width="3"/><text x="345" y="245" text-anchor="middle" fill="#8feaff" font-size="28" font-weight="700">2 歸屬</text><text x="345" y="310" text-anchor="middle" fill="#fff" font-size="22">服務與責任人</text><text x="345" y="350" text-anchor="middle" fill="#fff" font-size="22">環境與用途</text><text x="345" y="397" text-anchor="middle" fill="#a9bddb" font-size="19">建立變更窗口</text><path d="M430 315h35" stroke="#69e5ff" stroke-width="7" marker-end="url(#a)"/><rect x="475" y="190" width="160" height="250" rx="25" fill="#202b54" stroke="#a491ff" stroke-width="3"/><text x="555" y="245" text-anchor="middle" fill="#c3b8ff" font-size="28" font-weight="700">3 分級</text><text x="555" y="310" text-anchor="middle" fill="#fff" font-size="22">臨床衝擊</text><text x="555" y="350" text-anchor="middle" fill="#fff" font-size="22">提前期與依賴</text><text x="555" y="397" text-anchor="middle" fill="#a9bddb" font-size="19">設定告警門檻</text><path d="M640 315h35" stroke="#69e5ff" stroke-width="7" marker-end="url(#a)"/><rect x="685" y="190" width="160" height="250" rx="25" fill="#252b54" stroke="#b6a7ff" stroke-width="3"/><text x="765" y="245" text-anchor="middle" fill="#cfc5ff" font-size="28" font-weight="700">4 預演</text><text x="765" y="310" text-anchor="middle" fill="#fff" font-size="22">測試環境續期</text><text x="765" y="350" text-anchor="middle" fill="#fff" font-size="22">相容與回退</text><text x="765" y="397" text-anchor="middle" fill="#a9bddb" font-size="19">先驗證後上線</text><path d="M850 315h35" stroke="#72f0c1" stroke-width="7" marker-end="url(#a)"/><rect x="895" y="190" width="160" height="250" rx="25" fill="#123a3c" stroke="#72f0c1" stroke-width="3"/><text x="975" y="245" text-anchor="middle" fill="#82f7cc" font-size="28" font-weight="700">5 部署</text><text x="975" y="310" text-anchor="middle" fill="#fff" font-size="22">分批更換</text><text x="975" y="350" text-anchor="middle" fill="#fff" font-size="22">同步信任鏈</text><text x="975" y="397" text-anchor="middle" fill="#a9bddb" font-size="19">保留舊版回退</text><path d="M975 450v65" stroke="#72f0c1" stroke-width="7" marker-end="url(#a)"/><rect x="820" y="530" width="310" height="110" rx="25" fill="#15413f" stroke="#72f0c1" stroke-width="3"/><text x="975" y="575" text-anchor="middle" fill="#82f7cc" font-size="28" font-weight="700">6 驗證與監測</text><text x="975" y="612" text-anchor="middle" fill="#fff" font-size="21">握手、交易、告警、撤銷、證據</text></g><path d="M815 585H180Q90 585 90 500" fill="none" stroke="#a491ff" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#a)"/><text x="460" y="625" text-anchor="middle" fill="#c3b8ff" font-size="21">失敗、例外或新資產出現時回到清冊重新治理</text></svg>
