<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1230" role="img" aria-labelledby="title desc"><title id="title">醫療資安能力覆蓋建立流程手機版</title><desc id="desc">從任務盤點、角色映射、主備配置、能力補強、輪值演練到證據更新的垂直流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#101537"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="720" height="1230" rx="30" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><text x="360" y="66" fill="#fff" font-size="31" font-weight="800">能力覆蓋六步驟</text><text x="360" y="103" fill="#9fb3d9" font-size="18">用情境演練證明備援真的能接手</text><g fill="#102b42" stroke="#63e6ff" stroke-width="2"><rect x="95" y="150" width="530" height="120" rx="22"/><rect x="95" y="320" width="530" height="120" rx="22"/><rect x="95" y="490" width="530" height="120" rx="22"/><rect x="95" y="660" width="530" height="120" rx="22"/><rect x="95" y="830" width="530" height="120" rx="22"/><rect x="95" y="1000" width="530" height="120" rx="22"/></g><g fill="#fff" font-size="24" font-weight="800"><text x="360" y="196">1 任務盤點</text><text x="360" y="366">2 角色映射</text><text x="360" y="536">3 主備配置</text><text x="360" y="706">4 能力補強</text><text x="360" y="876">5 輪值演練</text><text x="360" y="1046">6 證據更新</text></g><g fill="#b9c9e5" font-size="17"><text x="360" y="235">服務｜時效｜權限｜依賴</text><text x="360" y="405">任務｜知識｜技能｜責任</text><text x="360" y="575">主責｜備援｜外包｜升級</text><text x="360" y="745">訓練｜程序｜工具｜授權</text><text x="360" y="915">夜班｜休假｜跨組｜故障</text><text x="360" y="1085">時間｜品質｜缺口｜改善</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M360 270V305"/><path d="M360 440V475"/><path d="M360 610V645"/><path d="M360 780V815"/><path d="M360 950V985"/></g><text x="360" y="1175" fill="#c9c2ff" font-size="18" font-weight="700">驗收：備援者可在目標時間內獨立完成情境</text></g></svg>