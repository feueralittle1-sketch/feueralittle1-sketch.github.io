<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc"><title id="title">醫療系統安全預設值交付邊界手機版</title><desc id="desc">供應商產品依序通過醫院導入閘門，驗證安全預設值後進入臨床服務區，證據另行保存。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101c3c"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#63e6ff"/></marker></defs><rect width="600" height="900" rx="28" fill="url(#b)"/><text x="36" y="54" fill="#fff" font-size="26" font-weight="800">安全預設值交付基線</text><text x="36" y="84" fill="#a8bad8" font-size="18">交付前驗證，不把風險留到上線後</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="54" y="125" width="492" height="170" rx="24" fill="#10233e" stroke="#536f9b" stroke-width="2"/><text x="82" y="168" fill="#8fe8ff" font-size="20" font-weight="700">供應商交付區</text><text x="82" y="209" fill="#fff" font-size="24" font-weight="800">產品、版本與預設設定</text><text x="82" y="249" fill="#c7d5ec" font-size="18">帳號憑證｜介面服務｜通訊更新｜日誌</text><path d="M300 295V345" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="38" y="355" width="524" height="270" rx="28" fill="#0c2942" stroke="#63e6ff" stroke-width="3"/><text x="300" y="400" text-anchor="middle" fill="#8fe8ff" font-size="20" font-weight="700">醫院導入閘門</text><text x="300" y="438" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">驗證實際交付版本</text><g fill="#153957"><rect x="75" y="472" width="200" height="54" rx="14"/><rect x="325" y="472" width="200" height="54" rx="14"/><rect x="75" y="542" width="200" height="54" rx="14"/><rect x="325" y="542" width="200" height="54" rx="14"/></g><g fill="#e9f7ff" font-size="18" font-weight="700" text-anchor="middle"><text x="175" y="506">唯一身分</text><text x="425" y="506">介面最小化</text><text x="175" y="576">安全通訊</text><text x="425" y="576">日誌預設開啟</text></g><path d="M300 625V675" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="54" y="685" width="492" height="112" rx="24" fill="#102d35" stroke="#55e6c1" stroke-width="2"/><text x="82" y="728" fill="#62f0d2" font-size="20" font-weight="700">臨床服務區：受控放行</text><text x="82" y="767" fill="#d2e8e5" font-size="18">指定信任區｜最小連線｜集中監測｜可復原</text><rect x="54" y="823" width="492" height="48" rx="14" fill="#1b1d3c" stroke="#9b8cff"/><text x="300" y="854" text-anchor="middle" fill="#ddd6ff" font-size="17">基線、測試、例外、期限與版本證據</text></g></svg>