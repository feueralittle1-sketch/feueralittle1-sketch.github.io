<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療網路存取控制政策引擎信任邊界</title><desc id="desc">使用者與醫療設備經網路設備向政策引擎查詢身分與授權，管理面、執行面及外部證據庫分離。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">政策引擎受損，風險會沿著授權決策擴散</text><text x="58" y="108" fill="#a9bfdf" font-size="20">存取控制平台不是單一伺服器，而是身分、網路與臨床服務之間的信任樞紐</text>
<rect x="55" y="175" width="255" height="180" rx="24" fill="#122b50" stroke="#8fa8ff" stroke-width="3"/><text x="183" y="225" text-anchor="middle" fill="#c6d1ff" font-size="25" font-weight="700">連線主體</text><text x="183" y="268" text-anchor="middle" fill="#e5eefb" font-size="20">人員／醫療設備／廠商</text><text x="183" y="306" text-anchor="middle" fill="#a9bfdf" font-size="18">身分、裝置與位置訊號</text>
<rect x="375" y="145" width="350" height="240" rx="28" fill="#18395b" stroke="#ff7da9" stroke-width="4"/><text x="550" y="200" text-anchor="middle" fill="#ff9fc1" font-size="27" font-weight="700">NAC 政策引擎</text><text x="550" y="246" text-anchor="middle" fill="#fff" font-size="20">認證、授權、端點分類</text><text x="550" y="284" text-anchor="middle" fill="#e5eefb" font-size="19">管理介面與分散節點</text><text x="550" y="329" text-anchor="middle" fill="#ffcf8c" font-size="18">高權限控制面須視為關鍵資產</text>
<rect x="790" y="175" width="355" height="180" rx="24" fill="#122b50" stroke="#5aefbe" stroke-width="3"/><text x="968" y="225" text-anchor="middle" fill="#7ff3cf" font-size="25" font-weight="700">網路執行與臨床服務</text><text x="968" y="268" text-anchor="middle" fill="#e5eefb" font-size="20">交換器／無線／VPN／應用</text><text x="968" y="306" text-anchor="middle" fill="#a9bfdf" font-size="18">允許、隔離或拒絕連線</text>
<path d="M310 265H365" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M725 265H780" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="80" y="480" width="300" height="145" rx="23" fill="#0c203b" stroke="#69e7ff" stroke-width="3"/><text x="230" y="525" text-anchor="middle" fill="#69e7ff" font-size="23" font-weight="700">隔離管理路徑</text><text x="230" y="566" text-anchor="middle" fill="#dce8f8" font-size="19">跳板、強驗證、來源限制</text><text x="230" y="600" text-anchor="middle" fill="#a9bfdf" font-size="17">不與一般辦公流量共用</text>
<rect x="450" y="480" width="300" height="145" rx="23" fill="#0c203b" stroke="#ffbd69" stroke-width="3"/><text x="600" y="525" text-anchor="middle" fill="#ffcf8c" font-size="23" font-weight="700">主機外證據</text><text x="600" y="566" text-anchor="middle" fill="#dce8f8" font-size="19">防火牆、流量、認證日誌</text><text x="600" y="600" text-anchor="middle" fill="#a9bfdf" font-size="17">避免根權限清除本機足跡</text>
<rect x="820" y="480" width="300" height="145" rx="23" fill="#0c203b" stroke="#5aefbe" stroke-width="3"/><text x="970" y="525" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">臨床備援策略</text><text x="970" y="566" text-anchor="middle" fill="#dce8f8" font-size="19">既有工作階段與緊急通道</text><text x="970" y="600" text-anchor="middle" fill="#a9bfdf" font-size="17">事先定義失效時的行為</text>
<path d="M230 470V420H500V395" fill="none" stroke="#69e7ff" stroke-width="4" marker-end="url(#a)"/><path d="M600 470V395" stroke="#ffbd69" stroke-width="4" marker-end="url(#a)"/><path d="M970 470V420H700V395" fill="none" stroke="#5aefbe" stroke-width="4" marker-end="url(#a)"/></g></svg>
