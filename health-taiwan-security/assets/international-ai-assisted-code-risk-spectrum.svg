<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">醫療 AI 輔助開發風險光譜</title><desc id="desc">依程式碼用途與臨床影響，從低風險原型到高風險臨床與身分功能，提高人工控制、測試及核准強度。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132044"/></linearGradient><linearGradient id="bar"><stop stop-color="#57f0c1"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#ff6b91"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="70" y="72" fill="#f4f8ff" font-size="34" font-weight="700">AI 輔助開發不是單一模式：依影響提高監督</text><text x="70" y="112" fill="#9fb3d9" font-size="21">程式碼用途、資料敏感度、可回復性與錯誤後果，共同決定控制強度</text>
<rect x="80" y="165" width="1040" height="28" rx="14" fill="url(#bar)" filter="url(#glow)"/><text x="80" y="225" fill="#57f0c1" font-size="21" font-weight="700">較低影響</text><text x="1035" y="225" fill="#ff8eaa" font-size="21" font-weight="700">較高影響</text>
<g font-family="sans-serif"><rect x="70" y="260" width="245" height="285" rx="22" fill="#102d3a" stroke="#57f0c1" stroke-width="2"/><text x="96" y="305" fill="#57f0c1" font-size="25" font-weight="700">概念原型</text><text x="96" y="347" fill="#e6eefc" font-size="20">• 不接真實資料</text><text x="96" y="382" fill="#e6eefc" font-size="20">• 不進正式環境</text><text x="96" y="417" fill="#e6eefc" font-size="20">• 可快速丟棄</text><path d="M96 469h176" stroke="#57f0c1"/><text x="96" y="508" fill="#bfeadf" font-size="19">基本掃描＋隔離</text>
<rect x="340" y="260" width="245" height="285" rx="22" fill="#172d3d" stroke="#63e6ff" stroke-width="2"/><text x="366" y="305" fill="#63e6ff" font-size="25" font-weight="700">內部工具</text><text x="366" y="347" fill="#e6eefc" font-size="20">• 有限使用者</text><text x="366" y="382" fill="#e6eefc" font-size="20">• 低敏感資料</text><text x="366" y="417" fill="#e6eefc" font-size="20">• 可人工替代</text><path d="M366 469h176" stroke="#63e6ff"/><text x="366" y="508" fill="#c8f4ff" font-size="19">審查＋測試＋回復</text>
<rect x="610" y="260" width="245" height="285" rx="22" fill="#292942" stroke="#ffd166" stroke-width="2"/><text x="636" y="305" fill="#ffd166" font-size="25" font-weight="700">病人資料流程</text><text x="636" y="347" fill="#e6eefc" font-size="20">• 個資或病歷</text><text x="636" y="382" fill="#e6eefc" font-size="20">• 跨系統寫入</text><text x="636" y="417" fill="#e6eefc" font-size="20">• 法遵與稽核</text><path d="M636 469h176" stroke="#ffd166"/><text x="636" y="508" fill="#ffe7a3" font-size="19">獨立驗證＋核准</text>
<rect x="880" y="260" width="245" height="285" rx="22" fill="#35233b" stroke="#ff6b91" stroke-width="2"/><text x="906" y="305" fill="#ff8eaa" font-size="25" font-weight="700">臨床／安全功能</text><text x="906" y="347" fill="#e6eefc" font-size="20">• 診療決策影響</text><text x="906" y="382" fill="#e6eefc" font-size="20">• 身分與權限</text><text x="906" y="417" fill="#e6eefc" font-size="20">• 錯誤難以回復</text><path d="M906 469h176" stroke="#ff6b91"/><text x="906" y="508" fill="#ffc0cf" font-size="19">人工主導＋嚴格閘道</text></g>
<rect x="150" y="585" width="900" height="48" rx="24" fill="#0c1e37" stroke="#36547c"/><text x="600" y="616" text-anchor="middle" fill="#d8e6fa" font-size="21">越接近右側，越不能只看「功能可用」；還要證明安全、可維護、可追溯</text></svg>