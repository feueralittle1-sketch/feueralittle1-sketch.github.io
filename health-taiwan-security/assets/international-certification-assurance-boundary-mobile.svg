<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">健康資訊認證與醫院在地安全驗證責任邊界手機版</title><desc id="desc">產品認證能力必須經過醫院部署閘門，才能轉成在地安全證據。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="720" height="1120" fill="url(#bg)"/><text x="42" y="68" fill="#fff" font-size="34" font-weight="800">認證不等於部署安全</text><text x="42" y="108" fill="#9fb7db" font-size="21">產品能力仍須轉成醫院現場證據。</text><rect x="70" y="155" width="580" height="250" rx="28" fill="#173153" stroke="#63e6ff" stroke-width="3"/><text x="360" y="210" text-anchor="middle" fill="#63e6ff" font-size="28" font-weight="800">產品認證範圍</text><text x="110" y="264" fill="#e4efff" font-size="22">身分驗證・授權・稽核能力</text><text x="110" y="308" fill="#e4efff" font-size="22">安全風險分析文件與測試範圍</text><rect x="165" y="340" width="390" height="42" rx="21" fill="#0a2239"/><text x="360" y="368" text-anchor="middle" fill="#9edfff" font-size="19" font-weight="700">回答：產品能不能做到</text><path d="M360 405 V470" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><rect x="120" y="470" width="480" height="190" rx="28" fill="#30275f" stroke="#b69cff" stroke-width="4"/><text x="360" y="528" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">醫院部署閘門</text><text x="360" y="577" text-anchor="middle" fill="#e8e0ff" font-size="22">範圍核對・在地測試・證據放行</text><text x="360" y="619" text-anchor="middle" fill="#cfc4ff" font-size="20">不以證書取代現場驗收</text><path d="M360 660 V725" stroke="#b69cff" stroke-width="6" marker-end="url(#a)"/><rect x="70" y="725" width="580" height="265" rx="28" fill="#123d45" stroke="#57f0c1" stroke-width="3"/><text x="360" y="780" text-anchor="middle" fill="#57f0c1" font-size="28" font-weight="800">醫院運行環境</text><text x="110" y="832" fill="#e2fff7" font-size="22">SSO／MFA・角色映射・API 介接</text><text x="110" y="875" fill="#e2fff7" font-size="22">日誌外送・停機流程・更新重驗</text><rect x="165" y="920" width="390" height="42" rx="21" fill="#0b2c30"/><text x="360" y="948" text-anchor="middle" fill="#8ff5d7" font-size="19" font-weight="700">回答：現場是否安全有效</text><rect x="60" y="1030" width="600" height="60" rx="26" fill="#3e293e" stroke="#ff91b8" stroke-width="2"/><text x="360" y="1067" text-anchor="middle" fill="#ffd8e6" font-size="19" font-weight="700">外國認證規則須轉成台灣院內契約與風險證據</text></svg>
