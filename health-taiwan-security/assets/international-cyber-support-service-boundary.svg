<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">外部醫療資安支援服務與院內責任邊界</title><desc id="desc">外部支援機制可提供準備、偵測、應變與治理服務，醫院仍須掌握事件指揮、臨床決策、資料授權及風險接受。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111d3a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8fe8ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="64" y="76" fill="#f4f8ff" font-size="36" font-weight="700">外部支援可以增援，不能取代院內責任</text><text x="64" y="116" fill="#9fb3d9" font-size="20">先定義服務、授權與交付證據，再於事件中啟動協作</text>
<rect x="64" y="166" width="430" height="410" rx="28" fill="#122847" stroke="#63e6ff" stroke-width="3"/><text x="96" y="218" fill="#63e6ff" font-size="26" font-weight="700">外部支援服務</text>
<g fill="#e6eefc" font-size="21"><text x="96" y="274">準備｜演練、評估、服務設計</text><text x="96" y="330">偵測｜情報、曝險、異常分析</text><text x="96" y="386">應變｜事件處理、復原支援</text><text x="96" y="442">治理｜指引、協調、能力成熟度</text></g><text x="96" y="510" fill="#9fb3d9" font-size="18">服務能否取得、何時啟動、交付內容</text><text x="96" y="540" fill="#9fb3d9" font-size="18">仍須依各機制、契約與法域確認</text>
<rect x="706" y="166" width="430" height="410" rx="28" fill="#14372f" stroke="#57f0c1" stroke-width="3"/><text x="738" y="218" fill="#57f0c1" font-size="26" font-weight="700">醫院不可外包的責任</text>
<g fill="#e6eefc" font-size="21"><text x="738" y="274">事件指揮與臨床優先序</text><text x="738" y="330">病人安全與降級運作決策</text><text x="738" y="386">資料範圍、授權與法規義務</text><text x="738" y="442">風險接受、復原放行與結案</text></g><text x="738" y="510" fill="#9fb3d9" font-size="18">外部意見須回到院內權責鏈核准</text><text x="738" y="540" fill="#9fb3d9" font-size="18">並留下決策、變更與驗收紀錄</text>
<path d="M494 330H690" stroke="#8fe8ff" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow)"/><path d="M706 422H510" stroke="#a997ff" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow)"/><text x="600" y="302" text-anchor="middle" fill="#9fefff" font-size="18">能力與技術支援</text><text x="600" y="462" text-anchor="middle" fill="#d8d0ff" font-size="18">授權、情境與驗收回饋</text>
<rect x="64" y="620" width="1072" height="62" rx="18" fill="#0d2138" stroke="#274867"/><text x="600" y="659" text-anchor="middle" fill="#f4f8ff" font-size="22" font-weight="700">共同輸出：案件編號、責任人、時間戳、證據範圍、處置紀錄、復原驗收與未結風險</text></svg>
