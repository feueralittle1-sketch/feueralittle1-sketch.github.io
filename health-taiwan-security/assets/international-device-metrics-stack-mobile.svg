<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安指標五層架構</title><desc id="desc">五層指標由製造商處置延伸到資料可信度。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient></defs><rect width="390" height="1040" rx="28" fill="url(#bg)"/><text x="195" y="46" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">五層指標，避免只追漏洞數</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="25" y="82" width="340" height="150" rx="22" fill="#102742" stroke="#7aa7ff" stroke-width="2"/><text x="48" y="126" font-size="23" font-weight="800" fill="#f4f8ff">01 製造商處置</text><text x="48" y="168" font-size="19" fill="#b8c8df">修補比例／處置時間</text><text x="48" y="201" font-size="19" fill="#b8c8df">支援與公告品質</text><rect x="25" y="250" width="340" height="150" rx="22" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="48" y="294" font-size="23" font-weight="800" fill="#f4f8ff">02 院內部署</text><text x="48" y="336" font-size="19" fill="#b8c8df">部署覆蓋／逾期長尾</text><text x="48" y="369" font-size="19" fill="#b8c8df">例外與責任期限</text><rect x="25" y="418" width="340" height="150" rx="22" fill="#102742" stroke="#5eead4" stroke-width="2"/><text x="48" y="462" font-size="23" font-weight="800" fill="#f4f8ff">03 控制有效性</text><text x="48" y="504" font-size="19" fill="#b8c8df">實機驗證／負向測試</text><text x="48" y="537" font-size="19" fill="#b8c8df">補償控制／遙測</text><rect x="25" y="586" width="340" height="150" rx="22" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="48" y="630" font-size="23" font-weight="800" fill="#f4f8ff">04 臨床影響</text><text x="48" y="672" font-size="19" fill="#b8c8df">設備可用／照護容量</text><text x="48" y="705" font-size="19" fill="#b8c8df">資料完整／替代流程</text><rect x="25" y="754" width="340" height="150" rx="22" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="48" y="798" font-size="23" font-weight="800" fill="#f4f8ff">05 資料可信度</text><text x="48" y="840" font-size="19" fill="#b8c8df">固定分母／未知比例</text><text x="48" y="873" font-size="19" fill="#b8c8df">來源驗證／更新頻率</text></g><text x="195" y="960" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="20" font-weight="700" fill="#67e8f9">輸出：控制、接受或汰換決策</text></svg>