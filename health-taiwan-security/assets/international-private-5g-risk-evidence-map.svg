<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫院私有 5G 的風險、控制與驗收證據對照</title>
<desc id="desc">將回傳中斷、憑證失控、管理平面遭入侵、流量混接與基地台故障五項風險，分別對應本地最低服務、快速撤銷、隔離維運、平面分離與涵蓋切換等控制及證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="65" y="72" fill="#fff" font-size="34" font-weight="700">驗收矩陣：連得上只是起點，失效與復原才是證據</text><text x="65" y="109" fill="#a8bad8" font-size="20">控制必須能在代表性臨床情境中被觸發、量測與回退</text>
<rect x="55" y="155" width="1090" height="64" rx="18" fill="#1c3150"/><text x="175" y="196" text-anchor="middle" fill="#63e6ff" font-size="21" font-weight="700">失敗模式</text><text x="560" y="196" text-anchor="middle" fill="#c9beff" font-size="21" font-weight="700">主要控制</text><text x="950" y="196" text-anchor="middle" fill="#8bf7d8" font-size="21" font-weight="700">驗收證據</text>
<g font-size="19"><rect x="55" y="235" width="1090" height="76" rx="16" fill="#10263d"/><text x="175" y="280" text-anchor="middle" fill="#fff">回傳網路中斷</text><text x="560" y="267" text-anchor="middle" fill="#d7ceff">第二路徑＋本地最低服務</text><text x="950" y="267" text-anchor="middle" fill="#bafbe7">切換時間、必要交易成功率</text><text x="950" y="292" text-anchor="middle" fill="#bafbe7">離線期間事件紀錄</text>
<rect x="55" y="323" width="1090" height="76" rx="16" fill="#142b43"/><text x="175" y="368" text-anchor="middle" fill="#fff">SIM／憑證失控</text><text x="560" y="355" text-anchor="middle" fill="#d7ceff">裝置綁定、撤銷與輪替</text><text x="950" y="355" text-anchor="middle" fill="#bafbe7">撤銷生效時間</text><text x="950" y="380" text-anchor="middle" fill="#bafbe7">未授權連線拒絕紀錄</text>
<rect x="55" y="411" width="1090" height="76" rx="16" fill="#10263d"/><text x="175" y="456" text-anchor="middle" fill="#fff">維運平面遭入侵</text><text x="560" y="443" text-anchor="middle" fill="#d7ceff">隔離工作站、強驗證、雙人核准</text><text x="950" y="443" text-anchor="middle" fill="#bafbe7">管理指令稽核</text><text x="950" y="468" text-anchor="middle" fill="#bafbe7">乾淨重建與設定比對</text>
<rect x="55" y="499" width="1090" height="76" rx="16" fill="#142b43"/><text x="175" y="544" text-anchor="middle" fill="#fff">控制與資料流量混接</text><text x="560" y="531" text-anchor="middle" fill="#d7ceff">VRF／防火牆與平面分離</text><text x="950" y="531" text-anchor="middle" fill="#bafbe7">跨區阻擋測試</text><text x="950" y="556" text-anchor="middle" fill="#bafbe7">允許流量清單與封包證據</text>
<rect x="55" y="587" width="1090" height="76" rx="16" fill="#10263d"/><text x="175" y="632" text-anchor="middle" fill="#fff">基地台或核心故障</text><text x="560" y="619" text-anchor="middle" fill="#d7ceff">重疊涵蓋、容量保留、復原程序</text><text x="950" y="619" text-anchor="middle" fill="#bafbe7">故障注入、漫遊與復原時間</text><text x="950" y="644" text-anchor="middle" fill="#bafbe7">臨床降級啟動紀錄</text></g><path d="M315 155V663M790 155V663" stroke="#5f7395" stroke-width="2" opacity=".65"/></g></svg>