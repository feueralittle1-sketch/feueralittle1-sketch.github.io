<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療 DDoS 風險、控制與驗收證據對照</title>
<desc id="desc">將容量耗盡、應用層資源耗竭、誤擋正常使用者、核心連帶失效與復原震盪，對應分層控制及可查核證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17133b"/></linearGradient></defs><rect width="1200" height="760" rx="34" fill="url(#bg)"/><text x="65" y="70" fill="#fff" font-size="34" font-weight="700">風險不能只用「網站有打開」結案</text><text x="65" y="108" fill="#a8bad8" font-size="20">每個緩解措施都要同時驗證可用性、臨床影響與回復能力</text>
<g font-family="Noto Sans TC, sans-serif"><rect x="60" y="155" width="1080" height="70" rx="18" fill="#14263c"/><text x="90" y="199" fill="#ff9dcc" font-size="23" font-weight="700">風險</text><text x="400" y="199" fill="#8fe8ff" font-size="23" font-weight="700">控制</text><text x="800" y="199" fill="#8ff3cf" font-size="23" font-weight="700">驗收證據</text>
<g font-size="20"><rect x="60" y="242" width="1080" height="86" rx="18" fill="#0c2134"/><text x="90" y="278" fill="#fff" font-weight="700">上游容量耗盡</text><text x="90" y="307" fill="#c6d4eb">入口全面逾時</text><text x="400" y="291" fill="#b8f4ff">多路徑、清洗、容量保留</text><text x="800" y="291" fill="#bafbe7">壓力測試、切換時間、丟包率</text>
<rect x="60" y="342" width="1080" height="86" rx="18" fill="#101f37"/><text x="90" y="378" fill="#fff" font-weight="700">應用資源耗竭</text><text x="90" y="407" fill="#c6d4eb">查詢拖垮後端</text><text x="400" y="391" fill="#b8f4ff">快取、排隊、單位成本限額</text><text x="800" y="391" fill="#bafbe7">後端延遲、連線池、錯誤率</text>
<rect x="60" y="442" width="1080" height="86" rx="18" fill="#0c2134"/><text x="90" y="478" fill="#fff" font-weight="700">誤擋正常病人</text><text x="90" y="507" fill="#c6d4eb">代理或共享 IP 受限</text><text x="400" y="491" fill="#b8f4ff">分級挑戰、例外與快速回退</text><text x="800" y="491" fill="#bafbe7">成功率、客服通報、回退時間</text>
<rect x="60" y="542" width="1080" height="86" rx="18" fill="#101f37"/><text x="90" y="578" fill="#fff" font-weight="700">核心連帶失效</text><text x="90" y="607" fill="#c6d4eb">入口耗盡共用依賴</text><text x="400" y="591" fill="#b8f4ff">資源池與信任區隔離</text><text x="800" y="591" fill="#bafbe7">核心負載、臨床交易完整性</text>
<rect x="60" y="642" width="1080" height="70" rx="18" fill="#0c2134"/><text x="90" y="685" fill="#fff" font-weight="700">復原震盪</text><text x="400" y="685" fill="#b8f4ff">分批恢復與持續觀測</text><text x="800" y="685" fill="#bafbe7">佇列消化、容量餘裕、再發門檻</text></g></g></svg>