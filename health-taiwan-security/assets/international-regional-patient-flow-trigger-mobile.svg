<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title desc"><title id="title">病人分流觸發流程手機版</title><desc id="desc">從發現衝擊到臨床判定、容量確認、分流決策及持續複核的五個閘門。</desc><rect width="390" height="720" rx="24" fill="#081524"/><text x="195" y="38" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">病人分流的五個觸發閘門</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="35" y="72" width="320" height="86" rx="18" fill="#123047" stroke="#63e6ff" stroke-width="2"/><text x="58" y="104" fill="#63e6ff" font-size="17" font-weight="800">1 發現衝擊</text><text x="58" y="133" fill="#e6eefc" font-size="16">系統不可用、資料不可信、人工作業逼近上限</text><path d="M195 158V178" stroke="#8fe8ff" stroke-width="3"/><rect x="35" y="178" width="320" height="86" rx="18" fill="#182849" stroke="#9bbcff" stroke-width="2"/><text x="58" y="210" fill="#b8ceff" font-size="17" font-weight="800">2 臨床判定</text><text x="58" y="239" fill="#e6eefc" font-size="16">哪些服務可降級？可安全維持多久？</text><path d="M195 264V284" stroke="#8fe8ff" stroke-width="3"/><rect x="35" y="284" width="320" height="86" rx="18" fill="#2c2447" stroke="#b29cff" stroke-width="2"/><text x="58" y="316" fill="#d4c8ff" font-size="17" font-weight="800">3 容量確認</text><text x="58" y="345" fill="#e6eefc" font-size="16">床位、專科、隔離、轉運與接收條件</text><path d="M195 370V390" stroke="#8fe8ff" stroke-width="3"/><rect x="35" y="390" width="320" height="86" rx="18" fill="#352918" stroke="#ffd166" stroke-width="2"/><text x="58" y="422" fill="#ffd166" font-size="17" font-weight="800">4 分流決策</text><text x="58" y="451" fill="#e6eefc" font-size="16">留院、延後或跨院轉診；完成雙向確認</text><path d="M195 476V496" stroke="#8fe8ff" stroke-width="3"/><rect x="35" y="496" width="320" height="86" rx="18" fill="#15382f" stroke="#57f0c1" stroke-width="2"/><text x="58" y="528" fill="#57f0c1" font-size="17" font-weight="800">5 持續複核</text><text x="58" y="557" fill="#e6eefc" font-size="16">固定節奏更新，達標後分階段恢復</text><rect x="35" y="612" width="320" height="72" rx="18" fill="#0e2137" stroke="#29476b"/><text x="195" y="641" fill="#8fe8ff" font-size="16" font-weight="800" text-anchor="middle">決策包：時間戳＋責任人＋接收確認</text><text x="195" y="667" fill="#e6eefc" font-size="15" text-anchor="middle">並記錄通知對象與下一次複核時間</text></g></svg>