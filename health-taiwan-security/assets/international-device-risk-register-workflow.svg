<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療設備風險登錄閉環流程</title><desc id="desc">從設備盤點、情境建模、風險分析、控制驗證、權責決策到持續監測的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="55" y="68" fill="#f7fbff" font-size="34" font-weight="800">六階段把風險分析轉成治理閉環</text><text x="55" y="108" fill="#a8bddb" font-size="19">每一步都產生可稽核證據，且在變更或事件後重新啟動</text><path d="M170 250H1030" stroke="#466d8f" stroke-width="8"/><g><circle cx="170" cy="250" r="70" fill="#173b5d" stroke="#63e6ff" stroke-width="4"/><text x="170" y="244" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">01</text><text x="170" y="278" text-anchor="middle" fill="#dce9f8" font-size="18">盤點</text><text x="170" y="355" text-anchor="middle" fill="#dce9f8" font-size="18" font-weight="700">設備與臨床用途</text><text x="170" y="386" text-anchor="middle" fill="#9fb7d5" font-size="16">版本、連線、責任</text></g><g><circle cx="342" cy="250" r="70" fill="#19443e" stroke="#57f0c1" stroke-width="4"/><text x="342" y="244" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">02</text><text x="342" y="278" text-anchor="middle" fill="#dce9f8" font-size="18">建模</text><text x="342" y="355" text-anchor="middle" fill="#dce9f8" font-size="18" font-weight="700">威脅與傷害情境</text><text x="342" y="386" text-anchor="middle" fill="#9fb7d5" font-size="16">路徑、前置條件</text></g><g><circle cx="514" cy="250" r="70" fill="#4a3420" stroke="#ffbf69" stroke-width="4"/><text x="514" y="244" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">03</text><text x="514" y="278" text-anchor="middle" fill="#dce9f8" font-size="18">分析</text><text x="514" y="355" text-anchor="middle" fill="#dce9f8" font-size="18" font-weight="700">可利用性與衝擊</text><text x="514" y="386" text-anchor="middle" fill="#9fb7d5" font-size="16">證據與不確定性</text></g><g><circle cx="686" cy="250" r="70" fill="#123c55" stroke="#8fe8ff" stroke-width="4"/><text x="686" y="244" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">04</text><text x="686" y="278" text-anchor="middle" fill="#dce9f8" font-size="18">控制</text><text x="686" y="355" text-anchor="middle" fill="#dce9f8" font-size="18" font-weight="700">降低風險並驗證</text><text x="686" y="386" text-anchor="middle" fill="#9fb7d5" font-size="16">修補、隔離、限制</text></g><g><circle cx="858" cy="250" r="70" fill="#342657" stroke="#b6a6ff" stroke-width="4"/><text x="858" y="244" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">05</text><text x="858" y="278" text-anchor="middle" fill="#dce9f8" font-size="18">決策</text><text x="858" y="355" text-anchor="middle" fill="#dce9f8" font-size="18" font-weight="700">處置或接受</text><text x="858" y="386" text-anchor="middle" fill="#9fb7d5" font-size="16">權責、期限、條件</text></g><g><circle cx="1030" cy="250" r="70" fill="#3f2638" stroke="#ff8fc7" stroke-width="4"/><text x="1030" y="244" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">06</text><text x="1030" y="278" text-anchor="middle" fill="#dce9f8" font-size="18">監測</text><text x="1030" y="355" text-anchor="middle" fill="#dce9f8" font-size="18" font-weight="700">重驗與更新</text><text x="1030" y="386" text-anchor="middle" fill="#9fb7d5" font-size="16">事件、版本、曝險</text></g><path d="M1030 450V530H170V430" fill="none" stroke="#ff8fc7" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#a)"/><text x="600" y="515" text-anchor="middle" fill="#ffc3df" font-size="20" font-weight="700">版本變更、供應商公告、已知遭利用或臨床異常觸發重評</text><rect x="250" y="570" width="700" height="62" rx="20" fill="#102f48" stroke="#8fe8ff" stroke-width="2"/><text x="600" y="610" text-anchor="middle" fill="#e6eefc" font-size="19">驗收重點：情境可重現、控制有效、責任清楚、剩餘風險可追蹤</text></g></svg>