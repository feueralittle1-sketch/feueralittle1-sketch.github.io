<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">手機版醫療憑證生命週期</title><desc id="desc">醫療憑證依序完成發現、歸屬、分級、預演、部署與驗證監測。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172b58"/></linearGradient><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#69e5ff"/></marker></defs><rect width="720" height="1160" rx="32" fill="url(#g)"/><text x="42" y="68" fill="#fff" font-size="34" font-weight="800">醫療憑證生命週期</text><text x="42" y="110" fill="#a9bddb" font-size="23">續期後仍須驗證臨床交易</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="70" y="155" width="580" height="125" rx="24" fill="#102746" stroke="#58d8ff" stroke-width="3"/><text x="110" y="207" fill="#77e5ff" font-size="28" font-weight="700">1 發現</text><text x="110" y="248" fill="#fff" font-size="23">掃描公開入口、內部 API、設備與管理介面</text><path d="M360 290v42" stroke="#69e5ff" stroke-width="7" marker-end="url(#m)"/><rect x="70" y="345" width="580" height="125" rx="24" fill="#142c4d" stroke="#69e5ff" stroke-width="3"/><text x="110" y="397" fill="#8feaff" font-size="28" font-weight="700">2 歸屬</text><text x="110" y="438" fill="#fff" font-size="23">連結服務、用途、環境、責任人與變更窗口</text><path d="M360 480v42" stroke="#69e5ff" stroke-width="7" marker-end="url(#m)"/><rect x="70" y="535" width="580" height="125" rx="24" fill="#202b54" stroke="#a491ff" stroke-width="3"/><text x="110" y="587" fill="#c3b8ff" font-size="28" font-weight="700">3 分級</text><text x="110" y="628" fill="#fff" font-size="23">依臨床衝擊、依賴與續期提前期設定告警</text><path d="M360 670v42" stroke="#69e5ff" stroke-width="7" marker-end="url(#m)"/><rect x="70" y="725" width="580" height="125" rx="24" fill="#252b54" stroke="#b6a7ff" stroke-width="3"/><text x="110" y="777" fill="#cfc5ff" font-size="28" font-weight="700">4 預演</text><text x="110" y="818" fill="#fff" font-size="23">測試續期、信任鏈、相容性與回退方式</text><path d="M360 860v42" stroke="#72f0c1" stroke-width="7" marker-end="url(#m)"/><rect x="70" y="915" width="270" height="160" rx="24" fill="#123a3c" stroke="#72f0c1" stroke-width="3"/><text x="205" y="967" text-anchor="middle" fill="#82f7cc" font-size="28" font-weight="700">5 部署</text><text x="205" y="1010" text-anchor="middle" fill="#fff" font-size="22">分批更換</text><text x="205" y="1045" text-anchor="middle" fill="#fff" font-size="22">保留回退</text><path d="M350 995h32" stroke="#72f0c1" stroke-width="7" marker-end="url(#m)"/><rect x="395" y="915" width="255" height="160" rx="24" fill="#15413f" stroke="#72f0c1" stroke-width="3"/><text x="522" y="967" text-anchor="middle" fill="#82f7cc" font-size="28" font-weight="700">6 驗證</text><text x="522" y="1010" text-anchor="middle" fill="#fff" font-size="22">握手與交易</text><text x="522" y="1045" text-anchor="middle" fill="#fff" font-size="22">告警與證據</text></g><text x="360" y="1120" text-anchor="middle" fill="#a9bddb" font-size="21">任何失敗或新資產都回到清冊重新治理</text></svg>
