<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療資安控制驗收常見失敗與修正矩陣</title><desc id="desc">將紙上合規、單次測試、測試範圍偏差與例外永久化四種失敗模式，對應可驗證的修正控制和證據。</desc><rect width="1200" height="720" rx="36" fill="#071426"/><text x="600" y="66" text-anchor="middle" fill="#fff" font-family="Arial,'Noto Sans TC'" font-size="36" font-weight="700">驗收失敗不是缺一份報告，而是證據斷鏈</text><g font-family="Arial,'Noto Sans TC'"><rect x="65" y="115" width="1070" height="70" rx="18" fill="#17304f"/><text x="100" y="159" fill="#63e6ff" font-size="21" font-weight="700">失敗模式</text><text x="465" y="159" fill="#71a7ff" font-size="21" font-weight="700">修正控制</text><text x="855" y="159" fill="#57f0c1" font-size="21" font-weight="700">通過證據</text><g font-size="19"><rect x="65" y="200" width="1070" height="105" rx="16" fill="#10223d"/><text x="100" y="242" fill="#fff" font-weight="700">紙上合規</text><text x="100" y="274" fill="#b8c8e5">政策存在，控制未落地</text><text x="465" y="256" fill="#d6e2f5">抽樣實機＋負向測試</text><text x="855" y="256" fill="#c8f5e7">組態、日誌與阻擋結果一致</text><rect x="65" y="320" width="1070" height="105" rx="16" fill="#132844"/><text x="100" y="362" fill="#fff" font-weight="700">單次測試</text><text x="100" y="394" fill="#b8c8e5">上線前通過，變更後失效</text><text x="465" y="376" fill="#d6e2f5">重大變更觸發重測</text><text x="855" y="376" fill="#c8f5e7">版本、日期、範圍可比較</text><rect x="65" y="440" width="1070" height="105" rx="16" fill="#10223d"/><text x="100" y="482" fill="#fff" font-weight="700">範圍偏差</text><text x="100" y="514" fill="#b8c8e5">測試環境避開臨床依賴</text><text x="465" y="496" fill="#d6e2f5">代表性場景＋服務擁有人確認</text><text x="855" y="496" fill="#c8f5e7">資產、資料流與替代流程覆蓋</text><rect x="65" y="560" width="1070" height="105" rx="16" fill="#132844"/><text x="100" y="602" fill="#fff" font-weight="700">例外永久化</text><text x="100" y="634" fill="#b8c8e5">補償控制無期限、無監測</text><text x="465" y="616" fill="#d6e2f5">具名核准＋到期＋失效告警</text><text x="855" y="616" fill="#c8f5e7">殘餘風險、重評與關閉紀錄</text></g></g></svg>