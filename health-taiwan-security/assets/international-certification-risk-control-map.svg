<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">健康資訊系統認證誤用風險與控制對照</title><desc id="desc">將認證範圍錯置、預設組態未調整、介接繞過控制及更新後漂移，對應在地邊界表、組態基線、負向測試與持續重驗。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="36" font-weight="800">四種認證誤用，四組可查證控制</text><text x="60" y="112" fill="#9fb7db" font-size="22">風險不在證書本身，而在把有限範圍的證據擴張成整體安全結論。</text><rect x="60" y="165" width="1080" height="480" rx="30" fill="#0d203a" stroke="#36577d" stroke-width="2"/><text x="105" y="215" fill="#ffb6d0" font-size="24" font-weight="800">失敗模式</text><text x="640" y="215" fill="#8ff5d7" font-size="24" font-weight="800">對應控制與驗收證據</text><line x1="600" y1="185" x2="600" y2="620" stroke="#36577d" stroke-width="2"/><line x1="85" y1="250" x2="1115" y2="250" stroke="#36577d"/><g font-family="sans-serif"><text x="105" y="305" fill="#ffe0ea" font-size="21" font-weight="700">認證範圍錯置</text><text x="105" y="338" fill="#b8c8df" font-size="18">把單一模組或版本推論成整體部署安全</text><text x="640" y="305" fill="#b8ffe9" font-size="21" font-weight="700">建立版本、模組、介接與例外邊界表</text><text x="640" y="338" fill="#b8c8df" font-size="18">證據：逐項對應矩陣與未涵蓋項目責任人</text><line x1="85" y1="365" x2="1115" y2="365" stroke="#36577d"/><text x="105" y="420" fill="#ffe0ea" font-size="21" font-weight="700">預設組態直接上線</text><text x="105" y="453" fill="#b8c8df" font-size="18">角色過寬、共用帳號、稽核未外送</text><text x="640" y="420" fill="#b8ffe9" font-size="21" font-weight="700">核准組態基線與最小權限測試</text><text x="640" y="453" fill="#b8c8df" font-size="18">證據：組態快照、越權阻擋與日誌接收紀錄</text><line x1="85" y1="480" x2="1115" y2="480" stroke="#36577d"/><text x="105" y="535" fill="#ffe0ea" font-size="21" font-weight="700">介接繞過產品控制</text><text x="105" y="568" fill="#b8c8df" font-size="18">API、設備或第三方路徑未套用相同政策</text><text x="640" y="535" fill="#b8ffe9" font-size="21" font-weight="700">負向測試與端到端事件追蹤</text><text x="640" y="568" fill="#b8c8df" font-size="18">證據：拒絕案例、完整時間線與撤權驗證</text></g><rect x="270" y="650" width="660" height="48" rx="24" fill="#2c294f" stroke="#b69cff" stroke-width="2"/><text x="600" y="681" text-anchor="middle" fill="#e5ddff" font-size="19" font-weight="700">更新或重大變更後：重新執行高風險情境，不能沿用舊證據永久放行</text></svg>
