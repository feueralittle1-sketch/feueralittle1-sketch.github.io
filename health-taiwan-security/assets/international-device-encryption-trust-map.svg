<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療可攜端點的離線資料保護信任鏈</title>
<desc id="desc">遺失或遭竊裝置在開機前先由 TPM 驗證啟動完整性，再要求使用者輸入 PIN，通過後才解鎖加密磁碟；復原金鑰由權限分離的管理面保管。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="700" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="76" fill="#fff" font-size="34" font-weight="700">離線資料保護：裝置在解鎖前不信任持有者</text><text x="70" y="113" fill="#a8bad8" font-size="20">磁碟加密、啟動完整性與開機前驗證形成三道相依控制</text>
<rect x="55" y="205" width="205" height="145" rx="24" fill="#34203d" stroke="#ff7ab8" stroke-width="3"/><text x="157" y="255" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">遺失／遭竊</text><text x="157" y="295" text-anchor="middle" fill="#ffc2df" font-size="19">攻擊者可接觸硬體</text>
<rect x="325" y="180" width="220" height="195" rx="24" fill="#103247" stroke="#63e6ff" stroke-width="3"/><text x="435" y="230" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">TPM＋安全啟動</text><text x="435" y="270" text-anchor="middle" fill="#a9f2ff" font-size="19">檢查啟動狀態</text><text x="435" y="307" text-anchor="middle" fill="#a9f2ff" font-size="19">封存磁碟金鑰</text>
<rect x="610" y="180" width="205" height="195" rx="24" fill="#252451" stroke="#a997ff" stroke-width="3"/><text x="712" y="230" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">開機前 PIN</text><text x="712" y="270" text-anchor="middle" fill="#d7ceff" font-size="19">人在場的驗證因子</text><text x="712" y="307" text-anchor="middle" fill="#d7ceff" font-size="19">解鎖前先確認</text>
<rect x="880" y="180" width="255" height="195" rx="24" fill="#113b39" stroke="#57f0c1" stroke-width="3"/><text x="1007" y="230" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">加密作業系統磁碟</text><text x="1007" y="270" text-anchor="middle" fill="#bafbe7" font-size="19">病歷快取・報表</text><text x="1007" y="307" text-anchor="middle" fill="#bafbe7" font-size="19">憑證・離線資料</text>
<path d="M260 278H315" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M545 278H600" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M815 278H870" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="300" y="470" width="600" height="120" rx="25" fill="#10263d" stroke="#ffd37a" stroke-width="2"/><text x="600" y="515" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">獨立復原金鑰管理面</text><text x="600" y="555" text-anchor="middle" fill="#ffe4a8" font-size="19">受控取用・身分核對・每次留痕・使用後處置</text><path d="M600 470V412H1007V385" fill="none" stroke="#ffd37a" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="600" y="650" text-anchor="middle" fill="#94a3b8" font-size="18">作業系統登入仍是另一層控制；裝置已解鎖時，磁碟加密不能取代工作階段與網路防護</text></g></svg>