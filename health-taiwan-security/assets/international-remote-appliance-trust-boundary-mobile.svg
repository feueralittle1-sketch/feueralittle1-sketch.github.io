<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc"><title id="title">遠端支援設備遭入侵後的信任邊界手機版</title><desc id="desc">外部網路經遠端支援設備連到臨床及管理區，並將日誌送往獨立證據面。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="720" height="1120" fill="url(#bg)"/><text x="42" y="68" fill="#fff" font-size="34" font-weight="800">高權限信任樞紐</text><text x="42" y="108" fill="#9fb7db" font-size="22">遭入侵時，維護關係可能成為橫向路徑。</text><rect x="80" y="165" width="560" height="120" rx="25" fill="#132b50" stroke="#63e6ff" stroke-width="3"/><text x="360" y="218" text-anchor="middle" fill="#63e6ff" font-size="27" font-weight="700">外部網路</text><text x="360" y="255" text-anchor="middle" fill="#d9e8ff" font-size="21">供應商／攻擊者・公開服務面</text><path d="M360 285 V350" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/><rect x="80" y="350" width="560" height="190" rx="28" fill="#2b2459" stroke="#b69cff" stroke-width="4"/><text x="360" y="410" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">遠端支援設備</text><text x="360" y="454" text-anchor="middle" fill="#e7ddff" font-size="22">會話・檔案・憑證・組態</text><rect x="230" y="480" width="260" height="36" rx="18" fill="#ff6b8a"/><text x="360" y="505" text-anchor="middle" fill="#190714" font-size="19" font-weight="800">遭入侵時視為不可信</text><path d="M360 540 V600" stroke="#b69cff" stroke-width="6" marker-end="url(#a)"/><rect x="70" y="600" width="270" height="145" rx="24" fill="#123c45" stroke="#57f0c1" stroke-width="3"/><text x="205" y="657" text-anchor="middle" fill="#57f0c1" font-size="25" font-weight="700">臨床服務區</text><text x="205" y="698" text-anchor="middle" fill="#dcfff5" font-size="20">設備・工作站</text><rect x="380" y="600" width="270" height="145" rx="24" fill="#40263b" stroke="#ff8fb3" stroke-width="3"/><text x="515" y="657" text-anchor="middle" fill="#ffb5cc" font-size="25" font-weight="700">管理身分區</text><text x="515" y="698" text-anchor="middle" fill="#ffe3ed" font-size="20">帳號・金鑰</text><rect x="60" y="830" width="600" height="210" rx="28" fill="#0d203a" stroke="#7ba7ff" stroke-width="3"/><text x="100" y="885" fill="#8fb7ff" font-size="26" font-weight="800">獨立證據面</text><text x="100" y="930" fill="#d7e5ff" font-size="21">日誌、會話、身分、流量與端點告警</text><text x="100" y="970" fill="#d7e5ff" font-size="21">近即時送出，不與設備共存。</text><text x="100" y="1010" fill="#9fb7db" font-size="19">設備內紀錄遭刪除時，仍可重建時間線。</text></svg>