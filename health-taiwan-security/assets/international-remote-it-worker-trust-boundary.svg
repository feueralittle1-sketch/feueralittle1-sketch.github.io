<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療遠端技術人員招募與存取信任邊界</title><desc id="desc">候選人先經身分與雇用驗證，再於隔離面試沙箱完成測試；正式人員僅能透過受管裝置與權限閘道進入指定開發環境，臨床系統保持分離。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e7ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="58" y="68" fill="#fff" font-size="34" font-weight="700">把招募、測試、開發與臨床環境切成不同信任區</text><text x="58" y="108" fill="#a9bfdf" font-size="20">身分文件、視訊面談或履歷一致，不等於可直接取得程式碼與正式系統權限</text>
<rect x="55" y="175" width="230" height="170" rx="24" fill="#122b50" stroke="#8fa8ff" stroke-width="3"/><text x="170" y="225" text-anchor="middle" fill="#c6d1ff" font-size="25" font-weight="700">候選與雇用驗證</text><text x="170" y="270" text-anchor="middle" fill="#e5eefb" font-size="19">身分、地點、履歷、付款</text><text x="170" y="307" text-anchor="middle" fill="#a9bfdf" font-size="17">異常訊號需獨立複核</text>
<rect x="345" y="145" width="245" height="230" rx="26" fill="#18395b" stroke="#ffbd69" stroke-width="4"/><text x="468" y="200" text-anchor="middle" fill="#ffcf8c" font-size="25" font-weight="700">隔離面試沙箱</text><text x="468" y="245" text-anchor="middle" fill="#fff" font-size="19">合成資料／短效憑證</text><text x="468" y="282" text-anchor="middle" fill="#e5eefb" font-size="18">禁止真實秘密與正式程式庫</text><text x="468" y="329" text-anchor="middle" fill="#ff9fc1" font-size="17">惡意套件只能停在沙箱</text>
<rect x="650" y="145" width="245" height="230" rx="26" fill="#18395b" stroke="#69e7ff" stroke-width="4"/><text x="773" y="200" text-anchor="middle" fill="#69e7ff" font-size="25" font-weight="700">受管開發工作區</text><text x="773" y="245" text-anchor="middle" fill="#fff" font-size="19">受管裝置／強驗證</text><text x="773" y="282" text-anchor="middle" fill="#e5eefb" font-size="18">角色權限／分支保護</text><text x="773" y="329" text-anchor="middle" fill="#7ff3cf" font-size="17">會話與程式碼活動留證</text>
<rect x="955" y="175" width="190" height="170" rx="24" fill="#122b50" stroke="#5aefbe" stroke-width="3"/><text x="1050" y="225" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">臨床服務區</text><text x="1050" y="270" text-anchor="middle" fill="#e5eefb" font-size="18">正式資料與系統</text><text x="1050" y="307" text-anchor="middle" fill="#a9bfdf" font-size="17">另行核准與驗收</text>
<path d="M285 260H335" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M590 260H640" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/><path d="M895 260H945" stroke="#69e7ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="90" y="475" width="300" height="145" rx="23" fill="#0c203b" stroke="#ff7da9" stroke-width="3"/><text x="240" y="520" text-anchor="middle" fill="#ff9fc1" font-size="23" font-weight="700">招募防偽訊號</text><text x="240" y="562" text-anchor="middle" fill="#dce8f8" font-size="18">代理面談、地點矛盾、付款異常</text><text x="240" y="596" text-anchor="middle" fill="#a9bfdf" font-size="17">不得只靠單一文件判定</text>
<rect x="450" y="475" width="300" height="145" rx="23" fill="#0c203b" stroke="#ffbd69" stroke-width="3"/><text x="600" y="520" text-anchor="middle" fill="#ffcf8c" font-size="23" font-weight="700">技術測試邊界</text><text x="600" y="562" text-anchor="middle" fill="#dce8f8" font-size="18">無秘密、無病歷、無正式連線</text><text x="600" y="596" text-anchor="middle" fill="#a9bfdf" font-size="17">映像可重建、網路可封鎖</text>
<rect x="810" y="475" width="300" height="145" rx="23" fill="#0c203b" stroke="#5aefbe" stroke-width="3"/><text x="960" y="520" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">持續再驗證</text><text x="960" y="562" text-anchor="middle" fill="#dce8f8" font-size="18">裝置、地點、權限與行為</text><text x="960" y="596" text-anchor="middle" fill="#a9bfdf" font-size="17">離職與異常時立即撤銷</text>
</g></svg>