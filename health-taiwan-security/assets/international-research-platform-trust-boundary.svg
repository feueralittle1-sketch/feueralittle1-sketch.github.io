<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">臨床研究平台信任邊界</title><desc id="desc">公開問卷、應用服務、研究資料庫、身分管理及獨立證據面形成分層保護。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="62" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="800" fill="#fff">公開入口不應直接等於研究資料庫信任</text><g font-family="Inter,Noto Sans TC,sans-serif"><rect x="65" y="150" width="220" height="430" rx="28" fill="#102742" stroke="#fb7185" stroke-width="3"/><text x="175" y="210" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">公開問卷</text><text x="105" y="275" font-size="21" fill="#c6d4eb">外部填答</text><text x="105" y="320" font-size="21" fill="#c6d4eb">問卷雜湊</text><text x="105" y="365" font-size="21" fill="#c6d4eb">檔案／匯入</text><text x="105" y="410" font-size="21" fill="#c6d4eb">速率與來源</text><rect x="340" y="115" width="240" height="500" rx="28" fill="#102742" stroke="#67e8f9" stroke-width="3"/><text x="460" y="175" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">應用服務</text><text x="380" y="240" font-size="21" fill="#c6d4eb">路由控制</text><text x="380" y="285" font-size="21" fill="#c6d4eb">版本與外掛</text><text x="380" y="330" font-size="21" fill="#c6d4eb">輸入驗證</text><text x="380" y="375" font-size="21" fill="#c6d4eb">服務帳號</text><text x="380" y="420" font-size="21" fill="#c6d4eb">應用日誌</text><rect x="635" y="150" width="230" height="430" rx="28" fill="#102742" stroke="#5eead4" stroke-width="3"/><text x="750" y="210" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">研究資料</text><text x="675" y="275" font-size="21" fill="#c6d4eb">資料庫</text><text x="675" y="320" font-size="21" fill="#c6d4eb">檔案儲存</text><text x="675" y="365" font-size="21" fill="#c6d4eb">稽核軌跡</text><text x="675" y="410" font-size="21" fill="#c6d4eb">備份版本</text><rect x="920" y="115" width="215" height="500" rx="28" fill="#102742" stroke="#b8a7ff" stroke-width="3"/><text x="1028" y="175" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">獨立控制面</text><text x="955" y="240" font-size="20" fill="#c6d4eb">身分／SSO</text><text x="955" y="285" font-size="20" fill="#c6d4eb">秘密管理</text><text x="955" y="330" font-size="20" fill="#c6d4eb">集中日誌</text><text x="955" y="375" font-size="20" fill="#c6d4eb">備份隔離</text><text x="955" y="420" font-size="20" fill="#c6d4eb">事件時間線</text><g stroke="#63e6ff" stroke-width="5"><path d="M285 365H330"/><path d="M580 365H625"/><path d="M865 365H910"/></g><rect x="210" y="650" width="780" height="62" rx="20" fill="#142b3d" stroke="#fbbf24"/><text x="600" y="690" text-anchor="middle" font-size="23" fill="#fde68a">任一層失陷後，都要獨立確認資料、身分、日誌與備份是否仍可信</text></g></svg>