<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">安全處理環境的輸出風險與控制對照</title>
  <desc id="desc">四類輸出風險包含直接識別、小樣本推論、模型記憶與未核准內容，分別對應遮罩與阻擋、門檻與合併、隱私測試、格式白名單與雙人覆核。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071421"/><stop offset="1" stop-color="#151b3a"/></linearGradient></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" fill="#f4f8ff" font-size="34" font-weight="800">輸出閘門：四類風險不能只靠人工看一眼</text><text x="70" y="110" fill="#9fb3d9" font-size="20">先自動檢測，再由獨立角色覆核高風險輸出</text>
  <text x="90" y="170" fill="#ff9aae" font-size="22" font-weight="700">風險</text><text x="475" y="170" fill="#8fe8ff" font-size="22" font-weight="700">控制</text><text x="950" y="170" fill="#57f0c1" font-size="22" font-weight="700">放行證據</text>
  <g font-family="Inter,Noto Sans TC,sans-serif">
    <g transform="translate(70 195)"><rect width="1060" height="100" rx="22" fill="#122a45" stroke="#334f70"/><rect width="320" height="100" rx="22" fill="#3a2034"/><text x="28" y="43" fill="#fff" font-size="21" font-weight="700">直接識別資料</text><text x="28" y="72" fill="#ffbecb" font-size="16">姓名、證號、自由文字殘留</text><text x="390" y="43" fill="#fff" font-size="19" font-weight="700">欄位白名單＋模式比對＋遮罩</text><text x="390" y="72" fill="#c6d4eb" font-size="16">命中時自動阻擋，不以提醒取代控制</text><text x="850" y="57" fill="#86f3ce" font-size="18">掃描報告與零命中紀錄</text></g>
    <g transform="translate(70 315)"><rect width="1060" height="100" rx="22" fill="#122a45" stroke="#334f70"/><rect width="320" height="100" rx="22" fill="#3a2034"/><text x="28" y="43" fill="#fff" font-size="21" font-weight="700">小樣本與交叉推論</text><text x="28" y="72" fill="#ffbecb" font-size="16">稀有疾病、地區、日期組合</text><text x="390" y="43" fill="#fff" font-size="19" font-weight="700">最小群體門檻＋區間化＋合併</text><text x="390" y="72" fill="#c6d4eb" font-size="16">把多次查詢與外部資料一起評估</text><text x="850" y="57" fill="#86f3ce" font-size="18">門檻計算與覆核簽核</text></g>
    <g transform="translate(70 435)"><rect width="1060" height="100" rx="22" fill="#122a45" stroke="#334f70"/><rect width="320" height="100" rx="22" fill="#3a2034"/><text x="28" y="43" fill="#fff" font-size="21" font-weight="700">模型記憶與反推</text><text x="28" y="72" fill="#ffbecb" font-size="16">訓練樣本重建、成員推論</text><text x="390" y="43" fill="#fff" font-size="19" font-weight="700">隱私攻擊測試＋用途限制</text><text x="390" y="72" fill="#c6d4eb" font-size="16">高風險模型留在環境內提供受控推論</text><text x="850" y="57" fill="#86f3ce" font-size="18">測試結果與模型卡</text></g>
    <g transform="translate(70 555)"><rect width="1060" height="100" rx="22" fill="#122a45" stroke="#334f70"/><rect width="320" height="100" rx="22" fill="#3a2034"/><text x="28" y="43" fill="#fff" font-size="21" font-weight="700">未核准內容或工具產物</text><text x="28" y="72" fill="#ffbecb" font-size="16">暫存檔、日誌、截圖、程式碼</text><text x="390" y="43" fill="#fff" font-size="19" font-weight="700">格式白名單＋雙人覆核＋雜湊</text><text x="390" y="72" fill="#c6d4eb" font-size="16">只允許申請時定義的交付類型</text><text x="850" y="57" fill="#86f3ce" font-size="18">輸出清單與交付雜湊</text></g>
  </g>
</svg>
