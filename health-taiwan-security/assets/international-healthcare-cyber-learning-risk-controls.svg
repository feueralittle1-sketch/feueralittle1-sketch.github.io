<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資安訓練風險與控制對照</title><desc id="desc">一體適用、懲罰式模擬、單一指標、臨床干擾與流程未改善等失敗模式，分別對應角色分流、無責改善、多維量測、停止條件與系統修正。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102244"/></linearGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">訓練失敗模式與控制證據</text><text x="60" y="108" fill="#a9bddf" font-size="20">有效方案同時改善人員、流程與技術，不把風險全部轉嫁給使用者</text><g><rect x="55" y="150" width="1090" height="82" rx="18" fill="#17263d" stroke="#405d7e"/><text x="78" y="184" fill="#ff9aa2" font-size="18" font-weight="800">一體適用</text><text x="240" y="184" fill="#fff" font-size="20" font-weight="700">角色分流與任務情境</text><text x="670" y="184" fill="#63e6ff" font-size="18" font-weight="700">證據：角色清冊、情境覆蓋率</text><text x="240" y="214" fill="#b9cce4" font-size="16">依資料、權限與臨床後果配置內容</text><rect x="55" y="244" width="1090" height="82" rx="18" fill="#17263d" stroke="#405d7e"/><text x="78" y="278" fill="#ff9aa2" font-size="18" font-weight="800">懲罰式模擬</text><text x="240" y="278" fill="#fff" font-size="20" font-weight="700">無責改善與個別補強</text><text x="670" y="278" fill="#63e6ff" font-size="18" font-weight="700">證據：通報意願、重複失敗率</text><text x="240" y="308" fill="#b9cce4" font-size="16">避免羞辱、公開排名與單次定罪</text><rect x="55" y="338" width="1090" height="82" rx="18" fill="#17263d" stroke="#405d7e"/><text x="78" y="372" fill="#ff9aa2" font-size="18" font-weight="800">只看點擊率</text><text x="240" y="372" fill="#fff" font-size="20" font-weight="700">多維行為量測</text><text x="670" y="372" fill="#63e6ff" font-size="18" font-weight="700">證據：回報、升級、處置時間</text><text x="240" y="402" fill="#b9cce4" font-size="16">同時觀察資料暴露與替代流程</text><rect x="55" y="432" width="1090" height="82" rx="18" fill="#17263d" stroke="#405d7e"/><text x="78" y="466" fill="#ff9aa2" font-size="18" font-weight="800">干擾臨床</text><text x="240" y="466" fill="#fff" font-size="20" font-weight="700">停止條件與安全窗口</text><text x="670" y="466" fill="#63e6ff" font-size="18" font-weight="700">證據：中止紀錄、零病安事件</text><text x="240" y="496" fill="#b9cce4" font-size="16">排除高風險時段並指定緊急聯絡</text><rect x="55" y="526" width="1090" height="82" rx="18" fill="#17263d" stroke="#405d7e"/><text x="78" y="560" fill="#ff9aa2" font-size="18" font-weight="800">流程未改善</text><text x="240" y="560" fill="#fff" font-size="20" font-weight="700">修正工具、介面與控制</text><text x="670" y="560" fill="#63e6ff" font-size="18" font-weight="700">證據：改善單、重驗與關閉</text><text x="240" y="590" fill="#b9cce4" font-size="16">降低人員必須靠記憶補救的負擔</text></g><rect x="55" y="630" width="1090" height="30" rx="10" fill="#123047"/><text x="315" y="652" fill="#8ff2d0" font-size="17" font-weight="700">治理原則：保護臨床、鼓勵早報、量測實際行為、修正系統缺口</text></g></svg>