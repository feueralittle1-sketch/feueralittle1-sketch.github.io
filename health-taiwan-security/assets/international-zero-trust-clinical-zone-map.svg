<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">醫療零信任分段與臨床信任區域圖</title><desc id="desc">以身分、裝置、服務與情境政策控制臨床、醫療設備、管理及供應商四個信任區域之間的連線。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061725"/><stop offset="1" stop-color="#14254b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="680" rx="36" fill="url(#bg)"/><g font-family="system-ui,Noto Sans TC"><text x="60" y="72" fill="#f8fafc" font-size="34" font-weight="700">分段不是把網路切碎，而是讓每條連線都有理由</text><text x="60" y="110" fill="#9fb3d9" font-size="19">信任區域縮小爆炸半徑；零信任政策逐次判斷主體、裝置、服務與情境</text>
<rect x="390" y="170" width="420" height="150" rx="28" fill="#0d3340" stroke="#63e6ff" stroke-width="3"/><text x="600" y="218" text-anchor="middle" fill="#a5f3fc" font-size="25" font-weight="700">政策執行點</text><text x="600" y="258" text-anchor="middle" fill="#e0f2fe" font-size="20">身分＋裝置健康＋服務＋風險情境</text><text x="600" y="293" text-anchor="middle" fill="#9fb3d9" font-size="18">允許、限縮、重新驗證或阻擋</text>
<g text-anchor="middle"><rect x="55" y="405" width="245" height="150" rx="24" fill="#102f38" stroke="#57f0c1"/><text x="178" y="455" fill="#a7f3d0" font-size="23" font-weight="700">臨床服務區</text><text x="178" y="492" fill="#d1fae5" font-size="18">HIS、EMR、PACS</text><text x="178" y="525" fill="#9fb3d9" font-size="17">依必要流程開放</text><rect x="335" y="405" width="245" height="150" rx="24" fill="#20254b" stroke="#a997ff"/><text x="458" y="455" fill="#ddd6fe" font-size="23" font-weight="700">醫療設備區</text><text x="458" y="492" fill="#ede9fe" font-size="18">NAC 識別與補償控制</text><text x="458" y="525" fill="#9fb3d9" font-size="17">限制東西向流量</text><rect x="620" y="405" width="245" height="150" rx="24" fill="#26331c" stroke="#facc15"/><text x="743" y="455" fill="#fef08a" font-size="23" font-weight="700">管理維運區</text><text x="743" y="492" fill="#fef9c3" font-size="18">PAM、JIT、跳板</text><text x="743" y="525" fill="#9fb3d9" font-size="17">特權與日常帳號分離</text><rect x="900" y="405" width="245" height="150" rx="24" fill="#3b1625" stroke="#fb7185"/><text x="1023" y="455" fill="#fecdd3" font-size="23" font-weight="700">供應商區</text><text x="1023" y="492" fill="#ffe4e6" font-size="18">具名、限時、可錄製</text><text x="1023" y="525" fill="#9fb3d9" font-size="17">不得直達全院網路</text></g>
<g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M500 320L225 395"/><path d="M565 320L485 394"/><path d="M635 320L715 394"/><path d="M700 320L975 395"/></g><text x="600" y="630" text-anchor="middle" fill="#9fb3d9" font-size="18">網路位置只是一項訊號；存取決策仍需最小權限與持續觀測</text></g></svg>
