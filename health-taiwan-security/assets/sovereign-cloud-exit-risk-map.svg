<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療主權雲失敗模式與控制證據</title>
  <desc id="desc">對照只看資料落地、金鑰仍被供應商控制、次處理者不透明與沒有退出演練四種風險，以及相應控制和驗收證據。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061526"/><stop offset="1" stop-color="#171536"/></linearGradient></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="65" y="70" fill="#f5fbff" font-size="36" font-weight="800">四個常見誤區：要用證據關閉，不靠契約口號</text><text x="65" y="110" fill="#9fb7d9" font-size="23">風險、控制與驗收證據必須一一對應</text>
  <g font-size="22" font-weight="800"><rect x="55" y="145" width="300" height="58" rx="18" fill="#532a3d"/><text x="205" y="182" text-anchor="middle" fill="#ffc7df">失敗模式</text><rect x="375" y="145" width="365" height="58" rx="18" fill="#123a4e"/><text x="558" y="182" text-anchor="middle" fill="#9deeff">治理控制</text><rect x="760" y="145" width="385" height="58" rx="18" fill="#283858"/><text x="953" y="182" text-anchor="middle" fill="#d9e8ff">驗收證據</text></g>
  <g font-size="20"><rect x="55" y="220" width="1090" height="96" rx="20" fill="#101f35" stroke="#30445f"/><text x="80" y="258" fill="#ffb5d3" font-weight="800">只看資料落地</text><text x="80" y="287" fill="#c9b5c1">忽略備份、遙測與支援流向</text><text x="400" y="258" fill="#8fe8ff" font-weight="800">建立端到端資料流圖</text><text x="400" y="287" fill="#ccebf2">逐項核准跨境與複寫路徑</text><text x="785" y="258" fill="#dcecff" font-weight="800">區域設定＋流向紀錄</text><text x="785" y="287" fill="#bccde3">備份、日誌與支援存取測試</text>
  <rect x="55" y="330" width="1090" height="96" rx="20" fill="#101f35" stroke="#30445f"/><text x="80" y="368" fill="#ffb5d3" font-weight="800">BYOK 只存在簡報</text><text x="80" y="397" fill="#c9b5c1">供應商仍能單方解密</text><text x="400" y="368" fill="#8fe8ff" font-weight="800">定義金鑰保管與撤銷邊界</text><text x="400" y="397" fill="#ccebf2">演練輪替、遺失與緊急存取</text><text x="785" y="368" fill="#dcecff" font-weight="800">金鑰事件與存取日誌</text><text x="785" y="397" fill="#bccde3">撤銷後的拒絕存取結果</text>
  <rect x="55" y="440" width="1090" height="96" rx="20" fill="#101f35" stroke="#30445f"/><text x="80" y="478" fill="#ffb5d3" font-weight="800">次處理者不可見</text><text x="80" y="507" fill="#c9b5c1">責任鏈與變更無法追蹤</text><text x="400" y="478" fill="#8fe8ff" font-weight="800">清冊、事前通知與反對機制</text><text x="400" y="507" fill="#ccebf2">要求事件協作與證據保存</text><text x="785" y="478" fill="#dcecff" font-weight="800">最新清冊與變更紀錄</text><text x="785" y="507" fill="#bccde3">事件演練的責任時間線</text>
  <rect x="55" y="550" width="1090" height="96" rx="20" fill="#101f35" stroke="#30445f"/><text x="80" y="588" fill="#ffb5d3" font-weight="800">退出計畫未曾測試</text><text x="80" y="617" fill="#c9b5c1">格式、費用與時程才暴露</text><text x="400" y="588" fill="#8fe8ff" font-weight="800">預先定義匯出、遷移與刪除</text><text x="400" y="617" fill="#ccebf2">保留替代路徑與責任窗口</text><text x="785" y="588" fill="#dcecff" font-weight="800">抽樣匯出與可讀性驗證</text><text x="785" y="617" fill="#bccde3">切換時間、成本與刪除證明</text></g>
  <text x="600" y="685" text-anchor="middle" fill="#9fb7d9" font-size="21">我認為最重要的主權指標是：醫院能否獨立查證、撤回控制，並在期限內安全離開。</text>
</svg>
