<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc"><title id="title">遠端支援設備事件處置流程手機版</title><desc id="desc">六階段處置：範圍確認、隔離保全、修補搜尋、輪替撤權、可信重建、受控恢復。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient></defs><rect width="720" height="1320" fill="url(#bg)"/><text x="42" y="62" fill="#fff" font-size="32" font-weight="800">六個不可跳過的處置閘門</text><text x="42" y="102" fill="#9fb7db" font-size="21">修補漏洞後，仍須重建設備與憑證信任。</text>
<g font-family="Inter,Noto Sans TC,sans-serif"><rect x="60" y="150" width="600" height="140" rx="24" fill="#153052" stroke="#63e6ff" stroke-width="3"/><text x="95" y="200" fill="#63e6ff" font-size="25" font-weight="800">01 範圍確認</text><text x="95" y="245" fill="#dceaff" font-size="21">部署型態・版本・曝險窗・維護目標</text><rect x="60" y="315" width="600" height="140" rx="24" fill="#263052" stroke="#8fb7ff" stroke-width="3"/><text x="95" y="365" fill="#8fb7ff" font-size="25" font-weight="800">02 隔離保全</text><text x="95" y="410" fill="#dceaff" font-size="21">限制入口・保存影像與外部日誌</text><rect x="60" y="480" width="600" height="140" rx="24" fill="#302954" stroke="#b69cff" stroke-width="3"/><text x="95" y="530" fill="#c8b7ff" font-size="25" font-weight="800">03 修補搜尋</text><text x="95" y="575" fill="#eee8ff" font-size="21">修補・異常檔案・持久化・端點獵捕</text><rect x="60" y="645" width="600" height="140" rx="24" fill="#40263b" stroke="#ff8fb3" stroke-width="3"/><text x="95" y="695" fill="#ffb5cc" font-size="25" font-weight="800">04 輪替撤權</text><text x="95" y="740" fill="#ffe7ef" font-size="21">儲存憑證・特權帳號・工作階段・金鑰</text><rect x="60" y="810" width="600" height="140" rx="24" fill="#133c43" stroke="#57f0c1" stroke-width="3"/><text x="95" y="860" fill="#57f0c1" font-size="25" font-weight="800">05 可信重建</text><text x="95" y="905" fill="#ddfff6" font-size="21">乾淨映像・最小路由・基線・離機日誌</text><rect x="60" y="975" width="600" height="140" rx="24" fill="#193642" stroke="#63e6ff" stroke-width="3"/><text x="95" y="1025" fill="#63e6ff" font-size="25" font-weight="800">06 受控恢復</text><text x="95" y="1070" fill="#dceaff" font-size="21">逐批放行・臨床驗證・監看・可回退</text></g><rect x="60" y="1160" width="600" height="110" rx="24" fill="#0d203a" stroke="#7ba7ff" stroke-width="3"/><text x="90" y="1205" fill="#8fb7ff" font-size="22" font-weight="800">放行條件</text><text x="90" y="1245" fill="#d7e5ff" font-size="19">漏洞、持久化、憑證、日誌與臨床驗證均完成。</text></svg>