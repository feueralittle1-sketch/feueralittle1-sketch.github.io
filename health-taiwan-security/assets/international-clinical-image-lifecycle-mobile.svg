<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">手機版臨床影像生命週期與驗收流程</title><desc id="desc">臨床影像依序經過核准、拍攝、上傳、用途分流、存取監測與到期刪除，並保留最低驗收證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient></defs><rect width="720" height="1280" rx="28" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="44" y="68" fill="#fff" font-size="34" font-weight="800">臨床影像生命週期</text><text x="44" y="110" fill="#63e6ff" font-size="34" font-weight="800">六個可驗收節點</text><text x="44" y="150" fill="#9fb3d9" font-size="20">從用途核准一路管到到期刪除</text><g fill="#112945" stroke="#63e6ff" stroke-width="2"><rect x="52" y="205" width="292" height="205" rx="22"/><rect x="376" y="205" width="292" height="205" rx="22"/><rect x="52" y="445" width="292" height="205" rx="22"/><rect x="376" y="445" width="292" height="205" rx="22"/><rect x="52" y="685" width="292" height="205" rx="22"/><rect x="376" y="685" width="292" height="205" rx="22"/></g><g text-anchor="middle"><text x="198" y="257" fill="#fff" font-size="26" font-weight="800">1 核准</text><text x="198" y="307" fill="#c6d4eb" font-size="21">用途、對象、必要範圍</text><text x="198" y="351" fill="#57f0c1" font-size="20">留下核准紀錄</text><text x="522" y="257" fill="#fff" font-size="26" font-weight="800">2 拍攝</text><text x="522" y="307" fill="#c6d4eb" font-size="21">受管裝置、病人核對</text><text x="522" y="351" fill="#57f0c1" font-size="20">記錄操作者與時間</text><text x="198" y="497" fill="#fff" font-size="26" font-weight="800">3 上傳</text><text x="198" y="547" fill="#c6d4eb" font-size="21">加密傳輸、完整性核對</text><text x="198" y="591" fill="#57f0c1" font-size="20">確認正式入庫</text><text x="522" y="497" fill="#fff" font-size="26" font-weight="800">4 分流</text><text x="522" y="547" fill="#c6d4eb" font-size="21">診療、教學、研究分開</text><text x="522" y="591" fill="#57f0c1" font-size="20">禁止用途漂移</text><text x="198" y="737" fill="#fff" font-size="26" font-weight="800">5 監測</text><text x="198" y="787" fill="#c6d4eb" font-size="21">查閱、匯出、異常告警</text><text x="198" y="831" fill="#57f0c1" font-size="20">可回查每次存取</text><text x="522" y="737" fill="#fff" font-size="26" font-weight="800">6 刪除</text><text x="522" y="787" fill="#c6d4eb" font-size="21">到期處置、副本驗證</text><text x="522" y="831" fill="#57f0c1" font-size="20">確認沒有殘留</text></g><rect x="52" y="950" width="616" height="250" rx="24" fill="#102f3d" stroke="#57f0c1" stroke-width="2"/><text x="82" y="1002" fill="#57f0c1" font-size="25" font-weight="800">最低驗收證據</text><text x="82" y="1053" fill="#d5f7ec" font-size="20">• 核准、裝置、操作者與時間</text><text x="82" y="1093" fill="#d5f7ec" font-size="20">• 病人／案件對應與上傳成功</text><text x="82" y="1133" fill="#d5f7ec" font-size="20">• 查閱、匯出與例外期限</text><text x="82" y="1173" fill="#d5f7ec" font-size="20">• 到期刪除與殘留副本檢查</text></g></svg>