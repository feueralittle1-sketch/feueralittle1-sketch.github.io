<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療持續監控告警處置流程</title>
  <desc id="desc">告警由蒐集、正規化、關聯、分級、處置、驗證到復盤的七階段流程，並以臨床影響作為升級條件。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071625"/><stop offset="1" stop-color="#1a1535"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9c8cff"/></marker></defs>
  <rect width="1200" height="720" rx="38" fill="url(#bg)"/>
  <text x="60" y="70" fill="#f5fbff" font-size="36" font-weight="800">從告警到改善：七個有輸出的控制閘門</text>
  <text x="60" y="110" fill="#a9bddb" font-size="22">每一步都留下責任人、時間戳、決策與證據，避免告警停在儀表板</text>
  <g text-anchor="middle" font-weight="700"><rect x="55" y="180" width="240" height="115" rx="24" fill="#102f46" stroke="#63e6ff" stroke-width="3"/><text x="175" y="225" fill="#8fe8ff" font-size="25">1 蒐集</text><text x="175" y="262" fill="#d9f4ff" font-size="19">資產與日誌涵蓋率</text><rect x="345" y="180" width="240" height="115" rx="24" fill="#102f46" stroke="#63e6ff" stroke-width="3"/><text x="465" y="225" fill="#8fe8ff" font-size="25">2 正規化</text><text x="465" y="262" fill="#d9f4ff" font-size="19">欄位、時間與完整性</text><rect x="635" y="180" width="240" height="115" rx="24" fill="#28234b" stroke="#9c8cff" stroke-width="3"/><text x="755" y="225" fill="#ddd6ff" font-size="25">3 關聯</text><text x="755" y="262" fill="#eeeaff" font-size="19">身分、端點與網路情境</text><rect x="925" y="180" width="220" height="115" rx="24" fill="#3d283e" stroke="#ff9bc8" stroke-width="3"/><text x="1035" y="225" fill="#ffc7e1" font-size="25">4 分級</text><text x="1035" y="262" fill="#f5ddea" font-size="19">臨床影響與可信度</text>
  <rect x="925" y="425" width="220" height="115" rx="24" fill="#44322b" stroke="#ffbf69" stroke-width="3"/><text x="1035" y="470" fill="#ffd59d" font-size="25">5 處置</text><text x="1035" y="507" fill="#f1ddc5" font-size="19">隔離、撤權與協調</text><rect x="635" y="425" width="240" height="115" rx="24" fill="#143a35" stroke="#57f0c1" stroke-width="3"/><text x="755" y="470" fill="#9ff8dc" font-size="25">6 驗證</text><text x="755" y="507" fill="#d7efe9" font-size="19">威脅清除與服務正常</text><rect x="345" y="425" width="240" height="115" rx="24" fill="#143a35" stroke="#57f0c1" stroke-width="3"/><text x="465" y="470" fill="#9ff8dc" font-size="25">7 復盤</text><text x="465" y="507" fill="#d7efe9" font-size="19">規則、劇本與控制改善</text></g>
  <g stroke="#9c8cff" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M295 237H335"/><path d="M585 237H625"/><path d="M875 237H915"/><path d="M1035 295V415"/><path d="M925 482H885"/><path d="M635 482H595"/><path d="M465 425V345H175V305"/></g>
  <rect x="55" y="600" width="1090" height="70" rx="20" fill="#0d263b" stroke="#416989" stroke-width="2"/><text x="600" y="632" text-anchor="middle" fill="#dcecff" font-size="21">升級門檻：高影響臨床系統、特權帳號、備份控制面或橫向移動跡象</text><text x="600" y="659" text-anchor="middle" fill="#9fb7d9" font-size="18">自動隔離須先驗證病人安全、設備限制與人工覆核條件</text>
</svg>
