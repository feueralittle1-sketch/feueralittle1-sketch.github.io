<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" aria-labelledby="title desc"><title id="title">醫療第三方 AI 供應鏈信任邊界手機版</title><desc id="desc">外部模型、資料與服務通過醫院治理閘門後連接院內使用，變更與事件另送獨立證據面。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10254a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="720" height="1040" rx="30" fill="url(#bg)"/><text x="48" y="70" fill="#fff" font-size="31" font-weight="800">第三方 AI 供應鏈邊界</text><text x="48" y="108" fill="#9fb3d9" font-size="18">完整依賴通過治理閘門才進入臨床</text><rect x="48" y="150" width="624" height="220" rx="26" fill="#0d203a" stroke="#536d95" stroke-width="2"/><text x="78" y="198" fill="#a997ff" font-size="25" font-weight="700">外部依賴</text><g fill="#e6eefc" font-size="19"><text x="80" y="246">模型／API　・　訓練與推論資料</text><text x="80" y="292">外掛／代理　・　開源元件</text><text x="80" y="338">雲端服務　・　次處理者</text></g><path d="M360 370V420" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="430" width="624" height="270" rx="26" fill="#102c3b" stroke="#63e6ff" stroke-width="3"/><text x="360" y="480" fill="#63e6ff" font-size="26" font-weight="800" text-anchor="middle">醫院治理閘門</text><g fill="#fff" font-size="20" text-anchor="middle"><text x="360" y="532">用途分級・依賴清冊・資料流</text><text x="360" y="578">變更通知・再驗證・人工覆核</text><text x="360" y="624">事件協調・安全停用・退場責任</text><text x="360" y="670">證據不完整則不放行</text></g><path d="M360 700V750" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="760" width="298" height="170" rx="24" fill="#10263d" stroke="#57f0c1" stroke-width="2"/><text x="197" y="810" fill="#57f0c1" font-size="23" font-weight="700" text-anchor="middle">院內使用</text><text x="197" y="855" fill="#e6eefc" font-size="18" text-anchor="middle">臨床／行政／設備</text><text x="197" y="890" fill="#e6eefc" font-size="18" text-anchor="middle">受控連接</text><rect x="374" y="760" width="298" height="170" rx="24" fill="#261e43" stroke="#a997ff" stroke-width="2"/><text x="523" y="810" fill="#c7bcff" font-size="23" font-weight="700" text-anchor="middle">獨立證據面</text><text x="523" y="855" fill="#e6eefc" font-size="18" text-anchor="middle">版本／事件／變更</text><text x="523" y="890" fill="#e6eefc" font-size="18" text-anchor="middle">停用與退場紀錄</text><text x="360" y="990" fill="#9fb3d9" font-size="17" text-anchor="middle">品牌不是邊界；可追溯依賴才是治理起點</text></svg>