<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">郵件閘道風險與控制地圖</title><desc id="desc">將惡意郵件解析、管理面暴露、日誌同機保存與單一路徑風險，對應更新重建、管理隔離、外部證據及備援收信控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#172044"/></linearGradient></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-size="34" font-weight="700">四個失敗模式，四組驗收證據</text><text x="60" y="108" fill="#9fb3d9" font-size="20">控制要能被測試，而不是只存在於架構圖或採購規格</text><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="250" y="165" text-anchor="middle" fill="#ffb3bd" font-size="25" font-weight="700">失敗模式</text><text x="600" y="165" text-anchor="middle" fill="#b7c9e7" font-size="25" font-weight="700">控制</text><text x="980" y="165" text-anchor="middle" fill="#9bf5d8" font-size="25" font-weight="700">驗收證據</text><g font-size="20"><rect x="55" y="195" width="310" height="100" rx="20" fill="#492534" stroke="#ff7f96" stroke-width="3"/><text x="210" y="236" text-anchor="middle" fill="#fff" font-weight="700">惡意郵件觸發解析漏洞</text><text x="210" y="270" text-anchor="middle" fill="#ffc7d0">閘道取得高權限</text><rect x="445" y="195" width="310" height="100" rx="20" fill="#243555" stroke="#a997ff" stroke-width="3"/><text x="600" y="236" text-anchor="middle" fill="#fff" font-weight="700">固定版本／乾淨重建</text><text x="600" y="270" text-anchor="middle" fill="#d9d1ff">更新後重設秘密</text><rect x="835" y="195" width="310" height="100" rx="20" fill="#173c36" stroke="#57f0c1" stroke-width="3"/><text x="990" y="236" text-anchor="middle" fill="#fff" font-weight="700">版本、映像與測試紀錄</text><text x="990" y="270" text-anchor="middle" fill="#c2f5e7">異常已完成調查</text>
<rect x="55" y="325" width="310" height="100" rx="20" fill="#492534" stroke="#ff7f96" stroke-width="3"/><text x="210" y="366" text-anchor="middle" fill="#fff" font-weight="700">管理與郵件流共用介面</text><text x="210" y="400" text-anchor="middle" fill="#ffc7d0">外部可觸及控制面</text><rect x="445" y="325" width="310" height="100" rx="20" fill="#243555" stroke="#a997ff" stroke-width="3"/><text x="600" y="366" text-anchor="middle" fill="#fff" font-weight="700">介面分離／來源限制</text><text x="600" y="400" text-anchor="middle" fill="#d9d1ff">具名管理與強驗證</text><rect x="835" y="325" width="310" height="100" rx="20" fill="#173c36" stroke="#57f0c1" stroke-width="3"/><text x="990" y="366" text-anchor="middle" fill="#fff" font-weight="700">外部曝險與規則測試</text><text x="990" y="400" text-anchor="middle" fill="#c2f5e7">未核准來源被拒絕</text>
<rect x="55" y="455" width="310" height="100" rx="20" fill="#492534" stroke="#ff7f96" stroke-width="3"/><text x="210" y="496" text-anchor="middle" fill="#fff" font-weight="700">事件日誌只留在閘道</text><text x="210" y="530" text-anchor="middle" fill="#ffc7d0">入侵後可被刪改</text><rect x="445" y="455" width="310" height="100" rx="20" fill="#243555" stroke="#a997ff" stroke-width="3"/><text x="600" y="496" text-anchor="middle" fill="#fff" font-weight="700">即時外送／時間同步</text><text x="600" y="530" text-anchor="middle" fill="#d9d1ff">獨立權限與保留政策</text><rect x="835" y="455" width="310" height="100" rx="20" fill="#173c36" stroke="#57f0c1" stroke-width="3"/><text x="990" y="496" text-anchor="middle" fill="#fff" font-weight="700">缺口、完整性與查詢測試</text><text x="990" y="530" text-anchor="middle" fill="#c2f5e7">可重建事件時間線</text>
<rect x="55" y="585" width="310" height="100" rx="20" fill="#492534" stroke="#ff7f96" stroke-width="3"/><text x="210" y="626" text-anchor="middle" fill="#fff" font-weight="700">隔離即停止所有收信</text><text x="210" y="660" text-anchor="middle" fill="#ffc7d0">重要訊息延遲或遺失</text><rect x="445" y="585" width="310" height="100" rx="20" fill="#243555" stroke="#a997ff" stroke-width="3"/><text x="600" y="626" text-anchor="middle" fill="#fff" font-weight="700">排隊／備援／降級流程</text><text x="600" y="660" text-anchor="middle" fill="#d9d1ff">明定優先通訊</text><rect x="835" y="585" width="310" height="100" rx="20" fill="#173c36" stroke="#57f0c1" stroke-width="3"/><text x="990" y="626" text-anchor="middle" fill="#fff" font-weight="700">切換、回送與對帳演練</text><text x="990" y="660" text-anchor="middle" fill="#c2f5e7">無靜默遺失郵件</text></g><g stroke="#91a6c9" stroke-width="4"><path d="M365 245h80M755 245h80M365 375h80M755 375h80M365 505h80M755 505h80M365 635h80M755 635h80"/></g></g></svg>
