<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安量測治理閉環</title><desc id="desc">六步量測流程從決策問題到重測校正。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs><rect width="390" height="1120" rx="28" fill="url(#bg)"/><text x="195" y="46" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">六步量測治理閉環</text><g font-family="Inter,Noto Sans TC,sans-serif" text-anchor="middle"><g fill="#102742" stroke-width="2"><rect x="35" y="80" width="320" height="130" rx="20" stroke="#7aa7ff"/><rect x="35" y="248" width="320" height="130" rx="20" stroke="#67e8f9"/><rect x="35" y="416" width="320" height="130" rx="20" stroke="#5eead4"/><rect x="35" y="584" width="320" height="130" rx="20" stroke="#b8a7ff"/><rect x="35" y="752" width="320" height="130" rx="20" stroke="#fbbf24"/><rect x="35" y="920" width="320" height="130" rx="20" stroke="#fb7185"/></g><g fill="#f4f8ff" font-size="23" font-weight="800"><text x="195" y="124">1 決策問題</text><text x="195" y="292">2 指標定義</text><text x="195" y="460">3 資料驗證</text><text x="195" y="628">4 分層分析</text><text x="195" y="796">5 控制行動</text><text x="195" y="964">6 重測校正</text></g><g fill="#b8c8df" font-size="18"><text x="195" y="166">加速、限制、接受或汰換</text><text x="195" y="334">分母、計時點、來源、門檻</text><text x="195" y="502">版本、工單、遙測、臨床紀錄</text><text x="195" y="670">設備家族、院區、關鍵性、長尾</text><text x="195" y="838">控制、期限、升級、替代流程</text><text x="195" y="1006">驗證效果，調整定義與門檻</text></g></g><g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"><path d="M195 210V238"/><path d="M195 378V406"/><path d="M195 546V574"/><path d="M195 714V742"/><path d="M195 882V910"/></g></svg>