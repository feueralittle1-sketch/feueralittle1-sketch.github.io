<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療行動裝置修補與事件分流流程</title><desc id="desc">流程從盤點受影響裝置開始，分流為已更新、可更新但延遲、疑似遭利用與無法更新，再完成限制、證據保全、驗證及恢復。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14234a"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#70e8ff"/></marker></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="68" fill="#fff" font-size="34" font-weight="700">從公告到復原：逐台分流，不只寄更新通知</text><text x="60" y="106" fill="#a9bfdf" font-size="20">修補狀態、業務用途與可疑跡象共同決定處置</text>
<rect x="60" y="155" width="250" height="105" rx="22" fill="#153658" stroke="#70e8ff" stroke-width="3"/><text x="185" y="198" text-anchor="middle" fill="#70e8ff" font-size="23" font-weight="700">1 盤點與比對</text><text x="185" y="232" text-anchor="middle" fill="#dce8f8" font-size="18">型號／補丁層級／擁有人</text><path d="M310 208H385" stroke="#70e8ff" stroke-width="5" marker-end="url(#a)"/>
<polygon points="505,140 625,208 505,276 385,208" fill="#222c59" stroke="#b8a9ff" stroke-width="3"/><text x="505" y="198" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">狀態與跡象</text><text x="505" y="229" text-anchor="middle" fill="#dce8f8" font-size="17">可更新？疑似利用？</text>
<path d="M625 208H710" stroke="#70e8ff" stroke-width="5" marker-end="url(#a)"/><rect x="710" y="155" width="250" height="105" rx="22" fill="#153658" stroke="#59efbe" stroke-width="3"/><text x="835" y="198" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">2 更新與驗證</text><text x="835" y="232" text-anchor="middle" fill="#dce8f8" font-size="18">補丁層級＋核心功能測試</text><path d="M960 208H1030" stroke="#70e8ff" stroke-width="5" marker-end="url(#a)"/><rect x="1030" y="155" width="120" height="105" rx="22" fill="#123c3a" stroke="#59efbe" stroke-width="3"/><text x="1090" y="198" text-anchor="middle" fill="#7ff3cf" font-size="21" font-weight="700">合規</text><text x="1090" y="231" text-anchor="middle" fill="#dce8f8" font-size="17">恢復存取</text>
<path d="M505 276V350" stroke="#ffbd69" stroke-width="5" marker-end="url(#a)"/><rect x="350" y="350" width="310" height="110" rx="22" fill="#3a2935" stroke="#ffbd69" stroke-width="3"/><text x="505" y="393" text-anchor="middle" fill="#ffcf8b" font-size="23" font-weight="700">3 延遲／無法更新</text><text x="505" y="428" text-anchor="middle" fill="#dce8f8" font-size="18">限制敏感服務、縮小權限</text><path d="M660 405H735" stroke="#ffbd69" stroke-width="5" marker-end="url(#a)"/><rect x="735" y="350" width="365" height="110" rx="22" fill="#3a2935" stroke="#ff7aa8" stroke-width="3"/><text x="917" y="393" text-anchor="middle" fill="#ff9fc0" font-size="23" font-weight="700">4 疑似遭利用</text><text x="917" y="428" text-anchor="middle" fill="#dce8f8" font-size="18">隔離、保全證據、撤銷權杖</text>
<rect x="110" y="540" width="980" height="100" rx="24" fill="#0d203c" stroke="#8fa8ff" stroke-width="2"/><text x="600" y="580" text-anchor="middle" fill="#c5d1ff" font-size="22" font-weight="700">共同驗收證據</text><text x="600" y="616" text-anchor="middle" fill="#dce8f8" font-size="19">裝置清冊覆蓋率｜補丁層級｜未合規裝置處置｜核心 App 測試｜舊權杖失效｜事件紀錄</text></g></svg>