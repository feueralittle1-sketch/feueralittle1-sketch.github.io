<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院冷鏈設備的風險與控制對照</title><desc id="desc">將直接對外、預設帳密、平面網路、單一感測與倉促復原五種風險，對應曝險收斂、獨立身分、網路分區、獨立溫度證據與雙重放行。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-size="34" font-weight="800">五種冷鏈失敗模式，五道可驗收控制</text><text x="60" y="106" fill="#a8bddc" font-size="20">技術恢復與庫存放行必須分開驗收</text><g font-family="Arial,Noto Sans TC,sans-serif"><text x="90" y="166" fill="#ffb7cb" font-size="25" font-weight="800">失敗模式</text><text x="455" y="166" fill="#b9cdf0" font-size="25" font-weight="800">風險</text><text x="810" y="166" fill="#bff5df" font-size="25" font-weight="800">控制與驗收證據</text><g font-size="20"><g><rect x="55" y="190" width="1090" height="82" rx="18" fill="#17263d"/><text x="90" y="240" fill="#fff">設備直接暴露網際網路</text><text x="455" y="240" fill="#d6e0ef">未授權控制與服務中斷</text><text x="810" y="225" fill="#c9f8e8">移除外曝、入口盤點</text><text x="810" y="252" fill="#c9f8e8">外部掃描證明不可達</text></g><g><rect x="55" y="284" width="1090" height="82" rx="18" fill="#132b43"/><text x="90" y="334" fill="#fff">預設或共用供應商帳密</text><text x="455" y="334" fill="#d6e0ef">身分無法歸責、憑證擴散</text><text x="810" y="319" fill="#c9f8e8">獨立帳號、強驗證</text><text x="810" y="346" fill="#c9f8e8">限時授權與會話紀錄</text></g><g><rect x="55" y="378" width="1090" height="82" rx="18" fill="#17263d"/><text x="90" y="428" fill="#fff">冷鏈與辦公網路平面互通</text><text x="455" y="428" fill="#d6e0ef">橫向移動與廣泛停機</text><text x="810" y="413" fill="#c9f8e8">網路分區、最小流量</text><text x="810" y="440" fill="#c9f8e8">中斷測試與降級演練</text></g><g><rect x="55" y="472" width="1090" height="82" rx="18" fill="#132b43"/><text x="90" y="522" fill="#fff">控制器也是唯一溫度來源</text><text x="455" y="522" fill="#d6e0ef">事件後無法證明物品狀態</text><text x="810" y="507" fill="#c9f8e8">獨立校正紀錄器</text><text x="810" y="534" fill="#c9f8e8">時間、匯出與缺口驗證</text></g><g><rect x="55" y="566" width="1090" height="82" rx="18" fill="#17263d"/><text x="90" y="616" fill="#fff">控制器恢復即直接放行庫存</text><text x="455" y="616" fill="#d6e0ef">忽略溫度偏差與資料缺口</text><text x="810" y="601" fill="#c9f8e8">技術驗收＋權責判定</text><text x="810" y="628" fill="#c9f8e8">放行、隔離或報廢留痕</text></g></g></g></svg>