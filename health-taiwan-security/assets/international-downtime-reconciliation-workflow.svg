<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">停機資料對帳六階段流程</title><desc id="desc">從凍結可信還原點、盤點資料來源、優先處理高風險紀錄、分流例外、臨床覆核到分批回寫與驗收。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102a4d"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="78" fill="#fff" font-size="38" font-weight="800">停機資料對帳：六階段受控回寫</text><text x="60" y="118" fill="#9fb3d9" font-size="21">先建立可追溯工作佇列，再恢復資料流；不可把大量紙本直接一次輸入正式系統</text><g font-family="system-ui,'Noto Sans TC',sans-serif"><path d="M130 285H1070" stroke="#31567e" stroke-width="8"/><g><circle cx="130" cy="285" r="48" fill="#123754" stroke="#63e6ff" stroke-width="4"/><text x="130" y="296" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">1</text><text x="130" y="370" text-anchor="middle" fill="#63e6ff" font-size="22" font-weight="700">凍結</text><text x="130" y="403" text-anchor="middle" fill="#d3e4f5" font-size="17">確認最後已知良好</text><text x="130" y="430" text-anchor="middle" fill="#d3e4f5" font-size="17">保留復原點與日誌</text></g><g><circle cx="318" cy="285" r="48" fill="#16314d" stroke="#71a7ff" stroke-width="4"/><text x="318" y="296" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">2</text><text x="318" y="370" text-anchor="middle" fill="#9cc4ff" font-size="22" font-weight="700">盤點</text><text x="318" y="403" text-anchor="middle" fill="#d3e4f5" font-size="17">收齊紙本與暫存</text><text x="318" y="430" text-anchor="middle" fill="#d3e4f5" font-size="17">標記來源與時間</text></g><g><circle cx="506" cy="285" r="48" fill="#2b294e" stroke="#a997ff" stroke-width="4"/><text x="506" y="296" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">3</text><text x="506" y="370" text-anchor="middle" fill="#c7b8ff" font-size="22" font-weight="700">排序</text><text x="506" y="403" text-anchor="middle" fill="#d3e4f5" font-size="17">用藥／檢驗／過敏</text><text x="506" y="430" text-anchor="middle" fill="#d3e4f5" font-size="17">先處理高風險紀錄</text></g><g><circle cx="694" cy="285" r="48" fill="#3f2b28" stroke="#ff9f7a" stroke-width="4"/><text x="694" y="296" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">4</text><text x="694" y="370" text-anchor="middle" fill="#ffb69b" font-size="22" font-weight="700">分流</text><text x="694" y="403" text-anchor="middle" fill="#d3e4f5" font-size="17">缺漏／重複／衝突</text><text x="694" y="430" text-anchor="middle" fill="#d3e4f5" font-size="17">進入例外佇列</text></g><g><circle cx="882" cy="285" r="48" fill="#163d3d" stroke="#57f0c1" stroke-width="4"/><text x="882" y="296" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">5</text><text x="882" y="370" text-anchor="middle" fill="#85f4d3" font-size="22" font-weight="700">覆核</text><text x="882" y="403" text-anchor="middle" fill="#d3e4f5" font-size="17">臨床與資訊雙人</text><text x="882" y="430" text-anchor="middle" fill="#d3e4f5" font-size="17">確認處置與責任</text></g><g><circle cx="1070" cy="285" r="48" fill="#17345e" stroke="#71a7ff" stroke-width="4"/><text x="1070" y="296" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">6</text><text x="1070" y="370" text-anchor="middle" fill="#9cc4ff" font-size="22" font-weight="700">放行</text><text x="1070" y="403" text-anchor="middle" fill="#d3e4f5" font-size="17">分批回寫與抽核</text><text x="1070" y="430" text-anchor="middle" fill="#d3e4f5" font-size="17">確認服務與稽核軌跡</text></g><rect x="80" y="520" width="1040" height="125" rx="24" fill="#0b1c32" stroke="#31567e" stroke-width="2"/><text x="110" y="565" fill="#63e6ff" font-size="23" font-weight="700">停止條件</text><text x="270" y="565" fill="#fff" font-size="20">病人身分無法確定・高風險醫囑衝突・批次錯誤率超標・來源證據不足</text><text x="110" y="615" fill="#57f0c1" font-size="23" font-weight="700">驗收證據</text><text x="270" y="615" fill="#fff" font-size="20">例外關閉率・重複／缺漏抽核・臨床簽核・回寫批次與操作者紀錄</text></g></svg>