<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">第三方 AI 生命週期治理流程</title><desc id="desc">從用途正當性、供應商評估、契約、隔離驗證、持續監測、事件回復到安全退場的七階段流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#15234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="34" font-weight="800">七階段把 AI 依賴變成可驗收治理</text><text x="70" y="116" fill="#9fb3d9" font-size="20">每次重大模型、資料、外掛或雲端依賴變更，都回到風險分級與再驗證</text><path d="M128 360H1075" stroke="#315a80" stroke-width="8"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(145 0)"><circle cx="0" cy="360" r="48" fill="#12344a" stroke="#63e6ff" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">0</text><text y="448" fill="#63e6ff" font-size="21" font-weight="700">用途正當性</text><text y="480" fill="#c6d4eb" font-size="17">目標與替代方案</text></g><g transform="translate(295 0)"><circle cx="0" cy="360" r="48" fill="#172c50" stroke="#8fa7ff" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">1</text><text y="448" fill="#b8c5ff" font-size="21" font-weight="700">供應商評估</text><text y="480" fill="#c6d4eb" font-size="17">依賴與資料流</text></g><g transform="translate(445 0)"><circle cx="0" cy="360" r="48" fill="#261e43" stroke="#a997ff" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">2</text><text y="448" fill="#c7bcff" font-size="21" font-weight="700">契約與責任</text><text y="480" fill="#c6d4eb" font-size="17">通知、稽核、退場</text></g><g transform="translate(595 0)"><circle cx="0" cy="360" r="48" fill="#123c3b" stroke="#57f0c1" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">3</text><text y="448" fill="#78f4d0" font-size="21" font-weight="700">隔離驗證</text><text y="480" fill="#c6d4eb" font-size="17">安全與臨床測試</text></g><g transform="translate(745 0)"><circle cx="0" cy="360" r="48" fill="#233849" stroke="#63e6ff" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">4</text><text y="448" fill="#63e6ff" font-size="21" font-weight="700">持續監測</text><text y="480" fill="#c6d4eb" font-size="17">漂移、版本、事件</text></g><g transform="translate(895 0)"><circle cx="0" cy="360" r="48" fill="#4a2b2f" stroke="#ff9f9f" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">5</text><text y="448" fill="#ffb3b3" font-size="21" font-weight="700">事件與回復</text><text y="480" fill="#c6d4eb" font-size="17">隔離、回退、通知</text></g><g transform="translate(1045 0)"><circle cx="0" cy="360" r="48" fill="#3b3240" stroke="#f2c879" stroke-width="4"/><text y="367" fill="#fff" font-size="25" font-weight="800">6</text><text y="448" fill="#f2d293" font-size="21" font-weight="700">安全退場</text><text y="480" fill="#c6d4eb" font-size="17">遷移、刪除、撤權</text></g></g><path d="M745 300C745 205 445 205 445 300" fill="none" stroke="#a997ff" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="595" y="188" fill="#c7bcff" font-size="20" text-anchor="middle">重大變更觸發重新分級、契約核對與再驗證</text><rect x="145" y="560" width="900" height="82" rx="22" fill="#0d203a" stroke="#536d95"/><text x="595" y="595" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">最低放行證據</text><text x="595" y="625" fill="#c6d4eb" font-size="18" text-anchor="middle">責任人、版本與依賴、測試結果、回退條件、事件聯絡、資料刪除與服務接續</text></svg>