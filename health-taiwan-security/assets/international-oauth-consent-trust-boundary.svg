<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療雲端應用授權信任邊界</title><desc id="desc">使用者登入與應用程式授權分開判定，雲端身分平台只在核准權限與治理閘門後允許應用存取醫療資料。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="64" y="76" fill="#fff" font-size="38" font-weight="800">醫療雲端應用授權信任邊界</text><text x="64" y="116" fill="#9fb3d9" font-size="20">登入成功不代表第三方應用可以取得信箱、檔案與目錄資料</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><rect x="64" y="190" width="235" height="250" rx="24" fill="#102743" stroke="#63e6ff" stroke-width="2"/><text x="181" y="245" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">使用者</text><text x="181" y="292" text-anchor="middle" fill="#c6d4eb" font-size="20">完成登入與 MFA</text><text x="181" y="329" text-anchor="middle" fill="#c6d4eb" font-size="20">看見應用同意頁</text><text x="181" y="366" text-anchor="middle" fill="#ffb4c6" font-size="20">可能誤信品牌與網址</text><rect x="371" y="170" width="300" height="290" rx="24" fill="#15294c" stroke="#a997ff" stroke-width="3"/><text x="521" y="225" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">授權治理閘門</text><text x="411" y="278" fill="#c6d4eb" font-size="20">① 是否允許使用者自行同意</text><text x="411" y="319" fill="#c6d4eb" font-size="20">② 權限是否超過業務必要</text><text x="411" y="360" fill="#c6d4eb" font-size="20">③ 發行者、網域是否可信</text><text x="411" y="401" fill="#c6d4eb" font-size="20">④ 高風險是否轉管理員核准</text><rect x="750" y="190" width="385" height="250" rx="24" fill="#102f3d" stroke="#57f0c1" stroke-width="2"/><text x="942" y="245" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">醫療雲端資源</text><text x="942" y="292" text-anchor="middle" fill="#c6d4eb" font-size="20">郵件、行事曆、檔案</text><text x="942" y="329" text-anchor="middle" fill="#c6d4eb" font-size="20">協作平台、病人服務入口</text><text x="942" y="366" text-anchor="middle" fill="#c6d4eb" font-size="20">目錄資訊與工作流程</text><path d="M299 315H371" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M671 315H750" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="225" y="520" width="750" height="112" rx="22" fill="#241d3d" stroke="#ff8dac" stroke-width="2"/><text x="600" y="564" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">惡意 OAuth 應用不必竊取密碼，也可能持續讀取資料</text><text x="600" y="600" text-anchor="middle" fill="#ffc1d1" font-size="19">控制重點：限制同意、最小權限、風險偵測、權杖撤銷與應用移除</text></g></svg>