<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療設備安全架構證據地圖</title><desc id="desc">全球、分區、序列與狀態四種安全架構視圖，經院方驗收閘門連結到資產、網路、身分、監控與臨床流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="55" y="68" fill="#f7fbff" font-size="34" font-weight="800">架構圖不是裝飾，而是設備安全邊界的共同證據</text><text x="55" y="105" fill="#9fb7d5" font-size="19">四種視圖各回答一個驗收問題，再映射到院端實際控制</text><g font-size="22" font-weight="800"><rect x="55" y="150" width="235" height="145" rx="24" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="82" y="196" fill="#63e6ff">全球視圖</text><text x="82" y="235" fill="#e6eefc" font-size="18" font-weight="400">外部實體與信任邊界</text><text x="82" y="269" fill="#9fb7d5" font-size="16" font-weight="400">誰能連線？資料去哪裡？</text><rect x="315" y="150" width="235" height="145" rx="24" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="342" y="196" fill="#b9adff">分區視圖</text><text x="342" y="235" fill="#e6eefc" font-size="18" font-weight="400">元件、介面與安全區</text><text x="342" y="269" fill="#b8b0d8" font-size="16" font-weight="400">控制配置在哪一層？</text><rect x="575" y="150" width="235" height="145" rx="24" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="602" y="196" fill="#72f5cd">序列視圖</text><text x="602" y="235" fill="#e6eefc" font-size="18" font-weight="400">逐步通訊與驗證</text><text x="602" y="269" fill="#a5dbc9" font-size="16" font-weight="400">每一步如何授權與失敗？</text><rect x="835" y="150" width="310" height="145" rx="24" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="862" y="196" fill="#ffd08a">狀態視圖</text><text x="862" y="235" fill="#fff1dc" font-size="18" font-weight="400">正常、降級、更新與復原</text><text x="862" y="269" fill="#e6cba8" font-size="16" font-weight="400">狀態切換時控制是否仍成立？</text></g><path d="M600 315v52" stroke="#8fe8ff" stroke-width="5"/><polygon points="600,378 589,358 611,358" fill="#8fe8ff"/><rect x="255" y="378" width="690" height="105" rx="26" fill="#112e4d" stroke="#8fe8ff" stroke-width="3"/><text x="600" y="420" text-anchor="middle" fill="#8fe8ff" font-size="25" font-weight="800">院方驗收閘門</text><text x="600" y="457" text-anchor="middle" fill="#e6eefc" font-size="19">版本一致 · 介面可追蹤 · 安全假設可測試 · 缺口有責任與期限</text><path d="M600 483v48" stroke="#72f5cd" stroke-width="5"/><polygon points="600,542 589,522 611,522" fill="#72f5cd"/><rect x="75" y="542" width="1050" height="86" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="600" y="577" text-anchor="middle" fill="#72f5cd" font-size="23" font-weight="800">院端控制落點</text><text x="600" y="608" text-anchor="middle" fill="#ddfff4" font-size="18">資產清冊　網路分區　供應商存取　日誌監控　更新回退　臨床降級</text></g></svg>