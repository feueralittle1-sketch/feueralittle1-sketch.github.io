<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">手機版醫療數位憑證信任鏈</title><desc id="desc">信任來源經院級憑證治理連到病人入口、介接、設備與管理服務。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172b58"/></linearGradient><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e5ff"/></marker></defs><rect width="720" height="1100" rx="32" fill="url(#g)"/><text x="42" y="70" fill="#fff" font-size="34" font-weight="800">醫療憑證信任鏈</text><text x="42" y="112" fill="#a9bddb" font-size="23">到期會直接切斷身分與加密通道</text><rect x="70" y="165" width="580" height="185" rx="28" fill="#102746" stroke="#58d8ff" stroke-width="3"/><text x="360" y="220" text-anchor="middle" fill="#77e5ff" font-size="30" font-weight="700">信任來源</text><text x="360" y="275" text-anchor="middle" fill="#fff" font-size="25">根憑證＋中繼憑證＋簽發撤銷</text><text x="360" y="316" text-anchor="middle" fill="#a9bddb" font-size="21">確認責任、政策與有效狀態</text><path d="M360 360v65" stroke="#67e5ff" stroke-width="8" marker-end="url(#m)"/><rect x="70" y="440" width="580" height="330" rx="30" fill="#17294d" stroke="#a491ff" stroke-width="4"/><text x="360" y="495" text-anchor="middle" fill="#c3b8ff" font-size="30" font-weight="800">院級憑證治理</text><rect x="120" y="535" width="480" height="62" rx="16" fill="#253965"/><text x="360" y="576" text-anchor="middle" fill="#fff" font-size="24">清冊與服務擁有者</text><rect x="120" y="615" width="480" height="62" rx="16" fill="#253965"/><text x="360" y="656" text-anchor="middle" fill="#fff" font-size="24">到期、撤銷與錯誤監測</text><rect x="120" y="695" width="480" height="62" rx="16" fill="#253965"/><text x="360" y="736" text-anchor="middle" fill="#fff" font-size="24">續期部署與可測試回退</text><path d="M360 780v60" stroke="#72f0c1" stroke-width="8" marker-end="url(#m)"/><rect x="70" y="855" width="580" height="185" rx="28" fill="#123a3c" stroke="#72f0c1" stroke-width="3"/><text x="360" y="908" text-anchor="middle" fill="#82f7cc" font-size="29" font-weight="700">臨床服務</text><text x="360" y="958" text-anchor="middle" fill="#fff" font-size="24">病人入口・API・設備・管理介面</text><text x="360" y="1002" text-anchor="middle" fill="#a9bddb" font-size="21">每張憑證都要連回服務與責任人</text></svg>
