<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">手機版基因資料風險與控制對照</title><desc id="desc">四類基因資料風險分別對應控制措施與驗證證據。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182449"/></linearGradient></defs><rect width="720" height="1260" rx="32" fill="url(#g)"/><text x="40" y="64" fill="#fff" font-size="32" font-weight="800">基因資料風險與控制</text><text x="40" y="104" fill="#9fb8dc" font-size="22">控制與驗證證據必須成對</text><g font-family="sans-serif"><g transform="translate(40 150)"><rect width="640" height="230" rx="24" fill="#111f3b" stroke="#ff7fa9" stroke-width="3"/><text x="28" y="45" fill="#ff9fba" font-size="26" font-weight="700">再識別</text><text x="28" y="88" fill="#fff" font-size="23">控制：最小欄位、受控分析、輸出審查</text><text x="28" y="128" fill="#fff" font-size="23">證據：每次輸出的核准與內容紀錄</text><text x="28" y="186" fill="#9fb8dc" font-size="21">不把「去識別」當成永久匿名</text></g><g transform="translate(40 405)"><rect width="640" height="230" rx="24" fill="#111f3b" stroke="#aa98ff" stroke-width="3"/><text x="28" y="45" fill="#c3b8ff" font-size="26" font-weight="700">帳號共用與冒用</text><text x="28" y="88" fill="#fff" font-size="23">控制：唯一身分、MFA、機構責任</text><text x="28" y="128" fill="#fff" font-size="23">證據：核驗、登入、定期再驗證日誌</text><text x="28" y="186" fill="#9fb8dc" font-size="21">研究者離職或轉調時立即撤權</text></g><g transform="translate(40 660)"><rect width="640" height="230" rx="24" fill="#111f3b" stroke="#66dfff" stroke-width="3"/><text x="28" y="45" fill="#75e6ff" font-size="26" font-weight="700">未核准下載</text><text x="28" y="88" fill="#fff" font-size="23">控制：出口封鎖、隔離工作區、異常偵測</text><text x="28" y="128" fill="#fff" font-size="23">證據：流量告警、查詢日誌、調查單</text><text x="28" y="186" fill="#9fb8dc" font-size="21">大量查詢與資料搬移需要單獨門檻</text></g><g transform="translate(40 915)"><rect width="640" height="230" rx="24" fill="#111f3b" stroke="#72f0c1" stroke-width="3"/><text x="28" y="45" fill="#82f7cc" font-size="26" font-weight="700">研究結束後殘留</text><text x="28" y="88" fill="#fff" font-size="23">控制：自動到期、撤銷、工作區結案</text><text x="28" y="128" fill="#fff" font-size="23">證據：撤權、清除與衍生資料清冊</text><text x="28" y="186" fill="#9fb8dc" font-size="21">權限與資料保留期限必須一致</text></g></g><text x="360" y="1210" text-anchor="middle" fill="#e7f0ff" font-size="21">可重現誰、何時、為何、查了什麼、輸出什麼</text></svg>