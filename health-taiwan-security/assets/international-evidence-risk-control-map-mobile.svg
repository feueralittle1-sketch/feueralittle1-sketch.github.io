<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" role="img" aria-labelledby="title desc"><title id="title">手機版機器可讀資安證據風險控制圖</title><desc id="desc">五項證據自動化失敗模式與必要控制及驗收方法。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="390" height="900" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">證據自動化風險控制</text><g font-size="15"><g><rect x="25" y="75" width="340" height="140" rx="20" fill="#10213d" stroke="#ff7aa8" stroke-width="2"/><text x="45" y="108" fill="#ffb4ca" font-size="18" font-weight="800">資料已過期</text><text x="45" y="140" fill="#d8e6fb">控制：有效期、來源時間、自動失效</text><text x="45" y="173" fill="#d9fff3">驗收：過期率、刷新時間、失效紀錄</text></g><g><rect x="25" y="225" width="340" height="140" rx="20" fill="#132541" stroke="#ff7aa8" stroke-width="2"/><text x="45" y="258" fill="#ffb4ca" font-size="18" font-weight="800">範圍錯配</text><text x="45" y="290" fill="#d8e6fb">控制：綁定資產、版本與臨床服務</text><text x="45" y="323" fill="#d9fff3">驗收：抽樣核對、未配對清單</text></g><g><rect x="25" y="375" width="340" height="140" rx="20" fill="#10213d" stroke="#ff7aa8" stroke-width="2"/><text x="45" y="408" fill="#ffb4ca" font-size="18" font-weight="800">自動判定失真</text><text x="45" y="440" fill="#d8e6fb">控制：人工覆核、信心與反證欄位</text><text x="45" y="473" fill="#d9fff3">驗收：差異、誤判率、核准者</text></g><g><rect x="25" y="525" width="340" height="140" rx="20" fill="#132541" stroke="#ff7aa8" stroke-width="2"/><text x="45" y="558" fill="#ffb4ca" font-size="18" font-weight="800">敏感資訊外洩</text><text x="45" y="590" fill="#d8e6fb">控制：最小揭露、分級、加密、分權</text><text x="45" y="623" fill="#d9fff3">驗收：欄位白名單、匯出紀錄</text></g><g><rect x="25" y="675" width="340" height="140" rx="20" fill="#10213d" stroke="#ff7aa8" stroke-width="2"/><text x="45" y="708" fill="#ffb4ca" font-size="18" font-weight="800">工具與格式鎖定</text><text x="45" y="740" fill="#d8e6fb">控制：開放格式、版本與匯出測試</text><text x="45" y="773" fill="#d9fff3">驗收：跨工具驗證、退出演練</text></g></g><text x="195" y="858" text-anchor="middle" fill="#ffcf99" font-size="14">機器可讀不等於機器可決策</text><text x="195" y="881" text-anchor="middle" fill="#9fb3d9" font-size="13">證據品質與臨床語境都要驗收</text></g></svg>
