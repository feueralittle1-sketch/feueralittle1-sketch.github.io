<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫院啟動外部資安支援的六步流程</title><desc id="desc">醫院由事件觸發、院內定界、選擇服務、安全交接、聯合處置到驗收結案，形成可追蹤的外部支援閉環。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8fe8ff"/></marker></defs>
<rect width="1200" height="760" rx="36" fill="#081426"/><text x="64" y="76" fill="#f4f8ff" font-size="36" font-weight="700">支援請求要在事件前設計，在事件中照表啟動</text><text x="64" y="116" fill="#9fb3d9" font-size="20">每一步均配置負責角色、輸入資料、交付物與停止條件</text>
<g font-size="20" font-weight="700" text-anchor="middle">
<rect x="60" y="180" width="170" height="116" rx="22" fill="#15355a" stroke="#63e6ff" stroke-width="3"/><text x="145" y="224" fill="#fff">1 觸發</text><text x="145" y="257" fill="#9fefff" font-size="16">重大告警／停機</text>
<rect x="250" y="180" width="170" height="116" rx="22" fill="#182f4c" stroke="#71a7ff" stroke-width="3"/><text x="335" y="224" fill="#fff">2 定界</text><text x="335" y="257" fill="#b9d3ff" font-size="16">臨床與技術範圍</text>
<rect x="440" y="180" width="170" height="116" rx="22" fill="#30254d" stroke="#a997ff" stroke-width="3"/><text x="525" y="224" fill="#fff">3 選服務</text><text x="525" y="257" fill="#ddd6ff" font-size="16">能力、時效、窗口</text>
<rect x="630" y="180" width="170" height="116" rx="22" fill="#26344b" stroke="#8fe8ff" stroke-width="3"/><text x="715" y="224" fill="#fff">4 安全交接</text><text x="715" y="257" fill="#c8efff" font-size="16">最小資料與證據</text>
<rect x="820" y="180" width="170" height="116" rx="22" fill="#123b37" stroke="#57f0c1" stroke-width="3"/><text x="905" y="224" fill="#fff">5 聯合處置</text><text x="905" y="257" fill="#a9ffe5" font-size="16">指揮、變更、回退</text>
<rect x="1010" y="180" width="130" height="116" rx="22" fill="#432f22" stroke="#ffbd7a" stroke-width="3"/><text x="1075" y="224" fill="#fff">6 驗收</text><text x="1075" y="257" fill="#ffd9b5" font-size="16">復原／結案</text></g>
<g stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"><path d="M230 238H244"/><path d="M420 238H434"/><path d="M610 238H624"/><path d="M800 238H814"/><path d="M990 238H1004"/></g>
<text x="64" y="374" fill="#f4f8ff" font-size="28" font-weight="700">安全交接最小包</text>
<g font-size="19"><rect x="64" y="410" width="520" height="74" rx="18" fill="#0e233c"/><text x="94" y="455" fill="#63e6ff" font-weight="700">情境</text><text x="180" y="455" fill="#e6eefc">案件編號、時間軸、服務影響、優先序</text><rect x="616" y="410" width="520" height="74" rx="18" fill="#0e233c"/><text x="646" y="455" fill="#71a7ff" font-weight="700">證據</text><text x="732" y="455" fill="#e6eefc">必要日誌、映像、版本、雜湊與保全紀錄</text><rect x="64" y="502" width="520" height="74" rx="18" fill="#0e233c"/><text x="94" y="547" fill="#a997ff" font-weight="700">授權</text><text x="180" y="547" fill="#e6eefc">可做動作、禁止區域、核准人、失效時間</text><rect x="616" y="502" width="520" height="74" rx="18" fill="#0e233c"/><text x="646" y="547" fill="#57f0c1" font-weight="700">通訊</text><text x="732" y="547" fill="#e6eefc">帶外管道、更新節奏、升級門檻與聯絡鏈</text></g>
<rect x="64" y="625" width="1072" height="82" rx="20" fill="#112d31" stroke="#57f0c1" stroke-width="2"/><text x="600" y="659" text-anchor="middle" fill="#57f0c1" font-size="21" font-weight="700">結案不是外部報告送達</text><text x="600" y="690" text-anchor="middle" fill="#f4f8ff" font-size="20">必須完成臨床回歸、技術復原、證據保存、權限撤銷、未結風險與復盤行動</text></svg>
