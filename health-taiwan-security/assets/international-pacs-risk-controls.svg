<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">PACS 資料完整性風險與控制對照</title><desc id="desc">將誤刪、錯配、靜默損壞、備份污染與過早放行對應到預防、偵測及復原控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071424"/><stop offset="1" stop-color="#112b48"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="62" y="75" fill="#f7fbff" font-size="34" font-weight="800">PACS 風險不能只靠備份：控制要覆蓋預防、偵測與復原</text><text x="62" y="112" fill="#9fb7d5" font-size="19">同一風險至少要有兩種不同層級的控制，避免單點失效</text><g font-family="Arial, Noto Sans TC, sans-serif"><g font-size="19"><rect x="55" y="165" width="235" height="415" rx="24" fill="#341f34" stroke="#ff7fa6"/><text x="172" y="211" text-anchor="middle" fill="#ff9ab7" font-size="24" font-weight="800">失敗模式</text><text x="88" y="270" fill="#fff">• 誤刪影像</text><text x="88" y="326" fill="#fff">• 病人／檢查錯配</text><text x="88" y="382" fill="#fff">• 靜默損壞</text><text x="88" y="438" fill="#fff">• 備份同步污染</text><text x="88" y="494" fill="#fff">• 未驗證即放行</text><rect x="320" y="165" width="250" height="415" rx="24" fill="#17364e" stroke="#63e6ff"/><text x="445" y="211" text-anchor="middle" fill="#63e6ff" font-size="24" font-weight="800">預防</text><text x="350" y="270" fill="#e8f8ff">刪除雙重核准</text><text x="350" y="326" fill="#e8f8ff">角色與職務分離</text><text x="350" y="382" fill="#e8f8ff">版本／保留鎖定</text><text x="350" y="438" fill="#e8f8ff">備份管理面分離</text><text x="350" y="494" fill="#e8f8ff">變更與回退閘門</text><rect x="600" y="165" width="250" height="415" rx="24" fill="#2a3157" stroke="#aa9cff"/><text x="725" y="211" text-anchor="middle" fill="#c5b3ff" font-size="24" font-weight="800">偵測</text><text x="630" y="270" fill="#f0edff">刪除量與速度告警</text><text x="630" y="326" fill="#f0edff">身分與檢查號比對</text><text x="630" y="382" fill="#f0edff">雜湊／物件數校驗</text><text x="630" y="438" fill="#f0edff">主副本差異監測</text><text x="630" y="494" fill="#f0edff">獨立稽核時間線</text><rect x="880" y="165" width="265" height="415" rx="24" fill="#17473f" stroke="#57f0c1"/><text x="1012" y="211" text-anchor="middle" fill="#72f5cd" font-size="24" font-weight="800">復原</text><text x="910" y="270" fill="#e5fff7">不可變可信副本</text><text x="910" y="326" fill="#e5fff7">隔離還原環境</text><text x="910" y="382" fill="#e5fff7">病人／序列對帳</text><text x="910" y="438" fill="#e5fff7">代表性臨床閱片</text><text x="910" y="494" fill="#e5fff7">分批回寫與例外清冊</text></g><path d="M290 370h30M570 370h30M850 370h30" stroke="#91eaff" stroke-width="5"/></g></svg>