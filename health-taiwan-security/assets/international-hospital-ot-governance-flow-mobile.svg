<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1080" role="img" aria-labelledby="title desc"><title id="title">醫院設施 OT 六階段治理流程手機版</title><desc id="desc">發現、定界、分區、控制、演練與復原的垂直流程。</desc><rect width="600" height="1080" rx="32" fill="#09172b"/><text x="38" y="60" fill="#fff" font-size="28" font-weight="700">設施 OT 六階段閉環</text><text x="38" y="95" fill="#9fb3d9" font-size="17">每階段留下可驗證證據</text><path d="M110 170V940" stroke="#315b77" stroke-width="7"/><g font-family="sans-serif"><g transform="translate(0 0)"><circle cx="110" cy="185" r="46" fill="#12324b" stroke="#63e6ff" stroke-width="3"/><text x="110" y="193" text-anchor="middle" fill="#63e6ff" font-size="22" font-weight="700">1</text><text x="185" y="178" fill="#fff" font-size="22" font-weight="700">發現設備與連線</text><text x="185" y="208" fill="#9fb3d9" font-size="17">優先使用被動盤點</text></g><g><circle cx="110" cy="335" r="46" fill="#172e50" stroke="#9c8cff" stroke-width="3"/><text x="110" y="343" text-anchor="middle" fill="#c6baff" font-size="22" font-weight="700">2</text><text x="185" y="328" fill="#fff" font-size="22" font-weight="700">定界臨床衝擊</text><text x="185" y="358" fill="#9fb3d9" font-size="17">定義安全與服務門檻</text></g><g><circle cx="110" cy="485" r="46" fill="#123b44" stroke="#57f0c1" stroke-width="3"/><text x="110" y="493" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="700">3</text><text x="185" y="478" fill="#fff" font-size="22" font-weight="700">劃分流量與信任區</text><text x="185" y="508" fill="#9fb3d9" font-size="17">建立控制區與跳板</text></g><g><circle cx="110" cy="635" r="46" fill="#3a2e3d" stroke="#ffb86b" stroke-width="3"/><text x="110" y="643" text-anchor="middle" fill="#ffca8a" font-size="22" font-weight="700">4</text><text x="185" y="628" fill="#fff" font-size="22" font-weight="700">限制存取與變更</text><text x="185" y="658" fill="#9fb3d9" font-size="17">備份、日誌與雙人核准</text></g><g><circle cx="110" cy="785" r="46" fill="#402b44" stroke="#ff7ad9" stroke-width="3"/><text x="110" y="793" text-anchor="middle" fill="#ff9ee4" font-size="22" font-weight="700">5</text><text x="185" y="778" fill="#fff" font-size="22" font-weight="700">演練降級與現場安全</text><text x="185" y="808" fill="#9fb3d9" font-size="17">測試停機與人工操作</text></g><g><circle cx="110" cy="935" r="46" fill="#183448" stroke="#71a7ff" stroke-width="3"/><text x="110" y="943" text-anchor="middle" fill="#9fc2ff" font-size="22" font-weight="700">6</text><text x="185" y="928" fill="#fff" font-size="22" font-weight="700">可信重建與重驗</text><text x="185" y="958" fill="#9fb3d9" font-size="17">分批恢復臨床服務</text></g></g><text x="300" y="1035" text-anchor="middle" fill="#d9e7ff" font-size="17">設備、網路、用途或供應商變更後重新循環</text></svg>