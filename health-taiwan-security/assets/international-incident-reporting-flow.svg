<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資安事件分流通報流程</title><desc id="desc">事件從偵測、穩定事實、平行評估、送件、更新到證據結案的六階段流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172b"/><stop offset="1" stop-color="#112a49"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="60" y="74" fill="#f7fbff" font-size="34" font-weight="800">多軌通報的六階段閉環</text><text x="60" y="110" fill="#9fb7d5" font-size="19">先穩定共同事實，再平行處理不同受理窗口與時間要求</text><g font-family="Arial, Noto Sans TC, sans-serif"><g><rect x="50" y="188" width="168" height="190" rx="24" fill="#102d4b" stroke="#63e6ff" stroke-width="2"/><text x="134" y="232" text-anchor="middle" fill="#63e6ff" font-size="23" font-weight="800">1 偵測</text><text x="134" y="278" text-anchor="middle" fill="#e6eefc" font-size="17">確認事件窗口</text><text x="134" y="312" text-anchor="middle" fill="#a9bdd9" font-size="16">啟動指揮與保全</text><rect x="237" y="188" width="168" height="190" rx="24" fill="#102d4b" stroke="#79b8ff" stroke-width="2"/><text x="321" y="232" text-anchor="middle" fill="#9bc9ff" font-size="23" font-weight="800">2 穩定事實</text><text x="321" y="278" text-anchor="middle" fill="#e6eefc" font-size="17">系統／資料／病人</text><text x="321" y="312" text-anchor="middle" fill="#a9bdd9" font-size="16">未知項目清楚標記</text><rect x="424" y="188" width="168" height="190" rx="24" fill="#242f59" stroke="#a997ff" stroke-width="2"/><text x="508" y="232" text-anchor="middle" fill="#c3b8ff" font-size="23" font-weight="800">3 平行評估</text><text x="508" y="278" text-anchor="middle" fill="#e6eefc" font-size="17">技術／個資／臨床</text><text x="508" y="312" text-anchor="middle" fill="#bdb8db" font-size="16">各自判定門檻</text><rect x="611" y="188" width="168" height="190" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="695" y="232" text-anchor="middle" fill="#72f5cd" font-size="23" font-weight="800">4 分軌送件</text><text x="695" y="278" text-anchor="middle" fill="#e6eefc" font-size="17">指定窗口與內容</text><text x="695" y="312" text-anchor="middle" fill="#b2dbd1" font-size="16">保存收件與補件</text><rect x="798" y="188" width="168" height="190" rx="24" fill="#4d361e" stroke="#ffbe6b" stroke-width="2"/><text x="882" y="232" text-anchor="middle" fill="#ffd08a" font-size="23" font-weight="800">5 持續更新</text><text x="882" y="278" text-anchor="middle" fill="#fff0d8" font-size="17">重大變化再評估</text><text x="882" y="312" text-anchor="middle" fill="#d9c5a7" font-size="16">對外版本一致</text><rect x="985" y="188" width="168" height="190" rx="24" fill="#3d2340" stroke="#ff7db3" stroke-width="2"/><text x="1069" y="232" text-anchor="middle" fill="#ffacd0" font-size="23" font-weight="800">6 證據結案</text><text x="1069" y="278" text-anchor="middle" fill="#ffe6f1" font-size="17">義務與復原完成</text><text x="1069" y="312" text-anchor="middle" fill="#d8b7c7" font-size="16">復盤與控制改善</text></g><g stroke="#7adfff" stroke-width="4" fill="none"><path d="M218 283h19M405 283h19M592 283h19M779 283h19M966 283h19"/></g><rect x="92" y="450" width="1016" height="146" rx="26" fill="#0a1c32" stroke="#32577d" stroke-width="2"/><text x="126" y="494" fill="#f7fbff" font-size="23" font-weight="800">每一階段都要留下可驗證證據</text><text x="126" y="536" fill="#dce9f8" font-size="18">時間戳記 · 責任角色 · 事實來源 · 判定依據 · 送件版本 · 收件證明 · 未決事項 · 關閉條件</text><text x="126" y="570" fill="#9fb7d5" font-size="17">速度不能取代準確性；尚未確認的內容應明確標示並安排更新。</text></g></svg>