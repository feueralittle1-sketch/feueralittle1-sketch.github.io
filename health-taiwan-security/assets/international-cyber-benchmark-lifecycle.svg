<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">醫療資安評估到改善重測的七階段流程</title><desc id="desc">從定義範圍、蒐集證據、院內評分、品質檢查、分層彙總、改善決策到重測，形成可追溯的評估生命週期。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#17264b"/></linearGradient></defs><rect width="1200" height="650" rx="32" fill="url(#bg)"/><text x="58" y="70" fill="#fff" font-size="34" font-weight="800">評估不是排行榜，而是改善循環</text><text x="58" y="108" fill="#9fb7d8" font-size="20">每個階段都保留版本、責任人與驗收證據</text><g font-family="Arial, Noto Sans TC, sans-serif"><path d="M110 345H1090" stroke="#36577f" stroke-width="12" stroke-linecap="round"/><g font-size="19" text-anchor="middle"><g><circle cx="120" cy="345" r="58" fill="#163852" stroke="#63e6ff" stroke-width="4"/><text x="120" y="338" fill="#fff" font-weight="800">定義</text><text x="120" y="366" fill="#d8f7ff">範圍</text><text x="120" y="445" fill="#bdd0e8">服務、系統</text><text x="120" y="472" fill="#bdd0e8">期間、版本</text></g><g><circle cx="280" cy="345" r="58" fill="#24325b" stroke="#9c8cff" stroke-width="4"/><text x="280" y="338" fill="#fff" font-weight="800">蒐集</text><text x="280" y="366" fill="#eee9ff">證據</text><text x="280" y="445" fill="#bdd0e8">文件、設定</text><text x="280" y="472" fill="#bdd0e8">測試、紀錄</text></g><g><circle cx="440" cy="345" r="58" fill="#143b45" stroke="#57f0c1" stroke-width="4"/><text x="440" y="338" fill="#fff" font-weight="800">院內</text><text x="440" y="366" fill="#d8fff2">評分</text><text x="440" y="445" fill="#bdd0e8">理由與例外</text><text x="440" y="472" fill="#bdd0e8">共同核准</text></g><g><circle cx="600" cy="345" r="58" fill="#49311f" stroke="#ffb86b" stroke-width="4"/><text x="600" y="338" fill="#fff" font-weight="800">品質</text><text x="600" y="366" fill="#fff0d8">檢查</text><text x="600" y="445" fill="#bdd0e8">缺漏、偏差</text><text x="600" y="472" fill="#bdd0e8">去識別</text></g><g><circle cx="760" cy="345" r="58" fill="#163852" stroke="#63e6ff" stroke-width="4"/><text x="760" y="338" fill="#fff" font-weight="800">分層</text><text x="760" y="366" fill="#d8f7ff">彙總</text><text x="760" y="445" fill="#bdd0e8">規模與服務</text><text x="760" y="472" fill="#bdd0e8">同群比較</text></g><g><circle cx="920" cy="345" r="58" fill="#24325b" stroke="#9c8cff" stroke-width="4"/><text x="920" y="338" fill="#fff" font-weight="800">改善</text><text x="920" y="366" fill="#eee9ff">決策</text><text x="920" y="445" fill="#bdd0e8">責任、資源</text><text x="920" y="472" fill="#bdd0e8">完成期限</text></g><g><circle cx="1080" cy="345" r="58" fill="#143b45" stroke="#57f0c1" stroke-width="4"/><text x="1080" y="338" fill="#fff" font-weight="800">重測</text><text x="1080" y="366" fill="#d8fff2">驗收</text><text x="1080" y="445" fill="#bdd0e8">趨勢與證據</text><text x="1080" y="472" fill="#bdd0e8">關閉缺口</text></g></g><path d="M1080 270C1080 165 120 165 120 270" fill="none" stroke="#57f0c1" stroke-width="4" stroke-dasharray="10 10"/><text x="600" y="182" fill="#aef6df" font-size="21" text-anchor="middle">下一輪沿用同一範圍與版本規則，才可判斷趨勢</text></g></svg>
