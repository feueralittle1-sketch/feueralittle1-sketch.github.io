<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療資安事件溝通的信任與資訊流</title>
<desc id="desc">事件指揮中心以已確認事實為單一來源，分別向臨床人員、病人與家屬、供應商、主管機關及媒體發布符合需要的訊息，安全與法務審查位於發布流程中。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17143d"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/>
<g font-family="Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">事件溝通不是公關附屬：先建立可信資訊流</text><text x="60" y="108" fill="#a8bad8" font-size="20">同一事實基線，依臨床行動、服務影響與法定需求調整細節</text>
<rect x="380" y="160" width="440" height="210" rx="28" fill="#192e4b" stroke="#63e6ff" stroke-width="3"/><text x="600" y="207" text-anchor="middle" fill="#8fe8ff" font-size="20" font-weight="700">事件指揮中心｜單一事實來源</text><text x="600" y="253" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">已確認影響・目前措施・下次更新</text><text x="600" y="297" text-anchor="middle" fill="#c7d6ec" font-size="19">臨床＋資安＋營運＋溝通＋法務／隱私</text><rect x="450" y="320" width="300" height="34" rx="17" fill="#3a284d"/><text x="600" y="344" text-anchor="middle" fill="#eadcff" font-size="17">未知事項明確標示，不用推測填空</text>
<rect x="55" y="465" width="200" height="125" rx="22" fill="#123b3a" stroke="#57f0c1" stroke-width="3"/><text x="155" y="510" text-anchor="middle" fill="#8bf7d8" font-size="20" font-weight="700">臨床與員工</text><text x="155" y="548" text-anchor="middle" fill="#fff" font-size="18">替代流程・安全界線</text>
<rect x="278" y="465" width="200" height="125" rx="22" fill="#26304f" stroke="#8eb9ff" stroke-width="3"/><text x="378" y="510" text-anchor="middle" fill="#b8d2ff" font-size="20" font-weight="700">病人與家屬</text><text x="378" y="548" text-anchor="middle" fill="#fff" font-size="18">服務狀態・可採行動</text>
<rect x="501" y="465" width="200" height="125" rx="22" fill="#3a2c43" stroke="#d8a9ff" stroke-width="3"/><text x="601" y="510" text-anchor="middle" fill="#ebcfff" font-size="20" font-weight="700">供應商與夥伴</text><text x="601" y="548" text-anchor="middle" fill="#fff" font-size="18">依賴狀態・協作窗口</text>
<rect x="724" y="465" width="200" height="125" rx="22" fill="#3b321f" stroke="#ffd37a" stroke-width="3"/><text x="824" y="510" text-anchor="middle" fill="#ffe4a8" font-size="20" font-weight="700">主管機關</text><text x="824" y="548" text-anchor="middle" fill="#fff" font-size="18">依本地規定通報</text>
<rect x="947" y="465" width="200" height="125" rx="22" fill="#3b2531" stroke="#ff9fbd" stroke-width="3"/><text x="1047" y="510" text-anchor="middle" fill="#ffc0d4" font-size="20" font-weight="700">媒體與社會</text><text x="1047" y="548" text-anchor="middle" fill="#fff" font-size="18">一致事實・避免臆測</text>
<path d="M600 370V420H155V455" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 420H378V455" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 370V455" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 420H824V455" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 420H1047V455" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="655" text-anchor="middle" fill="#b9c9e3" font-size="18">每則訊息保留版本、核准者、發布時間、受眾、管道與更正紀錄</text></g></svg>
