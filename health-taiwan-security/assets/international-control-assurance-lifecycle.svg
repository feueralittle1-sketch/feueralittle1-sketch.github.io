<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資安控制證據化驗收流程</title><desc id="desc">從臨床風險建模、選定基線、定義驗收情境、執行測試、判定缺口到複測關閉的六步循環。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14234a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#63e6ff"/></marker></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="600" y="70" text-anchor="middle" fill="#fff" font-family="Arial,'Noto Sans TC'" font-size="36" font-weight="700">六步建立可重複的驗收循環</text><text x="600" y="108" text-anchor="middle" fill="#9fb3d9" font-family="Arial,'Noto Sans TC'" font-size="20">基線決定要做什麼；情境、門檻與證據決定是否真的有效</text><g font-family="Arial,'Noto Sans TC'" text-anchor="middle"><g fill="#142d4e" stroke="#63e6ff" stroke-width="3"><rect x="70" y="170" width="300" height="120" rx="24"/><rect x="450" y="170" width="300" height="120" rx="24"/><rect x="830" y="170" width="300" height="120" rx="24"/><rect x="830" y="400" width="300" height="120" rx="24"/><rect x="450" y="400" width="300" height="120" rx="24"/><rect x="70" y="400" width="300" height="120" rx="24"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="220" y="215">1 臨床風險建模</text><text x="600" y="215">2 選定控制基線</text><text x="980" y="215">3 定義驗收情境</text><text x="980" y="445">4 執行與留證</text><text x="600" y="445">5 判定缺口與例外</text><text x="220" y="445">6 修正、複測、關閉</text></g><g fill="#b8c8e5" font-size="18"><text x="220" y="252">服務、威脅、衝擊、依賴</text><text x="600" y="252">必要控制＋風險加強</text><text x="980" y="252">前置條件、攻擊、通過門檻</text><text x="980" y="482">技術結果＋臨床觀察</text><text x="600" y="482">責任人、期限、殘餘風險</text><text x="220" y="482">版本、結果、核准可追溯</text></g></g><g fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"><path d="M370 230H430"/><path d="M750 230H810"/><path d="M980 300V380"/><path d="M830 460H770"/><path d="M450 460H390"/><path d="M220 400V330Q220 320 240 320H580Q600 320 600 300"/></g><rect x="360" y="570" width="480" height="62" rx="31" fill="#102f43" stroke="#57f0c1" stroke-width="2"/><text x="600" y="609" text-anchor="middle" fill="#57f0c1" font-family="Arial,'Noto Sans TC'" font-size="22" font-weight="700">輸出：可重現、可比較、可追責的驗收紀錄</text></svg>