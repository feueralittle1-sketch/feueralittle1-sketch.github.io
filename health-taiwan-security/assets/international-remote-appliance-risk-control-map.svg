<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">遠端支援設備事件的風險與控制對照</title><desc id="desc">修補即結案、設備內日誌被刪除、代理憑證外洩與過早恢復等風險，對應威脅獵捕、離機日誌、全面輪替及分段放行控制。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="36" font-weight="800">修補不是結案：四類殘餘風險必須另行驗收</text><text x="60" y="112" fill="#9fb7db" font-size="22">遠端設備握有連線、檔案與憑證能力，事件關閉要以可查證結果為準。</text>
<rect x="60" y="165" width="1080" height="80" rx="20" fill="#231f3d" stroke="#b69cff" stroke-width="2"/><text x="95" y="214" fill="#ffb5cc" font-size="23" font-weight="800">風險</text><text x="330" y="214" fill="#ffb5cc" font-size="23" font-weight="800">可能後果</text><text x="650" y="214" fill="#57f0c1" font-size="23" font-weight="800">必要控制</text><text x="980" y="214" fill="#63e6ff" font-size="23" font-weight="800">驗收證據</text>
<g font-family="Inter,Noto Sans TC,sans-serif" font-size="19"><rect x="60" y="255" width="1080" height="92" fill="#10233f"/><text x="95" y="310" fill="#fff" font-weight="700">只套修補即結案</text><text x="330" y="292" fill="#d7e5ff">webshell、隧道或組態</text><text x="330" y="320" fill="#d7e5ff">持久化仍留在設備</text><text x="650" y="292" fill="#dcfff5">設備影像、IOC 搜尋、</text><text x="650" y="320" fill="#dcfff5">乾淨重建與下游獵捕</text><text x="980" y="292" fill="#dff8ff">搜尋範圍、結果、</text><text x="980" y="320" fill="#dff8ff">重建雜湊與核准</text>
<rect x="60" y="357" width="1080" height="92" fill="#0d1e37"/><text x="95" y="412" fill="#fff" font-weight="700">設備內日誌遭刪除</text><text x="330" y="394" fill="#d7e5ff">無法重建入侵時間線</text><text x="330" y="422" fill="#d7e5ff">與受影響目標</text><text x="650" y="394" fill="#dcfff5">近即時離機 syslog、</text><text x="650" y="422" fill="#dcfff5">會話與身分事件</text><text x="980" y="394" fill="#dff8ff">SIEM 收件率、時鐘</text><text x="980" y="422" fill="#dff8ff">同步與保存測試</text>
<rect x="60" y="459" width="1080" height="92" fill="#10233f"/><text x="95" y="514" fill="#fff" font-weight="700">代理憑證被取得</text><text x="330" y="496" fill="#d7e5ff">攻擊者繞過設備，</text><text x="330" y="524" fill="#d7e5ff">直接登入下游系統</text><text x="650" y="496" fill="#dcfff5">全面輪替、撤銷工作階段、</text><text x="650" y="524" fill="#dcfff5">檢查新 MFA 與異地登入</text><text x="980" y="496" fill="#dff8ff">輪替清冊、撤銷紀錄、</text><text x="980" y="524" fill="#dff8ff">異常登入調查</text>
<rect x="60" y="561" width="1080" height="92" fill="#0d1e37"/><text x="95" y="616" fill="#fff" font-weight="700">為維修需求過早恢復</text><text x="330" y="598" fill="#d7e5ff">第二次入侵或臨床</text><text x="330" y="626" fill="#d7e5ff">中斷擴大</text><text x="650" y="598" fill="#dcfff5">替代維護、最小路由、</text><text x="650" y="626" fill="#dcfff5">逐批放行與回退門檻</text><text x="980" y="598" fill="#dff8ff">臨床回歸、監看結果</text><text x="980" y="626" fill="#dff8ff">與風險接受紀錄</text></g></svg>