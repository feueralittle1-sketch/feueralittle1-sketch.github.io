<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫院私有 5G 的分階段規劃與驗收流程</title>
<desc id="desc">私有 5G 導入依序完成臨床情境界定、依賴盤點、身分與網路設計、小範圍試點、中斷演練及分批上線，演練結果會回饋至依賴盤點。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#15143b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="68" y="74" fill="#fff" font-size="34" font-weight="700">導入閉環：先證明失效時仍能照護，再擴大覆蓋</text><text x="68" y="111" fill="#a8bad8" font-size="20">每一階段都有停止條件、回退路徑與可重現證據</text><g text-anchor="middle">
<rect x="55" y="180" width="300" height="140" rx="25" fill="#112d44" stroke="#63e6ff" stroke-width="3"/><text x="205" y="224" fill="#63e6ff" font-size="19" font-weight="700">01　情境</text><text x="205" y="263" fill="#fff" font-size="24" font-weight="700">定義最低臨床服務</text><text x="205" y="296" fill="#b9c9e3" font-size="18">使用者・設備・時效</text>
<rect x="450" y="180" width="300" height="140" rx="25" fill="#24234f" stroke="#a997ff" stroke-width="3"/><text x="600" y="224" fill="#c9beff" font-size="19" font-weight="700">02　依賴</text><text x="600" y="263" fill="#fff" font-size="24" font-weight="700">盤點核心與回傳</text><text x="600" y="296" fill="#d7ceff" font-size="18">電源・時鐘・DNS・身分</text>
<rect x="845" y="180" width="300" height="140" rx="25" fill="#30283f" stroke="#ffd37a" stroke-width="3"/><text x="995" y="224" fill="#ffe4a8" font-size="19" font-weight="700">03　設計</text><text x="995" y="263" fill="#fff" font-size="24" font-weight="700">分平面與最小權限</text><text x="995" y="296" fill="#ffe4a8" font-size="18">SIM／憑證・管理隔離</text>
<path d="M355 250H440" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M750 250H835" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="845" y="430" width="300" height="140" rx="25" fill="#143743" stroke="#57f0c1" stroke-width="3"/><text x="995" y="474" fill="#8bf7d8" font-size="19" font-weight="700">04　試點</text><text x="995" y="513" fill="#fff" font-size="24" font-weight="700">代表性設備實測</text><text x="995" y="546" fill="#bafbe7" font-size="18">涵蓋・漫遊・延遲・拒絕</text>
<rect x="450" y="430" width="300" height="140" rx="25" fill="#153047" stroke="#71a7ff" stroke-width="3"/><text x="600" y="474" fill="#9cc3ff" font-size="19" font-weight="700">05　演練</text><text x="600" y="513" fill="#fff" font-size="24" font-weight="700">斷線、失憑證與復原</text><text x="600" y="546" fill="#c7dcff" font-size="18">降級・切換・重建・取證</text>
<rect x="55" y="430" width="300" height="140" rx="25" fill="#34203d" stroke="#ff7ab8" stroke-width="3"/><text x="205" y="474" fill="#ffc2df" font-size="19" font-weight="700">06　上線</text><text x="205" y="513" fill="#fff" font-size="24" font-weight="700">分批擴大與持續監測</text><text x="205" y="546" fill="#ffc2df" font-size="18">SLO・異常・例外・復測</text>
<path d="M995 320V420" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M845 500H760" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M450 500H365" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M205 430V375H600V330" fill="none" stroke="#ff7ab8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="600" y="652" fill="#94a3b8" font-size="18">回退條件：臨床交易失敗、管理面不可追查、身分撤銷未生效或回傳切換超過核定時間</text></g></g></svg>