<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 850" role="img" aria-labelledby="title desc"><title id="title">手機版威脅情資風險控制</title><desc id="desc">五種情資處置失敗情境及其控制與證據。</desc><rect width="390" height="850" rx="24" fill="#07111f"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">情資治理五種失敗模式</text><g font-size="15"><g><rect x="22" y="68" width="346" height="132" rx="18" fill="#111f35" stroke="#ff9fa8" stroke-width="2"/><text x="42" y="100" fill="#ffb7be" font-weight="700">過期 IOC 長期阻擋</text><text x="42" y="132" fill="#c9f7ff">控制：有效期、last-seen、撤銷</text><text x="42" y="164" fill="#caffeb">證據：過期自動停用率</text></g><g><rect x="22" y="212" width="346" height="132" rx="18" fill="#111f35" stroke="#ff9fa8" stroke-width="2"/><text x="42" y="244" fill="#ffb7be" font-weight="700">場域不適用造成誤報</text><text x="42" y="276" fill="#c9f7ff">控制：資產、版本、曝險關聯</text><text x="42" y="308" fill="#caffeb">證據：命中與排除理由</text></g><g><rect x="22" y="356" width="346" height="132" rx="18" fill="#111f35" stroke="#ff9fa8" stroke-width="2"/><text x="42" y="388" fill="#ffb7be" font-weight="700">分享敏感或非必要資料</text><text x="42" y="420" fill="#c9f7ff">控制：欄位白名單、去識別</text><text x="42" y="452" fill="#caffeb">證據：遮罩與分享紀錄</text></g><g><rect x="22" y="500" width="346" height="132" rx="18" fill="#111f35" stroke="#ff9fa8" stroke-width="2"/><text x="42" y="532" fill="#ffb7be" font-weight="700">自動封鎖中斷臨床服務</text><text x="42" y="564" fill="#c9f7ff">控制：分級門檻、例外、回退</text><text x="42" y="596" fill="#caffeb">證據：臨床影響與回退時間</text></g><g><rect x="22" y="644" width="346" height="132" rx="18" fill="#111f35" stroke="#ff9fa8" stroke-width="2"/><text x="42" y="676" fill="#ffb7be" font-weight="700">只接收情資，沒有結果回饋</text><text x="42" y="708" fill="#c9f7ff">控制：責任、期限、品質評分</text><text x="42" y="740" fill="#caffeb">證據：關閉率與回饋時效</text></g></g><text x="195" y="815" text-anchor="middle" fill="#ffcf99" font-size="15">先判斷與本院的關聯，再決定自動化程度</text></g></svg>