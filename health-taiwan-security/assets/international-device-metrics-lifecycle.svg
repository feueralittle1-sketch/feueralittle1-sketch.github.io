<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安量測治理閉環</title><desc id="desc">從決策問題到指標定義、資料驗證、分層分析、控制行動與重測校正的六步流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs><rect width="1200" height="720" rx="28" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="800" fill="#f4f8ff">六步把報表變成可驗證的治理閉環</text><g font-family="Inter,Noto Sans TC,sans-serif" text-anchor="middle"><g fill="#102742" stroke-width="2"><rect x="70" y="130" width="280" height="150" rx="22" stroke="#7aa7ff"/><rect x="460" y="130" width="280" height="150" rx="22" stroke="#67e8f9"/><rect x="850" y="130" width="280" height="150" rx="22" stroke="#5eead4"/><rect x="850" y="430" width="280" height="150" rx="22" stroke="#b8a7ff"/><rect x="460" y="430" width="280" height="150" rx="22" stroke="#fbbf24"/><rect x="70" y="430" width="280" height="150" rx="22" stroke="#fb7185"/></g><g fill="#f4f8ff" font-size="25" font-weight="800"><text x="210" y="180">1 決策問題</text><text x="600" y="180">2 指標定義</text><text x="990" y="180">3 資料驗證</text><text x="990" y="480">4 分層分析</text><text x="600" y="480">5 控制行動</text><text x="210" y="480">6 重測校正</text></g><g fill="#b8c8df" font-size="19"><text x="210" y="220">要加速、限制、接受</text><text x="210" y="250">還是汰換？</text><text x="600" y="220">分子／分母／計時點</text><text x="600" y="250">來源／責任／門檻</text><text x="990" y="220">版本、工單、遙測</text><text x="990" y="250">臨床紀錄交叉查核</text><text x="990" y="520">家族、嚴重度、院區</text><text x="990" y="550">臨床關鍵性與長尾</text><text x="600" y="520">補償控制、期限</text><text x="600" y="550">升級、接受或退場</text><text x="210" y="520">驗證結果與影響</text><text x="210" y="550">調整門檻與定義</text></g></g><g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"><path d="M350 205H445"/><path d="M740 205H835"/><path d="M990 280V415"/><path d="M850 505H755"/><path d="M460 505H365"/><path d="M210 430V325Q210 305 230 305H990Q1010 305 1010 325V350"/></g><text x="600" y="665" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="21" font-weight="700" fill="#67e8f9">每個紅燈都必須連到責任、期限、臨床替代與驗證證據</text></svg>