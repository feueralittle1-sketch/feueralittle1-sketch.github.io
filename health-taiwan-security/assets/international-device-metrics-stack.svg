<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">醫療設備資安指標五層架構</title><desc id="desc">製造商處置、院內部署、控制有效性、臨床影響與資料可信度共同形成醫療設備資安治理指標。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><text x="600" y="62" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="800" fill="#f4f8ff">漏洞數只是輸入：五層證據才能支援治理決策</text><g font-family="Inter,Noto Sans TC,sans-serif" filter="url(#s)"><rect x="90" y="120" width="1020" height="92" rx="22" fill="#102742" stroke="#7aa7ff" stroke-width="2"/><text x="145" y="158" font-size="25" font-weight="800" fill="#f4f8ff">01 製造商處置</text><text x="145" y="190" font-size="20" fill="#b8c8df">識別至修補時間｜已修補比例｜支援與公告品質</text><rect x="140" y="230" width="920" height="92" rx="22" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="195" y="268" font-size="25" font-weight="800" fill="#f4f8ff">02 院內部署</text><text x="195" y="300" font-size="20" fill="#b8c8df">適用性評估｜部署覆蓋｜逾期長尾｜例外期限</text><rect x="190" y="340" width="820" height="92" rx="22" fill="#102742" stroke="#5eead4" stroke-width="2"/><text x="245" y="378" font-size="25" font-weight="800" fill="#f4f8ff">03 控制有效性</text><text x="245" y="410" font-size="20" fill="#b8c8df">實機版本｜負向測試｜補償控制｜遙測可見度</text><rect x="240" y="450" width="720" height="92" rx="22" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="295" y="488" font-size="25" font-weight="800" fill="#f4f8ff">04 臨床影響</text><text x="295" y="520" font-size="20" fill="#b8c8df">設備可用性｜照護容量｜資料完整｜替代流程</text><rect x="290" y="560" width="620" height="92" rx="22" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="345" y="598" font-size="25" font-weight="800" fill="#f4f8ff">05 資料可信度</text><text x="345" y="630" font-size="20" fill="#b8c8df">固定分母｜未知比例｜來源驗證｜更新頻率</text></g><text x="600" y="706" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="21" font-weight="700" fill="#67e8f9">輸出：部署加速・補償控制・風險接受・汰換決策</text></svg>