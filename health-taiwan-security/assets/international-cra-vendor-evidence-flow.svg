<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫院供應商漏洞通報與關閉證據流程</title><desc id="desc">供應商通報進入單一入口後，經產品比對、臨床分級、控制決策、分批驗證與證據關閉，並由資安、資訊、醫工、臨床和採購共同負責。</desc>
<rect width="1200" height="760" rx="36" fill="#081426"/><text x="64" y="74" fill="#f4f8ff" font-size="36" font-weight="700">醫院需要把外部通報接成內部閉環</text><text x="64" y="114" fill="#9fb3d9" font-size="20">每一步都要有責任人、時間戳、輸入、輸出與回退條件</text>
<g font-size="20" font-weight="700" text-anchor="middle"><rect x="65" y="180" width="190" height="110" rx="22" fill="#15355a" stroke="#63e6ff" stroke-width="3"/><text x="160" y="226" fill="#fff">1 單一入口</text><text x="160" y="258" fill="#9fefff" font-size="16">供應商／CERT／主管機關</text><rect x="285" y="180" width="190" height="110" rx="22" fill="#182f4c" stroke="#71a7ff" stroke-width="3"/><text x="380" y="226" fill="#fff">2 資產比對</text><text x="380" y="258" fill="#b9d3ff" font-size="16">產品、版本、曝險</text><rect x="505" y="180" width="190" height="110" rx="22" fill="#30254d" stroke="#a997ff" stroke-width="3"/><text x="600" y="226" fill="#fff">3 臨床分級</text><text x="600" y="258" fill="#ddd6ff" font-size="16">可用性、完整性、病安</text><rect x="725" y="180" width="190" height="110" rx="22" fill="#123b37" stroke="#57f0c1" stroke-width="3"/><text x="820" y="226" fill="#fff">4 控制決策</text><text x="820" y="258" fill="#a9ffe5" font-size="16">隔離、補償、修補</text><rect x="945" y="180" width="190" height="110" rx="22" fill="#432f22" stroke="#ffbd7a" stroke-width="3"/><text x="1040" y="226" fill="#fff">5 驗證關閉</text><text x="1040" y="258" fill="#ffd9b5" font-size="16">回歸、監測、證據</text></g>
<g stroke="#8fe8ff" stroke-width="4" fill="none"><path d="M255 235H285"/><path d="M475 235H505"/><path d="M695 235H725"/><path d="M915 235H945"/></g>
<text x="64" y="370" fill="#f4f8ff" font-size="28" font-weight="700">責任鏈</text><g font-size="19"><rect x="65" y="405" width="1070" height="70" rx="18" fill="#0e233c"/><text x="100" y="448" fill="#63e6ff" font-weight="700">資安</text><text x="205" y="448" fill="#e6eefc">通報定界、威脅證據、監測條件</text><text x="520" y="448" fill="#71a7ff" font-weight="700">資訊／醫工</text><text x="670" y="448" fill="#e6eefc">版本盤點、維護窗口、技術回歸</text><rect x="65" y="492" width="1070" height="70" rx="18" fill="#0e233c"/><text x="100" y="535" fill="#a997ff" font-weight="700">臨床</text><text x="205" y="535" fill="#e6eefc">病人安全、降級流程、服務驗收</text><text x="520" y="535" fill="#57f0c1" font-weight="700">採購／法務</text><text x="670" y="535" fill="#e6eefc">通知條款、次處理者、證據與期限</text></g>
<rect x="65" y="610" width="1070" height="95" rx="22" fill="#112d31" stroke="#57f0c1" stroke-width="2"/><text x="600" y="648" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="700">關閉條件</text><text x="600" y="680" text-anchor="middle" fill="#f4f8ff" font-size="20">受影響資產已定界、暫行風險受控、修補完成臨床回歸、日誌可證明、例外有期限</text></svg>