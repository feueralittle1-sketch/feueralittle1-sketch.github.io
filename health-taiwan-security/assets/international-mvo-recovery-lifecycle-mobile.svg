<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1300" role="img" aria-labelledby="title desc"><title id="title">手機版醫療受控復原流程</title><desc id="desc">穩定局勢、定義最低可行運作、可信重建、分段重連、臨床驗證及長期修復六階段由上而下排列。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1300" rx="32" fill="url(#bg)"/><text x="40" y="60" fill="#fff" font-size="28" font-weight="700">受控復原六個放行閘門</text><text x="40" y="98" fill="#9fb3d9" font-size="18">任一閘門失敗，即停止擴大連線並回退</text><g font-family="sans-serif"><g fill="#12213d" stroke-width="2"><rect x="85" y="140" width="550" height="130" rx="24" stroke="#71a7ff"/><rect x="85" y="330" width="550" height="130" rx="24" stroke="#9c8cff"/><rect x="85" y="520" width="550" height="130" rx="24" stroke="#57f0c1"/><rect x="85" y="710" width="550" height="130" rx="24" stroke="#63e6ff"/><rect x="85" y="900" width="550" height="130" rx="24" stroke="#ffb86b"/><rect x="85" y="1090" width="550" height="130" rx="24" stroke="#f78fb3"/></g><g text-anchor="middle"><text x="360" y="187" fill="#71a7ff" font-size="22" font-weight="700">01 穩定局勢</text><text x="360" y="231" fill="#fff" font-size="19">隔離、事件指揮與證據保全</text><text x="360" y="377" fill="#b9aaff" font-size="22" font-weight="700">02 定義最低可行運作</text><text x="360" y="421" fill="#fff" font-size="19">臨床優先序與最低安全容量</text><text x="360" y="567" fill="#57f0c1" font-size="22" font-weight="700">03 可信重建</text><text x="360" y="611" fill="#fff" font-size="19">身分、金鑰、端點與備份基礎</text><text x="360" y="757" fill="#63e6ff" font-size="22" font-weight="700">04 分段重連</text><text x="360" y="801" fill="#fff" font-size="19">最小連線、持續監控與回退</text><text x="360" y="947" fill="#ffbf7a" font-size="22" font-weight="700">05 臨床驗證</text><text x="360" y="991" fill="#fff" font-size="19">功能、資料完整與工作流程回歸</text><text x="360" y="1137" fill="#f7a7c2" font-size="22" font-weight="700">06 長期修復</text><text x="360" y="1181" fill="#fff" font-size="19">消除根因、復盤與持續重驗</text></g><g stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M360 270V320"/><path d="M360 460V510"/><path d="M360 650V700"/><path d="M360 840V890"/><path d="M360 1030V1080"/></g></g><text x="360" y="1265" text-anchor="middle" fill="#57f0c1" font-size="18" font-weight="700">每階段皆保存證據、放行條件與回退路徑</text></svg>