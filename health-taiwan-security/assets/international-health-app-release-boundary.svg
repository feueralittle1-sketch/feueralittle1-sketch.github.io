<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">個人健康 App 病歷交付信任邊界</title><desc id="desc">病人提出請求後，醫院以身分、範圍與目的地確認閘門，將資料交付病人選定的應用程式，並保存獨立稽核證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17264a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="72" fill="#f8fbff" font-size="34" font-weight="800">個人健康 App 病歷交付：控制交付，不替外部 App 背書</text><text x="70" y="112" fill="#9fb3d9" font-size="19">交付前確認人、資料、目的地；交付後保留證據與事件聯絡點</text><rect x="70" y="190" width="210" height="220" rx="28" fill="#102844" stroke="#63e6ff" stroke-width="3"/><text x="175" y="245" text-anchor="middle" fill="#63e6ff" font-size="27" font-weight="800">病人</text><text x="105" y="305" fill="#e6eefc" font-size="21">提出資料請求</text><text x="105" y="345" fill="#e6eefc" font-size="21">選定接收 App</text><path d="M280 300H380" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="380" y="150" width="440" height="320" rx="30" fill="#172b48" stroke="#a997ff" stroke-width="3"/><text x="600" y="205" text-anchor="middle" fill="#d8d1ff" font-size="28" font-weight="800">醫院交付治理閘門</text><g fill="#e6eefc" font-size="21"><text x="430" y="265">① 身分與代理關係</text><text x="430" y="310">② 資料範圍與格式</text><text x="430" y="355">③ App／端點目的地</text><text x="430" y="400">④ 告知、傳輸與稽核</text></g><path d="M820 300H920" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><rect x="920" y="190" width="210" height="220" rx="28" fill="#26304c" stroke="#f2c94c" stroke-width="3"/><text x="1025" y="245" text-anchor="middle" fill="#ffe58a" font-size="27" font-weight="800">外部 App</text><text x="955" y="305" fill="#e6eefc" font-size="21">病人選擇</text><text x="955" y="345" fill="#e6eefc" font-size="21">法域另判</text><rect x="350" y="535" width="500" height="105" rx="24" fill="#10363a" stroke="#57f0c1" stroke-width="3"/><text x="600" y="578" text-anchor="middle" fill="#7ff5d2" font-size="24" font-weight="800">獨立證據面</text><text x="600" y="615" text-anchor="middle" fill="#d7fdf1" font-size="19">請求人、範圍、時間、目的地、結果、例外與撤權事件</text><path d="M600 470V535" stroke="#57f0c1" stroke-width="4" stroke-dasharray="10 8"/><text x="600" y="684" text-anchor="middle" fill="#9fb3d9" font-size="18">外部 App 的後續蒐集、分享與事件義務，應依其法域、契約與實際角色另行判定</text></svg>