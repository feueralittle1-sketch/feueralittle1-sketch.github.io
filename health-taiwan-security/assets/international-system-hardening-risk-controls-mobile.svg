<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 950" role="img" aria-labelledby="title desc">
  <title id="title">醫療系統硬化風險與控制手機版</title><desc id="desc">列出通用基線誤用、未核准漂移、掃描盲點、永久例外與服務中斷的控制與證據。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102343"/></linearGradient></defs><rect width="390" height="950" rx="24" fill="url(#bg)"/>
  <text x="24" y="44" fill="#f5f8ff" font-size="22" font-weight="700">硬化風險、控制與證據</text><text x="24" y="72" fill="#9eb7d8" font-size="15">掃描符合不等於臨床安全。</text>
  <g font-family="sans-serif">
    <g transform="translate(24 105)"><rect width="342" height="145" rx="20" fill="#0c1d34" stroke="#ff9bc2"/><text x="18" y="34" fill="#ffb0cf" font-size="18" font-weight="700">照搬通用基線</text><text x="18" y="68" fill="#e8edff" font-size="15">控制：依用途與設備能力調整</text><text x="18" y="99" fill="#d8fff1" font-size="15">證據：差異表＋風險核准</text><text x="18" y="128" fill="#9eb7d8" font-size="14">確認相容性與臨床依賴</text></g>
    <g transform="translate(24 270)"><rect width="342" height="145" rx="20" fill="#11233d" stroke="#ff9bc2"/><text x="18" y="34" fill="#ffb0cf" font-size="18" font-weight="700">未核准設定漂移</text><text x="18" y="68" fill="#e8edff" font-size="15">控制：版本化基線與持續比對</text><text x="18" y="99" fill="#d8fff1" font-size="15">證據：差異事件＋責任軌跡</text><text x="18" y="128" fill="#9eb7d8" font-size="14">連結維護與變更來源</text></g>
    <g transform="translate(24 435)"><rect width="342" height="145" rx="20" fill="#0c1d34" stroke="#ff9bc2"/><text x="18" y="34" fill="#ffb0cf" font-size="18" font-weight="700">只看掃描符合率</text><text x="18" y="68" fill="#e8edff" font-size="15">控制：負向測試、效能與臨床回歸</text><text x="18" y="99" fill="#d8fff1" font-size="15">證據：測試結果＋臨床簽核</text><text x="18" y="128" fill="#9eb7d8" font-size="14">工具結果須由服務情境驗證</text></g>
    <g transform="translate(24 600)"><rect width="342" height="145" rx="20" fill="#11233d" stroke="#ff9bc2"/><text x="18" y="34" fill="#ffb0cf" font-size="18" font-weight="700">例外永久存在</text><text x="18" y="68" fill="#e8edff" font-size="15">控制：補償措施、到期日與替換路線</text><text x="18" y="99" fill="#d8fff1" font-size="15">證據：到期複查＋退場紀錄</text><text x="18" y="128" fill="#9eb7d8" font-size="14">例外必須有關閉條件</text></g>
    <g transform="translate(24 765)"><rect width="342" height="155" rx="20" fill="#0c1d34" stroke="#ff9bc2"/><text x="18" y="34" fill="#ffb0cf" font-size="18" font-weight="700">硬化造成服務中斷</text><text x="18" y="68" fill="#e8edff" font-size="15">控制：分批部署、停止與回退劇本</text><text x="18" y="99" fill="#d8fff1" font-size="15">證據：回退演練＋復原時間</text><text x="18" y="130" fill="#9eb7d8" font-size="14">持續監測介接與臨床錯誤</text></g>
  </g>
</svg>
