<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">醫院電信中斷切換流程手機版</title><desc id="desc">六個垂直步驟說明通訊中斷時的切換與恢復。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151d42"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="720" height="1200" fill="url(#bg)"/><text x="50" y="64" fill="#fff" font-size="29" font-weight="800">通訊中斷六步切換流程</text><text x="50" y="100" fill="#9fb3d9" font-size="18">技術修復與臨床通訊並行</text><g font-family="sans-serif"><g fill="#102844" stroke="#63e6ff" stroke-width="3"><rect x="70" y="145" width="580" height="125" rx="24"/><rect x="70" y="315" width="580" height="125" rx="24"/><rect x="70" y="485" width="580" height="125" rx="24"/><rect x="70" y="655" width="580" height="125" rx="24"/><rect x="70" y="825" width="580" height="125" rx="24"/><rect x="70" y="995" width="580" height="125" rx="24"/></g><g font-size="22" font-weight="800"><text x="105" y="195" fill="#63e6ff">1</text><text x="150" y="195" fill="#fff">確認範圍</text><text x="150" y="232" fill="#c6d4eb" font-size="18" font-weight="400">網路、電信、雲端或身分服務</text><text x="105" y="365" fill="#71a7ff">2</text><text x="150" y="365" fill="#fff">啟動指揮</text><text x="150" y="402" fill="#c6d4eb" font-size="18" font-weight="400">唯一頻道、角色卡與紙本紀錄</text><text x="105" y="535" fill="#a997ff">3</text><text x="150" y="535" fill="#fff">切換替代管道</text><text x="150" y="572" fill="#c6d4eb" font-size="18" font-weight="400">第二電信商、無線電或衛星</text><text x="105" y="705" fill="#57f0c1">4</text><text x="150" y="705" fill="#fff">保護有限容量</text><text x="150" y="742" fill="#c6d4eb" font-size="18" font-weight="400">急診、轉送、設施與指揮優先</text><text x="105" y="875" fill="#f2c94c">5</text><text x="150" y="875" fill="#fff">持續驗證</text><text x="150" y="912" fill="#c6d4eb" font-size="18" font-weight="400">送達、電力、容量與未聯絡單位</text><text x="105" y="1045" fill="#63e6ff">6</text><text x="150" y="1045" fill="#fff">分段恢復</text><text x="150" y="1082" fill="#c6d4eb" font-size="18" font-weight="400">驗證語音、資料、身分與紀錄</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M360 270V305"/><path d="M360 440V475"/><path d="M360 610V645"/><path d="M360 780V815"/><path d="M360 950V985"/></g><text x="360" y="1168" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">記錄切換時間・送達率・容量缺口・恢復對帳</text></g></svg>