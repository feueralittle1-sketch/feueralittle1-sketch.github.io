<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">基因資料受控分析信任邊界</title><desc id="desc">原始基因資料經身分、用途與環境核准後進入受控分析區，只允許通過揭露審查的結果輸出。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132451"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="64" y="72" fill="#f8fbff" font-size="36" font-weight="800">基因資料受控分析：資料不直接交付，結果才可離開</text><text x="64" y="112" fill="#9fb8dc" font-size="22">把永久識別風險、研究用途與技術存取放進同一條證據鏈</text>
<rect x="70" y="185" width="250" height="350" rx="28" fill="#102746" stroke="#58d8ff" stroke-width="3"/><text x="195" y="235" text-anchor="middle" fill="#77e5ff" font-size="28" font-weight="700">資料來源</text><text x="195" y="300" text-anchor="middle" fill="#fff" font-size="26">檢體與定序</text><text x="195" y="350" text-anchor="middle" fill="#fff" font-size="26">臨床表型</text><text x="195" y="400" text-anchor="middle" fill="#fff" font-size="26">研究同意</text><text x="195" y="470" text-anchor="middle" fill="#a9bddb" font-size="21">分類、標記、加密</text>
<path d="M330 360H435" stroke="#65e6ff" stroke-width="8" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#65e6ff"/></marker></defs>
<rect x="445" y="150" width="430" height="430" rx="34" fill="#17294d" stroke="#a491ff" stroke-width="4" filter="url(#glow)"/><text x="660" y="205" text-anchor="middle" fill="#c3b8ff" font-size="30" font-weight="800">受控分析環境</text><rect x="500" y="240" width="320" height="64" rx="18" fill="#253965"/><text x="660" y="282" text-anchor="middle" fill="#fff" font-size="24">身分＋機構驗證</text><rect x="500" y="325" width="320" height="64" rx="18" fill="#253965"/><text x="660" y="367" text-anchor="middle" fill="#fff" font-size="24">用途與資料使用限制</text><rect x="500" y="410" width="320" height="64" rx="18" fill="#253965"/><text x="660" y="452" text-anchor="middle" fill="#fff" font-size="24">隔離運算＋完整稽核</text><text x="660" y="530" text-anchor="middle" fill="#9fb8dc" font-size="21">禁止未核准下載與再識別</text>
<path d="M885 360H980" stroke="#72f0c1" stroke-width="8" marker-end="url(#b)"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#72f0c1"/></marker></defs>
<rect x="990" y="210" width="160" height="300" rx="28" fill="#123a3c" stroke="#72f0c1" stroke-width="3"/><text x="1070" y="260" text-anchor="middle" fill="#82f7cc" font-size="27" font-weight="700">輸出閘門</text><text x="1070" y="330" text-anchor="middle" fill="#fff" font-size="23">揭露審查</text><text x="1070" y="380" text-anchor="middle" fill="#fff" font-size="23">最小結果</text><text x="1070" y="430" text-anchor="middle" fill="#fff" font-size="23">可追溯核准</text>
<rect x="70" y="615" width="1080" height="58" rx="18" fill="#0b1d36" stroke="#263e62"/><text x="610" y="652" text-anchor="middle" fill="#d8e6fa" font-size="23">核心原則：基因資料具有長期識別性；撤權、輸出控制與異常處置必須持續有效</text></svg>