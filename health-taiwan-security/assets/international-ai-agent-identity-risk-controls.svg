<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">AI Agent 身分風險與控制矩陣</title><desc id="desc">共用人類帳號、長效憑證、過度委派、不可追溯及停用不完全五種風險，對應代理身分、短效憑證、情境授權、不可竄改日誌與撤銷測試。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081724"/><stop offset="1" stop-color="#171438"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="64" y="70" fill="#fff" font-size="34" font-weight="800">風險、控制與驗收證據</text><text x="64" y="108" fill="#9fb3d9" font-size="20">不是只看權限設定，而是確認失效條件真的生效</text><g font-family="Arial,'Noto Sans TC',sans-serif"><g font-size="20" font-weight="800"><rect x="62" y="150" width="310" height="62" rx="16" fill="#40203c"/><rect x="390" y="150" width="350" height="62" rx="16" fill="#153746"/><rect x="758" y="150" width="380" height="62" rx="16" fill="#292550"/><text x="82" y="190" fill="#ffb4d1">失敗模式</text><text x="410" y="190" fill="#82edff">必要控制</text><text x="778" y="190" fill="#c9c2ff">驗收證據</text></g><g fill="#111f35" stroke="#ffffff" stroke-opacity=".1"><rect x="62" y="228" width="1076" height="78" rx="14"/><rect x="62" y="318" width="1076" height="78" rx="14"/><rect x="62" y="408" width="1076" height="78" rx="14"/><rect x="62" y="498" width="1076" height="78" rx="14"/><rect x="62" y="588" width="1076" height="78" rx="14"/></g><g font-size="18"><g fill="#ffd0df"><text x="82" y="274">共用人類帳號</text><text x="82" y="364">長效秘密寫入程式</text><text x="82" y="454">一次授權涵蓋所有工具</text><text x="82" y="544">只留模型輸出</text><text x="82" y="634">代理停用但權限仍在</text></g><g fill="#bcecf5"><text x="410" y="274">每個代理與環境獨立身分</text><text x="410" y="364">受管短效憑證與自動輪替</text><text x="410" y="454">依任務、資料與動作縮限</text><text x="410" y="544">記錄意圖、授權、工具與結果</text><text x="410" y="634">集中撤銷與依賴清冊</text></g><g fill="#d5d0ff"><text x="778" y="274">人員操作與代理操作可區分</text><text x="778" y="364">外洩憑證逾期後不可使用</text><text x="778" y="454">未核准動作遭政策拒絕</text><text x="778" y="544">可還原誰在何時授權何事</text><text x="778" y="634">停用後所有工具同步拒絕</text></g></g></g></svg>