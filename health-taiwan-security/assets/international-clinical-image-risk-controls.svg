<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">臨床影像風險與控制對照</title><desc id="desc">將個人裝置殘留、病人錯配、用途漂移、過度匯出與刪除失敗，分別對應受管拍攝、雙重核對、用途分區、匯出閘門及副本驗證。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#182247"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="64" y="76" fill="#fff" font-size="38" font-weight="800">臨床影像風險與控制對照</text><text x="64" y="116" fill="#9fb3d9" font-size="20">每項風險都要有預防、偵測與關閉證據</text><rect x="64" y="170" width="1072" height="470" rx="26" fill="#0d213b" stroke="#324c70" stroke-width="2"/><text x="110" y="220" fill="#ffb4c6" font-size="23" font-weight="800">風險</text><text x="430" y="220" fill="#63e6ff" font-size="23" font-weight="800">主要控制</text><text x="875" y="220" fill="#57f0c1" font-size="23" font-weight="800">驗收證據</text><g fill="#c6d4eb" font-size="20"><text x="110" y="282">個人裝置與雲端殘留</text><text x="430" y="282">受管裝置、自動上傳、禁止本機備份</text><text x="875" y="282">抽查相簿與同步設定</text><text x="110" y="354">病人或部位錯配</text><text x="430" y="354">床邊雙重核對、立即綁定案件</text><text x="875" y="354">影像與病歷一致率</text><text x="110" y="426">教學、研究用途漂移</text><text x="430" y="426">用途分區、去識別、重新核准</text><text x="875" y="426">跨用途存取紀錄</text><text x="110" y="498">大量匯出與非核准分享</text><text x="430" y="498">匯出閘門、浮水印、異常告警</text><text x="875" y="498">匯出人、對象、檔案數</text><text x="110" y="570">到期刪除但副本仍存在</text><text x="430" y="570">保存規則、例外到期、全路徑刪除</text><text x="875" y="570">刪除報告與殘留掃描</text></g><g stroke="#324c70" stroke-width="1"><path d="M94 244H1106M94 316H1106M94 388H1106M94 460H1106M94 532H1106M94 604H1106"/></g></g></svg>