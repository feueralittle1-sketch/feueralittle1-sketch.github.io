<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">資安事件下的病人分流觸發流程</title>
  <desc id="desc">從偵測臨床服務受影響開始，確認安全照護能力，再依容量與時效決定留院降級、延後服務或跨院轉診，最後持續複核。</desc>
  <rect width="1200" height="720" rx="36" fill="#081524"/>
  <text x="600" y="62" fill="#f4f8ff" font-size="34" font-weight="800" text-anchor="middle">病人分流不是臨時打電話：五個觸發閘門</text>
  <g font-family="Inter,Noto Sans TC,sans-serif">
    <rect x="70" y="145" width="190" height="145" rx="26" fill="#123047" stroke="#63e6ff" stroke-width="3"/><text x="165" y="190" fill="#63e6ff" font-size="25" font-weight="800" text-anchor="middle">1 發現衝擊</text><text x="165" y="230" fill="#e6eefc" font-size="19" text-anchor="middle">系統不可用</text><text x="165" y="260" fill="#e6eefc" font-size="19" text-anchor="middle">資料可信度不足</text>
    <rect x="300" y="145" width="190" height="145" rx="26" fill="#182849" stroke="#9bbcff" stroke-width="3"/><text x="395" y="190" fill="#b8ceff" font-size="25" font-weight="800" text-anchor="middle">2 臨床判定</text><text x="395" y="230" fill="#e6eefc" font-size="19" text-anchor="middle">可安全照護？</text><text x="395" y="260" fill="#e6eefc" font-size="19" text-anchor="middle">可維持多久？</text>
    <rect x="530" y="145" width="190" height="145" rx="26" fill="#2c2447" stroke="#b29cff" stroke-width="3"/><text x="625" y="190" fill="#d4c8ff" font-size="25" font-weight="800" text-anchor="middle">3 容量確認</text><text x="625" y="230" fill="#e6eefc" font-size="19" text-anchor="middle">床位與專科</text><text x="625" y="260" fill="#e6eefc" font-size="19" text-anchor="middle">轉運與接收條件</text>
    <rect x="760" y="145" width="190" height="145" rx="26" fill="#352918" stroke="#ffd166" stroke-width="3"/><text x="855" y="190" fill="#ffd166" font-size="25" font-weight="800" text-anchor="middle">4 分流決策</text><text x="855" y="230" fill="#e6eefc" font-size="19" text-anchor="middle">留院／延後</text><text x="855" y="260" fill="#e6eefc" font-size="19" text-anchor="middle">跨院轉診</text>
    <rect x="990" y="145" width="150" height="145" rx="26" fill="#15382f" stroke="#57f0c1" stroke-width="3"/><text x="1065" y="190" fill="#57f0c1" font-size="25" font-weight="800" text-anchor="middle">5 複核</text><text x="1065" y="230" fill="#e6eefc" font-size="19" text-anchor="middle">固定節奏</text><text x="1065" y="260" fill="#e6eefc" font-size="19" text-anchor="middle">回復或升級</text>
    <g stroke="#8fe8ff" stroke-width="5"><path d="M260 217H300"/><path d="M490 217H530"/><path d="M720 217H760"/><path d="M950 217H990"/></g>
    <rect x="110" y="385" width="980" height="210" rx="30" fill="#0e2137" stroke="#29476b" stroke-width="2"/>
    <text x="150" y="432" fill="#8fe8ff" font-size="24" font-weight="800">每一個決策包必須包含</text>
    <text x="155" y="482" fill="#e6eefc" font-size="22">• 受影響服務、替代流程與預估持續時間</text>
    <text x="155" y="526" fill="#e6eefc" font-size="22">• 病人優先序、接收條件、運送方式與責任窗口</text>
    <text x="155" y="570" fill="#e6eefc" font-size="22">• 決策時間、核准角色、通知對象與下一次複核時間</text>
    <text x="600" y="650" fill="#a9bdd8" font-size="21" text-anchor="middle">目標不是把病人移走，而是在資訊不足時仍維持可解釋、可追蹤的安全照護</text>
  </g>
</svg>