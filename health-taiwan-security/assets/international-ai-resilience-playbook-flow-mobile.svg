<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 860" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧韌性劇本流程手機版</title><desc id="desc">盤點觸點、定義衝擊、配置控制、演練失效、受控恢復與證據重驗的六階段垂直流程。</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111d42"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#72ddff"/></marker></defs><rect width="390" height="860" rx="24" fill="url(#b)"/><g font-family="Noto Sans TC, sans-serif"><text x="24" y="42" fill="#fff" font-size="22" font-weight="800">AI 韌性劇本六階段</text><text x="24" y="70" fill="#abc0df" font-size="15">每一步都留下責任、門檻與證據</text><g text-anchor="middle"><rect x="48" y="98" width="294" height="86" rx="18" fill="#133453" stroke="#45d7ff" stroke-width="2"/><text x="195" y="130" fill="#7eeaff" font-size="18" font-weight="800">1 盤點觸點</text><text x="195" y="158" fill="#dce8f7" font-size="15">用途・資料・模型・供應商・權限</text><path d="M195 186V211" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="218" width="294" height="86" rx="18" fill="#173050" stroke="#7ba7ff" stroke-width="2"/><text x="195" y="250" fill="#a8c4ff" font-size="18" font-weight="800">2 定義衝擊</text><text x="195" y="278" fill="#dce8f7" font-size="15">病人安全・延遲・錯誤與中斷門檻</text><path d="M195 306V331" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="338" width="294" height="86" rx="18" fill="#26305c" stroke="#a38cff" stroke-width="2"/><text x="195" y="370" fill="#c4b9ff" font-size="18" font-weight="800">3 配置控制</text><text x="195" y="398" fill="#dce8f7" font-size="15">人工覆核・最小權限・隔離・監測</text><path d="M195 426V451" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="458" width="294" height="98" rx="18" fill="#293059" stroke="#ff9ad8" stroke-width="2"/><text x="195" y="490" fill="#ffb6e2" font-size="18" font-weight="800">4 演練失效</text><text x="195" y="518" fill="#dce8f7" font-size="15">中斷・錯誤・資料污染</text><text x="195" y="541" fill="#dce8f7" font-size="15">提示攻擊・供應商終止</text><path d="M195 558V583" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="590" width="294" height="86" rx="18" fill="#183d4a" stroke="#5be7ba" stroke-width="2"/><text x="195" y="622" fill="#7df1c9" font-size="18" font-weight="800">5 受控恢復</text><text x="195" y="650" fill="#dce8f7" font-size="15">停用・回退・替代・分批恢復</text><path d="M195 678V703" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/><rect x="48" y="710" width="294" height="86" rx="18" fill="#16384f" stroke="#5bd6ee" stroke-width="2"/><text x="195" y="742" fill="#7ee8fa" font-size="18" font-weight="800">6 證據重驗</text><text x="195" y="770" fill="#dce8f7" font-size="15">版本・紀錄・成效・剩餘風險</text></g><text x="195" y="830" text-anchor="middle" fill="#9eb5d5" font-size="14">事件、漂移與變更會觸發下一輪</text></g></svg>