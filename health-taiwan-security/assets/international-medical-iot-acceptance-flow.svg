<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">醫療 IoT 補償控制驗收流程</title>
  <desc id="desc">從臨床用途與傷害情境，經控制成果、裝置能力、補償控制、測試與期限治理完成驗收。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081424"/><stop offset="1" stop-color="#192449"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-opacity=".35"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#72e6ff"/></marker></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="60" y="65" fill="#f3f8ff" font-size="34" font-weight="800">補償控制要驗收結果，不是補一張設備單</text>
  <text x="60" y="104" fill="#a9bddc" font-size="20">先定義必要成果，再決定由裝置、網路、身分或流程承擔</text>
  <g filter="url(#s)" font-family="sans-serif">
    <rect x="70" y="165" width="240" height="120" rx="24" fill="#30275d" stroke="#aa9cff" stroke-width="2"/>
    <text x="96" y="207" fill="#e4ddff" font-size="22" font-weight="800">1 臨床用途與傷害</text><text x="96" y="244" fill="#fff" font-size="18">病人、流程、停機與資料風險</text>
    <rect x="365" y="165" width="240" height="120" rx="24" fill="#123f59" stroke="#63e6ff" stroke-width="2"/>
    <text x="391" y="207" fill="#c8f8ff" font-size="22" font-weight="800">2 必要控制成果</text><text x="391" y="244" fill="#fff" font-size="18">識別、保護、偵測、復原</text>
    <rect x="660" y="165" width="240" height="120" rx="24" fill="#30275d" stroke="#aa9cff" stroke-width="2"/>
    <text x="686" y="207" fill="#e4ddff" font-size="22" font-weight="800">3 盤點原生能力</text><text x="686" y="244" fill="#fff" font-size="18">版本、介面、更新、日誌</text>
    <rect x="955" y="165" width="175" height="120" rx="24" fill="#15334a" stroke="#57f0c1" stroke-width="2"/>
    <text x="982" y="207" fill="#c9ffe9" font-size="22" font-weight="800">能力足夠？</text><text x="982" y="244" fill="#fff" font-size="18">逐項比對</text>
  </g>
  <path d="M310 225H358" stroke="#72e6ff" stroke-width="5" marker-end="url(#a)"/><path d="M605 225H653" stroke="#72e6ff" stroke-width="5" marker-end="url(#a)"/><path d="M900 225H948" stroke="#72e6ff" stroke-width="5" marker-end="url(#a)"/>
  <text x="1050" y="326" fill="#85ffc8" font-size="19" font-weight="700">是</text><path d="M1042 285V362H900" stroke="#57f0c1" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <text x="948" y="326" fill="#ffb2c0" font-size="19" font-weight="700">否</text><path d="M980 285V362H682" stroke="#ff8aa1" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="365" y="378" width="285" height="135" rx="24" fill="#4a2337" stroke="#ff8aa1" stroke-width="2"/>
    <text x="396" y="421" fill="#ffd2da" font-size="22" font-weight="800">4 設計補償控制</text><text x="396" y="457" fill="#fff" font-size="18">分段、代理、白名單、監測</text><text x="396" y="488" fill="#cbd5e8" font-size="17">指定責任人與失效模式</text>
    <rect x="690" y="378" width="285" height="135" rx="24" fill="#123f59" stroke="#63e6ff" stroke-width="2"/>
    <text x="721" y="421" fill="#c8f8ff" font-size="22" font-weight="800">5 安全與臨床測試</text><text x="721" y="457" fill="#fff" font-size="18">負向連線、告警、隔離</text><text x="721" y="488" fill="#cbd5e8" font-size="17">正常功能、停機與回復</text>
  </g>
  <path d="M650 445H683" stroke="#72e6ff" stroke-width="5" marker-end="url(#a)"/>
  <path d="M900 362V372" stroke="#57f0c1" stroke-width="4" marker-end="url(#a)"/>
  <rect x="198" y="593" width="804" height="105" rx="27" fill="#0c2036" stroke="#7b9bc9" stroke-width="2"/>
  <text x="233" y="636" fill="#fff" font-size="23" font-weight="800">6 放行證據：測試結果、控制擁有者、監測指標、例外期限、重新評估觸發條件</text>
  <text x="233" y="672" fill="#abc0dd" font-size="18">設備版本、網路、供應商支援或臨床用途改變時，重新走一次流程。</text>
  <path d="M832 513V584" stroke="#72e6ff" stroke-width="5" marker-end="url(#a)"/>
</svg>
