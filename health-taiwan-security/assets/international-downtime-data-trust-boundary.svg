<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">停機資料可信復原邊界</title><desc id="desc">停機前可信快照、停機期間紙本與離線紀錄、復原後系統資料，必須通過臨床對帳閘門才能成為正式病歷。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="80" fill="#fff" font-size="38" font-weight="800">停機資料可信復原邊界</text><text x="70" y="122" fill="#9fb3d9" font-size="22">系統恢復可用，不代表停機期間資料已完整、正確且可安全使用</text><g font-family="system-ui,'Noto Sans TC',sans-serif"><rect x="65" y="190" width="300" height="170" rx="24" fill="#132d4f" stroke="#63e6ff" stroke-width="3"/><text x="215" y="235" text-anchor="middle" fill="#63e6ff" font-size="25" font-weight="700">停機前可信狀態</text><text x="215" y="282" text-anchor="middle" fill="#fff" font-size="24">最後已知良好快照</text><text x="215" y="322" text-anchor="middle" fill="#c6d4eb" font-size="20">病人身分・醫囑・結果・用藥</text><rect x="65" y="410" width="300" height="170" rx="24" fill="#2a244b" stroke="#a997ff" stroke-width="3"/><text x="215" y="455" text-anchor="middle" fill="#c7b8ff" font-size="25" font-weight="700">停機期間紀錄</text><text x="215" y="502" text-anchor="middle" fill="#fff" font-size="24">紙本・離線・設備暫存</text><text x="215" y="542" text-anchor="middle" fill="#d7cff6" font-size="20">簽名・時間・來源・處置狀態</text><rect x="465" y="260" width="285" height="250" rx="28" fill="#0e3a43" stroke="#57f0c1" stroke-width="4" filter="url(#glow)"/><text x="607" y="310" text-anchor="middle" fill="#57f0c1" font-size="27" font-weight="800">臨床對帳閘門</text><text x="607" y="363" text-anchor="middle" fill="#fff" font-size="22">身分與就醫事件對應</text><text x="607" y="405" text-anchor="middle" fill="#fff" font-size="22">醫囑／結果／給藥比對</text><text x="607" y="447" text-anchor="middle" fill="#fff" font-size="22">重複、缺漏、衝突分流</text><text x="607" y="489" text-anchor="middle" fill="#bdf8e7" font-size="20">雙人覆核・例外佇列・證據</text><rect x="850" y="260" width="285" height="250" rx="28" fill="#17345e" stroke="#71a7ff" stroke-width="4"/><text x="992" y="310" text-anchor="middle" fill="#9cc4ff" font-size="27" font-weight="800">受控正式病歷</text><text x="992" y="363" text-anchor="middle" fill="#fff" font-size="22">已驗證資料分批回寫</text><text x="992" y="405" text-anchor="middle" fill="#fff" font-size="22">未解例外保持隔離</text><text x="992" y="447" text-anchor="middle" fill="#fff" font-size="22">臨床服務逐項放行</text><text x="992" y="489" text-anchor="middle" fill="#c8d9f3" font-size="20">保留來源、操作者與驗證軌跡</text><path d="M365 275H448" stroke="#63e6ff" stroke-width="6"/><path d="M365 495H448" stroke="#a997ff" stroke-width="6"/><path d="M750 385H832" stroke="#57f0c1" stroke-width="7"/><path d="M438 263l20 12-20 12M438 483l20 12-20 12M822 373l20 12-20 12" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="5"/><rect x="70" y="630" width="1060" height="48" rx="16" fill="#091a30" stroke="#29496f"/><text x="600" y="662" text-anchor="middle" fill="#d7e5f7" font-size="21">放行條件：完整性可說明・衝突已處置・高風險紀錄已覆核・回寫可追溯</text></g></svg>