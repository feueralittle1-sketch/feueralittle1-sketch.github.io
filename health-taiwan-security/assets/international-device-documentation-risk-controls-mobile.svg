<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1230" role="img" aria-labelledby="title desc">
<title id="title">醫療設備安全文件失效風險與控制</title><desc id="desc">版本失配、場域落差、責任空白與變更失聯的控制卡片。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#0c2340"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs>
<rect width="390" height="1230" rx="28" fill="url(#bg)"/>
<text x="195" y="48" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="26" font-weight="700" fill="#f4f8ff">四類失效風險</text><rect x="25" y="80" width="340" height="245" rx="20" fill="#102742" stroke="#fb7185" stroke-width="2"/><text x="195" y="125" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">版本失配</text><text x="195" y="160" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">文件對不到實際韌體或雲端</text><text x="195" y="205" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">資產指紋</text><text x="195" y="233" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">版本基線</text><text x="195" y="261" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">差異清單</text><rect x="25" y="355" width="340" height="245" rx="20" fill="#102742" stroke="#fbbf24" stroke-width="2"/><text x="195" y="400" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">場域落差</text><text x="195" y="435" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">預設網路與院內部署不同</text><text x="195" y="480" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">隔離測試</text><text x="195" y="508" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">連線白名單</text><text x="195" y="536" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">臨床回歸</text><rect x="25" y="630" width="340" height="245" rx="20" fill="#102742" stroke="#b8a7ff" stroke-width="2"/><text x="195" y="675" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">責任空白</text><text x="195" y="710" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">更新、事件與遠端維護無主責</text><text x="195" y="755" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">RACI</text><text x="195" y="783" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">時限</text><text x="195" y="811" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">供應商會話證據</text><rect x="25" y="905" width="340" height="245" rx="20" fill="#102742" stroke="#67e8f9" stroke-width="2"/><text x="195" y="950" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="24" font-weight="800" fill="#f4f8ff">變更失聯</text><text x="195" y="985" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="17" font-weight="500" fill="#b8c8df">更新後文件、組態與監測未同步</text><text x="195" y="1030" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">變更觸發器</text><text x="195" y="1058" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">重驗</text><text x="195" y="1086" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="650" fill="#5eead4">例外到期</text></svg>