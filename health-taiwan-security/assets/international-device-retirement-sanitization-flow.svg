<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療設備退役與資料清除決策流程</title>
<desc id="desc">以臨床停用確認、資料盤點、媒體風險、清除方法、驗證、例外與外移放行組成的七階段流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061321"/><stop offset="1" stop-color="#151d43"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#63e6ff"/></marker></defs><rect width="1200" height="760" rx="36" fill="url(#bg)"/>
<text x="65" y="76" fill="#fff" font-size="38" font-weight="800">七階段退役流程：先停止信任，再允許資產外移</text><text x="65" y="115" fill="#9fb3d9" font-size="20">清除方法應依媒體特性、資料敏感度、設備後續用途與可驗證性決定</text>
<g font-family="Noto Sans TC, sans-serif"><g fill="#102941" stroke="#4aa9cb" stroke-width="2"><rect x="60" y="180" width="245" height="125" rx="23"/><rect x="355" y="180" width="245" height="125" rx="23"/><rect x="650" y="180" width="245" height="125" rx="23"/><rect x="945" y="180" width="195" height="125" rx="23"/></g>
<g fill="#63e6ff" font-size="18" font-weight="700"><text x="85" y="215">01 臨床停用</text><text x="380" y="215">02 完整盤點</text><text x="675" y="215">03 方法決策</text><text x="970" y="215">04 執行</text></g><g fill="#fff" font-size="19"><text x="85" y="252">替代服務已驗收</text><text x="85" y="280">變更與斷線有窗口</text><text x="380" y="252">本機、媒體、雲端</text><text x="380" y="280">帳號、憑證、備份</text><text x="675" y="252">Clear／Purge／Destroy</text><text x="675" y="280">或核准之等效方法</text><text x="970" y="252">受控工具與人員</text><text x="970" y="280">保存操作紀錄</text></g>
<g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M305 243H340"/><path d="M600 243H635"/><path d="M895 243H930"/></g>
<rect x="185" y="395" width="300" height="145" rx="25" fill="#1a2d57" stroke="#a997ff" stroke-width="3"/><text x="215" y="435" fill="#d9d1ff" font-size="19" font-weight="700">05 驗證與抽驗</text><text x="215" y="475" fill="#fff" font-size="20">工具結果不是唯一證據</text><text x="215" y="510" fill="#c6d4eb" font-size="18">確認媒體、範圍、錯誤與可讀性</text>
<polygon points="600,385 745,468 600,551 455,468" fill="#123b43" stroke="#57f0c1" stroke-width="3"/><text x="535" y="455" fill="#57f0c1" font-size="19" font-weight="700">驗證通過？</text><text x="520" y="488" fill="#fff" font-size="18">資料不可合理復原</text>
<rect x="790" y="395" width="320" height="145" rx="25" fill="#123447" stroke="#57f0c1" stroke-width="3"/><text x="820" y="435" fill="#57f0c1" font-size="19" font-weight="700">06 撤銷與放行</text><text x="820" y="475" fill="#fff" font-size="20">帳號、憑證、網路同步關閉</text><text x="820" y="510" fill="#c6d4eb" font-size="18">設備、媒體與證據一起完成交接</text>
<path d="M1035 305V365H760V410" fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M485 468H445" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M745 468H775" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><text x="750" y="448" fill="#57f0c1" font-size="18">是</text>
<rect x="185" y="610" width="925" height="90" rx="22" fill="#341d35" stroke="#ff8ac7" stroke-width="2"/><text x="220" y="648" fill="#ffacd7" font-size="20" font-weight="700">07 例外處理：無法清除、設備不可拆或仍需保留時</text><text x="220" y="680" fill="#fff" font-size="18">停止外移，改採物理保管、隔離、補償控制或核准銷毀；例外需有到期日與責任人。</text><path d="M600 551V595" stroke="#ff8ac7" stroke-width="4" marker-end="url(#a)"/><text x="615" y="582" fill="#ffacd7" font-size="18">否</text></g></svg>