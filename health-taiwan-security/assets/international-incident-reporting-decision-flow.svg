<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">醫療資安事件分級與通報決策流程</title><desc id="desc">從事件確認、臨床衝擊判定、法域與契約盤點，到初報、更新、復原及復盤的流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14224a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#70e7ff"/></marker></defs><rect width="1200" height="800" rx="32" fill="url(#bg)"/>
<g font-family="Noto Sans TC, sans-serif"><text x="65" y="70" fill="#fff" font-size="34" font-weight="800">先建立事件時鐘，再判定對誰、何時、說什麼</text><text x="65" y="108" fill="#a8bad8" font-size="20">通報期限、重大性門檻與接收單位取決於實際法域、契約及事件影響</text>
<rect x="70" y="180" width="205" height="120" rx="24" fill="#14304f" stroke="#63e6ff" stroke-width="2"/><text x="172" y="224" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1. 啟動事件時鐘</text><text x="172" y="262" text-anchor="middle" fill="#c8d8ed" font-size="18">保存首次知悉時間</text><text x="172" y="287" text-anchor="middle" fill="#72f0c5" font-size="17">指定事件主管</text>
<rect x="345" y="180" width="220" height="120" rx="24" fill="#14304f" stroke="#63e6ff" stroke-width="2"/><text x="455" y="224" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2. 判定影響</text><text x="455" y="262" text-anchor="middle" fill="#c8d8ed" font-size="18">臨床、資料、服務、供應鏈</text><text x="455" y="287" text-anchor="middle" fill="#72f0c5" font-size="17">標記已知與未知</text>
<polygon points="735,165 860,240 735,315 610,240" fill="#312c5b" stroke="#9c8cff" stroke-width="3"/><text x="735" y="229" text-anchor="middle" fill="#fff" font-size="23" font-weight="750">適用義務？</text><text x="735" y="260" text-anchor="middle" fill="#dcd8ff" font-size="17">法域・門檻・契約</text>
<rect x="930" y="180" width="205" height="120" rx="24" fill="#3b263d" stroke="#ff9cab" stroke-width="2"/><text x="1032" y="224" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3. 法定／契約通報</text><text x="1032" y="262" text-anchor="middle" fill="#ffd9df" font-size="18">依專屬期限與格式</text><text x="1032" y="287" text-anchor="middle" fill="#ffd277" font-size="17">保留送達證明</text>
<path d="M275 240H335M565 240H600M860 240H920" stroke="#70e7ff" stroke-width="5" marker-end="url(#a)"/><text x="882" y="218" fill="#ffd277" font-size="17">是</text>
<rect x="350" y="420" width="230" height="125" rx="24" fill="#14304f" stroke="#63e6ff" stroke-width="2"/><text x="465" y="466" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4. 協調與更新</text><text x="465" y="503" text-anchor="middle" fill="#c8d8ed" font-size="18">供應商、應變單位、同業</text><text x="465" y="531" text-anchor="middle" fill="#72f0c5" font-size="17">版本化事實與緩解措施</text>
<rect x="650" y="420" width="230" height="125" rx="24" fill="#14304f" stroke="#63e6ff" stroke-width="2"/><text x="765" y="466" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">5. 復原與結案</text><text x="765" y="503" text-anchor="middle" fill="#c8d8ed" font-size="18">服務驗證、證據保存</text><text x="765" y="531" text-anchor="middle" fill="#72f0c5" font-size="17">完成報告與未解風險</text>
<rect x="500" y="635" width="380" height="105" rx="26" fill="#172449" stroke="#9c8cff" stroke-width="2"/><text x="690" y="677" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">6. 董事會復盤與改善追蹤</text><text x="690" y="714" text-anchor="middle" fill="#dcd8ff" font-size="18">控制缺口、資源決策、責任人與期限</text>
<path d="M735 315V365H465V410" stroke="#9c8cff" stroke-width="5" fill="none" marker-end="url(#a)"/><text x="655" y="352" fill="#dcd8ff" font-size="17">否：仍依院內門檻協調</text><path d="M1032 300V375H580V410" stroke="#70e7ff" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M580 482H640M765 545V625" stroke="#70e7ff" stroke-width="5" marker-end="url(#a)"/>
</g></svg>