<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療遠端維護風險與控制對照</title><desc id="desc">常駐代理、共用帳號、檔案與命令執行及紀錄不足，分別對應暴露收斂、具名強驗證、能力拆分及獨立稽核。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#112750"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">遠端維護風險不能只靠「有 MFA」</text><text x="60" y="108" fill="#9fb3d9" font-size="20">把入口、權限、動作與證據拆開驗收</text>
<text x="95" y="165" fill="#ffb0ca" font-size="24" font-weight="700">失敗模式</text><text x="475" y="165" fill="#8fe8ff" font-size="24" font-weight="700">必要控制</text><text x="865" y="165" fill="#b8ffe7" font-size="24" font-weight="700">關閉證據</text>
<g font-size="20"><g><rect x="70" y="195" width="285" height="90" rx="18" fill="#38213d" stroke="#ff7aa8"/><text x="102" y="232" fill="#fff" font-weight="700">常駐代理、入口外露</text><text x="102" y="262" fill="#ffd2e2">未盤點或已停止使用</text><rect x="445" y="195" width="310" height="90" rx="18" fill="#123252" stroke="#63e6ff"/><text x="477" y="232" fill="#fff" font-weight="700">清冊、來源限制、停用</text><text x="477" y="262" fill="#bcefff">只保留核准目標</text><rect x="845" y="195" width="285" height="90" rx="18" fill="#16364b" stroke="#57f0c1"/><text x="877" y="232" fill="#fff" font-weight="700">代理與外曝差異報告</text><text x="877" y="262" fill="#c9ffef">零孤兒入口</text></g>
<g><rect x="70" y="315" width="285" height="90" rx="18" fill="#38213d" stroke="#ff7aa8"/><text x="102" y="352" fill="#fff" font-weight="700">共用帳號、長效權限</text><text x="102" y="382" fill="#ffd2e2">人與任務無法追溯</text><rect x="445" y="315" width="310" height="90" rx="18" fill="#123252" stroke="#63e6ff"/><text x="477" y="352" fill="#fff" font-weight="700">具名 MFA、JIT、到期</text><text x="477" y="382" fill="#bcefff">工單綁定目標</text><rect x="845" y="315" width="285" height="90" rx="18" fill="#16364b" stroke="#57f0c1"/><text x="877" y="352" fill="#fff" font-weight="700">核准與撤權時間戳</text><text x="877" y="382" fill="#c9ffef">零逾時會話</text></g>
<g><rect x="70" y="435" width="285" height="90" rx="18" fill="#38213d" stroke="#ff7aa8"/><text x="102" y="472" fill="#fff" font-weight="700">檔案／命令可直接執行</text><text x="102" y="502" fill="#ffd2e2">主機確認遭繞過</text><rect x="445" y="435" width="310" height="90" rx="18" fill="#123252" stroke="#63e6ff"/><text x="477" y="472" fill="#fff" font-weight="700">能力拆分、雜湊、雙核准</text><text x="477" y="502" fill="#bcefff">高影響動作即時中止</text><rect x="845" y="435" width="285" height="90" rx="18" fill="#16364b" stroke="#57f0c1"/><text x="877" y="472" fill="#fff" font-weight="700">檔案、命令與錄影紀錄</text><text x="877" y="502" fill="#c9ffef">可還原完整時間線</text></g></g>
<g fill="none" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M355 240H445"/><path d="M755 240H845"/><path d="M355 360H445"/><path d="M755 360H845"/><path d="M355 480H445"/><path d="M755 480H845"/></g>
<rect x="155" y="600" width="890" height="65" rx="18" fill="#152944" stroke="#9c8cff"/><text x="198" y="641" fill="#ece9ff" font-size="21" font-weight="700">風險接受須記錄：適用目標、補償控制、責任人、到期日與退場條件</text>
</svg>
