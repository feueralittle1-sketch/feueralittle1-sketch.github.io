<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療遠端維護的信任邊界</title><desc id="desc">外部工程師先經醫院身分與工單閘道，再由受控遠端會話進入指定設備區；檔案、命令與錄影證據送往獨立稽核區。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#112750"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">遠端維護：先驗證任務，再開啟最小會話</text><text x="60" y="108" fill="#9fb3d9" font-size="20">產品更新只是起點；身分、目標、能力與證據必須同時受控</text>
<g><rect x="55" y="180" width="240" height="300" rx="26" fill="#102744" stroke="#4b6a94" stroke-width="2"/><text x="88" y="225" fill="#8fe8ff" font-size="24" font-weight="700">外部維運區</text><rect x="88" y="270" width="174" height="86" rx="18" fill="#173252"/><text x="118" y="307" fill="#fff" font-size="22" font-weight="700">具名工程師</text><text x="110" y="337" fill="#b7c8e5" font-size="18">受管裝置・強驗證</text><rect x="88" y="382" width="174" height="58" rx="16" fill="#38213d" stroke="#ff7aa8"/><text x="118" y="419" fill="#ffd2e2" font-size="19" font-weight="700">禁止共用帳號</text></g>
<g><rect x="390" y="150" width="380" height="390" rx="28" fill="#0c1e38" stroke="#7165b5" stroke-width="2"/><text x="425" y="198" fill="#b9adff" font-size="24" font-weight="700">醫院控制區</text><rect x="430" y="235" width="300" height="90" rx="18" fill="#22234b" stroke="#9c8cff" stroke-width="2"/><text x="485" y="273" fill="#fff" font-size="22" font-weight="700">身分＋工單閘道</text><text x="475" y="303" fill="#c9c4ff" font-size="18">人員・時段・目標・核准者</text><rect x="430" y="360" width="300" height="120" rx="18" fill="#16364b" stroke="#57f0c1" stroke-width="2"/><text x="488" y="402" fill="#fff" font-size="22" font-weight="700">受控會話代理</text><text x="472" y="435" fill="#b8ffe7" font-size="18">限時・限能力・可中止</text><text x="490" y="462" fill="#b8ffe7" font-size="18">檔案／命令另行授權</text></g>
<g><rect x="865" y="180" width="280" height="300" rx="26" fill="#102744" stroke="#4b6a94" stroke-width="2"/><text x="900" y="225" fill="#8fe8ff" font-size="24" font-weight="700">醫療服務區</text><rect x="900" y="265" width="210" height="78" rx="16" fill="#173252"/><text x="942" y="313" fill="#fff" font-size="22" font-weight="700">指定維護目標</text><rect x="900" y="370" width="210" height="70" rx="16" fill="#173252"/><text x="943" y="413" fill="#fff" font-size="21" font-weight="700">臨床區域隔離</text></g>
<g fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"><path d="M295 310H430"/><path d="M730 420H900"/></g><text x="320" y="294" fill="#9fb3d9" font-size="18">已核准身分</text><text x="770" y="404" fill="#9fb3d9" font-size="18">指定目標</text>
<rect x="310" y="600" width="580" height="68" rx="18" fill="#152944" stroke="#57f0c1"/><text x="348" y="642" fill="#c9ffef" font-size="21" font-weight="700">獨立證據：登入、畫面、檔案、命令、核准與中止紀錄</text><path d="M580 480V600" stroke="#57f0c1" stroke-width="4" marker-end="url(#a)"/>
</svg>
