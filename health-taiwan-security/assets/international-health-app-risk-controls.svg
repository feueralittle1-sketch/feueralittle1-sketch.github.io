<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">個人健康 App 病歷交付風險控制圖</title><desc id="desc">將冒名請求、範圍過大、目的地錯置、權杖濫用與責任誤判對應到身分驗證、最小資料、端點核對、短效授權及法域分流。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17264a"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="70" y="72" fill="#f8fbff" font-size="34" font-weight="800">常見失敗模式與對應控制</text><text x="70" y="112" fill="#9fb3d9" font-size="19">不能用一張同意畫面取代身分、資料、API 與法域治理</text><g><rect x="70" y="165" width="1060" height="82" rx="22" fill="#241d36" stroke="#ff7f96" stroke-width="2"/><text x="105" y="213" fill="#ffabb8" font-size="22" font-weight="800">冒名或代理權過期</text><text x="420" y="213" fill="#e6eefc" font-size="21">→ 風險式身分驗證、代理關係時效、異常轉人工</text><rect x="70" y="267" width="1060" height="82" rx="22" fill="#21233c" stroke="#f2c94c" stroke-width="2"/><text x="105" y="315" fill="#ffe58a" font-size="22" font-weight="800">一次交付過量資料</text><text x="420" y="315" fill="#e6eefc" font-size="21">→ 最小資料集、日期區間、敏感欄位與用途確認</text><rect x="70" y="369" width="1060" height="82" rx="22" fill="#1b2841" stroke="#63e6ff" stroke-width="2"/><text x="105" y="417" fill="#8fe8ff" font-size="22" font-weight="800">App 或重新導向錯置</text><text x="420" y="417" fill="#e6eefc" font-size="21">→ 註冊端點核對、明確顯示接收者、禁止靜默改址</text><rect x="70" y="471" width="1060" height="82" rx="22" fill="#19323a" stroke="#57f0c1" stroke-width="2"/><text x="105" y="519" fill="#7ff5d2" font-size="22" font-weight="800">長效權杖持續取用</text><text x="420" y="519" fill="#e6eefc" font-size="21">→ 短效授權、最小 scope、撤權、重驗與異常監測</text><rect x="70" y="573" width="1060" height="82" rx="22" fill="#30283d" stroke="#a997ff" stroke-width="2"/><text x="105" y="621" fill="#d8d1ff" font-size="22" font-weight="800">把外國規則套成台灣義務</text><text x="420" y="621" fill="#e6eefc" font-size="21">→ 分列法域要求、角色責任、契約條件與院內建議</text></g><text x="600" y="690" text-anchor="middle" fill="#9fb3d9" font-size="18">風險接受應由資料、法務、醫療資訊與資安角色共同確認，不能由 API 單獨決定</text></svg>