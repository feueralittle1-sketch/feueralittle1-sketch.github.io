<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">手機版醫療系統安全計畫架構</title><desc id="desc">系統邊界、責任分工、臨床服務、控制實作與客觀證據由上而下連接，變更觸發計畫更新。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1160" rx="32" fill="url(#bg)"/><text x="42" y="62" fill="#fff" font-size="29" font-weight="700">醫療系統安全計畫</text><text x="42" y="100" fill="#9fb3d9" font-size="18">服務、責任、控制與證據必須連成同一基線</text><g font-family="sans-serif"><rect x="90" y="145" width="540" height="135" rx="24" fill="#12213d" stroke="#71a7ff" stroke-width="2"/><text x="360" y="193" text-anchor="middle" fill="#71a7ff" font-size="23" font-weight="700">系統邊界</text><text x="360" y="235" text-anchor="middle" fill="#fff" font-size="20">資產、介接、資料流、供應商依賴</text><path d="M360 280V330" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="340" width="540" height="135" rx="24" fill="#12213d" stroke="#9c8cff" stroke-width="2"/><text x="360" y="388" text-anchor="middle" fill="#b9aaff" font-size="23" font-weight="700">責任分工</text><text x="360" y="430" text-anchor="middle" fill="#fff" font-size="20">服務、系統、控制主責與核准者</text><path d="M360 475V525" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="75" y="535" width="570" height="170" rx="28" fill="#132d52" stroke="#63e6ff" stroke-width="3"/><text x="360" y="590" text-anchor="middle" fill="#63e6ff" font-size="23" font-weight="700">臨床核心服務</text><text x="360" y="636" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">病歷・醫囑・影像・檢驗</text><text x="360" y="675" text-anchor="middle" fill="#c6d4eb" font-size="18">以臨床影響定義控制強度</text><path d="M360 705V755" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="765" width="540" height="135" rx="24" fill="#12213d" stroke="#57f0c1" stroke-width="2"/><text x="360" y="813" text-anchor="middle" fill="#57f0c1" font-size="23" font-weight="700">控制實作</text><text x="360" y="855" text-anchor="middle" fill="#fff" font-size="20">身分、保護、偵測、應變與復原</text><path d="M360 900V950" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="960" width="540" height="135" rx="24" fill="#12213d" stroke="#ffb86b" stroke-width="2"/><text x="360" y="1008" text-anchor="middle" fill="#ffbf7a" font-size="23" font-weight="700">客觀證據與更新</text><text x="360" y="1050" text-anchor="middle" fill="#fff" font-size="20">測試、事件、例外與變更持續回寫</text></g></svg>