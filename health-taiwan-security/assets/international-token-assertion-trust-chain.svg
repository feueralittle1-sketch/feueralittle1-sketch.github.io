<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療雲端權杖與斷言信任鏈</title>
<desc id="desc">使用者與工作負載經身分提供者取得權杖，應用服務逐項驗證簽章、簽發者、受眾、時間與情境，再允許存取臨床服務。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#13234a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="70" y="82" fill="#f4f8ff" font-size="38" font-weight="800">權杖不是登入收據，而是持續驗證的授權證據</text><text x="70" y="124" fill="#9fb3d9" font-size="24">每一個接收端都必須驗證完整上下文，不能只確認簽章可解。</text>
<g font-family="Noto Sans TC, sans-serif" text-anchor="middle"><rect x="70" y="220" width="220" height="150" rx="24" fill="#102c45" stroke="#63e6ff" stroke-width="3"/><text x="180" y="275" fill="#63e6ff" font-size="28" font-weight="700">身分主體</text><text x="180" y="318" fill="#d8e8fa" font-size="23">人員／服務身分</text><text x="180" y="350" fill="#9fb3d9" font-size="20">裝置與登入情境</text>
<rect x="380" y="190" width="260" height="210" rx="24" fill="#22234d" stroke="#a997ff" stroke-width="3"/><text x="510" y="245" fill="#c4b5fd" font-size="28" font-weight="700">身分提供者</text><text x="510" y="290" fill="#d8e8fa" font-size="23">驗證主體並簽發</text><text x="510" y="326" fill="#d8e8fa" font-size="23">權杖／斷言</text><text x="510" y="365" fill="#9fb3d9" font-size="20">金鑰隔離・輪替・撤銷</text>
<rect x="735" y="175" width="390" height="240" rx="24" fill="#103a38" stroke="#57f0c1" stroke-width="3"/><text x="930" y="230" fill="#78f5ce" font-size="28" font-weight="700">應用與 API 驗證閘道</text><text x="930" y="278" fill="#e8fff8" font-size="22">簽章｜簽發者｜受眾｜用途</text><text x="930" y="314" fill="#e8fff8" font-size="22">有效時間｜重播｜裝置／工作負載</text><text x="930" y="360" fill="#9fd9ca" font-size="20">不合規即拒絕，並留下可調查事件</text></g>
<path d="M290 295H380" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/><path d="M640 295H735" stroke="#a997ff" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker></defs>
<g font-family="Noto Sans TC, sans-serif"><rect x="120" y="500" width="960" height="120" rx="24" fill="#0a1c31" stroke="#29496a" stroke-width="2"/><text x="165" y="548" fill="#f4f8ff" font-size="25" font-weight="700">臨床服務允許條件</text><text x="165" y="588" fill="#b9cae3" font-size="22">權限最小化、短效權杖、敏感操作再驗證、異常撤銷、日誌送往獨立監控。</text></g>
</svg>