<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療加密例外風險與控制對照</title><desc id="desc">對照永久例外、金鑰同權、覆蓋率假象、無法復原與舊系統無監測等風險，以及例外到期、權限分離、逐筆驗證、復原演練與隔離監測控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#122750"/></linearGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="56" y="66" fill="#fff" font-size="34" font-weight="800">加密失效通常不是演算法問題，而是治理斷點</text><text x="56" y="104" fill="#abc0df" font-size="20">控制必須同時回答「資料有沒有加密、誰能解密、能否復原、例外何時結束」</text><text x="70" y="165" fill="#ffb86b" font-size="19" font-weight="800">失敗模式</text><text x="455" y="165" fill="#63e6ff" font-size="19" font-weight="800">必要控制</text><text x="875" y="165" fill="#57f0c1" font-size="19" font-weight="800">驗收證據</text><g><rect x="55" y="185" width="1090" height="78" rx="18" fill="#12253d" stroke="#493956"/><rect x="55" y="277" width="1090" height="78" rx="18" fill="#0e2a3c" stroke="#34566c"/><rect x="55" y="369" width="1090" height="78" rx="18" fill="#12253d" stroke="#493956"/><rect x="55" y="461" width="1090" height="78" rx="18" fill="#0e2a3c" stroke="#34566c"/><rect x="55" y="553" width="1090" height="78" rx="18" fill="#12253d" stroke="#493956"/></g><g font-size="18"><text x="75" y="218" fill="#fff" font-weight="700">例外無到期日</text><text x="75" y="246" fill="#f1cbb4">暫時限制變成永久缺口</text><text x="455" y="231" fill="#d1deef">風險接受人、到期日、退出條件</text><text x="875" y="231" fill="#c8f3e3">例外登錄與逾期清單</text><text x="75" y="310" fill="#fff" font-weight="700">資料與金鑰同權</text><text x="75" y="338" fill="#f1cbb4">單一帳號同時讀取與解密</text><text x="455" y="323" fill="#d1deef">金鑰分離、雙人核准、最小權限</text><text x="875" y="323" fill="#c8f3e3">權限矩陣與解密稽核</text><text x="75" y="402" fill="#fff" font-weight="700">覆蓋率只看設定</text><text x="75" y="430" fill="#f1cbb4">備份、匯出或舊介面仍明文</text><text x="455" y="415" fill="#d1deef">逐資料流驗證、負向測試、抽樣</text><text x="875" y="415" fill="#c8f3e3">資產對照與例外差異報告</text><text x="75" y="494" fill="#fff" font-weight="700">金鑰失效無法復原</text><text x="75" y="522" fill="#f1cbb4">加密資料在事件中不可用</text><text x="455" y="507" fill="#d1deef">備援金鑰、輪替與隔離復原演練</text><text x="875" y="507" fill="#c8f3e3">還原時間與完整性紀錄</text><text x="75" y="586" fill="#fff" font-weight="700">舊系統只做網路隔離</text><text x="75" y="614" fill="#f1cbb4">異常匯出與本機複製無人發現</text><text x="455" y="599" fill="#d1deef">存取限制、外洩監測、實體保護</text><text x="875" y="599" fill="#c8f3e3">告警測試與退場里程碑</text></g><path d="M420 180V635M840 180V635" stroke="#ffffff" stroke-opacity=".08"/></g></svg>