<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">聯邦學習風險與控制對照</title><desc id="desc">模型更新外洩、惡意投毒、協調平台失陷、參與者漂移與效用下降等風險，分別對應隱私、完整性、管理面、生命週期與臨床控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="55" y="66" fill="#f7fbff" font-size="34" font-weight="800">五種失敗模式，需要五組可驗收控制</text><text x="55" y="103" fill="#9fb7d5" font-size="19">不能只檢查原始資料是否離院，還要驗證更新、平台、參與者與模型結果</text>
<g font-size="17"><text x="70" y="155" fill="#ff9f9f" font-size="21" font-weight="800">風險訊號</text><text x="475" y="155" fill="#8fe8ff" font-size="21" font-weight="800">控制方法</text><text x="900" y="155" fill="#72f5cd" font-size="21" font-weight="800">驗收證據</text>
<g><rect x="55" y="178" width="1090" height="78" rx="18" fill="#142b47"/><text x="78" y="211" fill="#ffb4b4" font-weight="800">更新可反推出個資</text><text x="475" y="211" fill="#e6eefc">剪裁、差分隱私、安全聚合</text><text x="900" y="211" fill="#c7f9e8">隱私參數與攻擊測試</text><text x="78" y="238" fill="#9fb7d5">梯度洩漏／成員推論</text><text x="475" y="238" fill="#9fb7d5">限制最小群組與查詢頻率</text><text x="900" y="238" fill="#9fb7d5">效用與風險共同門檻</text></g>
<g><rect x="55" y="270" width="1090" height="78" rx="18" fill="#1b3048"/><text x="78" y="303" fill="#ffcf9a" font-weight="800">惡意節點污染模型</text><text x="475" y="303" fill="#e6eefc">簽章、異常檢測、穩健聚合</text><text x="900" y="303" fill="#c7f9e8">投毒演練與隔離紀錄</text><text x="78" y="330" fill="#9fb7d5">資料投毒／模型投毒</text><text x="475" y="330" fill="#9fb7d5">單院影響上限與人工覆核</text><text x="900" y="330" fill="#9fb7d5">停止、撤回與回退時間</text></g>
<g><rect x="55" y="362" width="1090" height="78" rx="18" fill="#142b47"/><text x="78" y="395" fill="#ffb4b4" font-weight="800">協調平台遭接管</text><text x="475" y="395" fill="#e6eefc">PAM、網段隔離、金鑰分離</text><text x="900" y="395" fill="#c7f9e8">特權與組態獨立稽核</text><text x="78" y="422" fill="#9fb7d5">高權限管理面單點失陷</text><text x="475" y="422" fill="#9fb7d5">不可竄改日誌與乾淨重建</text><text x="900" y="422" fill="#9fb7d5">復原演練與版本重建</text></g>
<g><rect x="55" y="454" width="1090" height="78" rx="18" fill="#1b3048"/><text x="78" y="487" fill="#ffcf9a" font-weight="800">參與者與資料漂移</text><text x="475" y="487" fill="#e6eefc">加入核准、定期重驗、立即撤權</text><text x="900" y="487" fill="#c7f9e8">名冊、版本與退出證據</text><text x="78" y="514" fill="#9fb7d5">院所、用途或資料條件改變</text><text x="475" y="514" fill="#9fb7d5">基線差異與責任重新確認</text><text x="900" y="514" fill="#9fb7d5">變更觸發是否完整</text></g>
<g><rect x="55" y="546" width="1090" height="78" rx="18" fill="#142b47"/><text x="78" y="579" fill="#ffb4b4" font-weight="800">模型效用或公平性下降</text><text x="475" y="579" fill="#e6eefc">分群測試、臨床覆核、降級模式</text><text x="900" y="579" fill="#c7f9e8">用途內效能與回退門檻</text><text x="78" y="606" fill="#9fb7d5">隱私保護與準確度失衡</text><text x="475" y="606" fill="#9fb7d5">限制自動化影響與部署範圍</text><text x="900" y="606" fill="#9fb7d5">持續監測與事件停用</text></g></g></g></svg>
