<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療設備追溯風險與控制對照</title><desc id="desc">設備錯配、元件不明、供應關係斷鏈、變更漏記及退役殘留分別對應唯一鍵、版本化、關係映射、事件觸發及撤權清除控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#241a38"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="38" font-weight="800">追溯斷點與控制對照</text><text x="70" y="116" fill="#9fb3d9" font-size="20">資料「存在」不等於查詢結果可靠，必須驗證關係、版本與事件時間</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><text x="220" y="170" fill="#ff9fb2" font-size="23" font-weight="800" text-anchor="middle">失敗模式</text><text x="600" y="170" fill="#63e6ff" font-size="23" font-weight="800" text-anchor="middle">必要控制</text><text x="980" y="170" fill="#76f6d0" font-size="23" font-weight="800" text-anchor="middle">驗收證據</text><g transform="translate(60 195)"><rect width="1080" height="82" rx="20" fill="#141d34" stroke="#ffffff" stroke-opacity=".12"/><rect width="320" height="82" rx="20" fill="#3d2934"/><text x="160" y="50" fill="#fff" font-size="22" text-anchor="middle" font-weight="800">同型號多版本錯配</text><text x="540" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">唯一鍵＋型號／序號／版本聯合核對</text><text x="920" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">抽樣設備可回查實際基線</text></g><g transform="translate(60 291)"><rect width="1080" height="82" rx="20" fill="#141d34" stroke="#ffffff" stroke-opacity=".12"/><rect width="320" height="82" rx="20" fill="#3b2d47"/><text x="160" y="50" fill="#fff" font-size="22" text-anchor="middle" font-weight="800">SBOM 與部署脫節</text><text x="540" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">SBOM 版本化＋設備版本關聯</text><text x="920" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">元件查詢命中實際設備</text></g><g transform="translate(60 387)"><rect width="1080" height="82" rx="20" fill="#141d34" stroke="#ffffff" stroke-opacity=".12"/><rect width="320" height="82" rx="20" fill="#343150"/><text x="160" y="50" fill="#fff" font-size="22" text-anchor="middle" font-weight="800">供應商關係斷鏈</text><text x="540" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">製造商／維護商／次承包商映射</text><text x="920" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">責任與通知路徑可驗證</text></g><g transform="translate(60 483)"><rect width="1080" height="82" rx="20" fill="#141d34" stroke="#ffffff" stroke-opacity=".12"/><rect width="320" height="82" rx="20" fill="#2d3d4c"/><text x="160" y="50" fill="#fff" font-size="22" text-anchor="middle" font-weight="800">更新或維修漏記</text><text x="540" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">事件觸發＋核准、時間與結果留證</text><text x="920" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">變更後基線重驗通過</text></g><g transform="translate(60 579)"><rect width="1080" height="82" rx="20" fill="#141d34" stroke="#ffffff" stroke-opacity=".12"/><rect width="320" height="82" rx="20" fill="#3f2b32"/><text x="160" y="50" fill="#fff" font-size="22" text-anchor="middle" font-weight="800">退役後信任仍存續</text><text x="540" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">撤銷帳號、憑證、通道與資料清除</text><text x="920" y="50" fill="#e6eefc" font-size="21" text-anchor="middle">退役清單與撤銷紀錄一致</text></g></g></svg>