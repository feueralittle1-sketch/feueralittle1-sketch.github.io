<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc"><title id="title">醫療系統安全預設值驗收流程手機版</title><desc id="desc">六個由上而下的步驟，從用途風險到供應商證據、隔離建置、負向測試、臨床回歸及放行退回。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#061321"/><stop offset="1" stop-color="#101c3b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#63e6ff"/></marker></defs><rect width="600" height="1000" rx="28" fill="url(#b)"/><text x="34" y="52" fill="#fff" font-size="25" font-weight="800">六步建立安全交付基線</text><text x="34" y="82" fill="#a8bad8" font-size="17">偏離必須有控制、期限與重驗條件</text><g font-family="Inter,Noto Sans TC,sans-serif"><g id="row"><rect x="52" width="496" height="112" rx="20" fill="#102b45" stroke="#55dff8" stroke-width="2"/></g><use href="#row" y="120"/><circle cx="92" cy="157" r="24" fill="#55dff8"/><text x="92" y="165" text-anchor="middle" fill="#071421" font-size="21" font-weight="800">1</text><text x="132" y="153" fill="#fff" font-size="22" font-weight="800">定義用途與風險</text><text x="132" y="187" fill="#c7d5ec" font-size="17">資料、連線、臨床影響與復原條件</text><path d="M300 232V256" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><use href="#row" y="270"/><circle cx="92" cy="307" r="24" fill="#789dff"/><text x="92" y="315" text-anchor="middle" fill="#071421" font-size="21" font-weight="800">2</text><text x="132" y="303" fill="#fff" font-size="22" font-weight="800">索取交付證據</text><text x="132" y="337" fill="#c7d5ec" font-size="17">預設值、版本、日誌、更新與支援</text><path d="M300 382V406" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><use href="#row" y="420"/><circle cx="92" cy="457" r="24" fill="#a88cff"/><text x="92" y="465" text-anchor="middle" fill="#071421" font-size="21" font-weight="800">3</text><text x="132" y="453" fill="#fff" font-size="22" font-weight="800">隔離建置基線</text><text x="132" y="487" fill="#c7d5ec" font-size="17">完成設定、匯出並封存可比較基線</text><path d="M300 532V556" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><use href="#row" y="570"/><circle cx="92" cy="607" r="24" fill="#55e6c1"/><text x="92" y="615" text-anchor="middle" fill="#071421" font-size="21" font-weight="800">4</text><text x="132" y="603" fill="#fff" font-size="22" font-weight="800">執行負向測試</text><text x="132" y="637" fill="#c7d5ec" font-size="17">憑證、介面、通訊、日誌與回退</text><path d="M300 682V706" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><use href="#row" y="720"/><circle cx="92" cy="757" r="24" fill="#62dbb9"/><text x="92" y="765" text-anchor="middle" fill="#071421" font-size="21" font-weight="800">5</text><text x="132" y="753" fill="#fff" font-size="22" font-weight="800">臨床與安全回歸</text><text x="132" y="787" fill="#c7d5ec" font-size="17">告警、資料、正常流程、降級與復原</text><path d="M300 832V856" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><use href="#row" y="870"/><circle cx="92" cy="907" r="24" fill="#f2c86c"/><text x="92" y="915" text-anchor="middle" fill="#071421" font-size="21" font-weight="800">6</text><text x="132" y="903" fill="#fff" font-size="22" font-weight="800">放行或退回</text><text x="132" y="937" fill="#c7d5ec" font-size="17">通過才進信任區；例外限期且可撤回</text></g></svg>