<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">醫療資安董事會事件指標地圖</title><desc id="desc">將董事會事件指標分為臨床影響、應變速度、通報品質、復原信心與風險關閉五類，並列出避免失真的檢核方式。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#152552"/></linearGradient></defs><rect width="1200" height="780" rx="32" fill="url(#bg)"/>
<g font-family="Noto Sans TC, sans-serif"><text x="65" y="70" fill="#fff" font-size="34" font-weight="800">董事會指標要回答「風險是否受控」，不只計算事件數</text><text x="65" y="108" fill="#a8bad8" font-size="20">每項數字應附範圍、資料來源、目標、趨勢、例外與具名責任人</text>
<rect x="55" y="170" width="210" height="200" rx="25" fill="#12314e" stroke="#63e6ff" stroke-width="2"/><text x="160" y="215" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">臨床影響</text><text x="160" y="258" text-anchor="middle" fill="#c9d9ed" font-size="18">受影響服務與院區</text><text x="160" y="291" text-anchor="middle" fill="#c9d9ed" font-size="18">停機／降級時間</text><text x="160" y="324" text-anchor="middle" fill="#72f0c5" font-size="17">患者安全事件另行治理</text><text x="160" y="350" text-anchor="middle" fill="#72f0c5" font-size="17">不可混成單一分數</text>
<rect x="285" y="170" width="210" height="200" rx="25" fill="#182b50" stroke="#9c8cff" stroke-width="2"/><text x="390" y="215" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">應變速度</text><text x="390" y="258" text-anchor="middle" fill="#c9d9ed" font-size="18">MTTD／MTTR</text><text x="390" y="291" text-anchor="middle" fill="#c9d9ed" font-size="18">隔離與決策時間</text><text x="390" y="324" text-anchor="middle" fill="#ffd277" font-size="17">按嚴重度分組</text><text x="390" y="350" text-anchor="middle" fill="#ffd277" font-size="17">避免平均值掩蓋重大事件</text>
<rect x="515" y="170" width="210" height="200" rx="25" fill="#12314e" stroke="#63e6ff" stroke-width="2"/><text x="620" y="215" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">通報品質</text><text x="620" y="258" text-anchor="middle" fill="#c9d9ed" font-size="18">期限內完成率</text><text x="620" y="291" text-anchor="middle" fill="#c9d9ed" font-size="18">退件／重大更正率</text><text x="620" y="324" text-anchor="middle" fill="#72f0c5" font-size="17">以完整性與送達證明驗收</text><text x="620" y="350" text-anchor="middle" fill="#72f0c5" font-size="17">不追求過早確定</text>
<rect x="745" y="170" width="210" height="200" rx="25" fill="#182b50" stroke="#9c8cff" stroke-width="2"/><text x="850" y="215" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">復原信心</text><text x="850" y="258" text-anchor="middle" fill="#c9d9ed" font-size="18">復原點與資料驗證</text><text x="850" y="291" text-anchor="middle" fill="#c9d9ed" font-size="18">臨床驗收完成率</text><text x="850" y="324" text-anchor="middle" fill="#ffd277" font-size="17">區分技術上線</text><text x="850" y="350" text-anchor="middle" fill="#ffd277" font-size="17">與臨床可安全使用</text>
<rect x="975" y="170" width="170" height="200" rx="25" fill="#12314e" stroke="#63e6ff" stroke-width="2"/><text x="1060" y="215" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">風險關閉</text><text x="1060" y="258" text-anchor="middle" fill="#c9d9ed" font-size="18">逾期改善項</text><text x="1060" y="291" text-anchor="middle" fill="#c9d9ed" font-size="18">風險接受期限</text><text x="1060" y="324" text-anchor="middle" fill="#72f0c5" font-size="17">追蹤責任人</text><text x="1060" y="350" text-anchor="middle" fill="#72f0c5" font-size="17">資源與殘餘風險</text>
<rect x="105" y="465" width="990" height="200" rx="30" fill="#101e3a" stroke="#8f9fff" stroke-width="2"/><text x="600" y="512" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">防止指標失真的四道檢核</text><text x="250" y="565" text-anchor="middle" fill="#8fe8ff" font-size="20" font-weight="700">可比性</text><text x="250" y="602" text-anchor="middle" fill="#c9d9ed" font-size="18">同嚴重度、同範圍、同期間</text><text x="480" y="565" text-anchor="middle" fill="#8fe8ff" font-size="20" font-weight="700">可追溯</text><text x="480" y="602" text-anchor="middle" fill="#c9d9ed" font-size="18">連回事件與原始證據</text><text x="720" y="565" text-anchor="middle" fill="#8fe8ff" font-size="20" font-weight="700">可行動</text><text x="720" y="602" text-anchor="middle" fill="#c9d9ed" font-size="18">超標即有責任人與期限</text><text x="950" y="565" text-anchor="middle" fill="#8fe8ff" font-size="20" font-weight="700">反誘因</text><text x="950" y="602" text-anchor="middle" fill="#c9d9ed" font-size="18">不以少報、早結案換績效</text>
<text x="65" y="730" fill="#9fb3d9" font-size="18">事件數下降不必然代表風險下降；應同時觀察偵測涵蓋率、演練結果、重大例外與改善關閉品質。</text></g></svg>