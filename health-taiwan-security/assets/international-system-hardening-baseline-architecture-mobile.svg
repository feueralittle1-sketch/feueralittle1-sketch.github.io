<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 930" role="img" aria-labelledby="title desc">
  <title id="title">醫療系統安全基線與設定漂移治理架構手機版</title><desc id="desc">外部硬化參考與臨床邊界形成核准安全基線，再由漂移訊號觸發修正與臨床回歸。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#112448"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6Z" fill="#72ddff"/></marker></defs><rect width="390" height="930" rx="24" fill="url(#bg)"/>
  <text x="24" y="44" fill="#f5f8ff" font-size="22" font-weight="700">安全基線與設定漂移</text><text x="24" y="72" fill="#9eb7d8" font-size="15">外部參考要經臨床邊界轉譯。</text>
  <g font-family="sans-serif">
    <g transform="translate(24 105)"><rect width="342" height="130" rx="20" fill="#102d4b" stroke="#63e6ff" stroke-width="2"/><text x="20" y="36" fill="#63e6ff" font-size="19" font-weight="700">1 外部硬化參考</text><text x="20" y="70" fill="#eef7ff" font-size="16">NIST 清單／供應商指南</text><text x="20" y="99" fill="#eef7ff" font-size="16">威脅與事件經驗</text></g>
    <path d="M195 238V268" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 278)"><rect width="342" height="145" rx="20" fill="#1a2952" stroke="#aa98ff" stroke-width="2"/><text x="20" y="36" fill="#c5b8ff" font-size="19" font-weight="700">2 臨床與技術邊界</text><text x="20" y="70" fill="#eef7ff" font-size="16">預定用途／相容性／停機條件</text><text x="20" y="99" fill="#eef7ff" font-size="16">例外、補償控制與回退</text><text x="20" y="126" fill="#c7c1e8" font-size="14">確認病人安全與服務依賴</text></g>
    <path d="M195 426V456" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 466)"><rect width="342" height="145" rx="20" fill="#123b3d" stroke="#57f0c1" stroke-width="2"/><text x="20" y="36" fill="#77f5cf" font-size="19" font-weight="700">3 核准安全基線</text><text x="20" y="70" fill="#eef7ff" font-size="16">版本化設定／責任人／期限</text><text x="20" y="99" fill="#eef7ff" font-size="16">自動化部署與重建規則</text><text x="20" y="126" fill="#bae5db" font-size="14">每版保留核准與測試證據</text></g>
    <path d="M195 614V644" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(24 654)"><rect width="342" height="120" rx="20" fill="#48293b" stroke="#ff9bc2" stroke-width="2"/><text x="20" y="36" fill="#ffb0cf" font-size="19" font-weight="700">4 設定漂移訊號</text><text x="20" y="70" fill="#eef7ff" font-size="16">差異／未核准變更／控制失效</text><text x="20" y="98" fill="#e9c2d3" font-size="14">連回資產、維護與變更來源</text></g>
    <path d="M195 777V807" stroke="#72ddff" stroke-width="4" marker-end="url(#a)"/>
    <rect x="24" y="817" width="342" height="85" rx="20" fill="#0a1b31" stroke="#72ddff" stroke-width="2"/><text x="195" y="850" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">風險分流 → 修正 → 臨床回歸</text><text x="195" y="880" text-anchor="middle" fill="#a9bdd9" font-size="14">保留差異、核准、測試與回退證據</text>
  </g>
</svg>
