<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫院冷鏈設備的可信控制與證據邊界</title><desc id="desc">外部維護連線先通過身分與會話閘門，再進入隔離冷鏈控制區；獨立溫度紀錄另送事件指揮與藥事檢驗處置。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-size="34" font-weight="800">冷鏈設備要同時保護控制面與溫度證據</text><text x="60" y="106" fill="#a8bddc" font-size="20">設備恢復連線，不等於藥品、疫苗與檢體可直接放行</text><g font-family="Arial,Noto Sans TC,sans-serif"><rect x="60" y="170" width="250" height="170" rx="24" fill="#172d50" stroke="#63e6ff" stroke-width="3"/><text x="92" y="220" fill="#fff" font-size="26" font-weight="800">外部維護來源</text><text x="92" y="267" fill="#cbd9ef" font-size="20">供應商工程師</text><text x="92" y="302" fill="#cbd9ef" font-size="20">維護平台／跳板</text><rect x="385" y="150" width="300" height="210" rx="26" fill="#28234d" stroke="#a997ff" stroke-width="3"/><text x="425" y="202" fill="#fff" font-size="26" font-weight="800">遠端維護閘門</text><text x="425" y="250" fill="#ded7ff" font-size="20">• 獨立身分與強驗證</text><text x="425" y="290" fill="#ded7ff" font-size="20">• 工單、限時授權、錄影</text><text x="425" y="330" fill="#ded7ff" font-size="20">• 禁止直接網際網路管理</text><rect x="770" y="130" width="370" height="250" rx="28" fill="#12384a" stroke="#57f0c1" stroke-width="3"/><text x="810" y="183" fill="#fff" font-size="27" font-weight="800">隔離冷鏈控制區</text><text x="810" y="232" fill="#cff8e9" font-size="20">冷藏／冷凍控制器</text><text x="810" y="270" fill="#cff8e9" font-size="20">本地顯示、告警、門磁與電力</text><text x="810" y="308" fill="#cff8e9" font-size="20">受控建築管理介接</text><text x="810" y="346" fill="#cff8e9" font-size="20">安全本地／人工降級模式</text><rect x="90" y="465" width="360" height="175" rx="26" fill="#11334c" stroke="#4edff5" stroke-width="3"/><text x="130" y="518" fill="#fff" font-size="27" font-weight="800">獨立溫度證據</text><text x="130" y="564" fill="#cce9f2" font-size="20">校正紀錄器、時間序列、資料缺口</text><text x="130" y="602" fill="#cce9f2" font-size="20">與主要控制器分離保存</text><rect x="535" y="450" width="270" height="190" rx="26" fill="#352748" stroke="#ffb86b" stroke-width="3"/><text x="575" y="502" fill="#fff" font-size="26" font-weight="800">事件指揮</text><text x="575" y="548" fill="#ffe1bb" font-size="20">資安、設施、藥事、檢驗</text><text x="575" y="586" fill="#ffe1bb" font-size="20">隔離、轉移、復原協調</text><rect x="890" y="450" width="250" height="190" rx="26" fill="#39233f" stroke="#ff7aa8" stroke-width="3"/><text x="930" y="502" fill="#fff" font-size="26" font-weight="800">庫存處置</text><text x="930" y="548" fill="#ffd0df" font-size="20">放行／隔離／報廢</text><text x="930" y="586" fill="#ffd0df" font-size="20">依完整證據判定</text><g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M310 255H378"/><path d="M685 255H762"/><path d="M955 380V440"/><path d="M450 552H527"/><path d="M805 545H882"/></g><path d="M770 320C640 390 500 420 360 458" stroke="#57f0c1" stroke-width="4" fill="none" marker-end="url(#a)"/></g></svg>