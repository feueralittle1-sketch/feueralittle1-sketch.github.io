<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安事件多軌通報架構</title><desc id="desc">共同事件事實庫向技術應變、個資法律與臨床安全三條軌道分流。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><text x="38" y="62" fill="#f7fbff" font-size="29" font-weight="800">一個事件，不只一張通報單</text><text x="38" y="100" fill="#9fb7d5" font-size="18">共用事實，但依目的分流判定與送件</text><g font-family="Arial, Noto Sans TC, sans-serif"><rect x="54" y="146" width="612" height="150" rx="24" fill="#112e4d" stroke="#63e6ff" stroke-width="2"/><text x="88" y="194" fill="#63e6ff" font-size="24" font-weight="800">共同事件事實庫</text><text x="88" y="235" fill="#e6eefc" font-size="19">時間線 · 系統 · 資料 · 病人影響 · 措施</text><text x="88" y="268" fill="#a9bdd9" font-size="17">每次更新保留版本、來源與核准者</text><path d="M360 296v48" stroke="#7adfff" stroke-width="5"/><rect x="54" y="344" width="612" height="142" rx="24" fill="#12334f" stroke="#63e6ff" stroke-width="2"/><text x="88" y="394" fill="#63e6ff" font-size="24" font-weight="800">1 技術應變／支援</text><text x="88" y="438" fill="#e6eefc" font-size="19">IOC、攻擊路徑、阻斷狀態、協助需求</text><path d="M360 486v38" stroke="#7adfff" stroke-width="5"/><rect x="54" y="524" width="612" height="142" rx="24" fill="#2b2f58" stroke="#a997ff" stroke-width="2"/><text x="88" y="574" fill="#c3b8ff" font-size="24" font-weight="800">2 個資／法律評估</text><text x="88" y="618" fill="#eeeaff" font-size="19">資料類型、影響範圍、通知門檻與時程</text><path d="M360 666v38" stroke="#7adfff" stroke-width="5"/><rect x="54" y="704" width="612" height="142" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="88" y="754" fill="#72f5cd" font-size="24" font-weight="800">3 臨床安全／營運</text><text x="88" y="798" fill="#ddfff4" font-size="19">停機、替代照護、病安事件與復原證據</text><rect x="54" y="896" width="612" height="130" rx="24" fill="#4b331d" stroke="#ffbe6b" stroke-width="2"/><text x="88" y="944" fill="#ffd08a" font-size="23" font-weight="800">一致但不混用</text><text x="88" y="986" fill="#fff0d8" font-size="18">各軌分別判定、送件、補件與結案</text></g></svg>