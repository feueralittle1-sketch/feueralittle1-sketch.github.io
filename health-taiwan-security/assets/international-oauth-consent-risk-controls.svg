<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">OAuth 同意釣魚風險與控制對照</title><desc id="desc">將偽冒應用、過度權限、長效權杖、異常資料存取與孤兒應用對應到可驗收控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171f42"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="64" y="76" fill="#fff" font-size="38" font-weight="800">OAuth 同意釣魚：風險與控制對照</text><text x="64" y="116" fill="#9fb3d9" font-size="20">控制要能降低授權機率、限制存取範圍，並縮短惡意應用停留時間</text><g font-family="Arial, 'Noto Sans TC', sans-serif"><rect x="60" y="170" width="1080" height="470" rx="24" fill="#0e2039" stroke="#3c5478" stroke-width="2"/><g fill="#152d4a"><rect x="80" y="195" width="1040" height="72" rx="14"/><rect x="80" y="280" width="1040" height="72" rx="14"/><rect x="80" y="365" width="1040" height="72" rx="14"/><rect x="80" y="450" width="1040" height="72" rx="14"/><rect x="80" y="535" width="1040" height="72" rx="14"/></g><g font-size="22" font-weight="800"><text x="115" y="240" fill="#ffb4c6">偽冒應用與品牌</text><text x="115" y="325" fill="#ffb4c6">過度權限</text><text x="115" y="410" fill="#ffb4c6">長效權杖殘留</text><text x="115" y="495" fill="#ffb4c6">異常讀取與寄信</text><text x="115" y="580" fill="#ffb4c6">無人負責的孤兒應用</text></g><g font-size="20" fill="#c6d4eb"><text x="425" y="240">驗證發行者、網域、擁有者；高風險採管理員核准</text><text x="425" y="325">依用途允許最小範圍；禁止不必要的離線與全域存取</text><text x="425" y="410">撤銷同意與重新整理權杖；回查所有服務主體與帳號</text><text x="425" y="495">監測 API 行為、下載量、收件匣規則與異常來源位置</text><text x="425" y="580">設定業務擁有者、複核期限、停用條件與退場程序</text></g><line x1="390" y1="195" x2="390" y2="607" stroke="#3c5478" stroke-width="2"/><text x="235" y="668" text-anchor="middle" fill="#ffb4c6" font-size="20" font-weight="800">風險訊號</text><text x="755" y="668" text-anchor="middle" fill="#57f0c1" font-size="20" font-weight="800">可驗收控制與證據</text></g></svg>