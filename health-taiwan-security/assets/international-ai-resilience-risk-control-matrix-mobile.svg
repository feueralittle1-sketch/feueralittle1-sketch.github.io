<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 940" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧風險控制對照手機版</title><desc id="desc">服務不可用、錯誤漂移、操弄越權與供應商變更四類風險，各自對應偵測、降級與驗收證據。</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132348"/></linearGradient></defs><rect width="390" height="940" rx="24" fill="url(#b)"/><g font-family="Noto Sans TC, sans-serif"><text x="24" y="42" fill="#fff" font-size="22" font-weight="800">四類 AI 失效對照</text><text x="24" y="70" fill="#abc0df" font-size="15">控制與驗收證據不能共用一個指標</text><g><rect x="22" y="100" width="346" height="184" rx="20" fill="#102b47" stroke="#3bcfea" stroke-width="2"/><text x="42" y="134" fill="#7eeaff" font-size="19" font-weight="800">服務不可用</text><text x="42" y="165" fill="#dce8f7" font-size="15">偵測｜延遲、錯誤率、相依服務</text><text x="42" y="195" fill="#dce8f7" font-size="15">降級｜人工流程、離線工具、停用</text><text x="42" y="225" fill="#dce8f7" font-size="15">證據｜切換時間、臨床完成率</text><text x="42" y="258" fill="#99b4d5" font-size="14">情境：API、模型或網路中斷</text><rect x="22" y="302" width="346" height="184" rx="20" fill="#162b4b" stroke="#8b86ff" stroke-width="2"/><text x="42" y="336" fill="#b9b4ff" font-size="19" font-weight="800">錯誤或漂移</text><text x="42" y="367" fill="#dce8f7" font-size="15">偵測｜輸入分布、覆核差異、警示</text><text x="42" y="397" fill="#dce8f7" font-size="15">降級｜人工確認、門檻、回退版本</text><text x="42" y="427" fill="#dce8f7" font-size="15">證據｜負向測試、版本比較</text><text x="42" y="460" fill="#99b4d5" font-size="14">情境：不合理、過時或偏移輸出</text><rect x="22" y="504" width="346" height="184" rx="20" fill="#20294a" stroke="#ef8dcc" stroke-width="2"/><text x="42" y="538" fill="#ffafe1" font-size="19" font-weight="800">操弄與越權</text><text x="42" y="569" fill="#dce8f7" font-size="15">偵測｜異常輸入、工具呼叫、權限事件</text><text x="42" y="599" fill="#dce8f7" font-size="15">降級｜最小權限、隔離、人工核准</text><text x="42" y="629" fill="#dce8f7" font-size="15">證據｜攻擊情境、稽核軌跡</text><text x="42" y="662" fill="#99b4d5" font-size="14">情境：提示注入、資料污染、工具濫用</text><rect x="22" y="706" width="346" height="184" rx="20" fill="#153648" stroke="#56dfb3" stroke-width="2"/><text x="42" y="740" fill="#79efc6" font-size="19" font-weight="800">供應商變更</text><text x="42" y="771" fill="#dce8f7" font-size="15">偵測｜版本通知、SBOM、契約事件</text><text x="42" y="801" fill="#dce8f7" font-size="15">降級｜凍結、替代、匯出與退出</text><text x="42" y="831" fill="#dce8f7" font-size="15">證據｜退出演練、資料可攜性</text><text x="42" y="864" fill="#99b4d5" font-size="14">情境：模型、條款、資料流或終止</text></g><text x="195" y="920" text-anchor="middle" fill="#9eb5d5" font-size="14">先分類失效，再設定控制與驗收</text></g></svg>