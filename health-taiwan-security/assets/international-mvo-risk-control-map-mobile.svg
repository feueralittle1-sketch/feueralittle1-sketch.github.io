<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc"><title id="title">手機版醫療復原風險控制圖</title><desc id="desc">四項重大復原失敗模式分別對應可執行的控制與驗收條件。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient></defs><rect width="720" height="1280" rx="32" fill="url(#bg)"/><text x="40" y="60" fill="#fff" font-size="28" font-weight="700">復原風險與控制</text><text x="40" y="98" fill="#9fb3d9" font-size="18">錯誤放行可能使臨床再次中斷</text><g font-family="sans-serif"><g fill="#12213d" stroke="#2a4569" stroke-width="2"><rect x="55" y="135" width="610" height="235" rx="25"/><rect x="55" y="390" width="610" height="235" rx="25"/><rect x="55" y="645" width="610" height="235" rx="25"/><rect x="55" y="900" width="610" height="235" rx="25"/></g><g text-anchor="middle"><text x="360" y="185" fill="#f7a7c2" font-size="22" font-weight="700">過早全面重連</text><text x="360" y="230" fill="#c6d4eb" font-size="19">攻擊者重返、橫向移動再發</text><text x="360" y="290" fill="#57f0c1" font-size="20" font-weight="700">分段放行＋即時監控＋回退</text><text x="360" y="440" fill="#f7a7c2" font-size="22" font-weight="700">技術與臨床權責不清</text><text x="360" y="485" fill="#c6d4eb" font-size="19">系統可用但照護流程不安全</text><text x="360" y="545" fill="#57f0c1" font-size="20" font-weight="700">事件指揮矩陣＋雙重核准</text><text x="360" y="695" fill="#f7a7c2" font-size="22" font-weight="700">未驗證備份直接還原</text><text x="360" y="740" fill="#c6d4eb" font-size="19">惡意程式、舊權限或錯誤資料復活</text><text x="360" y="800" fill="#57f0c1" font-size="20" font-weight="700">隔離還原＋完整性與惡意檢查</text><text x="360" y="950" fill="#f7a7c2" font-size="22" font-weight="700">最低服務恢復就宣布結案</text><text x="360" y="995" fill="#c6d4eb" font-size="19">根因、技術債與監控缺口留存</text><text x="360" y="1055" fill="#57f0c1" font-size="20" font-weight="700">長期修復清單＋期限＋治理追蹤</text></g></g><rect x="65" y="1175" width="590" height="70" rx="22" fill="#0d3540" stroke="#57f0c1"/><text x="360" y="1206" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">病人安全・資料完整・存取正確</text><text x="360" y="1233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">攻擊面縮小・可快速回退</text></svg>