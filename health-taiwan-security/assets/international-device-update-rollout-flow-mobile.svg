<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1260" role="img" aria-labelledby="title desc"><title id="title">醫療設備更新分批放行流程手機版</title><desc id="desc">六道垂直放行閘門以及停止或回退條件。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102447"/></linearGradient></defs><rect width="760" height="1260" rx="30" fill="url(#bg)"/><g font-family="Inter,Noto Sans TC,sans-serif"><text x="40" y="62" fill="#f4f8ff" font-size="30" font-weight="800">分批放行限制更新爆炸半徑</text><text x="40" y="98" fill="#9fb3d9" font-size="18">每一批都必須能停止、回退與追查</text><g fill="#102c4b" stroke="#71a7ff" stroke-width="2"><rect x="70" y="140" width="620" height="110" rx="22"/><rect x="70" y="280" width="620" height="110" rx="22"/><rect x="70" y="420" width="620" height="110" rx="22"/><rect x="70" y="560" width="620" height="110" rx="22"/><rect x="70" y="700" width="620" height="110" rx="22"/><rect x="70" y="840" width="620" height="110" rx="22"/></g><g fill="#e6eefc" font-size="21"><text x="100" y="185" font-weight="700">01 範圍確認</text><text x="345" y="185">型號、版本、依賴</text><text x="100" y="325" font-weight="700">02 套件驗證</text><text x="345" y="325">來源、簽章、指紋</text><text x="100" y="465" font-weight="700">03 隔離測試</text><text x="345" y="465">功能、資料、介接</text><text x="100" y="605" font-weight="700">04 代表性試點</text><text x="345" y="605">少量設備與停止條件</text><text x="100" y="745" font-weight="700">05 臨床放行</text><text x="345" y="745">安全性與可用性驗收</text><text x="100" y="885" font-weight="700">06 分批擴大</text><text x="345" y="885">監測、回退、結案</text></g><g fill="#63e6ff" font-size="28"><text x="366" y="275">↓</text><text x="366" y="415">↓</text><text x="366" y="555">↓</text><text x="366" y="695">↓</text><text x="366" y="835">↓</text></g><rect x="55" y="1000" width="650" height="195" rx="24" fill="#251a35" stroke="#ff8fa3" stroke-width="2"/><text x="85" y="1043" fill="#ffb3c1" font-size="21" font-weight="800">停止或回退條件</text><text x="85" y="1085" fill="#e6eefc" font-size="19">簽章不符、版本不符、無法安全開機</text><text x="85" y="1123" fill="#e6eefc" font-size="19">病人資料、時間、警報、介接或臨床功能異常</text><text x="85" y="1161" fill="#e6eefc" font-size="19">回退映像不可用、回退失敗或監測證據不足</text></g></svg>