<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療設備風險決策地圖</title><desc id="desc">以可利用性與臨床傷害兩軸分流監測、限期改善、立即控制與高階接受，不使用單一分數取代情境判斷。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><g font-family="Arial,Noto Sans TC,sans-serif"><text x="55" y="68" fill="#f7fbff" font-size="34" font-weight="800">兩軸分流，避免單一分數遮住臨床後果</text><text x="55" y="108" fill="#a8bddb" font-size="19">可利用性與臨床傷害需分開保存，再加入控制有效性與不確定性</text><text x="82" y="345" transform="rotate(-90 82 345)" text-anchor="middle" fill="#dce9f8" font-size="20" font-weight="800">臨床傷害程度提高</text><text x="665" y="625" text-anchor="middle" fill="#dce9f8" font-size="20" font-weight="800">可利用性與實際曝險提高</text><rect x="165" y="155" width="450" height="205" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="3"/><text x="200" y="205" fill="#ffd08a" font-size="25" font-weight="800">低利用 × 高傷害</text><text x="200" y="250" fill="#ffffff" font-size="19">保留高嚴重度情境，不因低機率刪除</text><text x="200" y="287" fill="#dce9f8" font-size="18">強化補償控制、降級程序與定期演練</text><text x="200" y="324" fill="#9fb7d5" font-size="17">觸發條件：曝險增加、控制失效、版本變更</text><rect x="635" y="155" width="450" height="205" rx="22" fill="#4a2230" stroke="#ff6b8b" stroke-width="3"/><text x="670" y="205" fill="#ff9fb4" font-size="25" font-weight="800">高利用 × 高傷害</text><text x="670" y="250" fill="#ffffff" font-size="19">立即降低暴露、限制使用或隔離</text><text x="670" y="287" fill="#dce9f8" font-size="18">啟動臨床替代方案與事件指揮</text><text x="670" y="324" fill="#ffc3cf" font-size="17">剩餘風險若仍高，須升級權責決策</text><rect x="165" y="380" width="450" height="175" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="3"/><text x="200" y="430" fill="#72f5cd" font-size="25" font-weight="800">低利用 × 低傷害</text><text x="200" y="475" fill="#ffffff" font-size="19">納入例行監測與版本追蹤</text><text x="200" y="512" fill="#dce9f8" font-size="18">保留重評門檻，不等於永久關閉</text><rect x="635" y="380" width="450" height="175" rx="22" fill="#123c55" stroke="#8fe8ff" stroke-width="3"/><text x="670" y="430" fill="#8fe8ff" font-size="25" font-weight="800">高利用 × 低傷害</text><text x="670" y="475" fill="#ffffff" font-size="19">限期修補、縮小曝險並驗證偵測</text><text x="670" y="512" fill="#dce9f8" font-size="18">避免低傷害事件累積成橫向移動入口</text></g></svg>