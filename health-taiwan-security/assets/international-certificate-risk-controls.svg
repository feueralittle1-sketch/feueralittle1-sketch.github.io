<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療憑證風險與控制證據圖</title><desc id="desc">憑證到期、錯誤信任鏈、私鑰外洩與手動更換失敗分別對應預防、偵測與復原證據。</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#152852"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#g)"/><text x="62" y="72" fill="#fff" font-size="36" font-weight="800">四類憑證失敗：控制要能留下可驗證證據</text><text x="62" y="112" fill="#a8bddc" font-size="22">告警只是開始；還要確認責任、部署結果、臨床交易與回退能力</text>
<g font-family="Inter,Noto Sans TC,sans-serif"><rect x="60" y="165" width="250" height="440" rx="28" fill="#341d35" stroke="#ff86bd" stroke-width="3"/><text x="185" y="220" text-anchor="middle" fill="#ff9ac8" font-size="28" font-weight="700">到期或漏管</text><text x="185" y="280" text-anchor="middle" fill="#fff" font-size="22">服務突然拒絕連線</text><text x="185" y="325" text-anchor="middle" fill="#fff" font-size="22">未知憑證無人續期</text><line x1="95" y1="365" x2="275" y2="365" stroke="#6d4564"/><text x="185" y="410" text-anchor="middle" fill="#82f7cc" font-size="22" font-weight="700">控制</text><text x="185" y="450" text-anchor="middle" fill="#dceafa" font-size="20">自動發現＋多級告警</text><text x="185" y="485" text-anchor="middle" fill="#dceafa" font-size="20">責任人與替補人</text><text x="185" y="535" text-anchor="middle" fill="#a9bddb" font-size="19">證據：清冊覆蓋率</text><text x="185" y="567" text-anchor="middle" fill="#a9bddb" font-size="19">告警確認與續期時效</text>
<rect x="335" y="165" width="250" height="440" rx="28" fill="#2d294d" stroke="#a491ff" stroke-width="3"/><text x="460" y="220" text-anchor="middle" fill="#c3b8ff" font-size="28" font-weight="700">信任鏈錯誤</text><text x="460" y="280" text-anchor="middle" fill="#fff" font-size="22">缺少中繼憑證</text><text x="460" y="325" text-anchor="middle" fill="#fff" font-size="22">主機名稱不相符</text><line x1="370" y1="365" x2="550" y2="365" stroke="#58517b"/><text x="460" y="410" text-anchor="middle" fill="#82f7cc" font-size="22" font-weight="700">控制</text><text x="460" y="450" text-anchor="middle" fill="#dceafa" font-size="20">預演＋外部探測</text><text x="460" y="485" text-anchor="middle" fill="#dceafa" font-size="20">端到端交易測試</text><text x="460" y="535" text-anchor="middle" fill="#a9bddb" font-size="19">證據：握手與相容矩陣</text><text x="460" y="567" text-anchor="middle" fill="#a9bddb" font-size="19">臨床回歸結果</text>
<rect x="610" y="165" width="250" height="440" rx="28" fill="#3b252a" stroke="#ff9d73" stroke-width="3"/><text x="735" y="220" text-anchor="middle" fill="#ffb18f" font-size="28" font-weight="700">私鑰外洩</text><text x="735" y="280" text-anchor="middle" fill="#fff" font-size="22">冒用服務身分</text><text x="735" y="325" text-anchor="middle" fill="#fff" font-size="22">加密信任遭破壞</text><line x1="645" y1="365" x2="825" y2="365" stroke="#70474a"/><text x="735" y="410" text-anchor="middle" fill="#82f7cc" font-size="22" font-weight="700">控制</text><text x="735" y="450" text-anchor="middle" fill="#dceafa" font-size="20">金鑰隔離＋最小權限</text><text x="735" y="485" text-anchor="middle" fill="#dceafa" font-size="20">撤銷與重發劇本</text><text x="735" y="535" text-anchor="middle" fill="#a9bddb" font-size="19">證據：撤銷時間</text><text x="735" y="567" text-anchor="middle" fill="#a9bddb" font-size="19">新舊金鑰切換紀錄</text>
<rect x="885" y="165" width="250" height="440" rx="28" fill="#173b3b" stroke="#72f0c1" stroke-width="3"/><text x="1010" y="220" text-anchor="middle" fill="#82f7cc" font-size="28" font-weight="700">更換失敗</text><text x="1010" y="280" text-anchor="middle" fill="#fff" font-size="22">批次放大中斷</text><text x="1010" y="325" text-anchor="middle" fill="#fff" font-size="22">設備不支援新鏈</text><line x1="920" y1="365" x2="1100" y2="365" stroke="#3e6964"/><text x="1010" y="410" text-anchor="middle" fill="#82f7cc" font-size="22" font-weight="700">控制</text><text x="1010" y="450" text-anchor="middle" fill="#dceafa" font-size="20">分批部署＋停止門檻</text><text x="1010" y="485" text-anchor="middle" fill="#dceafa" font-size="20">舊版保留與回退</text><text x="1010" y="535" text-anchor="middle" fill="#a9bddb" font-size="19">證據：批次成功率</text><text x="1010" y="567" text-anchor="middle" fill="#a9bddb" font-size="19">回退演練時間</text></g><rect x="60" y="635" width="1075" height="52" rx="16" fill="#0b1d36"/><text x="598" y="669" text-anchor="middle" fill="#d9e8fb" font-size="21">驗收原則：每項風險都要同時具備預防、偵測、復原與可追溯紀錄</text></svg>
