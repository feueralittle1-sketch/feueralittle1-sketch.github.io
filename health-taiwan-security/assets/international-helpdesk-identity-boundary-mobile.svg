<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版醫療服務台身分重設信任邊界</title><desc id="desc">可仿冒的來電與視訊請求，經院方控制的獨立驗證閘門後，才可觸發受控帳號動作。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">聲音與影像不是身分證明</text><text x="38" y="96" fill="#9fb7d5" font-size="18">請求必須轉成院方掌握的獨立證據</text><rect x="54" y="142" width="612" height="184" rx="24" fill="#3d2438" stroke="#ff8fc8" stroke-width="2"/><text x="88" y="192" fill="#ff9fd0" font-size="24" font-weight="800">不可信請求面</text><text x="88" y="236" fill="#f7d9e9" font-size="19">來電顯示 · 聲音／視訊 · 即時訊息</text><text x="88" y="278" fill="#f2a9cb" font-size="17">可能遭偽造、轉接或深偽生成</text><path d="M360 326v44" stroke="#ffb0d7" stroke-width="5"/><rect x="54" y="370" width="612" height="330" rx="24" fill="#112e4d" stroke="#63e6ff" stroke-width="3"/><text x="88" y="420" fill="#63e6ff" font-size="24" font-weight="800">院方驗證閘門</text><text x="88" y="470" fill="#e6eefc" font-size="19">① 回撥已登錄院內號碼</text><text x="88" y="516" fill="#e6eefc" font-size="19">② 既有受管裝置確認</text><text x="88" y="562" fill="#e6eefc" font-size="19">③ 工單與主管雙人核准</text><text x="88" y="608" fill="#e6eefc" font-size="19">④ 高風險重設延遲生效</text><text x="88" y="658" fill="#a9bdd9" font-size="17">來源彼此獨立，且全程可稽核</text><path d="M360 700v44" stroke="#72f5cd" stroke-width="5"/><rect x="54" y="744" width="612" height="184" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="88" y="794" fill="#72f5cd" font-size="24" font-weight="800">受控動作面</text><text x="88" y="840" fill="#ddfff4" font-size="19">重設密碼／MFA · 解鎖 · 臨時權杖</text><text x="88" y="884" fill="#9cebd2" font-size="17">通知、限時、最小權限與後續監測</text><rect x="54" y="968" width="612" height="72" rx="20" fill="#4b331d" stroke="#ffbd66" stroke-width="2"/><text x="360" y="1012" text-anchor="middle" fill="#fff1d7" font-size="18">高風險復原必須跳出原請求通道</text></g></svg>