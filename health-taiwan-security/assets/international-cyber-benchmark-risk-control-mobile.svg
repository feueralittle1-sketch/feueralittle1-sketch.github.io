<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc"><title id="title">跨院資安評估風險與控制手機版</title><desc id="desc">五種評估失真風險分別對應分層比較、資料最小化、證據抽查、有效期與改善責任控制。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081421"/><stop offset="1" stop-color="#241a3d"/></linearGradient></defs><rect width="720" height="1320" rx="28" fill="url(#bg)"/><text x="42" y="68" fill="#fff" font-size="32" font-weight="800">五個失真點與控制</text><text x="42" y="108" fill="#aabbd6" font-size="19">比較結果必須保留範圍與證據脈絡</text><g font-family="Arial, Noto Sans TC, sans-serif"><g><rect x="42" y="155" width="636" height="190" rx="22" fill="#30243a" stroke="#ff7f9e" stroke-width="3"/><text x="75" y="205" fill="#ffb5c6" font-size="20">風險 1</text><text x="75" y="245" fill="#fff" font-size="23" font-weight="800">不同服務被硬放在同一排名</text><text x="75" y="300" fill="#bff7e5" font-size="21">控制：依規模、服務與範圍分層</text></g><g><rect x="42" y="375" width="636" height="190" rx="22" fill="#30243a" stroke="#ff7f9e" stroke-width="3"/><text x="75" y="425" fill="#ffb5c6" font-size="20">風險 2</text><text x="75" y="465" fill="#fff" font-size="23" font-weight="800">原始弱點或資產明細外洩</text><text x="75" y="520" fill="#bff7e5" font-size="21">控制：最小化、去識別、權限分離</text></g><g><rect x="42" y="595" width="636" height="190" rx="22" fill="#30243a" stroke="#ff7f9e" stroke-width="3"/><text x="75" y="645" fill="#ffb5c6" font-size="20">風險 3</text><text x="75" y="685" fill="#fff" font-size="23" font-weight="800">為了高分而選擇性填答</text><text x="75" y="740" fill="#bff7e5" font-size="21">控制：證據抽查、核准與異常偵測</text></g><g><rect x="42" y="815" width="636" height="190" rx="22" fill="#30243a" stroke="#ff7f9e" stroke-width="3"/><text x="75" y="865" fill="#ffb5c6" font-size="20">風險 4</text><text x="75" y="905" fill="#fff" font-size="23" font-weight="800">舊資料被當成目前狀態</text><text x="75" y="960" fill="#bff7e5" font-size="21">控制：版本、有效期、變更觸發重測</text></g><g><rect x="42" y="1035" width="636" height="220" rx="22" fill="#30243a" stroke="#ff7f9e" stroke-width="3"/><text x="75" y="1085" fill="#ffb5c6" font-size="20">風險 5</text><text x="75" y="1125" fill="#fff" font-size="23" font-weight="800">報表完成後沒有改善行動</text><text x="75" y="1180" fill="#bff7e5" font-size="21">控制：責任人、期限、資源</text><text x="75" y="1215" fill="#bff7e5" font-size="21">與驗收證據</text></g></g></svg>
