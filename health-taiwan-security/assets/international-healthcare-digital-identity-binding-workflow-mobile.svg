<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc"><title id="title">手機版病人數位身分綁定流程</title><desc id="desc">場景分級、驗證憑證、病人配對、受限綁定、持續監測與撤銷復原的流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#132548"/></linearGradient></defs><rect width="390" height="1040" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="40" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">可撤回的身分綁定</text><text x="195" y="68" text-anchor="middle" fill="#9fb3d9" font-size="13">高風險存取不能只依一次成功驗證</text><g text-anchor="start"><g><rect x="35" y="95" width="320" height="105" rx="18" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="60" y="130" fill="#57f0c1" font-size="18" font-weight="800">01　場景分級</text><text x="60" y="162" fill="#e6eefc" font-size="14">查詢、下載、代理分開定義保證需求</text></g><g><rect x="35" y="215" width="320" height="105" rx="18" fill="#122a49" stroke="#63e6ff" stroke-width="3"/><text x="60" y="250" fill="#63e6ff" font-size="18" font-weight="800">02　驗證憑證</text><text x="60" y="282" fill="#e6eefc" font-size="14">簽章、狀態、來源、持有與防重播</text></g><g><rect x="35" y="335" width="320" height="105" rx="18" fill="#1b2848" stroke="#a997ff" stroke-width="3"/><text x="60" y="370" fill="#c5baff" font-size="18" font-weight="800">03　病人配對</text><text x="60" y="402" fill="#e6eefc" font-size="14">主索引衝突、重複紀錄轉人工處理</text></g><g><rect x="35" y="455" width="320" height="105" rx="18" fill="#2b2340" stroke="#ffb86b" stroke-width="3"/><text x="60" y="490" fill="#ffcf99" font-size="18" font-weight="800">04　受限綁定</text><text x="60" y="522" fill="#e6eefc" font-size="14">限制期限、用途、裝置與敏感操作</text></g><g><rect x="35" y="575" width="320" height="105" rx="18" fill="#153044" stroke="#63e6ff" stroke-width="3"/><text x="60" y="610" fill="#8fe8ff" font-size="18" font-weight="800">05　持續監測</text><text x="60" y="642" fill="#e6eefc" font-size="14">異常裝置、行為與狀態變更即降權</text></g><g><rect x="35" y="695" width="320" height="105" rx="18" fill="#3a1f2e" stroke="#ff7a9d" stroke-width="3"/><text x="60" y="730" fill="#ff9db7" font-size="18" font-weight="800">06　撤銷復原</text><text x="60" y="762" fill="#e6eefc" font-size="14">遺失、換機、代理與帳號接管處理</text></g></g><rect x="25" y="830" width="340" height="150" rx="20" fill="#0e2038" stroke="#71a7ff" stroke-width="2"/><text x="195" y="865" text-anchor="middle" fill="#a8c8ff" font-size="18" font-weight="800">驗收證據</text><g fill="#e6eefc" font-size="13"><text x="50" y="900">• 錯配與重複病歷率</text><text x="50" y="928">• 人工例外處理時效</text><text x="50" y="956">• 撤銷生效與復原再驗證時間</text></g><text x="195" y="1015" text-anchor="middle" fill="#57f0c1" font-size="13">先從低風險查詢試點，再擴大敏感操作</text></g></svg>
