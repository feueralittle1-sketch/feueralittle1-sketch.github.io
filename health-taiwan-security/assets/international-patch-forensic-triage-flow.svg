<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">緊急漏洞處置與鑑識分流流程</title><desc id="desc">從漏洞通知開始，依範圍確認、證據保全、修補穩定、隔離控制、鑑識分析與升級決策六步驟處置。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#111e3d"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<text x="65" y="70" fill="#f4f8ff" font-size="34" font-weight="700">緊急修補前先回答：哪些證據不能被更新覆蓋？</text><text x="65" y="110" fill="#9fb3d9" font-size="21">範圍、證據、修補與隔離並行協調，避免只修掉漏洞卻失去入侵判定能力</text>
<g font-family="sans-serif"><g fill="#122a3e" stroke="#63e6ff" stroke-width="2"><rect x="55" y="180" width="170" height="155" rx="22"/><rect x="240" y="180" width="170" height="155" rx="22"/><rect x="425" y="180" width="170" height="155" rx="22"/><rect x="610" y="180" width="170" height="155" rx="22"/><rect x="795" y="180" width="170" height="155" rx="22"/><rect x="980" y="180" width="170" height="155" rx="22"/></g>
<g text-anchor="middle"><text x="140" y="220" fill="#63e6ff" font-size="19" font-weight="700">01 範圍確認</text><text x="140" y="260" fill="#e6eefc" font-size="18">版本／資產</text><text x="140" y="290" fill="#e6eefc" font-size="18">對外曝險</text><text x="325" y="220" fill="#63e6ff" font-size="19" font-weight="700">02 證據保全</text><text x="325" y="260" fill="#e6eefc" font-size="18">記憶體／日誌</text><text x="325" y="290" fill="#e6eefc" font-size="18">時間與來源</text><text x="510" y="220" fill="#63e6ff" font-size="19" font-weight="700">03 修補穩定</text><text x="510" y="260" fill="#e6eefc" font-size="18">更新／回滾</text><text x="510" y="290" fill="#e6eefc" font-size="18">臨床檢核</text><text x="695" y="220" fill="#63e6ff" font-size="19" font-weight="700">04 隔離控制</text><text x="695" y="260" fill="#e6eefc" font-size="18">限制路徑</text><text x="695" y="290" fill="#e6eefc" font-size="18">保留監測</text><text x="880" y="220" fill="#63e6ff" font-size="19" font-weight="700">05 鑑識分析</text><text x="880" y="260" fill="#e6eefc" font-size="18">入侵／橫移</text><text x="880" y="290" fill="#e6eefc" font-size="18">持久化／外洩</text><text x="1065" y="220" fill="#63e6ff" font-size="19" font-weight="700">06 升級決策</text><text x="1065" y="260" fill="#e6eefc" font-size="18">無／疑似／確認</text><text x="1065" y="290" fill="#e6eefc" font-size="18">後續回應</text></g>
<path d="M225 258h8M410 258h8M595 258h8M780 258h8M965 258h8" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
<rect x="70" y="405" width="325" height="150" rx="22" fill="#242744" stroke="#a997ff" stroke-width="2"/><text x="100" y="447" fill="#c5b9ff" font-size="23" font-weight="700">不可延後的共同底線</text><text x="100" y="487" fill="#e6eefc" font-size="19">• 帶外協調與具名責任</text><text x="100" y="520" fill="#e6eefc" font-size="19">• 變更、證據與決策留痕</text><rect x="435" y="405" width="325" height="150" rx="22" fill="#35233b" stroke="#ff6b91" stroke-width="2"/><text x="465" y="447" fill="#ff9ab2" font-size="23" font-weight="700">需要風險權衡</text><text x="465" y="487" fill="#e6eefc" font-size="19">• 證據完整度與修補速度</text><text x="465" y="520" fill="#e6eefc" font-size="19">• 隔離範圍與臨床可用性</text><rect x="800" y="405" width="325" height="150" rx="22" fill="#12343a" stroke="#57f0c1" stroke-width="2"/><text x="830" y="447" fill="#57f0c1" font-size="23" font-weight="700">完成證據</text><text x="830" y="487" fill="#e6eefc" font-size="19">• 修補覆蓋與功能驗證</text><text x="830" y="520" fill="#e6eefc" font-size="19">• 鑑識結論與監測條件</text></g>
<rect x="145" y="595" width="910" height="45" rx="22" fill="#0b1d34" stroke="#36547c"/><text x="600" y="624" text-anchor="middle" fill="#d8e6fa" font-size="20">順序可依事件重疊執行，但修補前的最低證據集合必須事先定義</text></svg>