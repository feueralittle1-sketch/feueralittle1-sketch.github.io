<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">高影響端點指令的分批核准流程</title><desc id="desc">端點管理變更從提出目的、評估臨床範圍、雙人核准、小批試點、監測停止條件到擴大部署與證據歸檔。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#18254b"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="66" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">高影響指令不應從「核准」直接跳到「全院」</text><text x="600" y="105" text-anchor="middle" fill="#9fb3d9" font-size="20">以批次、停止條件與可回退路徑限制管理平面的爆炸半徑</text>
<g fill="#102f54" stroke="#4f7fab" stroke-width="3"><rect x="45" y="190" width="165" height="116" rx="23"/><rect x="235" y="190" width="165" height="116" rx="23"/><rect x="425" y="190" width="165" height="116" rx="23"/><rect x="615" y="190" width="165" height="116" rx="23"/><rect x="805" y="190" width="165" height="116" rx="23"/><rect x="995" y="190" width="160" height="116" rx="23"/></g><g fill="#fff" font-size="22" font-weight="700" text-anchor="middle"><text x="128" y="235">① 定義目的</text><text x="318" y="235">② 分析範圍</text><text x="508" y="235">③ 雙人核准</text><text x="698" y="235">④ 小批試點</text><text x="888" y="235">⑤ 監測判定</text><text x="1075" y="235">⑥ 分批擴大</text></g><g fill="#b9c9e2" font-size="17" text-anchor="middle"><text x="128" y="271">指令與預期結果</text><text x="318" y="271">臨床群組與時段</text><text x="508" y="271">權責與例外確認</text><text x="698" y="271">代表性裝置驗證</text><text x="888" y="271">失敗率與服務影響</text><text x="1075" y="271">完成與證據歸檔</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"><path d="M210 248H230"/><path d="M400 248H420"/><path d="M590 248H610"/><path d="M780 248H800"/><path d="M970 248H990"/></g>
<rect x="365" y="383" width="470" height="118" rx="26" fill="#4b2b3c" stroke="#ff7897" stroke-width="3"/><text x="600" y="428" text-anchor="middle" fill="#ffd0dc" font-size="26" font-weight="700">觸發停止條件</text><text x="600" y="467" text-anchor="middle" fill="#ffe7ed" font-size="19">異常登出、設備離線、臨床應用失效、失敗率超標或稽核中斷</text><path d="M888 306V370H835" stroke="#ff7897" stroke-width="4" marker-end="url(#a)"/>
<rect x="365" y="555" width="470" height="92" rx="24" fill="#16463f" stroke="#57f0c1" stroke-width="3"/><text x="600" y="594" text-anchor="middle" fill="#9ff9df" font-size="24" font-weight="700">隔離批次 → 回退組態 → 臨床確認 → 復盤</text><text x="600" y="625" text-anchor="middle" fill="#d7f5ea" font-size="18">回退本身也要演練，不能只保存原始設定檔</text><path d="M600 501V545" stroke="#57f0c1" stroke-width="4" marker-end="url(#a)"/></g></svg>
