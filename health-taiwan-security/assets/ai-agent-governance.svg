<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">醫療 AI Agent 安全治理架構</title><desc id="desc">使用者請求經身分驗證、權限政策、人工確認後才可由 AI Agent 呼叫工具與資料，並全程記錄稽核。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1730"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><text x="60" y="65" fill="#f8fafc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="30" font-weight="700">醫療 AI Agent：每一次動作都要有治理邊界</text><text x="60" y="101" fill="#9fb3d9" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">不是讓 Agent 自己決定一切，而是讓身分、權限、人工確認與稽核一起約束它</text>
<g fill="none" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"><path d="M220 270H305"/><path d="M475 270H555"/><path d="M725 270H805"/><path d="M970 270H1060"/></g><g fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"><path d="M640 330V425"/></g>
<g font-family="Arial,'Noto Sans TC',sans-serif"><g><rect x="60" y="205" width="160" height="130" rx="20" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/><text x="140" y="246" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">使用者請求</text><text x="140" y="282" text-anchor="middle" fill="#cbd5e1" font-size="15">人員・裝置・情境</text></g><g><rect x="305" y="205" width="170" height="130" rx="20" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="390" y="246" text-anchor="middle" fill="#a78bfa" font-size="19" font-weight="700">身分與權限</text><text x="390" y="282" text-anchor="middle" fill="#cbd5e1" font-size="15">最小權限・時效</text></g><g><rect x="555" y="190" width="170" height="160" rx="22" fill="#0f2433" stroke="#63e6ff" stroke-width="3"/><text x="640" y="238" text-anchor="middle" fill="#63e6ff" font-size="20" font-weight="700">AI Agent</text><text x="640" y="276" text-anchor="middle" fill="#e2e8f0" font-size="15">規劃與工具選擇</text><text x="640" y="307" text-anchor="middle" fill="#e2e8f0" font-size="15">敏感動作先停下</text></g><g><rect x="805" y="205" width="165" height="130" rx="20" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/><text x="887" y="246" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="700">人工確認</text><text x="887" y="282" text-anchor="middle" fill="#cbd5e1" font-size="15">核准・拒絕・限縮</text></g><g><rect x="1060" y="205" width="100" height="130" rx="20" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="1110" y="246" text-anchor="middle" fill="#34d399" font-size="17" font-weight="700">執行</text><text x="1110" y="282" text-anchor="middle" fill="#cbd5e1" font-size="14">工具</text><text x="1110" y="307" text-anchor="middle" fill="#cbd5e1" font-size="14">資料</text></g><g><rect x="430" y="425" width="420" height="105" rx="20" fill="#2b1320" stroke="#fb7185" stroke-width="2"/><text x="640" y="465" text-anchor="middle" fill="#fb7185" font-size="19" font-weight="700">全程稽核與風險監控</text><text x="640" y="499" text-anchor="middle" fill="#e2e8f0" font-size="15">輸入、決策、資料讀取、工具呼叫、核准者、結果與例外</text></g></g><text x="60" y="575" fill="#64748b" font-family="Arial,'Noto Sans TC',sans-serif" font-size="15">Dr. William｜健康台灣深耕計畫－資安治理專欄</text></svg>