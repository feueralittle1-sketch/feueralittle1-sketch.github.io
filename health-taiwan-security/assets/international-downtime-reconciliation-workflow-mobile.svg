<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 980" role="img" aria-labelledby="title desc"><title id="title">停機資料對帳六階段流程手機版</title><desc id="desc">依序凍結、盤點、排序、分流、覆核與放行停機資料。</desc><rect width="390" height="980" rx="24" fill="#07111f"/><text x="22" y="45" fill="#fff" font-size="22" font-weight="800">停機資料對帳六階段</text><text x="22" y="74" fill="#9fb3d9" font-size="14">先建立工作佇列，再分批回寫正式系統</text><g font-family="system-ui,'Noto Sans TC',sans-serif"><g fill="#102a46" stroke="#31567e" stroke-width="2"><rect x="22" y="105" width="346" height="110" rx="18"/><rect x="22" y="235" width="346" height="110" rx="18"/><rect x="22" y="365" width="346" height="110" rx="18"/><rect x="22" y="495" width="346" height="110" rx="18"/><rect x="22" y="625" width="346" height="110" rx="18"/><rect x="22" y="755" width="346" height="110" rx="18"/></g><g font-size="18" font-weight="700"><text x="46" y="145" fill="#63e6ff">1 凍結可信還原點</text><text x="46" y="177" fill="#d3e4f5" font-size="15" font-weight="400">保存最後已知良好狀態與日誌</text><text x="46" y="275" fill="#9cc4ff">2 盤點全部資料源</text><text x="46" y="307" fill="#d3e4f5" font-size="15" font-weight="400">紙本、離線、設備暫存標記來源時間</text><text x="46" y="405" fill="#c7b8ff">3 排序高風險紀錄</text><text x="46" y="437" fill="#d3e4f5" font-size="15" font-weight="400">用藥、過敏、檢驗與處置優先</text><text x="46" y="535" fill="#ffb69b">4 分流缺漏與衝突</text><text x="46" y="567" fill="#d3e4f5" font-size="15" font-weight="400">重複、矛盾、待確認項目進例外佇列</text><text x="46" y="665" fill="#85f4d3">5 臨床與資訊覆核</text><text x="46" y="697" fill="#d3e4f5" font-size="15" font-weight="400">確認病人、事實、處置與責任人</text><text x="46" y="795" fill="#9cc4ff">6 分批回寫與放行</text><text x="46" y="827" fill="#d3e4f5" font-size="15" font-weight="400">抽核錯誤率並保存批次與操作者</text></g><rect x="22" y="892" width="346" height="62" rx="16" fill="#0e3a43" stroke="#57f0c1" stroke-width="2"/><text x="195" y="918" text-anchor="middle" fill="#57f0c1" font-size="15" font-weight="700">遇身分不明或高風險衝突立即停止</text><text x="195" y="941" text-anchor="middle" fill="#d9fff4" font-size="13">隔離資料，完成確認後再續行</text></g></svg>