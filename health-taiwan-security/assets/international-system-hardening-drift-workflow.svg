<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療系統硬化與設定漂移處置流程</title>
  <desc id="desc">從服務盤點、基線設計、隔離測試、核准部署、漂移監測到修正與臨床回歸的六階段流程。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102343"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#69defd"/></marker></defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f5f8ff" font-size="34" font-weight="700">六階段硬化生命週期：從可測基線走到漂移關閉</text>
  <text x="60" y="110" fill="#9eb7d8" font-size="21">高影響設定不可只看掃描通過，還要驗證臨床功能、回退能力與持續一致性。</text>
  <g font-family="sans-serif">
    <g transform="translate(55 165)"><rect width="330" height="130" rx="24" fill="#11314c" stroke="#63e6ff" stroke-width="2"/><circle cx="52" cy="48" r="27" fill="#63e6ff"/><text x="52" y="57" text-anchor="middle" fill="#071426" font-size="25" font-weight="700">1</text><text x="95" y="48" fill="#fff" font-size="25" font-weight="700">服務與資產盤點</text><text x="95" y="86" fill="#b8cbe5" font-size="20">用途、版本、依賴、責任人</text></g>
    <g transform="translate(435 165)"><rect width="330" height="130" rx="24" fill="#1a2952" stroke="#aa98ff" stroke-width="2"/><circle cx="52" cy="48" r="27" fill="#aa98ff"/><text x="52" y="57" text-anchor="middle" fill="#071426" font-size="25" font-weight="700">2</text><text x="95" y="48" fill="#fff" font-size="25" font-weight="700">基線與例外設計</text><text x="95" y="86" fill="#c7c1e8" font-size="20">控制值、補償、到期日</text></g>
    <g transform="translate(815 165)"><rect width="330" height="130" rx="24" fill="#123b3d" stroke="#57f0c1" stroke-width="2"/><circle cx="52" cy="48" r="27" fill="#57f0c1"/><text x="52" y="57" text-anchor="middle" fill="#071426" font-size="25" font-weight="700">3</text><text x="95" y="48" fill="#fff" font-size="25" font-weight="700">隔離測試</text><text x="95" y="86" fill="#bae5db" font-size="20">安全、效能、臨床回歸</text></g>
    <path d="M385 230H425" stroke="#69defd" stroke-width="5" marker-end="url(#a)"/><path d="M765 230H805" stroke="#69defd" stroke-width="5" marker-end="url(#a)"/>
    <g transform="translate(815 405)"><rect width="330" height="130" rx="24" fill="#432b43" stroke="#ff9bc2" stroke-width="2"/><circle cx="52" cy="48" r="27" fill="#ff9bc2"/><text x="52" y="57" text-anchor="middle" fill="#071426" font-size="25" font-weight="700">4</text><text x="95" y="48" fill="#fff" font-size="25" font-weight="700">核准與分批部署</text><text x="95" y="86" fill="#e9c2d3" font-size="20">窗口、監測、停止條件</text></g>
    <g transform="translate(435 405)"><rect width="330" height="130" rx="24" fill="#3b3420" stroke="#ffd166" stroke-width="2"/><circle cx="52" cy="48" r="27" fill="#ffd166"/><text x="52" y="57" text-anchor="middle" fill="#071426" font-size="25" font-weight="700">5</text><text x="95" y="48" fill="#fff" font-size="25" font-weight="700">漂移偵測與分流</text><text x="95" y="86" fill="#e8ddb4" font-size="20">差異、來源、風險、期限</text></g>
    <g transform="translate(55 405)"><rect width="330" height="130" rx="24" fill="#17394c" stroke="#72ddff" stroke-width="2"/><circle cx="52" cy="48" r="27" fill="#72ddff"/><text x="52" y="57" text-anchor="middle" fill="#071426" font-size="25" font-weight="700">6</text><text x="95" y="48" fill="#fff" font-size="25" font-weight="700">修正與驗證關閉</text><text x="95" y="86" fill="#bdd9e6" font-size="20">復原、複測、臨床簽核</text></g>
    <path d="M980 295V395" stroke="#69defd" stroke-width="5" marker-end="url(#a)"/><path d="M815 470H775" stroke="#69defd" stroke-width="5" marker-end="url(#a)"/><path d="M435 470H395" stroke="#69defd" stroke-width="5" marker-end="url(#a)"/>
    <rect x="55" y="590" width="1090" height="62" rx="20" fill="#0b1b31" stroke="#2d5878"/><text x="600" y="630" text-anchor="middle" fill="#b8cbe5" font-size="22">驗收單位：一項具名資產 × 一版核准基線 × 一次差異判定 × 一份臨床回歸證據</text>
  </g>
</svg>
