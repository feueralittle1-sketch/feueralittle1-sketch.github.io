<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">臨床研究平台六步處置流程</title><desc id="desc">從曝險確認、證據保全、限制攻擊面、修補重建、資料核對到受控恢復。</desc><rect width="1200" height="720" rx="28" fill="#08182b"/><text x="600" y="62" text-anchor="middle" font-family="Inter,Noto Sans TC,sans-serif" font-size="34" font-weight="800" fill="#fff">修補、鑑識與資料核對必須並行</text><g font-family="Inter,Noto Sans TC,sans-serif"><path d="M115 340H1085" stroke="#42617f" stroke-width="8"/><g fill="#102742" stroke-width="3"><circle cx="130" cy="340" r="77" stroke="#7aa7ff"/><circle cx="318" cy="340" r="77" stroke="#67e8f9"/><circle cx="506" cy="340" r="77" stroke="#fbbf24"/><circle cx="694" cy="340" r="77" stroke="#b8a7ff"/><circle cx="882" cy="340" r="77" stroke="#5eead4"/><circle cx="1070" cy="340" r="77" stroke="#fb7185"/></g><g text-anchor="middle" fill="#fff"><text x="130" y="330" font-size="24" font-weight="800">曝險確認</text><text x="130" y="368" font-size="18">版本與入口</text><text x="318" y="330" font-size="24" font-weight="800">證據保全</text><text x="318" y="368" font-size="18">日誌與映像</text><text x="506" y="330" font-size="24" font-weight="800">限制攻擊面</text><text x="506" y="368" font-size="18">停用與隔離</text><text x="694" y="330" font-size="24" font-weight="800">修補重建</text><text x="694" y="368" font-size="18">更新與輪替</text><text x="882" y="330" font-size="24" font-weight="800">資料核對</text><text x="882" y="368" font-size="18">完整性分流</text><text x="1070" y="330" font-size="24" font-weight="800">受控恢復</text><text x="1070" y="368" font-size="18">逐步開放</text></g><g text-anchor="middle" font-size="20" fill="#b8c8df"><text x="130" y="495">外網／問卷</text><text x="318" y="495">先留證再改</text><text x="506" y="495">降低可利用性</text><text x="694" y="495">已知良好基線</text><text x="882" y="495">逐研究案核對</text><text x="1070" y="495">監測與結案</text></g><rect x="165" y="575" width="870" height="72" rx="22" fill="#142b3d" stroke="#63e6ff"/><text x="600" y="620" text-anchor="middle" font-size="23" fill="#e6eefc">恢復閘門：弱點已關閉｜秘密已輪替｜資料異常已分流｜責任人已核准</text></g></svg>