<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">醫療資安持續保證導入流程</title><desc id="desc">醫院從選定高影響服務開始，建立控制對照、資料連接、證據品質檢查、人工評估、改善關閉與定期重驗。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#57f0c1"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f4f8ff" font-size="34" font-weight="800">六階段建立持續保證流程</text><text x="600" y="98" text-anchor="middle" fill="#9fb3d9" font-size="19">先從一項高影響臨床服務完成閉環，再擴大到全院</text>
<path d="M150 250H1050" stroke="#57f0c1" stroke-width="8" marker-end="url(#m)"/><g text-anchor="middle"><g fill="#10213d" stroke="#63e6ff" stroke-width="3"><circle cx="150" cy="250" r="72"/><circle cx="330" cy="250" r="72"/><circle cx="510" cy="250" r="72"/><circle cx="690" cy="250" r="72"/><circle cx="870" cy="250" r="72"/><circle cx="1050" cy="250" r="72"/></g><g fill="#fff" font-size="21" font-weight="800"><text x="150" y="244">1 界定</text><text x="150" y="273" font-size="17" font-weight="400">服務與控制</text><text x="330" y="244">2 對照</text><text x="330" y="273" font-size="17" font-weight="400">識別碼與責任</text><text x="510" y="244">3 連接</text><text x="510" y="273" font-size="17" font-weight="400">資料與證據</text><text x="690" y="244">4 評估</text><text x="690" y="273" font-size="17" font-weight="400">品質與缺口</text><text x="870" y="244">5 關閉</text><text x="870" y="273" font-size="17" font-weight="400">改善與驗證</text><text x="1050" y="244">6 重驗</text><text x="1050" y="273" font-size="17" font-weight="400">變更與趨勢</text></g></g>
<g font-size="18"><rect x="70" y="405" width="310" height="135" rx="25" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="225" y="448" text-anchor="middle" fill="#c5baff" font-size="22" font-weight="800">最小可行資料集</text><text x="100" y="486" fill="#e8e3ff">控制編號、資產、責任人</text><text x="100" y="518" fill="#e8e3ff">證據時間、來源、完整性、結果</text><rect x="445" y="405" width="310" height="135" rx="25" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="600" y="448" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="800">人工確認閘門</text><text x="475" y="486" fill="#d9fff3">適用範圍、例外、臨床影響</text><text x="475" y="518" fill="#d9fff3">剩餘風險、核准與停止條件</text><rect x="820" y="405" width="310" height="135" rx="25" fill="#31263d" stroke="#ffb86b" stroke-width="3"/><text x="975" y="448" text-anchor="middle" fill="#ffcf99" font-size="22" font-weight="800">驗收指標</text><text x="850" y="486" fill="#fff0dd">證據新鮮度、覆蓋率、缺口逾期</text><text x="850" y="518" fill="#fff0dd">重驗通過率、臨床中斷件數</text></g><text x="600" y="620" text-anchor="middle" fill="#9fb3d9" font-size="19">每次系統變更、重大事件或證據失效，都應觸發重新評估</text></g></svg>
