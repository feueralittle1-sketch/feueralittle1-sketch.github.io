<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc"><title id="title">手機版跨院聯邦學習六階段驗收流程</title><desc id="desc">聯邦學習由用途界定、威脅模型、隱私效用、平台測試、臨床重驗與持續監測形成六階段閉環。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1180" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="57" fill="#f7fbff" font-size="28" font-weight="800">聯邦學習六階段驗收閉環</text><text x="38" y="96" fill="#9fb7d5" font-size="18">先驗證，再讓模型進入臨床流程</text>
<g><rect x="50" y="130" width="620" height="132" rx="22" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="80" y="174" fill="#63e6ff" font-size="22" font-weight="800">01 界定用途與參與者</text><text x="80" y="218" fill="#e6eefc" font-size="18">臨床目的、資料類型、院所角色與退出條件</text><rect x="50" y="280" width="620" height="132" rx="22" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="80" y="324" fill="#b9adff" font-size="22" font-weight="800">02 建立威脅模型</text><text x="80" y="368" fill="#e6eefc" font-size="18">梯度外洩、投毒、冒名節點與平台失陷</text><rect x="50" y="430" width="620" height="132" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="80" y="474" fill="#72f5cd" font-size="22" font-weight="800">03 隱私與效用基準</text><text x="80" y="518" fill="#e6eefc" font-size="18">隱私參數、攻擊測試、準確度與分群門檻</text><rect x="50" y="580" width="620" height="132" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="80" y="624" fill="#ffd08a" font-size="22" font-weight="800">04 平台安全測試</text><text x="80" y="668" fill="#fff1dc" font-size="18">身分、簽章、傳輸、權限、日誌與撤權</text><rect x="50" y="730" width="620" height="132" rx="22" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="80" y="774" fill="#63e6ff" font-size="22" font-weight="800">05 臨床與公平性重驗</text><text x="80" y="818" fill="#e6eefc" font-size="18">用途內效能、次族群差異、人工覆核與回退</text><rect x="50" y="880" width="620" height="132" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="80" y="924" fill="#72f5cd" font-size="22" font-weight="800">06 持續監測與重驗</text><text x="80" y="968" fill="#e6eefc" font-size="18">參與者、資料與模型漂移；事件停用與結案</text></g><rect x="50" y="1040" width="620" height="92" rx="22" fill="#112e4d" stroke="#8fe8ff" stroke-width="2"/><text x="80" y="1078" fill="#8fe8ff" font-size="20" font-weight="800">放行條件</text><text x="80" y="1113" fill="#e6eefc" font-size="17">隱私、完整性、臨床門檻與停止回退均可驗證</text></g></svg>
