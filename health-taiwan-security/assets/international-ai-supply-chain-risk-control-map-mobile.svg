<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">第三方 AI 風險與控制對照圖手機版</title><desc id="desc">五項第三方 AI 風險分別對應清冊、變更閘門、資料限制、監測回退與退出演練。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17213e"/></linearGradient></defs><rect width="720" height="1260" rx="30" fill="url(#bg)"/><text x="48" y="68" fill="#fff" font-size="30" font-weight="800">風險與控制要成對</text><text x="48" y="106" fill="#9fb3d9" font-size="18">每項控制都要留下院內可查證證據</text><g><rect x="48" y="150" width="624" height="185" rx="22" fill="#182943" stroke="#536d95"/><text x="78" y="195" fill="#ffb3b3" font-size="24" font-weight="700">隱藏依賴</text><text x="78" y="235" fill="#c6d4eb" font-size="18">底層模型、外掛與次處理者不可見</text><text x="78" y="278" fill="#63e6ff" font-size="19" font-weight="700">主動清冊＋資料流＋依賴關係圖</text><text x="78" y="310" fill="#e6eefc" font-size="17">證據：版本、擁有人、位置、接續方案</text><rect x="48" y="355" width="624" height="185" rx="22" fill="#182943" stroke="#536d95"/><text x="78" y="400" fill="#ffb3b3" font-size="24" font-weight="700">未通知變更</text><text x="78" y="440" fill="#c6d4eb" font-size="18">模型、資料或安全機制直接變更</text><text x="78" y="483" fill="#63e6ff" font-size="19" font-weight="700">預告期限＋重大變更閘門</text><text x="78" y="515" fill="#e6eefc" font-size="17">證據：差異、再驗證、核准與回退</text><rect x="48" y="560" width="624" height="185" rx="22" fill="#182943" stroke="#536d95"/><text x="78" y="605" fill="#ffb3b3" font-size="24" font-weight="700">資料外流</text><text x="78" y="645" fill="#c6d4eb" font-size="18">病歷或提示被留存、訓練或轉交</text><text x="78" y="688" fill="#63e6ff" font-size="19" font-weight="700">最小資料＋用途限制＋刪除驗證</text><text x="78" y="720" fill="#e6eefc" font-size="17">證據：欄位、留存期、位置、刪除證明</text><rect x="48" y="765" width="624" height="185" rx="22" fill="#182943" stroke="#536d95"/><text x="78" y="810" fill="#ffb3b3" font-size="24" font-weight="700">模型失效</text><text x="78" y="850" fill="#c6d4eb" font-size="18">漂移、注入、錯誤輸出或服務中斷</text><text x="78" y="893" fill="#63e6ff" font-size="19" font-weight="700">監測＋人工覆核＋安全回退</text><text x="78" y="925" fill="#e6eefc" font-size="17">證據：門檻、停用時間、替代流程演練</text><rect x="48" y="970" width="624" height="185" rx="22" fill="#182943" stroke="#536d95"/><text x="78" y="1015" fill="#ffb3b3" font-size="24" font-weight="700">供應商退場</text><text x="78" y="1055" fill="#c6d4eb" font-size="18">資料、模型或工作流程無法接續</text><text x="78" y="1098" fill="#63e6ff" font-size="19" font-weight="700">可攜格式＋撤權＋退出演練</text><text x="78" y="1130" fill="#e6eefc" font-size="17">證據：遷移、金鑰撤銷、殘留檢查</text></g><text x="360" y="1210" fill="#9fb3d9" font-size="17" text-anchor="middle">安全、隱私、臨床品質與持續運作共同驗收</text></svg>