<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">院內 IP 攝影機風險與控制對照</title><desc id="desc">將實體存取、硬編碼憑證、公開管理面與停止支援四類風險，對應控制及驗收證據。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#10264c"/></linearGradient></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-size="34" font-weight="800">風險不只在網路：鏡頭本體也是信任邊界</text><text x="60" y="106" fill="#9fb3d9" font-size="20">控制要能對應可觀察、可測試、可追查的證據</text>
<g font-size="20"><rect x="50" y="150" width="1100" height="65" rx="18" fill="#192d4a"/><text x="85" y="191" fill="#ffb1cc" font-weight="700">風險情境</text><text x="390" y="191" fill="#8fe8ff" font-weight="700">核心控制</text><text x="820" y="191" fill="#b8ffe7" font-weight="700">驗收證據</text>
<g><rect x="50" y="230" width="1100" height="96" rx="18" fill="#102039" stroke="#3c587c"/><text x="85" y="267" fill="#fff" font-weight="700">實體接觸設備</text><text x="85" y="299" fill="#a8bad8">可接觸開機介面或連接埠</text><text x="390" y="267" fill="#fff">防拆、封閉安裝、停用非必要介面</text><text x="390" y="299" fill="#a8bad8">異常拆卸列入事件流程</text><text x="820" y="267" fill="#fff">現場抽查與防拆告警</text><text x="820" y="299" fill="#a8bad8">設備位置及保管責任</text></g>
<g><rect x="50" y="338" width="1100" height="96" rx="18" fill="#14243d" stroke="#3c587c"/><text x="85" y="375" fill="#fff" font-weight="700">硬編碼或共用憑證</text><text x="85" y="407" fill="#a8bad8">無法輪替或設備共用祕密</text><text x="390" y="375" fill="#fff">拒收、補償隔離、限時管理</text><text x="390" y="407" fill="#a8bad8">採購要求唯一身分與安全重設</text><text x="820" y="375" fill="#fff">憑證輪替測試</text><text x="820" y="407" fill="#a8bad8">例外風險核准與到期日</text></g>
<g><rect x="50" y="446" width="1100" height="96" rx="18" fill="#102039" stroke="#3c587c"/><text x="85" y="483" fill="#fff" font-weight="700">公開或橫向管理面</text><text x="85" y="515" fill="#a8bad8">辦公網與外網可直接登入</text><text x="390" y="483" fill="#fff">獨立設備區、跳板、來源允許清單</text><text x="390" y="515" fill="#a8bad8">管理與影像流分離</text><text x="820" y="483" fill="#fff">外部掃描與流向實測</text><text x="820" y="515" fill="#a8bad8">登入、設定變更與錄製日誌</text></g>
<g><rect x="50" y="554" width="1100" height="96" rx="18" fill="#14243d" stroke="#3c587c"/><text x="85" y="591" fill="#fff" font-weight="700">無更新或供應商失聯</text><text x="85" y="623" fill="#a8bad8">弱點無修正版與無退場路徑</text><text x="390" y="591" fill="#fff">替換時程、離線備品、資料抹除</text><text x="390" y="623" fill="#a8bad8">契約要求支援期限與揭露窗口</text><text x="820" y="591" fill="#fff">EOL 清單與替換完成率</text><text x="820" y="623" fill="#a8bad8">停用、撤權與庫存同步</text></g></g>
</svg>