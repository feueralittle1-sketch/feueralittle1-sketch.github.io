<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">加密模組遷移風險與驗收證據</title>
<desc id="desc">將證書誤讀、產品版本錯配、未測試更新及長期停留舊版四種風險，對應控制與驗收證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#171637"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/>
<text x="70" y="72" fill="#f5fbff" font-size="36" font-weight="700">主要失敗不是演算法名稱，而是證據與實際部署脫節</text><text x="70" y="112" fill="#9fb6d7" font-size="20">每項風險都要連到可重做的控制與臨床驗收結果。</text>
<g font-family="Arial,'Noto Sans TC',sans-serif"><text x="90" y="175" fill="#ff9ecf" font-size="22" font-weight="700">風險</text><text x="450" y="175" fill="#63e6ff" font-size="22" font-weight="700">控制</text><text x="850" y="175" fill="#78f5cf" font-size="22" font-weight="700">驗收證據</text>
<g fill="#112943" stroke="#354f70" stroke-width="2"><rect x="70" y="205" width="310" height="95" rx="20"/><rect x="420" y="205" width="350" height="95" rx="20"/><rect x="810" y="205" width="320" height="95" rx="20"/><rect x="70" y="325" width="310" height="95" rx="20"/><rect x="420" y="325" width="350" height="95" rx="20"/><rect x="810" y="325" width="320" height="95" rx="20"/><rect x="70" y="445" width="310" height="95" rx="20"/><rect x="420" y="445" width="350" height="95" rx="20"/><rect x="810" y="445" width="320" height="95" rx="20"/><rect x="70" y="565" width="310" height="95" rx="20"/><rect x="420" y="565" width="350" height="95" rx="20"/><rect x="810" y="565" width="320" height="95" rx="20"/></g>
<g fill="#f6e5ef" font-size="18"><text x="95" y="245">把 Historical 誤讀為立即失效</text><text x="95" y="275">或把 Active 誤讀為零風險</text><text x="95" y="365">採購文件只有產品名稱</text><text x="95" y="395">無法對到模組、版本與環境</text><text x="95" y="485">未經臨床測試直接替換模組</text><text x="95" y="515">造成介接、效能或開機失敗</text><text x="95" y="605">舊模組無更新與退場期限</text><text x="95" y="635">例外永久化並累積供應鏈風險</text></g>
<g fill="#def8ff" font-size="18"><text x="445" y="245">核對官方狀態定義、法域與契約</text><text x="445" y="275">再結合弱點與業務影響判定</text><text x="445" y="365">要求證書編號、安全政策</text><text x="445" y="395">操作環境與整合版本清單</text><text x="445" y="485">隔離測試、分批部署、回退</text><text x="445" y="515">及停機期間替代流程</text><text x="445" y="605">設定補償控制、責任人</text><text x="445" y="635">期限、替代產品與風險接受</text></g>
<g fill="#e1fff5" font-size="18"><text x="835" y="245">狀態判定紀錄與核准依據</text><text x="835" y="275">定期重查日期</text><text x="835" y="365">產品—模組—版本對照表</text><text x="835" y="395">供應商簽署證據</text><text x="835" y="485">互通、效能、金鑰、復原</text><text x="835" y="515">與回退演練結果</text><text x="835" y="605">例外到期日、監測指標</text><text x="835" y="635">與實際退場完成紀錄</text></g></g></svg>