<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc"><title id="title">醫療事件時間線流程手機版</title><desc id="desc">定界、校時、凍結、關聯、臨床驗證及結案六階段。</desc><rect width="720" height="1260" fill="#08172c"/><text x="360" y="66" fill="#fff" font-size="32" font-weight="700" text-anchor="middle">事件時間線六階段</text><g font-family="sans-serif"><g fill="#11294a" stroke="#63e6ff" stroke-width="4"><rect x="90" y="120" width="540" height="140" rx="22"/><rect x="90" y="300" width="540" height="140" rx="22"/><rect x="90" y="480" width="540" height="140" rx="22"/><rect x="90" y="660" width="540" height="140" rx="22"/><rect x="90" y="840" width="540" height="140" rx="22"/><rect x="90" y="1020" width="540" height="140" rx="22"/></g><g fill="#fff" font-size="27" font-weight="700"><text x="130" y="175">1 定界</text><text x="130" y="355">2 校時</text><text x="130" y="535">3 凍結</text><text x="130" y="715">4 關聯</text><text x="130" y="895">5 驗證</text><text x="130" y="1075">6 結案</text></g><g fill="#cbd8f3" font-size="23"><text x="130" y="220">確認系統、人員、時段與問題</text><text x="130" y="400">記錄偏差、時區與時間來源</text><text x="130" y="580">保存原始檔並驗證完整性</text><text x="130" y="760">連結身分、網路、應用與設備</text><text x="130" y="940">用臨床流程與其他來源交叉確認</text><text x="130" y="1120">回收權限並執行保存與刪除</text></g></g></svg>