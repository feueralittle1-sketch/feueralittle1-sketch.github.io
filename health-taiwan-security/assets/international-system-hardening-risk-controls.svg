<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療系統硬化風險、控制與驗收證據</title>
  <desc id="desc">比較照搬外部基線、未核准漂移、掃描盲點、永久例外與硬化造成臨床中斷等風險及控制證據。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102343"/></linearGradient></defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f5f8ff" font-size="34" font-weight="700">硬化治理：每個設定風險都要配對控制與證據</text>
  <text x="60" y="110" fill="#9eb7d8" font-size="21">掃描顯示符合基線，不代表設備相容、臨床安全或變更已經核准。</text>
  <g font-family="sans-serif">
    <rect x="55" y="155" width="1090" height="70" rx="18" fill="#15304b"/><text x="95" y="199" fill="#63e6ff" font-size="24" font-weight="700">失敗模式</text><text x="405" y="199" fill="#aa98ff" font-size="24" font-weight="700">主要控制</text><text x="835" y="199" fill="#57f0c1" font-size="24" font-weight="700">驗收證據</text>
    <g font-size="21">
      <rect x="55" y="235" width="1090" height="80" rx="16" fill="#0c1d34"/><text x="95" y="282" fill="#ffb0cf">直接照搬通用基線</text><text x="405" y="282" fill="#e8edff">依用途、設備能力與臨床依賴調整</text><text x="835" y="282" fill="#d8fff1">差異表＋風險核准</text>
      <rect x="55" y="325" width="1090" height="80" rx="16" fill="#11233d"/><text x="95" y="372" fill="#ffb0cf">未核准設定漂移</text><text x="405" y="372" fill="#e8edff">版本化基線、持續比對與變更追蹤</text><text x="835" y="372" fill="#d8fff1">差異事件＋責任軌跡</text>
      <rect x="55" y="415" width="1090" height="80" rx="16" fill="#0c1d34"/><text x="95" y="462" fill="#ffb0cf">只看掃描符合率</text><text x="405" y="462" fill="#e8edff">加入負向測試、效能與臨床回歸</text><text x="835" y="462" fill="#d8fff1">測試結果＋臨床簽核</text>
      <rect x="55" y="505" width="1090" height="80" rx="16" fill="#11233d"/><text x="95" y="552" fill="#ffb0cf">例外永久存在</text><text x="405" y="552" fill="#e8edff">補償控制、到期日與替換路線</text><text x="835" y="552" fill="#d8fff1">到期複查＋退場紀錄</text>
      <rect x="55" y="595" width="1090" height="70" rx="16" fill="#0c1d34"/><text x="95" y="638" fill="#ffb0cf">硬化造成服務中斷</text><text x="405" y="638" fill="#e8edff">分批部署、停止條件與回退劇本</text><text x="835" y="638" fill="#d8fff1">回退演練＋復原時間</text>
    </g>
  </g>
</svg>
