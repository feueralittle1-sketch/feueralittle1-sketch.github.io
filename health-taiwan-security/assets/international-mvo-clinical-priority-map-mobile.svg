<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc"><title id="title">手機版醫療最低可行運作架構</title><desc id="desc">必要臨床結果、共同依賴、事件指揮、替代照護與驗證證據由上而下連接。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10234a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#63e6ff"/></marker></defs><rect width="720" height="1220" rx="32" fill="url(#bg)"/><text x="40" y="60" fill="#fff" font-size="28" font-weight="700">最低可行運作</text><text x="40" y="98" fill="#9fb3d9" font-size="18">先保住安全照護，再恢復完整服務</text><g font-family="sans-serif"><rect x="85" y="140" width="550" height="135" rx="24" fill="#12213d" stroke="#71a7ff" stroke-width="2"/><text x="360" y="188" text-anchor="middle" fill="#71a7ff" font-size="23" font-weight="700">必要臨床結果</text><text x="360" y="232" text-anchor="middle" fill="#fff" font-size="20">急重症・用藥・檢驗・影像・病人辨識</text><path d="M360 275V325" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="335" width="550" height="135" rx="24" fill="#12213d" stroke="#57f0c1" stroke-width="2"/><text x="360" y="383" text-anchor="middle" fill="#57f0c1" font-size="23" font-weight="700">共同依賴</text><text x="360" y="427" text-anchor="middle" fill="#fff" font-size="20">身分・網路・資料・設備・人力・供應商</text><path d="M360 470V520" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="530" width="590" height="190" rx="28" fill="#132d52" stroke="#63e6ff" stroke-width="3"/><text x="360" y="582" text-anchor="middle" fill="#63e6ff" font-size="23" font-weight="700">事件指揮與臨床決策</text><text x="360" y="632" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">最低安全容量</text><text x="360" y="674" text-anchor="middle" fill="#c6d4eb" font-size="19">服務範圍・啟動門檻・風險接受・退出條件</text><path d="M360 720V770" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="780" width="550" height="135" rx="24" fill="#12213d" stroke="#9c8cff" stroke-width="2"/><text x="360" y="828" text-anchor="middle" fill="#b9aaff" font-size="23" font-weight="700">替代照護方式</text><text x="360" y="872" text-anchor="middle" fill="#fff" font-size="20">紙本・人工核對・轉診・限量服務</text><path d="M360 915V965" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="85" y="975" width="550" height="135" rx="24" fill="#12213d" stroke="#ffb86b" stroke-width="2"/><text x="360" y="1023" text-anchor="middle" fill="#ffbf7a" font-size="23" font-weight="700">驗證證據</text><text x="360" y="1067" text-anchor="middle" fill="#fff" font-size="20">功能、資料、權限、監控與回退結果</text></g><text x="360" y="1170" text-anchor="middle" fill="#57f0c1" font-size="19" font-weight="700">以病人安全與服務結果定義，不以開機數量定義</text></svg>