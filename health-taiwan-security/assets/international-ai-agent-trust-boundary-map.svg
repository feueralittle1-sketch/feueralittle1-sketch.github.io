<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">醫療 AI Agent 信任邊界圖</title><desc id="desc">顯示使用者、AI Agent、模型與記憶、工具閘道及臨床系統間的輸入、權限、確認與稽核控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#12214a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#70e7ff"/></marker></defs>
<rect width="1200" height="760" rx="32" fill="url(#bg)"/><text x="70" y="72" fill="#fff" font-size="34" font-weight="800">AI Agent 的安全邊界不只在模型</text><text x="70" y="110" fill="#a8bad8" font-size="20">每次讀取、推理、呼叫工具與寫回都要有獨立控制</text>
<g font-family="Noto Sans TC, sans-serif"><rect x="60" y="180" width="210" height="150" rx="24" fill="#152b48" stroke="#5fe0ff" stroke-width="2"/><text x="165" y="225" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">人員與情境</text><text x="165" y="266" text-anchor="middle" fill="#c5d7ec" font-size="19">身分、職務、照護關係</text><text x="165" y="297" text-anchor="middle" fill="#6ff0c5" font-size="18">控制：身分驗證</text>
<rect x="365" y="160" width="280" height="190" rx="28" fill="#17355c" stroke="#9e91ff" stroke-width="3" filter="url(#glow)"/><text x="505" y="215" text-anchor="middle" fill="#fff" font-size="29" font-weight="800">AI Agent</text><text x="505" y="255" text-anchor="middle" fill="#d9ddff" font-size="19">目標分解・規劃・行動</text><text x="505" y="292" text-anchor="middle" fill="#ffc96b" font-size="18">控制：範圍、預算、逾時</text><text x="505" y="322" text-anchor="middle" fill="#ffc96b" font-size="18">高風險動作須人工確認</text>
<rect x="760" y="160" width="370" height="190" rx="28" fill="#142a47" stroke="#63e6ff" stroke-width="2"/><text x="945" y="210" text-anchor="middle" fill="#fff" font-size="27" font-weight="750">工具閘道</text><text x="945" y="250" text-anchor="middle" fill="#c5d7ec" font-size="19">API 白名單・最小權限・參數驗證</text><text x="945" y="289" text-anchor="middle" fill="#6ff0c5" font-size="18">核准後才呼叫工具</text><text x="945" y="320" text-anchor="middle" fill="#6ff0c5" font-size="18">記錄請求、結果與操作者</text>
<path d="M270 255H355" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M645 255H750" stroke="#70e7ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="150" y="455" width="290" height="170" rx="26" fill="#10243f" stroke="#8f9fff" stroke-width="2"/><text x="295" y="505" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">模型、提示與記憶</text><text x="295" y="547" text-anchor="middle" fill="#c5d7ec" font-size="19">不可信內容可能改寫目標</text><text x="295" y="585" text-anchor="middle" fill="#ff9cab" font-size="18">控制：來源標記、隔離、清除</text>
<rect x="500" y="455" width="250" height="170" rx="26" fill="#10243f" stroke="#8f9fff" stroke-width="2"/><text x="625" y="505" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">模型／Agent 清冊</text><text x="625" y="547" text-anchor="middle" fill="#c5d7ec" font-size="19">版本、用途、責任人</text><text x="625" y="585" text-anchor="middle" fill="#6ff0c5" font-size="18">控制：變更與停用</text>
<rect x="810" y="455" width="300" height="170" rx="26" fill="#10243f" stroke="#8f9fff" stroke-width="2"/><text x="960" y="505" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">臨床與行政系統</text><text x="960" y="547" text-anchor="middle" fill="#c5d7ec" font-size="19">查詢、排程、通知、寫回</text><text x="960" y="585" text-anchor="middle" fill="#ffcc77" font-size="18">控制：可逆性與事後覆核</text>
<path d="M440 540H490" stroke="#9e91ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M750 540H800" stroke="#9e91ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 350V430" stroke="#9e91ff" stroke-width="4" marker-end="url(#arrow)"/><text x="70" y="700" fill="#9fb3d9" font-size="18">共同證據：輸入來源、模型版本、決策理由、工具參數、核准者、執行結果、例外與回復動作</text></g></svg>