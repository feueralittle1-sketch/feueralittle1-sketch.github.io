<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc"><title id="title">遠端支援設備事件風險控制手機版</title><desc id="desc">四類殘餘風險及其控制與驗收證據。</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254b"/></linearGradient></defs><rect width="720" height="1320" fill="url(#bg)"/><text x="42" y="62" fill="#fff" font-size="32" font-weight="800">修補不是結案</text><text x="42" y="102" fill="#9fb7db" font-size="21">殘餘風險必須有控制與證據。</text>
<g font-family="Inter,Noto Sans TC,sans-serif"><rect x="55" y="150" width="610" height="245" rx="26" fill="#10233f" stroke="#ff8fb3" stroke-width="3"/><text x="90" y="205" fill="#ffb5cc" font-size="25" font-weight="800">只套修補即結案</text><text x="90" y="248" fill="#d7e5ff" font-size="20">後果：持久化仍留在設備</text><text x="90" y="290" fill="#dcfff5" font-size="20">控制：影像、搜尋、乾淨重建</text><text x="90" y="332" fill="#dff8ff" font-size="20">證據：搜尋結果、重建雜湊、核准</text><rect x="55" y="420" width="610" height="245" rx="26" fill="#0d1e37" stroke="#8fb7ff" stroke-width="3"/><text x="90" y="475" fill="#8fb7ff" font-size="25" font-weight="800">設備內日誌遭刪除</text><text x="90" y="518" fill="#d7e5ff" font-size="20">後果：無法重建時間線</text><text x="90" y="560" fill="#dcfff5" font-size="20">控制：近即時離機日誌</text><text x="90" y="602" fill="#dff8ff" font-size="20">證據：收件率、時鐘與保存測試</text><rect x="55" y="690" width="610" height="245" rx="26" fill="#10233f" stroke="#b69cff" stroke-width="3"/><text x="90" y="745" fill="#c8b7ff" font-size="25" font-weight="800">代理憑證被取得</text><text x="90" y="788" fill="#d7e5ff" font-size="20">後果：繞過設備登入下游</text><text x="90" y="830" fill="#dcfff5" font-size="20">控制：全面輪替與工作階段撤銷</text><text x="90" y="872" fill="#dff8ff" font-size="20">證據：輪替清冊、異常登入調查</text><rect x="55" y="960" width="610" height="245" rx="26" fill="#0d1e37" stroke="#57f0c1" stroke-width="3"/><text x="90" y="1015" fill="#57f0c1" font-size="25" font-weight="800">為維修需求過早恢復</text><text x="90" y="1058" fill="#d7e5ff" font-size="20">後果：第二次入侵或中斷擴大</text><text x="90" y="1100" fill="#dcfff5" font-size="20">控制：替代維護、逐批放行、回退</text><text x="90" y="1142" fill="#dff8ff" font-size="20">證據：臨床回歸、監看與風險接受</text></g></svg>