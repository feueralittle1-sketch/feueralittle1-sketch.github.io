<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資安事件通報風險與控制</title><desc id="desc">單一路徑通報、過早定論、資訊過量、版本衝突與送件後失聯分別對應分流矩陣、未知標記、最小揭露、單一事實庫與追蹤結案。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#102743"/></linearGradient></defs><rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="60" y="72" fill="#f7fbff" font-size="34" font-weight="800">五個常見失敗模式與對應控制</text><text x="60" y="108" fill="#9fb7d5" font-size="19">通報品質取決於分流、事實管理與結案證據，不只是送出速度</text><g font-family="Arial, Noto Sans TC, sans-serif"><text x="76" y="166" fill="#ff9ab0" font-size="22" font-weight="800">失敗模式</text><text x="692" y="166" fill="#72f5cd" font-size="22" font-weight="800">治理控制</text><g font-size="18"><rect x="58" y="188" width="500" height="72" rx="18" fill="#3b2433"/><text x="86" y="232" fill="#ffe2ed">只向一個窗口送件，誤以為其他義務已完成</text><rect x="642" y="188" width="500" height="72" rx="18" fill="#153e3a"/><text x="670" y="232" fill="#ddfff4">建立技術、個資、臨床三軌判定矩陣</text><rect x="58" y="276" width="500" height="72" rx="18" fill="#3b2433"/><text x="86" y="320" fill="#ffe2ed">為了搶時效，把推測寫成已確認事實</text><rect x="642" y="276" width="500" height="72" rx="18" fill="#153e3a"/><text x="670" y="320" fill="#ddfff4">分開標記已知、未知、假設與下次更新時間</text><rect x="58" y="364" width="500" height="72" rx="18" fill="#3b2433"/><text x="86" y="408" fill="#ffe2ed">一次交付過量病人或敏感資料</text><rect x="642" y="364" width="500" height="72" rx="18" fill="#153e3a"/><text x="670" y="408" fill="#ddfff4">依受理目的採最小必要揭露與安全傳輸</text><rect x="58" y="452" width="500" height="72" rx="18" fill="#3b2433"/><text x="86" y="496" fill="#ffe2ed">技術、法務與臨床使用不同事件版本</text><rect x="642" y="452" width="500" height="72" rx="18" fill="#153e3a"/><text x="670" y="496" fill="#ddfff4">維護單一事實庫、版本編號與核准責任</text><rect x="58" y="540" width="500" height="72" rx="18" fill="#3b2433"/><text x="86" y="584" fill="#ffe2ed">送件後沒有補件、回覆與關閉追蹤</text><rect x="642" y="540" width="500" height="72" rx="18" fill="#153e3a"/><text x="670" y="584" fill="#ddfff4">以收件證明、未決事項與結案條件管理閉環</text></g><g stroke="#7adfff" stroke-width="4"><path d="M558 224h84M558 312h84M558 400h84M558 488h84M558 576h84"/></g></g></svg>