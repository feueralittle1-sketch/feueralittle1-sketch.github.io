<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">醫院設施 OT 六階段治理流程</title><desc id="desc">從發現資產、連結臨床衝擊、劃分區域、限制存取、演練降級到可信復原的六階段循環。</desc><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#13264b"/></linearGradient><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#63e6ff"/></marker></defs><rect width="1200" height="650" rx="40" fill="url(#b)"/><text x="65" y="70" fill="#fff" font-size="34" font-weight="700">從資產發現到可信復原的六階段閉環</text><text x="65" y="108" fill="#9fb3d9" font-size="19">每一步都要留下可驗證證據，並由臨床、工務、醫工、資訊與資安共同確認</text><path d="M180 335H1020" stroke="#315b77" stroke-width="8"/><g font-family="sans-serif" text-anchor="middle"><g><circle cx="150" cy="335" r="70" fill="#12324b" stroke="#63e6ff" stroke-width="3"/><text x="150" y="326" fill="#63e6ff" font-size="22" font-weight="700">1 發現</text><text x="150" y="355" fill="#fff" font-size="17">設備與連線</text><text x="150" y="440" fill="#9fb3d9" font-size="16">被動盤點優先</text></g><g><circle cx="330" cy="335" r="70" fill="#172e50" stroke="#9c8cff" stroke-width="3"/><text x="330" y="326" fill="#c6baff" font-size="22" font-weight="700">2 定界</text><text x="330" y="355" fill="#fff" font-size="17">臨床衝擊</text><text x="330" y="440" fill="#9fb3d9" font-size="16">安全與服務門檻</text></g><g><circle cx="510" cy="335" r="70" fill="#123b44" stroke="#57f0c1" stroke-width="3"/><text x="510" y="326" fill="#57f0c1" font-size="22" font-weight="700">3 分區</text><text x="510" y="355" fill="#fff" font-size="17">流量與信任</text><text x="510" y="440" fill="#9fb3d9" font-size="16">控制區與跳板</text></g><g><circle cx="690" cy="335" r="70" fill="#3a2e3d" stroke="#ffb86b" stroke-width="3"/><text x="690" y="326" fill="#ffca8a" font-size="22" font-weight="700">4 控制</text><text x="690" y="355" fill="#fff" font-size="17">存取與變更</text><text x="690" y="440" fill="#9fb3d9" font-size="16">備份、日誌、核准</text></g><g><circle cx="870" cy="335" r="70" fill="#402b44" stroke="#ff7ad9" stroke-width="3"/><text x="870" y="326" fill="#ff9ee4" font-size="22" font-weight="700">5 演練</text><text x="870" y="355" fill="#fff" font-size="17">降級與現場安全</text><text x="870" y="440" fill="#9fb3d9" font-size="16">停機與人工操作</text></g><g><circle cx="1050" cy="335" r="70" fill="#183448" stroke="#71a7ff" stroke-width="3"/><text x="1050" y="326" fill="#9fc2ff" font-size="22" font-weight="700">6 復原</text><text x="1050" y="355" fill="#fff" font-size="17">重建與重驗</text><text x="1050" y="440" fill="#9fb3d9" font-size="16">分批恢復服務</text></g></g><path d="M1050 510C1050 575 150 575 150 500" fill="none" stroke="#63e6ff" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#m)"/><text x="600" y="610" text-anchor="middle" fill="#d9e7ff" font-size="19">設備、韌體、網路、臨床用途或供應商變更後，重新盤點與驗證</text></svg>