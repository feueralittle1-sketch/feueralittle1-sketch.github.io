<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療 DDoS 事件的偵測、分級、緩解與復原流程</title>
<desc id="desc">從基線監測開始，經攻擊類型判定、臨床影響分級、上游緩解、服務降級、持續驗證到分批恢復與復盤。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17133b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#63e6ff"/></marker></defs><rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="70" y="75" fill="#fff" font-size="34" font-weight="700">從流量異常到安全恢復的七個節點</text><text x="70" y="112" fill="#a8bad8" font-size="20">技術緩解與臨床降級必須由同一事件指揮節奏協調</text>
<g font-family="Noto Sans TC, sans-serif"><path d="M170 260H1020" stroke="#294d67" stroke-width="10" stroke-linecap="round"/><g text-anchor="middle"><circle cx="170" cy="260" r="55" fill="#12324a" stroke="#63e6ff" stroke-width="4"/><text x="170" y="252" fill="#fff" font-size="22" font-weight="700">01</text><text x="170" y="282" fill="#b8f4ff" font-size="18">監測</text><circle cx="310" cy="260" r="55" fill="#17304a" stroke="#63e6ff" stroke-width="4"/><text x="310" y="252" fill="#fff" font-size="22" font-weight="700">02</text><text x="310" y="282" fill="#b8f4ff" font-size="18">分類</text><circle cx="450" cy="260" r="55" fill="#252752" stroke="#a997ff" stroke-width="4"/><text x="450" y="252" fill="#fff" font-size="22" font-weight="700">03</text><text x="450" y="282" fill="#ddd6ff" font-size="18">分級</text><circle cx="590" cy="260" r="55" fill="#3a2444" stroke="#ff7ab8" stroke-width="4"/><text x="590" y="252" fill="#fff" font-size="22" font-weight="700">04</text><text x="590" y="282" fill="#ffd0e6" font-size="18">緩解</text><circle cx="730" cy="260" r="55" fill="#45301e" stroke="#ffd37a" stroke-width="4"/><text x="730" y="252" fill="#fff" font-size="22" font-weight="700">05</text><text x="730" y="282" fill="#ffe4a8" font-size="18">降級</text><circle cx="870" cy="260" r="55" fill="#17394a" stroke="#63e6ff" stroke-width="4"/><text x="870" y="252" fill="#fff" font-size="22" font-weight="700">06</text><text x="870" y="282" fill="#b8f4ff" font-size="18">驗證</text><circle cx="1010" cy="260" r="55" fill="#153b36" stroke="#57f0c1" stroke-width="4"/><text x="1010" y="252" fill="#fff" font-size="22" font-weight="700">07</text><text x="1010" y="282" fill="#c8ffed" font-size="18">恢復</text></g>
<g fill="#c6d4eb" font-size="18" text-anchor="middle"><text x="170" y="355">延遲／錯誤／容量</text><text x="310" y="355">容量・協定・應用</text><text x="450" y="355">臨床與資料影響</text><text x="590" y="355">清洗與規則調整</text><text x="730" y="355">排隊與替代入口</text><text x="870" y="355">真實交易與核心負載</text><text x="1010" y="355">分批撤除限制</text></g>
<rect x="105" y="445" width="990" height="130" rx="26" fill="#0b2236" stroke="#607899" stroke-width="2"/><text x="135" y="487" fill="#fff" font-size="23" font-weight="700">每個節點共同記錄</text><text x="135" y="530" fill="#a8bad8" font-size="20">開始時間　責任人　採取動作　服務影響　證據位置　下一次決策時間</text><text x="135" y="562" fill="#a8bad8" font-size="18">若核心系統負載或資料完整性惡化，立即縮小入口功能並重新分級。</text></g></svg>