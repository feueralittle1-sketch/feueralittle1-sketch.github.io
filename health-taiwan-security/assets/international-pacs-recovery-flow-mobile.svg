<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc"><title id="title">手機版醫療影像資料缺口處置流程</title><desc id="desc">停止刪除到受控放行的六階段垂直流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#13284a"/></linearGradient></defs><rect width="720" height="1200" rx="28" fill="url(#bg)"/><text x="42" y="64" fill="#f7fbff" font-size="29" font-weight="800">影像資料缺口處置流程</text><text x="42" y="102" fill="#9fb7d5" font-size="18">技術還原後，仍須通過臨床完整性驗證</text><g font-family="Arial, Noto Sans TC, sans-serif"><g><rect x="70" y="145" width="580" height="116" rx="22" fill="#17334f" stroke="#63e6ff" stroke-width="2"/><text x="105" y="193" fill="#63e6ff" font-size="24" font-weight="800">01 停止刪除</text><text x="105" y="231" fill="#e6eefc" font-size="19">隔離功能 · 凍結變更</text><rect x="70" y="295" width="580" height="116" rx="22" fill="#203151" stroke="#8caeff" stroke-width="2"/><text x="105" y="343" fill="#a9c4ff" font-size="24" font-weight="800">02 界定範圍</text><text x="105" y="381" fill="#e6eefc" font-size="19">病人 · 檢查 · 節點 · 時段</text><rect x="70" y="445" width="580" height="116" rx="22" fill="#29305a" stroke="#b59cff" stroke-width="2"/><text x="105" y="493" fill="#c5b3ff" font-size="24" font-weight="800">03 保全證據</text><text x="105" y="531" fill="#e6eefc" font-size="19">日誌 · 雜湊 · 操作時間線</text><rect x="70" y="595" width="580" height="116" rx="22" fill="#174943" stroke="#57f0c1" stroke-width="2"/><text x="105" y="643" fill="#72f5cd" font-size="24" font-weight="800">04 隔離還原</text><text x="105" y="681" fill="#e6eefc" font-size="19">可信副本 · 禁止直接覆寫</text><rect x="70" y="745" width="580" height="116" rx="22" fill="#4b3b1e" stroke="#ffc56e" stroke-width="2"/><text x="105" y="793" fill="#ffd18a" font-size="24" font-weight="800">05 臨床對帳</text><text x="105" y="831" fill="#e6eefc" font-size="19">病人配對 · 序列完整 · 報告關聯</text><rect x="70" y="895" width="580" height="116" rx="22" fill="#4b2438" stroke="#ff7fa6" stroke-width="2"/><text x="105" y="943" fill="#ff9ab7" font-size="24" font-weight="800">06 受控放行</text><text x="105" y="981" fill="#e6eefc" font-size="19">分批回寫 · 例外追蹤</text></g><rect x="70" y="1050" width="580" height="105" rx="20" fill="#091b31" stroke="#345b80"/><text x="105" y="1090" fill="#f7fbff" font-size="21" font-weight="800">放行：數量一致＋配對正確＋閱片通過</text><text x="105" y="1128" fill="#aec2dc" font-size="18">任一條件不足，維持隔離並進入例外處置</text></g></svg>