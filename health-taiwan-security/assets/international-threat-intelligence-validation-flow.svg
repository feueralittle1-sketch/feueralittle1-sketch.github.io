<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">醫療威脅情報轉為偵測規則並完成臨床驗證的流程圖</title>
  <desc id="desc">流程由來源評估開始，經情境映射、偵測假設、隔離測試、臨床情境驗證、部署監測與回饋更新。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#10274a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-size="34" font-weight="700">從情報到偵測：七道可驗收閘門</text><text x="60" y="110" fill="#9fb3d9" font-size="19">每一步都要保留輸入、判定、測試結果與責任人</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#10243d" stroke="#63e6ff" stroke-width="2"><rect x="55" y="180" width="240" height="130" rx="22"/><rect x="345" y="180" width="240" height="130" rx="22"/><rect x="635" y="180" width="240" height="130" rx="22"/><rect x="925" y="180" width="220" height="130" rx="22"/></g><g fill="#fff"><text x="175" y="224" font-size="22" font-weight="700">1 來源評估</text><text x="175" y="262" font-size="17">日期・範圍・可信度</text><text x="465" y="224" font-size="22" font-weight="700">2 情境映射</text><text x="465" y="262" font-size="17">資產・身分・臨床服務</text><text x="755" y="224" font-size="22" font-weight="700">3 偵測假設</text><text x="755" y="262" font-size="17">TTP・必要遙測・門檻</text><text x="1035" y="224" font-size="22" font-weight="700">4 隔離測試</text><text x="1035" y="262" font-size="17">模擬事件・負向測試</text></g><path d="M295 245H330M585 245H620M875 245H910" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
  <g fill="#172443" stroke="#a997ff" stroke-width="2"><rect x="125" y="410" width="270" height="140" rx="22"/><rect x="465" y="410" width="270" height="140" rx="22"/><rect x="805" y="410" width="270" height="140" rx="22"/></g><g fill="#fff"><text x="260" y="455" font-size="22" font-weight="700">5 臨床驗證</text><text x="260" y="493" font-size="17">告警不中斷照護</text><text x="260" y="521" font-size="17">升級與降級可執行</text><text x="600" y="455" font-size="22" font-weight="700">6 受控部署</text><text x="600" y="493" font-size="17">分批啟用・誤報監測</text><text x="600" y="521" font-size="17">回退條件明確</text><text x="940" y="455" font-size="22" font-weight="700">7 回饋更新</text><text x="940" y="493" font-size="17">事件・演練・缺口</text><text x="940" y="521" font-size="17">版本與失效日期</text></g><path d="M1035 310V370H260V395" fill="none" stroke="#a997ff" stroke-width="5" marker-end="url(#a)"/><path d="M395 480H450M735 480H790" stroke="#a997ff" stroke-width="5" marker-end="url(#a)"/>
  <path d="M940 550V620H175V325" fill="none" stroke="#57f0c1" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#a)"/><text x="580" y="650" fill="#b8ffe7" font-size="18">情報、環境或控制改變時，回到來源與情境重新驗證</text></g>
</svg>