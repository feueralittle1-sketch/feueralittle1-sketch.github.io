<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安事件分流通報流程</title><desc id="desc">事件通報由偵測、穩定事實、平行評估、分軌送件、持續更新與證據結案組成。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172b"/><stop offset="1" stop-color="#112a49"/></linearGradient></defs><rect width="720" height="1160" rx="28" fill="url(#bg)"/><text x="38" y="62" fill="#f7fbff" font-size="29" font-weight="800">多軌通報的六階段閉環</text><text x="38" y="100" fill="#9fb7d5" font-size="18">共同事實先穩定，各軌判定再平行展開</text><g font-family="Arial, Noto Sans TC, sans-serif"><g font-size="21" font-weight="800"><rect x="54" y="142" width="612" height="120" rx="22" fill="#102d4b" stroke="#63e6ff" stroke-width="2"/><text x="86" y="190" fill="#63e6ff">1 偵測與保全</text><text x="86" y="228" fill="#e6eefc" font-size="17" font-weight="400">確認窗口、啟動指揮、保留原始證據</text><rect x="54" y="286" width="612" height="120" rx="22" fill="#102d4b" stroke="#79b8ff" stroke-width="2"/><text x="86" y="334" fill="#9bc9ff">2 穩定共同事實</text><text x="86" y="372" fill="#e6eefc" font-size="17" font-weight="400">系統、資料、病人影響與未知項目</text><rect x="54" y="430" width="612" height="120" rx="22" fill="#242f59" stroke="#a997ff" stroke-width="2"/><text x="86" y="478" fill="#c3b8ff">3 平行評估</text><text x="86" y="516" fill="#e6eefc" font-size="17" font-weight="400">技術、個資法律與臨床安全分別判定</text><rect x="54" y="574" width="612" height="120" rx="22" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="86" y="622" fill="#72f5cd">4 分軌送件</text><text x="86" y="660" fill="#e6eefc" font-size="17" font-weight="400">指定窗口、最小必要內容、收件證明</text><rect x="54" y="718" width="612" height="120" rx="22" fill="#4d361e" stroke="#ffbe6b" stroke-width="2"/><text x="86" y="766" fill="#ffd08a">5 持續更新</text><text x="86" y="804" fill="#fff0d8" font-size="17" font-weight="400">重大變化重評、補件、維持版本一致</text><rect x="54" y="862" width="612" height="120" rx="22" fill="#3d2340" stroke="#ff7db3" stroke-width="2"/><text x="86" y="910" fill="#ffacd0">6 證據結案</text><text x="86" y="948" fill="#ffe6f1" font-size="17" font-weight="400">確認義務、復原、復盤與改善已完成</text></g><rect x="54" y="1022" width="612" height="92" rx="22" fill="#0a1c32" stroke="#32577d"/><text x="86" y="1060" fill="#f7fbff" font-size="19" font-weight="800">必要證據</text><text x="86" y="1092" fill="#c7d7eb" font-size="16">時間、角色、版本、依據、收件、未決事項</text></g></svg>