<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 850" role="img" aria-labelledby="title desc"><title id="title">手機版醫療資安持續保證流程</title><desc id="desc">由界定服務、控制對照、連接證據、評估品質、改善關閉到定期重驗的六階段流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient></defs><rect width="390" height="850" rx="24" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="195" y="43" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">六階段持續保證流程</text><g font-size="17"><path d="M82 100V650" stroke="#57f0c1" stroke-width="7"/><g fill="#10213d" stroke="#63e6ff" stroke-width="3"><circle cx="82" cy="125" r="38"/><circle cx="82" cy="225" r="38"/><circle cx="82" cy="325" r="38"/><circle cx="82" cy="425" r="38"/><circle cx="82" cy="525" r="38"/><circle cx="82" cy="625" r="38"/></g><g fill="#fff" text-anchor="middle" font-weight="800"><text x="82" y="132">1</text><text x="82" y="232">2</text><text x="82" y="332">3</text><text x="82" y="432">4</text><text x="82" y="532">5</text><text x="82" y="632">6</text></g><g fill="#e6eefc"><text x="140" y="119" font-size="19" font-weight="800">界定服務與控制</text><text x="140" y="145">先選一項高影響服務</text><text x="140" y="219" font-size="19" font-weight="800">對照識別碼與責任</text><text x="140" y="245">控制、資產、權責一致</text><text x="140" y="319" font-size="19" font-weight="800">連接資料與證據</text><text x="140" y="345">組態、日誌、測試、工單</text><text x="140" y="419" font-size="19" font-weight="800">評估品質與缺口</text><text x="140" y="445">新鮮度、完整性、適用性</text><text x="140" y="519" font-size="19" font-weight="800">改善、驗證與關閉</text><text x="140" y="545">主責、期限、重測結果</text><text x="140" y="619" font-size="19" font-weight="800">變更觸發與定期重驗</text><text x="140" y="645">事件、改版、證據失效</text></g></g><rect x="30" y="700" width="330" height="105" rx="22" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="195" y="738" text-anchor="middle" fill="#c5baff" font-size="19" font-weight="800">人工確認不可省略</text><text x="195" y="770" text-anchor="middle" fill="#e8e3ff" font-size="15">適用範圍、例外、臨床影響與風險接受</text><text x="195" y="828" text-anchor="middle" fill="#ffcf99" font-size="14">驗收：新鮮度、覆蓋率、逾期與重驗通過率</text></g></svg>
