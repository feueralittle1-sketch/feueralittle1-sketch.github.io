<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">醫療稽核紀錄可信邊界手機版</title><desc id="desc">多種醫療紀錄經院級閘門進入獨立證據庫與分析平台。</desc><rect width="720" height="1100" fill="#08172c"/><text x="360" y="70" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">可信事件時間線</text><g font-family="sans-serif" text-anchor="middle"><rect x="80" y="125" width="560" height="150" rx="24" fill="#102a46" stroke="#63e6ff" stroke-width="4"/><text x="360" y="185" fill="#fff" font-size="28" font-weight="700">紀錄來源</text><text x="360" y="230" fill="#cbd8f3" font-size="24">電子病歷・身分・設備・雲端</text><rect x="80" y="350" width="560" height="210" rx="24" fill="#172a55" stroke="#a997ff" stroke-width="4"/><text x="360" y="410" fill="#fff" font-size="28" font-weight="700">院級紀錄閘門</text><text x="360" y="460" fill="#cbd8f3" font-size="23">共同時間・安全傳輸</text><text x="360" y="505" fill="#cbd8f3" font-size="23">欄位標準・資料最小化</text><rect x="80" y="640" width="560" height="150" rx="24" fill="#123449" stroke="#5ef2b0" stroke-width="4"/><text x="360" y="700" fill="#fff" font-size="28" font-weight="700">獨立證據庫</text><text x="360" y="745" fill="#cceee0" font-size="23">完整性・存取・保存期限</text><rect x="80" y="865" width="560" height="150" rx="24" fill="#3b214f" stroke="#ff7bd5" stroke-width="4"/><text x="360" y="925" fill="#fff" font-size="28" font-weight="700">偵測與事件分析</text><text x="360" y="970" fill="#f2d3ea" font-size="23">關聯規則・調查・臨床驗證</text></g><g stroke="#63e6ff" stroke-width="6"><path d="M360 275V340"/><path d="M360 560V630"/><path d="M360 790V855"/></g></svg>