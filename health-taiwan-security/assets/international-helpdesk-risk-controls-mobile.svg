<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc"><title id="title">手機版醫療服務台冒名風險與控制對照</title><desc id="desc">五種冒名攻擊對應院方控制與驗收訊號。</desc><rect width="720" height="1240" rx="28" fill="#08182d"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">冒名攻擊不能只靠多問幾題</text><text x="38" y="96" fill="#9fb7d5" font-size="18">使用攻擊者難以同時取得的院方證據</text><g><rect x="54" y="140" width="612" height="188" rx="22" fill="#142942"/><text x="84" y="184" fill="#ffadd5" font-size="21" font-weight="800">偽造來電顯示／轉接</text><text x="84" y="230" fill="#dcecff" font-size="18">控制：回撥已登錄院內號碼</text><text x="84" y="274" fill="#dffff5" font-size="17">驗收：回撥來源與接聽人可追溯</text><rect x="54" y="348" width="612" height="188" rx="22" fill="#183149"/><text x="84" y="392" fill="#ffadd5" font-size="21" font-weight="800">深偽聲音／視訊</text><text x="84" y="438" fill="#dcecff" font-size="18">控制：既有受管裝置持有證明</text><text x="84" y="482" fill="#dffff5" font-size="17">驗收：原裝置完成加密確認</text><rect x="54" y="556" width="612" height="188" rx="22" fill="#142942"/><text x="84" y="600" fill="#ffadd5" font-size="21" font-weight="800">MFA 疲勞與急迫催促</text><text x="84" y="646" fill="#dcecff" font-size="18">控制：拒絕推播轟炸與設定冷卻</text><text x="84" y="690" fill="#dffff5" font-size="17">驗收：期間無繞過與重複核發</text><rect x="54" y="764" width="612" height="188" rx="22" fill="#183149"/><text x="84" y="808" fill="#ffadd5" font-size="21" font-weight="800">利用外洩人資／病歷資訊</text><text x="84" y="854" fill="#dcecff" font-size="18">控制：靜態個資不得作唯一驗證</text><text x="84" y="898" fill="#dffff5" font-size="17">驗收：驗證題排除可公開或遭竊資料</text><rect x="54" y="972" width="612" height="188" rx="22" fill="#142942"/><text x="84" y="1016" fill="#ffadd5" font-size="21" font-weight="800">假冒主管／醫師施壓</text><text x="84" y="1062" fill="#dcecff" font-size="18">控制：雙人核准與原使用者通知</text><text x="84" y="1106" fill="#dffff5" font-size="17">驗收：核准、通知與撤銷均有紀錄</text></g><text x="360" y="1200" text-anchor="middle" fill="#ffd08a" font-size="18">辨認聲音不是控制；獨立證據才是控制</text></g></svg>