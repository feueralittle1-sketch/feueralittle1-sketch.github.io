<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">醫療名稱解析的安全與韌性架構</title>
  <desc id="desc">臨床工作站、醫療設備與雲端端點經受控解析器、保護性 DNS 政策及高可用路徑連線，事件同步送往安全監控。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182c"/><stop offset="1" stop-color="#111b3d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/><text x="60" y="72" fill="#f7fbff" font-size="34" font-weight="700">名稱解析是臨床服務依賴，也是網路控制點</text><text x="60" y="108" fill="#9fb3d9" font-size="19">可用性、完整性、過濾與可觀測性必須一起設計</text>
  <g font-family="Noto Sans TC, sans-serif"><rect x="55" y="170" width="220" height="345" rx="24" fill="#0e2944" stroke="#3d6d94"/><text x="165" y="215" text-anchor="middle" fill="#8fe8ff" font-size="24" font-weight="700">臨床端點</text><g fill="#dce9fa" font-size="20"><rect x="82" y="250" width="166" height="58" rx="14" fill="#163958"/><text x="165" y="286" text-anchor="middle">工作站／行動端</text><rect x="82" y="330" width="166" height="58" rx="14" fill="#163958"/><text x="165" y="366" text-anchor="middle">醫療設備／IoMT</text><rect x="82" y="410" width="166" height="58" rx="14" fill="#163958"/><text x="165" y="446" text-anchor="middle">雲端與遠端端點</text></g>
  <path d="M275 342 H355" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="365" y="170" width="250" height="345" rx="24" fill="#10294f" stroke="#738cff"/><text x="490" y="215" text-anchor="middle" fill="#b8c3ff" font-size="24" font-weight="700">受控解析層</text><rect x="395" y="250" width="190" height="82" rx="16" fill="#1a3d68"/><text x="490" y="282" text-anchor="middle" fill="#fff" font-size="21">院內轉送器 A／B</text><text x="490" y="310" text-anchor="middle" fill="#a9bad4" font-size="17">分網段・分故障域</text><rect x="395" y="355" width="190" height="112" rx="16" fill="#1a3d68"/><text x="490" y="390" text-anchor="middle" fill="#fff" font-size="21">禁止旁路</text><text x="490" y="420" text-anchor="middle" fill="#a9bad4" font-size="17">端點／防火牆／MDM</text><text x="490" y="448" text-anchor="middle" fill="#a9bad4" font-size="17">管理 DoH／DoT</text>
  <path d="M615 342 H695" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="705" y="150" width="250" height="385" rx="24" fill="#123452" stroke="#57f0c1"/><text x="830" y="197" text-anchor="middle" fill="#7ff5d0" font-size="24" font-weight="700">保護性 DNS</text><g fill="#e9fff8" font-size="19"><rect x="735" y="230" width="190" height="64" rx="14" fill="#195068"/><text x="830" y="269" text-anchor="middle">威脅情報與 RPZ</text><rect x="735" y="316" width="190" height="64" rx="14" fill="#195068"/><text x="830" y="355" text-anchor="middle">封鎖／重導／告警</text><rect x="735" y="402" width="190" height="88" rx="14" fill="#195068"/><text x="830" y="438" text-anchor="middle">主路徑＋備援路徑</text><text x="830" y="466" text-anchor="middle" fill="#b8dcd5" font-size="17">低延遲・可切換</text></g>
  <path d="M955 342 H1035" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/><rect x="1042" y="254" width="105" height="176" rx="22" fill="#302b58" stroke="#a997ff"/><text x="1095" y="315" text-anchor="middle" fill="#fff" font-size="20">外部</text><text x="1095" y="348" text-anchor="middle" fill="#fff" font-size="20">權威</text><text x="1095" y="381" text-anchor="middle" fill="#fff" font-size="20">DNS</text>
  <path d="M830 535 V592 H616" stroke="#a997ff" stroke-width="4" marker-end="url(#arrow)"/><rect x="330" y="570" width="280" height="92" rx="20" fill="#291f4e" stroke="#a997ff"/><text x="470" y="608" text-anchor="middle" fill="#e6ddff" font-size="21" font-weight="700">SOC／SIEM／事件應變</text><text x="470" y="638" text-anchor="middle" fill="#b9add8" font-size="17">查詢、封鎖、錯誤與切換證據</text>
  <text x="60" y="680" fill="#8ba4c7" font-size="17">驗收重點：正常解析、惡意網域封鎖、備援切換、端點歸屬、例外與復原皆可重現</text></g>
</svg>
