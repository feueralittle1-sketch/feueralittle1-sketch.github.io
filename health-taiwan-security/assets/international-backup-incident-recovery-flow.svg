<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">備份管理元件事件與乾淨還原流程</title><desc id="desc">從比對產品版本開始，並行保全證據和保護備份副本，再重建管理平面、輪替憑證、隔離還原及臨床驗證。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#68e8ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/>
<g font-family="Arial, Noto Sans TC, sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">先保住復原選項，再恢復備份服務</text><text x="60" y="108" fill="#a9bfdf" font-size="20">修補、事件分流與臨床持續運作必須並行</text>
<rect x="55" y="170" width="220" height="120" rx="22" fill="#12294c" stroke="#8fa8ff" stroke-width="3"/><text x="165" y="215" text-anchor="middle" fill="#c5d1ff" font-size="23" font-weight="700">1 比對範圍</text><text x="165" y="253" text-anchor="middle" fill="#dce8f8" font-size="18">產品／版本／平台／入口</text>
<rect x="360" y="145" width="250" height="145" rx="22" fill="#12294c" stroke="#ff7aa8" stroke-width="3"/><text x="485" y="193" text-anchor="middle" fill="#ff9fc0" font-size="23" font-weight="700">2 保全事件證據</text><text x="485" y="232" text-anchor="middle" fill="#dce8f8" font-size="18">主機、身分、工作與網路</text><text x="485" y="263" text-anchor="middle" fill="#a9bfdf" font-size="17">建立可信時間界線</text>
<rect x="360" y="335" width="250" height="145" rx="22" fill="#12294c" stroke="#59efbe" stroke-width="3"/><text x="485" y="383" text-anchor="middle" fill="#7ff3cf" font-size="23" font-weight="700">3 保護良好副本</text><text x="485" y="422" text-anchor="middle" fill="#dce8f8" font-size="18">凍結刪除與政策異動</text><text x="485" y="453" text-anchor="middle" fill="#a9bfdf" font-size="17">維持必要 RPO</text>
<path d="M275 230H350" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/><path d="M275 245C315 245 320 405 350 405" fill="none" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="695" y="230" width="220" height="145" rx="22" fill="#16375a" stroke="#ffbd69" stroke-width="3"/><text x="805" y="278" text-anchor="middle" fill="#ffcf8b" font-size="23" font-weight="700">4 可信重建</text><text x="805" y="317" text-anchor="middle" fill="#dce8f8" font-size="18">修補或重建控制面</text><text x="805" y="348" text-anchor="middle" fill="#a9bfdf" font-size="17">撤銷並輪替憑證</text>
<path d="M610 218C660 218 650 270 685 290" fill="none" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/><path d="M610 408C660 408 650 350 685 325" fill="none" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="970" y="230" width="180" height="145" rx="22" fill="#16375a" stroke="#59efbe" stroke-width="3"/><text x="1060" y="278" text-anchor="middle" fill="#7ff3cf" font-size="22" font-weight="700">5 隔離還原</text><text x="1060" y="317" text-anchor="middle" fill="#dce8f8" font-size="17">掃描與完整性</text><text x="1060" y="348" text-anchor="middle" fill="#dce8f8" font-size="17">應用一致性</text><path d="M915 303H960" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="695" y="500" width="455" height="125" rx="24" fill="#0c203b" stroke="#68e8ff" stroke-width="3"/><text x="923" y="546" text-anchor="middle" fill="#68e8ff" font-size="24" font-weight="700">6 臨床驗證與分批恢復</text><text x="923" y="585" text-anchor="middle" fill="#dce8f8" font-size="19">身分、資料庫、介接、功能、降級回切與 RTO／RPO</text><path d="M1060 375V490" stroke="#68e8ff" stroke-width="5" marker-end="url(#a)"/>
<rect x="55" y="535" width="540" height="90" rx="20" fill="#27172d" stroke="#ff7aa8" stroke-width="2"/><text x="325" y="572" text-anchor="middle" fill="#ff9fc0" font-size="21" font-weight="700">停止條件</text><text x="325" y="605" text-anchor="middle" fill="#dce8f8" font-size="17">來源不明、雜湊不符、舊憑證仍有效或臨床測試失敗</text></g></svg>
