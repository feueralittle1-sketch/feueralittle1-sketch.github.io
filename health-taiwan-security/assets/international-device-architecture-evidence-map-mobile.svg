<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版醫療設備安全架構證據地圖</title><desc id="desc">四種安全架構視圖經院方驗收後，映射到資產、網路、身分、監控與臨床控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102846"/></linearGradient></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><g font-family="Arial, Noto Sans TC, sans-serif"><text x="38" y="58" fill="#f7fbff" font-size="28" font-weight="800">架構圖是共同驗收證據</text><text x="38" y="96" fill="#9fb7d5" font-size="18">四種視圖回答不同安全問題</text><rect x="50" y="138" width="620" height="145" rx="22" fill="#173b5d" stroke="#63e6ff" stroke-width="2"/><text x="82" y="184" fill="#63e6ff" font-size="24" font-weight="800">全球視圖</text><text x="82" y="226" fill="#e6eefc" font-size="19">外部實體、資料流與信任邊界</text><rect x="50" y="303" width="620" height="145" rx="22" fill="#243557" stroke="#9c8cff" stroke-width="2"/><text x="82" y="349" fill="#b9adff" font-size="24" font-weight="800">分區視圖</text><text x="82" y="391" fill="#e6eefc" font-size="19">元件、介面、安全區與控制位置</text><rect x="50" y="468" width="620" height="145" rx="22" fill="#19443e" stroke="#57f0c1" stroke-width="2"/><text x="82" y="514" fill="#72f5cd" font-size="24" font-weight="800">序列視圖</text><text x="82" y="556" fill="#e6eefc" font-size="19">逐步通訊、授權、錯誤與失敗處理</text><rect x="50" y="633" width="620" height="145" rx="22" fill="#4a3420" stroke="#ffbf69" stroke-width="2"/><text x="82" y="679" fill="#ffd08a" font-size="24" font-weight="800">狀態視圖</text><text x="82" y="721" fill="#fff1dc" font-size="19">正常、降級、更新、回退與復原</text><path d="M360 778v40" stroke="#8fe8ff" stroke-width="5"/><rect x="50" y="818" width="620" height="122" rx="22" fill="#112e4d" stroke="#8fe8ff" stroke-width="3"/><text x="82" y="862" fill="#8fe8ff" font-size="23" font-weight="800">院方驗收閘門</text><text x="82" y="903" fill="#e6eefc" font-size="18">版本一致 · 可追蹤 · 可測試 · 有責任期限</text><path d="M360 940v32" stroke="#72f5cd" stroke-width="5"/><rect x="50" y="972" width="620" height="74" rx="20" fill="#16463f" stroke="#57f0c1" stroke-width="2"/><text x="360" y="1018" text-anchor="middle" fill="#ddfff4" font-size="18">映射資產、網路、存取、監控、回退與降級</text></g></svg>