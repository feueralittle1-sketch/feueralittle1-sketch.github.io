<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">醫療人工智慧事件風險與控制對照</title><desc id="desc">將事件誤判、缺乏人工智慧遙測、隔離過度、證據含敏感資料與供應商責任斷裂，對應分類閘門、最小遙測、分級控制、證據保護與契約接口。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10284a"/></linearGradient></defs><rect width="1200" height="700" fill="url(#bg)"/><g font-family="system-ui,'Noto Sans TC',sans-serif"><text x="60" y="70" fill="#fff" font-size="34" font-weight="700">五個失敗模式，五個事件治理閘門</text><text x="165" y="130" fill="#ffb1b1" text-anchor="middle" font-size="24" font-weight="700">失敗模式</text><text x="600" y="130" fill="#63e6ff" text-anchor="middle" font-size="24" font-weight="700">治理閘門</text><text x="1020" y="130" fill="#57f0c1" text-anchor="middle" font-size="24" font-weight="700">驗收證據</text><g font-size="19"><g><rect x="45" y="160" width="250" height="78" rx="18" fill="#3b2432"/><text x="170" y="208" fill="#ffe6e9" text-anchor="middle">只查入侵，漏掉臨床傷害</text><rect x="370" y="160" width="460" height="78" rx="18" fill="#163552"/><text x="600" y="208" fill="#dcecff" text-anchor="middle">攻擊／失效／誤用／混合事件分類</text><rect x="905" y="160" width="250" height="78" rx="18" fill="#17423f"/><text x="1030" y="208" fill="#eafff8" text-anchor="middle">分級紀錄與權責</text></g><g><rect x="45" y="255" width="250" height="78" rx="18" fill="#3b2432"/><text x="170" y="303" fill="#ffe6e9" text-anchor="middle">只有網路日誌，無模型軌跡</text><rect x="370" y="255" width="460" height="78" rx="18" fill="#163552"/><text x="600" y="303" fill="#dcecff" text-anchor="middle">最小必要 AI 遙測與版本清冊</text><rect x="905" y="255" width="250" height="78" rx="18" fill="#17423f"/><text x="1030" y="303" fill="#eafff8" text-anchor="middle">可查詢事件時間線</text></g><g><rect x="45" y="350" width="250" height="78" rx="18" fill="#3b2432"/><text x="170" y="398" fill="#ffe6e9" text-anchor="middle">全面停機造成臨床中斷</text><rect x="370" y="350" width="460" height="78" rx="18" fill="#163552"/><text x="600" y="398" fill="#dcecff" text-anchor="middle">依權限、工具與用途分級控制</text><rect x="905" y="350" width="250" height="78" rx="18" fill="#17423f"/><text x="1030" y="398" fill="#eafff8" text-anchor="middle">撤權與降級演練</text></g><g><rect x="45" y="445" width="250" height="78" rx="18" fill="#3b2432"/><text x="170" y="493" fill="#ffe6e9" text-anchor="middle">證據保存反而擴大個資風險</text><rect x="370" y="445" width="460" height="78" rx="18" fill="#163552"/><text x="600" y="493" fill="#dcecff" text-anchor="middle">最小化、遮罩、分權與保存期限</text><rect x="905" y="445" width="250" height="78" rx="18" fill="#17423f"/><text x="1030" y="493" fill="#eafff8" text-anchor="middle">存取與銷毀紀錄</text></g><g><rect x="45" y="540" width="250" height="78" rx="18" fill="#3b2432"/><text x="170" y="588" fill="#ffe6e9" text-anchor="middle">供應商握有證據卻無回應義務</text><rect x="370" y="540" width="460" height="78" rx="18" fill="#163552"/><text x="600" y="588" fill="#dcecff" text-anchor="middle">通知、證據、撤權、回退與聯絡條款</text><rect x="905" y="540" width="250" height="78" rx="18" fill="#17423f"/><text x="1030" y="588" fill="#eafff8" text-anchor="middle">聯合演練與交付測試</text></g></g><text x="600" y="660" fill="#9fb3d9" text-anchor="middle" font-size="19">控制必須同時維持病人安全、事件可見性與臨床持續運作。</text></g></svg>