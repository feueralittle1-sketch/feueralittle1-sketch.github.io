<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">病人數位身分憑證導入與綁定流程</title><desc id="desc">由場景分級、憑證驗證、病人配對、受限綁定、持續監測到遺失復原的六階段流程。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#132548"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="60" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">六階段建立可撤回的身分綁定</text><text x="600" y="96" text-anchor="middle" fill="#9fb3d9" font-size="19">高風險資料存取不能只依一次成功驗證</text><g text-anchor="middle">
<g><circle cx="120" cy="255" r="70" fill="#102d35" stroke="#57f0c1" stroke-width="4"/><text x="120" y="244" fill="#57f0c1" font-size="25" font-weight="800">01</text><text x="120" y="277" fill="#fff" font-size="19" font-weight="700">場景分級</text><text x="120" y="355" fill="#c6d4eb" font-size="16">查詢、下載、代理</text><text x="120" y="381" fill="#c6d4eb" font-size="16">分開定義保證需求</text></g><path d="M195 255H235" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
<g><circle cx="315" cy="255" r="70" fill="#122a49" stroke="#63e6ff" stroke-width="4"/><text x="315" y="244" fill="#63e6ff" font-size="25" font-weight="800">02</text><text x="315" y="277" fill="#fff" font-size="19" font-weight="700">驗證憑證</text><text x="315" y="355" fill="#c6d4eb" font-size="16">簽章、狀態、來源</text><text x="315" y="381" fill="#c6d4eb" font-size="16">裝置持有與防重播</text></g><path d="M390 255H430" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
<g><circle cx="510" cy="255" r="70" fill="#1b2848" stroke="#a997ff" stroke-width="4"/><text x="510" y="244" fill="#c5baff" font-size="25" font-weight="800">03</text><text x="510" y="277" fill="#fff" font-size="19" font-weight="700">病人配對</text><text x="510" y="355" fill="#c6d4eb" font-size="16">主索引、重複紀錄</text><text x="510" y="381" fill="#c6d4eb" font-size="16">衝突轉人工處理</text></g><path d="M585 255H625" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
<g><circle cx="705" cy="255" r="70" fill="#2b2340" stroke="#ffb86b" stroke-width="4"/><text x="705" y="244" fill="#ffcf99" font-size="25" font-weight="800">04</text><text x="705" y="277" fill="#fff" font-size="19" font-weight="700">受限綁定</text><text x="705" y="355" fill="#c6d4eb" font-size="16">期限、用途、裝置</text><text x="705" y="381" fill="#c6d4eb" font-size="16">敏感操作再確認</text></g><path d="M780 255H820" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
<g><circle cx="900" cy="255" r="70" fill="#153044" stroke="#63e6ff" stroke-width="4"/><text x="900" y="244" fill="#8fe8ff" font-size="25" font-weight="800">05</text><text x="900" y="277" fill="#fff" font-size="19" font-weight="700">持續監測</text><text x="900" y="355" fill="#c6d4eb" font-size="16">異常裝置與行為</text><text x="900" y="381" fill="#c6d4eb" font-size="16">狀態變更即降權</text></g><path d="M975 255H1015" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"/>
<g><circle cx="1090" cy="255" r="70" fill="#3a1f2e" stroke="#ff7a9d" stroke-width="4"/><text x="1090" y="244" fill="#ff9db7" font-size="25" font-weight="800">06</text><text x="1090" y="277" fill="#fff" font-size="19" font-weight="700">撤銷復原</text><text x="1090" y="355" fill="#c6d4eb" font-size="16">遺失、換機、死亡</text><text x="1090" y="381" fill="#c6d4eb" font-size="16">代理與帳號接管</text></g></g>
<rect x="120" y="465" width="960" height="105" rx="24" fill="#0e2038" stroke="#71a7ff" stroke-width="2"/><text x="600" y="505" text-anchor="middle" fill="#a8c8ff" font-size="21" font-weight="800">驗收證據</text><text x="600" y="542" text-anchor="middle" fill="#e6eefc" font-size="18">測試向量通過率・錯配與重複病歷率・人工例外時效・撤銷生效時間・復原後高風險操作再驗證率</text><text x="600" y="625" text-anchor="middle" fill="#57f0c1" font-size="21">先由低風險查詢情境試點，再逐步擴大到病歷下載、代理與高敏感操作</text></g></svg>
