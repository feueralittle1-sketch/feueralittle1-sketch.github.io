<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc"><title id="title">手機版醫療系統安全計畫風險控制對照</title><desc id="desc">四個卡片說明邊界過時、責任不明、證據缺失與例外失控，以及相應治理控制。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#171b3f"/></linearGradient></defs><rect width="720" height="1220" rx="32" fill="url(#bg)"/><text x="42" y="62" fill="#fff" font-size="29" font-weight="700">靜態計畫的四種失敗模式</text><text x="42" y="100" fill="#9fb3d9" font-size="18">用可驗證控制維持文件與現況一致</text><g font-family="sans-serif"><g fill="#12213d" stroke="rgba(255,255,255,.16)"><rect x="55" y="145" width="610" height="225" rx="26"/><rect x="55" y="395" width="610" height="225" rx="26"/><rect x="55" y="645" width="610" height="225" rx="26"/><rect x="55" y="895" width="610" height="225" rx="26"/></g><text x="90" y="195" fill="#ff9abd" font-size="22" font-weight="700">邊界未同步</text><text x="90" y="238" fill="#fff" font-size="19">後果：資產、資料流與依賴漏列</text><text x="90" y="285" fill="#57f0c1" font-size="19">控制：變更單觸發邊界更新</text><text x="90" y="328" fill="#c6d4eb" font-size="18">驗收：抽樣介接可追到擁有者</text><text x="90" y="445" fill="#ff9abd" font-size="22" font-weight="700">責任不明</text><text x="90" y="488" fill="#fff" font-size="19">後果：事件時無人決策或維護</text><text x="90" y="535" fill="#57f0c1" font-size="19">控制：責任矩陣與核准權</text><text x="90" y="578" fill="#c6d4eb" font-size="18">驗收：主責與代理人均可聯繫</text><text x="90" y="695" fill="#ff9abd" font-size="22" font-weight="700">證據缺失</text><text x="90" y="738" fill="#fff" font-size="19">後果：無法驗證控制是否有效</text><text x="90" y="785" fill="#57f0c1" font-size="19">控制：連結組態、測試與演練</text><text x="90" y="828" fill="#c6d4eb" font-size="18">驗收：證據在目標時間內取得</text><text x="90" y="945" fill="#ff9abd" font-size="22" font-weight="700">例外失控</text><text x="90" y="988" fill="#fff" font-size="19">後果：殘餘風險長期擴大</text><text x="90" y="1035" fill="#57f0c1" font-size="19">控制：到期重審與關閉證據</text><text x="90" y="1078" fill="#c6d4eb" font-size="18">驗收：逾期例外自動升級</text></g><text x="360" y="1175" text-anchor="middle" fill="#63e6ff" font-size="19" font-weight="700">高影響服務應能找到完整責任與證據鏈</text></svg>