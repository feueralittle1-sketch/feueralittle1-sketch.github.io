<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療設備退役的資料與責任邊界</title>
<desc id="desc">從臨床設備、可移除媒體、雲端帳戶到維修與回收供應商，標示盤點、隔離、資料清除與證據保存責任。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071626"/><stop offset="1" stop-color="#122047"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="38" font-weight="800">設備退役不是搬走機器，而是關閉全部資料路徑</text><text x="70" y="116" fill="#9fb3d9" font-size="20">每個資料位置、身分與外部依賴都要有明確處置與驗證證據</text>
<g font-family="Noto Sans TC, sans-serif"><rect x="70" y="180" width="265" height="180" rx="26" fill="#102d48" stroke="#63e6ff" stroke-width="2"/><text x="100" y="225" fill="#63e6ff" font-size="22" font-weight="700">臨床使用區</text><text x="100" y="270" fill="#fff" font-size="25" font-weight="700">醫療設備本體</text><text x="100" y="310" fill="#c6d4eb" font-size="18">本機資料庫・快取・日誌</text><text x="100" y="340" fill="#c6d4eb" font-size="18">憑證・帳號・網路設定</text>
<rect x="470" y="160" width="260" height="220" rx="30" fill="#182c55" stroke="#a997ff" stroke-width="3" filter="url(#glow)"/><text x="505" y="210" fill="#d9d1ff" font-size="22" font-weight="700">退役治理閘門</text><text x="505" y="255" fill="#fff" font-size="24" font-weight="800">盤點 → 分級 → 隔離</text><text x="505" y="298" fill="#fff" font-size="24" font-weight="800">清除 → 驗證 → 放行</text><text x="505" y="340" fill="#b9c8e5" font-size="18">資產、資料、臨床、資安、採購共同簽核</text>
<rect x="865" y="180" width="265" height="180" rx="26" fill="#123b43" stroke="#57f0c1" stroke-width="2"/><text x="895" y="225" fill="#57f0c1" font-size="22" font-weight="700">外部處置區</text><text x="895" y="270" fill="#fff" font-size="25" font-weight="700">維修・轉售・回收</text><text x="895" y="310" fill="#c6d4eb" font-size="18">僅接收已放行資產</text><text x="895" y="340" fill="#c6d4eb" font-size="18">契約、交接與銷毀證明</text>
<path d="M335 270H455" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M730 270H850" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="450" width="320" height="170" rx="24" fill="#0e223a" stroke="#39597d"/><text x="100" y="495" fill="#8fe8ff" font-size="21" font-weight="700">別漏掉的資料位置</text><text x="100" y="535" fill="#fff" font-size="19">可移除媒體・內接儲存・列印佇列</text><text x="100" y="570" fill="#fff" font-size="19">雲端入口・供應商平台・備份副本</text><text x="100" y="605" fill="#fff" font-size="19">維修映像・監控平台・金鑰與憑證</text>
<rect x="440" y="450" width="320" height="170" rx="24" fill="#0e223a" stroke="#39597d"/><text x="470" y="495" fill="#d9d1ff" font-size="21" font-weight="700">放行前的必要證據</text><text x="470" y="535" fill="#fff" font-size="19">資產序號與媒體對應</text><text x="470" y="570" fill="#fff" font-size="19">清除方法、工具結果與抽驗</text><text x="470" y="605" fill="#fff" font-size="19">帳號撤銷、網路移除與責任簽核</text>
<rect x="810" y="450" width="320" height="170" rx="24" fill="#0e223a" stroke="#39597d"/><text x="840" y="495" fill="#57f0c1" font-size="21" font-weight="700">外移條件</text><text x="840" y="535" fill="#fff" font-size="19">資料不可合理復原</text><text x="840" y="570" fill="#fff" font-size="19">設備不再連回院內服務</text><text x="840" y="605" fill="#fff" font-size="19">證據可回溯到人、時間與資產</text></g></svg>