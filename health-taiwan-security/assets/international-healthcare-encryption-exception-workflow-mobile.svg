<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1030" role="img" aria-labelledby="title desc"><title id="title">手機版醫療加密例外決策與重驗流程</title><desc id="desc">資料盤點與加密測試後，可行者受控部署；暫時不可行者建立等效控制、期限及退出條件，並在期限到期後重驗。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102443"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0V6L7 3z" fill="#63e6ff"/></marker></defs><rect width="390" height="1030" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="22" y="42" fill="#fff" font-size="21" font-weight="800">加密例外決策流程</text><text x="22" y="70" fill="#abc0df" font-size="14">例外須回到加密、替換或退場</text><rect x="22" y="105" width="346" height="94" rx="18" fill="#12324b" stroke="#63e6ff"/><text x="45" y="143" fill="#fff" font-size="18" font-weight="800">1　盤點資料與臨床用途</text><text x="45" y="174" fill="#c8d8eb" font-size="15">系統、介面、敏感度、保存期</text><path d="M195 208V244" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="254" width="346" height="94" rx="18" fill="#19304d" stroke="#82a9ff"/><text x="45" y="292" fill="#fff" font-size="18" font-weight="800">2　測試相容性與復原</text><text x="45" y="323" fill="#c8d8eb" font-size="15">效能、臨床回歸、金鑰復原</text><path d="M195 357V393" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><polygon points="195,405 338,480 195,555 52,480" fill="#2b2750" stroke="#c99cff"/><text x="195" y="472" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">可安全啟用</text><text x="195" y="501" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">加密？</text><path d="M195 555V591" stroke="#63e6ff" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="601" width="346" height="112" rx="20" fill="#113d49" stroke="#57f0c1"/><text x="45" y="640" fill="#fff" font-size="18" font-weight="800">可行：受控部署</text><text x="45" y="671" fill="#c9f5e7" font-size="15">分批放行、金鑰保護、復原測試</text><text x="45" y="697" fill="#c9f5e7" font-size="15">覆蓋率與持續監測</text><path d="M195 723V759" stroke="#ffb86b" stroke-width="3" marker-end="url(#a)"/><rect x="22" y="769" width="346" height="154" rx="20" fill="#3d2944" stroke="#ffb86b"/><text x="45" y="808" fill="#fff" font-size="18" font-weight="800">不可行：受控例外</text><text x="45" y="839" fill="#f7d7bf" font-size="15">記錄限制與臨床影響</text><text x="45" y="868" fill="#f7d7bf" font-size="15">部署等效控制與監測門檻</text><text x="45" y="897" fill="#f7d7bf" font-size="15">指定責任人、期限、退出條件</text><path d="M195 932V968" stroke="#ffb86b" stroke-width="3" marker-end="url(#a)"/><text x="195" y="1003" text-anchor="middle" fill="#ffc685" font-size="15" font-weight="700">到期後重測：加密｜替換｜退場</text></g></svg>