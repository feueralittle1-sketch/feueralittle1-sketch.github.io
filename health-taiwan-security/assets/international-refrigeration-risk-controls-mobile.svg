<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc"><title id="title">醫院冷鏈風險控制對照手機版</title><desc id="desc">冷鏈設備的五種失敗模式分別對應外部曝險收斂、身分隔離、網路分區、獨立溫度紀錄與雙重放行。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient></defs><rect width="720" height="1320" rx="28" fill="url(#bg)"/><text x="40" y="62" fill="#fff" font-size="31" font-weight="800">冷鏈風險與控制</text><text x="40" y="102" fill="#a8bddc" font-size="19">技術恢復與庫存放行分開驗收</text><g font-family="Arial,Noto Sans TC,sans-serif"><g><rect x="42" y="145" width="636" height="205" rx="24" fill="#17263d"/><text x="76" y="194" fill="#ffb7cb" font-size="23" font-weight="800">設備直接暴露網際網路</text><text x="76" y="237" fill="#d6e0ef" font-size="20">風險：未授權控制與服務中斷</text><text x="76" y="280" fill="#c9f8e8" font-size="20">控制：移除外曝、入口盤點</text><text x="76" y="317" fill="#c9f8e8" font-size="20">驗收：外部掃描證明不可達</text></g><g><rect x="42" y="375" width="636" height="205" rx="24" fill="#132b43"/><text x="76" y="424" fill="#ffb7cb" font-size="23" font-weight="800">預設或共用供應商帳密</text><text x="76" y="467" fill="#d6e0ef" font-size="20">風險：身分無法歸責、憑證擴散</text><text x="76" y="510" fill="#c9f8e8" font-size="20">控制：獨立帳號、強驗證、限時授權</text><text x="76" y="547" fill="#c9f8e8" font-size="20">驗收：工單與會話紀錄可追溯</text></g><g><rect x="42" y="605" width="636" height="205" rx="24" fill="#17263d"/><text x="76" y="654" fill="#ffb7cb" font-size="23" font-weight="800">冷鏈與辦公網路平面互通</text><text x="76" y="697" fill="#d6e0ef" font-size="20">風險：橫向移動與廣泛停機</text><text x="76" y="740" fill="#c9f8e8" font-size="20">控制：網路分區、最小必要流量</text><text x="76" y="777" fill="#c9f8e8" font-size="20">驗收：中斷測試與降級演練</text></g><g><rect x="42" y="835" width="636" height="205" rx="24" fill="#132b43"/><text x="76" y="884" fill="#ffb7cb" font-size="23" font-weight="800">控制器也是唯一溫度來源</text><text x="76" y="927" fill="#d6e0ef" font-size="20">風險：事件後無法證明物品狀態</text><text x="76" y="970" fill="#c9f8e8" font-size="20">控制：獨立、可校正的資料記錄器</text><text x="76" y="1007" fill="#c9f8e8" font-size="20">驗收：時間、匯出與缺口可驗證</text></g><g><rect x="42" y="1065" width="636" height="205" rx="24" fill="#17263d"/><text x="76" y="1114" fill="#ffb7cb" font-size="23" font-weight="800">控制器恢復即直接放行庫存</text><text x="76" y="1157" fill="#d6e0ef" font-size="20">風險：忽略溫度偏差與資料缺口</text><text x="76" y="1200" fill="#c9f8e8" font-size="20">控制：技術驗收＋權責單位判定</text><text x="76" y="1237" fill="#c9f8e8" font-size="20">驗收：放行、隔離或報廢留痕</text></g></g></svg>