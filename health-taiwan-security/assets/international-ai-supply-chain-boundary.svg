<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療第三方 AI 供應鏈信任邊界</title>
<desc id="desc">基礎模型、資料與外掛服務經供應商整合後，通過醫院治理閘門才連接臨床流程，並將事件與變更證據送往獨立稽核區。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10254a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="34" font-weight="800">第三方 AI 不只是一家供應商</text><text x="70" y="116" fill="#9fb3d9" font-size="20">看見模型、資料、外掛、雲端與臨床流程之間的完整依賴</text>
<rect x="60" y="165" width="285" height="390" rx="28" fill="#0d203a" stroke="#536d95" stroke-width="2"/><text x="88" y="210" fill="#a997ff" font-size="25" font-weight="700">外部 AI 供應鏈</text>
<g font-size="20" fill="#e6eefc"><rect x="88" y="242" width="225" height="58" rx="16" fill="#172c50"/><text x="112" y="278">基礎模型／API</text><rect x="88" y="318" width="225" height="58" rx="16" fill="#172c50"/><text x="112" y="354">訓練與推論資料</text><rect x="88" y="394" width="225" height="58" rx="16" fill="#172c50"/><text x="112" y="430">外掛、代理與開源元件</text><rect x="88" y="470" width="225" height="58" rx="16" fill="#172c50"/><text x="112" y="506">雲端與次處理者</text></g>
<rect x="440" y="195" width="320" height="330" rx="32" fill="#102c3b" stroke="#63e6ff" stroke-width="3" filter="url(#glow)"/><text x="600" y="246" fill="#63e6ff" font-size="27" font-weight="800" text-anchor="middle">醫院治理閘門</text><g font-size="20" fill="#fff" text-anchor="middle"><text x="600" y="300">用途與風險分級</text><text x="600" y="346">依賴清冊與資料流</text><text x="600" y="392">變更通知與再驗證</text><text x="600" y="438">人工覆核與安全停用</text><text x="600" y="484">契約、事件與退場責任</text></g>
<rect x="855" y="165" width="285" height="250" rx="28" fill="#10263d" stroke="#57f0c1" stroke-width="2"/><text x="997" y="214" fill="#57f0c1" font-size="25" font-weight="700" text-anchor="middle">院內使用邊界</text><g font-size="20" fill="#e6eefc"><text x="890" y="272">臨床決策支援</text><text x="890" y="318">行政與病歷摘要</text><text x="890" y="364">遠距監測與設備</text></g>
<rect x="855" y="455" width="285" height="140" rx="28" fill="#261e43" stroke="#a997ff" stroke-width="2"/><text x="997" y="504" fill="#c7bcff" font-size="24" font-weight="700" text-anchor="middle">獨立證據面</text><text x="997" y="548" fill="#e6eefc" font-size="19" text-anchor="middle">版本、事件、變更、停用紀錄</text>
<path d="M345 350 H430" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M760 350 H845" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1000 415 V445" stroke="#a997ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 525 V626 H1000 V605" fill="none" stroke="#a997ff" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="600" y="680" fill="#9fb3d9" font-size="18" text-anchor="middle">放行依據不是品牌名稱，而是可追溯依賴、明確責任與可執行的停用路徑</text></svg>