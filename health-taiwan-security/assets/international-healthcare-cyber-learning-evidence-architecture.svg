<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">醫療資安學習與行為證據架構</title><desc id="desc">臨床、服務台、特權維運與治理角色，依角色情境接受學習與演練，最後形成可追溯的工作流行為證據。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11234a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs><rect width="1200" height="680" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="34" font-weight="800">角色化資安學習不是一門共同課程</text><text x="60" y="108" fill="#a9bddf" font-size="20">從工作任務出發，經情境、演練與量測形成可驗收證據</text><g font-family="Noto Sans TC, sans-serif"><text x="70" y="165" fill="#63e6ff" font-size="18" font-weight="700">工作角色</text><g filter="url(#s)"><rect x="55" y="185" width="230" height="78" rx="18" fill="#132b46" stroke="#63e6ff"/><text x="80" y="218" fill="#fff" font-size="22" font-weight="700">臨床照護</text><text x="80" y="246" fill="#bad0eb" font-size="16">病歷、訊息、緊急存取</text><rect x="55" y="280" width="230" height="78" rx="18" fill="#132b46" stroke="#8fb1ff"/><text x="80" y="313" fill="#fff" font-size="22" font-weight="700">服務台</text><text x="80" y="341" fill="#bad0eb" font-size="16">身分核驗、帳號復原</text><rect x="55" y="375" width="230" height="78" rx="18" fill="#132b46" stroke="#c99cff"/><text x="80" y="408" fill="#fff" font-size="22" font-weight="700">特權與供應商</text><text x="80" y="436" fill="#bad0eb" font-size="16">遠端維運、高影響指令</text><rect x="55" y="470" width="230" height="78" rx="18" fill="#132b46" stroke="#66efbf"/><text x="80" y="503" fill="#fff" font-size="22" font-weight="700">事件指揮</text><text x="80" y="531" fill="#bad0eb" font-size="16">升級、臨床與對外協調</text></g><path d="M300 365 H380" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="395" y="190" width="310" height="350" rx="28" fill="#0e2039" stroke="#46698f" stroke-width="2"/><text x="430" y="235" fill="#fff" font-size="26" font-weight="800">角色情境與安全演練</text><g fill="#bcd0ea" font-size="19"><text x="440" y="290">01　冒名與社交工程</text><text x="440" y="340">02　異常登入與權限濫用</text><text x="440" y="390">03　敏感資料誤傳</text><text x="440" y="440">04　設備與服務中斷</text><text x="440" y="490">05　正確回報與替代流程</text></g><path d="M720 365 H800" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><rect x="815" y="185" width="330" height="365" rx="28" fill="#122b3f" stroke="#57f0c1" stroke-width="2"/><text x="850" y="230" fill="#fff" font-size="26" font-weight="800">可驗收行為證據</text><g font-size="19"><circle cx="858" cy="285" r="9" fill="#63e6ff"/><text x="880" y="292" fill="#dbe9fa">使用正確回報入口</text><circle cx="858" cy="337" r="9" fill="#8fb1ff"/><text x="880" y="344" fill="#dbe9fa">在門檻內完成升級</text><circle cx="858" cy="389" r="9" fill="#c99cff"/><text x="880" y="396" fill="#dbe9fa">避免提交憑證或資料</text><circle cx="858" cy="441" r="9" fill="#66efbf"/><text x="880" y="448" fill="#dbe9fa">啟動替代工作流程</text><circle cx="858" cy="493" r="9" fill="#ffd166"/><text x="880" y="500" fill="#dbe9fa">改善後完成重驗關閉</text></g><rect x="395" y="580" width="750" height="54" rx="16" fill="#10263e" stroke="#2e5578"/><text x="430" y="614" fill="#9fe9ff" font-size="19" font-weight="700">治理底線：資料最小化・臨床停止條件・無責改善・獨立覆核・可追溯紀錄</text></g></svg>