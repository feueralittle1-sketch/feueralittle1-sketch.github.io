<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AI 輔助程式碼六道交付閘門</title><desc id="desc">從工作分級、受控生成、人工審查、自動測試、獨立核准到上線監測的醫療軟體交付流程。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111b3b"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#63e6ff"/></marker></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="64" y="70" fill="#f4f8ff" font-size="34" font-weight="700">從提示到上線：每一道閘門都要留下證據</text><text x="64" y="108" fill="#9fb3d9" font-size="21">AI 可協助產生內容，但交付責任仍由人員與組織流程承擔</text>
<path d="M145 310H1060" stroke="#63e6ff" stroke-width="5" marker-end="url(#arrow)"/>
<g font-family="sans-serif" text-anchor="middle"><g><circle cx="140" cy="310" r="58" fill="#103047" stroke="#57f0c1" stroke-width="3"/><text x="140" y="304" fill="#57f0c1" font-size="22" font-weight="700">01</text><text x="140" y="334" fill="#fff" font-size="19">工作分級</text><rect x="55" y="405" width="170" height="105" rx="16" fill="#10243b" stroke="#2d526c"/><text x="140" y="440" fill="#d8e6fa" font-size="18">用途與資料</text><text x="140" y="471" fill="#d8e6fa" font-size="18">影響與責任人</text></g>
<g><circle cx="325" cy="310" r="58" fill="#103047" stroke="#63e6ff" stroke-width="3"/><text x="325" y="304" fill="#63e6ff" font-size="22" font-weight="700">02</text><text x="325" y="334" fill="#fff" font-size="19">受控生成</text><rect x="240" y="405" width="170" height="105" rx="16" fill="#10243b" stroke="#2d526c"/><text x="325" y="440" fill="#d8e6fa" font-size="18">核准工具</text><text x="325" y="471" fill="#d8e6fa" font-size="18">最小權限環境</text></g>
<g><circle cx="510" cy="310" r="58" fill="#152b4a" stroke="#8fa7ff" stroke-width="3"/><text x="510" y="304" fill="#a9b8ff" font-size="22" font-weight="700">03</text><text x="510" y="334" fill="#fff" font-size="19">人工審查</text><rect x="425" y="405" width="170" height="105" rx="16" fill="#10243b" stroke="#2d526c"/><text x="510" y="440" fill="#d8e6fa" font-size="18">理解差異</text><text x="510" y="471" fill="#d8e6fa" font-size="18">威脅與維護性</text></g>
<g><circle cx="695" cy="310" r="58" fill="#222943" stroke="#ffd166" stroke-width="3"/><text x="695" y="304" fill="#ffd166" font-size="22" font-weight="700">04</text><text x="695" y="334" fill="#fff" font-size="19">自動測試</text><rect x="610" y="405" width="170" height="105" rx="16" fill="#10243b" stroke="#2d526c"/><text x="695" y="440" fill="#d8e6fa" font-size="18">SAST／依賴</text><text x="695" y="471" fill="#d8e6fa" font-size="18">負向與回歸測試</text></g>
<g><circle cx="880" cy="310" r="58" fill="#2e2742" stroke="#dc8cff" stroke-width="3"/><text x="880" y="304" fill="#dc8cff" font-size="22" font-weight="700">05</text><text x="880" y="334" fill="#fff" font-size="19">獨立核准</text><rect x="795" y="405" width="170" height="105" rx="16" fill="#10243b" stroke="#2d526c"/><text x="880" y="440" fill="#d8e6fa" font-size="18">不可自產自批</text><text x="880" y="471" fill="#d8e6fa" font-size="18">風險接受留痕</text></g>
<g><circle cx="1065" cy="310" r="58" fill="#35233b" stroke="#ff6b91" stroke-width="3"/><text x="1065" y="304" fill="#ff8eaa" font-size="22" font-weight="700">06</text><text x="1065" y="334" fill="#fff" font-size="19">上線監測</text><rect x="980" y="405" width="170" height="105" rx="16" fill="#10243b" stroke="#2d526c"/><text x="1065" y="440" fill="#d8e6fa" font-size="18">灰度與回滾</text><text x="1065" y="471" fill="#d8e6fa" font-size="18">事件與成效監測</text></g></g>
<rect x="160" y="567" width="880" height="52" rx="18" fill="#0c2032" stroke="#57f0c1"/><text x="600" y="600" text-anchor="middle" fill="#c8f7ea" font-size="21">任一閘門失敗：退回修正、降低用途範圍，或停止交付</text></svg>