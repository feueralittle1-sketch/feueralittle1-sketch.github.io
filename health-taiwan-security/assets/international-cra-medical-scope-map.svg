<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">歐盟 CRA 與醫院數位產品適用邊界</title><desc id="desc">區分歐盟市場上的一般數位產品、受醫療器材法規規範的產品，以及台灣醫院可採用的供應商通報治理。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101d3b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="64" y="76" fill="#f4f8ff" font-size="36" font-weight="700">先判定產品身分，再決定通報路徑</text><text x="64" y="116" fill="#9fb3d9" font-size="20">國外法規適用範圍與台灣醫院的契約治理必須分開處理</text>
<rect x="64" y="165" width="320" height="350" rx="28" fill="#122847" stroke="#63e6ff" stroke-width="3"/><text x="96" y="218" fill="#63e6ff" font-size="25" font-weight="700">CRA 可能適用</text><text x="96" y="266" fill="#e6eefc" font-size="21">• 歐盟市場數位產品</text><text x="96" y="306" fill="#e6eefc" font-size="21">• 通用軟體與硬體</text><text x="96" y="346" fill="#e6eefc" font-size="21">• 網路與管理元件</text><text x="96" y="406" fill="#9fb3d9" font-size="18">製造商須依 CRA 判定</text><text x="96" y="436" fill="#9fb3d9" font-size="18">積極遭利用漏洞與</text><text x="96" y="466" fill="#9fb3d9" font-size="18">重大事件的通報責任</text>
<rect x="440" y="165" width="320" height="350" rx="28" fill="#251f44" stroke="#a997ff" stroke-width="3"/><text x="472" y="218" fill="#c9bfff" font-size="25" font-weight="700">須另行判定</text><text x="472" y="266" fill="#e6eefc" font-size="21">• MDR／IVDR 醫療器材</text><text x="472" y="306" fill="#e6eefc" font-size="21">• 其他部門別法規產品</text><text x="472" y="346" fill="#e6eefc" font-size="21">• 套裝整合與配件</text><text x="472" y="406" fill="#9fb3d9" font-size="18">不能因部署於醫院</text><text x="472" y="436" fill="#9fb3d9" font-size="18">就直接推定適用或排除</text><text x="472" y="466" fill="#9fb3d9" font-size="18">應確認法規產品身分</text>
<rect x="816" y="165" width="320" height="350" rx="28" fill="#12352f" stroke="#57f0c1" stroke-width="3"/><text x="848" y="218" fill="#57f0c1" font-size="25" font-weight="700">台灣醫院治理</text><text x="848" y="266" fill="#e6eefc" font-size="21">• 建立供應商通報入口</text><text x="848" y="306" fill="#e6eefc" font-size="21">• 保存產品與版本清冊</text><text x="848" y="346" fill="#e6eefc" font-size="21">• 評估臨床影響</text><text x="848" y="386" fill="#e6eefc" font-size="21">• 驗證修補與補償控制</text><text x="848" y="436" fill="#9fb3d9" font-size="18">屬風險與契約管理</text><text x="848" y="466" fill="#9fb3d9" font-size="18">不是直接承接歐盟義務</text>
<path d="M384 340H440M760 340H816" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8fe8ff"/></marker></defs>
<rect x="64" y="565" width="1072" height="80" rx="20" fill="#0d2138" stroke="#274867"/><text x="600" y="614" text-anchor="middle" fill="#f4f8ff" font-size="23" font-weight="700">治理輸出：產品身分、適用法域、通報聯絡人、時鐘、臨床影響與關閉證據</text></svg>