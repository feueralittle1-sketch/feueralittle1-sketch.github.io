<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" role="img" aria-labelledby="title desc"><title id="title">停機資料可信復原邊界手機版</title><desc id="desc">停機前資料與停機紀錄通過臨床對帳，才能分批寫回正式病歷。</desc><rect width="390" height="900" rx="24" fill="#071426"/><text x="24" y="48" fill="#fff" font-size="23" font-weight="800">停機資料可信復原邊界</text><text x="24" y="78" fill="#9fb3d9" font-size="14">系統上線不等於資料可以直接回灌</text><g font-family="system-ui,'Noto Sans TC',sans-serif"><rect x="24" y="112" width="342" height="135" rx="18" fill="#132d4f" stroke="#63e6ff" stroke-width="2"/><text x="195" y="150" text-anchor="middle" fill="#63e6ff" font-size="19" font-weight="700">停機前可信狀態</text><text x="195" y="184" text-anchor="middle" fill="#fff" font-size="17">最後已知良好快照</text><text x="195" y="215" text-anchor="middle" fill="#c6d4eb" font-size="14">病人身分・醫囑・結果・用藥</text><rect x="24" y="278" width="342" height="135" rx="18" fill="#2a244b" stroke="#a997ff" stroke-width="2"/><text x="195" y="316" text-anchor="middle" fill="#c7b8ff" font-size="19" font-weight="700">停機期間紀錄</text><text x="195" y="350" text-anchor="middle" fill="#fff" font-size="17">紙本・離線・設備暫存</text><text x="195" y="381" text-anchor="middle" fill="#d7cff6" font-size="14">簽名・時間・來源・處置狀態</text><path d="M195 430v42" stroke="#57f0c1" stroke-width="5"/><path d="M185 462l10 12 10-12" fill="none" stroke="#fff" stroke-width="4"/><rect x="24" y="486" width="342" height="170" rx="20" fill="#0e3a43" stroke="#57f0c1" stroke-width="3"/><text x="195" y="526" text-anchor="middle" fill="#57f0c1" font-size="20" font-weight="800">臨床對帳閘門</text><text x="195" y="562" text-anchor="middle" fill="#fff" font-size="16">身分／醫囑／結果／給藥比對</text><text x="195" y="594" text-anchor="middle" fill="#fff" font-size="16">重複、缺漏、衝突進例外佇列</text><text x="195" y="626" text-anchor="middle" fill="#bdf8e7" font-size="14">雙人覆核・保存證據</text><path d="M195 672v42" stroke="#71a7ff" stroke-width="5"/><path d="M185 704l10 12 10-12" fill="none" stroke="#fff" stroke-width="4"/><rect x="24" y="728" width="342" height="138" rx="20" fill="#17345e" stroke="#71a7ff" stroke-width="3"/><text x="195" y="768" text-anchor="middle" fill="#9cc4ff" font-size="20" font-weight="800">受控正式病歷</text><text x="195" y="803" text-anchor="middle" fill="#fff" font-size="16">已驗證資料分批回寫</text><text x="195" y="835" text-anchor="middle" fill="#c8d9f3" font-size="14">未解例外隔離・服務逐項放行</text></g></svg>