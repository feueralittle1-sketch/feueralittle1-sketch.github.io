<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">醫療 AI Agent 身分與授權信任鏈</title><desc id="desc">人員提出任務後，由代理身分、授權政策與工具閘道控制 AI Agent 對臨床系統的操作，並將證據寫入獨立稽核區。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#101537"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><text x="70" y="76" fill="#fff" font-size="34" font-weight="800">醫療 AI Agent 的可信操作鏈</text><text x="70" y="114" fill="#9fb3d9" font-size="20">每次行動同時保留人員、代理、權限、目的與結果</text><g font-family="Arial,'Noto Sans TC',sans-serif"><g fill="#102b42" stroke="#63e6ff" stroke-width="2"><rect x="70" y="210" width="210" height="150" rx="24"/><rect x="350" y="210" width="210" height="150" rx="24"/><rect x="630" y="210" width="210" height="150" rx="24"/><rect x="910" y="210" width="220" height="150" rx="24"/></g><g fill="#fff" font-size="25" font-weight="700" text-anchor="middle"><text x="175" y="265">任務發起者</text><text x="455" y="265">代理身分</text><text x="735" y="265">授權閘門</text><text x="1020" y="265">臨床工具</text></g><g fill="#b9c9e5" font-size="18" text-anchor="middle"><text x="175" y="305">具名人員／職務</text><text x="175" y="334">確認目的與責任</text><text x="455" y="305">唯一 ID／版本</text><text x="455" y="334">工作負載憑證</text><text x="735" y="305">範圍／時效／情境</text><text x="735" y="334">高風險需覆核</text><text x="1020" y="305">病歷／排程／通知</text><text x="1020" y="334">只開必要動作</text></g><g stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"><path d="M280 285H340"/><path d="M560 285H620"/><path d="M840 285H900"/></g><rect x="230" y="470" width="740" height="135" rx="28" fill="#171d46" stroke="#a997ff" stroke-width="2"/><text x="600" y="518" fill="#fff" font-size="26" font-weight="800" text-anchor="middle">獨立稽核與撤銷證據</text><text x="600" y="557" fill="#c9c2ff" font-size="19" text-anchor="middle">誰授權｜代理做了什麼｜使用哪些資料｜工具回應｜是否成功｜何時撤權</text><path d="M455 370V450M735 370V450M1020 370Q1020 430 970 470" fill="none" stroke="#a997ff" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/><circle cx="455" cy="285" r="8" fill="#63e6ff" filter="url(#glow)"/></g></svg>