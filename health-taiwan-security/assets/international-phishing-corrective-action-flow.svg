<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">醫療釣魚事件整改閉環流程</title>
<desc id="desc">依序完成事件定界、風險重估、控制設計、分階段部署、驗證、管理追蹤與持續複測，失敗則回到風險重估。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071626"/><stop offset="1" stop-color="#122047"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#63e6ff"/></marker></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><g font-family="Noto Sans TC, sans-serif"><text x="70" y="78" fill="#fff" font-size="38" font-weight="800">七階段整改閉環：驗證失敗就不能結案</text><text x="70" y="116" fill="#9fb3d9" font-size="20">先保全事實，再把控制、臨床影響與驗收條件綁在同一張追蹤表</text>
<g fill="#102d48" stroke="#63e6ff" stroke-width="2"><rect x="65" y="190" width="220" height="125" rx="24"/><rect x="330" y="190" width="220" height="125" rx="24"/><rect x="595" y="190" width="220" height="125" rx="24"/><rect x="860" y="190" width="270" height="125" rx="24"/></g>
<text x="95" y="228" fill="#63e6ff" font-size="19" font-weight="700">01 事件定界</text><text x="95" y="268" fill="#fff" font-size="20">帳號・權杖・資料</text><text x="95" y="297" fill="#c6d4eb" font-size="17">時間線與曝險範圍</text>
<text x="360" y="228" fill="#63e6ff" font-size="19" font-weight="700">02 風險重估</text><text x="360" y="268" fill="#fff" font-size="20">威脅・弱點・影響</text><text x="360" y="297" fill="#c6d4eb" font-size="17">更新資產與流程依賴</text>
<text x="625" y="228" fill="#63e6ff" font-size="19" font-weight="700">03 控制設計</text><text x="625" y="268" fill="#fff" font-size="20">身分・郵件・監測</text><text x="625" y="297" fill="#c6d4eb" font-size="17">定義覆蓋率與例外</text>
<text x="890" y="228" fill="#63e6ff" font-size="19" font-weight="700">04 分階段部署</text><text x="890" y="268" fill="#fff" font-size="20">高風險角色優先</text><text x="890" y="297" fill="#c6d4eb" font-size="17">保留臨床回退與支援</text>
<path d="M285 252H315" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M550 252H580" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M815 252H845" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/>
<g fill="#182c55" stroke="#a997ff" stroke-width="2"><rect x="105" y="425" width="270" height="135" rx="24"/><rect x="465" y="425" width="270" height="135" rx="24"/><rect x="825" y="425" width="270" height="135" rx="24"/></g>
<text x="135" y="465" fill="#d9d1ff" font-size="20" font-weight="700">07 持續複測</text><text x="135" y="505" fill="#fff" font-size="20">新攻擊手法・新系統</text><text x="135" y="535" fill="#c6d4eb" font-size="17">定期抽驗與趨勢追蹤</text>
<text x="495" y="465" fill="#d9d1ff" font-size="20" font-weight="700">06 管理追蹤</text><text x="495" y="505" fill="#fff" font-size="20">責任人・期限・例外</text><text x="495" y="535" fill="#c6d4eb" font-size="17">逾期與風險接受透明化</text>
<text x="855" y="465" fill="#d9d1ff" font-size="20" font-weight="700">05 驗證有效性</text><text x="855" y="505" fill="#fff" font-size="20">負向測試・日誌檢查</text><text x="855" y="535" fill="#c6d4eb" font-size="17">確認阻擋、偵測與撤銷</text>
<path d="M995 315V410" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M825 492H750" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M465 492H390" stroke="#63e6ff" stroke-width="4" marker-end="url(#a)"/><path d="M105 492H65V365H440V330" fill="none" stroke="#ff8fb8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="82" y="390" fill="#ffb1cc" font-size="17" font-weight="700">驗證失敗或風險改變：回到重估</text>
<rect x="280" y="620" width="640" height="54" rx="27" fill="#123b43" stroke="#57f0c1"/><text x="600" y="655" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">結案條件＝控制已部署＋證據可重現＋剩餘風險已核准</text></g></svg>
