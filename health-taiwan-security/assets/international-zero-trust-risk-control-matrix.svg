<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療零信任分段風險與控制矩陣</title><desc id="desc">對照平面網路、未知設備、規則過度封鎖、供應商維運及例外累積的控制方式與驗收證據。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#10234a"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/>
<g font-family="system-ui,Noto Sans TC"><text x="60" y="72" fill="#f8fafc" font-size="34" font-weight="700">風險、控制與證據必須成對</text><text x="60" y="110" fill="#9fb3d9" font-size="19">「已分 VLAN」不是成果；需證明攻擊路徑縮短且臨床流程可用</text>
<g font-size="19"><rect x="55" y="160" width="1090" height="62" rx="16" fill="#18304d"/><text x="85" y="200" fill="#a5f3fc" font-weight="700">風險情境</text><text x="400" y="200" fill="#a7f3d0" font-weight="700">控制方法</text><text x="805" y="200" fill="#ddd6fe" font-weight="700">驗收證據</text>
<g fill="#0d2238" stroke="#29445f"><rect x="55" y="235" width="1090" height="76" rx="14"/><rect x="55" y="323" width="1090" height="76" rx="14"/><rect x="55" y="411" width="1090" height="76" rx="14"/><rect x="55" y="499" width="1090" height="76" rx="14"/></g>
<g fill="#fecdd3"><text x="85" y="281">平面網路可橫向移動</text><text x="85" y="369">未知／老舊醫療設備</text><text x="85" y="457">規則封鎖必要臨床流量</text><text x="85" y="545">供應商與例外長期存在</text></g><g fill="#d1fae5"><text x="400" y="281">服務白名單＋微分段</text><text x="400" y="369">NAC 識別＋隔離區＋補償控制</text><text x="400" y="457">觀察模式＋變更窗口＋回復計畫</text><text x="400" y="545">具名限時存取＋跳板＋到期日</text></g><g fill="#e9d5ff"><text x="805" y="281">非必要東西向連線被阻擋</text><text x="805" y="369">未識別數下降、通訊範圍固定</text><text x="805" y="457">成功率、延遲與回復時間達標</text><text x="805" y="545">錄製可追查、逾期自動失效</text></g></g>
<rect x="200" y="615" width="800" height="48" rx="24" fill="#0d3340" stroke="#63e6ff"/><text x="600" y="647" text-anchor="middle" fill="#cffafe" font-size="18">控制成效＝限制不必要路徑＋維持必要臨床服務＋保留可稽核證據</text></g></svg>
