<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 980" role="img" aria-labelledby="title desc"><title id="title">停機資料對帳風險與控制手機版</title><desc id="desc">五類停機資料回寫風險及其控制和驗證證據。</desc><rect width="390" height="980" rx="24" fill="#07111f"/><text x="22" y="44" fill="#fff" font-size="22" font-weight="800">停機回寫風險與控制</text><text x="22" y="73" fill="#9fb3d9" font-size="14">不確定項目必須隔離，不可直接寫回</text><g font-family="system-ui,'Noto Sans TC',sans-serif"><g><rect x="20" y="102" width="350" height="148" rx="18" fill="#13243d"/><text x="38" y="136" fill="#ffb69b" font-size="17" font-weight="700">病人／就醫事件錯配</text><text x="38" y="171" fill="#fff" font-size="15">控制：雙因子識別與時間地點交叉核對</text><text x="38" y="205" fill="#9cc4ff" font-size="14">證據：覆核簽章、例外紀錄</text></g><g><rect x="20" y="267" width="350" height="148" rx="18" fill="#102b40"/><text x="38" y="301" fill="#ffb69b" font-size="17" font-weight="700">紙本醫囑漏輸或遺失</text><text x="38" y="336" fill="#fff" font-size="15">控制：連續編號、收件清冊、缺號追查</text><text x="38" y="370" fill="#9cc4ff" font-size="14">證據：缺號報表、單位結案</text></g><g><rect x="20" y="432" width="350" height="148" rx="18" fill="#13243d"/><text x="38" y="466" fill="#ffb69b" font-size="17" font-weight="700">已執行項目重複下單</text><text x="38" y="501" fill="#fff" font-size="15">控制：比對執行狀態、結果與設備暫存</text><text x="38" y="535" fill="#9cc4ff" font-size="14">證據：重複清單、取消理由</text></g><g><rect x="20" y="597" width="350" height="148" rx="18" fill="#102b40"/><text x="38" y="631" fill="#ffb69b" font-size="17" font-weight="700">時間戳或版本衝突</text><text x="38" y="666" fill="#fff" font-size="15">控制：拆分發生、記錄、輸入時間</text><text x="38" y="700" fill="#9cc4ff" font-size="14">證據：時間軸、臨床裁決紀錄</text></g><g><rect x="20" y="762" width="350" height="148" rx="18" fill="#13243d"/><text x="38" y="796" fill="#ffb69b" font-size="17" font-weight="700">批次回寫擴大錯誤</text><text x="38" y="831" fill="#fff" font-size="15">控制：小批次、門檻、停止與回退</text><text x="38" y="865" fill="#9cc4ff" font-size="14">證據：批次日誌、抽核與回退測試</text></g><text x="195" y="949" text-anchor="middle" fill="#57f0c1" font-size="14" font-weight="700">例外保持可見、可追蹤、有人負責關閉</text></g></svg>