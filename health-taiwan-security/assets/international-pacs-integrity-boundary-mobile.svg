<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">手機版醫療影像完整性治理邊界</title><desc id="desc">影像來源、PACS、企業影像庫、臨床使用與獨立證據面垂直排列。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#0e2442"/></linearGradient></defs><rect width="720" height="1080" rx="28" fill="url(#bg)"/><text x="42" y="66" fill="#f7fbff" font-size="30" font-weight="800">醫療影像完整性治理邊界</text><text x="42" y="104" fill="#9fb7d5" font-size="18">影像、身分、報告與刪除操作必須可追溯</text><g font-family="Arial, Noto Sans TC, sans-serif"><g><rect x="70" y="154" width="580" height="120" rx="22" fill="#102d4b" stroke="#63e6ff" stroke-width="2"/><text x="108" y="202" fill="#63e6ff" font-size="24" font-weight="700">1 影像來源</text><text x="108" y="242" fill="#e6eefc" font-size="19">CT／MRI／X 光 · 檢查號 · 病人身分</text></g><g><rect x="70" y="314" width="580" height="120" rx="22" fill="#102d4b" stroke="#9c8cff" stroke-width="2"/><text x="108" y="362" fill="#b8aaff" font-size="24" font-weight="700">2 PACS 工作流</text><text x="108" y="402" fill="#e6eefc" font-size="19">接收 · 路由 · 閱片 · 操作紀錄</text></g><g><rect x="70" y="474" width="580" height="120" rx="22" fill="#102d4b" stroke="#57f0c1" stroke-width="2"/><text x="108" y="522" fill="#72f5cd" font-size="24" font-weight="700">3 企業影像庫</text><text x="108" y="562" fill="#e6eefc" font-size="19">主副本 · 版本 · 保留與刪除政策</text></g><g><rect x="70" y="634" width="580" height="120" rx="22" fill="#102d4b" stroke="#ffbe6b" stroke-width="2"/><text x="108" y="682" fill="#ffd08a" font-size="24" font-weight="700">4 臨床使用</text><text x="108" y="722" fill="#e6eefc" font-size="19">閱片 · 報告 · 治療決策</text></g><g stroke="#7adfff" stroke-width="4"><path d="M360 274v40M360 434v40M360 594v40"/></g><rect x="70" y="814" width="580" height="200" rx="24" fill="#0a1c32" stroke="#32577d" stroke-width="2"/><text x="108" y="860" fill="#f7fbff" font-size="25" font-weight="800">獨立證據面</text><text x="108" y="904" fill="#dff8ff" font-size="19">• DICOM 稽核紀錄與數量比對</text><text x="108" y="944" fill="#ddfff4" font-size="19">• 不可變備份與隔離驗證</text><text x="108" y="984" fill="#fff0d8" font-size="19">• 高風險刪除雙重核准</text><path d="M360 754v60" stroke="#ff6f91" stroke-width="5" stroke-dasharray="9 8"/></g></svg>