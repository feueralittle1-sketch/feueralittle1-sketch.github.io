<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">醫療資安機器可讀證據鏈</title><desc id="desc">控制要求依序連結實作陳述、技術證據、評估結果、改善計畫與治理決策，形成可追溯閉環。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14254b"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f4f8ff" font-size="34" font-weight="800">把控制要求串成可追溯證據鏈</text><text x="600" y="98" text-anchor="middle" fill="#9fb3d9" font-size="19">相同控制識別碼貫穿規劃、實作、評估與改善</text>
<g font-size="20" text-anchor="middle" font-weight="700"><rect x="45" y="170" width="190" height="170" rx="25" fill="#10213d" stroke="#63e6ff" stroke-width="3"/><text x="140" y="218" fill="#63e6ff">控制要求</text><text x="140" y="260" fill="#d8e6fb" font-size="17" font-weight="400">目標、範圍</text><text x="140" y="292" fill="#d8e6fb" font-size="17" font-weight="400">責任與參數</text>
<rect x="275" y="170" width="190" height="170" rx="25" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="370" y="218" fill="#c5baff">實作陳述</text><text x="370" y="260" fill="#e8e3ff" font-size="17" font-weight="400">系統、流程</text><text x="370" y="292" fill="#e8e3ff" font-size="17" font-weight="400">角色與例外</text>
<rect x="505" y="170" width="190" height="170" rx="25" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="600" y="218" fill="#57f0c1">技術證據</text><text x="600" y="260" fill="#d9fff3" font-size="17" font-weight="400">組態、日誌</text><text x="600" y="292" fill="#d9fff3" font-size="17" font-weight="400">測試與工單</text>
<rect x="735" y="170" width="190" height="170" rx="25" fill="#31263d" stroke="#ffb86b" stroke-width="3"/><text x="830" y="218" fill="#ffcf99">評估結果</text><text x="830" y="260" fill="#fff0dd" font-size="17" font-weight="400">通過、缺口</text><text x="830" y="292" fill="#fff0dd" font-size="17" font-weight="400">影響與信心</text>
<rect x="965" y="170" width="190" height="170" rx="25" fill="#2d2134" stroke="#ff7aa8" stroke-width="3"/><text x="1060" y="218" fill="#ff9fbe">改善計畫</text><text x="1060" y="260" fill="#ffe1eb" font-size="17" font-weight="400">主責、期限</text><text x="1060" y="292" fill="#ffe1eb" font-size="17" font-weight="400">驗證與關閉</text></g>
<g stroke="#63e6ff" stroke-width="7" marker-end="url(#a)"><path d="M238 255H268"/><path d="M468 255H498"/><path d="M698 255H728"/><path d="M928 255H958"/></g>
<rect x="205" y="420" width="790" height="135" rx="30" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="600" y="465" text-anchor="middle" fill="#a8c8ff" font-size="25" font-weight="800">治理決策與臨床風險判定</text><g fill="#d8e6fb" font-size="19" text-anchor="middle"><text x="390" y="512">接受剩餘風險</text><text x="600" y="512">調整控制與優先序</text><text x="810" y="512">限制服務或啟動降級</text></g><path d="M1060 345C1060 390 940 390 940 420" fill="none" stroke="#ff7aa8" stroke-width="5"/><path d="M260 420C260 380 140 380 140 345" fill="none" stroke="#57f0c1" stroke-width="5" stroke-dasharray="11 9"/><text x="600" y="622" text-anchor="middle" fill="#ffcf99" font-size="21">自動化負責收集與比對；適用範圍、例外與臨床後果仍由權責角色確認</text></g></svg>
