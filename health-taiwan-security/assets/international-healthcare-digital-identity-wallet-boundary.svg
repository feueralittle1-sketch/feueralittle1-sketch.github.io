<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">病人數位身分錢包接入醫療服務的信任邊界</title><desc id="desc">憑證發行者、病人錢包、醫院驗證閘門、病人入口與獨立稽核證據之間的關係。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172650"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><g font-family="Arial,'Noto Sans TC',sans-serif"><text x="600" y="58" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">數位憑證不是醫療帳號本身</text><text x="600" y="94" text-anchor="middle" fill="#9fb3d9" font-size="19">先驗證憑證，再以院內規則完成病人配對、綁定與存取決策</text>
<g text-anchor="middle"><rect x="55" y="175" width="230" height="135" rx="24" fill="#102d35" stroke="#57f0c1" stroke-width="3"/><text x="170" y="220" fill="#57f0c1" font-size="24" font-weight="800">可信發行者</text><text x="170" y="258" fill="#d9fff3" font-size="17">簽發可驗證身分憑證</text><text x="170" y="286" fill="#d9fff3" font-size="17">維護狀態與撤銷資訊</text><rect x="55" y="375" width="230" height="135" rx="24" fill="#172b4d" stroke="#a997ff" stroke-width="3"/><text x="170" y="420" fill="#c5baff" font-size="24" font-weight="800">病人錢包</text><text x="170" y="458" fill="#ece8ff" font-size="17">同意出示必要欄位</text><text x="170" y="486" fill="#ece8ff" font-size="17">裝置與使用者解鎖</text></g>
<path d="M295 240H390M295 442H390" stroke="#63e6ff" stroke-width="6" marker-end="url(#a)"/>
<rect x="405" y="145" width="365" height="395" rx="30" fill="#0f223e" stroke="#71a7ff" stroke-width="3"/><text x="587" y="192" text-anchor="middle" fill="#a8c8ff" font-size="26" font-weight="800">醫院驗證與綁定閘門</text><g fill="#e6eefc" font-size="20"><text x="452" y="250">01　檢查簽章、發行者與有效期</text><text x="452" y="305">02　確認憑證狀態與防重播</text><text x="452" y="360">03　只取完成目的所需欄位</text><text x="452" y="415">04　與院內病人主索引配對</text><text x="452" y="470">05　記錄同意、綁定與例外</text></g>
<path d="M780 342H875" stroke="#63e6ff" stroke-width="7" marker-end="url(#a)"/>
<g text-anchor="middle"><rect x="890" y="165" width="255" height="150" rx="25" fill="#2b2340" stroke="#ffb86b" stroke-width="3"/><text x="1017" y="213" fill="#ffcf99" font-size="24" font-weight="800">病人數位入口</text><text x="1017" y="252" fill="#fff0dd" font-size="17">掛號、查詢、下載</text><text x="1017" y="282" fill="#fff0dd" font-size="17">仍由院內授權決定</text><rect x="890" y="375" width="255" height="150" rx="25" fill="#153044" stroke="#63e6ff" stroke-width="3"/><text x="1017" y="423" fill="#8fe8ff" font-size="24" font-weight="800">獨立證據面</text><text x="1017" y="462" fill="#d8f7ff" font-size="17">驗證結果與綁定紀錄</text><text x="1017" y="492" fill="#d8f7ff" font-size="17">撤銷、復原與異常事件</text></g><text x="600" y="620" text-anchor="middle" fill="#57f0c1" font-size="21">錢包證明「出示了什麼」；醫院仍須證明「配對給誰、允許做什麼、如何撤回」</text></g></svg>
