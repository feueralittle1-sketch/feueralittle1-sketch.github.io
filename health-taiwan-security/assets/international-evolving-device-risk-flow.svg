<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">醫療設備技術變更風險分析閉環</title>
<desc id="desc">從技術變更觸發、建立使用情境、分析危害與威脅、配置控制、臨床驗收，到上市後監測與重新分析的六階段流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061521"/><stop offset="1" stop-color="#111633"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#63e6ff"/></marker></defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="60" y="70" fill="#fff" font-size="32" font-weight="700">六階段風險分析閉環</text><text x="60" y="108" fill="#9db7d7" font-size="20">變更不是填表事件；每一輪都要回到實際臨床情境與可重現證據。</text>
<g font-family="sans-serif" text-anchor="middle"><g fill="#102f45" stroke="#4edcf6" stroke-width="2"><rect x="55" y="180" width="250" height="135" rx="24"/><rect x="475" y="180" width="250" height="135" rx="24"/><rect x="895" y="180" width="250" height="135" rx="24"/></g><g fill="#2b2554" stroke="#ad9aff" stroke-width="2"><rect x="895" y="430" width="250" height="135" rx="24"/><rect x="475" y="430" width="250" height="135" rx="24"/><rect x="55" y="430" width="250" height="135" rx="24"/></g>
<g fill="#fff" font-size="22" font-weight="700"><text x="180" y="220">1 技術變更觸發</text><text x="600" y="220">2 建立使用情境</text><text x="1020" y="220">3 危害與威脅分析</text><text x="1020" y="470">4 配置分層控制</text><text x="600" y="470">5 臨床與資安驗收</text><text x="180" y="470">6 監測與重新分析</text></g>
<g fill="#c8d8ea" font-size="17"><text x="180" y="255">雲端、AI、PQC、介接</text><text x="180" y="282">供應商或標準改變</text><text x="600" y="255">預定用途、資料流、角色</text><text x="600" y="282">離線模式與失效後果</text><text x="1020" y="255">可用性、完整性、保密性</text><text x="1020" y="282">病人傷害與攻擊路徑</text><text x="1020" y="505">產品、網路、身分、流程</text><text x="1020" y="532">補償控制與回退條件</text><text x="600" y="505">負向測試、相容測試</text><text x="600" y="532">降級演練與責任簽核</text><text x="180" y="505">事件、模型漂移、CVE</text><text x="180" y="532">密碼標準與依賴變更</text></g></g>
<g fill="none" stroke="#63e6ff" stroke-width="5" marker-end="url(#a)"><path d="M305 247 H460"/><path d="M725 247 H880"/><path d="M1020 315 V415"/><path d="M895 497 H740"/><path d="M475 497 H320"/><path d="M180 430 V350 H180 V330"/></g><rect x="420" y="335" width="360" height="62" rx="31" fill="#133b43" stroke="#61efc1"/><text x="600" y="374" text-anchor="middle" fill="#87f5d2" font-size="21" font-weight="700">輸出：可追溯的風險、控制、證據與重驗日期</text><text x="600" y="635" text-anchor="middle" fill="#a9bdd7" font-size="19">無法重現、無法回退或無法指定責任的控制，不應視為完成驗收。</text></svg>