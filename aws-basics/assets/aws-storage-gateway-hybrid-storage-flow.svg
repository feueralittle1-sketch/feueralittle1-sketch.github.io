<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Storage Gateway 混合式儲存安全流程示意圖</title>
  <desc id="desc">自建應用先經身分、資料與復原需求盤點，再透過隔離網段中的 File、Volume 或 Tape Gateway，以本機快取與加密通道連接 AWS 儲存，並由 KMS、CloudTrail、CloudWatch、備份與跨區復原治理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#7de3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7de3ff"/></marker>
    <style>.h{font:700 31px system-ui,"Noto Sans TC",sans-serif;fill:#fff}.t{font:700 22px system-ui,"Noto Sans TC",sans-serif;fill:#fff}.s{font:500 17px system-ui,"Noto Sans TC",sans-serif;fill:#bfd0e9}.n{font:800 17px system-ui,"Noto Sans TC",sans-serif;fill:#071426}.box{fill:#102744;stroke:#375a7d;stroke-width:2}.risk{fill:#2d1c2b;stroke:#fb7185;stroke-width:2}.ctrl{fill:#102f2d;stroke:#54d6b0;stroke-width:2}.line{fill:none;stroke:#7de3ff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="70" y="72" class="h">示意：AWS Storage Gateway 混合式儲存與治理流程</text>
  <text x="70" y="108" class="s">先界定協定、延遲、資料權威與復原目標，再選擇 File、Volume 或 Tape Gateway；閘道不是自動完成的備份或災難復原。</text>

  <g filter="url(#shadow)"><rect x="70" y="165" width="270" height="250" rx="24" class="box"/><rect x="585" y="165" width="270" height="250" rx="24" class="box"/><rect x="1100" y="165" width="270" height="250" rx="24" class="box"/></g>
  <rect x="92" y="187" width="72" height="32" rx="16" fill="#ff9900"/><text x="128" y="210" text-anchor="middle" class="n">01</text>
  <text x="100" y="260" class="t">自建環境</text><text x="100" y="300" class="s">• 檔案：NFS／SMB</text><text x="100" y="334" class="s">• 區塊：iSCSI</text><text x="100" y="368" class="s">• 備份：VTL</text><text x="100" y="402" class="s">盤點延遲、容量與 RPO</text>

  <rect x="607" y="187" width="72" height="32" rx="16" fill="#ff9900"/><text x="643" y="210" text-anchor="middle" class="n">02</text>
  <text x="615" y="255" class="t">隔離的 Gateway</text><text x="615" y="294" class="s">File／Volume／Tape</text><text x="615" y="328" class="s">本機快取與上傳緩衝</text><text x="615" y="362" class="s">最小權限服務角色</text><text x="615" y="396" class="s">受控 DNS、路由與端點</text>

  <rect x="1122" y="187" width="72" height="32" rx="16" fill="#ff9900"/><text x="1158" y="210" text-anchor="middle" class="n">03</text>
  <text x="1130" y="255" class="t">AWS 儲存層</text><text x="1130" y="294" class="s">S3／EBS 快照／S3 Glacier</text><text x="1130" y="328" class="s">KMS 加密與存取政策</text><text x="1130" y="362" class="s">生命週期與保留策略</text><text x="1130" y="396" class="s">備份、還原與跨區副本</text>

  <path d="M340 290H575" class="line"/><text x="458" y="270" text-anchor="middle" class="s">區域網路協定</text>
  <path d="M855 290H1090" class="line"/><text x="972" y="270" text-anchor="middle" class="s">TLS／私有連線</text>

  <g filter="url(#shadow)"><rect x="70" y="495" width="390" height="295" rx="24" class="risk"/><rect x="525" y="495" width="390" height="295" rx="24" class="ctrl"/><rect x="980" y="495" width="390" height="295" rx="24" class="box"/></g>
  <text x="100" y="545" class="t">特有風險</text><text x="100" y="590" class="s">• 快取磁碟遺失或未加密</text><text x="100" y="626" class="s">• 上傳緩衝不足導致回壓</text><text x="100" y="662" class="s">• NFS／SMB 分享範圍過大</text><text x="100" y="698" class="s">• 帶寬或 WAN 中斷造成積壓</text><text x="100" y="734" class="s">• 把快取誤當正式備份</text><text x="100" y="770" class="s">• 閘道管理面暴露</text>
  <text x="555" y="545" class="t">控制與監看</text><text x="555" y="590" class="s">• MFA、短期憑證、最小權限</text><text x="555" y="626" class="s">• 私有網段、端點與防火牆白名單</text><text x="555" y="662" class="s">• KMS、磁碟加密、Secrets 管理</text><text x="555" y="698" class="s">• CloudTrail、CloudWatch 與告警</text><text x="555" y="734" class="s">• 容量、快取命中與上傳佇列監控</text><text x="555" y="770" class="s">• 變更核准與定期修補</text>
  <text x="1010" y="545" class="t">驗收與復原</text><text x="1010" y="590" class="s">• 代表性讀寫與效能測試</text><text x="1010" y="626" class="s">• 斷線、重啟與重連測試</text><text x="1010" y="662" class="s">• 版本、快照與保留驗證</text><text x="1010" y="698" class="s">• 還原到隔離環境演練</text><text x="1010" y="734" class="s">• 跨區／跨帳號復原路徑</text><text x="1010" y="770" class="s">• RTO／RPO 與業務結果對帳</text>
  <rect x="70" y="835" width="1300" height="8" rx="4" fill="url(#accent)"/>
</svg>
