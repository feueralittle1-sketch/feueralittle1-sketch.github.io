<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Amazon ECS Express Mode 安全 Web 應用部署流程</title>
<desc id="desc">核准容器映像由 Express Mode 協調 ECS、Fargate、HTTPS 負載平衡、自動擴縮和 Canary 部署，應用以最小權限存取機密與資料，並由監控稽核及跨區重建提供治理。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a18"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fe8ff"/><stop offset="1" stop-color="#35a8ff"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fe8ff"/></marker>
 <style>.h{font:700 27px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:600 19px Inter,'Noto Sans TC',sans-serif;fill:#eaf4ff}.s{font:400 15px Inter,'Noto Sans TC',sans-serif;fill:#b8cae5}.box{fill:#10233e;stroke:#375a7d;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffb45e;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrow)}</style>
</defs>
<rect width="1440" height="900" rx="32" fill="url(#bg)"/>
<text x="720" y="58" text-anchor="middle" class="h">示意｜Amazon ECS Express Mode 安全部署流程</text>
<text x="720" y="88" text-anchor="middle" class="s">簡化多服務整合，不代表映像、角色、網路、資料與復原可省略治理</text>
<g filter="url(#shadow)">
 <rect x="45" y="190" width="225" height="190" rx="22" class="box"/><text x="157" y="232" text-anchor="middle" class="t">可信容器映像</text><text x="157" y="270" text-anchor="middle" class="s">CI checks → Amazon ECR</text><text x="157" y="301" text-anchor="middle" class="s">掃描・SBOM・簽章／核准</text><rect x="82" y="326" width="150" height="34" rx="17" fill="#183653"/><text x="157" y="349" text-anchor="middle" class="s">image digest</text>
 <rect x="45" y="460" width="225" height="150" rx="22" class="box"/><circle cx="157" cy="500" r="22" fill="url(#cyan)"/><text x="157" y="548" text-anchor="middle" class="t">使用者／API</text><text x="157" y="579" text-anchor="middle" class="s">HTTPS request</text>
 <rect x="330" y="150" width="780" height="510" rx="28" fill="#0c1c32" stroke="#ff9f32" stroke-width="3"/><text x="720" y="194" text-anchor="middle" class="t">Express Mode 協調的區域內應用堆疊</text>
 <rect x="370" y="230" width="210" height="175" rx="22" class="box"/><text x="475" y="269" text-anchor="middle" class="t">受控 HTTPS 入口</text><text x="475" y="306" text-anchor="middle" class="s">AWS domain + ACM</text><text x="475" y="337" text-anchor="middle" class="s">ALB + health checks</text><text x="475" y="368" text-anchor="middle" class="s">public 或 private</text>
 <rect x="630" y="230" width="440" height="250" rx="22" class="box"/><text x="850" y="269" text-anchor="middle" class="t">Amazon ECS Service on AWS Fargate</text><rect x="665" y="310" width="165" height="105" rx="18" fill="url(#orange)"/><text x="747" y="348" text-anchor="middle" class="t" fill="#071426">可用區 A</text><text x="747" y="380" text-anchor="middle" class="s" fill="#13233a">Fargate Task</text><rect x="870" y="310" width="165" height="105" rx="18" fill="url(#orange)"/><text x="952" y="348" text-anchor="middle" class="t" fill="#071426">可用區 B</text><text x="952" y="380" text-anchor="middle" class="s" fill="#13233a">Fargate Task</text><text x="850" y="449" text-anchor="middle" class="s">Security Group・Task Role・短期憑證</text>
 <rect x="370" y="500" width="320" height="120" rx="22" class="box"/><text x="530" y="540" text-anchor="middle" class="t">Auto Scaling + Canary</text><text x="530" y="576" text-anchor="middle" class="s">少量流量 → 告警判斷 → 全量／回滾</text><text x="530" y="602" text-anchor="middle" class="s">健康檢查・容量上下限</text>
 <rect x="730" y="500" width="340" height="120" rx="22" class="box"/><text x="900" y="540" text-anchor="middle" class="t">監控與稽核</text><text x="900" y="576" text-anchor="middle" class="s">CloudWatch・CloudTrail・ALB logs</text><text x="900" y="602" text-anchor="middle" class="s">VPC Flow Logs・應用 metrics／traces</text>
 <rect x="1160" y="210" width="235" height="210" rx="22" class="box"/><text x="1277" y="252" text-anchor="middle" class="t">IAM 角色分離</text><text x="1277" y="290" text-anchor="middle" class="s">Infrastructure role</text><text x="1277" y="322" text-anchor="middle" class="s">Task execution role</text><text x="1277" y="354" text-anchor="middle" class="s">Application task role</text><text x="1277" y="386" text-anchor="middle" class="s">最小權限・MFA</text>
 <rect x="1160" y="465" width="235" height="195" rx="22" class="box"/><text x="1277" y="507" text-anchor="middle" class="t">機密與資料</text><text x="1277" y="545" text-anchor="middle" class="s">Secrets Manager／Parameter Store</text><text x="1277" y="577" text-anchor="middle" class="s">KMS・RDS／DynamoDB／S3</text><text x="1277" y="609" text-anchor="middle" class="s">備份・PITR・跨區複寫</text>
 <rect x="160" y="720" width="470" height="120" rx="22" class="box"/><text x="395" y="763" text-anchor="middle" class="t">網路與公開面治理</text><text x="395" y="798" text-anchor="middle" class="s">Private subnets・受控出站・VPC endpoints・WAF</text><text x="395" y="824" text-anchor="middle" class="s">檢查 ALB scheme、額外 security group 與共用路由</text>
 <rect x="790" y="720" width="490" height="120" rx="22" class="box"/><text x="1035" y="763" text-anchor="middle" class="t">可用性與跨區重建</text><text x="1035" y="798" text-anchor="middle" class="s">多副本・跨可用區・負載與故障測試</text><text x="1035" y="824" text-anchor="middle" class="s">第二區域：IaC + ECR + IAM + Secrets + Data + DNS</text>
</g>
<path d="M270 285H625" class="dash"/><path d="M270 535H365" class="line"/><path d="M580 318H625" class="line"/><path d="M850 480V497" class="line"/><path d="M1110 315H1155" class="dash"/><path d="M1070 560H1155" class="line"/><path d="M720 660V700" class="line"/><path d="M530 620C520 670 470 690 430 715" class="dash"/><path d="M900 620C920 675 970 690 1000 715" class="dash"/>
<text x="720" y="875" text-anchor="middle" class="s">原創流程圖｜Dr. William AWS 基礎介紹｜2026-10-12</text>
</svg>
