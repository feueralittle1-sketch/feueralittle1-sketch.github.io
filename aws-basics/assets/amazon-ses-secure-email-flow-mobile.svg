<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc">
<title id="title">Amazon SES 安全寄信行動版流程</title><desc id="desc">應用以短期憑證提交郵件，經寄件身分、DKIM、SPF、DMARC、Amazon SES 與收件系統，再以退信投訴事件、監控和第二區域計畫形成治理閉環。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="ses" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18c"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#77e6ff"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#fff}.s{font:700 23px system-ui,sans-serif;fill:#fff}.t{font:500 18px system-ui,sans-serif;fill:#c4d7f1}.k{font:800 23px system-ui,sans-serif;fill:#071426}.b{fill:#122b4d;stroke:#355d83;stroke-width:2}.g{fill:#10243e;stroke:#68def4;stroke-width:2}.f{fill:none;stroke:#77e6ff;stroke-width:5;marker-end:url(#a)}</style></defs>
<rect width="760" height="1320" rx="34" fill="url(#bg)"/><text x="42" y="58" class="h">Amazon SES 安全寄信流程</text><text x="42" y="88" class="t">示意架構｜寄件信任與回饋治理</text>
<rect x="42" y="125" width="676" height="150" rx="24" class="b"/><text x="72" y="170" class="s">1. 應用與寄件工作</text><text x="72" y="209" class="t">交易信・通知・行銷信分流</text><text x="72" y="243" class="t">IAM Role・短期憑證・Queue 限速與去重</text><path d="M380 275V315" class="f"/>
<rect x="42" y="320" width="676" height="205" rx="24" class="g"/><text x="72" y="365" class="s">2. 寄件前信任邊界</text><text x="72" y="405" class="t">驗證網域 / 身分・DKIM・SPF・自訂 MAIL FROM</text><text x="72" y="440" class="t">DMARC alignment・Configuration set</text><text x="72" y="475" class="t">Sending authorization・抑制清單・TLS 政策</text><text x="72" y="505" class="t">IAM 最小權限・設定變更須稽核</text><path d="M380 525V565" class="f"/>
<rect x="42" y="570" width="676" height="230" rx="28" fill="#18243c" stroke="#ffb34a" stroke-width="3"/><rect x="72" y="600" width="616" height="62" rx="18" fill="url(#ses)"/><text x="294" y="641" class="k">Amazon SES</text><text x="72" y="705" class="s">API 或 SMTP 提交</text><text x="72" y="744" class="t">沙盒 / Production access・配額・傳送速率</text><text x="72" y="778" class="t">TLS 傳輸・內容掃描・ISP / 收件端投遞</text><path d="M380 800V840" class="f"/>
<rect x="42" y="845" width="676" height="145" rx="24" class="b"/><text x="72" y="890" class="s">3. 收件驗證與結果</text><text x="72" y="930" class="t">DKIM・SPF・DMARC → Inbox / Spam</text><text x="72" y="964" class="t">退信 / 投訴 / 投遞 / 開啟與點擊事件</text>
<rect x="42" y="1030" width="322" height="230" rx="24" class="g"/><text x="70" y="1074" class="s">回饋與稽核</text><text x="70" y="1113" class="t">抑制與取消訂閱</text><text x="70" y="1146" class="t">CloudWatch 告警</text><text x="70" y="1179" class="t">CloudTrail 變更證據</text><text x="70" y="1212" class="t">Runbook・停止寄送</text>
<rect x="396" y="1030" width="322" height="230" rx="24" class="g"/><text x="424" y="1074" class="s">區域復原</text><text x="424" y="1113" class="t">第二區域身分 / DKIM</text><text x="424" y="1146" class="t">政策 / 配額 / 事件管線</text><text x="424" y="1179" class="t">端點切換與去重</text><text x="424" y="1212" class="t">RTO / 重複寄信演練</text>
<text x="42" y="1292" class="t">治理重點：送達率、濫用防護、名單品質與可停止的寄件流程</text>
</svg>