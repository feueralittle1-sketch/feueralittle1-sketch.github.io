<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560" role="img" aria-labelledby="title desc">
  <title id="title">Amazon OpenSearch Service 多租戶安全搜尋手機示意圖</title>
  <desc id="desc">垂直呈現權威資料經受控攝取管線進入私有跨可用區 OpenSearch 網域，以及使用者經搜尋 API 完成身分、租戶與查詢限制後取得結果；周邊配置 IAM、MFA、TLS、KMS、監控、稽核、快照與跨區復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 23px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 18px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 16px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1560" rx="32" fill="url(#bg)"/>
  <text x="44" y="56" class="k">原創架構圖 · 示意</text><text x="44" y="96" class="t">OpenSearch 受控搜尋流程</text>
  <g filter="url(#shadow)">
    <rect x="80" y="135" width="560" height="105" rx="22" class="box"/><text x="360" y="177" text-anchor="middle" class="t">1. Aurora／S3 權威資料</text><text x="360" y="211" text-anchor="middle" class="s">商品資料與可重建的原始事件</text>
    <path d="M360 240V275" class="line"/>
    <rect x="80" y="285" width="560" height="140" rx="22" class="step"/><text x="360" y="327" text-anchor="middle" class="t">2. 受控攝取管線</text><text x="360" y="362" text-anchor="middle" class="s">Schema、租戶標記、敏感欄位遮罩</text><text x="360" y="394" text-anchor="middle" class="s">背壓、有限重試、失敗佇列</text>
    <path d="M360 425V460" class="line"/>
    <rect x="65" y="470" width="590" height="245" rx="28" fill="#091a31" stroke="#ffad3d" stroke-width="3"/>
    <text x="105" y="512" class="k">PRIVATE OPENSEARCH DOMAIN · 3 AZ</text>
    <rect x="100" y="545" width="150" height="100" rx="18" class="box"/><text x="175" y="585" text-anchor="middle" class="t">AZ-A</text><text x="175" y="617" text-anchor="middle" class="s">Primary</text>
    <rect x="285" y="545" width="150" height="100" rx="18" class="box"/><text x="360" y="585" text-anchor="middle" class="t">AZ-B</text><text x="360" y="617" text-anchor="middle" class="s">Replica</text>
    <rect x="470" y="545" width="150" height="100" rx="18" class="box"/><text x="545" y="585" text-anchor="middle" class="t">AZ-C</text><text x="545" y="617" text-anchor="middle" class="s">Replica</text>
    <text x="360" y="682" text-anchor="middle" class="s">TLS・KMS・FGAC・索引生命週期</text>
    <path d="M360 715V750" class="line"/>
    <rect x="80" y="760" width="560" height="105" rx="22" class="box"/><text x="360" y="802" text-anchor="middle" class="t">3. 使用者搜尋請求</text><text x="360" y="836" text-anchor="middle" class="s">身分、租戶與查詢內容</text>
    <path d="M360 865V900" class="line"/>
    <rect x="80" y="910" width="560" height="150" rx="22" class="step"/><text x="360" y="952" text-anchor="middle" class="t">4. 搜尋 API 授權與保護</text><text x="360" y="987" text-anchor="middle" class="s">租戶過濾、查詢模板、欄位白名單</text><text x="360" y="1019" text-anchor="middle" class="s">逾時、限流、分頁與結果上限</text>
    <path d="M360 1060V1095" class="line"/>
    <rect x="80" y="1105" width="560" height="120" rx="22" class="box"/><text x="360" y="1147" text-anchor="middle" class="t">5. 細粒度索引與文件權限</text><text x="360" y="1182" text-anchor="middle" class="s">服務角色查詢 → 受控結果回應</text>
  </g>
  <g>
    <rect x="55" y="1270" width="295" height="105" rx="18" class="guard"/><text x="78" y="1308" class="k">身分與網路</text><text x="78" y="1342" class="s">VPC、IAM、MFA、短期憑證</text>
    <rect x="370" y="1270" width="295" height="105" rx="18" class="guard"/><text x="393" y="1308" class="k">資料與金鑰</text><text x="393" y="1342" class="s">TLS、KMS、遮罩、刪除</text>
    <rect x="55" y="1395" width="295" height="105" rx="18" class="guard"/><text x="78" y="1433" class="k">觀測與稽核</text><text x="78" y="1467" class="s">CloudWatch／CloudTrail</text>
    <rect x="370" y="1395" width="295" height="105" rx="18" class="guard"/><text x="393" y="1433" class="k">備份與復原</text><text x="393" y="1467" class="s">快照、S3、IaC、跨區演練</text>
  </g>
  <text x="360" y="1535" text-anchor="middle" class="s">終端使用者不得直接連線搜尋端點。</text>
</svg>
