<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">AWS 服務家族需求地圖</title><desc id="desc">以十個需求家族整理常見 AWS 服務及其代表產品。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102348"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="780" rx="42" fill="url(#bg)"/><text x="70" y="78" fill="#f5f8ff" font-size="42" font-weight="800" font-family="sans-serif">先看需求，再選 AWS 服務</text><text x="70" y="118" fill="#9fb3d9" font-size="22" font-family="sans-serif">產品數量會持續變動；服務家族能建立較穩定的判斷框架</text><g font-family="sans-serif"><g transform="translate(70 165)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#63e6ff"/><text x="28" y="38" fill="#63e6ff" font-size="24" font-weight="700">01 運算 Compute</text><text x="28" y="72" fill="#e6eefc" font-size="21">EC2 · Lambda · ECS · EKS</text></g><g transform="translate(630 165)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#71a7ff"/><text x="28" y="38" fill="#71a7ff" font-size="24" font-weight="700">02 儲存 Storage</text><text x="28" y="72" fill="#e6eefc" font-size="21">S3 · EBS · EFS · Glacier</text></g><g transform="translate(70 285)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#9c8cff"/><text x="28" y="38" fill="#b9aaff" font-size="24" font-weight="700">03 資料庫 Database</text><text x="28" y="72" fill="#e6eefc" font-size="21">RDS · Aurora · DynamoDB · ElastiCache</text></g><g transform="translate(630 285)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#57f0c1"/><text x="28" y="38" fill="#57f0c1" font-size="24" font-weight="700">04 網路與內容傳遞</text><text x="28" y="72" fill="#e6eefc" font-size="21">VPC · ELB · Route 53 · CloudFront</text></g><g transform="translate(70 405)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#ff9bcf"/><text x="28" y="38" fill="#ff9bcf" font-size="24" font-weight="700">05 身分與資安</text><text x="28" y="72" fill="#e6eefc" font-size="21">IAM · KMS · WAF · GuardDuty · Security Hub</text></g><g transform="translate(630 405)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#f7c76d"/><text x="28" y="38" fill="#f7c76d" font-size="24" font-weight="700">06 管理與治理</text><text x="28" y="72" fill="#e6eefc" font-size="21">CloudWatch · CloudTrail · Config · Organizations</text></g><g transform="translate(70 525)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#63e6ff"/><text x="28" y="38" fill="#63e6ff" font-size="24" font-weight="700">07 資料分析與 AI</text><text x="28" y="72" fill="#e6eefc" font-size="21">Bedrock · SageMaker AI · Athena · Glue · Redshift</text></g><g transform="translate(630 525)"><rect width="500" height="100" rx="22" fill="#122b49" stroke="#71a7ff"/><text x="28" y="38" fill="#71a7ff" font-size="24" font-weight="700">08 應用整合與開發</text><text x="28" y="72" fill="#e6eefc" font-size="21">API Gateway · SQS · SNS · EventBridge · CodeBuild</text></g><g transform="translate(70 645)"><rect width="500" height="80" rx="22" fill="#122b49" stroke="#9c8cff"/><text x="28" y="34" fill="#b9aaff" font-size="23" font-weight="700">09 遷移與混合雲</text><text x="28" y="63" fill="#e6eefc" font-size="19">DMS · DataSync · Storage Gateway · Outposts</text></g><g transform="translate(630 645)"><rect width="500" height="80" rx="22" fill="#122b49" stroke="#57f0c1"/><text x="28" y="34" fill="#57f0c1" font-size="23" font-weight="700">10 終端、商務與 IoT</text><text x="28" y="63" fill="#e6eefc" font-size="19">WorkSpaces · Connect · SES · IoT Core</text></g></g></svg>