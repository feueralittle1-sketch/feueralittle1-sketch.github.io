<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">AWS Payment Cryptography 支付交易與跨區治理示意圖</title>
  <desc id="desc">收單端的加密 PIN 請求經私有支付 API、IAM 授權與 VPC 端點進入 AWS Payment Cryptography，使用用途受限金鑰完成轉換後送至發卡端，並由稽核監控與跨區金鑰複寫支援治理與復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffca7a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24d6ff"/><stop offset="1" stop-color="#86f7d4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8fe8ff"/></marker>
    <style>.box{fill:#10243f;stroke:#31577d;stroke-width:2}.label{font:700 26px 'Noto Sans TC',sans-serif;fill:#fff}.small{font:500 19px 'Noto Sans TC',sans-serif;fill:#bcd0eb}.tiny{font:600 17px 'Noto Sans TC',sans-serif;fill:#ffcf91}.flow{fill:none;stroke:#8fe8ff;stroke-width:5;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffb347;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="860" rx="32" fill="url(#bg)"/>
  <text x="72" y="72" class="label" font-size="34">支付密碼運算：交易、金鑰與跨區復原分層治理</text>
  <text x="72" y="108" class="small">示意架構｜真實部署須依支付流程、區域、PCI 範圍與合作夥伴能力調整</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="240" height="160" rx="24" class="box"/>
    <circle cx="132" cy="262" r="28" fill="url(#orange)"/>
    <path d="M119 262h26M132 249v26" stroke="#071426" stroke-width="6" stroke-linecap="round"/>
    <text x="178" y="260" class="label">收單端</text>
    <text x="102" y="316" class="small">加密 PIN 區塊</text>
    <text x="102" y="344" class="small">交易識別與格式</text>

    <rect x="390" y="170" width="300" height="230" rx="24" class="box"/>
    <text x="430" y="220" class="label">私有支付 API</text>
    <rect x="430" y="246" width="220" height="42" rx="12" fill="#18385c"/><text x="451" y="274" class="small">IAM 最小權限</text>
    <rect x="430" y="302" width="220" height="42" rx="12" fill="#18385c"/><text x="451" y="330" class="small">冪等與交易授權</text>
    <text x="430" y="373" class="tiny">Private Subnet</text>

    <rect x="780" y="150" width="390" height="270" rx="28" fill="#152a43" stroke="url(#orange)" stroke-width="4"/>
    <text x="825" y="207" class="label">AWS Payment Cryptography</text>
    <rect x="825" y="237" width="300" height="54" rx="14" fill="#203d5c"/><text x="851" y="271" class="small">資料面：PIN／CVV／EMV／MAC</text>
    <rect x="825" y="306" width="300" height="54" rx="14" fill="#203d5c"/><text x="851" y="340" class="small">用途受限支付金鑰與 Alias</text>
    <text x="825" y="393" class="tiny">支付專用 HSM · 明文金鑰不離開 HSM</text>

    <rect x="1250" y="205" width="140" height="160" rx="24" class="box"/>
    <text x="1281" y="260" class="label">發卡端</text>
    <text x="1270" y="313" class="small">驗證與</text>
    <text x="1270" y="341" class="small">授權結果</text>
  </g>

  <path d="M310 285H385" class="flow"/><path d="M690 285H775" class="flow"/><path d="M1170 285H1245" class="flow"/>
  <text x="702" y="262" class="tiny">VPC 端點</text>

  <g filter="url(#shadow)">
    <rect x="150" y="525" width="330" height="220" rx="24" class="box"/>
    <text x="192" y="580" class="label">控制面與金鑰交換</text>
    <text x="192" y="622" class="small">MFA／短期憑證／雙人核准</text>
    <text x="192" y="657" class="small">TR-31／TR-34／RSA／ECDH</text>
    <text x="192" y="692" class="small">Alias 輪替與金鑰清冊</text>

    <rect x="555" y="525" width="330" height="220" rx="24" class="box"/>
    <text x="610" y="580" class="label">稽核與監控</text>
    <text x="597" y="622" class="small">CloudTrail 控制面／資料面事件</text>
    <text x="597" y="657" class="small">CloudWatch 延遲、錯誤、節流</text>
    <text x="597" y="692" class="small">交易對帳與事件應變</text>

    <rect x="960" y="525" width="330" height="220" rx="24" fill="#132c49" stroke="url(#cyan)" stroke-width="3"/>
    <text x="1022" y="580" class="label">備援區域</text>
    <text x="1002" y="622" class="small">Multi-Region key replica</text>
    <text x="1002" y="657" class="small">獨立應用、資料與 VPC 端點</text>
    <text x="1002" y="692" class="small">路由、配額、對帳與切回演練</text>
  </g>
  <path d="M945 420C890 475 770 480 720 520" class="dash"/>
  <path d="M1130 420V515" class="dash"/>
  <path d="M480 635H548" class="flow"/>
  <text x="72" y="815" class="small">共同責任：AWS 維護服務與支付專用 HSM；客戶治理交易授權、IAM、網路、金鑰用途、日誌、PCI 證據與完整災難復原。</text>
</svg>
