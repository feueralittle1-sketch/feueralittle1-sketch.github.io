<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1480" viewBox="0 0 700 1480" role="img" aria-labelledby="title desc">
<title id="title">AWS CodeDeploy 受控部署與安全回復手機版示意流程</title><desc id="desc">可信成品經核准及最小權限 CodeDeploy 角色部署到綠色環境，驗證後漸進切換流量，異常時依 CloudWatch 告警回復，並由 CloudTrail 留證。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker><style>.h{font:700 27px system-ui,sans-serif;fill:#fff}.t{font:700 23px system-ui,sans-serif;fill:#fff}.s{font:18px system-ui,sans-serif;fill:#c6d4eb}.b{fill:#10243e;stroke:#4b719c;stroke-width:2}.g{fill:#12382f;stroke:#61ddb2;stroke-width:2}.w{fill:#3b2920;stroke:#ffb45f;stroke-width:2}.l{stroke:#8fe8ff;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="700" height="1480" rx="26" fill="url(#bg)"/><text class="h" x="350" y="52" text-anchor="middle">示意｜受控部署與安全回復</text>
<g><rect class="g" x="90" y="90" width="520" height="145" rx="22"/><text class="t" x="350" y="137" text-anchor="middle">1　不可變成品</text><text class="s" x="350" y="176" text-anchor="middle">測試・掃描・簽章</text><text class="s" x="350" y="207" text-anchor="middle">映像摘要／S3 版本</text><line class="l" x1="350" y1="235" x2="350" y2="285"/>
<rect class="b" x="90" y="300" width="520" height="145" rx="22"/><text class="t" x="350" y="347" text-anchor="middle">2　變更核准</text><text class="s" x="350" y="386" text-anchor="middle">受保護管線</text><text class="s" x="350" y="417" text-anchor="middle">MFA・短期憑證</text><line class="l" x1="350" y1="445" x2="350" y2="495"/>
<rect class="b" x="90" y="510" width="520" height="145" rx="22"/><text class="t" x="350" y="557" text-anchor="middle">3　CodeDeploy</text><text class="s" x="350" y="596" text-anchor="middle">部署群組・AppSpec</text><text class="s" x="350" y="627" text-anchor="middle">隔離的最小權限角色</text><line class="l" x1="350" y1="655" x2="350" y2="705"/>
<rect class="g" x="90" y="720" width="520" height="145" rx="22"/><text class="t" x="350" y="767" text-anchor="middle">4　綠色環境驗證</text><text class="s" x="350" y="806" text-anchor="middle">私有網路・KMS 加密</text><text class="s" x="350" y="837" text-anchor="middle">掛鉤＋合成交易</text><line class="l" x1="350" y1="865" x2="350" y2="915"/>
<rect class="b" x="90" y="930" width="520" height="145" rx="22"/><text class="t" x="350" y="977" text-anchor="middle">5　漸進流量切換</text><text class="s" x="350" y="1016" text-anchor="middle">Canary／線性／全量</text><text class="s" x="350" y="1047" text-anchor="middle">技術與業務健康門檻</text></g>
<path d="M350 1075v45" class="l"/><rect class="w" x="55" y="1135" width="280" height="140" rx="20"/><text class="t" x="195" y="1180" text-anchor="middle">異常</text><text class="s" x="195" y="1218" text-anchor="middle">告警停止</text><text class="s" x="195" y="1248" text-anchor="middle">切回藍色環境</text><rect class="g" x="365" y="1135" width="280" height="140" rx="20"/><text class="t" x="505" y="1180" text-anchor="middle">穩定</text><text class="s" x="505" y="1218" text-anchor="middle">完成切換</text><text class="s" x="505" y="1248" text-anchor="middle">保留回復窗口</text>
<rect x="45" y="1320" width="610" height="110" rx="20" fill="#0b1c33" stroke="#6a8db4" stroke-width="2"/><text class="t" x="350" y="1360" text-anchor="middle">治理與證據</text><text class="s" x="350" y="1395" text-anchor="middle">機密管理・CloudTrail・CloudWatch</text><text class="s" x="350" y="1422" text-anchor="middle">備份・舊版回復・跨區演練</text>
</svg>
