<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">AWS Batch 安全批次處理流程手機版示意圖</title><desc id="desc">從受控輸入、工作提交、佇列排程、容器執行到輸出驗證、監控與復原的垂直流程。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102849"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#74dcff"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#fff}.t{font:700 23px system-ui,sans-serif;fill:#fff}.s{font:17px system-ui,sans-serif;fill:#bdd0e8}.b{fill:#10243e;stroke:#315071;stroke-width:2}.l{stroke:#74dcff;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="720" height="1500" rx="28" fill="url(#bg)"/><text x="42" y="62" class="h">示意｜AWS Batch 安全處理</text><text x="42" y="98" class="s">排程、執行、驗證、監控與復原缺一不可</text>
  <g><rect x="42" y="140" width="636" height="145" rx="24" class="b"/><text x="72" y="188" class="t">1. 受控輸入</text><text x="72" y="226" class="s">S3 / EFS｜KMS、版本、完整性</text><text x="72" y="258" class="s">先分類資料與設定保留期限</text></g><line x1="360" y1="285" x2="360" y2="330" class="l"/>
  <g><rect x="42" y="340" width="636" height="145" rx="24" class="b"/><text x="72" y="388" class="t">2. 提交與佇列</text><text x="72" y="426" class="s">EventBridge / API → Job queue</text><text x="72" y="458" class="s">短期憑證、優先序、公平分享</text></g><line x1="360" y1="485" x2="360" y2="530" class="l"/>
  <g><rect x="42" y="540" width="636" height="145" rx="24" class="b"/><text x="72" y="588" class="t">3. 運算環境</text><text x="72" y="626" class="s">Fargate｜少維運與工作隔離</text><text x="72" y="658" class="s">EC2 / Spot｜GPU、彈性與成本控制</text></g><line x1="360" y1="685" x2="360" y2="730" class="l"/>
  <g><rect x="42" y="740" width="636" height="225" rx="24" class="b"/><text x="72" y="788" class="t">4. 容器工作</text><text x="72" y="830" class="s">✓ ECR 映像固定 digest 並掃描</text><text x="72" y="866" class="s">✓ Job role 最小權限、無長期金鑰</text><text x="72" y="902" class="s">✓ 私有網路、受控 egress</text><text x="72" y="938" class="s">✓ 冪等、checkpoint、逾時與有限重試</text></g><line x1="360" y1="965" x2="360" y2="1010" class="l"/>
  <g><rect x="42" y="1020" width="636" height="145" rx="24" class="b"/><text x="72" y="1068" class="t">5. 輸出驗證</text><text x="72" y="1106" class="s">筆數、完整性、錯誤隔離、加密保存</text><text x="72" y="1138" class="s">重跑不覆蓋正確結果</text></g><line x1="360" y1="1165" x2="360" y2="1210" class="l"/>
  <g><rect x="42" y="1220" width="636" height="215" rx="24" class="b"/><text x="72" y="1268" class="t">6. 監控、稽核與復原</text><text x="72" y="1310" class="s">CloudWatch：佇列、失敗、延遲與成本</text><text x="72" y="1346" class="s">CloudTrail：控制面 API 稽核</text><text x="72" y="1382" class="s">DLQ、checkpoint、跨區資料與 IaC 演練</text><text x="72" y="1418" class="s">結果必須可驗證、可追溯、可重建</text></g>
</svg>
