<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Client VPN 安全遠端存取示意圖</title>
<desc id="desc">受管裝置經 SAML 與 MFA 驗證後連入兩個可用區的 Client VPN，透過群組授權、路由與安全群組分流到開發、維運及稽核資源，並由監控、加密與跨區復原保護。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#102a48"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffc66d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker></defs>
<rect width="1440" height="900" fill="url(#bg)"/><circle cx="1250" cy="110" r="220" fill="#0ec7d8" opacity=".08"/><circle cx="180" cy="810" r="260" fill="#ff9900" opacity=".07"/>
<text x="72" y="75" fill="#fff" font-size="34" font-family="system-ui,sans-serif" font-weight="800">AWS Client VPN：身分、網路與端點共同收斂</text><text x="72" y="112" fill="#9fb7d5" font-size="19" font-family="system-ui,sans-serif">示意架構｜驗證允許連線；授權、路由與安全群組限制實際可達範圍</text>
<g filter="url(#shadow)"><rect x="65" y="190" width="270" height="500" rx="28" fill="#0d2138" stroke="#47749d"/><text x="95" y="235" fill="#fff" font-size="24" font-family="system-ui,sans-serif" font-weight="700">受管遠端端點</text><g fill="#183552" stroke="#5d8eb7"><rect x="98" y="285" width="205" height="88" rx="18"/><rect x="98" y="400" width="205" height="88" rx="18"/><rect x="98" y="515" width="205" height="88" rx="18"/></g><g fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700"><text x="132" y="320">開發人員</text><text x="132" y="435">維運人員</text><text x="132" y="550">外部稽核</text></g><g fill="#a9c3dd" font-family="system-ui,sans-serif" font-size="15"><text x="132" y="349">修補 · 磁碟加密 · EDR</text><text x="132" y="464">裝置身分 · 主機防火牆</text><text x="132" y="579">遺失停用 · 最短工作階段</text></g><rect x="98" y="626" width="205" height="38" rx="19" fill="#153d3c" stroke="#43d7b7"/><text x="126" y="652" fill="#7ff5d7" font-size="16" font-family="system-ui,sans-serif" font-weight="700">OpenVPN 加密通道</text></g>
<path d="M335 430H438" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="450" y="180" width="300" height="520" rx="30" fill="#101d32" stroke="#ffad3d" stroke-width="2"/><rect x="480" y="215" width="240" height="74" rx="18" fill="#382915" stroke="#ffad3d"/><text x="514" y="246" fill="#ffcb83" font-size="19" font-family="system-ui,sans-serif" font-weight="800">SAML / Directory</text><text x="522" y="272" fill="#fff" font-size="18" font-family="system-ui,sans-serif">MFA + 群組身分</text><path d="M600 300V350" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="365" width="240" height="128" rx="22" fill="#1e324b" stroke="#79dff1"/><text x="511" y="405" fill="#fff" font-size="23" font-family="system-ui,sans-serif" font-weight="800">Client VPN endpoint</text><text x="515" y="438" fill="#aad2e9" font-size="16" font-family="system-ui,sans-serif">Client CIDR · DNS · Session</text><text x="514" y="466" fill="#aad2e9" font-size="16" font-family="system-ui,sans-serif">全通道 / 分割通道</text><path d="M600 505V548" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="560" width="240" height="105" rx="20" fill="#142b40" stroke="#65bcd4"/><text x="515" y="598" fill="#fff" font-size="19" font-family="system-ui,sans-serif" font-weight="800">授權規則 + 路由</text><text x="510" y="630" fill="#9fc6df" font-size="16" font-family="system-ui,sans-serif">安全群組再次限制流量</text></g>
<path d="M750 430H838" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="850" y="155" width="520" height="570" rx="30" fill="#0c2036" stroke="#47749d"/><text x="886" y="200" fill="#fff" font-size="25" font-family="system-ui,sans-serif" font-weight="800">VPC：兩個可用區關聯與分層資源</text><rect x="885" y="230" width="215" height="112" rx="20" fill="#183552" stroke="#72d7e8"/><rect x="1115" y="230" width="215" height="112" rx="20" fill="#183552" stroke="#72d7e8"/><text x="919" y="270" fill="#fff" font-size="19" font-family="system-ui,sans-serif" font-weight="700">AZ-A target network</text><text x="1149" y="270" fill="#fff" font-size="19" font-family="system-ui,sans-serif" font-weight="700">AZ-B target network</text><text x="925" y="303" fill="#a9c3dd" font-size="16" font-family="system-ui,sans-serif">一致路由與回程</text><text x="1155" y="303" fill="#a9c3dd" font-size="16" font-family="system-ui,sans-serif">故障時重新連線</text><path d="M1107 355V398" stroke="#8fe8ff" stroke-width="4" marker-end="url(#arrow)"/><g fill="#142b40" stroke="#5c92b8"><rect x="885" y="412" width="135" height="105" rx="18"/><rect x="1040" y="412" width="135" height="105" rx="18"/><rect x="1195" y="412" width="135" height="105" rx="18"/></g><g fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="800" text-anchor="middle"><text x="952" y="451">開發</text><text x="1107" y="451">維運跳板</text><text x="1262" y="451">稽核報表</text></g><g fill="#9fc6df" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle"><text x="952" y="482">Dev CIDR</text><text x="1107" y="482">SSM / 管理面</text><text x="1262" y="482">唯讀服務</text></g><rect x="885" y="555" width="445" height="126" rx="22" fill="#11283d" stroke="#43d7b7"/><text x="915" y="595" fill="#7ff5d7" font-size="19" font-family="system-ui,sans-serif" font-weight="800">共同控制</text><text x="915" y="628" fill="#c7d9eb" font-size="16" font-family="system-ui,sans-serif">KMS · Secrets Manager / Parameter Store</text><text x="915" y="656" fill="#c7d9eb" font-size="16" font-family="system-ui,sans-serif">CloudWatch Logs · CloudTrail · VPC Flow Logs</text></g>
<g><rect x="330" y="760" width="780" height="88" rx="24" fill="#18293d" stroke="#815cc5"/><text x="365" y="797" fill="#d7c5ff" font-size="19" font-family="system-ui,sans-serif" font-weight="800">跨區復原不是自動接管</text><text x="365" y="827" fill="#c5d2e3" font-size="16" font-family="system-ui,sans-serif">以 IaC 重建第二區域端點、身分、憑證、關聯、授權、路由、監控與使用者切換流程</text></g>
</svg>
