<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">AWS Snowball Edge 既有工作負載與轉移選型手機版示意</title>
  <desc id="desc">縱向呈現資料盤點、Snowball Edge 終止銷售門檻、既有客戶安全作業鏈、替代方案與共同治理控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f8fbff}.h{font-size:31px;font-weight:800}.s{font-size:18px;fill:#bcd0eb}.box{fill:#10233f;stroke:#365b83;stroke-width:2}.accent{fill:#142e50;stroke:#ffad35;stroke-width:2}.alt{fill:#0d3342;stroke:#4ed9c4;stroke-width:2}.warn{fill:#3a2131;stroke:#fb7185;stroke-width:2}.label{font-size:23px;font-weight:800}.body{font-size:18px;fill:#c9d8ed}.line{fill:none;stroke:#79ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1500" rx="32" fill="url(#bg)"/>
  <text x="45" y="68" class="t h">Snowball Edge</text><text x="45" y="108" class="t h">既有作業與遷移決策</text>
  <text x="45" y="145" class="t s">示意｜2025-11-07 起終止銷售</text>

  <rect x="45" y="190" width="630" height="125" rx="22" class="box"/><text x="75" y="233" class="t label">1. 盤點需求</text><text x="75" y="272" class="t body">資料量、期限、頻寬、地點、RTO／RPO、敏感度</text>
  <path d="M360 315V355" class="line"/>
  <rect x="45" y="370" width="630" height="145" rx="22" class="warn"/><text x="75" y="413" class="t label">2. 服務生命週期門檻</text><text x="75" y="453" class="t body">新客戶：改選替代方案</text><text x="75" y="488" class="t body">既有客戶：確認權益、供應與退場里程碑</text>
  <path d="M360 515V555" class="line"/>

  <rect x="45" y="570" width="630" height="380" rx="26" class="accent"/><text x="75" y="615" class="t label">既有客戶：受控 Snowball Edge 作業鏈</text>
  <rect x="75" y="650" width="570" height="62" rx="16" class="box"/><text x="98" y="690" class="t body">① 建立工作、最小權限角色、KMS 與通知</text>
  <path d="M360 712V740" class="line"/>
  <rect x="75" y="750" width="570" height="62" rx="16" class="box"/><text x="98" y="790" class="t body">② 驗證裝置／封條，分開保管 Manifest 與解鎖碼</text>
  <path d="M360 812V840" class="line"/>
  <rect x="75" y="850" width="570" height="62" rx="16" class="box"/><text x="98" y="890" class="t body">③ 隔離複製、記錄日誌、雜湊與完整性校驗</text>
  <path d="M360 950V990" class="line"/>

  <rect x="45" y="1005" width="630" height="240" rx="26" class="alt"/><text x="75" y="1050" class="t label">替代方向</text><text x="75" y="1093" class="t body">• 線上資料移動：AWS DataSync</text><text x="75" y="1135" class="t body">• 實體高速上傳：AWS Data Transfer Terminal</text><text x="75" y="1177" class="t body">• 其他離線需求：AWS Partner 方案</text><text x="75" y="1219" class="t body">• 邊緣運算：AWS Outposts</text>
  <path d="M360 1245V1285" class="line"/>

  <rect x="45" y="1300" width="630" height="155" rx="26" class="box"/><text x="75" y="1343" class="t label">共同治理閉環</text><text x="75" y="1382" class="t body">IAM／MFA／短期憑證、網路隔離、KMS、</text><text x="75" y="1417" class="t body">CloudTrail／CloudWatch、完整性、備份與跨區復原</text>
</svg>
