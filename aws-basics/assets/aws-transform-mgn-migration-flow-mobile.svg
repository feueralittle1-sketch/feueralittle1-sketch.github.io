<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" role="img" aria-labelledby="title desc">
<title id="title">AWS Transform MGN 伺服器重新託管流程手機版</title><desc id="desc">依序盤點來源與相依性、建立隔離暫存區、持續複寫、審查啟動範本、隔離測試、停寫切換，最後完成監控備份與跨區復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a46"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#63e6ff"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter></defs>
<rect width="720" height="1580" rx="32" fill="url(#bg)"/><text x="42" y="64" fill="#fff" font-size="30" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">AWS Transform MGN 重新託管</text><text x="42" y="101" fill="#a8bad8" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif">示意｜持續複寫、測試、切換與治理</text><path d="M42 126H678" stroke="#ff9900" stroke-width="4"/>
<g font-family="Arial,'Noto Sans TC',sans-serif" filter="url(#shadow)">
<g><rect x="42" y="165" width="636" height="155" rx="24" fill="#17243a" stroke="#ffb45c" stroke-width="2"/><circle cx="84" cy="207" r="20" fill="#ffb45c"/><text x="84" y="214" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">1</text><text x="120" y="215" fill="#fff" font-size="25" font-weight="800">來源與相依性</text><text x="72" y="260" fill="#c6d4eb" font-size="18"><tspan x="72">盤點主機、應用、資料、DNS、AD</tspan><tspan x="72" dy="30">代理程式安裝採最小權限</tspan></text></g>
<g><rect x="42" y="355" width="636" height="155" rx="24" fill="#17243a" stroke="#63e6ff" stroke-width="2"/><circle cx="84" cy="397" r="20" fill="#63e6ff"/><text x="84" y="404" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">2</text><text x="120" y="405" fill="#fff" font-size="25" font-weight="800">隔離暫存區</text><text x="72" y="450" fill="#c6d4eb" font-size="18"><tspan x="72">專用子網路、複寫伺服器、暫存 EBS</tspan><tspan x="72" dy="30">私有路徑、KMS 與 CloudTrail</tspan></text></g>
<g><rect x="42" y="545" width="636" height="155" rx="24" fill="#17243a" stroke="#a78bfa" stroke-width="2"/><circle cx="84" cy="587" r="20" fill="#a78bfa"/><text x="84" y="594" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">3</text><text x="120" y="595" fill="#fff" font-size="25" font-weight="800">持續區塊複寫</text><text x="72" y="640" fill="#c6d4eb" font-size="18"><tspan x="72">完成初始同步後持續傳送變更</tspan><tspan x="72" dy="30">監控延遲、停滯與網路容量</tspan></text></g>
<g><rect x="42" y="735" width="636" height="155" rx="24" fill="#17243a" stroke="#fb7185" stroke-width="2"/><circle cx="84" cy="777" r="20" fill="#fb7185"/><text x="84" y="784" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">4</text><text x="120" y="785" fill="#fff" font-size="25" font-weight="800">受控啟動範本</text><text x="72" y="830" fill="#c6d4eb" font-size="18"><tspan x="72">審查 EC2、網路、IAM、EBS、KMS</tspan><tspan x="72" dy="30">固定版本、標籤、日誌與刪除行為</tspan></text></g>
<g><rect x="42" y="925" width="636" height="155" rx="24" fill="#132d3d" stroke="#63e6ff" stroke-width="2"/><circle cx="84" cy="967" r="20" fill="#63e6ff"/><text x="84" y="974" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">5</text><text x="120" y="975" fill="#fff" font-size="25" font-weight="800">隔離測試波次</text><text x="72" y="1020" fill="#c6d4eb" font-size="18"><tspan x="72">不連正式介面，驗證功能與資料</tspan><tspan x="72" dy="30">檢查身分、效能、安全與備份</tspan></text></g>
<g><rect x="42" y="1115" width="636" height="155" rx="24" fill="#222642" stroke="#a78bfa" stroke-width="2"/><circle cx="84" cy="1157" r="20" fill="#a78bfa"/><text x="84" y="1164" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">6</text><text x="120" y="1165" fill="#fff" font-size="25" font-weight="800">停寫與正式切換</text><text x="72" y="1210" fill="#c6d4eb" font-size="18"><tspan x="72">確認同步健康、備份、停止來源寫入</tspan><tspan x="72" dy="30">啟動切換 EC2、驗證後逐步導流</tspan></text></g>
<g><rect x="42" y="1305" width="636" height="170" rx="24" fill="#2b2835" stroke="#ffb45c" stroke-width="2"/><circle cx="84" cy="1347" r="20" fill="#ffb45c"/><text x="84" y="1354" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">7</text><text x="120" y="1355" fill="#fff" font-size="25" font-weight="800">觀察、清理與治理</text><text x="72" y="1400" fill="#c6d4eb" font-size="18"><tspan x="72">保留回復界線，再 finalize 與清理</tspan><tspan x="72" dy="30">監控、修補、備份與跨區演練</tspan></text></g>
</g>
<g stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"><path d="M360 323V345"/><path d="M360 513V535"/><path d="M360 703V725"/><path d="M360 893V915"/><path d="M360 1083V1105"/><path d="M360 1273V1295"/></g>
<text x="360" y="1530" text-anchor="middle" fill="#e6eefc" font-size="18" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">完成：資料一致、應用驗收、權限可稽核且能復原</text>
</svg>
