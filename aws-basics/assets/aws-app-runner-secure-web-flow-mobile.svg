<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">AWS App Runner 手機版安全部署流程</title>
  <desc id="desc">由受控來源部署至 App Runner，經公開或私有入口提供服務，使用最小權限、Secrets、VPC connector、監控稽核，並保留替代平台復原能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102747"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffbf66"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#44d7f2"/><stop offset="1" stop-color="#79f2d0"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffb44d"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#fff}.h{font-size:30px;font-weight:800}.b{font-size:24px;font-weight:800}.s{font-size:19px;fill:#c8d8ed}.tiny{font-size:17px;fill:#a9bfd9}.box{fill:#102640;stroke:#355777;stroke-width:2}.line{stroke:#ffb44d;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1500" rx="30" fill="url(#bg)"/>
  <text x="45" y="58" class="t h">App Runner 安全部署示意</text>
  <text x="45" y="92" class="t tiny">受管平台簡化部署，治理與退出責任仍存在。</text>

  <rect x="55" y="140" width="610" height="165" rx="24" class="box"/>
  <text x="90" y="190" class="t b">1｜受控來源</text>
  <text x="90" y="230" class="t s">Git / ECR · 測試 · SBOM · 掃描</text>
  <text x="90" y="266" class="t s">簽章 · 核准 · 不可變版本</text>
  <path d="M360 305V355" class="line"/>

  <rect x="55" y="365" width="610" height="250" rx="26" fill="#132d4c" stroke="url(#orange)" stroke-width="4"/>
  <rect x="85" y="395" width="550" height="52" rx="26" fill="url(#orange)"/>
  <text x="360" y="430" text-anchor="middle" class="t b" fill="#071426">2｜AWS APP RUNNER</text>
  <text x="95" y="492" class="t s">建置／拉取 · HTTPS · 健康檢查</text>
  <text x="95" y="530" class="t s">自動擴縮 · 受管執行個體</text>
  <text x="95" y="568" class="t s">Instance role 採最小權限</text>
  <path d="M360 615V665" class="line"/>

  <rect x="55" y="675" width="610" height="170" rx="24" class="box"/>
  <text x="90" y="725" class="t b">3｜入口與網路</text>
  <text x="90" y="765" class="t s">Public 或 Private endpoint</text>
  <text x="90" y="803" class="t s">VPC connector 只處理應用出站</text>
  <path d="M360 845V895" class="line"/>

  <rect x="55" y="905" width="610" height="200" rx="24" class="box"/>
  <text x="90" y="955" class="t b">4｜資料與安全控制</text>
  <text x="90" y="995" class="t s">IAM · MFA · 短期憑證</text>
  <text x="90" y="1033" class="t s">Secrets / Parameter Store · KMS</text>
  <text x="90" y="1071" class="t s">私有資料庫 · 限制 SG 與連接埠</text>
  <path d="M360 1105V1155" class="line"/>

  <rect x="55" y="1165" width="280" height="215" rx="24" class="box"/>
  <text x="85" y="1215" class="t b">5｜證據</text>
  <text x="85" y="1257" class="t s">CloudWatch</text>
  <text x="85" y="1293" class="t s">X-Ray</text>
  <text x="85" y="1329" class="t s">CloudTrail</text>

  <rect x="385" y="1165" width="280" height="215" rx="24" fill="#12382f" stroke="url(#cyan)" stroke-width="3"/>
  <text x="415" y="1215" class="t b">6｜退出</text>
  <text x="415" y="1257" class="t s">OCI + IaC</text>
  <text x="415" y="1293" class="t s">ECS / Fargate</text>
  <text x="415" y="1329" class="t s">跨區與 DNS 演練</text>

  <rect x="55" y="1420" width="610" height="2" fill="#355777"/>
  <text x="55" y="1462" class="t tiny">新客戶不可採用；既有客戶須持續治理並保留替代方案。</text>
</svg>
