<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1280" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc">
<title id="title">AWS CloudFormation 手機版受控交付流程示意圖</title><desc id="desc">垂直呈現版本控制、變更集、受控執行、跨可用區資源、觀測、漂移偵測與跨區重建。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#64ddff"/></marker></defs><rect width="760" height="1280" rx="28" fill="url(#bg)"/><g font-family="sans-serif"><text x="44" y="68" fill="#fff" font-size="30" font-weight="700">CloudFormation 受控交付</text><text x="44" y="102" fill="#a9bddb" font-size="18">示意：變更可審查，狀態可驗證</text>
<g fill="#142b48" stroke="#456887"><rect x="44" y="146" width="672" height="132" rx="20"/><rect x="44" y="324" width="672" height="132" rx="20"/><rect x="44" y="502" width="672" height="132" rx="20"/><rect x="44" y="680" width="672" height="132" rx="20"/></g>
<g fill="#ffbf69" font-size="22" font-weight="700"><text x="76" y="188">1｜版本控制與檢查</text><text x="76" y="366">2｜建立變更集並核准</text><text x="76" y="544">3｜最小權限角色執行</text><text x="76" y="722">4｜建立跨可用區私有資源</text></g><g fill="#dceaff" font-size="17"><text x="76" y="226">範本、參數、政策與測試共同審查</text><text x="76" y="404">預覽新增、修改、替換與刪除影響</text><text x="76" y="582">堆疊政策、回復觸發與失敗中止</text><text x="76" y="760">公開存取、加密與網路邊界受控</text></g>
<g stroke="#64ddff" stroke-width="4" marker-end="url(#a)"><path d="M380 278V312"/><path d="M380 456V490"/><path d="M380 634V668"/><path d="M380 812V850"/></g>
<rect x="44" y="862" width="672" height="286" rx="22" fill="#0b1d34" stroke="#31516f"/><text x="76" y="908" fill="#fff" font-size="23" font-weight="700">部署後持續驗證</text><g fill="#7ee8ff" font-size="19" font-weight="700"><text x="78" y="956">CloudTrail／CloudWatch</text><text x="78" y="1016">漂移偵測</text><text x="78" y="1076">備份與跨區重建演練</text></g><g fill="#c4d5ea" font-size="16"><text x="356" y="956">活動、指標、日誌與告警</text><text x="356" y="1016">比對實際資源與範本預期</text><text x="356" y="1076">驗證資料、金鑰與相依服務</text></g>
<path d="M380 1148V1206H104V278" fill="none" stroke="#ffb45d" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="162" y="1242" fill="#ffcf8c" font-size="17">異常回到程式碼修正，再次審查與部署</text></g></svg>
