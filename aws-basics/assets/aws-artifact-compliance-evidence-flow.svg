<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Artifact 合規佐證治理流程</title>
  <desc id="desc">合規需求進入 AWS Artifact，分別取得 AWS 與第三方報告、管理帳號或組織協議、使用附引用回答，再經法律與控制覆核後存入受控證據庫並交付稽核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d8ff"/><stop offset="1" stop-color="#8fffe1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:30px;font-weight:800}.s{font-size:18px}.k{font-size:15px;font-weight:700;letter-spacing:.08em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="130" cy="90" r="180" fill="#ff9900" opacity=".08"/><circle cx="1320" cy="810" r="260" fill="#55d8ff" opacity=".07"/>
  <text x="74" y="86" class="t h">AWS Artifact 合規佐證治理流程</text>
  <text x="74" y="120" class="m s">示意：需求與範圍 → 報告／協議／回答 → 覆核 → 受控交付</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="184" width="260" height="432" rx="28"/>
    <text x="100" y="228" class="t k">01 合規需求</text>
    <g transform="translate(100 260)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">法規與客戶問卷</text></g>
    <g transform="translate(100 338)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">服務與區域</text></g>
    <g transform="translate(100 416)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">查核期間</text></g>
    <g transform="translate(100 494)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">責任邊界</text></g>
    <text x="100" y="590" class="m s">先定義需要證明什麼</text>
  </g>
  <path class="line" d="M330 400H390"/>
  <g filter="url(#shadow)">
    <rect x="390" y="184" width="310" height="432" rx="28" fill="#122b49" stroke="#ffb657" stroke-width="2"/>
    <rect x="422" y="222" width="246" height="8" rx="4" fill="url(#orange)"/>
    <text x="422" y="278" class="t h">AWS Artifact</text>
    <g transform="translate(422 318)"><rect width="246" height="62" rx="16" fill="#173354"/><text x="18" y="38" class="t s">AWS／第三方報告</text></g>
    <g transform="translate(422 396)"><rect width="246" height="62" rx="16" fill="#173354"/><text x="18" y="38" class="t s">帳號／組織協議</text></g>
    <g transform="translate(422 474)"><rect width="246" height="62" rx="16" fill="#173354"/><text x="18" y="38" class="t s">附引用回答</text></g>
    <text x="422" y="584" class="m s">版本 · 條款 · 更新事件</text>
  </g>
  <path class="line" d="M700 400H760"/>
  <g filter="url(#shadow)">
    <rect class="box" x="760" y="184" width="300" height="432" rx="28"/>
    <text x="790" y="228" class="t k">03 專業覆核</text>
    <g transform="translate(790 270)"><circle cx="15" cy="15" r="15" fill="#ff9900"/><text x="44" y="21" class="t s">核對涵蓋範圍</text></g>
    <g transform="translate(790 330)"><circle cx="15" cy="15" r="15" fill="#ffb657"/><text x="44" y="21" class="t s">法律與分享條款</text></g>
    <g transform="translate(790 390)"><circle cx="15" cy="15" r="15" fill="#ffd38a"/><text x="44" y="21" class="t s">回查回答引用</text></g>
    <g transform="translate(790 450)"><circle cx="15" cy="15" r="15" fill="#8fe8ff"/><text x="44" y="21" class="t s">分離客戶端證據</text></g>
    <g transform="translate(790 510)"><circle cx="15" cy="15" r="15" fill="#62e5c6"/><text x="44" y="21" class="t s">核准與版本紀錄</text></g>
    <text x="790" y="584" class="m s">取得文件不等於合規</text>
  </g>
  <path class="line" d="M1060 400H1120"/>
  <g filter="url(#shadow)">
    <rect class="box" x="1120" y="184" width="250" height="432" rx="28"/>
    <text x="1150" y="228" class="t k">04 保護與交付</text>
    <g transform="translate(1150 270)"><rect width="190" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">受控證據庫</text></g>
    <g transform="translate(1150 352)"><rect width="190" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">稽核軌跡</text></g>
    <g transform="translate(1150 434)"><rect width="190" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">期限型分享</text></g>
    <g transform="translate(1150 516)"><rect width="190" height="64" rx="16" fill="url(#cyan)"/><text x="18" y="39" style="font-family:Inter,'Noto Sans TC',sans-serif;fill:#072034;font-size:18px;font-weight:800">稽核交付</text></g>
  </g>
  <path d="M1245 616V728H600V624" fill="none" stroke="#62e5c6" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <g transform="translate(170 704)"><rect width="1100" height="116" rx="24" fill="#0d1f35" stroke="#ffffff22" stroke-width="2"/><text x="36" y="42" class="t k">持續控制面</text><text x="36" y="78" class="m s">IAM 最小權限與 MFA／短期憑證　·　受管網路與裝置　·　S3 公開存取阻擋　·　KMS</text><text x="36" y="103" class="m s">CloudTrail／EventBridge／通知　·　Secrets Manager／Parameter Store　·　備份與跨區復原</text></g>
</svg>
