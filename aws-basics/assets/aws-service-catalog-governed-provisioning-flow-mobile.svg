<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1300" role="img" aria-labelledby="title desc">
<title id="title">AWS Service Catalog 受控自助部署流程手機版</title>
<desc id="desc">產品需求經模板審查、Service Catalog 目錄治理、短期身分與 Launch role 部署後，進入監控、更新及跨區復原的垂直流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70d9ff"/></marker></defs>
<rect width="720" height="1300" fill="url(#bg)"/><circle cx="610" cy="90" r="150" fill="#ff9900" opacity=".07"/><circle cx="100" cy="1190" r="180" fill="#70d9ff" opacity=".06"/>
<text x="40" y="58" fill="#fff" font-family="Arial, Noto Sans TC, sans-serif" font-size="30" font-weight="700">Service Catalog 受控部署</text><text x="40" y="94" fill="#a9bddc" font-family="Arial, Noto Sans TC, sans-serif" font-size="18">示意｜核准產品到生命週期治理</text>
<g font-family="Arial, Noto Sans TC, sans-serif" filter="url(#shadow)">
<g transform="translate(55 130)"><rect width="610" height="135" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="135" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">1. 需求與模板版本審查</text><text x="34" y="79" fill="#c9d8ec" font-size="18">資料分類 · 網路 · KMS · 成本</text><text x="34" y="108" fill="#c9d8ec" font-size="18">建立 / 更新 / 回復 / 終止測試</text></g>
<path d="M360 265V290" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 305)"><rect width="610" height="155" rx="22" fill="#1b304a" stroke="#ffb454"/><rect width="10" height="155" rx="5" fill="url(#accent)"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">2. Service Catalog 目錄門禁</text><text x="34" y="79" fill="#ffe2bd" font-size="18">Product · Version · Portfolio</text><text x="34" y="108" fill="#ffe2bd" font-size="18">Template / Launch constraint</text><text x="34" y="137" fill="#ffe2bd" font-size="18">TagOptions · 帳號 / OU 分享</text></g>
<path d="M360 460V485" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 500)"><rect width="610" height="145" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="145" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">3. 使用者受控選用</text><text x="34" y="79" fill="#c9d8ec" font-size="18">IAM Identity Center · MFA · 短期工作階段</text><text x="34" y="108" fill="#c9d8ec" font-size="18">核准參數 · 成本與擁有者標籤</text></g>
<path d="M360 645V670" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 685)"><rect width="610" height="155" rx="22" fill="#1b304a" stroke="#ffb454"/><rect width="10" height="155" rx="5" fill="url(#accent)"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">4. Launch role 受控部署</text><text x="34" y="79" fill="#ffe2bd" font-size="18">來源條件 · 最小權限 · Engine</text><text x="34" y="108" fill="#ffe2bd" font-size="18">私有網路 · 公開存取封鎖 · KMS</text><text x="34" y="137" fill="#ffe2bd" font-size="18">Secrets Manager / Parameter Store</text></g>
<path d="M360 840V865" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 880)"><rect width="610" height="145" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="145" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">5. 監控、稽核與責任分派</text><text x="34" y="79" fill="#c9d8ec" font-size="18">CloudTrail · CloudWatch · SNS / 工單</text><text x="34" y="108" fill="#c9d8ec" font-size="18">部署失敗 · 漂移 · 異常操作</text></g>
<path d="M360 1025V1050" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 1065)"><rect width="610" height="155" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="155" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">6. 更新、淘汰與復原</text><text x="34" y="79" fill="#c9d8ec" font-size="18">測試 Portfolio · 分批升級 · 回復</text><text x="34" y="108" fill="#c9d8ec" font-size="18">備份 · 舊版本淘汰 · 終止檢查</text><text x="34" y="137" fill="#c9d8ec" font-size="18">區域故障演練 · 跨區重建</text></g>
</g>
<text x="360" y="1266" text-anchor="middle" fill="#ffcf91" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="700">最小權限 · 版本保留 · 稽核 · 備份 · 跨區復原</text>
</svg>
