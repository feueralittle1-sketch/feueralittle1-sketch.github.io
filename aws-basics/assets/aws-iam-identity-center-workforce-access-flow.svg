<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">AWS IAM Identity Center 多帳號人員存取治理流程</title>
  <desc id="desc">企業身分提供者與多因素驗證將使用者及群組同步至 IAM Identity Center，平台團隊透過權限集與帳號指派發放短期憑證，使用者存取開發、正式及稽核帳號，CloudTrail 與 CloudWatch 持續監控。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <style>.box{fill:#10233f;stroke:#385273;stroke-width:2}.secure{fill:#172a42;stroke:#ffb454;stroke-width:2}.t{font-family:Arial,'Noto Sans TC',sans-serif;fill:#f8fbff}.h{font-size:27px;font-weight:700}.p{font-size:19px;fill:#c8d7eb}.small{font-size:17px;fill:#a9bdd7}.line{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffb454;stroke-width:3;stroke-dasharray:10 9}</style>
  </defs>
  <rect width="1400" height="860" rx="38" fill="url(#bg)"/>
  <text x="70" y="70" class="t h">示意｜集中身分、權限集與短期憑證的多帳號存取</text>
  <text x="70" y="105" class="t p">人員驗證與帳號授權集中治理；工作負載角色、網路、資料與機密仍分層控制</text>

  <g filter="url(#shadow)">
    <rect x="65" y="175" width="280" height="205" rx="24" class="box"/>
    <rect x="390" y="150" width="375" height="255" rx="28" class="secure"/>
    <rect x="825" y="175" width="510" height="205" rx="24" class="box"/>
    <rect x="165" y="520" width="450" height="220" rx="28" class="box"/>
    <rect x="780" y="520" width="455" height="220" rx="28" class="box"/>
  </g>

  <text x="95" y="225" class="t h">企業身分來源</text>
  <text x="95" y="268" class="t p">使用者與職務群組</text>
  <text x="95" y="303" class="t p">MFA／條件式存取</text>
  <text x="95" y="338" class="t p">SCIM 或目錄同步</text>

  <rect x="430" y="182" width="295" height="54" rx="16" fill="url(#accent)"/>
  <text x="577" y="217" text-anchor="middle" style="font:700 23px Arial,'Noto Sans TC',sans-serif;fill:#111827">IAM Identity Center</text>
  <text x="430" y="278" class="t p">① 身分與群組</text>
  <text x="430" y="316" class="t p">② 權限集與工作階段</text>
  <text x="430" y="354" class="t p">③ AWS 帳號指派</text>
  <text x="430" y="386" class="t small">集中入口，不取代 IAM／SCP／KMS</text>

  <text x="860" y="225" class="t h">短期工作階段</text>
  <text x="860" y="268" class="t p">Access portal／CLI／SDK</text>
  <text x="860" y="303" class="t p">依權限集取得 IAM 角色</text>
  <text x="860" y="338" class="t p">到期、重新驗證與撤銷流程</text>

  <path d="M345 275H390" class="line"/>
  <path d="M765 275H825" class="line"/>
  <path d="M1080 380V465H1005V520" class="line"/>
  <path d="M825 300H700V465H500V520" class="line"/>

  <text x="205" y="570" class="t h">多帳號權限邊界</text>
  <text x="205" y="614" class="t p">開發帳號：開發者權限集</text>
  <text x="205" y="650" class="t p">正式帳號：唯讀／限時維運</text>
  <text x="205" y="686" class="t p">安全帳號：稽核與證據保護</text>
  <text x="205" y="718" class="t small">SCP、資源政策與 KMS 建立上限</text>

  <text x="820" y="570" class="t h">持續治理與復原</text>
  <text x="820" y="614" class="t p">CloudTrail 集中稽核</text>
  <text x="820" y="650" class="t p">CloudWatch／SIEM 告警</text>
  <text x="820" y="686" class="t p">定期存取複核與離職停權</text>
  <text x="820" y="718" class="t small">緊急存取、設定備份與中斷演練</text>

  <path d="M615 630H780" class="dash"/>
  <text x="700" y="615" text-anchor="middle" class="t small">事件與證據</text>
  <rect x="65" y="790" width="1270" height="2" fill="#284564"/>
  <text x="700" y="825" text-anchor="middle" class="t small">最小權限 · MFA · 短期憑證 · 網路隔離 · KMS · Secrets Manager · CloudTrail · 復原演練</text>
</svg>
