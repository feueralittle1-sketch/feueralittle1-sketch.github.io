<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Amazon RDS 與 Aurora 私有高可用資料庫流程示意</title>
  <desc id="desc">使用者經受保護入口連到跨可用區應用服務，再透過私有資料庫端點使用主資料庫、備援與唯讀節點；旁路包含機密、加密、監控、備份與跨區復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#10264a"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffca75"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79e4ff"/></marker>
    <style>.box{fill:#102b49;stroke:#69d9f4;stroke-width:2}.db{fill:#332455;stroke:#c49cff;stroke-width:2}.guard{fill:#26371f;stroke:#a9e878;stroke-width:2}.t{fill:#f5f8ff;font:700 25px system-ui,sans-serif}.s{fill:#b9cae5;font:500 18px system-ui,sans-serif}.tiny{fill:#9fb5d6;font:500 15px system-ui,sans-serif}.line{fill:none;stroke:#79e4ff;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#a9e878;stroke-width:3;stroke-dasharray:9 8}</style>
  </defs>
  <rect width="1400" height="820" rx="36" fill="url(#bg)"/>
  <circle cx="1250" cy="100" r="145" fill="#ff9900" opacity=".08"/>
  <text x="64" y="72" class="t" font-size="32">示意｜RDS / Aurora 私有、高可用與可復原資料路徑</text>
  <text x="64" y="105" class="s">正式架構須依引擎、區域、RTO / RPO、流量與法規重新驗證</text>

  <rect x="55" y="185" width="205" height="120" rx="22" class="box"/>
  <text x="157" y="230" text-anchor="middle" class="t">使用者</text><text x="157" y="265" text-anchor="middle" class="s">TLS 請求</text>
  <rect x="330" y="170" width="250" height="150" rx="22" class="guard"/>
  <text x="455" y="214" text-anchor="middle" class="t">受保護入口</text><text x="455" y="250" text-anchor="middle" class="s">Route 53 · WAF</text><text x="455" y="280" text-anchor="middle" class="s">Load Balancer</text>
  <path d="M260 245H325" class="line"/>

  <rect x="650" y="145" width="280" height="200" rx="26" class="box"/>
  <text x="790" y="190" text-anchor="middle" class="t">私有應用層</text><text x="790" y="226" text-anchor="middle" class="s">跨兩個可用區</text><text x="790" y="260" text-anchor="middle" class="s">IAM Role · Security Group</text><text x="790" y="294" text-anchor="middle" class="s">連線池 · TLS</text>
  <path d="M580 245H645" class="line"/>

  <rect x="1010" y="128" width="330" height="235" rx="28" class="db"/>
  <text x="1175" y="172" text-anchor="middle" class="t">私有 DB 叢集 / 執行個體</text>
  <ellipse cx="1110" cy="235" rx="66" ry="24" fill="#7348a7" stroke="#e1c5ff" stroke-width="2"/><path d="M1044 235v55c0 13 30 24 66 24s66-11 66-24v-55" fill="#5a3787" stroke="#e1c5ff" stroke-width="2"/><text x="1110" y="276" text-anchor="middle" class="s" fill="#fff">Writer</text>
  <ellipse cx="1260" cy="235" rx="55" ry="21" fill="#3f5f92" stroke="#b6d7ff" stroke-width="2"/><path d="M1205 235v55c0 12 25 21 55 21s55-9 55-21v-55" fill="#304c79" stroke="#b6d7ff" stroke-width="2"/><text x="1260" y="275" text-anchor="middle" class="s" fill="#fff">備援 / Reader</text>
  <text x="1175" y="340" text-anchor="middle" class="tiny">Multi-AZ 或 Aurora 複本模型依選項而異</text>
  <path d="M930 245H1005" class="line"/>

  <rect x="115" y="460" width="255" height="125" rx="22" class="guard"/>
  <text x="242" y="502" text-anchor="middle" class="t">機密與加密</text><text x="242" y="538" text-anchor="middle" class="s">Secrets Manager</text><text x="242" y="566" text-anchor="middle" class="s">KMS · 自動輪替</text>
  <rect x="440" y="460" width="255" height="125" rx="22" class="guard"/>
  <text x="567" y="502" text-anchor="middle" class="t">稽核與監控</text><text x="567" y="538" text-anchor="middle" class="s">CloudTrail · CloudWatch</text><text x="567" y="566" text-anchor="middle" class="s">DB Logs · 告警</text>
  <rect x="765" y="460" width="255" height="125" rx="22" class="guard"/>
  <text x="892" y="502" text-anchor="middle" class="t">自動備份</text><text x="892" y="538" text-anchor="middle" class="s">時間點復原 · Snapshot</text><text x="892" y="566" text-anchor="middle" class="s">還原演練</text>
  <rect x="1090" y="460" width="255" height="125" rx="22" class="guard"/>
  <text x="1217" y="502" text-anchor="middle" class="t">跨區復原</text><text x="1217" y="538" text-anchor="middle" class="s">Snapshot 複製 / 複本</text><text x="1217" y="566" text-anchor="middle" class="s">DNS 與切換程序</text>
  <path d="M242 455C300 380 550 390 700 345" class="dash"/><path d="M567 455C650 390 900 410 1080 360" class="dash"/><path d="M892 455V370" class="dash"/><path d="M1217 455V370" class="dash"/>

  <rect x="55" y="665" width="1290" height="95" rx="24" fill="#0b1c31" stroke="#38536f" stroke-width="2"/>
  <text x="85" y="705" class="s" fill="#ffca75">控制重點</text><text x="85" y="738" class="tiny">不公開資料庫｜最小權限與短期管理憑證｜Security Group 僅允許應用層｜傳輸與靜態加密｜記錄、備份、還原及跨區演練</text>
</svg>
