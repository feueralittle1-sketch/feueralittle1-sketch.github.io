<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1400" viewBox="0 0 720 1400" role="img" aria-labelledby="title desc">
  <title id="title">AWS Config 手機版組態治理流程示意圖</title>
  <desc id="desc">資源變更由 AWS Config 記錄及規則評估，跨帳號結果集中後結合 CloudTrail 調查，經核准修復再重新驗證。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#78ddff"/></marker><style>.h{font:700 28px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 23px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 18px Inter,'Noto Sans TC',sans-serif;fill:#c7d7ec}.b{fill:#102a48;stroke:#5ecff2;stroke-width:2}.g{fill:#302510;stroke:#ffb84d;stroke-width:2}.l{stroke:#78ddff;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="720" height="1400" rx="28" fill="url(#bg)"/>
  <text x="42" y="62" class="h">示意：AWS Config 組態治理</text><text x="42" y="96" class="s">記錄、評估、調查、核准修復、再驗證</text>
  <rect x="42" y="140" width="636" height="190" rx="22" class="g"/><text x="78" y="188" class="t">1 多帳號／多區域資源</text><text x="78" y="232" class="s">運算・儲存・網路・IAM</text><text x="78" y="272" class="s">SCP／IAM／資源政策先預防高風險變更</text>
  <line x1="360" y1="330" x2="360" y2="388" class="l"/>
  <rect x="42" y="400" width="636" height="270" rx="22" class="b"/><text x="78" y="448" class="t">2 AWS Config 記錄與評估</text><text x="78" y="494" class="s">組態項目、關聯與歷程</text><text x="78" y="534" class="s">歷程送往 S3＋KMS</text><text x="78" y="574" class="s">Config Rules／Conformance Packs</text><text x="78" y="614" class="s">結果：合規／不合規／錯誤</text>
  <line x1="360" y1="670" x2="360" y2="728" class="l"/>
  <rect x="42" y="740" width="636" height="230" rx="22" class="g"/><text x="78" y="788" class="t">3 聚合、告警與調查</text><text x="78" y="834" class="s">跨帳號／跨區域聚合器</text><text x="78" y="874" class="s">EventBridge／工單／CloudWatch</text><text x="78" y="914" class="s">CloudTrail 補充變更者與 API 證據</text>
  <line x1="360" y1="970" x2="360" y2="1028" class="l"/>
  <rect x="42" y="1040" width="636" height="260" rx="22" class="b"/><text x="78" y="1088" class="t">4 核准修復與重新驗證</text><text x="78" y="1134" class="s">人工分級＋例外到期日</text><text x="78" y="1174" class="s">Automation 最小權限、分批、限流</text><text x="78" y="1214" class="s">重新評估並保存前後證據</text><text x="78" y="1254" class="s">失敗則停止、回復並調查</text>
  <text x="360" y="1352" text-anchor="middle" class="s">組態事實 ≠ 即時阻擋 ≠ 威脅偵測 ≠ 資料備份</text>
</svg>
