<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Step Functions 安全文件處理工作流程示意圖</title>
  <desc id="desc">文件事件經受控入口啟動加密 Standard 工作流程，先驗證輸入，再平行執行掃描與格式驗證，接著解析、條件分流與人工覆核；周邊以最小權限、KMS、CloudWatch、CloudTrail、外部業務狀態與替代區域保護。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd28f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 24px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 18px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 16px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="72" y="72" class="k">ORIGINAL ARCHITECTURE DIAGRAM · 示意</text>
  <text x="72" y="116" class="t" font-size="34">以 Step Functions 協調可追蹤、可補償的文件流程</text>
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="220" height="128" rx="22" class="box"/>
    <text x="180" y="232" text-anchor="middle" class="k">受控入口</text>
    <text x="180" y="267" text-anchor="middle" class="t">EventBridge</text>
    <text x="180" y="294" text-anchor="middle" class="s">識別值＋S3 位置</text>
    <rect x="350" y="168" width="740" height="450" rx="30" fill="#091a31" stroke="url(#accent)" stroke-width="3"/>
    <text x="390" y="210" class="k">加密 STANDARD 狀態機</text>
    <rect x="395" y="250" width="190" height="96" rx="18" class="step"/>
    <text x="490" y="288" text-anchor="middle" class="t">輸入驗證</text><text x="490" y="319" text-anchor="middle" class="s">結構／分類／大小</text>
    <rect x="650" y="232" width="190" height="86" rx="18" class="step"/>
    <text x="745" y="269" text-anchor="middle" class="t">惡意內容掃描</text><text x="745" y="297" text-anchor="middle" class="s">限時＋有限重試</text>
    <rect x="650" y="344" width="190" height="86" rx="18" class="step"/>
    <text x="745" y="381" text-anchor="middle" class="t">格式驗證</text><text x="745" y="409" text-anchor="middle" class="s">拒絕路徑明確</text>
    <rect x="900" y="288" width="150" height="96" rx="18" class="step"/>
    <text x="975" y="328" text-anchor="middle" class="t">文件解析</text><text x="975" y="356" text-anchor="middle" class="s">結果外部化</text>
    <polygon points="695,492 770,442 845,492 770,542" class="step"/>
    <text x="770" y="486" text-anchor="middle" class="t">信心分數</text><text x="770" y="514" text-anchor="middle" class="s">Choice</text>
    <rect x="410" y="472" width="190" height="90" rx="18" class="step"/>
    <text x="505" y="510" text-anchor="middle" class="t">完成與留存</text><text x="505" y="540" text-anchor="middle" class="s">業務狀態清冊</text>
    <rect x="900" y="472" width="150" height="90" rx="18" class="step"/>
    <text x="975" y="510" text-anchor="middle" class="t">人工覆核</text><text x="975" y="540" text-anchor="middle" class="s">Callback token</text>
    <path d="M290 254H395" class="line"/><path d="M585 298H625V275H650" class="line"/><path d="M585 298H625V387H650" class="line"/><path d="M840 275H870V336H900" class="line"/><path d="M840 387H870V336" class="line"/><path d="M975 384V420H770V442" class="line"/><path d="M695 492H600" class="line"/><path d="M845 492H900" class="line"/>
    <rect x="1150" y="190" width="220" height="128" rx="22" class="box"/>
    <text x="1260" y="232" text-anchor="middle" class="k">資料與機密</text>
    <text x="1260" y="268" text-anchor="middle" class="t">S3／KMS</text><text x="1260" y="296" text-anchor="middle" class="s">Secrets Manager</text>
    <path d="M1090 254H1150" class="line"/>
  </g>
  <g>
    <rect x="70" y="680" width="300" height="135" rx="22" class="guard"/><text x="100" y="718" class="k">身分與網路</text><text x="100" y="754" class="t">專用 IAM 執行角色</text><text x="100" y="785" class="s">MFA／短期憑證／受控入口</text>
    <rect x="400" y="680" width="300" height="135" rx="22" class="guard"/><text x="430" y="718" class="k">可靠性</text><text x="430" y="754" class="t">冪等＋補償＋redrive</text><text x="430" y="785" class="s">退避、上限、抖動、人工處理</text>
    <rect x="730" y="680" width="300" height="135" rx="22" class="guard"/><text x="760" y="718" class="k">觀測與稽核</text><text x="760" y="754" class="t">CloudWatch／CloudTrail</text><text x="760" y="785" class="s">失敗、逾時、節流、版本變更</text>
    <rect x="1060" y="680" width="310" height="135" rx="22" class="guard"/><text x="1090" y="718" class="k">復原</text><text x="1090" y="754" class="t">版本別名＋替代區域</text><text x="1090" y="785" class="s">外部狀態盤點、去重、回切</text>
  </g>
  <text x="720" y="865" text-anchor="middle" class="s">重點：流程定義可複製，執行中業務狀態與副作用仍需由客戶治理。</text>
</svg>
