<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">AWS DataSync 安全資料傳輸流程</title><desc id="desc">示意自建檔案庫完成盤點與一致性控制後，經隔離的 DataSync agent 和受控網路傳輸到加密且不公開的 AWS 儲存，接著進行驗證、監控、切換、備份與跨區復原。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a46"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#73ddff"/></marker></defs><rect width="1400" height="860" rx="32" fill="url(#bg)"/><text x="70" y="76" fill="#fff" font-size="34" font-weight="800" font-family="Arial, sans-serif">AWS DataSync 安全資料傳輸示意</text><text x="70" y="112" fill="#a9c2df" font-size="19" font-family="Arial, sans-serif">盤點與一致性 → 隔離代理程式 → 受控傳輸 → 加密儲存 → 驗證、切換與復原</text><g filter="url(#shadow)" font-family="Arial, sans-serif"><rect x="65" y="180" width="245" height="230" rx="24" fill="#132d4b" stroke="#3e7199"/><text x="92" y="224" fill="#8fe8ff" font-size="19" font-weight="700">1. 來源資料</text><text x="92" y="266" fill="#fff" font-size="25" font-weight="800">NFS / SMB / Object</text><text x="92" y="309" fill="#c7d7ea" font-size="17">• 資料分類與授權</text><text x="92" y="341" fill="#c7d7ea" font-size="17">• 停寫、快照或封存</text><text x="92" y="373" fill="#c7d7ea" font-size="17">• 白名單路徑</text><rect x="360" y="180" width="245" height="230" rx="24" fill="#132d4b" stroke="#ffb44d"/><text x="387" y="224" fill="#ffc36f" font-size="19" font-weight="700">2. DataSync agent</text><text x="387" y="266" fill="#fff" font-size="25" font-weight="800">隔離執行環境</text><text x="387" y="309" fill="#c7d7ea" font-size="17">• 受控管理網段</text><text x="387" y="341" fill="#c7d7ea" font-size="17">• 最小來源權限</text><text x="387" y="373" fill="#c7d7ea" font-size="17">• 健康與容量監控</text><rect x="655" y="180" width="245" height="230" rx="24" fill="#132d4b" stroke="#55d6a7"/><text x="682" y="224" fill="#70e6b5" font-size="19" font-weight="700">3. 受控傳輸</text><text x="682" y="266" fill="#fff" font-size="25" font-weight="800">Task execution</text><text x="682" y="309" fill="#c7d7ea" font-size="17">• 增量與頻寬限制</text><text x="682" y="341" fill="#c7d7ea" font-size="17">• IAM 短期工作階段</text><text x="682" y="373" fill="#c7d7ea" font-size="17">• 私有路徑與加密傳輸</text><rect x="950" y="180" width="385" height="230" rx="24" fill="#132d4b" stroke="#a88bff"/><text x="980" y="224" fill="#c3b3ff" font-size="19" font-weight="700">4. AWS 目的儲存</text><text x="980" y="266" fill="#fff" font-size="25" font-weight="800">S3 / EFS / FSx</text><text x="980" y="309" fill="#c7d7ea" font-size="17">• 阻擋公開存取與私有網路</text><text x="980" y="341" fill="#c7d7ea" font-size="17">• KMS 加密與受限 role</text><text x="980" y="373" fill="#c7d7ea" font-size="17">• 版本、生命週期與保留</text></g><g stroke="#73ddff" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M310 295H350"/><path d="M605 295H645"/><path d="M900 295H940"/></g><rect x="65" y="480" width="1270" height="300" rx="28" fill="#0d2037" stroke="#315676"/><text x="100" y="530" fill="url(#orange)" font-size="23" font-weight="800" font-family="Arial, sans-serif">5. 驗證、受控切換與持續治理</text><g font-family="Arial, sans-serif"><rect x="100" y="570" width="250" height="150" rx="20" fill="#152f4e"/><text x="125" y="608" fill="#fff" font-size="20" font-weight="700">資料驗證</text><text x="125" y="644" fill="#c7d7ea" font-size="16">檔案數、容量、抽樣雜湊</text><text x="125" y="674" fill="#c7d7ea" font-size="16">metadata、ACL、應用讀取</text><rect x="400" y="570" width="250" height="150" rx="20" fill="#152f4e"/><text x="425" y="608" fill="#fff" font-size="20" font-weight="700">監控與稽核</text><text x="425" y="644" fill="#c7d7ea" font-size="16">CloudTrail 控制面追溯</text><text x="425" y="674" fill="#c7d7ea" font-size="16">CloudWatch / EventBridge 告警</text><rect x="700" y="570" width="250" height="150" rx="20" fill="#152f4e"/><text x="725" y="608" fill="#fff" font-size="20" font-weight="700">切換與回復</text><text x="725" y="644" fill="#c7d7ea" font-size="16">停止來源寫入、最後同步</text><text x="725" y="674" fill="#c7d7ea" font-size="16">觀察期保留唯讀來源</text><rect x="1000" y="570" width="300" height="150" rx="20" fill="#152f4e"/><text x="1025" y="608" fill="#fff" font-size="20" font-weight="700">備份與跨區復原</text><text x="1025" y="644" fill="#c7d7ea" font-size="16">版本、不可變或跨帳號副本</text><text x="1025" y="674" fill="#c7d7ea" font-size="16">跨區副本與定期還原演練</text></g><path d="M1140 410V460H735" stroke="#73ddff" stroke-width="5" fill="none" marker-end="url(#arrow)"/></svg>