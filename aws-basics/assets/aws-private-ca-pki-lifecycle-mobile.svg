<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1420" viewBox="0 0 760 1420" role="img" aria-labelledby="title desc">
<title id="title">AWS Private CA 私有 PKI 行動版流程圖</title>
<desc id="desc">由安全帳號根 CA、區域從屬 CA、工作負載簽發、雙向 TLS 及稽核撤銷復原控制組成的垂直流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102449"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#8fe8ff"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter><style>.h{font:700 33px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 25px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 20px Inter,'Noto Sans TC',sans-serif;fill:#bed1ed}.m{font:700 18px Inter,'Noto Sans TC',sans-serif;fill:#ffcb8a}.box{fill:#10233f;stroke:#3b638e;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:5;marker-end:url(#arrow)}</style></defs>
<rect width="760" height="1420" rx="30" fill="url(#bg)"/><text x="46" y="65" class="h">私有 PKI 生命週期</text><text x="46" y="101" class="s">示意｜根 CA 與日常簽發分離</text>
<g filter="url(#shadow)"><rect x="70" y="145" width="620" height="165" rx="24" fill="#2a1b0a" stroke="#ff9900" stroke-width="3"/><text x="110" y="196" class="t">1｜安全帳號中的根 CA</text><text x="110" y="238" class="s">只簽署核准的從屬 CA</text><text x="110" y="275" class="m">MFA · 短期憑證 · 雙人核准</text></g><path d="M380 310 L380 365" class="line"/>
<g filter="url(#shadow)"><rect x="70" y="375" width="620" height="190" rx="24" class="box"/><text x="110" y="426" class="t">2｜區域／環境從屬 CA</text><text x="110" y="468" class="s">正式與測試分離，限制路徑長度</text><text x="110" y="506" class="s">核准終端憑證範本與名稱範圍</text><text x="110" y="540" class="m">發行者不得簽發新的 CA</text></g><path d="M380 565 L380 620" class="line"/>
<g filter="url(#shadow)"><rect x="70" y="630" width="620" height="215" rx="24" class="box"/><text x="110" y="681" class="t">3｜工作負載申請與輪替</text><text x="110" y="723" class="s">驗證身分 → CSR → 短效憑證</text><text x="110" y="761" class="s">私鑰留在端點並限制程序存取</text><text x="110" y="799" class="m">不進映像、Git、日誌或公開儲存</text></g><path d="M380 845 L380 900" class="line"/>
<g filter="url(#shadow)"><rect x="70" y="910" width="620" height="190" rx="24" class="box"/><text x="110" y="961" class="t">4｜雙向 TLS 與應用授權</text><text x="110" y="1003" class="s">驗證名稱、用途、信任鏈與效期</text><text x="110" y="1041" class="s">再對應角色、資料與 API 權限</text><text x="110" y="1075" class="m">憑證有效不代表已取得完整授權</text></g><path d="M380 1100 L380 1155" class="line"/>
<g filter="url(#shadow)"><rect x="70" y="1165" width="620" height="200" rx="24" fill="#0a1c33" stroke="#31c8e8" stroke-width="2"/><text x="110" y="1216" class="t">5｜撤銷、稽核與復原</text><text x="110" y="1258" class="s">CRL／OCSP · CloudTrail · 告警</text><text x="110" y="1296" class="s">信任鏈清冊 · CA 接班 · 跨區演練</text><text x="110" y="1334" class="m">備份 IaC 與程序，不匯出 CA 私鑰</text></g>
<text x="380" y="1390" text-anchor="middle" class="s">Dr. William｜AWS 基礎介紹</text></svg>
