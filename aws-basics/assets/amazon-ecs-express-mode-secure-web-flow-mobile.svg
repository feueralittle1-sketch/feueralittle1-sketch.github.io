<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1480" role="img" aria-labelledby="title desc">
<title id="title">Amazon ECS Express Mode 安全 Web 應用部署流程手機版</title>
<desc id="desc">垂直呈現核准映像經 Express Mode 建立 HTTPS 入口、跨可用區 Fargate tasks、自動擴縮與 Canary 部署，再連接機密、資料、監控及跨區重建。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a18"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fe8ff"/></marker><style>.h{font:700 25px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 20px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:400 16px Inter,'Noto Sans TC',sans-serif;fill:#bdd0ea}.box{fill:#10233e;stroke:#375a7d;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="720" height="1480" rx="28" fill="url(#bg)"/><text x="360" y="48" text-anchor="middle" class="h">示意｜ECS Express Mode 安全部署</text><text x="360" y="78" text-anchor="middle" class="s">整合被簡化，安全與復原責任仍存在</text>
<rect x="90" y="112" width="540" height="140" rx="22" class="box"/><text x="360" y="153" text-anchor="middle" class="t">可信容器映像</text><text x="360" y="188" text-anchor="middle" class="s">CI checks → ECR → 掃描・SBOM・核准</text><text x="360" y="220" text-anchor="middle" class="s">不可變版本／image digest</text>
<path d="M360 252V292" class="line"/><rect x="90" y="297" width="540" height="135" rx="22" class="box"/><text x="360" y="338" text-anchor="middle" class="t">Express Mode 協調入口</text><text x="360" y="373" text-anchor="middle" class="s">AWS domain + ACM + HTTPS ALB</text><text x="360" y="404" text-anchor="middle" class="s">public／private・health checks</text>
<path d="M360 432V472" class="line"/><rect x="55" y="477" width="610" height="325" rx="28" fill="#0c1c32" stroke="#ff9f32" stroke-width="3"/><text x="360" y="518" text-anchor="middle" class="t">Amazon ECS Service on AWS Fargate</text><rect x="90" y="555" width="250" height="140" rx="20" class="box"/><text x="215" y="594" text-anchor="middle" class="s">可用區 A</text><rect x="125" y="620" width="180" height="52" rx="15" fill="url(#orange)"/><text x="215" y="653" text-anchor="middle" class="t" fill="#071426">Fargate Task</text><rect x="380" y="555" width="250" height="140" rx="20" class="box"/><text x="505" y="594" text-anchor="middle" class="s">可用區 B</text><rect x="415" y="620" width="180" height="52" rx="15" fill="url(#orange)"/><text x="505" y="653" text-anchor="middle" class="t" fill="#071426">Fargate Task</text><text x="360" y="737" text-anchor="middle" class="s">Security Group・Task Role・短期憑證</text><text x="360" y="771" text-anchor="middle" class="s">Auto Scaling・Canary・告警回滾</text>
<path d="M360 802V842" class="line"/><rect x="65" y="847" width="590" height="155" rx="22" class="box"/><text x="360" y="888" text-anchor="middle" class="t">機密與持久資料</text><text x="360" y="924" text-anchor="middle" class="s">Secrets Manager／Parameter Store + KMS</text><text x="360" y="957" text-anchor="middle" class="s">RDS・DynamoDB・S3・備份／PITR</text><text x="360" y="987" text-anchor="middle" class="s">狀態外部化・跨區資料保護</text>
<rect x="50" y="1045" width="300" height="205" rx="22" class="box"/><text x="200" y="1086" text-anchor="middle" class="t">角色與網路</text><text x="200" y="1121" text-anchor="middle" class="s">Infrastructure／Execution／Task</text><text x="200" y="1153" text-anchor="middle" class="s">私有子網・受控出站</text><text x="200" y="1185" text-anchor="middle" class="s">VPC endpoints・WAF</text><text x="200" y="1217" text-anchor="middle" class="s">最小權限・MFA</text><rect x="370" y="1045" width="300" height="205" rx="22" class="box"/><text x="520" y="1086" text-anchor="middle" class="t">監控與稽核</text><text x="520" y="1121" text-anchor="middle" class="s">CloudWatch・CloudTrail</text><text x="520" y="1153" text-anchor="middle" class="s">ALB logs・VPC Flow Logs</text><text x="520" y="1185" text-anchor="middle" class="s">應用 metrics／traces</text><text x="520" y="1217" text-anchor="middle" class="s">保留・告警・漂移偵測</text>
