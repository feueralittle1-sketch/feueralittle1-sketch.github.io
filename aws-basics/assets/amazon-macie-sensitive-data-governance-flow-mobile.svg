<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Macie 手機版敏感資料治理流程示意圖</title>
  <desc id="desc">由上而下呈現多帳號 S3、Amazon Macie 探索、發現與分析紀錄、加密證據儲存、事件分流及資料擁有者修復驗證。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd089"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8fe8ff"/></marker>
    <style>.box{fill:#10243f;stroke:#31577d;stroke-width:2}.label{font:700 25px 'Noto Sans TC',sans-serif;fill:#fff}.small{font:500 18px 'Noto Sans TC',sans-serif;fill:#c6d6ed}.tiny{font:600 16px 'Noto Sans TC',sans-serif;fill:#ffcf91}.flow{fill:none;stroke:#8fe8ff;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="760" height="1320" rx="30" fill="url(#bg)"/>
  <text x="42" y="58" class="label" font-size="30">S3 敏感資料治理閉環</text>
  <text x="42" y="91" class="small">示意流程｜探索、證據、分流、修復</text>

  <rect x="85" y="130" width="590" height="145" rx="22" class="box"/>
  <text x="128" y="180" class="label">多帳號 S3</text>
  <text x="128" y="220" class="small">上傳區 · 資料湖 · 文件區</text>
  <text x="128" y="250" class="tiny">Block Public Access · KMS</text>
  <path d="M380 275V320" class="flow"/>

  <rect x="65" y="325" width="630" height="235" rx="25" fill="#152a43" stroke="url(#orange)" stroke-width="4"/>
  <text x="108" y="378" class="label">Amazon Macie</text>
  <text x="108" y="424" class="small">S3 清冊與政策風險評估</text>
  <text x="108" y="461" class="small">自動化探索＋目標工作</text>
  <text x="108" y="498" class="small">受管／自訂識別碼＋允許清單</text>
  <text x="108" y="535" class="tiny">區域性服務 · Organizations 委派管理</text>
  <path d="M380 560V605" class="flow"/>

  <rect x="85" y="610" width="590" height="160" rx="22" class="box"/>
  <text x="128" y="660" class="label">發現與分析紀錄</text>
  <text x="128" y="700" class="small">政策／敏感資料／無法分析缺口</text>
  <text x="128" y="738" class="tiny">通知只傳 finding ID 與風險資訊</text>
  <path d="M380 770V815" class="flow"/>

  <rect x="38" y="820" width="210" height="260" rx="20" class="box"/>
  <text x="66" y="868" class="label" font-size="21">證據保存</text>
  <text x="66" y="910" class="small">S3 版本控制</text>
  <text x="66" y="944" class="small">KMS 加密</text>
  <text x="66" y="978" class="small">保留策略</text>
  <text x="66" y="1012" class="small">存取稽核</text>

  <rect x="275" y="820" width="210" height="260" rx="20" class="box"/>
  <text x="303" y="868" class="label" font-size="21">事件分流</text>
  <text x="303" y="910" class="small">EventBridge</text>
  <text x="303" y="944" class="small">Security Hub</text>
  <text x="303" y="978" class="small">工單／通知</text>
  <text x="303" y="1012" class="small">風險排序</text>

  <rect x="512" y="820" width="210" height="260" rx="20" fill="#132c49" stroke="#7ef3cb" stroke-width="3"/>
  <text x="540" y="868" class="label" font-size="21">修復驗證</text>
  <text x="540" y="910" class="small">隔離／權限</text>
  <text x="540" y="944" class="small">遮罩／刪除</text>
  <text x="540" y="978" class="small">備份／回復</text>
  <text x="540" y="1012" class="small">重新掃描</text>
  <path d="M248 950H267" class="flow"/><path d="M485 950H504" class="flow"/>

  <text x="44" y="1165" class="small">共同責任：AWS 維護 Macie 服務與辨識能力；</text>
  <text x="44" y="1200" class="small">客戶治理 IAM、S3 公開存取、KMS、結果保存、</text>
  <text x="44" y="1235" class="small">事件處理、備份與跨區復原。</text>
  <text x="44" y="1280" class="tiny">發現不是自動修復，也不等於法規判定。</text>
</svg>
