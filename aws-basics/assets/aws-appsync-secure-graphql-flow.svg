<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS AppSync 安全 GraphQL 與即時資料流程示意</title>
  <desc id="desc">使用者經身分驗證、WAF 與查詢門禁進入 AppSync，再由欄位授權和最小權限 resolver 存取資料來源，並以訂閱、監控稽核、備份及跨區重建維持安全與韌性。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb454"/><stop offset="1" stop-color="#ff6f61"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73efff"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fe8ff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f4f8ff}.h{font-size:34px;font-weight:800}.s{font-size:21px;font-weight:700}.b{font-size:17px;fill:#bed0e8}.k{font-size:15px;fill:#8fe8ff}.card{fill:#10243e;stroke:#fff;stroke-opacity:.16;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffbd70;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1240" cy="105" r="190" fill="#ff9900" opacity=".07"/><circle cx="170" cy="790" r="220" fill="#63e6ff" opacity=".07"/>
  <text x="72" y="72" class="t h">AppSync：從身分、GraphQL 門禁到即時資料與復原</text>
  <text x="72" y="110" class="t b">示意流程｜平台管理 API 與連線，客戶治理欄位、resolver、資料、成本與跨區韌性</text>

  <g filter="url(#shadow)"><rect x="70" y="165" width="278" height="190" rx="26" class="card"/><rect x="70" y="165" width="278" height="12" rx="6" fill="url(#orange)"/>
  <text x="98" y="218" class="t s">1. 身分與入口防護</text><text x="98" y="258" class="t b">Cognito・IAM・OIDC・Authorizer</text><text x="98" y="290" class="t b">WAF・速率・Bot・網路邊界</text><text x="98" y="324" class="t k">MFA＋短期憑證＋拒絕優先</text></g>

  <g filter="url(#shadow)"><rect x="410" y="145" width="375" height="230" rx="28" class="card"/><rect x="410" y="145" width="375" height="12" rx="6" fill="url(#cyan)"/>
  <text x="440" y="200" class="t s">2. AppSync GraphQL 門禁</text><text x="440" y="241" class="t b">Schema・欄位授權・輸入驗證</text><text x="440" y="275" class="t b">分頁・Depth・Resolver count</text><text x="440" y="310" class="t k">Cache key 納入身分與租戶</text><text x="440" y="342" class="t k">Subscription 範圍與撤銷驗證</text></g>

  <g filter="url(#shadow)"><rect x="850" y="145" width="520" height="230" rx="28" fill="#10243e" stroke="#ffbd70" stroke-opacity=".65" stroke-width="2"/>
  <text x="882" y="197" class="t s">3. 最小權限 Resolver 與資料來源</text>
  <rect x="882" y="225" width="145" height="105" rx="18" fill="#182f4e" stroke="#ffbd70" stroke-opacity=".5"/><text x="912" y="266" class="t b">DynamoDB</text><text x="907" y="297" class="t k">條件・分頁・PITR</text>
  <rect x="1048" y="225" width="138" height="105" rx="18" fill="#122b46" stroke="#8fe8ff" stroke-opacity=".45"/><text x="1090" y="266" class="t b">Lambda</text><text x="1065" y="297" class="t k">批次・機密・驗證</text>
  <rect x="1205" y="225" width="135" height="105" rx="18" fill="#122b46" stroke="#63e6ff" stroke-opacity=".45"/><text x="1244" y="266" class="t b">其他來源</text><text x="1220" y="297" class="t k">RDS・HTTP・搜尋</text></g>

  <path d="M348 260 C374 260 385 260 410 260" class="line"/><path d="M785 260 C812 260 823 260 850 260" class="line"/>

  <g filter="url(#shadow)"><rect x="90" y="475" width="390" height="210" rx="28" class="card"/><text x="122" y="528" class="t s">4. 即時更新與用戶端</text><text x="122" y="571" class="t b">Mutation 觸發受控 Subscription</text><text x="122" y="607" class="t b">Token 到期・斷線・重連・補償</text><text x="122" y="643" class="t k">不得跨租戶或跨物件推送</text></g>

  <g filter="url(#shadow)"><rect x="525" y="475" width="390" height="210" rx="28" class="card"/><text x="557" y="528" class="t s">5. 監控、稽核與成本</text><text x="557" y="571" class="t b">CloudWatch・X-Ray・CloudTrail</text><text x="557" y="607" class="t b">錯誤・延遲・節流・連線・訊息</text><text x="557" y="643" class="t k">日誌去敏＋KMS＋預算告警</text></g>

  <g filter="url(#shadow)"><rect x="960" y="475" width="390" height="210" rx="28" class="card"/><text x="992" y="528" class="t s">6. 備份與跨區重建</text><text x="992" y="571" class="t b">Schema・Resolver・IAM・WAF IaC</text><text x="992" y="607" class="t b">資料來源備份・第二區域 API</text><text x="992" y="643" class="t k">端點切換＋RTO／RPO 演練</text></g>

  <path d="M1110 375 C1010 430 410 420 330 475" class="dash"/><path d="M1140 375 C1080 435 790 420 720 475" class="dash"/><path d="M1180 375 C1200 420 1180 445 1160 475" class="dash"/>
  <path d="M480 580 C500 580 505 580 525 580" class="line"/><path d="M915 580 C935 580 940 580 960 580" class="line"/>

  <rect x="70" y="748" width="1300" height="92" rx="24" fill="#0b1d34" stroke="#fff" stroke-opacity=".13"/>
  <text x="100" y="790" class="t s">共同責任重點</text><text x="335" y="790" class="t b">AWS 維護受管 GraphQL 與連線基礎；客戶負責 schema、授權、resolver、資料、日誌、成本與復原。</text><text x="335" y="820" class="t k">端點可用不等於欄位授權正確、查詢成本受控、資料已備份或跨區切換可執行。</text>
</svg>