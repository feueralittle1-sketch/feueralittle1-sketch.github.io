<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1540" viewBox="0 0 760 1540" role="img" aria-labelledby="title desc">
  <title id="title">Amazon EventBridge 安全事件路由手機版示意流程</title>
  <desc id="desc">可信訂單服務把最小化事件送入加密 EventBridge 自訂事件匯流排，規則精確分流至 SQS、Lambda 與中央安全帳號，失敗事件進入死信佇列，封存、監控及替代區域支援復原。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071528"/><stop offset="1" stop-color="#10264a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker><style>.b{fill:#10243f;stroke:#426b96;stroke-width:2}.g{fill:#102f31;stroke:#49d6b2;stroke-width:2}.o{fill:#392612;stroke:#ffb64d;stroke-width:2}.t{font:700 28px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 20px Inter,'Noto Sans TC',sans-serif;fill:#bed0e9}.k{font:700 20px Inter,'Noto Sans TC',sans-serif;fill:#8fe8ff}.l{fill:none;stroke:#8fe8ff;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="760" height="1540" rx="32" fill="url(#bg)"/>
  <text x="46" y="66" class="t">示意：EventBridge 安全路由</text><text x="46" y="102" class="s">精確比對、失敗隔離、監控與重播</text>
  <rect x="70" y="150" width="620" height="155" rx="24" class="b"/><text x="105" y="202" class="k">01 可信事件來源</text><text x="105" y="248" class="t">訂單服務</text><text x="335" y="248" class="s">短期角色・版本・資料最小化</text>
  <path d="M380 305V360" class="l"/>
  <rect x="70" y="360" width="620" height="205" rx="24" class="o"/><text x="105" y="412" class="k">02 受控事件路由</text><text x="105" y="457" class="t">加密 EventBridge 匯流排</text><text x="105" y="502" class="s">精確事件模式・目標角色・有限重試</text><text x="105" y="535" class="s">KMS・跨帳號來源限制</text>
  <path d="M380 565V620" class="l"/>
  <rect x="70" y="620" width="620" height="145" rx="24" class="g"/><text x="105" y="670" class="k">履約事件</text><text x="105" y="715" class="t">SQS 佇列</text><text x="355" y="715" class="s">緩衝・冪等消費</text>
  <path d="M380 765V820" class="l"/>
  <rect x="70" y="820" width="620" height="145" rx="24" class="g"/><text x="105" y="870" class="k">通知事件</text><text x="105" y="915" class="t">Lambda</text><text x="355" y="915" class="s">併發與重複控制</text>
  <path d="M380 965V1020" class="l"/>
  <rect x="70" y="1020" width="620" height="145" rx="24" class="g"/><text x="105" y="1070" class="k">稽核事件</text><text x="105" y="1115" class="t">中央安全帳號</text><text x="400" y="1115" class="s">來源限制</text>
  <path d="M380 1165V1220" class="l"/>
  <rect x="70" y="1220" width="620" height="120" rx="24" class="o"/><text x="105" y="1270" class="k">永久失敗</text><text x="300" y="1270" class="t">加密標準 SQS DLQ</text>
  <rect x="70" y="1380" width="620" height="115" rx="24" class="b"/><text x="105" y="1425" class="k">治理與復原</text><text x="105" y="1464" class="s">封存重播・CloudWatch・CloudTrail・替代區域</text>
</svg>
