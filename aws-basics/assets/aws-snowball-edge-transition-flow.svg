<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Snowball Edge 既有工作負載與轉移選型示意</title>
  <desc id="desc">從資料盤點、既有 Snowball Edge 安全作業，到 DataSync、Data Transfer Terminal、合作夥伴方案與 Outposts 的替代選型流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffbf66"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f8fbff}.h{font-size:34px;font-weight:800}.s{font-size:18px;fill:#bcd0eb}.box{fill:#10233f;stroke:#365b83;stroke-width:2}.accent{fill:#142e50;stroke:#ffad35;stroke-width:2}.alt{fill:#0d3342;stroke:#4ed9c4;stroke-width:2}.warn{fill:#3a2131;stroke:#fb7185;stroke-width:2}.label{font-size:22px;font-weight:800}.body{font-size:17px;fill:#c9d8ed}.line{fill:none;stroke:#79ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="900" rx="36" fill="url(#bg)"/>
  <text x="70" y="75" class="t h">Snowball Edge：既有安全作業與遷移決策</text>
  <text x="70" y="112" class="t s">示意流程｜2025-11-07 起終止銷售，不再適合作為新客戶的新建方案</text>

  <g filter="url(#shadow)"><rect x="70" y="160" width="250" height="125" rx="22" class="box"/><text x="95" y="200" class="t label">1. 盤點需求</text><text x="95" y="235" class="t body">資料量／期限／頻寬</text><text x="95" y="264" class="t body">地點／RTO／RPO／敏感度</text></g>
  <path d="M320 222H380" class="line"/>
  <g filter="url(#shadow)"><rect x="390" y="160" width="290" height="125" rx="22" class="warn"/><text x="415" y="200" class="t label">2. 服務生命週期門檻</text><text x="415" y="235" class="t body">新客戶：改選替代方案</text><text x="415" y="264" class="t body">既有客戶：確認可用權益與退場</text></g>

  <path d="M535 285V350" class="line"/>
  <g filter="url(#shadow)"><rect x="70" y="365" width="930" height="230" rx="28" class="accent"/><text x="100" y="410" class="t label">既有客戶的 Snowball Edge 受控作業鏈</text>
    <rect x="105" y="445" width="180" height="105" rx="18" class="box"/><text x="125" y="478" class="t body">建立工作與角色</text><text x="125" y="507" class="t body">最小權限／KMS</text><text x="125" y="536" class="t body">通知與負責人</text>
    <rect x="330" y="445" width="180" height="105" rx="18" class="box"/><text x="350" y="478" class="t body">驗證裝置與封條</text><text x="350" y="507" class="t body">Manifest／解鎖碼</text><text x="350" y="536" class="t body">分開保管</text>
    <rect x="555" y="445" width="180" height="105" rx="18" class="box"/><text x="575" y="478" class="t body">本機複製與校驗</text><text x="575" y="507" class="t body">網路隔離／日誌</text><text x="575" y="536" class="t body">雜湊與完整性</text>
    <rect x="780" y="445" width="180" height="105" rx="18" class="box"/><text x="800" y="478" class="t body">運送、匯入、驗收</text><text x="800" y="507" class="t body">追蹤／CloudTrail</text><text x="800" y="536" class="t body">S3 控制與刪除證據</text>
    <path d="M285 498H322M510 498H547M735 498H772" class="line"/>
  </g>

  <path d="M680 222H1060" class="line"/>
  <g filter="url(#shadow)"><rect x="1075" y="160" width="255" height="125" rx="22" class="alt"/><text x="1100" y="200" class="t label">3. 選替代路徑</text><text x="1100" y="235" class="t body">依傳輸模式與邊緣需求</text><text x="1100" y="264" class="t body">做 PoC、成本與復原驗證</text></g>
  <path d="M1202 285V335" class="line"/>
  <g filter="url(#shadow)"><rect x="1040" y="350" width="320" height="245" rx="28" class="alt"/><text x="1070" y="394" class="t label">AWS 官方替代方向</text><text x="1070" y="438" class="t body">線上傳輸：AWS DataSync</text><text x="1070" y="477" class="t body">實體高速上傳：Data Transfer Terminal</text><text x="1070" y="516" class="t body">其他離線需求：AWS Partner 方案</text><text x="1070" y="555" class="t body">邊緣運算：AWS Outposts</text></g>

  <path d="M535 595V665" class="line"/>
  <path d="M1200 595V665" class="line"/>
  <g filter="url(#shadow)"><rect x="210" y="680" width="980" height="145" rx="28" class="box"/><text x="245" y="724" class="t label">共同治理閉環</text><text x="245" y="764" class="t body">IAM 最小權限與 MFA／短期憑證　•　來源網路與公開存取控制　•　KMS 與秘密管理　•　CloudTrail／CloudWatch</text><text x="245" y="801" class="t body">資料完整性與刪除證據　•　S3 版本／備份／跨區復原　•　成本、配額、供應能力與退場里程碑持續驗證</text></g>
</svg>
