<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Verified Access 零信任應用存取流程示意</title>
  <desc id="desc">使用者從受管裝置連到 Verified Access，服務綜合身分與裝置信任資料，以群組及端點政策逐次判斷，僅將核准流量送往私有應用，並把存取日誌送往監控與稽核服務。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a4c"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd080"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#7de3ff"/></marker>
    <style>.box{fill:#0d203a;stroke:#385b7d;stroke-width:2}.accent{fill:#132b48;stroke:#ffad3d;stroke-width:3}.t{font:700 28px system-ui,sans-serif;fill:#fff}.s{font:500 20px system-ui,sans-serif;fill:#bcd0ea}.k{font:700 18px system-ui,sans-serif;fill:#ffd28f}.arrow{fill:none;stroke:#7de3ff;stroke-width:5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7de3ff;stroke-width:3;stroke-dasharray:10 10;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="720" y="70" text-anchor="middle" class="t" font-size="38">AWS Verified Access：每次請求都先驗證，再連到私有應用</text>
  <text x="720" y="108" text-anchor="middle" class="s">示意架構｜身分、裝置信任、Cedar 政策、私有端點與集中稽核</text>

  <g filter="url(#shadow)"><rect class="box" x="70" y="300" width="250" height="190" rx="24"/><circle cx="195" cy="350" r="30" fill="#7de3ff"/><path d="M145 440c12-45 88-45 100 0" fill="none" stroke="#7de3ff" stroke-width="16" stroke-linecap="round"/><text x="195" y="535" text-anchor="middle" class="t">使用者與受管裝置</text><text x="195" y="570" text-anchor="middle" class="s">瀏覽器／Connectivity Client</text></g>

  <g filter="url(#shadow)"><rect class="box" x="400" y="165" width="280" height="150" rx="24"/><text x="540" y="220" text-anchor="middle" class="k">身分信任提供者</text><text x="540" y="260" text-anchor="middle" class="s">IAM Identity Center／OIDC</text><text x="540" y="290" text-anchor="middle" class="s">MFA、群組、短期工作階段</text></g>
  <g filter="url(#shadow)"><rect class="box" x="400" y="485" width="280" height="150" rx="24"/><text x="540" y="540" text-anchor="middle" class="k">裝置信任提供者</text><text x="540" y="580" text-anchor="middle" class="s">合規、修補、端點防護</text><text x="540" y="610" text-anchor="middle" class="s">遺失或高風險裝置拒絕</text></g>

  <g filter="url(#shadow)"><rect class="accent" x="755" y="245" width="330" height="310" rx="30"/><text x="920" y="305" text-anchor="middle" class="t">Verified Access</text><rect x="805" y="340" width="230" height="72" rx="18" fill="#08192d" stroke="#ffad3d"/><text x="920" y="385" text-anchor="middle" class="k">群組政策</text><rect x="805" y="435" width="230" height="72" rx="18" fill="#08192d" stroke="#ffad3d"/><text x="920" y="480" text-anchor="middle" class="k">端點政策</text><text x="920" y="595" text-anchor="middle" class="s">預設拒絕 · 持續評估</text></g>

  <g filter="url(#shadow)"><rect class="box" x="1170" y="285" width="220" height="220" rx="24"/><text x="1280" y="345" text-anchor="middle" class="k">私有應用</text><text x="1280" y="390" text-anchor="middle" class="s">ALB／網路介面</text><text x="1280" y="430" text-anchor="middle" class="s">安全群組只允許</text><text x="1280" y="462" text-anchor="middle" class="s">核准入口與連接埠</text></g>

  <path class="arrow" d="M320 395H735"/><path class="dash" d="M680 240H760"/><path class="dash" d="M680 560H760"/><path class="arrow" d="M1085 395H1150"/>

  <g filter="url(#shadow)"><rect class="box" x="755" y="690" width="635" height="120" rx="24"/><text x="1072" y="737" text-anchor="middle" class="k">存取記錄與治理證據</text><text x="1072" y="777" text-anchor="middle" class="s">CloudWatch Logs／S3／Data Firehose · CloudTrail · 告警與事件調查</text></g>
  <path class="dash" d="M920 555V675"/>

  <rect x="70" y="700" width="575" height="110" rx="22" fill="#0b1d34" stroke="#355b7e"/>
  <text x="100" y="744" class="k">共同控制</text><text x="100" y="780" class="s">IAM 最小權限、KMS、Secrets Manager、備份與跨區復原演練</text>
  <text x="70" y="860" class="s">原創示意圖｜Dr. William · 2026-10-25</text>
</svg>
