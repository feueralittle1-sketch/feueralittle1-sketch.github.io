<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc">
<title id="title">AWS Client VPN 手機版安全遠端存取示意圖</title><desc id="desc">受管端點經 SAML 與 MFA、Client VPN、多可用區關聯、授權路由與安全群組存取分層資源，再由監控加密及跨區復原保護。</desc>
