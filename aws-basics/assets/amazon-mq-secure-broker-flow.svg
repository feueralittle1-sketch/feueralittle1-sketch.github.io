<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Amazon MQ 安全訊息代理與復原流程</title>
<desc id="desc">Producer 經身分、私有網路與 TLS 連入 Amazon MQ，訊息經 queue、topic 或 exchange 路由給冪等 consumer，並由 dead-letter、CloudWatch、CloudTrail、KMS 與跨區復原支援。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="mq" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffca80"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79e7ff"/></marker><style>.h{font:700 42px system-ui,sans-serif;fill:#fff}.s{font:600 23px system-ui,sans-serif;fill:#dceaff}.t{font:500 19px system-ui,sans-serif;fill:#b9cbe7}.k{font:700 18px system-ui,sans-serif;fill:#081426}.box{fill:#122b4d;stroke:#34577c;stroke-width:2}.guard{fill:#11243d;stroke:#69dff5;stroke-width:2}.flow{fill:none;stroke:#79e7ff;stroke-width:5;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1000" rx="42" fill="url(#bg)"/><text x="70" y="78" class="h">Amazon MQ｜相容協定、可靠投遞與安全治理</text><text x="72" y="116" class="t">示意架構，不代表特定企業部署</text>
<rect x="60" y="165" width="300" height="360" rx="28" class="box" filter="url(#shadow)"/><text x="95" y="220" class="s">Producer 與舊系統</text><rect x="95" y="255" width="230" height="68" rx="16" class="guard"/><text x="125" y="296" class="s">JMS / AMQP</text><rect x="95" y="345" width="230" height="68" rx="16" class="guard"/><text x="124" y="386" class="s">MQTT / STOMP</text><text x="95" y="460" class="t">事件 ID・Schema</text><text x="95" y="492" class="t">bounded retry・backoff</text>
<rect x="425" y="160" width="330" height="375" rx="30" class="guard" filter="url(#shadow)"/><text x="464" y="214" class="s">進入前安全邊界</text><text x="465" y="265" class="t">✓ 私有 subnet</text><text x="465" y="307" class="t">✓ Security Group</text><text x="465" y="349" class="t">✓ TLS 與憑證驗證</text><text x="465" y="391" class="t">✓ Broker 身分驗證</text><text x="465" y="433" class="t">✓ Destination 最小授權</text><text x="465" y="475" class="t">✓ Secrets Manager</text>
<rect x="820" y="135" width="430" height="455" rx="34" fill="#18243c" stroke="#ffb44c" stroke-width="3" filter="url(#shadow)"/><rect x="855" y="175" width="360" height="76" rx="22" fill="url(#mq)"/><text x="934" y="225" class="k">Amazon MQ Broker</text><text x="865" y="300" class="s">ActiveMQ 或 RabbitMQ</text><rect x="865" y="330" width="155" height="72" rx="18" class="box"/><text x="910" y="374" class="s">Queue</text><rect x="1040" y="330" width="165" height="72" rx="18" class="box"/><text x="1072" y="374" class="s">Topic / Exchange</text><rect x="865" y="425" width="340" height="82" rx="18" class="guard"/><text x="893" y="461" class="t">Multi-AZ deployment</text><text x="893" y="490" class="t">KMS at rest・TLS in transit</text><text x="865" y="548" class="t">ack・TTL・prefetch・back pressure</text>
<rect x="1310" y="165" width="240" height="360" rx="28" class="box" filter="url(#shadow)"/><text x="1344" y="220" class="s">Consumer</text><text x="1344" y="272" class="t">自動重連</text><text x="1344" y="311" class="t">冪等寫入</text><text x="1344" y="350" class="t">唯一鍵 / 對帳</text><rect x="1344" y="391" width="170" height="80" rx="18" class="guard"/><text x="1372" y="426" class="t">失敗隔離</text><text x="1360" y="456" class="t">Dead-letter</text>
<path d="M360 345H425" class="flow"/><path d="M755 345H820" class="flow"/><path d="M1250 345H1310" class="flow"/>
<rect x="70" y="660" width="460" height="250" rx="28" class="guard"/><text x="108" y="716" class="s">偵測與稽核</text><text x="108" y="765" class="t">CloudWatch：積壓、訊息年齡、連線</text><text x="108" y="806" class="t">Broker logs：操作與認證異常</text><text x="108" y="847" class="t">CloudTrail：建立、更新、刪除與 KMS</text><text x="108" y="888" class="t">告警 → Runbook → 演練證據</text>
<rect x="570" y="660" width="420" height="250" rx="28" class="box"/><text x="608" y="716" class="s">可靠投遞控制</text><text x="608" y="765" class="t">Publisher confirms / persistent message</text><text x="608" y="806" class="t">有限重試 / poison message 隔離</text><text x="608" y="847" class="t">容量上限 / TTL / back pressure</text><text x="608" y="888" class="t">事件 ID / 冪等 / 業務對帳</text>
<rect x="1030" y="660" width="500" height="250" rx="28" class="guard"/><text x="1068" y="716" class="s">區域復原</text><text x="1068" y="765" class="t">第二區域：Broker・KMS・VPC・身分</text><text x="1068" y="806" class="t">ActiveMQ CRDR 或核准補償路徑</text><text x="1068" y="847" class="t">切換：DNS・重連・重送・缺口處理</text><text x="1068" y="888" class="t">量測 RPO / RTO 並定期切回演練</text>
<path d="M1040 590C970 630 900 640 850 660" class="flow"/><path d="M1250 590C1300 620 1320 630 1320 660" class="flow"/>
</svg>
