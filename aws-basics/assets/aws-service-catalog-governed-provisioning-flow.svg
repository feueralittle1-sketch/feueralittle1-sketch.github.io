<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Service Catalog 受控自助部署流程</title>
<desc id="desc">平台團隊審查基礎設施程式碼後發布 Service Catalog 產品與版本，經 Portfolio、Constraint、短期身分與 Launch role 部署受控資源，再進行監控、更新與復原。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#70d9ff"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1390" cy="90" r="230" fill="#ff9900" opacity=".06"/><circle cx="150" cy="820" r="250" fill="#70d9ff" opacity=".06"/>
<text x="80" y="82" fill="#fff" font-family="Arial, Noto Sans TC, sans-serif" font-size="42" font-weight="700">AWS Service Catalog：核准產品到受控部署</text>
<text x="80" y="126" fill="#a9bddc" font-family="Arial, Noto Sans TC, sans-serif" font-size="22">示意流程｜版本審查、目錄門禁、最小權限與生命週期治理</text>
<g font-family="Arial, Noto Sans TC, sans-serif" filter="url(#shadow)">
  <g transform="translate(55 185)"><rect width="285" height="200" rx="24" fill="#112946" stroke="#49769b"/><rect width="285" height="12" rx="6" fill="#70d9ff"/><text x="24" y="55" fill="#fff" font-size="27" font-weight="700">1. 標準化需求</text><text x="24" y="96" fill="#c9d8ec" font-size="20">資料分類 · 成本中心</text><text x="24" y="128" fill="#c9d8ec" font-size="20">網路 · 加密 · 備份</text><text x="24" y="160" fill="#c9d8ec" font-size="20">擁有者 · RTO / RPO</text></g>
  <g transform="translate(395 185)"><rect width="310" height="200" rx="24" fill="#112946" stroke="#49769b"/><rect width="310" height="12" rx="6" fill="#70d9ff"/><text x="24" y="55" fill="#fff" font-size="27" font-weight="700">2. 模板與版本審查</text><text x="24" y="96" fill="#c9d8ec" font-size="20">CloudFormation / Terraform</text><text x="24" y="128" fill="#c9d8ec" font-size="20">靜態政策 · 權限 · 成本</text><text x="24" y="160" fill="#c9d8ec" font-size="20">建立 / 更新 / 回復測試</text></g>
  <g transform="translate(760 185)"><rect width="350" height="200" rx="24" fill="#1b304a" stroke="#ffb454"/><rect width="350" height="12" rx="6" fill="url(#accent)"/><text x="24" y="55" fill="#fff" font-size="27" font-weight="700">3. 目錄治理門禁</text><text x="24" y="96" fill="#ffe2bd" font-size="20">Product · Version · Portfolio</text><text x="24" y="128" fill="#ffe2bd" font-size="20">Template / Launch constraint</text><text x="24" y="160" fill="#ffe2bd" font-size="20">TagOptions · 帳號分享</text></g>
  <g transform="translate(1165 185)"><rect width="380" height="200" rx="24" fill="#112946" stroke="#49769b"/><rect width="380" height="12" rx="6" fill="#70d9ff"/><text x="24" y="55" fill="#fff" font-size="27" font-weight="700">4. 使用者受控選用</text><text x="24" y="96" fill="#c9d8ec" font-size="20">IAM Identity Center · MFA</text><text x="24" y="128" fill="#c9d8ec" font-size="20">短期工作階段 · 核准參數</text><text x="24" y="160" fill="#c9d8ec" font-size="20">成本 / 擁有者 / 環境標籤</text></g>
  <path d="M340 285H380" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M705 285H745" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M1110 285H1150" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(105 510)"><rect width="385" height="195" rx="24" fill="#1b304a" stroke="#ffb454"/><text x="24" y="52" fill="#fff" font-size="27" font-weight="700">5. Launch role 部署</text><text x="24" y="94" fill="#ffe2bd" font-size="20">來源條件 · 最小權限</text><text x="24" y="126" fill="#ffe2bd" font-size="20">CloudFormation / Engine</text><text x="24" y="158" fill="#ffe2bd" font-size="20">私有網路 · KMS · 機密管理</text></g>
  <g transform="translate(610 510)"><rect width="380" height="195" rx="24" fill="#112946" stroke="#49769b"/><text x="24" y="52" fill="#fff" font-size="27" font-weight="700">6. 監控與稽核</text><text x="24" y="94" fill="#c9d8ec" font-size="20">CloudTrail · CloudWatch</text><text x="24" y="126" fill="#c9d8ec" font-size="20">部署失敗 · 漂移 · 異常量</text><text x="24" y="158" fill="#c9d8ec" font-size="20">SNS / 工單 · 責任分派</text></g>
  <g transform="translate(1110 510)"><rect width="385" height="195" rx="24" fill="#112946" stroke="#49769b"/><text x="24" y="52" fill="#fff" font-size="27" font-weight="700">7. 更新與復原</text><text x="24" y="94" fill="#c9d8ec" font-size="20">測試 Portfolio · 分批升級</text><text x="24" y="126" fill="#c9d8ec" font-size="20">備份 · 停止條件 · 回復</text><text x="24" y="158" fill="#c9d8ec" font-size="20">舊版本淘汰 · 跨區重建</text></g>
  <path d="M1355 400V455H300V495" fill="none" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M490 607H595" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M990 607H1095" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1300 720V800H295V720" fill="none" stroke="#ffb454" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <text x="500" y="846" fill="#ffcf91" font-size="22" font-weight="700">回饋治理：修正產品版本、Constraint、Launch role 與復原程序</text>
</g>
<g font-family="Arial, Noto Sans TC, sans-serif"><rect x="65" y="742" width="430" height="92" rx="18" fill="#0c2038" stroke="#355d7b"/><text x="89" y="777" fill="#fff" font-size="20" font-weight="700">安全底線</text><text x="89" y="810" fill="#a9bddc" font-size="17">最小權限 · 公開存取封鎖 · KMS · 稽核</text><rect x="1080" y="742" width="455" height="92" rx="18" fill="#0c2038" stroke="#355d7b"/><text x="1104" y="777" fill="#fff" font-size="20" font-weight="700">可靠性底線</text><text x="1104" y="810" fill="#a9bddc" font-size="17">版本保留 · 失敗回復 · 備份 · 跨區重建</text></g>
</svg>
