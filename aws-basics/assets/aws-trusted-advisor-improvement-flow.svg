<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">AWS Trusted Advisor 最佳實務改善閉環示意圖</title>
<desc id="desc">多個 AWS 帳號與資源經六類 Trusted Advisor 檢查，形成建議後進入風險分級、責任分派、核准修復、交叉驗證與例外覆核，最後回到持續檢查。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#102746"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd17a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65d9ff"/></marker></defs>
<rect width="1440" height="920" rx="38" fill="url(#bg)"/><circle cx="1250" cy="110" r="230" fill="#ff9900" opacity=".07"/><circle cx="150" cy="810" r="260" fill="#55d6ff" opacity=".06"/>
<text x="72" y="78" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="38" font-weight="700">Trusted Advisor：從建議到可驗證改善</text><text x="72" y="116" fill="#9fb6d6" font-family="Arial,'Noto Sans TC',sans-serif" font-size="20">示意流程｜建議不是自動變更命令，也不是完整安全或合規證明</text>
<g filter="url(#shadow)"><rect x="60" y="170" width="260" height="250" rx="24" fill="#112b49" stroke="#315779"/><text x="90" y="215" fill="#8fe8ff" font-size="22" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">AWS 環境範圍</text><g fill="#dce9fb" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif"><text x="92" y="260">• Organizations / OU</text><text x="92" y="298">• 正式與非正式帳號</text><text x="92" y="336">• 多區域服務與資源</text><text x="92" y="374">• 擁有者與資料分級</text></g></g>
<path d="M320 295H385" stroke="#65d9ff" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="400" y="150" width="330" height="290" rx="24" fill="#172b45" stroke="#ffad36" stroke-width="2"/><text x="430" y="198" fill="url(#accent)" font-size="24" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">Trusted Advisor 六類檢查</text><g font-size="18" font-family="Arial,'Noto Sans TC',sans-serif"><rect x="430" y="225" width="125" height="42" rx="12" fill="#28415f"/><text x="458" y="252" fill="#fff">成本最佳化</text><rect x="575" y="225" width="125" height="42" rx="12" fill="#28415f"/><text x="618" y="252" fill="#fff">效能</text><rect x="430" y="280" width="125" height="42" rx="12" fill="#28415f"/><text x="474" y="307" fill="#fff">安全</text><rect x="575" y="280" width="125" height="42" rx="12" fill="#28415f"/><text x="618" y="307" fill="#fff">容錯</text><rect x="430" y="335" width="125" height="42" rx="12" fill="#28415f"/><text x="458" y="362" fill="#fff">服務配額</text><rect x="575" y="335" width="125" height="42" rx="12" fill="#28415f"/><text x="601" y="362" fill="#fff">營運卓越</text></g><text x="430" y="410" fill="#a8bad8" font-size="17" font-family="Arial,'Noto Sans TC',sans-serif">結果含資源、狀態、條件與建議動作</text></g>
<path d="M730 295H800" stroke="#65d9ff" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="815" y="170" width="270" height="250" rx="24" fill="#112b49" stroke="#315779"/><text x="845" y="215" fill="#8fe8ff" font-size="22" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">企業風險分級</text><g fill="#dce9fb" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif"><text x="847" y="260">• 外部暴露與敏感資料</text><text x="847" y="298">• 可用性與法規影響</text><text x="847" y="336">• 成本與修復複雜度</text><text x="847" y="374">• 時效與結果交叉確認</text></g></g>
<path d="M1085 295H1155" stroke="#65d9ff" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="1170" y="170" width="210" height="250" rx="24" fill="#112b49" stroke="#315779"/><text x="1197" y="215" fill="#8fe8ff" font-size="22" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">分派與核准</text><g fill="#dce9fb" font-size="17" font-family="Arial,'Noto Sans TC',sans-serif"><text x="1200" y="260">責任人與期限</text><text x="1200" y="298">變更與回復計畫</text><text x="1200" y="336">資安 / FinOps 覆核</text><text x="1200" y="374">驗收證據定義</text></g></g>
<path d="M1275 420V500" stroke="#65d9ff" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="1030" y="520" width="350" height="245" rx="24" fill="#102a44" stroke="#57d39b" stroke-width="2"/><text x="1060" y="568" fill="#7ff0b6" font-size="23" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">受控修復與交叉驗證</text><g fill="#dce9fb" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif"><text x="1062" y="615">• 維護時段 / 測試 / 回復</text><text x="1062" y="654">• Config / Security Hub CSPM</text><text x="1062" y="693">• CloudWatch / 服務原生指標</text><text x="1062" y="732">• 刷新後確認並關閉工單</text></g></g>
<path d="M1030 642H930" stroke="#65d9ff" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="600" y="520" width="310" height="245" rx="24" fill="#102a44" stroke="#ffbd70"/><text x="630" y="568" fill="#ffcb8a" font-size="23" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">例外與改善治理</text><g fill="#dce9fb" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif"><text x="632" y="615">• 排除理由與風險接受者</text><text x="632" y="654">• 補償控制與到期日</text><text x="632" y="693">• 重複根因轉成預防政策</text><text x="632" y="732">• 報告、日誌、備份與復原</text></g></g>
<path d="M600 642H500" stroke="#65d9ff" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="60" y="520" width="420" height="245" rx="24" fill="#102a44" stroke="#315779"/><text x="90" y="568" fill="#8fe8ff" font-size="23" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">可追蹤的改善閉環</text><g fill="#dce9fb" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif"><text x="92" y="615">EventBridge → 通知 / 工單 / 受控自動化</text><text x="92" y="654">CloudTrail → 誰檢視、排除或管理報告</text><text x="92" y="693">IAM + MFA + 短期憑證 → 限制管理權</text><text x="92" y="732">KMS + 私有儲存 → 保護報告與完成證據</text></g></g>
<path d="M195 520V465C195 450 210 440 230 440H565" fill="none" stroke="#ffad36" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="255" y="474" fill="#ffcb8a" font-size="17" font-family="Arial,'Noto Sans TC',sans-serif">持續刷新、重新分級與覆核</text>
<rect x="60" y="815" width="1320" height="60" rx="18" fill="#091728" stroke="#294c6c"/><text x="720" y="852" text-anchor="middle" fill="#c9dbef" font-size="19" font-family="Arial,'Noto Sans TC',sans-serif">共同責任：AWS 提供檢查與建議；客戶負責權限、判讀、變更、驗證、例外、備份與最終風險接受</text>
</svg>
