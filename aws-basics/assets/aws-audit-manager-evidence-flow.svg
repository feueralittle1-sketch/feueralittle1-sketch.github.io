<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Audit Manager 稽核證據流程</title>
  <desc id="desc">稽核要求經框架與控制連接 AWS Config、Security Hub CSPM、CloudTrail、AWS API 和人工證據，再由 Audit Manager 評估、委派覆核、產生報告並追蹤修復。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d8ff"/><stop offset="1" stop-color="#8fffe1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:30px;font-weight:800}.s{font-size:18px}.k{font-size:15px;font-weight:700;letter-spacing:.08em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="130" cy="90" r="180" fill="#ff9900" opacity=".08"/><circle cx="1320" cy="810" r="260" fill="#55d8ff" opacity=".07"/>
  <text x="74" y="86" class="t h">AWS Audit Manager 稽核證據流程</text>
  <text x="74" y="120" class="m s">示意：要求與控制 → 多源證據 → 評估覆核 → 報告與修復</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="184" width="260" height="432" rx="28"/>
    <text x="100" y="228" class="t k">01 稽核要求</text>
    <g transform="translate(100 260)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">標準框架</text></g>
    <g transform="translate(100 338)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">自訂框架</text></g>
    <g transform="translate(100 416)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">控制與控制集</text></g>
    <g transform="translate(100 494)"><rect width="200" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">帳號與區域範圍</text></g>
    <text x="100" y="590" class="m s">適用性 · 期間 · 責任人</text>
  </g>
  <path class="line" d="M330 400H390"/>
  <g filter="url(#shadow)">
    <rect class="box" x="390" y="184" width="300" height="432" rx="28"/>
    <text x="420" y="228" class="t k">02 證據來源</text>
    <g transform="translate(420 260)"><rect width="240" height="58" rx="16" fill="#162f50"/><text x="18" y="36" class="t s">AWS Config</text></g>
    <g transform="translate(420 330)"><rect width="240" height="58" rx="16" fill="#162f50"/><text x="18" y="36" class="t s">Security Hub CSPM</text></g>
    <g transform="translate(420 400)"><rect width="240" height="58" rx="16" fill="#162f50"/><text x="18" y="36" class="t s">CloudTrail / AWS API</text></g>
    <g transform="translate(420 470)"><rect width="240" height="58" rx="16" fill="#162f50"/><text x="18" y="36" class="t s">人工證據</text></g>
    <text x="420" y="578" class="m s">覆蓋 · 時間 · 資源 · 完整性</text>
  </g>
  <path class="line" d="M690 400H750"/>
  <g filter="url(#shadow)">
    <rect x="750" y="184" width="300" height="432" rx="28" fill="#122b49" stroke="#ffb657" stroke-width="2"/>
    <rect x="782" y="222" width="236" height="8" rx="4" fill="url(#orange)"/>
    <text x="782" y="278" class="t h">Audit Manager</text>
    <text x="782" y="316" class="m s">Assessment · Evidence</text>
    <g transform="translate(782 358)"><circle cx="15" cy="15" r="15" fill="#ff9900"/><text x="44" y="21" class="t s">持續資源評估</text></g>
    <g transform="translate(782 410)"><circle cx="15" cy="15" r="15" fill="#ffb657"/><text x="44" y="21" class="t s">證據搜尋與抽樣</text></g>
    <g transform="translate(782 462)"><circle cx="15" cy="15" r="15" fill="#ffd38a"/><text x="44" y="21" class="t s">控制集委派</text></g>
    <g transform="translate(782 514)"><circle cx="15" cy="15" r="15" fill="#8fe8ff"/><text x="44" y="21" class="t s">人工覆核與評論</text></g>
    <text x="782" y="584" class="m s">自動蒐證不等於合規結論</text>
  </g>
  <path class="line" d="M1050 400H1110"/>
  <g filter="url(#shadow)">
    <rect class="box" x="1110" y="184" width="260" height="432" rx="28"/>
    <text x="1140" y="228" class="t k">04 輸出與修復</text>
    <g transform="translate(1140 270)"><rect width="200" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">Assessment report</text></g>
    <g transform="translate(1140 352)"><rect width="200" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">例外與風險接受</text></g>
    <g transform="translate(1140 434)"><rect width="200" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">修復工單與再測試</text></g>
    <g transform="translate(1140 516)"><rect width="200" height="64" rx="16" fill="url(#cyan)"/><text x="18" y="39" style="font-family:Inter,'Noto Sans TC',sans-serif;fill:#072034;font-size:18px;font-weight:800">稽核追溯</text></g>
  </g>
  <path d="M1240 616V728H600V624" fill="none" stroke="#62e5c6" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <g transform="translate(190 704)"><rect width="1060" height="116" rx="24" fill="#0d1f35" stroke="#ffffff22" stroke-width="2"/><text x="36" y="42" class="t k">持續控制面</text><text x="36" y="78" class="m s">IAM 最小權限與 MFA／短期憑證　·　KMS　·　S3 公開存取阻擋　·　CloudTrail／EventBridge</text><text x="36" y="103" class="m s">來源覆蓋驗證　·　機密遮罩　·　Secrets Manager／Parameter Store　·　備份與跨區復原</text></g>
</svg>
