<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">AWS Transform MGN 伺服器重新託管流程</title><desc id="desc">來源伺服器經加密持續複寫到 AWS 隔離暫存區，再由受控啟動範本建立測試與切換 EC2，通過驗證後切換流量，最後納入監控備份與跨區復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a46"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#63e6ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#63e6ff"/></marker></defs>
<rect width="1440" height="920" rx="36" fill="url(#bg)"/><path d="M70 126H1370" stroke="url(#accent)" stroke-width="4"/><text x="72" y="76" fill="#fff" font-size="38" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">AWS Transform MGN：從來源伺服器到受治理的 EC2</text><text x="72" y="112" fill="#a8bad8" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">示意流程｜隔離與權限 → 持續複寫 → 測試 → 停寫切換 → 監控、備份與復原</text>
<g filter="url(#shadow)" font-family="Arial,'Noto Sans TC',sans-serif">
<rect x="70" y="180" width="260" height="210" rx="26" fill="#17243a" stroke="#ffb45c" stroke-width="2"/><circle cx="112" cy="222" r="18" fill="#ffb45c"/><text x="112" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">1</text><text x="146" y="230" fill="#fff" font-size="24" font-weight="800">來源與相依性</text><text x="96" y="276" fill="#c6d4eb" font-size="18"><tspan x="96">實體機／虛擬機／其他雲</tspan><tspan x="96" dy="31">應用、資料、DNS、AD</tspan><tspan x="96" dy="31">代理程式與最小權限</tspan></text>
<rect x="385" y="180" width="290" height="210" rx="26" fill="#17243a" stroke="#63e6ff" stroke-width="2"/><circle cx="427" cy="222" r="18" fill="#63e6ff"/><text x="427" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">2</text><text x="461" y="230" fill="#fff" font-size="24" font-weight="800">隔離暫存區</text><text x="411" y="276" fill="#c6d4eb" font-size="18"><tspan x="411">專用 staging subnet</tspan><tspan x="411" dy="31">複寫伺服器＋暫存 EBS</tspan><tspan x="411" dy="31">私有路徑、KMS、稽核</tspan></text>
<rect x="730" y="180" width="290" height="210" rx="26" fill="#17243a" stroke="#a78bfa" stroke-width="2"/><circle cx="772" cy="222" r="18" fill="#a78bfa"/><text x="772" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">3</text><text x="806" y="230" fill="#fff" font-size="24" font-weight="800">持續區塊複寫</text><text x="756" y="276" fill="#c6d4eb" font-size="18"><tspan x="756">初始同步＋持續變更</tspan><tspan x="756" dy="31">監控 lag 與 stalled event</tspan><tspan x="756" dy="31">固定加密與網路設定</tspan></text>
<rect x="1075" y="180" width="290" height="210" rx="26" fill="#17243a" stroke="#fb7185" stroke-width="2"/><circle cx="1117" cy="222" r="18" fill="#fb7185"/><text x="1117" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">4</text><text x="1151" y="230" fill="#fff" font-size="24" font-weight="800">受控啟動範本</text><text x="1101" y="276" fill="#c6d4eb" font-size="18"><tspan x="1101">私有子網路與安全群組</tspan><tspan x="1101" dy="31">EC2、EBS、IAM、KMS</tspan><tspan x="1101" dy="31">標籤、日誌與版本審查</tspan></text>
</g>
<g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M330 285H375"/><path d="M675 285H720"/><path d="M1020 285H1065"/></g><path d="M1220 408V470H225V525" stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)" font-family="Arial,'Noto Sans TC',sans-serif">
<rect x="70" y="535" width="380" height="230" rx="28" fill="#132d3d" stroke="#63e6ff" stroke-width="2"/><circle cx="115" cy="578" r="19" fill="#63e6ff"/><text x="115" y="585" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">5</text><text x="150" y="586" fill="#fff" font-size="27" font-weight="800">隔離測試波次</text><text x="98" y="635" fill="#c6d4eb" font-size="19"><tspan x="98">建立測試 EC2，不碰正式介面</tspan><tspan x="98" dy="34">驗證功能、資料、身分與效能</tspan><tspan x="98" dy="34">修正後重測並凍結範本版本</tspan></text>
<rect x="500" y="535" width="380" height="230" rx="28" fill="#222642" stroke="#a78bfa" stroke-width="2"/><circle cx="545" cy="578" r="19" fill="#a78bfa"/><text x="545" y="585" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">6</text><text x="580" y="586" fill="#fff" font-size="27" font-weight="800">停寫與正式切換</text><text x="528" y="635" fill="#c6d4eb" font-size="19"><tspan x="528">確認同步健康、建立最終備份</tspan><tspan x="528" dy="34">停止來源寫入並檢查一致性</tspan><tspan x="528" dy="34">啟動 cutover EC2、逐步導流</tspan></text>
<rect x="930" y="535" width="380" height="230" rx="28" fill="#2b2835" stroke="#ffb45c" stroke-width="2"/><circle cx="975" cy="578" r="19" fill="#ffb45c"/><text x="975" y="585" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">7</text><text x="1010" y="586" fill="#fff" font-size="27" font-weight="800">觀察、清理與治理</text><text x="958" y="635" fill="#c6d4eb" font-size="19"><tspan x="958">保留回復界線，再 finalize</tspan><tspan x="958" dy="34">清理複寫資源與過期權限</tspan><tspan x="958" dy="34">監控、修補、備份、跨區演練</tspan></text>
</g>
<g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M450 650H490"/><path d="M880 650H920"/></g>
<rect x="70" y="812" width="1240" height="60" rx="20" fill="#0b1a2b" stroke="#fff" stroke-opacity=".12"/><text x="690" y="849" text-anchor="middle" fill="#e6eefc" font-size="20" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">完成標準：複寫健康、資料一致、應用驗收、權限可稽核，且能備份、回復與跨區重建</text>
</svg>
