<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">AWS KMS 信封加密行動版示意流程</title>
  <desc id="desc">受控工作負載向 KMS 取得資料金鑰，在記憶體內加密資料，再把資料密文與加密後資料金鑰存入儲存層；CloudTrail、CloudWatch 與復原設計提供稽核與韌性控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102541"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffcb74"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8fe8ff"/></marker>
    <style>.h{font:700 30px system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#fff}.t{font:700 24px system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#fff}.s{font:400 19px system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#bfd0e8}.n{font:800 18px system-ui,sans-serif;fill:#071426}.line{stroke:#8fe8ff;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1500" rx="32" fill="url(#bg)"/>
  <text x="44" y="65" class="h">示意：KMS 信封加密</text>
  <text x="44" y="102" class="s">明文資料金鑰只在工作負載內短暫使用</text>

  <g>
    <rect x="48" y="155" width="624" height="225" rx="25" fill="#102b48" stroke="#46739b"/>
    <circle cx="95" cy="205" r="25" fill="#8fe8ff"/><text x="89" y="212" class="n">1</text>
    <text x="133" y="214" class="t">受控工作負載</text>
    <text x="85" y="265" class="s">IAM 短期角色＋私有網路／端點</text>
    <text x="85" y="305" class="s">呼叫 GenerateDataKey</text>
    <text x="85" y="345" class="s">不把明文資料金鑰寫入儲存層</text>

    <path d="M360 380v70" class="line"/>
    <rect x="48" y="470" width="624" height="250" rx="25" fill="#302411" stroke="#ffb34b"/>
    <circle cx="95" cy="520" r="25" fill="url(#orange)"/><text x="89" y="527" class="n">2</text>
    <text x="133" y="529" class="t">AWS KMS 金鑰</text>
    <text x="85" y="580" class="s">檢查 Key Policy、IAM 與 Grants</text>
    <text x="85" y="620" class="s">驗證加密內容綁定與金鑰狀態</text>
    <text x="85" y="660" class="s">回傳明文＋加密後資料金鑰</text>

    <path d="M360 720v70" class="line"/>
    <rect x="48" y="810" width="624" height="230" rx="25" fill="#102b48" stroke="#46739b"/>
    <circle cx="95" cy="860" r="25" fill="#8fe8ff"/><text x="89" y="867" class="n">3</text>
    <text x="133" y="869" class="t">只保存密文組合</text>
    <text x="85" y="920" class="s">資料密文＋加密後資料金鑰</text>
    <text x="85" y="960" class="s">套用備份、生命週期與跨區復原</text>
    <text x="85" y="1000" class="s">讀取時再由 KMS 授權解密資料金鑰</text>
  </g>

  <rect x="48" y="1095" width="624" height="300" rx="25" fill="#0d223a" stroke="#365875"/>
  <text x="84" y="1145" class="t">全流程控制</text>
  <text x="84" y="1195" class="s">• 最小權限、MFA、職責分離</text>
  <text x="84" y="1237" class="s">• CloudTrail 稽核、CloudWatch 告警</text>
  <text x="84" y="1279" class="s">• 金鑰停用／刪除核准與等待期</text>
  <text x="84" y="1321" class="s">• 配額、重試、備份可解密性與演練</text>
  <text x="84" y="1363" class="s">• 依需求評估 Multi-Region keys</text>
  <text x="48" y="1450" class="s">原創架構示意，不代表特定組織或正式部署。</text>
</svg>
