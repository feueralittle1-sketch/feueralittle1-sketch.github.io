<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Cost Anomaly Detection 異常支出事件回應流程</title>
<desc id="desc">AWS 帳務資料先經成本監視器與異常模型分析，再依門檻送出通知；責任人使用 Cost Explorer、CloudTrail、CloudWatch 與工單確認根因，完成受控修正、驗證及回饋。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b4a"/></linearGradient><linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#76e4f7"/></marker></defs>
<rect width="1400" height="900" rx="36" fill="url(#bg)"/><circle cx="1250" cy="80" r="180" fill="#ff9900" opacity=".08"/><circle cx="120" cy="810" r="220" fill="#32d8ff" opacity=".06"/>
<text x="70" y="80" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">示意｜異常支出從偵測到受控修正</text><text x="70" y="120" fill="#9fc2df" font-family="Arial, sans-serif" font-size="21">Cost anomaly is a signal — evidence, ownership and verification complete the response.</text>
<g filter="url(#shadow)"><rect x="65" y="190" width="250" height="180" rx="24" fill="#10243d" stroke="#436a8d"/><text x="95" y="235" fill="#ffbd70" font-family="Arial, sans-serif" font-size="24" font-weight="700">1｜成本資料</text><text x="95" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="20">淨未混合成本</text><text x="95" y="314" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">帳號・服務・區域</text><text x="95" y="346" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">用量類型・時間模式</text></g>
<g filter="url(#shadow)"><rect x="400" y="190" width="280" height="180" rx="24" fill="#10243d" stroke="#ff9900" stroke-width="2"/><text x="430" y="235" fill="#ffbd70" font-family="Arial, sans-serif" font-size="24" font-weight="700">2｜監視與模型</text><text x="430" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="20">成本監視器定義範圍</text><text x="430" y="314" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">歷史模式・週期性</text><text x="430" y="346" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">預期值與實際值比較</text></g>
<g filter="url(#shadow)"><rect x="765" y="190" width="260" height="180" rx="24" fill="#10243d" stroke="#436a8d"/><text x="795" y="235" fill="#ffbd70" font-family="Arial, sans-serif" font-size="24" font-weight="700">3｜事件分流</text><text x="795" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="20">金額＋影響百分比</text><text x="795" y="314" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">Email・SNS</text><text x="795" y="346" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">User Notifications</text></g>
<g filter="url(#shadow)"><rect x="1110" y="190" width="225" height="180" rx="24" fill="#10243d" stroke="#436a8d"/><text x="1140" y="235" fill="#ffbd70" font-family="Arial, sans-serif" font-size="24" font-weight="700">4｜責任分派</text><text x="1140" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="20">FinOps</text><text x="1140" y="314" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">平台・服務擁有者</text><text x="1140" y="346" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">必要時升級資安</text></g>
<path d="M315 280H390" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/><path d="M680 280H755" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/><path d="M1025 280H1100" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="105" y="490" width="330" height="245" rx="26" fill="#0d2038" stroke="#5ba9c5"/><text x="140" y="540" fill="#80e6f5" font-family="Arial, sans-serif" font-size="25" font-weight="700">5｜證據調查</text><text x="140" y="590" fill="#fff" font-family="Arial, sans-serif" font-size="20">Cost Explorer：成本曲線</text><text x="140" y="630" fill="#fff" font-family="Arial, sans-serif" font-size="20">CloudTrail：誰改了什麼</text><text x="140" y="670" fill="#fff" font-family="Arial, sans-serif" font-size="20">CloudWatch：流量與可用性</text><text x="140" y="710" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">部署紀錄・資產清冊・工單</text></g>
<g filter="url(#shadow)"><rect x="535" y="490" width="330" height="245" rx="26" fill="#0d2038" stroke="#ff9900" stroke-width="2"/><text x="570" y="540" fill="#ffbd70" font-family="Arial, sans-serif" font-size="25" font-weight="700">6｜受控修正</text><text x="570" y="590" fill="#fff" font-family="Arial, sans-serif" font-size="20">擁有者確認與核准</text><text x="570" y="630" fill="#fff" font-family="Arial, sans-serif" font-size="20">停止・縮容・架構修正</text><text x="570" y="670" fill="#fff" font-family="Arial, sans-serif" font-size="20">正式環境排除與回復</text><text x="570" y="710" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">不依告警直接執行破壞動作</text></g>
<g filter="url(#shadow)"><rect x="965" y="490" width="330" height="245" rx="26" fill="#0d2038" stroke="#5ba9c5"/><text x="1000" y="540" fill="#80e6f5" font-family="Arial, sans-serif" font-size="25" font-weight="700">7｜驗證與改善</text><text x="1000" y="590" fill="#fff" font-family="Arial, sans-serif" font-size="20">成本趨勢回落</text><text x="1000" y="630" fill="#fff" font-family="Arial, sans-serif" font-size="20">服務與資料仍可用</text><text x="1000" y="670" fill="#fff" font-family="Arial, sans-serif" font-size="20">門檻・標籤・手冊更新</text><text x="1000" y="710" fill="#c6d9eb" font-family="Arial, sans-serif" font-size="18">回饋異常準確度並保存證據</text></g>
<path d="M1220 370V430H270V480" fill="none" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/><path d="M435 612H525" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/><path d="M865 612H955" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="260" y="800" width="880" height="58" rx="29" fill="url(#hot)"/><text x="700" y="838" text-anchor="middle" fill="#18212d" font-family="Arial, sans-serif" font-size="22" font-weight="700">偵測 ≠ 阻擋｜調查 → 核准 → 修正 → 驗證 → 學習</text>
</svg>
