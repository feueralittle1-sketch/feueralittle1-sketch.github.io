<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">AWS CodeDeploy 受控部署與安全回復示意流程</title>
<desc id="desc">可信成品經變更核准與最小權限部署角色送入綠色環境，完成掛鉤和合成交易驗證後逐步切換流量；CloudWatch 異常時回復藍色環境，CloudTrail 保存稽核證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker><style>.h{font:700 28px system-ui,sans-serif;fill:#fff}.t{font:600 20px system-ui,sans-serif;fill:#fff}.s{font:16px system-ui,sans-serif;fill:#c6d4eb}.box{fill:#10243e;stroke:#4b719c;stroke-width:2}.safe{fill:#12382f;stroke:#61ddb2;stroke-width:2}.warn{fill:#3b2920;stroke:#ffb45f;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/><text class="h" x="700" y="58" text-anchor="middle">示意｜從可信成品到可回復的漸進發布</text>
<g filter="url(#shadow)"><rect class="safe" x="55" y="115" width="245" height="150" rx="20"/><text class="t" x="177" y="158" text-anchor="middle">不可變成品</text><text class="s" x="177" y="194" text-anchor="middle">測試・掃描・簽章</text><text class="s" x="177" y="225" text-anchor="middle">映像摘要／S3 版本</text>
<rect class="box" x="370" y="115" width="245" height="150" rx="20"/><text class="t" x="492" y="158" text-anchor="middle">變更核准</text><text class="s" x="492" y="194" text-anchor="middle">受保護管線</text><text class="s" x="492" y="225" text-anchor="middle">MFA・短期憑證</text>
<rect class="box" x="685" y="115" width="275" height="150" rx="20"/><text class="t" x="822" y="158" text-anchor="middle">CodeDeploy</text><text class="s" x="822" y="194" text-anchor="middle">部署群組・AppSpec</text><text class="s" x="822" y="225" text-anchor="middle">隔離的最小權限角色</text>
<rect class="safe" x="1030" y="115" width="315" height="150" rx="20"/><text class="t" x="1187" y="158" text-anchor="middle">綠色環境</text><text class="s" x="1187" y="194" text-anchor="middle">私有網路・KMS 加密</text><text class="s" x="1187" y="225" text-anchor="middle">掛鉤＋合成交易驗證</text></g>
<path class="line" d="M300 190h55"/><path class="line" d="M615 190h55"/><path class="line" d="M960 190h55"/>
<g filter="url(#shadow)"><rect class="box" x="1030" y="340" width="315" height="150" rx="20"/><text class="t" x="1187" y="383" text-anchor="middle">漸進流量切換</text><text class="s" x="1187" y="419" text-anchor="middle">Canary／線性／全量</text><text class="s" x="1187" y="450" text-anchor="middle">技術與業務健康門檻</text>
<rect class="warn" x="685" y="340" width="275" height="150" rx="20"/><text class="t" x="822" y="383" text-anchor="middle">異常即停止</text><text class="s" x="822" y="419" text-anchor="middle">CloudWatch Alarm</text><text class="s" x="822" y="450" text-anchor="middle">流量切回藍色環境</text>
<rect class="safe" x="370" y="340" width="245" height="150" rx="20"/><text class="t" x="492" y="383" text-anchor="middle">穩定後完成</text><text class="s" x="492" y="419" text-anchor="middle">保留回復窗口</text><text class="s" x="492" y="450" text-anchor="middle">再淘汰舊版本</text></g>
<path class="line" d="M1187 265v60"/><path class="line" d="M1030 415h-55"/><path class="line" d="M685 415h-55"/>
<rect x="55" y="570" width="1290" height="125" rx="22" fill="#0b1c33" stroke="#6a8db4" stroke-width="2"/><text class="t" x="700" y="614" text-anchor="middle">全程治理與證據</text><text class="s" x="700" y="650" text-anchor="middle">Secrets Manager／Parameter Store 不落地機密　｜　CloudTrail API 稽核　｜　CloudWatch 日誌與告警　｜　備份、舊版回復與跨區演練</text>
</svg>
