<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Macie 敏感資料探索與治理流程示意圖</title>
  <desc id="desc">多帳號 S3 資料經 Amazon Macie 清冊、政策評估與敏感資料探索，將探索結果加密保存，並透過 EventBridge 與 Security Hub 交由資料擁有者修復與驗證。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd089"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26d9ff"/><stop offset="1" stop-color="#7ef3cb"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8fe8ff"/></marker>
    <style>.box{fill:#10243f;stroke:#31577d;stroke-width:2}.label{font:700 26px 'Noto Sans TC',sans-serif;fill:#fff}.small{font:500 19px 'Noto Sans TC',sans-serif;fill:#c6d6ed}.tiny{font:600 17px 'Noto Sans TC',sans-serif;fill:#ffcf91}.flow{fill:none;stroke:#8fe8ff;stroke-width:5;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffb347;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="70" y="70" class="label" font-size="34">S3 敏感資料治理：從探索到修復驗證</text>
  <text x="70" y="108" class="small">示意架構｜發現是風險線索，公開存取防護、人工判斷與資料生命週期仍需獨立控制</text>

  <g filter="url(#shadow)">
    <rect x="55" y="190" width="280" height="250" rx="26" class="box"/>
    <text x="95" y="242" class="label">多帳號 S3</text>
    <rect x="95" y="270" width="200" height="44" rx="12" fill="#18385c"/><text x="118" y="299" class="small">合作夥伴上傳區</text>
    <rect x="95" y="326" width="200" height="44" rx="12" fill="#18385c"/><text x="118" y="355" class="small">資料湖與文件區</text>
    <text x="95" y="407" class="tiny">Block Public Access · KMS</text>

    <rect x="420" y="155" width="445" height="320" rx="30" fill="#152a43" stroke="url(#orange)" stroke-width="4"/>
    <text x="470" y="215" class="label">Amazon Macie</text>
    <rect x="470" y="245" width="345" height="52" rx="14" fill="#203d5c"/><text x="497" y="278" class="small">S3 清冊與政策風險評估</text>
    <rect x="470" y="314" width="345" height="52" rx="14" fill="#203d5c"/><text x="497" y="347" class="small">自動化探索＋目標工作</text>
    <rect x="470" y="383" width="345" height="52" rx="14" fill="#203d5c"/><text x="497" y="416" class="small">受管／自訂識別碼＋允許清單</text>

    <rect x="950" y="190" width="420" height="250" rx="26" class="box"/>
    <text x="998" y="242" class="label">發現與分析紀錄</text>
    <text x="998" y="294" class="small">政策發現 · 敏感資料發現</text>
    <text x="998" y="332" class="small">無法分析與覆蓋缺口</text>
    <text x="998" y="370" class="small">Finding ID · 資源 · 嚴重度</text>
    <text x="998" y="410" class="tiny">不複製實際敏感內容到通知</text>
  </g>
  <path d="M335 315H412" class="flow"/><path d="M865 315H942" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="70" y="595" width="350" height="205" rx="24" class="box"/>
    <text x="113" y="650" class="label">加密證據儲存庫</text>
    <text x="113" y="697" class="small">S3 版本控制與保留策略</text>
    <text x="113" y="734" class="small">客戶管理 KMS 金鑰</text>
    <text x="113" y="771" class="small">最小權限與存取稽核</text>

    <rect x="545" y="595" width="350" height="205" rx="24" class="box"/>
    <text x="596" y="650" class="label">事件分流</text>
    <text x="596" y="697" class="small">EventBridge · Security Hub</text>
    <text x="596" y="734" class="small">工單 · 通知 · 事件應變</text>
    <text x="596" y="771" class="small">依公開狀態與風險排序</text>

    <rect x="1020" y="595" width="350" height="205" rx="24" fill="#132c49" stroke="url(#cyan)" stroke-width="3"/>
    <text x="1062" y="650" class="label">擁有者修復閉環</text>
    <text x="1062" y="697" class="small">隔離 · 權限修正 · 遮罩</text>
    <text x="1062" y="734" class="small">備份 · 刪除 · 回復驗證</text>
    <text x="1062" y="771" class="small">重新掃描與證據關閉</text>
  </g>
  <path d="M1060 440C980 520 810 520 720 586" class="dash"/>
  <path d="M1000 440C835 500 450 500 245 586" class="dash"/>
  <path d="M420 698H537" class="flow"/><path d="M895 698H1012" class="flow"/>
  <text x="70" y="862" class="small">共同責任：AWS 維護 Macie 服務與辨識能力；客戶治理 IAM、S3 公開存取、KMS、結果保存、事件處理、備份與跨區復原。</text>
</svg>
