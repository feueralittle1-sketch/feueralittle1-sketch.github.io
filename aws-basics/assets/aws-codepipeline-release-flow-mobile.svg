<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" role="img" aria-labelledby="title desc">
<title id="title">AWS CodePipeline 受控發布流程手機版示意圖</title><desc id="desc">來源變更由上而下經建置測試、安全門檻、獨立核准、分批部署與健康驗證，異常時停止並回復，全程套用身分、成品、監控與復原控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11284a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68e0ff"/></marker></defs>
<rect width="760" height="1500" rx="30" fill="url(#bg)"/><rect x="28" y="28" width="704" height="1444" rx="24" fill="none" stroke="#fff" stroke-opacity=".12"/>
<text x="60" y="86" fill="#fff" font-size="31" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">示意｜CodePipeline 受控發布</text><text x="60" y="124" fill="#a9bfdc" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif">版本、門檻、核准、最小權限、觀測、回復</text>
<g font-family="Arial,'Noto Sans TC',sans-serif">
<g transform="translate(70 175)"><rect width="620" height="120" rx="20" fill="#142b48" stroke="#ffb34d"/><circle cx="54" cy="60" r="25" fill="#ff9900"/><text x="54" y="68" text-anchor="middle" fill="#071426" font-size="22" font-weight="900">1</text><text x="105" y="53" fill="#fff" font-size="25" font-weight="800">來源變更與不可變修訂</text><text x="105" y="88" fill="#b8cae2" font-size="19">受保護分支 · 明確觸發條件</text></g>
<g transform="translate(70 335)"><rect width="620" height="120" rx="20" fill="#142b48" stroke="#68e0ff"/><circle cx="54" cy="60" r="25" fill="#68e0ff"/><text x="54" y="68" text-anchor="middle" fill="#071426" font-size="22" font-weight="900">2</text><text x="105" y="53" fill="#fff" font-size="25" font-weight="800">可重複建置與測試</text><text x="105" y="88" fill="#b8cae2" font-size="19">單元、整合與成品完整性</text></g>
<g transform="translate(70 495)"><rect width="620" height="120" rx="20" fill="#142b48" stroke="#b794ff"/><circle cx="54" cy="60" r="25" fill="#b794ff"/><text x="54" y="68" text-anchor="middle" fill="#071426" font-size="22" font-weight="900">3</text><text x="105" y="53" fill="#fff" font-size="25" font-weight="800">安全與政策門檻</text><text x="105" y="88" fill="#b8cae2" font-size="19">弱點／政策失敗立即停止</text></g>
<g transform="translate(70 655)"><rect width="620" height="120" rx="20" fill="#142b48" stroke="#ffd166"/><circle cx="54" cy="60" r="25" fill="#ffd166"/><text x="54" y="68" text-anchor="middle" fill="#071426" font-size="22" font-weight="900">4</text><text x="105" y="53" fill="#fff" font-size="25" font-weight="800">獨立核准</text><text x="105" y="88" fill="#b8cae2" font-size="19">差異、證據與回復方案</text></g>
<g transform="translate(70 815)"><rect width="620" height="120" rx="20" fill="#142b48" stroke="#62e6a5"/><circle cx="54" cy="60" r="25" fill="#62e6a5"/><text x="54" y="68" text-anchor="middle" fill="#071426" font-size="22" font-weight="900">5</text><text x="105" y="53" fill="#fff" font-size="25" font-weight="800">最小權限分批部署</text><text x="105" y="88" fill="#b8cae2" font-size="19">先少量容量／流量，再逐步擴大</text></g>
<g transform="translate(70 975)"><rect width="620" height="120" rx="20" fill="#142b48" stroke="#62e6a5"/><circle cx="54" cy="60" r="25" fill="#62e6a5"/><text x="54" y="68" text-anchor="middle" fill="#071426" font-size="22" font-weight="900">6</text><text x="105" y="53" fill="#fff" font-size="25" font-weight="800">健康與業務驗證</text><text x="105" y="88" fill="#b8cae2" font-size="19">通過才繼續；異常即停止並回復</text></g>
</g>
<g stroke="#68e0ff" stroke-width="4" marker-end="url(#arrow)"><path d="M380 295V327"/><path d="M380 455V487"/><path d="M380 615V647"/><path d="M380 775V807"/><path d="M380 935V967"/></g>
<rect x="70" y="1145" width="620" height="245" rx="22" fill="#0d2039" stroke="#8fe8ff"/><text x="105" y="1190" fill="#8fe8ff" font-size="24" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">全程控制與異常路徑</text><text x="105" y="1230" fill="#d5e1f1" font-size="19" font-family="Arial,'Noto Sans TC',sans-serif">• MFA／短期角色、IAM 最小權限、網路隔離</text><text x="105" y="1266" fill="#d5e1f1" font-size="19" font-family="Arial,'Noto Sans TC',sans-serif">• 私有 S3 成品、KMS、專用機密管理服務</text><text x="105" y="1302" fill="#d5e1f1" font-size="19" font-family="Arial,'Noto Sans TC',sans-serif">• CloudTrail／CloudWatch 記錄與告警</text><text x="105" y="1338" fill="#ff9bab" font-size="19" font-family="Arial,'Noto Sans TC',sans-serif">• 異常：保留證據、回復、還原資料、重新驗證</text><text x="380" y="1440" text-anchor="middle" fill="#95aac8" font-size="16" font-family="Arial,'Noto Sans TC',sans-serif">原創流程圖｜實際架構依區域、資料分類與復原目標調整</text>
</svg>
