<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc">
<title id="title">AWS CodeBuild 安全建置流程手機版示意圖</title><desc id="desc">由上而下呈現不可變來源、隔離 CodeBuild 環境、品質與安全檢查、可信成品、異常停止以及集中觀測。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b46"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#75dbff"/></marker></defs>
<rect width="720" height="1420" rx="28" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="40" y="62" fill="#fff" font-size="31" font-weight="800">示意｜CodeBuild 安全建置</text><text x="40" y="100" fill="#a9bdd7" font-size="18">固定來源 → 隔離執行 → 可信成品</text>
<rect x="55" y="145" width="610" height="150" rx="22" fill="#10243d" stroke="#75dbff" stroke-width="2"/><text x="85" y="192" fill="#8fe8ff" font-size="24" font-weight="800">1｜不可變來源</text><text x="85" y="232" fill="#c8d8eb" font-size="19">受保護分支 · 提交識別碼</text><text x="85" y="265" fill="#c8d8eb" font-size="19">套件鎖定 · 來源與雜湊驗證</text><path d="M360 295 V340" stroke="#75dbff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="55" y="355" width="610" height="480" rx="24" fill="#0c2038" stroke="#ffad3d" stroke-width="3"/><text x="85" y="405" fill="#ffca75" font-size="25" font-weight="800">2｜隔離 CodeBuild 環境</text><rect x="85" y="440" width="550" height="100" rx="16" fill="#142e4a"/><text x="110" y="479" fill="#fff" font-size="21" font-weight="700">環境固定與最小權限</text><text x="110" y="514" fill="#c8d8eb" font-size="18">映像摘要 · 專用角色 · 私有網路</text><rect x="85" y="560" width="550" height="100" rx="16" fill="#142e4a"/><text x="110" y="599" fill="#fff" font-size="21" font-weight="700">品質與安全門檻</text><text x="110" y="634" fill="#c8d8eb" font-size="18">編譯測試 · 靜態分析 · 套件／映像掃描</text><rect x="85" y="680" width="550" height="110" rx="16" fill="#142e4a"/><text x="110" y="719" fill="#fff" font-size="21" font-weight="700">機密只在執行期取得</text><text x="110" y="754" fill="#c8d8eb" font-size="18">Secrets Manager／Parameter Store</text><text x="110" y="780" fill="#c8d8eb" font-size="17">不得進入來源、日誌、快取或成品</text><path d="M360 835 V880" stroke="#75dbff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="55" y="895" width="610" height="160" rx="22" fill="#10243d" stroke="#63e6b0" stroke-width="2"/><text x="85" y="942" fill="#8affcc" font-size="24" font-weight="800">3｜可信成品</text><text x="85" y="982" fill="#c8d8eb" font-size="19">私有 S3／ECR · KMS 加密</text><text x="85" y="1017" fill="#c8d8eb" font-size="19">不可變摘要 · SBOM · 簽章</text>
<rect x="55" y="1100" width="610" height="125" rx="22" fill="#271b2d" stroke="#ff719a" stroke-width="2"/><text x="85" y="1143" fill="#ff9eba" font-size="23" font-weight="800">異常｜停止，不發布</text><text x="85" y="1180" fill="#e7cbd5" font-size="18">測試或掃描失敗、完整性不符、權限異常</text><text x="85" y="1207" fill="#e7cbd5" font-size="17">保留證據，修正來源後重新建置</text>
<rect x="55" y="1260" width="610" height="110" rx="22" fill="#112d3c" stroke="#62d9f5" stroke-width="2"/><text x="85" y="1302" fill="#8fe8ff" font-size="23" font-weight="800">觀測｜CloudWatch ＋ CloudTrail</text><text x="85" y="1342" fill="#c8d8eb" font-size="18">建置日誌、告警、專案與角色變更皆留證</text></g></svg>
