<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Athena 受治理查詢流程示意圖</title>
  <desc id="desc">資料由來源系統進入受控 S3 資料湖，經格式、分割、目錄與權限治理後，由隔離的 Athena workgroup 查詢；結果受到加密、監控、成本上限、稽核及跨區復原控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7be7ff"/></marker>
    <style>.h{font:700 28px system-ui,sans-serif;fill:#fff}.t{font:700 20px system-ui,sans-serif;fill:#fff}.s{font:500 16px system-ui,sans-serif;fill:#bcd0ec}.tiny{font:600 14px system-ui,sans-serif;fill:#d8e6fa}.box{fill:#112844;stroke:#3c6387;stroke-width:2}.guard{fill:#112337;stroke:#52d6a3;stroke-width:2}.warn{fill:#362716;stroke:#ffb548;stroke-width:2}.line{fill:none;stroke:#7be7ff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="820" rx="36" fill="url(#bg)"/>
  <text x="70" y="70" class="h">示意：Amazon Athena 不是「把 S3 接上 SQL」就完成治理</text>
  <text x="70" y="105" class="s">資料、目錄、身分、查詢工作負載、結果與復原必須形成可稽核的完整路徑</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="210" height="170" rx="24" class="box"/>
    <text x="100" y="220" class="t">資料來源</text>
    <text x="100" y="258" class="s">應用事件／日誌</text><text x="100" y="286" class="s">批次檔案／串流</text><text x="100" y="314" class="s">權威業務系統</text>

    <rect x="340" y="155" width="250" height="210" rx="24" class="guard"/>
    <text x="370" y="200" class="t">S3 受控資料湖</text>
    <text x="370" y="238" class="s">隔離／原始／整理區</text><text x="370" y="266" class="s">Parquet／ORC＋壓縮</text><text x="370" y="294" class="s">依查詢模式分割</text><text x="370" y="322" class="s">版本、生命週期、複寫</text>

    <rect x="650" y="155" width="250" height="210" rx="24" class="box"/>
    <text x="680" y="200" class="t">目錄與授權</text>
    <text x="680" y="238" class="s">Glue Data Catalog</text><text x="680" y="266" class="s">Lake Formation</text><text x="680" y="294" class="s">欄／列／表級權限</text><text x="680" y="322" class="s">IAM 最小權限</text>

    <rect x="960" y="135" width="370" height="250" rx="24" class="warn"/>
    <text x="995" y="180" class="t">Athena Workgroup</text>
    <text x="995" y="218" class="s">互動分析與排程查詢分離</text><text x="995" y="246" class="s">強制結果位置、擁有者與 KMS</text><text x="995" y="274" class="s">每次查詢掃描量上限</text><text x="995" y="302" class="s">CloudWatch 指標／EventBridge 事件</text><text x="995" y="330" class="s">MFA／聯合登入／短期憑證</text><text x="995" y="358" class="s">SQL、Spark 或受控應用介面</text>
  </g>

  <path d="M280 260H330" class="line"/><path d="M590 260H640" class="line"/><path d="M900 260H950" class="line"/>

  <g filter="url(#shadow)">
    <rect x="180" y="470" width="300" height="200" rx="24" class="guard"/>
    <text x="215" y="515" class="t">查詢結果與機密</text>
    <text x="215" y="553" class="s">客戶管理或 Athena 管理結果</text><text x="215" y="581" class="s">KMS 加密＋最小讀取權限</text><text x="215" y="609" class="s">Secrets Manager／Parameter Store</text><text x="215" y="637" class="s">生命週期清除與輸出分類</text>

    <rect x="550" y="470" width="300" height="200" rx="24" class="box"/>
    <text x="585" y="515" class="t">觀測與稽核</text>
    <text x="585" y="553" class="s">CloudTrail 管理 API</text><text x="585" y="581" class="s">CloudWatch 查詢與配額指標</text><text x="585" y="609" class="s">異常掃描、失敗與成本告警</text><text x="585" y="637" class="s">查詢歷史與資料存取證據</text>

    <rect x="920" y="470" width="300" height="200" rx="24" class="warn"/>
    <text x="955" y="515" class="t">可用性與復原</text>
    <text x="955" y="553" class="s">S3 資料與目錄備份</text><text x="955" y="581" class="s">IaC、SQL 與權限版本化</text><text x="955" y="609" class="s">跨區資料／KMS／工作群組</text><text x="955" y="637" class="s">定期演練重建與結果驗證</text>
  </g>
  <path d="M1135 385V430H330V460" class="line"/><path d="M1135 385V430H700V460" class="line"/><path d="M1135 385V430H1070V460" class="line"/>
  <rect x="70" y="730" width="1260" height="48" rx="16" fill="#091b2f" stroke="#315779"/>
  <text x="95" y="761" class="tiny">控制重點：限制誰能查什麼資料、每次能掃多少、結果放哪裡、誰能下載，以及資料與目錄能否在另一區域重建。</text>
</svg>
