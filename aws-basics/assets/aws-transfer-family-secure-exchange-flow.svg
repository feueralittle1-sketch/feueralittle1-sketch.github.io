<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AWS Transfer Family 安全檔案交換流程</title>
  <desc id="desc">外部交易夥伴透過 SFTP、FTPS 或 AS2 進入受控端點，經身分驗證與最小權限後把檔案寫入 S3 隔離區，再進行檢查、分類、監控與跨區復原。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#6ee7f9"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs>
  <rect width="1400" height="820" rx="36" fill="url(#bg)"/><rect x="40" y="36" width="1320" height="748" rx="28" fill="none" stroke="#31527d"/>
  <text x="70" y="92" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">AWS Transfer Family：安全檔案交換邊界</text><text x="70" y="126" fill="#9fb6d8" font-family="system-ui,sans-serif" font-size="18">示意流程｜傳輸成功只是入口，隔離、驗證、授權與復原共同構成完整控制</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif"><rect x="70" y="180" width="250" height="210" rx="24" fill="#132a4c" stroke="#5075a8"/><text x="95" y="225" fill="#ffbd70" font-size="22" font-weight="800">1. 交易夥伴</text><text x="95" y="266" fill="#e8f1ff" font-size="18"><tspan x="95">SFTP / FTPS</tspan><tspan x="95" dy="30">AS2 / 瀏覽器</tspan><tspan x="95" dy="30">來源 IP / VPN</tspan><tspan x="95" dy="30">獨立使用者身分</tspan></text>
  <rect x="390" y="160" width="620" height="250" rx="26" fill="#10213d" stroke="#ff9900"/><text x="420" y="205" fill="#fff" font-size="24" font-weight="800">2. 受控 Transfer Family 端點</text><rect x="420" y="235" width="260" height="62" rx="16" fill="#203d68"/><text x="470" y="273" fill="#fff" font-size="18" font-weight="700">身分提供者</text><rect x="720" y="235" width="260" height="62" rx="16" fill="#203d68"/><text x="758" y="273" fill="#fff" font-size="18" font-weight="700">Security Policy</text><rect x="420" y="320" width="260" height="62" rx="16" fill="#203d68"/><text x="466" y="358" fill="#fff" font-size="18" font-weight="700">IAM 最小權限</text><rect x="720" y="320" width="260" height="62" rx="16" fill="#203d68"/><text x="770" y="358" fill="#fff" font-size="18" font-weight="700">邏輯目錄</text>
  <rect x="1080" y="180" width="250" height="210" rx="24" fill="#132a4c" stroke="#5075a8"/><text x="1105" y="225" fill="#ffbd70" font-size="22" font-weight="800">3. 隔離落點</text><text x="1105" y="266" fill="#e8f1ff" font-size="18"><tspan x="1105">S3 / EFS</tspan><tspan x="1105" dy="30">獨立 partner 路徑</tspan><tspan x="1105" dy="30">KMS / 公開封鎖</tspan><tspan x="1105" dy="30">版本與保留</tspan></text></g>
  <path d="M320 285h55" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/><path d="M1010 285h55" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif"><rect x="70" y="485" width="1260" height="210" rx="28" fill="#0c1b32" stroke="#31527d"/><text x="100" y="528" fill="#fff" font-size="23" font-weight="800">4. 驗證、發布與復原</text><g fill="#162f54" stroke="#3b6898"><rect x="100" y="558" width="210" height="95" rx="18"/><rect x="335" y="558" width="210" height="95" rx="18"/><rect x="570" y="558" width="210" height="95" rx="18"/><rect x="805" y="558" width="210" height="95" rx="18"/><rect x="1040" y="558" width="260" height="95" rx="18"/></g><g fill="#e9f4ff" font-size="17" font-weight="700" text-anchor="middle"><text x="205" y="592">格式／大小／雜湊<tspan x="205" dy="25">惡意檔案掃描</tspan></text><text x="440" y="592">accepted / rejected<tspan x="440" dy="25">冪等與人工處理</tspan></text><text x="675" y="592">CloudWatch 日誌<tspan x="675" dy="25">CloudTrail 稽核</tspan></text><text x="910" y="592">版本／備份<tspan x="910" dy="25">資料完整性驗證</tspan></text><text x="1170" y="592">跨區資料副本<tspan x="1170" dy="25">DNS／身分復原演練</tspan></text></g></g>
  <rect x="330" y="730" width="740" height="34" rx="17" fill="url(#accent)"/><text x="700" y="754" fill="#071426" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="900">AWS 管理協定端點；客戶仍管理身分、儲存授權、內容驗證、資料生命週期與跨區復原</text>
</svg>
