<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">AWS 共同責任與資安檢查圖</title><desc id="desc">AWS 負責雲端本身，客戶負責雲端內的資料、身分、設定與應用，責任因服務型態而異。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#16213f"/></linearGradient></defs><rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="42" font-weight="800" font-family="sans-serif">安全不是「上雲後 AWS 全包」</text><text x="70" y="118" fill="#9fb3d9" font-size="22" font-family="sans-serif">共同責任會隨 EC2、容器、Serverless 與 SaaS 型服務而改變</text><g font-family="sans-serif"><g transform="translate(70 170)"><rect width="500" height="330" rx="30" fill="#112c3d" stroke="#63e6ff" stroke-width="3"/><text x="250" y="54" text-anchor="middle" fill="#63e6ff" font-size="29" font-weight="800">AWS：雲端本身的安全</text><text x="42" y="105" fill="#e6eefc" font-size="22">• 實體資料中心與硬體</text><text x="42" y="150" fill="#e6eefc" font-size="22">• 全球基礎設施與虛擬化層</text><text x="42" y="195" fill="#e6eefc" font-size="22">• 受管服務的底層平台</text><text x="42" y="240" fill="#e6eefc" font-size="22">• 服務可用性與基礎設施維運</text><rect x="38" y="270" width="424" height="38" rx="19" fill="#63e6ff" fill-opacity=".13"/><text x="250" y="296" text-anchor="middle" fill="#bcefff" font-size="18">Security OF the Cloud</text></g><g transform="translate(630 170)"><rect width="500" height="330" rx="30" fill="#312038" stroke="#ff9bcf" stroke-width="3"/><text x="250" y="54" text-anchor="middle" fill="#ff9bcf" font-size="29" font-weight="800">客戶：雲端內部的安全</text><text x="42" y="105" fill="#e6eefc" font-size="22">• 資料分類、備份與加密</text><text x="42" y="150" fill="#e6eefc" font-size="22">• IAM、MFA、權限與憑證</text><text x="42" y="195" fill="#e6eefc" font-size="22">• 網路、安全群組與 WAF 規則</text><text x="42" y="240" fill="#e6eefc" font-size="22">• 作業系統、應用與日誌回應</text><rect x="38" y="270" width="424" height="38" rx="19" fill="#ff9bcf" fill-opacity=".13"/><text x="250" y="296" text-anchor="middle" fill="#ffd0e8" font-size="18">Security IN the Cloud</text></g><text x="600" y="550" text-anchor="middle" fill="#57f0c1" font-size="27" font-weight="800">上線前五個問題</text><g fill="#c6d4eb" font-size="20"><text x="100" y="600">① 誰能登入？是否使用 MFA 與短期憑證？</text><text x="650" y="600">② 哪些資料必須加密、備份與限制區域？</text><text x="100" y="642">③ 哪些連線真的需要對網際網路開放？</text><text x="650" y="642">④ CloudTrail、告警與事件處置是否已啟用？</text><text x="100" y="684">⑤ 成本與資源是否有標籤、預算與異常通知？</text></g></g></svg>