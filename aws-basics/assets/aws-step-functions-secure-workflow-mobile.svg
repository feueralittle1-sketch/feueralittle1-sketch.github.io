<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc">
  <title id="title">AWS Step Functions 安全文件處理工作流程手機示意圖</title>
  <desc id="desc">垂直呈現受控事件入口、加密 Standard 狀態機、輸入驗證、平行掃描與格式驗證、文件解析、條件分流、人工覆核，以及 IAM、KMS、CloudWatch、CloudTrail 與替代區域控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 25px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 20px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 17px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1420" rx="32" fill="url(#bg)"/>
  <text x="44" y="56" class="k">原創架構圖 · 示意</text><text x="44" y="96" class="t">Step Functions 安全工作流程</text>
  <g filter="url(#shadow)">
    <rect x="80" y="140" width="560" height="110" rx="22" class="box"/><text x="360" y="183" text-anchor="middle" class="k">受控入口 · EventBridge</text><text x="360" y="220" text-anchor="middle" class="s">只傳識別值、S3 位置、資料分類</text>
    <path d="M360 250V290" class="line"/>
    <rect x="70" y="300" width="580" height="670" rx="28" fill="#091a31" stroke="#ffad3d" stroke-width="3"/><text x="110" y="342" class="k">加密 STANDARD 狀態機</text>
    <rect x="150" y="380" width="420" height="88" rx="18" class="step"/><text x="360" y="417" text-anchor="middle" class="t">1. 輸入驗證</text><text x="360" y="447" text-anchor="middle" class="s">結構、允許值、大小、分類</text>
    <path d="M360 468V505" class="line"/>
    <rect x="105" y="515" width="235" height="105" rx="18" class="step"/><text x="222" y="555" text-anchor="middle" class="t">2A. 惡意掃描</text><text x="222" y="587" text-anchor="middle" class="s">限時／有限重試</text>
    <rect x="380" y="515" width="235" height="105" rx="18" class="step"/><text x="497" y="555" text-anchor="middle" class="t">2B. 格式驗證</text><text x="497" y="587" text-anchor="middle" class="s">拒絕路徑明確</text>
    <path d="M360 505H222V515" class="line"/><path d="M360 505H497V515" class="line"/>
    <path d="M222 620V650H360" class="line"/><path d="M497 620V650H360" class="line"/>
    <rect x="150" y="665" width="420" height="88" rx="18" class="step"/><text x="360" y="702" text-anchor="middle" class="t">3. 文件解析</text><text x="360" y="732" text-anchor="middle" class="s">結果寫入加密資料儲存</text>
    <path d="M360 753V785" class="line"/>
    <polygon points="360,790 500,860 360,930 220,860" class="step"/><text x="360" y="852" text-anchor="middle" class="t">4. Choice</text><text x="360" y="884" text-anchor="middle" class="s">信心分數／業務條件</text>
    <rect x="55" y="1015" width="295" height="110" rx="20" class="box"/><text x="202" y="1058" text-anchor="middle" class="t">完成與留存</text><text x="202" y="1092" text-anchor="middle" class="s">外部業務狀態清冊</text>
    <rect x="370" y="1015" width="295" height="110" rx="20" class="box"/><text x="517" y="1058" text-anchor="middle" class="t">人工覆核</text><text x="517" y="1092" text-anchor="middle" class="s">受保護 callback token</text>
    <path d="M260 910L202 1015" class="line"/><path d="M460 910L517 1015" class="line"/>
  </g>
  <g>
    <rect x="55" y="1180" width="295" height="92" rx="18" class="guard"/><text x="78" y="1217" class="k">IAM／KMS</text><text x="78" y="1250" class="s">最小權限、短期憑證、加密</text>
    <rect x="370" y="1180" width="295" height="92" rx="18" class="guard"/><text x="393" y="1217" class="k">可靠性</text><text x="393" y="1250" class="s">冪等、補償、退避、redrive</text>
    <rect x="55" y="1290" width="295" height="92" rx="18" class="guard"/><text x="78" y="1327" class="k">觀測與稽核</text><text x="78" y="1360" class="s">CloudWatch／CloudTrail</text>
    <rect x="370" y="1290" width="295" height="92" rx="18" class="guard"/><text x="393" y="1327" class="k">跨區復原</text><text x="393" y="1360" class="s">版本別名、狀態盤點、去重</text>
  </g>
</svg>
