<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">AWS CloudFormation 受控基礎設施交付流程示意圖</title>
<desc id="desc">從版本控制、範本檢查、變更集審核、CloudFormation 執行角色，到多可用區資源、觀測、漂移偵測與回復的流程。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient><linearGradient id="accent"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd28a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#64ddff"/></marker></defs>
<rect width="1200" height="820" rx="28" fill="url(#bg)"/><text x="64" y="76" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">基礎設施即程式碼：從變更到可驗證狀態</text><text x="64" y="112" fill="#a9bddb" font-family="sans-serif" font-size="19">示意：正式環境的 CloudFormation 交付與治理閉環</text>
<g font-family="sans-serif" filter="url(#shadow)">
<rect x="64" y="170" width="250" height="150" rx="20" fill="#142b48" stroke="#456887"/><text x="94" y="214" fill="#ffbf69" font-size="22" font-weight="700">1｜版本控制</text><text x="94" y="252" fill="#e8f1ff" font-size="18">範本、參數與政策</text><text x="94" y="284" fill="#b8cae3" font-size="16">同儕審查 · 靜態檢查</text>
<rect x="365" y="170" width="250" height="150" rx="20" fill="#142b48" stroke="#456887"/><text x="395" y="214" fill="#ffbf69" font-size="22" font-weight="700">2｜變更集</text><text x="395" y="252" fill="#e8f1ff" font-size="18">預覽新增／修改／刪除</text><text x="395" y="284" fill="#b8cae3" font-size="16">風險分級 · 人工核准</text>
<rect x="666" y="170" width="250" height="150" rx="20" fill="#142b48" stroke="#456887"/><text x="696" y="214" fill="#ffbf69" font-size="22" font-weight="700">3｜受控執行</text><text x="696" y="252" fill="#e8f1ff" font-size="18">最小權限服務角色</text><text x="696" y="284" fill="#b8cae3" font-size="16">堆疊政策 · 回復觸發</text>
<rect x="967" y="170" width="169" height="150" rx="20" fill="#173752" stroke="#56cce8"/><text x="993" y="214" fill="#7ee8ff" font-size="22" font-weight="700">4｜資源</text><text x="993" y="252" fill="#e8f1ff" font-size="17">私有子網路</text><text x="993" y="282" fill="#e8f1ff" font-size="17">跨可用區</text>
</g>
<g stroke="#64ddff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M314 245H352"/><path d="M615 245H653"/><path d="M916 245H954"/><path d="M1052 320V390"/></g>
<rect x="64" y="390" width="1072" height="298" rx="24" fill="#0b1d34" stroke="#31516f"/>
<text x="96" y="438" fill="#fff" font-family="sans-serif" font-size="24" font-weight="700">部署後的持續驗證</text>
<g font-family="sans-serif"><rect x="96" y="474" width="220" height="152" rx="18" fill="#122d46" stroke="#3c6d8d"/><text x="122" y="516" fill="#7ee8ff" font-size="20" font-weight="700">CloudTrail</text><text x="122" y="552" fill="#e4efff" font-size="17">記錄控制面活動</text><text x="122" y="584" fill="#aec3dd" font-size="15">集中保存與調查</text>
<rect x="358" y="474" width="220" height="152" rx="18" fill="#122d46" stroke="#3c6d8d"/><text x="384" y="516" fill="#7ee8ff" font-size="20" font-weight="700">CloudWatch</text><text x="384" y="552" fill="#e4efff" font-size="17">指標、日誌與告警</text><text x="384" y="584" fill="#aec3dd" font-size="15">回復觸發與維運監看</text>
<rect x="620" y="474" width="220" height="152" rx="18" fill="#122d46" stroke="#3c6d8d"/><text x="646" y="516" fill="#7ee8ff" font-size="20" font-weight="700">漂移偵測</text><text x="646" y="552" fill="#e4efff" font-size="17">比對實際與預期</text><text x="646" y="584" fill="#aec3dd" font-size="15">調查後由程式碼修正</text>
<rect x="882" y="474" width="220" height="152" rx="18" fill="#213342" stroke="#ffb45d"/><text x="908" y="516" fill="#ffbf69" font-size="20" font-weight="700">備份與跨區重建</text><text x="908" y="552" fill="#e4efff" font-size="17">資料備份不等於範本</text><text x="908" y="584" fill="#aec3dd" font-size="15">定期演練 RTO／RPO</text></g>
<path d="M730 626V744H190V332" fill="none" stroke="#ffb45d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="346" y="775" fill="#ffcf8c" font-family="sans-serif" font-size="18">異常或漂移回到版本控制，禁止直接在正式環境永久修補</text>
</svg>
