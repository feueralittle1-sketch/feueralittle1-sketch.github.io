<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Data Exports 與 CUR 2.0 成本資料治理流程</title>
<desc id="desc">帳務與成本資料經資料表及 SQL 篩選後交付私有 S3，使用 Manifest 驗證，再由 Athena 或商業智慧工具分析，並以 IAM、CloudTrail、備份及對帳控制風險。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10254a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker></defs>
<rect width="1440" height="900" rx="44" fill="url(#bg)"/>
<text x="72" y="82" fill="#fff" font-family="system-ui,sans-serif" font-size="38" font-weight="800">AWS Data Exports：成本資料從匯出到治理</text>
<text x="72" y="124" fill="#a8bad8" font-family="system-ui,sans-serif" font-size="21">示意流程｜資料最小化、私有交付、Manifest 驗證、分權分析與稽核復原</text>
<g filter="url(#shadow)" font-family="system-ui,sans-serif">
<rect x="70" y="205" width="250" height="210" rx="28" fill="#132b4d" stroke="#ffbd70" stroke-width="3"/><text x="100" y="257" fill="#ffbd70" font-size="19" font-weight="800">01　資料來源</text><text x="100" y="303" fill="#fff" font-size="24" font-weight="800">帳務與成本資料</text><text x="100" y="345" fill="#c6d4eb" font-size="18">CUR 2.0／FOCUS</text><text x="100" y="376" fill="#c6d4eb" font-size="18">最佳化建議／碳排</text>
<rect x="405" y="205" width="250" height="210" rx="28" fill="#132b4d" stroke="#8fe8ff" stroke-width="3"/><text x="435" y="257" fill="#8fe8ff" font-size="19" font-weight="800">02　匯出定義</text><text x="435" y="303" fill="#fff" font-size="24" font-weight="800">資料表＋SQL</text><text x="435" y="345" fill="#c6d4eb" font-size="18">選欄位、篩資料列</text><text x="435" y="376" fill="#c6d4eb" font-size="18">格式、頻率、版本模式</text>
<rect x="740" y="205" width="250" height="210" rx="28" fill="#132b4d" stroke="#70efbd" stroke-width="3"/><text x="770" y="257" fill="#70efbd" font-size="19" font-weight="800">03　私有交付</text><text x="770" y="303" fill="#fff" font-size="24" font-weight="800">Amazon S3</text><text x="770" y="345" fill="#c6d4eb" font-size="18">Block Public Access</text><text x="770" y="376" fill="#c6d4eb" font-size="18">唯一 prefix／加密／版本</text>
<rect x="1075" y="205" width="295" height="210" rx="28" fill="#132b4d" stroke="#c8a6ff" stroke-width="3"/><text x="1105" y="257" fill="#c8a6ff" font-size="19" font-weight="800">04　完整性閘門</text><text x="1105" y="303" fill="#fff" font-size="24" font-weight="800">Manifest 驗證</text><text x="1105" y="345" fill="#c6d4eb" font-size="18">欄位、檔案、期間、列數</text><text x="1105" y="376" fill="#c6d4eb" font-size="18">控制總額與冪等重跑</text>
<path d="M320 310H390" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M655 310H725" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M990 310H1060" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="175" y="535" width="330" height="205" rx="28" fill="#132b4d" stroke="#8fe8ff" stroke-width="3"/><text x="205" y="585" fill="#8fe8ff" font-size="19" font-weight="800">05　分權分析</text><text x="205" y="630" fill="#fff" font-size="24" font-weight="800">Athena／BI／資料湖</text><text x="205" y="672" fill="#c6d4eb" font-size="18">角色、workgroup、結果位置</text><text x="205" y="704" fill="#c6d4eb" font-size="18">財務與工程分離視圖</text>
<rect x="555" y="535" width="330" height="205" rx="28" fill="#132b4d" stroke="#ffbd70" stroke-width="3"/><text x="585" y="585" fill="#ffbd70" font-size="19" font-weight="800">06　治理監控</text><text x="585" y="630" fill="#fff" font-size="24" font-weight="800">IAM＋CloudTrail</text><text x="585" y="672" fill="#c6d4eb" font-size="18">MFA／短期憑證／最小權限</text><text x="585" y="704" fill="#c6d4eb" font-size="18">變更、刪除與失敗告警</text>
<rect x="935" y="535" width="330" height="205" rx="28" fill="#132b4d" stroke="#70efbd" stroke-width="3"/><text x="965" y="585" fill="#70efbd" font-size="19" font-weight="800">07　對帳與復原</text><text x="965" y="630" fill="#fff" font-size="24" font-weight="800">月結、備份、跨區</text><text x="965" y="672" fill="#c6d4eb" font-size="18">退款／折扣／調整再驗證</text><text x="965" y="704" fill="#c6d4eb" font-size="18">版本、生命週期、重建測試</text>
<path d="M1220 415V470H340V520" fill="none" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M505 637H540" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M885 637H920" stroke="#8fe8ff" stroke-width="5" marker-end="url(#arrow)"/>
</g>
<rect x="70" y="805" width="1300" height="52" rx="18" fill="#ff9900" fill-opacity=".12" stroke="#ffbd70"/><text x="720" y="838" text-anchor="middle" fill="#ffe1b8" font-family="system-ui,sans-serif" font-size="19" font-weight="700">匯出成功 ≠ 成本正確；必須同時驗證 Manifest、權限、資料品質、月結調整與復原能力</text>
</svg>
