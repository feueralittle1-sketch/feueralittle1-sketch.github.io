<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
<title id="title">Amazon SQS 可靠訊息處理流程手機版示意</title>
<desc id="desc">受控生產者依序將訊息送入加密 SQS，消費者執行冪等處理，失敗進入死信佇列，監控與可重播來源支援復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#112a45"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd27a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dcff"/></marker><style>.box{fill:#10243b;stroke:#42627f;stroke-width:2}.accent{fill:#182f49;stroke:#ffb64d;stroke-width:3}.t{font:700 27px system-ui,-apple-system,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 20px system-ui,-apple-system,'Noto Sans TC',sans-serif;fill:#bfd0e6}.k{font:800 17px system-ui,-apple-system,'Noto Sans TC',sans-serif;fill:#071426}.line{stroke:#78dcff;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#8fa9c1;stroke-width:3;stroke-dasharray:9 9;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="720" height="1500" rx="28" fill="url(#bg)"/>
<text x="46" y="64" class="t" font-size="31">示意｜SQS 可靠處理</text><text x="46" y="101" class="s">加密 · 冪等 · 死信 · 可重播</text>
<g><rect class="box" x="60" y="150" width="600" height="185" rx="24"/><rect x="92" y="178" width="112" height="34" rx="17" fill="url(#orange)"/><text x="148" y="202" text-anchor="middle" class="k">受控入口</text><text x="98" y="253" class="t">訂單 API</text><text x="98" y="292" class="s">先保存狀態，再以專用角色送入訊息</text></g>
<path class="line" d="M360 335V390"/>
<g><rect class="accent" x="60" y="405" width="600" height="220" rx="26"/><rect x="92" y="433" width="138" height="34" rx="17" fill="url(#orange)"/><text x="161" y="457" text-anchor="middle" class="k">區域內佇列</text><text x="98" y="516" class="t">加密 Amazon SQS</text><text x="98" y="555" class="s">標準或 FIFO · 可見性逾時</text><text x="98" y="592" class="s">最小權限 · 私有端點 · 有限保留</text></g>
<path class="line" d="M360 625V680"/>
<g><rect class="box" x="60" y="695" width="600" height="190" rx="24"/><rect x="92" y="723" width="135" height="34" rx="17" fill="#7be4ff"/><text x="159" y="747" text-anchor="middle" class="k">冪等消費</text><text x="98" y="804" class="t">背景工作者</text><text x="98" y="844" class="s">完成後才刪除；逾時前受控延長</text></g>
<path class="line" d="M360 885V940"/>
<g><rect class="box" x="60" y="955" width="600" height="190" rx="24"/><rect x="92" y="983" width="120" height="34" rx="17" fill="#ff7a90"/><text x="152" y="1007" text-anchor="middle" class="k">失敗隔離</text><text x="98" y="1064" class="t">死信佇列與重新驅動</text><text x="98" y="1104" class="s">有限重試，修正與驗證後分批重送</text></g>
<path class="line" d="M360 1145V1200"/>
<g><rect class="box" x="60" y="1215" width="285" height="185" rx="24"/><rect x="88" y="1243" width="112" height="34" rx="17" fill="#82f0ba"/><text x="144" y="1267" text-anchor="middle" class="k">持續觀測</text><text x="88" y="1320" class="t">監控與稽核</text><text x="88" y="1358" class="s">積壓、死信</text></g>
<g><rect class="box" x="375" y="1215" width="285" height="185" rx="24"/><rect x="403" y="1243" width="145" height="34" rx="17" fill="#c5a3ff"/><text x="475" y="1267" text-anchor="middle" class="k">跨區復原</text><text x="403" y="1320" class="t">可信重播來源</text><text x="403" y="1358" class="s">冪等重建進度</text></g>
<text x="46" y="1450" class="s">SQS 不會自動建立一般用途的跨區訊息副本。</text>
</svg>
