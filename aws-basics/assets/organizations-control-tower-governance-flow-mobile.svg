<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1420" viewBox="0 0 760 1420" role="img" aria-labelledby="title desc">
<title id="title">AWS Organizations 與 Control Tower 手機版多帳號治理流程</title>
<desc id="desc">治理需求進入 Control Tower Landing Zone，再以 Organizations、身分、政策及集中記錄管理多種帳號，最後持續處理漂移並演練復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102448"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7ee8ff"/></marker></defs>
<rect width="760" height="1420" rx="28" fill="url(#bg)"/><text x="48" y="64" fill="#fff" font-family="system-ui,sans-serif" font-size="30" font-weight="800">多帳號治理控制鏈</text><text x="48" y="102" fill="#a9bddb" font-family="system-ui,sans-serif" font-size="17">帳號邊界、集中證據與復原一起設計</text>
<g filter="url(#s)" font-family="system-ui,sans-serif"><rect x="70" y="145" width="620" height="130" rx="22" fill="#132c4d" stroke="#7ee8ff"/><text x="380" y="190" text-anchor="middle" fill="#7ee8ff" font-size="18" font-weight="700">治理需求</text><text x="380" y="229" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">資料・法規・責任・區域・復原目標</text>
<rect x="70" y="335" width="620" height="190" rx="24" fill="#182f50" stroke="#ffb34d" stroke-width="2"/><text x="380" y="381" text-anchor="middle" fill="#ffb34d" font-size="18" font-weight="700">CONTROL TOWER LANDING ZONE</text><text x="380" y="422" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">帳號供應・治理控制・集中基線</text><text x="380" y="464" text-anchor="middle" fill="#dce8f8" font-size="17">Organizations / OU / SCP</text><text x="380" y="494" text-anchor="middle" fill="#dce8f8" font-size="17">Identity Center / CloudTrail / Config</text></g>
<path d="M380 275v50M380 525v52" stroke="#7ee8ff" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)" font-family="system-ui,sans-serif"><rect x="70" y="590" width="300" height="180" rx="22" fill="#102a42" stroke="#62d6b4"/><text x="220" y="632" text-anchor="middle" fill="#78ecc8" font-size="17" font-weight="700">SECURITY / LOG</text><text x="220" y="672" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">安全與證據</text><text x="220" y="710" text-anchor="middle" fill="#bdcde2" font-size="16">集中日誌・保留控制</text><text x="220" y="740" text-anchor="middle" fill="#bdcde2" font-size="16">調查與委派管理</text>
<rect x="390" y="590" width="300" height="180" rx="22" fill="#102a42" stroke="#ffb34d"/><text x="540" y="632" text-anchor="middle" fill="#ffbf66" font-size="17" font-weight="700">PRODUCTION</text><text x="540" y="672" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">正式工作負載</text><text x="540" y="710" text-anchor="middle" fill="#bdcde2" font-size="16">最小權限・私有網路</text><text x="540" y="740" text-anchor="middle" fill="#bdcde2" font-size="16">多可用區・備份復原</text>
<rect x="70" y="795" width="300" height="180" rx="22" fill="#102a42" stroke="#7ee8ff"/><text x="220" y="837" text-anchor="middle" fill="#7ee8ff" font-size="17" font-weight="700">NON-PRODUCTION</text><text x="220" y="877" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">開發與測試</text><text x="220" y="915" text-anchor="middle" fill="#bdcde2" font-size="16">隔離資料・成本限制</text><text x="220" y="945" text-anchor="middle" fill="#bdcde2" font-size="16">部署驗證・期限管理</text>
<rect x="390" y="795" width="300" height="180" rx="22" fill="#102a42" stroke="#c995ff"/><text x="540" y="837" text-anchor="middle" fill="#d4b1ff" font-size="17" font-weight="700">SANDBOX</text><text x="540" y="877" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">受限實驗環境</text><text x="540" y="915" text-anchor="middle" fill="#bdcde2" font-size="16">允許服務・預算告警</text><text x="540" y="945" text-anchor="middle" fill="#bdcde2" font-size="16">自動清理・禁正式資料</text></g>
<path d="M380 975v60" stroke="#7ee8ff" stroke-width="4" marker-end="url(#a)"/>
<g filter="url(#s)" font-family="system-ui,sans-serif"><rect x="70" y="1050" width="620" height="250" rx="24" fill="#162b49" stroke="#ffb34d" stroke-width="2"/><text x="380" y="1095" text-anchor="middle" fill="#ffbf66" font-size="18" font-weight="700">持續驗證</text><text x="380" y="1140" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">漂移 → 判讀 → 核准修復</text><text x="380" y="1182" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">證據保存 → 復原演練</text><text x="380" y="1230" text-anchor="middle" fill="#bdcde2" font-size="16">控制通過不等於應用安全</text><text x="380" y="1262" text-anchor="middle" fill="#bdcde2" font-size="16">各帳號仍負責身分、網路、資料與備份</text></g>
<rect x="70" y="1330" width="620" height="46" rx="23" fill="#0c2038" stroke="#6a86aa"/><text x="380" y="1360" text-anchor="middle" fill="#c4d4e8" font-family="system-ui,sans-serif" font-size="16">組織治理提供邊界；可驗證的營運流程才形成韌性</text>
</svg>
