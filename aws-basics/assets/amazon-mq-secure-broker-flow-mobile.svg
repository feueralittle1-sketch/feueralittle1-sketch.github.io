<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc">
<title id="title">Amazon MQ 安全訊息代理行動版流程</title><desc id="desc">由 Producer、私有安全邊界、Amazon MQ、冪等 Consumer、監控與跨區復原組成的垂直示意流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="mq" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#77e6ff"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#fff}.s{font:700 23px system-ui,sans-serif;fill:#fff}.t{font:500 18px system-ui,sans-serif;fill:#c4d7f1}.k{font:800 23px system-ui,sans-serif;fill:#071426}.b{fill:#122b4d;stroke:#355d83;stroke-width:2}.g{fill:#10243e;stroke:#68def4;stroke-width:2}.f{fill:none;stroke:#77e6ff;stroke-width:5;marker-end:url(#a)}</style></defs>
<rect width="760" height="1280" rx="34" fill="url(#bg)"/><text x="42" y="58" class="h">Amazon MQ 安全訊息流程</text><text x="42" y="88" class="t">示意架構｜協定相容與可靠投遞</text>
<rect x="42" y="125" width="676" height="145" rx="24" class="b"/><text x="72" y="170" class="s">1. Producer 與既有應用</text><text x="72" y="207" class="t">JMS / AMQP / MQTT / STOMP</text><text x="72" y="240" class="t">事件 ID・Schema・有限重試</text><path d="M380 270V315" class="f"/>
<rect x="42" y="320" width="676" height="180" rx="24" class="g"/><text x="72" y="365" class="s">2. 私有安全邊界</text><text x="72" y="405" class="t">Private subnet・Security Group・必要 TLS 埠</text><text x="72" y="440" class="t">Broker 認證・Destination 最小授權</text><text x="72" y="475" class="t">Secrets Manager・憑證驗證</text><path d="M380 500V545" class="f"/>
<rect x="42" y="550" width="676" height="235" rx="28" fill="#18243c" stroke="#ffb34a" stroke-width="3"/><rect x="72" y="580" width="616" height="62" rx="18" fill="url(#mq)"/><text x="246" y="621" class="k">Amazon MQ Broker</text><text x="72" y="685" class="s">ActiveMQ 或 RabbitMQ</text><text x="72" y="724" class="t">Queue・Topic / Exchange・ack・TTL・prefetch</text><text x="72" y="759" class="t">Multi-AZ・KMS at rest・TLS in transit</text><path d="M380 785V830" class="f"/>
<rect x="42" y="835" width="676" height="155" rx="24" class="b"/><text x="72" y="880" class="s">3. Consumer 與失敗隔離</text><text x="72" y="920" class="t">自動重連・事件 ID・冪等寫入・業務對帳</text><text x="72" y="955" class="t">Poison message → 有限重試 → Dead-letter</text>
<rect x="42" y="1030" width="322" height="190" rx="24" class="g"/><text x="70" y="1074" class="s">偵測與稽核</text><text x="70" y="1113" class="t">CloudWatch 指標</text><text x="70" y="1146" class="t">Broker logs</text><text x="70" y="1179" class="t">CloudTrail 變更證據</text>
<rect x="396" y="1030" width="322" height="190" rx="24" class="g"/><text x="424" y="1074" class="s">區域復原</text><text x="424" y="1113" class="t">第二區域 Broker</text><text x="424" y="1146" class="t">KMS・VPC・身分</text><text x="424" y="1179" class="t">RPO / RTO 演練</text>
</svg>
