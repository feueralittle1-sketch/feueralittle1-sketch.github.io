<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" role="img" aria-labelledby="title desc">
<title id="title">AWS Proton 退場遷移治理流程手機版</title><desc id="desc">依序確認服務退場、保存盤點、重建管理能力、隔離驗證、分批切換、撤除舊信任，最後持續監控備份與跨區復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a46"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#63e6ff"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter></defs>
<rect width="720" height="1580" rx="32" fill="url(#bg)"/><text x="42" y="64" fill="#fff" font-size="31" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">AWS Proton 退場遷移治理</text><text x="42" y="101" fill="#a8bad8" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif">示意｜從失效控制面接回可持續管理能力</text><path d="M42 126H678" stroke="#ff9900" stroke-width="4"/>
<g font-family="Arial,'Noto Sans TC',sans-serif" filter="url(#shadow)">
<g><rect x="42" y="165" width="636" height="155" rx="24" fill="#17243a" stroke="#fb7185" stroke-width="2"/><circle cx="84" cy="207" r="20" fill="#fb7185"/><text x="84" y="214" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">1</text><text x="120" y="215" fill="#fff" font-size="25" font-weight="800">確認退場邊界</text><text x="72" y="260" fill="#c6d4eb" font-size="18"><tspan x="72">控制面不可存取；底層資源仍運作</tspan><tspan x="72" dy="30">凍結非必要變更並指定責任人</tspan></text></g>
<g><rect x="42" y="355" width="636" height="155" rx="24" fill="#17243a" stroke="#ffb45c" stroke-width="2"/><circle cx="84" cy="397" r="20" fill="#ffb45c"/><text x="84" y="404" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">2</text><text x="120" y="405" fill="#fff" font-size="25" font-weight="800">保存與盤點</text><text x="72" y="450" fill="#c6d4eb" font-size="18"><tspan x="72">Git、S3、模板、參數、輸出與狀態</tspan><tspan x="72" dy="30">管線、角色、帳號、區域與資源關聯</tspan></text></g>
<g><rect x="42" y="545" width="636" height="155" rx="24" fill="#17243a" stroke="#63e6ff" stroke-width="2"/><circle cx="84" cy="587" r="20" fill="#63e6ff"/><text x="84" y="594" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">3</text><text x="120" y="595" fill="#fff" font-size="25" font-weight="800">重建管理能力</text><text x="72" y="640" fill="#c6d4eb" font-size="18"><tspan x="72">版本化 IaC，選擇 GitOps／CI/CD</tspan><tspan x="72" dy="30">按環境建立最小權限部署角色</tspan></text></g>
<g><rect x="42" y="735" width="636" height="155" rx="24" fill="#17243a" stroke="#a78bfa" stroke-width="2"/><circle cx="84" cy="777" r="20" fill="#a78bfa"/><text x="84" y="784" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">4</text><text x="120" y="785" fill="#fff" font-size="25" font-weight="800">隔離驗證</text><text x="72" y="830" fill="#c6d4eb" font-size="18"><tspan x="72">檢查 change set、更新、擴縮與回復</tspan><tspan x="72" dy="30">實測備份還原與跨區重建</tspan></text></g>
<g><rect x="42" y="925" width="636" height="155" rx="24" fill="#132d3d" stroke="#63e6ff" stroke-width="2"/><circle cx="84" cy="967" r="20" fill="#63e6ff"/><text x="84" y="974" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">5</text><text x="120" y="975" fill="#fff" font-size="25" font-weight="800">分批切換與回復</text><text x="72" y="1020" fill="#c6d4eb" font-size="18"><tspan x="72">低風險先行，每批保留停止條件</tspan><tspan x="72" dy="30">驗證流量、資料、監控與成本</tspan></text></g>
<g><rect x="42" y="1115" width="636" height="155" rx="24" fill="#222642" stroke="#a78bfa" stroke-width="2"/><circle cx="84" cy="1157" r="20" fill="#a78bfa"/><text x="84" y="1164" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">6</text><text x="120" y="1165" fill="#fff" font-size="25" font-weight="800">撤除舊信任</text><text x="72" y="1210" fill="#c6d4eb" font-size="18"><tspan x="72">撤銷舊角色、grant、連線與 webhook</tspan><tspan x="72" dy="30">保存遷移證據與例外紀錄</tspan></text></g>
<g><rect x="42" y="1305" width="636" height="170" rx="24" fill="#2b2835" stroke="#ffb45c" stroke-width="2"/><circle cx="84" cy="1347" r="20" fill="#ffb45c"/><text x="84" y="1354" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">7</text><text x="120" y="1355" fill="#fff" font-size="25" font-weight="800">持續治理</text><text x="72" y="1400" fill="#c6d4eb" font-size="18"><tspan x="72">CloudTrail／CloudWatch、漂移與成本</tspan><tspan x="72" dy="30">定期演練更新、備份還原與跨區復原</tspan></text></g>
</g>
<g stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"><path d="M360 323V345"/><path d="M360 513V535"/><path d="M360 703V725"/><path d="M360 893V915"/><path d="M360 1083V1105"/><path d="M360 1273V1295"/></g>
<text x="360" y="1530" text-anchor="middle" fill="#e6eefc" font-size="18" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">完成：可安全更新、稽核、備份、回復與跨區重建</text>
</svg>
