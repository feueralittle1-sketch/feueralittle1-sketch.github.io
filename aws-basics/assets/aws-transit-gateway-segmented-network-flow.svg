<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">AWS Transit Gateway 分段網路與集中檢查示意</title>
<desc id="desc">正式、開發、共享服務 VPC 與地端網路連到中央 Transit Gateway；分段路由表將必要流量導向檢查 VPC，並由 IAM、日誌、加密與跨區復原治理。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#102444"/></linearGradient><linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffbd70"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#72dcff"/></marker><style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f5f9ff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#abc0df}.box{fill:#10243e;stroke:#31577d;stroke-width:2}.line{fill:none;stroke:#72dcff;stroke-width:5;marker-end:url(#arrow)}.dash{fill:none;stroke:#9b8cff;stroke-width:4;stroke-dasharray:12 10;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1000" rx="42" fill="url(#bg)"/><text class="t" x="80" y="85" font-size="44" font-weight="800">Transit Gateway：集中連線不等於全部互通</text><text class="m" x="80" y="128" font-size="24">association 決定入口查表；propagation 決定哪些路由可見；檢查鏈必須維持去回程對稱</text>
<g filter="url(#shadow)"><rect class="box" x="90" y="215" width="330" height="170" rx="28"/><text class="t" x="125" y="260" font-size="28" font-weight="800">正式 VPC</text><text class="m" x="125" y="302" font-size="21">訂單／會員工作負載</text><text class="m" x="125" y="336" font-size="21">Route table：PROD</text><rect x="125" y="352" width="180" height="7" rx="4" fill="#ff9900"/>
<rect class="box" x="90" y="465" width="330" height="170" rx="28"/><text class="t" x="125" y="510" font-size="28" font-weight="800">開發 VPC</text><text class="m" x="125" y="552" font-size="21">測試／CI 工作負載</text><text class="m" x="125" y="586" font-size="21">Route table：DEV</text><rect x="125" y="602" width="180" height="7" rx="4" fill="#52d6a4"/>
<rect class="box" x="90" y="715" width="330" height="170" rx="28"/><text class="t" x="125" y="760" font-size="28" font-weight="800">地端／分支</text><text class="m" x="125" y="802" font-size="21">VPN 或 Direct Connect</text><text class="m" x="125" y="836" font-size="21">核准前綴與 BGP</text><rect x="125" y="852" width="180" height="7" rx="4" fill="#9b8cff"/>
<rect x="610" y="335" width="380" height="270" rx="54" fill="url(#hub)"/><text x="800" y="415" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#081426" font-size="34" font-weight="900">AWS Transit Gateway</text><text x="800" y="462" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="23" font-weight="700">Attachments</text><text x="800" y="500" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="23">Association · Propagation</text><text x="800" y="538" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="23">Static / Blackhole Routes</text><text x="800" y="576" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="23">多張分段 Route Tables</text>
<rect class="box" x="1180" y="215" width="330" height="170" rx="28"/><text class="t" x="1215" y="260" font-size="28" font-weight="800">共享服務 VPC</text><text class="m" x="1215" y="302" font-size="21">DNS／目錄／管理服務</text><text class="m" x="1215" y="336" font-size="21">只發布必要 CIDR</text><rect x="1215" y="352" width="180" height="7" rx="4" fill="#72dcff"/>
<rect class="box" x="1180" y="465" width="330" height="170" rx="28"/><text class="t" x="1215" y="510" font-size="28" font-weight="800">檢查 VPC</text><text class="m" x="1215" y="552" font-size="21">Network Firewall／GWLB</text><text class="m" x="1215" y="586" font-size="21">Appliance mode · 多 AZ</text><rect x="1215" y="602" width="180" height="7" rx="4" fill="#ff6f91"/>
<rect class="box" x="1180" y="715" width="330" height="170" rx="28"/><text class="t" x="1215" y="760" font-size="28" font-weight="800">第二區域</text><text class="m" x="1215" y="802" font-size="21">TGW peering／備援路由</text><text class="m" x="1215" y="836" font-size="21">DNS、資料與檢查復原</text><rect x="1215" y="852" width="180" height="7" rx="4" fill="#9b8cff"/></g>
<path class="line" d="M420 300H585"/><path class="line" d="M420 550H585"/><path class="line" d="M420 800C520 800 535 605 635 570"/><path class="line" d="M990 410H1155"/><path class="line" d="M990 535H1155"/><path class="dash" d="M940 605C1030 760 1080 800 1155 800"/>
<g><rect x="520" y="695" width="560" height="220" rx="30" fill="#0a192d" stroke="#31577d" stroke-width="2"/><text class="t" x="560" y="745" font-size="27" font-weight="800">治理控制面</text><text class="m" x="560" y="790" font-size="21">IAM Identity Center · MFA · 短期憑證 · 最小權限 · IaC 審批</text><text class="m" x="560" y="830" font-size="21">TGW / VPC Flow Logs · CloudTrail · CloudWatch · 路由漂移告警</text><text class="m" x="560" y="870" font-size="21">KMS · Secrets Manager / Parameter Store · 備份與跨區演練</text></g>
</svg>
