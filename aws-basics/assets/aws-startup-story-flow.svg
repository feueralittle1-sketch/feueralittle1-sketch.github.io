<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">小型電商 AWS 使用情境流程</title><desc id="desc">顧客從網域進入，流量經 CloudFront 與 WAF，再進入應用、資料與觀測服務。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b2340"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#63e6ff"/></marker></defs><rect width="1200" height="700" rx="42" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="42" font-weight="800" font-family="sans-serif">故事：一間小型電商如何組合 AWS</text><text x="70" y="118" fill="#9fb3d9" font-size="22" font-family="sans-serif">每個服務解決一段需求；安全與可觀測性貫穿全程</text><g font-family="sans-serif"><g transform="translate(60 185)"><rect width="180" height="105" rx="22" fill="#152b48" stroke="#63e6ff"/><text x="90" y="43" text-anchor="middle" fill="#63e6ff" font-size="24" font-weight="700">顧客</text><text x="90" y="76" text-anchor="middle" fill="#e6eefc" font-size="19">瀏覽與下單</text></g><g transform="translate(285 185)"><rect width="220" height="105" rx="22" fill="#152b48" stroke="#71a7ff"/><text x="110" y="38" text-anchor="middle" fill="#71a7ff" font-size="22" font-weight="700">入口與加速</text><text x="110" y="70" text-anchor="middle" fill="#e6eefc" font-size="18">Route 53 · CloudFront</text><text x="110" y="94" text-anchor="middle" fill="#ff9bcf" font-size="17">WAF 過濾攻擊</text></g><g transform="translate(550 185)"><rect width="250" height="105" rx="22" fill="#152b48" stroke="#57f0c1"/><text x="125" y="38" text-anchor="middle" fill="#57f0c1" font-size="22" font-weight="700">應用程式</text><text x="125" y="70" text-anchor="middle" fill="#e6eefc" font-size="18">ALB · ECS／Lambda</text><text x="125" y="94" text-anchor="middle" fill="#9fb3d9" font-size="17">依流量自動擴展</text></g><g transform="translate(845 185)"><rect width="290" height="105" rx="22" fill="#152b48" stroke="#9c8cff"/><text x="145" y="38" text-anchor="middle" fill="#b9aaff" font-size="22" font-weight="700">資料與物件</text><text x="145" y="70" text-anchor="middle" fill="#e6eefc" font-size="18">RDS／DynamoDB · S3</text><text x="145" y="94" text-anchor="middle" fill="#9fb3d9" font-size="17">訂單、商品圖、備份</text></g><path d="M240 237 H278" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 237 H543" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 237 H838" stroke="#63e6ff" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(110 390)"><rect width="450" height="165" rx="26" fill="#102b3c" stroke="#57f0c1"/><text x="225" y="43" text-anchor="middle" fill="#57f0c1" font-size="25" font-weight="700">每天營運：看得見才管得到</text><text x="34" y="84" fill="#e6eefc" font-size="20">CloudWatch：指標、日誌與告警</text><text x="34" y="116" fill="#e6eefc" font-size="20">CloudTrail：API 操作稽核軌跡</text><text x="34" y="148" fill="#e6eefc" font-size="20">Budgets：成本門檻與通知</text></g><g transform="translate(640 390)"><rect width="450" height="165" rx="26" fill="#2b1f3a" stroke="#ff9bcf"/><text x="225" y="43" text-anchor="middle" fill="#ff9bcf" font-size="25" font-weight="700">安全底線：不靠運氣</text><text x="34" y="84" fill="#e6eefc" font-size="20">IAM：最小權限、MFA、短期憑證</text><text x="34" y="116" fill="#e6eefc" font-size="20">KMS：資料加密與金鑰治理</text><text x="34" y="148" fill="#e6eefc" font-size="20">備份、分段、弱點與事件回應</text></g><path d="M600 300 V350 H335 V382" fill="none" stroke="#57f0c1" stroke-width="4" marker-end="url(#arrow)"/><path d="M600 350 H865 V382" fill="none" stroke="#ff9bcf" stroke-width="4" marker-end="url(#arrow)"/><rect x="190" y="610" width="820" height="48" rx="24" fill="#0d1d32" stroke="#ffffff" stroke-opacity=".14"/><text x="600" y="641" text-anchor="middle" fill="#c6d4eb" font-size="20">情境是示意故事；實際服務選型仍取決於流量、法規、團隊能力、可用性與成本。</text></g></svg>