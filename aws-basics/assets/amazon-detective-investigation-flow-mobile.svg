<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Detective 雲端事件調查流程手機版</title>
  <desc id="desc">安全發現與 AWS 活動資料進入 Amazon Detective 行為圖譜，再經關聯分析、原始證據驗證、隔離處置及復原確認。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:32px;font-weight:800}.s{font-size:21px}.k{font-size:17px;font-weight:700;letter-spacing:.06em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1280" rx="30" fill="url(#bg)"/>
  <circle cx="70" cy="90" r="170" fill="#ff9900" opacity=".08"/><circle cx="670" cy="1160" r="220" fill="#55d8ff" opacity=".07"/>
  <text x="42" y="66" class="t h">Amazon Detective</text><text x="42" y="104" class="t h">雲端事件調查</text>
  <text x="42" y="142" class="m s">示意：關聯 → 驗證 → 處置 → 復原</text>
  <g filter="url(#shadow)"><rect class="box" x="42" y="184" width="636" height="184" rx="24"/><text x="70" y="226" class="t k">01 調查輸入</text>
    <text x="70" y="280" class="t s">GuardDuty · Security Hub CSPM</text><text x="70" y="322" class="t s">CloudTrail · VPC Flow · EKS audit</text><text x="70" y="350" class="m" style="font-size:17px;font-family:Inter,'Noto Sans TC',sans-serif">帳號 · 區域 · 時間範圍</text></g>
  <path class="line" d="M360 368V414"/>
  <g filter="url(#shadow)"><rect x="42" y="414" width="636" height="246" rx="24" fill="#122b49" stroke="#ffb657" stroke-width="2"/><rect x="70" y="446" width="580" height="8" rx="4" fill="url(#orange)"/><text x="70" y="504" class="t h">02 行為圖譜</text><text x="70" y="548" class="m s">實體 · 關係 · Profile · 時間軸</text><text x="70" y="594" class="t s">Finding group 建立調查假設</text><text x="70" y="632" class="m s">關聯是線索，不是事件結論</text></g>
  <path class="line" d="M360 660V706"/>
  <g filter="url(#shadow)"><rect class="box" x="42" y="706" width="636" height="214" rx="24"/><text x="70" y="750" class="t k">03 原始證據驗證</text><text x="70" y="804" class="t s">CloudTrail / SIEM / S3 證據封存</text><text x="70" y="846" class="t s">身分事件 · 變更單 · 工作負載紀錄</text><text x="70" y="890" class="m s">最小揭露 · 保留控制 · 職責分離</text></g>
  <path class="line" d="M360 920V966"/>
  <g filter="url(#shadow)"><rect class="box" x="42" y="966" width="636" height="150" rx="24"/><text x="70" y="1010" class="t k">04 處置與復原</text><text x="70" y="1060" class="t s">撤銷工作階段 · 隔離 · 縮權 · 修復</text><text x="70" y="1098" class="m s">驗證 finding、身分、網路與服務健康</text></g>
  <g transform="translate(42 1150)"><rect width="636" height="88" rx="22" fill="#0d1f35" stroke="#62e5c6" stroke-width="2"/><text x="24" y="34" class="t k">持續控制面</text><text x="24" y="66" class="m" style="font-size:18px;font-family:Inter,'Noto Sans TC',sans-serif">最小權限 · KMS · 稽核監控 · 原始日誌 · 備份復原</text></g>
</svg>
