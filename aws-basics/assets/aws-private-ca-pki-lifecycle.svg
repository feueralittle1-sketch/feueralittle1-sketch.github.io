<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
<title id="title">AWS Private CA 私有 PKI 使用情境流程</title>
<desc id="desc">安全帳號中的根 CA 簽署兩個區域從屬 CA，工作負載經身分驗證後取得短效憑證並使用雙向 TLS；CloudTrail、CRL 或 OCSP、監控、備份與跨區復原形成治理閉環。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102449"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffca7a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#8fe8ff"/></marker><style>.h{font:700 34px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 23px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 18px Inter,'Noto Sans TC',sans-serif;fill:#bcd0ee}.m{font:700 16px Inter,'Noto Sans TC',sans-serif;fill:#ffcb8a}.box{fill:#10233f;stroke:#375a83;stroke-width:2}.guard{fill:#0a1c33;stroke:#31c8e8;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="920" rx="32" fill="url(#bg)"/>
<text x="70" y="72" class="h">私有 PKI：信任、簽發、使用、撤銷與復原</text><text x="70" y="108" class="s">示意架構｜根 CA 不處理日常簽發，區域從屬 CA 與工作負載權限分離</text>
<g filter="url(#shadow)"><rect x="500" y="145" width="400" height="145" rx="24" fill="#2a1b0a" stroke="#ff9900" stroke-width="3"/><circle cx="575" cy="217" r="42" fill="url(#orange)"/><path d="M560 218l12 12 23-28" fill="none" stroke="#07111f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="199" class="t">安全帳號｜根 CA</text><text x="640" y="232" class="s">只簽署核准的從屬 CA</text><text x="640" y="260" class="m">MFA · 短期憑證 · 雙人核准</text></g>
<path d="M610 290 C520 340 410 345 340 385" class="line"/><path d="M790 290 C880 340 990 345 1060 385" class="line"/>
<g filter="url(#shadow)"><rect x="110" y="385" width="460" height="185" rx="24" class="box"/><text x="150" y="430" class="t">東京區域｜正式環境從屬 CA</text><text x="150" y="466" class="s">核准範本 · 名稱驗證 · 短效憑證</text><rect x="150" y="495" width="170" height="42" rx="21" fill="#173d55"/><text x="176" y="522" class="m">最小權限簽發</text><rect x="335" y="495" width="190" height="42" rx="21" fill="#173d55"/><text x="360" y="522" class="m">禁止簽發新 CA</text></g>
<g filter="url(#shadow)"><rect x="830" y="385" width="460" height="185" rx="24" class="box"/><text x="870" y="430" class="t">新加坡區域｜復原從屬 CA</text><text x="870" y="466" class="s">獨立簽發路徑 · 信任鏈預先分發</text><rect x="870" y="495" width="175" height="42" rx="21" fill="#173d55"/><text x="896" y="522" class="m">區域故障切換</text><rect x="1060" y="495" width="185" height="42" rx="21" fill="#173d55"/><text x="1085" y="522" class="m">復原程序演練</text></g>
<path d="M340 570 L340 630" class="line"/><path d="M1060 570 L1060 630" class="line"/>
<g filter="url(#shadow)"><rect x="90" y="640" width="500" height="160" rx="24" class="box"/><text x="130" y="685" class="t">工作負載與裝置</text><text x="130" y="721" class="s">身分驗證 → CSR → 短效憑證 → 自動輪替</text><text x="130" y="757" class="m">私鑰不進映像、Git、日誌或公開儲存區</text><path d="M400 785 C500 835 900 835 1000 785" fill="none" stroke="#ff9900" stroke-width="4" stroke-dasharray="9 8"/><text x="605" y="850" class="t">雙向 TLS：驗證名稱、用途、鏈與效期</text></g>
<g filter="url(#shadow)"><rect x="810" y="640" width="500" height="160" rx="24" class="box"/><text x="850" y="685" class="t">服務端與 API</text><text x="850" y="721" class="s">驗證憑證鏈 · 對應應用授權 · 拒絕失效身分</text><text x="850" y="757" class="m">憑證驗證不等於完整授權政策</text></g>
<g filter="url(#shadow)"><rect x="605" y="350" width="190" height="285" rx="24" class="guard"/><text x="647" y="393" class="t">治理控制</text><text x="635" y="435" class="s">CloudTrail 稽核</text><text x="635" y="473" class="s">CRL／OCSP</text><text x="635" y="511" class="s">CloudWatch 告警</text><text x="635" y="549" class="s">信任鏈清冊</text><text x="635" y="587" class="s">CA 接班演練</text><text x="635" y="617" class="m">IaC 與程序備份</text></g>
<path d="M605 450 L570 450" class="line"/><path d="M795 450 L830 450" class="line"/><path d="M650 635 L555 675" class="line"/><path d="M750 635 L845 675" class="line"/>
</svg>
