<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS IAM 員工短期存取與稽核流程示意</title>
  <desc id="desc">員工先通過身分提供者與多因素驗證，再由 IAM Identity Center 取得短期角色工作階段，依最小權限存取私有 AWS 資源；CloudTrail、CloudWatch 與 Access Analyzer 支援稽核與持續檢查。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294b"/></linearGradient>
    <linearGradient id="secure" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123c4b"/><stop offset="1" stop-color="#174158"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#63e6ff"/></marker>
    <style>.box{fill:#10243d;stroke:#355979;stroke-width:2}.safe{fill:url(#secure);stroke:#57f0c1;stroke-width:2}.t{fill:#f5f9ff;font:700 24px sans-serif}.s{fill:#b9c9e3;font:18px sans-serif}.k{fill:#ffbd70;font:700 17px sans-serif;letter-spacing:1px}.line{fill:none;stroke:#63e6ff;stroke-width:5;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:10 9}</style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="56" y="64" class="k">示意架構｜員工以短期工作階段存取 AWS</text>
  <text x="56" y="105" class="t" font-size="31">先驗證身分，再授予受限角色；所有重要操作留下可追查紀錄</text>
  <g filter="url(#shadow)"><rect x="55" y="180" width="205" height="145" rx="20" class="box"/><text x="90" y="228" class="t">員工</text><text x="90" y="266" class="s">受管裝置</text><text x="90" y="296" class="s">不保存長期金鑰</text></g>
  <g filter="url(#shadow)"><rect x="345" y="165" width="245" height="175" rx="20" class="safe"/><text x="380" y="214" class="t">企業身分來源</text><text x="380" y="252" class="s">IdP／目錄</text><text x="380" y="282" class="s">MFA · 離職停權</text><text x="380" y="312" class="s">群組與條件式存取</text></g>
  <g filter="url(#shadow)"><rect x="675" y="165" width="235" height="175" rx="20" class="safe"/><text x="710" y="214" class="t">IAM Identity</text><text x="710" y="244" class="t">Center</text><text x="710" y="282" class="s">權限集 → IAM 角色</text><text x="710" y="312" class="s">短期工作階段</text></g>
  <g filter="url(#shadow)"><rect x="990" y="180" width="160" height="145" rx="20" class="box"/><text x="1024" y="228" class="t">私有資源</text><text x="1024" y="266" class="s">S3／EC2</text><text x="1024" y="296" class="s">依條件授權</text></g>
  <path d="M260 252H335" class="line"/><text x="277" y="232" class="k">1 登入</text>
  <path d="M590 252H665" class="line"/><text x="604" y="232" class="k">2 聯合</text>
  <path d="M910 252H980" class="line"/><text x="920" y="232" class="k">3 存取</text>
  <rect x="55" y="430" width="1095" height="205" rx="24" fill="#0b1c33" stroke="#29496a" stroke-width="2"/>
  <text x="88" y="474" class="k">持續治理與偵測</text>
  <g><rect x="88" y="510" width="240" height="88" rx="16" class="box"/><text x="118" y="546" class="t">CloudTrail</text><text x="118" y="577" class="s">API 稽核與保護日誌</text></g>
  <g><rect x="368" y="510" width="240" height="88" rx="16" class="box"/><text x="398" y="546" class="t">CloudWatch</text><text x="398" y="577" class="s">告警與事件回應</text></g>
  <g><rect x="648" y="510" width="240" height="88" rx="16" class="box"/><text x="678" y="546" class="t">Access Analyzer</text><text x="678" y="577" class="s">外部與未用權限分析</text></g>
  <g><rect x="928" y="510" width="190" height="88" rx="16" class="safe"/><text x="958" y="546" class="t">定期複核</text><text x="958" y="577" class="s">撤權與演練</text></g>
  <path d="M792 340V402H210V500" class="dash"/><path d="M792 402H1023V500" class="dash"/>
  <text x="56" y="685" class="s">控制重點：MFA／短期憑證／最小權限／權限邊界／集中稽核／緊急存取程序</text>
</svg>
