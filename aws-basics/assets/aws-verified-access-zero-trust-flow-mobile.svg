<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">AWS Verified Access 零信任應用存取流程手機版示意</title>
  <desc id="desc">使用者與受管裝置經身分及裝置信任提供者送出信任資料，由 Verified Access 群組與端點政策逐次判斷，再將核准請求送往私有應用並集中記錄。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a4c"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#7de3ff"/></marker><style>.b{fill:#0d203a;stroke:#385b7d;stroke-width:2}.x{fill:#132b48;stroke:#ffad3d;stroke-width:3}.t{font:700 28px system-ui,sans-serif;fill:#fff}.s{font:500 20px system-ui,sans-serif;fill:#bfd2ea}.k{font:700 21px system-ui,sans-serif;fill:#ffd28f}.a{fill:none;stroke:#7de3ff;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="720" height="1320" rx="32" fill="url(#bg)"/>
  <text x="360" y="58" text-anchor="middle" class="t">AWS Verified Access</text><text x="360" y="94" text-anchor="middle" class="s">每次請求都先驗證，再連到私有應用</text>
  <rect class="b" x="90" y="135" width="540" height="130" rx="24"/><text x="360" y="188" text-anchor="middle" class="k">1. 使用者與受管裝置</text><text x="360" y="226" text-anchor="middle" class="s">瀏覽器／Connectivity Client</text>
  <path class="a" d="M360 265V320"/>
  <rect class="b" x="55" y="335" width="280" height="160" rx="22"/><text x="195" y="385" text-anchor="middle" class="k">2A. 身分信任</text><text x="195" y="425" text-anchor="middle" class="s">Identity Center／OIDC</text><text x="195" y="461" text-anchor="middle" class="s">MFA、群組、工作階段</text>
  <rect class="b" x="385" y="335" width="280" height="160" rx="22"/><text x="525" y="385" text-anchor="middle" class="k">2B. 裝置信任</text><text x="525" y="425" text-anchor="middle" class="s">合規、修補、端點防護</text><text x="525" y="461" text-anchor="middle" class="s">高風險裝置拒絕</text>
  <path class="a" d="M195 495V555H320"/><path class="a" d="M525 495V555H400"/>
  <rect class="x" x="90" y="580" width="540" height="245" rx="28"/><text x="360" y="635" text-anchor="middle" class="t">3. Verified Access</text><rect x="155" y="675" width="410" height="58" rx="15" fill="#08192d"/><text x="360" y="713" text-anchor="middle" class="k">群組政策 + 端點政策</text><text x="360" y="770" text-anchor="middle" class="s">預設拒絕 · 持續評估信任資料</text>
  <path class="a" d="M360 825V880"/>
  <rect class="b" x="90" y="895" width="540" height="145" rx="24"/><text x="360" y="947" text-anchor="middle" class="k">4. 私有應用</text><text x="360" y="987" text-anchor="middle" class="s">ALB／網路介面 · 最小化安全群組</text><text x="360" y="1019" text-anchor="middle" class="s">應用授權與資料保護仍由客戶負責</text>
  <path class="a" d="M360 1040V1095"/>
  <rect class="b" x="55" y="1110" width="610" height="140" rx="24"/><text x="360" y="1160" text-anchor="middle" class="k">5. 記錄、告警與復原</text><text x="360" y="1200" text-anchor="middle" class="s">CloudWatch Logs／S3／Data Firehose · CloudTrail</text><text x="360" y="1233" text-anchor="middle" class="s">KMS、Secrets Manager、備份與跨區演練</text>
  <text x="360" y="1290" text-anchor="middle" class="s">原創示意圖｜Dr. William · 2026-10-25</text>
</svg>
