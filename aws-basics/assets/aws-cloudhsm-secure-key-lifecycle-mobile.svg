<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1180" viewBox="0 0 760 1180" role="img" aria-labelledby="title desc"><title id="title">AWS CloudHSM 安全金鑰生命週期行動版示意</title><desc id="desc">請求核准後由私有簽章服務呼叫跨可用區 CloudHSM，再以稽核、監控、備份與跨區復原治理。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10294a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#74d9ff"/></marker></defs><rect width="760" height="1180" rx="32" fill="url(#bg)"/><text x="42" y="62" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="29" font-weight="800">CloudHSM 安全金鑰流程</text><text x="42" y="98" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">示意｜身分、應用、HSM 與復原分層治理</text>
<g><rect x="42" y="140" width="676" height="135" rx="22" fill="#122944" stroke="#506b89"/><circle cx="105" cy="207" r="32" fill="#253f60"/><path d="M94 207l8 8 18-22" fill="none" stroke="#7ee8bc" stroke-width="7" stroke-linecap="round"/><text x="160" y="190" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="24" font-weight="700">1. 請求與核准</text><text x="160" y="225" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">MFA＋短期憑證＋應用授權＋雙人核准</text></g><path d="M380 275v42" stroke="#74d9ff" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="42" y="330" width="676" height="145" rx="22" fill="#122944" stroke="#506b89"/><rect x="82" y="372" width="70" height="62" rx="12" fill="#223e60" stroke="#74d9ff"/><path d="M100 403h34M117 386v34" stroke="#74d9ff" stroke-width="5"/><text x="190" y="382" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="24" font-weight="700">2. 私有簽章服務</text><text x="190" y="417" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">私有子網路・PKCS #11 / JCE</text><text x="190" y="446" fill="#ffcc80" font-family="Arial,'Noto Sans TC',sans-serif" font-size="16">只送入雜湊，私鑰不離開 HSM</text></g><path d="M380 475v42" stroke="#74d9ff" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="42" y="530" width="676" height="310" rx="26" fill="#0b1e35" stroke="#ff9900" stroke-width="2"/><text x="76" y="575" fill="#ffb84d" font-family="Arial,'Noto Sans TC',sans-serif" font-size="24" font-weight="800">3. CloudHSM 叢集｜同一區域</text><rect x="76" y="610" width="285" height="155" rx="20" fill="#132b47" stroke="#5a7697"/><text x="105" y="646" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">可用區 A</text><rect x="120" y="669" width="195" height="57" rx="13" fill="#253e5d" stroke="#ffb84d"/><text x="164" y="705" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="19" font-weight="700">專屬 HSM</text><rect x="399" y="610" width="285" height="155" rx="20" fill="#132b47" stroke="#5a7697"/><text x="428" y="646" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">可用區 B</text><rect x="443" y="669" width="195" height="57" rx="13" fill="#253e5d" stroke="#ffb84d"/><text x="487" y="705" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="19" font-weight="700">專屬 HSM</text><text x="98" y="805" fill="#ffcc80" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">HSM 使用者・金鑰同步・不可匯出私鑰</text></g><path d="M380 840v42" stroke="#74d9ff" stroke-width="5" marker-end="url(#a)"/>
<g><rect x="42" y="895" width="676" height="215" rx="24" fill="#10243d" stroke="#476686"/><text x="78" y="940" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="23" font-weight="800">4. 稽核、監控與復原</text><text x="78" y="982" fill="#7ee8bc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">● CloudTrail＋業務稽核</text><text x="78" y="1017" fill="#7ee8bc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">● CloudWatch 連線、延遲、錯誤與容量</text><text x="78" y="1052" fill="#7ee8bc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">● 加密備份隔離還原與密碼作業驗證</text><text x="78" y="1087" fill="#7ee8bc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">● 跨區叢集、網路、機密與應用切換演練</text></g><text x="42" y="1148" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="15">IAM 管控制面；HSM 使用者管裝置權限；應用授權管業務作業。</text></svg>