<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Security Lake 安全資料治理流程手機版</title>
  <desc id="desc">AWS 與自訂安全資料經 OCSF 正規化寫入 Amazon Security Lake，再由受控訂閱者查詢、驗證原始證據並執行處置及復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:32px;font-weight:800}.s{font-size:21px}.k{font-size:17px;font-weight:700;letter-spacing:.06em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1280" rx="30" fill="url(#bg)"/>
  <circle cx="70" cy="90" r="170" fill="#ff9900" opacity=".08"/><circle cx="670" cy="1160" r="220" fill="#55d8ff" opacity=".07"/>
  <text x="42" y="66" class="t h">Amazon Security Lake</text><text x="42" y="104" class="t h">安全資料治理</text>
  <text x="42" y="142" class="m s">示意：正規化 → 查詢 → 驗證 → 復原</text>
  <g filter="url(#shadow)"><rect class="box" x="42" y="184" width="636" height="184" rx="24"/><text x="70" y="226" class="t k">01 安全資料來源</text>
    <text x="70" y="280" class="t s">CloudTrail · VPC · Route 53 Resolver</text><text x="70" y="322" class="t s">Security Hub · 第三方 · 自訂來源</text><text x="70" y="350" class="m" style="font-size:17px;font-family:Inter,'Noto Sans TC',sans-serif">帳號 · 區域 · 來源版本</text></g>
  <path class="line" d="M360 368V414"/>
  <g filter="url(#shadow)"><rect x="42" y="414" width="636" height="246" rx="24" fill="#122b49" stroke="#ffb657" stroke-width="2"/><rect x="70" y="446" width="580" height="8" rx="4" fill="url(#orange)"/><text x="70" y="504" class="t h">02 OCSF 安全資料湖</text><text x="70" y="548" class="m s">S3 · Parquet · Glue Data Catalog</text><text x="70" y="594" class="t s">區域彙整 · KMS · 儲存生命週期</text><text x="70" y="632" class="m s">集中資料不等於事件結論</text></g>
  <path class="line" d="M360 660V706"/>
  <g filter="url(#shadow)"><rect class="box" x="42" y="706" width="636" height="214" rx="24"/><text x="70" y="750" class="t k">03 受控分析與證據驗證</text><text x="70" y="804" class="t s">Lake Formation · Athena · SIEM</text><text x="70" y="846" class="t s">訂閱者限權 · 回查原始紀錄</text><text x="70" y="890" class="m s">最小權限 · 查詢預算 · 完整性</text></g>
  <path class="line" d="M360 920V966"/>
  <g filter="url(#shadow)"><rect class="box" x="42" y="966" width="636" height="150" rx="24"/><text x="70" y="1010" class="t k">04 處置與復原</text><text x="70" y="1060" class="t s">撤銷工作階段 · 隔離 · 縮權 · 修復</text><text x="70" y="1098" class="m s">驗證來源、監控、備份與跨區流程</text></g>
  <g transform="translate(42 1150)"><rect width="636" height="88" rx="22" fill="#0d1f35" stroke="#62e5c6" stroke-width="2"/><text x="24" y="34" class="t k">持續控制面</text><text x="24" y="66" class="m" style="font-size:18px;font-family:Inter,'Noto Sans TC',sans-serif">IAM · 公開存取 · KMS · 稽核 · 機密 · 備份復原</text></g>
</svg>
