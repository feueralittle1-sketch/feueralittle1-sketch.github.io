<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Amazon SQS 可靠訊息處理流程示意</title>
<desc id="desc">訂單事件由受控生產者送入加密 SQS，消費者執行冪等處理並在成功後刪除，失敗訊息進入死信佇列，監控與跨區重播來源支援復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#112a45"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd27a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dcff"/></marker><style>.box{fill:#10243b;stroke:#42627f;stroke-width:2}.accent{fill:#182f49;stroke:#ffb64d;stroke-width:3}.t{font:700 27px system-ui,-apple-system,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 20px system-ui,-apple-system,'Noto Sans TC',sans-serif;fill:#bfd0e6}.k{font:800 17px system-ui,-apple-system,'Noto Sans TC',sans-serif;fill:#071426}.line{stroke:#78dcff;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#8fa9c1;stroke-width:3;stroke-dasharray:9 9;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<text x="80" y="80" class="t" font-size="38">示意｜Amazon SQS 可靠非同步處理</text><text x="80" y="118" class="s">最小權限 · 加密 · 冪等消費 · 有限重試 · 可觀測 · 可重播</text>
<g filter="url(#shadow)"><rect class="box" x="70" y="230" width="280" height="220" rx="26"/><rect x="98" y="258" width="112" height="34" rx="17" fill="url(#orange)"/><text x="154" y="282" text-anchor="middle" class="k">受控入口</text><text x="105" y="337" class="t">訂單 API</text><text x="105" y="375" class="s">先保存業務狀態</text><text x="105" y="407" class="s">專用角色送入訊息</text></g>
<g filter="url(#shadow)"><rect class="accent" x="470" y="190" width="360" height="300" rx="32"/><rect x="500" y="220" width="138" height="36" rx="18" fill="url(#orange)"/><text x="569" y="245" text-anchor="middle" class="k">區域內佇列</text><text x="510" y="310" class="t">加密 Amazon SQS</text><text x="510" y="352" class="s">標準或 FIFO</text><text x="510" y="389" class="s">可見性逾時與保留期</text><text x="510" y="426" class="s">受限政策與私有端點</text></g>
<g filter="url(#shadow)"><rect class="box" x="950" y="230" width="340" height="220" rx="26"/><rect x="980" y="258" width="135" height="34" rx="17" fill="#7be4ff"/><text x="1047" y="282" text-anchor="middle" class="k">冪等消費</text><text x="990" y="337" class="t">背景工作者</text><text x="990" y="375" class="s">完成後才刪除訊息</text><text x="990" y="407" class="s">逾時前受控延長</text></g>
<path class="line" d="M350 340H460"/><path class="line" d="M830 340H940"/><path class="dash" d="M1120 450C1120 545 760 560 690 495"/>
<text x="812" y="555" text-anchor="middle" class="s">失敗或逾時 → 有限重試</text>
<g filter="url(#shadow)"><rect class="box" x="1080" y="600" width="390" height="180" rx="26"/><rect x="1110" y="628" width="120" height="34" rx="17" fill="#ff7a90"/><text x="1170" y="652" text-anchor="middle" class="k">失敗隔離</text><text x="1120" y="706" class="t">死信佇列與重新驅動</text><text x="1120" y="744" class="s">分析、修正、驗證後分批重送</text></g>
<path class="line" d="M1290 450V590"/>
<g filter="url(#shadow)"><rect class="box" x="70" y="600" width="390" height="180" rx="26"/><rect x="100" y="628" width="120" height="34" rx="17" fill="#82f0ba"/><text x="160" y="652" text-anchor="middle" class="k">持續觀測</text><text x="110" y="706" class="t">CloudWatch 與 CloudTrail</text><text x="110" y="744" class="s">積壓、最舊訊息、死信與管理變更</text></g>
<path class="dash" d="M470 430C365 475 290 525 265 590"/>
<g filter="url(#shadow)"><rect class="box" x="540" y="640" width="430" height="170" rx="26"/><rect x="570" y="668" width="145" height="34" rx="17" fill="#c5a3ff"/><text x="642" y="692" text-anchor="middle" class="k">跨區復原邊界</text><text x="580" y="746" class="t">可重播來源與完成狀態</text><text x="580" y="782" class="s">替代區域重建佇列後冪等重播</text></g>
<path class="dash" d="M755 640V505"/>
<text x="80" y="854" class="s">注意：SQS 不會自動建立一般用途的跨區訊息副本；復原能力來自可重播事件、處理狀態與演練。</text>
</svg>
