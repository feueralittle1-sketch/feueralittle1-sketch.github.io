<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Amazon FSx 受管檔案儲存使用情境流程</title>
  <desc id="desc">從工作負載需求盤點開始，選擇 Windows File Server、Lustre、NetApp ONTAP 或 OpenZFS，部署至私有子網路，再納入身分、加密、監控、備份與跨區復原。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#6ee7f9"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs>
  <rect width="1400" height="820" rx="36" fill="url(#bg)"/><rect x="40" y="36" width="1320" height="748" rx="28" fill="none" stroke="#31527d"/>
  <text x="70" y="92" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">Amazon FSx：受管檔案儲存選型、隔離與復原</text><text x="70" y="126" fill="#9fb6d8" font-family="system-ui,sans-serif" font-size="18">示意流程｜協定與工作負載先決定檔案系統，不以單一產品取代需求分析</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif"><rect x="70" y="180" width="250" height="210" rx="24" fill="#132a4c" stroke="#5075a8"/><text x="95" y="225" fill="#ffbd70" font-size="22" font-weight="800">1. 需求盤點</text><text x="95" y="266" fill="#e8f1ff" font-size="18"><tspan x="95">協定：SMB / NFS</tspan><tspan x="95" dy="30">效能：IOPS / 吞吐</tspan><tspan x="95" dy="30">語意：ACL / snapshot</tspan><tspan x="95" dy="30">RTO / RPO / 資料量</tspan></text>
  <rect x="390" y="160" width="620" height="250" rx="26" fill="#10213d" stroke="#ff9900"/><text x="420" y="205" fill="#fff" font-size="24" font-weight="800">2. 選擇符合需求的 FSx 檔案系統</text><rect x="420" y="235" width="260" height="62" rx="16" fill="#203d68"/><text x="440" y="273" fill="#fff" font-size="18" font-weight="700">Windows File Server｜SMB</text><rect x="720" y="235" width="260" height="62" rx="16" fill="#203d68"/><text x="750" y="273" fill="#fff" font-size="18" font-weight="700">Lustre｜HPC / ML</text><rect x="420" y="320" width="260" height="62" rx="16" fill="#203d68"/><text x="455" y="358" fill="#fff" font-size="18" font-weight="700">NetApp ONTAP</text><rect x="720" y="320" width="260" height="62" rx="16" fill="#203d68"/><text x="790" y="358" fill="#fff" font-size="18" font-weight="700">OpenZFS</text>
  <rect x="1080" y="180" width="250" height="210" rx="24" fill="#132a4c" stroke="#5075a8"/><text x="1105" y="225" fill="#ffbd70" font-size="22" font-weight="800">3. 私有部署</text><text x="1105" y="266" fill="#e8f1ff" font-size="18"><tspan x="1105">VPC 私有子網路</tspan><tspan x="1105" dy="30">Security Group</tspan><tspan x="1105" dy="30">DNS / 目錄整合</tspan><tspan x="1105" dy="30">跨 AZ 或單 AZ 選型</tspan></text></g>
  <path d="M320 285h55" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/><path d="M1010 285h55" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui,sans-serif"><rect x="70" y="485" width="1260" height="210" rx="28" fill="#0c1b32" stroke="#31527d"/><text x="100" y="528" fill="#fff" font-size="23" font-weight="800">4. 全生命週期控制</text><g fill="#162f54" stroke="#3b6898"><rect x="100" y="558" width="210" height="95" rx="18"/><rect x="335" y="558" width="210" height="95" rx="18"/><rect x="570" y="558" width="210" height="95" rx="18"/><rect x="805" y="558" width="210" height="95" rx="18"/><rect x="1040" y="558" width="260" height="95" rx="18"/></g><g fill="#e9f4ff" font-size="17" font-weight="700" text-anchor="middle"><text x="205" y="592">IAM 最小權限<tspan x="205" dy="25">MFA／短期憑證</tspan></text><text x="440" y="592">KMS 加密<tspan x="440" dy="25">秘密集中管理</tspan></text><text x="675" y="592">CloudTrail<tspan x="675" dy="25">CloudWatch 告警</tspan></text><text x="910" y="592">備份與還原<tspan x="910" dy="25">容量／效能驗證</tspan></text><text x="1170" y="592">跨區複製或重建<tspan x="1170" dy="25">隔離復原演練</tspan></text></g></g>
  <rect x="350" y="730" width="700" height="34" rx="17" fill="url(#accent)"/><text x="700" y="754" fill="#071426" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="900">FSx 管理檔案系統基礎設施；客戶仍管理資料、身分、網路、用戶端、備份與復原驗收</text>
</svg>