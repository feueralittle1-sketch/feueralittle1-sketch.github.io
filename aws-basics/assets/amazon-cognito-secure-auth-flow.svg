<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Cognito 安全會員登入與資源授權流程示意圖</title>
  <desc id="desc">使用者經受管登入、MFA、OAuth 授權碼與 PKCE 進入 Cognito 使用者集區，API 驗證 access token 並執行資料層授權；需要直接存取 AWS 資源時，身分集區簽發受限 STS 短期憑證，周邊由 WAF、KMS、CloudWatch、CloudTrail 與多區域復原保護。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd28f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 23px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 17px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 16px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="72" y="72" class="k">ORIGINAL ARCHITECTURE DIAGRAM · 示意</text>
  <text x="72" y="116" class="t" font-size="34">把身分驗證、API 授權與 AWS 資源權限分層</text>
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="205" height="128" rx="22" class="box"/>
    <text x="172" y="232" text-anchor="middle" class="k">會員端</text>
    <text x="172" y="267" text-anchor="middle" class="t">Web／Mobile</text>
    <text x="172" y="296" text-anchor="middle" class="s">state・nonce・PKCE</text>

    <rect x="340" y="165" width="365" height="330" rx="28" fill="#091a31" stroke="url(#accent)" stroke-width="3"/>
    <text x="380" y="207" class="k">COGNITO USER POOL</text>
    <rect x="385" y="238" width="275" height="86" rx="18" class="step"/>
    <text x="522" y="273" text-anchor="middle" class="t">受管登入／聯合 IdP</text>
    <text x="522" y="301" text-anchor="middle" class="s">OIDC／SAML＋MFA</text>
    <rect x="385" y="365" width="275" height="86" rx="18" class="step"/>
    <text x="522" y="400" text-anchor="middle" class="t">OAuth 授權碼＋PKCE</text>
    <text x="522" y="428" text-anchor="middle" class="s">簽發短效 access token</text>
    <path d="M522 324V365" class="line"/>

    <rect x="770" y="190" width="260" height="128" rx="22" class="box"/>
    <text x="900" y="232" text-anchor="middle" class="k">API 邊界</text>
    <text x="900" y="267" text-anchor="middle" class="t">JWT 完整驗證</text>
    <text x="900" y="296" text-anchor="middle" class="s">iss・client・token_use・scope</text>

    <rect x="1095" y="190" width="275" height="128" rx="22" class="box"/>
    <text x="1232" y="232" text-anchor="middle" class="k">應用與資料層</text>
    <text x="1232" y="267" text-anchor="middle" class="t">租戶／物件授權</text>
    <text x="1232" y="296" text-anchor="middle" class="s">擁有權・角色・敏感操作</text>

    <path d="M275 254H340" class="line"/>
    <path d="M705 254H770" class="line"/>
    <path d="M1030 254H1095" class="line"/>

    <rect x="340" y="545" width="365" height="118" rx="22" class="box"/>
    <text x="522" y="585" text-anchor="middle" class="k">只在需要直接呼叫 AWS API 時</text>
    <text x="522" y="620" text-anchor="middle" class="t">Cognito Identity Pool</text>
    <text x="522" y="646" text-anchor="middle" class="s">可信聲明 → 專用 IAM 角色</text>

    <rect x="770" y="545" width="260" height="118" rx="22" class="step"/>
    <text x="900" y="585" text-anchor="middle" class="k">AWS STS</text>
    <text x="900" y="620" text-anchor="middle" class="t">短期 AWS 憑證</text>
    <text x="900" y="646" text-anchor="middle" class="s">audience・authenticated・tag</text>

    <rect x="1095" y="545" width="275" height="118" rx="22" class="box"/>
    <text x="1232" y="585" text-anchor="middle" class="k">受限資源</text>
    <text x="1232" y="620" text-anchor="middle" class="t">KMS 加密 S3</text>
    <text x="1232" y="646" text-anchor="middle" class="s">會員專屬前綴＋資源政策</text>

    <path d="M522 495V545" class="line"/>
    <path d="M705 604H770" class="line"/>
    <path d="M1030 604H1095" class="line"/>
  </g>
  <g>
    <rect x="70" y="720" width="300" height="120" rx="22" class="guard"/><text x="100" y="758" class="k">入口防護</text><text x="100" y="793" class="t">WAF＋威脅防護</text><text x="100" y="820" class="s">枚舉防護、限流、風險驗證</text>
    <rect x="400" y="720" width="300" height="120" rx="22" class="guard"/><text x="430" y="758" class="k">管理與機密</text><text x="430" y="793" class="t">MFA＋短期管理憑證</text><text x="430" y="820" class="s">Secrets Manager・KMS・最小權限</text>
    <rect x="730" y="720" width="300" height="120" rx="22" class="guard"/><text x="760" y="758" class="k">觀測與稽核</text><text x="760" y="793" class="t">CloudWatch／CloudTrail</text><text x="760" y="820" class="s">登入、節流、觸發器、設定變更</text>
    <rect x="1060" y="720" width="310" height="120" rx="22" class="guard"/><text x="1090" y="758" class="k">營運持續</text><text x="1090" y="793" class="t">多區域使用者集區</text><text x="1090" y="820" class="s">DNS、IdP、API、資料共同演練</text>
  </g>
  <text x="720" y="875" text-anchor="middle" class="s">重點：登入成功只建立可信身分；每一層仍須執行自己的授權與資料隔離。</text>
</svg>