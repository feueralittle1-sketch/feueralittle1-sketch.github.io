<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AWS Secrets Manager 安全取用、輪替與跨區復原示意流程</title>
<desc id="desc">私有應用以 IAM 角色經 VPC 端點取得目前機密，輪替函數建立、更新、測試並切換版本，CloudTrail 與 CloudWatch 負責稽核告警，機密複寫至備援區域。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".32"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#67e8f9"/></marker></defs>
<rect width="1200" height="700" rx="30" fill="url(#bg)"/><rect x="28" y="26" width="1144" height="648" rx="26" fill="none" stroke="#294866"/>
<text x="60" y="78" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="30" font-weight="700">示意｜機密只在執行期取用，輪替完成驗證後才切換</text><rect x="60" y="96" width="560" height="5" rx="2" fill="url(#accent)"/>
<g font-family="Arial,'Noto Sans TC',sans-serif" filter="url(#shadow)">
<rect x="65" y="165" width="220" height="150" rx="20" fill="#10243a" stroke="#67e8f9" stroke-width="2"/><text x="175" y="205" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="700">私有應用工作負載</text><text x="175" y="244" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">IAM Role</text><text x="175" y="276" text-anchor="middle" fill="#bfd3e8" font-size="16">短期憑證・最小權限</text>
<rect x="370" y="165" width="220" height="150" rx="20" fill="#10243a" stroke="#67e8f9" stroke-width="2"/><text x="480" y="205" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="700">私有存取路徑</text><text x="480" y="244" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">VPC 介面端點</text><text x="480" y="276" text-anchor="middle" fill="#bfd3e8" font-size="16">TLS・受控安全群組</text>
<rect x="675" y="145" width="250" height="190" rx="22" fill="#172841" stroke="#ffb14d" stroke-width="3"/><text x="800" y="188" text-anchor="middle" fill="#ffb14d" font-size="19" font-weight="700">AWS Secrets Manager</text><text x="800" y="228" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">AWSCURRENT</text><text x="800" y="262" text-anchor="middle" fill="#bfd3e8" font-size="16">版本・資源政策・KMS</text><text x="800" y="296" text-anchor="middle" fill="#86efac" font-size="16">只回傳必要機密</text>
<rect x="990" y="165" width="150" height="150" rx="20" fill="#10243a" stroke="#a78bfa" stroke-width="2"/><text x="1065" y="208" text-anchor="middle" fill="#c4b5fd" font-size="18" font-weight="700">私有資料庫</text><text x="1065" y="244" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">目標服務</text><text x="1065" y="278" text-anchor="middle" fill="#bfd3e8" font-size="15">禁止公開存取</text>
</g>
<g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"><path d="M285 240H360"/><path d="M590 240H665"/><path d="M925 240H980"/></g><text x="327" y="224" text-anchor="middle" fill="#bcecf5" font-family="Arial,'Noto Sans TC',sans-serif" font-size="14">1. 驗證</text><text x="632" y="224" text-anchor="middle" fill="#bcecf5" font-family="Arial,'Noto Sans TC',sans-serif" font-size="14">2. 取用</text><text x="953" y="224" text-anchor="middle" fill="#bcecf5" font-family="Arial,'Noto Sans TC',sans-serif" font-size="14">3. 連線</text>
<g font-family="Arial,'Noto Sans TC',sans-serif" filter="url(#shadow)"><rect x="65" y="405" width="360" height="175" rx="22" fill="#10243a" stroke="#ffb14d" stroke-width="2"/><text x="245" y="447" text-anchor="middle" fill="#ffb14d" font-size="19" font-weight="700">輪替 Lambda（私有子網路）</text><text x="245" y="486" text-anchor="middle" fill="#fff" font-size="17">① 建立新值　② 更新目標</text><text x="245" y="519" text-anchor="middle" fill="#fff" font-size="17">③ 測試連線　④ 切換版本</text><text x="245" y="552" text-anchor="middle" fill="#86efac" font-size="15">失敗時保留可用目前版本</text>
<rect x="495" y="405" width="300" height="175" rx="22" fill="#10243a" stroke="#67e8f9" stroke-width="2"/><text x="645" y="447" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">CloudTrail ＋ CloudWatch</text><text x="645" y="487" text-anchor="middle" fill="#fff" font-size="17">政策變更・存取事件</text><text x="645" y="520" text-anchor="middle" fill="#fff" font-size="17">輪替失敗・異常呼叫</text><text x="645" y="553" text-anchor="middle" fill="#bfd3e8" font-size="15">集中稽核與告警</text>
<rect x="865" y="405" width="275" height="175" rx="22" fill="#10243a" stroke="#a78bfa" stroke-width="2"/><text x="1002" y="447" text-anchor="middle" fill="#c4b5fd" font-size="19" font-weight="700">備援 AWS 區域</text><text x="1002" y="487" text-anchor="middle" fill="#fff" font-size="17">機密複本 ＋ 區域 KMS</text><text x="1002" y="520" text-anchor="middle" fill="#fff" font-size="17">IAM・端點・資料庫</text><text x="1002" y="553" text-anchor="middle" fill="#bfd3e8" font-size="15">演練後才具備復原能力</text></g>
<g fill="none" stroke="#ffb14d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"><path d="M425 470C535 380 630 355 730 335"/><path d="M425 520C690 640 930 365 1010 325"/></g><g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"><path d="M800 335V395"/><path d="M925 320C1000 348 1000 370 1002 395"/></g>
<text x="60" y="635" fill="#9fb7cf" font-family="Arial,'Noto Sans TC',sans-serif" font-size="16">控制重點：不硬編碼・不寫入日誌・最小權限・MFA／短期憑證・KMS・私有網路・稽核告警・跨區演練</text>
</svg>
