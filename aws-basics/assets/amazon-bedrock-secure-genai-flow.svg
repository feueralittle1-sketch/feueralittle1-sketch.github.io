<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Amazon Bedrock 生成式 AI 安全治理流程</title>
<desc id="desc">使用者請求經身分驗證、輸入驗證與防護政策，應用程式以短期憑證和最小權限呼叫 Amazon Bedrock，搭配知識庫、加密資料來源、輸出檢查、CloudWatch、CloudTrail、成本限制與跨區復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79e7ff"/></marker><style>.h{font:700 42px system-ui,sans-serif;fill:#fff}.s{font:700 23px system-ui,sans-serif;fill:#e8f2ff}.t{font:500 19px system-ui,sans-serif;fill:#bfd1ea}.k{font:800 22px system-ui,sans-serif;fill:#081426}.box{fill:#122b4d;stroke:#355d83;stroke-width:2}.guard{fill:#10243e;stroke:#69dff5;stroke-width:2}.flow{fill:none;stroke:#79e7ff;stroke-width:5;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1000" rx="42" fill="url(#bg)"/><text x="70" y="78" class="h">Amazon Bedrock｜生成式 AI 推論與治理閉環</text><text x="72" y="116" class="t">示意架構，不代表特定企業部署</text>
<rect x="60" y="165" width="300" height="365" rx="28" class="box" filter="url(#shadow)"/><text x="95" y="220" class="s">使用者與應用</text><text x="95" y="270" class="t">身分驗證・租戶隔離</text><text x="95" y="310" class="t">輸入長度・格式・配額</text><text x="95" y="350" class="t">敏感資料最小化</text><rect x="95" y="390" width="230" height="96" rx="18" class="guard"/><text x="123" y="428" class="t">IAM Role・短期憑證</text><text x="123" y="461" class="t">模型 / 動作最小權限</text>
<rect x="425" y="150" width="350" height="400" rx="30" class="guard" filter="url(#shadow)"/><text x="465" y="205" class="s">推論前控制</text><text x="465" y="258" class="t">✓ Prompt injection 防護</text><text x="465" y="302" class="t">✓ Guardrails 政策</text><text x="465" y="346" class="t">✓ PII / 機密資料檢查</text><text x="465" y="390" class="t">✓ 模型與區域允許清單</text><text x="465" y="434" class="t">✓ VPC endpoint / Egress</text><text x="465" y="478" class="t">✓ Token 與成本上限</text><text x="465" y="522" class="t">✓ 人工覆核高風險流程</text>
<rect x="835" y="135" width="430" height="455" rx="34" fill="#18243c" stroke="#ffb44c" stroke-width="3" filter="url(#shadow)"/><rect x="870" y="175" width="360" height="76" rx="22" fill="url(#ai)"/><text x="955" y="225" class="k">Amazon Bedrock</text><text x="880" y="301" class="s">Converse / InvokeModel</text><rect x="880" y="335" width="340" height="94" rx="18" class="box"/><text x="914" y="373" class="t">Foundation model・推論設定</text><text x="914" y="405" class="t">On-demand / Provisioned</text><rect x="880" y="452" width="340" height="91" rx="18" class="guard"/><text x="914" y="490" class="t">Guardrails・Agents</text><text x="914" y="522" class="t">Knowledge Bases・KMS</text>
<rect x="1320" y="165" width="230" height="365" rx="28" class="box" filter="url(#shadow)"/><text x="1350" y="220" class="s">輸出與行動</text><text x="1350" y="272" class="t">事實 / 引用檢查</text><text x="1350" y="311" class="t">內容安全過濾</text><text x="1350" y="350" class="t">權限再次驗證</text><text x="1350" y="389" class="t">人員確認高風險操作</text><rect x="1350" y="425" width="170" height="68" rx="16" class="guard"/><text x="1378" y="466" class="t">回應 / 工具執行</text>
<path d="M360 345H425" class="flow"/><path d="M775 345H835" class="flow"/><path d="M1265 345H1320" class="flow"/>
<rect x="70" y="660" width="455" height="250" rx="28" class="guard"/><text x="108" y="716" class="s">資料與知識邊界</text><text x="108" y="765" class="t">S3 / 向量儲存：分類、KMS、保留期限</text><text x="108" y="806" class="t">Secrets Manager / Parameter Store 管理機密</text><text x="108" y="847" class="t">檢索結果套用文件與租戶授權</text><text x="108" y="888" class="t">禁止把未授權內容送入提示或日誌</text>
<rect x="570" y="660" width="420" height="250" rx="28" class="box"/><text x="608" y="716" class="s">偵測、稽核與成本</text><text x="608" y="765" class="t">CloudWatch：延遲、錯誤、token、拒絕率</text><text x="608" y="806" class="t">CloudTrail：控制面與支援的資料事件</text><text x="608" y="847" class="t">模型調用日誌需明確啟用與安全保存</text><text x="608" y="888" class="t">Budget・配額・每使用者速率限制</text>
<rect x="1030" y="660" width="500" height="250" rx="28" class="guard"/><text x="1068" y="716" class="s">評測、可用性與復原</text><text x="1068" y="765" class="t">離線測試：品質、安全、偏誤與拒絕案例</text><text x="1068" y="806" class="t">模型版本或提示變更使用受控發布</text><text x="1068" y="847" class="t">第二區域重建 Guardrail、知識庫與權限</text><text x="1068" y="888" class="t">故障時降級、停止自動行動並量測 RTO</text>
<path d="M1435 530C1435 620 330 610 300 660" class="flow"/><path d="M1050 590C970 628 910 640 850 660" class="flow"/>
</svg>
