<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">AWS App Runner 安全 Web 服務與替代平台流程</title>
  <desc id="desc">受控程式碼或 ECR 映像經供應鏈檢查部署至 App Runner，使用公開或私有入口、自動擴縮、VPC connector、Secrets、KMS、監控稽核，並保留替代平台及跨區重建能力。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102747"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffbf66"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#44d7f2"/><stop offset="1" stop-color="#79f2d0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#ffb44d"/></marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#65e7e2"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#fff}.h{font-size:30px;font-weight:800}.b{font-size:22px;font-weight:700}.s{font-size:18px;fill:#c8d8ed}.tiny{font-size:16px;fill:#9eb5d1}.box{fill:#102640;stroke:#355777;stroke-width:2}.lineO{fill:none;stroke:#ffb44d;stroke-width:5;marker-end:url(#arrowO)}.lineC{fill:none;stroke:#65e7e2;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowC)}</style>
  </defs>
  <rect width="1600" height="940" rx="34" fill="url(#bg)"/>
  <text x="70" y="70" class="t h">示意｜AWS App Runner 受管部署、安全邊界與退出能力</text>
  <text x="70" y="106" class="t s">簡化平台不等於免治理：來源、角色、入口、機密、資料、監控與替代方案都須留下可驗證控制。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="300" height="185" rx="24" class="box"/>
    <rect x="92" y="188" width="110" height="34" rx="17" fill="#253e59"/>
    <text x="147" y="211" text-anchor="middle" class="t tiny">SOURCE</text>
    <text x="100" y="262" class="t b">Git / ECR 映像</text>
    <text x="100" y="297" class="t s">測試 · SBOM · 掃描</text>
    <text x="100" y="327" class="t s">簽章 · 不可變版本</text>

    <rect x="470" y="145" width="650" height="350" rx="30" fill="#132d4c" stroke="url(#orange)" stroke-width="4"/>
    <rect x="500" y="175" width="250" height="42" rx="21" fill="url(#orange)"/>
    <text x="625" y="204" text-anchor="middle" class="t b" fill="#071426">AWS APP RUNNER</text>
    <text x="510" y="260" class="t b">受管建置／拉取與部署</text>
    <text x="510" y="297" class="t s">HTTPS · 健康檢查 · 路由</text>
    <text x="510" y="330" class="t s">自動擴縮 · 服務執行個體</text>
    <rect x="510" y="365" width="270" height="92" rx="18" fill="#0b1e35" stroke="#4b6d8d"/>
    <text x="645" y="402" text-anchor="middle" class="t b">Instance role</text>
    <text x="645" y="433" text-anchor="middle" class="t tiny">執行期最小權限</text>
    <rect x="810" y="365" width="270" height="92" rx="18" fill="#0b1e35" stroke="#4b6d8d"/>
    <text x="945" y="402" text-anchor="middle" class="t b">Autoscaling</text>
    <text x="945" y="433" text-anchor="middle" class="t tiny">min / max / concurrency</text>

    <rect x="1230" y="165" width="300" height="185" rx="24" class="box"/>
    <text x="1260" y="221" class="t b">公開或私有入口</text>
    <text x="1260" y="260" class="t s">Public endpoint</text>
    <text x="1260" y="291" class="t s">Private endpoint</text>
    <text x="1260" y="322" class="t tiny">認證 · 授權 · DNS</text>
  </g>

  <path d="M370 258H460" class="lineO"/>
  <path d="M1220 258H1130" class="lineO"/>
  <text x="415" y="241" text-anchor="middle" class="t tiny">核准版本</text>
  <text x="1175" y="241" text-anchor="middle" class="t tiny">HTTPS</text>

  <g filter="url(#shadow)">
    <rect x="80" y="585" width="330" height="235" rx="25" class="box"/>
    <text x="110" y="638" class="t b">IAM 與機密控制</text>
    <text x="110" y="681" class="t s">MFA · 短期憑證</text>
    <text x="110" y="714" class="t s">Secrets / Parameter Store</text>
    <text x="110" y="747" class="t s">KMS 加密 · 角色分離</text>
    <text x="110" y="780" class="t tiny">敏感值不進程式、映像或日誌</text>

    <rect x="500" y="585" width="310" height="235" rx="25" class="box"/>
    <text x="530" y="638" class="t b">VPC Connector</text>
    <text x="530" y="681" class="t s">僅處理應用出站</text>
    <text x="530" y="714" class="t s">私有 subnet / SG</text>
    <text x="530" y="747" class="t s">Aurora · cache · API</text>
    <text x="530" y="780" class="t tiny">限制目的地、連接埠與下游容量</text>

    <rect x="900" y="585" width="290" height="235" rx="25" class="box"/>
    <text x="930" y="638" class="t b">監控與稽核</text>
    <text x="930" y="681" class="t s">CloudWatch Logs</text>
    <text x="930" y="714" class="t s">Metrics · X-Ray</text>
    <text x="930" y="747" class="t s">CloudTrail · 告警</text>
    <text x="930" y="780" class="t tiny">部署、權限與異常流量可追溯</text>

    <rect x="1280" y="555" width="250" height="295" rx="25" fill="#12382f" stroke="url(#cyan)" stroke-width="3"/>
    <text x="1310" y="610" class="t b">退出與復原</text>
    <text x="1310" y="653" class="t s">OCI 映像 + IaC</text>
    <text x="1310" y="686" class="t s">ECS / Fargate</text>
    <text x="1310" y="719" class="t s">跨區資料復原</text>
    <text x="1310" y="752" class="t s">DNS 流量切換</text>
    <text x="1310" y="798" class="t tiny">定期演練，不等待事件發生</text>
  </g>

  <path d="M620 505V575" class="lineC"/>
  <path d="M790 505C790 545 250 535 250 575" class="lineC"/>
  <path d="M930 505C930 545 1045 535 1045 575" class="lineC"/>
  <path d="M1120 455C1250 455 1405 470 1405 545" class="lineC"/>
  <path d="M810 704H890" class="lineC"/>
  <path d="M1190 704H1270" class="lineC"/>

  <rect x="70" y="870" width="1460" height="2" fill="#355777"/>
  <text x="70" y="908" class="t tiny">生命週期門禁：新客戶不可採用；既有客戶應持續治理，並驗證替代平台能否接手服務。</text>
</svg>
