<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1320" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
<title id="title">AWS Transit Gateway 分段網路手機版示意</title><desc id="desc">正式與開發 VPC、地端和共享服務透過中央 Transit Gateway 分段路由，必要流量經檢查 VPC，並搭配身分、日誌、加密及跨區復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071425"/><stop offset="1" stop-color="#102444"/></linearGradient><linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffbd70"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#72dcff"/></marker><style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f5f9ff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#abc0df}.box{fill:#10243e;stroke:#31577d;stroke-width:2}.line{stroke:#72dcff;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="720" height="1320" rx="34" fill="url(#bg)"/><text class="t" x="42" y="68" font-size="31" font-weight="800">Transit Gateway 分段網路</text><text class="m" x="42" y="105" font-size="18">集中連線後，仍須逐一控制路由與回程</text>
<g><rect class="box" x="42" y="155" width="285" height="145" rx="24"/><text class="t" x="68" y="197" font-size="24" font-weight="800">正式 VPC</text><text class="m" x="68" y="234" font-size="18">Route table：PROD</text><text class="m" x="68" y="268" font-size="18">只到核准服務與地端</text>
<rect class="box" x="393" y="155" width="285" height="145" rx="24"/><text class="t" x="419" y="197" font-size="24" font-weight="800">開發 VPC</text><text class="m" x="419" y="234" font-size="18">Route table：DEV</text><text class="m" x="419" y="268" font-size="18">不得直達正式環境</text>
<rect x="110" y="385" width="500" height="240" rx="45" fill="url(#hub)"/><text x="360" y="455" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#081426" font-size="31" font-weight="900">AWS Transit Gateway</text><text x="360" y="500" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="20">Attachment + Association</text><text x="360" y="537" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="20">Propagation + Static Route</text><text x="360" y="574" text-anchor="middle" font-family="Inter,'Noto Sans TC',sans-serif" fill="#21304a" font-size="20">分段表 + Blackhole</text>
<path class="line" d="M184 300V365H280"/><path class="line" d="M536 300V365H440"/>
<rect class="box" x="42" y="720" width="285" height="145" rx="24"/><text class="t" x="68" y="762" font-size="24" font-weight="800">共享／地端</text><text class="m" x="68" y="799" font-size="18">必要 CIDR、VPN／DX</text><text class="m" x="68" y="833" font-size="18">跨帳號由 RAM 分享</text>
<rect class="box" x="393" y="720" width="285" height="145" rx="24"/><text class="t" x="419" y="762" font-size="24" font-weight="800">檢查 VPC</text><text class="m" x="419" y="799" font-size="18">防火牆跨可用區</text><text class="m" x="419" y="833" font-size="18">Appliance mode 對稱</text>
<path class="line" d="M280 625L184 700"/><path class="line" d="M440 625L536 700"/>
<rect class="box" x="42" y="940" width="636" height="300" rx="28"/><text class="t" x="74" y="992" font-size="26" font-weight="800">治理與復原</text><text class="m" x="74" y="1040" font-size="19">• IAM 最小權限、MFA、短期憑證、IaC 審批</text><text class="m" x="74" y="1082" font-size="19">• TGW / VPC Flow Logs、CloudTrail、CloudWatch</text><text class="m" x="74" y="1124" font-size="19">• KMS、Secrets Manager / Parameter Store</text><text class="m" x="74" y="1166" font-size="19">• 第二區域 TGW、路由、DNS、資料與檢查復原</text><text class="m" x="74" y="1208" font-size="19">• 驗證允許、拒絕、非對稱與單區故障路徑</text><path class="line" d="M360 865V920"/></g>
</svg>
