<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1320" viewBox="0 0 390 1320" role="img" aria-labelledby="title desc">
<title id="title">AWS Storage Gateway 混合式儲存安全流程手機版示意圖</title><desc id="desc">自建應用經需求盤點，連接隔離網段中的 File、Volume 或 Tape Gateway，再以加密通道連接 AWS 儲存；下方列出特有風險、控制、監看與復原驗收。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10294a"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7de3ff"/></marker><style>.h{font:800 22px system-ui,"Noto Sans TC",sans-serif;fill:#fff}.t{font:700 18px system-ui,"Noto Sans TC",sans-serif;fill:#fff}.s{font:500 14px system-ui,"Noto Sans TC",sans-serif;fill:#c9d8ee}.b{fill:#102744;stroke:#456b91;stroke-width:1.5}.r{fill:#2d1c2b;stroke:#fb7185;stroke-width:1.5}.c{fill:#102f2d;stroke:#54d6b0;stroke-width:1.5}.l{stroke:#7de3ff;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="390" height="1320" rx="24" fill="url(#bg)"/><text x="24" y="45" class="h">Storage Gateway 安全流程</text><text x="24" y="72" class="s">示意：先定義協定、延遲、RPO 與資料權威。</text>
<rect x="24" y="105" width="342" height="180" rx="20" class="b"/><text x="48" y="140" class="t">01 自建環境</text><text x="48" y="174" class="s">NFS／SMB 檔案、iSCSI 區塊、VTL 備份</text><text x="48" y="204" class="s">盤點資料、容量、延遲、帶寬與 RPO</text><text x="48" y="234" class="s">確認本機應用相容性與一致性方法</text><text x="48" y="264" class="s">限制來源分享、帳號與管理網段</text>
<line x1="195" y1="285" x2="195" y2="327" class="l"/>
<rect x="24" y="337" width="342" height="190" rx="20" class="b"/><text x="48" y="372" class="t">02 隔離的 Gateway</text><text x="48" y="406" class="s">選擇 File／Volume／Tape Gateway</text><text x="48" y="436" class="s">配置快取磁碟與上傳緩衝容量</text><text x="48" y="466" class="s">使用最小權限角色、受控 DNS 與路由</text><text x="48" y="496" class="s">監控快取命中、佇列、錯誤與連線</text>
<line x1="195" y1="527" x2="195" y2="569" class="l"/>
<rect x="24" y="579" width="342" height="190" rx="20" class="b"/><text x="48" y="614" class="t">03 AWS 儲存層</text><text x="48" y="648" class="s">S3／EBS 快照／S3 Glacier</text><text x="48" y="678" class="s">TLS、KMS、bucket 與存取政策</text><text x="48" y="708" class="s">生命週期、保留、備份與還原測試</text><text x="48" y="738" class="s">建立跨帳號／跨區復原路徑</text>
<rect x="24" y="805" width="342" height="205" rx="20" class="r"/><text x="48" y="840" class="t">特有風險</text><text x="48" y="874" class="s">• 快取磁碟遺失、未加密或容量不足</text><text x="48" y="904" class="s">• 分享權限過大與管理面暴露</text><text x="48" y="934" class="s">• WAN 中斷造成積壓與效能下降</text><text x="48" y="964" class="s">• 把快取、快照或磁帶目錄誤當完整 DR</text><text x="48" y="994" class="s">• 未測試重啟、重連、還原與業務一致性</text>
<rect x="24" y="1040" width="342" height="220" rx="20" class="c"/><text x="48" y="1075" class="t">控制與驗收</text><text x="48" y="1109" class="s">• MFA、短期憑證、最小權限與網路隔離</text><text x="48" y="1139" class="s">• KMS、磁碟加密、Secrets 集中管理</text><text x="48" y="1169" class="s">• CloudTrail／CloudWatch 與容量告警</text><text x="48" y="1199" class="s">• 代表性效能、斷線與重連測試</text><text x="48" y="1229" class="s">• 隔離還原、跨區復原與 RTO／RPO 對帳</text>
<rect x="24" y="1290" width="342" height="6" rx="3" fill="#ff9900"/>
</svg>
