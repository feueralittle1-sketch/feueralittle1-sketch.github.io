<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Redshift 治理式零售分析流程示意圖</title>
  <desc id="desc">營運資料先進入 S3 受控落地區，完成格式驗證、個資遮罩與品質檢查後載入私有 Redshift；BI 語意層使用最小權限查詢，周邊配置 WLM、IAM、MFA、TLS、KMS、Secrets Manager、CloudWatch、CloudTrail、快照與跨區復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd28f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 22px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 16px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 15px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="72" y="70" class="k">ORIGINAL ARCHITECTURE DIAGRAM · 示意</text>
  <text x="72" y="114" class="t" font-size="34">資料進入、查詢資源、存取權限與復原路徑必須一起治理</text>
  <g filter="url(#shadow)">
    <rect x="55" y="180" width="210" height="170" rx="22" class="box"/>
    <text x="160" y="222" text-anchor="middle" class="k">權威來源</text><text x="160" y="258" text-anchor="middle" class="t">訂單・庫存</text><text x="160" y="290" text-anchor="middle" class="t">會員・事件</text><text x="160" y="322" text-anchor="middle" class="s">批次＋串流</text>
    <rect x="315" y="160" width="295" height="210" rx="24" class="step"/>
    <text x="462" y="202" text-anchor="middle" class="k">S3 受控落地區</text><text x="462" y="238" text-anchor="middle" class="t">驗證與資料最小化</text><text x="462" y="273" text-anchor="middle" class="s">Schema・惡意檔案隔離</text><text x="462" y="305" text-anchor="middle" class="s">個資遮罩・品質檢查</text><text x="462" y="337" text-anchor="middle" class="s">重複處理・失敗佇列</text>
    <rect x="665" y="135" width="500" height="285" rx="28" fill="#091a31" stroke="url(#accent)" stroke-width="3"/>
    <text x="710" y="178" class="k">PRIVATE REDSHIFT · PROVISIONED OR SERVERLESS</text>
    <rect x="710" y="215" width="190" height="120" rx="18" class="box"/><text x="805" y="255" text-anchor="middle" class="t">資料模型</text><text x="805" y="287" text-anchor="middle" class="s">分布・排序・壓縮</text><text x="805" y="315" text-anchor="middle" class="s">列級／欄級控制</text>
    <rect x="930" y="215" width="190" height="120" rx="18" class="box"/><text x="1025" y="255" text-anchor="middle" class="t">WLM</text><text x="1025" y="287" text-anchor="middle" class="s">載入・報表・探索</text><text x="1025" y="315" text-anchor="middle" class="s">逾時・資源上限</text>
    <text x="915" y="375" text-anchor="middle" class="s">TLS・KMS・資料庫角色・稽核日誌</text>
    <path d="M265 265H315" class="line"/><path d="M610 265H665" class="line"/>
    <rect x="1220" y="185" width="165" height="170" rx="22" class="box"/><text x="1302" y="225" text-anchor="middle" class="k">資料湖</text><text x="1302" y="262" text-anchor="middle" class="t">Spectrum</text><text x="1302" y="294" text-anchor="middle" class="s">分割檔案</text><text x="1302" y="322" text-anchor="middle" class="s">受限 S3／KMS</text>
    <path d="M1165 270H1220" class="line"/>
    <rect x="90" y="505" width="260" height="150" rx="22" class="step"/><text x="220" y="547" text-anchor="middle" class="k">BI 語意層</text><text x="220" y="583" text-anchor="middle" class="t">核准指標與查詢</text><text x="220" y="615" text-anchor="middle" class="s">參數化・列數上限・逾時</text>
    <rect x="415" y="505" width="260" height="150" rx="22" class="box"/><text x="545" y="547" text-anchor="middle" class="k">存取角色</text><text x="545" y="583" text-anchor="middle" class="t">最小權限</text><text x="545" y="615" text-anchor="middle" class="s">工程／報表／稽核分離</text>
    <rect x="740" y="505" width="260" height="150" rx="22" class="box"/><text x="870" y="547" text-anchor="middle" class="k">監控與稽核</text><text x="870" y="583" text-anchor="middle" class="t">CloudWatch</text><text x="870" y="615" text-anchor="middle" class="s">CloudTrail＋資料庫日誌</text>
    <rect x="1065" y="505" width="285" height="150" rx="22" class="box"/><text x="1207" y="547" text-anchor="middle" class="k">復原證明</text><text x="1207" y="583" text-anchor="middle" class="t">快照＋IaC</text><text x="1207" y="615" text-anchor="middle" class="s">跨區還原與報表驗證</text>
    <path d="M350 580H415" class="line"/><path d="M675 580H740" class="line"/><path d="M1000 580H1065" class="line"/>
  </g>
  <g>
    <rect x="60" y="720" width="300" height="120" rx="22" class="guard"/><text x="90" y="758" class="k">身分與網路</text><text x="90" y="793" class="t">VPC＋IAM 最小權限</text><text x="90" y="820" class="s">聯合登入、MFA、短期憑證</text>
    <rect x="390" y="720" width="300" height="120" rx="22" class="guard"/><text x="420" y="758" class="k">資料與機密</text><text x="420" y="793" class="t">TLS＋KMS＋Secrets</text><text x="420" y="820" class="s">遮罩、保存、刪除與輪替</text>
    <rect x="720" y="720" width="300" height="120" rx="22" class="guard"/><text x="750" y="758" class="k">效能與成本</text><text x="750" y="793" class="t">WLM＋查詢上限</text><text x="750" y="820" class="s">RPU、節點、掃描與佇列告警</text>
    <rect x="1050" y="720" width="330" height="120" rx="22" class="guard"/><text x="1080" y="758" class="k">備份與跨區復原</text><text x="1080" y="793" class="t">快照＋S3＋定義檔</text><text x="1080" y="820" class="s">KMS、角色、ETL、BI 全程演練</text>
  </g>
  <text x="720" y="875" text-anchor="middle" class="s">重點：資料倉儲的安全不只在網路，還包含資料模型、查詢資源、匯出路徑與可驗證復原。</text>
</svg>
