<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc">
<title id="title">Amazon Bedrock 安全生成式 AI 行動版流程</title><desc id="desc">使用者請求經輸入治理與最小權限呼叫 Amazon Bedrock，再由輸出驗證、資料授權、監控稽核、成本限制及跨區復原形成治理閉環。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18c"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#77e6ff"/></marker><style>.h{font:700 30px system-ui,sans-serif;fill:#fff}.s{font:700 23px system-ui,sans-serif;fill:#fff}.t{font:500 18px system-ui,sans-serif;fill:#c4d7f1}.k{font:800 23px system-ui,sans-serif;fill:#071426}.b{fill:#122b4d;stroke:#355d83;stroke-width:2}.g{fill:#10243e;stroke:#68def4;stroke-width:2}.f{fill:none;stroke:#77e6ff;stroke-width:5;marker-end:url(#a)}</style></defs>
<rect width="760" height="1320" rx="34" fill="url(#bg)"/><text x="42" y="58" class="h">Amazon Bedrock 安全推論流程</text><text x="42" y="88" class="t">示意架構｜生成式 AI 控制與治理</text>
<rect x="42" y="125" width="676" height="150" rx="24" class="b"/><text x="72" y="170" class="s">1. 使用者與應用</text><text x="72" y="209" class="t">身分驗證・租戶隔離・輸入長度與配額</text><text x="72" y="243" class="t">IAM Role・短期憑證・模型 / 動作最小權限</text><path d="M380 275V315" class="f"/>
<rect x="42" y="320" width="676" height="205" rx="24" class="g"/><text x="72" y="365" class="s">2. 推論前治理</text><text x="72" y="405" class="t">Prompt injection・PII / 機密檢查・Guardrails</text><text x="72" y="440" class="t">允許模型 / 區域・VPC endpoint・Egress 控制</text><text x="72" y="475" class="t">Token / 成本上限・高風險流程人工覆核</text><text x="72" y="505" class="t">知識文件需通過分類、授權、KMS 與保留政策</text><path d="M380 525V565" class="f"/>
<rect x="42" y="570" width="676" height="230" rx="28" fill="#18243c" stroke="#ffb34a" stroke-width="3"/><rect x="72" y="600" width="616" height="62" rx="18" fill="url(#ai)"/><text x="274" y="641" class="k">Amazon Bedrock</text><text x="72" y="705" class="s">Converse / InvokeModel</text><text x="72" y="744" class="t">Foundation model・推論設定・Guardrails</text><text x="72" y="778" class="t">Agents・Knowledge Bases・KMS 加密</text><path d="M380 800V840" class="f"/>
<rect x="42" y="845" width="676" height="145" rx="24" class="b"/><text x="72" y="890" class="s">3. 輸出驗證與行動</text><text x="72" y="930" class="t">內容安全・事實 / 引用・租戶授權再次檢查</text><text x="72" y="964" class="t">高風險操作需人員確認，失敗時安全降級</text>
<rect x="42" y="1030" width="322" height="230" rx="24" class="g"/><text x="70" y="1074" class="s">監控與稽核</text><text x="70" y="1113" class="t">CloudWatch 指標 / 告警</text><text x="70" y="1146" class="t">CloudTrail API 紀錄</text><text x="70" y="1179" class="t">調用日誌安全保存</text><text x="70" y="1212" class="t">品質 / 安全評測</text>
<rect x="396" y="1030" width="322" height="230" rx="24" class="g"/><text x="424" y="1074" class="s">成本與復原</text><text x="424" y="1113" class="t">Token / 配額 / Budget</text><text x="424" y="1146" class="t">受控模型與提示版本</text><text x="424" y="1179" class="t">第二區域相依資源</text><text x="424" y="1212" class="t">降級 / 停止 / RTO 演練</text>
<text x="42" y="1292" class="t">治理重點：模型輸出不是授權，也不是可信事實來源</text>
</svg>
