<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">AWS CodeBuild 安全建置流程示意圖</title>
<desc id="desc">不可變來源進入隔離的 CodeBuild 建置環境，依序執行相依套件驗證、測試與掃描，成功後輸出具摘要與簽章的私有成品；異常停止並由 CloudWatch 與 CloudTrail留下證據。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b46"/></linearGradient><linearGradient id="accent"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffca75"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#75dbff"/></marker></defs>
<rect width="1440" height="820" rx="32" fill="url(#bg)"/><text x="70" y="78" fill="#fff" font-size="38" font-weight="800" font-family="system-ui,sans-serif">示意｜AWS CodeBuild 可追溯安全建置</text><text x="70" y="116" fill="#a9bdd7" font-size="20" font-family="system-ui,sans-serif">固定來源與環境 → 隔離執行 → 品質與安全門檻 → 不可變成品</text>
<g filter="url(#shadow)" font-family="system-ui,sans-serif">
<rect x="65" y="190" width="240" height="180" rx="22" fill="#10243d" stroke="#75dbff" stroke-width="2"/><circle cx="112" cy="235" r="22" fill="#174c68"/><text x="112" y="243" fill="#8fe8ff" text-anchor="middle" font-size="22" font-weight="800">1</text><text x="145" y="240" fill="#fff" font-size="25" font-weight="800">不可變來源</text><text x="95" y="286" fill="#c8d8eb" font-size="18">• 受保護分支</text><text x="95" y="318" fill="#c8d8eb" font-size="18">• 提交識別碼</text><text x="95" y="350" fill="#c8d8eb" font-size="18">• 套件鎖定與校驗</text>
<rect x="380" y="160" width="680" height="360" rx="28" fill="#0c2038" stroke="#ffad3d" stroke-width="3"/><text x="720" y="210" fill="#ffca75" text-anchor="middle" font-size="29" font-weight="800">隔離的 CodeBuild 建置環境</text><rect x="420" y="245" width="180" height="170" rx="20" fill="#142e4a" stroke="#5d7697"/><text x="510" y="285" fill="#fff" text-anchor="middle" font-size="22" font-weight="700">環境固定</text><text x="445" y="325" fill="#c8d8eb" font-size="17">映像摘要</text><text x="445" y="355" fill="#c8d8eb" font-size="17">最小權限角色</text><text x="445" y="385" fill="#c8d8eb" font-size="17">私有網路</text><rect x="630" y="245" width="180" height="170" rx="20" fill="#142e4a" stroke="#5d7697"/><text x="720" y="285" fill="#fff" text-anchor="middle" font-size="22" font-weight="700">品質門檻</text><text x="655" y="325" fill="#c8d8eb" font-size="17">編譯與測試</text><text x="655" y="355" fill="#c8d8eb" font-size="17">靜態分析</text><text x="655" y="385" fill="#c8d8eb" font-size="17">套件／映像掃描</text><rect x="840" y="245" width="180" height="170" rx="20" fill="#142e4a" stroke="#5d7697"/><text x="930" y="285" fill="#fff" text-anchor="middle" font-size="22" font-weight="700">機密保護</text><text x="865" y="325" fill="#c8d8eb" font-size="17">Secrets Manager</text><text x="865" y="355" fill="#c8d8eb" font-size="17">Parameter Store</text><text x="865" y="385" fill="#c8d8eb" font-size="17">禁止寫入日誌</text><text x="720" y="474" fill="#9fb4cf" text-anchor="middle" font-size="17">暫時性運算 · 專案隔離 · 受控出口 · 失敗立即停止</text>
<rect x="1135" y="190" width="240" height="180" rx="22" fill="#10243d" stroke="#63e6b0" stroke-width="2"/><circle cx="1182" cy="235" r="22" fill="#19543f"/><text x="1182" y="243" fill="#8affcc" text-anchor="middle" font-size="22" font-weight="800">3</text><text x="1215" y="240" fill="#fff" font-size="25" font-weight="800">可信成品</text><text x="1165" y="286" fill="#c8d8eb" font-size="18">• 私有 S3／ECR</text><text x="1165" y="318" fill="#c8d8eb" font-size="18">• KMS 加密</text><text x="1165" y="350" fill="#c8d8eb" font-size="18">• 摘要、SBOM、簽章</text>
</g>
<path d="M305 280 H365" stroke="#75dbff" stroke-width="5" marker-end="url(#arrow)"/><path d="M1060 280 H1120" stroke="#75dbff" stroke-width="5" marker-end="url(#arrow)"/><text x="720" y="145" fill="#ffca75" text-anchor="middle" font-size="19" font-family="system-ui,sans-serif" font-weight="700">2 · buildspec 受版控且經審查</text>
<rect x="170" y="600" width="500" height="135" rx="22" fill="#271b2d" stroke="#ff719a" stroke-width="2"/><text x="205" y="645" fill="#ff9eba" font-size="24" font-weight="800" font-family="system-ui,sans-serif">異常路徑｜停止，不發布</text><text x="205" y="683" fill="#e7cbd5" font-size="18" font-family="system-ui,sans-serif">測試失敗 · 高風險弱點 · 完整性不符 · 權限異常</text><text x="205" y="715" fill="#e7cbd5" font-size="18" font-family="system-ui,sans-serif">保留證據，修正來源後重新建置</text><path d="M590 520 V575 H420 V590" fill="none" stroke="#ff719a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="770" y="600" width="500" height="135" rx="22" fill="#112d3c" stroke="#62d9f5" stroke-width="2"/><text x="805" y="645" fill="#8fe8ff" font-size="24" font-weight="800" font-family="system-ui,sans-serif">觀測與稽核｜持續留證</text><text x="805" y="683" fill="#c8d8eb" font-size="18" font-family="system-ui,sans-serif">CloudWatch Logs／告警：失敗、逾時、異常資源</text><text x="805" y="715" fill="#c8d8eb" font-size="18" font-family="system-ui,sans-serif">CloudTrail：專案、角色與設定變更</text><path d="M850 520 V585" fill="none" stroke="#75dbff" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
