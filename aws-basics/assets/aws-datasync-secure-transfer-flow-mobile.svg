<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc"><title id="title">AWS DataSync 安全資料傳輸手機流程圖</title><desc id="desc">由上而下顯示來源盤點、隔離 DataSync agent、受控傳輸、加密 AWS 儲存、驗證、監控、切換與跨區復原。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a46"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#73ddff"/></marker></defs><rect width="390" height="1120" rx="22" fill="url(#bg)"/><text x="24" y="42" fill="#fff" font-size="21" font-weight="800" font-family="Arial, sans-serif">DataSync 安全傳輸示意</text><text x="24" y="68" fill="#a9c2df" font-size="12" font-family="Arial, sans-serif">盤點 → 代理程式 → 傳輸 → 儲存 → 復原</text><g font-family="Arial, sans-serif"><rect x="24" y="95" width="342" height="150" rx="18" fill="#132d4b" stroke="#3e7199"/><text x="44" y="126" fill="#8fe8ff" font-size="15" font-weight="700">1. 來源資料</text><text x="44" y="158" fill="#fff" font-size="20" font-weight="800">NFS / SMB / Object</text><text x="44" y="190" fill="#c7d7ea" font-size="13">資料分類、白名單路徑</text><text x="44" y="216" fill="#c7d7ea" font-size="13">停寫、快照或封存</text><rect x="24" y="280" width="342" height="150" rx="18" fill="#132d4b" stroke="#ffb44d"/><text x="44" y="311" fill="#ffc36f" font-size="15" font-weight="700">2. DataSync agent</text><text x="44" y="343" fill="#fff" font-size="20" font-weight="800">隔離執行環境</text><text x="44" y="375" fill="#c7d7ea" font-size="13">受控管理面、最小來源權限</text><text x="44" y="401" fill="#c7d7ea" font-size="13">健康、容量與網路監控</text><rect x="24" y="465" width="342" height="150" rx="18" fill="#132d4b" stroke="#55d6a7"/><text x="44" y="496" fill="#70e6b5" font-size="15" font-weight="700">3. 受控傳輸</text><text x="44" y="528" fill="#fff" font-size="20" font-weight="800">Task execution</text><text x="44" y="560" fill="#c7d7ea" font-size="13">增量、頻寬限制、短期工作階段</text><text x="44" y="586" fill="#c7d7ea" font-size="13">受控網路與加密傳輸</text><rect x="24" y="650" width="342" height="150" rx="18" fill="#132d4b" stroke="#a88bff"/><text x="44" y="681" fill="#c3b3ff" font-size="15" font-weight="700">4. AWS 目的儲存</text><text x="44" y="713" fill="#fff" font-size="20" font-weight="800">S3 / EFS / FSx</text><text x="44" y="745" fill="#c7d7ea" font-size="13">阻擋公開存取、KMS、受限 role</text><text x="44" y="771" fill="#c7d7ea" font-size="13">版本、生命週期與保留</text><rect x="24" y="835" width="342" height="230" rx="18" fill="#0d2037" stroke="#ff9900"/><text x="44" y="870" fill="#ffc36f" font-size="16" font-weight="800">5. 驗證、切換與復原</text><text x="44" y="908" fill="#fff" font-size="14" font-weight="700">驗證</text><text x="115" y="908" fill="#c7d7ea" font-size="12">檔案數、容量、雜湊、ACL</text><text x="44" y="946" fill="#fff" font-size="14" font-weight="700">稽核</text><text x="115" y="946" fill="#c7d7ea" font-size="12">CloudTrail、CloudWatch 告警</text><text x="44" y="984" fill="#fff" font-size="14" font-weight="700">切換</text><text x="115" y="984" fill="#c7d7ea" font-size="12">最後同步、觀察期與回復</text><text x="44" y="1022" fill="#fff" font-size="14" font-weight="700">復原</text><text x="115" y="1022" fill="#c7d7ea" font-size="12">備份、跨帳號／跨區副本</text></g><g stroke="#73ddff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M195 245V270"/><path d="M195 430V455"/><path d="M195 615V640"/><path d="M195 800V825"/></g></svg>