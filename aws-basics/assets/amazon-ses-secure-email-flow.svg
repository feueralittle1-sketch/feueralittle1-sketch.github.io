<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Amazon SES 安全寄信與回饋治理流程</title>
<desc id="desc">應用程式以短期憑證和最小權限呼叫 Amazon SES，通過身分驗證、DKIM、SPF、DMARC、設定集與傳送政策後寄信，並以退信、投訴、事件、CloudWatch、CloudTrail、抑制清單及跨區計畫治理。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="ses" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#79e7ff"/></marker><style>.h{font:700 42px system-ui,sans-serif;fill:#fff}.s{font:700 23px system-ui,sans-serif;fill:#e8f2ff}.t{font:500 19px system-ui,sans-serif;fill:#bfd1ea}.k{font:800 22px system-ui,sans-serif;fill:#081426}.box{fill:#122b4d;stroke:#355d83;stroke-width:2}.guard{fill:#10243e;stroke:#69dff5;stroke-width:2}.flow{fill:none;stroke:#79e7ff;stroke-width:5;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1000" rx="42" fill="url(#bg)"/><text x="70" y="78" class="h">Amazon SES｜可信寄件、回饋閉環與安全治理</text><text x="72" y="116" class="t">示意架構，不代表特定企業部署</text>
<rect x="60" y="165" width="300" height="365" rx="28" class="box" filter="url(#shadow)"/><text x="95" y="220" class="s">應用與寄件工作</text><text x="95" y="270" class="t">交易信 / 通知 / 行銷信</text><text x="95" y="310" class="t">Queue・限速・重試</text><text x="95" y="350" class="t">Template・標籤・分類</text><rect x="95" y="390" width="230" height="96" rx="18" class="guard"/><text x="123" y="428" class="t">IAM Role・短期憑證</text><text x="123" y="461" class="t">最小 ses:Send 權限</text>
<rect x="425" y="150" width="350" height="400" rx="30" class="guard" filter="url(#shadow)"/><text x="465" y="205" class="s">寄件前信任邊界</text><text x="465" y="258" class="t">✓ 驗證網域 / 寄件身分</text><text x="465" y="302" class="t">✓ DKIM 簽章</text><text x="465" y="346" class="t">✓ SPF / 自訂 MAIL FROM</text><text x="465" y="390" class="t">✓ DMARC alignment</text><text x="465" y="434" class="t">✓ Configuration set</text><text x="465" y="478" class="t">✓ Sending authorization</text><text x="465" y="522" class="t">✓ 帳戶 / 全域端點抑制</text>
<rect x="835" y="135" width="430" height="455" rx="34" fill="#18243c" stroke="#ffb44c" stroke-width="3" filter="url(#shadow)"/><rect x="870" y="175" width="360" height="76" rx="22" fill="url(#ses)"/><text x="983" y="225" class="k">Amazon SES</text><text x="880" y="301" class="s">API 或 SMTP 提交</text><rect x="880" y="335" width="340" height="94" rx="18" class="box"/><text x="916" y="373" class="t">沙盒 / Production access</text><text x="916" y="405" class="t">配額・速率・訊息大小</text><rect x="880" y="452" width="340" height="91" rx="18" class="guard"/><text x="914" y="490" class="t">TLS 傳輸・病毒掃描</text><text x="914" y="522" class="t">ISP / 收件端投遞</text>
<rect x="1320" y="165" width="230" height="365" rx="28" class="box" filter="url(#shadow)"/><text x="1350" y="220" class="s">收件系統</text><text x="1350" y="272" class="t">驗證 DKIM</text><text x="1350" y="311" class="t">檢查 SPF</text><text x="1350" y="350" class="t">執行 DMARC</text><text x="1350" y="389" class="t">Inbox / Spam</text><rect x="1350" y="425" width="170" height="68" rx="16" class="guard"/><text x="1380" y="466" class="t">退信 / 投訴</text>
<path d="M360 345H425" class="flow"/><path d="M775 345H835" class="flow"/><path d="M1265 345H1320" class="flow"/>
<rect x="70" y="660" width="455" height="250" rx="28" class="guard"/><text x="108" y="716" class="s">回饋與自動停止</text><text x="108" y="765" class="t">Event destination：退信、投訴、投遞</text><text x="108" y="806" class="t">Hard bounce → 抑制；Complaint → 停止寄送</text><text x="108" y="847" class="t">無效地址、取消訂閱與同意證據</text><text x="108" y="888" class="t">Queue 限速・Circuit breaker・Runbook</text>
<rect x="570" y="660" width="420" height="250" rx="28" class="box"/><text x="608" y="716" class="s">偵測、稽核與成本</text><text x="608" y="765" class="t">CloudWatch：退信率、投訴率、傳送量</text><text x="608" y="806" class="t">CloudTrail：身分、設定與政策變更</text><text x="608" y="847" class="t">SNS / EventBridge / Firehose 事件留存</text><text x="608" y="888" class="t">郵件量、附件、資料傳輸與附加功能</text>
<rect x="1030" y="660" width="500" height="250" rx="28" class="guard"/><text x="1068" y="716" class="s">可用性與區域復原</text><text x="1068" y="765" class="t">第二區域：已驗證身分・DKIM・政策・配額</text><text x="1068" y="806" class="t">區域別資源與抑制狀態不得想當然同步</text><text x="1068" y="847" class="t">應用程式切換端點並保留去重與退信處理</text><text x="1068" y="888" class="t">量測 RTO、重試風暴與重複寄信風險</text>
<path d="M1435 530C1435 620 330 610 300 660" class="flow"/><path d="M1050 590C970 628 910 640 850 660" class="flow"/>
</svg>