<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1540" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Kinesis Data Streams 安全即時串流流程手機版示意圖</title>
  <desc id="desc">Producer 經最小權限、VPC endpoint 與 KMS 寫入 Kinesis Data Streams，再由冪等 consumer 處理，將原始事件落地並建立監控與跨區復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7be7ff"/></marker>
    <style>.h{font:700 31px system-ui,sans-serif;fill:#fff}.t{font:700 25px system-ui,sans-serif;fill:#fff}.s{font:500 20px system-ui,sans-serif;fill:#c7d8ef}.box{fill:#112844;stroke:#416d96;stroke-width:2}.stream{fill:#382817;stroke:#ffae4d;stroke-width:3}.guard{fill:#102d2b;stroke:#48d7c7;stroke-width:2}.warn{fill:#321f2b;stroke:#ec75b9;stroke-width:2}.line{stroke:#7be7ff;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="760" height="1540" rx="34" fill="url(#bg)"/>
  <text x="45" y="62" class="h">示意：Kinesis 安全即時串流</text>
  <text x="45" y="99" class="s">分區、重複、延遲、持久落地與跨區復原</text>
  <rect x="45" y="140" width="670" height="195" rx="24" class="box"/>
  <text x="80" y="184" class="t">1. Producer 與事件</text>
  <text x="80" y="225" class="s">Schema／事件 ID／高基數 partition key</text><text x="80" y="260" class="s">敏感欄位最小化，批次失敗逐筆重試</text><text x="80" y="295" class="s">量測尖峰 records、bytes 與 key 分布</text>
  <path d="M380 335V380" class="line"/>
  <rect x="45" y="390" width="670" height="195" rx="24" class="guard"/>
  <text x="80" y="434" class="t">2. 身分、網路與加密</text>
  <text x="80" y="475" class="s">最小權限／MFA／短期憑證</text><text x="80" y="510" class="s">Interface VPC endpoint／限制 egress</text><text x="80" y="545" class="s">KMS／TLS／Secrets Manager</text>
  <path d="M380 585V630" class="line"/>
  <rect x="45" y="640" width="670" height="235" rx="24" class="stream"/>
  <text x="80" y="684" class="t">3. Kinesis Data Streams</text>
  <text x="80" y="725" class="s">On-demand 或 Provisioned</text><text x="80" y="760" class="s">Partition key → shard／hot shard 控制</text><text x="80" y="795" class="s">24 小時至 365 天 retention</text><text x="80" y="830" class="s">Shared throughput 或 enhanced fan-out</text>
  <path d="M380 875V920" class="line"/>
  <rect x="45" y="930" width="670" height="205" rx="24" class="box"/>
  <text x="80" y="974" class="t">4. 冪等 Consumers</text>
  <text x="80" y="1015" class="s">Checkpoint／lag／重試上限／毒性事件隔離</text><text x="80" y="1050" class="s">事件 ID、去重、條件寫入與業務對帳</text><text x="80" y="1085" class="s">CloudWatch 指標與 CloudTrail 證據</text>
  <path d="M380 1135V1180" class="line"/>
  <rect x="45" y="1190" width="315" height="245" rx="24" class="warn"/>
  <text x="75" y="1234" class="t">5. 風險控制</text>
  <text x="75" y="1275" class="s">Hot shard／限流</text><text x="75" y="1310" class="s">重複與順序假設</text><text x="75" y="1345" class="s">Lag 超過 retention</text><text x="75" y="1380" class="s">KMS／跨帳戶越權</text>
  <rect x="400" y="1190" width="315" height="245" rx="24" class="guard"/>
  <text x="430" y="1234" class="t">6. 落地與復原</text>
  <text x="430" y="1275" class="s">S3 原始事件</text><text x="430" y="1310" class="s">IaC 與獨立 stream</text><text x="430" y="1345" class="s">跨區切換／重播</text><text x="430" y="1380" class="s">去重／缺口／RPO</text>
  <text x="45" y="1490" class="s">AWS 維護平台；客戶治理事件、程式、權限、結果與復原。</text>
</svg>
