<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AWS Lambda 事件驅動處理流程示意</title>
  <desc id="desc">使用者事件進入 API Gateway 或事件來源，觸發位於私有與受控邊界的 Lambda 函數；函數以最小權限角色讀取機密並存取資料服務，CloudWatch 與 CloudTrail 負責觀測，失敗事件送往重試與死信佇列。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#132746"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffca7a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#8fe8ff"/></marker>
    <style>.box{fill:#10233d;stroke:#58708f;stroke-width:2}.secure{fill:#122d35;stroke:#4fd1b5;stroke-width:2}.warn{fill:#372814;stroke:#ffb84d;stroke-width:2}.t{font:700 27px system-ui,sans-serif;fill:#f7fbff}.s{font:20px system-ui,sans-serif;fill:#b9c9df}.k{font:700 18px system-ui,sans-serif;fill:#ffca7a}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="820" rx="32" fill="url(#bg)"/>
  <text x="70" y="78" class="t" font-size="36">示意：Lambda 事件驅動、安全與失敗處理</text>
  <text x="70" y="112" class="s">非真實客戶架構；實際設計須依事件來源、延遲、資料分類與 RTO/RPO 調整</text>
  <g filter="url(#shadow)"><rect class="box" x="70" y="215" width="235" height="145" rx="22"/><text class="k" x="100" y="255">事件來源</text><text class="t" x="100" y="298">API / S3 / EventBridge</text><text class="s" x="100" y="332">驗證、限流、來源政策</text></g>
  <path class="line" d="M305 287H430"/>
  <g filter="url(#shadow)"><rect x="430" y="180" width="380" height="215" rx="28" fill="url(#accent)"/><text x="475" y="235" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#392100">運算服務</text><text x="475" y="291" font-family="system-ui,sans-serif" font-size="44" font-weight="900" fill="#1d170f">AWS Lambda</text><text x="475" y="333" font-family="system-ui,sans-serif" font-size="21" fill="#392100">短生命週期執行環境 · 自動擴展</text><text x="475" y="365" font-family="system-ui,sans-serif" font-size="21" fill="#392100">逾時、併發、版本與別名受控</text></g>
  <path class="line" d="M810 287H935"/>
  <g filter="url(#shadow)"><rect class="secure" x="935" y="215" width="390" height="145" rx="22"/><text class="k" x="970" y="255">受控資源存取</text><text class="t" x="970" y="298">DynamoDB / S3 / RDS</text><text class="s" x="970" y="332">IAM 角色 · KMS · 私有端點</text></g>
  <g filter="url(#shadow)"><rect class="secure" x="430" y="510" width="300" height="145" rx="22"/><text class="k" x="465" y="550">身分與機密</text><text class="t" x="465" y="593">最小權限角色</text><text class="s" x="465" y="627">Secrets Manager / Parameter Store</text></g>
  <path class="line" d="M580 510V414"/>
  <g filter="url(#shadow)"><rect class="box" x="770" y="510" width="260" height="145" rx="22"/><text class="k" x="805" y="550">觀測與稽核</text><text class="t" x="805" y="593">指標、日誌、追蹤</text><text class="s" x="805" y="627">CloudWatch · CloudTrail</text></g>
  <path class="line" d="M865 510L735 395"/>
  <g filter="url(#shadow)"><rect class="warn" x="1070" y="510" width="255" height="145" rx="22"/><text class="k" x="1105" y="550">失敗路徑</text><text class="t" x="1105" y="593">重試與隔離</text><text class="s" x="1105" y="627">目的地 / DLQ / 告警</text></g>
  <path class="line" d="M1180 510L785 382"/>
  <text x="70" y="752" class="s">控制重點：不公開函數 URL 除非必要 · 不硬編碼機密 · 限制併發與事件大小 · 驗證冪等性 · 演練重試與復原</text>
</svg>
