<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc">
<title id="title">AWS Health 跨帳號事件應變流程手機版</title>
<desc id="desc">AWS Health 事件由跨帳號彙整、EventBridge 門禁、分級去重、範圍驗證、受控處置及驗證封存組成的垂直流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#70d9ff"/></marker></defs>
<rect width="720" height="1260" fill="url(#bg)"/><circle cx="610" cy="90" r="150" fill="#ff9900" opacity=".07"/><circle cx="100" cy="1150" r="180" fill="#70d9ff" opacity=".06"/>
<text x="40" y="58" fill="#fff" font-family="Arial, Noto Sans TC, sans-serif" font-size="30" font-weight="700">AWS Health 應變流程</text><text x="40" y="94" fill="#a9bddc" font-family="Arial, Noto Sans TC, sans-serif" font-size="18">示意｜跨帳號事件到可驗證復原</text>
<g font-family="Arial, Noto Sans TC, sans-serif" filter="url(#shadow)">
<g transform="translate(55 135)"><rect width="610" height="125" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="125" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">1. Health 事件與組織彙整</text><text x="34" y="78" fill="#c9d8ec" font-size="18">服務問題 · 帳號通知 · 預定變更</text><text x="34" y="106" fill="#c9d8ec" font-size="18">Organizational view · 委派管理者</text></g>
<path d="M360 260V285" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 300)"><rect width="610" height="145" rx="22" fill="#1b304a" stroke="#ffb454"/><rect width="10" height="145" rx="5" fill="url(#accent)"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">2. EventBridge 門禁</text><text x="34" y="78" fill="#ffe2bd" font-size="18">類別 · 服務 · actionability · persona</text><text x="34" y="106" fill="#ffe2bd" font-size="18">工作負載區域 + us-east-1 補捉</text><text x="34" y="134" fill="#ffe2bd" font-size="18">SQS 緩衝 · 重試 · DLQ</text></g>
<path d="M360 445V470" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 485)"><rect width="610" height="145" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="145" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">3. 分級、去重與責任分派</text><text x="34" y="78" fill="#c9d8ec" font-size="18">事件版本 · 帳號 · 受影響實體</text><text x="34" y="106" fill="#c9d8ec" font-size="18">營運 / 安全 / 帳務 · 服務擁有者</text><text x="34" y="134" fill="#c9d8ec" font-size="18">工單 · 通知 · 升級期限</text></g>
<path d="M360 630V655" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 670)"><rect width="610" height="145" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="145" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">4. 範圍與復原條件驗證</text><text x="34" y="78" fill="#c9d8ec" font-size="18">CloudWatch · SLO · 交易與依賴</text><text x="34" y="106" fill="#c9d8ec" font-size="18">受影響資源 · 業務衝擊 · 期限</text><text x="34" y="134" fill="#c9d8ec" font-size="18">備份 · 停止條件 · 回復方案</text></g>
<path d="M360 815V840" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 855)"><rect width="610" height="145" rx="22" fill="#1b304a" stroke="#ffb454"/><rect width="10" height="145" rx="5" fill="url(#accent)"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">5. 受控處置與復原</text><text x="34" y="78" fill="#ffe2bd" font-size="18">測試 · 核准 · 分批執行</text><text x="34" y="106" fill="#ffe2bd" font-size="18">SLO 監控 · 自動回復</text><text x="34" y="134" fill="#ffe2bd" font-size="18">跨區切換 · 替代方案</text></g>
<path d="M360 1000V1025" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(55 1040)"><rect width="610" height="145" rx="22" fill="#112946" stroke="#49769b"/><rect width="10" height="145" rx="5" fill="#70d9ff"/><text x="34" y="43" fill="#fff" font-size="24" font-weight="700">6. 驗證、稽核與長期封存</text><text x="34" y="78" fill="#c9d8ec" font-size="18">事件關閉後再次驗證 SLO</text><text x="34" y="106" fill="#c9d8ec" font-size="18">CloudTrail · 工單 · 核准證據</text><text x="34" y="134" fill="#c9d8ec" font-size="18">私有 S3 · KMS · 保存週期</text></g>
</g>
<text x="360" y="1225" text-anchor="middle" fill="#ffcf91" font-family="Arial, Noto Sans TC, sans-serif" font-size="18" font-weight="700">IAM 最小權限 · MFA · 冪等 · 多區域 · 備份 · 跨區復原</text>
</svg>