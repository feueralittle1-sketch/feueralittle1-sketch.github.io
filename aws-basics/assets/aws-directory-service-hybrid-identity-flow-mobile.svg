<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
  <title id="title">AWS Directory Service 行動版混合身分流程示意圖</title>
  <desc id="desc">使用者進入 AWS Directory Service 目錄模式，再連接 AWS 工作負載，並以網路隔離、安全控制、監控、快照及跨區復原治理。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b48"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#77d9f7"/></marker><style>.h{font:700 29px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 24px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 19px Inter,'Noto Sans TC',sans-serif;fill:#c8d8eb}.b{fill:#122c47;stroke:#547b9a;stroke-width:2}.o{fill:#3a250e;stroke:#ffad3d;stroke-width:2}.l{stroke:#77d9f7;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="720" height="1320" rx="30" fill="url(#bg)"/>
  <text x="45" y="62" class="h">示意：目錄驗證與治理流程</text><text x="45" y="96" class="s">模式選擇 → 私有連線 → 工作負載 → 持續治理</text>
  <rect x="70" y="140" width="580" height="120" rx="22" class="b"/><text x="105" y="190" class="t">1. 人員與裝置</text><text x="105" y="228" class="s">企業使用者、Windows／Linux、管理工作站</text>
  <line x1="360" y1="260" x2="360" y2="315" class="l"/>
  <rect x="45" y="330" width="630" height="260" rx="24" class="o"/><text x="80" y="380" class="t">2. 選擇 AWS Directory Service 模式</text><text x="80" y="430" class="s">AWS Managed Microsoft AD：完整受管 AD</text><text x="80" y="478" class="s">AD Connector：代理至既有自管 AD</text><text x="80" y="526" class="s">Simple AD：基本 Samba 相容功能</text><text x="80" y="564" class="s">依功能、整合、規模與復原需求決定</text>
  <line x1="360" y1="590" x2="360" y2="645" class="l"/>
  <rect x="70" y="660" width="580" height="130" rx="22" class="b"/><text x="105" y="710" class="t">3. AWS 工作負載</text><text x="105" y="750" class="s">EC2、RDS、FSx、WorkSpaces、AD／LDAP 應用</text>
  <line x1="360" y1="790" x2="360" y2="845" class="l"/>
  <rect x="45" y="860" width="630" height="125" rx="22" class="b"/><text x="80" y="906" class="t">4. 網路與高可用</text><text x="80" y="946" class="s">私有子網路、跨可用區、DNS、VPN／Direct Connect</text>
  <rect x="45" y="1010" width="630" height="125" rx="22" class="b"/><text x="80" y="1056" class="t">5. 安全與監控</text><text x="80" y="1096" class="s">最小權限、MFA、LDAPS、CloudTrail、CloudWatch</text>
  <rect x="45" y="1160" width="630" height="115" rx="22" class="b"/><text x="80" y="1206" class="t">6. 備份與復原</text><text x="80" y="1246" class="s">快照、還原演練；適用版本評估跨區複寫</text>
</svg>
