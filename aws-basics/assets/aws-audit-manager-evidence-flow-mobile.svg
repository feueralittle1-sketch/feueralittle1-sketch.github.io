<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">AWS Audit Manager 稽核證據流程手機版</title>
  <desc id="desc">框架和控制連接多種 AWS 與人工證據來源，再由 Audit Manager 持續評估、委派覆核、產生報告並追蹤修復。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:32px;font-weight:800}.s{font-size:21px}.k{font-size:17px;font-weight:700;letter-spacing:.06em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1280" rx="30" fill="url(#bg)"/>
  <circle cx="70" cy="90" r="170" fill="#ff9900" opacity=".08"/><circle cx="670" cy="1160" r="220" fill="#55d8ff" opacity=".07"/>
  <text x="42" y="66" class="t h">AWS Audit Manager</text><text x="42" y="104" class="t h">稽核證據流程</text>
  <text x="42" y="142" class="m s">示意：控制 → 證據 → 覆核 → 修復</text>
  <g filter="url(#shadow)"><rect class="box" x="42" y="184" width="636" height="184" rx="24"/><text x="70" y="226" class="t k">01 框架、控制與評估範圍</text>
    <text x="70" y="280" class="t s">標準／自訂框架 · 控制集 · 帳號 · 區域</text><text x="70" y="322" class="t s">適用法規 · 查核期間 · 控制擁有者</text><text x="70" y="350" class="m" style="font-size:17px;font-family:Inter,'Noto Sans TC',sans-serif">先定義要證明什麼，再選擇證據</text></g>
  <path class="line" d="M360 368V414"/>
  <g filter="url(#shadow)"><rect class="box" x="42" y="414" width="636" height="214" rx="24"/><text x="70" y="458" class="t k">02 多源證據</text><text x="70" y="512" class="t s">AWS Config · Security Hub CSPM</text><text x="70" y="554" class="t s">CloudTrail · AWS API · 人工證據</text><text x="70" y="598" class="m s">驗證帳號、區域、時間、資源與完整性</text></g>
  <path class="line" d="M360 628V674"/>
  <g filter="url(#shadow)"><rect x="42" y="674" width="636" height="246" rx="24" fill="#122b49" stroke="#ffb657" stroke-width="2"/><rect x="70" y="706" width="580" height="8" rx="4" fill="url(#orange)"/><text x="70" y="764" class="t h">03 持續評估與覆核</text><text x="70" y="808" class="m s">Resource assessment · Evidence finder</text><text x="70" y="852" class="t s">控制集委派 · 人工判讀 · 評論追蹤</text><text x="70" y="890" class="m s">自動證據不等於合規結論</text></g>
  <path class="line" d="M360 920V966"/>
  <g filter="url(#shadow)"><rect class="box" x="42" y="966" width="636" height="150" rx="24"/><text x="70" y="1010" class="t k">04 報告、例外與修復</text><text x="70" y="1060" class="t s">選證據 · 產報告 · 建工單 · 再測試</text><text x="70" y="1098" class="m s">保留原始來源、核准與完整追溯</text></g>
  <g transform="translate(42 1150)"><rect width="636" height="88" rx="22" fill="#0d1f35" stroke="#62e5c6" stroke-width="2"/><text x="24" y="34" class="t k">持續控制面</text><text x="24" y="66" class="m" style="font-size:18px;font-family:Inter,'Noto Sans TC',sans-serif">IAM · MFA · KMS · S3 · 稽核 · 機密 · 備份復原</text></g>
</svg>
