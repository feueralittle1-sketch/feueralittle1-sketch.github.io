<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="title desc">
  <title id="title">Elastic Beanstalk 安全部署與復原流程手機版示意</title>
  <desc id="desc">由上而下顯示受控版本門禁、Elastic Beanstalk 控制面、多可用區環境、外部資料與機密、監控稽核及跨區重建。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102848"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb454"/><stop offset="1" stop-color="#68e9ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8fe8ff"/></marker><style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f4f8ff}.h{font-size:31px;font-weight:800}.s{font-size:24px;font-weight:800}.b{font-size:19px;fill:#c5d5e9}.k{font-size:17px;fill:#8fe8ff}.card{fill:#10243e;stroke:#fff;stroke-opacity:.16;stroke-width:2}.line{stroke:#8fe8ff;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="720" height="1420" rx="28" fill="url(#bg)"/><text x="42" y="62" class="t h">Elastic Beanstalk 安全部署</text><text x="42" y="96" class="t b">示意｜版本、環境、資料、監控與復原</text>
  <g filter="url(#shadow)"><rect x="40" y="140" width="640" height="170" rx="25" class="card"/><rect x="40" y="140" width="640" height="10" rx="5" fill="url(#bar)"/><text x="70" y="194" class="t s">1. 受控 CI／版本門禁</text><text x="70" y="235" class="t b">測試・SBOM・掃描・簽章・核准</text><text x="70" y="272" class="t k">MFA＋短期憑證＋PassRole 限制</text></g>
  <line x1="360" y1="310" x2="360" y2="348" class="line"/>
  <g filter="url(#shadow)"><rect x="40" y="360" width="640" height="190" rx="25" class="card"/><text x="70" y="414" class="t s">2. Beanstalk 控制面</text><text x="70" y="455" class="t b">Application・Version・Environment</text><text x="70" y="491" class="t b">部署策略・容量・健康・平台更新</text><text x="70" y="525" class="t k">Standard：EC2｜Cluster：EKS</text></g>
  <line x1="360" y1="550" x2="360" y2="588" class="line"/>
  <g filter="url(#shadow)"><rect x="40" y="600" width="640" height="205" rx="25" class="card"/><text x="70" y="654" class="t s">3. 多可用區應用環境</text><rect x="70" y="682" width="210" height="82" rx="16" fill="#18304f"/><text x="95" y="717" class="t b">Public ALB</text><text x="95" y="747" class="t k">TLS・health・WAF</text><rect x="310" y="682" width="145" height="82" rx="16" fill="#122b46"/><text x="343" y="717" class="t b">AZ A</text><text x="332" y="747" class="t k">Private App</text><rect x="475" y="682" width="145" height="82" rx="16" fill="#122b46"/><text x="508" y="717" class="t b">AZ B</text><text x="497" y="747" class="t k">Private App</text></g>
  <line x1="360" y1="805" x2="360" y2="843" class="line"/>
  <g filter="url(#shadow)"><rect x="40" y="855" width="640" height="150" rx="25" class="card"/><text x="70" y="907" class="t s">4. 外部化資料與機密</text><text x="70" y="947" class="t b">RDS／S3／SQS・Secrets／Parameter Store</text><text x="70" y="979" class="t k">KMS・最小權限・輪替・備份</text></g>
  <line x1="360" y1="1005" x2="360" y2="1043" class="line"/>
  <g filter="url(#shadow)"><rect x="40" y="1055" width="640" height="140" rx="25" class="card"/><text x="70" y="1107" class="t s">5. 監控與部署判定</text><text x="70" y="1147" class="t b">Enhanced health・CloudWatch・CloudTrail</text><text x="70" y="1178" class="t k">技術＋業務指標決定推進或回復</text></g>
  <line x1="360" y1="1195" x2="360" y2="1233" class="line"/>
  <g filter="url(#shadow)"><rect x="40" y="1245" width="640" height="130" rx="25" class="card"/><text x="70" y="1297" class="t s">6. 跨區重建與切換</text><text x="70" y="1337" class="t b">IaC・資料還原・Route 53・RTO／RPO 演練</text></g>
</svg>
