<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1570" role="img" aria-labelledby="title desc">
  <title id="title">Amazon MSK 安全事件串流手機版示意圖</title>
  <desc id="desc">Producer 經私有網路、身分驗證、TLS 與 KMS 寫入 Amazon MSK，再由 consumer group 冪等處理，搭配監控、持久落地與跨區複寫。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7be7ff"/></marker>
    <style>.h{font:700 31px system-ui,sans-serif;fill:#fff}.t{font:700 25px system-ui,sans-serif;fill:#fff}.s{font:500 20px system-ui,sans-serif;fill:#c7d8ef}.box{fill:#112844;stroke:#416d96;stroke-width:2}.msk{fill:#382817;stroke:#ffae4d;stroke-width:3}.guard{fill:#102d2b;stroke:#48d7c7;stroke-width:2}.warn{fill:#321f2b;stroke:#ec75b9;stroke-width:2}.line{stroke:#7be7ff;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="760" height="1570" rx="34" fill="url(#bg)"/>
  <text x="45" y="62" class="h">示意：Amazon MSK 安全事件串流</text>
  <text x="45" y="99" class="s">分區、身分、offset、lag、持久性與跨區復原</text>
  <rect x="45" y="140" width="670" height="195" rx="24" class="box"/>
  <text x="80" y="184" class="t">1. Producer 與事件</text>
  <text x="80" y="225" class="s">Schema／事件 ID／高基數 message key</text><text x="80" y="260" class="s">敏感資料最小化，限制重試與流量</text><text x="80" y="295" class="s">量測尖峰 throughput 與 partition 分布</text>
  <path d="M380 335V380" class="line"/>
  <rect x="45" y="390" width="670" height="205" rx="24" class="guard"/>
  <text x="80" y="434" class="t">2. 身分、網路與加密</text>
  <text x="80" y="475" class="s">IAM／mTLS／SASL-SCRAM／短期憑證</text><text x="80" y="510" class="s">VPC／Security Group／PrivateLink</text><text x="80" y="545" class="s">TLS／KMS／Secrets Manager</text>
  <path d="M380 595V640" class="line"/>
  <rect x="45" y="650" width="670" height="245" rx="24" class="msk"/>
  <text x="80" y="694" class="t">3. Amazon MSK</text>
  <text x="80" y="735" class="s">Provisioned 或 Serverless</text><text x="80" y="770" class="s">Topic → partition → 多 AZ broker 副本</text><text x="80" y="805" class="s">Retention／EBS／tiered storage</text><text x="80" y="840" class="s">Consumer group／offset／rebalance／lag</text>
  <path d="M380 895V940" class="line"/>
  <rect x="45" y="950" width="670" height="205" rx="24" class="box"/>
  <text x="80" y="994" class="t">4. 冪等 Consumers</text>
  <text x="80" y="1035" class="s">Offset commit／事件 ID／去重／條件寫入</text><text x="80" y="1070" class="s">Schema 相容／毒性事件隔離／業務對帳</text><text x="80" y="1105" class="s">CloudWatch／broker logs／CloudTrail</text>
  <path d="M380 1155V1200" class="line"/>
  <rect x="45" y="1210" width="315" height="255" rx="24" class="warn"/>
  <text x="75" y="1254" class="t">5. 風險控制</text>
  <text x="75" y="1295" class="s">Hot partition</text><text x="75" y="1330" class="s">權限與公開連線</text><text x="75" y="1365" class="s">Offset／重複交易</text><text x="75" y="1400" class="s">Rebalance／lag</text>
  <rect x="400" y="1210" width="315" height="255" rx="24" class="guard"/>
  <text x="430" y="1254" class="t">6. 復原</text>
  <text x="430" y="1295" class="s">多 AZ 副本</text><text x="430" y="1330" class="s">MSK Replicator</text><text x="430" y="1365" class="s">S3 長期保存</text><text x="430" y="1400" class="s">跨區切換演練</text>
  <text x="45" y="1520" class="s">AWS 維護平台；客戶治理事件、用戶端、權限、結果與復原。</text>
</svg>
