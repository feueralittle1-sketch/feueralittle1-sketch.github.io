<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">API Gateway 會員訂單查詢安全流程示意圖</title>
  <desc id="desc">會員請求經 Route 53、AWS WAF、API Gateway 授權和節流後送至 Lambda，再以最小權限讀取 DynamoDB；CloudWatch、CloudTrail、KMS 與跨區復原覆蓋流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102847"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffbd70"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#77dff2"/></marker>
    <style>.t{font:700 23px system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#fff}.s{font:500 17px system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#c9d8ee}.k{font:700 18px system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#081426}.box{fill:#132d4c;stroke:#426989;stroke-width:2}.control{fill:#0c223d;stroke:#60cfe5;stroke-width:2}.line{fill:none;stroke:#77dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="t" font-size="30">示意｜會員訂單查詢 API：入口治理與後端授權</text>
  <text x="60" y="94" class="s">API Gateway 管理入口；每筆資料的存取權仍由後端驗證</text>

  <g filter="url(#shadow)">
    <rect x="55" y="155" width="165" height="116" rx="20" class="box"/>
    <text x="137" y="199" text-anchor="middle" class="t">會員應用</text><text x="137" y="230" text-anchor="middle" class="s">HTTPS 請求</text>
    <rect x="275" y="155" width="165" height="116" rx="20" class="box"/>
    <text x="357" y="199" text-anchor="middle" class="t">Route 53</text><text x="357" y="230" text-anchor="middle" class="s">自訂網域</text>
    <rect x="495" y="155" width="165" height="116" rx="20" class="box"/>
    <text x="577" y="199" text-anchor="middle" class="t">AWS WAF</text><text x="577" y="230" text-anchor="middle" class="s">規則與速率控制</text>
    <rect x="715" y="135" width="205" height="156" rx="24" fill="url(#api)"/>
    <text x="817" y="190" text-anchor="middle" class="k" font-size="23">API Gateway</text><text x="817" y="224" text-anchor="middle" class="k">授權・路由・節流</text><text x="817" y="254" text-anchor="middle" class="k">結構化存取日誌</text>
    <rect x="975" y="155" width="170" height="116" rx="20" class="box"/>
    <text x="1060" y="199" text-anchor="middle" class="t">Lambda</text><text x="1060" y="230" text-anchor="middle" class="s">逐筆授權</text>
  </g>
  <path d="M220 213h45" class="line"/><path d="M440 213h45" class="line"/><path d="M660 213h45" class="line"/><path d="M920 213h45" class="line"/>

  <g filter="url(#shadow)">
    <rect x="925" y="352" width="220" height="115" rx="20" class="box"/>
    <text x="1035" y="397" text-anchor="middle" class="t">DynamoDB</text><text x="1035" y="429" text-anchor="middle" class="s">租戶鍵・最小權限</text>
    <rect x="705" y="352" width="175" height="115" rx="20" class="control"/>
    <text x="792" y="394" text-anchor="middle" class="t">IAM Role</text><text x="792" y="426" text-anchor="middle" class="s">短期憑證</text>
    <rect x="485" y="352" width="175" height="115" rx="20" class="control"/>
    <text x="572" y="394" text-anchor="middle" class="t">KMS</text><text x="572" y="426" text-anchor="middle" class="s">資料與日誌加密</text>
    <rect x="265" y="352" width="175" height="115" rx="20" class="control"/>
    <text x="352" y="394" text-anchor="middle" class="t">CloudWatch</text><text x="352" y="426" text-anchor="middle" class="s">指標・日誌・告警</text>
    <rect x="55" y="352" width="165" height="115" rx="20" class="control"/>
    <text x="137" y="394" text-anchor="middle" class="t">CloudTrail</text><text x="137" y="426" text-anchor="middle" class="s">變更稽核</text>
  </g>
  <path d="M1060 271v71" class="line"/><path d="M925 410h-35" class="line"/>

  <rect x="55" y="540" width="1090" height="120" rx="22" fill="#102b42" stroke="#ffad42" stroke-width="2"/>
  <text x="90" y="582" class="t">跨區復原與共同責任</text>
  <text x="90" y="617" class="s">版本化 API 定義與基礎設施程式碼｜備份後端資料｜另一區域重建 API 與相依服務｜演練 DNS 切換</text>
  <text x="90" y="645" class="s">客戶負責授權、公開路徑、機密、記錄內容與復原驗證；AWS 負責受管服務底層基礎設施</text>
</svg>
