<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Amazon ECR 安全容器映像供應鏈示意流程</title><desc id="desc">可信來源經隔離建置、測試、SBOM、機密與弱點掃描及核准後，以不可變摘要推送至私有 Amazon ECR，再由私有工作負載拉取並複寫到復原區域，全程使用最小權限、KMS、CloudTrail 與 CloudWatch。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker><style>.h{font:700 34px system-ui,sans-serif;fill:#fff}.t{font:700 24px system-ui,sans-serif;fill:#fff}.s{font:18px system-ui,sans-serif;fill:#c6d4eb}.b{fill:#10243e;stroke:#4b719c;stroke-width:2}.g{fill:#12382f;stroke:#61ddb2;stroke-width:2}.w{fill:#3b2920;stroke:#ffb45f;stroke-width:2}.l{stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="1500" height="850" rx="30" fill="url(#bg)"/><text class="h" x="750" y="58" text-anchor="middle">示意｜Amazon ECR 可信映像通道</text>
<g><rect class="b" x="55" y="130" width="245" height="180" rx="22"/><text class="t" x="177" y="180" text-anchor="middle">1　可信來源</text><text class="s" x="177" y="225" text-anchor="middle">受保護分支</text><text class="s" x="177" y="260" text-anchor="middle">固定基底摘要</text>
<line class="l" x1="300" y1="220" x2="350" y2="220"/><rect class="b" x="365" y="130" width="245" height="180" rx="22"/><text class="t" x="487" y="180" text-anchor="middle">2　隔離建置</text><text class="s" x="487" y="225" text-anchor="middle">短期角色</text><text class="s" x="487" y="260" text-anchor="middle">機密不進映像層</text>
<line class="l" x1="610" y1="220" x2="660" y2="220"/><rect class="w" x="675" y="105" width="300" height="230" rx="22"/><text class="t" x="825" y="155" text-anchor="middle">3　安全門檻</text><text class="s" x="825" y="198" text-anchor="middle">測試・SBOM・機密偵測</text><text class="s" x="825" y="233" text-anchor="middle">套件與弱點掃描</text><text class="s" x="825" y="268" text-anchor="middle">簽章與獨立核准</text><text class="s" x="825" y="303" text-anchor="middle">不符合即停止</text>
<line class="l" x1="975" y1="220" x2="1025" y2="220"/><rect class="g" x="1040" y="105" width="405" height="230" rx="22"/><text class="t" x="1242" y="155" text-anchor="middle">4　私有 Amazon ECR</text><text class="s" x="1242" y="198" text-anchor="middle">標籤不可變・固定映像摘要</text><text class="s" x="1242" y="233" text-anchor="middle">最小儲存庫政策・KMS 加密</text><text class="s" x="1242" y="268" text-anchor="middle">持續掃描・生命週期保留</text><text class="s" x="1242" y="303" text-anchor="middle">CloudTrail 留證</text></g>
<path class="l" d="M1242 335v72H980v45"/><rect class="g" x="800" y="465" width="360" height="180" rx="22"/><text class="t" x="980" y="515" text-anchor="middle">5　私有工作負載</text><text class="s" x="980" y="560" text-anchor="middle">ECS／EKS／Lambda</text><text class="s" x="980" y="595" text-anchor="middle">執行角色・VPC 端點・摘要拉取</text>
<path class="l" d="M1160 555h80"/><rect class="b" x="1255" y="465" width="190" height="180" rx="22"/><text class="t" x="1350" y="515" text-anchor="middle">持續觀測</text><text class="s" x="1350" y="560" text-anchor="middle">新弱點</text><text class="s" x="1350" y="595" text-anchor="middle">重建部署</text>
<path class="l" d="M1040 335v72H475v45"/><rect class="b" x="275" y="465" width="400" height="180" rx="22"/><text class="t" x="475" y="515" text-anchor="middle">6　復原區域／帳號</text><text class="s" x="475" y="560" text-anchor="middle">核准命名空間複寫</text><text class="s" x="475" y="595" text-anchor="middle">摘要核對・替代區域演練</text>
<rect x="55" y="710" width="1390" height="90" rx="20" fill="#0b1c33" stroke="#6a8db4" stroke-width="2"/><text class="t" x="750" y="747" text-anchor="middle">橫跨控制</text><text class="s" x="750" y="780" text-anchor="middle">IAM 最小權限・MFA／短期憑證・私有網路・KMS・Secrets Manager／Parameter Store・CloudTrail／CloudWatch・備份與跨區復原</text>
</svg>
