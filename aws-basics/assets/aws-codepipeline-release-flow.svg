<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">AWS CodePipeline 受控發布流程示意圖</title><desc id="desc">來源變更依序經過不可變版本、建置測試、安全檢查、人工核准、分批部署及健康驗證；異常會停止並回復，CloudTrail 與 CloudWatch 持續記錄與告警。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11284a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#68e0ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#68e0ff"/></marker></defs>
<rect width="1400" height="780" rx="36" fill="url(#bg)"/><rect x="48" y="42" width="1304" height="696" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
<text x="90" y="105" fill="#fff" font-size="38" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">示意｜CodePipeline 受控發布閉環</text><text x="90" y="143" fill="#a9bfdc" font-size="21" font-family="Arial,'Noto Sans TC',sans-serif">不可變版本、品質門檻、職責分離、最小權限、觀測與可驗證回復</text>
<g filter="url(#shadow)" font-family="Arial,'Noto Sans TC',sans-serif">
<g transform="translate(80 205)"><rect width="190" height="155" rx="22" fill="#142b48" stroke="#ffb34d"/><circle cx="42" cy="42" r="20" fill="#ff9900"/><text x="42" y="49" text-anchor="middle" fill="#071426" font-size="20" font-weight="900">1</text><text x="28" y="91" fill="#fff" font-size="24" font-weight="800">來源變更</text><text x="28" y="122" fill="#b8cae2" font-size="17">受保護分支</text><text x="28" y="146" fill="#b8cae2" font-size="17">綁定來源修訂</text></g>
<g transform="translate(300 205)"><rect width="190" height="155" rx="22" fill="#142b48" stroke="#68e0ff"/><circle cx="42" cy="42" r="20" fill="#68e0ff"/><text x="42" y="49" text-anchor="middle" fill="#071426" font-size="20" font-weight="900">2</text><text x="28" y="91" fill="#fff" font-size="24" font-weight="800">建置與測試</text><text x="28" y="122" fill="#b8cae2" font-size="17">可重複建置</text><text x="28" y="146" fill="#b8cae2" font-size="17">單元／整合測試</text></g>
<g transform="translate(520 205)"><rect width="190" height="155" rx="22" fill="#142b48" stroke="#b794ff"/><circle cx="42" cy="42" r="20" fill="#b794ff"/><text x="42" y="49" text-anchor="middle" fill="#071426" font-size="20" font-weight="900">3</text><text x="28" y="91" fill="#fff" font-size="24" font-weight="800">安全門檻</text><text x="28" y="122" fill="#b8cae2" font-size="17">弱點／政策檢查</text><text x="28" y="146" fill="#b8cae2" font-size="17">失敗立即停止</text></g>
<g transform="translate(740 205)"><rect width="190" height="155" rx="22" fill="#142b48" stroke="#ffd166"/><circle cx="42" cy="42" r="20" fill="#ffd166"/><text x="42" y="49" text-anchor="middle" fill="#071426" font-size="20" font-weight="900">4</text><text x="28" y="91" fill="#fff" font-size="24" font-weight="800">獨立核准</text><text x="28" y="122" fill="#b8cae2" font-size="17">差異與證據</text><text x="28" y="146" fill="#b8cae2" font-size="17">回復方案就緒</text></g>
<g transform="translate(960 205)"><rect width="190" height="155" rx="22" fill="#142b48" stroke="#62e6a5"/><circle cx="42" cy="42" r="20" fill="#62e6a5"/><text x="42" y="49" text-anchor="middle" fill="#071426" font-size="20" font-weight="900">5</text><text x="28" y="91" fill="#fff" font-size="24" font-weight="800">分批部署</text><text x="28" y="122" fill="#b8cae2" font-size="17">受限部署角色</text><text x="28" y="146" fill="#b8cae2" font-size="17">少量容量／流量</text></g>
<g transform="translate(1180 205)"><rect width="140" height="155" rx="22" fill="#142b48" stroke="#62e6a5"/><circle cx="38" cy="42" r="20" fill="#62e6a5"/><text x="38" y="49" text-anchor="middle" fill="#071426" font-size="20" font-weight="900">6</text><text x="22" y="91" fill="#fff" font-size="22" font-weight="800">健康驗證</text><text x="22" y="122" fill="#b8cae2" font-size="16">技術指標</text><text x="22" y="146" fill="#b8cae2" font-size="16">業務交易</text></g>
</g>
<g stroke="#68e0ff" stroke-width="4" marker-end="url(#arrow)"><path d="M270 282H292"/><path d="M490 282H512"/><path d="M710 282H732"/><path d="M930 282H952"/><path d="M1150 282H1172"/></g>
<rect x="90" y="425" width="590" height="205" rx="24" fill="#0d2039" stroke="#ef6b7b"/><text x="125" y="472" fill="#ff9bab" font-size="25" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">異常路徑：停止、保留證據、回復</text><text x="125" y="516" fill="#d5e1f1" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">• 測試、掃描或健康門檻不通過即停止推進</text><text x="125" y="554" fill="#d5e1f1" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">• 回復上一個已驗證版本，資料另依備份程序處理</text><text x="125" y="592" fill="#d5e1f1" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">• 重新驗證服務與業務交易，不以動作成功取代驗收</text>
<rect x="720" y="425" width="590" height="205" rx="24" fill="#0d2039" stroke="url(#accent)"/><text x="755" y="472" fill="#8fe8ff" font-size="25" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">全程控制：身分、成品、觀測、復原</text><text x="755" y="516" fill="#d5e1f1" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">• MFA／短期角色與 IAM 最小權限，限制可傳遞角色</text><text x="755" y="554" fill="#d5e1f1" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">• S3 私有成品＋KMS；機密由專用服務引用</text><text x="755" y="592" fill="#d5e1f1" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">• CloudTrail／CloudWatch；備份、跨區部署與還原演練</text>
<path d="M1250 360V395H385V417" fill="none" stroke="#ef6b7b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="830" y="393" fill="#ff9bab" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif">任何門檻異常</text>
<text x="700" y="694" text-anchor="middle" fill="#95aac8" font-size="18" font-family="Arial,'Noto Sans TC',sans-serif">原創流程圖｜實際架構須依區域、動作供應者、資料分類與復原目標調整</text>
</svg>
