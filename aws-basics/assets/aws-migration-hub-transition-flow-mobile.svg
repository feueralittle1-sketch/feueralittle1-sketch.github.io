<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1580" viewBox="0 0 720 1580" role="img" aria-labelledby="title desc">
  <title id="title">AWS Migration Hub 既有追蹤與遷移治理轉向手機版示意</title>
  <desc id="desc">縱向呈現遷移基線、既有 Migration Hub 追蹤、服務生命週期門檻、現行工具轉向、遷移波次與共同治理控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f8fbff}.h{font-size:30px;font-weight:800}.s{font-size:17px;fill:#bcd0eb}.box{fill:#10233f;stroke:#365b83;stroke-width:2}.accent{fill:#142e50;stroke:#ffad35;stroke-width:2}.alt{fill:#0d3342;stroke:#4ed9c4;stroke-width:2}.warn{fill:#3a2131;stroke:#fb7185;stroke-width:2}.label{font-size:22px;font-weight:800}.body{font-size:18px;fill:#c9d8ed}.line{fill:none;stroke:#79ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1580" rx="32" fill="url(#bg)"/>
  <text x="45" y="65" class="t h">Migration Hub</text><text x="45" y="105" class="t h">既有追蹤與治理轉向</text>
  <text x="45" y="140" class="t s">示意｜新客戶自 2025-11-07 起不再開放</text>

  <rect x="45" y="180" width="630" height="125" rx="22" class="box"/><text x="75" y="222" class="t label">1. 建立遷移基線</text><text x="75" y="260" class="t body">應用、依賴、擁有者、波次、RTO／RPO 與驗收</text>
  <path d="M360 305V345" class="line"/>
  <rect x="45" y="360" width="630" height="140" rx="22" class="accent"/><text x="75" y="402" class="t label">2. 既有 Migration Hub 受控追蹤</text><text x="75" y="442" class="t body">匯入探索與工具狀態，管理里程碑、阻塞與證據</text><text x="75" y="476" class="t body">限制資料、角色、區域與可見範圍</text>
  <path d="M360 500V540" class="line"/>
  <rect x="45" y="555" width="630" height="145" rx="22" class="warn"/><text x="75" y="597" class="t label">3. 服務生命週期門檻</text><text x="75" y="637" class="t body">既有使用：確認可用期限與匯出需求</text><text x="75" y="672" class="t body">新需求：不建立新的 Migration Hub 相依</text>
  <path d="M360 700V740" class="line"/>
  <rect x="45" y="755" width="630" height="145" rx="22" class="alt"/><text x="75" y="797" class="t label">4. 轉向現行能力</text><text x="75" y="837" class="t body">AWS Transform、MGN、DMS 或其他組合工具</text><text x="75" y="872" class="t body">以 PoC 驗證功能、狀態模型、成本與治理證據</text>
  <path d="M360 900V940" class="line"/>

  <rect x="45" y="955" width="630" height="365" rx="26" class="box"/><text x="75" y="998" class="t label">遷移波次運作閉環</text>
  <rect x="75" y="1030" width="570" height="58" rx="15" class="accent"/><text x="98" y="1067" class="t body">① 盤點分群：依賴、關鍵度、資料量、責任人</text>
  <path d="M360 1088V1115" class="line"/>
  <rect x="75" y="1125" width="570" height="58" rx="15" class="accent"/><text x="98" y="1162" class="t body">② 工具執行：複寫、轉換、測試與狀態證據</text>
  <path d="M360 1183V1210" class="line"/>
  <rect x="75" y="1220" width="570" height="58" rx="15" class="accent"/><text x="98" y="1257" class="t body">③ 波次決策：就緒、阻塞、回復、簽核與驗收</text>
  <path d="M360 1320V1360" class="line"/>

  <rect x="45" y="1375" width="630" height="160" rx="26" class="alt"/><text x="75" y="1417" class="t label">共同治理控制</text><text x="75" y="1457" class="t body">IAM／MFA／短期憑證、網路隔離、KMS、秘密管理</text><text x="75" y="1492" class="t body">CloudTrail／CloudWatch、備份、回復與跨區復原</text>
</svg>
