<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc"><title id="title">AWS Transfer Family 安全檔案交換流程手機版</title><desc id="desc">交易夥伴、受控端點、最小權限、S3 隔離、檔案檢查、監控與跨區復原流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs><rect width="390" height="1160" rx="28" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="24" y="48" fill="#fff" font-size="22" font-weight="800">AWS Transfer Family</text><text x="24" y="78" fill="#9fb6d8" font-size="14">示意：交換入口、隔離、驗證與復原</text><rect x="24" y="110" width="342" height="150" rx="20" fill="#132a4c" stroke="#5075a8"/><text x="46" y="145" fill="#ffbd70" font-size="19" font-weight="800">1. 交易夥伴</text><text x="46" y="180" fill="#e8f1ff" font-size="16"><tspan x="46">SFTP／FTPS／AS2／瀏覽器</tspan><tspan x="46" dy="27">來源 IP、VPN、獨立使用者</tspan><tspan x="46" dy="27">檔案類型、大小、傳輸時窗</tspan></text><path d="M195 260v35" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="24" y="310" width="342" height="260" rx="20" fill="#10213d" stroke="#ff9900"/><text x="46" y="348" fill="#fff" font-size="19" font-weight="800">2. 受控傳輸端點</text><g fill="#203d68"><rect x="46" y="375" width="298" height="48" rx="13"/><rect x="46" y="439" width="298" height="48" rx="13"/><rect x="46" y="503" width="298" height="48" rx="13"/></g><g fill="#fff" font-size="15" font-weight="700" text-anchor="middle"><text x="195" y="405">身分提供者＋Security Policy</text><text x="195" y="469">IAM 最小權限＋邏輯目錄</text><text x="195" y="533">VPC／Security Group／來源限制</text></g><path d="M195 570v35" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="24" y="620" width="342" height="155" rx="20" fill="#132a4c" stroke="#5075a8"/><text x="46" y="655" fill="#ffbd70" font-size="19" font-weight="800">3. S3／EFS 隔離區</text><text x="46" y="692" fill="#e8f1ff" font-size="16"><tspan x="46">每個 partner 獨立路徑</tspan><tspan x="46" dy="27">KMS、公開封鎖、版本與保留</tspan><tspan x="46" dy="27">未驗證檔案不得進核心系統</tspan></text><path d="M195 775v35" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="24" y="825" width="342" height="250" rx="20" fill="#0c1b32" stroke="#31527d"/><text x="46" y="862" fill="#fff" font-size="19" font-weight="800">4. 驗證、發布與復原</text><text x="46" y="900" fill="#e8f1ff" font-size="15"><tspan x="46">① 格式／大小／雜湊／惡意檔案檢查</tspan><tspan x="46" dy="30">② accepted／rejected 與冪等處理</tspan><tspan x="46" dy="30">③ CloudWatch＋CloudTrail 稽核</tspan><tspan x="46" dy="30">④ 版本、備份、跨區資料副本</tspan><tspan x="46" dy="30">⑤ DNS／身分／金鑰復原演練</tspan></text><rect x="24" y="1100" width="342" height="38" rx="19" fill="#ffb14f"/><text x="195" y="1125" fill="#071426" text-anchor="middle" font-size="13" font-weight="900">傳輸完成 ≠ 檔案可信、授權正確或已可復原</text></g></svg>
