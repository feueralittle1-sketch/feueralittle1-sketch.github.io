<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
<title id="title">AWS Compute Optimizer 資源最佳化治理流程手機版</title>
<desc id="desc">AWS 資源與指標依序通過資料品質、建議偏好、風險審查、測試核准、受控變更及監控回復。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#70d9ff"/></marker></defs>
<rect width="720" height="1500" fill="url(#bg)"/><circle cx="650" cy="110" r="180" fill="#ff9900" opacity=".07"/>
<g font-family="Arial, Noto Sans TC, sans-serif"><text x="42" y="70" fill="#fff" font-size="34" font-weight="700">Compute Optimizer</text><text x="42" y="112" fill="#ffbd70" font-size="25" font-weight="700">從建議到可回復變更</text><text x="42" y="150" fill="#a9bddc" font-size="18">示意流程｜每一步都有治理門禁</text></g>
<g font-family="Arial, Noto Sans TC, sans-serif">
<g transform="translate(42 200)"><rect width="636" height="142" rx="22" fill="#112946" stroke="#49769b"/><rect width="12" height="142" rx="6" fill="#70d9ff"/><text x="38" y="46" fill="#fff" font-size="25" font-weight="700">1. 資源與指標</text><text x="38" y="84" fill="#c9d8ec" font-size="19">EC2 · EBS · Lambda · ECS · RDS / Aurora</text><text x="38" y="116" fill="#c9d8ec" font-size="19">CloudWatch 與適用的外部記憶體指標</text></g>
<path d="M360 345V380" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(42 395)"><rect width="636" height="142" rx="22" fill="#112946" stroke="#49769b"/><rect width="12" height="142" rx="6" fill="#70d9ff"/><text x="38" y="46" fill="#fff" font-size="25" font-weight="700">2. 資料品質門禁</text><text x="38" y="84" fill="#c9d8ec" font-size="19">完整觀察期間 · 記憶體 · 尖峰 · 季節性</text><text x="38" y="116" fill="#c9d8ec" font-size="19">災難復原容量與業務成長另行辨識</text></g>
<path d="M360 540V575" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(42 590)"><rect width="636" height="158" rx="22" fill="#1b304a" stroke="#ffb454"/><rect width="12" height="158" rx="6" fill="#ff9900"/><text x="38" y="46" fill="#fff" font-size="25" font-weight="700">3. 建議、偏好與風險</text><text x="38" y="84" fill="#ffe2bd" font-size="19">finding · 候選規格 · 效能風險 · 預估節省</text><text x="38" y="116" fill="#ffe2bd" font-size="19">餘裕 · 觀察期間 · 家族 · Graviton 偏好</text><text x="38" y="144" fill="#ffe2bd" font-size="19">SLO · 授權 · 折扣 · 相依性 · 排除範圍</text></g>
<path d="M360 751V786" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(42 801)"><rect width="636" height="142" rx="22" fill="#112946" stroke="#49769b"/><rect width="12" height="142" rx="6" fill="#70d9ff"/><text x="38" y="46" fill="#fff" font-size="25" font-weight="700">4. 測試與核准</text><text x="38" y="84" fill="#c9d8ec" font-size="19">測試環境 / canary · 成功與停止條件</text><text x="38" y="116" fill="#c9d8ec" font-size="19">責任人 · 變更窗口 · 明確回復門檻</text></g>
<path d="M360 946V981" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(42 996)"><rect width="636" height="142" rx="22" fill="#1b304a" stroke="#ffb454"/><rect width="12" height="142" rx="6" fill="#ff9900"/><text x="38" y="46" fill="#fff" font-size="25" font-weight="700">5. 受控變更</text><text x="38" y="84" fill="#ffe2bd" font-size="19">人工執行或 Automation · IAM 最小權限</text><text x="38" y="116" fill="#ffe2bd" font-size="19">限定標籤 · 小批次 · 可立即回復</text></g>
<path d="M360 1141V1176" stroke="#70d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g transform="translate(42 1191)"><rect width="636" height="158" rx="22" fill="#112946" stroke="#49769b"/><rect width="12" height="158" rx="6" fill="#70d9ff"/><text x="38" y="46" fill="#fff" font-size="25" font-weight="700">6. 監控、證據與回饋</text><text x="38" y="84" fill="#c9d8ec" font-size="19">效能 · 成本 · 體驗 · CloudTrail / CloudWatch</text><text x="38" y="116" fill="#c9d8ec" font-size="19">私有 S3 匯出 · 快照 · IaC · 跨區容量</text><text x="38" y="144" fill="#c9d8ec" font-size="19">重新評估指標、偏好、風險與下一輪候選</text></g>
<rect x="42" y="1390" width="636" height="72" rx="18" fill="#0c2038" stroke="#355d7b"/><text x="66" y="1420" fill="#fff" font-size="19" font-weight="700">持續護欄</text><text x="66" y="1448" fill="#a9bddc" font-size="17">MFA · 短期憑證 · KMS · 私有 S3 · 可驗證回復</text>
</g></svg>
