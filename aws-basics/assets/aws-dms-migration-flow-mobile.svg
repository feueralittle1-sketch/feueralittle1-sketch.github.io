<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1500" viewBox="0 0 390 1500" role="img" aria-labelledby="title desc">
  <title id="title">AWS DMS 安全資料庫遷移手機版流程</title><desc id="desc">來源資料庫經盤點、備份、隔離網路、DMS 全量載入與持續變更複寫，完成驗證後切換至目標資料庫。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#10213b"/><stop offset="1" stop-color="#07111f"/></linearGradient><linearGradient id="orange"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a18"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8fe8ff"/></marker><style>.t{font-family:Inter,'Noto Sans TC',system-ui,sans-serif;fill:#fff}.m{fill:#a8bad8}.b{fill:#0d1a2e;stroke:#ffffff22;stroke-width:2}.h{font-size:22px;font-weight:800}.s{font-size:17px}.line{stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style></defs>
  <rect width="390" height="1500" rx="28" fill="url(#bg)"/><text x="28" y="52" class="t" font-size="25" font-weight="900">AWS DMS 安全遷移流程</text><text x="28" y="82" class="t m" font-size="15">示意：遷移管線不等於備份或零停機保證</text>
  <g><rect x="25" y="120" width="340" height="155" rx="24" class="b"/><circle cx="62" cy="158" r="20" fill="url(#orange)"/><text x="56" y="165" class="t" font-size="17" font-weight="900">1</text><text x="50" y="207" class="t h">來源盤點與備份</text><text x="50" y="239" class="t m s">結構、資料、相依性、RTO／RPO</text>
  <path d="M195 275v42" class="line"/><rect x="25" y="330" width="340" height="155" rx="24" class="b"/><circle cx="62" cy="368" r="20" fill="url(#orange)"/><text x="56" y="375" class="t" font-size="17" font-weight="900">2</text><text x="50" y="417" class="t h">隔離遷移網路</text><text x="50" y="449" class="t m s">私有子網路、TLS、KMS、短期憑證</text>
  <path d="M195 485v42" class="line"/><rect x="25" y="540" width="340" height="175" rx="24" class="b"/><circle cx="62" cy="578" r="20" fill="url(#orange)"/><text x="56" y="585" class="t" font-size="17" font-weight="900">3</text><text x="50" y="627" class="t h">DMS 全量載入 + CDC</text><text x="50" y="659" class="t m s">監控延遲、錯誤、容量與任務日誌</text><text x="50" y="689" class="t m s">Schema 轉換需另行驗收</text>
  <path d="M195 715v42" class="line"/><rect x="25" y="770" width="340" height="175" rx="24" class="b"/><circle cx="62" cy="808" r="20" fill="url(#orange)"/><text x="56" y="815" class="t" font-size="17" font-weight="900">4</text><text x="50" y="857" class="t h">資料與業務驗證</text><text x="50" y="889" class="t m s">列數、驗證狀態、抽樣與財務對帳</text><text x="50" y="919" class="t m s">失敗表格不得帶病切換</text>
  <path d="M195 945v42" class="line"/><rect x="25" y="1000" width="340" height="175" rx="24" class="b"/><circle cx="62" cy="1038" r="20" fill="url(#orange)"/><text x="56" y="1045" class="t" font-size="17" font-weight="900">5</text><text x="50" y="1087" class="t h">停寫、追平與切換</text><text x="50" y="1119" class="t m s">確認 CDC 延遲歸零並完成最終對帳</text><text x="50" y="1149" class="t m s">切換連線後保留回復條件</text>
  <path d="M195 1175v42" class="line"/><rect x="25" y="1230" width="340" height="185" rx="24" class="b"/><circle cx="62" cy="1268" r="20" fill="url(#orange)"/><text x="56" y="1275" class="t" font-size="17" font-weight="900">6</text><text x="50" y="1317" class="t h">稽核、備份與跨區復原</text><text x="50" y="1349" class="t m s">CloudTrail／CloudWatch／告警</text><text x="50" y="1379" class="t m s">來源與目標備份、還原演練</text></g>
  <text x="28" y="1460" class="t" font-size="15" font-weight="800">最小權限 · MFA · 私有路徑 · KMS · Secrets Manager</text>
</svg>
