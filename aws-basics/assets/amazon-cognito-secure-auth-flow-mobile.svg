<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1460" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Cognito 安全會員登入與資源授權手機示意圖</title>
  <desc id="desc">垂直呈現 Web 或行動會員經 Cognito 使用者集區、MFA、授權碼與 PKCE 取得 access token，API 完整驗證 JWT 並執行資料層授權；需要時由身分集區與 STS 提供受限短期 AWS 憑證。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 24px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 19px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 17px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1460" rx="32" fill="url(#bg)"/>
  <text x="44" y="56" class="k">原創架構圖 · 示意</text><text x="44" y="96" class="t">Cognito 安全身分流程</text>
  <g filter="url(#shadow)">
    <rect x="80" y="135" width="560" height="100" rx="22" class="box"/><text x="360" y="176" text-anchor="middle" class="t">1. Web／Mobile 會員端</text><text x="360" y="209" text-anchor="middle" class="s">state・nonce・PKCE</text>
    <path d="M360 235V270" class="line"/>

    <rect x="70" y="280" width="580" height="290" rx="28" fill="#091a31" stroke="#ffad3d" stroke-width="3"/><text x="110" y="322" class="k">COGNITO USER POOL</text>
    <rect x="130" y="350" width="460" height="78" rx="18" class="step"/><text x="360" y="383" text-anchor="middle" class="t">2. 受管登入／聯合 IdP＋MFA</text><text x="360" y="411" text-anchor="middle" class="s">OIDC／SAML／本機使用者</text>
    <path d="M360 428V455" class="line"/>
    <rect x="130" y="465" width="460" height="78" rx="18" class="step"/><text x="360" y="498" text-anchor="middle" class="t">3. 授權碼＋PKCE</text><text x="360" y="526" text-anchor="middle" class="s">簽發短效 access token</text>
    <path d="M360 570V605" class="line"/>

    <rect x="80" y="615" width="560" height="105" rx="22" class="box"/><text x="360" y="655" text-anchor="middle" class="t">4. API 完整驗證 JWT</text><text x="360" y="690" text-anchor="middle" class="s">簽章・iss・client・token_use・exp・scope</text>
    <path d="M360 720V755" class="line"/>

    <rect x="80" y="765" width="560" height="105" rx="22" class="box"/><text x="360" y="805" text-anchor="middle" class="t">5. 應用與資料層授權</text><text x="360" y="840" text-anchor="middle" class="s">租戶・物件擁有權・角色・敏感操作</text>

    <path d="M360 870V910" class="line"/>
    <rect x="55" y="920" width="295" height="112" rx="20" class="box"/><text x="202" y="958" text-anchor="middle" class="k">需要直接 AWS 存取時</text><text x="202" y="994" text-anchor="middle" class="t">Identity Pool</text><text x="202" y="1018" text-anchor="middle" class="s">可信聲明→IAM 角色</text>
    <rect x="370" y="920" width="295" height="112" rx="20" class="step"/><text x="517" y="958" text-anchor="middle" class="k">AWS STS</text><text x="517" y="994" text-anchor="middle" class="t">短期憑證</text><text x="517" y="1018" text-anchor="middle" class="s">audience／tag 限制</text>
    <path d="M350 976H370" class="line"/>
    <path d="M517 1032V1070" class="line"/>
    <rect x="80" y="1080" width="560" height="100" rx="22" class="box"/><text x="360" y="1120" text-anchor="middle" class="t">6. KMS 加密 S3</text><text x="360" y="1153" text-anchor="middle" class="s">會員專屬前綴＋bucket／key policy</text>
  </g>
  <g>
    <rect x="55" y="1225" width="295" height="92" rx="18" class="guard"/><text x="78" y="1262" class="k">入口防護</text><text x="78" y="1295" class="s">WAF、枚舉防護、威脅驗證</text>
    <rect x="370" y="1225" width="295" height="92" rx="18" class="guard"/><text x="393" y="1262" class="k">管理與機密</text><text x="393" y="1295" class="s">MFA、短期憑證、Secrets、KMS</text>
    <rect x="55" y="1335" width="295" height="92" rx="18" class="guard"/><text x="78" y="1372" class="k">觀測與稽核</text><text x="78" y="1405" class="s">CloudWatch／CloudTrail</text>
    <rect x="370" y="1335" width="295" height="92" rx="18" class="guard"/><text x="393" y="1372" class="k">多區域復原</text><text x="393" y="1405" class="s">DNS、IdP、API、資料共同演練</text>
  </g>
</svg>