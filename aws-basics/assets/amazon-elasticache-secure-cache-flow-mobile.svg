<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">Amazon ElastiCache 安全低延遲商品快取手機示意圖</title>
  <desc id="desc">垂直呈現私有應用以 cache-aside 查詢 ElastiCache for Valkey，命中時回應，未命中時以請求合併或短效鎖查詢 Aurora 並回填；資料更新事件失效快取，周邊配置網路、身分、觀測、備份與復原控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#0d2240"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78dff2"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffb657"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>.box{fill:#102b4c;stroke:#5dd5ea;stroke-width:2}.step{fill:#11213b;stroke:#ffb657;stroke-width:2}.guard{fill:#142943;stroke:#9db8df;stroke-width:1.5}.t{font:700 23px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 18px Inter,'Noto Sans TC',sans-serif;fill:#c8d8ee}.k{font:800 16px Inter,'Noto Sans TC',sans-serif;fill:#ffbd70;letter-spacing:1px}.line{fill:none;stroke:#78dff2;stroke-width:4;marker-end:url(#arrow)}.event{fill:none;stroke:#ffb657;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#orangeArrow)}</style>
  </defs>
  <rect width="720" height="1500" rx="32" fill="url(#bg)"/>
  <text x="44" y="56" class="k">原創架構圖 · 示意</text><text x="44" y="96" class="t">ElastiCache 受控快取流程</text>
  <g filter="url(#shadow)">
    <rect x="80" y="135" width="560" height="100" rx="22" class="box"/><text x="360" y="175" text-anchor="middle" class="t">1. 商品查詢進入私有應用</text><text x="360" y="207" text-anchor="middle" class="s">租戶、資料授權、版本化快取鍵</text>
    <path d="M360 235V270" class="line"/>

    <rect x="65" y="280" width="590" height="250" rx="28" fill="#091a31" stroke="#ffad3d" stroke-width="3"/><text x="105" y="322" class="k">ELASTICACHE FOR VALKEY · MULTI-AZ</text>
    <rect x="110" y="350" width="230" height="105" rx="18" class="step"/><text x="225" y="390" text-anchor="middle" class="t">Primary</text><text x="225" y="422" text-anchor="middle" class="s">讀寫、TTL</text>
    <rect x="380" y="350" width="230" height="105" rx="18" class="step"/><text x="495" y="390" text-anchor="middle" class="t">Replica</text><text x="495" y="422" text-anchor="middle" class="s">跨 AZ 複寫</text>
    <path d="M340 402H380" class="event"/>
    <text x="360" y="492" text-anchor="middle" class="s">TLS・IAM 短期驗證・RBAC・KMS</text>

    <path d="M360 530V565" class="line"/>
    <rect x="80" y="575" width="560" height="105" rx="22" class="box"/><text x="360" y="616" text-anchor="middle" class="t">2A. 命中：低延遲回應</text><text x="360" y="650" text-anchor="middle" class="s">資料仍受 TTL 與新鮮度邊界約束</text>

    <path d="M360 680V715" class="line"/>
    <rect x="80" y="725" width="560" height="110" rx="22" class="step"/><text x="360" y="766" text-anchor="middle" class="t">2B. 未命中：請求合併／短效鎖</text><text x="360" y="801" text-anchor="middle" class="s">限流、斷路器，避免資料庫雪崩</text>

    <path d="M360 835V870" class="line"/>
    <rect x="80" y="880" width="560" height="110" rx="22" class="box"/><text x="360" y="921" text-anchor="middle" class="t">3. 查詢 Aurora 權威資料</text><text x="360" y="956" text-anchor="middle" class="s">授權查詢 → 回填快取 → 回應</text>

    <path d="M360 990V1025" class="event"/>
    <rect x="80" y="1035" width="560" height="110" rx="22" class="step"/><text x="360" y="1076" text-anchor="middle" class="t">4. 更新完成後發布版本事件</text><text x="360" y="1111" text-anchor="middle" class="s">刪除或更新對應鍵，防止舊資料</text>
  </g>
  <g>
    <rect x="55" y="1195" width="295" height="105" rx="18" class="guard"/><text x="78" y="1233" class="k">網路與身分</text><text x="78" y="1267" class="s">私有 VPC、SG、MFA、短期憑證</text>
    <rect x="370" y="1195" width="295" height="105" rx="18" class="guard"/><text x="393" y="1233" class="k">一致性與過載</text><text x="393" y="1267" class="s">TTL 抖動、熱鍵、資料庫保護</text>
    <rect x="55" y="1320" width="295" height="105" rx="18" class="guard"/><text x="78" y="1358" class="k">觀測與稽核</text><text x="78" y="1392" class="s">CloudWatch／CloudTrail</text>
    <rect x="370" y="1320" width="295" height="105" rx="18" class="guard"/><text x="393" y="1358" class="k">備份與復原</text><text x="393" y="1392" class="s">快照還原、預熱、跨區切換</text>
  </g>
  <text x="360" y="1470" text-anchor="middle" class="s">快取失效時仍須限制後端併發。</text>
</svg>
