<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Network Firewall 多可用區檢查與稽核流程示意</title>
  <desc id="desc">網際網路與工作負載流量經各可用區路由表送到同區域的 Network Firewall endpoint，以無狀態與有狀態規則檢查，核准後前往 NAT Gateway、Internet Gateway 或應用子網路，並將警示與流量記錄集中保存。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284b"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd28a"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#36d8ff"/><stop offset="1" stop-color="#8ff3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8fe8ff"/></marker>
    <style>.box{fill:#0d223d;stroke:#365b82;stroke-width:2}.zone{fill:#0a1b31;stroke:#486b90;stroke-width:2;stroke-dasharray:10 8}.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#eef7ff}.muted{fill:#a9bfdc}.small{font-size:20px}.body{font-size:24px}.head{font-size:31px;font-weight:800}.label{font-size:18px;font-weight:700;letter-spacing:1px}.line{fill:none;stroke:#8fe8ff;stroke-width:5;marker-end:url(#arrow)}.control{fill:#122c48;stroke:#ffb34f;stroke-width:2}</style>
  </defs>
  <rect width="1440" height="900" rx="32" fill="url(#bg)"/>
  <text x="72" y="74" class="t head">示意：AWS Network Firewall 多可用區檢查與稽核</text>
  <text x="72" y="108" class="t muted small">路由對稱、同可用區端點、分層規則、集中日誌與跨區重建缺一不可</text>

  <rect x="60" y="150" width="235" height="130" rx="22" class="box" filter="url(#shadow)"/>
  <text x="178" y="194" text-anchor="middle" class="t label">流量來源</text>
  <text x="178" y="230" text-anchor="middle" class="t body">Internet／分支據點</text>
  <text x="178" y="260" text-anchor="middle" class="t muted small">或 VPC 工作負載</text>

  <rect x="355" y="135" width="650" height="470" rx="28" class="zone"/>
  <text x="385" y="178" class="t label">檢查 VPC（同一區域）</text>
  <rect x="390" y="205" width="275" height="350" rx="22" class="box"/>
  <text x="528" y="244" text-anchor="middle" class="t head">AZ-A</text>
  <rect x="420" y="275" width="215" height="86" rx="16" class="control"/>
  <text x="528" y="310" text-anchor="middle" class="t body">Firewall endpoint</text>
  <text x="528" y="339" text-anchor="middle" class="t muted small">A 區專用路由</text>
  <rect x="420" y="392" width="215" height="105" rx="16" class="box"/>
  <text x="528" y="426" text-anchor="middle" class="t body">Stateless rules</text>
  <text x="528" y="456" text-anchor="middle" class="t body">Stateful rules</text>
  <text x="528" y="483" text-anchor="middle" class="t muted small">預設拒絕／明確允許</text>

  <rect x="695" y="205" width="275" height="350" rx="22" class="box"/>
  <text x="833" y="244" text-anchor="middle" class="t head">AZ-B</text>
  <rect x="725" y="275" width="215" height="86" rx="16" class="control"/>
  <text x="833" y="310" text-anchor="middle" class="t body">Firewall endpoint</text>
  <text x="833" y="339" text-anchor="middle" class="t muted small">B 區專用路由</text>
  <rect x="725" y="392" width="215" height="105" rx="16" class="box"/>
  <text x="833" y="426" text-anchor="middle" class="t body">Domain／IP／協定</text>
  <text x="833" y="456" text-anchor="middle" class="t body">Suricata 相容規則</text>
  <text x="833" y="483" text-anchor="middle" class="t muted small">警示、丟棄或通過</text>

  <rect x="1065" y="150" width="315" height="190" rx="22" class="box" filter="url(#shadow)"/>
  <text x="1223" y="194" text-anchor="middle" class="t label">核准目的地</text>
  <text x="1223" y="232" text-anchor="middle" class="t body">NAT／Internet Gateway</text>
  <text x="1223" y="268" text-anchor="middle" class="t body">Private workloads</text>
  <text x="1223" y="303" text-anchor="middle" class="t muted small">安全群組仍須最小化</text>

  <path d="M295 215H390" class="line"/>
  <path d="M635 318H725" class="line"/>
  <path d="M970 248H1065" class="line"/>
  <text x="330" y="199" class="t muted small">路由導流</text>
  <text x="996" y="230" class="t muted small">允許後送出</text>

  <rect x="355" y="650" width="1025" height="170" rx="26" class="box"/>
  <text x="395" y="695" class="t label">治理與證據層</text>
  <g class="t body">
    <text x="395" y="742">CloudWatch Logs／S3／Firehose</text>
    <text x="395" y="780" class="muted small">Flow logs、alert logs、保存週期與告警</text>
    <text x="795" y="742">CloudTrail ＋ AWS Config</text>
    <text x="795" y="780" class="muted small">政策、規則、路由與管理面變更</text>
    <text x="1110" y="742">KMS ＋ IaC</text>
    <text x="1110" y="780" class="muted small">加密、版本化與跨區重建</text>
  </g>
  <path d="M680 555V650" class="line"/>
  <rect x="60" y="650" width="235" height="170" rx="22" fill="url(#orange)" opacity=".94"/>
  <text x="178" y="704" text-anchor="middle" fill="#142033" class="head">關鍵門禁</text>
  <text x="178" y="746" text-anchor="middle" fill="#142033" class="body">往返路徑必須對稱</text>
  <text x="178" y="781" text-anchor="middle" fill="#142033" class="small">每個 AZ 綁定同區端點</text>
  <path d="M295 735H355" class="line"/>
</svg>
