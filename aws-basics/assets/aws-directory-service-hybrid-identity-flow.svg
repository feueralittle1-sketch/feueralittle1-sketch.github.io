<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">AWS Directory Service 混合身分與目錄服務流程示意圖</title>
  <desc id="desc">企業使用者經由既有 Active Directory、AWS Managed Microsoft AD 或 AD Connector，在私有網路與多可用區架構中存取 EC2、RDS、FSx、WorkSpaces 等服務，並由 CloudTrail、CloudWatch、快照與跨區復原支援治理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b48"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#77d9f7"/></marker>
    <style>.h{font:700 30px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 23px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:500 18px Inter,'Noto Sans TC',sans-serif;fill:#bed0e8}.tiny{font:600 16px Inter,'Noto Sans TC',sans-serif;fill:#d8e7f7}.box{fill:#122c47;stroke:#4b7596;stroke-width:2}.accent{fill:#3a250e;stroke:#ffad3d;stroke-width:2}.line{fill:none;stroke:#77d9f7;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#8aa3b9;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="860" rx="36" fill="url(#bg)"/>
  <text x="70" y="72" class="h">示意：AWS Directory Service 的身分、網路與治理流程</text>
  <text x="70" y="108" class="s">先選擇目錄模式，再以私有連線、最小權限、監控與復原控制保護驗證路徑</text>

  <g filter="url(#shadow)"><rect x="70" y="170" width="270" height="210" rx="24" class="box"/></g>
  <text x="105" y="218" class="t">人員與裝置</text>
  <text x="105" y="258" class="s">• 企業使用者</text><text x="105" y="292" class="s">• Windows／Linux</text><text x="105" y="326" class="s">• 管理工作站</text>
  <rect x="100" y="346" width="205" height="12" rx="6" fill="url(#orange)"/>

  <g filter="url(#shadow)"><rect x="440" y="145" width="500" height="285" rx="28" class="accent"/></g>
  <text x="480" y="197" class="t">選擇目錄服務模式</text>
  <rect x="480" y="225" width="420" height="60" rx="15" class="box"/><text x="505" y="263" class="tiny">AWS Managed Microsoft AD：完整受管 AD</text>
  <rect x="480" y="301" width="420" height="60" rx="15" class="box"/><text x="505" y="339" class="tiny">AD Connector：代理至既有自管 AD</text>
  <rect x="480" y="377" width="420" height="35" rx="12" fill="#26384c"/><text x="505" y="401" class="tiny">Simple AD：基本 Samba 相容功能</text>

  <g filter="url(#shadow)"><rect x="1040" y="170" width="290" height="210" rx="24" class="box"/></g>
  <text x="1075" y="218" class="t">AWS 工作負載</text>
  <text x="1075" y="258" class="s">EC2、RDS、FSx</text><text x="1075" y="292" class="s">WorkSpaces 等</text><text x="1075" y="326" class="s">AD／LDAP 相容應用</text>
  <rect x="1075" y="346" width="220" height="12" rx="6" fill="#77d9f7"/>

  <path d="M340 275H425" class="line"/><path d="M940 275h85" class="line"/>
  <text x="350" y="253" class="tiny">驗證請求</text><text x="948" y="253" class="tiny">授權存取</text>

  <g filter="url(#shadow)"><rect x="120" y="515" width="350" height="235" rx="24" class="box"/></g>
  <text x="155" y="562" class="t">網路與高可用</text>
  <text x="155" y="602" class="s">• 私有子網路與安全群組</text><text x="155" y="636" class="s">• 至少跨兩個可用區</text><text x="155" y="670" class="s">• DNS、路由與連線測試</text><text x="155" y="704" class="s">• 信任／VPN／Direct Connect</text>

  <g filter="url(#shadow)"><rect x="525" y="515" width="350" height="235" rx="24" class="box"/></g>
  <text x="560" y="562" class="t">安全控制</text>
  <text x="560" y="602" class="s">• IAM 最小權限與短期憑證</text><text x="560" y="636" class="s">• MFA、特權群組分離</text><text x="560" y="670" class="s">• LDAPS／KMS／機密保管</text><text x="560" y="704" class="s">• 禁止公開管理介面</text>

  <g filter="url(#shadow)"><rect x="930" y="515" width="350" height="235" rx="24" class="box"/></g>
  <text x="965" y="562" class="t">監控與復原</text>
  <text x="965" y="602" class="s">• CloudTrail 控制面稽核</text><text x="965" y="636" class="s">• CloudWatch 目錄安全日誌</text><text x="965" y="670" class="s">• 自動／手動快照與演練</text><text x="965" y="704" class="s">• Enterprise 跨區複寫</text>

  <path d="M690 430v60H295v10" class="dash"/><path d="M700 430v70" class="dash"/><path d="M710 430v60h395v10" class="dash"/>
  <text x="70" y="820" class="s">共同責任：AWS 維運受管基礎設施；客戶負責目錄選型、帳號與群組、網路、權限、日誌、備份驗證及應用授權。</text>
</svg>
