<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc">
<title id="title">AWS Secrets Manager 手機版安全取用、輪替與跨區復原示意流程</title>
<desc id="desc">由上而下呈現私有應用經 VPC 端點取得目前機密、連接私有資料庫、輪替與測試、稽核告警及跨區複寫。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b46"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#67e8f9"/></marker></defs>
<rect width="390" height="1040" rx="24" fill="url(#bg)"/><rect x="14" y="14" width="362" height="1012" rx="20" fill="none" stroke="#294866"/>
<g font-family="Arial,'Noto Sans TC',sans-serif"><text x="28" y="52" fill="#fff" font-size="19" font-weight="700">示意｜執行期機密與安全輪替</text><rect x="28" y="67" width="250" height="4" rx="2" fill="#ff9900"/>
<g text-anchor="middle"><rect x="42" y="100" width="306" height="112" rx="18" fill="#10243a" stroke="#67e8f9" stroke-width="2"/><text x="195" y="134" fill="#67e8f9" font-size="16" font-weight="700">1. 私有應用工作負載</text><text x="195" y="168" fill="#fff" font-size="20" font-weight="700">IAM Role</text><text x="195" y="194" fill="#bfd3e8" font-size="14">短期憑證・最小權限</text>
<path d="M195 212V248" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="42" y="258" width="306" height="100" rx="18" fill="#10243a" stroke="#67e8f9" stroke-width="2"/><text x="195" y="293" fill="#67e8f9" font-size="16" font-weight="700">2. VPC 介面端點</text><text x="195" y="327" fill="#fff" font-size="16">TLS・受控安全群組</text>
<path d="M195 358V394" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="42" y="404" width="306" height="130" rx="18" fill="#172841" stroke="#ffb14d" stroke-width="3"/><text x="195" y="440" fill="#ffb14d" font-size="16" font-weight="700">3. AWS Secrets Manager</text><text x="195" y="476" fill="#fff" font-size="20" font-weight="700">AWSCURRENT</text><text x="195" y="506" fill="#bfd3e8" font-size="14">版本・資源政策・KMS</text>
<path d="M195 534V570" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="42" y="580" width="306" height="94" rx="18" fill="#10243a" stroke="#a78bfa" stroke-width="2"/><text x="195" y="616" fill="#c4b5fd" font-size="16" font-weight="700">4. 私有資料庫</text><text x="195" y="648" fill="#fff" font-size="15">禁止公開存取</text>
<rect x="28" y="716" width="334" height="116" rx="18" fill="#10243a" stroke="#ffb14d" stroke-width="2"/><text x="195" y="748" fill="#ffb14d" font-size="16" font-weight="700">輪替 Lambda（私有子網路）</text><text x="195" y="780" fill="#fff" font-size="14">建立 → 更新 → 測試 → 切換版本</text><text x="195" y="807" fill="#86efac" font-size="13">失敗時保留可用目前版本</text>
<rect x="28" y="852" width="160" height="120" rx="18" fill="#10243a" stroke="#67e8f9" stroke-width="2"/><text x="108" y="886" fill="#67e8f9" font-size="14" font-weight="700">稽核與告警</text><text x="108" y="918" fill="#fff" font-size="13">CloudTrail</text><text x="108" y="942" fill="#fff" font-size="13">CloudWatch</text>
<rect x="202" y="852" width="160" height="120" rx="18" fill="#10243a" stroke="#a78bfa" stroke-width="2"/><text x="282" y="886" fill="#c4b5fd" font-size="14" font-weight="700">備援區域</text><text x="282" y="918" fill="#fff" font-size="13">機密複本・KMS</text><text x="282" y="942" fill="#fff" font-size="13">完整切換演練</text></g>
