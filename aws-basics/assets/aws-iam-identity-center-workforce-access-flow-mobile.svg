<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1340" viewBox="0 0 760 1340" role="img" aria-labelledby="title desc">
  <title id="title">AWS IAM Identity Center 多帳號人員存取治理流程手機版</title>
  <desc id="desc">企業身分提供者與 MFA 將人員及群組同步至 IAM Identity Center，透過權限集、帳號指派及短期憑證存取多個 AWS 帳號，再由 CloudTrail、CloudWatch 與複核流程治理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <style>.box{fill:#10233f;stroke:#385273;stroke-width:2}.secure{fill:#172a42;stroke:#ffb454;stroke-width:2}.t{font-family:Arial,'Noto Sans TC',sans-serif;fill:#f8fbff}.h{font-size:28px;font-weight:700}.p{font-size:21px;fill:#c8d7eb}.small{font-size:18px;fill:#a9bdd7}.line{fill:none;stroke:#67e8f9;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="760" height="1340" rx="34" fill="url(#bg)"/>
  <text x="50" y="65" class="t h">示意｜多帳號人員存取</text>
  <text x="50" y="100" class="t small">集中身分、權限集與短期憑證</text>

  <rect x="55" y="145" width="650" height="180" rx="26" class="box"/>
  <text x="90" y="195" class="t h">1. 企業身分來源</text>
  <text x="90" y="240" class="t p">使用者／群組 · MFA</text>
  <text x="90" y="280" class="t p">SCIM 或目錄同步</text>
  <path d="M380 325V375" class="line"/>

  <rect x="55" y="385" width="650" height="235" rx="26" class="secure"/>
  <rect x="95" y="420" width="570" height="56" rx="16" fill="url(#accent)"/>
  <text x="380" y="457" text-anchor="middle" style="font:700 25px Arial,'Noto Sans TC',sans-serif;fill:#111827">IAM Identity Center</text>
  <text x="95" y="520" class="t p">身分與群組</text>
  <text x="95" y="558" class="t p">權限集與工作階段</text>
  <text x="95" y="596" class="t p">AWS 帳號指派</text>
  <path d="M380 620V670" class="line"/>

  <rect x="55" y="680" width="650" height="180" rx="26" class="box"/>
  <text x="90" y="730" class="t h">2. 短期工作階段</text>
  <text x="90" y="775" class="t p">Access portal／CLI／SDK</text>
  <text x="90" y="815" class="t p">有期限 IAM 角色憑證</text>
  <path d="M380 860V910" class="line"/>

  <rect x="55" y="920" width="650" height="180" rx="26" class="box"/>
  <text x="90" y="970" class="t h">3. 多帳號權限邊界</text>
  <text x="90" y="1015" class="t p">開發 · 正式 · 安全帳號</text>
  <text x="90" y="1055" class="t p">SCP／資源政策／KMS 上限</text>
  <path d="M380 1100V1150" class="line"/>

  <rect x="55" y="1160" width="650" height="130" rx="26" class="box"/>
  <text x="90" y="1210" class="t h">4. 稽核與復原</text>
  <text x="90" y="1255" class="t p">CloudTrail · 告警 · 複核 · 演練</text>
  <text x="380" y="1320" text-anchor="middle" class="t small">最小權限 · MFA · 短期憑證 · 分層控制</text>
</svg>
