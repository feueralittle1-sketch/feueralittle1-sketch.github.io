<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS IAM Access Analyzer 權限分析與修復流程</title>
  <desc id="desc">從帳號與組織信任區域、資源政策、身分政策及 CloudTrail 活動開始，分別產生外部、內部與未使用存取發現，再進行分類、修復、政策驗證與持續監控。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10254a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <style>.box{fill:#10233f;stroke:#385273;stroke-width:2}.secure{fill:#172a42;stroke:#ffb454;stroke-width:2}.t{font-family:Arial,'Noto Sans TC',sans-serif;fill:#f8fbff}.h{font-size:27px;font-weight:700}.p{font-size:19px;fill:#c8d7eb}.small{font-size:17px;fill:#a9bdd7}.line{fill:none;stroke:#67e8f9;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#ffb454;stroke-width:3;stroke-dasharray:10 9}</style>
  </defs>
  <rect width="1400" height="900" rx="38" fill="url(#bg)"/>
  <text x="70" y="70" class="t h">示意｜以 Access Analyzer 建立權限發現、修復與驗證閉環</text>
  <text x="70" y="106" class="t p">分析結果是治理輸入，不會自動阻擋存取；政策、網路、資料與復原仍須分層控制</text>

  <g filter="url(#shadow)">
    <rect x="65" y="170" width="300" height="245" rx="26" class="box"/>
    <rect x="420" y="145" width="555" height="295" rx="30" class="secure"/>
    <rect x="1030" y="170" width="305" height="245" rx="26" class="box"/>
    <rect x="105" y="555" width="355" height="220" rx="28" class="box"/>
    <rect x="520" y="555" width="355" height="220" rx="28" class="box"/>
    <rect x="935" y="555" width="355" height="220" rx="28" class="box"/>
  </g>

  <text x="100" y="220" class="t h">分析輸入</text>
  <text x="100" y="265" class="t p">帳號／組織信任區域</text>
  <text x="100" y="302" class="t p">資源與身分政策</text>
  <text x="100" y="339" class="t p">SCP／RCP／權限界限</text>
  <text x="100" y="376" class="t p">CloudTrail 與存取活動</text>

  <rect x="465" y="180" width="465" height="58" rx="17" fill="url(#accent)"/>
  <text x="698" y="218" text-anchor="middle" style="font:700 25px Arial,'Noto Sans TC',sans-serif;fill:#111827">AWS IAM Access Analyzer</text>
  <text x="465" y="285" class="t p">① 外部存取：公開或信任區域之外</text>
  <text x="465" y="326" class="t p">② 內部存取：組織內有效存取路徑</text>
  <text x="465" y="367" class="t p">③ 未使用存取：角色、金鑰與權限活動</text>
  <text x="465" y="408" class="t small">另含政策驗證、自訂檢查、預覽與政策產生</text>

  <text x="1065" y="220" class="t h">發現佇列</text>
  <text x="1065" y="265" class="t p">Active：待確認</text>
  <text x="1065" y="302" class="t p">Archived：已核准例外</text>
  <text x="1065" y="339" class="t p">Resolved：存取已移除</text>
  <text x="1065" y="376" class="t small">依資源、主體、條件與風險分級</text>

  <path d="M365 290H420" class="line"/>
  <path d="M975 290H1030" class="line"/>
  <path d="M1180 415V495H282V555" class="line"/>
  <path d="M1180 415V495H698V555" class="line"/>
  <path d="M1180 415V495H1112V555" class="line"/>

  <text x="145" y="605" class="t h">判讀與核准</text>
  <text x="145" y="650" class="t p">確認業務必要性</text>
  <text x="145" y="687" class="t p">驗證主體與條件</text>
  <text x="145" y="724" class="t p">例外需擁有者與期限</text>

  <text x="560" y="605" class="t h">修復與縮權</text>
  <text x="560" y="650" class="t p">移除公開或跨帳號存取</text>
  <text x="560" y="687" class="t p">刪除閒置角色與權限</text>
  <text x="560" y="724" class="t p">更新政策並測試工作負載</text>

  <text x="975" y="605" class="t h">部署前驗證</text>
  <text x="975" y="650" class="t p">ValidatePolicy／自訂檢查</text>
  <text x="975" y="687" class="t p">Access Preview／CI 門禁</text>
  <text x="975" y="724" class="t p">CloudTrail 與 CloudWatch 告警</text>

  <path d="M875 665H935" class="dash"/>
  <path d="M1112 775V820H698V440" class="dash"/>
  <text x="900" y="845" text-anchor="middle" class="t small">持續複核：新政策、新資源、新主體與未使用權限都重新進入分析循環</text>
  <text x="700" y="880" text-anchor="middle" class="t small">最小權限 · MFA／短期憑證 · 網路隔離 · KMS · 機密管理 · 稽核 · 備份與復原</text>
</svg>
