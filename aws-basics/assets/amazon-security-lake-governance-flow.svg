<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Security Lake 安全資料治理流程</title>
  <desc id="desc">AWS 與自訂安全資料經 OCSF 正規化寫入 Amazon Security Lake，再由受控訂閱者查詢，回查原始證據並執行事件處置與復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d8ff"/><stop offset="1" stop-color="#8fffe1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:30px;font-weight:800}.s{font-size:18px}.k{font-size:15px;font-weight:700;letter-spacing:.08em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="130" cy="90" r="180" fill="#ff9900" opacity=".08"/><circle cx="1320" cy="810" r="260" fill="#55d8ff" opacity=".07"/>
  <text x="74" y="86" class="t h">Amazon Security Lake 安全資料治理</text>
  <text x="74" y="120" class="m s">示意：多源資料 → OCSF 正規化 → 受控查詢 → 證據驗證與復原</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="184" width="280" height="432" rx="28"/>
    <text x="100" y="228" class="t k">01 安全資料來源</text>
    <g transform="translate(100 260)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">CloudTrail / VPC</text></g>
    <g transform="translate(100 338)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">Route 53 Resolver</text></g>
    <g transform="translate(100 416)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">Security Hub</text></g>
    <g transform="translate(100 494)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">第三方 / 自訂來源</text></g>
    <text x="100" y="590" class="m s">帳號 · 區域 · 來源版本</text>
  </g>
  <path class="line" d="M350 400H420"/>
  <g filter="url(#shadow)">
    <rect x="420" y="184" width="310" height="432" rx="28" fill="#122b49" stroke="#ffb657" stroke-width="2"/>
    <rect x="454" y="222" width="242" height="8" rx="4" fill="url(#orange)"/>
    <text x="454" y="278" class="t h">Security Lake</text>
    <text x="454" y="316" class="m s">S3 · OCSF · Parquet</text>
    <g transform="translate(454 358)"><circle cx="15" cy="15" r="15" fill="#ff9900"/><text x="44" y="21" class="t s">來源與欄位驗證</text></g>
    <g transform="translate(454 410)"><circle cx="15" cy="15" r="15" fill="#ffb657"/><text x="44" y="21" class="t s">區域彙整</text></g>
    <g transform="translate(454 462)"><circle cx="15" cy="15" r="15" fill="#ffd38a"/><text x="44" y="21" class="t s">KMS 與生命週期</text></g>
    <g transform="translate(454 514)"><circle cx="15" cy="15" r="15" fill="#8fe8ff"/><text x="44" y="21" class="t s">目錄與分割區</text></g>
    <text x="454" y="584" class="m s">集中資料不等於事件結論</text>
  </g>
  <path class="line" d="M730 400H800"/>
  <g filter="url(#shadow)">
    <rect class="box" x="800" y="184" width="270" height="432" rx="28"/>
    <text x="830" y="228" class="t k">03 受控分析</text>
    <g transform="translate(830 265)"><rect width="210" height="78" rx="18" fill="#162f50"/><text x="18" y="32" class="t s">Lake Formation</text><text x="18" y="58" class="m s">資料表與跨帳號權限</text></g>
    <g transform="translate(830 360)"><rect width="210" height="78" rx="18" fill="#162f50"/><text x="18" y="32" class="t s">Athena / SIEM</text><text x="18" y="58" class="m s">限範圍查詢與獵捕</text></g>
    <g transform="translate(830 455)"><rect width="210" height="78" rx="18" fill="#162f50"/><text x="18" y="32" class="t s">Subscriber</text><text x="18" y="58" class="m s">用途、到期與撤銷</text></g>
    <text x="830" y="580" class="m s">最小權限 · 查詢預算</text>
  </g>
  <path class="line" d="M1070 400H1140"/>
  <g filter="url(#shadow)">
    <rect class="box" x="1140" y="184" width="230" height="432" rx="28"/>
    <text x="1170" y="228" class="t k">04 驗證與復原</text>
    <g transform="translate(1170 270)"><rect width="170" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">回查原始紀錄</text></g>
    <g transform="translate(1170 352)"><rect width="170" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">隔離與縮權</text></g>
    <g transform="translate(1170 434)"><rect width="170" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">修復與監控</text></g>
    <g transform="translate(1170 516)"><rect width="170" height="64" rx="16" fill="url(#cyan)"/><text x="18" y="39" style="font-family:Inter,'Noto Sans TC',sans-serif;fill:#072034;font-size:18px;font-weight:800">復原驗證</text></g>
  </g>
  <path d="M1255 616V728H575V624" fill="none" stroke="#62e5c6" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <g transform="translate(190 704)"><rect width="1060" height="116" rx="24" fill="#0d1f35" stroke="#ffffff22" stroke-width="2"/><text x="36" y="42" class="t k">持續控制面</text><text x="36" y="78" class="m s">IAM 最小權限與 MFA／短期憑證　·　公開存取阻擋　·　KMS　·　CloudTrail／CloudWatch</text><text x="36" y="103" class="m s">OCSF 品質驗證　·　訂閱者複核　·　Secrets Manager／Parameter Store　·　備份與跨區復原</text></g>
</svg>
