<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AWS CloudHSM 安全金鑰生命週期示意</title><desc id="desc">使用者經短期身分與核准送出文件簽章請求，私有子網路中的簽章服務呼叫跨兩個可用區的 CloudHSM，並由稽核、監控、備份與跨區復原控制保護。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10294a"/></linearGradient><linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffcc80"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#74d9ff"/></marker></defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="145" cy="100" r="180" fill="#ff9900" opacity=".08"/><circle cx="1450" cy="770" r="240" fill="#4ad7ff" opacity=".07"/>
<text x="80" y="82" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="38" font-weight="800">CloudHSM 專屬金鑰控制與高可用流程</text><text x="80" y="122" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="20">示意架構｜身分、應用授權、HSM 使用者、不可匯出金鑰與復原分層治理</text>
<g filter="url(#shadow)"><rect x="70" y="190" width="250" height="180" rx="24" fill="#122944" stroke="#506b89"/><circle cx="135" cy="250" r="34" fill="#253f60"/><path d="M125 250l8 8 16-20" fill="none" stroke="#7ee8bc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="243" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="25" font-weight="700">請求與核准</text><text x="185" y="277" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">IAM Identity Center</text><text x="185" y="304" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">MFA・短期憑證</text><text x="100" y="342" fill="#ffcc80" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">應用授權＋雙人核准</text>
<rect x="405" y="190" width="300" height="180" rx="24" fill="#122944" stroke="#506b89"/><rect x="449" y="229" width="70" height="62" rx="12" fill="#223e60" stroke="#74d9ff"/><path d="M467 261h34M484 244v34" stroke="#74d9ff" stroke-width="5" stroke-linecap="round"/><text x="545" y="243" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="25" font-weight="700">私有簽章服務</text><text x="545" y="278" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">私有子網路</text><text x="545" y="305" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">PKCS #11 / JCE</text><text x="448" y="342" fill="#ffcc80" font-family="Arial,'Noto Sans TC',sans-serif" font-size="17">只送入雜湊，私鑰不離開 HSM</text>
<rect x="790" y="160" width="730" height="400" rx="30" fill="#0b1e35" stroke="#ff9900" stroke-width="2"/><text x="830" y="207" fill="#ffb84d" font-family="Arial,'Noto Sans TC',sans-serif" font-size="27" font-weight="800">CloudHSM 叢集｜同一區域</text><rect x="835" y="242" width="285" height="250" rx="22" fill="#132b47" stroke="#5a7697"/><text x="875" y="282" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">可用區 A</text><rect x="882" y="315" width="190" height="120" rx="18" fill="#253e5d" stroke="#ffb84d"/><path d="M925 350h104v52H925z" fill="#0f2035" stroke="#ffb84d"/><circle cx="949" cy="376" r="8" fill="#7ee8bc"/><circle cx="1003" cy="376" r="8" fill="#7ee8bc"/><text x="916" y="463" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="20" font-weight="700">專屬 HSM</text><rect x="1190" y="242" width="285" height="250" rx="22" fill="#132b47" stroke="#5a7697"/><text x="1230" y="282" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">可用區 B</text><rect x="1237" y="315" width="190" height="120" rx="18" fill="#253e5d" stroke="#ffb84d"/><path d="M1280 350h104v52h-104z" fill="#0f2035" stroke="#ffb84d"/><circle cx="1304" cy="376" r="8" fill="#7ee8bc"/><circle cx="1358" cy="376" r="8" fill="#7ee8bc"/><text x="1271" y="463" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="20" font-weight="700">專屬 HSM</text><path d="M1125 370h60" stroke="#7ee8bc" stroke-width="4" stroke-dasharray="8 8"/><text x="1044" y="530" fill="#ffcc80" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">HSM 使用者・金鑰同步・不可匯出私鑰</text></g>
<path d="M320 280h78" stroke="#74d9ff" stroke-width="5" marker-end="url(#arrow)"/><path d="M705 280h78" stroke="#74d9ff" stroke-width="5" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="70" y="645" width="1450" height="155" rx="26" fill="#10243d" stroke="#476686"/><rect x="110" y="682" width="290" height="82" rx="17" fill="#172f4c"/><text x="145" y="716" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="21" font-weight="700">CloudTrail＋業務稽核</text><text x="145" y="746" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="16">控制面事件・請求關聯・結果</text><rect x="445" y="682" width="290" height="82" rx="17" fill="#172f4c"/><text x="480" y="716" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="21" font-weight="700">CloudWatch 監控</text><text x="480" y="746" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="16">連線・延遲・錯誤・容量</text><rect x="780" y="682" width="290" height="82" rx="17" fill="#172f4c"/><text x="815" y="716" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="21" font-weight="700">加密備份驗證</text><text x="815" y="746" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="16">隔離還原・簽章／解密測試</text><rect x="1115" y="682" width="360" height="82" rx="17" fill="#172f4c"/><text x="1150" y="716" fill="#fff" font-family="Arial,'Noto Sans TC',sans-serif" font-size="21" font-weight="700">跨區災難復原</text><text x="1150" y="746" fill="#a9bdd8" font-family="Arial,'Noto Sans TC',sans-serif" font-size="16">叢集・網路・機密・應用切換演練</text></g>
<path d="M1155 560v72" stroke="#74d9ff" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="855" fill="#7ee8bc" font-family="Arial,'Noto Sans TC',sans-serif" font-size="18">控制原則：IAM 管 AWS 控制面；HSM 使用者管裝置內權限；應用授權管每一筆業務密碼作業。</text></svg>