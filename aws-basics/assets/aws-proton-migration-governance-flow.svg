<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">AWS Proton 退場遷移治理流程</title><desc id="desc">從失效的 AWS Proton 控制面保存證據，盤點模板管線角色與資源，選擇替代工具，在隔離環境驗證後分批切換，撤銷舊權限並持續監控備份與跨區復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102a46"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#63e6ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#63e6ff"/></marker></defs>
<rect width="1440" height="920" rx="36" fill="url(#bg)"/><path d="M70 126H1370" stroke="url(#accent)" stroke-width="4" opacity=".9"/><text x="72" y="76" fill="#fff" font-size="38" font-weight="800" font-family="Arial,'Noto Sans TC',sans-serif">AWS Proton 退場後：把工作負載接回可持續的管理面</text><text x="72" y="112" fill="#a8bad8" font-size="20" font-family="Arial,'Noto Sans TC',sans-serif">示意流程｜保存證據 → 重建依賴 → 驗證替代管線 → 分批切換 → 監控與復原</text>
<g filter="url(#shadow)" font-family="Arial,'Noto Sans TC',sans-serif">
<rect x="70" y="180" width="250" height="210" rx="26" fill="#17243a" stroke="#fb7185" stroke-width="2"/><circle cx="110" cy="222" r="18" fill="#fb7185"/><text x="110" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">1</text><text x="142" y="230" fill="#fff" font-size="25" font-weight="800">確認退場邊界</text><text x="96" y="275" fill="#c6d4eb" font-size="18"><tspan x="96">Proton 控制面不可存取</tspan><tspan x="96" dy="31">底層資源仍持續運作</tspan><tspan x="96" dy="31">凍結非必要平台變更</tspan></text>
<rect x="365" y="180" width="250" height="210" rx="26" fill="#17243a" stroke="#ffb45c" stroke-width="2"/><circle cx="405" cy="222" r="18" fill="#ffb45c"/><text x="405" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">2</text><text x="437" y="230" fill="#fff" font-size="25" font-weight="800">保存與盤點</text><text x="391" y="275" fill="#c6d4eb" font-size="18"><tspan x="391">Git／S3／CloudTrail</tspan><tspan x="391" dy="31">模板、參數、輸出、狀態</tspan><tspan x="391" dy="31">管線、角色、帳號、區域</tspan></text>
<rect x="660" y="180" width="250" height="210" rx="26" fill="#17243a" stroke="#63e6ff" stroke-width="2"/><circle cx="700" cy="222" r="18" fill="#63e6ff"/><text x="700" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">3</text><text x="732" y="230" fill="#fff" font-size="25" font-weight="800">重建管理能力</text><text x="686" y="275" fill="#c6d4eb" font-size="18"><tspan x="686">版本化 IaC 與 schema</tspan><tspan x="686" dy="31">選擇 GitOps／CI/CD</tspan><tspan x="686" dy="31">建立最小權限角色</tspan></text>
<rect x="955" y="180" width="250" height="210" rx="26" fill="#17243a" stroke="#a78bfa" stroke-width="2"/><circle cx="995" cy="222" r="18" fill="#a78bfa"/><text x="995" y="229" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">4</text><text x="1027" y="230" fill="#fff" font-size="25" font-weight="800">隔離驗證</text><text x="981" y="275" fill="#c6d4eb" font-size="18"><tspan x="981">change set 與政策門禁</tspan><tspan x="981" dy="31">更新、擴縮、失敗回復</tspan><tspan x="981" dy="31">備份還原與跨區重建</tspan></text>
</g>
<g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M320 285H355"/><path d="M615 285H650"/><path d="M910 285H945"/></g>
<path d="M1080 408V470H220V525" stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)" font-family="Arial,'Noto Sans TC',sans-serif">
<rect x="70" y="535" width="380" height="230" rx="28" fill="#132d3d" stroke="#63e6ff" stroke-width="2"/><circle cx="115" cy="578" r="19" fill="#63e6ff"/><text x="115" y="585" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">5</text><text x="150" y="586" fill="#fff" font-size="27" font-weight="800">分批切換與回復</text><text x="98" y="635" fill="#c6d4eb" font-size="19"><tspan x="98">低風險服務先行，逐批核准</tspan><tspan x="98" dy="34">每批保留停止條件與回復點</tspan><tspan x="98" dy="34">驗證資料、流量、監控與成本</tspan></text>
<rect x="500" y="535" width="380" height="230" rx="28" fill="#222642" stroke="#a78bfa" stroke-width="2"/><circle cx="545" cy="578" r="19" fill="#a78bfa"/><text x="545" y="585" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">6</text><text x="580" y="586" fill="#fff" font-size="27" font-weight="800">撤除舊信任</text><text x="528" y="635" fill="#c6d4eb" font-size="19"><tspan x="528">撤銷舊角色、grant 與連線</tspan><tspan x="528" dy="34">移除 webhook 與過期授權</tspan><tspan x="528" dy="34">保存遷移證據與例外紀錄</tspan></text>
<rect x="930" y="535" width="380" height="230" rx="28" fill="#2b2835" stroke="#ffb45c" stroke-width="2"/><circle cx="975" cy="578" r="19" fill="#ffb45c"/><text x="975" y="585" text-anchor="middle" fill="#07111f" font-size="18" font-weight="800">7</text><text x="1010" y="586" fill="#fff" font-size="27" font-weight="800">持續治理</text><text x="958" y="635" fill="#c6d4eb" font-size="19"><tspan x="958">CloudTrail／CloudWatch</tspan><tspan x="958" dy="34">漂移、供應鏈、成本與備份</tspan><tspan x="958" dy="34">定期演練更新與跨區復原</tspan></text>
</g>
<g stroke="#63e6ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M450 650H490"/><path d="M880 650H920"/></g>
<rect x="70" y="812" width="1240" height="60" rx="20" fill="#0b1a2b" stroke="#ffffff" stroke-opacity=".12"/><text x="690" y="849" text-anchor="middle" fill="#e6eefc" font-size="20" font-weight="700" font-family="Arial,'Noto Sans TC',sans-serif">完成標準：工作負載不只「仍在線」，還能被安全更新、稽核、備份、回復與跨區重建</text>
</svg>
