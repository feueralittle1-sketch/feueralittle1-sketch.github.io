<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc"><title id="title">Amazon FSx 受管檔案儲存流程手機版</title><desc id="desc">需求盤點、檔案系統選型、私有部署、安全監控、備份與跨區復原流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10264a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#67e8f9"/></marker></defs><rect width="390" height="1160" rx="28" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="24" y="48" fill="#fff" font-size="23" font-weight="800">Amazon FSx</text><text x="24" y="78" fill="#9fb6d8" font-size="14">示意：選型、隔離、監控與復原</text><rect x="24" y="110" width="342" height="150" rx="20" fill="#132a4c" stroke="#5075a8"/><text x="46" y="145" fill="#ffbd70" font-size="19" font-weight="800">1. 需求盤點</text><text x="46" y="180" fill="#e8f1ff" font-size="16"><tspan x="46">SMB／NFS、ACL、snapshot</tspan><tspan x="46" dy="27">IOPS／吞吐、容量、延遲</tspan><tspan x="46" dy="27">RTO／RPO、資料分類</tspan></text><path d="M195 260v35" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="24" y="310" width="342" height="310" rx="20" fill="#10213d" stroke="#ff9900"/><text x="46" y="348" fill="#fff" font-size="19" font-weight="800">2. 檔案系統選型</text><g fill="#203d68"><rect x="46" y="375" width="298" height="48" rx="13"/><rect x="46" y="439" width="298" height="48" rx="13"/><rect x="46" y="503" width="298" height="48" rx="13"/><rect x="46" y="567" width="298" height="35" rx="13"/></g><g fill="#fff" font-size="15" font-weight="700" text-anchor="middle"><text x="195" y="405">Windows File Server｜SMB</text><text x="195" y="469">Lustre｜HPC／ML／高速運算</text><text x="195" y="533">NetApp ONTAP｜多協定與資料管理</text><text x="195" y="590">OpenZFS｜NFS 與 ZFS 語意</text></g><path d="M195 620v35" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="24" y="670" width="342" height="145" rx="20" fill="#132a4c" stroke="#5075a8"/><text x="46" y="707" fill="#ffbd70" font-size="19" font-weight="800">3. 私有部署</text><text x="46" y="742" fill="#e8f1ff" font-size="15"><tspan x="46">VPC 私有子網路與 Security Group</tspan><tspan x="46" dy="26">DNS／目錄整合、單 AZ／跨 AZ 選型</tspan><tspan x="46" dy="26">用戶端路由、連接埠與掛載控制</tspan></text><path d="M195 815v35" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="24" y="865" width="342" height="225" rx="20" fill="#0c1b32" stroke="#31527d"/><text x="46" y="903" fill="#fff" font-size="19" font-weight="800">4. 全生命週期控制</text><text x="46" y="939" fill="#e8f1ff" font-size="15"><tspan x="46">• IAM 最小權限、MFA、短期憑證</tspan><tspan x="46" dy="27">• KMS 加密、秘密集中管理</tspan><tspan x="46" dy="27">• CloudTrail／CloudWatch 告警</tspan><tspan x="46" dy="27">• 備份、還原、效能與容量驗證</tspan><tspan x="46" dy="27">• 跨區複製或重建、隔離演練</tspan></text><text x="195" y="1130" fill="#ffbd70" text-anchor="middle" font-size="13" font-weight="800">客戶仍負責資料、身分、網路、用戶端與復原驗收</text></g></svg>