<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">AWS Organizations 與 Control Tower 多帳號治理流程</title>
<desc id="desc">從治理需求進入 Control Tower Landing Zone，透過 Organizations 組織單位、服務控制政策、身分與集中記錄管理安全、正式、非正式及沙箱帳號，並持續偵測漂移及驗證復原。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102448"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd18a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7ee8ff"/></marker></defs>
<rect width="1400" height="820" rx="32" fill="url(#bg)"/><text x="70" y="72" fill="#fff" font-family="system-ui,sans-serif" font-size="34" font-weight="800">多帳號治理不是一張儀表板，而是一條可驗證的控制鏈</text><text x="70" y="110" fill="#a9bddb" font-family="system-ui,sans-serif" font-size="19">示意：帳號與政策邊界、集中證據、漂移處理及跨區復原需要一起設計</text>
<g filter="url(#shadow)"><rect x="70" y="165" width="260" height="130" rx="22" fill="#132c4d" stroke="#7ee8ff"/><text x="200" y="207" text-anchor="middle" fill="#7ee8ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">治理需求</text><text x="200" y="244" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">資料・法規・環境</text><text x="200" y="274" text-anchor="middle" fill="#b9c9e2" font-family="system-ui,sans-serif" font-size="17">責任・區域・復原目標</text>
<rect x="400" y="145" width="600" height="170" rx="26" fill="#182f50" stroke="#ffb34d" stroke-width="2"/><text x="700" y="190" text-anchor="middle" fill="#ffb34d" font-family="system-ui,sans-serif" font-size="19" font-weight="700">AWS CONTROL TOWER LANDING ZONE</text><text x="700" y="230" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="26" font-weight="800">帳號供應・治理控制・集中基線</text><g font-family="system-ui,sans-serif" font-size="17" fill="#dce8f8"><text x="465" y="276">Organizations / OU / SCP</text><text x="700" y="276" text-anchor="middle">Identity Center / MFA</text><text x="935" y="276" text-anchor="end">CloudTrail / Config / Security</text></g>
<rect x="1070" y="165" width="260" height="130" rx="22" fill="#132c4d" stroke="#c995ff"/><text x="1200" y="207" text-anchor="middle" fill="#d4b1ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">治理規則</text><text x="1200" y="244" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="800">政策・控制・例外</text><text x="1200" y="274" text-anchor="middle" fill="#b9c9e2" font-family="system-ui,sans-serif" font-size="17">版本化・核准・到期日</text></g>
<path d="M330 230h60" stroke="#7ee8ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M1000 230h60" stroke="#7ee8ff" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M700 315v70" stroke="#7ee8ff" stroke-width="4" marker-end="url(#arrow)"/>
<text x="700" y="355" text-anchor="middle" fill="#94a9c9" font-family="system-ui,sans-serif" font-size="16">一致基線，分離爆炸半徑</text>
<g filter="url(#shadow)" font-family="system-ui,sans-serif"><rect x="65" y="400" width="285" height="175" rx="22" fill="#102a42" stroke="#62d6b4"/><text x="207" y="443" text-anchor="middle" fill="#78ecc8" font-size="18" font-weight="700">SECURITY / LOG</text><text x="207" y="482" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">安全與證據帳號</text><text x="207" y="520" text-anchor="middle" fill="#bdcde2" font-size="16">委派管理・集中日誌</text><text x="207" y="548" text-anchor="middle" fill="#bdcde2" font-size="16">保留控制・調查權限</text>
<rect x="395" y="400" width="285" height="175" rx="22" fill="#102a42" stroke="#ffb34d"/><text x="537" y="443" text-anchor="middle" fill="#ffbf66" font-size="18" font-weight="700">PRODUCTION</text><text x="537" y="482" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">正式工作負載</text><text x="537" y="520" text-anchor="middle" fill="#bdcde2" font-size="16">最小權限・私有網路</text><text x="537" y="548" text-anchor="middle" fill="#bdcde2" font-size="16">多可用區・備份復原</text>
<rect x="725" y="400" width="285" height="175" rx="22" fill="#102a42" stroke="#7ee8ff"/><text x="867" y="443" text-anchor="middle" fill="#7ee8ff" font-size="18" font-weight="700">NON-PRODUCTION</text><text x="867" y="482" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">開發與測試</text><text x="867" y="520" text-anchor="middle" fill="#bdcde2" font-size="16">隔離資料・成本限制</text><text x="867" y="548" text-anchor="middle" fill="#bdcde2" font-size="16">部署驗證・期限管理</text>
<rect x="1055" y="400" width="285" height="175" rx="22" fill="#102a42" stroke="#c995ff"/><text x="1197" y="443" text-anchor="middle" fill="#d4b1ff" font-size="18" font-weight="700">SANDBOX</text><text x="1197" y="482" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">受限實驗環境</text><text x="1197" y="520" text-anchor="middle" fill="#bdcde2" font-size="16">允許服務・預算告警</text><text x="1197" y="548" text-anchor="middle" fill="#bdcde2" font-size="16">自動清理・禁止正式資料</text></g>
<path d="M207 575v70h990v-70" fill="none" stroke="#7ee8ff" stroke-width="3"/><path d="M537 575v70M867 575v70" stroke="#7ee8ff" stroke-width="3"/>
<g filter="url(#shadow)"><rect x="220" y="650" width="960" height="105" rx="24" fill="#162b49" stroke="url(#accent)" stroke-width="2"/><text x="700" y="691" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="23" font-weight="800">持續驗證：漂移 → 影響判讀 → 核准修復 → 證據保存 → 復原演練</text><text x="700" y="727" text-anchor="middle" fill="#b9c9e2" font-family="system-ui,sans-serif" font-size="17">控制通過不等於應用安全；每個帳號仍須落實身分、網路、資料、監控與備份責任</text></g>
</svg>
