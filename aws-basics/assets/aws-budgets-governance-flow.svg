<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">AWS Budgets 預算治理流程示意圖</title>
<desc id="desc">帳務與用量資料經預算範圍及實際或預測門檻判斷，通知責任人並經核准執行受限動作，最後以稽核、可用性及成本資料驗證。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102746"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#7fe4ff"/></marker></defs>
<rect width="1400" height="820" rx="32" fill="url(#bg)"/><circle cx="1220" cy="90" r="190" fill="#ff9900" opacity=".07"/><circle cx="150" cy="760" r="220" fill="#52d7ff" opacity=".06"/>
<text x="70" y="78" fill="#fff" font-family="Inter,Noto Sans TC,sans-serif" font-size="38" font-weight="800">AWS Budgets：從門檻事件到受控回應</text><text x="70" y="118" fill="#a9bdd8" font-family="Inter,Noto Sans TC,sans-serif" font-size="20">示意流程｜資料有更新時差，動作需限縮範圍、可核准、可回復、可驗證</text>
<g filter="url(#shadow)" font-family="Inter,Noto Sans TC,sans-serif">
<rect x="65" y="190" width="250" height="180" rx="24" fill="#122b49" stroke="#2e577a"/><text x="95" y="232" fill="#ffbd70" font-size="17" font-weight="800">01｜資料與責任範圍</text><text x="95" y="276" fill="#fff" font-size="25" font-weight="800">成本與用量資料</text><text x="95" y="316" fill="#c6d4eb" font-size="17">帳號 · 服務 · 區域</text><text x="95" y="346" fill="#c6d4eb" font-size="17">標籤 · Cost Categories</text>
<rect x="375" y="190" width="250" height="180" rx="24" fill="#122b49" stroke="#2e577a"/><text x="405" y="232" fill="#ffbd70" font-size="17" font-weight="800">02｜AWS Budgets</text><text x="405" y="276" fill="#fff" font-size="25" font-weight="800">實際／預測門檻</text><text x="405" y="316" fill="#c6d4eb" font-size="17">成本 · 用量 · RI · SP</text><text x="405" y="346" fill="#c6d4eb" font-size="17">分級門檻與資料緩衝</text>
<rect x="685" y="190" width="250" height="180" rx="24" fill="#122b49" stroke="#2e577a"/><text x="715" y="232" fill="#ffbd70" font-size="17" font-weight="800">03｜責任分派</text><text x="715" y="276" fill="#fff" font-size="25" font-weight="800">通知與工單</text><text x="715" y="316" fill="#c6d4eb" font-size="17">電子郵件 · SNS</text><text x="715" y="346" fill="#c6d4eb" font-size="17">原因 · 擁有者 · 期限</text>
<rect x="995" y="190" width="340" height="180" rx="24" fill="#18314b" stroke="#ff9900" stroke-width="2"/><text x="1025" y="232" fill="#ffbd70" font-size="17" font-weight="800">04｜核准與受限動作</text><text x="1025" y="276" fill="#fff" font-size="25" font-weight="800">先核准，再執行</text><text x="1025" y="316" fill="#c6d4eb" font-size="17">IAM 政策 · SCP · EC2／RDS</text><text x="1025" y="346" fill="#c6d4eb" font-size="17">排除正式、安全、備份與復原資源</text>
<path d="M315 280H365" stroke="#7fe4ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M625 280H675" stroke="#7fe4ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M935 280H985" stroke="#7fe4ff" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="160" y="475" width="1080" height="225" rx="28" fill="#0d2139" stroke="#2e577a"/><text x="205" y="526" fill="#fff" font-size="27" font-weight="800">05｜驗證與治理閉環</text>
<rect x="205" y="560" width="270" height="95" rx="18" fill="#142f4d"/><text x="230" y="596" fill="#ffbd70" font-size="18" font-weight="800">稽核證據</text><text x="230" y="627" fill="#c6d4eb" font-size="17">CloudTrail · 工單 · 核准紀錄</text>
<rect x="565" y="560" width="270" height="95" rx="18" fill="#142f4d"/><text x="590" y="596" fill="#ffbd70" font-size="18" font-weight="800">服務健康</text><text x="590" y="627" fill="#c6d4eb" font-size="17">CloudWatch · 容量 · 可用性</text>
<rect x="925" y="560" width="270" height="95" rx="18" fill="#142f4d"/><text x="950" y="596" fill="#ffbd70" font-size="18" font-weight="800">成本結果</text><text x="950" y="627" fill="#c6d4eb" font-size="17">等待更新 · 比對預算與帳單</text>
<path d="M1165 370V445H700V465" fill="none" stroke="#7fe4ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M160 590H105C75 590 70 560 70 530V400" fill="none" stroke="#7fe4ff" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
</g>
<rect x="420" y="744" width="560" height="42" rx="21" fill="url(#accent)"/><text x="700" y="772" text-anchor="middle" fill="#261300" font-family="Inter,Noto Sans TC,sans-serif" font-size="18" font-weight="900">預算通知不是即時斷路器；治理重點是責任、核准、回復與驗證</text>
</svg>
