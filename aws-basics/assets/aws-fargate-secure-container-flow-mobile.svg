<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc">
<title id="title">AWS Fargate 私有容器服務與安全治理流程手機版</title>
<desc id="desc">垂直呈現使用者經受控入口進入跨可用區 Fargate tasks，再存取機密與受管資料服務，並由可信映像、監控稽核及跨區重建保護。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a18"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fe8ff"/></marker><style>.h{font:700 25px Inter,'Noto Sans TC',sans-serif;fill:#fff}.t{font:700 20px Inter,'Noto Sans TC',sans-serif;fill:#fff}.s{font:400 16px Inter,'Noto Sans TC',sans-serif;fill:#bdd0ea}.box{fill:#10233e;stroke:#375a7d;stroke-width:2}.line{fill:none;stroke:#8fe8ff;stroke-width:4;marker-end:url(#arrow)}</style></defs>
<rect width="720" height="1320" rx="28" fill="url(#bg)"/><text x="360" y="48" text-anchor="middle" class="h">示意｜Fargate 私有容器安全流程</text><text x="360" y="78" text-anchor="middle" class="s">主機受管，映像、權限、網路與資料仍需治理</text>
<rect x="150" y="115" width="420" height="100" rx="22" class="box"/><text x="360" y="156" text-anchor="middle" class="t">使用者／API</text><text x="360" y="186" text-anchor="middle" class="s">HTTPS request</text>
<path d="M360 215V255" class="line"/><rect x="110" y="260" width="500" height="130" rx="22" class="box"/><text x="360" y="302" text-anchor="middle" class="t">受控入口</text><text x="360" y="337" text-anchor="middle" class="s">CloudFront → AWS WAF → ALB + TLS</text><text x="360" y="367" text-anchor="middle" class="s">認證・限流・健康檢查</text>
<path d="M360 390V430" class="line"/><rect x="70" y="435" width="580" height="330" rx="28" fill="#0c1c32" stroke="#ff9f32" stroke-width="3"/><text x="360" y="476" text-anchor="middle" class="t">VPC 私有子網｜ECS on Fargate</text><rect x="105" y="515" width="235" height="135" rx="20" class="box"/><text x="222" y="552" text-anchor="middle" class="s">可用區 A</text><rect x="135" y="570" width="175" height="58" rx="16" fill="url(#orange)"/><text x="222" y="606" text-anchor="middle" class="t" fill="#071426">Fargate Task</text><rect x="380" y="515" width="235" height="135" rx="20" class="box"/><text x="497" y="552" text-anchor="middle" class="s">可用區 B</text><rect x="410" y="570" width="175" height="58" rx="16" fill="url(#orange)"/><text x="497" y="606" text-anchor="middle" class="t" fill="#071426">Fargate Task</text><rect x="130" y="680" width="460" height="58" rx="18" fill="#183653"/><text x="360" y="716" text-anchor="middle" class="s">Security Group・Task Role・短期憑證</text>
<path d="M360 765V805" class="line"/><rect x="70" y="810" width="580" height="150" rx="22" class="box"/><text x="360" y="850" text-anchor="middle" class="t">受管資料與機密</text><text x="360" y="886" text-anchor="middle" class="s">Secrets Manager／Parameter Store + KMS</text><text x="360" y="919" text-anchor="middle" class="s">RDS・DynamoDB・S3・EFS</text><text x="360" y="946" text-anchor="middle" class="s">狀態外部化・備份・PITR</text>
<rect x="55" y="1000" width="290" height="180" rx="22" class="box"/><text x="200" y="1040" text-anchor="middle" class="t">可信映像</text><text x="200" y="1075" text-anchor="middle" class="s">CI checks → ECR</text><text x="200" y="1107" text-anchor="middle" class="s">掃描・SBOM・核准</text><text x="200" y="1139" text-anchor="middle" class="s">digest 部署</text><rect x="375" y="1000" width="290" height="180" rx="22" class="box"/><text x="520" y="1040" text-anchor="middle" class="t">監控與復原</text><text x="520" y="1075" text-anchor="middle" class="s">CloudWatch・CloudTrail</text><text x="520" y="1107" text-anchor="middle" class="s">Runtime Monitoring</text><text x="520" y="1139" text-anchor="middle" class="s">IaC 跨區重建</text>
<path d="M200 1000C200 965 260 950 300 945" class="line"/><path d="M520 1000C520 965 460 950 420 945" class="line"/>
<rect x="90" y="1220" width="540" height="54" rx="18" fill="#183653"/><text x="360" y="1253" text-anchor="middle" class="s">多副本・跨可用區・Auto Scaling・回滾演練</text><text x="360" y="1300" text-anchor="middle" class="s">原創流程圖｜Dr. William｜2026-10-11</text>
</svg>
