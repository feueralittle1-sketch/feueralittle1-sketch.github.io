<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS Batch 安全批次處理流程示意圖</title>
  <desc id="desc">資料進入受控儲存後，由事件或排程提交 AWS Batch，經工作佇列、排程器與運算環境執行容器工作，再輸出結果、監控告警與復原。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102849"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#74dcff"/></marker>
    <style>.h{font:700 30px system-ui,sans-serif;fill:#fff}.t{font:700 21px system-ui,sans-serif;fill:#fff}.s{font:16px system-ui,sans-serif;fill:#bdd0e8}.n{font:700 16px system-ui,sans-serif;fill:#071426}.box{fill:#10243e;stroke:#315071;stroke-width:2}.line{fill:none;stroke:#74dcff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="72" y="75" class="h">示意｜AWS Batch 安全批次處理閉環</text>
  <text x="72" y="112" class="s">佇列與自動擴縮只處理排程；資料、映像、權限、網路、重試、輸出驗證與復原仍需治理。</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="240" height="150" rx="24" class="box"/><text x="95" y="220" class="t">1. 受控輸入</text><text x="95" y="258" class="s">S3 / EFS / 資料庫</text><text x="95" y="286" class="s">KMS、版本、完整性</text>
    <rect x="370" y="175" width="240" height="150" rx="24" class="box"/><text x="395" y="220" class="t">2. 提交工作</text><text x="395" y="258" class="s">EventBridge / API</text><text x="395" y="286" class="s">短期憑證、參數驗證</text>
    <rect x="670" y="175" width="240" height="150" rx="24" class="box"/><text x="695" y="220" class="t">3. 工作佇列</text><text x="695" y="258" class="s">優先序 / 公平分享</text><text x="695" y="286" class="s">依賴、陣列、重試上限</text>
    <rect x="970" y="175" width="400" height="150" rx="24" class="box"/><text x="995" y="220" class="t">4. 運算環境</text><text x="995" y="258" class="s">Fargate｜隔離與少維運</text><text x="995" y="286" class="s">EC2 / Spot｜GPU、彈性與成本控制</text>
  </g>
  <path d="M310 250H360" class="line"/><path d="M610 250H660" class="line"/><path d="M910 250H960" class="line"/>
  <rect x="70" y="390" width="1300" height="235" rx="30" fill="#0b1c32" stroke="#315071" stroke-width="2"/>
  <text x="105" y="435" class="t">容器工作執行區</text>
  <g>
    <rect x="110" y="470" width="250" height="105" rx="20" fill="#17385e"/><text x="135" y="510" class="t">ECR 映像</text><text x="135" y="543" class="s">digest、掃描、SBOM</text>
    <rect x="420" y="470" width="250" height="105" rx="20" fill="#17385e"/><text x="445" y="510" class="t">Job role</text><text x="445" y="543" class="s">最小權限、無長期金鑰</text>
    <rect x="730" y="470" width="250" height="105" rx="20" fill="#17385e"/><text x="755" y="510" class="t">私有網路</text><text x="755" y="543" class="s">SG、端點、受控 egress</text>
    <rect x="1040" y="470" width="250" height="105" rx="20" fill="#17385e"/><text x="1065" y="510" class="t">工作邏輯</text><text x="1065" y="543" class="s">冪等、checkpoint、逾時</text>
  </g>
  <path d="M1170 325V378" class="line"/>
  <g filter="url(#shadow)">
    <rect x="70" y="690" width="280" height="140" rx="24" class="box"/><text x="95" y="735" class="t">5. 輸出驗證</text><text x="95" y="773" class="s">完整性、筆數、錯誤隔離</text><text x="95" y="801" class="s">加密保存與保留期限</text>
    <rect x="430" y="690" width="280" height="140" rx="24" class="box"/><text x="455" y="735" class="t">6. 監控稽核</text><text x="455" y="773" class="s">CloudWatch / CloudTrail</text><text x="455" y="801" class="s">RUNNABLE、失敗、成本告警</text>
    <rect x="790" y="690" width="280" height="140" rx="24" class="box"/><text x="815" y="735" class="t">7. 復原與重跑</text><text x="815" y="773" class="s">DLQ、有限重試、checkpoint</text><text x="815" y="801" class="s">跨區 IaC 與資料副本</text>
    <rect x="1150" y="690" width="220" height="140" rx="24" fill="url(#accent)"/><text x="1175" y="735" class="n">可驗證結果</text><text x="1175" y="773" class="n">品質 + 證據</text><text x="1175" y="801" class="n">成本 + 可復原</text>
  </g>
  <path d="M350 760H420" class="line"/><path d="M710 760H780" class="line"/><path d="M1070 760H1140" class="line"/>
</svg>
