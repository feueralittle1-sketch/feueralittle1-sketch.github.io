<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Detective 雲端事件調查流程</title>
  <desc id="desc">GuardDuty 與 Security Hub findings、CloudTrail、VPC Flow Logs 及 EKS 稽核紀錄進入 Amazon Detective 行為圖譜，經調查範圍界定、關聯分析、原始證據驗證、隔離處置與復原確認。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#102848"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d8ff"/><stop offset="1" stop-color="#8fffe1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78ddff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f7fbff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#afc4df}.h{font-size:30px;font-weight:800}.s{font-size:18px}.k{font-size:15px;font-weight:700;letter-spacing:.08em}.box{fill:#10233d;stroke:#ffffff22;stroke-width:2}.line{fill:none;stroke:#78ddff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="130" cy="90" r="180" fill="#ff9900" opacity=".08"/><circle cx="1320" cy="810" r="260" fill="#55d8ff" opacity=".07"/>
  <text x="74" y="86" class="t h">Amazon Detective 雲端事件調查</text>
  <text x="74" y="120" class="m s">示意：安全發現與活動資料 → 行為圖譜 → 證據驗證 → 處置與復原</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="184" width="280" height="432" rx="28"/>
    <text x="100" y="228" class="t k">01 調查輸入</text>
    <g transform="translate(100 260)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">GuardDuty findings</text></g>
    <g transform="translate(100 338)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">Security Hub CSPM</text></g>
    <g transform="translate(100 416)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">CloudTrail / VPC Flow</text></g>
    <g transform="translate(100 494)"><rect width="220" height="62" rx="16" fill="#172f50"/><text x="20" y="38" class="t s">EKS audit logs</text></g>
    <text x="100" y="590" class="m s">帳號 · 區域 · 時間範圍</text>
  </g>
  <path class="line" d="M350 400H420"/>
  <g filter="url(#shadow)">
    <rect x="420" y="184" width="310" height="432" rx="28" fill="#122b49" stroke="#ffb657" stroke-width="2"/>
    <rect x="454" y="222" width="242" height="8" rx="4" fill="url(#orange)"/>
    <text x="454" y="278" class="t h">Amazon Detective</text>
    <text x="454" y="316" class="m s">行為圖譜與關聯分析</text>
    <g transform="translate(454 358)"><circle cx="15" cy="15" r="15" fill="#ff9900"/><text x="44" y="21" class="t s">實體與關係</text></g>
    <g transform="translate(454 410)"><circle cx="15" cy="15" r="15" fill="#ffb657"/><text x="44" y="21" class="t s">Profile 與時間軸</text></g>
    <g transform="translate(454 462)"><circle cx="15" cy="15" r="15" fill="#ffd38a"/><text x="44" y="21" class="t s">Finding group</text></g>
    <g transform="translate(454 514)"><circle cx="15" cy="15" r="15" fill="#8fe8ff"/><text x="44" y="21" class="t s">異常活動線索</text></g>
    <text x="454" y="584" class="m s">關聯是線索，不是事件結論</text>
  </g>
  <path class="line" d="M730 400H800"/>
  <g filter="url(#shadow)">
    <rect class="box" x="800" y="184" width="270" height="432" rx="28"/>
    <text x="830" y="228" class="t k">03 原始證據驗證</text>
    <g transform="translate(830 265)"><rect width="210" height="78" rx="18" fill="#162f50"/><text x="18" y="32" class="t s">CloudTrail / SIEM</text><text x="18" y="58" class="m s">確認 API 與身分</text></g>
    <g transform="translate(830 360)"><rect width="210" height="78" rx="18" fill="#162f50"/><text x="18" y="32" class="t s">S3 證據封存</text><text x="18" y="58" class="m s">保留與完整性控制</text></g>
    <g transform="translate(830 455)"><rect width="210" height="78" rx="18" fill="#162f50"/><text x="18" y="32" class="t s">工單與變更紀錄</text><text x="18" y="58" class="m s">建立可追溯結論</text></g>
    <text x="830" y="580" class="m s">最小揭露 · 職責分離</text>
  </g>
  <path class="line" d="M1070 400H1140"/>
  <g filter="url(#shadow)">
    <rect class="box" x="1140" y="184" width="230" height="432" rx="28"/>
    <text x="1170" y="228" class="t k">04 處置與復原</text>
    <g transform="translate(1170 270)"><rect width="170" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">撤銷工作階段</text></g>
    <g transform="translate(1170 352)"><rect width="170" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">隔離與縮權</text></g>
    <g transform="translate(1170 434)"><rect width="170" height="64" rx="16" fill="#153954"/><text x="18" y="39" class="t s">修復與監控</text></g>
    <g transform="translate(1170 516)"><rect width="170" height="64" rx="16" fill="url(#cyan)"/><text x="18" y="39" style="font-family:Inter,'Noto Sans TC',sans-serif;fill:#072034;font-size:18px;font-weight:800">復原驗證</text></g>
  </g>
  <path d="M1255 616V728H575V624" fill="none" stroke="#62e5c6" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <g transform="translate(190 704)"><rect width="1060" height="116" rx="24" fill="#0d1f35" stroke="#ffffff22" stroke-width="2"/><text x="36" y="42" class="t k">持續控制面</text><text x="36" y="78" class="m s">IAM 最小權限與 MFA／短期憑證　·　區域與成員完整性　·　KMS 與機密管理　·　CloudTrail／CloudWatch</text><text x="36" y="103" class="m s">公開存取阻擋　·　原始日誌保留　·　備份與跨區復原　·　finding、身分、網路與服務健康共同驗證</text></g>
</svg>
