<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1540" viewBox="0 0 700 1540" role="img" aria-labelledby="title desc">
<title id="title">Amazon ECR 安全容器映像供應鏈手機版示意流程</title><desc id="desc">可信來源經隔離建置、安全門檻與核准後，以不可變摘要推送至私有 Amazon ECR，再由私有工作負載拉取並複寫到復原區域，搭配最小權限、KMS、CloudTrail 與 CloudWatch。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10284a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#8fe8ff"/></marker><style>.h{font:700 27px system-ui,sans-serif;fill:#fff}.t{font:700 23px system-ui,sans-serif;fill:#fff}.s{font:18px system-ui,sans-serif;fill:#c6d4eb}.b{fill:#10243e;stroke:#4b719c;stroke-width:2}.g{fill:#12382f;stroke:#61ddb2;stroke-width:2}.w{fill:#3b2920;stroke:#ffb45f;stroke-width:2}.l{stroke:#8fe8ff;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="700" height="1540" rx="26" fill="url(#bg)"/><text class="h" x="350" y="52" text-anchor="middle">示意｜Amazon ECR 可信映像通道</text>
<g><rect class="b" x="90" y="90" width="520" height="135" rx="22"/><text class="t" x="350" y="137" text-anchor="middle">1　可信來源</text><text class="s" x="350" y="176" text-anchor="middle">受保護分支・固定基底摘要</text><line class="l" x1="350" y1="225" x2="350" y2="270"/>
<rect class="b" x="90" y="285" width="520" height="135" rx="22"/><text class="t" x="350" y="332" text-anchor="middle">2　隔離建置</text><text class="s" x="350" y="371" text-anchor="middle">短期角色・機密不進映像層</text><line class="l" x1="350" y1="420" x2="350" y2="465"/>
<rect class="w" x="90" y="480" width="520" height="170" rx="22"/><text class="t" x="350" y="527" text-anchor="middle">3　安全門檻</text><text class="s" x="350" y="566" text-anchor="middle">測試・SBOM・機密與弱點掃描</text><text class="s" x="350" y="601" text-anchor="middle">簽章・獨立核准・不符合即停止</text><line class="l" x1="350" y1="650" x2="350" y2="695"/>
<rect class="g" x="90" y="710" width="520" height="190" rx="22"/><text class="t" x="350" y="757" text-anchor="middle">4　私有 Amazon ECR</text><text class="s" x="350" y="796" text-anchor="middle">標籤不可變・固定映像摘要</text><text class="s" x="350" y="831" text-anchor="middle">最小權限・KMS・持續掃描</text><text class="s" x="350" y="866" text-anchor="middle">生命週期・CloudTrail 留證</text><line class="l" x1="350" y1="900" x2="350" y2="945"/>
<rect class="g" x="90" y="960" width="520" height="150" rx="22"/><text class="t" x="350" y="1007" text-anchor="middle">5　私有工作負載</text><text class="s" x="350" y="1046" text-anchor="middle">ECS／EKS／Lambda</text><text class="s" x="350" y="1080" text-anchor="middle">執行角色・VPC 端點・摘要拉取</text></g>
<path class="l" d="M350 1110v45"/><rect class="b" x="55" y="1170" width="280" height="145" rx="20"/><text class="t" x="195" y="1217" text-anchor="middle">持續觀測</text><text class="s" x="195" y="1255" text-anchor="middle">新弱點觸發</text><text class="s" x="195" y="1286" text-anchor="middle">重建與重新部署</text><rect class="b" x="365" y="1170" width="280" height="145" rx="20"/><text class="t" x="505" y="1217" text-anchor="middle">復原副本</text><text class="s" x="505" y="1255" text-anchor="middle">跨區／跨帳號</text><text class="s" x="505" y="1286" text-anchor="middle">摘要核對與演練</text>
<rect x="45" y="1360" width="610" height="130" rx="20" fill="#0b1c33" stroke="#6a8db4" stroke-width="2"/><text class="t" x="350" y="1400" text-anchor="middle">橫跨控制</text><text class="s" x="350" y="1438" text-anchor="middle">MFA・最小權限・私有網路・KMS</text><text class="s" x="350" y="1472" text-anchor="middle">機密管理・稽核告警・跨區復原</text>
</svg>
