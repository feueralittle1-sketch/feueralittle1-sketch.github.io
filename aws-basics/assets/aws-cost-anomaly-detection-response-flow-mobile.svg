<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" role="img" aria-labelledby="title desc">
<title id="title">AWS Cost Anomaly Detection 手機版事件回應流程</title>
<desc id="desc">從帳務資料、成本監視器、異常告警、責任分派、證據調查、受控修正到驗證改善的垂直流程。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b4a"/></linearGradient><linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#76e4f7"/></marker></defs>
<rect width="760" height="1500" rx="32" fill="url(#bg)"/><circle cx="680" cy="90" r="180" fill="#ff9900" opacity=".08"/>
<text x="48" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">示意｜異常支出回應</text><text x="48" y="106" fill="#9fc2df" font-family="Arial, sans-serif" font-size="18">告警是起點，不是自動刪除指令</text>
<g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="48" y="150" width="664" height="145" rx="22" fill="#10243d" stroke="#436a8d"/><text x="80" y="195" fill="#ffbd70" font-size="23" font-weight="700">1｜成本資料</text><text x="80" y="235" fill="#fff" font-size="19">帳號・服務・區域・用量類型・時間模式</text><text x="80" y="266" fill="#c6d9eb" font-size="17">已處理的帳務資料，不是秒級遙測</text></g>
<path d="M380 295V330" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="48" y="340" width="664" height="155" rx="22" fill="#10243d" stroke="#ff9900" stroke-width="2"/><text x="80" y="385" fill="#ffbd70" font-size="23" font-weight="700">2｜成本監視器＋異常模型</text><text x="80" y="425" fill="#fff" font-size="19">定義服務、連結帳號、標籤或成本類別</text><text x="80" y="458" fill="#c6d9eb" font-size="17">比較預期與實際支出，排序可能根因</text></g>
<path d="M380 495V530" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="48" y="540" width="664" height="155" rx="22" fill="#10243d" stroke="#436a8d"/><text x="80" y="585" fill="#ffbd70" font-size="23" font-weight="700">3｜門檻與事件分流</text><text x="80" y="625" fill="#fff" font-size="19">金額＋影響百分比｜Email・SNS</text><text x="80" y="658" fill="#c6d9eb" font-size="17">一般摘要、高影響即時通知、責任人接手</text></g>
<path d="M380 695V730" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="48" y="740" width="664" height="190" rx="22" fill="#0d2038" stroke="#5ba9c5"/><text x="80" y="785" fill="#80e6f5" font-size="23" font-weight="700">4｜證據調查</text><text x="80" y="825" fill="#fff" font-size="19">Cost Explorer：成本曲線與維度</text><text x="80" y="858" fill="#fff" font-size="19">CloudTrail：變更者與 API</text><text x="80" y="891" fill="#fff" font-size="19">CloudWatch：流量、錯誤率與可用性</text></g>
<path d="M380 930V965" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="48" y="975" width="664" height="175" rx="22" fill="#0d2038" stroke="#ff9900" stroke-width="2"/><text x="80" y="1020" fill="#ffbd70" font-size="23" font-weight="700">5｜受控修正</text><text x="80" y="1060" fill="#fff" font-size="19">擁有者確認 → 核准 → 停止／縮容／修正</text><text x="80" y="1093" fill="#c6d9eb" font-size="17">正式環境排除、備份、停止條件與回復程序</text><text x="80" y="1123" fill="#c6d9eb" font-size="17">疑似惡意行為則升級資安事件</text></g>
<path d="M380 1150V1185" stroke="#76e4f7" stroke-width="5" marker-end="url(#arrow)"/>
<g font-family="Arial, sans-serif" filter="url(#shadow)"><rect x="48" y="1195" width="664" height="175" rx="22" fill="#0d2038" stroke="#5ba9c5"/><text x="80" y="1240" fill="#80e6f5" font-size="23" font-weight="700">6｜驗證與改善</text><text x="80" y="1280" fill="#fff" font-size="19">成本回落・服務可用・資料完整</text><text x="80" y="1313" fill="#c6d9eb" font-size="17">調整門檻、標籤、預算、手冊與責任分派</text><text x="80" y="1343" fill="#c6d9eb" font-size="17">保存證據並回饋異常準確度</text></g>
<rect x="70" y="1410" width="620" height="58" rx="29" fill="url(#hot)"/><text x="380" y="1447" text-anchor="middle" fill="#18212d" font-family="Arial, sans-serif" font-size="20" font-weight="700">偵測 → 調查 → 核准 → 修正 → 驗證</text>
</svg>
