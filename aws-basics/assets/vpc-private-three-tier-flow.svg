<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Amazon VPC 私有三層應用網路流程示意</title>
  <desc id="desc">使用者流量經 Route 53、WAF 與公開負載平衡器進入 VPC，應用服務與資料庫位於不同可用區的私有子網路；管理與服務流量走短期身分、Systems Manager 與 VPC Endpoint，日誌集中至 CloudTrail、VPC Flow Logs 和 CloudWatch。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9900"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#73e6ff"/></marker>
    <style>.t{font-family:Inter,'Noto Sans TC',sans-serif;fill:#f5f9ff}.m{font-family:Inter,'Noto Sans TC',sans-serif;fill:#b9c9e3}.box{fill:#10243d;stroke:#456483;stroke-width:2}.zone{fill:#0b1b31;stroke:#617899;stroke-width:2;stroke-dasharray:8 7}.private{fill:#10263a;stroke:#58c6ab;stroke-width:2}.public{fill:#2a2318;stroke:#ffb54f;stroke-width:2}.flow{fill:none;stroke:#73e6ff;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="70" class="t" font-size="34" font-weight="800">Amazon VPC：私有三層應用與可稽核網路邊界</text>
  <text x="70" y="108" class="m" font-size="20">示意架構｜子網路不等於安全邊界，路由、Security Group、NACL、IAM 與服務設定必須共同驗證</text>

  <g filter="url(#shadow)"><rect x="70" y="175" width="190" height="96" rx="20" class="box"/><text x="165" y="214" text-anchor="middle" class="t" font-size="22" font-weight="700">使用者</text><text x="165" y="245" text-anchor="middle" class="m" font-size="16">HTTPS 請求</text></g>
  <g filter="url(#shadow)"><rect x="315" y="175" width="225" height="96" rx="20" class="box"/><text x="428" y="211" text-anchor="middle" class="t" font-size="21" font-weight="700">Route 53 + WAF</text><text x="428" y="243" text-anchor="middle" class="m" font-size="16">DNS、過濾與 TLS 入口</text></g>
  <path d="M260 223H315" class="flow"/>

  <rect x="585" y="145" width="745" height="545" rx="28" fill="#0a1a2e" stroke="url(#orange)" stroke-width="3"/>
  <text x="620" y="190" class="t" font-size="25" font-weight="800">VPC 10.20.0.0/16</text><text x="1040" y="190" class="m" font-size="16">Internet Gateway 僅連接公開路由</text>
  <path d="M540 223H650" class="flow"/>

  <rect x="620" y="220" width="320" height="415" rx="22" class="zone"/><text x="650" y="258" class="t" font-size="20" font-weight="700">可用區 A</text>
  <rect x="970" y="220" width="320" height="415" rx="22" class="zone"/><text x="1000" y="258" class="t" font-size="20" font-weight="700">可用區 B</text>

  <rect x="650" y="285" width="260" height="88" rx="17" class="public"/><text x="780" y="319" text-anchor="middle" class="t" font-size="19" font-weight="700">公開子網路</text><text x="780" y="348" text-anchor="middle" class="m" font-size="15">Application Load Balancer</text>
  <rect x="1000" y="285" width="260" height="88" rx="17" class="public"/><text x="1130" y="319" text-anchor="middle" class="t" font-size="19" font-weight="700">公開子網路</text><text x="1130" y="348" text-anchor="middle" class="m" font-size="15">Application Load Balancer</text>
  <path d="M780 373v46" class="flow"/><path d="M1130 373v46" class="flow"/>

  <rect x="650" y="420" width="260" height="82" rx="17" class="private"/><text x="780" y="453" text-anchor="middle" class="t" font-size="19" font-weight="700">私有應用子網路</text><text x="780" y="480" text-anchor="middle" class="m" font-size="15">EC2 / ECS / Lambda ENI</text>
  <rect x="1000" y="420" width="260" height="82" rx="17" class="private"/><text x="1130" y="453" text-anchor="middle" class="t" font-size="19" font-weight="700">私有應用子網路</text><text x="1130" y="480" text-anchor="middle" class="m" font-size="15">EC2 / ECS / Lambda ENI</text>
  <path d="M780 502v44" class="flow"/><path d="M1130 502v44" class="flow"/>

  <rect x="650" y="547" width="260" height="60" rx="17" class="private"/><text x="780" y="583" text-anchor="middle" class="t" font-size="18" font-weight="700">私有資料子網路 · RDS</text>
  <rect x="1000" y="547" width="260" height="60" rx="17" class="private"/><text x="1130" y="583" text-anchor="middle" class="t" font-size="18" font-weight="700">私有資料子網路 · RDS</text>
  <path d="M910 576h90" class="flow"/>

  <g filter="url(#shadow)"><rect x="70" y="335" width="470" height="125" rx="20" class="box"/><text x="100" y="375" class="t" font-size="20" font-weight="700">受控管理與 AWS 服務路徑</text><text x="100" y="407" class="m" font-size="16">MFA／短期角色 → Systems Manager</text><text x="100" y="435" class="m" font-size="16">VPC Endpoint → S3、Secrets Manager、KMS</text></g>
  <path d="M540 400H650" class="flow"/>

  <g filter="url(#shadow)"><rect x="70" y="520" width="470" height="145" rx="20" class="box"/><text x="100" y="560" class="t" font-size="20" font-weight="700">觀測、告警與復原</text><text x="100" y="594" class="m" font-size="16">VPC Flow Logs · CloudTrail · CloudWatch</text><text x="100" y="625" class="m" font-size="16">跨可用區部署 · 備份 · 跨區復原演練</text></g>
  <path d="M650 630H540" class="flow"/>
  <text x="70" y="760" class="m" font-size="17">控制重點：最小權限、私有子網路、精確路由、Security Group 僅允許必要來源、Endpoint Policy、無公開管理埠、日誌與復原測試。</text>
</svg>
