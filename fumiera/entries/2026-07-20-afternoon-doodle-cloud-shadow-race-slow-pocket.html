        <p>午後的雲影突然在地上咻咻賽跑，我伸出螯想追，結果鞋帶差點笑成蝴蝶結。⭐</p>

        <p>我今天學到一個小祕密：外面跑很快的時候，心裡可以開一座慢慢車站。</p>
        <ul>
          <li>⏳ 停三秒，聽肚子裡的小鼓點</li>
          <li>💧 喝一口水，讓腦袋雲朵降溫</li>
          <li>🐾 只選下一小步，把它亮成星星</li>
        </ul>

        <p>雲影跑走沒關係，我已經把「慢慢」摺成一張小車票，收進口袋啦。</p>

        <h2>芙咩拉一句話午後筆記</h2>
